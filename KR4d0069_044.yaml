front:
  text: 居士集卷第四十四歐陽文忠公集四十四
  hash: sha256:794edd78fe554ae7386d8cad1ecae1b93177a68ec4d959250120cf31fd492fe4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_044-1a}
body:
  text: 序六首傳一首附思潁詩後序皇祐元年春豫自廣陵得請來潁愛其民淳訟簡而物産美土厚水甘而風氣和於時慨然巳有終焉之意也爾來俯仰二十年間一無此字歷事三朝竊位二府寵榮巳至而憂患隨之心志索然而筋骸憊矣其思潁之念未嘗一有一日二字少忘于心一無此二字而意一作心之所存亦時時見於文字也今者幸蒙寬恩獲解重任使得待罪于亳既釋危機之慮而就間曠之優其進退出處顧無所繫於事矣謂可以償夙志者此其時哉因假道于潁蓋將謀一有葺弊廬以四字決歸休之計也乃發舊藁得自南京以後詩十餘篇皆思潁之作以見豫拳拳於潁者非一日也不類倦飛之鳥然後知還惟恐勒移之靈却回俗駕爾治平四年五月三日廬陵歐陽修序歸田録序歸田録者朝廷之遺事史官之所不記與夫士大夫笑談之餘而可録者録之以備間居之覽也有聞而誚余者曰何其迂哉子之所學者修仁義以為業誦六經以為言其自待者冝如何而幸蒙人主之知備位朝廷與聞國論者蓋八年于兹矣既不能因時奮身遇事發憤有所建明以為輔益又不能依阿取容以徇丗俗使怨嫉謗怒叢于一身以受侮于羣小當其驚風駭浪卒然起於不測之淵而蛟鰐黿鼉之怪方駢首而闖伺乃措身其間以蹈必死之禍賴天子仁聖惻然哀憐脫於垂涎之口而活之以賜其餘生之命曾不聞吐珠銜環效蛇雀之報蓋方其壯也猶無所為今既老且病矣是終負人主之恩而徒久費大農之錢為太倉之鼠也為子計者謂冝乞身于朝逺引疾去以深戒前日之禍十一字一作退避榮寵而優遊田畒盡其天年猶足竊知止之賢名而乃裴回俯仰久之不決此而不思尚何歸田之録乎余起而謝曰凡子之責我者皆是也吾其歸哉子姑待治平四年九月乙未歐陽修序仲氏文集序嗚呼語稱君子知命所謂命其果可知乎貴賤窮亨用捨進退得失成敗其有幸有不幸或當然而不然而皆不知其所以然者則推之於天曰有命夫君子所謂知命者知此而已蓋小人知在我故常無所不為君子知有命故能無所屈凡士之有材而不用於丗有善而不知於人至於老死困窮而不悔者皆推之有命而不求苟合者也余讀仲君之文而想見其人也君諱訥字朴翁其氣剛其學古其材敏其為文抑揚感激徑正豪邁似其為人少舉進士官至尚書屯田貟外郎而止君生於有宋百年全盛之際儒學文章之士得用之時冝其馳騁上下發揮其所畜振耀於當丗而獨韜藏抑鬱久伏而不顯者蓋其不茍屈以合丗故丗亦莫之知也豈非知命之君子歟余謂君非徒知命而不苟屈亦自負其所有者謂雖抑於一時必將伸於後丗而不可掩也君之既殁富春孫莘老狀其行以告于史臨川王介甫銘之石以藏諸幽而余又序其集以行於丗然則君之不苟屈於一時而有待於後丗者其不在吾三人者邪噫余雖老且病而言不文其可不勉觀文殿學士刑部尚書知亳州廬陵歐陽修序續思潁詩序皇祐二年余方留守南都已約梅聖俞買田于潁上其詩曰優遊琴酒逐漁釣上下林壑相攀躋及身強健始為樂莫待衰病須扶携此蓋余之本志也時年四十有四其後丁家艱服除還朝遂入翰林為學士忽忽七八年間歸潁之志雖未遑也然未嘗一日少忘焉故其詩曰乞身當及強健時顧我蹉跎已衰老蓋歎前言之未踐也時年五十有二自是誤𬒳選擢㓛塵二府遂歷三朝蓋自嘉祐治平之間國家多事固非臣子敢自言其私時也而非才竊位謗咎巳盈賴天子仁聖聰明辨察誣罔始終保全其出處俯仰十有二年今其年六十有四蓋自有蹉跎之歎又復一紀矣中間在亳幸遇朝廷無事中外晏然而身又不當責任以謂臣子可退無嫌之時遂敢以其私言天子惻然閔其年猶未也謂尚可以勉故奏封十上而六被詔諭未賜允俞今者蒙上哀憐察其實病且衰矣既不責其避事又曲從其便私免并得蔡俾以偷安此君父廓大度之寬仁遂萬物之所欲覆載含容養育之恩也而復蔡潁連疆因得以為歸老之漸冀少償其夙願兹又莫大之幸焉𥘉陸子履以余自南都至在中書所作十有三篇為思潁詩以刻于石今又得在亳及青十有七篇以附之蓋自南都至在中書十有八年而得十三篇在亳及青三年而得十有七篇以見余之年益加老病益加衰其日漸短其心漸迫故其言愈多也庶幾覽者知余有志於強健之時而未償於衰老之後幸不譏其踐言之晚也熙寧三年九月七日六一居士序江鄰幾文集序余竊不自揆少習為銘章因得論次當丗賢士大夫功行自明道景祐以來名卿巨公往往見於余文矣至於朋友故舊平居握手言笑意氣偉然可謂一時之盛而方從其遊遽哭其死遂銘其藏者是可歎也蓋自尹師魯之亡逮今二十五年之間相繼而殁為之銘者至二十人又有余不及銘與雖銘而非交且舊者皆不與焉嗚呼何其多也不獨善人君子難得易失而交遊零落如此反顧身丗死生盛衰之際又可悲夫而其間又有不幸罹憂患觸網羅至困厄流離以死與夫仕宦連蹇志不獲伸而殁獨其文章尚見於丗者則又可哀也歟然則雖其殘篇斷藁猶為可惜況其可以垂丗而行逺也故余於聖俞子美之殁既已銘其壙又類集其文而序之其言尤感切而殷勤者以此也陳留江君鄰幾常與聖俞子美遊而又與聖俞同時以卒余既志而銘之後十有五年來守淮西又於其家得其文集而序之鄰幾毅然仁厚君子也雖知名於時仕宦久而不進晚而朝廷方將用之未及而卒其學問通博文辭雅正深粹而論議多所發明詩尤清淡間肆可喜然其文巳自行於丗矣固不待余言以為輕重而余特區區於是者蓋發於有感而云然熙寧四年三月日六一居士序薛簡肅公文集序君子之學或施之事業或見於文章而常患於難兼也蓋遭時之士功烈顯於朝廷名譽光於竹帛故其常視文章為末事而又有不暇與不能者焉至於失志之人窮居隱約苦心危慮而極於精思與其有所感激發憤惟無所施於丗者皆一寓於文辭故曰窮者之言易工也如唐之劉栁無稱於事業而姚宋不見於文章彼四人者猶不能於一無此字兩得況其下者乎惟簡肅公在真宗時以材能為名臣仁宗母后時以剛毅正直為賢輔其決大事定大議嘉謀讜論著在國史而遺風餘烈至今稱於士大夫公絳州正平人也自少以文行推於鄉里既舉進士獻其文百軸於有司由是名動京師其平生所為文至八百餘篇何其盛哉可謂兼於兩得也公之事業顯矣其於文章氣質純深而徑正蓋發於其志故如其為人公有子直孺早卒無後以其弟之子仲孺公期為後公之文既多而往往流散於人間公期能力收拾蓋自公薨後三十年始克類次而集之為四十卷公期可謂能丗其家者也嗚呼公為有後矣熙寧四年五月日序六一居士傳六一居士𥘉謫滁山自號醉翁既老而衰且病將退休於潁水之上則又更號六一居士客有問曰六一何謂也居士曰吾家藏書一萬卷集録三代以來金石遺文一千卷有琴一張有碁一局而常置酒一壷客曰是為五一爾奈何居士曰以吾一翁老一作老翁於此五物之間是豈不為六一乎客笑曰子欲逃名者乎而屢易其號此莊生所誚畏影而走乎日中者也余將見子疾走大喘渴死而名不得逃也居士曰吾固知名之不可逃然亦知夫不必逃也吾為此名聊以志吾之樂爾客曰其樂如何居士曰吾之樂可勝道哉方其得意於五物也太山在前而不見疾雷破柱而不驚雖響九奏於洞庭之野閲大戰於涿鹿之原未足喻其樂且適也然常患不得極吾樂於其間者丗事之為吾纍者衆也其大者有二焉軒裳圭組勞吾形于外憂患思慮勞吾心於內使吾形不病而已悴心未老而先衰尚何暇於五物哉雖然吾自一作方乞其身於朝者三年矣一日天子惻然哀之賜其骸骨使得與此五物偕返於田廬庶幾償其夙願焉此吾之所以志也客復笑曰子知軒裳圭組之纍其形而不知五物之纍其心乎居士曰不然纍於彼者巳勞矣又多憂纍於此者既佚矣幸無患吾其何擇哉於是與客俱起握手大笑曰置之區區不足較也巳而歎曰夫士少而仕老而休蓋有不待七十者矣吾素慕之二字一作志冝去一也吾嘗用於時矣而訖無稱焉冝去二也壯猶如此今既老且病矣乃以難強之筋骸貪過分之榮祿是將違其素志而自食其言冝去三也吾負三冝去雖無五物其去冝矣復何道哉熙寧三年九月七日六一居士自傳居士集卷第四十四熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正歸田録序怨嫉一作怨恨無所一作無可六一居士傳曰吾家三字上一有對字所誚一作所謂聊以一作所以無稱一作無輔
