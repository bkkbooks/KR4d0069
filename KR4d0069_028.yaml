body:
  text: 墓志六首蔡君山墓志銘豫友蔡君謨之弟曰君山為開封府太康主簿時豫與君謨皆為館閣校勘居京師君山數往來其兄家見其以縣事決於其府府尹吳遵路素剛好以嚴憚下吏君山年小位卑能不懾屈而得盡其事之詳吳公獨喜以君山為能豫始知君山敏於為吏而未知其他也明年君謨南歸拜其親夏京師大疫君山以疾卒于縣其妻程氏一男二女皆幼縣之人哀其貧以錢二百千為其賻程氏泣曰吾家素以廉為吏不可以此汚吾夫拒而不受於是又知君山能以惠愛其縣人而以廉化其妻妾也君山間嘗語豫曰天子以六科䇿天下士而學者以記問應對為事非古取士之意也吾獨不然乃晝夜自苦為學及其亡也君謨發其遺藁得十數萬言皆當世之務其後踰年天子與大臣講天下利害為條目其所改更於君山之藁十得其五六於是又知君山果天下之竒才也君山景祐中舉進士初為長溪縣尉縣媪二子漁於海而亡媪指某氏為仇告縣捕賊縣吏難之皆曰海有風波豈知其不水死乎且雖果為仇所殺若尸不得則於法不可理君山獨曰媪色有冤吾不可不為理乃隂察仇家得其迹與媪約曰吾與汝宿海上期十日不得尸則為媪受捕賊之責凡宿七日海水潮二尸浮而至驗之皆殺也乃捕仇家伏法民有夫婦偕出而盜殺其守舍子者君山亟召里民畢會環坐而熟視之指一人曰此殺人者也訊之果伏衆莫知其以何術得也長溪人至今喜道君山事多如此曰前史所載能吏號如神明不過此也自天子與大臣條天下事而屢下舉吏之法尤欲官無小大必得其材方求天下能吏而君山死矣此可為痛惜者也君山諱髙享年二十有八以某年某月某日卒今年君謨又歸迎其親自太康取其柩以歸將以某年某月某日葬于某所且謂豫曰吾兄弟始去其親而來京師欲以仕宦為親榮今幸還家吾弟獨以柩歸甚矣老者之愛其子也何以塞吾親之悲子能為我銘君山乎乃為之銘曰嗚呼吾聞仁義之行于天下也可使父不哭子老不哭少一作幼嗟夫君山不得其壽父母七十扶行一作杖送柩退之有言死孰謂天子墓豫銘其傳不朽庶幾以此慰其父母黃夢升墓志銘豫友黃君夢升其先婺州金華人後徙洪州之分寧其曾祖諱元吉祖諱某父諱中雅皆不仕黃氏世為江南大族自其祖父以來樂以家資賑鄉里多聚書以招一有延字四方之士夢升兄弟皆好學尤以文章意氣自豪豫少家隨一有州字夢升從其兄茂宗官于隨豫為童子一作豫時為童子無下四字立諸兄側見夢升年十七八眉目明秀善飲酒談笑豫雖幼心巳獨竒夢升一作巳能知夢升為可竒其後七一作八九年豫與夢升皆舉進士於京師夢升得丙科初任興國軍永興主簿怏怏不得志以疾一有解字去久之復調江陵府公安主簿時豫一作豫時謫夷陵令遇之于江陵夢升顔色憔悴初不可識久而握手噓􅐵相飲一作勞以酒夜醉起舞歌呼大噱一作自若豫益悲夢升志雖衰而少時意氣尚在也後二年豫徙乾德令夢升復調南陽主簿又遇之于鄧間常問其平生所為文章幾何夢升慨然歎曰吾巳諱之矣窮逹有命非世之人不知我一有乃字我羞道於世人也求之不肯出遂飲之酒復大醉起舞歌呼因一有大字笑曰子知我者一作獨子知我乃肯出其文讀之一無二字博辨雄偉其一無此字意氣奔放猶一有若字不可禦豫又益悲夢升志雖困而獨其一無二字文章未衰也是時謝希深出守鄧州尤喜稱道天下士豫因手書夢升文一通欲以一本改欲以字為將示希深未及而希深卒豫亦去鄧後之守鄧者皆俗吏一作庸人不復知夢升夢升素剛不苟合負其所有常怏怏無所施一作憤憤無所發卒以不得志死于南陽夢升諱注以寶元二年四月二十五日卒享年四十有二其平生所為文曰破碎集公安集南陽集几三十卷娶潘氏生四一作其娶溫氏生三男二女將以慶曆四年某月某日葬于董坊之先塋一作葬于先塋之側其弟渭泣而來告曰吾兄患世之莫吾知孰可為其銘豫素悲夢升者因為之銘曰豫嘗讀夢升之文至於哭其兄子庠之詞曰子之文章電激雷震雨雹忽止閴然滅泯未嘗不諷誦歎息而不已嗟夫夢升曽不及庠不震不驚鬱塞埋藏孰與一作豫其有不使其施吾不知所歸咎徒為夢升而悲大理寺丞狄君墓志銘距長沙縣西三十里新陽鄉梅溪村一作距某縣東南若干里某原有墓曰狄君之墓者乃豫所記一作紀榖城孔子廟碑所謂狄君栗者也始君居穀城有善政嘗已見於豫文及其亡也其子遵誼泣而請曰願卒其詳而銘之以終先君死生之賜烏呼豫哀狄君者其壽止於五十有六其官止於一卿丞蓋其生也以不知於世而止於是若其殁而又無傳則後世遂將泯沒而為善者何以勸焉此豫之所欲銘也君字仲莊世為長沙人幼孤事母鄉里稱其孝好一作力學自立年四十始用其兄棐蔭補英州真陽主簿再調安州應城尉能使其縣終君之去無一人為盜薦者稱其材任治民乃遷穀城令漢旁之民惟鄧穀為冨縣尚書銓吏常邀厚賂以售貪令故省中私語一有鄧榖二字以一二數之惜為竒貨而二邑之民未嘗得廉吏其豪猾習以賕賄污令而為自恣至君一切以法繩之姦民大吏不便君之政者往往訴於其上雖按覆率不能奪君所為其州所下文符有不如理必輒封還州吏亦切齒求君過失不可得君益不為之屈其後民有訟田而君誤斷者訴之君坐被劾已而縣籍強壯為兵有告訟田之民隱丁以規避者君笑曰是嘗訴我者彼冤民能自伸此令一有養民之所欲也吾豈挾此而報以罪邪因置之不問縣民繇是知君為愛我是歲西北初用兵州縣既大籍強壯而訛言相驚一作警云當驅以備邊縣民數萬聚邑中會秋大雨霖米踊貴絶粒君發常平粟賑之有司劾君擅發倉廪君即具伏事聞朝廷亦原之又為其民正其稅籍之失而吏得歲免破産之患逾年政大洽乃修孔子廟作禮器與其邑人春秋釋奠而興于學時豫為乾德令嘗至其縣與其民言皆曰吾邑不幸有生而未識廉吏者而長老之民所記才一人而繼之者今君也問其一人者曰張及也推及之歲至于君蓋三十餘年是謂一世矣嗚呼使民更一世而始得一良令吏其可不愼擇乎君其可不惜其殁乎其政之善者可遺而不録乎君用穀城之績遷大理寺丞知新州至則丁母夫人鄭氏憂服除赴京師道病卒于宿州實慶曆五年七月二十四日也曽祖諱崇謙連州桂陽令祖諱文蔚全州清湘令父諱𣏌不仕君娶滎陽鄭氏生子男二人遵誼遵微皆舉進士一無四字女四人長適進士胡純臣其三尚幼其一無其字銘曰強而仕古之道終中壽不為夭善在人宜有後銘于石著不朽薛質夫墓志銘故大理寺丞薛君直孺字質夫資政殿學士贈禮部尚書簡肅公之子母曰金城一有郡字夫人趙氏質夫生四歲為殿直公為參知政事拜大理評事遷將作監丞景祐元年公薨天子推恩於其孤拜大理寺丞公以忠直剛毅顯于當世質夫為名臣子能純儉謹飭好學自立以世其家公葬絳州質夫自京師杖而行哭至于絳州行路之人皆哀嗟之質夫少多病後公六年以卒享年二十有四初娶向氏某人之孫某人之女再娶王氏某人之孫某人之女皆無子嗚呼簡肅公之世於是而絶孟子曰不孝有三無後為大此為舜娶妻而言耳非萬世之通論也不娶而無後罪之大者可也娶而無子與夫不幸短命未及有子而死以正者其人可以哀不可以為罪也故曰孟子之言非通論為舜而言可也質夫再聚皆無子不幸短命而疾病以死其可哀也非其罪也自古賢一作聖人君子未必皆有後其功德名譽垂世而不朽者非皆因其子孫而傳也伊尹周公孔子顔回之道著于萬世非其家世之能獨傳乃天下之所傳也有子莫如舜而瞽不得為善人卒為頑父是為惡者有後而無益為善雖無後而不朽然則為善者可以不懈為簡肅公者可以無憾也使簡肅公無憾質夫無罪全其身終其壽考以從其先君于地下復何道哉某娶簡肅公之女質夫之妹也常哀質夫之賢而不幸傷簡肅公之絶世閔金城夫人之老而孤故為斯言庶幾以慰其存亡者巳悲夫銘曰死而有祀四世之間死而不朽萬世之傳簡肅之德質夫之賢雖其閟矣久也其存隴城縣令贈太常博士吕君墓志銘君一本上有吕字諱士元字佐堯江寧人也咸平二年舉明經為潭州醴陵尉廬州司理參軍寧州彭原廣州四會縣令又為湖州司理泗州録事參軍吉州太和秦州隴城縣令以疾卒于官享年六十有五娶閻氏生子四人曰淵曰溱曰淙曰淇閻氏年七十三後君十五年以卒子淙後其母三月卒以慶曆八年十二月二十日以閻氏之喪合葬于揚州江都縣東興鄉馬坊村先塋之次君為人剛介有節長於為政醴陵太和皆大邑民喜鬪訟往往因事中吏以法吏多不免而君日與長吏爭曲直下為邑民伺候終無毫髮過失可得而民卒愛思之四會近海俗雜蠻夷君尤知其人之利害事所經決後有欲輒改更者民必自言于廷曰此吕君所決豈可動邪後人亦莫能改也君仕三十餘年以一縣令之祿衣食其族四十餘口雖薄而必均夫人閻氏尤能為勤儉子淵溱皆舉進士溱有賢材以文學選中第一今淵為祕書丞溱著作郎直集賢院以溱官得封贈贈君太常博士毋夫人封天長縣太君嗚呼吕君官雖卑惠於其民足以為政祿雖薄周於其族足以為仁身雖不顯而有子以大其門足以彰為善之效君之皇祖諱𥙿贈兵一作工部尚書皇考諱文膺官至太子左贊善大夫自宋興百年間吕姓之族五顯于世君之叔父刑部侍郎集賢院學士文仲實為先朝名臣而今君有賢子又將顯吕氏之族于後於其葬也是宜銘以志其銘一作墓曰善無不報報不必同或在其後或及其躬積久發遲逾一作愈逺彌昌如其不信考此銘章尹師魯墓志銘師魯河南人姓尹氏諱洙然天下之士識與不識皆稱之曰師魯蓋其名重當世而世之知師魯者或推其文學或髙其議論或多其材能至其忠義之節處窮逹臨禍福無愧於古君子則天下之稱師魯者未必盡知之師魯為文章簡而有法博學強記通知今古一作古今長於春秋其與人言是是非非務窮盡道理乃已不為苟止而妄隨而人亦罕能過也遇事無難易而一無此字勇於敢為其所以見稱於世者亦所以取嫉於人故其卒窮以死師魯少舉進士及第為絳州正平縣主簿河南府戶曹參軍邵武軍判官舉書判拔萃遷山南東道掌書記知伊陽縣王文康公薦其才召試充館閣校勘遷太子中允天章閣待制范公貶饒州諫官御史不肯言師魯上書言仲淹臣之師友願得俱貶貶監郢州酒稅又徙唐州遭父喪服除復得太子中允知河南縣趙元昊反陜西用兵大將葛懷敏奏起為經略判官師魯雖用懷敏辟而尤為經略使韓公所深知其後諸將敗於好水韓公降知秦州師魯亦徙通判濠州久之韓公奏得通判秦州遷知涇州又知渭州兼涇原路經略部署坐城水洛與邊臣一作將異議徙知晉州又知潞州為政有惠愛潞州人至今思之纍遷官至起居舍人直龍圖閣師魯當天下無事時獨喜論兵為敘燕息戍二篇行于世自西兵起凡五六歲未嘗不在其間故其論議益一作亦精密而於西事尤習其詳其為兵制之説述戰守勝敗之要盡當今之利害又欲訓土兵代戍卒以減邊用為禦戎長久之䇿皆未及施為而元昊臣西兵解嚴師魯亦去而得罪矣然則天下之稱師魯者於其材能亦未必盡知之也初師魯在渭州將吏有違其節度者欲按軍法斬之而不一作未果其後吏至京師上書訟師魯以公使錢貸部將一作訟師魯自盜貶崇信軍節度副使徙監均州酒稅得疾無醫藥舁至南陽求醫疾革隱一作憑几而坐顧稚子在前無甚憐之色與賔客言終不及其私享年四十有六以卒師魯娶張氏某縣君有兄源字子漸亦以文學知名前一歲卒師魯凡十年間三貶官喪其父又喪其兄有子四人連喪其三女一適人亦卒而其身終以貶死一子三歲四女未嫁家無餘資客其喪于南陽不能歸平生故人無逺邇一作近皆往賻之然後妻子得以其柩歸河南以某年某月某日葬于先塋之次余與師魯兄弟交嘗銘其父之墓矣故不復次其世家焉銘曰藏之深固之密石可朽銘不滅居士集卷第二十八熙寧五年秋七月男發等編定紹熙二年二月郡人孫謙益校正黃夢升墓銘後二年一作後又二年飲之酒之一作以獨其文章未衰也一作文章獨未衰因為一作乃為又别本南陽主簿黃君墓志銘豫友黃君夢升其先婺州金華人後徙洪州之分寧其曽祖諱某祖諱某父諱某皆不仕黃氏世為江西大族自其祖父以來樂以家資賑施鄉里多聚書以招延四方之士夢升兄弟皆好學尤以文章意氣自豪豫少家隋州夢升從其兄官于隋豫時為童子見夢升年十七八眉明秀善飲酒談笑豫雖幼巳能知夢升為可竒其後八九年與豫皆舉進士于京師夢升得丙科初任興國軍永興主簿怏怏不得志以疾解去久之復調江陵府公安主簿豫時謫夷陵令遇之于江陵夢升顔色憔悴初不能識久而握手吁􅐵相勞以酒夜醉起舞歌呼自若豫益悲夢升志雖衰而少時意氣尚在也後又二年豫徙乾德令夢升復調南陽主簿又遇之于鄧間嘗問其平生所為文章幾何夢升慨然曰吾巳諱之矣窮逹有命非世人不知我乃我羞道於世人也求之不肯出遂飲以酒復大醉起舞歌呼因大笑曰獨子知我者也乃肯出其文其博辨雄偉意氣奔放猶若不可禦豫又益悲夢升志雖困而其文章獨未衰也是時謝希深守鄧州尤喜稱道天下士豫因手書夢升文一通將示希深未及而希深卒豫亦去鄧後之守鄧者皆庸人不復知夢升夢升素剛不苟合負其所有常憤憤無所發卒以不得志死于南陽夢升諱注以寶元二年四月某日卒享年四十有二其平生所為文曰破碎集公安集南陽集凡若干卷其娶溫氏生四男二女以某年某月某日葬于先塋之側其弟渭泣而來告曰吾兄患世之莫知孰可為其銘豫素悲夢升者乃為之銘曰豫嘗喜讀夢升之文至於哭其兄子庠之辭曰子之文章電激雷震雨雹忽止閴然滅泯未始不諷誦嘆息而不已嗟夫夢升曽不及庠不震不驚鬱塞埋藏孰豫其有不使其施吾不知夫歸咎徒為夢升而悲與黃渭小簡修啓多事不及周謹鄙文或可刋石望只依首尾不須添他語亦不必平空及不用官銜惟書刻人欲署姓名無妨墨本乞三五紙乍别保愛修再拜叔祖夢升學問文章五兵從橫制作之意似徐陵庾信使同時遇合未知孰先孰後也然不幸得人間四十年爾使之白髮角逐於英俊之埸又未知與歐陽文忠公孰先孰後也夢升既乖忤不逢嘗以文哭世父長善云髙明之家尚為鬼瞰子之文章豈無物憾蓋自道也安世十三弟秀而不實使人氣塞於今孫曽特多英妙之質力學不休安知來者之不如今也紹聖元年五月諸孫庭堅記右黃夢升墓銘公年三十八所作真迹今藏興國軍吳氏字畫端麗雖似淨本然亦間有塗改校今衆本凡增損異同七十餘字疑公後嘗修潤或傳寫差訛今録示後人併以元帖并山谷跋附焉狄君墓銘至君一作君至
