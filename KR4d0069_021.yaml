body:
  text: 譜石本歐陽氏譜圖序歐陽氏之先本出於夏禹之苗裔自帝少康封其庶子於會稽使守禹祀歷夏商周以世相傳至于允常子曰句踐是為越王越王句踐傳五世至王無疆為楚威王所滅其諸族子分散爭立皆受封於楚而無疆之子蹄封於烏程歐餘山之陽為歐陽亭侯其後子孫遂以為氏當漢之初有仕為涿郡太守者子孫遂居于北或居青州之千乘或居冀州之渤海千乘之顯者曰生字和伯為漢博士以經名家所謂歐陽尚書者是也渤海之顯者曰建字堅石所謂渤海赫赫歐陽堅石者是也建遇趙王倫之亂見殺其兄子質以其族南奔居于長沙其七世孫曰景逹仕于齊不顯至其孫頠頠子紇仕于陳紇子詢詢子通仕于唐四世有聞遂顯自通三世生琮為吉州刺史子孫因家于吉州自琮八世生萬又為吉州安福令其後世或居安福或居廬陵或居吉水而修之皇祖始居沙溪至和二年分吉水置永豐縣而沙溪分屬永豐今譜雖著廬陵而實為吉州永豐人也蓋自亭侯蹄因封命氏自别於越其後子孫散亡不可悉紀其可紀者千乘渤海而已千乘之族自生傳八世至歙子復無後世絶經不傳家其他子孫亦皆微弱遂不復見而渤海之後獨見于今然中間失其世次者再蓋自質奔長沙至于景逹七世而始見自琮至于安福府君又八世而始見其後遂不絶安福府君之九世孫曰修當皇祐至和之間以其家之舊譜問于族人各得其所藏諸本以考正其同異列其世次為譜圖一篇自景逹以後始得其次敘譜圖安福府君諱萬事迹闕處士諱雅字正言髙年不仕德行稱於鄉里夫人龍氏韶陽府君諱效字德用為韶州韶陽主簿夫人周氏處士諱託字逹明隱德不仕鄉里稱之凡民有爭決之官府者後多復訴訟有從處士平其曲直者遂不復爭夫人王氏令公府君諱郴字可封仕南唐為武昌令吉州軍事衙推官至檢校右散騎常侍兼御史大夫性至孝兄弟相友愛有紫芝一莖兩葩生於楹鄉人以為孝德所感為著賦頌享年九十有四葬歐桂里橫溪保之燕湖夫人劉氏府君纍贈金紫光祿大夫太師中書令夫人纍封楚國太夫人屯田府君諱俊第三十六仕南唐為洪州屯田院判官享年五十七葬栗源夫人李氏處士諱伸第三十七守道不仕享年七十有三葬滁陂夫人蕭氏屯田府君諱儀第三十八字象之仕南唐舉進士及第官至屯田郎中府君之登進士第也父母皆在鄉里榮之乃改廬陵之文霸鄉安德里為儒林鄉歐桂里其所居履順坊為具慶坊享年五十有五葬官山夫人王氏處士諱伾第三十九守道不仕夫人王氏張氏靜江府君諱信第四十仕南唐為靜江軍團練使據宋奭所撰安福太君墓志列序八子官封云信為靜江軍團練使兼憲秩南唐官品疑與今異享年二十有五葬曾家莊夫人郭氏令公府君諱偃第四十一少以文學著稱南唐恥從進士舉乃詣文理院上書獻其所為文十餘萬言召試為南京街院判官享年三十八葬吉水之回陂夫人李氏府君纍贈金紫光祿大夫太師中書令兼尚書令夫人纍封吳國太夫人處士諱佺第四十二晦迹不仕享年四十有七葬東田夫人陸氏工部府君諱倣第四十三仕皇朝為許田令葬奉新纍贈工部侍郎夫人李氏處士諱翺事迹闕處士諱宏事迹闕處士諱猛葬馬家坑夫人鄭氏水部府君諱谷為筠州團練副使官至檢校水部員外郎葬傅家坑夫人王氏封州府君諱寬為封州司理參軍葬早禾坑夫人邊氏工部府君諱載字則之淳化三年進士及第歐陽氏自江南歸朝以進士登科者自府君始為人方重寡言真宗皇帝嘗自擇御史府君以祕書丞拜監察御史後知泗州毀龜山佛寺誅妖僧數十人為政清廉簡靜所至官舍不窺園圃至果爛墮地家人無敢拾者官至尚書工部郎中享年六十有八夫人金壇縣君米氏處士諱素事迹闕處士諱端事迹闕崇公諱觀字仲賔事具瀧岡阡表享年五十有九葬吉水沙溪之瀧岡纍贈金紫光祿大夫太師中書令兼尚書令追封崇國公夫人彭城郡大君鄭氏纍封魏國太夫人享年七十有二祔葬瀧岡處士諱旦隱德不仕事母以孝為鄉里所稱葬烏龜塘夫人彭氏兵部府君諱曄字日華咸平三年進士及第官至都官員外郎歷知桂陽監端黃永三州所至有能稱尤長於決疑獄所得俸祿分養孤遺其兄之子修少孤教之如巳子享年七十有九葬安州應城之彭樂村夫人福昌縣君范氏其後兄子修者以參知政事遇今上登極恩贈府君兵部員外郎處士諱翦事迹闕處士諱羽事迹闕職方府君諱潁字孝叔咸平三年進士及第官至尚書職方郎中歷知萬峽鄂歙彭嶽閬饒八州為政務嚴明有威惠以本官分司享年七十有三家于荆南遂葬焉夫人廣陵縣君曾氏奉職府君諱顗為三班奉職殿直府君諱頊為右班殿直譜例曰姓氏之出其來也逺故其上世多亡不見譜圖之法斷自可見之世即為髙祖下至五世玄孫而别自為世如此世久子孫多則官爵功行載於譜者不勝其繁宜以逺近親疏為別凡逺者疏者略之近者親者詳之此人情之常也玄孫既別自為世則各詳其親各繫其所出是詳者不繁而略者不遺也凡諸房子孫各紀其當紀者使譜諜互見親踈有倫宜視此例而審求之諸房譜皆以此圖為首集本歐陽氏譜圖序吉州廬陵縣儒林鄉歐陽里歐陽氏之先本出於夏禹之苗裔自帝少康封其庶子於一作于會稽使守禹祀傳二十餘世五字一作歷夏商周以世相傳至於允常允常之子曰句踐是為越王越王句踐卒子王鼫與立自鼫與傳五世至王無疆為楚威王所滅其諸族子分散爭立濵於江南海上皆受封於楚有封於歐陽亭者為歐陽亭侯歐陽亭在今湖州烏程歐餘山之陽二十六字一作而無疆之子蹄封於烏程歐餘山之陽為歐陽亭侯其後子孫遂以為氏漢髙祖滅秦得無疆之七世孫一有閩君字搖復以為越王使奉越後而歐陽亭侯一有蹄字之後有仕漢為涿郡太守者子孫遂居于北一居冀州之渤海一居青州之千乘十四字一作或居青州之千乘或居冀州之渤海其居千乘四字一作千乘之顯者曰一有生字二字和伯仕于漢世為博士以經名家所謂歐陽尚書者是也其居渤海四字一作渤海之顯者仕于晉最顯一無五字曰建字堅石所謂渤海赫赫歐陽堅石者是也建遇趙王倫之亂見殺其兄子質以其族奔于長沙由是子孫復于南仕于陳者曰頠威名著于南海頠之孫曰詢詢之子通仕于唐尤顯皆為名臣其世居長沙猶以渤海為封望自通三世生琮琮為吉州刺史子孫因家焉今為吉州吉水人也自琮八世生萬萬為安福縣令萬生某某生雅雅生效效生託託生皇髙祖府君府君生子八人於世次為曾祖今圖所列子孫皆出于八祖自安福府君以來遭唐末五代之亂江南陷于僭偽歐陽氏遂不顯然世為廬陵大族而皇祖一有少卿二字府君以儒學知名當世至今名其所居鄉曰儒林云及宋興天下一八祖之子孫稍復出而仕宦然自宋興三十年而吾先君伯父叔父始以進士登于科者四人後又三十年某與其兄之子乾曜又登于科今又殆將三十年矣以進士仕者又才二人蓋自八祖以來傳六世百年或絶或微分散扶踈而其逹於仕進者何其遲而又少也今某獲承祖考之餘休列官于朝叨竊榮寵過其涯分而才卑能薄泯然遂將老死於無聞夫無德而祿辱也適足以為身之愧尚敢以為親之顯哉嗚呼自通而上其行事見於史自安福府君而下遭世故而無所施焉某不幸幼孤不得僃聞祖考之遺德然傳於其家者以忠事君以孝事親以廉為吏以學立身吾先君諸父之所以行于其躬教于其子弟者獲承其一二矣某又嘗聞長老言當黃巢攻破江西州縣時吉州尤被其毒歐陽氏率鄉人扞賊賴而保全者千餘家子孫宜有𬒳其隂德者顧某不肖何足以當之傳曰積善之家必有餘慶今八祖之子孫甚衆苟吾先君諸父之行于其躬教于其子孫者守而不失其必有當之者矣故圖其世次傳于族人又志于其石以待自八祖以來遷徙婚嫁官封名諡與其行事則具于譜一本自以其族奔于長沙至其行事則具于譜五百五十七字改云以其族南奔已而晉室大亂歐陽氏之諸族曰舉曰迹曰純亦以其族隨晉渡江散居丹陽吳郡豫章然皆不顯而質之族居于長沙其七世孫曰景逹仕于齊無所稱至其孫頠頠子紇紇子詢詢子通仕于唐四世有聞遂顯自通三世生琮為吉州刺史子孫因家于吉州自琮八世生萬萬又為吉州安福縣令其後世或居安福或居廬陵或居吉水而譜著廬陵縣儒林鄉歐陽里為定者因其舊也𥘉可悉紀其不可紀者千乘渤海之後蓋其後亡在乎人有其人雖歷千載不絶其人無所稱其世輒沒不見可不勉哉千乘之族以尚書顯于漢自生傳歙八世歙子復無後世絶經不傳家其他子孫亦遂微弱不復見而渤海之後獨見于今然或微或絶中間失其世次者再蓋自質奔長沙至于景逹七世而始見自琮至于安福府君又八世而始見其後遂不絶安福府君之九世孫曰修當皇祐至和之間以其家之舊譜問于族人各得其所藏諸本以考正其同異大抵文字殘闕其言又不純雅然取其所同多者并列其世次為譜圖一篇而略存其舊譜所載舊譜前列魏司空清河崔林宋太保王弘齊太尉王儉梁御史中丞王僧孺尚書兵部馬將臣賈贄等上又列唐吏部尚書髙士廉中書舍人徐令言等重定其譜多載千乘之族至歙而止魏晉已後無復次序疑其脫亂不真其尤可疑者漢書曰生子和而譜自涿郡太守而下列其十世而無生太守亡其名字有其夫人曰楚春申君之女也生子曰睦字公安睦夫人陳氏生子曰欽字子敬欽夫人張氏生三子曰容曰述曰興皆不著其字而云同受業於濟南伏生容為博士其夫人夏侯氏生子曰巨字孝仁巨夫人戴德之女生子曰逺字叔逰逺夫人倪寬之女生子曰髙字彥士髙夫人孔安國之女生子而亡其名有其字曰仲仁仲仁夫人趙氏生子曰地餘字長賔地餘夫人戴氏生二子曰崇曰政政字少翁夫人孫氏生子曰歙字正思漢氏以歙為和伯八世孫然今譜無生而有容又云容受尚書於伏生自容至歙八世疑漢所謂歐陽生者以其經師謂之生如伏生之類而其實名容容字和伯於義為通此其可疑者也漢書曰髙字陽而譜字彥士小不同此不足怪其夫人世家無可考證莫知其是非故存之至於他説可知其繆者皆不録渤海之族自景逹以下至于通事見于史記譜尤詳自幼明以下至于今或見于譜或得于家而多闕謹録乎左以俟乎將來自此後歷序譜中名字官爵夀數喪葬及夫人名氏有事迹可紀者各隨其人紀之譜例曰姓氏之出其來也逺故其上世多亡不見譜圖之法斷自可見之世玄孫而别自為世如此世久子孫多則官爵功行載於譜者不勝其繁宜有逺近親踈之限凡逺者踈者略之近者親者詳之此人情之常也玄孫既别自為世則各詳其親各承其所出是詳者不繁而略者不遺也凡諸房子孫各紀其當紀者使譜諜互見親踈有倫宜視此譜為例而審求之外集卷第二十一前賢遺文往往集本異於石本按公集古録跋盤谷詩序云以集本校濟源石刻或小不同疑刻石誤竊謂非誤也後或改定爾故此譜不敢專以碑為正而存集本於後集本歐陽氏譜圖序凡玄孫凡字上一有故字字彥士士一作世又作事譜圖二本其甚不同者如集本載寬四子素一子皆不名曉而石本則謂寬之第四子素之第二子皆名曉豈曉嘗出繼耶又集本肅生一子顗唐書世系表亦同而石本無之其間世次與表又多差殊二書皆經公手不應異同如此當考九射之格其物九為一大侯而寓以八侯熊當中虎居上􅎷居下雕雉猿居右雁兔魚居左而物各有籌射中其物則視籌所在而飲之射者所以為羣居之樂也而古之君子以爭九射之格以為酒禍起于爭爭而為歡不若不爭而樂也故無勝負無賞罰中者不為功則無好勝之矜不中者無所罰則無不能之誚探籌而飲飲非觥也無所耻故射而自中者有不淂免飲而屢及者亦不得辭所以息爭也終曰為樂而不耻不爭君子之樂也探籌之法一物必為三籌蓋射賔之數多少不常故多為之籌以備也凡今賔主之數九人則人探其一八人則置其熊籌不及八人而又少則人探其一而置其餘籌可也益之以籌而人探其一或二皆可也惟主人臨時之約然皆置其熊籌中則在席皆飲若一物而再中則視執籌者飲量之多少而飲器之大小亦惟主人之命若兩籌而一物者亦然凡射者一周既飲釂則斂籌而復探之籌新而屢變矢中而無情或適當之或幸而免此所以歡然為樂而不厭也醉翁亭記云射者中奕者勝觥籌交錯恐或謂此居士集卷第二十一歐陽文忠公集二十一碑銘四尚書戶部郎中贈右諫議大夫曾公神道碑一作墓志銘并序公諱致堯字某撫州南豐人也少知名江南一本作少有大志以文行知名當李氏時不就鄉里之舉李氏亡太平興國八年一有始字舉進士及第為符離主簿纍遷光祿寺丞監越州酒稅數上書言事獻文章太宗竒之召拜著作佐郎直史館使行視汴河漕運稱旨遷祕書丞為兩浙轉運使諫議大夫魏庠知蘇州時舊恩多不法吏莫敢近公一本有曰此吾職也劾其狀以聞太宗驚曰是敢治魏庠可畏也卒為公罷庠洛苑使楊允恭以言事見幸無不聽事有下公常厝不行允恭以訴太宗遣使問公公具言其不可一本下有事卒不行公既繩其大而人所難者至其小易則務為寬簡歲終其課為最徙知壽州壽近京師諸豪大商一作姓交結權貴一本作豪又有恃其聲勢號為難治公居歲餘諸豪斂手莫一作不敢犯公法人亦莫見其以何術而然也一本下有夫敢以法加諸豪乃強吏之所能爾使諸豪不敢干其法此為法之本意而人之難也故公於壽尤有惠愛既去壽人遮留數日以一騎從二卒逃去過他州壽人猶有追之者再遷主客員外郎判三司鹽鐵勾院是時李繼捧以銀夏五州歸朝廷其弟繼遷亡入磧中為冦太宗遽遣繼捧往招之至則誘其兄以隂合卒復圖而囚之自陜以西既苦兵矣真宗初即位益欲來以恩德許還其地使聽約束公獨以謂繼遷反覆一有如此字不可豫繼遷巳得五州後二年果叛圍靈武議者又欲豫之公益爭以為不可言雖不從真宗知其材將召以知制誥而大臣有不可者乃巳出為京西轉運使王均伏誅奉使安撫西川誤留詔書于家其副潘惟嶽一作吉教公上言渡吉柏江舟破亡之一有可字以自解公曰為臣而欺其君吾不能為也乃上書自劾釋不問其後惟嶽一作吉入見禁中道蜀事具言公所自劾者真宗嗟歎久之繼遷兵既久不解丞相張齊賢經略環慶以西署公判官以從公曰西兵十萬皆屬王超超材既不可專任一有以事而兵多勢重非易可指麾若不得節度諸將事必不集真宗難其言為詔陜西聽經略使得自發兵而已一無而巳公度言終不合乃辭行會召賜金紫公謝曰臣嘗言丞相某事未效不敢受賜由是貶黃州團練副使公巳貶而王超兵敗繼遷破淸遠軍朝廷卒亦棄靈州公貶逾年復為户部員外郎知泰州丁母憂服除拜吏部員外郎知泉州徙知蘇州又徙知揚州上疏論事語斥大臣尤切當時皆不恱又徙知鄂州坐知揚州一有日字誤入添支俸多一月雖嘗自言猶貶監江寧府酒稅用封禪恩纍遷户部郎中大中祥符五年五月某日卒于官享年六十有六遺戒無以佛汚我家人如其言公之曾祖諱某某官曾祖妣某氏某縣君祖諱某某官祖妣某氏某縣君考諱某某官妣某氏某縣君子男七人曰某一本曰某二字作某等女若干人用其子易占恩再遷右諌議大夫初葬南豐之東園水壞其墓某年月日改葬龍治一作冿鄉之源一作原頭慶曆六年夏其孫鞏稱其父命以一有公之事來請曰願有述遂為之述曰維曾氏始出於鄫鄫為姒姓之國微不知其始封春秋之際莒滅鄫而子孫散亡其在魯者自别為曾氏蓋自鄫遠出於禹歷商周千有餘歲常微不顯及為曾氏而蒧參元西始有聞于後丗而其後又晦復千有餘歲而至於公一作千有餘歲而又顯於公焉夫晦顯常相反覆一作復而丗德之積者久則其發也冝非一二丗而止矧公之有不得盡施而有以遺其後丗乎是固不冝無銘者巳公當太宗真宗時言事屢見聽用自言西事不合而出遂以卒于外然在外所言一本作然其在外所言尤多如在朝廷而任言責者一本無者至其難言則人有所不敢言者豫於其論議既不能盡載而亦有所不得載也取其初不見用久而益可思者一本有將特詳焉所以見公之志也銘曰公於事明由學而知先知逆決一本作逆決臧否有若蓍龜告而不欺不顧從違初雖不信後必如之公所論議一作議論敢人之難古稱君子有德有言德畜不施言猶可聞銘而不朽公也長存尚書度支郎中天章閣待制王公神道碑銘并序公諱質字子野其先大名莘人自唐同光初公之皇曾祖魯公舉進士第一顯名當時官至右拾遺歷一有仕字晉漢周而皇祖晉公益以文章有大名逮事太祖太宗官至兵部侍郎當真宗時伯父文正公居中書二十餘年天下稱為賢宰相今天子慶曆三年公與其弟素皆待制天章閣自同光至慶曆蓋百有二十餘年王氏更四丗丗一作代有顯人或以文章或以功德公生纍丗冨貴而操履甚於寒士性篤孝悌厚於朋友樂施與以賙人而妻子常不自給視榮利淡若無意平居苦疾病退然如不自勝及臨事介然一有不可回奪字有仁者之勇君子之剛樂人之善如自已出𥘉范仲淹以言事貶饒州方治黨人甚急公獨扶病率子弟餞于東門留連數日大臣有以讓公曰長者亦為此乎何苦自陷朋黨公徐對曰范公天下賢者顧某何敢望之然若得為黨人公之賜某厚矣聞者為公縮頸其為待制之明年出守于陜又明年小人連搆大獄坐貶廢者十餘人皆公素所賢者聞之悲憤歎息或終日不食一上有語于人曰善人若此吾不樂在丗矣因數劇飲大醉公既素病益以酒遂卒公初以廕輔太常寺太祝監都進奏院獻其文章召試賜進士及第校勘館閣書籍遂為集賢校理通判蘇州州守黃宗旦負材自喜頗以新進少公議事則曰少年乃與丈人爭事耶公曰受命佐君事有當爭職也宗旦雖屢屈折而政常得無失稍德公助已為之加禮宗旦得盜鑄錢者百餘人以詫一作託公公曰事發無迹何從得之曰吾以術一有隂字鉤出之公愀然曰仁者之政以術鉤人置之死而又喜乎宗旦慚服悉緩出其獄始大稱公曰君子也判尚書刑部吏部南曹知蔡州始至發太姦吏一人去之繩諸豪猾以法與轉運使爭曲直事有下而不便者皆格不用既去其害政者然後崇學校一以仁恕臨下其政知寬猛必使吏畏而民愛其為他州州率大而難治必常有善政皆用此入為開封府推官巳而其兄雍為三司判官公曰省府皆要職吾豈可兄弟居之求知壽州徙廬州盜有殺其徒而并其財者獲之置于法大理駮曰法當原公以謂盜殺其徒而自首者原之所以疑壞其黨而開其自新若殺而不首既獲而亦原則公行為盜而第殺一人既得兼其財又可以贖罪不獲則肆為盜一本公行為盜以相殺兼其財不獲則為盜獲則引以自原如此盜不可止非法意疏三上不能爭公嘆曰吾不勝法吏矣乃上書自劾請不坐佐吏公坐貶監靈仙宫其後議者更定不首之罪一作其後韓某知審刑院議正首之罪卒用公言一作議為是而公貶猶不召資政殿學士鄭戩翰林學士葉淸臣訟公無罪始起知泰一夲作秦州遷荆湖北路轉運使當用一作治兵西方急於財用之時獨不進羡餘其賦斂近寬平治以常法故他路不勝其弊而荆湖之人自若一作獨若平日權知荆南府民有訟婚者訴曰貧無資故後期問其用幾何以俸錢與之使婚獲盜竊人衣者曰一本有平生不為過迫於飢寒而為之公為之哀憐取衣衣之遣去荆人比公為子産召為史館修撰遂拜天章閣待制判吏部流內銓號為稱職而於選法未嘗有所更易人或問之公曰選法具備如權衡在執者不欺其輕重耳何必屢更其法一作器是歲天子開天章閣召大臣問天下事以手詔責范公等一本作是時天子感悟黨人説進用范公等在左右而議事者爭言天下利害務欲更革諸事公獨無一言問之則曰吾病未能也公於榮利既薄臨禍福不為喜懼其視丗事若無一可以動其心者惟以天下善人君子亨否為巳休戚遂以此卒此其為志豈小哉豈有一作以病而不能者哉公誠素病而任之以事所至必皆有為使其壽且不死而用其必一作如有所為一本而任之大用其必大有為於事豈其不欲空言而巳一本已作無益者哉嗚呼公享年一作公年止四十有五官至度支郎中階朝奉大夫勳上護軍爵平晉男娶周氏某縣君生子某曾祖諱某祖諱某皆贈太師尚書中書令考諱某官至兵部郎中有賢行贈戶部尚書公以某年某月某日卒于陜某年某月某日葬于某所先塋之次銘曰仕不為利以行其仁處豐自薄而淸厥身其仁誰思不在吏民其淸孰似一作嗣以遺子孫一有生雖有止殁也長存銘以昭之以告後人袁州冝春縣令贈太師中書令兼尚書令冀國公程公神道碑銘并序上即位之十有六年一有以字今鎮安軍節度使檢校太師同中書門下平章事程公自三司使吏部侍郎為參知政事乃詔有司寵其祖考於是贈其皇考故袁州冝春縣令為太子少師公在政事遷尚書左丞又贈太子太師其為資政殿學士工部尚書又贈太師中書令其為宣徽北一作南院使武昌軍節度使又贈兼尚書令其為武勝軍節度使同中書門下平章事追封定國公徙鎮鎮安一作徙鎮安軍又追封冀國公惟冀國一無此三字公諱某字某少舉明經仕不得志退居于家畜德不施貽其後丗而相國太師實為之子初以文學舉進士髙第歷館閣掌制命俊德偉望顯于朝廷遂為中丞執國之憲尹正京邑有聲蜀都乃由三司入與大政公亦自太常博士纍贈兵部侍郎遂遷太師中書尚書令位皆一品有國定冀以啓其封雖發不自躬而其施益遠晦於一時而顯於百丗蓋夫享于身者有時而止施于後者其耀無窮表于其鄉以勸為善可謂仁人之利博矣惟程氏之先自重黎歷夏商周而程伯休父始見於詩書其後丗遠而分至唐定氏族而程氏之望分為七中山之程蓋出於魏安鄉侯昱之後也公丗為中山博野人曽祖諱某祖諱某贈太師祖妣齊氏吳國夫人考諱某贈太師中書令妣吳氏秦國夫人當唐末五代天下亂於兵程氏再丗不仕後唐長興三年公之皇考以神童舉官至太子􅐌善大夫宋興一本有天下一於今百年而程氏亦再顯太平興國初公之從祖羽佐太宗自晉王即皇帝位為文明殿學士官至兵部侍郎今相國太師出入將相為時名臣子孫蕃昌丗族昭著推其所自來者遠矣初公與其仲父象明同舉春秋皆中第是時從祖以給事中知開封府召公及象明謂曰吾新𬒳寵天子待罪于此不欲子弟並登科一有選字使其自擇去就公因讓其從父自引去從祖頗賢之其後纍舉不中從祖謂曰由我困汝退而使人察公無悔色由是大嗟異之以為不可及太平興國五年遂以明經中第為虔州贑縣尉蔡州上蔡主簿袁州冝春令所至皆有惠愛公事母至孝與其兄弟怡怡為鄉里所稱而仕宦不求名譽為贑縣尉七年不代既罷冝春遂不復仕退居于蔡州淳化三年七月某日一作甲子以疾卒于家享年四十有九以天聖十年十一月某日一作甲子葬于鄭州管城縣馬亭鄉之北田村夫人楚氏追封晉國夫人子男五人長曰瓘官至太常博士次曰瑗曰琬皆早卒次曰琳相國太師也次曰琰國子博士女一人適某人諸孫九人銘曰遠矣程侯顓頊之苗始自重黎歷夏商周惟伯休父聲詩孔昭丗不絶聞盛于有唐程分為七三祖安鄉廣平中山以暨濟陽中山之程出自靈洗實昱裔孫仕于陳季陳滅散亡播而北遷公丗中山為博野人道德家潛孝悌邦聞不耀自躬以貽後昆惟後有人將相文武有國寵章覆其考祖定冀之封實開土宇程丗其隆公多孫子有畜其源發而孰禦刻銘髙原以示來者鎮安軍節度使同中書門下平章事贈太師中書令程公神道碑銘并序惟文簡公既葬之二年其子嗣隆泣而言于一作於朝曰先臣幸得備位將相官階品皆第一爵勳皆第二請得立碑如令於是天子曰噫惟爾父琳有勞于我國家余其可忘乃大書曰旌勞之碑遣中貴人即賜其家曰以此名爾碑又詔史臣修曰汝為之銘臣修與文簡公故往來知其人又嘗志其墓又嘗述其丗德于冀公太師之碑得其丗次官封功行最詳乃不敢辭惟公字天球姓程氏曽祖諱新贈太師曽祖妣吳國夫人齊氏祖諱􅐌明贈太師中書令祖妣秦國夫人吳氏考諱元白袁州冝春令贈太師中書令兼尚書令冀國公妣晉國夫人楚氏公舉大中祥符四年服勤詞學髙第試祕書省校書郎泰寧軍節度推官改著作佐郎知并州壽陽縣祕書丞監左藏庫天禧中詔選文學履行召試直集賢院今天子即位遷太常博士三司戶部判官會修真宗實録而起居注闕命公追修大中祥符八年已後書成遂修起居注遷祠部員外郎提舉諸司庫務以本官知制誥同判吏部流內銓契丹嘗遣使賀上即位命公迓之使者妄有所言公折以理遂屈服其後又遣使賀天聖五年乾元節天子思公前嘗折其使乃以公為館伴使使者果言契丹見中國使者坐殿上位次髙而中國見契丹使者位下當遷議者以為小故可許雖天子亦將許之公爭以謂契丹所以與中國好者守先帝約也一切冝用故事若許其小將啓其大天子是之乃止歲中遷右諌議大夫權御史中丞丞相張文節公少所稱許而最知公方除中丞文節當執筆喜曰不辱吾筆矣明年拜樞密直學士知益州公性方重寡言笑凡所處畫常先慮謹備所以條目巨細甚悉至臨事簡嚴僚吏莫能窺其際嘗夜張燈會五門大集州民而城中火起吏如公教不以白而隨即救止終宴民去始稍知火監軍得告者言軍謀變懼而入白公笑曰豈有是哉監軍惶惑不敢去公曰軍中動靜吾自知之苟有謀者不能隱也已而卒無事其他多類此蜀妖人自名李冰神子署官屬吏卒以恐蜀人公捕斬之而謗者言公妄殺人蜀且亂天子遣人馳視之使者還言蜀人便公政方安樂而誅妖人所以止亂由是天子益知公賢召為給事中知開封府前為府者苦其治劇或不一無不字滿歲罷不然被謗譏或以事去獨公居數歲久而治益精明盜訟稀少獄屢空詔書數下褒美遷工部侍郎龍圖閣一有直字學士守御史中丞久之天子思其治召為翰林一有侍讀字學士復知開封府明年為三司使不恱苟利不貪近功時議者患民稅多目吏得為姦欲除其名而合為一公以謂合而沒其名一時之便後有興利之臣必復增之是重困民也議者莫能奪其於出入尤謹禁中時有所取未嘗肯豫宦官怒言陛下雖有一作所欲物在程某何可得公曰臣所以為陛下惜爾天子以為然纍遷吏部侍郎景祐四年以本官參知政事一有遷尚書左丞公益自信不疑宰相有所欲私輒衆折之其語至今士大夫能道也初范仲淹以言事忤大臣貶饒州巳而上悔悟欲復用之稍徙知潤州而惡仲淹者遽誣以事語入上怒亟命置之嶺南自仲淹貶而朋黨之論起朝士牽連出語及仲淹者皆指為黨人公獨為上開説上意解而後巳是時元昊叛河西朝廷多故公在政事輔益尤多而小人僥幸皆不便遂以事中之坐貶為光祿卿知潁州巳而徙知靑州又徙大名府居一歲中遷戶部吏部二侍郎尚書左丞資政殿學士北京建遂以為留守宦者皇甫繼明方用事主治行宫務廣制度以市恩公為裁抑之與繼明章交上天子遣一御史往視之還直公天子為罷繼明獨委公以建都事公自知政事以論議不私見嫉被貶斥巳稍復見用遂與繼明爭曲直由是益不妄合於世雖不復大用而契丹方遣使數有所求兵誅元昊未克西北宿重兵公於是時天子常委以河北陜西之重留守北京凡四年遷工部尚書資政殿大學士河北安撫使慶曆六年拜武昌軍節度使陜西安撫使知永興軍府事明年加宣徽北院使鄜延路經略使馬步軍都部署判延州仍兼陜西安撫使皇祐元年加同中書門下平章事留守北京其於二方威惠信著尤知夷狄情偽山川險易行師制敵之要其在延州夏人數百驅畜産至界上請降言契丹兵至衙頭矣國且亂願自歸公曰契丹兵至元昊帳下當舉國取之豈容有來降者乎聞夏人方捕叛族此其是乎不然誘我也拒而不受巳而夏人果以兵數萬臨界上公戒諸堡塞無得數一作輒出兵夏人以為有備引去自此不復窺邊公於河北最久民愛之為立生祠明年改武勝軍節度使猶在北京又改鎮安軍節度使在鎮四年猶上書鎮安一郡爾不足以自效願復守邊書未報得疾以至和三年一作嘉祐元年閏三月七日己丑薨于陳州之正寢享年六十有九天子輟視朝二日贈中書令諡曰文簡一本有以嘉祐二年十月十八日葬河南府伊闕縣神隂鄉張劉里明年祫享太廟推恩加贈公太師尚書令公纍階至開府儀同三司勳上柱國廣平郡爵公封户七千四百而實封二阡一伯賜號推誠保德守正翊戴功臣娶陳氏封衛一作陳國夫人子男四人曰嗣隆太常博士嗣弼殿中丞嗣恭太常博士嗣先大理寺丞女五人皆適良族謹按程氏之先出自重黎至休父為周司馬國於程其後子孫遂以為氏自秦漢以來丗有其人程氏必顯而各以其所居著姓後丗因之至唐尤盛號稱中山程氏者皆祖魏安鄉侯昱公中山博野人也丗有積德至公始大顯聞臣修以謂古者功德之臣進受國寵退而銘於器物非獨私其後丗所以不忘君命示國有人而詩人又播其事聲於詠歌以揚無窮今去古遠為制不同而猶有幽堂之石隧道之碑得以紀德昭烈而又幸蒙天子書而名之其所以照臨程氏恩厚寵榮出古遠甚而臣又得刻銘其下銘臣職也懼不能稱銘曰程以國氏丗遠支分因居著姓各以其人公丗中山在昔有聞充大自公厥聲以振乃秉國鈞乃授將鉞出入其勤險夷一節帝曰噫歟余有勞臣何以旌之有爛其文惟此勞臣實余同德憂國在心匪勞以力二方有事諸將無功俾我舊老不遑居中間息近藩庶休厥躬有請未一作嗇其報奄云其終殁而後巳茲可謂忠惟帝之褒其言甚簡銘以述之萬丗丕顯居士集卷第二十一熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正冀國程公神道碑遂遷少師中書尚書位皆一品朝佐考是時未置三少雖有太子少師乃非一品今諸本皆作少師當是筆誤合作太師羅本尚書下有令字今從之程文簡公神道碑除中丞日丞相張文節公當執筆喜曰不辱吾筆矣朝佐按文簡兩為中丞其初在天聖五年九月時文節為集賢相實當筆明年三月文節薨後數年當明道二年十月文簡方再守中丞諸本誤載文節之言於再除之後惟羅氏本移附初除之下今從之又諸本作至和三年閏三月薨惟羅氏本作嘉祐元年朝佐按仁宗實録至和三年九月下詔改嘉祐元年則閏三月固冝繫之至和但史官例書新元則至和合盡二年羅氏本亦有所據諫議大夫曾公碑遣使一有者字十萬一作數十萬某日卒一本書二十日再遷一作贈龍治鄉治一作也待制王公碑入為二字一作又嘗為之時獨三字一作而近寬二字上一有務字曾祖諱徹祖諱祜考諱旭公以慶曆五年七月二十六日卒一本所書如此冀國程公碑公諱元白祖諱新考諱贊明一夲如此再丗一作纍丗程文簡公干久之一作頃之命置一置一作置被貶斥巳一有而字來降者乎一無乎字堡塞一作堡寨猶上書一有言字廣平郡三字上脫開國二字
