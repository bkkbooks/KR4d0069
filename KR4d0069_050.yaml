body:
  text: 祭文十七首祭程相公文維至和三年歲次丙申月日具官歐陽修謹以清酌庶羞之奠致祭于故太師相國程公之靈嗚呼公於時人氣剛難合豫實後進晚而相接一笑之樂淋漓酒巵十年再見公老豫衰公遽如此豫存幾時人生冨貴朝露之光及其零落止一作秖益悲傷惟可喜者令名不忘士窮閭巷念不逢時公位將相韜能不施公居廟堂有言諤諤白首于外愈愈其樂酒酣氣振猶見鋒鍔惜也雖老神清志完手書未復訃巳在門昔者樽酒歌歡笑謔今而一觴涕淚霑落死生忽焉自古常然撫棺為訣夫復何言尚享祭資政范公文月日廬陵歐陽修謹以清酌庶羞之奠致祭于故資政殿學士尚書户部侍郎范文正公之靈曰嗚呼公乎學古居今持方入圓丘軻之艱其道則然公曰彼惡公為好訐公曰彼善公為樹朋公所勇為公則躁進公有退讓公為近名讒人之言其何可聽先事而斥羣譏衆排有事而思雖仇謂材毀不吾傷譽不吾喜進退有儀一作度夷行險止嗚呼公乎舉丗之善誰非公徒讒人豈多公志不舒善不勝惡豈其然乎成難毀易理又然歟嗚呼公乎欲壞其棟先摧桷榱傾巢破鷇披折傍枝害一損百人誰不罹誰為黨論是不仁哉嗚呼公乎易名諡行君子之榮生也何毁沒也何稱好死惡生殆非人情豈其生有所嫉而死無所爭自公云亡謗不待辨愈久愈明由今可見始屈終伸公其無恨寫懷平生寓此薄奠祭杜祁公文維嘉祐二年三月日具官歐陽修謹遣驅使官趙日宣以清酌庶羞之奠致祭于故太子太師贈司徒侍中杜公之靈曰士之進顯於榮祿者莫不欲安享於豐腴公為輔弼飲食起居如陋巷之士環堵之儒他人不堪公處愈愈士之退老而歸休者所以思自放於間適公居于家心在于國思慮精深言辭感激或逹旦不寐或憂形于色如在朝廷而有官責嗚呼進不知冨貴之為樂退不忘天下以為心故行於已者老益篤而信於人者久愈深人之愛公寧有猒巳壽胡不多八十而止自公之喪道路嗟咨況於愚鄙久辱公知繫官在朝心往神馳送不臨穴哭不望帷銜辭寫恨有涕漣洏尚饗祭吳尚書文維嘉祐三年五月庚午朔具官歐陽修謹遣驅使官田安之至于西京以清酌庶羞之奠致祭于故留守資政左丞贈吏部尚書吳公之靈曰嗚呼公乎余將老也閲丗久也見一作念時之事可喜者少而可悲者多也士少勤其身以干祿仕取名聲初若可愛慕者衆也既而得其所欲而怠與迫於利害而遷求全其節以保其終者十不一二也其人康強飲食平居笑言以相歡樂察其志意可謂偉然而或離或合不見幾時遂至於衰病與其俯仰旦暮之間忽焉以死者十常八九也嗚呼公乎所謂善人君子者其難得既如彼而易失又如此也故每失一人未嘗不咨嗟殞泣至於失聲而長號也一有惟字公材謀足以居大臣文學足以名後世冝在朝廷以講國論而久留于外冝享壽考以為人望而遽云長逝一作往此搢紳大夫所以聚弔于家而交朋故舊莫不走哭于位一作次豈惟老病之人獨易感而多涕也尚饗祭梅聖俞文維嘉祐五年歲次庚子七月丁亥朔九日乙未具官歐陽修謹率具官吕某劉某以清酌庶羞之奠致祭于亡友聖俞之靈而言曰昔始見子伊川之上余仕方𥘉子年亦壯讀書飲酒握手相歡談辨鋒出賢豪滿前謂言仕宦所至皆然但當行樂何有憂患子去一作出河南余貶山峽三十年間乖離會合晚被選擢濫官朝廷薦子學舍吟哦六經余才過分可愧非榮子雖窮厄日有聲名余狷而剛中遭多難氣血先耗髮鬚早變子心寬易在險如夷年實加我其顔不衰謂子仁人自宜多壽余譬膏火煎熬豈久事今反此理固難知況於冨貴又可必期念昔河南同時一輩零落之餘惟豫子在子又去我余存兀然凡今之遊皆莫余先紀行琢辭子冝余責送終恤孤則有衆力惟聲與淚獨出余臆尚饗曽祖曾祖母祖祖母焚黃祭文維嘉祐七年歲次壬寅某月朔日曽孫具官修謹以清酌庶羞之奠及太子少保太保延安郡榮國太夫人之告四通告于曽祖太保曽祖母太夫人之靈曰修以不肖之質獲蒙祖考之餘休享有爵祿材薄任重繆膺獎擢踐更二府國有常典命及其先非惟優異丞弼之臣蓋所以彰積善垂慶其來有自而欲潛光閟德發耀有時俾為臣子者退得伸孝於家而進以盡忠於國是謂一施而兩得此朝廷所以推仁廣恩而為小子之幸也敢不夙夜祗畏竭其思慮勉其不逮俾有樹立冀不顚墜其家聲以對揚天子之寵靈以永賴祖考之遺德官有職位繫身于朝不得瞻望松楸親執籩豆謹遣兄之子廬陵縣尉嗣立以告祖祖母同詞皇考太師祭文嗣子具官修謹以清酌庶羞之奠及太常少卿給事中太子少師太師告身四通告于皇考太師之靈曰修獲罪于天幼罹孤苦蒙賴積德積善之慶不殞其躬得從士大夫之列天子哀其祿不獲養而寵及其親曰非以為榮俾以伸汝志亦以示國家推仁廣惠不忘人之先也有慶賜之恩而又有官秩之寵粵元年季秋天子恭謝天地于大慶則有太常少卿之命四年孟冬祫享于廟則有給事中之贈五年冬十有一月修忝二樞密則有少師之錫明年閏八月承乏東府則有太師之告而修官職有守不得以時躬親即事留君之命于家不恭不勉力於其親不孝罪莫大焉是以涕泣憂懼不能自安謹遣兄之子廬陵縣尉嗣立以告尚饗皇妣太夫人祭文嗣子具官修謹以清酌庶羞之奠及平昌滎陽郡太君安定郡永國太夫人告身四通告于皇妣太夫人之靈曰修有不孝之罪不得躬親省視松柏者于兹十年無歲不請于朝而訖不獲報遂以貪冒榮祿留連歲時獨幸天子仁恩教人以孝俾得寵及其親故自嘉祐之元殆今凡四𬒳追封之告亦足以少慰烏鳥之心而備官東府任責至重不得退徇其私有司所下告第之制所以誕揚休命寵褒幽顯者不能躬自臨事則又以永負至慈罔極不報之恩不勝悲慕哀愴之情謹遣兄之子嗣立以告尚饗祭宋侍中文惟靈明誠敏識清方粹直由𥘉考終不變一德忽然云亡天子之惻冨於文章玉質天葩施之朝廟炳耀光華自兹而絶學者之嗟既文一作智且賢周逹善問惟此不朽有司之信輤車其行禮備哀榮奠觴為訣修等之誠尚饗英宗皇帝靈駕發引祭文維治平四年歲次丁未八月丁未朔八日甲寅具官臣歐陽修伏覩大行皇帝靈駕發引臣以官守有職不得攀號於道左謹擇順天門外恭陳薄奠瞻望靈輿臣修西望泣血頓首死罪言曰伏惟大行皇帝至仁至孝本堯舜之心克儉克寬躬禹湯之聖德澤𬒳物威靈在天今者因山為陵卜萬世而叶吉同軌畢至無一人之後期而臣受恩最深報國無狀不能秉翣持紼以供賤事而古人可慕有愧三良之殉身罔極銜哀但同百姓之喪考尚知豺獺之薦冀伸犬馬之誠臣無任號天摧絶哀慕感切之至臣修西望泣血頓首死罪謹言祭石曼卿文祭一作弔維治平四年七月日具官歐陽修謹遣尚書都省令史李敡至于太清以清酌庶羞之奠致祭于亡友曼卿之墓下而弔之以文曰嗚呼曼卿生而為英死而為靈其同乎萬物生死而復歸於無物者暫聚之形不與萬物共盡而卓然其不朽者後丗之名此自古聖賢莫不皆然而著在簡册者昭如日星嗚呼曼卿吾不見子久矣猶能髣佛子之平生其軒昂磊落突兀崢嶸而埋藏於地下者一有吾字意其不化為朽壤而為金玉之精不然生長松之千尺産靈芝而一作之九莖奈何荒煙野蔓荆棘縱橫風凄露下走磷飛螢但見牧童樵叟歌吟而上下與夫驚禽駭獸悲鳴躑躅而咿嚶今固如此更千秋而萬歲兮安知其不穴藏狐貉與鼯鼪此自古聖賢亦皆然兮獨不見夫纍纍乎曠野與荒城嗚呼曼卿盛衰之理吾固知其如此而感念疇昔悲涼悽愴不覺臨風而隕涕者有愧乎太上之忘情尚饗祭胡太傅文維治平四年歲次丁未十一月乙亥朔某日具官修謹以清酌庶羞之奠致祭于故太子太傅致仕胡公之靈自昔並遊儒館當丗英豪譬如花卉先後零凋惟公松柏凛凛寒標他人磨礲爭出圭角公獨渾然不見其璞廊廟之器誰能測度晚登大用蔚有嘉言豫文之鄙懼不能傳三十年間既親且舊哭不及喪行不送柩寫恨臨風有懷莫究尚饗祭劉給事文惟熙寧元年歲次戊申四月壬寅朔十五日丙辰具官修謹遣通引官行首龐簡以清酌庶羞之奠致祭于亡友留臺給事原甫之靈曰嗚呼金百錬以為鑑而萬物不能遁其形及為物蝕而蔽其光頑然無異乎瓦甓然而一遇良工之藥磨而瑩之則可以見肝膽而數毛髮蓋其可昏者光不可昏者性其或廢而或用由有幸與不幸若吾原甫者敏學通於今古精識造乎幽微乃百錬之英而萬事之鑑也一為末疾昏之至使良醫不能措其術百藥無所施其功遂埋至寶銜恨無窮此所以士夫驚呼莫不為朝廷而痛惜至於不知命者皆有疑於造物之工況相知於道義而久接於遊從念以身而莫贖徒有淚而沾胸尚饗祭丁學士文嗚呼元珍善惡之殊如火與水不能相容其勢然爾是故鄉人皆好孔子不然惡於不善然後為賢子之美才懿行純德誰稱諸朝當丗有識子之憔悴遂以湮淪問孰惡子可知其人毀善之言譬若蠅矢點彼白玉濯之而巳小人得志暫快一時要其得失後丗方知受侮被謗無如仲尼巍然衮冕不祀桓魋孟軻之道愈久彌光名尊四子不數臧倉是以君子修身而俟擾擾姦愚經營一丗逮榮華之銷歇嗟泯沒其誰記是皆生則狐鼠死為狗彘惟一賢之不幸歷千載而猶傷自古孰不有死至今獨弔乎沅湘彼靈均之事業𥘉未見於南邦使不遭罹於放斥未必功顯而名彰然則彼讒人之致力乃借譽而揄揚嗚呼元珍道之通塞有命在天其如豫何孔孟亦然何以慰子聊為此言寄哀一奠有涕漣漣尚饗祭吳大資一作長文文維年月日具官修謹遣某人以清酌庶羞之奠致祭于資政侍郎吳公之靈曰惟公以孔孟之學朝董之文佐佑三朝始終一節顧惟庸繆敢企光塵而金門玉堂早接俊遊之末紫樞黃閣晚陪國論之餘雖出處之略同在進退而則異余實衰病久思返於田疇一作廬公方盛年宜復還於廊廟豈期白首來哭素帷飲釂百分尚想平生之意氣寫哀一奠不知涕淚之縱橫尚饗祭蔡端明文維年月日具官修謹遣三班奉職指使李敡以清酌庶羞之奠致祭于故端明殿學士尚書吏部侍郎蔡公君謨之靈曰嗚呼盛必有衰而生必有死物之常理也生為可樂而死為可哀人之常情也而又有不幸於其間者冝其為恨於無窮也自公之奮起徒步而名動京師遂登朝廷列侍從其年壯志鋭而意氣橫出材宏業茂而譽望偉然方公之輝華顯赫之時而其親享壽考康寧之福夫得祿及親人以為幸也而公以榮名顯仕為之養綵衣而戲昔以為孝也而公以金章紫綬恱其顔使天下為子者莫不欲其親如公之親為父母者莫不欲其子如公之為子也其榮且樂可謂盛哉及其衰也母夫人喪猶在殯而公已卧病於苫􅒘之間而愛子長而賢者遽又卒於其前遂以奄然而瞑目一孤藐然以為二喪之主嗚呼又何其不幸也此行路之人聞之皆為之出涕況於親戚朋友乎況如修者與公之遊最久而相知之最深者乎夫丗之舉逺以為言者不過曰四海而閩負南海齊臨東海使修不得躬一觴之奠寫長慟之哀此其為恨又可涯哉尚饗青州求晴祭文求晴一作祈晴維年月日具官修謹以清酌之奠致告于東嶽天齊仁聖帝而言曰夫麥之為物歷四時而後實凡所以生育長養成就之功可謂至矣以四時之功而成之以數日之雨而壞之此殆非天之意也非神之欲也農服耒􅪢有勞筋苦骨之勤而水旱之災螟蝗之孽豐歲常少而凶歲常多所得常不輔其所失天之至仁憫斯民之若此也故於其間時賜一大豐之歲以償之夫豐歲可謂難得也既賜與之又遽奪之此非天之意也非神之欲也今在田者垂穗而蔽野在場者其積而如坻民倣徨而視之穗者不得施其手積者不得入于廩使皆化為羽翼而飛揚之豈不可惜也哉此非天之意也非神之欲也惟神之惠假以十日之不雨以成天之大賜使收穫得以時而民足食公足用是則賴神之靈假之旬浹之頃而九州數千里之地公私皆受其賜矣蓋所假者少而所利者多故敢以為請尚饗居士集卷第五十熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正祭程相公文韜一作韞祭吳大資文金門一作金馬青州求晴文斯民之若此也之字下一有若字
