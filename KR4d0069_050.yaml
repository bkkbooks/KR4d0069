body:
  text: 祭文十七首祭程相公文維至和三年歳次丙申月日具官歐陽脩謹以清酌庶羞之奠致祭于故太師相國程公之靈嗚呼公於時人氣剛難合予實後進晚而相接一笑之樂淋漓酒巵十年再見公老予衰公遽如此予存㡬時人生冨貴朝露之光及其零落止一作秖益悲傷惟可喜者令名不忘士窮閭巷念不逢時公位將相韜能不施公居廟堂有言諤諤白首于外愉愉其樂酒酣氣振猶見鋒鍔惜也雖老神清志完手書未復訃巳在門昔者罇酒歌歡笑謔今而一觴涕淚霑落死生忽焉自古常然撫棺爲訣夫復何言尚享祭資政范公文月日廬陵歐陽脩謹以清酌庶羞之奠致祭于故資政殿學士尚書户部侍郎范文正公之靈曰嗚呼公乎學古居今持方入圓丘軻之艱其道則然公曰彼惡公爲好訐公曰彼善公爲樹朋公所勇爲公則躁進公有退讓公爲近名讒人之言其何可聽先事而斥羣譏衆排有事而思雖仇謂材毀不吾傷譽不吾喜進退有儀一作度夷行險止嗚呼公乎舉丗之善誰非公徒讒人豈多公志不舒善不勝惡豈其然乎成難毀易理又然歟嗚呼公乎欲壞其棟先摧桷榱傾巢破鷇披折傍枝害一損百人誰不罹誰爲黨論是不仁哉嗚呼公乎易名謚行君子之榮生也何毁没也何稱好死惡生殆非人情豈其生有所嫉而死無所爭自公云亡謗不待辨愈乆愈明由今可見始屈終伸公其無恨寫懷平生寓此薄奠祭杜祁公文維嘉祐二年三月日具官歐陽脩謹遣驅使官趙日宣以清酌庶羞之奠致祭于故太子太師贈司徒侍中杜公之靈曰士之進顯於榮禄者莫不欲安享於豐腴公爲輔弼飲食起居如陋巷之士環堵之儒他人不堪公處愉愉士之退老而歸休者所以思自放於閑適公居于家心在于國思慮精深言辭感激或逹旦不寐或憂形于色如在朝廷而有官責嗚呼進不知冨貴之爲樂退不忘天下以爲心故行於已者老益篤而信於人者乆愈深人之愛公寧有猒巳壽胡不多八十而止自公之喪道路嗟咨況於愚鄙久辱公知繫官在朝心往神馳送不臨穴哭不望帷銜辭寫恨有涕漣洏尚饗祭呉尚書文維嘉祐三年五月庚午朔具官歐陽脩謹遣驅使官田安之至于西京以清酌庶羞之奠致祭于故留守資政左丞贈吏部尚書呉公之靈曰嗚呼公乎余將老也閱丗乆也見一作念時之事可喜者少而可悲者多也士少勤其身以干禄仕取名聲初若可愛慕者衆也旣而得其所欲而怠與迫於利害而遷求全其節以保其終者十不一二也其人康彊飲食平居笑言以相歡樂察其志意可謂偉然而或離或合不見㡬時遂至於衰病與其俯仰旦暮之間忽焉以死者十常八九也嗚呼公乎所謂善人君子者其難得旣如彼而易失又如此也故每失一人未甞不咨嗟殞泣至於失聲而長號也一有惟字公材謀足以居大臣文學足以名後世冝在朝廷以講國論而乆留于外冝享壽考以爲人望而遽云長逝一作往此搢紳大夫所以聚弔于家而交朋故舊莫不走哭于位一作次豈惟老病之人獨易感而多涕也尚饗祭梅聖俞文維嘉祐五年歳次庚子七月丁亥朔九日乙未具官歐陽脩謹率具官吕某劉某以清酌庶羞之奠致祭于亡友聖俞之靈而言曰昔始見子伊川之上余仕方𥘉子年亦壯讀書飲酒握手相歡談辯鋒岀賢豪滿前謂言仕宦所至皆然但當行樂何有憂患子去一作出河南余貶山峽三十年間乖離㑹合晚被選擢濫官朝廷薦子學舎吟哦六經余才過分可愧非榮子雖窮厄日有聲名余狷而剛中遭多難氣血先耗髪鬚早變子心寛易在險如夷年實加我其顔不衰謂子仁人自宜多壽余譬膏火煎熬豈久事今反此理固難知況於冨貴又可必期念昔河南同時一軰零落之餘惟予子在子又去我余存兀然凡今之遊皆莫余先紀行琢辭子冝余責送終䘏孤則有衆力惟聲與淚獨岀余臆尚饗曽祖曾祖母祖祖母焚黃祭文維嘉祐七年歳次壬寅某月朔日曽孫具官脩謹以清酌庶羞之奠及太子少保太保延安郡榮國太夫人之告四通告于曽祖太保曽祖母太夫人之靈曰脩以不肖之質獲蒙祖考之餘休享有爵禄材薄任重繆膺獎擢踐更二府國有常典命及其先非惟優異丞弼之臣蓋所以彰積善垂慶其來有自而欲潜光閟德發耀有時俾爲臣子者退得伸孝於家而進以盡忠於國是謂一施而兩得此朝廷所以推仁廣恩而爲小子之幸也敢不夙夜祗畏竭其思慮勉其不逮俾有樹立冀不顚墜其家聲以對揚天子之寵靈以永頼祖考之遺德官有職位繫身于朝不得瞻望松楸親執籩豆謹遣兄之子廬陵縣尉嗣立以告祖祖母同詞皇考太師祭文嗣子具官脩謹以清酌庶羞之奠及太常少卿給事中太子少師太師告身四通告于皇考太師之靈曰脩獲罪于天㓜罹孤苦蒙頼積德積善之慶不殞其躬得從士大夫之列天子哀其禄不獲養而寵及其親曰非以爲榮俾以伸汝志亦以示國家推仁廣惠不忘人之先也有慶賜之恩而又有官秩之寵粤元年季秋天子恭謝天地于大慶則有太常少卿之命四年孟冬祫享于廟則有給事中之贈五年冬十有一月脩忝貳樞宻則有少師之錫明年閏八月承乏東府則有太師之告而脩官職有守不得以時躬親即事留君之命于家不恭不勉力於其親不孝罪莫大焉是以涕泣憂懼不能自安謹遣兄之子廬陵縣尉嗣立以告尚饗皇妣太夫人祭文嗣子具官脩謹以清酌庶羞之奠及平昌滎陽郡太君安定郡永國太夫人告身四通告于皇妣太夫人之靈曰脩有不孝之罪不得躬親省視松柏者于兹十年無歳不請于朝而訖不獲報遂以貪冒榮禄留連歳時獨幸天子仁恩教人以孝俾得寵及其親故自嘉祐之元殆今凡四𬒳追封之告亦足以少慰烏鳥之心而備官東府任責至重不得退徇其私有司所下告第之制所以誕揚休命寵襃幽顯者不能躬自臨事則又以永負至慈罔極不報之恩不勝悲慕哀愴之情謹遣兄之子嗣立以告尚饗祭宋侍中文惟靈明誠敏識清方粹直由𥘉考終不變一德忽然云亡天子之惻冨於文章玉質天葩施之朝廟炳耀光華自兹而絕學者之嗟旣文一作智且賢周逹善問惟此不朽有司之信輤車其行禮備哀榮奠觴爲訣脩等之誠尚饗英宗皇帝靈駕發引祭文維治平四年歳次丁未八月丁未朔八日甲寅具官臣歐陽脩伏覩大行皇帝靈駕發引臣以官守有職不得攀號於道左謹擇順天門外恭陳薄奠瞻望靈輿臣脩西望泣血頓首死罪言曰伏惟大行皇帝至仁至孝本堯舜之心克儉克寛躬禹湯之聖德澤𬒳物威靈在天今者因山爲陵卜萬世而叶吉同軌畢至無一人之後期而臣受恩最深報國無狀不能秉翣持紼以供賤事而古人可慕有媿三良之殉身罔極衘哀但同百姓之喪考尚知豺獺之薦冀伸犬馬之誠臣無任號天摧絶哀慕感切之至臣脩西望泣血頓首死罪謹言祭石曼卿文祭一作弔維治平四年七月日具官歐陽脩謹遣尚書都省令史李敡至于太清以清酌庶羞之奠致祭于亡友曼卿之墓下而弔之以文曰嗚呼曼卿生而爲英死而爲靈其同乎萬物生死而復歸於無物者暫聚之形不與萬物共盡而卓然其不朽者後丗之名此自古聖賢莫不皆然而著在簡冊者昭如日星嗚呼曼卿吾不見子乆矣猶能髣髴子之平生其軒昂磊落突兀崢嶸而埋藏於地下者一有吾字意其不化爲朽壤而爲金玉之精不然生長松之千尺産靈芝而一作之九莖柰何荒煙野蔓荆棘縱横風凄露下走燐飛螢但見牧童樵叟歌唫而上下與夫驚禽駭獸悲鳴躑躅而咿嚶今固如此更千秋而萬歳兮安知其不穴藏狐貉與鼯鼪此自古聖賢亦皆然兮獨不見夫纍纍乎曠野與荒城嗚呼曼卿盛衰之理吾固知其如此而感念疇昔悲涼悽愴不覺臨風而隕涕者有媿乎太上之忘情尚饗祭胡太傅文維治平四年歳次丁未十一月乙亥朔某日具官脩謹以清酌庶羞之奠致祭于故太子太傅致仕胡公之靈自昔並遊儒館當丗英豪譬如花卉先後零凋惟公松栢凛凛寒標他人磨礲爭岀圭角公獨渾然不見其璞廊廟之器誰能測度晚登大用蔚有嘉言予文之鄙懼不能傳三十年間旣親且舊哭不及喪行不送柩寫恨臨風有懷莫究尚饗祭劉給事文惟熈寧元年歳次戊申四月壬寅朔十五日丙辰具官脩謹遣通引官行首龐簡以清酌庶羞之奠致祭于亡友留臺給事原甫之靈曰嗚呼金百錬以爲鑑而萬物不能遁其形及爲物蝕而蔽其光頑然無異乎瓦甓然而一遇良工之藥磨而瑩之則可以見肝膽而數毛髪蓋其可昏者光不可昏者性其或廢而或用由有幸與不幸若吾原甫者敏學通於今古精識造乎幽微乃百錬之英而萬事之鑑也一爲末疾昏之至使良醫不能措其術百藥無所施其功遂埋至寶銜恨無窮此所以士夫驚呼莫不爲朝廷而痛惜至於不知命者皆有疑於造物之工況相知於道義而乆接於遊從念以身而莫贖徒有淚而沾胷尚饗祭丁學士文嗚呼元珍善惡之殊如火與水不能相容其勢然爾是故郷人皆好孔子不然惡於不善然後爲賢子之美才懿行純德誰稱諸朝當丗有識子之憔悴遂以湮淪問孰惡子可知其人毀善之言譬若蠅矢點彼白玉濯之而巳小人得志蹔快一時要其得失後丗方知受侮被謗無如仲尼巍然衮冕不祀桓魋孟軻之道愈乆彌光名尊四子不數臧倉是以君子脩身而俟擾擾姦愚經營一丗迨榮華之銷歇嗟泯沒其誰記是皆生則狐䑕死爲狗彘惟一賢之不幸歷千載而猶傷自古孰不有死至今獨弔乎沅湘彼靈均之事業𥘉未見於南邦使不遭罹於放斥未必功顯而名彰然則彼讒人之致力乃借譽而揄揚嗚呼元珍道之通塞有命在天其如予何孔孟亦然何以慰子聊爲此言寄哀一奠有涕漣漣尚饗祭呉大資一作長文文維年月日具官脩謹遣某人以清酌庶羞之奠致祭于資政侍郎呉公之靈曰惟公以孔孟之學晁董之文佐佑三朝始終一節顧惟庸繆敢企光塵而金門玉堂早接儁遊之末紫樞黃閤晚陪國論之餘雖出處之略同在進退而則異余實衰病乆思返於田疇一作廬公方盛年宜復還於廊廟豈期白首來哭素帷飲釂百分尚想平生之意氣寫哀一奠不知涕淚之縱橫尚饗祭蔡端明文維年月日具官脩謹遣三班奉職指使李敡以清酌庶羞之奠致祭于故端明殿學士尚書吏部侍郎蔡公君謨之靈曰嗚呼盛必有衰而生必有死物之常理也生爲可樂而死爲可哀人之常情也而又有不幸於其間者冝其爲恨於無窮也自公之奮起徒歩而名動京師遂登朝廷列侍從其年壯志銳而意氣橫岀材宏業茂而譽望偉然方公之輝華顯赫之時而其親享壽考康寧之福夫得禄及親人以爲幸也而公以榮名顯仕爲之養綵衣而戲昔以爲孝也而公以金章紫綬恱其顔使天下爲子者莫不欲其親如公之親爲父母者莫不欲其子如公之爲子也其榮且樂可謂盛哉及其衰也母夫人喪猶在殯而公已卧病於苫􅒘之間而愛子長而賢者遽又卒於其前遂以奄然而瞑目一孤藐然以爲二喪之主嗚呼又何其不幸也此行路之人聞之皆爲之出涕況於親戚朋友乎況如脩者與公之遊最乆而相知之最深者乎夫丗之舉逺以爲言者不過曰四海而閩負南海齊臨東海使脩不得躬一觴之奠寫長慟之哀此其爲恨又可涯哉尚饗青州求晴祭文求晴一作祈晴維年月日具官脩謹以清酌之奠致告于東嶽天齊仁聖帝而言曰夫麥之爲物歷四時而後實凡所以生育長養成就之功可謂至矣以四時之功而成之以數日之雨而壞之此殆非天之意也非神之欲也農服耒􅪢有勞筋苦骨之勤而水旱之災螟蝗之孽豐歳常少而凶歳常多所得常不𥙷其所失天之至仁憫斯民之若此也故於其間時賜一大豐之歳以償之夫豐歳可謂難得也旣賜與之又遽奪之此非天之意也非神之欲也今在田者垂穗而蔽野在場者其積而如坻民徬徨而視之穗者不得施其手積者不得入于廩使皆化爲羽翼而飛揚之豈不可惜也哉此非天之意也非神之欲也惟神之惠假以十日之不雨以成天之大賜使收穫得以時而民足食公足用是則頼神之靈假之旬浹之頃而九州數千里之地公私皆受其賜矣蓋所假者少而所利者多故敢以爲請尚饗居士集卷第五十熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正祭程相公文韜一作韞祭呉大資文金門一作金馬青州求晴文斯民之若此也之字下一有若字
