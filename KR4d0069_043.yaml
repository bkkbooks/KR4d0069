front:
  text: 居士集卷第四十三歐陽文忠公集四十三
  hash: sha256:cebf8aa1b8af49a7d6ac62a1d7577c43058dba6b4513c8ec63f7c208c9d14c7b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_043-1a}
body:
  text: 序七首送祕書丞宋君歸太學序陋巷之士甘藜藿而修仁義毀譽不干其守飢寒不纍其心此衆人以為難而君子以為易生于髙門丗襲軒冕而躬布衣韋帶之行其驕榮佚欲之樂生長于其間而不溺其習日見于其外而不動乎其中此雖君子猶或難之學行足以立身而進不止材能足以高人而志愈下此雖聖人亦以為難也書曰不自滿假又曰汝惟不矜不伐一有夫字以舜禹之明一有且字猶以是為相戒懼況其下者哉此誠可謂難也巳廣平宋君宣獻公之子公以文章為當丗宗師顯于朝廷登于輔弼清德著于一時令名垂于後丗君少自立不以門地驕于人既長學問好古為一無此字文章天下賢士大夫皆稱慕其為人而君慊然常若不足于已者守官太學甘寂寞以自處日與寒士往來而從先生國子講論道德以求其益夫生而不溺其習此蓋出其一作於天性其見焉而不動于中者由性之明學之而後至也學一作進而不止髙而愈下豫自其幼見其長行而不倦久而愈篤可知其將無所不至焉也孟子所謂孰能禦之者歟豫陋巷之士也遭時奮身竊位于朝守其貧賤之節其臨利害禍福之際常恐其奪也以豫行君子之所易者猶若是知君行聖賢之所難者為難能也歲之三月來自京師拜其舅氏豫得延之南齋聽其論議而慕其為人雖與之終身久處而不厭也留之數日而去於其去也不能忘言遂為之序廬陵歐陽修述送徐無黨南歸序草木鳥獸之為物衆人之為人其為生雖異而為死則同一歸於腐壞澌盡泯滅而巳而衆人之中有聖賢者固亦生且死於其間而獨異於草木鳥獸衆人者雖死而不朽逾一作愈逺而彌存也其所以為聖賢者修之於身施之於事見之於言是三者所以能不朽而存也修於身者無所不獲施於事者有得有不得焉其見於言者則又有能有不能也施於事矣不見於言可也自詩書史記所傳其人豈必皆能言之士哉修於身矣而不施於事不見於言亦可也孔子弟子有能政事者矣有能言語者矣若顔回者在陋巷曲肱飢卧而巳其羣居則默然終日如愚人然自當時羣弟子皆推尊之以為不敢望而一作以及而後丗更百千歲亦未有能及之者其不朽而存者固不待施於事況於一作其言乎豫讀班固藝文志唐四庫書目見其所列自三代秦漢以來著書之士多者至百餘篇少者猶三四十篇其人不可勝數而散亡磨滅百不一二存焉豫竊悲其人文章麗矣言語工矣無異草木榮華之飄風鳥獸好音之過耳也方其用心與力之勞一作勤亦何異衆人之汲汲營營而忽焉以死者雖有遲有速一作其遲速雖異而一作然卒與三者同歸於泯滅夫言之不可恃也蓋如此今之學者莫不慕古聖賢之不朽而勤一丗以盡心於文字間一無此字者皆可悲也東陽徐生少從豫學為文章稍稍見稱於人既去而與羣士試於禮部得髙第由是知名一有而字其文辭日進如水涌而山出豫欲摧其盛氣而勉其思也故於其歸告以是言然豫固亦喜為文辭者亦因以自警焉廖氏文集序自孔子殁而一無此字周一有益字衰接乎戰國秦遂焚書六經於是中絶漢興蓋久而後出其散亂磨滅既失其傳然後諸儒因得措其異説於其間如河圖洛書怪妄之尤甚者余嘗哀夫學者知守經以篤信而不知偽説之亂經也屢為説以黜之而學者溺其久習之傳反駭然非余以一人之見決千歲不可考之是非欲奪衆人之所信一作好徒自守而丗莫之從也余以謂自孔子沒至今二千歲之間有一歐陽修者為是説矣又二千歲焉知無一人焉與修同其説也又二千歲將復有一人焉然則同者至于三則後之人不待千歲而有也同豫説者既衆則衆人之所溺者可勝而二字一作以奪也夫六經非一丗之書一有也字其將與天地無終極而存也以無終極視數千歲一作載於其間頃刻爾是則余之有待於後者逺矣非汲汲有求於今丗也一作今之丗矣衡山廖倚與余遊三十年已而出其兄稱之遺文百餘篇號朱陵編者其論洪範以為九疇聖人之法爾非有龜書出洛之事也余乃知不待千歲而有與余同於今丗者一有矣字始余之待于後丗也冀有因余言而同者爾若稱者未嘗聞余言蓋其意有所合焉然則舉今之丗固有不相求而同者矣亦何待於數千歲一作載乎廖氏家衡山丗以能詩知名於湖南而稱尤好古能文章其德行聞于鄉里一時賢士皆與之遊以其不達而早死故不顯于丗嗚呼知一有有字所待者必有時而獲知一有有字所畜者必有時而施茍有志焉不必有求而後合余嘉與稱不相求而兩得也於是乎書嘉祐六年四月十六日翰林學士尚書吏部郎中知制誥充史館修撰歐陽修序外制集序一作慶曆制草慶曆三年春丞相吕夷簡病不能朝上既更用大臣鋭意天下事始用諌官御史疏追還夏竦制書既而召韓琦范仲淹於陜西又除冨弼樞密副使弼仲淹琦皆惶恐頓首辭讓至五六不巳手詔趣琦等就道甚急而弼方且入求對以辭不得見遣中貴人趣送閣門使即受命嗚呼觀琦等之所以讓上之所以用琦等者可謂聖賢相遭一作逢萬丗一遇而君臣之際何其盛也於是時天下之士孰不願為材邪顧豫何人亦與其選夏四月召自滑臺入諌院冬十二月拜右正言知制誥是時夏人雖數請命而西師尚未解嚴京東纍歲盜賊最後王倫暴起沂州轉劫江淮之間而張海郭貌山等亦起商鄧以驚京西州縣之吏多不稱職而民弊矣天子方慨然勸農桑興學校破去前例以不次用人哀民之困而欲除其蠹吏知磨勘法久之弊而思别材不肖以進賢能患百職之不修而申行賞罰之信蓋欲修法度矣豫時雖掌誥命猶在諌職常得奏事殿中從容盡聞天子所以更張庶事憂閔元元而勞心求治之意退得載于制書以諷曉訓勑在位者然豫方與修祖宗故事又修起居注又修編勑日與同舍論議治文書所省不一而除目所下率不一二時巳迫丞相出故不得專一思慮工文字以盡導天子難諭之意而復誥命於三代之文嗟夫學者文章見用于丗鮮矣況得施於朝廷而又遭人主致治之盛若修之鄙使竭其材猶恐不稱而況不能專一其職此豫所以常遺恨於斯文也明年秋豫出為河北轉運使又明年春權知成德軍事事少間發嚮所作制草而閲之雖不能盡載明天子之意於其所述百一作而得一二足以章示後丗蓋王者之訓在焉豈以豫文之鄙而廢也於是録之為三卷豫自直閣下儤直八十始滿不數日奉使河東還即以來河北故其所作才一百五十餘篇云三月二十一日序禮部唱和詩序嘉祐二年春豫幸得從五人者於尚書禮部考天下所貢士凡六千五百人蓋絶不通人者五十日乃於其間時相與作為古律長短歌詩雜言庶幾所謂羣居燕處言談之文亦所以宣其底滯而忘其倦怠也故其為言易而近擇而不精然綢繆反復若斷若續而時發於竒怪雜以詼嘲笑謔及其至也往往亦造於精微夫君子之博取於人者雖滑稽鄙俚猶或不遺而況於詩乎古者詩三百篇其言無所不有惟其肆而不放樂而不流以卒歸乎正此所以為貴也於是次而録之得一百七十三篇以傳於六家嗚呼吾六人者志氣可謂盛矣然壯者有時而衰衰者有時而老其出處離合參差不齊則是詩也足以追惟平昔握手以為笑樂至於慨然掩卷而流涕噓嚱者亦將有之雖然豈徒如此而止也覽者其必有取焉廬陵歐陽修序內制集序昔錢思公嘗以謂朝廷之官雖宰相之重皆可雜以他才處之惟翰林學士非文章不可思公自言為此語頗取怒一作怨於逹官然亦自負以為至論今學士所作文書多矣至於青詞齋文必用老子浮圖之説祈禳祕祝往往近於家人里巷之事而制詔一作誥取便於宣讀常拘以丗俗所謂四六之文其類多如此然則果可謂之文章者歟豫在翰林六年中間進拜二三大臣皆適不當直而天下無事四夷和好兵革不用凡朝廷之文所以指麾號令訓戒約束自非因事無以發明矧豫中年早衰意思零落以非工之作又無所遇以發焉其屑屑應用拘牽常格卑弱不振冝可羞也然今文士尤以翰林為榮選豫既罷職院吏取豫直草以日次之得四百餘篇因不忍棄況其上自朝廷內及宫禁下暨蠻夷海外事無不載而時政記日曆與起居郎舍人有所略而不記未必不有取於斯焉嗚呼豫且老矣方買田淮潁之間若夫涼竹簟之暑風曝茅簷之冬日睡餘支枕念昔平生仕宦出處顧瞻玉堂如在天上因覽遺藁見其所載職官名氏以較其人盛衰先後孰在孰亡足以知榮寵為虛名而資笑談一作談笑之一噱也亦因以誇於田夫野老而已嘉祐六年秋八月二日廬陵歐陽修序帝王丗次圖序堯舜禹湯文武此六君子者可謂顯人矣而後丗猶失其傳者豈非以其逺也哉是故君子之學不窮逺以為能而闕其不知愼所傳以惑丗也方孔子時周衰學廢先王之道不明而異端之説並起孔子患之乃修正詩書史記以止紛亂之説而欲其傳之信也故略其逺而詳其近於書斷自唐虞以來著其大事可以為丗法者而巳至於三皇五帝君臣丗次皆未嘗道者以其丗逺而愼所不知也孔子既沒異端之説復興周室亦益衰亂接乎戰國秦遂焚書先王之道中絶漢興久之詩書稍出而不完當王道中絶之際竒書異説方充斥而盛行其言往往反自託於孔子之徒以取信於時學者既不備見詩書之詳而習傳盛行之異説丗無聖人以為質而不自知其取捨真偽至有博學好竒之士務多聞以為勝者於是盡集諸説而論次𥘉無所擇而惟恐遺之也如司馬遷之史記是矣以孔子之學上述前丗止於堯舜著其大略而不道其前遷逺出孔子之後而乃上述黃帝以來又詳悉其丗次其不量力而務勝冝其失之多也遷所作本紀出於大戴禮丗本諸書今依其説圖而考之堯舜夏商周皆同出於黃帝堯之崩也下傳其四丗孫舜舜之崩也復上傳其四丗祖禹而舜禹皆壽百歲稷契於髙辛為子乃同父異母之兄弟今以其丗次而下之湯與王季同世湯下傳十六丗而為紂王季下傳一丗而為文王二丗而為武王是文王以十五丗祖臣事十五丗孫紂而武王以十四丗祖伐十四丗孫而代之王何其繆哉嗚呼堯舜禹湯文武之道百王之取法也其盛德大業見於行事而後丗所欲知者孔子皆巳論著之矣其久逺難明之事後丗不必知不知不害為君子者孔子皆不道也夫孔子所以為聖人者其智知所取捨皆如此後序余既略論帝王丗次而見本紀之失猶謂文武與紂相去十五六丗其繆較然不疑而堯舜禹之丗相去不逺尚冀其理有可通乃復以尚書孟子孔安國皇甫謐諸書參考其壽數長短而尤乖戾不能合也據書及諸説云堯壽一百一十六歲舜壽一百一十二歲禹壽百歲堯年十六即位在位七十年年八十六始得舜而試之二年乃使攝政時舜年三十居試攝通三十年而堯崩舜服堯喪三年畢乃即位在位五十年而崩方舜在位三十三年命禹攝政凡十七年而舜崩禹服舜喪三年畢乃即位在位十年而崩由是言之當堯得舜之時堯年八十六舜年三十以此推而上之是堯年五十七已見四丗之玄孫生一歲矣舜居試攝及在位通八十二年而禹壽百歲以禹百年之間推而上之禹即位及居舜喪通十三年又在舜朝八十二年通九十五年則當舜攝試之𥘉年禹才六歲是舜為玄孫年三十時見四丗之髙祖方生六歲矣至於舜娶堯二女據圖為曾祖姑雖古逺丗異與今容有不同然人倫之理乃萬丗之常道必不錯亂顚倒之如此然則諸家丗次壽數長短之説聖經之所不著者皆不足信也決矣居士集卷第四十三熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正送祕書丞宋君序為相戒懼一無為字久處一作久遊廖氏文集序千歲一作數千載外制集序諫職一作諫院盡導一作盡道禮部唱和詩序三篇一作二篇帝王丗次圖序十四丗四當作六後序可證
