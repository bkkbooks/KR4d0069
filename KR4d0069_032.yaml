  text: 居士集卷第三十二歐陽文忠公集三十二
  hash: sha256:a8252ef46f7aeeb9e72ff8b904d629174958ef59b43ef04b19b693c414639386
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_032-1a}
body:
  text: 墓志七首尚書戶部侍郎參知政事贈右僕射文安王公墓志銘并序公姓王氏其先太原祁人其六世祖某為唐輝州刺史遭世亂因留家碭山碭山近宋其後又徙宋州之虞城今為應天虞城人也公諱堯臣字伯庸天聖五年舉進士第一為將作監丞通判湖州召試以著作佐郎直集賢院知光州歲大飢群盜發民倉廪吏法當死公曰此飢民求食爾荒政之所恤也乃請以減死論其後遂以著令至今用之丁父憂服除為三司度支判官再遷右司諫郭皇后廢居瑶華宫有疾上頗哀憐之方后廢時宦者閻文應有力及后疾文應又主監醫后且卒議者疑文應有姦謀公請付其事御史考按虛實以釋天下之疑事雖不行然自文應用事無敢指言者一有其字後文應卒以恣橫斥死后猶在殯有司以歲正月用故事張燈公言郭氏幸得蒙厚恩復位號乃天子后也張燈可廢上遽為之罷景祐四年以本官知制誥賜服金紫同知通進銀臺司兼門下封駮提舉諸司庫務遷翰林學士知審官院元昊反西邉用兵以公為陜西體量安撫使公視四路山川險易還言某路冝益兵若干某路賊所不攻某路冝急為備至於諸將材能長短盡識之薦其可用者二十餘人後皆為名將是時邉兵新敗於好水任福等戰死今韓丞相坐主帥失律奪招討副使知秦州范文正公亦以移書元昊不先聞奪招討副使知耀州公因言此兩人天下之選也其忠義智勇名動夷狄不冝以小故置之且任福由違節度以致敗尤不可深責主將由是忤宰相意并其他議多格不行明年賊入涇原戰定川殺大將葛懷敏乃公指言為備處由是始以公言為可信而前所格議悉見施行因復遣公安撫涇原路公曰陛下復用韓琦范仲淹幸甚然將不中御兵法也願許以便冝從事上以為然因言諸路都部署可罷經略副使以重將權而偏將見招討使以軍禮置德順軍於籠竿城廢涇原等五州營田以其地募弓箭手其所更置尤多方公使還行至涇州而德勝寨兵迫其將姚貴閉城叛公止道左解裝為榜射城中以招貴且發近兵討之𥘉吏白曰公奉使且還歸報天子爾貴叛非公事也公曰貴土豪也頗得士心然𥘉非叛者今不乘其未定速招降後必生事為朝廷患貴果出降明年四月以學士權三司使自朝廷理元昊罪軍興而用益廣前為三司者皆厚賦暴斂甚者借內藏率冨人出錢下至果菜皆加稅而用益不足公始受命則曰今國與民皆弊矣在陛下任臣者如何由是天子一聽公所為公乃推見財利出入盈縮曰此本也彼末也計其緩急先後而去其蠹弊之有根穴者斥其妄計小利之害大體者然後一為條目使就法度罷副使判官不可用者十五人更薦用材且賢者期年民不加賦而用足明年以其餘償內藏所借者數百萬又明年其餘而積於有司者一有又字數千萬而所在流庸稍復其業公曰臣之術止於是矣且臣母老願解煩劇天子多公功以為翰林學士承旨兼端明殿學士群牧使𥘉宦者張永和方用事請收民房錢十之三以佐國事下三司永和隂遣人以利動公公執以為不可度支副使林濰附永和議不巳公奏罷濰乃止益利夔三路轉運使皆請增民鹽井課歲可為錢十餘萬公亦以為不可而權幸因緣多見裁抑京師數為飛語及上之左右往往讒其短者上一切不問而公為之亦自若也及公既罷上慰勞之公頓首謝曰非臣之能惟陛下信用臣爾丁母憂去職服除復為學士群牧使再遷給事中皇祐三年以本官為樞密副使公持法守正遂以身任天下事凡宗室宦官醫師樂工嬖習之賤莫不關樞密而濫恩幸請隨其事可損損之可絶絶之至其大者則皆著為定令由是小人益怨􅌟為飛書以害公公得書自請曰臣恐不能勝衆怨願得罷去上愈知公為忠為下令購為書者甚急公益感勵在位六年廢職修舉皆有條理樞密使狄青以軍功起行伍居大位而士卒多屬目往往造作言語以相扇動人情以為疑而青色頗自得公嘗以語衆折青為陳禍福言古將帥起微賤至冨貴而不能保首領者可以為鑒戒青稍沮畏嘉祐元年三月拜戶部侍郎參知政事三年遷吏部侍郎八月二十一日以疾薨于位享年五十有六公在政事論議有所不同必反復切劘至於是而後止不為獨見在上前所陳天下利害甚多至施行之亦未嘗自名其所設施與在樞密時特異豈政事者丞相府也其體自冝如是邪公為人純質雖貴顯不忘儉約與其弟純臣相友愛世稱孝悌者言王氏遇人一以誠意無所矯飾善知人多所稱薦士為時名臣者甚衆有文集五十一作六十卷將終口授其弟純臣遺奏以宗廟至重儲嗣未立為憂天子愍然臨其喪輟視朝一日贈左僕射太常諡曰文安曽祖諱化某官一無某官二字下同贈太傅妣戚氏封曹國太夫人祖諱礪某官父諱瀆某官皆贈太師中書令兼尚書令祖妣袁氏鄆一作鄭國太夫人妣仇氏徐國太夫人娶丁氏安康郡夫人子男三人同老大理評事周老太常寺太祝早卒朋老大理評事二女長適校書郎戚師道早卒次未嫁王氏自遷虞城由公曽祖而下或葬雙金或葬土山皆在虞城嘉祐四年八月十日改葬公之皇考于宋城縣平臺鄉石落原而以公從葬焉銘曰王為祁人遭亂不還六世之祖𥘉留碭山其後再遷虞宋之間遂安其居葬不逺卜宋多名家王實大族族大而振自公顯聞公𥘉奮躬以學以文逢國多事有勞有勤利歸于邦怨不避身帝識其忠謂堪豫弼俾副樞機出入惟密遂參政事實有謀謨誰中止之不俾相豫帝有褒章愍飾之贈長于百寮考德惟稱維古載功在其廟器今亦有銘幽宫是閟資政殿大學士尚書左丞贈吏部尚書正肅吳公墓志銘嘉祐四年十一月丁未資政殿大學士金紫光祿大夫尚書左丞知河南府兼西京留守司上柱國渤海郡開國公食邑二千八百戶食實封八百戶贈吏部尚書諡曰正肅吳公葬于鄭州新鄭縣崇義鄉朝村之原吳氏世為建安人自髙曽以來皆葬建州之浦城至公始葬其皇考于新鄭公諱育字春卿為人明敏徑果強學博辨能自忖一作持度不可守不發巳發莫能屈奪天聖中與其弟京方俱舉進士試禮部為第一遂中甲科而京方皆及第當弟時吳氏兄弟名聞天下公𥘉以大理評事知臨安諸暨二縣遷本寺丞知襄城縣舉才識兼茂明於體用䇿入三等遷著作佐郎直集賢院通判蘇州同知太常禮院三司戶部度支二判官知諫院修起居注知制誥判太常大理二寺吏部流內銓史館修撰纍遷起居舍人為翰林學士久之遷禮部郎中以學士知開封府公為政簡嚴所至民樂其不擾去雖久愈思之𥘉秦悼王葬汝州界中其後子孫當從葬者與其歲時上家者不絶故宗室宦官常往來為州縣患公在襄城每裁折一作抑之宗室宦官怒或夜半叩縣門索牛駕車以動之公輒不應及旦徐告曰牛不可得也由是宗室宦官曰此不可為也凡過其縣者不敢以鷹犬犯民田至他境矣然後敢縱獵其治開封尤先豪猾曰吾何有以及斯人去其為害者而巳居數日發大姦吏一人流于嶺外一府股栗又得巨盜積贓萬九千緡獄具而輒再變衆疑以為冤天子為遣他吏按之卒伏法由是京師肅清方元昊叛河西契丹亦乘間隳盟朝廷多故公數言事獻計畫自元昊𥘉遣使上書有不順語朝廷亟命將出師而群臣爭言竪子即可一作可即誅滅獨公以謂元昊雖名藩臣而實夷狄其服叛荒忽不常宜示以不足責外置之且其巳僭名號誇其人勢必不能自削以取羞種落第可因之賜號若國主者且故事也彼得其欲冝不肯妄動然時方鋭意於必討故皆以公言為不然其後師久無功而一無此字元昊亦歸過自新天子為除其罪卒以為夏國主由是議者始悔不用公言而虛弊中國公在開封數以職事辨爭或有不得則輒請引去天子惜之慶曆五年正月以為諫議大夫樞密副使三月拜參知政事與賈丞相爭事上前上之左右與殿中人皆恐色變公論辨不已既而曰臣所爭者職也顧力不能勝矣願罷臣職不敢爭上顧一作多公直乃復以為樞密副使居歲餘大旱賈丞相罷去御史中丞髙若訥用洪範言大臣廷爭為不肅故雨不時若因并罷公以給事中知許州又知蔡州州故多盜公按令為民立伍保而簡其法民便安之盜賊為息京師有告妖賊千人聚確山者上遣中貴人馳至蔡以名捕者十人使者欲得兵自往取之公曰使者欲藉兵立威欲得妖人以還報也使者曰欲得妖人爾公曰吾在此雖不敏然聚千人于境內安得不知使信有之今以兵往是趣其為亂也此不過鄉人相聚為佛事以利錢財爾一弓手召之可致也乃館使者日與之飲酒而密遣人召十人者皆至送京師告者果伏辜拜資政殿學士徙知河南府兼西京留守司又徙陜府遷禮部侍郎徙永興軍丁父憂去官起復懇請終喪服除加拜翰林侍讀學士且召之公辭以疾上惻然遣使者存問賜以名藥遂以知汝州居久之又辭以疾即以為集賢院學士判西京留守司御史臺疾少間一作愈復知陜府加拜資政殿大學士自公罷去上數為大臣言吳某剛正可用每召之輒以疾不至於是召還始侍講禁中判通進銀臺司尚書都省明年拜宣徽南院使鄜延路經略安撫使判延州龐丞相經略河東與夏人爭麟州界亟築柵於白草公以謂約不先定而亟城必生事遽以利害牒河東移書龐公且奏疏論之一有朝廷二字皆不報巳而夏人果犯邊殺驍將郭恩而龐丞相與其將校十數人皆以此得罪麟府遂警既而公復以疾辭不任邊事且求解宣徽使乃復以為資政殿大學士尚書左丞知河中府遂徙河南公前在河南踰月而去河南人思之聞其復來皆歡呼逆于路惟恐後其卒也皆聚哭公享年五十有五以嘉祐三年四月十五日一作乙卯卒于位一有以聞二字詔輟朝一日曽祖諱進忠贈太師妣陳氏吳國太夫人祖諱諒贈中書令妣葛氏越國太夫人父諱待問官至禮部侍郎贈太保妣李氏楚國太夫人娶王氏太原郡夫人子男十人安度安矩安素皆太常寺太祝安常大理評事安正安本安序皆祕書省正字安厚太常寺奉禮郎安憲安節未仕女三人長適集賢校理韓宗彥次適著作佐郎龐元英皆早卒次適光祿寺丞任逸公在二府時太保公以列卿奉朝請父子在廷士大夫以為榮而公踧踖不安自言子班父前非所以示人以法顧不敢以人子私亂朝廷之制願得罷去不聽天子數推恩群臣子弟公每先及宗族踈逺者至公之卒子孫未官者七人有文集五十卷尤長於論議銘曰顯允吳公有家于閩自我皇考卜兹新原厚壤深泉樂其寬間今公其從公志之安公昔尚少一作少時始來京師挾其二季名發聲馳乃賜之䇿以承帝問語驚于一作天廷有偉其論乃登侍從乃任大臣出入險夷周旋屈伸公所䇿事先其利害𥘉有不從後無不悔公於臨政簡以便人人失一作去而思愈久彌新帝曰廷臣汝剛而直來汝豫用斷余不惑公曰臣愚負薪之憂帝為咨嗟公其少休優以本邦寵其秩祿尚冀公來公卒不復史臣考德作銘幽宅鎮潼軍節度觀察留後李公墓志銘嘉祐五年八月某日鎮潼軍節度觀察留後知澶州軍州事隴西李公得暴疾薨于州之正寢其以疾聞也上方宴禁中為止樂命中貴人馳國醫往視未及行而以薨聞詔輟視朝一日賜其家黃金三百兩贈公感德軍節度使巳而又贈兼侍中太常諡曰某即以其年某月某日葬于開封府開封縣褒親鄉先塋之次公諱端懿字元伯開封人也右千牛衛將軍贈太師尚書令兼中書令隴西元靖王諱崇矩之曽孫連州刺史贈太師諱繼昌之孫鎮國軍節度使駙馬都尉贈尚書令兼中書令許和文公諱遵朂之子母曰齊國獻穆大長公主太宗之女真宗之妹今天子之姑屬親而尊禮秩崇顯其淑德美問彰于內外而和文公好學不倦折節下士喜交名公卿一時翕然號稱賢尉故李氏之盛受寵三朝而天下之士不侈其榮而樂道其德公為冡子於其家法習見安行不待教告少篤學問長而孝友喜為詩工書畫至於隂陽醫術星經地理無所不通七歲為如京副使歷文思副使供備庫使洛苑使新州刺史康懷二州團練使濟州防禦使坐知冀州失捕妖人降授單州團練使知均州未行改滑州兵馬鈐轄居歲中遷汝州防禦使蔡州觀察使天子祀明堂推恩徙華州觀察使獻穆大長公主薨起復為鎮國軍節度觀察留後公泣血辭讓願終喪制上不許其讓許其終喪給以全俸服除拜鎮潼軍節度觀察留後纍階金紫光祿大夫勳上柱國爵開國公食邑四千四百户實封九百戶公為兒時上在東宫真宗命公侍研席上尤親愛嘗解方玉帶賜之稍長出入宫禁禮如家人雖燕見語不及私數為上陳朝廷闕失開説古今治亂多所輔益退而未嘗言公既薨得其遺藁之未上者言宗室事甚詳其餘不傳公少自勉勵見士大夫有失節廢義者輒歎曰士起寒苦以學行自名至牽利欲遂亡其所守况驕佚易習而生長冨貴間邪故常惕然痛自刮磨思立名節聞一善士傾身下之而賢士大夫亦樂與之遊以此多得名譽方大長公主在時數欲求外官以自效不可得久之出知冀州為政循法度檢身束下民以不擾歲滿召還𥘉在冀捕妖人李挍挍窮自經死驗得實矣後貝州妖賊王則閉城叛聲言挍在以惑衆公坐貶官巳而則誅城開無李挍者乃還公防禦使又知鄆州安撫京東之西路是歲京東水災民飢流亡公為治室廬發倉廪而流人至者如歸咸賴以全活置弓手馬教其馬鬪皆如精兵治汶陽堤百餘里鄆人遂無水患又知澶州發軍吏之姦者去之流其尤者於逺方然後明軍籍均其勞逸軍中稱平而畏其法始下令捕盜有登鄰屋取一杓者遽置之法以徇於市曰是固足以信吾令由是盜賊屏息公雖以公主子自少居京師常領職事其在三班院尤為稱職三班掌諸使臣功過黜陟而主者皆顯官自重或貴家子食俸廪而已吏得因依為姦而職廢久不省至公始躬治簿書考核虛實賞罰必當後人多遵用其法及出為三州又皆有治狀故雖享年不永不究其所施而士君子皆知其非安於冨貴者也及聞其喪也莫不痛惜焉公自為鎮潼留後十年不遷上以其久也以為寧逺軍節度使公懇辭不拜及其薨也遂贈感德軍節度使公享年四十有八娶郭氏封仁壽郡君先公九年卒贈太原郡夫人西京左藏庫使昌州團練使中和之女子男五人長曰詵供備庫副使次曰諲曰詢皆右侍禁次曰諄曰欣尚幼女四人長適皇姪右屯衛大將軍吉州團練使建安郡公宗保早卒次適祕書丞夏倚次適皇姪左領軍衛大將軍宗景次適皇姪孫右監門衛將軍世逸公平生嘗語其子弟曰吾蒙國厚恩未有以報吾且死冝有遺言毋因以求恩澤及其薨也其家如其言銘曰允矣和文惟時顯人蔚有士譽匪矝帝姻賚其子孫列爵啓國惟公承之克似其德士起寒家驕于滿盈紛其利欲敗節隳名公生盛族赫奕髙明都尉之子天子之甥惟謹惟恭其色不懈聞善如貪在得思戒間亦宴見忠言告猷學而從政有惠三州享其多美獨不遐年髙旌巨節以賁于泉曷又贈之金璫附蟬寵渥名榮一作榮名惟有其實刻詩同藏其固其密居士集卷第三十二熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正王文安公墓銘封曹國一無封字吳正肅公墓銘才識兼茂明於體用一作賢良方正直言極諫上顧一作上稱州故多盜州一作蔡留守司一無守字本邦一作大邦
