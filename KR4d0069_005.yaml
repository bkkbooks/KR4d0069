自京巳西州縣又遭張海郭貌山等劫掠焚燒桂陽監昨奏蠻賊數百人夔峽荆湖各奏蠻賊皆數百人解州又奏見有未獲賊十餘火滑州又聞強賊三十餘人燒却一作劫沙彌鎮許州又聞有賊三四十人劫却椹澗鎮此臣所聞目下盜起之處如此縱橫也此外京東今歲自秋不雨至今麥種未得江淮倫賊之後繼以飢蝗陜西災旱道路流亡日夜不絶似此等處將來盜賊必起是見在者未滅續來者愈一作更多而乾象變差譴告不一於古占法多云天下大兵並起今兵端已動於下天象又告于上而朝廷安恬舒緩兼異常時此臣前狀所謂古之智者能慮未形之機今之謀臣不識已形之禍者也臣聞兩漢之法凡盜賊並起人民流亡天文災異如此等事皆責三公或𬒳誅戮或行黜放今幸陛下仁聖寬慈大臣偶免重責而猶忘忽禍患偷習因循此臣所謂大臣不肯峻國法以繩官吏蓋由陛下不以威刑責大臣者也今見在賊巳如此後來賊必更多若不早圖恐難後悔臣計方今禦盜者不過四事一曰州郡置兵為備二曰選捕盜之官三曰明賞罰之法四曰去冗官用良吏以撫疲民使不起為盜此四者大臣所忽以為常談者也然臣視今朝廷於此四者未有一事合宜伏望聖慈嚴勑兩府大臣問其捨此四事别有何術可為茍無他術則此四事宜早施行臣竊聞州郡置兵冨弼已有條奏其餘三事前後言事者論議甚多伏乞合聚群議擇其善者而行其禦盜四事方今措置乖失極多容臣續具一二一作一條奏取進止論乞主張范仲淹冨弼等行事劄子同前臣伏聞范仲淹冨弼等自𬒳手詔之後已有條陳事件必須裁擇施行臣聞自古帝王致治須待同心叶力之人二字一作者而君臣相得五字一作相與維持謂之千載一遇之難今仲淹等遇陛下聖明可謂難逢之會陛下有仲淹等亦可謂難得之臣陛下既已傾心待之仲淹等亦又各盡心思報上下如此臣謂事無不濟但顧行之如何伏況仲淹弼是陛下特出聖意自選之人𥘉用之時天下巳皆相賀然猶竊謂陛下既能選之未知用之如何耳及見近日特開天章從容訪問親寫手詔督責丁寧然後中外喧然既驚且喜此二盛事固已一作以朝報京師暮傳四海皆謂自來未曽如此責任大臣天下之人延首拭目以看陛下欲作何事一作用此二人果有何能此二人所報陛下果有何能一作欲作何事是陛下得失在此一舉生民休戚繫此一時以此而言則仲淹等不可不盡心展效陛下不冝不力主而行使上不玷知人之明下不失四海之望臣非不知陛下專心鋭志必不自怠而中外大臣且憂國同心必不相忌而沮難然臣所慮者仲淹等所言必須先絶僥幸因循姑息之事方能救數一作今世之積弊如此等事皆外招小人之怨怒不免浮議之紛紜而姦邪未去之人亦須時有讒沮若稍聽之則事不成矣臣謂當此事𥘉尤須上下叶力凡小人怨怒仲淹等自以身當浮議姦讒陛下亦須力拒待其久而漸定自可日見成功伏望聖慈留意終始成之則社稷之福天下之幸也取進止論臺官不當限資考劄子同前臣伏見御史臺闕官近制令兩制并中丞輪次舉人遂致所舉多非其才罕能稱職如昨來蘇紳舉馬端却煩朝廷别有行遣臣謂今兩制之中姦邪者未能盡去若不更近制則輪次所及須令舉人近聞梁適舉王礪燕度充臺官其人以適在姦邪之目各懷愧醜懼其汚染風聞皆欲不就以此言之舉官當先擇舉主臣欲乞今後只令中丞舉人或特選舉主仍見官一作朝班中雖有好人多以資考未及遂致所舉非人者皆為且就資例可入仍乞不限資考惟擇材堪者為之況臺中自有裏行之職以待資淺之人仍乞重定舉官之法有不稱職一有者字連坐舉主重為約束以防偽濫庶幾稱職可振綱紀取進止再論臺官不可限資考劄子同前臣近曽上言為臺官闕人乞不依資限選舉仍乞添置裏行所貴得材可以稱職竊聞近詔宋祁舉人依前只用資一作舊例又未見議復裏行臣竊嘆方今一有大臣二字事無大小皆知其弊不肯更改凡臺官舉人須得三丞已上成資通判此例起自近年然近年臺官無一人可稱者近日臺官至有彈教坊倭一作弟子鄭州來者朝中傳以為笑其臺憲非才近歲尤甚是此例不可用明矣然而寧用不材以曠職不肯變例以求人今限以資例則取人之路狹不限資例則取人之路廣廣之一作廣其路猶恐無人何況專守其狹若使資例及者入三院未及者為裏行又於差除都不妨礙況今四方多事之際揚威出使正要得人臣今欲乞特降指揮令舉官自京官已上不問差遣次第惟材是舉使資淺者為裏行資深者入三院臣見前後舉臺官者多徇親戚一作舊舉既非材人或問之則曰朝廷用資限致别無人可舉今若革此繆例責其惟材是舉則不敢不舉好人所冀漸振臺綱免取非笑取進止論京西官吏非人乞黜按察使陳洎等劄子同前臣竊見去年五月詔勑節文諸路轉運並兼按察使或貪殘老昧委是不治者逐處具狀聞奏若因循不切按察致官吏貪殘刑獄枉濫民庶無告朝廷察訪得知並當勘罪重一作嚴行黜降竊見近日賊人張海等入金州劫却軍資甲仗庫蓋為知州王茂先年老昏昧所以放賊入城及張海等到鄧州順陽縣令李正已用鼓樂迎賊入縣飲宴留賊宿于縣廳一作廨恣其劫掠其李正已亦是年老昏昧之人京西按察使陳洎張忭自五月受却朝廷詔書後半年內並不按察一人如王茂先李正己並顯然容芘不早移換致得一旦賊至不能捍禦及光化軍韓綱在任殘酷致兵士作亂亦不能早行覺察其陳洎等故違詔書致興盜賊並合依元降詔勑重行黜降中書又不舉行使國家號令棄作空文天下禍亂貽憂君父蓋由上下互相蒙庇之罪也其陳洎張忭伏乞依詔勑施行重與黜降若明降詔勑顯有違者並不舉行則今後朝廷號令徒煩虛出伏望出於聖斷以警後來取進止再論陳洎等劄子同前臣近曽上言為京西轉運使陳洎張忭違廢詔書並不按察部下官吏致使盜賊縱橫貽憂君父其陳洎等合坐此罪名重行黜降此事非是臣自生狂見敢有妄言乃是朝廷元降詔書內指揮自合行遣今諸路轉運使不按察官吏者甚衆然别不至大段生事及部內官吏不甚昏老者亦可且示優容如陳洎等部內顯然官吏昏老貪殘並不舉劾致得盜賊並起事勢可憂此若不行則國家詔勑乃是空文今後號令有誰肯聽臣伏見近日頓易諸路轉運方思改作欲除舊弊朝廷此後政令須要必行今若自廢詔書示人無信則新轉運見朝廷先自弛廢言不足聽一作信則更無稟畏必效因循虛煩更張必不濟事古人於作事之𥘉尚或借人行法況洎等首自違犯理合舉行冝於革弊之𥘉先行勵衆之事或謂洎等於少人之際且要任使即乞各與降官依舊差遣以責後效徐議復資亦使過之術也尚慮議者謂淮南王倫賊後不曽行遣轉運蓋淮南新授詔書未及按察而賊已卒至又部內官吏如朝仲約等本非昏老不比京西慢賊經年不能剪滅直至飬成凶勢又其一作洎等部內官吏顯是昏老誤事之人授詔半年故違不舉較其事體與淮南不同今若以淮南不曽行遣便捨洎等不問則今後犯者又指洎等以為例是則朝廷命令永廢不行伏惟陛下聰明睿斷惟是則從尚恐大臣務收私恩不顧國體若能不惜暫降洎等一兩資一作員官存取朝廷綱紀以勵中外則庶幾國威復振患難可平取進止論舉館閣之職劄子慶曆三年臣伏見國家近降詔書條制館閣職事有以見陛下慎於名器漸振紀綱然而積弊之源其來已久僥幸之路非止一端今於澄革之𥘉尚有未盡其甚者臣竊見近年外任發運轉運使大藩知州等多以館職授之不擇人材不由文學但依例以為恩典朝廷本意以其當要劇之任欲假此清職以為重然而授者既多不免冒濫本欲取重人反輕之加又比來館閣之中太半膏粱之子材臣幹吏羞與比肩亦有得之以為耻者假之既不足為重得者又不足為榮授受之間徒成兩失臣欲乞今後任發運轉運知州等更不依例帖職若其果有材能必欲重其職任則當升拜美官優其秩祿況設官之法本貴量材隨其器能自可升擢豈必盡由儒館方以為榮一臣竊見近年風俗澆一作偷薄士子奔競者多至有偷竊他人文字千謁權貴以求薦舉如丘良孫者又有廣費資財多寫文册所業又非絶出而惟務干求勢門日夜奔馳無一處不到如林槩者此二人並是兩制臣寮奏乞召試內丘良孫近雖押出而林槩已有召一作得試指揮舊來本無兩省以上舉館職明文尚猶如此奔競今若明許薦人則今後薦者無數矣臣欲於近降詔書內兩省舉館職一節添入遇館閣闕人即朝廷先擇舉主方得薦人仍乞别定館閣合存員數以革冗濫一臣竊見近降詔書不許權貴奏廕子弟入館閣此蓋朝廷為見近年貴家子弟濫在館閣者多如吕公綽錢延年之類尤為荒濫所以立此新規革其甚弊臣謂今後膏粱子弟既不濫居清職則前已在館閣者雖未能沙汰尚須裁損欲乞應貴家子弟入館閣見在人中若無行業文詞為衆所知則不得以年深遷輔龍圖昭文館并待制修撰之類所貴侍從清班不至冗濫奏議卷第五論李昭亮劄子北面一作北鄙才過便不復留意使字下一有休字今秋用三字作差悔何及之一作悔之何及論乞主張范仲淹冨弼劄子亦又一無又字伏一作爾力主此字下一有張字必不自怠一作不自懈怠而沮難一無此三字論臺官劄子資限選舉限一作考起自一作蓋自用資限一作限以資考論京西官吏非人劄子逐處一作逐旋並當一作當為並合一作自合論舉館閣之職劄子轉運一有使字所業一作事業館閣闕人閣一作職患孤寡一作陋是非誰證驗嘗欣同好惡遂乞指瑕玷反蒙華衮褒如譽嫫毋豔救非當在早已暴一作暴惡何由斂苟能哀廢痼其可惜針砭風舲或許邀湖緑方灩灩蟲鳴葉落秋水冷衆鳥聲已停隂氣入墻壁百蟲皆夜鳴蟲鳴催歲寒唧唧機杼聲時節忽已换壯心空自驚平明起照鏡但畏白髮生奉答子華學士一作答韓絳安撫江南見寄之作一本無下四字百姓病已久一言難遽陳良醫將治之必究病所因天下久無事人情貴因循優遊以為髙一作政寬縱以為仁今日廢其小皆謂不足論明日壞其大又云力難振旁窺各隂拱當職自逡巡歲月濅隳頽紀綱遂紛紜坦坦萬里疆蚩蚩九州民昔而安且冨今也迫以貧疾小不加理浸淫將遍身湯劑乃常藥未能去深根針艾有竒功暫痛勿吟呻痛定支體胖乃知針艾神猛寬相濟理古語六經存蠹弊革僥幸濫官絶貪昏牧羊而去狼未為不仁人俊乂沉下位惡去善乃伸賢愚各得職不治未之聞此説乃其要易知行每艱遲疑與果決利害反掌間捨此欲有為吾知力徒煩家至與户到飽飢而衣寒三王所不能豈特今所一作獨今為難我昔忝諌列日常趨紫宸聖君堯舜心閔閔極憂勤子華當來時玊音耳嘗親上副明主意下寬斯人屯江南彼一方巨細到可詢一作論諭以上恩德當冬反陽春吾言乃其槩豈一作非止一方云送張洞推官赴永興經略司一本云送張推官掌機冝自古天下事及時難必成為謀於未然聰者或莫聽患至而後圗智者有不能未逺前日悔可為來者銘熙熙彼西人老死織與耕狂羝一作氐一朝叛烽火四面驚用兵五六年首惡竟逃刑仰賴天子聖乾坤量包并苗頑不率德舜羽舞于庭謂此雖異類有生亦含情藩籬𬒳觸突譬若豨與羚馴擾以芻豢可呼隨指令稱藩效臣職冠帶復人形四海得休息瘡痍肉新生敢問前孰失恃安而弛兵酒肴為善將循默乃名卿慮患謂生事髙談笑難行一方兵遽起愚智共營營上煩天子仁旰食憂吾氓謀議及臺皂幽棲訪巖扄小利不足為涓流助滄溟大功難速就倉卒始改更徒自益紛擾何由集功名乃知深逺畫施設在安平今也實其時鑑前豈非明嚴嚴經略府樽爼集豪英千營飽而嬉萬馬牧在坰相公黃閣老與國為長城張子美而秀文章博群經從軍古云樂知已士所榮感激報恩義當來請長纓寄聖俞一作因馬察院至云見聖俞於城東輒書長韻奉寄凌晨有客至自西為問詩老來何稽京師車馬曜朝日何用擾擾隨輪蹄面顔憔悴暗塵土文字光彩垂虹霓空腸時如秋蚓叫苦調或作寒蟬嘶語言雖巧身事拙捷徑耻蹈行非迷我今俸祿飽餘賸念子朝夕勤鹽虀舟行每欲載米送汴水六月乾無泥乃知此事尚難必何況仕路如天一作丹梯朝廷樂善得賢衆臺閣俊彥聮簮犀朝陽鳴鳯為時出一枝豈惜容其棲古來磊落材與知窮達有命理莫齊悠悠百年一瞬息俯仰天地身醯雞其間得失何足校況與鳬騖爭稗稊憶在洛陽年各一作各年少對花把酒傾玻璃二十年間幾人在在者憂患多乖睽我今三載病不飲眼眵不辨騧與驪壯心銷盡憶間處生計易足才𬞞畦優遊琴酒逐漁釣上下林壑相攀躋及身強一作壯健始為樂莫待衰病須扶擕行當買田清潁上與子相伴把鋤犂有馬示徐無黨吾有千里馬毛骨何蕭森疾馳如奔風白日無留隂徐驅當大道步驟中五音馬雖有四足遲速在吾心六轡應吾手調和如瑟琴東西與南北髙下山與林惟意所欲適九州可周尋至哉人與馬兩樂不相侵伯樂識其外徒知價千金王良得其性此術固巳深良馬須善馭吾言可為針天辰天形如車輪晝夜常不息三辰隨出沒曽不差分刻一本有其行一何勤乾健貴於易兩句北辰居其所帝座嚴尊極衆星拱而環大小一作小大各有職不動以臨之任德不任力天辰主下土萬物由生殖一動與一靜同功而異域惟王知法此所以治萬國再和聖俞見答兩畿相望東與西書來三日猶為稽短篇投子譬瓦礫敢辱報之金裊蹄文章至寶𬒳埋沒氣象往往干雲霓飛黃伯樂不世一作並出四顧驤首空長嘶嗟哉我豈敢一作能知子論詩一作經賴子𥘉指迷子言古淡有真味大羹豈須調以虀憐我區區欲強學跛鱉曽不離汙泥問子𥘉何得臻此豈能直到無階梯如其所得自勤苦何憚入海求靈犀周旋二紀陪唱和凡翼每並鸞皇棲有時爭勝不量力何異弱魯攻強齊念子京師苦憔悴經年陋巷聽朝音潮一作晨雞兒啼妻噤一作嘻午未飯得米寧擇秕與稊石上紫豪一作毫家故有剡藤瑩滑如玻璃追惟平昔念少壯零落生死嗟分睽一揮纍𥿄恣奔放駿一作有若駕駱仍驂驪腹雖枵虛氣豪橫猶勝諂笑病夏畦名聲不朽豈易得仕宦得路終當躋年來無物不可愛花發有酒誰同擕問我居留亦何事方春苦旱憂民犂感春雜言一本題下有和吕公著鳩鳴兮屋上雀噪兮簷間百鳥感春陽有如動機關雄雌相呼和日夕聒聒不得間砌下兩株樹枯條有誰攀春風一夜來花葉何班班乃知天巧奪人力能使枯木生紅顔奈何人為萬物靈不及草木與飛翾自從春來何所覺但怪睡美不覺白日髙南山行逢百花不著眼豈念四氣如回環却思年少憶一作念前事雖有駔駿難追還奈何來日尚可樂曽不勉強相牽扳渌酒如春波黃金為誰慳人生一世中一步一作笑百險艱俟河之清不可得聊自歌此譏愚頑廬山髙贈同年劉中允歸南康廬山髙哉幾千仭兮根盤幾百里嶻然屹立乎長江長江西來走其下是為揚瀾左里一作蠡兮洪濤巨浪日夕相舂撞雲消風止水鏡淨泊舟登岸而逺望兮上摩青蒼一作雲霄以暗靄下壓后土之鴻厖試往造乎其間兮攀緣石磴窺空谾千巖萬壑響松檜懸崖巨石飛流淙水聲聒聒亂人耳六月飛雪灑石矼仙翁釋子亦往往而逢兮吾嘗惡其學幻而言哤但見丹霞翠壁逺近映樓閣晨鍾暮鼓杳靄羅幡幢幽花野草不知其名兮風吹露濕香澗谷時有白鶴飛來雙幽尋逺去不可極便欲絶世遺紛痝羡君買田築室老其下插秧盈疇兮釀酒盈缸欲令浮嵐暖翠千萬狀坐卧常對乎軒窗君懷磊砢有至寶世俗不辨珉與玒策名為吏二十載青衫白首困一邦寵榮聲利不可以苟屈兮自非青雲白石有深趣其氣兀硉何由降丈夫壯節似君少嗟我欲説安得巨筆如長杠送徐生一作徐無黨之澠池河南地望雄西京相公好賢天下稱吹噓死灰生氣焰談笑暖律回嚴凝曽陪樽爼𬒳顧盻羅列臺閣皆名卿一作才能徐生南國後來秀得官古縣依崤陵腳靴手板實卑賤賢俊未可吏事繩擕文百篇赴知已西望未到氣已增我昔初官便伊洛當時意氣尤驕矜主人樂士喜文學幕府最盛多交朋園林相映花百種都邑四顧山千層朝行緑槐聽流水夜飲翠幕張紅燈爾來飄流二十載鬢髮蕭索垂霜冰同時並遊在者幾舊事欲説無人應一作譍文章無用等畫虎名譽過耳如飛蠅榮華萬事不入眼憂患百慮來填膺羡子年少一作少年正得路有如扶桑𥘉日升名髙埸屋已得俊世有龍門今復登出門相送親與友何異籬鷃瞻雲鵬嗟吾筆硯久已格感激短章一作章句因子興葛氏鼎一本有歌字大河昔決東南流蕭條東郡今遺湫我從故老問其由云古五鼎藏髙丘地靈川秀草木稠鬱鬱佳氣蒸常浮惟物伏見數有周祕藏竒怪神所搜天昏地慘鬼哭幽至寶欲出風雲愁蕩搖山川失維陬九龍大戰驅蛟虬剨然岸裂轟雲驫滑人夜驚鳥嘲啁婦走抱兒扶白頭蒼生仰叫黃屋憂聚徒百萬如蚍蜉千金一掃隨浮漚天旋海沸動九州此鼎始出人間留滑人得之不敢收竒模古質非今侔器大難用識者不以示世俗遭揶􅮈明堂會朝饗諸侯饔官百品供王羞調以五味烹全牛時有用捨吾無求二三子學雕琳球見之始驚中歎愀披荒斫古爭窮搜苦語難出聲咿嚘馬圗出河龜一作龍負疇自古怪説何悠悠嗟吾老矣不能休勉強作詩慙效尤太白戲聖俞一作讀李白集效其體開元無事一作太平二十年五兵不用太白間太白之精下人間李白髙歌蜀道難蜀道之難難於上青天李白落筆生雲煙千竒萬險不可攀却視蜀道猶平川宫娃扶來白已醉醉裏詩成醒不記忽然一作來乘興登名山龍咆虎嘯松風寒山頭婆娑弄明月九域塵土一作下看塵世悲人寰吹笙飲酒紫陽家紫陽真人駕雲車空山流水空流花飄然已去凌青霞下看一作堪笑區區郊與島螢飛露濕吟秋草邊户家世為邊户年年常備胡兒僮習鞍馬婦女能彎弧胡塵朝夕起虜騎蔑如無邂逅輒相射殺傷兩常俱自從澶州盟南北結歡娛雖云免戰鬪兩地供賦租將吏戒生事廟堂為逺圗身居界河上不敢界河漁梅聖俞寄銀杏一作和聖俞銀杏見寄代書之什鵝毛贈千里所重以其人鴨腳雖百箇得之誠可珍問豫得之誰詩老逺且貧霜野摘林實京師寄時新封包雖甚微採掇皆躬親物賤以人貴人賢棄而淪開緘重嗟惜詩以報殷勤與子華原父小飲坐中寄同州江十學士休復歲晚忽不樂相過偶乘間百年才幾時一笑得亦艱有酒醉嘉客無錢買嬌鬟問豫官何為侍從聮朝班朝廷多賢材何用蒯與菅白髮垂兩鬢黃金腰九環奈何章綬榮飾此木石頑於國略無輔有慙常在顔幸蒙二三友相與文字間江子獨捨我一作是髙鴻去難攀秋風動沙苑郡閣當南山吟詠日多暇詔條寬可頒寒雲雪一作暮紛糅幽鳥春綿蠻勝事日向好思君何時還𫐠懷歲律忽其周隂風慘遼敻孤懷念時節朽質驚衰病憶始來京師街槐緑方映清霜一以零衆木少堅徑物理固如此人生寧久盛當時不樹立後世猶譏評顧我實孤生飢寒談孔孟壯年猶勇為刺口論時政中間蒙選擢官實居諫諍豈知身愈危惟恐職不稱十年困風波九死出檻穽再生君父恩知報犬馬性歸來見親識握手相弔慶丹心皎雖存白髮生一作日已迸慙無羽毛彩來與鸞皇並鎩翮追羣翔孤唳驚衆聽嚴嚴玉堂署清禁肅而靜職業愧論思文章慙誥命厚顔難久居歸計無荒徑偷間就朋友笑語雜嘲詠歡情雖索寞得酒猶豪橫羣居固可樂寵祿尤難幸何日早收身江湖一漁艇和劉原父澄心𥿄一作奉賦澄心堂𥿄君不見曼卿子美真竒才久已零落埋黃埃子美生窮死愈貴殘章斷藁如瓊瑰曼卿醉題紅粉壁壁粉已剝昏煙煤河傾崑崙勢曲折雪壓太華髙崔嵬自從二子相繼沒山川氣象皆低摧君家雖有澄心紙有敢下筆知誰哉宣州詩翁餓一作飢欲死黃鵠折翼鳴聲哀有時得飽好言語似聽髙唱傾金罍二子雖死此翁在老手尚能工翦裁奈何不寄反示我如棄正論求徘詼嗟我今衰不復昔空能把卷闔且開百年干戈流戰血一國歌舞今荒臺當時百物盡精好往往遺棄淪蒿萊君從何處得此𥿄純堅瑩膩卷百枚官曹職事喜一作樂間暇臺閣唱和相追陪文章自古世不乏間出安知無後來居士集卷第五熙寧七年秋七月男發等編定紹熙二年三月郡人孫謙益校正答原父蕭蕭一作肅肅嘗欣一作常欣答子華濫官一作庸下寬一作衣寄聖俞俸祿一作祿俸送徐生幕府一作下葛氏鼎轟雲驫雲一作雷太白戲聖俞龍咆石本作跑九域石本作擾擾空山石本作山中下看石本作視澄心紙空能一作徒能書簡卷第五歐陽文忠公集一百四十八與劉侍讀原父嘉祐二年某啓專介辱書承此嚴寒為政外尊體休𥙿實慰企想某以衰病當此煩冗巳三請江西要在正𥘉必可得艤舟亭次寓目平山奉賢主人清論豈不豁然哉伏冀為時自愛又嘉祐四年某啓愚家所藏集古録嘗得故許子春為余言集聚多且久無不散亡此物理也不若舉取其要著為一書謂可傳久余深以其言為然昨在汝隂居間遂為集古録目方得八九十篇不徒如許之説又因得與史傳相參驗證見史家闕失甚多其後來京師遂不復作適因尋撿少書籍發篋得其故本謹以奉呈庶知所謂黑鬼者雖老鈍之人媚著然亦不為無益也家無他本幸看畢見付某再拜又某啓區區久踈謁奉辱誨承示千文甚佳多感多感或云此是李靖字唐人集為千文不知如何也又嘉祐二年某啓前承示以蜀素俾寫孝經一章書之墨不能染尋將家所有者試之亦然遽命工匠治之終不堪用豈其未得其法耶幸令善工精治之使受墨可書當為汙以惡書也紏察題名不罪以間事聒耳皇恐皇恐又此帖綿吉本誤作與蘇子容某啓暖甚果復作隂嘉節豈遂為雨邪建寧物論益喧當制之人必𬒳收理後日之遊且不欲往幸為致意人事之難乃爾烏絲欄依前書不染墨今納還當以澄心紙試書一章塞命也金櫻煎謹送却乞真牛膝一二束為聖俞處所得不多爾又此帖綿吉本誤作與蘇子容某啓時色可愛不廢佳節之會謂當得同一笑而原父獨不往人事難得如意固常如此邪得介甫新詩數十篇皆竒絶喜此道不寂寞以相告詩軸俟看了馳上適因悶睡起奉答不謹又此帖綿吉本誤作與蘇子容某啓昨日辱寵和惡詩豈勝感服屬上馬赴西園不時為答前偶拜聞家居未必不佳此語復何所疑蓋為泥濘中逺赴官會未必若家居清淨然而郊外少車馬雖雨無泥甚不為勞而物色晴妍深可愛雖病夫亦動念又思家居未必佳也昨日頗歡飲酒差多今日病適方睡起謹此咨報又嘉祐四年某啓昨日奉見後遂之北李園池見木隂蔥翠節物已移而原父獨不在但終席奉思加以風沙益可憎爾輒此奉報前承要介甫詩謹以咨呈其一二篇不當傳者特為剪去之矣恐知又同前某啓數日不奉見餘暑頗甚伏惟起居佳勝昨日羣牧特會以熱中飲冷過多偶為腹疾兼以少幹故遂且在告秖三兩日當即出參特煩問念感愧曷已乾燥非常何時可飲未嘗如此寥落也人還謹啓為謝又同前某啓特辱問念感愧曷已某腹疾猶未平衰年已覺難支以不敢常食遂且在告熱藥不敢多服惟晨起一服爾蓋自家常服者已頑無效冀新功爾承教當節之也亦聞梅二不安方欲致問又同前某啓承出城勞頓晚來喜佳𥙿拙疾特辱問念感愧曷已自夜來益注泄今旦薾然遂召張康診云熱中傷冷當和隂陽偏用執藥所以難效遂以黃連乾薑之類為散服之近午差定亦戲家人云近日人脆事須過防昨日得聖俞簡云小小傷冷然用徐青乃俚巷庸工爾此公多艱滯更當愼攝今須馳問之也精神稍復承見問不覺書多聊代面話又嘉祐五年某啓辱問以嬰兒未安勞神然當更審愼藥食有張萬回太保者其術又精第難呼爾不憚殷勤召之也某今日不入正為凌晨稍涼為江氏作志幸語其家勿相煎兹事安敢奉誤旦夕當得以方牽強不能悉又同前某啓承見諭某為之翰家遣僕坐門下要志銘所以兩日不能至局大熱如此又家中小兒女多不安更為人家驅逼作文字何時免此老業東齋雖狹若心無事可以坐致清涼健羡華事十六日定力當奉見併得敘盡所聞也人還謹此又嘉祐四年某啓熇然炎燎中方不知所以逃生忽辱寵示佳作強起疾讀其為清快難以言傳然賦無屬和之理但當卧誦以代飲冰咀雪爾某兩日為伯庸趂了志文蓋其葬日實近恐誤他事然其為苦不可勝言間思冝為劉義所誚然自此當絶筆雖不能如俚俗斷指刺環邀於鬼神以自誓然當痛自懲艾兹時之勞也方執筆得少風稍清故能忉忉不宣某再拜又嘉祐五年某啓適歸自外捧惠佳篇豈勝欣感偶然之會雖草率而縛於文字遂為他時故事兹敢不勉也然西齋素患寂寞近方稍葺而原父去此稍逺此俗所謂事無恰好也又同前某啓自原甫既西雖不為官制所拘朋遊亦自寂寞況遂當憂責履畏塗其為情況可知偶思春物將動故都多佳致為樂豈復可涯汩沒聲利惟溺惑者不勝其勞而但見其樂粗有識知兼以衰病此事難為他人道獨不知原甫諒之否因風幸數垂問以慰瞻企又嘉祐六年某啓自春首以來兒女輩疾病日益憂煎自顧無輔於時而衰病日增咎責四至其何以堪之惟思春物爛然故都遺勝不可勝覽而公專有之猶恐猒飫所見不以難得為惜也須知有不可得之者也賢弟亦稀相見蓋難得盡從容之適爾公自至鎮一嘗辱問遂絶惠音不知何嫌遽爾見踈也西齋塵土無復人迹偶因連日假故試尋筆研略布此誠以此亦可見其為貺真迹用此貺字也其他俗事可憎不復多道但布瞻企之勤爾氣候猶未和暢不知西路如何惟為國自愛某祗拜𥘉望西物甚衆今寸紙一字不可得況南山竹萌之類耶至於新詩醉墨並棄前約無乃太甚乎又與前帖相類疑是稿本今兩存之某啓自春以來苦兒女輩疾病憂煎百端遂闕馳問然亦怪久不承惠音不審何嫌遽見斥外始望西州之物甚衆今一言寸紙猶不可得況於其他乎某老拙無堪自顧恐終無所為以輔萬一而衰病日增咎責四至其將奈何春物爛發故都遺迹不可勝覽但恐猒飫朝夕不以難得為可惜須知有羡而不可得者爾賢弟亦稀相見蓋不能得如往日與諸賢忘形取適爾西齋塵土無復人迹幸連日假故略得少布區區然公方享清間之樂不冝無暇於故人也其他俗事薄惡可不挂耳惟向暖多愛以慰傾企得子華書言西去當於陜雍留連果能如此否手指拘攣又添左手兩目僅辨物其餘可知又同前某頓首啓近寬恤王職方行嘗得附狀然亦久不承惠問春候猶寒不審動履何似但深瞻詠前日崇政賜進士第見賢郎在髙等伏惟喜慰某巳衰病三四小子未有能獲薦于有司者見之尤所羡慕賢郎程文甚工為都人傳誦及第等雖髙而人猶以為未稱然少年微抑于此未必不為逺大之本也謹專致此為賀不宣某再拜原父安撫侍讀閣下三月十一日又同前某啓久不奉狀蓋欲俟賢郎歸而賢郎未歸遂以稽緩然亦未嘗辱書不審經暑動履何如但西州人士之來者日載政聲盈于都下使嫉善之言不勝公議聊俾下交快釋其餘存之逺大竊計髙明必不校闕於屑屑也餘復何言盛熱為時自重謹因賢郎歸奉此咨問不宣某再拜六月草一日謹狀又同前某區區於此忽復半歲思有所為則方以妄作紛紜為戒循安常理又顧碌碌可羞不知何以教之哀其不逮實有望於公為多也至於常檢拘攣野率之性尤以為苦然勢難輕動甫及年歲得去為幸也蔡君謨自南歸皤然一叟相見惟互相驚歎而已西齋自去冬逮今遂不復啓其他可知也故都多登臨之勝新詩醉墨時以為惠以忘俗惡之態於理似未為害不知何避而何嫌鄙懷千萬居常思欲巨細布之臨紙則復茫然惟慎夏愛護又同前某承見教以用快大過此誠中其病然平日所常患衆君子多以為言者也若任責至重未知所為此有望於公者𥘉未蒙賜也至於簡事為實為政之大要此西人所以蒙惠也若曰外名迹自古聖賢所難莊生之名卓然見於後世若使無迹後世學者何從而師法之蓋莊生之名以彼周孔之名以此皆不能出名迹之外者第不當汲汲以求之爾不相見久聊此當握手一笑不罪不罪前日餞聖從與景仁介甫清坐終日奉思之外惟以鮮歡相顧屢歎而巳恐知其近況故輒及之公來歸未期惟時得數字猶足以為慰豈以無事為煩邪又同前某啓薛金部自西來辱惠以書承經寒體履清安兼得詳問動止併以為慰今歲京師寒甚衰病之軀尤所不堪承諭間閣無為豈亦苦於寒耶春物將動竊思登臨之樂何有窮涯因人時枉問冝道一二偶薛人還聊奉此不宣某再拜十一月二十日又嘉祐七年某啓春氣暄和伏惟鎮撫之餘履況清適某以衰殘勉強有勞無益公職曠廢私事不修不獨於書記為闕也緬懷故都風物之佳當此陽春暢發之盛臨觴覽勝冝不為猒蓋以賢人在外公議難安一日來歸遂不復得爾此外惟以時為國自愛謹奉狀不宣某手狀上二月十二日又同前某啓自過年便欲奉狀只俟薛司勳歸薛既以事滯留遂成稽殆但時見賢弟詗問動靜以慰懷爾薛君留此屢相見粗悉疲病區區所為及其耳目所得歸必能具道更不煩言惟的便無佳物表信蓋西州所闕惟南味得春多壞不堪寄逺當俟新茶馳獻爾春旱極闊知陜西尤甚奈何奈何保重保重某頓首又同前某啓賈常行嘗附狀辱書承經暑動履康和兼蒙惠以韓城鼎銘及漢博山槃記二者實為竒物某集録前古遺文往往得人之難得自三代以來莫不皆有然獨無前漢字每以為恨今遽獲斯銘遂大償其素願其為感幸自冝如何屬患膝瘡家居絶客無人為識古文故苐於郵中粗報已受二銘之賜篆畫當徐訪博識尋繹續得附致其餘區區萬不述一大熱慎護以副瞻勤清水安能久滯耶實負愧也又司前某啓昨賢弟行嘗奉狀屬合宫大禮前後事叢遂闕致問昨日進奏院送九月十五日所寄書竊承動履清勝兼復惠以古器銘文發書驚喜失聲群兒曹走問乃翁夜獲何物其喜若斯信吾二人好惡之異如此安得不為世俗所憎邪其窮逹有命爾求合世人以取恱則難矣自公之西集古屢獲異文并來書集入録中以為子孫之藏也幸甚幸甚歲律漸寒惟為時自重又同前某啓近嘗兩奉狀專人至辱書竊審經寒體履安和兼沐寄惠穌梨新笋豈勝珍荷自去冬以來親舊私信一皆謝絶獨思公有所惠理可無嫌又聞近申貢餘之禁則應少費宅庫如此屢寄益無疑也節中人事紛紛使還為謝不謹不宣某再拜原甫經略侍讀執事十一月一日與蔡忠惠公君謨某啓辱惠櫻寧翁墨多荷多荷佳物誠為難得然比他人尚少其二幽齋隙寂時點弄筆硯殊賴於斯雖多無厭也煩聒計不為嫌矣諸留靣敘又嘉祐八年八月某啓前夕承惠紅絲硯誠發墨若謂勝端石則恐過論然其製作甚精真為几格間佳物也昨日以有文書不敢致簡為謝李敡還又承惠水清泉香餅數十枚聊報厚貺吾儕日以此等物為事更老應當淡死租庸遂更作一程無由頻面聊當一笑歐陽修頓首白三司給事草九日謹狀又治平二年二月某啓遂爾大暄不審氣體何似承已對謝應已漸治裝無由詣前日劇瞻企荔支圖巳令崔慤傳寫自是一段佳事碑文好者前巳倒篋今又於柬退中得此數十本勒李揚送上因出過門為幸不宣某頓首君謨端明侍郎二十六日與范忠文公景仁治平四年某啓專人辱書伏承春暄體候清福某蒙恩許解重任得亳便私其為優幸不可勝𫐠其他喧詉中外所聞大略秖如此故不待煩言惟繫舟府下一見主人而過粗釋瞻思之懇為足矣人還姑此布謝與常待制夷甫嘉祐治平間某啓相別之久書問雖闕而思慕盛德未嘗少忘于心不審即日體候何似向蒙寵示盛文一編究味意趣殊發蒙陋珍玩祕藏未曽暫釋續更有新作苟賜不鄙無外開示至幸至幸深冬為道自愛又某相別纍年書問雖闕而思慕盛德未嘗一日而忘于心不審即日體履何似某碌碌于此國恩未報而衰病日侵進無少輔於時退未得幅巾閭巷以從有道君子豈勝區區深寒為道外自愛因小姪行附此又治平四年某前日承枉顧少接餘論殊不從容朝夕人事稍間當獲𣢾奉未間略布區區茶少許聊助待賔輕浼皇恐又同前某啓嚮在潁區區僅得一二聞餘論雖未厭于心而仁人之言獲益已多矣自藏拙于此習成懶慢遂踈奉問亮須幅巾閭巷杖屨往還始償夙素傾嚮之心爾未間以時為道自重因負棗人行謹奉手狀又熙寧元年某啓少便久踈致問經寒仰惟德履多福某衰病如昨已再請壽陽旦夕有命西歸漸謀休息必得幅巾衡巷以從長者之遊償其素願然後已也未間惟為道自愛又同前某啓到官忽忽巳復窮冬老病踈慵闕於致問雪後清冽體況想佳某幸居僻事簡足以養拙歸心雖切尚少盤桓𣢾晤未期深寒加愛又熙寧二年某啓近小史許充行奉狀粗布區區窮臘隂雪忽復新春竊惟養道燕居動履清福某此忽忽巳數月開春遂尋前請竊謂理盡而無嫌至於幅巾閭巷以從先生長者之遊此實無窮難得之樂爾未間保重以副瞻勤因家兵還謹奉啓又同前某啓守官東州僻在海涘久踈致問徒積傾馳氣候巳寒不審燕居動履何如某勉強衰病遷延榮祿又將及期歲物豐盛盜訟稀簡粗足偷安冬春之交得遂西首獲親長者之遊不勝至樂未間為道愛重又熙寧三年某啓多病踈懶稍闕致問近兒子自潁還云嘗侍杖屨喜承經暑寢興萬福兼審尚以足疾未副召命朝廷禮賢之意甚篤而士大夫延首之望亦勤然君子出處有道足以鎮止奔競敦厚時俗其功利亦多矣某尚未得請未遂相從閭巷之間然亦不過一兩月之頃爾時暑為道愛重又同前某啓霜氣清冷不審燕居動履何似竊承朝旨尚復敦迫出處之際遂為世法必有以果於自信者某纍牘懇至而上恩未俞素願雖稽終當如志瞻仰盛德惟日增勞嚮寒珍重與沈待制邈字子山慶曆三年某啓數日不奉問苦暑非常歲之比少壯者自不能當衰病之人不問可知焉辱教承體氣清安甚慰俗以立秋日卜秋暑多少據今日之勢猶當更猖狂爾然世言春寒秋熱老健為此三者終是不久長之物也介甫詩甚佳和韻尤精看了却希示下又慶曆四年某頓首啓自承拜命欣喜無量而不時馳問者誠以奔走塞下吏事叢委遲鈍不能迎解非敢有懈幸諒幸諒知二十四日出京計日必巳受事某自保塞回及中山巳三日猶須并一作併旬方得拜見他悉靣賦也冬寒千萬保育與王龍圖益柔字勝之嘉祐元年某啓中間辱書承冬凛外體氣清康深慰瞻渴益州張侍郎不久當至衰病區區猶須更旬浹始遂休息因欲請輔江西爾前蒙示諭京東事備悉早出暮歸臨紙忙迫無暇及他惟新陽自愛前削殊不聞有議論奈何奈何又嘉祐年某啓急足至辱書承此𥘉暑體氣清和差慰瞻想所云少朋儔宴處為樂此乃在處皆然何獨濟也京師固多相識然人事區區病患憂煎亦無暇於從容料得常態秖如此也求移能少安之為善會要深欲續送上為付一書吏裝禠遂取不得京師吏人頑慢不言可知勿怪勿怪為兒子久病羸弱非常人還且此為謝又嘉祐年某啓專介辱書承涉夏秋體氣清適暑雨為孽古所未聞救災恤患事匪一端某言不足為人信才不足為時用徒耗廩祿每自咄嗟而巳承見諭實當今之實患也其如言之不見信何他非相見莫盡所懷稍寒惟當以時保嗇又嘉祐二年某啓人至辱書承尚留兖寒凝喜體況清佳杜公清節篤行每恨文字不稱不意勝之見愛如此近亦有一二家作志裴少監家當自寄去明復當歸葬于故里亦可就得之原叔志續當録去會要為此中書吏稽遲又且送五册去不憚頻來取也新詩因人乞數篇亂道亦當録呈深寒公外加愛人還草草又嘉祐五年某再拜昨日巳入省且喜尊候勝常腳瘡遂愈此正是治內之時亦猶冦賊過後講修武備雖非先見亦所以禦後來之患也吾儕相戒言難取信蓋各自須有少病痛爾呵呵然非此無以獻忠幸深思也無由相見聊奉此咨問大熱遂如此衰病不能支入夏便患口齒昨日食數大杏今日腮頰腫痛針刺出血不能常食若此是將奈何奈何又嘉祐八年某啓前日辱訪別但多愧荷以昭陵虞主未還在禮不當飲酒無由會話少時益以為恨承巳登舟節氣遂爾寒凝惟希加愛為禱集古録序鄙文無足采第君謨筆法精妙近時石刻罕有也薄酒四器聊助待賔不罪輕浼皇恐皇恐又治平二年某啓公私忽忽久闕致誠辱書感慰兼審經寒動履清勝京東物俗比二浙殊絶必稍為便然久淹于外此在位者之責而朋友蔽善之罪其何敢逃某竊位于此巳六七年白首碌碌𥘉無輔報而罪責無量謗咎獨歸自春首已來得淋渴疾癯瘠昏耗僅不自支他人視之若不堪處況以殘骸勉強情緒可知久不通問因書輒敢自道勝之知我必見哀憐深寒事外惟冀以時自愛又某啓辱示二詩誦讀數四意趣深逺所謂朋友講習之益正當佩服何謂迂邪然謂賢而能書為不幸又似過之正冝謂不幸與工同其垂名可也因所示乃知平日論議猶有形迹愚拙所短固多幸當賜教可也苟有未然却當相難正如此然後為友益矣姑話及此不罪忉忉又熙寧四年某承見諭詩義晚年迫以多病不能精意苟欲成其素志僅且了却頗多踈謬若得一經啇榷何幸如之間居少人力俟録一二拜呈但慮方居禁職無暇及此也某目足為苦秋深尤劇尚賴休間足以安養餘生之幸與宋龍圖敏求字次道某啓漸暄竊承體履安和旬休日略邀枉顧家餐冀接清話少時必不以容易見罪悚悚又某啓伏承遽有子婦之戚莫遑奉慰豈勝馳情暑鬱方熾更冀為國自重少節悲悼區區瞻祝謹奉手啓咨問又某啓多日不奉見秋冷竊承體氣佳𥙿嘗託裴如晦致懇欲告借少書籍承不為難今先欲借九國史或逐時得三兩國亦善庶不久滯也先假通録謹先歸納煩聒豈勝惶悚與梅龍圖摯字公儀嘉祐二年某啓纍日瞻渴不審尊體何似唱和詩編次得成三卷共一百七十三首亦有三兩首不齊整者且刪去其存者皆子細看來衆作極精可以傳也盛哉盛哉然其中亦有一時乘興之作或未盡善處各白諸公修換也內刑部竹詩欲告公儀更修改令簡少為幸緣五篇各不長故也拙序續呈乞改抹來日拜見與石舍人楊休字昌言某頓首啓自到公私冗迫未得一詣門宇乃辱雅意先以顧臨猶未克敘謝其為感愧何以勝顔手翰見貽副之古刻無限珍佩人還遽此餘當面盡與祖龍學無擇字擇之嘉祐四年某啓自擇之使還未嘗一得欵奉書局之會幸出偶爾遂成鄙句兼邀坐客同賦雖老拙非工而諸君盛作亦聊紀一時之事謹以附遞致誠當擇之西行猶在齋禁不得瞻違實深為恨暑熱道路不審尊候如何惟冀以時自愛與沈內翰文通治平元年某啓辱書承祁寒動履清休少慰瞻企餘杭德政民俗方期歸厚而遽此嚴召然去思遺惠亦足以在人亮須春水方可還朝會見尚遙更冀為時珍嗇答李內翰疑某皇恐頓首再拜啓孟冬漸寒伏惟尊候動止萬福進奏院遞角今日到州伏蒙十八日所賜手書審奉聖恩暫臨近服雖朝廷重違勤請不得已而驟闕左右資訪之助其如凋弊之俗為幸何多某以門下生為幕中吏私願以釋不勝榮輝惟慮車馬未飾已𬒳堅留暫此郡齋即膺召命使下吏愚民徒有企躍依芘之心而不得終蒙大惠爾伏承涓日有期限以職守一無此十七字不獲躬詣界首候迎卑情瞻望激切之至書簡卷第五與劉侍讀第一帖伏冀一作新春第六帖時色一作晴色第十五帖恰好也此下一有承置得懷州牛膝更有盡乞之衰病者遂得取濟於兹物深所望也漏舍冀侍奉見以盡區區第二十帖又别本某啓區區久欲附問日俟賢郎西歸歸甚緩而公私亦自多故然亦未嘗承惠教不審經暑起居如何某待罪于此忽以半歲欲有所為則方以紛紛為戒至於循守常理則又碌碌可羞不知何為而可也必將有以教之雍人蒙福流譽東來聞之竊喜此誠烏足以施為而忌疾方深幸公議猶在也蔡君謨自南歸皤然一叟終日相對清坐無以為樂但烹茶一杯病脾不飲反贈旁人啜爾若此可知其情况也餘事有可竊歎者料世態自常如此無足道也酷暑惟以時為國自愛遂因賢郎行始奉狀不宣某再拜原甫知府侍讀此卷嘉祐六年與劉原甫二書大同小異己兩存之今此本又復相似仍併兩幅為一幅案前輩手牘大率起草今吉州法帖所刻嘉祐末慰冨彥國書稿是也況公於原甫尤致其詳或巳寫復換耶與常待制第一帖第二帖聖宋簡啓以第一帖向蒙寵示盛文至為道自愛十七字續第二帖豈勝區區之下而無深寒為道外自愛因小姪行附此一十三字第七帖清福一作康福與沈待制第一帖為此一作謂此第二帖并旬一作中旬保育一作保愛表奏書啓四六集卷第五歐陽文忠公集九十四辭免青州第一劄子熙寧元年八月九日臣今月八日準樞密院遞到誥勑各一道蒙恩授臣兵部尚書依前觀文殿學士知青州者伏念臣近以疾病衰殘纍上表章陳乞致仕天慈憫惻六降詔書未賜俞允臣以訓諭丁寧不敢更煩睿聽然臣久患腳膝乘騎鞍馬艱難又到任巳踰一年深慮非時别有移替巳具劄子奏陳乞且於亳州將理一二年間若稍獲痊安冀可陳乞敢謂聖恩優異命出非常超轉官資移委大郡再念臣纍年痟渴衆所具知肌體瘦削精神昏耗本以衰羸懼難勉勵遂乞休致今青州所管一路寄任至重實藉幹才以臣居之必至曠敗兼臣所患腳膝道路乘騎鞍馬艱難欲望聖慈特賜矜察許臣且守舊任冀得將理衰殘所有誥勑臣未敢祗受巳送軍資庫寄納今取進止第二劄子熙寧元年八月二十八日臣今月二十七日凖樞密院遞到詔書一道以臣辭免青州恩命所乞冝不允者臣寵惟表海名邦青為重地聖恩優借以寵衰殘豈合固辭上煩宸聽伏念臣情有迫切不能自已者蓋臣近以疾病侵陵心志昏耗方瀝血懇乞從退休陛下曲賜矜憐不忍廢棄丁寧訓諭未賜允俞今則忽𬒳新恩有此遷擢乃是臣乞退休而得進秩方稱疾而領要任則臣嚮所陳請矯激欺詐以要恩寵之罪何以自逃雖天度寬仁未以此責臣而臣之心顔何以自處使臣筋力可以勉強猶當陳述義理必冀獲辭以免清議之責况臣衰病羸悴實如纍表所陳陛下推天地父母之恩未忍廢退且令茍祿養疾於便郡臣已不勝僥幸之慙豈敢更望遷進況亳州於近邦之中尤為善地前後曽任兩府臣寮如陳執中宋庠皆得養疾於此者甚多伏望聖慈憫臣衰病哀臣誠悃俾臣且守舊任更將理一二年間茍其筋力稍完則臣盡瘁薄效豈無犬馬識恩知報之心所有降到詔勑臣不敢祗受見在本州軍資庫寄納伏乞早賜許臣繳納臣無任第三劄子熙寧元年九月臣今月十四日凖樞密院遞到詔書一道以臣辭免青州恩命所辭冝不允及凖中書劄子奉聖旨令臣便受勑告疾速發赴青州本任者伏念臣自去春蒙恩許解重任俾守便郡以養衰殘方及一年忽𬒳恩瀝超轉官資移委藩鎮聖恩眷異便當祗受豈合固辭上煩睿聽臣罪當萬死然念臣義迫情切不能自止者緣臣久患眼目腳膝心志昏耗自懼盈滿乞從休退六蒙詔諭丁寧深至臣上體聖眷殊常未敢固辭再黷方且乞更將理一二年冀少痊安庶可勉強而不圖遽𬒳遷擢之命臣竊思聖恩本以憫臣憔悴加以寵榮以慰臣之衰暮而臣蹇薄羇危不能上副恩眷今進退皆觸於罪戾蓋臣若進而祗受則有連章纍懇矯激欺詐以邀恩寵之罪而其罪大若退而懇辭則有稽違君命煩言屢黷之罪然比於矯詐邀恩則其罪似輕在臣愚計自擇則固當逃大罪而就輕罪臣又竊惟陛下所以保全愛惜臣者至深至厚矣亦必不使臣至於大罪也故臣披瀝肝血不敢避煩言屢黷之誅臣所患眼目腰腳前奏巳具陳𫐠不敢虛矯欲望聖慈於未許臣休致間且令臣守舊任便於將理所有勑告見寄納本州軍資庫稽留君命多日臣曉夕憂惶如履冰炭伏乞早賜許臣繳納臣無任辭轉兵部尚書劄子熙寧元年九月臣近蒙恩除臣兵部尚書移知青州臣巳三具劄子辭免伏奉今月二十五日詔書所辭冝不允者聖恩優異訓諭丁寧便當祗命而行豈合上煩睿聽罪冝誅戮無以自逃然臣懇血之誠猶有不能自巳者伏念臣本以衰羸疾病方乞退休遽兹遷擢義迫難安所以懇祈辭免至於恩典超優遷轉頻數使臣不因疾病乞退亦合懇辭蓋臣近自去春由尚書吏部侍郎轉左丞未逾兩月又超轉三資除刑部尚書今才逾歲又超轉兩資尚書六曹一歲之間超轉其五無功之賞公議豈容此臣所以不避煩言屢黷之罪而上干宸造也然臣已三𬒳詔書慰諭深切進退惶惑不知所措敢不力勉衰殘上副恩眷臣今更不敢辭免青州差遣若得秪守舊官而往庶幾可免矯激邀求之責伏望聖慈察臣悃愊一作迫特許免臣轉官恩命繳納近降誥勑所有青州差勑臣見別候指揮今取進止青州謝上表熙寧元年十月臣某言伏蒙聖慈特授臣兵部尚書依前觀文殿學士知青州軍州事充京東東路安撫使臣巳於今月二十七日赴上訖掌國五兵叨進中臺之秩宣風一面俾綏東土之人祗荷寵靈徒知殞越臣某中謝伏念臣學非通敏材實空踈幸逢千載之休明誤𬒳三朝之獎擢久陪法從嘗與政機國恩未報而身巳先衰世塗可畏而命亦多蹇頃緣災疾遂決退休敢期上惻於皇慈未忍遽捐於舊物而復過推優渥以慰癃殘惟孤拙之無堪蹈艱危一作虞而巳甚世之所榮者臣之所懼人以為寵者臣以為憂是敢輒殫悃愊之誠纍黷髙明之聽迫於危慮罔避煩辭而聖度并容寬其罪戾恩言屢降譬以丁寧知成命之難回勉􅌤顔而祗受而况全齊舊壤負海奧區民俗冨完而鑿井耕田各安其業詔條寬大而奉法守職足以修官內省庸虛奚勝忝幸此蓋伏遇皇帝陛下日新求治天覆推仁謂簮履雖為於賤微尚堪收録而犬馬茍豐於豢養猶可使令臣敢不䇿勵疲羸勤思夙夜庶期盡瘁少答鴻私謝南郊加食邑五百户表熙寧元年十一月紫壇髙峙式薦於精禋皇澤雱流推行於大慶祗膺寵數伏切兢營臣某中謝伏惟皇帝陛下出震膺期繼文興治百度講明於新政群生涵泳於至和乃考舊章聿思報本謂三歲一郊之禮必舉以時俾四海九州之人並受其福遂因景至躬𣢾陽丘萬國充庭其誰敢後六卿聮事各以其官而臣職忝頒條位拘守土執豆籩而祗役罔獲施勞逮輝翟之餕餘遽蒙均惠無功受賞莫遑俯傴之辭盡瘁事君惟誓糜捐之效謝傳宣撫問賜香藥銀合表熙寧二年三月臣某言今月二十五日伏蒙聖慈差入內內侍省西頭供奉官王延慶傳宣撫問仍賜臣香藥一銀合者祗命有嚴瞻天威而不逺撫躬增惕拜君賜以為榮臣某中謝伏念臣本以妄庸幸緣遭際進陪國論莫贊萬機之微出布政條未聞五月之報屬北州之災饉鄰東土之封強皇帝陛下子育黔黎仁深覆載閔扶携而轉徙軫宵旰之焦勞而臣職在撫綏任叨寄委曲煩訓諭備極丁寧仍因使傳之馳特示恩頒之寵臣敢不恪官自警祗事以時惟善是從勉企前人之迹俾民受賜上寬明主之憂謝賜漢書表熙寧二年三月臣某言臣伏蒙聖恩賜臣新校定前漢書一部已於今月日據進奏院遞到臣已祗受訖者俯躬承命拭目生輝臣某中謝竊以右文興化乃致治之所先著録藏書須太平而大備惟漢室上繼三代之統而班史自成一家之書文或舛訛蓋其傳之巳久詔加刋定俾後學之無疑一新方册之文增煥祕書之府而奏篇之始方經衡石之程賜本之榮惟及釣樞之近敢期孤外特與恩頒此蓋伏遇皇帝陛下曲軫睿慈俯矜舊物謂其嘗與臣鄰之列不忍遽遺憐其自喜文字之間俾之娛老然臣兩目皆眊雖嗟執卷之巳艱十襲珍藏但誓傳家而永寶乞壽州第一劄子熙寧二年冬臣輒瀝誠懇上干天聰一作聽臣本以妄庸逢時竊祿寵榮踰分報效無聞頃在亳州嘗以疾病乞從休退聖恩憐憫未忍遽捐纍降詔諭丁寧備至適會東秦闕守誤𬒳選差超轉兩官委以一路臣亦屢陳朽憊既不獲辭便當䇿勵尫疲上副憂寄而臣迫以年齒晚暮近日以來心力俱耗事多健一作廢忘腰腳舊苦拜起艱難兩目氣暈尤更昏然僅分黑白雖勉力支持日虞曠敗兼臣到任巳及一年有餘欲乞就移淮潁間一差遣以便私計伏望聖慈特賜憐憫許差臣知壽州一次冀一作庶就間僻茍養衰殘今取進止第二劄子臣近以疾病乞就移知壽州一次伏奉今月九日詔書冝不允者聖恩優假訓諭丁寧迫以危誠不能自默再煩睿聽罪合誅夷伏念臣舊患眼目巳十餘年又苦渴淋亦五六歲年日加老病日加深睛瞳氣暈侵蝕幾盡腳膝瘦細行步艱難自入今歲以來心神又更昏耗事多健忘動輒差失九州一路寄任匪輕勉強尫殘日虞曠敗況臣貪冒榮寵過分巳多年齒衰遲又復如此理冝量力知止早自退休蓋臣昨在亳州纍陳此懇伏蒙陛下至仁至慈憐憫舊物不忍遽棄屢頒恩詔委曲慰安欲令且更勉勵故臣今者未敢别有陳請秖欲求淮潁之間一便郡茍竊俸祿以盡餘生庶幾上副聖君天地父母舍容養育之恩伏望睿慈特賜矜許今取進止謝擅止散青苗錢放罪表熙寧三年夏臣某言今月二十九日準中書劄子以臣奏乞不依秋料青苗錢事奉聖旨不合不聽候朝廷指揮擅行止散之罪特與放免者有罪必誅是為彛典原情以恕特出深仁聞命驚慚省躬涕泗臣某誠惶誠感伏念臣以一介之微賤荷三聖之獎知寵祿既豐初無報效筋骸巳憊尚此遲徊曲蒙大度之并容誤委一方之寄任職當撫俗責在分憂方兹旰􅉴之勞心豈敢因循而避事昨遇國家新建官司而主計大商財利以均通分命出使之車交馳於郡縣悉發舊藏之鏹取息於民氓而臣方久苦於昏衰𥘉莫詳其利害既巳大喧於物議始知不便於人情亦嘗略陳衆弊之三冀輔萬分之一屬再當於班給顧巳逼於會期雖具奏陳乃先擅止據茲專輒合𬒳譴呵豈謂伏蒙皇帝陛下深軫睿慈俯矜朴拙免從吏議特貸刑章夫何草木之微曲𬒳乾坤之施臣敢不益思祗畏更勵操修戒小人之飾一作遂非希君子之改過冀圖薄效少答鴻私辭宣徽使判太原府劄子熙寧三年四月臣準今月二十九日入內東頭供奉官馮宗道到州傳宣撫問賜臣告勑各一道伏蒙聖慈除臣宣徽南院使判太原府事伏念臣久苦老疾自今春眼目疼痛及渴淋舊疾作腳膝細瘦行步艱難自二月巳來交割却本州公事見今在假將理所有今來恩命優異寄任非輕以臣非才固不敢當兼以久嬰疾病未得痊安見别具奏章陳乞一小郡差遣次所有賜到勑告臣未敢祗受已於青州軍資庫寄納别聽指揮次今取進止同前臣前月二十九日伏蒙聖恩差中使賫賜臣告勑除臣宣徽南院使判太原府事臣尋已具奏陳未敢祗受今輒再瀝危懇上干天聰意迫言煩敢避誅戮伏念臣自至青州忽巳踰歲適值年時豐稔盜訟稀少足以偷安竊祿而臣自以年齒日加衰殘日甚心識昏耗難於勉強以謂一路九州不可常幸於無事每憂緩急有誤寄委所以去冬纍陳衰病乞移一淮潁間小郡未賜允俞之間遂接春陽戒候為風氣上攻眼目驟加昏痛因此服藥過度發動渴淋舊患甚於𥘉得疾時腰腳枯瘦行履艱難自三月後來不免兩次交割却本州公事在假將理百方治療終未痊損敢期於疾一作病告中忽𬒳睿恩有此差遣一作選不惟寵命優異非臣敢當兼以久病淹延筋力難強欲望聖慈曲賜哀憫特許檢會臣前所陳乞於淮潁間移一小郡俾養殘年所有太原重任必難久闕人伏乞别選用人上副憂寄今取進止同前五月一日臣近蒙聖恩除臣宣徽南院使判太原府事續準中書劄子奉聖旨令臣依前降指揮疾速起發仍赴闕朝見訖發赴本任者伏念臣以老疾經春方在病􅖍中忽𬒳此恩命自揣才力難當寄任不敢祗受尋已具辭免仍乞一淮潁間小郡見别聽候朝旨次今取進止同前附馮供奉入奏臣此者伏蒙聖旨除臣宣徽南院使判太原府事特差入內供奉官馮宗道賜臣告勑各一道兼傳宣撫問續準中書劄子奉聖旨令臣疾速起發仍赴闕朝見訖赴任者伏緣臣以非才久病心力衰耗難當擢任之寵兼自春以來疾患久在假告巳於四月二十九日五月一日兩具劄子奏聞辭免恩命至今一無至今二字秖候提點刑獄席汝言到任交割公事别聽朝旨次欲望聖慈矜察早賜允俞今取聖旨同前臣今月二十二日一作二十日準進奏院遞到詔書一道伏蒙聖慈以臣辭免恩命未賜允俞者訓諭丁寧理冝祗受懇誠迫切尚敢煩言伏念臣本以妄庸誤叨器使寵榮踰分福過災生五七年來纏綿疾病嚮蒙聖念許解政機仍與近藩俾從優便臣以髙秩一作爵厚祿非為養病之資竊位素餐難久偷安以處所以決謀休致纍上封章陛下尚以一作念簮履之微曲憐舊物不忍遽棄屢賜安存既又徙一作以東州兼委兵民之任然而雖名一路不係邊防所管九州苦無軍馬加以歲時稍稔盜訟頗稀臣得以偶免曠愆蓋出天幸而臣常竊自念年齒日以嚮暮筋力知不復完與其臨事而后辭不若量分而先止故於一作自去冬再瀝懇私乞一小郡冀就一作稍遷於淮潁得漸近於田廬敢期病告之中忽𬒳優殊之命超轉一作遷時貴職付以極邊使臣未至一作遇衰殘尚非所受而況實難勉疆敢不必辭再念臣自在亳州纍乞致仕殆今三歲矣而口誦退休之言身貪榮進之寵既自違於言行豈不愧於心顔雖聖度之兼容必公議之難遏伏望睿慈曲加憫察特賜追還新命許換近潁一州則天地父母之恩敢忘犬馬之報今取進止同前臣今月十五日準樞密院遞到詔書一道伏蒙聖恩以臣辭免宣徽南院使判太原府事充河束四路經略安撫使恩命乞差知蔡州一次所乞冝不允者聖訓丁寧巳煩再諭臣誠迫切難避嚴誅臣竊以朝廷之用人臣子之事上蓋常察其進退不違於理則可以知其大節之所守而豫之爵祿將以為寵則必使不犯清議之所非授受之間可謂兩難矣故髙秩厚祿人臣所願必也處之無愧然後得以為榮或其義有不安所以容其自免今陛下寵臣者至矣任臣者優矣而臣不幸心懷自愧義有難安敢更竭此一作敢不更竭懇誠必期哀許伏念臣妄以迃儒遭逢三聖寵踰其分器小易盈爰自中年早苦多病臣因竊思前世為人臣者不待伏於床第然後稱疾不必廢其支體然後辭官但其一作以心志巳衰筋力難強則義當知止不可貪榮爾此臣所以不待年及纍乞退休而睿聖慈仁不忍遽棄六賜詔諭備極恩憐而臣上體聖眷之優殊不敢自決而引去然止當跧伏間處偷安竊祿譬諸巳乏之馬牛俾盡餘生於芻豢而巳此乃粗為合理其如事則不然蓋臣前歲以老告便超兵部尚書今春以疾辭又轉宣徽南一無南字院使辭淮南一州則領淄青九州免京東一路則總并代四路是每求退則得進每辭少則獲多使其一出偶然人情猶或少恕若其每舉必爾則公議豈復可容雖幸人之未言顧臣何以自處此臣一無此字所謂心懷自愧義有難安者也使臣筋力猶強尚合懇辭恩寵況臣疾病積有歲年已具奏陳纍一作屢干聽覽臣亦竊聞議者以臣腳膝一作腰腳未至著床枕一作第眼目猶可分人物便謂尚堪驅䇿致比誤蒙選任殊不知臣心志巳衰精神並耗雖未伏枕實一行尸再念臣本出書生老於文字賦才非敏以學自愚故歷官以來多觸罪辜屢罹憂患蓋以不通時務不習人情加以晚年繼之衰疾識慮昏眊一作耗舉事乖違大抵時多喜於新竒則獨思守拙衆方興於功利則茍欲循常至於軍旅之間機冝之務則又非其所學素不經心蓋以病悴已衰之軀持昏眊乖違之見任素非所學之事一有敗闕雖戮臣身不足以塞責而誤國之計如後患何使臣粗有愛君憂國之心豈敢不思及此而貪榮茍得臣一作蓋已所冝必辭者三義所難安一也精力巳衰二也用非所學三也然於三者之中其二尤急若其義所難安者幸蒙聖恩獲免俾臣不取非於清議而無愧於晚節則陛下之賜臣者榮於髙秩厚祿之賜逺矣至於用非所學致誤國家之計貽朝廷之憂則當君父旰􅉴憂勞求治之時聖慮所冝留意也伏望聖慈哀臣誠至之言察非矯偽之飾特賜允臣屢請追還新命一作授換一小州則臣雖死之日猶生之年今取進止蔡州謝上表熙寧三年臣某言臣伏奉勑命就差知蔡州軍州事已於九月二十七日赴上訖者負薪嬰疾獲辭四貴之遷剖竹分符尚忝一麾之守荷寬恩之優假撫朽質以兢慚臣某中謝伏念臣本出孤平一作貧粗親文藝遭逢亨會叨竊寵榮方犬馬之壯時早無施於尺寸況桑榆之晚景嗟巳迫於衰遲一昨誤𬒳選掄擢升要近付以一方之民政委之四路之兵機惟寄任之匪輕揣庸虛而內懼輒陳懇悃屢黷髙明敢冀天慈不違人欲還其舊職易以近藩惟古豫之名邦控長淮之右壤土風深厚物産豐饒雖宣化班條慚無異術而守官循法足以偷安此蓋伏遇皇帝陛下惻以至仁包之大度既不責其避事又曲從其便私哀爾尫殘容其僥幸仰𬒳乾坤之造顧非木石之頑臣敢不勉自勵其筋骸更殫盡瘁之節茍未填於溝壑尚知圖報之方蔡州再乞致仕第一表熙寧四年四月臣某言臣聞士之致政而傳家雖著禮經之常制昔有乞骸而稱疾不待年及者固多況臣久苦於病衰早歲巳陳於悃愊敢茲再黷仰冀哀憐臣某中謝伏念臣以一介之妄庸荷三朝之眷獎因時竊位嘗俾贊於萬機積日纍年訖無稱於一善徒緣朴戇動觸機危每煩君父之保全不殞終身一作始終之名節嚮由災疾願謝軒裳披瀝肺肝纍奏封而五上留連寵祿復歲序之三遷間𬒳誤恩驟加擢任顧已難於䇿勵遂復力於懇辭上賴慈仁曲加憫惻既不責其避事又曲從其便私得善地之寬間俾殘軀之養息而臣年日加老病益交攻新春以來舊苦增劇中痟渴涸注若漏巵弱脛零丁兀如稿木加以睛瞳氣暈幾廢視瞻心識耗昏動多健忘雖聖君之念舊廓大度以兼容而隳職曠官實為可畏貪榮竊食難久自安伏望皇帝陛下日月照臨乾坤亭育察其情實賜以矜從許解郡章歸榮里閈俾其酣詠樂時之盛化優遊為世之幸民以畢餘生永繄鴻造又劄子臣輒瀝懇私上干宸造愚誠所迫罪戾難逃臣自頃蒙恩許解政事即曽乞一近潁州差遣庶得漸謀歸老上荷至仁憫臣衰病允其所乞差知亳州到任之明年遂乞致仕聖念惻然憐其舊物不忍廢置凡五上表章四具奏劄皆蒙詔答未賜允俞臣以不敢更為煩黷遂且中止尋又蒙恩超轉臣兵部尚書安撫淄青一路既不獲懇辭遂勉力就任而臣迫以昏衰事多曠廢甫及一年則又陳乞壽州亦以近潁冀便於歸老未得請間尋又蒙恩除臣宣徽使移守并門付以河東一路官益榮任益重而臣身益老病益加不勝憂懼之情所以纍瀝血懇上煩天聽伏蒙睿慈察其誠實養疾便私悉如其請臣自到今任忽巳半年幸值歲物豐成民一作盜訟稀少坐尸厚祿足以偷安臣上戴陛下天地父母之恩未知論報之所而心與願違蓋自冬春以來舊苦愈增上渴下淋晝夜不止腳膝細瘦僅存皮骨行履拜跪艱難加以眼目昏暗視物睛痛有妨簽書看讀公家文字載念臣昏衰疾病既已纍年量分知止亦非一日寵祿之榮無容久竊臣今輒具表章再伸舊請乞一致仕名目欲望聖慈特賜開許今取進止第二表熙寧四年五月臣某言臣近上表章乞從致仕伏奉詔書所乞冝不允者睿訓丁寧曲加慰諭愚衷懇迫尚敢黷煩將再干於冕旒冝先伏於砧鑕臣某中謝伏念臣世惟寒陋少苦竒屯識不逹於古今學僅知於章句名浮於實用之始見於無能器小易盈過則不勝於幾覆徒以早遘千齡之亨會誤蒙三聖之獎知寵榮既溢其涯憂患亦隨而至稟生素弱顧身未老而先衰大道甚夷嗟力不前而難強每念恩私之莫報兼之疾病以交攻爰於守亳之𥘉遂決竄漳之計逮此三遷於歲律又更兩易於州符而犬馬巳疲理無復壯田廬甚邇今也其時是敢更殫螻蟻之誠仰冀乾坤之造況今時不乏士物咸遂生鳬鴈去來固不為於多少鳶魚上下皆自適於飛潛茍遂乞於殘骸庶少償其夙志伏望皇帝陛下哀憐舊物隱惻至仁察其有素非偽之誠成其識分知止之節曲從其欲賜報曰俞俾其解組官庭還車故里披裘散髮逍遙垂盡之年鑿井耕田歌詠太平之樂其為榮幸曷可勝陳又劄子臣此者伏奉詔書以臣再乞致仕未賜允俞恩旨稠重伏讀感涕臣自熙寧元年𥘉有陳乞逮今四年之間凡八上表章五具劄子其懇悃迫切言意重復干冒天慈煩黷聖聽固已可厭而可責矣而蒙陛下未加誅譴曲為優容八𬒳詔音一作答丁寧慰譬此天地父母之仁可謂至矣然臣猶有不得巳者臣前嘗奏述古之為臣不必伏於床枕然後稱疾不待廢其支體然後辭官但其心力已衰不能勉強則自冝知止而不可貪榮此臣前次陳乞之時所志止於如此爾蓋自守亳逮今又已四年身比前日加老則氣血比前日益衰而疾病比前日益不支持但未伏床枕廢支體爾此臣不能自已者也臣竊伏思聖君久巳察臣區區而未允其請者必以臣歷事三朝最為舊物聖恩眷眷未忍廢棄而年又未及去之太早耳然臣前又嘗奏述今之致仕與古之人不同恩禮優幸不為廢棄至於年未及而早去亦今昔人臣常事臣竊見實録所載太宗時有太常少卿孔承恭者年才六十一便乞致仕太宗皇帝欣然許之仍特降詔書褒獎以敦勸人倫蓋當時議者不以朝廷許承恭早去為非而但稱承恭之善又以有臣如此可以勸勵風俗自為朝廷美事也欲望聖慈少紆聽覽果若致仕優幸不為廢棄雖年未及又議者不以為非而反為朝廷美事則理無可疑而臣若蒙哀憐得遂其請則上不損朝廷之體下不失優幸之恩而又竊知止之名為一時之佳事則臣之受賜者多矣臣不勝意迫言煩惶懼激切俯伏待罪之至今取進止第三表同前臣某言今月二十一日準樞密院遞到詔書一道伏蒙聖慈以臣再乞致仕未賜允俞者恩深煦嫗感極涕洟雖情有迫於危心不知自止而辭巳窮於纍牘幾至無言惟以至誠期於必逹自乞憐於君父不復訊於蓍龜臣某中謝伏念臣家世單平性姿中下少從宦學本免飢寒不自意於遭逢遂進階於華顯然而群材方茂蒲栁未秋而早衰衆駿並馳駑駘中道而先乏而況荷難勝之任用竊逾分之寵榮風波憂畏而慮巳深疾病侵凌而老亦至故自辭於機政即願謝於軒裳蒙上聖之至仁念三朝之舊物每曲煩於訓諭久未忍於棄捐竊惟臣之事君必本忠信言不顧行是為罔欺而臣口日誦於田閭身坐貪於祿利可畏至公之議何施有靦之顔每自省循莫遑啓處是敢罔避再三之煩黷猶希萬一之矜從伏望皇帝陛下特􅎮天慈俯回睿聽察前言之可復蓋屢請者有年哀下愚之不移俾卒成於素志徇其所欲乞以殘骸臣若得上還印綬於有司自駕柴車而即路晚節知無於大過沒身永荷於鴻私謝致仕表熙寧四年六月臣某言今月十七日進奏院遞到勑告伏蒙聖恩除臣太子少師依前觀文殿學士致仕者愚誠懇至曲軫於皇慈寵命優殊特加於常品本期得謝更此叨榮臣某中謝伏念臣猥以庸近之材早遘休明之運不通之學既泥古以難施無用之文復虛言而少實是以三朝𬒳遇四紀服勞蒙德重於丘山論報亡於毫髮而年齡晚暮疾病尫殘輒希知止於前人不待及期而後請自陳悃愊屢至瀆煩既久歷於歲時始曲蒙於開可仍超加於異數非止賜於殘骸道愧師儒乃忝春宫之峻秩身居畎畒而兼書殿之清名至於頭垂兩鬢之霜毛腰束九環之金帶雖異負薪之里一作重何殊衣錦之歸使閭巷咨嗟共識聖君之念舊搢紳感恱皆希後福之有終豈惟愚臣獨受大賜此蓋伏遇皇帝陛下無私覆物博愛推仁以其夙幸遭逢密契風雲之感會曾經服御不忘簮履之賤微致此便蕃萃于衰朽雖伏櫪之馬悲鳴難戀於君軒而曵尾之龜涵養未離於靈沼餘生易畢鴻造難酬乞免明堂陪位劄子熙寧四年八月臣伏準今月二日詔書以明堂大禮特令臣赴闕陪位者臣竊惟大饗之禮國家盛典千官分職以奉事萬國駿奔而在庭方以老病衰殘退伏閭里尚蒙天慈曲加記録特賜詔召俾與侍祠之列此臣子之至榮至幸豈臣克堪而臣不幸早嬰災疾瀝懇纍年近蒙聖恩許以歸老而自春涉秋舊苦增劇腳膝細瘦行履拜跪艱難伏況祠事恭虔出於強力而臣迫此疾苦不獲祗赴召今無以上副君父記録愛憐之恩臣不勝皇恐謝免明堂陪位表合宫大啓爰講於上儀明詔忽頒俾祗於嚴召𬒳恩言之優渥撫病質以兢營臣某中謝伏惟皇帝陛下仁聖聰明憂勤慈儉遂羣生而涵育臻至治於和平乃因萬物之成秋爰即九筵而展禮陟降薦獻百官以職而各供膺受福釐一人有慶而咸賴而臣近辭印紱方伏田廬當與庶民並蒙餘澤敢期睿眷尚録孤孱俾陪在外之臣來預侍祠之列載念臣自緣災疾幸獲退休殆未踰時尚嬰舊苦雖朝廷禮樂之盛得與者為榮而犬馬筋力之衰告疲而巳久既不能於䇿勵姑自信於竒屯太史滯於周南惟知歎命子牟瞻於魏闕但極馳心謝明堂禮畢宣賜表熙寧四年九月臣某言臣今月十七日伏蒙聖恩特差右班殿直王昌賜臣衣一襲金腰帶一條銀器一百五十兩絹一百五十匹米麵羊酒等者太室精禋方集神明之貺篳門增耀亦霑慶賜之優祗受以還兢營失措臣某中謝伏惟皇帝陛下垂衣致治盡志奉先率循三歲之舊章時舉季秋之大饗四方萬國執玉帛以盈庭羣卿百司潔豆籩而恭事而臣以衰殘之病質荷寬假之深仁方居畎畒以偷安莫覩朝廷之盛禮璽書賜召不遑祗命而趨使指就臨特𬒳匪頒之寵此蓋伏遇皇帝陛下容之大度推以至慈念簮履之雖微猶為於舊物閔桑榆之向暮俾慰其餘生惟嗟犬馬之巳疲莫報乾坤之大施代作三首續添代進奉承天節絹狀右臣伏以重熙纂歷載誕啓辰正寧陳儀允昭於嘉會庶邦修貢咸效於駿奔前件絹三壤所冝九賦攸出備諸宰旅實纎篚以非工竊比野人得美芹而是獻虔誠斯至欣頌咸同代進奉土貢狀右臣伏以百嘉咸茂允賴聖功九貢所儀備存方志前件物出於繭稅載厥仙經疏密有程甘馨可采以時述職庶六尚之攸資向日傾誠保億齡而是祝干浼宸造臣無任代薛仲孺乞御篆神道碑狀右臣輒瀝哀懇上干睿聽人子之志蓋急於顯親天心至仁仰冀於從欲伏念臣先臣奎早以孤直遭逢盛明自結主知參預國政讜言忠節著在朝延遺德餘芳冝刻金石伏見兩府舊臣之家所立神道碑多蒙聖恩賜以御書名額臣今欲於先臣墓隧刻立碑名欲望聖慈特賜御篆神道碑額所冀神翰之光照臨幽壤不獨榮其後嗣實以勸於事君謹具狀陳乞以聞表奏書啓四六集卷第五辭免青州第三劄子緣臣此上一有蓋字謝賜漢書表皆眊一作昏眊乞壽州第一劄子憐憫一作矜憫第二劄子恩詔一作明詔欲求一作欲乞謝擅止散青苗錢放罪表三聖一作三朝辭宣徽使第二劄子衰病一作衰疾蔡州乞致仕第一表常制一作常典悃愊一作懇悃嚮由一作曩由永繄一作永依第二表曲加一作曲煩砧鑕鑕一作質第二劄子言意重復一作言重意復謝免明堂陪位表在外一作在位代薛仲孺乞御篆神道碑狀碑名名一作銘附録卷第五事迹發等𫐠先公為人天性剛徑而器度恢廓宏大中心坦然未嘗有所屑屑於事事不輕發而義有可為則雖禍患在前直往不顧以此或至困逐及復振起終莫能掩而公亦正身特立不少屈奪四五十年之間氣象偉然蓋天下而以文章道德為一世學者宗師故歷事三聖常𬒳眷倚遂託以天下安危之計而公亦以身許國進退出處士人以為輕重至於接人待物樂易明白無有機慮與所疑忌與人言抗聲極談徑直明辨人人以為開口可見心腑至於貴顯終始如一不見大官貴人事位貌之體一切出於誠心直道無所矜飾見者莫不愛服而天資徑正髙逺無纎毫世俗之氣常人亦自不能與之合也平生學之所得以至文章事業皆明識所及性所自得不勞而至無所勉強而衆人學之者終莫能及其於經術務明其大本而本於情性其所發明簡易明白其論詩曰察其美刺知其善惡以為勸戒所謂聖人之志者本也因其失傳而妄自為之説者經師之末也今夫學者得其本而通其末斯盡善矣得其本而不通其末闕其所疑可也又云今夫學者知前事之善惡知詩人之美刺知聖人之勸戒是謂知學之本而得其要其學足矣又何求焉公於經術去取如此以至先儒注疏有所不通務在勇斷不惑平生所辨明十數事皆前世人不以為非未有説者如五帝不必皆出於黃帝春秋趙盾弒君非趙穿許世子非不嘗藥武王之十有一年非受命之年數及力破漢儒災異五行之説正統論破以秦為偽閏或以功德或以國地不相臣屬則必推一姓以為主之説以為正者正天下之不正統者統一天下之不一至于各據地而稱帝正朔不相加則為絶統惟合天下於一者為正統統或絶或續而正統之説遂定焉然亦不茍務立異於諸儒嘗曰先儒於經不能無失而所得巳多矣正其失可也力詆之不可也盡其説而理有不通然後得以論正豫非好為異論也其於詩易多所發明為詩本義所改正百餘篇其餘則曰毛鄭之説是矣復何云乎其公心通論如此先公四歲而孤家貧無資太夫人以荻畫地教以書字多誦古人篇章使學為詩及其稍長而家無書讀就閭里士人家借而讀之或因而抄録抄録未畢而已能誦其書以至晝夜忘寢食惟讀書是務自幼所作詩賦文字下筆已如成人兵部府君閲之謂韓國太夫人曰嫂無以家貧子幼為念此竒兒也不惟起家以大吾門他日必名重當世及舉進士時學者方為四六號時文公巳獨步其間天聖七年輔國子監生是秋取解明年南省試皆為第一人由是名重當世及景祐中在西京與尹公洙偕為古文已而有詔戒天下學者盡為古文獨公古文既行遂擅天下四十年間天下以為模範一言之出學者競相傳道不日之間流布逺近外至夷狄莫不仰服後進之士爭為門生求受教誨當世皆以為自兩漢後五六百年有韓退之退之之後又數百年而公繼出自李翶柳宗元之徒皆不足比然公之文備盡衆體變化開闔因物命意各極其工或過退之如醉翁亭記真州東園記創意立法前世未有其體作尹公洙志文以為尹公文簡而有法取其意而為之即得其體石先生介墓志不多假事迹但述其平生志意所存與其大節氣槩讀之如見其人作集古録敘今王丞相以謂讀之可辟瘧鬼先公既奉勑撰唐書紀志表又自撰五代史七十四卷其作本紀用春秋之法雖司馬遷班固皆不及也其於唐書禮樂志發明禮樂之本言前世治出於一而後世禮樂為空名五行志不書事應悉破漢儒災異附會之説皆出前人之所未至其於五代史尤所留心褒貶善惡為法精密發論必以嗚呼曰此亂世之書也其論曰昔孔子作春秋因亂世而立治法余述本紀以治法而正亂君此其志也書成減舊史之半而事迹添數倍文省而事備其所辨正前史之失甚多嘉祐中今致政侍郎范公等列言于朝請取以備正史公辭以未成熙寧中有旨取以進御按神宗實録熙寧五年八月丁亥詔潁州令歐陽某家上某所撰五代史先公筆札精徑雄偉自為一家當世士大夫有得數十字皆藏以為寶而未嘗為人書石先公平生以奬進賢材為巳任一時賢士大夫雖潛晦不為人知者知之無不稱譽薦舉極力而後已既為當世宗師凡後進之士公嘗所稱者遂為名人時一作士人皆以得公一言為重而公推揚誘進不倦至於有一長者識與不識皆隨其所長而稱之至今當世顯貴知名者公所稱薦為多今湖州孫正言覺為合淝主簿未與公相識郡守怒之欲捃拾以罪時胡侍講在太學以屬公公為作手書與其寮佐令保全之遂獲免福州處士陳烈素不與公相識公聞其名知其行義屢薦於朝乞賜召用朝廷即召烈為國子監直講先公嘗言平生為學所得惟平心無怨惡為難故於事未嘗挾私喜怒以為意雖仇讎之人嘗出死力擠陷公者它日遇之中心蕩然無纎芥不足之意嘗曰孔子言以直報怨夫直者是之為是非之為非是非付之至公則是亦不報也先公初貶滁州蓋錢明逸輩為之自外還朝遇明逸於京師屢同飲宴不以為嫌其後公在中書明逸罷秦州歸復用為翰林學士近日小人蔣之竒妄興大謗及公移青州其兄之儀知臨淄縣為二司所不喜力欲壞之亦以託公公察其實無它力保全之先公平生文章擅天下未嘗以矜人而樂成人之美不掩其所長詩筆不下梅聖俞而嘗推之自謂不及然識者或謂過之初奉勑撰唐書專成紀志表而列傳則宋公祁所撰朝廷恐其體不一詔公看詳令刪為一體公雖受命退而曰宋公於我為前輩且人所見不同豈可悉如巳意於是一無所易書成奏御舊制惟列官最髙者一人公官髙當書公曰宋公於傳功深而日久豈可掩其名奪其功於是紀志表書公名而列傳書宋公宋丞相庠聞之歎曰自古文人好相凌掩此事前所未有也先公篤於交友恤人之孤梅聖俞家素貧既卒公醵於諸公得錢數百千置義田以恤其家且乞録其子增尹龍圖洙巳卒公乞録其子構孫先生復有尊王發微十五卷有旨進內未畢而卒公乞令其家録進而推恩其子大年尹構孫大年梅增皆蒙録用以官天聖初胥公在漢陽先公時年二十餘以所為文謁之胥公一見竒之曰子當有名於天下因館于門下與公偕入京師及公登第乃以女妻之王文康公知西京先公為留守推官一日當都廳勘事有一兵士自役所逃歸文康問公曰勘兵士何謂未斷公曰合送本處行遣文康曰似此某作官處斷過甚多推官新作官不須疑公曰若相公直斷雖斬亦可有司則不敢奉行一夜文康夜召問軍人未斷否公曰未文康曰幾至誤事明日遂送所屬處先公在河南以文學負當世之名前後留守皆名公好賢莫不傾身禮接王文康自西京召歸謂公曰今來有例合舉館職當奉舉遂用王文康公薦自西京留守推官召試范文正公以言事忤大臣貶知饒州先公一日遇司諫髙若訥於余裏公家若訥非短范公以為冝貶公歸遂為書與之辨且責若訥二字一作其不能論列若訥繳進其書遂坐貶為夷陵令既而余襄公尹公洙亦連坐被貶蔡公為四賢詩述其事天下傳之先公既坐范公逺貶數年復得滑州職官會范公復起經略陜西辟公掌箋奏朝廷從之時天下久無事一旦西邊用兵士之負材能者皆欲因時有所施為而范公以天下重名好賢下士故士之樂從者衆公獨歎曰吾初論范公事豈以為巳利哉同其退不同其進可也遂辭不往其於進退不苟如此以至致位二府惟以忠義自得主知未嘗有所因緣憑藉先公在館中遇西邊用兵天下多事詣闕上書為三䇿以料賊情及指陳天下利害甚衆既而有詔百官許上封章言事公上疏言三弊五事力陳當時之患仁宗增諌官為四員先公與蔡公襄余襄公靖今致政王尚書素同時選用是時陜西用兵巳久京東西盜賊群起內外多事仁宗既進退大臣遂欲改更闕失方急於求治公遇事感激知無不言范文正公杜正獻公今司徒韓魏公冨鄭公四人同時登用公屢請召對訪問責以所為既而仁宗降手詔出六條以責諸公各亦有所陳述公言諸公所陳冝力主張勿為羣言所奪而王文安公為三司使有為無名詩中之者公請嚴禁止之以絶小人流言搖動朝政之漸勑出官爵購捕其人時上欲改更朝政小人不便故造作語言動搖及勑榜出自此遂絶是後上遂下詔勸農桑興學校改更庶事之弊自范文正公之貶先公與余襄公等坐黨人𬒳逐朋黨之説遂起久而不能解一時名士皆被目為黨人公在諫院為朋黨論以獻羣言遂息大救當時之弊時天下久安上下失於因循一旦陜西用兵而羣賊王倫張海等所在皆起先公請遣使者按察州縣朝廷命諸路轉運使皆兼按察公言轉運使苟非其人則按察遂為空名復條陳按察六事於是兩府聚議盡破常例不次用人後來别因一劄子中備言此事其後州縣多所升降內外百職振舉及杜待制𣏌為京西轉運使與御史蔡稟同治賊事公言𣏌可獨任無用稟𣏌果遂平諸盜京西無事時張溫成方有寵人莫敢言因生皇女染綾羅八千匹先公上言乞裁損其恩寵及其親戚恩澤太頻可以減罷極陳女寵驕恣以至禍敗之戒皇叔燕王薨議者以國用不足請待豐年而葬先公乞減費而葬以為不肯薄葬留之以待侈葬徒成王之惡名使四夷聞天子皇叔薨無錢出葬遂輕中國有旨減節浮費而葬澧州柿木成文有太平之道四字先公上言今四海騷然未見太平之象又曰太平之道者其意可推自古帝王致太平皆有道得道則太平失道則危亂今見其失未見其得願陛下憂勤萬務漸期致理其瑞木乞不宣示于外慶曆三年御試進士以應天以實不以文為賦題公為擬試賦一道以進指陳當世闕失言甚切至淮南轉運使吕紹寧到任便進羡餘錢十萬公乞拒而不受以彰朝廷均恤外方防禦刻剝前後所上章疏百餘其間斥去姦邢抑絶徼幸以謂任人不可疑節制不可不一當推恩信以懷不服其事往往施行先公以諫官除知制誥故事知制誥當先試有旨更不召試有國以來不試而受者惟楊文公陳文惠公與公三人公既典制誥尤務敦大體初作勸農勑既出天下翕然人人傳誦王言之體逺復前古陜西兵役之後河東困弊糧草闕少又有言者請廢麟州或請移於合河津或請廢五寨朝廷命先公視其利害及察訪一路官吏能否擘劃經久利害及計置糧草公為四議以較麟州利害請移兵就食於河濵一作次清塞堡緩急不失應援而平時可省餽運麟州遂不廢又建言欣代岢嵐大山四州軍沿邊有禁地棄而不耕人户私糴北界斛斗入中以為邊儲今若耕之每年可得三二百萬石以實邊朝廷從之此兩事至今大為河東之利自西事後河東賦斂重而民貧道路嗟怨先公奏罷十事以寬民力文字見河東奏事謂乞罷和糴米三司銀之類先公自河東還會保州兵叛遂出為河北都轉運使别得不下司劄子云河北冝選有文武材識轉運使二員密授經略之任使其熟圖利害豫為禦備保州既降總管李昭亮私取叛兵妻女通判馮博文等亦往往效之先公發博文罪置獄推劾昭亮恐懼立令送出自保州事後河北兵驕少不如意即謀結集處處有之上下務在姑息先公屢乞主張將帥每事鎮重以遏士心河北卒無事保州叛兵既降其脅從者二千餘人分隸河北諸州冨鄭公為宣撫使恐其復生變欲委諸州同日誅之方作文書會先公權知鎮府遇冨公於內黃冨公夜半屏人密以告公公曰禍莫大於殺降昨保州叛卒朝廷許以不死招之今已戮之矣此二千人本以脅從故得不死奈何一旦無辜就戮且無朝旨若諸郡不肯從命事既參差則必生事是趣其為亂也且某至鎮州必不從命冨鄭公遂止先公在河北既被朝廷委任之重悉力經營凡一路官吏能否山川地里財産所出兵糧器械教閲陳法一一别為圖籍盡四路之事如在目前或問公曰公以文章儒學名天下而治此俗吏之事乎公曰吏之不職吾所愧也繫民休戚其敢忽乎奏置御河催綱司通致糧運以省入中之數置都作院於磁相二州以省諸州兵器之費既究見河北利害本末一無此二字乃一一條列遍貽書於執政將大為經畫未盡行而公罷去慶曆初仁宗既復四諌之職一有而舉二字拔英俊賢能材德之士並進于朝公負天下之望而居其職仁宗寵異之意獨絶衆人嘗因奏事論及當世人材仁宗不覺謂公曰如歐陽某何處得來公乃盡心悉力思所輔報遇事不避以至犯忤權貴排擊姦佞怨怒隨至常欲大用而未果是時中外多事仁宗意以謂艱難之際非公不足以辦事故自諫官奉使河東委以一路之利害及保州事作河北轉運使張昷之得罪公自河東還未數月復出為河北轉運使及陛辭之日仁宗靣諭曰不久當還無為久居計有事但言來無以中外為限公對曰在京師所言尚以風聞或恐失實況於在一作在於外仁宗曰有所聞但言來行與不行則在此及至河北百事振舉小人忌公恐大用而又杜范韓冨同時罷黜小人彚進公上疏極言四人忠實可用而無過辨明小人誣罔之言請加任用於是群小益懼相與造為謗辭及詔獄之起窮究無狀仁宗亦悟止奪職知滁州南京素號要會賔客往來無虛日一失迎候則議論鋒一作群起先公在南京雖貴臣權要過者待之如一由是造為語言逹於朝廷時陳丞相升之安撫京東因令審察是非陳公隂訪之民間得俚語謂公為照天蠟燭還而奏之上方欲召用而公丁太夫人憂先公初服除還朝惟除本官龍圖閣直學士而無主判入見日仁宗惻然怪公鬢髮之白問公在外幾年今年幾何恩意其至公求輔外仁宗曰此中見人多矣為小官時則有肯盡言名位已髙則多顧藉如卿且未要去明日以責大臣即以公判流內銓是時小人忌公且見進用偽為公乞澄汰內臣劄子傳布中外內臣人人切齒判銓六日楊永德以差船及引見胡宗堯事中公出知同州而外議紛紜論救者衆上亦開悟適會劉公沆有劄子乞催宋公祁結絶唐書上曰莫不須宋祁否劉公曰别未有人上曰歐陽某知同州臣寮巳有文字請留劉公曰乞自陛下宣諭明日朝辭上殿上曰休去同州且修唐書既而曽魯公自翰林學士換侍讀學士知鄭州劉公奏歐陽某見未有主判處乞替曽某判三班院上曰翰林學士有人未劉公曰見商量上曰歐陽某不止一好差遣亦好一翰林學士便可替曽某遂入翰林為史官判三班院上嘗靣問公以唐學士院鈴索故事將議臨幸其於眷待之意甚厚先公在侍從八年知無不言屢建議多見施行自初還朝唐公介與諸公方居言職所言久之未見聽納公上疏言人君拒諫之失請採聽言者其後上遂用諫官言進退宰相用唐介等疏罷陳執中時議者方以河患為意陳恭公在相位欲塞商胡開橫壠回大河於故道先公上疏言其不可未幾恭公罷去新宰相復用李仲昌議欲開六塔全回河流公兩上疏爭之不聽河才成而決濵德博數千里大被其害仲昌等議者流竄逺方卒如公議至和二年先公奉使契丹契丹使其貴臣陳留郡王宗願惕隱大王宗熙北宰相蕭知足尚父中書令晉王蕭孝友來押宴曰此非常例以卿名重宗願宗熙並契丹皇叔北宰相蕃官中最髙者尚父中書令晉王是太皇太后弟送伴使耶律元寧言自來不曽如此一併差近上親貴大臣押宴嘉祐初狄武襄公為樞密使狄自破蠻賊之後方振威名而是時仁宗不豫久之初康復而狄得士心京師訛言訩訩先公因水災言武臣典機密得士心而訛言可畏非國之便請且出之於外以保全之未久狄終以流言不巳罷知陳州嘉祐中復用賈魏公為樞密使先公言其為人好為隂謀陷害良士小人朋附樂為其用前任相位纍害善人所以聞其再來望風畏恐乞早罷還之舊鎮其命遂止先公在翰林嘗草春帖子詞一日仁宗因間行舉首見御閣帖子讀而愛之問何人作左右以公對即悉取皇后夫人諸閣中者閲之見其篇篇有意歎曰舉筆不忘規諌真侍從之臣也自是每學士院進入文書必問何人當直若公所作必索文書自覽先公每述仁宗恩遇多言此事云內官梁實為先公説春帖子詞有云陽進升君子隂消退小人聖君南靣治布政法新春至今士大夫盡能誦之及溫成皇后閣帖子云聖君念舊憐遺族常使無權保厥家仁宗嘉祐中先公在翰林冨鄭公在中書胡侍講在太學包孝肅公為中丞士大夫相語曰冨公真宰相呼先公字曰真翰林學士胡先生真先生包公真中丞時人謂四真嘉祐二年先公知貢舉時學者為文以新竒相尚文體大壞僻澀如狼子豹孫林林逐逐之語怪誕如周公伻圖禹操畚鍤傅説負版築來築太平之基之説公深革其弊一時以怪僻知名在髙等者黜落幾盡二蘇出於西川人無知者一旦拔在髙等榜出士人紛然驚怒怨謗其後稍稍信服而五六年間文格遂變而復古公之力也先公知開封府承包孝肅公之後包公以威嚴為治名震京師而公為治循理不事風采或謂公曰前政威名震動都下真得古京兆尹之風采公未有動人者奈何公曰人材性各有短長豈可捨已所長勉強其所短以徇俗求譽但當盡我所為不能則止既而都下事無不治開封府既多近戚寵貴干令犯禁而復求以內降苟免先公既授命屢有其事即上奏論列乞人後求內降以免罪者更加本罪二等內臣梁舉直私役官兵付開封府取勘既而內降放罪凡三次內降公終執而不行嘉祐三年閏十二月亰師大雪民凍餒而死者十七八明年上元有司以常例張燈先公奏請罷之故事國史皆在史院近制皆進入內自是每日曆成亦入內而有司惟守空司先公請録本付外遂如公言今史院之有國史自一作由公請也先公在密院與今侍中曽魯公悉力振舉紀綱革去宿弊大考天下兵數及三路屯戍多少地里逺近更為圖籍之法邊防久闕屯守者大加搜輔數月之間機務浸理臺諫官唐公介王公陶范公師道吕公景初皆以言事𬒳逐先公言四人剛王敢言蹤迹有本末冝早賜牽復其後四人遂復進用先公在侍從因嘉祐水災凡再上疏請選立皇子以固天下根本言甚激切及在政府遂與諸公協定大議而英宗力辭宗正之命堅卧久之諸公同議不若遂正皇子之名奏事仁宗前顧問之際公獨進曰宗室自來不領職事今外人忽見有此除授皆知陛下將以為子不若遂正其名蓋判宗正寺降誥勑得以不授今立為皇子只煩陛下命學士作一詔書告天下事即定矣仁宗以為然大計遂定及英宗初年未親政事慈聖垂簾危疑之際公與諸公往來兩宫鎮撫內外而公之危言密議忠力為多以至英宗親御萬機內外睦然先公天性徑正不顧仇怨雖以此屢被讒謗至於貶逐及居大位毅然不少顧惜尤務直道而行橫身當事不恤浮議是時今司徒韓魏公當國每諸公聚議事有未可公未嘗不力爭而韓公亦欣然忌懷以此與公相知益深或奏事上前衆議未合公亦往返折難無所顧避嘗一日獨對英宗靣諭公曰參政英宗於先朝大臣多不以名呼而以官稱性直不避衆怨每見奏事與二相公有所異同便相折難其語更無回避亦聞臺諫論事往往靣折其短若似奏事時語可知人皆不喜也冝少戒此而公又務抑絶僥幸有以事干公者或不可行靣為其人分别可否曰此事必不可行以此人多怨謗而公安然未嘗少恤嘗稱故相王沂公之言曰恩欲歸已怨使誰當每亦曰貧賤常思冨貴冨貴必履危機此古人之所歎也惟不思而得既得不患失之者其庶幾乎及濮園議起非公所獨專朝廷亦未有定議而言者妄以非禮之説指公為王議公亦不與之較其後小人彭思永蔣之竒等造為無根之飛語欲以危公自人主而下朝廷名臣巨公天下有識之士皆知因公亮直不隱得怨於小人故上連降手詔詰問思永之竒二人引服誣罔悉皆貶逐自嘉祐以後朝廷務惜名器而進人之路稍狹先公屢建言館閣育材之地冝盛其選以廣賢路遂令兩府人各舉五人其後中選者十人嘗因僧官闕人內臣陳承禮以寶相院僧慶輔為請內降從之舊有著令僧官必試而輔諸公相與執奏其事先公進言曰輔一僧官至為小事但內降衝改著令內臣干撓朝政不可啓其端且宦女近習前世常患難於防制乞絶之於漸英宗即欣然嘉納契丹降人韓臯謨者自言太叔使來言太叔謀取其國乞中國出兵為應二府會議其事時有意主之者將議從之先公爭曰中國待夷狄冝以信義為本奈何欲助其叛亂使事不成得以為辭主議者大笑曰迂儒迂儒公力爭之不巳遂止既而虜中太叔舉事不成而死初樞密使闕人先公以次當拜時英宗未親政事二府密議不以告公一日待漏院中公見二相耳語知其所為問曰得非密院闕人而某當次輔乎二公曰然公曰此大不可今天子不親政而母后垂簾事之得失人皆謂吾輩為之耳今如此則是大臣二三人相輔置耳何以鎮服天下二公大然公言遂止及今致政張太師罷樞密使英宗復用公公力辭不拜京師百司所行兵民官吏財用之類皆無總數中書一有行移則下有司纂集先公因暇日盡以中書所當知者集為總目一日上有所問宰相以總目為對公以祀假家居上遣中貴人就中書閣子取而閲之先公平生連典大郡務以鎮靜為本不求聲譽治存大體而施設各有條理綱目不亂非盜賊大獄不過終一作數日吏人不得留滯為姦如揚州南京青州皆大郡多事公至數日事十減五六既久官宇閴然嘗曰以縱為寬以略為簡則事弛廢而民受弊吾所謂寬者不為苛急簡者去其繁碎爾故所至不見治迹而民安其不擾既去至今追思不巳今滁揚二州皆有生祠而公天性仁恕斷獄常務從寬嘗云漢法惟殺人者死後世死刑多矣故凡死罪非巳殺人而法可出入者皆全活之曰此吾先君之志也其在河北一議活二千人之命及晚年在京東奏寬沙門島刑名設法減其人數賴以獲全者甚衆沙門島罪人寨主舊敢專殺故數不多而易制馬默知登州務全人命舉察甚嚴稍優恤罪人罪人既多而又不畏本寨漸恣橫難制京東議者大患之有司之意多欲許令依舊一面處置公以為朝廷既貸其命豈可非理殺之奏請將編勑州名合配沙門島而情稍輕者只配逺惡州軍見在島多年情輕者放還遂以無事而人亦獲全先公初有太原之命令赴闕朝見中外之望皆謂朝廷方虛相位以待公公六上章堅辭不拜而請知蔡州天下莫不歎公之髙節先公在亳年才六十一已六上章乞致仕而上方眷留未聽及在蔡勤請益堅遂如素志公既氣貌康強而年未及禮制一旦勇退近古數百年所未嘗有天下士大夫仰望驚嘆公雖退居于家士論猶望以為輕重先公平生以直道見忌於群小再𬒳貶逐而未嘗以介意初在峽州作至喜亭及自河北以小人無名之謗降知滁州治州南山泉為幽谷泉作亭於琅琊山自號醉翁及晚年又自號六一居士曰吾集古録一千卷藏書一萬卷有琴一張有棊一局而常置酒一壷吾老於其間是為六一自為傳以刻石先公平生於物少所嗜好雖異物竒玩不甚愛惜獨好收蓄古文圖書集三代以來金石銘刻為一千卷以校正史傳百家訛繆之説為多藏書一萬卷雖至晚年暇日惟讀書未嘗釋卷先公平生著述易童子問三卷詩本義十四卷五代史七十四卷居士集五十卷歸榮集一卷外制集三卷內制集八卷奏議集十八卷四六集七卷集古録跋尾十卷雜著述十九卷諸子集以為家書總目八卷其遺逸不録者尚數百篇别為編集而未及成又奉勑撰唐書紀十卷志五十卷表十五卷在館職日與同時諸公共撰崇文總目祖宗故事附録卷第五記神清洞逰嵩山寄梅殿丞書明道元年九月謝舍人絳聖俞足下近有使者東來付僕詔書并御祝封香遣告嵩嶽太常移文合用讀祝捧幣二員府以歐陽永叔楊子聰分攝會尹師魯王幾道至自緱氏因思早時約聖俞有太室中峯之行聖俞中春時遂往僕為人間事所窘未皇也今幸其便又二三子可以為山水遊侣然亟與之議皆喜見顔色不戒而赴十二日晝漏未盡十刻出建春門宿十八里河翌日過緱氏閲逰嵩詩碑碑甚大字而未鐫上緱嶺尋子晉祠陟轘轅道入登封出北門齋于廟中是夕寢既興吏白五鼓有司請朝服行事事巳謁新治宫拜真宗御容稍即山麓至峻極中院始改冠服却車徒從者不過十數人輕齎遂行是時秋清日隂天未甚寒晚花幽草虧蔽巖壁正當人力清壯之際加有朋簮談燕之適升髙躡險氣豪心果遇盤石過大樹必休其上下酌酒飲茗傲然者久之道徑差平則腰輿以行嶄崒斗甚則芒蹻以進窺玉女窗搗衣石石誠異窗則亡有迤邐至八仙壇憩三醉石遍視墨迹不復存矣考乎三君所賦亦名過其實午􅉴方抵峻極上院師魯體最溢最先到永叔最少最疲於是浣漱食飲從容間躋封禪壇下瞰羣峰乃向所跂而望之謂非插翼不可到者皆培塿焉邑居樓觀人物之夥視若蟻壤世所謂仙人者僕未知其有無果有則人世不得不為其輕蔑矣武后封祀碑故存自號大周當時名賢皆姓名于碑隂不虞後代之譏其不典也碑之空無字處覩聖俞記樂理國而下四人同道鑱刻尤精僕意古帝王祀天神紀功德于此當時尊美甚盛後之君子不必廢之壞之也又尋韓文公所謂石室者因詣盡東峰頂既而與諸君議欲見誦法華經汪僧永叔進以為不可且言聖俞往時嘗云斯人之鄙恐不足損大雅一顧僕強諸君往焉自峻極東南緣險而徑下三四里法華者栖石室中形貌土木也飲食猿鳥也叩厥真旨則軟語善答神色睟正法道諦實至論多矣不可具道所切當云古之人念念在定慧何由雜今之人念念在散亂何由定師魯永叔扶道貶異最為辨士不覺心醉色怍欽歎忘返共恨聖俞聞繆而喪真甚矣是夕宿頂上會幾望天無纎翳萬里在目子聰疑去月差近令人浩然絶世間慮盤桓三清露下直覺冷透骨髮羸體將不堪可方即舍張燭具豐饌醇醴五人者相與岸幘禠帶環坐滿引賦詩談道間以謔劇然不知形骸之纍利欲之萌為何物也夜分少就枕以息明日訪歸路步履無苦昔鼯鼠窮伎能上而不能下豈近此乎午間至中院邑大夫來逆其禮益謹申刻出登封西門道潁陽宿金店十六日晨發據鞍縱望太室猶在後雖曲南西則但見少室若夫觀少室之美非繇兹路則不能盡諸邑人謂之冠子山正得其狀自是行七十里出穎陽北門訪石堂山紫雲洞即邢和璞著書之所山徑極嶮捫蘿而上者七八里上有大洞蔭數畝水泉出焉久為道士所占爨煙熏燎又塗塓其內甚瀆靈真之境巳戒邑宰稍營草屋於側徙而出之此間峰勢危絶大抵相向如巧者為之又峭壁有若四字云神清之洞體法雄妙蓋薛老峰之比諸君疑古苔蘚自成文又意造化者筆焉莫得究其本末問道士及近居之民皆曰向無此異不知也少留數十刻會將雨而去猶冒夜行二十五里宿吕氏店馬上粗若疲厭則有師魯語怪永叔子聰歌俚調幾道吹洞簫往往一笑絶倒豈知道路之短長也十七日宿彭婆鎮遂緣伊流陟香山上上方飲于八節灘上始自峻極中院末及此凡題名于壁于石于樹間者蓋十有四處大凡出東門極東而南之自長夏門入繞嵩轘一匝四百里可謂窮極勝覽切切未滿志者聖俞不與焉今既還府恐相次便有塵事侵汨故急寫此奉報庶代一昔之談不宣絳頓首希深惠書言與師魯永叔子聰幾道逰嵩因誦而韻之梅堯臣聞君奉宸詔瑞祝𣢾靈岫山水聊得遊志願庶可就豈無朋從俱況此一一秀方蘄建春陌十刻殘晝漏初經緱氏嶺古柏尚鬱茂却過轘轅關巨石相撑鬭夕齋禮神祠法衮𬒳藻繡畢事登山椒常服更短後從者十數人輕齎不為陋是時天清隂力氣勇奔驟雲巖杳虧蔽花草藏澗竇傍林有珍禽驚聒若避彀盤石暫憩休泓泉助吞漱上窺玉女窗漸絶非可構下玩搗衣砧焜耀金紋透尹子體雄恢攀緣逾習狃歐陽稱壯齡疲軟屢顛踣競歡相扶持芒屩資踐蹂八仙存故壇三醉孰云謬鄙哉封祀碑數子昔鐫鏤偶志一時事曷虞來者詬絶頂瞰諸峰隘然輕宇宙遙思謝塵煩欲知羣鳥獸韓公傳石室聞之固巳舊當時興稍衰不暇苦尋究東崖暗壑中釋子持經呪于今二十年飲食同猿狖君子聆法音充爾溢膚腠嘗期躡屐過吾儕色先偢叶韻遂乖真諦言兹亦甘自咎中頂會幾望涼蟾皓如晝紛紛坐談謔草草具觴豆清露濕巾裳誰人苦羸瘦便即忘形骸胡為戀纓綬或疑桂宫近斯語豈狂瞀歸來逰少室崷崒殊引脰石室迢遞過探訪仍邂逅捫蘿上岑邃仙屋何廣袤乳水出其間涓涓自成溜凡骨此熏蒸靈真安可覯霞壁幾千尋四字侔篆籕咸意苔蘚文誠為造化授標之神清洞民俗未嘗遘忽覺風雨冥無能久瞻扣匆匆遂宵征勝事皆可復俚歌縱喧譁怪説多駮糅凌晨闕塞陽追賞顔匪厚窮極四百里寧憚疲左右昨朝書報豫聞甚醉醇酎所嗟滯逺方心焉倍如疚又答梅聖俞書前人絳白前自嵩嶺回即致書左右本為與足下不得同此勝事諸君所共歎恨自入山至還府凡一登臨一談話一食飲間必廣記而備言之欲使足下覽見本末與夫文駕連襼之不若間可以助發一笑勤勤在此爾及辱報反謂詫兹行而陋中春之逰疑足下遽答使者視前書之未詳也雖諷閲鄭重然祕不示外何則非諸君本意恐傳之而惑方欲道此以干聰明而未敢也忽得五百言詩自始及末誦次逰觀之美如指諸掌而又語重韻險亡有一字近浮靡而涉繆異則知足下於雅頌為深劉賔客有言人之神妙其在於詩以明詩之難能於文筆百倍矣今足下以文示人為略以詩曉人為精吾徒將不足遊其藩況敢與奧阼也歎感歎感不宣絳頓首謝公諱絳字希深時任尚書祠部員外郎直集賢院通判河南府小説多載神清洞事公詩亦有鎖樓臺之句信無疑矣其詳則具謝希深與梅聖俞書中昔公自跋集古録目序謂希深善評文章尹師魯辨論精博余每有所作伸紙疾讀便得余深意以示他人亦或有所稱皆非余所自得此敘之作惜無謝尹之知音然則公重希深豈減師魯又嘗銘其墓云制誥得西漢體又云以文知名今其集罕傳而二書偶得之英辭類稿附載於此粗見希深之筆力抑公文集既備而使知音者偕傳焉是亦公之志也編定校正紹熙二王郡人孫謙益字彥撝紹熙三年承直郎前桂陽軍軍學教授丁朝佐字懷忠紹熙四年郡人鄉貢進士曽三異字無疑紹熙五年郡人登仕郎胡柯字伯信覆校慶元元年州縣學職事葛潨字德源王伯芻字駒甫朱岑字山父胡柄字謙甫慶元二年郡人迪功郎新臨江軍清江縣主簿曽煥字文卿郡人鄉貢進士胡渙字季亨郡人鄉貢進士劉贙字棠仲郡人羅泌字長源歐陽文忠公集自汴京江浙閩蜀皆有之前輩嘗言公作文揭之壁間朝夕改定今觀手寫秋聲賦凡數本劉原父手帖亦至再三而用字往往不同故别本尤多後世傳録既廣又或以意輕改殆至訛謬不可讀廬陵所刋抑又甚焉卷帙叢脞略無統紀私竊病之久欲訂正而患寡陋未能也會郡人孫謙益老於儒學刻意斯文承直郎丁朝佐博覽群書尤長考證於是遍搜舊本傍采先賢文集與鄉貢進士曽三異等互加編校起紹熙辛亥春迄慶元丙辰夏成一百五十三卷别為附録五卷可繕寫模印惟居士集經公決擇篇目素定而後校衆本有增損其辭至百字者有移易後章為前章者皆巳附注其下如正統論吉州學記瀧岡阡表又逈然不同則收置外集自餘去取因革粗有據依或不必存而存之各為之説列於卷末以釋後人之惑弟首尾浩博隨得隨刻歲月差互標注抵捂所不能免其視舊本則有間矣既以輔鄉邦之闕亦使學者據舊鑒新思公所以增損移易則雖與公生不同時殆將如升堂避席親承指授或因是稍悟為文之法此區區本意也六月已巳前進士周必大謹書集古録跋尾卷第五歐陽文忠公集一百三十八隋老子廟碑開皇二年右老子廟碑隋薛道衡撰道衡文體卑弱然名重當時余所取者特其字畫近古故録之唐人二字集本作其碑後所題唐人姓名字皆不俗亦可佳也右真迹隋爾朱敞碑開皇五年右爾朱敞碑敞者榮從苐彥伯之子也按敞傳云字乾羅而此碑字天羅傳云為金州總管而碑又為徐州總管碑文雖殘闕然斑斑尚可讀其述徐州事頗多事為史家不取可也不書其官蓋闕繆也其字不同亦當以碑為是余於集録正前史之闕繆者多矣治平元年二月十六日書右真迹隋龍藏寺碑開皇六年右齊開府長兼行參軍九門張公禮撰不著書人名氏字畫遒徑有歐虞之體隋開皇六年建在今鎮州碑云太師上柱國大威公之世子左威衛將軍上開府儀同三司使持節恆州諸軍事恆州刺史鄂國公金城王孝仙奉敕勸奬州人一萬共造此寺其述孝仙云世業重於金張器識逾於許郭然北齊周隋諸史不見其父子名氏不詳何人也右集本其弊極矣以唐太宗之致治幾乎三王之盛獨於文章不能少變其體豈其積習之勢其來也逺非久而衆勝之則不可以驟革也是以羣賢奮力墾闢芟除至於元和然後蕪檅蕩平嘉禾秀草爭出而葩華美實爛然在目矣此碑在隋尤為文字淺陋者疑其俚巷庸人所為然視其字畫又非常俗所能蓋當時流弊以為文章止此為佳矣文辭既爾無取而浮圖固吾儕所貶集本作鄙所以録於此者第不忍棄其書爾治平元年三月十六日書右真迹隋李康清德頌開皇十一年右李康清德頌不著書撰人名氏文為聲偶而字畫竒古可愛康隴西狄道人也其碑首題云大隋冠軍將軍太中帥都督恆州九門縣令隴西李君清德之頌豫在河北時遣人於廢九門縣城中得此碑字多訛闕其後題十一年歲在辛亥大將軍在酉二月癸丑朔十二日甲子建年上有二字訛闕不可識按隋書開皇十一年歲在辛亥其二字乃開皇也大將軍在酉之説出於隂陽家前史不載而此碑見之右集本隋梁洋德政碑開皇十一年右隋梁洋德政碑在今蔡州新息隋開皇十一年行參軍事四字集本作參軍裴玉與州人為息州刺史梁洋建寶塔表德政碑按隋書志後周於新息置息州至大業中州廢也右真迹隋韓擒虎碑開皇十五年右韓擒虎碑不著書撰人名氏而以隋高祖為今上乃隋人所撰碑文屢言虎字獨於名下去之若避唐諱此不可知也今以碑文考隋書列傳其家世官勳大略多同惟其在齊為河長防主大都督車騎大將軍開府儀同三司白超防主轉洪超防主傳皆無之又遷和州刺史而傳為利州皆史官之闕誤當以碑為是而傳載閻羅王事甚怪而碑無之使其實有碑不冝集本作應不書以此見史家之妄也治平元年六月十日書右真迹隋陳茂碑開皇十八年右陳茂碑不著書撰人名氏而字畫精徑可喜隋書列傳載茂事尤多闕繆傳云髙祖為隋國公引為寮佐及受禪拜給事黃門侍郎在官十餘年轉益州總管司馬遷太府卿後數載卒而碑歷敘為高祖寮佐時官傳雖不書可也其自為黃門侍郎後又為行軍元帥長孫覽司馬又為蜀王府長史太僕卿判黃門侍郎上開府儀同三司梁州刺史等官史氏皆不書蓋其闕也又據碑茂為蜀王長史而傳為益州總管司馬碑為太僕卿而傳云太府皆史家之繆也碑云茂字延茂史亦闕治平甲辰秋社日書右真迹隋蒙州普光寺碑仁壽元年右蒙州普光寺碑蒙州者漢南陽郡之育陽縣也應劭曰育水出弘農盧氏南入于沔故後人於育加水為淯陽西魏置蒙州隋仁壽中改為淯州又為淯陽郡唐為縣屬金州碑仁壽元年建猶曰蒙州既而遂改淯州矣碑無書撰人名氏而筆畫遒美玩之亡集本作忘倦蓋開皇仁壽以來碑碣字書多妙而往往不著名氏惟丁道護所書常自著之然碑石在者尤少余每與蔡君謨惜之自大業已後率更與虞世南書始盛既接於唐遂大顯矣治平元年正月七日書右真迹隋丁道護啓法寺碑仁壽二年此書兼後魏遺法與楊家本微異隋唐之交善書者衆皆出一法道護所得最多楊本開皇六年去此十七年書當益老亦稍縱也甲辰治平𥘉月十日莆陽蔡襄記右啓法寺碑丁道護書蔡君謨博學君子也於書尤稱精鑒余所藏書未有不更其品目者其謂道護所書如此隋之晚年書學尤盛吾家率更與虞世南皆當時人也後顯於唐遂為絶筆余所集録開皇仁壽大業時碑頗多其筆畫率皆精徑而往往不著名氏每執卷惘然為之歎息惟道護能自著之然碑刻在者尤少余家集録千卷止有此尓有太學官楊褒者喜收書畫獨得其所書興國寺碑是梁正明中人所藏君謨所謂楊家本者是也欲求其本而不知碑所在然不難得則不足為佳物古人亦云百不為多一不為少者正謂此也治平元年立春後一日太廟齋宫書右真迹隋鉗耳君清德頌大業六年右不著書撰人名氏其碑首題云大隋恆山郡九門縣令鉗耳君清德之頌大業六年建字畫有非歐虞之學不能至也碑云君名文徹華隂朝邑人也本周王子晉之後避地西戎世為君長因以地為姓曾祖靜仕魏為馮翊太守祖朗成集二州刺史父康周荆安寧鄧四州總管别駕安陸龍門二郡守而前史皆不載碑在今廢九門縣中余為河北轉運使時求得之右集本隋廬山西林道場碑大業十三年右廬山西林道埸碑渤海公撰公為隋太常博士時作不著書人名氏而字法老徑疑公之書也西林道場者偽趙將竺氏捨俗出家名曇現始居于此晉太和二年光祿卿陶範始為現弟子慧永造寺而號西林按兩京記隋嘗更名佛寺為道埸此碑大業十三年建也顔魯公寓題碑隂百餘字尤竒偉今附于碑後右集本又右西林道埸碑渤海公撰公在隋為太常博士時作不著書人名氏字畫遒徑世或以為公自書公時年尚少又字法與公書不同不知何人書也按集本有韋述二字兩京記隋改佛寺為道場此碑大業中建故謂之道埸也右真迹唐孔子廟堂碑武德九年右孔子廟堂碑虞世南撰并書余為童兒時嘗得此碑以學書當時刻畫完好後二十餘年復得斯本則殘缺如此二字集本作矣因感夫物之終弊雖金石之堅不能以自久於是始欲集録前世之遺文而藏之殆集本作逮今蓋十有八年而得千卷可謂冨哉嘉祐八年九月二十九日書右真迹千文後虞世南書歲月未詳右虞世南所書言不成文乃信筆偶然尓其字畫精妙平生所書碑刻多矣皆莫及也豈矝持與不用意便有優劣耶集本作也熙寧辛亥續右真迹唐德州長壽寺舍利碑武德六年右德州長壽寺舍利碑不著書撰人名氏碑武德中建而所述乃隋事也其事迹文辭皆無取獨録其書爾余屢歎文章至陳隋不勝其弊而怪唐家能臻致治之盛而不能遽革文弊以謂積習成俗難於驟變及讀斯碑有云浮雲共嶺松張蓋明月與巖桂分叢乃知王勃云落霞與孤鶩齊飛秋水共長天一色當時士無賢愚以為警絶豈非其餘習乎右集本唐豳州昭仁寺碑貞觀二年右昭仁寺碑在豳州唐太宗與薛舉戰處也唐自起義與群雄戰處後皆建佛寺云為陳亡士薦福湯武之敗桀紂殺人固亦多矣而商周享國各集本作皆數百年其荷天之祐者以其心存大公為民除害也唐之建寺外雖託為戰亡之士其實自贖殺人之咎尓其撥亂開基有足壯者及區區於此不亦陋哉碑文朱子奢撰而不著書人名氏字畫甚工此余所録也治平甲辰秋分後一日書右真迹唐吕州普濟寺碑貞觀二年許敬宗撰右吕州普濟寺碑吕州者霍邑也唐高祖義兵起太原始破宋老生於此義寧元年乃以霍邑趙城汾西靈石四縣置霍山郡武德元年更曰吕州太宗十七年遂廢也右集本唐衛國公李靖碑顯慶三年當載于後同是許敬宗撰附此右李靖碑許敬宗撰唐初承陳隋文章衰弊之時作者務以浮巧為工故多失其事實不若史傳為詳惟其官封頗備史云為撫慰使而碑云安撫使其義無異而後世命官多襲古號蓋靖時未嘗有撫慰使也由是言之不可不正又靖為刑部尚書時以本官行太子左衛率其封衛國公也授濮州刺史蓋太宗以功臣為世襲刺史後雖不行皆史冝書集本有而不書者闕也六字其餘略之可也故聊志之治平元年三月二十二日書右真迹唐顔師古等慈寺碑貞觀二年右等慈寺碑顔師古撰其寺在鄭州汜水唐太宗破王世充竇建德乃於其戰處建寺云為陳亡士薦福唐𥘉用兵破賊處多大抵皆造寺自古創業之君其英豪智略有非常人可及者矣至其卓然信道而知義則非積學誠明之士不能到也太宗英雄智識不世之主而牽惑習俗之弊猶崇信浮圖豈以其言浩博無窮而好盡物理為可喜邪蓋自古文姦言以惑聽者雖聰明之主或不能免也惟其可喜乃能惑人故余於集本有其字本紀譏其牽於多愛者謂此也治平元年清明後一日書右真迹隋郎茂碑貞觀五年右隋郎茂碑李百藥撰其弟頴亦有碑在今鎮府北大墓林中余為都轉運使時得之隋書列傳言茂卒於京師此碑云從幸江都而卒史氏之繆當以碑為正右集本又碑在大墓林中余為都運使時得之殆今蓋二十年矣嘉祐八年三月二十二日上御延和放進士許將等及第明日歇泊假間閲遂書隋書列傳言茂卒于京師此碑云從幸江都而卒史氏之繆當以碑為正焉右真迹唐郎頴碑貞觀五年右唐郎穎碑李百藥撰宋才書字畫甚偉穎父名基字世業而李百藥書穎世次但云父世業又書穎兄茂碑亦然考其碑文有皇基締構之言則基字當時公私無所諱避而於書世次四字集本作百藥書頴父字而不名不詳其義也是以君子貴乎博學集本有穎事唐為大理卿隋唐之時屢定律令蓋法吏也一十九字嘉祐八年九月二十四日書右真迹唐郎穎碑隂題名歲月未詳右郎穎碑隂題名柱國府僚佐三十二人常山公府國官一百七人合一百三十九人為一卷柱國府長史司馬掾屬各一人咨議記室司倉司功司戶司兵司鎧司法司田司士參軍事各一人又有參軍事五人行參軍十人典籖三人常山國官國令大農各一人常侍侍郎國尉各二人典衛六人舍人四人城局廟長學官各一人食官廄牧各四人典府長一人典府丞二人親事七十五人頴以正觀四年卒此蓋唐制也右集本唐九成宫醴泉銘貞觀六年右九成宫醴泉銘唐祕書監魏徴撰歐陽率更書九成宫即隋仁壽宫也太宗避暑於宫中而乏水以杖琢地得水而甘因名醴泉焉右集本唐歐陽率更臨帖歲月未詳同是率更書附此右率更臨帖吾家率更蘭臺世有清德其筆法精妙乃其餘事豈止士人模楷雖海外夷狄皆知為貴而後裔所宜勉旃庶幾不殞其美也右真迹唐岑文本三龕記貞觀十五年右三龕記唐兼中書侍郎岑文本撰起居郎禇遂良書字畫尤竒偉在河南龍門山山夾伊水東西可愛俗謂其東曰香山其西曰龍門龍門山壁間鑿石為佛像大小數百多後魏及唐時所造惟此三龕像最大乃魏王泰為長孫皇后造也右集本唐孟法師碑貞觀十六年右孟法師碑唐岑文本撰禇遂良書法師名靜素江夏安陸人也少而好道誓志不嫁隋文帝居之京師至德宫至唐太宗十二年卒年九十七右集本唐皇甫忠碑貞觀十四年右皇甫忠碑著作佐郎李儼撰忠為泰州龍門令歲滿縣民前左勳衛裴公隱等一千三百人申省請留八座報云公等請來遲晚縣令今已替訖好人堪用縣國共須豈一縣士庶獨懷悕或作怯惜所請不允忠以唐太宗時為令當時臺省文字如此可愛泰州者義寧元年以河中之汾隂龍門置治汾隂武德二年徙治龍門太宗十七年州廢今碑後列縣人姓名有録事鄉長鄉老里正縣博士助教佐史等今之縣吏惟録事里正其名在爾右集本唐辨法師碑顯慶三年當載于後同是李儼撰附此右辨法師碑李儼撰薛純陀書純陀唐太宗時人集本有也字其書有筆法其遒徑精悍不減吾家蘭臺意其當時必為知名士而今世人無知者然其所書亦不傳於後世余家集録可謂博矣所得純陀書秖此而已如其所書必不止此而巳也蓋其不幸堙沉泯滅非余偶録得之則遂不見于世矣乃知士有負絶學髙世之名而不幸不傳於後者可勝數哉可勝歎哉治平元年閏五月晦日書右真迹唐孔頴逹碑貞觀二十二年右孔頴逹碑于志寧撰其文磨滅然尚可讀今以其可見者質於唐書列傳傳所闕者不載頴逹卒時年壽其與魏鄭公奉勑共修隋書亦不著又其字不同傳云字仲逹碑云字沖逺碑字多殘缺惟其名字特完可以正傳之繆不疑以沖逺為仲逹以此知文字轉易失其真者何可勝數幸而因余集録所得以正其訛舛者亦不為少也乃知余家所藏非徒玩好而巳其益豈不博哉集本無此六字治平元年端午日書右真迹唐薛稷書貞觀永徽之間薛稷書刻石者余家集録頗多與墨迹互有不同唐世顔栁諸家刻石者字體時時不類謂由模刻人有工拙昨日見楊褒家所藏薛稷書君謨以為不類信矣凡世人於事不可一概有知而好者有好而不知者有不好而不知者有不好而能知者褒於書畫好而不知者也畫之為物尤難識其精粗真偽非一言可逹得者各以其意披圖所賞未必是秉筆之意也昔梅聖俞作詩獨以吾為知音吾亦自謂舉世之人知梅詩者莫吾若也吾嘗問渠最得意處渠誦數句皆非吾賞者以此知披圖所賞未必得秉筆之人本意也右集本唐益州學館廟堂記永徽元年顔有意書髙聯之名於義不安頗疑有意得於古碑之訛缺尓存之以俟博學者右集本唐徐王元禮碑咸亨三年右徐王元禮碑崔行功撰趙仙客書元禮唐髙祖子也以碑考傳年壽官閥悉同而碑云使持節徐譙泗三州諸軍事徐州刺史又云贈太尉使持節大都督冀相貝滄德魏博等八州諸軍事冀州刺史傳云為徐州都督又云贈冀州大都督傳既簡略又都無法而碑之所書亦失也蓋刺史非兼州之官都督非一州之號碑云持節徐譙泗三州諸軍而傳獨為徐一州刺史此其失也當如前史持節秦涼州諸軍事秦涼二州刺史乃為得爾其書贈官則如碑之書是矣蓋為一州刺史而兼督八州軍集本有州字事爾都者有所兼總之名也此特小故而余區區辨之者前史失之久矣又國朝自削方鎮之權而節度使都督無復兼州而舊名不除是節度都督自施於已此不可不正其失也治平甲辰中元日書右真迹唐龍興宫碧落碑咸亨元年右碧落碑在絳州龍興宫宫有碧落尊像篆文刻其背故世傳為碧落碑據李璿之以為陳惟玉書李漢以為黃公撰書莫知孰是洛中紀異云碑文成而未刻有二道士來集本無此字請刻之閉户三日不聞人聲人怪而破户有二白鴿飛去而篆刻宛然此説尤怪世多不信也碑文言有唐五十三祀龍集敦牂乃髙宗總章三年歲在庚午也又云哀子李訓誼撰諶為妣妃造石像按唐書韓王元嘉有子訓誼撰而無諶又有幼子訥元嘉以則天垂拱四年見殺在總章三年集本有立碑二字後十八年集本有史字有子訥不足怪而不應無諶蓋史官之闕也嘉祐八年十月四日書右真迹唐智乘寺碑咸亨四年右智乘寺禪院集本有碑字者唐鄭惠王所作也惠王名元懿髙祖第十三子也有子十人列于碑後而第五子樂陵公闕其名按唐書宗室世繫表集本作譜樂陵公名球不知集本有碑字何為獨闕也今唐書年表以嗣王敬為璥樂平公圭為樂安公新平公璲為遂三者皆史家之失當以碑為正世繫譜牒歲久傳失尤難考正而碑碣皆當時所刻理不得差故集古所録於前人世次是正頗多也治平元年清明前一日書右真迹唐吳廣碑總章二年右吳廣碑不著書撰人名氏而字畫精徑可喜廣字黑闥唐初與程知節秦叔寶等俱從太宗征伐後與殺建成有功至髙宗時為洪州都督以卒然唐書不見其名氏惟會要列陪葬昭陵人有洪州刺史吳黑闥亦不知其名廣也其名字事迹幸見於後世者以有斯碑也碑字稍磨滅世亦罕見獨余集録得之遂以傳者以其筆畫之工也故余嘗為蔡君謨言書雖學者之餘事而有助於金石之傳者以此也治平元年八月八日書右真迹唐九門縣西浮圖碑上元三年右九門縣西浮圖碑唐應詔四科舉董行思文清河傅德節書題云九門縣合鄉城人等為國建浮圖之碑浮圖在智矩寺中寺今亦廢碑上元三年建按唐有兩上元此碑云歲在丙子乃髙宗上元三年也肅宗上元三年歲在壬寅爾右集本唐陶雲德政碑永淳三年右唐申州録事張義感撰雲字大舉河南伊闕人也髙宗時為恆州刺史碑永淳三年立豫為河北轉運使至真定府見碑仆在府門外半埋地中命工掘出立于廡下字為行書筆迹遒麗而不著書者姓名惜哉右真迹隋泛愛寺碑大業五年誤置此李伯藥集本作樂下同字僅存其下磨滅而書字猶可辨疑此碑伯藥自書字畫老徑可喜秋暑鬱然覽之可以忘倦治平丙午孟饗攝事齋宫書南譙醉翁六一居士右真迹集古録跋尾卷第五老子廟碑元第二百四爾朱敞碑元第三百三十五殘闕一作缺龍藏寺碑元第十七又已廢一作今廢太平寺碑元第四百四十六李康清德頌元第二十八梁洋德政碑元第二百二十九韓擒虎碑元第九百九十二陳茂碑元第八百二普光寺碑元第二百五十啓法寺碑元第二百五十三鉗耳君清德頌元第三十九西林道場碑元第十五孔子廟堂碑元第一童兒一作兒童虞世南書元附四十六續此下一有附字長壽寺舍利碑元第四百四十四治平元年三月十六日書一有此十字致治一作至治昭仁寺碑元第七百九十二普濟寺碑元第三百二十三廢也一無也字李靖碑元第四百六十四等慈寺碑元第四百三十二郎茂碑元第十八又為都此下一有轉字延和此下一有殿字正焉一無焉字郎頴碑元第十九郎頴碑隂題名元第二十九成宫醴泉銘元第七十七率更臨帖元第五百五十四美也一無也字三龕記元第三十四至三十五孟法師碑元第三十六皇甫忠碑元第六百三十五佐郎一無佐字縣國一作國家為令一作去縣治平元年五月二日書一有此九字辨法師碑元第八百八十二孔頴逹碑元第六百七十二薛稷書元無卷第有不好而不知者有不好而能知者一作有不好而知者有不好而不能知者得者一作之益州學館廟堂記元第一百二十二徐王元禮碑元第九百三十九碧落碑元第十三智乘寺碑元第四百一十七何為此下一有而字吳廣碑元第九百四十八九門縣西浮圖碑元第七十五智矩一作炬陶雲德政碑元第十一真定府一無府字泛愛寺碑元第六百此碑在邢州隋大業五年立合次啓法寺碑誤置卷末
