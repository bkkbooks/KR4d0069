body:
  text: 正獻公故太子太師致仕祁國公贈司徒兼侍中杜公諱衍字世昌越州山隂人也其先本出於堯之後厯三代常為諸侯後徙其封於杜而子孫散適他國者以杜為氏自杜赫為秦将軍後三世御史大夫周及其子建平侯延年仍顯於漢又九世當陽侯預顯於晉又十有四世岐國公佑顯於唐又九世而至於祁公其為家有法其吉凶祭祀齋戒日時幣祝從事一用其家書自唐滅士喪其舊禮而一切苟簡獨杜氏守其家法不遷於世俗盖自春秋諸侯之子孫厯秦漢千有餘歳得不絶其世譜而唐之盛時公卿家法存於今者惟杜氏公自曽髙以來以恭儉孝謹稱鄉里至公為人尤潔廉自克其為大臣事其上以不欺為忠推於人以行已取信故其動静纎悉謹而有法至考其大節偉如也公享年八十官至尚書左丞方其六十有九嵗且盡即上書告老明年以太子少師致仕累遷太子太保太傅太師封祁國公於其家天子祀明堂遣使者召公陪祠將有所問以疾不至而歳時存問勞賜不絶公少舉進士高第為揚州觀察推官知平遙縣通判晉州知乾州遷河東京西路提㸃刑獄知揚州河東陜西路轉運使入為三司户部副使拜天章閣待制知荆南府未行以為河北路都轉運使遂知天雄軍召為御史中丞判流内銓知審官院拜樞宻直學士知永興軍徙知并州遷龍圖閣學士復知永興軍權知開封府康定元年以刑部侍郎同知樞宻院事即拜副使慶厯三年遷吏部侍郎樞宻使明年以本官同中書門下平章事公治吏事如其為人其聴獄訟雖明敏而審覈愈精故屢決疑獄人以為神其簿書出納推析毫髪終日無倦色至為條目必使吏不得為姦而已及其施於民者則簡而易行始居平遙嘗以吏事適他州而縣民争訟者皆不肯決以待公歸知乾州未滿嵗安撫使察其治行以公權知鳯翔府二邦之民争於界上一曰此我公也汝奪之一曰今我公也汝何有焉夏人初叛命天下苦於兵而自陜以西尤甚吏縁侵漁調發督廹至民破産不能足徃徃自經投水以死於是時公在永興語其人曰吾不能免汝然可使汝不勞爾乃為之區處計較量物有無貴賤道里逺近寛其期㑹使以次輸送由是物不踴貴車牛芻秣宿食來徃如平時而吏束手無所施民比他州費省十六七至於繕治城郭器械民皆不知開封治京師常撓於權要有干其法而能不為之屈者世皆以為難至公能使權要不敢有所干凡其為治以聴㫁盜訟為能否爾獨公始有餘力省其民事如治他州而畿赤諸縣之民皆被其惠開封比比出能吏而兼於民政者惟公一人吏部審官主天下吏員而居職者類以不久遷去故吏得為姦公始視銓事一日選者三人争某闕公以問吏吏受丙賕對曰當與甲乙不能争遂授他闕居數日吏教丙訟甲負某事不當得公悟召乙問之乙謝曰業已得他闕不願争公不得已與丙而笑曰此非吏罪乃吾未知銓法爾因命諸曹各具格式科條以白問曰盡乎曰盡矣明日勑諸吏無得升堂使坐聴行文書而已由是吏不得與銓事與奪一出於公月餘翕然聲動京師其在審官有以賕求官者吏謝不受曰我公有賢名不久見用去矣姑少待之慶厯之初上厭西兵之久出而民弊亟用今丞相富公樞宻韓公及范文正公而三人者遂欲盡革衆事以修紀綱而小人權倖皆不悅獨公與相佐佑而公尤抑絶僥倖凡内降與恩澤者一切不與每積至十數則連封而面還之或詰責其人至慙恨涕泣而去上嘗謂諫官歐陽脩曰外人知杜某封還内降邪吾居禁中有求恩澤者每以杜某不可告之而止者多於所封還也其助我多矣此外人及杜某皆不知也然公與三人者卒皆以此罷去公多知本朝故實善決大事初邉將議欲大舉以擊夏人雖韓公亦以為可舉公争以為不可大臣至有欲以沮軍罪公者然兵後果不得出契丹與夏人争銀瓮族大戰黄河外而鴈門麟府皆警范文正公安撫河東欲以兵從公以為契丹必不來兵不可妄出范公怒至以語侵公公不為恨後契丹卒不來二公皆世俗指公與為朋黨者其論議之際盖如此及三人者將罷去公獨以為不可遂亦罷以尚書左丞知兖州歳餘乃致仕公自布衣至為相衣服飲食無所加雖妻子亦有常節家故饒財諸父分産公以所得悉與兄弟之貧者俸禄所入分給宗族賙人急難至其歸老無屋以居寓於南京驛舍者久之自少好學工書喜為詩讀書雖老不倦推奨後進今世知名士多出其門居家見賔客必問時事聞有善喜若已出至有所不可憂見於色或夜不能寐如任其責者凡公所以行之終身者有能履其一君子以為人之所難而公自謂不足以名後世遺戒子孫無得紀述嗚呼豈所謂任重道逺而為善惟不足者歟曽祖太子少保諱某贈太師祖鴻臚卿諱某追封吳國公父尚書度支員外郎諱某追封韓國公皆贈太師尚書令兼中書令娶相里氏封晉國夫人子男曰詵大理評事訢太常博士訥将作監主簿詒秘書省正字三子早卒女長適集賢校理蘇舜欽次適秘閣校理李綖次適單州團練推官張遵道公以嘉祐二年某月某日卒於家其子訢以某年某月某日𦵏公於應天府宋城縣之仁孝原銘曰翼翼祁公率履自躬一其初終惟徳之恭公在於位士知貪㢘退老於家四方之瞻豈惟士夫天子曰咨爾曲爾直繩之墨之正爾方員有矩有規人莫之踰公無爾欺予左予右惟公是毗公雖告休受寵不已宫臣國公即命於第奕奕明堂萬邦從祀豈無臣工為予執事何以召之惟公舊徳公不能來予其徃錫
