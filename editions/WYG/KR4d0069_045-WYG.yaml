body:
  text: 通進司上書臣伏見國家自元昊叛逆關西用兵以來為國言事者衆矣臣初竊謂三䇿以料賊情然臣迂儒不識兵之大計始猶遲疑未敢自信今兵興既久賊形已露如臣素料頗不甚逺故竊自謂有可以助萬一而塵聽覽者謹條以聞惟陛下仁聖寛其狂妄之誅幸甚夫關西弛備而民不見兵者二三十年矣使賊萌亂之初藏形隱計卒然而來當是時吾之邊屯寡弱城堡未完民習久安而易驚将非素選而敗怯使其羊驅豕突可以奮然而深入然國威未挫民力未疲彼得城而居不能久守虜掠而去可邀擊其歸此下䇿也故賊知而不為之外國侵邊自古為患其攻城掠野敗則走勝則來蓋其常事此中䇿也故賊兼而用之若夫假僣名號以威其衆先擊吾之易取者一二以悅其心然後訓養精銳為長久之謀故其來也雖勝而不前不敗而自退所以誘吾兵而勞之也或擊吾東或擊吾西乍出乍入所以使吾兵分備多而不得減息也吾欲速攻賊方新銳坐而待戰彼則不來如此相持不三四嵗吾兵已老民力已疲不幸又遇水旱之災調歛不勝而盜賊羣起彼方奮其全銳擊吾困弊可也使吾不堪其困忿而出攻決於一戰彼以逸而待吾勞亦可也幸吾苦兵計未知出遂求通聘以邀嵗時之賂度吾困急不得不從亦可也是吾力一困則賊謀無施而不可此兵法所謂不戰而疲人兵者上䇿也而賊今方用之今三十萬之兵食於西者二嵗矣又有十四五萬之鄉兵不耕而自食其民自古未有四五十萬之兵連年仰食而國力不困者也臣聞元昊之為賊威能畏其下恩能死其人自初僣叛嫚書已上逾年而不出一出則鋒不可當執劫蕃官獲吾將帥多禮而不殺此其兇謀所畜皆非倉卒者也奈何彼能以上䇿而疲吾吾不自知其已困彼為久計以撓我我無長䇿而制之哉夫訓兵養士伺隙乘便用間出竒此將帥之職也所謂閫外之事而君不御者可也至於外料賊謀之心内察國家之勢知彼知此因謀制敵此朝廷之大計也所謂廟算而勝者也不可以不思今賊謀可知以久而疲我耳吾勢可察西人已困也誠能豐財積粟以紓西人而完國壯兵則賊謀沮而廟算得矣夫兵攻守而已然皆以財用為強弱也守非財用而不久此不待言請試言攻昔秦席六世之強資以事胡卒困天下而不得志漢因文景之富力三舉而纔得河南隋唐突厥吐蕃常與中國相勝敗擊而勝之有矣未有舉而滅者秦漢尤强者其所攻今元昊之地是也況自劉平陷没賊鋒熾銳未嘗挫衂攻守之計非臣所知天威所加雖終期於掃盡然臨邊之将尚未聞得賊釁隙挫其兇鋒是攻守皆未有休息之期而財用不為長久之計臣未見其可也四五十萬之人坐而仰食然關西之地物不加多關東所有莫能運致掊克細碎既以無益而罷之矣至於鬻官入粟下無應者改法㩁貨而商旅不行是四五十萬之人惟取足於西人而已西人何為而不困困而不起為盜者須水旱爾外為賊謀之所疲内遭水旱而多故天下之患可勝道哉夫關西之物不能加多則必通其漕運而致之漕運已通而關東之物不充則無得而西矣故臣以為通漕運盡地利權商賈三術並施則財用足而西人紓國力完而兵可以久以守以攻惟上所使夫小𤨏目前之利既不足為長久之謀非旦夕而可效故為長久而計者初若迂愚而可笑在必而行之則其利溥矣故臣區區不敢避迂愚之責請上便宜三事惟陛下裁擇其一曰通漕運臣聞今為西計者皆患漕運之不通臣以為但未求之耳今京師在汴漕運不西而人之習見者遂以為不能西不知秦漢隋唐其都在雍則天下之物皆可致之西也山川地形非有變易於古其路皆在昔人可行今人胡為而不可漢初嵗漕山東粟數十萬石是時運路未修其漕尚少其後武帝益修渭渠至漕百餘萬石隋文帝時㳂水為倉轉相運置而關東汾晉之粟皆至渭南運物最多其遺倉之迹徃往皆在然皆尚有三門之險自唐裴耀卿又尋隋迹於三門東西置倉開山十八里為陸運以避其險卒泝河而入渭當時嵗運不減二三百萬石其後劉晏遵耀卿之路悉漕江淮之米以實關西後世言能經財利而善漕運者耀卿與晏為首今江淮之米嵗入于汴者六百萬石誠能分給關西一二百萬石足矣今兵之食汴漕者出戍甚衆有司不惜百萬之粟分而及之其患者三門阻其中爾今宜浚治汴渠使嵗運不阻然後按求耀卿之迹不憚十許里陸運之勞則河漕通而物可致且紓關西之困使古無法今有可為尚當為之況昔人行之而未逺今人行之而豈難哉耀卿與晏初理漕時其得尚少至其末年所入十倍是可久行之法明矣此水運之利也臣聞漢髙祖之入秦不由東關而道南陽過酈析而入武關曹操等起兵誅董卓亦欲自南陽道丹析而入長安是時張濟又自長安出武關奔南陽則自古用兵往来之徑也臣嘗至南陽問其遺老云自鄧西北至永興六七百里今小商賈往往行之初漢髙入關其兵十萬夫能容十萬兵之路宜不甚狹而險也但自雒陽為都行者皆趨東關其路久而遂廢今能按求而通之則武昌漢陽郢復襄陽梁洋金商均房光化㳂漢之地十一二州之物皆可漕而頓之南陽自南陽為輕車人輦而遞之募置遞兵為十五六鋪則十餘州之物日日入關而不絶㳂漢之地山多美才近漢之民仰足而有餘以造舟車甚不難也前日陛下深恤有司之勤内賜禁錢數十萬以供西用而道路艱逺輦運逾年不能畢至至於軍装輸送多苦秋霖邊州已寒冬服尚滯於路其艱如此夫使州縣綱吏逺輸京師轉冒艱滯然後得西豈若較南陽之旁郡度其道里入于武關與至京師逺近等者與其尤近者皆使直輸于關西京師之用有不足則以禁帑出賜有司者代而充用其迂曲簡直利害較然矣此陸運之利也其二曰盡地利臣聞昔之畫財利者易為工今之言財利者難為術昔者之民賦稅而已故其不足則鑄山煑海㩁酒與茶征關市而筭舟車尚有可為之法以苟一時之用自漢魏迄今其法日増其取益細今取民之法盡矣昔者賦外之征以備有事之用今盡取民之法用於無事之時悉以冗費而糜之矣至卒然有事則無法可増然獨猶有可為者民作而輸官者已勞而游手之人方逸地之産物者耕不得代而不墾之土尚多是民有遺力地有遺利此可為也况歴視前世用兵者未嘗不先營田漢武帝時兵興用乏趙過為畎田人犂之法以足用趙充國攻西羌議者爭欲出擊而充國深思全勝之䇿能忍而待其弊至違詔罷兵而治屯田田於極邊以遊兵而防鈔寇則其理田不為易也猶勉為之後漢之時曹操屯兵許下強敵四面以今視之疑其旦夕戰爭而不暇然用棗祇韓浩之計建置田官募民而田近許之地嵗得榖百萬石其後郡國皆田積榖無數隋唐田制尤廣不可勝舉其勢艱而難田莫若充國迫急而不暇田莫如曹操然皆勉焉不以迂緩而不田者知地利之博而可以紓民勞也今天下之土不耕者多矣臣未能悉言謹舉其近者自京已西土之不闢者不知其數非土之瘠而棄也蓋人不勤農與夫役重而逃爾久廢之地其利數倍於營田今若督之使勤與免其役則願耕者衆矣臣聞鄉兵之不便於民議者方論之矣充兵之人遂棄農業託云教習聚而飲博取資其家不顧無有官吏不加禁父兄不敢詰家家自以為患也河東河北關西之鄉兵此猶有用若京東西者平居不足以備盜而水旱適足以為盜其尤可患者京西素貧之地非有山澤之饒民惟力農是仰而今三夫之家一人五夫之家三人為游手凡十八九州以少言之尚可四五萬人不耕而食是自相糜耗而重困也今誠能盡驅之使耕于棄地官貸其種嵗田之入與中分之如民之法募吏之習田者為田官優其課最而誘之則民願田者衆矣太宗皇帝時嘗貸陳蔡民錢使市牛而耕真宗皇帝時亦用耿望之言買牛湖南而治屯田今湖南之牛嵗賈于北者皆出京西若官為買之不難得也且鄉兵本農也籍而為兵遂棄其業今幸其去農未久尚可復驅還之田畝使不得羣逰而飲博以為父兄之患此民所願也一夫之力以逸而言任耕縵田一頃使四五萬人皆耕而久廢之田利又數倍則嵗穀不可勝數矣京西之分北有大河南至漢而西接關若又通其水陸之運所在積穀惟陛下詔有司而移用之耳其三曰權商賈臣聞秦廢王法啓兼并其上侵公利下刻細民為國之患久矣自漢以来嘗欲為法而抑奪之然不能也蓋為國者興利日繁兼并者趨利日巧至其甚也商賈坐而權國利其故非他由興利廣也夫興利廣則上難專必與下而共之然後通流而不滯然為今議者方欲奪商之利一歸於公上而專之故奪商之謀益深則為國之利益損前日有司屢變其法法每一變則一嵗之間所損數百萬議者不知利不可專欲專而反損但云變法之未當變而不巳其損愈多夫欲十分之利皆歸于公至其虧少十不得三不若與商共之常得其五也今為國之利多者茶與鹽耳茶自變法巳来商賈不復一嵗之失數年莫補所在積朽棄而焚之前日議者屢言三稅之法為便有司既已詳之矣今誠能復之使商賈有利而通行則上下濟矣解池之鹽積若山阜今宜暫下其價誘羣商而散之先為令曰三年將復舊價則貪利之商爭先而湊矣夫茶者生於山而無窮鹽者出於水而不竭賤而散之三年十未減其一二夫二物之所以貴者以能為國資錢幣爾今不散而積之是惜朽壤也夫何用哉夫大商之能蕃其貨者豈其銖銖躬自鬻於市哉必有販夫小賈就而分之販夫小賈無利則不為故大商不妬販夫之分其利者恃其貨博雖取利少貨行流速則積少而為多也今為大國者有無窮不竭之貨反妬大商之分其利寧使無用而積為朽壤何哉故大商之善為術者不惜其利而誘販夫大國之善為術者不惜其利而誘大商此與商賈共利取少而致多之術也若乃縣官自為鬻市之事此大商之不為臣謂行之難久者也誠能不較錙銖而思逺大則積朽之物散而錢幣通可不勞而用足矣臣愚不足以知時事若夫堅守以扞賊利則出而擾之凡小便宜願且委之邊將至於積穀與錢通其漕運不二三嵗而國力漸豐邊兵漸習賊銳漸挫而有隙可乘然後一舉而滅之此萬全之䇿也願陛下以其小者責將帥謀其大計而行之則天下幸甚歐陽文粹巻四欽定四庫全書歐陽文粹巻五宋陳亮編書準詔言事臣近準詔書許臣上書言事臣學識愚淺不能廣引深逺以明治亂之原謹採當今急務條為三弊五事以應詔書所求伏惟陛下裁擇臣聞自古王者之治天下雖有憂勤之心而不知致治之要則心愈勞而事愈乖雖有納諫之明而無力行之果斷則言愈多而聽愈惑故為人君者以細務而責人專大事而獨斷此致治之要術也納一言而可用雖衆說不得以沮之此力行之果斷也知此二者天下無難治矣伏見國家自大兵一動中外騷然陛下思社稷之安危念兵民之疲弊四五年來聖心憂勞可謂至矣然而兵日益老賊日益強併九州之力討一西戎小者尚無一人敢前今又北敵大者違盟而動其將何以禦之從來所患者四裔今四裔叛矣所惡者盜賊今盜賊起矣所憂者水旱今水旱作矣所賴者民力今民力困矣所須者財用今財用乏矣陛下之心日憂於一日天下之勢嵗危於一嵗此臣所謂用心雖勞不知求致治之要者也近年朝廷開發言路獻計之士不下數千然而事緒轉多枝梧不暇從前所採衆議紛紜至於臨事誰策可用此臣所謂聽言雖多不如力行之果斷者也伏思聖心所甚憂而當今所尚闕者不過曰無兵也無將也無財用也無禦戎之䇿也無可任之臣也此五者陛下憂其未有而臣謂今皆有之然陛下未得而用者未思其術也國家創業之初四方割據中國地狹兵民不多然尚能南取荆楚收偽唐定閩嶺西平兩蜀東下并潞北窺幽燕當時所用兵財將吏其數㡬何惟善用之故不覺其少何況今日承百年祖宗之業盡有天下之富強人衆物盛十倍國初故臣敢曰有兵有將有財用有禦戎之䇿有可任之臣然陛下皆不得而用者其故何哉由朝廷有三大弊故也何謂三弊一曰不慎號令二曰不明賞罰三曰不責功實此三弊因循於上則萬事弛慢廢壊於下臣聞號令者天子之威也賞罰者天子之權也若號令不信賞罰不當則天下不服故又須責臣下以功實然後號令不虚出而賞罰不濫行是以慎號令明賞罰責功實此三者帝王之竒術也自古人君英雄如漢武帝聰明如唐太宗皆知用此三術而自執威權之柄故所求無不得所欲皆如意漢武好用兵則誅滅四夷立功萬里以快其心欲求將則有衛霍之材以供其指使欲得賢士則有公孫董汲之徒以稱其意唐太宗好用兵則誅突厥服遼東威振夷狄以逞其志欲求將則有李靖李勣之徒入其駕馭欲得賢士則有房杜之輩在其左右此二帝者可謂所求無不得所欲皆如意無他術也惟能自執威權之柄耳伏惟陛下以聖明之姿超出二帝又盡有漢唐之天下然而欲禦邊則常患無兵欲破賊則常患無將欲贍軍則常患無財用欲威服四夷則常患無䇿欲任使賢材則常患無人是所求皆不得所欲皆不如意其故無他由不用威權之術也自古帝王或為強臣所制或為小人所惑則威權不得出於巳今朝無強臣之患旁無小人偏任之溺内外臣庶尊陛下如天愛陛下如父傾耳延首顧陛下之所為然何所憚而不為乎若一日赫然執威權以臨之則萬事皆辦何患五者之無奈何為三弊之因循而一事之不集臣請言三弊夫言多變則不信令頻改則難從今出令之初不加詳審行之未久尋又更張以不信之言行難從之令故每有處置之事州縣知朝廷未是一定之命則官吏或相謂曰且未要行不久必須更改或曰備禮行下略與應破指揮旦夕之間果然又變至於將吏更易道路疲於送迎符牒縱横上下莫能遵守中外臣庶或聞而歎息或聞而竊笑歎息者有憂天下之心竊笑者有輕朝廷之意號令如此欲威天下其可得乎此不慎號令之弊也用人之術不過賞罰然賞及無功則恩不足勸罰失有罪則威無所懼雖有人不可用矣太祖時王全斌破蜀而歸功不細矣犯法一貶十年不問是時方討江南故黜全斌與諸將立法太祖神武英斷所以能平定天下者其賞罰之法皆如此也昨關西用兵四五年矣大將以無功罷者依舊居官軍中見無功者不妨得好官則諸將誰肯立功矣禆將畏懦逗留者皆當斬罪或暫貶而尋遷或
