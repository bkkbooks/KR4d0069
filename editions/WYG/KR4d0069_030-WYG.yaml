body:
  text: 碑銘王文正公至和二年七月乙未樞宻直學士右諌議大夫王素奏事殿中巳而泣且言曰臣之先臣旦相真宗皇帝十有八年今臣素又得待罪侍從之臣惟是先臣之訓其遺業餘烈臣實無似不能顯大而墓碑至今無辭以刻惟陛下哀憐不忘先帝之臣以假寵於王氏而朂其子孫天子曰嗚呼惟汝父旦事我文考真宗叶德一心克終厥位有始有卒其可謂全德元老矣汝素以是刻於碑素拜稽首泣而出明日有詔史舘修撰歐陽修曰王旦墓碑未立汝可以銘臣修謹按故推誠保順同德守正翊戴功臣開府儀同三司守太尉充玉清昭應宫使上柱國太原郡開國公贈太師尚書令兼中書令追封魏國公諡曰文正王公諱旦字子明大名莘人也皇曽祖諱言滑州黎陽令追封許國公皇祖諱徹左拾遺追封魯國公皇考諱祐尚書兵部侍郎追封晋國公皆累贈太師尚書公兼中書令曽祖妣姚氏贈魯國夫人祖妣田氏贈秦國夫人妣任氏贈徐國夫人邉氏贈秦國夫人公皇考以文章自顯漢周之際逮事太祖太宗為名臣嘗諭杜重威使無反漢拒盧多遜害趙普之謀以百口明符彦卿無罪故世多稱王氏有隂德公之皇考亦自植三槐於庭曰吾之後世必有為三公者此其所以志也公少好學有文太平興國五年進士及第為大理評事知臨江縣監潭州銀場再遷著作佐郎與編文苑英華遷殿中丞通判鄭濠二州王禹偁薦其才任轉運使驛召至京師辭不受獻其所為文章得試直史舘遷右正言知制誥知淳化三年禮部貢舉遷虞部員外郎同判吏部流内銓知考課院右諫議大夫趙昌言參知政事公以壻避嫌求解職太宗嘉之改禮部郎中集賢殿修撰昌言罷復知制誥仍兼修撰判院事召賜金紫久之遷兵部郎中居職真宗即位拜中書舍人數日召為翰林學士知審官院通進銀臺封駮事公為人嚴重能任大事避逺權勢不可干以私由是真宗益知其賢錢若水名能知人常稱公曰真宰相器也若水為樞宻副使罷召對苑中問誰可大用者若水言公可用真宗曰吾固已知之矣咸平三年又知禮部貢舉居數日拜給事中知樞宻院事明年以工部侍郎參知政事再遷刑部侍郎景徳元年契丹犯邉真宗幸澶州雍王元份留守東京得暴疾命公馳自行在代元份留守二年遷尚書左丞三年拜工部尚書同中書門下平章事集賢殿大學士監修國史是時契丹初請盟趙徳眀亦納誓約願守河西故地二邉兵罷不用真宗遂欲以無事治天下公以為宋興三世祖宗之法具在故其為相務行故事慎所改作進退能否賞罰必當真宗久而益信之所言無不聽雖他宰相大臣有所請必曰王某以為如何事無大小非公所言不决公在相位十餘年外無夷狄之虞兵革不用海内富實羣工百司各得其職故天下至今稱為賢宰相公於用人不以名譽必求其實苟賢且才矣必久其官衆以為宜某職然後遷其所薦引人未嘗知㓂準為樞宻使當罷使人私公求為使相公大驚曰将相之任豈可求耶且吾不受私請準深恨之已而制出除準武勝軍節度使同中書門下平章事準入見泣涕曰非陛下知臣何以至此真宗具道公所以薦準者準始媿歎以為不可及故參知政事李穆子行簡有賢行以将作監丞居於家真宗召見慰勞之遷太子中允初遣使者召之不知其所止真宗命至中書問王某然後人知行簡公所薦也公自知制誥至為相薦士尤多其後公薨史官修真宗實録得内出奏章乃知朝廷之士多公所薦者公與人寡言笑其語雖簡而能以理屈人黙然終日莫能窺其際及奏事上前羣臣異同公徐一言以定今上為皇太子太子諭徳見公稱太子學書有法公曰論徳之職止於是耶趙徳明言民飢求糧百萬斛大臣皆曰徳明新納誓而敢違請以詔書責之真宗以問公公請勑有司具粟百萬於京師詔徳明來取真宗大喜徳明得詔書慙且拜曰朝廷有人大中祥符中天下大蝗真宗使人於野得死蝗以示大臣明日他宰相有袖死蝗以進者曰蝗實死矣請示於朝率百官賀公獨以為不可後數日方奏事飛蝗蔽天真宗顧公曰使百官方賀而蝗如此豈不為天下笑邪宦者劉承規以忠謹得幸病且死求為節度使真宗以語公曰承規待此以瞑目公執以為不可曰他日将有求為樞宻使者奈何至今内臣官不過留後公任事久人有謗公於上者公輒引咎未嘗自辯至人有過失雖人主盛怒可辯者辯之必得而後已榮王宫火延前殿有言非天災請置獄劾火事當坐死者百餘人公獨請見曰始失火時陛下以罪已詔天下而臣等皆上章待罪今反歸咎於人何以示信且火雖有迹寧知非天譴耶由是當坐者皆免日者上書言宫禁事誅籍其家得朝士所與徃還召問吉凶之説真宗怒欲付御史問狀公曰此人之常情且語不及朝廷不足罪真宗怒欲付獄公因自取嘗所召問之書進曰臣少賤時不免為此必以為罪願并臣付獄真宗曰此事已發何可免公曰臣為宰相執國法豈可自為之幸於不發而以罪人真宗意解公至中書悉焚所得書既而真宗悔復馳取之公曰臣已焚之矣由是獲免者衆公累官至太保以病求罷入見滋福殿真宗曰朕方以大事託卿而卿疾如此因命皇太子拜公公言皇太子盛徳必任陛下事因薦可為大臣者十餘人其後不至宰相者李及凌策二人而已然亦皆為名臣公屢以疾請真宗不得已拜公太尉兼侍中五日一朝視事遇軍國大事不以時入叅决公益惶恐因卧不起以疾懇辭冊拜太尉玉清昭應宫使自公病使者存問日嘗三四真宗手自和藥賜之疾亟遽幸第賜以白金五千兩辭不受以天禧元年九月癸酉薨於家享年六十有一真宗臨哭輟視朝三日發哀於苑中其子弟門人故吏皆被恩澤即以其年十一月庚申𦵏公於開封府開封縣新里鄉大邉村公娶趙氏封榮國夫人後公若干年卒子男三人長曰司封郎中雍次曰賛善大夫沖次曰素女四人長適太子少傅韓億次適兵部員外郎直集賢院蘇耆次適右正言范令孫次適龍圖閣直學士兵部郎中吕公弼諸孫十四人公事寡嫂謹其弟旭友悌尤篤任以家事一無所問而務以儉約率勵子弟使在富貴不知為驕侈兄子睦欲舉進士公曰吾嘗以太盛為懼其可與寒士争進至其薨也子素猶未官遺表不求恩澤有文集二十巻乾興元年詔配享真宗廟庭臣脩曰景徳祥符之際盛矣觀公之所以相而先帝所以用公者可謂至哉是以君明臣賢徳顯名尊生而俱享其榮殁而長配於廟可謂有始有卒如明詔所襃昔者蒸民江漢推大臣下之事所以見任賢使能之功雖曰山甫穆公之詩實歌宣王之徳也臣謹考國史實録至於搢紳故老之傳得公終始之節而録其可紀者輒聲為銘詩昭示後世以彰先帝之明以稱聖恩襃顯王氏流澤子孫與宋無極之意銘曰烈烈魏公相我真宗真廟翼翼魏公配食公相真宗不言以躬時有大事事有大疑匪卜匪筮公為蓍龜公在相位終日如黙問其夷狄包裹兵革問其卿士百工以職問其庶民耕織衣食相有賞罰功當罪明相所黜升惟否惟能執其權衡萬物之平孰不事君胡能必信孰不為相其惟有終公薨於位太尉之崇天子孝思來薦清廟侑我聖考惟時元老天子念功報公之隆春秋從享萬祀無窮作為詩歌以諗廟工晏元獻公至和元年六月觀文殿大學士行兵部尚書西京留守臨淄公以疾歸於京師八月疾少間入見天子曰噫予舊學之臣也乃留侍講邇英閤詔五日一朝前殿明年正月疾作不能朝飭太醫朝夕徃視有司除道將幸其家公歎曰吾無状乃以疾病憂吾君即馳奏曰臣疾少間行愈矣乃止其月丁亥以公薨聞天子震悼亟臨其喪以不即視公為恨贈公司空兼侍中諡曰元獻有司請輟視朝一日詔特輟二日以其年三月癸酉𦵏公於許州陽翟縣麥秀鄉之北原既𦵏賜其墓隧之碑首曰舊學之碑既又勑史臣脩考次公事具書於碑下臣脩伏讀國史見真宗皇帝時天下無事天子方推讓功徳祠祀天地山川講禮樂以文頌聲而儒學文章雋賢偉異之人出公世家江西之臨川年始十四一日起田里進見天子時方親閲天下貢士㑹廷中者千餘人與夫宫臣衛官擁列圜視公不動聲氣操筆為文辭立成以獻天子嘉賞賜同進士出身遂登館閣掌書命以文章為天下所宗逮陛下養徳東宫先帝選用臣屬即以公遺陛下由王官宫臣卒登宰相凡所以輔道聖徳憂勤國家有舊有勞自始至卒五十餘年公既𦵏而先帝之名臣與陛下東宫之舊人皆無在者宜其襃寵優異比公甘盤臣脩幸得執筆史官奉明詔謹昧死上臨淄公事曰公諱殊字同叔姓晏氏其世次晦顯徙遷不常自其髙祖諱墉唐咸通中舉進士卒官江西始著籍於髙安其後三世不顯曽祖諱延昌又徙其籍於臨川祖諱郜追封英國公考諱固追封秦國公自曽祖已下皆用公貴累贈開府儀同三司太師中書令兼尚書令曽祖妣張氏陳國太夫人祖妣傳氏許國太夫人妣吳氏越國太夫人公生七歳知學問為文章鄉里號為神童故丞相張文節公安撫江西得公以聞真宗召見既賜出身後二日又召試詩賦論公徐啓曰臣嘗私習此賦不敢隠真宗益嗟異之因試以他題以為秘書省正字置之秘閣使得悉讀秘書命故僕射陳文僖公視其學明年獻其所為文召試中書遷太常寺奉禮郎封祀泰山推恩遷光禄寺丞數月充集賢校理明年遷著作佐郎丁父憂去官已而真宗思之即其家起復命淮南發運使具舟送之京師從祀太清宫賜緋衣銀魚同判太常禮院又丁母憂求去官服喪不許今天子始封昇王公以選為府記室參軍再遷左正言直史館今天子為皇太子以户部員外郎充太子舍人賜金紫知制誥判集賢院遷翰林學士充景靈宫判官太子左庶子兼判太常寺知禮儀院公既以道徳文章佐佑東宫真宗每所諮訪多以方寸小紙細書問之由是參與機宻凡所對必以其藁進示不洩其後悉閲真宗閣中遺書得公所進藁類為八十巻藏之禁中人莫之見也初真宗遺詔章獻明肅太后權聴軍國事宰相丁謂樞宻使曹利用各欲獨見奏事無敢決其議者公建言羣臣奏事太后者垂簾聴之皆毋得見議遂定乾興元年拜右諫議大夫兼侍讀學士遷給事中景靈宫副使判吏部流内銓以易侍講崇政殿遷禮部侍郎知審官院為樞宻副使遷刑部侍郎上䟽論張耆不可為樞宻使由是忤太后㫖坐以笏擊其僕悞折其齒罷留守南京大興學校以教諸生自五代以來天下學廢興自公始召拜御史中丞改兵部侍郎兼秘書監資政殿學士翰林侍讀學士知天聖八年禮部貢舉明年為三司使復為樞宻副使未拜改叅知政事遷尚書左丞太后謁太廟有請服衮冕者太后以問公公以周官后服對太后崩大臣執政者皆罷公為禮部尚書知亳州徙知陳州遷刑部尚書復召為御史中丞又為三司使知樞宻院事拜樞宻使再加檢校太尉同中書門下平章事慶厯三年三月遂以刑部尚書居相位充集賢殿大學士兼樞宻使自公復召用而趙元昊反師出陕西天下弊於兵公數建利害請罷監軍無以陣圖授諸將使得應敵為攻守及制財用為出入之要皆有法天子悉為施行自宫禁先以率天下而財賦之職悉歸有司卒能以謀臣元昊使聽約束乃還其王號公為人剛簡遇人必以誠雖處富貴如寒士罇酒相對歡如也得一善稱之如已出當世知名之士如范仲淹孔道輔等皆出其門及為相益務進賢材當公居相府時范仲淹韓琦富弼皆進用至於臺閣多一時之賢天子既厭西兵閔天下困弊奮然有意遂欲因羣材以更治數詔大臣條天下事方施行而小人權倖皆不便明年秋㑹公以事罷而仲淹等相次亦皆去事遂已公既罷以工部尚書知頴州徙知陳州又徙許州三遷户部尚書拜觀文殿大學士永興軍充一路都部署安撫使徙知河南府兼西京留守累進階至開府儀同三司勲上柱國爵臨淄公食邑萬二千户實封三千七百户公享年六十有五自少篤學至其病亟猶手不釋巻有文集二百四十巻嘗奉勑脩土訓及真宗實録又集類古今文章為集選二百巻其為政敏而務以簡便其民其於家嚴子弟之見有時事寡姊孝謹未嘗為子弟求恩澤其在陳州上問宰相曰晏某居外未嘗有所請其亦有所欲邪宰相以告公公自為表問起居而已故其薨也天子尤哀悼之賜予加等以其子承裕為崇文院檢討孫及甥之未官者九人皆命以官公初娶李氏工部侍郎虛巳之女次孟氏屯田員外郎虚舟之女封鉅鹿郡夫人次王氏太師尚書令超之女封榮國夫人子八人長曰居厚大理評事早卒次承裕尚書屯田員外郎宣禮賛善大夫崇讓著作佐郎明逺祗徳皆大理評事幾道傅正皆太常寺太祝女六人長適戸部侍郎同中書門下平章事富弼次適禮部侍郎三司使楊察其四尚幼孫十有三人公既樂善而稱為知人士之顯於朝者多公所薦達至擇其女之所從又得二人者如此嗚呼可謂賢也已銘曰有姜之裔齊為晏氏齊在春秋晏顯諸侯傳載桓子嬰稱於丘其後無聞不亡僅存有煒自公厥聲以振公之顯聲實相天子天子曰噫予考真宗惟多名臣以臻盛隆汝初事我王宫東宫以暨相予始卒一躬輔我以徳有勞於邦公疾在外來歸自洛天子曰留汝予舊學凡今在庭莫如汝舊孰以畀予惟予聖考今既亡矣孰為予老何以贈之司空侍中禮則有加予思何窮有篆其文在其碑首天子之褒史臣有詔銘以述之永昭厥後歐陽文粹巻十七欽定四庫全書歐陽文粹巻十八宋陳亮編碑銘范文正公皇祐四年五月甲子資政殿學士尚書户部侍郎汝南文正公薨徐州以其年十有二月壬申𦵏於河南尹樊里之萬安山下公諱仲淹字希文五代之際世家蘇州事吳越太宗皇帝時吳越獻其地公之皇考從錢俶朝京師後為武寧軍掌書記以卒公生二歳而孤母夫人貧無依再適長山朱氏既長知其世家感泣去之南都入學舍掃一室晝夜講誦其起居飲食人所不堪而公自刻益苦居五年大通六經之㫖為文章論説必本於仁義祥符八年舉進士禮部選第一遂中乙科為廣徳司理叅軍始歸迎其母以養及公既貴天子乃贈公曾祖蘇州粮料院判官諱某為太保祖秘書監諱賛時為太傅考諱墉為太師妣謝氏為吳國夫人公少有大節其於富貴貧賤毁譽懽戚不一動其心而慨然有志於天下常自誦曰士當先天下之憂而憂後天下之樂而樂也其事上遇人一以自信不擇利害為趨捨其所有為必盡其方曰為之自我者當如是其成與否有不在我者雖聖賢不能必吾豈苟哉天聖中晏丞相薦公文學以大理寺丞為秘閣校理以言事忤章獻太后㫖通判河中府久之上記其忠召拜右司諫當太后臨朝聽政時以至日大㑹前殿上將率百官為夀有司以具公上疏為言天子無北面且開後世弱人主以彊母后之漸其事遂已又上書請還政天子不報及太后崩言事者希㫖多求太后時事欲深治之公獨以為太后受託先帝保佑聖躬始終十年未見過失宜掩其小故以全大徳初太后有遺命立楊太妃代為太后公諫曰太后母號也自古無代立者繇是罷其􅁽命是歳大旱蝗奉使安撫東南使還㑹郭皇后廢率諫官御史伏閤争不能得貶知睦州又徙蘇州歳餘即拜禮部員外郎天章閣待制益論時政闕失而大臣權倖多忌惡之居數月以公知開封府開封素號難治公治有聲事日益簡暇則益取古今治亂安危為上開説又為百官圖以獻曰任人各以其材而百職修堯舜之治不過此也因指其遷進遲速次序曰如此而可以為公可以為私亦不可以不察由是吕丞相怒至交論上前公求對辯語切坐落職知饒州明年吕公亦罷公徙潤州又徙越州而趙元昊反河西上復召相吕公乃以公為陕西經畧安撫副使遷龍圖閣直學士是時新失大將延州危公請自守鄜延捍賊乃知延州元昊遣人遺書以求和公以為無事請和難信且書有僣號不可以聞乃自為書告以逆順成敗之説甚辯坐擅復書奪一官知耀州未逾月徙知慶州既而四路置帥以公為環慶路經略安撫招討使兵馬都部署累遷諫議大夫樞宻直學士公為將務持重不急近功小利於延州築清澗城墾營田復承平永平廢寨孰羌歸業者數萬户於慶州城大順以據要害奪賊地而耕之又城細腰胡盧於是明珠滅臧等大族皆去賊為中國用自邉制久隳至兵與將常不相識公始分延州兵為六將訓練齊整諸路皆用以為法公之所在賊不敢犯人或疑公見敵應變為如何至其城大順也一旦引兵出諸將不知所向軍至柔逺始號令告其地處使徃築城至於版築之用大小畢具而軍中初不知賊以騎三萬來争公戒諸將戰而賊走追勿過河已而賊果走追者不渡而河外果有伏賊既失計乃引去於是諸將皆服公為不可及公待將吏必使畏法而愛已所得賜賚皆以上意分賜諸將使自為謝諸蕃質子縱其出入無一人逃者蕃酋來見召之卧内屏人徹衛與語不疑公居二歳士勇邉實恩信大洽乃決策謀取横山復靈武而元昊數遣使稱臣請和上亦召公歸矣初西人籍為鄉兵者數萬既而黥以為軍唯公所部但刺其手公去兵罷獨得復為民其於兩路既得孰羌為用使以守邉因徙屯兵就食内地而紓西人饋輓之勞其所設施去而人徳之與守其法不敢變者至今尤多自公坐吕公貶羣士大夫各持二公曲直吕公患之凡直公者皆指為黨或坐竄逐及吕公復相公亦再起被用於是二公驩然相約勠力平賊天下之士皆以此多二公然朋黨之論遂起而不能止上既賢公可大用故卒置羣議而用之慶厯三年春召為樞宻副使五讓不許乃就道既至數月以為參知政事每進見必以太平責之公歎曰上之用我者至矣然事有先後而革弊政於乆安非朝夕可也既而上再賜手詔趣使條天下事又開天章閣召見賜坐授以紙筆使䟽於前公惶恐避席始退而條列時所宜先者十數事上之其詔天下興學取士先徳行不専文辭革磨勘例遷以别能否減任子之數而除濫官用農桑考課守宰等事方施行而磨勘任子之法僥倖之人皆不便因相與騰口而嫉公者亦幸外有言喜為之佐佑㑹邉奏有警公即請行乃以公為河東陕西宣撫使至則上書願復守邉即拜資政殿學士知邠州兼陕西四路安撫使其知政事纔一歳而罷有司悉奏罷公前所施行而復其故言者遂以危事中之賴上察其忠不聽是時夏人已稱臣公因以疾請鄧州守鄧三歳求知杭州又徙青州公益病又求知穎州肩舁至徐遂不起享年六十有四方公之病上賜藥存問既薨輟朝一日以其遺表無所請使就問其家所欲為贈以兵部尚書所以哀䘏之甚厚公為人外和内剛樂善汎愛喪其母時尚貧終身非賔客食不重肉臨財好施意豁如也及退而視其私妻子僅給衣食其為政所至民多立祠畫像其行已臨事自山林處士里閭田野之人外至四裔莫不知其名字而樂道其事者甚衆及其世次官爵誌於墓譜於家藏於有司者皆不論著著其繫天下國家之大者亦公之志也歟銘曰范於吳越世實陪臣俶納山川及其士民范始來北中間幾息公奮自躬與時偕逢事有罪功言有違從豈公必能天子用公其艱其勞一其初終夏童跳邉乗吏怠安帝命公徃問彼驕頑有不聽順鋤其穴根公居三年怯勇隳完兒憐獸擾卒俾徕臣夏人在庭其事方議帝趣公來以就於治公拜稽首茲為艱哉初匪其難在其終之羣言營營卒壊於成匪惡其成惟公是傾不傾不危天子之明存有顯榮沒有贈諡藏其子孫寵及後世惟百有位可勸無怠余襄公始興襄公既𦵏於曲江之明年其子仲荀走於亳以來告曰余氏世為閩人五代之際逃亂於韶自曽髙以來晦迹嘉遁至於博士府君始有禄仕而襄公繼之以大曲江僻在嶺表自始興張文獻公有聲於唐為賢相至公復出為宋名臣盖余氏徙韶厯四世始有顯仕而曲江寂寥三百年然後再有聞人惟公位登天臺正秩三品遂有爵土開國鄉州以繼美前哲而為韶人榮至於褒䘏贈諡始終之寵盛矣盖褒有詔䘏有物贈有告而諡行考功有議有状合而誌之以閟諸幽有銘可謂備矣惟是螭首龜趺揭於墓隧以表見於後世而昭示其子孫者宜有辭而闕焉敢以為請謹按余氏韶州曲江人曽祖諱某祖諱某皆不仕父諱某太常博士累贈太常少卿公諱靖字安道官至朝散大夫守工部尚書集賢院學士知廣州軍州事兼廣南東路兵馬鈐轄經畧安撫使柱國始興郡開國公食邑二千六百户食實封二百户治平元年自廣朝京師六月癸亥以疾薨於金陵天子惻然輟視朝一日賻以粟帛贈刑部尚書諡曰襄明年七月某甲子返𦵏於曲江之龍歸鄉成山之原公為人質重剛勁而言語恂恂不見喜怒自少博學强記至於厯代史記雜家小説隂陽律厯外暨浮屠老子之書無所不通天聖二年舉進士為贛縣尉書判拔萃改將作監丞知新建縣再遷秘書丞刋校三史充集賢校理天章閣待制范公仲淹以言事觸宰相得罪諫官御史不敢言公䟽論之坐貶監筠州酒稅稍徙泰州已而天子感悟亟復用范公而因之以被斥者皆召還惟公以便親乞知英州遷太常博士丁母憂服除遂還為集賢校理同判太常禮院景祐慶厯之間天下怠於久安吏習因循多失職及趙元昊以夏叛師出久無功縣官財屈而民重困天子赫然思振頽弊以修百度既已更用二三大臣又増置諫官四員使言天下事公其一人也即改右正言供職公感激奮勵遇事輒言無所回避姦䛕權倖屏息畏之其補益多矣然亦不勝其怨嫉也慶厯四年元昊納誓請和将加封􅁽而契丹以兵臨境上遣使言為中國討賊且告師期請止毋與和朝廷患之欲聽重絶夏人而兵不得息不聴生事北邉議未決公獨以為中國厭兵久矣此契丹之所幸一日使吾息兵養勇非其利也故用此以撓我爾是不可聽朝廷雖是公言猶留夏􅁽不遣而假公諫議大夫以報公從十餘騎馳出居庸關見敵於九十九泉從容坐帳中辯折徃復數十卒屈其議取其要領而還朝廷遂發夏冊臣元昊西師既解嚴而北邉亦無事是歳以本官知制誥史館修撰而契丹卒自攻元昊明年使來告捷又以公徃報坐習敵語出知吉州怨家因之中以事左遷將作少監分司南京公怡然還鄉里闔門謝賔客絶人事凡六年天子每思之欲用者數矣大臣有不喜者第遷光禄少卿於家又以為武衛将軍夀州兵馬鈐轄辭不拜皇祐二年祀明堂覃恩遷衛尉卿明年知䖍州丁父憂去官而蠻賊儂智髙陷邕州連破嶺南州縣圍廣州乃即廬中起公為秘書監知潭州即日疾馳在道改知桂州廣南西路經略安撫使公奏曰賊在東而徙臣西非臣志也天子嘉之即詔公經制廣東西賊盜乃趨廣州而智髙復西走邕州自智髙初起交趾請出兵助討賊詔不許公以為智髙交趾叛者宜聴出兵毋沮其善意累疏論之不報至是公曰邕州與交趾接境今不納必忿而反助智高乃以便宜趣交趾㑹兵又募儂黄諸姓酋豪皆縻以職與之誓約使聴節制或疑其不可用公曰使不與智髙合足矣及智髙入邕州遂無外援既而宣撫使狄青㑹公兵敗賊於歸仁智髙走入海邕州平公請復終喪不許諸将班師以智髙尚在請留公廣西委以後事遷給事中諫官御史列䟽言公功多而賞薄再遷尚書工部侍郎公留廣西逾年撫緝完復嶺海肅然又遣人入特磨襲取智髙母及其弟一人俘於京師斬之拜集賢院學士久之徙知潭州又徙青州再遷吏部侍郎嘉祐五年交趾㓂邕州殺五巡檢天子以為恩信著於嶺外而為交趾所畏者公也驛召以為廣西體量安撫使悉發荆湖兵以從公至則移檄交趾召其臣費嘉祐詰責之嘉祐皇恐對曰種落犯邉罪當死願留取首惡以獻即械五人送欽州斬於界上公還邕人遮道留之不得明年以尚書左丞知廣州英宗即位拜工部尚書代還道病卒享年六十有五公經制五管前後十年凡治六州所至有惠愛雖在兵間手不釋巻有文集二十巻奏議五巻三史刋誤四十巻娶林氏封魯郡夫人子男三人伯莊殿中丞早卒仲荀今為屯田員外郎叔英太常寺太祝女六人皆適士族孫四人孫女五人銘曰余遷曲江仍世不顯奮自襄公有聲甚逺始興開國襲美於前兩賢相望三百年間偉歟襄公惟邦之直始登於朝官有言責左右獻納姦䛕屏息慶厯之治實多補益逢時有事奔走南北功書史官名在夷狄出入艱勤險夷一徳小人之䜛公廢千里一方有警公起於家威行信結嶺海幽遐公之在焉帝不南顧胡召其還殞於中路返柩來歸韶人負土伐石刻辭立於墓門以貽來世匪止韶人歐陽文粹巻十八欽定四庫全書歐陽文粹巻十九宋陳亮編墓銘杜正獻公
