  text: 居士集卷第四十七歐陽文忠公集四十七
  hash: sha256:8a98069bed7c199bec0778cca72df30fec47608f09410173ed0171e0f7ff359e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_047-1a}
body:
  text: 書八首荅陜西安撫使范龍圖辭辟命書脩頓首再拜啓急脚一作歩至得七月十九日華州所發書伏審即日尊體動止萬福一有卑情不任欣慰之至八字戎狄侵邊自古常事邊吏無狀至煩大賢伏惟執事忠義之節信於天下天下之士得一識面者退誇於人以爲榮耀至於游談布衣之賤往往􅀼託門下之名矧今以大謀小以順取逆濟以明哲之才有必成功之􅀔則士之好功名者於此爲時孰不願岀所長少助萬一得託附以成其名哉況聞狂虜猖蹶屢有斥指之詞加之輕侮購募之辱至於執戮將吏殺害邊民凡此數事在於脩軰尤爲憤恥毎一思之中夜三起不幸脩無所能徒以少喜文字過爲世俗見許此豈足以當大君子之舉哉若夫參決軍謀經畫財利料敵制勝在於幕府苟不乏人則軍書奏記一有之二拙三字一末事耳有不待脩而堪者矣由此始敢以親爲辭況今丗人所謂四六者非脩所好少爲進士時不免作之自及第遂棄不復作在西京佐三相幕府於職當作亦不爲作此師魯所見今廢巳乆懼無好辭以辱嘉命此一端也一本此下云某雖儒生不知兵事竊惟兵法有勇有怯必較彼我之利否事之如何要在成功不限遲速某近至京師屢於諸公間畧聞緒言攻守之計此實當時之冝非深思逺見者孰能至此願不爲浮議所移伏見自至􅀜西辟士甚衆古人所與成事者必有國士共之非惟在上者以知人爲難士雖貧賤以身許人固亦未易欲其盡死必深相知知之不盡士不爲用今竒怪豪儁之士徃徃􅀩見􅀵擇顧用之如何尔一有此在明哲豈須獻言然尚一作但慮山林草莽有挺特知義慷􅁣自重之士未得岀於門下也冝少一作亦冝思焉若脩者恨無他才以當長者之用非敢効庸人苟且樂安佚也一本此下云伏􅀩示書夏公又以見舉某孤賤素未甞登其門非執事過見襃稱何以及此媿畏然某已以親老爲辭更無可往之理惟幸察一有焉字荅李詡第一書脩白人至辱書及性詮三篇曰以質其果是一有非字夫自信篤者無所待於人有質於人者自疑者也今吾子自謂夫子與孟荀楊韓復生不能奪吾言其可謂自信不疑者矣而返以質於脩使脩有過於夫子者乃可爲一作與吾子辯況脩未及孟荀楊韓之一二也脩非知道者好學而未至者也丗無師乆矣尚頼朋友切磋之益苟不自滿而中止庶㡬終身而有成固常樂與學者論議徃來非敢以益於人蓋求益於人者也況如吾子之文章論議豈易得哉固樂爲一作與吾子辯也苟尚有所疑敢不盡其所學以告旣吾子之自信如是雖夫子不能奪使脩何所􅀃焉人還索書未知所荅慚惕慚惕脩再拜荅李詡第二書脩白前辱示書及性詮三篇見吾子好學善辯而文能盡其意之詳今丗之言性者多矣有所不及也故思與吾子卒其􅀃脩患丗之學者多言性故常爲􅀃曰夫性非學者之所急而聖人之所罕言也易六十四卦不言性其言者動靜得失吉凶之常理也春秋二百四十二年不言性其言者善惡是非之實録也詩三百五篇不言性其言者政教興衰之羙刺也書五十九篇不言性其言者堯舜三代之治亂也禮樂之書雖不完而雜岀於諸儒之記然其大要治國脩身之法也六經之所載皆人事之切於丗者是以言之甚詳至於性也百不一二言之或因言而及焉非爲性而言也故雖言而不究予之所謂不言者非謂絶而無言蓋其言者鮮而又不主於性而言也論語所載七十二子之問於孔子者問孝問忠問仁義問禮樂問脩身問爲政問朋友問􅀑神者有矣未甞有問性者孔子之告其弟子者凡數千言其及於性者一言而巳予故曰非學者之所急而聖人之罕言也書曰習與性成語曰性相近習相逺者戒人愼所習而言也中庸曰天命之謂性率性之謂道者明性無常必有以率之也樂記亦曰感物而動性之欲者明物之感人無不至也然終不言性果善果惡但戒人愼所習與所感而勤其所以率之者尔予故曰因言以及之而不究也脩少好學知學之難凡所謂六經之所載七十二子之所問者學之終身有不能逹者矣於其所逹行之終身有不能至者矣以予之汲汲於此而不暇乎其他因以知七十二子亦以是汲汲而不暇也又以知聖人所以教人垂丗亦皇皇而不暇也今之學者於古聖賢所皇皇汲汲者學之行之或未至其一二而好爲性􅀃以窮聖賢之所罕言而不究者執後儒之偏􅀃事無用之空言一作文此予之所不暇也或有一作者問曰性果不足學乎予曰性者與身俱生而人之所皆有也爲君子者脩身治人而巳性之善惡不必究也使性果善邪身不可以不脩人不可以不治使性果惡邪身不可以不脩人不可以不治不脩其身雖君子而爲小人書曰惟聖罔念作狂是也能脩其身雖小人而爲君子書曰惟狂克念作聖是也治道備人斯爲善矣書曰􅀺民於變時雍是也治道失人斯爲惡矣書曰殷頑民又曰舊染汙俗是也故爲君子者以脩身治人爲急而不窮性以爲言夫七十二子之不問六經之不主言或雖言而不究豈略之哉蓋有意也或又問曰然則三子言性過歟曰不過也其不同何也曰始異而終同也使孟子曰人性善矣遂怠而不教則是過也使荀子曰人性惡矣遂棄而不教則是過也使楊子曰人性混矣遂肆而不教則是過也然三子者或身奔走諸侯以行其道或著書累千萬言以告于後丗未甞不區區以仁義禮樂爲急蓋其意以謂善者一日不教則失而入于惡惡者勤而教之則可使至于善混者驅而率之則可使去惡而就善也其􅀃與書之習與性成語之性近習逺中庸之有以率之樂記之愼物所感皆合夫三子者推其言則殊察其用心則一故予以爲推一無此字其言不過始異而終同也凡論三子者以予言而一之則譊譊者可以息矣予之所􅀃如此吾子其擇焉與荆南樂秀才書脩頗首白秀才足下前者舟行往來屢辱見過又辱以所業一編先之啓事及門而贄田秀才西來辱書其後予家奴自府還縣比又辱書僕有罪之人人所共棄而足下見禮如此何以當之當之未暇荅冝遂絶而再辱書再而未荅冝絶而又辱之何其勤之甚也如脩者天下窮賤之人尔安能使足下之切切如是邪蓋足下力學好問急於自爲謀而然也然蒙索僕所爲文字者此似有所過聽也僕少從進士舉於有司學爲詩賦以備程試凡三舉而得第與士君子相識者多故往往能道僕名字而又以游從相愛之􅀻或過稱其文字故使足下聞僕虚名而欲見其所爲者由此也僕少􅀌貧貪禄仕以養親不暇就師窮經以學聖人之遺業而渉獵書史姑隨丗俗作所謂時文者皆穿蠹經傳移此儷彼以爲浮薄惟恐不恱于時人非有卓然自立之言如古人者然有司過採屢以先多士及得第已來自以前所爲不足以稱有司之舉而當長者之知始大改其爲庶㡬有立然言出而罪至學成而身辱爲彼則􅀗譽爲此則受禍此明効也夫時文雖曰浮巧然其爲功亦不易也僕天姿不好而彊爲之故比時人之爲者尤不工然巳足以取禄仕而竊名譽者順時故也先輩少年志盛方欲取榮譽於丗則莫若順時天聖中天子下詔書勑學者去浮華其後風俗大變今時之士大夫所爲彬彬有兩漢之風矣先輩往學之非徒足以順時取譽而巳如其至之是直齊肩於兩漢之士也若僕者其前所爲旣不足學其後所爲愼不可學是以徘􅆦不敢出其所爲者爲此也在易之困曰有言不信謂夫人方困時其言不爲人所信也今可謂困矣安足爲足下所取信哉辱書旣多且切不敢不荅幸察荅呉充秀才書脩頓首白先輩呉君足下前辱示書及文三篇發而讀之浩乎若千萬言之多及少定而視焉纔數百言尔非夫辭豐意雄霈然有不可禦之􅀔何以至此然猶自患倀倀莫有開之使前者此好學之謙言也脩材不足用於時仕不足榮於丗其毀譽不足輕重氣力不足動人丗之欲假譽以爲重借力而後進者奚取於脩焉先輩學精文雄其施於時又非待脩譽而爲重力而後進者也然而惠然見臨六字一作惠然而見及􅀂有所責一作求得一無此字非急於謀道不擇其人而問焉者歟夫學者未始不爲道而至者鮮焉非道之於人逺也學者有所溺焉尔蓋文之爲言難工而可喜易恱而自足丗之學者往往溺之一有工焉則曰吾學足矣甚者至棄百事不關于心曰吾文士也職於文而巳此其所以至之鮮也昔孔子老而歸魯六經之作數年之頃尔然讀易者如無春秋讀書者如無詩一作讀春秋者如無詩書何其用功少而至此字一作自然於至也聖人之文雖不可及然大抵道勝者一有於字文不難而自至也故孟子皇皇不暇著書荀卿蓋亦晚而有作若子雲仲淹方勉焉以模三字一作彊區區力作言語此一無此字有而宏博不及孟荀之雄者十字道未足而彊一作勉言者也後之惑者徒見前丗之文傳以爲學者文而巳此句一作又溺其恱也故愈力一無此二字愈勤而愈不至此足下所謂終日不出於軒序一無此足下以下一句不能縱横髙下皆如意者道未一作不足也􅀂道之充焉雖行乎天地一作下入于淵泉無不之也一有何患不至四字先輩一作足下之文浩乎霈然可謂善矣而又志於爲道猶自以爲未廣若不止焉孟荀可至而不難也脩學道而不至者然幸不甘於所恱而溺於所止因吾子之能不自止又以勵脩之少進焉幸甚幸甚脩白上杜中丞論舉官書具官脩謹齋沐拜書中丞執事脩前伏見舉南京留守推官石介爲主簿近者聞介以上書論赦􅀍罷而臺中因舉他吏代介者主簿於臺職最卑介一賤士也用不用當否未足害政然可惜者中丞之舉動也介爲人剛果有氣節力學喜辯是非眞好義之士也始執事舉其材議者咸曰知人之明今聞其罷皆謂赦乃天子巳行之令非踈賤當有􅀃以此罪介曰當罷脩獨以爲不然然不知介果指何事而言也傳者皆云介之所論謂朱梁劉漢不當求其後裔尔􅀂止此一事則介不爲過也然又不知執事以介爲是爲非也若隨以爲非是大不可也且主簿於臺中非言事之官然大抵居臺中者必以正直剛明不畏避爲稱職今介足未履臺門之閾而已用言事見罷眞可謂正直剛明不畏避矣度介之才不止爲主簿直可任御史也是執事有知人之明而介不􅀒執事之知矣脩甞聞長老􅀃趙中令相太祖皇帝也甞爲某事擇官中令列二臣姓名以進太祖不肯用它日又問復以進又不用它日又問復以進太祖大怒裂其奏擲殿階一作陛上中令色不動揷笏帶間徐拾碎紙䄂歸中書它日又問則􅀘綴之復以進太祖大悟終用二臣者彼之敢尔者蓋先審知其人之可用然後果而不可易也今執事之舉介也亦先審知其可舉邪是偶舉之也一作邪􅀂知而舉則下可遽止若偶舉之猶冝一請介之所言辯其是非而後巳􅀂介雖忤上而言是也當助以辯􅀂其言非也猶冝曰所舉者爲主簿尔非言事也待爲主簿不任職則可罷請一作請罷以此辭焉可也且中丞爲天子司直之臣上雖好之其人不肖則當彈而去之上雖惡之其人賢則當舉而申之非謂隨時好惡而髙下者也今備位之臣百十邪者正者其糺舉一信於臺臣而執事始舉介曰能朝廷信而將用之及以爲不能則亦曰不能是執事自信猶不果􅀂遂言它事何敢望天子之取信於執事哉故曰主簿雖卑介雖賤士其可惜者中丞之舉動也況今斥介而它舉必亦擇賢而舉也夫賢者固好辯􅀂舉而入臺又有言則又斥而它舉乎如此則必得愚闇懦黙者而後止也伏惟執事如欲舉愚者則豈敢復云􅀂將舉賢也願無易介而它取也今丗之官兼御史者例不與臺事故敢布狂言竊獻門下伏惟幸察焉與曽鞏論氏族書脩一有拜字白一有曽君先輩足下六字貶所僻逺不與人通辱遣專人惠書甚勤豈勝媿也示及見託撰次碑文事脩於人事多故不近文字乆矣大懼不能稱􅄒丗德之萬一以滿足下之意然近丗士大夫於氏族一作族氏尤不明其遷徙丗次多失其序至於始封得姓亦或不眞如足下所示云曽元之曽孫樂爲漢都郷侯至四丗孫據遭王莽亂始去都郷而家豫章考於史記皆不合蓋曽元去漢近二百年自元至樂似非曽孫然亦當仕漢􅀄則據遭莽丗失侯而徙蓋又二百年疑亦非四世以諸侯年表推之雖大功德之侯亦未有終前漢而國不絶者亦無自髙祖之丗至平帝時侯纔四傳者宣帝時分宗室趙頃王之子景封爲都郷侯則據之去國亦不在莽丗而都郷巳先别封宗室矣又樂據姓名皆不見於年表蓋丗次乆逺而難詳如此若曽氏岀於鄫者蓋其支庶自别有爲曽氏者尔非鄫子之後皆姓曽也蓋今所謂鄫氏者是也楊允恭據國史所書甞以西京作坊使爲江浙發運制置茶鹽使乃至道之間耳今云洛苑使者雖且從所述皆冝更加考正山州無文字尋究一有不能周悉四字幸察荅宋咸書脩頓首白州人一作吏至蒙惠書及􅀘注周易甚善丗無孔子乆矣六經之旨失其傳其有不可得而正者自非孔子復出無以得其眞也儒者之於學博矣而又苦心勞神一作疲精於殘編朽簡之中以求一作考千歳失傳之繆茫乎前望巳逺之聖人而不可見杳乎後顧無窮之來者欲爲未悟決難解之惑是眞所謂勞而少功者哉然而一有六字經非一丗之書也其傳之繆非一日之失也其所以刋正􅀘緝亦非一人之能也使學者各極其所見而明者擇焉十取其一百取其十雖未能復六經於無失而卓如日月之明然聚衆人之善以􅀘緝之庶㡬不至於大繆可以俟聖人之復生也然則學者之於經一無三字其可巳乎足下於經一本二字作之於學勤矣一有其於經至矣字凡其所失無所不欲正之其刋正補緝者衆則其所得亦巳多矣脩學一作性不敏明而又無彊力以自濟恐終不能少出所見以補六經一作失傳之萬一得足下所爲故尤區區而不能忘也屬奉使出疆一本二字作行有日怱怱不具一本具字作得盡所懷惟一有以時字自愛廬陵歐陽脩再拜居士集卷第四十七熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正答陜西范龍圖辭辟命書知義此下有可用二字答李詡第二書而不究此下一有凡字果善邪果惡邪邪一本作而人性混矣混字上一有善惡二字勤而教之勤一作勸與荆南樂秀才書當之未暇答之或作時一無當之二字冝絶二字上一有益字切切二字一作勒遺業二字一作道浮薄一作浮巧恱于一作恱於爲彼二字丄一有蓋字受禍一作􅀗罪不易一作未易譽者一無者字先輩少年一作今先輩年少方欲一作方將如其至之是直齊肩於兩漢之士也一作如其器焉直可齊於兩漢之士也愼不可學一作又不冝學今可謂困今字下一有子字安足爲足下所取信哉一作雖有言安能取信於先輩哉答呉充秀才書何以一作孰能先輩學精先輩精學一作矧也足下鮮焉一作鮮矣讀易者三字上一有使字上杜中丞論舉官書不爲過也也一作矣又不知執事不一作未殿階上一作陛下終用二臣者一無者字百十一作百千幸察焉一作幸賜察焉與曽鞏論氏族書僻逺一作僻绝當仕一作當在亦未有一作亦少得鄫氏鄫一作繒茶鹽使此下一有時字答宋咸書儒者之於學一作學者之爲工
