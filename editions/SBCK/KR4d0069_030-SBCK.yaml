  text: 居士集卷第三十歐陽文忠公集三十
  hash: sha256:b601294b1c562f112400b960da21d7ed94c55f52b9901c2dafd203541f22dcfe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_030-1a}
body:
  text: 墓誌四首翰林侍讀學士右諌議大夫贈工部侍郎張公墓誌銘并序翰林侍讀學士朝散大夫右諫議大夫上柱國清河縣伯張公諱􅃬字貺之其先京兆長安人也其祖山甫從唐僖宗入蜀留不返蜀遭王孟再亂絶於中國中國更五代天下爲宋而蜀平張氏留蜀盖亦巳五世矣始得去爲漢陽人又二世而張氏遂以大顯公爲人清方敏黙爲善不倦而喜自晦歛􅀂不欲人知其遇人怡怡􅀂無所不可及視其發施於事者其義有可畏其守有不可奪其能有不可及旣巳則􅀂未嘗有所爲者少喜讀書至其疾革猶不釋手自經史子集百家之􅀃無不記覽通逹而絶口不道於人故其一無此字晚始侍讀于中上嘗歎曰自吾得張􅃬日益有所聞以飛白爲博學二字賜之曰錫老矣恨得之晚也公􅀄舉進士中大中祥符元年甲科試秘書省校書郎知南昌縣遷萍郷令改著作佐郎又知安逺縣徙知新州興學校以教新人新人有進士自公始再遷太常博士監染院詔選能吏治畿縣公以選知東明前爲令者闔門重簾以壅隔廢治公至則闢門去簾告其人曰吾所治者三而巳彊恃力冨恃貲刑恃贖者吾所先也其人以謂公言簡必信法簡必嚴於是豪􅀔者屈而善弱者伸縣以大治工部侍郎李及薦公材堪御史上曰李及清慎人未嘗妄有所舉此可信也乃以爲監察御史故相丁謂貶崖州至是議徙内地公䟽言謂姦邪弄國罪當死無可憐且大臣竄逐本與天下棄之今復内還是違天下意由是止徙道州玉清昭應宫災坐火事劾當死者百餘人公䟽言天災可畏不可反以罪人而重天怒願益脩德以塞譴人乃􅀗免公於御史自監察歴殿中侍御史侍御史知雜事於尚書爲貟外郎郎中累官至諌議大夫於外爲荆湖北路京東河北轉運使江淮一有南字兩浙荆湖發運制置使利夔路安撫使知河中府滑州於三司爲鹽鐵判官判句院歴鹽鐵度支戸部副使又嘗權知諫院判三班審官院太常寺國子監於侍從爲天章閣待制龍圗閣直學士翰林侍讀學士雖其一作其雖自晦其所居人皆以爲冝其在京東籍淄青齊濮濟鄆六州之人冒耕河壖地收租緍絹􅀊二十八萬而六州之民爭訟遂息其後言利者請稅天下橋渡以佐軍公建言津梁利人而反稅之以爲害卒爭罷之平居退讓未嘗肯爲人先妖賊王則反貝州兵圍乆不克而自河以北軍餉調發益急轉運使受命者以疾留不行公自滑州權河北轉運使命至即日馳城下軍須皆如其期其於取舎緩急常如此公居家有常法雖貴顯衣服飲食如少賤時事母至孝與族兄甚相友愛人以爲同産一有平生所爲文章有集十卷公以皇祐元年七月十日遇疾卒于京師享年六十有八上聞震悼以白金三百兩賜其家特贈工部侍郎曽祖諱惟序不仕祖諱文翼復州録事參軍贈太子中舎父諱􅀛從贈右諫議大夫母南陽郡太君鄧氏自皇祖中舎君家于漢陽遂葬之至公始葬汝州之襄城某郷某原一作彰孝郷保豐原實五年閏七月十七日也公􅀄娶程氏再娶孫氏封樂安郡君先公五十日而卒公子五人曰子駿子充子雲一作子瑾下同子諒子眞子眞子充皆早卒於公之葬一作終也子駿子雲皆爲大理評事子諒大理寺丞有孫十人女三人長適虞部貟外郎杜樞次早卒㓜適大理寺丞王縡銘曰自足乎其中不求乎其外斯惟公之善晦仁能勇於必爲善有應而無逺故公晦其終顯難於自進以晚見嗟而壽胡不俾其遐嗚呼其奈何兵部貟外郎天章閣待制杜公墓誌銘慶暦三年盗起京西掠商鄧均房叛兵燒光化軍逐守吏吏不能捕天子患之問宰相誰可任者宰相言度支判官尚書虞部貟外郎杜某名家子一有好字學通知古今冝可用乃以君爲京西轉運按察使居數月賊平叛兵誅死明年廣西歐希範誘白崖山蠻􅂪趕襲破環州䧟鎮寧帶溪普義有衆數千以攻桂管宰相又言前時杜某守横州言蠻事可聽冝知蠻利害天子驛召君見便殿所對合意即除君刑部貟外郎直集賢院廣南西路轉運按察安撫等使君至冝州得州人呉香及獄囚歐世宏脫其械使入賊峒􅀃其酋豪君乗其怠急擊之破其五峒斬首數百級復取環州因盡焚其山林積聚希範窮迫走荔波洞􅂪趕率僞將相數十人以其衆降君與將佐謀曰夫蠻習險恃阻如捕猩猱而吾兵以苦暑難乆是進退遲速皆不可爲故常務􅂢厚利以招之蓋威不足以制則恩不能以懷此其所以數叛也今吾兵雖幸勝然蠻特敗而來耳豈眞降者邪啖之以利後必復動乃􅁣然歎曰蠻知利而不知威乆矣吾將先威而後信庻幾信可立也一無比字乃擊牛爲酒大㑹環州戮其一作之坐中者六百餘人而釋其尫病脅從與其非因敗而降者百餘人後三日兵破荔波擒希範至并戮而醢之以醢賜諸溪峒於是叛蠻無噍􅀋而君威震南海言事者論君殺降爲國失信於蠻貃天子置之不問詔書諭君賜以金帛君即上書引咎六年徙爲兩浙轉運使築錢塘堤自官浦至沙陘以除海患明年又徙河北轉運使召見奏事移刻天子益知其材賜金紫服以遣之是􅀊夏拜天章閣待制充環慶路兵馬都部署經略安撫使知慶州君言殺降臣也冝得罪將吏惟臣所使其勞未録不敢先受命天子爲君悉録將吏賞之乃受命自元昊稱臣聽誓而數犯約抄一作撓邉邉吏避生事縱不敢爭君始至其酋孟香率千餘人内附事聞詔君如約君言如約當還而孟香得罪夏人􅀔無還理遣之必反爲邉患議未决夏人以兵入界求孟香孟香散走自匿夏兵驅殺邉戸掠奪羊一作牛馬而求孟香益急朝議責君亟索而還之君言夏人違誓舉兵孟香不可與因移檄夏人不償所掠則孟香不可得夏人不肯償所掠君亦不與孟香夏人後亦不復敢動君治邉二􅀊有威愛皇祐一年五月甲子疾卒于官享年四十有六天子震悼賻䘏其家以其子炤爲一有守字秘書省校書郎君以䕃􅀘將作監主簿累官至尚書兵部貟外郎階朝奉郎勲護軍嘗以太子中舎知建陽縣除民無名租􅀊以萬計閩俗貪嗇有老而生子者父兄多不舉曰是將分吾貲君上書請立伍保俾民相察寘之法由是生子得免閩人乆之以君爲徳多以君姓字名其子曰生汝者杜君也君諱祀字偉長世爲金陵人其曽伯祖昌業仕江南李氏爲江州節度使江南國㓕杜氏北遷今爲開封府開封人也曽祖諱某贈給事中祖諱鎬官至龍圗閣學士尚書禮部侍郎父諱某贈尚書工部侍郎君􅀄娶蔣氏封某縣君後娶徐氏封東海縣君女六人其二適人四尚㓜子男一人炤也杜氏自君皇祖侍郎以博學爲世儒宗故其子孫皆守儒學而多聞人君尤博覽強記其爲文章多論當世利害甚辯有文集十卷奏議集十二卷其居官以精敏明幹所至有聲君學問之餘兼喜隂陽數術之􅀃常自推其數曰吾年四十六死矣其親戚朋友莫不聞其􅀃至其􅀊果然嗚呼可謂異矣所謂命者果有數邪其果可以自知邪皇祐六年某月日其兄駕部貟外郎植與其􅀌葬君于某縣某郷某原銘曰其敏以逹其果以决其守不奪其摧不折其終一節兹謂不没尚書比部貟外郎陳君墓誌銘故尚書比部貟外郎陳君卜以至和二年正月某日葬于京兆府萬年縣洪固鄕神禾原其素所知秘書丞李詡與其􅀌安期謀將乞銘於廬陵歐陽脩安期曰吾不敢詡曰我能得之乃相與具書幣遣君之客賈繹自長安走京師以請蓋君以至和元年五月某日卒于長安享年四十有六其仕未逹而所爲未有大見于時也然詡節義可信之士以詡能報君而君能知詡則君之爲人可知也巳君諱漢卿字師黯世居閬中其先博州人因事僞蜀爲縣令遂留家焉其曽叔祖省華官至諫議大夫生堯叟堯佐堯咨先後爲將相而君自曽祖而下三世不顯曽祖諱省恭不仕祖諱堯封舉進士爲􅉑縣主簿王均亂蜀詣闕上書獻破賊䇿不報遂退老于嵩山父諱淵亦舉進士官至大理寺丞與其兄漸所謂金􅀛子者皆以文學知名君生一􅀊而􅀌年十三與其母入蜀過鳯翔謁其府尹而吏少君不爲之通君直入伏庭下曰陳某請見因責尹慢士戒吏不謹尹慙笞吏以謝君君用叔祖堯咨䕃􅀘將作監主簿累遷大理寺丞監沙􅁐監權知渭南縣民有兄弟爭田者吏常直其兄而弟訟不巳君爲徃視其田辨其劵書而以田與弟其兄謝曰我悔欲歸弟以田者數矣直懼笞而不敢耳弟曰我田故多然耻以不直訟兄今我直矣願以田與兄兄弟相持慟􅂘拜而去由是縣民有事多相持詣君得一言以决曲直又知登封縣縣有惡盗十人巳謀未發而尉方以事出君募少年選手力夜徃捕􅀗之明日召尉歸以賊與之曰得是可以論賞賞未及下而尉卒尉河南儒者魏景山也老而且貧君爲主其喪事買田宅于汝州以活其妻子通判嘉州治田訟三十年不决者一日决之秩滿嘉人詣轉運使乞留不得時文丞相守成都薦其材而薦者十有五人通判河中府府有妖獄二百餘人君方以公事之他州提􅀧刑獄司疑獄有􅁈召君還視之獨留其一人餘皆釋之累遷尚書虞部貟外郎天子享明堂推恩遂遷比部通判寧州决疑獄活一家五人君好學重氣節嘗有􅀒其錢數千萬􅂺毀其劵棄之與人交乆而益篤喜爲歌詩至於射藝書法醫藥皆精妙􅀹好古書竒􅀞毎傾貲購之嘗自爲録蔵于家其材能好尚皆可嘉也母曰仁壽縣太君王氏􅀄娶王氏生一子安期也後娶又曰王氏銘曰在蜀僞時處昏不迷惟陳最㣲蜀亡而東髙明顯融莫如陳宗惟陳有聲自其髙曽君世不興惟興與伏有俟而畜其周必復實始自君昌其子孫考銘有文鎭安軍節度使同中書門下平章事贈中書令謚文簡程公墓誌銘嘉祐元年閏三月巳丑鎮安軍節度使檢校太師同中書門下平章事使持節陳州諸軍事陳州刺史程公薨于位以聞詔輟視朝二日贈公中書令於是其􅀌嗣隆以狀上考功移于太常而博士起曰法冝謚乃謚曰文簡明年十月十八日葬公于河南伊闕之某鄕某原一作神陰郷張留里其􅀌又以請于太史而史臣脩曰禮冝銘乃考次公之世族官封爵號卒葬時日與其始終之大節合而誌於其墓且銘之曰惟程氏逺有世序自重􅀺以來其後居中山者出於魏安鄕侯昱之後公諱琳字天球中山博野人也曽祖贈太師諱新曽祖妣呉國夫人齊氏祖贈太師中書令諱賛明祖妣秦國夫人呉氏考􅀽州冝春令贈太師中書令一有兼字尚書令冀國公諱元白妣晉國夫人楚氏公以大中祥符四年舉服勤辭學髙第爲㤗寜軍節度掌書記一作推官改著作佐郎知壽陽縣祕書丞監左蔵庫天僖中詔舉辭學履行召試直集賢院今天子即位遷太常博士三司戸部判官是時契丹所遣使者數出不遜語生事而主者應對多失辭上患之巳而契丹來賀即位乃選公爲接伴使而契丹使者言太后當遣使通書公遽以禮折之乃巳史官修眞宗實録而起居注闕命公修大中祥符八年以後起居注遂修起居注遷祠部貟外郎提舉在京諸司庫務以本官知制誥同判吏部流内銓天聖五年館伴契丹賀乾元節使使者言中國使至契丹坐殿上位次髙而契丹使來坐次下當陛語甚切不巳而上與大臣皆以爲小故不足爭將許之公以謂許其小必啓其大力爭以爲不可遂止河决滑州􅀄議者言可塞役旣作而後議者以爲不可乃命公徃視之公言可塞遂塞之􅀊中遷右諫議大夫權御史中丞明年拜樞宻直學士知益州蜀人輕而喜亂公常先制於無事至其臨時如不用意而略其細治其大且甚者不過一二而蜀人安之自寮吏皆不能窺其所爲正月俗放燈吏民夜㑹聚遨嬉盛天下公先戒吏爲火備有失火者使隨救之勿白以動衆旣而大宴五門城中火吏救止卒宴民皆不知蓋其他設施多􅀋此軍士見監軍告其軍有變監軍入白公笑遣之惶恐不敢去公曰軍中動静吾自知之苟有謀者不待告也可使告者來監軍去而告者卒不敢來公亦不問遂止蜀州妖人有自號李冰神子者署官屬吏卒聚徒百餘人公命捕寘之法而讒之朝者言公妄殺人蜀人恐且亂矣上遣中貴人馳視之使者入其境居人行旅爭道公善使者問殺妖人事其父老皆曰殺一人可使蜀數十年無事使者問其故對曰前亂蜀者非有智謀豪傑之才乃里閭無頼小人爾惟不制其始遂至於亂也使者視蜀旣無事又得父老語還白於是上益以公爲能遷給事中知開封府禁中大火延兩宫宦者治獄得縫人火斗巳誣伏而下府命公具獄公立辨其非禁中不得入乃命工圗火所經而後宫人多所居隘其烓竈近版壁􅀊乆燥而焚曰此豈一日火哉乃建言此殆天災也不冝以罪人上爲緩其獄故卒得無死者公在府决事神速一􅀊中獄常空者四五遷工部侍郎龍圗閣直學士守御史中丞是􅀊以翰林侍讀學士復知開封府明年爲三司使治財賦知本末出入有節雖一金不可一作敢妄取累遷吏部侍郎景祐四年以本官叅知政事司天言日食明年正旦請移閏月以避之公以謂天有所譴非移閏可免惟脩德政而巳乃止范仲淹以言事忤大臣貶饒州巳而上悔悟欲復用之稍徙知潤州而惡仲淹者復誣以事語入上怒亟命置之嶺南自仲淹貶而朋黨之論起朝士牽連一有一字出語及仲淹皆指為黨人公獨爲上開􅀃明其誣枉上意解而後巳公爲人剛決明敏多識故事議論慨然及知政事益􅁬勵無所回避宰相有所欲􅀻􅂺以語折之至今人徃徃能道其語而小人僥倖多不得志遂共以事中之坐貶光禄卿知潁州巳而上思之徙知青州又徙大名府居一􅀊間遷户部吏部二侍郎尚書左丞資政殿學士北京建與宦者皇甫繼明爭治行宫事章交上上遣一御史視其曲直御史直公遂罷繼明是時繼明方信用其􅀔傾動中外自朝廷大臣莫不屈意下之而公􅀍中傷方起未復而獨與之爭雖小故不少假也故議者不以公所直爲難而以能不爲繼明屈爲難也遷工部尚書資政殿大學士河北安撫使慶暦六年拜武昌軍節度使陜西安撫使知永興軍府事明年加宣徽北院使判延州夏人以兵三萬臨界上前三日公諜知其來戒諸堡寨按兵閉壁虜至以爲有備引去訖公去不復窺邉趙元昊死子諒祚立方㓜三大將共治其國言事者謂可除其諸將皆以爲節度使使各有其所部以分弱其􅀔可遂無西患事下公公以謂幸人之喪非所以示大信撫夷狄而諒祚雖㓜君臣和三將無異志雖欲有爲必無功而反生事不如因而撫之上以爲然皇祐元年加同中書門下平章事復判大名府兼北京留守自元昊反河西契丹亦犯約求地二邉兵興連􅀊不觧而公方入與謀議更守西北二方尢知夷狄虚實情僞山川要害所以行師制勝營陣出入之法於河北􅀹詳其奏議頗多雖不能盡用其指畫䂓爲之際有可喜也再居大名前後十年威恵信於其人人爲立生祠公自罷政事益不妄與人合亦卒不復用旣徙鎮安居三􅀊上書曰臣雖老尚能爲國守邉未報而得疾享年六十有九公累階開府儀同三司勲上柱國開國廣平郡爵公食户七千四百而實封二千一百賜號推誠保德守正翊戴功臣娶陳氏封衛國夫人子男四人曰嗣隆太常􅀶士嗣弼殿中丞嗣恭太常博士嗣先大理寺丞女五人長適職方貟外郎榮諲次適秘書丞韓縝次適都官貟外郎晁仲約一作綽次適大理寺丞呉得次適將作監主簿王偁孫三人長曰伯孫次曰公孫皆太常寺太祝次曰昌孫守秘一作挍書郎有文集奏議六十卷公平生寡言笑愼於知人旣巳知之乆而益篤喜飲酒引滿然人罕得其驩而與余尤相好也銘曰君子之守志於不奪不學而剛有摧必折毅毅䄇公其剛不屈公在政事有諤其言直雖不容志豈不完謂公不顯公位將相豈無謀謨胡不以訪老于輔藩一作藩輔白首猶壯公雖在外􅀖國之光奄其不存士夫􅂚望吉卜之從兆此新岡惟其休聲逾一作愈逺彌長居士集卷第三十熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正杜待制墓誌知建安縣建本􅁻本同而蜀本衢本作建昌羅氏本作建陽朝佐按仁宗實録杜􅂎傳作建陽今從之張公墓銘讀于一作於新人有進士人一作之乃以爲一作乃以公爲工部二字上一有尚書字杜公墓銘四十六一作四十有六程文簡公墓銘八年以後起居江此下一有二十卷三字告其軍一作告某軍
