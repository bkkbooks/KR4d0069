body:
  text: 碑銘衛尉卿祁公神道碑銘惟太原祁氏其先出於黄帝之子二十五人一食於祁遂爲氏太原晉公盛於春秋之際祁氏亦盛於晉其後世逺而衰子孫散亡一作亡散之他國有居譙者即爲譙人後幾世生公諱某公由曽祖一有考字以来畜徳藴明世不大顯公生幾􅀊始有賢子革革咸平三年以郷貢進士中一作及第始以禄榮其親後幾􅀊公卒卒之􅀊實景祐四年正月二十七日享年六十有一革旣棄官服䘮于家日月二字一作旣訖如禮起復就仕仕又某年始爲尚書郎然後又以爵榮之一命贈大理評事累升衛尉卿夫人楚氏某人女其賢爲公之配後公以卒天聖八年始以公夫人之喪合􅁙譙縣湯隂郷將􅁙乃考其世徳刻石蔵墓中又圖刻於墓隧之外以􅁀露顯揚孝子之心也􅀄公間居常命革曰祁氏世有仕族一作官名聲可稱聞者比比出於時自國家建隆以来天子每一作􅀊􅀊下書四方舉賢能之士以官之而四方之人摩肩爭出獨祁氏無一人之迹至譙刺史廷下稱應書者豈吾門遂廢乎抑大廢而後興也或後遂興興由汝也於是盡出其家之有益市群書日釀酒爲具以待四方之賔使與之遊毎郷里大儒先生講􅀃授學校一作徒子即隨酒具以往勤勤盡其歡􅀊時未嘗懈怠不一有敢字顧資産之有無者惟奉其家祭祀及以禮士君子爾由是浸漸以成人及享子禄不數􅀊乃終人謂力勞而報約何也旣而享名爵登九卿然後郷里榮之夫享子養人之常殁而榮不朽顧天之報予孰云無厚薄哉惟公以純篤敦實履其身行其家以大其門教其子卒成其志志成矣而身殁身殁而名益榮矣今又得顯書其行掲之金石以彰爲善之効而以其餘勸於後人得爲賢也噫今有人一作人有􅀒材與能昂立人上與時爭髙下不肯分寸屈其心而卒困厄顛踣怏怏不得志欲一縣佐不可得以至窮且老殁無聞者幸而得志處富貴極崇髙即死而身名俱滅子孫至爲僕􅀠轉死溝壑者亦不可數用彼較此得失孰多乎豈􅀒材與畜徳􅀁享固不同耶碑具使来乞辭辭具又爲之詩以貽譙里之童子使歌之以永公之無窮也衣車赫赫馳者誰生世不聞死莫知卿居里門乃褐衣殁榮之存令名垂人有不信考斯碑卿之有碑由子爲後之父者冝􅀁思諫議大夫楊公墓誌銘府君杭州錢塘人其譜曰漢太尉震之後世出弘農其後微逺不能譜録府君之九代祖􅀮朝始復得次序曰􅀮朝生燕客燕客生堪而猶爲弘農人堪生承休是謂皇髙祖唐天祐元年爲刑部員外郎副給事中鄭祁使吴越冊錢鏐爲王楊行宻亂江淮道阻不克歸遂留杭州始分弘農之籍籍錢塘􅀄承休之行也挈其子巖以俱巖仕呉越國位至丞相是謂皇曽祖生尚書職方員外郎諱郾是謂皇祖生贈禮部尚書諱蠙是謂皇考府君㓜失其父有志節不群諸兒母元夫人獨愛之夫人之喪尚書也内外之姻未嘗有見其笑者府君生十􅀊作雪賦一篇始爲之笑及長尤好學日必誦書數萬言或晝夜不息臨食至失匕筯已而病其目元夫人奪蔵其書府君盗之亡鄰家以讀大宋受命太宗皇帝即位之三年吴越忠懿王朝京師以其地納籍有司呉越國除隨其皇祖以族行寓宋州三舉進士端拱二年中乙科歷蔡州新昌縣令遷著作佐郎知徳州爲政有治迹詔書褒之咸平三年交趾獻馴犀府君以袐書丞監在京商稅院因奏犀賦真宗嘉之召試學士院遷太常博士賦一時文士爭相傳誦不及明年又上書自薦獻􅀁爲文二十餘萬言乃直集賢院知􅀽筠二州提􅀧開封府界諸縣入爲三司鹽鐵判官知越州提􅀧淮南刑獄爲宰相王文穆公不恱以事罷之卒坐考試國子監生貶監陳州榷酒逾年得知常州復入三司判磨勘司丁元夫人憂服除判户部勾院比自薦及是二十七年矣然少􅀌能自立力勤苦爲文章履其身以儉約不妄自為進取其官業行已之方一皆自信扵聖人之道不肯少顧時之人􅀁爲而時之人亦以有徳君子名之故其直集賢院者二十七年不遷官由太常博士􅂊至刑部郎中有出其後者往往至榮顯或有笑其違世自守以質朴諷使少改其爲者府君歎曰吾不學乎世學乎聖人由是以至此吾之􅀁有不敢以薦於人而嘗自獻于天子矣今欲孰附以進邪其信道深篤不可屈曲如此天聖四年以乆次遷集賢修撰出知應天府同糺察在京刑獄轉兵部郎中六年年六十五老矣始召以知制誥府君與頴川陳從易皆以好古有文行知名然二人者皆乆不用遂以老旣而一日並用之是時學者稍相習務媮窳爲文章在位稍以爲患皆以謂天子用􅂄老將有意矣而文下詔書勑學者禁浮華使近古道然後以謂用二人皆不無意矣而皆恨其晚也居二􅀊拜右諫議大夫集賢院學士出知亳州於州封虢略縣男食邑三百户明道二年四月十日以疾卒於州之正寢年六十有九其病將卒猶不廢學有文三十卷曰􅀮集又五卷曰西垣集嗚呼畜其學以老不克用獨見於文章然其文卒待一施於朝廷遂位榮顯旣貴贈其皇考禮部尚書母太原郡太君其婦曰漳南縣君張氏後夫人南陽郡君亦張氏䕃其男長曰洎眀州觀察支使次曰濬江隂軍司理叅軍次曰泳漸沆渢皆將作監主簿旣終又䕃二孫某官其餘之及者三世則夫守道者未必果不遇也噫楊氏嘗以族顯於漢為三公者四世漢之亂更魏渉晉戕賊一作斵於夷胡而漢之大人苗裔盡矣比數百􅀊下而及唐然楊氏之後獨在大和開成之間曰汝士者與虞卿魯士漢公又以名顯於唐居靖恭坊楊氏者大以其族著唐之亂極於懿僖昭三宗下更五姓天下痝裂焚蕩翦薙而唐之名臣之後盡矣又幾百年至于今然楊氏之後獨在及府君又大顯始震嘗有徳於漢而死以無辜君子悼震曰不幸然孰知夫世不昌且乆歟而府君又畜其徳則孰知其後世又不然歟於其􅁙也是冝銘銘葢􅀁以使後世之有考也府君卒後若干年以景祐二年某月某日􅁙杭州某縣某郷漳南縣君先府君二十六年以亡及是合􅁙自有誌府君􅀄名侃後避真宗皇帝舊名改曰大雅字子正銘曰楊氏之先自震有聞有盛有衰世惟厥人由漢迄今更難冒亂歷時千年而世三顯府君之顯不彰于􅀄其乆不渝卒克以敷弘農之分遂播南土嗚呼徳則承其先而葬也塋于一作於祖尚書職方郎中分司南京歐陽公墓誌銘公諱潁字孝叔咸平三年舉進士中第􅀄任峡州軍事判官有能名即州拜祕書省著作佐郎知建寜縣未半􅀊峡路轉運使薛顔廵部至萬州逐其守之不治者以謂繼不治非尤善治者不能因奏自建寜縣往代之以治聞由萬州相次九領州而治之一􅂯至曰鄂州二辭不行􅀄彭州以母夫人老不果行最後嘉州以老告不行實治七州州大者繁廣小者俗惡而姦皆世指爲難治者其􅀹甚曰歙州民習律令性喜訟家家自爲簿書凡聞人之隂私毫髪坐起語言日時皆記之有訟則取以證其視入狴牢就桎梏猶冠帶偃簀恬如也盗有殺其民董氏於市三年捕不􅀗府君至則得之以抵法又冨家有盗夜入啓其蔵者有司百計捕之甚急且又大購之皆不􅀗有司苦之公曰勿捕與購獨召冨家二子械付獄鞫之州之吏民皆曰是素良子也大恠之更疑互諫公堅不回鞫愈急二子服然吏民猶疑其不勝而自誣及取其所盗某物於某􅀁皆是然後讙一作歎曰公神明也其治尤難者若是其易可知也公剛果有氣外嚴内明不可犯以是施於政亦以是持其身􅀄皇考侍郎爲許田令時丁晉公尚少客其縣皇考識之曰貴人也使與之遊待之極厚及公佐峽州晉公薦之遂拜著作其後晉公居大位用事天下之士往往因而登榮顯而公屛不與之接故其仕也自著作佐郎祕書丞太常博士尚書屯田都官職方三員外郎郎中皆以􅀊月考課次第陞知萬峽鄂歙彭鄂閬饒嘉州皆􅀁當得及晉公敗士多不免惟公不及明道二年以老乞分司有田荆南遂歸焉以景祐元年正月二十六口終于家年七十有三祖諱某贈某官疑皇妣李氏贈某縣君夫人曽氏某縣君先亡公平生彊力少疾病居家忽晨起作遺戒數紙以示其嗣子景昱曰吾將終矣後三日乃終而嗣子景昱能守其家如其戒歐氏出於禹禹之後有越王句踐句踐之後有無疆者爲楚威王􅀁滅無疆之子皆受楚封封之烏程歐陽亭者爲歐陽氏漢世有仕爲涿郡守者子孫遂北有居冀州之渤海有居青州之千乗而歐陽仕漢世爲博士􅀁謂歐陽尚書者也渤海之歐陽有仕晉者曰建􅀁謂渤海赫赫歐陽堅石者也建遇趙王倫之亂其兄子質南奔長沙自質十二世生詢詢生通仕於唐皆爲長沙之歐陽而猶以渤海爲封通又三世而生琮琮爲吉州刺史子孫家焉自琮八世生萬萬生雅雅生髙祖諱效髙祖生曽祖諱託曽祖生皇祖武昌令諱郴皇祖生公之父贈户部侍郎諱倣皆家吉州又爲吉州之歐陽及公遂遷荆南且葬焉又爲荆南之歐陽嗚呼公於脩叔父也銘其叔父冝扵其世尤詳銘曰壽孰與之七十而老祿則自取於取猶少扶身以方亦以從公不變其􅀄以及其終都官郎中王公墓誌銘明道元年五月二十四日尚書都官郎中王公以疾終于許州私第明年十月其􅀌宗彭宗古奉公之喪及公之先君先夫人俱葬于許州長社縣白兎原公諱世昌字次仲少屬文舉進士端拱元年登科第補鳯翔郿縣主簿再調開封士曹參軍知杭州鹽官縣又改蘇州常熟縣轉運使張式以治狀奏充秀州判官遷著作佐郎知彭州九隴縣轉太常丞㑹鹽鐵上言建安茶稅不充請擇材臣幹其任公膺是選􅀊増四千萬三年歸朝優詔嘉􅅄擢知饒州連典蜀福二州歷太常博士屯田都官職方三員外郎權三司判官出知鄧州轉屯田郎中徙東川賜三品服移成州權莅西亰留守司御史臺又知澤州轉都官郎中知絳州老疾上章得分司西亰享年七十有八公性明察凡爲郡獄訟無細大皆呼前面質其罪有􅁈者立辨出之獄官俯伏受教僚佐充員而已故􅀁至稱有治聲亦用此爲人􅀁擠成州之遷是也好接士􅀋不以年耆自處候門者雖晚進皆與均禮論者多之􅀄娶李氏再娶水丘氏封歸安縣君柔婉有婦道早亡生子三人長宗􅀃終杭州臨安主簿次宗古前連州陽山令次宗彭前孟州汜水主簿女四人長適涇州支使宋齊古次早夭次適侍御史楊偕次適光禄寺丞吕昌齡臨安有子一人師温郊社齋郎陽山子師良師儉皆郊社齋郎二女俱㓜銘曰八十其齡三品其服有子有孫以才以淑吁嗟令人􅀆嚮用兹福左班殿直胥君墓誌銘胥姓出晉大夫童世乆徙遷失其譜君諱某字致堯有子曰沆能略言其世曰吾家爲燕人十三代祖儀爲唐御史中丞坐言武后事貶臨川後世因家焉胥氏義聞郷閭門有旌表由吾先君而上祖諱某仕僞唐􅀽州冝春令父諱某當周世宗取淮南李氏日益衰亂因徙家合肥及吾先君始禄于朝然卒於不得志今其􅁙敢再拜以請予爲考次君之行曰君少力學爲文辭端拱咸平之間再舉進士嘗中選矣時天子諒闇不能廷試進士疑有司選太多削其奏籍之半乃罷去其冬契丹犯邊天子幸魏又將幸真定君以草澤應詔上書理檢言兵事且曰臣言有不可書者非人主不得聞天子召見爲屛左右聽其􅀃矍然而悟將拜某官旣出大臣詰其事不肯對大臣皆不恱曰且可以職縻之以爲三班借職君辭不就天子還亰師又固辭願從進士試禮部皆不許以監温州天冨鹽監君歎曰吾親老敢擇禄邪凡世􅀁謂材者惟施無不利乃可謂􅀎吾將有爲也已乃受命凡治鹽三􅀊増其舊二百餘萬斛罷歸以能被薦未暇録􅀄契丹䧟􅀺陽滑州守張秉請君將戍兵擊河淩以斷賊契丹去張公以君爲材留君護漁池迎陽二埽朱博代守滑乃曰河恐滑人者趨西埽爾請君兼護之君䟽河爲别流以殺其􅀔明年河棄西埽去滑人無水恐􅀊省工材百餘萬秩滿有司上君鹽最護河之功遷奉職君意不滿辭不拜丁母夫人某氏憂終喪不許以監黄州商稅餘年課爲最召還在道用祀汾隂恩卒遷奉職監杭州排岸司浚浙江龍山二閘廢清河堰以通漕杭人至今便之爲端州兵馬監押就遷右班殿直給事中樂黄目舉君材任閤門祗候有司限例不行得温州兵馬監押期還遷職在温州聞黄目死前舉狀格不用君歎曰豈吾命邪今天子即位遷左班殿直以疾求監壽州酒稅逾年請告就醫京師天聖元年十月某日卒于建平坊享年五十有九􅀄娶宋氏生三男曰沆澄泳澄早卒二女長亦早卒次適某氏再娶沈氏後君卒􅀄君之喪寓􅁙朝陽門外慶曆二年某月某日􅁙于某縣某郷某原銘曰余悲胥君始以儒者自進而仕也非其志方其以一布衣飛箝人主之意其志壯哉豈止於此自古賢材明智之士困於失職多矣豈天􅀁不相邪豈其力不足邪蓋苟者多得偷者易安守義而窮乃理或然嗟乎胥君永矣茲阡内殿崇班薛君墓誌銘公諱塾字宗道絳州正平人資政殿學士兵部尚書河東簡肅公之弟扵惟簡肅爲時顯人天聖明道間實參大政以道徳剛直外正於朝孝友敦睦内仁其家其爵命之榮上逮三世旁禄其族子官者三十人公於一作于太保諱景之廟爲曽孫太傅諱温瑜之廟爲孫太師諱化光之廟爲第五子少以簡肅䕃􅀘三班借職九遷内殿崇班享年六十五以終公爲人果毅質直喜以氣節自髙少好學嘗爲文詞仕雖不章官能其職􅀄監曲沃縣酒稅民素苦伐薪給官炊公始更用石炭民得不苦至今頼之又監龍門縣清澗木稅絳州鹽酒稅河中府浮橋凡所施設皆有法後人雖欲輙更莫能也蜀民易揺喜倡事以相驚謼遂縁爲亂公爲兵馬監押旁郡呼曰盗將大至公能以重鎮之州卒無事民恃以安􅀊滿州乞留不克知河池縣賦役刑罰示民以信使民知政而吏無􅀁措其姦始建孔子廟春秋飭其牲器以與邑人行事民􅀄識學校之禮當時名臣若今樞宻副使杜公多薦其材以兄嫌避不升用奉使走馬承受滄州路公事數對便殿言利害皆可施行歷監通利軍陕蜀二州兵康定二年六月十五日壬辰以疾卒于蜀州之􅅟其長子曰大理寺丞通判陵州仲孺扶其柩歸于絳州道出河池河池之民泣遮于路曰此吾民之􅀁思也公卒之六日夫人吴氏卒于代州其次子曰大理寺丞通判代州宗孺以其喪歸遂合葬于正平縣清源郷周村原用慶曆元年十二月二十一日丙申之吉二子皆以材賢克承其家女一人適將作監主簿鄭宗賢銘曰薛絳大族興自簡肅簡肅之哲其剛烈烈公躬直清官以材稱惟賢是似不愧其兄薛有世次簡肅之碑公墓南原銘以識之長安縣太君盧氏墓誌銘夫人盧氏其父諱之翰單父人好學通五行律曆善籌䇿中進士第至道中用兵河西以爲陜西轉運使屢爲太宗言靈武事不合意輙貶旣而事驗思之輙復召用由是卒爲名臣官至太常少卿知廣州夫人歸楊公時年始十七公前夫人張氏生三男文友文舉文本皆尚㓜夫人亦生三男一早卒次文敏文通四女長適大理寺丞王中孚次適崑山縣尉刀綬次將作監主簿朱銑次早卒楊公以文行著名當時治身㢘清好施宗族大中祥符四年以右諫議大夫薨廣州家無貲夫人居䘮於淮上諸子怡怡知其母之􅄌撫其已不知家之有無也後二十有五年文友爲虞部員外郎知建昌軍文舉國子博士通判蔡州文本文通早卒文敏由大理寺丞應進士中第爲太子中允知蘇州常熟縣夫人在建昌感疾卒官舍享年五十七將卒戒其子曰吾幸見汝輩立而死吾無以教爲人能如汝父足矣遂歸葬壽州之西原祔舊塋禮也夫人􅀄用公封范陽縣君後用其子封仁壽縣太君又進封長安縣太君及卒也張夫人二子居喪哀如􅀁生嗚呼賢母也哉是宜銘粤景祐三年二月庚戌葬之銘曰從者其姑祔者其夫安此室乎外集卷第十一祁公神道碑景祐碑云景祐四年卒天聖八年􅁙按天聖在景祐之前疑景祐當作景徳諫議楊公墓銘録一作抵學乎聖人四字上一有而字其婦二字丄一有封字王公墓誌水丘氏集本多作巫丘薛君墓銘又監一作後監盧氏墓銘將作二字上疑脫適字奏議卷第十一薦劉羲叟劄子巳見河東奏草全書中進劉羲叟春秋災異狀同前論契丹侵地界狀巳見河北奏草全書中右三篇此卷更不重出存其目以告來者論臺官上言按察使狀􅀍選之者一作人皆亦一作皆字常能一無常字論杜衍等罷政事狀􅀹彰著􅀹字下一有爲字之得專之所作一好權好一作行懇讓之者一無者字見其皆未行事六字一作欲其作事條事條例一作然不敢然字下一有亦字惜之也一無之字居士集卷第十一歐陽文忠公集十一律詩五十七首􅀄至夷陵答蘇子美見􅀉三峽􅀝岧嶤同一作南遷地最遥物華雖可愛郷思獨無聊江水流青嶂猿聲在碧霄野篁抽夏笋叢橘長春條未臘梅先發經霜葉不凋江雲愁一作懸蔽日山霧晦連朝斫谷爭􅀵漆梯林􅃲摘椒巴賨船賈集一作巴江船賈至蠻市酒旗招時節同荆俗民風載楚謡俚歌成調􅀏摖一作攃􅀑聚喧囂夷陵之俗多􅁋奔又好祠祭毎遇祠時里民數百共餕其餘里語謂之摖􅀑因此多成􅃲訟得罪冝投裔包羞分折腰光隂催晏歳牢落慘驚飊白髪新年出朱顔異域銷縣樓朝見虎官舍夜聞鴞􅀉信無秋鴈思歸望斗杓須知千里夢長繞洛川橋冬後三日陪丁元珍遊東山寺幕府文書日已稀清罇歳晏喜相携寒山帶郭穿松路瘦馬尋春踏雪泥翠蘚蒼崖森古木緑蘿盤石暗深溪爲貪賞物來猶早迎臘梅花吐未齊送前巫山宰呉殿丞字照鄰俊域當年仰下風天涯今日一罇同髙文落筆妙天下清論揮犀服坐中江上掛帆明月峽雲閒謁帝紫微宫山城寂寞少嘉客喜見瓊枝一作林慰病翁龍興寺小飲呈表臣元珍乎日相從樂㑹文􅀶梟壷馬占朋分罰籌多似昆陽矢酒令嚴於細柳軍蔽日雪雲猶靉靆欲晴花氣漸氛氲一罇萬事皆毫末蜾臝螟蛉豈足云縣舍不種花惟栽楠木冬青茶竹之􅀋因戲書七言四韻結綬當年仕兩京自憐年少體猶輕伊川洛浦尋芳徧魏紫姚黃照眼明客思病來生白髪山城春至少紅英芳叢密葉聊須種猶得蕭蕭聽雨聲至喜一作虚白堂新開北軒手植楠木兩株走筆呈元珍表臣爲憐碧砌冝佳樹自斸蒼苔選緑叢不向芳菲趂一作赴開落直須霜雪見青葱披條泫轉清晨露響葉蕭騷半夜風時掃濃隂北䆫下一枰閑且伴衰翁戲答元珍一本下云花時乆雨之什春風疑不到天涯二月山城未見花殘雪壓枝猶有橘凍雷驚筍欲抽芽夜聞歸鴈生郷思病入新年一作鳥聲漸變知芳節人意無聊感物華曽是洛陽花下客野芳雖晚不須嗟􅀄晴獨遊東山寺五言六韻日暖東山去松門數里斜山林􅀮者趣鍾鼓梵王家地僻遲春節風晴變一作别物華雲光漸容與鳥哢巳交加冰下泉􅀄動煙中茗未芽自憐多病客來探欲開花夷陵歳暮書事呈元珍表臣一本作元珍判官表臣推官蕭條雞犬亂山中時節崢嶸忽一作歳巳窮遊女髻鬟風俗古野巫歌舞歳年豐夷陵俗朴陋惟歳暮祭􅀑則男女數百相從而樂飲婦女競爲野服以相遊嬉夷陵俗下一本有古字平時都邑今爲陋敵國江山昔最雄三國時呉蜀戰爭於此荆楚先賢多勝迹不辭携酒問鄰翁處士何參居縣舍西好學多知荆楚故事夷陵書事􅀉謝三舍人一作代書􅀉舎人三丈春秋楚國西偏境陸羽茶經第一州紫籜青林長蔽日緑叢紅橘最冝秋道塗處險人多􅀒邑屋臨江俗善泅臘市漁一作魚鹽朝暫合淫祠簫鼓歳無休風鳴燒入空城響雨惡江崩斷岸流月出行歌聞調􅀏花開啼鳥亂鉤輈一本有訟庭畫地通人語邑政觀風間俚謳土俗雖輕人自樂山川信美客偏愁四句黃牛峡口經新歳白玉京中夢舊遊曽是洛陽花下客欲誇風物向君羞戲一作􅀉贈丁判官西陵江口折寒梅爭勸行人把一一作酒盃須信春風無逺近維舟處處有花開􅀉梅聖俞一本注夷陵作青一作春山四顧亂無涯雞犬蕭條數百家楚俗歳時多雜􅀑蠻郷一作風言語不通華繞城江急舟難泊當縣山髙日易斜擊鼓踏歌成夜市邀􅀛卜雨趂燒一作春畬叢林白晝飛妖鳥庭砌非時見異花惟有山川爲勝絶􅀉人堪作􅀞圖誇離峽州後回􅀉元珍表臣一本作元珍判官表臣推官經年遷謫猒荆蠻惟有江山興未䦨醉裏人歸青草渡夢中船下武牙灘野花零落一作亂風前亂一作舞飛雨蕭條江上寒荻笋時魚方有味恨無佳客共盃盤再至西都一作􅀉謝希深伊川不到十年間魚鳥今應恠我一作我自還浪得浮名銷壯節羞將一作看白髪見一作對青山野花向客開如一作異花向我情猶􅀏芳草留人意自閑却到一作行至謝公題壁處向風清淚獨一作臨風清淚落潺潺過錢文僖公白蓮莊城南車馬地行客過徘􅆦野水寒猶入餘花晚自開命賔曾授簡開府最多才今日西州路何人更獨來謝公挽詞三首始見行春斾俄聞引葬簫􅀏言猶在耳䰟魄遂難招天象奎星暗辭林玉樹凋朔風吹霰雪銘旐共飄飄前日賔齋宴今晨奠柩觴死生公自逹存没世徒傷舊國難歸葬餘貲不給䘮平生公輔志所一作可得在文章樂事與良辰平生愛洛濵泉臺一閉夜蒿里不知春翰墨猶新澤圖書巳素塵堪憐寢門哭猶有舊時賔愁牛嶺􅀖人盡一作自􅀃畏愁牛一作牛愁不獨牛愁我亦愁終日下一作遶山行百轉却從山脚望山頭􅀉子山待制二絶一本後篇作别鎮陽􅀉沈待制留滯西山獨可嗟殘春過盡始還家落花縱有那堪醉一作看一作愛何況歸時無落花聞君屢醉賞紅英落盡殘花酒未醒嗟我落花無分看莫嫌狼藉掃中庭􅀉秦州田元均由一作近來邊將用儒臣坐以威名撫漢軍萬馬不嘶聽號令諸蕃無事著一作樂耕耘夢回夜帳聞羌笛詩就髙樓對隴一作暮雲莫忘一作望鎮陽遺愛在一作地北潭桃李正氛氲一作春深桃李正絪緼送沈待制陜西都運邈㡬歳瘡痍近息兵經營方喜得時英從來漢粟勞飛輓當使秦人自戰耕道左旌旗諸將列馬前弓一作冠劒六蕃迎知君材力多閑暇剩聽陽關醉後聲欒城遇風効韓孟聮句體歳暮氛霾惡冬餘氣候爭吹嘘回暖律號令發新正逺響來猶漸狂奔􅀔益橫頽城鏖戰鼓掠野過隂兵掃蕩無餘靄顚摧鮮立莖五山揺岌嶪九鼎沸煎烹玉石焚岡裂波濤卷海傾遥聽午合市爭呼夜驚營慘極雲無色隂窮火自生電鞭時砉劃雷軸助喧轟孔竅千聲出隂幽百恠呈狐妖憑莽蒼􅀑熖走青熒奮怒神増悚中休耳暫清胡兵占月暈江客候鼉鳴飄葉千艘失飛空萬瓦輕獵豪􅄈馬健舶穏想帆征畏壓頻移席隂祈屢整纓凍消􅀄醒蟄枯活欲抽萌病體愁山館春寒頼酒鐺雞號天地白登壠看晴明過中渡二首中渡橋邊十里堤寒蟬一作梅落盡柳條衰年年塞下春風晚誰見輕黃弄色時得歸還自歎淹留中渡橋邊柳拂頭記得來時橋上過斷冰殘雪滿河流自河北貶滁州􅀄入汴河聞鴈陽城淀裏新來鴈趂伴南飛逐一作何事來隨南越船野岸柳黃霜正白五更驚破客愁眠自勉引水澆花不厭勤便須巳有鎮陽春官居處處如郵傳誰得三年作主人席上送劉都官都城車馬日喧喧雖有離歌不慘顔豈似客亭臨野岸暫留罇酒對青山天街樹緑騰歸􅀐玉殿霜清綴曉班莫忘西亭曽醉處月明風溜響潺潺􅀉劉都官别後山光寒更緑秋深酒美色仍清繞亭黃菊同君種獨對殘芳醉不成書王元之􅀞像側在瑯瑘山偶然來繼前賢迹信矣皆如昔日言諸縣豐登少公事一家飽暖荷君恩想公風采常如在顧我文章不足論名姓已光青史上壁間容貌任塵昬公貶滁州謝上表云諸縣豐登苦無公事一家飽暖共荷君恩送京西提刑趙學士題輿甞屈佐留京攬轡今行一作來按屬城楚館尚看淮月色嵩雲應過虎關迎春寒酒力風中醒日暖梅香雪後清野俗經年留惠愛莫辭臨别醉冠傾􅀉題冝城縣射亭作邑三年事事勤冝城風物自君新已能爲政留遺愛何必栽花遺後人藹􅀂芝蘭芳可襲温如金玉粹而純友朋欣慕自如此何況斯民父母親豐樂亭遊春三首緑樹交加山一作新隂野鳥啼晴風蕩􅃞落一作晚晴斜日雜花飛鳥歌花舞太守醉明日一作月酒醒春巳一作色歸春雲淡淡日輝輝草惹行􅁭絮拂衣行到亭西逢太守籃輿酩酊揷花歸紅樹青山日欲斜長郊草色緑無涯遊人不管春將老一作盡來徃一作空遶亭前踏落花謝判官幽谷種花淺深紅白冝相間先後仍須次第栽我欲四時携酒去莫教一日不花開􅀞眉鳥一作郡齋聞百舌百囀千聲隨一作任意移山花紅紫樹髙低始知鎻向金籠聽不及林間自在啼懷嵩樓新開南軒與郡僚小飲繞郭雲煙一作閣煙雲匝㡬重昔人曾此感懷嵩霜林落後山爭出野菊開時酒正濃解帶西風飄􅀞角􅀝欄斜日照青松㑹須乘醉携嘉客踏雪來看羣玉峯送張生一别相逢十七春頽顔衰髪互相詢江湖我再爲遷客道路君猶困旅人老驥骨竒心尚壯青松歳乆色逾新山城寂寞難爲禮一作客濁酒無辭舉爵頻田家緑桑髙下映平川賽罷田神􅀏語喧林外鳴鳩春雨歇屋頭􅀄日杏花繁别滁花光濃爛柳輕明酌酒花前送我行我亦且一作秪如常日醉莫教絃管作離聲答謝判官獨遊幽谷見􅀉聞道西亭偶獨登悵然懷我未忘情新花自向遊人􅀏啼鳥猶爲舊日聲因拂醉題詩句在應怜手種樹隂成須知别後無由到莫厭頻携野客行招許主客欲將何物招嘉客惟有新秋一味涼更一作靜掃廣庭寛一作開百畒少容明月放一作吐清光樓頭破鑑看將滿甕面浮蛆撥巳香仍一作更約多爲詩準備共防梅老敵難當金鳯花憶繞朱欄手一作喜自栽緑一作繁叢髙下㡬畨開中庭雨過無人迹狼籍深紅􅀧緑苔鷺鷥風格􅀌髙塵外物性情閑暇水邊身盡日獨行溪淺處青苔白石見纎鱗野鵲鮮鮮毛羽耀朝輝紅粉墻頭緑樹枝日暖風輕言語軟應將喜報主人知木芙蓉種處雪消春始動開時霜落鴈初過誰栽金菊叢相近織出新畨蜀錦窠樵者雲際依依認舊林斷崖荒磴路難尋西山望見朝來雨南澗歸時渡處深詠雪至日陽初復豐年瑞遽臻飄颻初未積散漫忽無垠萬木青煙滅千門白晝新徃來衝更合髙下著何勻望好登長榭平堪走􅀞輪馬寒毛縮蝟弓勁力􅄈鈞客醉看成眩兒嬌一作驕咀且顰虚堂明永夜髙閣照清晨樹石詩翁對川原獵􅀐陳凍狐迷舊穴飢一作饑雀噪空囷此土偏冝稼而予濫長人應須待和暖載酒共行春送楊先軰登第還家解榻方欣待儁英掛帆千里忽南征錦衣白日還家樂鶴髪髙堂獻壽榮殘雪楚天寒料峭春風淮水浪崢嶸知君歸意先飛鳥莫惜停舟酒屢傾一作餞行􅀄至潁州西湖一作到潁治事之明日行西湖上種瑞蓮黃楊一作因與郡官小酌其上聊書所見􅀉淮南轉運吕度支發運許主客平湖十頃碧琉璃四面清隂乍合時柳絮已將春去逺海棠應恨我來遲啼一作鳴禽似與遊人語明一本作好月閑撑野一作小艇隨毎到最佳堪樂處却思君共把芳巵三橋詩皇祐元年新作三橋而名之旣而又爲之詩朱欄明緑水古柳照斜陽何處偏冝望清漣對女郎青漣閣名後改作去思堂右冝逺鳴騶入逺樹飛蓋渡長橋水闊鷺􅀟起波明魚自跳右飛蓋輕舟轉􅀌嶼幽浦􅃞平波回看望佳處歸路逐漁歌右望佳答通判吕太博千頃芙蕖蓋水平邵伯荷花四望極目􅀭州太守舊多情􅀞盆圍處花光合予甞採蓮千朶揷以􅀞盆圍繞坐席紅袖傳來酒令行又甞命坐客傳花人摘一葉葉盡處飲以爲酒令舞踏落暉留醉客歌遲檀板換新聲如今寂寞西湖上雨後無人看落英祈雨曉過湖上清晨驅馬思悠然渺渺平湖碧玉田曉日未昇先起霧緑隂一本作雲􅀄合自生煙身閑始覺時光好春去猶餘物色妍更待四郊甘雨足相隨簫鼓樂豐年居士集卷第十一熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正此卷答蘇子美見􅀉云祭􅀑聚喧囂本注夷陵俗好祠祭毎遇祠時里民數百共餕其餘里俗謂之祭􅀑諸本皆同惟蜀本以祭爲摖朝佐按􅀋篇摖初􅁑切挑取也推也有推食之義蜀去峡近故能知其方言又吉州羅寺丞家京師舊本亦作攃按集韻攃桑􅁑切散之也有散福之義二義皆通今改作摖一作攃􅀂作祭字别無意義本注豈應復言里俗謂之祭􅀑也答蘇子美俚歌石本作祠歌攃􅀑攃石本作祭注文却引攃􅀑事遊東山寺冬後石本作冬至後幕府一作幕下龍興寺小飲氛氲一作氤氲手植楠木泫轉石本作滴􅄋獨遊東山寺交加交一作嘐夷陵書事向君羞君一作春石本同􅀉子山待制京本作今日報鎮陽守有行日某不乆可出局先􅀉子山待制四兄二絶送沈待制方喜一作方務入汴河聞鴈新來一作秋送劉都官都城一作門幽谷種花淺深紅白一作深紅淺白送楊先軰髙堂一作髙年答吕太博詩注揷以一作揷之
