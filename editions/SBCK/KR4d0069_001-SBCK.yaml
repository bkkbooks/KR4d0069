front:
  text: 于役志歐陽文忠公集一百二十五景祐三年丙子歳五月九日丙戌希文出知饒州戊子送希文飲于祥源之東園壬辰安道貶筠州甲午師魯貶郢州乙未安道東行不及送余與君貺追之不克還過君
  hash: sha256:0388e43b8a4f2a93e091c9fe8b3e84a2ebcb08a783e7c47a5e341493160ee366
