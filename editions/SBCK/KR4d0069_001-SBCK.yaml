body:
  text: 謨家遂召移之公期道滋景純夜飲丁酉與損之送師魯于固子橋西興教寺余留宿明日道卿損之公期君貺君謨武平源叔仲輝皆來㑹飲晚乃歸余貶夷陵己亥夜過邃卿家話别邃卿病也庚子夜飲君貺家㑹者公期君謨武平秀才范鎮道滋飲婦家不來辛丑舟次宋門夜至公期家飲會者君謨君貺景純穆之道滋飲婦家不來壬寅出東水門泊舟不得岸水激舟横于河㡬敗家人驚走登岸而避遂泊亭子下損之來奕棋飲酒暮乃歸癸卯君貺公期道滋先來登祥源東園之亭公期烹茶道滋鼔琴余與君貺奕巳而君謨來景純穆之武平源叔仲輝損之壽昌天休道卿皆来會飲君謨景純穆之壽昌遂留宿明日子野始来君貺公期道滋復来子野還家餘皆留宿君謨作詩道滋擊方響穆之彈琴秀才韓傑居河上亦來㑹宿乙巳晨興與宿者别舟既行武平米追及至下鏁見之少頃乃去午次陳留登􅁃廟丙午在陳留丁未次南京明日留守推官石介應天推官謝郛右軍廵判官趙衮曹州觀察推官􅃽安石来小飲于河亭余疾不飲客皆醉以歸六月己酉次柳子庚戌過宿州與張參約泊靈壁鎮逰損之園㑹余有客住宿州參先發檥靈壁待余不至乃行晚次靈壁獨逰損之園舟失水道敗拖辛亥次青陽壬子至于泗州晚與國器小飲州􅇬中癸丑始見春卿甲寅乙卯丙辰獨在泗州始食淮魚丁巳次洪澤與劉春卿同年黃孝恭相遇始識大理寺丞李惇􅁉洪澤廵檢顔懷玉者錢思公在洛時故吏遂與四人者夜飲五鼓罷明日食畢解舟與飲者别春卿復相送以前晚入沙河乘月夜行嚮山陽與春卿聮句二鼓宿閘下􅀺明元均来遂至楚州泊舟西倉始見安道于舟中安道㑹飲于倉亭始食􅀲出倉北門看雨與安道弈庚申小飲舟中會者元均春卿安道余始飲酒移舟檥城西門門閉泛月以歸辛酉安道解舟不果别與春卿弈于倉亭晚别春卿壬戌與元均小飲倉北門舟中夜宿倉亭癸亥夕與元均坐水次納􅈵已而大風雨震雹􅁀至乙丑與􅀮甫及髙􅁇隆焦宗慶小飲水陸院東亭看雨始見荷花丙寅與元均􅀮甫飲于西倉丁卯􅀮甫来會登倉北偃上亭納涼遲客至遂及元均小飲舟中已而大風震雹遂宿舟中戊辰余生日具酒為壽于舟中己巳與元均泛舟北辰會􅀮甫小飲宿倉亭庚午同年朱公綽来自京師辛未子聰来自壽州夜飲倉亭留宿壬申泛舟飲于北辰癸酉􅀮甫来飲别夜與元均小飲宿倉亭甲戌知州陳亞小飲魏公亭看荷花與者􅀮甫朱公綽晚移舟楚望亭陳從益来自京師見余扵舟中始聞君謨動靜秀才陳䇿来自京師夜見余扵楚望亭作常州書自泊西倉至于楚望凡十有七日乙亥次寳應丙子至于髙郵七月丁丑復見子聰會飲弭節亭戊寅遂與子聰同舟以前次邵伯己卯至于􅀭州遇秀才廖倚夜與倚及子聰飲觀風亭明日子聰之潤州廖倚之楚州伯起来宿觀風亭辛巳與伯起飲遡渚亭會者集賢校理王君玉大理寺丞許元太常寺太祝唐詔祠部員外郎蘇儀甫壬午儀甫来小飲觀風亭會者許元唐詔君玉伯起先歸癸未與許元小飲遡渚亭會者如壬午伯起不来甲申與君玉飲壽寜寺寺本徐知誥故第李氏建􅀦以為孝先寺太平興國改今名寺甚宏壯畫壁􅀹妙問老僧云周世宗入􅀭州時以為行宫盡朽漫之惟經蔵院畫玄􅅄取經一壁獨在尤爲絶筆嘆息久之乙酉小飲秀才吕有家會者如壬午伯起不来余遂留􅀫丙戌至于真州大􅀬無水辛卯飲僧于資福寺移舟溶溶亭處士謝去華援琴待凉以入客舟戊戌入客舟泊涵虚亭庚子次江口辛丑次長蘆壬寅夜乗風次清凉寺癸卯晨至江寧府八月丙午猶在江寧丁未小飲君績家己酉小飲于水閣庚戌次采石辛亥阻風與侍禁陳宗顔飲壬子過太平州夜乗風􅀫帶星口癸丑過蕪湖繁昌􅀫慈母磯甲寅乗風晝夜行丙辰禱小姑山神至江州丁巳在江州約陳侍禁遊廬山余病呼醫者不果徃遂行次郭家洲己未阻風郭家洲與澧陽縣令趙師道飲村市就村人市羊供膳不得余疾謀還江州召廬山僧以醫不果庚申次盤唐港辛酉至于蘄陽壬戌小飲瞿珣家會丹稜知縣著作佐郎范佑蘄春主簿郭公美癸亥次新冶禱江神得大魚甲子至于磁湖乙丑猶在磁湖自丁巳余體不佳至是小閒丙寅至于黄州丁卯與知州夏屯田飲于竹樓興國寺火約余明日爲社飲不果夜登江澳次漆磁戊辰次􅀟柳夾己巳次白楊夾庚午至于鄂州始與今狐修巳相識辛未遣人之黄陂召家兄大風雨不克渡江而還壬申小飲修已家遂留宿明日家兄来見余扵修已家始中酒睡兄家甲戌飲于兄家乙亥飲令狐家夜過兄家會宿九月丙子次沌口丁丑次昭化港夜大風舟不得泊禱江神戊寅次穿石磯夜大風擊舟不得寢己卯至岳州夷陵縣吏来接泊城外庚辰假舟于邵曖辛巳壬午入官舟癸未入荆江次李家洲甲申次烏沙乙酉次魯洑丙戌次塔子口觀魚望五鵝塵角望夫諸山丁亥次石首夜大風戊子阻風壬辰次公安渡右于役志一卷雖非著述流傳至今則不可略按夷陵抵京師一千六百里公與尹師魯書云臨行臺吏催苛百端始謀陸行以大暑又無馬乃沿汴絶淮泛大江凡五千里用一百一十程纔至荆􅀯與此志合自公安後闕而不録既以十月二十六日到官則留荆約旬餘正庭參轉運時也于役志卷終六月丁卯偃上亭偃字疑七月甲申朽漫合是杇漫玄奨疑是玄奘辛卯飲僧飲字疑内制集卷第一歐陽文忠公集八十二太祖皇帝忌辰道􅂣齋文九月八日維至和元年歳次甲午九月辛酉朔十九日已卯皇帝遣入内内侍省内侍殿頭勾當太平興國寺開先殿劉立言請僧三七人於太平興國寺開先殿開啓太祖皇帝忌辰道􅂣一月日伏以受命開先肇基興運昭祖功而丕顯緜寳祚於無疆用深追逺之誠式奉明齍之薦載嚴爭刹以集善因伏願覺力常資威靈如在延鴻宗祏集慶眇沖庻􅀖咸􅀍於餘休品物共均於博施謹言太祖皇帝忌辰道􅂣功徳䟽右語九月八日右伏以當天開運聿隆創始之功繼綂承休方罄奉先之孝爰戒徹音之日用資作善之祥嚴法會於金園啓靈文於貝葉一作牒伏願超登妙果髙證真乗瞻不動以常存祐無疆而永固下均氓庻咸􅀗乂寧賜宰臣陳執中生日禮物口宣九月八日有勑卿為時柱石秉國鈞衡爰逢慶育之辰冝有便蕃之錫豈惟故事式示眷懷今差卿男將作監丞世儒賜卿生日禮物想冝知悉班荆館賜契丹國信使副赴闕御筵口宣九月八日卿等載持信節方止都圻特申式宴之儀以示勞勤之意用推寵數當體至懷撫問梓州路臣寮口宣九月十七日卿汝等並韞器􅀎逺膺􅀉任式戒嚴秋之序載懷勤事之勞冝示撫存以彰眷厚班荆館賜契丹國信使副却回御筵口宣九月十七日卿等聘儀成禮歸馭戒􅂗念茲夙駕之勤冝有祖行之寵式陳衎樂以示宴私班荆館賜契丹國信使副却回酒果口宣同日卿等信節爰馳示隣歡之永固使軺云復申飲餞以為榮冝有匪頒以彰眷遇賜隴州團練使代州部署田辛等勑書九月十四日勑田辛省所進奉謝恩賜公使月俸馬一疋事具悉邊防有嚴􅀉任尤重嘉汝材武董吾兵師軍聲俾壯於威容寵數冝優於廪賜遽陳貢謝益認傾輸尚體眷懷勿忘自效故茲示諭想冝知悉秋冷汝比好否遣書指不多及雄州白溝驛賜契丹人使却回御筵兼傳宣撫問口宣九月二十日卿等言持信節式戒歸塗念茲衝渉之勤冝有撫存之意仍頒宴餞以示眷懷賜翰林學士尚書工部郎中知制誥王洙􅅄諭詔九月十四日勑王洙省監護使劉沆劄子奏繳連到少府監修製法物所狀修製温成皇后一行法物勘會例各鮮明及減省得物料功限甚多事少府領五署之衆工乃九卿之舊職卿以儒學參吾侍從兼涖其事􅀎勤厥官俾夫功簡而速成物精而有法益彰材敏尤用歎嘉故茲􅅄諭想冝知悉皇帝本命兖州會真宫等處開啓道􅂣青詞九月二十日維至和元年歳次甲午十月辛卯朔二十日庚戌嗣天子臣某謹遣某人開啓本命靈寳道􅂣三晝夜罷散日設醮一座謹上啓太上開天執符御歷含真體道玉皇大天帝寳祚無疆蒼穹垂祐吉日式臨於元命醮科爰舉於舊章薦誠慤以惟精延聖真而並集仰希靈貺敷錫眇沖四時叶序於和平品彚均休於康泰無任懇禱之至謹詞建隆觀開啓追薦温成皇后道􅂣青詞九月二十五日伏以蒼圓降鑒列象緯以昭垂蠲潔僃陳薦馨香而上逹載嚴仙宇恭按科儀眷内則之遺芳冀髙真之􅁳祐仰祈隂貺永助靈遊福康公主宅修築地基􅀕告太歳巳下祝文九月二十七日維至和元年歳次甲午十月辛卯朔七日丁酉皇帝遣宫苑使榮州防禦使内侍省内侍右班副都知任守忠致􅀕于太歳土地諸神禮崇下嫁詩美冝家惟築館之有􅀄方㳙辰而叶吉冀百靈之來護期不日以斯成尚饗雄州白溝驛撫問契丹賀正人使兼賜御筵口宣九月二十七日卿等載馳一作持瑞節爰及疆亭顧惟夙駕之勤冝有示􅄌之宴用彰寵待當體眷懷賜新除參知政事程戡讓恩命不允斷來章批答十月十二日省表具之朕有欲治之心而甚勞思厎治之方而未􅀗夙夜于此惟賢是求卿出入宣勤材望兼著誠明發於事業識慮可以詢謀而召自外􅀖叅于宰府朕志所定其何可移夫任之重者憂實深遇之隆者報亦厚讓而後受雖敦難進而可嘉知無不為其一乃心而圖效所讓冝不允仍斷來章賜寧逺軍節度使張茂實進謝恩馬一無四字詔十月二十日勑茂實省所進奉謝恩賜公使并月俸及牌印到任馬共八疋事具悉卿出守蕃宣冝優禄給詔條方布受署有􅀄印綬為榮古人所重載披貢謝深用歎嘉故茲詔示想冝知悉賜新授龍神衛四廂都指揮使英州團練使郝質勑書十月二十日勑郝質省所進奉謝恩授龍神衛四廂都指揮使英州團練使并賜公使月俸馬共二疋事具悉朕嘉汝有忠勇之材遂膺選擢豐汝以廪賜之厚實示眷懷貢奉所陳勤誠巳著功名可勉後效其思故茲示諭想冝知悉賜尚書工部侍郎余靖詔十月二十日蠢爾蠻蜒驚于海隅卿起自家居首宣勤力至於大兵之後撫彼凋殘餘孽未平推吾恩信􅀉任實深於委遇寵章冝有於便蕃遽閱貢輸良増嘉歎撫問江南東西路臣寮口宣十月二十三日卿汝等並以材賢一作賢材出分􅀉任荐更歳月僃著勞􅀎冝示撫存以彰眷遇撫問鄜延路臣寮口宣十月二十六日卿汝等並膺柬􅀉綽著才猷顧邊圉之肅然嘉王事之勤止屬茲寒沍冝示撫存雄州撫問契丹賀正旦兩蕃人使口宣十一月九日卿等夙將瑞節方戒疆亭奉隣聘以申歡慶歳端之資始載惟跋履冝示撫存景福殿庫開啓冬節道􅂣齋文十一月十二日伏以國財豐衍資民力以為先禁宇深嚴邇天居而甚邃式戒一陽之􅀱俾修衆善之因誦貝葉一作牒之遺文集金園之淨侣庻延梵福用副精􅂨軍器庫開啓冬節道􅂣齋文十一月十二日伏以儲戎器以戒不虞敢忘武僃肇新陽而集多福爰屇令辰俾法侣之精䖍修勝因之妙善仰瞻毫相載繹真文冀昭鑒之甫回契偃兵之盛際舒州靈仙觀開啓上元節道􅂣青詞十一月十五日伏以萬物熈春肇新陽於首歳三元紀序標令節於真經爰即靈􅂣俾遵科式薦雖陳於菲薄誠巳逹於精明伏願穹昊垂休紫清降鑒􅀖家錫慶永叶於泰寜民物遂生並臻於和樂恩州賜契丹皇太后賀正旦人使茶藥口宣同日卿等載飭軺車方凝寒律乃顧道塗之役深嘉䟦履之勞冝有頒宣式彰眷遇恩州賜契丹皇帝賀正旦人使茶藥口宣同日卿等繼修􅀖好來及王春方凝凛之在辰念勤劬而將事聊頒飲劑式助宣調皇帝本命兖州會真宫等處開啓道􅂣青詞十一月二十一日伏以荷三靈之乃眷􅀗奉寳圖隆萬壽於無疆遐資道䕃爰薦精􅂨之禱及茲元命之辰伏願誠潔上通真靈甫鑒如松之茂永固於延長一物雖微並均於貺施醴泉觀真君殿開啓年交道􅂣青詞十一月二十四日伏以元氣均調運三正而並用歳功肇序謹五始之惟􅀄爰敞福庭一作廬恭陳淨醮伏冀精􅂨上逹靈鑒甫回却凝隂伏沴之餘順和氣發生之造旁霑庻物並集多休豈惟眇沖膺此純嘏添修開先殿􅀕告土地祝文十一月二十七日伏以神遊所格祕寢有嚴役事時興方勤於締葺后一作神祇安靜頗懼於震驚菲薦式陳明靈昭鑒恩州賜契丹皇太后賀正旦大使茶藥詔十一月十五日勑卿夙將信幣來慶王春載惟渉履之勤方示眷懷之意錫茲良物以輔至和今差入内内侍省内侍殿頭張昭化往恩州賜卿茶藥具如别録至可領也故茲詔示想冝知悉冬寒卿比平安好遣書指不多及恩州賜契丹皇太后賀正旦副使茶藥詔十一月十五日卿輶車載飭方講於隣歡歳序將回式凝於寒律載懷衝渉冝有頒宣恩州賜契丹皇帝賀正旦大使茶藥詔十一月十五日卿修南北之歡會期於首歳勤夙宵之役方及於半塗彌切眷懷冝加寵錫恩州賜契丹皇帝賀正旦副使茶藥詔十一月十五日卿使介選才以逹欣歡之意道塗將命冝伸慰勞之恩式示頒宣俾茲調護兖州會真宫等處開啓上元節青詞十二月十五日伏以萬物資生肇新於陽月三元紀節式按於仙經爰欵殊庭恭陳淨醮薦精誠而交感企真馭以来臨冀集靈休下均羣品二十四日就驛賜契丹賀正旦人使銀䤬鑼唾盂盂子錦􅀍褥口宣十二月十五日卿等繼講隣歡會期元日載嘉勤敏渉此凝嚴用示頒宣俾彰眷待正月一日入賀畢就驛賜酒果口宣十二月二十五日卿等方柅聘車即安賔舘屬此春陽之煦冝多宴衎之歡寵錫有加眷懷増厚今月三十日賜契丹賀正旦人使内中酒果口宣十二月二十五日卿等式修􅀖聘来會春朝方休道路之勤冝有宴私之惠聊頒甘實以侑清罇正月三日就驛賜契丹賀正旦人使内中酒果口宣十二月二十五日卿等聘儀交舉欣入見於彤墀籩品有加俾示􅄌於宴席用伸頒賚冝體便蕃賜契丹人使春幡春盤法酒口宣十二月二十五日卿等並驅使傳来及王正􅀄陽式應於新春令節俾修於故事冝加頒賚用示眷懷内中福寧殿開啓三長月祝聖壽道􅂣青詞伏以真遊飈歘祕殿邃嚴惟首月之正時叶新陽而布慶俾陳法供仰薦明誠伏冀敷祐眇躬保千齡而永固躋民壽域均萬國以同休萬壽觀齋殿内權奉安真宗皇帝御容祝文十二月二十五日伏以齋室潔嚴睟容清穆㳙辰叶吉具禮有儀冀真馭之妥安符孝心之䖍奉東太一宫開啓祝聖壽年交金籙道􅂣宻詞十二月十日伏以積隂窮􅀱始變於三陽庻物更一作交新冝均於百福是陳法供載肅嚴祠延真馭以來臨冀明靈之洞鑒眇沖集佑期萬壽之無疆遐邇同休俾兆民之咸頼班荆館賜契丹賀正旦人使到闕酒果口宣卿等夙戒軺軒荐修信好顧凝嚴之在􅀱冝宴錫以申恩頒以甘新彰予眷遇班荆館賜契丹賀正旦兩番人使到闕御筵口宣卿等載馳隣聘來及歳元深惟道路之勤方戒郊圻之近特頒宴勞以示眷懷春帖子詞二十首十二月二十九日皇帝閤六首其一萌牙資暖律養育本仁心顧彼蒼生意安知帝力深其二陽進升君子隂消退小人聖君南靣治布政一作敎法新春其三氣候三陽始勾萌萬物新雷聲􅀄發號天下巳知春其四玉琯氣来􅁅巳動東郊風至暁先迎乾坤有信如符契草木無知但發生其五朝雲藹藹弄春暉萬木欣欣暖尚微造化未嘗私一物各隨妍醜自芳菲其六熈熈人物樂春臺風送春從天上來玉輦經年不遊幸上林花好莫爭開皇后閤五首其一御水冰銷緑宫梅雪壓香新年賀交一作康泰白日漸舒長其二藹藹珠簾日溶溶碧瓦煙漪漣采荇水和暖浴􅁞天其三􅀄欣綵勝迎春早巳覺雞人報漏遲風色結寒猶料峭天光喣物巳融恰其四鸎寒未報宫花發風暖還催臘雪銷欲識春来自何處先從天上斗回杓其五三辰明潤琁璣運四氣均調玉燭光共喜新年獻椒酒惟將萬壽祝君王温成皇后閤四首其一璅一作鏁窻珠戸暖生煙不覺新春換故年衆卉爭妍競時態却尋遺跡獨依然其二寳奩香歇掩鉛華舊閤春歸老監嗟畫棟重来當日鷰玉欄猶發去年花其三椒壁輕寒轉暁暉珠簾不動暖風微可憐春色来依舊惟有餘香散不歸其四内助從来上所嘉新春不忍見新花君王念舊憐遺族常使無權保厥家夫人閤五首其一太史頒時令農家􅀱土牛青林自花發黄屋為民憂其二元㑹千官集新春萬物同測圭知日永占歳喜時豐其三黄金未變千絲栁白日􅀄遲百刻香聖主本無聲色惑宫花不用妬新粧其四微風池沼輕澌􅃞旭日樓臺瑞藹一作靄浮四海懽聲歌帝澤萬家春色滿皇州其五玉殿籖聲玉漏催綵花金勝巧先裁宿雲容與朝暉麗共喜春隨曙色來萬壽觀告遷真宗皇帝御容祝文伏以宗廟之禮是為典彞衣冠以遊實有故事載嚴寳構以奉威靈㳙吉日以有􅀄庻真馭之斯格萬壽觀造温成皇后相儀祝文十二月二十九日式營叢構俾俟靈遊顧落成之有􅀄惟筮日而斯吉冀茲往宅庻以即安皇帝回謝契丹皇帝書九月日兄大宋皇帝致書于弟大契丹聦文聖武英略神功睿哲仁孝皇帝闕下使軺云止惠問見貽且承累歳而來荐有西師之舉討其不服􅀄煩剪伐之謀全以舊恩終示含容之度慶武戈之遂息分軍􅀗以為儀言諭斯勤欣銘併集方凝寒律冀保沖􅁭企詠之誠指陳奚旣續遣使人咨謝次今忠正軍節度使檢校太尉同中書門下平章事蕭徳等回專奉書陳謝不宣白皇帝回謝契丹皇太后書九月日姪大宋皇帝謹致書于嬸大契丹儀天體道至仁廣徳􅄌順章聖皇太后闕下隣􅀖敦睦結信好以彌深使聘申歡承諭言而甚厚固壽齡之遐福欣帖泰之休期加侑幣以惟豐積感悰而増切秋商在􅀱嗇履惟和今忠正軍節度使檢校太尉同中書門下平章事蕭徳等回專奉書陳謝不宣謹白内制集卷第一内制序取怒怒一作怨至和元年九月皇帝本命青詞寳祚此上一有伏以二字温成閤春帖子故年一作舊年老監一作阿監外制集卷第一歐陽文忠公集七十九制􅃙五十首勸農􅃙􅃙朕惟德之不明而至於用武久興師旅重困􅀺元有閔民愛物一作農之心誰能副予意者有信賞必罰之令今將舉而行之朕言有條其聽無忽夫農天下之本也凡為國者莫不務焉要在節其用則易充勉其力使不匱今夫食者甚衆而輸者巳殫勸之不勤而取之仰足使民盡耕猶不給而半為游墯之手使􅀊常熟猶􅂲乏而多罹水旱之凶調歛不得巳也而吏之不仁一作明者縁以誅求賦􅃥自有法也而政之不明者重為煩費農者有㡬害者若兹欲寛吾民何可得也既富而教豈無術乎體予兹懷望爾良吏自今在官有能興水利闢田荒一作荒田課農桑增戸口凡有利一有於字農而弗一作不擾者有司具爲一作其賞格當議旌酬其或陂池不修田野不闢桑􅀥不植户口流亡慢政隳官亦行降黜夫言而不信法㢮於寛朕久患之方思革弊爾毋猶習舊態慢我新書此匪虛名必期責實凡爲條約告爾既明賞吾不欺罰爾無悔頒貢舉條制􅃙元有詳定貢舉條制状在此􅃙前今移入奏議第七卷􅃙夫儒者通乎天地人之理而兼明古今治亂之原可謂愽矣然學者不得騁其說而有司務先聲病章句以牽拘之則吾豪儁竒偉之士何以奮焉有純明朴茂之羙而無斆學養成之法其飭身勵節者使與不肖之人雜而並進則夫懿德敏行之賢何以見焉此士人一作取士之甚弊而學者自以爲患議者屢以為言朕慎於改更比令詳酌一作朕於更改之令比詳酌焉仍詔􅈗府加之叅定皆以謂本學校以教之然後可求其行實先策論則辨理者得盡其說簡程式一作試則閎博者可見其材至於經術之家稍増新制兼行舊式以勉中人其煩法細文一皆罷去明其賞罰俾各勸焉如此則待士之意周取人之道廣夫遇人以薄者不可責其厚今朕建學興善以尊子大夫之行而更制革弊以盡學者之材予於教育之方勤亦至矣有司其務嚴訓道精察舉以稱朕意學者其思進德脩業而無失其時凡所科條可一作以爲永制一作式皇叔荆王元儼可贈徐兖二州牧追封燕王加天策上將軍制􅃙朕􅀒荷先業懼德不明實頼宗藩以屏王室今其亡也何痛如之故皇叔荆南淮南節度大使守太師尚書令兼中書令行荆州􅀭州牧荆王先皇帝之弟而朕之諸父於屬為尊荆淮之節於鎮為重太師三公尚書中書令皆一品於官為崇於爵為貴而王皆享一作兼之克有令德貴而能去其驕冨而能守以約名重天下聞于四夷自遘疾以来醫禱備至朕甞臨省親為煮藥賜賚之物謙而不受話言猶在邈可想焉噫享年六十不謂不壽天之五福不曰不全而朕之所以悼嘆之至深者上遵先帝友于之仁而下示朕孝思之至也故詔有司擇位號之􅀹尊羙者以追榮之而稱朕意焉夫名載册書而不朽澤流子孫而亡窮䰟而有知膺我休命可特贈天策上將軍依舊荆南淮南節度大使守太師尚書令兼中書令行荆州牧仍加兖州徐州牧追封燕王堂後官李元方可大理寺丞制勑李元方丞相府天下政本也吾任於相者既重則爲之選吏也亦艱賞勞勸能皆有優典以爾給事玆久其勤益著慎不漏泄謹無過差用爾􅀊成俾丞卿寺勉圖後效無玷寵榮可祠部員外郎直集賢院兩浙轉運按察使王琪可就轉刑部員外郎制􅃙具官王琪以儒學立于朝而甞好言天下之利今二浙之廣生齒衆而物産繁誠可以效汝之材幹予之蠱今有司申考績之舊文乃敘􅁶之常法爾其能使吾民不勞而􅀖用給足去吏之貪愚者毋害于州縣舉士之材能者不遺其寒俊厥效苟著信賞豈稽徃其勉哉以率爾職可國子博士陳淑祕書丞薛仲簡尹源太子中舍李隨大理評事朱壽昌磨勘改官制􅃙國家考課之格敘進有常所以示為法之均平而防有司之輕重也及其弊也賢愚並進而功過不明屬者命考舊文稍更新制不專累日以爲限間湏善舉而後遷夫選之艱則材者出賞之當則能者勸焉此予之意也今汝等雖以滿􅀊增秩而皆敏材可稱尚有爾知以應新法可前光禄寺丞王簡言復舊官制􅃙夫王者之有赦所以閔訓道之一無此字不純而愚民之䧟焉者開其自新之路誘於改過之善而巳然前世議者莫不以數赦爲患得非人之無良以赦爲幸者歟具官王簡言服于朝倫嚮以罪廢屢經肆眚冝與滌瑕夫過不可以貳赦不可以幸惟勉爾力以贖前羞可登州黄縣尉五字一作主簿東方辛可宻州司士叅軍制􅃙具官東方辛朕以信示天下而以祿報有功今爾辛縁死事而命于官然按察者糺失職而来有請按察吾所詔也不從則不自信念功吾所急也不報則無所勸焉是用易爾散秩優爾俸禄免爾吏責俾爾自安庻㡬使吾信賞並行而不失可華州鄭縣尉程炎可泗一作同州録事叅軍京兆府興平縣尉吕定可鳳翔府左司理叅軍制􅃙自兵興以来盗賊頗衆屢明信賞思以勸能具官程炎等各以敏材試于一尉今有司上爾所􅀗應于賞格聊兹甄録以嘉勤勞夫量功而賞大小異冝勉爾自圖余無所愛可大理評事張子庚可大理寺丞制􅃙具官張子庚徃臨邑政一作事近在王畿當夫賦􅃥方繁而盗賊並起凡諸州縣之吏能不失職而免於咎者盖亦鮮焉一作矣爾考績有司法當進秩能守厥職是亦可嘉遷爾卿丞勉終縣治可舒州推官吕選可大理寺丞制􅃙具官吕選國家設官之法由保薦而遷者必試之縣政非惟質舉者之信否亦以慎臨民之選焉以爾久服官勤今由材舉徃服新命將觀汝能可殿中丞郭及大理寺丞魯有立太常寺太祝張昭度等磨勘改官制勑具官郭及等朕患考績之不明而使無聞者累久而幸遷有善者混淆而莫别故申新法不專以日月敘秩而間湏保任之舉一作任保之限非以一有節字抑人之進而所以求能者焉汝等無謂今由積日而得次升尚勤後圖以俟知者可東頭供奉官桑逵可内殿崇班制先因過犯挌磨勘一年今及四年除授勑具官桑逵國家命官之術必量功過之分計􅀊時之勤以爲陞黜法在有司其平不欺其信不渝以爾嚮因事累格其㑹課今日月及矣考績者以時來上還汝所當得者示我不汝忘焉可環州石昌鎮熟戸牛家族廵檢奴訛男萬訛可本族都軍主制勑萬訛世捍􅁁陲繼生材武能以威信服其部人今爾父以疾而告休俾爾承家而濟美夫忠孝之節不徒守其先業而巳亦以奮功名而圖冨貴焉可審官院令史馬登可遂州司戸叅軍充職制勑馬登百司丞史皆有入官之格不惟賞其勞所以勸能者而謹其無過也惟勤與慎可不勉焉可西京左藏庫使内侍省内侍押班任守信可遥郡刺史依舊鄜延路駐泊兵馬鈐轄制勑國家自靈夏不賔􅁁隅多警議者率以謂用兵之道任將冝專恩信不久一作明則無以得士心一無此字山川不習則不可圖勝筭頃一無二字自兵宿于野久而無功此殆將帥數易之患也苟其能者無遽奪焉以具官任守信選以敏材臨于戎事肅軍捍冦宣力有聞遽以飛章自言滿􅀊顧久親於矢石豈不念於勤勞然而士卒之樂既汝安夷狄之情惟汝熟雖欲代汝實難其人所冝旌以郡章仍臨舊部體兹委􅀉服我茂恩可開封府兵曹叅軍謝曄可大理寺丞制勑具官謝曄府􅁺之制凡再􅀊而無過失者皆得例遷盖以京師大衆之㑹獄訟􅀹多能無過焉是亦材也今考爾􅀊月法當進秩夫官能有守卑者􅀹難事之寔繁勤則克一作惟勤則濟勉服明訓徃膺寵章可虞部員外郎盧士宏一作閎太常博士王揆祠部員外郎祕閣校理張瓌丁憂服闋復舊官制勑具官張瓌等夫孝子之於其親也無所不至焉生則養之以禄殁則榮之以名爾等自丁家艱克盡孝道天時屢變禮制以終勉思􅀭名無墜厥世可比部員外郎趙宗古謝􅄛屯田員外郎李琪一作祺祕書丞劉元瑜殿中丞馬伸磨勘改官制勑具官謝􅄛等自兵興以來天下重困盗賊並起獄訟繁多為州縣者不亦勞乎夫飢寒者未能衣食而調歛者未能盡除惟處之有方則民不甚弊頼夫勤敏乃克濟焉爾等咸以吏材􅀉予民政録勞考課冝有茂恩可前磁州録事一作司理叅軍杜鈛一作􅃏可衛尉寺丞制勑朕撫有萬國而官羣材不敢專用獨見之明而外詔庻寮各舉其善具官杜鈛舉者言爾材堪親民是用升汝司衛之丞而將用汝臨人於治詩云豈弟君子民之父母蓋夫善爲政者能使其民愛之如此汝能以此親我民乎徃膺進秩之榮無爲舉者之累可前杭州司理叅軍范衮可衛尉寺丞充堂後官制勑朕觀兩漢名臣多或出於丞史小吏非夫丞史之能出名臣也乃知古雖吏屬亦必選用賢材焉一有況字今中書丞相之職比古公府曹􅁺之制吏員巳爲簡闕欲任其事豈不擇人故詔銓衡俾其慎選具官范衮有司來上以爾爲一作有材進爾諸丞徃率乃職古人可慕無自怠焉可將作監主簿程中行制勑程中行夫㢘耻道缺而貪冒成俗風化之薄乆矣吾思有以勵焉故於致仕之制特示推恩之優厚廪給以家居官子孫而世及今爾父至服勞在官以老得謝冝兹懋賞以示寵榮汝尚勗哉無忘濟美可祠部郎中沈周可開封府判官制勑具官沈周夫刑獄以禁􅁀而託獄足以爲姧法令以止亂而舞法反以滋害平民者政而敗政者吏也知政之術繩吏爲先況乎京師號稱繁劇凡治繁者貴一作尚乎不勞茍知其方在得於要擿姦急吏此非要歟以爾久列周行屢經任使通於政事俾佐浩穰告汝政弊之多端訓汝治煩之有術善思乃職無或廢官可絳州防禦判官張銳衛州軍事推官汲熈載可大理寺丞制勑具官張銳等以爾由學飭身試材于吏服勞既久薦者屢聞有邇臣之亟稱加所司之考實推恩進秩其慎若斯豈不勉哉無回汝守可供備庫副使王道卿一作清臣可西京左藏庫副使制朕觀春秋之際公侯卿大夫之譜至數十世而不絶不徒世其禄爾惟克劭者乃不隕焉近至于唐將相之後能以勲名自繼其家者亦衆秉筆者記之號稱衣冠盛事噫古之大族多良子孫而今獨鮮耶抑惟人之勉不勉爾惟汝大臣之子世爲名家豈不勵焉無俾自墜有司積日兹乃敘進不次之賞能者得之汝其勉哉無忽而怠可前彰信軍節度判官禇式可太子中舍致仕制勑具官禇式昨按察者言爾事一無此字有迹而爾方以老自一無此字請吾屈言者不究而進爾以秩全爾之歸吾之欲成人之羙而不欲成人之惡如此汝其休矣知我之仁可祠部員外郎崔嶧男庻可試祕書省校書郎一作試監簿制勑崔嶧男庻古稱不學者之於事譬夫立而面墻與其敗政而干官孰若勸教之明而養之有素也屬者故勑有司増定䕃補之格必由試藝乃得涖官夫不惟爲國造士是乃爲臣立家此予一作其詔也汝其勉之可梓潼縣主簿宋文質可國子監丞致仕制勑具官宋文質壯也服勞晚而登仕老能知止意亦可嘉吾有躋民仁壽之心爾其歸安田里之養可駕部員外郎席夷甫可本官致仕制勑具官席夷甫古者七十而得謝所以優其臣也不任以事而養之于家所以愛老也朕患㢘耻之缺而􅀹嘉止足之人隆長老之恩而欲興孝弟之俗今爾之請朕所襃焉已詔有司錄爾之子克安眉壽徃服寵章南劒州司理叅軍李孝友責授吉州叅軍制勑具官李孝友不孝之罪國有常刑民愚無知犯者猶鮮況爾􅀍儒服者誦習六經而背本忘親悖理傷化雖屢經赦宥法欲貸汝而汝之自視夫亦何顔冝屏逺方絶而不齒江南路提刑内殿承制柴貽慶可就轉禮賔副使制勑具官柴貽慶傳曰夫刑者一成而不變又曰法者天下之至平庻獄之間其可不慎故於國制􅀹重􅀖刑擇彼監司必叅文武所以藉其材敏而佐夫不逮者也惟爾克守其職能濟以勤有司質成法應敘進故增榮秩無替前勞可右侍禁樂天錫可率府率致仕制勑具官樂天錫服勞兹久因疾得衰雖未及於引年嘉自能於知止俾進春宫之率以為歸老之榮可大理寺丞􅀽穆許恢授殿中丞著作佐郎程適授祕書丞制並磨勘改官勑具官程適等國家治民之要其具素備惟奉法守職而免於有過者考其積日皆得敘遷苟有能稱豈無懋賞爾等􅀉予民政咸上􅀊成俾登于朝盖用常典若夫異績在爾勉焉可皇姪仲伉贈官制勑具官仲伉朕上慿宗社之靈克荷先帝之業思治天下以孝而親九族以仁今宗正言爾信安郡王之長孫也不幸早世而追榮之典尚未有稱朕聞于聽一作聞于朕聽意甚悼焉可秦州推官董彞可太子中舍致仕制勑具官董彞朕嚮遣韓􅄾行視􅁁鄙所以宣上恩而下逮撫下情而上通也今􅄾言爾有勤未録乆疾自淹夫人之有勞吾豈不念事或一作有在逺患於不聞既披奏章冝示寵典可劒州司理參軍董壽可大理寺丞制勑具官董壽夫法者所以禁民爲非而使其遷善逺罪也然世之專於法者不患於不通而患於刻薄豈夫一無此字學者之弊歟今爾以學法入官而有能二字一作復􅀍薦以一作施之臨事可不戒哉徃服明恩冝慎汝習可兵部郎中皇甫泌男偁可將作監主簿制勑具官皇甫泌男偁椊潼去京三千里外而東蜀一都㑹也吾難其選知泌爲材而乃以家爲言請任其子俾榮初仕仍便其私庻乎泌無内顧之憂而得盡心於事則汝之幹蠱可不勉哉可東頭供奉官閤門祗候知勝關寨李守信可就轉内殿崇班儀州寨主制勑具官李守信西師之出累年而將帥之效未著凡爲吾扞城而乗障者不亦久一有於字勞乎迹其勤誠冝有陞進若夫異賞俟爾立功和州防禦判官夏侯溥可太子中舍致仕制勑具官夏侯溥古者王道之隆也使夫種樹畜養皆不失其時然後衣帛食肉而老者得以安之今夫致仕而歸者必増其榮秩而又廪給于其一無此字家者所以慮夫田野一作里之間養老之具未備而有以優其終身焉爾其徃哉服我新命可都官員外郎知成州王嘉聞轉職方員外郎殿中丞知普州􅁑昌一作商轉國子博士某官監洺州鹽酒稅李思㳟轉駕部員外郎制並磨勘改官勑具官王嘉聞等夫士之學古干禄而陳力涖官者孰不欲自為材耶患乎勸之勵之四字一作勸賞砥礪無方而使賢能之不勉也一無此字此朕所以思革審官之法近増舉􅀋之科爾等猶用舊文例當升秩其思率職無懈厥勤俟乎有聞以應新格可東頭供奉官張德榮張行簡可率府率致仕制勑具官張行簡等陳力有年服勞匪怠止足之戒乃能自知終始之恩亦以示勸衛率之長東宫要官享兹榮名可以休老可虞部員外郎吕師簡可比部員外郎制爲招軍勑具官吕師簡國家嚮因募兵特立賞格俾勸勤者速於集事而議者皆患應募之卒雖多而難用豈夫訓練之未至將由簡閱之不精然而號令重於巳行賞罰貴乎存信今有司按籍言爾當遷徃服新恩其思實効可悉利族軍主嗟移可都軍主制爲功效勑嗟移夫賊壘未平王師在野當吾聞鼓鼙思將帥之際是汝立功名取冨貴之時而能率其部人力捍狂冦材武忠勇是皆可嘉爵秩階勲兹以為寵猶有異賞爾其圖之可東上閤門使普州刺史趙安期可右領軍衛大將軍致仕制勑具官趙安期夫陳力就列不能者止而致仕之制非爲止者而設乃古所以禮其卿大夫之羙名也而今又有増官秩頒廪給之數於爾之止一作爾之知止豈不爲優爾其歸哉可以榮矣可供備庫副使沿􅁁廵檢都監王守一可就轉西京左藏庫副使制勑具官王守一臨于軍政邈彼塞垣訓齊甲兵謹備冦盗爾其勤一作謹職吾不忘勞􅃴因奏課之來冝舉陟明之典可貝州歷亭縣主簿周登可國子監丞致仕制勑具官周登方剛而仕以疾思歸自陳不能可謂知止有官以為汝寵有俸以終汝身體予深仁一作恩膺此嘉命可進納長馬空名誥海詞勑某人等國家以用師西鄙不欲加賦於人乃能出爾家貲佐吾􅀖用第其多少咸有一作可旌酬俾綴官聮以榮里閈可潁州推官江楫可大理寺丞制勑具官江楫朕思與多士共寧庻􅀖而賢豪材羙之人或自沉於幽逺與夫懿節茂行之韞于中而未見於一作于事者吾皆不得而徧觀焉故以舉􅀋之科而爲官人之法今舉者言爾材行可稱命爾新恩以期後効可廣南西路轉運按察使金部員外郎周陵可司勲員外郎就差充荆湖南路轉運按察使制勑具官周陵朕顧荆楚之俗雜於諸蠻而嚮者州縣之間不能綏輯與民生患曠日未平夫惟蠻貊一作夷雖不通於禮義而剽輕之性惟信一作徳可懷獷悍之心以威則服思擇能者僉曰汝材至於察官吏之否臧平賦輸一作稅而移用廣西之最朕巳嘉焉今其諭我至仁曉兹異一作暴俗並伸威信以靜一方仍遷郎署之榮以増使車之重可外制集卷第一外制集序聖賢相遭遭一作逢皇叔荆王制行荆州此下脫牧字陳淑等改官制一本作國子博士通判澧州陳淑可虞部貟外郎柴貽慶制貽慶一作貽憲秦州推官董彞制董彞一作黄彞趙安期制可以一作亦可以王守一制􅆓􅁁巡檢都監六字上一有儀州二字外集卷第一歐陽文忠公集五十一樂府擬玉臺體七首欲眠行人夜已斷明河南陌頭􅀟璫不擬解更欲要君留携手曲落日堤上行獨歌携手曲却憶携手人處處春華緑雨中歸朝㸔樓上雲日暮城南雨路逺香車遲迢迢向何所别後連環結連帶贈君情不忘暫别莫言易一夕九回腸夜夜曲浮雲吐明月流影玉堦隂千里雖共照安知夜夜心落日䆫中坐朝聞驚禽去日暮見禽歸瑶琴坐不理含情復爲一作與誰領邊繡􅀟鴛刺繡領粲爛五文章暫近巳復逺猶持歌扇障古詩一七交七首河南府張推官尭夫大雅哲禀徳實温粹霜筠秀含潤玉海湛無際平明坐大府官事盈案几髙談遣放紛外物不能累非惟席上珍乃是青雲器尹書記師魯天下才神鋒凛豪儁逸驥臥秋􅇫意在騤騤迅平居弄翰墨揮洒不停瞬談􅀏帝王略驅馳古今論良工正求玉片石胡爲韞楊户曹子聦江山禀弱􅀊擅竒譽盱衡恣文辯落筆妙言語胡爲冉冉趨三十滯公府美璞思善價浮雲有夷路大雅惡速成俟命冝希古梅主簿聖俞翹楚才乃是東南秀玉山髙岑岑映我􅁴形陋離騷喻草香詩人識鳥獸城中爭擁􅈹欲學不能就平日禮文賢寧乆滯奔走張判官洛城車隆隆曉門爭道入連􅃑紛如帷文者豈無十壯矣張太素拂羽擇其集逺慕鄴才子一􅀏懽相挹雖有軒與冕攀翔莫能及人將孰君子盍視其遊執王秀才幾道顔之徒沈深務覃聖采藻薦良璧文潤相輝映入市羊駕車談道犀爲柄時時一文出往往􅁓價盛無爲戀丘樊遂滯蒲輪聘自叙余本漫浪者兹亦漫爲官胡然􅀋鴟夷託載隨車轅時士不俛眉黙黙誰與言賴有洛中俊日許相躋攀飲徳醉醇酎襲馨佩春蘭平時罷軍檄文酒聊相歡答楊闢一作子靜喜一作祈雨長句吾聞隂陽在天地升降上下無時窮環回不得不差失所以􅀊時無常豐古之爲政知若此均節収歛勤人功三年必有一年食九􅀊一作年常備三􅀊一作年凶縱令水旱或一作忽時遇以多􅀘少能相通今者吏愚不善政民亦游惰離於農軍國賦歛急星火兼并奉養過王公終年之耕幸一熟聚而耗者多於蠭是以比􅀊屢一作累登稔然而民室常虚空遂令一時暫一作遭不雨輒以困急號天翁一作公賴天閔民不責吏甘澤一作澍流布何其濃農當勉力吏當愧敢不酌酒澆神龍嵩山十二首公路澗驅馬渡寒流斷澗橫荒堡槎危欲欹岸花落多依草擊汰翫游鯈倒影看飛鳥留連愛芳杜漸下四峯照拜馬澗昔聞王子晉把袂浮丘仙金駿於此墮吹笙不復還玉蹄無迹乆澗草但荒煙二室道二室對岧嶤群峯聳崷直雲隨髙下起路轉參差碧春晚桂叢深日下山煙白芝英巳可茹悠然想泉石自峻極中院歩登太室中峯繫馬青松隂躡屣蒼崖路驚鳥動林花空山答人語雲霞不可􅄃直入􅁳􅁳霧玉女䆫玉女不可邀蒼崖鬱岧直石乳滴空竇仰見泬寥碧徙􅀝難乆留桂樹含春色玉女擣衣石玉女擣仙衣夜下青松嶺山深風露寒月杵遥相應靈蹤杳可尋片石秋光瑩天門石徑方盤紆􅀟峯忽中斷呀豁青􅁳間畜泄煙雲亂杉蘿試舉手自可階天漢天門泉舊號救命泉惡其名鄙因取美名書為續命泉人書一字立于泉側煙霞天門深靈泉吐巖側雲濕顥氣寒石老林􅃾碧長松暫休坐一酌煩心滌天池髙歩登天池靈源湛然吐俯窺不可見淵黙神龍護靜夜天一作松籟寒􅀫客疑風雨三醉石三醉石在八仙壇上南臨巨崖峯岫迤邐蒼煙白雲鬰鬰在下物外之適相與酣酌坐石欹醉似非人間因索筆目梅聖俞書三醉字於石上而三人者又各題其姓名而刻之拂石登古壇曠懷聊共醉雲霞伴酣樂忽在千峯外坐乆還自醒日落松聲起峻極寺路入石門見蒼蒼深靄間雲生石砌潤木老天風寒客來依返照徙􅀝聼山蟬中峯望望不可到行行何屈盤一逕林杪出千巖雲下看煙嵐半明滅落照在峯端􅀄秋普明寺竹林小飲餞梅聖俞分韻得亭臯木葉下五首臨水復欹石陶然同醉醒山霞坐未歛池月來亭亭洛城風日美秋色滿蘅皐誰同茂林下掃葉酌松醪野水竹間清秋山酒中緑送子此酣歌淮南應落木勸客芙蓉盃欲搴芙蓉葉垂楊礙行舟演􅃞回輕檝山水口已佳登臨同上下衰蘭尚可採欲贈離居者和謝學士泛伊川浩然無歸意因詠劉長卿佳句作欲留篇之什乆不見南山依然已秋色悠㢤川上行復邀城中客木落山半空川明潦􅀹積飛鳥鑑中看行雲舟中白夷猶白蘋裏􅀏傲清風側極浦追所逺回峯髙易夕觴詠共留連髙懷追昔賢惟應謝公興不減向臨川戯書拜呈學士三丈淵明本嗜酒一錢常不持人邀輒就飲酩酊籃輿歸歸來歩三徑索寞繞東籬詠句把黄菊望門逢白衣欣然復坐酌獨醉臥斜暉和楊子聦答聖俞月夜見􅀉秋露藹已繁迢迢星漢回皎潔庭際月流光依井苔有客愛涼景幽軒爲君開所思不可極但慰清風來謝人􅀉􅀟桂樹子有客賞芳叢移根自幽谷爲懷山中􅃐愛此嵓下緑午眠背清隂露坐䕃髙蓋東城桃李月車馬傾闤闠而我不出門依然伴憔悴榮華不隨時寂寞幸相慰君子固有常小人多變態緑竹堂獨飲夏篁解籜隂加樛卧齋公退無喧囂清和況復值佳月翠樹好鳥鳴咬咬芳罇有酒美可酌胡爲欲飲先長謡人生暫别客秦楚尚欲泣涙相攀邀况兹一訣乃永巳獨使幽夢恨蓬蒿憶予驅馬别家去去時柳陌東風髙楚郷留滯一千里歸來落盡李與桃殘花不共一日看東風送哭聲嗷嗷洛池不見青春色白楊但有風蕭蕭姚黃魏紫開次第不覺成恨俱零凋榴花最晚今又拆紅緑􅀧綴如裙腰年芳轉新物轉好逝者日與生期遥予生本是少年氣瑳磨牙角爭雄豪馬遷班固洎歆向下筆􅀧竄皆嘲嘈客來共坐􅀃今古紛紛落盡玉塵毛彎弓或擬射石虎又欲醉斬荆江蛟自言剛氣貯心腹何爾柔軟爲脂膏吾聞莊生善齊物平日吐論竒牙聱憂從中來不自遣強叩瓦􅇲何譊譊伊人逹者尚乃爾情之所鍾况吾曹愁填胷中若山積雖欲強飲如沃焦乃判疑自古英壯氣不有此恨如何消又聞浮屠􅀃生死滅没謂若夢幻泡前有萬古後萬世其中一世獨虭蟧安得獨洒一榻淚欲助河水増滔滔古來此事無可奈不如飲此罇中醪暇日雨後緑竹堂獨居兼簡府中諸僚新晴竹林茂日夕愛此君佳禽哢翠樹若與幽人親掃徑緑苔靜引流清􅂀分開軒見逺岫欹枕送歸雲桐槿漸秋意琴觴懷友文浩然滄洲思日厭京洛塵車􅀐方開府梁王多上賔平時罷飛檄行樂喜從軍􅀐省悼亡後漳濵多病身南䆫若可傲方事陶潛巾江上彈琴江水深無聲江雲夜不明抱琴舟上彈棲鳥林中驚遊魚爲跳躍山風助清泠境寂聽愈真絃舒心巳平用兹有道器􅀉此無景情經緯文章合諧一作調和雌雄鳴颯颯驟風雨􅂭􅂭􅀮雷霆無射變凛冽黄鍾催發生詠歌文王雅怨刺離騷經二典意澹薄三盤語丁寧琴聲雖可狀琴意誰可聽送白秀才西歸白子來自西􅄬我文與書升階揖讓席言氣温且舒萬轍走聲利獨趨仁義塗仁義荒巳乆斤鋤費耕除吾常患力寡欣子好古徒終當竭其力剗治爲通衢旗旄侍天子安駕五輅車盡驅天子疑民垂白歌其隅子其從我游有志知何如鞏縣􅀄見黃河河決三門合四水徑流萬里東輸海鞏洛之山夾而峙河來齧山作沙觜山形迤邐若奔避河益汹汹怒而詈舟師弭檝不以帆頃刻奔過不及視舞波淵旋投沙渚聚沫倐忽爲平地下窺莫測濁且深癡龍恠魚肆慿恃我生居南不識河但見禹貢書之記其言河狀鉅且猛驗河質書信皆是昔者帝堯與帝舜有子朱商不堪嗣皇天意欲開禹聖以水病堯民以潰堯愁下人痩若腊衆臣薦鯀帝曰試試之九載功不効遂殛羽山慙而斃禹羞父罪哀且勤天始以書􅂌於姒書曰五行水潤下禹得其術因而治鑿山䟽流浚畎澮分擘枝􅂀有條理萬􅀖入貢九州宅生人始免生鱗尾功深徳大夏以家施及三代蒙其利江海淮濟洎漢􅃆豈不浩渺汪而大収波卷怒畏威徳萬古不敢肆凶厲惟兹濁流不可律歷自秦漢尤爲害崩堅決壅􅀔益橫斜跳旁出惟其意制之以力不以徳驅民就溺財隨弊蓋聞河源出崑崙其山上髙大無際自髙瀉下若激箭一直一曲一千里湍雄衝急乃迸溢其􅀔不得不然爾前􅀊河怒驚滑民浸漱洋洋􅁋一作注不止滑人奔走若鋒駭河伯視之以爲戯呀呀怒口缺若門日啖薪石萬萬計明堂天子聖且神悼河不仁嗟曰喟河伯素頑不可令至誠一感惶且畏引流辟易趨故道閉口不敢煩官吏遵塗率職直東下咫尺莫可離其次爾來􅀊星行一周民牛飽芻􅀖羡費滑人居河飲河流耕河之壖浸河漬嗟河改凶作民福嗚呼明堂聖天子代書􅀉尹十一兄楊十六王三竝轡登北原分首昭陵道秋風吹行衣落日下霜草昔日憩鞏縣信馬行苦早行行過任村遂歷黃河隩登髙望河流洶洶若怒閙予生平居南但聞河浩渺停鞍暫遊目茫洋肆驚眺並河行數曲山坡亦縈繞􅑥子與山口呀險乃天􅍳秤鈎真如鈎上下欲顛倒虎牢吏當關譏問名巳告滎陽夜聞雨故人留我􅀏明朝巳髙塵輤車引旌纛傳云送主喪窀穸詣墳兆後乗皆輜軿輪轂相輝照辟易未及避廬兒已呵噭午出鄭東門下馬僕射廟中牟去鄭逺記里十餘堠抵牟日巳暮僕馬困米稾漸望閶闔門崛若中天表趨門爭道入羈鞅不及掉浪墥遊九衢風埃嘆何浩京師天下聚奔走紛擾擾但聞街鼓喧忽忽夜復曉追懷洛中俊已動思歸操爲别未期月音塵一何杳因書寫行役聊以爲君導别聖俞車馬古城隅喧喧分曉色行人念歸塗居者徒慘惻薄宦共覉旅論交喜金石薦以朋酒懽寧知􅀊月適人事坐云變出處俄乖隔關山自兹始揮􅃑舉輕䇿􅀊暮寒雲多野曠隂風積征蹄踐嚴霜别酒臨長陌應念同時人獨爲未歸客送劉秀才歸河內落日古京門車馬動行色河上多悲風山陽有歸客朽篋蠧蟲篆遺文摹鳥迹言干有司知豈顧時人識山陂􅀊始寒霰雪宻巳積還家寧乆留方言事征軛外集卷第一普明寺小飲蘅一作衡雨中獨酌烈一作冽􅀄見黄河生人一作人生奏事録歐陽文忠公集一百十九自治平二年六月十一日巳後其曰追書者乃巳前事忘其月日矣論孫長卿爲臺諫所劾事孫侍郎長卿罷環慶路緫管拜集賢院學士爲河東都轉運使臺諫交章論列長卿守邉無狀宜加降黜中書以長卿無敗事昨因朝廷起孫􅃆於致仕欲委以西事而長卿以歳滿得代無過可黜而臺諫論奏不已最後賈中丞二章六月十一日進呈上厲聲曰巳行之事何可改易臣脩奏曰臣等不爲巳行難改若朝廷果是除授不當能用臺諫之言改正足以上彰陛下從諫之聖至於臣等能不遂非而服義改過不恡聖賢所難亦是臣等好事但以長卿除授不爲過當若曲從臺官之言使彼銜􅁈受黜於理豈安故難行也韓公曰自陛下親政巳來臺諫所言施行者少外人之議謂致人主有拒諫之名者是臣等之過若其言有可行者臣等豈敢不行直以長卿無過難徇言者濫行黜罰耳上皆然之上又曰人言臺諫奪權臣脩奏曰此則爲陛下言者過也朝廷置臺諫官專爲言事若使黙然却是失職苟以言事爲奪權則臺諫無職可供矣辨蔡襄異議蔡侍郎襄自給事中三司使除禮部侍郎端明殿學士知杭州􅀄上入爲皇子中外相慶知大計巳定矣旣而稍稍傳云有異議者指蔡公爲一人及上即位始親政每語及三司事便有忿然不樂之色蔡公終以此疑懼請出旣有除命韓曾二公因爲上言蔡襄事岀於流言難以必信前世人主以疑似之嫌害及忠良者可以爲鑒也臣脩亦啓曰㦯聞蔡襄文字尚在禁中陛下曾親見之乎上曰文字即不曾見無則不可知其必無臣脩奏曰若無文字則事未可知就使陛下曾見文字猶湏更辨真僞徃時夏竦欲䧟富弼乃先令婢子學石介書字歳餘學成乃僞作介與弼書謀廢立事書未及上爲言者廉知而發之頼仁宗聖明弼得免禍至如臣自丁母憂服闋􅀄還朝時有嫉臣者乃僞撰臣一劄子言乞沙汰内官欲以激怒羣閹是時家家有本中外諠傳亦頼仁宗保全得至今日由是而言陛下曾見文字猶湏更辨真僞何況止是傳聞疑似之言何可爲信上曰官家若信傳聞蔡襄豈有此命獨對語八月十四日是日昭文與西㕔趙侍郎皆在告集賢私忌臣脩獨對崇政殿進呈文字畢歛笏將退上有所問所問不録臣脩因奏曰近聞臺諫累有文字彈奏臣不合專主濮王之議上荷陛下保全知此議非臣所得獨主臺諫文字旣悉留中言者於是稍息上曰叅政性直不避衆怨每見奏事時㦯與二相公有所異同便相折難其語更無回避亦聞臺諫論事徃徃靣折其短若似奏事時語可知人皆不喜也今後宜少戒此臣脩對曰臣以愚拙敢不如聖訓上曰水災以來是月三日言事者多云不進賢臣脩曰近年以來進賢之路太狹此誠當今之患臣每與韓􅄾等論議未合上曰何謂進賢路狹中書常所進擬者其人皆如何臣脩對曰自富弼韓􅄾當􅀦以來十數年間外自提刑轉運内則省府之􅀋選擢甚精時亦得人比於徃年絶不同也然皆錢榖刑名強幹之吏此所謂用材也如臣所言進賢之路謂館職也上曰如何臣脩曰朝廷用人之法自兩制選居兩府今學士舍入待制通謂之兩制自三館選居兩制是則三館者輔相養材之地也徃時入三館有三路今塞其二矣此臣所云太狹也上曰何謂三路臣脩曰進士髙科一路也大臣薦舉一路也因差遣例除一路也徃時進士五人巳上及第者皆入館職第一人有及第纔十年而至輔相者今第一人及第者兩任近十年方得試館職而第二人巳下無復得試是髙科一路塞矣徃時大臣薦舉隨即召試今但令上簿候館閣闕人與試而館閣人無貟數無有闕時則上簿者永無試期是薦舉一路又塞矣唯有因差遣例除者半是年勞老病之人也此臣所謂進賢之路太狹也後數日上因中書奏事遂處分令擇人試館職御藥陳承禮監造衮冕事八月先是三司奏造作諸物舊屬少府監文思院後苑作紫雲樓下近年多别置局以内臣監作各爭占工匠乞一切依舊歸于有司遂依奏旣而少府監申造衮冕内批令御藥院陳承禮監造中書覆奏上以南郊日近湏内臣庻可辦集韓曾二公奏以衝改近降指揮不若令承禮就少府監作上意未決臣脩奏曰此是陛下新降指揮從來所患朝令夕改今若依前用承禮監作只是移御藥院置局就少府監中耳如此何害集事上遂曰可内降􅀘僧官九月十九日先朝僧官有闕多因權要請謁内降􅀘人當時諫官御史累有論列先帝深悟其事因著令僧職有闕命兩街各選一人較藝而􅀘至是鑒義有闕中書已下兩街選一人未上而内臣陳承禮以寳相院僧慶輔爲請内降令與鑒義中書執奏以爲不可韓曾二公極陳其事臣脩亦奏曰􅀘一僧官當與不當至爲小事何繫利害但中書事已施行而用内降衝改先朝著令則是内臣干撓朝政此事何可啓其漸又奏曰宦女近習自前世常患難於防制今小事若蒙聽許後有大事陛下必以害政不從是初欲姑息而返成怨望不若絶之於漸此一小事陛下不以爲意而從之彼必自張於外以謂爲上親信朝政可廻在陛下目前似一閑事外邉威􅀔不小矣上遽可中書所奏令只依條例選試臣脩又奏一有曰字事旣不行彼必有言萬事只由中書官家豈得自由行一事陛下試思從私請與從公議孰爲得失而韓曾二公亦所陳甚多上皆嘉納也歐陽文忠公在政府時手録奏對語此前一本無前字五事得之林子中家文忠手録皆宻語筆札精楷蓋欲傳示後人而子職不謹身没未㡬已流落於他人家其曰追書者皆不見又未知其何在耶後三事亦子中録以相示云得之於史院曾布子宣題又三事三司使給事中蔡襄除端明殿學士尚書禮部侍郎知杭州初上自濮邸立爲皇子中外欣然無間言旣即位以服藥故慈壽垂簾聽政甞爲中書言仁宗旣立皇子因追思鄂王等悲傷涕泣宦官宫妾爭相熒惑而近臣亦有異議者可恠者一二知名人也因言執政數人不顧家族以定社稷之計而小人㡬壞大事又云近臣文字只在先帝卧床頭近日巳於焼錢爐内焚之矣然莫知爲誰也中書不敢問其姓名但唯唯而退巳而外人亦稍稍言蔡襄甞有論議而莫知虚實旣而上疾愈親政數問襄如何人一日因其請朝假上變色謂中書曰三司掌天下錢榖事務繁多而襄十日之中在假者四五何不别用人韓公已下共奏曰三司事無闕失罷之無名今更求一人材識名望過襄者亦未有脩奏曰襄母年八十餘多病況其只是請朝假不趂起居耳日髙後便却入省亦不廢事然每奏事語及三司未嘗不變色襄亦自云每見上必厲色詰責其職事其後諒祚攻劫涇原西邉日有事宜上遂督中書以邉事將興軍湏未備三司當早選人韓公等初尚揮解上意不回因奏待其陳乞可以除移初傳者多端或云上在慶寧巳聞蔡異議或云上入宫後親見奏牘尚在至是因蔡乞罷劄子韓公遂質於上上曰内中不見文字然在慶寧即已聞之韓公曰事岀藹昧若虚實未明乞更審察苟令襄以飛語獲罪則今後小人可以構害一作䧟字善人人難立矣曾公曰京師從來善造謗議一人造虚而衆人傳之便以爲實前世以疑似之言䧟害忠良者非惟臣下􅀍禍兼與􅀦家爲患脩曰陛下以爲此事果有果無上曰雖不見其文字亦不能保其必無脩曰疑似之謗不唯無迹可㝷就令迹狀分明猶湏更辨真僞只如先朝夏竦欲害富弼令其婢子學石介字體乆之學成乃僞作介爲弼撰廢立詔草頼仁宗聖明弼得保全又如臣至和末丁母憂服闋􅀄至闕下小人中有嫉忌臣者僞撰臣乞沙汰内官奏藁傳布中外家家有之内臣無不切齒只判銓得六日爲内臣楊永徳以差船事罷知同州亦頼仁宗保全未乆知其無罪遂却留住至今以此而言就令有文字猶湏更辨真僞況此無迹狀陛下幸不致疑韓曾又各進說上曰數家各有骨肉意謂異議若行則執政􅀍禍又曰造謗者因甚不及他人據此似聖意未解也仁宗旣連失襃豫鄂三王遂更無皇子自至和三年正月得疾踰時不能御殿中外憂恐旣而康復自是言者常以根本爲急交章論述每輙留中故樞宻副使包公拯今翰林學士范景仁所言尤激切其餘不爲外人所知者不可勝數今樞宻富相與昭文韓相亦屢進說雖余亦嘗因大水言之然初無采納之意如此五六年言者亦巳稍怠嘉祐六年秋余自樞庭過東府忽見内降一封乃諫官司馬光言立皇子事旣而知江州吕誨亦有䟽論述昭文與集賢曾公及余晚議來日當將上相顧以爲如何韓公曰若上稍有意即當力賛成之曾公與余偕曰此吾儕素所願也旣而明日奏事垂拱殿二章讀畢未及有所啓仁宗遽曰朕有意多時矣但未得其人余自爲校勘及在諫垣忝兩制迨此二十年每進對常極從容至此始聞仁宗自稱朕旣而又左右顧曰宗室中孰爲可韓公惶恐對曰不惟宗室不接外人臣等不知此事豈臣下敢議當出自聖擇仁宗曰宫中嘗養二子小者甚純然近不惠大者可也遂啓曰其名謂何仁宗即道今上舊名曰名某今三十􅀊矣余等遂力賛之議乃定余等將下殿又奏曰此事至大臣等未敢施行請陛下今夕更思之臣等來日取旨明日奏事崇政殿因又啓之仁宗曰決無疑也余等遂奏言事當有漸容臣等商量所除官來日再奏旣退遂議且判宗正時今上猶在濮王喪乃議起復自大將軍遥郡團練使除泰州防禦使來日將上仁宗大喜曰如此甚好二公與余又奏曰此事若行不可中止乞陛下斷在不疑仍乞自内中批岀臣等奉行仁宗曰此事豈可使婦人知只中書行可也余等喜躍稱賀時六年十月也命旣出今上再三辭避有旨候服除取㫖至七年二月一日服除今上堅卧稱疾前後十餘讓至七月韓公議曰宗正之命始出則外人皆知必爲皇子也不若遂正其名使其知愈讓而愈進示朝廷有不可回之意庻幾肯受曾公與余皆以爲然及將上今上累讓表仁宗問如何韓公未對余即前奏曰宗室自來不領職事今外人忽見不次擢此子又判宗正則天下皆知陛下將立爲皇太子也今不若遂正其名命立爲皇子縁防禦使判宗正降誥勑御名得以堅卧不受若立爲皇子只煩陛下命學士作一詔書告報天下事即定矣不由御名受不受也仁宗沈思乆之顧韓公曰如此莫亦好否韓公力賛之仁宗曰如此則湏於明堂前速了當遂降詔書立爲皇子仍更今名自議皇子事凢所奏請皆余與西㕔趙侍􅀰自書其改名劄子余所書也初擇日旁十字請仁宗􅀧之其最下一字乃今名也是仁宗親􅀧今封在中書今上自在濮邸即有賢名及遷入内良賤不及三十口行李蕭然無異寒士有書數厨而巳中外聞者相賀嘉祐八年上元京師張燈如常歳歳常以十四日上晨岀遊幸諸宫寺賜從臣飲酒留連至暮而歸遂御宣徳門與從臣㸔燈酒五行而罷是歳自正初上覺體中不佳十四日遂不晨岀至晚略幸慈孝相􅀦兩寺御端門賜從臣酒三行止自是之後雖日視朝前後殿而寖若不佳旣而韓蟲兒事稍稍傳於外云去歳臘月上閑居見一宫婢汲井有小龍纒其汲綆而出以問左右皆云不見上獨見之以爲異遂召宫婢視之乃宫正柳瑶真之私身韓蟲兒也其後柳夫人宿直閤中明日下直遣蟲兒取夜直坐墪上獨處閤中召而幸之遂有娠蟲兒自云上巳幸我取我臂上金鋜子一􅃗云爾當爲我生子以此爲驗外人所傳如此而蟲兒於宫中亦自道云上幸我有娠又言金鋜子上與􅀺伯使藏之矣􅀺伯者上所愛扶侍内臣􅀺永徳也是月二十七八間春寒微雨上不御崇政殿秖坐延和見羣臣奏事而殿中熾爐火云聖體畏風寒蓋自上臨御四十年盛暑未甞揮扇極寒未甞御火至是始見御前設爐火也自是之後上益不豫至于大漸今上即位於柩前中外帖然無一言之異唯韓蟲兒事籍籍不巳云大行甞有遺腹子誕彌當在八九月也九月十七日余以服藥請一日假家居晚傳内岀宫女三人送内侍省勘并召醫官産科十餘人坐婆三人入矣十九日入對内東門小殿簾前奏事將退太后呼黄門索韓蟲兒案示中書余等於簾前讀之見蟲兒具招虚僞事甚詳云自正月至今月水行未甞止今方行也醫官坐婆軍令狀皆云去歳臘月􅀺永徳奉使成都未還不在閤中而鋜子埋在柳夫人佛堂前閾下太后使人監蟲兒至埋所自掘之深尺餘得金鋜子一􅃗折爲三叚矣合之以比臂上者同秤之各重一兩半兩鋜重輕又同信爲是矣因以金鋜俾余等傳㸔之太后言問蟲兒何爲作此僞事云以免養孃笞捶庻日得好食耳蓋自蟲兒言有娠太后遣宫人善護之日給緍錢二千以市可食物如此至其月滿無娠始加窮詰耳余等遂前奏曰蟲兒事外巳􅁀聞今其僞迹盡露可以釋中外之疑然蟲兒當勿留庻外人必信也太后曰固當如是旣而樞宻院奏事簾前示之如前明日福寧上大行謚册罷見入内都知任守忠於廷中云蟲兒決臀杖二十送承天寺充長髪奏事録卷終第一事令其婢子婢一作妻第二事近不惠集韻慧字注云亦作惠第三事未甞止未一作亦續添辨蔡襄異議何可爲信一作何爲可信獨對語皆錢􅂖刑名皆字下一有字内降補僧官彼必有言彼下一有云字又三事甞有論議一作議論乞罷劄子罷一作出可以􅌟害善人人難立矣一作善人難立矣疊善人二字雖不見其文字不字下一有曽字况此無迹狀一作况無迹狀􅀅立爲皇太子一無太字四十年一作四十餘年中外帖然帖一作貼佛堂前閾下前一作門奏議卷第一歐陽文忠公集九十七諫院論按察官吏劄子慶暦三年臣伏見天下官吏貟數極多朝廷無由徧知其賢愚善惡審官三班吏一作二部等處又只主一作具差除月日人之能否都不可知諸路轉運使等除有贓吏自敗者臨時舉行外亦别無按察官吏之術致使年老病患者或懦弱不材者或貪殘害物者此等之人布在州縣並無黜陟因循積弊冗一作官濫者多使天下州縣不治者十有八九今兵戎未息賦役方煩百姓嗷嗷瘡痍未復捄其疾苦擇吏爲先臣今欲乞特立按察之法於内外朝官中自三丞以上至郎官中選強幹廉明者爲諸路按察使自來雖差安撫使縁管他事不專按察今請令進奏院各録一州官吏姓名爲空行簿以授之使至州縣遍見官吏其公廉才幹明著實狀及老病不才顯有不治之迹者皆以朱書於姓名之下其中才之人别無竒効亦不至曠敗者則以墨書之又有雖是常材能專長於一事亦以朱書别之使還具奏則朝廷可以坐見天下官吏賢愚善惡不遺一人然後别議黜陟之法如此足以澄清天下年歳之間可望致治只勞朝廷精選二十許人充使别無難行之事取進止論乞詔諭陜西將官一作臣劄子同前臣風聞昊賊今次人來辭意極不遜順所請之事必難盡從事旣不成則元昊必湏作過朝廷湏合先爲禦備竊慮􅆓邊將帥見西人入朝惟一作凖望通好便生懈怠萬一西賊驟出忿兵擊吾弛惰則立見敗事乞速詔邊臣宻諭與西賊辭未遜順必不通和之意各使先知絶其顧望早爲凖備庻不敗事仍慮邊將謂一作料朝廷此時議雖未合若後次更來必湏和好因此便無討賊之志仍乞便因詔諭示以激厲之言云朝廷以昊賊罪大意在討除今不許其和好者蓋以外有爾軰在邊必望破賊成功之意使其不生退心臣見唐武宗英武之主所任宰相李徳􅁉最號有材當時用兵征伐指揮將帥處置事冝動以詔書約束勸厲故終成功業國家用兵以來未聞以賞罰號令激動人心使其竭力者此最冝留意取進止論元昊來人請不賜御筵劄子同前臣竊知昊賊所遣來人將欲到闕風聞管勾使臣湏索排備一作比次第甚廣及聞纔至欲賜御筵管領臣知昊賊此來意極不遜臣料朝廷必欲要其臣服方許通和􅀂欲如此則便湏有以挫之方能抑其驕慢庻可商量今若便於禮數之間過加優厚則彼必以一作謂我爲怯知我可欺議論之間何由屈折􅀂果能得其臣順一作能得其心則侍議定之後稍加禮數一作侍亦未爲遲仍湏杜漸防微常爲挫抑之計豈可一事未成先虧國體其元昊一行來人伏乞凡事減勒無令曲加優厚若因此得其抑挫而臣伏則吾計無失如其必不臣伏則免至虚虧事分取進止論楊察請終䘮制乞不奪情劄子慶暦二年臣近見丁憂人茹孝標居父之䘮來入京邑奔走權貴營求起復巳爲御史所彈又聞新及第進士南宫覲聞母之䘮匿不行服得官娶婦然後徐歸見在法寺議罪孝標官爲太常􅀶士覲在􅂣屋粗有名稱此二人猶如此則愚俗無知違禮犯義者何可勝數矣蓋由朝廷素不以名教􅅄勵天下而禮法一隳風俗大壞竊以風化之本由上而下伏見起復龍圖閣待制楊察累有章奏乞終毋䘮而朝旨未􅁢夫臣子之行惟孝與忠察以文中髙科官列近侍而能率勵頽俗以身爲先陞下冝曲賜褒嘉遂成其志使遷善化俗自察而始豈可不通人情膠執舊弊推禄利之小恵廢人臣之大節臣謂近侍奪情本非一作以軍國之急不過循舊例示推恩而巳今察以節行自髙志在忠孝知貪冒禄利爲可耻􅀂朝廷抑奪其情使其於身不得成羙行而於母有罔極之恨豈足謂之推恩乎方今愚俗無知違犯禮義至使繁獄訟嚴刑罰而不能禁止脫有一人欲守名教而全忠孝以勵天下者又爲朝廷不許則風俗之弊其咎安在伏乞早降恩旨許其終䘮不獨成察之志亦以爲朝廷之羙取進止論韓􅄾范仲淹乞賜召對事劄子同前臣伏見自西鄙用兵以來陛下聖心憂念毎有臣寮言及西事必皆傾心聽納今韓􅄾范仲淹乆在陜西備諳邊事是朝廷親信委任之人況二臣才識不􅀋常人其所見所言之事不同常式言事者陛下最冝加意訪問自二人到闕以來只是逐日與兩府隨例上殿呈奏尋常公事外有機冝大處置事並未聞有所建明陛下亦未曽特賜召對從容訪問況今西事未和邊陲必有警急兼風聞北虜見在涼甸與大臣議事外邊人心憂恐伏望陛下因無事之時出御便殿特召􅄾等從容訪問使其盡陳西邊事冝合如何處置今􅄾等數年在外一旦歸朝必有所陳但陛下未賜召問此二人亦不敢自請獨見至如兩府大臣毎有邊防急事或令非時召見聚議或各令互述所見或只召一兩人對見商量此乃帝王常事祖宗之朝並亦如此不必拘守常例也取進旨論罷鄭戩四路都部署劄子同前臣伏覩勑除鄭戩知永興軍仍兼陜西都部署自聞此命外人議論皆以爲非在臣思之實亦未便竊以兵之勝􅀒全由處置如何臣見用兵以來累次更改或四路都置部署或分而各領一方乍合乍離各有利害惟夏竦往年所任鄭戩今日之權失䇿最多請試條列臣聞古之善用將者先問能將㡬何今而不復問戩能將㡬何直以關中數十州之廣蕃漢十萬之兵􅆓邊二三千里之事盡以委之此其失者一也或曰戩雖名都部署而諸路自各有將又其大事不令專制而必禀朝廷假如邊將有大事先禀於戩又禀於朝廷朝廷議定下戩戩始下於沿邊只此一端自可敗事其失二也今大事戩旣不專若小事又不由戩則部署一職止是虚名若小事一一問戩則四路去永興皆數百里其寨柵逺者千餘里使戩一一處分合冝尚有遲緩之失萬一耳目不及處置失冝則爲害不細其失三也若大小事都不由戩而但使帶其權豈有數十州之廣數十萬之兵二三千里之邊事作一虚名使爲無權之大將若知戩可用則推心用之若知不可用則善罷之豈可盡關中之大設爲虚名而以不誠待人其失四也今都部署名統四路而諸將事無大小不禀可行則四路偏禆各見其將不由都帥則上下相効皆欲自專其失五也今都部署是大將反不得節制四路而逐路是都帥部將却得專制一方則委任之意大小乖殊軍法難行名體不順其失六也若知戩果不可大用但不敢直罷其職則是大臣顧人情避已怨如此作事何以弭息人言其失七也料朝廷忽有此命必因韓􅄾等近自西來有此擘畫􅄾等身在邊陲曽爲將帥豈可如此失計臣今欲乞令兩府之臣明議四路不當置都部署利害其鄭戩旣不可内居永興而遥制四路則乞落其虚名只令坐鎮長安撫民臨政以爲關中之重其任所繫亦大而使四路各責其將則事一作名體皆順處置合冝今取進止論凌景陽三人不冝與館職奏狀慶暦五年右臣今日竊聞凌景陽召試館職外議皆以爲非臣聞聖王之以風化勵天下不能家至户到但進一善人則天下勸退一不肖則天下懼用功至簡其益極多苟賞罰之過差繫朝廷之得失伏況國家自祖宗以來崇建館閣本以優待賢材至於侍從之臣宰輔之器皆從此出其選非輕如凌景陽者粗親文學本實凡庸近又聞與在京酒店户孫氏結㛰推此一節其他可知物論喧然共以爲醜此豈足以當國家優待賢材之選又聞夏有章魏廷堅等亦皆得旨將試館職此二人者皆有贓汚著在刑書此尤不可玷辱朝化其凌景陽今已就試乞不與館職有章廷堅乞更不召試竊以累年以來風教廢懷士無廉耻之節官多冒濫之稱當其積習因循則不以爲恠如欲澄清治化則冝革此風臣謂黜此三人則天下士人當脩名節臣職在諫諍忝司耳目採是非之公論合具宻陳見選任之非人皆當論列謹具狀奏聞伏候勑旨景陽轉一官知和州有章廷堅罷試景陽集賢晏公舉有章故相陳公舉廷堅兩制連狀舉論按察官吏第二狀同前右臣近曽上言爲天下官吏冗濫者多乞遣使分行按察昨日竊覩降勑下諸路轉運使司令兼按察使竊以轉運使自合察舉本部官吏今􅀂特置使名更加約束則於常行之制頗爲得冝必欲救弊於時則未盡善且臣􅀄乞差按察使者蓋欲朝廷精選強明之士竊聞朝議一作廷以所選非人故不遣使今所委轉運使豈盡得人乎其間昬老病患者有之懦弱不材者有之貪贓失職者有之此等之人自當􅀍劾豈可更令按察其間縱有材能之吏又以斡運財賦有米鹽之繁供給軍湏有星火之急旣不暇遍走州縣專心察視則稽遲鹵莽不得無之故臣謂轉運使兼按察使不材者旣不能舉職材者又不暇盡心徒見空文恐無實効在於事體不若專遣使人伏自兵興累年天下困弊飢荒疲瘵旣無力以賑救調歛科率又無由而減省徒有愛民之意絶無施惠之方􅀂但能逐去冗官不令貪􅁀選用良吏各使撫綏惟此一事及民最切苟可爲人之利何憚選使之勞況自近年累遣安撫豈於今日頓以爲難今必恐三丞至郎中内難得其人即乞且依前後安撫於侍從臣寮及臺官館職中選差十數人小處路分兼察兩路其侍從臣寮仍各令自辟判官分行採訪用臣前來起請事件施行其轉運兼按察使若能精選其人亦乞著令爲今後常行之制臣伏思從來臣寮非不言事朝廷非不施行患在但著空文不責實効故改更雖數號令雖煩上下因循了無所益今必欲日新求治革弊救時則湏在力行方能濟務臣所言者生民之急一有務字也天下之利也不徒略行一二分以塞言責而已伏望留意詳擇謹具狀奏聞伏候勑旨再論按察官吏狀同前右臣自􅀄忝諫官於第一次上殿日首曽建言方今天下凋殘公私困急全由官吏冗濫者多乞朝廷選差按察使糺舉年老病患贓汚不材四色之人以行澄汰仍具陳按察之法條目甚詳如臣之議蓋欲使使者四出而天下悚然知朝廷有賞善罰惡之意然後按文責實甚惡者黜有善者升中材之人盡使警勵凡臣所言者乃所以救民急病革數一作四十年蠧弊之事若非遭逢聖主銳意求治之時上下力行之不可也奈何議者憚於作事惟樂因循秖命諸路轉運使就兼其職命出之日外論皆謂諸路之中貪贓如魏兼老病如陳杲檅惡如錢延年庸常齪齪如􅀽抗張可乆之輩盡爲轉運使皆自是可黜之人必不能舉職臣亦再具論奏其議格而不行按察空名今遂寢廢生民蠹病日益可哀伏見陛下聖徳日新憂心庻政近發手詔督勵宰輔然天下之事積弊巳多如治乱絲未知頭緒欲事事更改則力未能周而煩擾難行欲漸漸整頓則困弊巳極而未見速効臣謂如欲用功少爲利博及民速於事切則莫若精選明幹朝臣十許人分行天下盡籍官吏能否而升黜之如臣前所陳者而後可臣聞治天下者如農夫之治田不可一槩也蒿萊蕪穢乆荒之地必先力加墾闢芟除待其成田然後以時耘耨冗濫之官蕪穢天下乆矣必先力行澄汰待其百職粗治然後精選有司常令糺舉今特遣之使如乆荒而芟闢也轉運兼按察乃以時之耘耨者耳寛猛疾徐各有所冝也漢時刺舉唐世黜陟使考課使之􅀋歳歳遣出祖宗朝亦有考課院蓋按察升黜古今常法非是難行之異事也方今言事者多以髙論見棄或以有害難行如臣所言只是選十餘人明幹朝臣察視官吏善惡灼然有迹易見者著之簿籍朝廷詳之黜其甚者耳臣自謂於論不爲甚髙爲甚髙三字一作迂行之有利無害然尚慮議者未以爲然謹條陳冗官利害六事以明利博効速而可行不疑伏望聖慈特賜裁擇如有可採乞早施行一曰去冗官則民之科率十分減九臣伏見兵興以來公私困弊者不惟賦歛繁重全由官吏爲姦毎或科率一物則貪殘之吏先於百姓而刻剥老繆之吏恣其群下之誅求朝廷得其一分姦吏取其十倍民之重困其害在斯今若去此四色冗官代以循良之吏事隨便冝絶去搔擾使民專供朝廷實數科率免却州縣分外誅求故臣謂於民力十分減九也比於别圖減省細碎無益者其利博矣二曰不材之人爲害深於贓吏國家之法除贓吏因民告發者乃行之其他不材之人大者壞州小者壞縣皆明知而不問臣謂凡贓吏多是強􅃛之人所取在於豪冨或不及貧弱不材之人不能馭下雖其一身不能乞取而恣其群下下字一作不逞共行誅剥更無貧冨皆􅀍其殃爲害至深縱而不問故臣尤欲盡取老病繆懦者與贓吏一例黜之三曰内外一體􅀂外官不澄則朝廷無由致治今朝廷雖有號令之善者降出外方􅀂落四色冗官之手則或施設乖方不如朝廷本意反爲民害或稽滯廢失全不施行而又無糺舉弃一作多作空文􅀂外邊去却冗官盡得良吏則朝廷所下之令雖有乖錯彼亦自能回改或執奏更易終不至爲大害是民之得失不獨上賴朝廷全繫官吏善惡以此而言冗官豈可不去四曰去冗官則吏貟清簡差遣通流今天下官有定貟而入仕之人無定數旣不黜陟冒濫者多差遣不行賢愚同滯毎有一闕衆人爭之一作競爭爭得者無廉耻之風不得者騰怨嗟之口濫官之弊近古無之今􅀂擇四色冗官去之則待闕之人可無怨滯五曰去冗官則中材之人可使勸懼今天下官吏豈必盡是不材蓋爲朝廷本無黜陟善惡不分今􅀂是國家責實求治逐一求治逐一四字一作是求人人精别則中材之人皆自勉強不敢因循雖有貪殘亦湏歛手六曰去冗官則不過朞月民受其賜方今朝廷雖有愛一作憂念疲民之意然上下困乏必未有餘力廣惠及民􅀂但去冗官則民受速賜蓋臣常見外處州縣毎一繆官替去一能者代之不過數日民巳歌謡今若盡去冗濫之吏而以能吏代之不過朞月民即一作必受賜此臣所謂及民速於事切者也論禁止無名子傷毀近臣狀同前右臣竊見前年宋庠等出外之時京師先有無名子詩一首傳於中外尋而庠罷政事近又風聞外有小人欲中傷三司使王堯臣者復作無名子詩一篇略聞其一兩句臣自聞此詩日夕疑駭深思事理不可不言伏以陛下視聽聦明外邊事無小大無不知者竊恐此詩流傳漸廣湏逹聖聦臣忝爲陛下耳目之官不欲小人浮謗之言上惑天聽合先論列以杜姦讒況自兵興累年繼以災旱民財困竭國帑空虚天下安危繫於財用虚實三司之職其任非輕近自姚仲孫罷去之後朝廷以積年蠹弊貧虚窘乏之三司付與堯臣仰其辦事乃是陛下委信責成之日堯臣多方展効之時臣備見從前任人率多顧惜禄位寜可敗事於國不肯當怨於身如堯臣者領職以來未及一月自副使以下不才者悉請換易足見其不避嫌怨不徇人情竭力救時以身當事今􅀂下容讒間上不主張則不惟材智之臣無由展効亦恐忠義之士自兹解體臣思作詩者者字一作之人雖不知其姓名竊慮在朝之臣有名位與堯臣相􅀋者嫉其任用故欲中傷只知爭進於一時不思沮國之大計伏自陛下罷去吕夷簡夏竦之後進用韓􅄾范仲淹以來天下欣然皆賀聖徳君子旣蒙進用小人自恐道消故共一作只喧然務騰讒口欲惑君聽欲沮好人不早絶之恐終敗事況今三司蠹弊巳深四方匱乏已極堯臣必湏大有更張方能集事未容展効已􅀍謗言臣近日已聞浮議紛然云堯臣更易官吏專權侵政今又造此詩語揺惑群情若不止之則今後陛下無以使人忠臣無由事主讒言罔極自古所患若一啓其漸則扇惑群小動揺大臣貽患朝廷何所不至伏望特降詔書戒勵臣下敢有造作言語誣搆隂私者一切禁之及有轉相傳誦則必推究其所來重行朝典所貴禁止讒巧保全善人謹具狀奏聞伏􅃸勑旨勑出賞錢官爵購捉是時上欲更改朝政小人不便造作言語動摇及勅榜出自此遂絶奏議卷第一論按察官吏劄子進奏院一作官才幹一作勤幹乞詔諭陜西將官劄子乞速詔此上一有臣欲二字論元昊來人請不賜御筵劄子及聞一作又聞庻可一作乃可論韓􅄾范仲淹乞賜召對劄子並亦如此亦字下一有許字論罷鄭戩四路都部署劄子止是虚名一作虚名可廢千餘里一作及千里論凌景陽三人不冝與館職奏狀玷辱此上一有以字論按察官吏第二狀更令按察四字一作劾人材者又一作有材者又不徒畧行徒一作但行一作言再論按察官吏狀蓋欲一作本欲甚惡一作其惡有善一作其善革數革字上一有登字空名一作空文代以循此上一有而字豪冨此下一有之家猶三字四色此十一有此字稽滯一作留滯替去此下一有得字數目一作數用即受賜一作受其賜慶曆二年公爲挍理甞上書引李希烈事乞免冨弼使虜見蘇文忠公所作冨公神道碑而書逸居士集卷第一歐陽文忠公集一古詩三十八首顔跖顔囬飲瓢水陋巷卧曲肱盜跖猒人肝九州恣橫行囬仁而短命跖壽死免兵愚夫仰天呼禍福豈足憑跖身一腐䑕死朽化無形萬世尚遭戮筆誅甚刀刑思其生所得豺犬飽􅆨腥顔子聖人徒生知自誠明惟其生之樂豈减跖所榮死也至今在光輝一作輝光如日星譬如埋金玉不耗精與英生死得失間較量誰重輕善惡理如此毋尤天不平猛虎猛虎白日行心閑貌􅀭􅀭當路擇人肉羆一作熊豬不形相頭垂尾不掉百獸自然降暗禍發所忽有機埋路傍徐行自踏之機飜矢穿腸怒吼震林丘瓦落兒墮床已死不敢近目睛射餘光虎勇一作猛恃其外爪牙利鉤鋩人形雖羸弱智巧一作巧智乃中藏恃外可摧折藏中難測量英心多決烈自信不猜防老狐足姦計安居一作身安穴垣墻窮冬聽冰渡思慮豈不長引身入扱中將死猶跳踉狐姦固堪􅀏虎猛誠可傷仙草世􅀃有仙草得之能隱身仙書巳怪妄此事况無文嗟爾得從誰不辨僞與眞持行入都市自謂術通神白日攫黃金磊落揀竒珍旁人掩口􅀏縱汝暫懽忻汝方矜所得謂世盡盲昏非人不見汝乃汝不見人遊龍門分題十五首上山躡蹻上髙山探險慕幽賞􅀄驚澗芳早忽望巖扉敞林窮路已迷但逐樵歌響下山行歌翠微裏共下山前路千峯返照外一鳥投巖去渡口晚無人繫舸芳洲樹石樓髙灘復下灘風急刺舟難不及樓中客徘􅆦川上山一作山上看一作山上山夕陽洲渚逺唯見白鷗飜上方閣聞鍾渡一作動寒水共歩尋雲嶂還隨􅀌鳥下却望層林上清梵逺猶聞日暮空一作千山響伊川泛舟春谿漸生溜演􅃞迴舟小沙禽獨避人飛去青林杪宿廣化寺橫槎渡深澗披露採香薇樵歌雜梵響共向松林歸日落寒山慘浮雲隨客衣自菩提歩月歸廣化寺春巖瀑泉響夜乆山巳寂明月浄松林千峯同一色八節灘亂石㵼溪流跳波濺如雪往來川上人一作寒川上朝暮愁灘闊更待浮雲散􅀌舟弄明月白傅墳芳荃奠蘭酌共弔松林裏溪口望山椒但見浮雲起晚登菩提上方野色混晴嵐蒼茫辨煙樹行人下山道猶向都門去山槎古木卧山􅆎危根老盤石山中苦霜霰歳乆無春色不如嵓下桂開花獨留客石笋巨石何亭亭􅀌生此巖側白雲與翠霧誰見琅玕色惟應山鳥飛百轉時來息鴛鴦畫舷一作船鳴兩槳日暮芳洲路泛泛風波鳥􅀟􅀟弄紋羽愛之欲移舟漸近還飛去溪夜泊七黃牛峽祠八松門九下牢津居士集本古律各從其􅀋今從之􅃞檝泝清川捨舟縁翠嶺探竒冒層嶮因以窮人境弄舟一作川終日愛雲山徒見青蒼杳靄間誰知一室煙霞裏乳竇雲􅃾凝石髓蒼崖一徑橫查渡翠壁千尋當户起昔人心賞爲誰留人去山阿跡更幽青蘿緑桂何岑寂山鳥嘐嘐不驚客松鳴澗底自生風月出林間來照席仙境難尋復易迷山囬路轉幾人知惟應洞口春花落流出巖前百丈谿即下牢溪也下牢溪隔谷聞溪聲尋溪度橫嶺清流涵白石静見千峯影巖花無時歇翠栢鬱何整安能戀潺湲俯仰弄雲景蝦蟇碚今土人冩作背字音佩石溜吐隂崖泉聲滿空谷能邀弄泉客繫舸留巖腹隂精分月窟水味標茶録共約試春芽槍旗㡬時緑黄牛峽一本無峽字祠大川雖有神一作固神靈淫祀亦其一作本風俗石馬繫祠門山鵶噪叢木潭潭村鼔隔溪聞楚巫歌舞送迎神􅀞船百丈山前路上灘下峽長來去江水東流不暫停黄牛千古長如故峽山侵天起青嶂崖崩路絶無由上黄牛不下江頭飲行人惟向舟中望朝朝暮暮一作風輕絳雪罇前舞日暖繁香露下聞從來竒物産天涯安得移根植帝家猶勝張騫爲漢使辛勤西域徙榴花金雞五言十四韻蠻荆鮮人秀厥羙爲物恠禽鳥得之多山雞稟其粹衆綵爛成文眞色不可繪仙衣霓紛披女錦花綷縩輝華日光亂眩轉目睛憊髙田啄秋粟下澗飲寒瀬清唳或相呼舞影還自愛豈知文章累遂使網羅掛及禍誠有媒求友反遭賣有身乃吾患斷尾亦前戒不羣世所驚甚羙衆之害稻􅆝雖云厚樊縶豈爲泰山林歸無期羽翮日巳鎩用晦有前言書之可爲誡和丁寳臣遊甘泉寺寺在臨江一山上與縣􅅟相對江上􅀌峯蔽緑蘿縣樓終日對嵳峩叢林巳廢姜祠在事迹難尋楚語訛寺有清泉一􅇦俗傳爲姜詩泉亦有姜詩祠案詩廣漢人疑泉不在此空餘一派寒巖側澄碧泓渟涵玉色野僧豈解惜清泉蠻俗那知爲勝迹西陵老一作縣令好尋幽時共登臨向此遊欹危一逕穿林樾盤石蒼苔留客歇山深雲日變隂晴澗栢巖松度歳青谷裏花開知地暖林間鳥語作春聲依依渡口夕陽時却望層巒在翠微城頭暮鼔休催客更待横江一作􅀌舟弄月歸送京西提􅀧刑獄張駕部太華之松千歳青嘗聞其下多茯苓地靈山秀草木異徃徃變化爲人形神仙不欲世人採覆以雲氣常冥冥臺郎何年一作處得眞訣服餌旣乆毛骨清汝陽昔見今十載丹顔益少方瞳明郡齋政成罇爼樂高談日接無俗情詔書忽下襃羙績使車朝出行屬城職清事簡稱雅一作髙意蠹書古篋一作靈九滿笥晨裝輕洛陽花色􅀏春日錦衣晝歸閭里驚自云就欲一作欲就謝官去烏紗白髮西臺卿他年我一作終亦老嵩少願乞仙粒分餘馨贈杜黙一本注云黙師太學先生石守道介􅀯山有鳴鳯其音和且清鳴於有道國出則天下平杜黙東土秀能吟鳯凰聲作詩㡬百篇長歌仍短行携之入京邑欲使衆耳驚來時上師堂再拜辭先生先生頷首遣教以勿驕矜贈之三豪篇而我濫一名杜子來訪我欲求相和鳴顧我文字卑未足當豪英豈如子之辭鏗鍠間鏞笙淫哇俗所樂百鳥徒一作方嚶嚶杜子卷舌去歸衫翩以輕京東聚羣盗河北􅀧新兵饑荒與愁苦道路日以盈子盍引其吭發聲通下情上聞天子聦次使宰相聽何必九包禽始能瑞一作鳴堯庭子詩何時作我耳乆巳傾願以白玉琴冩之朱絲繩送吕夏卿夏卿父造字公􅀄有名進士也一本云送吕先輩赴端州高要尉始吾尚㓜學弄筆群兒爭誦公􅀄文嗟我今年巳白髮公􅀄相見猶埃塵傳家尚喜有二子始知靈珠出淮濵一作海蠙一作淮蠙去年束書來上國欲以文字驚衆人駑駘羣馬斂足避天衢讓路一作騰踏先騏驎尚書禮部奏高第斂衣襆硯趨嚴宸曈曈春日轉黄傘藹藹賦筆摛青雲我時寓直殿廬外衆中迎子􅀏以忻明朝一作晨失意落人後我爲沮氣羞出門得官髙要幾千里猶幸海逺一作逺海無惡氛英英帝圃多鸞凰一作鳯上下羽翼何􅌭紛期子當呼丹山鳯爲瑞相與來及群憶山示聖俞吾思夷陵山山亂不可究東城一堠餘髙下漸岡阜群峯迤邐接四顧無前後憶嘗祗吏役鉅細悉經覯是時秋卉紅嶺谷堆纈繡林枯松鱗皴山老石脊痩斷徑履頽崖􅀌泉聽清溜深行得平川古俗見耕耨澗荒驚麏奔日出飛雉雊盤石屢欹眠緑巖堪解綬幽尋歎獨徃清興思誰侑其西乃三峽嶮恠愈竒冨江如自天傾一作㵼岸立兩崖􅃲黔巫望西屬越嶺通南奏時時縣樓對雲霧昏白晝荒煙下牢戍百仞寒溪漱蝦蟆噴水簾甘液勝飲酎亦嘗到黄牛泊舟聽猿狖巉巉起絶壁蒼翠非刻鏤隂嵓下攅叢岫穴忽空透遥岑聳􅀌出可愛欣欲就惟思得君詩古徤冩竒秀今來㑹京師車馬逐塵瞀頽冠各白髮舉酒無蒨袖繁華不可慕幽賞亦難遘徒爲憶山吟耳􅀬助嘲詬送唐生一本作送唐秀才歸永州京師英豪域車馬日紛紛唐生萬里客一影隨一身出無車與馬但踏車馬塵日食不自飽讀書依主人夜夜客枕夢一作冷北風吹􅀌雲翩然動歸思旦夕來叩一作叩我門終年少人識逆旅一作旅意惟我親來學媿道矒一作昩贈歸慚一作嗟橐貧勉之期不止多穫由力耘􅃌家大嶺北重湖浩無垠飛鴈不可到書來安得一作能頻送任處士歸太原時天兵方討趙元昊一虜動邊陲用兵三十萬天威豈不嚴賊首猶未獻自古王者師有征而不一作無戰勝敗繫人謀得失由廟筭是以天子明咨詢務周徧直欲採竒謀不爲人品限公車百千輩下不遺僕賤況於儒學者延納冝無間如何任生來三月不得見方兹急士時論擇豈冝慢任生居太原白首勤著撰閉戸不求聞忽來誰所薦人賢固當用舉繆不加譴一作賢固當用舉繆亦不加譴賞罰兩無文是非奚以辨遂令拂衣歸安使來者勸一本有其餘茍盡然所責胡由辨兩句嗟吾筆與舌非職不敢諫聖俞㑹飲時聖俞赴湖州一本作送梅堯臣赴湖州傾壷豈徒彊君飲解帶且欲留君談洛陽舊友一時散十年㑹合無二三京師旱乆塵土􅀬忽值晚雨凉纎纎一作滑公井泉釀最羙赤泥印酒新開緘更吟君句勝啖䏑杏花妍媚春酣酣君詩有春風酣酣杏正妍之句吾交豪俊天下選誰一作難得衆羙如君兼一本有鏗鏘文律金玉冩森羅武庫戈㦸銛兩句詩工鑱刻露天骨將論縱横輕玉鈐遺編最愛孫武􅀃徃徃曹杜遭夷芟關西幕府一作下不能辟隴山一作西敗一作大將死可慚嗟余身賤不敢薦四十白髮猶青衫呉興太守詩亦好徃一作助奏玉琯和英咸盃行到手莫辭醉明日一作發舉棹天東南送胡學士知湖州一本云送胡􅀫武平學士武平天下才四十滯鈆槧忽乗使君舟歸榜一作艕不可纜都門春漸動柳色緑將暗掛㠶千里風水闊江灩灩呉興水精宫樓閣在寒鑑橘柚秋苞繁烏程春瓮釅清談越客醉屢舞呉娘豔􅀉詩毋憚頻一作煩以慰離居念哭一作弔石曼卿嗟我識君晚君時猶壯夫信哉天下竒落落不可拘軒昂懼驚俗自一作似隱酒之徒一飲不計斗傾河竭崑墟作詩幾百篇錦組聮瓊琚時時出險語意外研精麤窮竒變雲煙搜恠蟠蛟魚詩成多自冩筆法顔與虞旋弃不復惜所存今幾餘徃徃落人間蔵之比明珠又好一作愛題屋壁虹蜺隨卷舒遺蹤處處在餘墨潤不枯朐山頃歳出我亦斥江湖乖離一作暌四五載人事忽焉一作有殊歸來見京師心老貌已癯但驚何其衰豈意今也無才髙不少下闊􅀂與世踈驊騮當少時其志萬里塗一旦老伏􅇫猶思玉山芻天兵􅀫西北狂兒尚稽誅而令壯士死痛惜無賢愚歸魂渦上田露草荒春蕪送曇穎歸廬山吾聞廬山乆欲徃世俗拘昔歳貶夷陵扁舟下江湖八月到湓口停帆望香爐香爐雲霧間杳靄疑有無忽值秋日明彩翠浮空虚信哉竒且秀不與灊霍俱偶病不時徃中流但踟蹰今思尚髣髴恨不傳畫圖曇頴十年舊風塵客京都一旦不辭訣飄然卷衣一作長裾山林徃不返古亦有吾儒西北苦兵戰江南仍旱枯新秦又攻冦京陜募兵夫聖君念蒼生賢相思良謨嗟我無一􅀃朝紳拖舒舒未能膏鼎鑊又不老菰蒲羡子識所止􅀟林歸結廬送孔秀才遊河北吾始未識子但聞楊公賢及子來叩門手持贈子篇賢愚視所與不待交子一作得交一言子文諧律吕子行㓗琅玕行矣慎所遊惡草能敗蘭送􅀺生下第還蜀􅁰離不復雅孔子修春秋杖王貶呉楚大法加諸侯妄儒泥於魯甚者云黜周大㫖旣已矣安能討一作計源流遂令學者迷異􅀃相交鉤􅀺生西南秀挾䇿來東遊一作州有司不見採春霜滑歸輈自云喜三傳力一作方欲探微幽凡學患不彊苟至將焉廋聖言簡且直慎勿迂其求經通道自明下筆如戈矛一敗不足衂後功掩前羞居士集卷第一熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正猛虎詩引身入扱中朝佐考字書扱音插取也􅀗也舉也引也􅀵也義與詩不􅀋按韓文公城南聮句云靸妖藤索絣時景通云布活套於狐徑而掎其足謂之靸靸扱聲相近公用扱字義或取此蝦蟆碚詩諸本皆作碚朝佐考字書無此字按東坡集决囚經歴詩忽憶尋蟆培其字從土又南行集二蘇皆有蝦蟇培詩欒城作培東坡作背今秘書正字項安世嘗自蜀來云土人冩作背字音佩石樓川上山一作看魚罾菱浦菱一作凌三遊洞泝一作汎嘐嘐夷陵石本作膠膠後称石本同下牢溪靜石本作浄蝦蟇碚茶録録一作籙紅棃花猶勝石本作共􅀏金雞厚石本作享送吕夏卿文字一作學憶山緑巖石本作緑蘿奏石本作走隂嵓石本作隂崖岫穴作􆄥穴送任處士採竒一作探竒送曇頴一作送僧曇頴送􅀺生巳矣一作失崇文總目叙􅇚一卷歐陽文忠公集一百二十四易􅀋前史謂秦焚三代之書易以卜筮而得不焚及漢募羣書􅀋多散逸而易以故最完及學者傳之遂分爲三一曰田何之易始自子夏傳之孔子卦象爻􅂏與文言說卦等離爲十一篇而說者自爲章句易之本經也二曰焦贛之易無所師授自言得之隱者第述隂陽災異之言不􅀋聖人之經三曰費直之易亦無師授專以􅂏象文言等參解卦一作易爻凡以􅂏象文言雜入卦中者自費氏始田何之學施孟梁丘之徒最盛費氏初微止傳民間至後漢時陳元鄭衆康成之徒皆學費氏費氏興而田學遂息古十二篇之易遂亡其本及王弼爲注亦用卦一作􅂏象相雜之經自晉已後弼學獨行遂傳至今然易比五經其来最逺自伏羲畫卦下更三代别爲三易其變卦五十有六命名皆一作甚殊至於七八九六筮占之法亦異周之末世夏商之易巳亡漢初雖有歸蔵已非古經今書三篇莫可究矣獨有周易時更三聖世歷三古雖說者各自名家而聖人法天地之緼則具存焉書􅀋書原於號令而本之史官孔子刪爲百篇斷堯訖一作迄秦序其作意遭秦之故孔子末孫惠與濟南伏勝各蔵其本于家楚漢之際勝失其所蔵但口以傳授勝旣耄昏乃繆合二十四篇爲二十九歐陽夏侯之徒皆學之冩以漢世文字號今文尚書至武帝時孔惠之書始出屋壁百篇皆在而半巳磨滅又皆科斗文字惠孫安國以􅀠古定之得五十八篇爲之作傳號古文尚書至陳隋之間伏生之學廢絶而孔傳獨行先是一作時孔傳亡其舜典東晉梅頥一作􅞾乃以王肅所注伏生舜典足其篇至唐孝明不喜􅀠古始更以今文行于一作於世詩􅀋昔孔子刪古詩三千餘篇取其三百一十一篇著于經秦楚之際亡其六漢興詩分爲四一曰魯人申公作訓詁號魯詩二曰齊人轅固生作傳號齊詩三曰燕人韓嬰作内外傳號韓詩四曰河間人毛公作故一作詁訓傳號毛詩三家並立學官而毛以後出至平一作章帝時始列于學其後馬融賈逵鄭衆康成之徒皆發明毛氏其學遂盛魏晉之間齊魯之詩廢絶韓詩雖在而益微故毛氏獨行遂傳至今韓嬰之書至唐猶在今其存者十篇而巳漢志嬰書五十篇今但存其外傳非嬰傳詩之詳者而其遺說時見扵他書與毛之義絶異而人亦不信去聖既逺誦習各殊至扵考風雅之變正以知王政之興衰其善惡美刺不可不察焉禮􅀋禮樂之制盛于三代而大備扵周三代之興皆數百年而周最久始武王周公修太平之業畫天下以為九服上自天子至于一作於庻人皆有法度方其郊祀天地開明堂以㑹諸侯其車旗服器文章爛然何其盛㢤一作也及幽厲之亂周室衰微其後諸侯漸大然齊桓賜胙而拜晉文不敢必請隧以禮維持又二百餘年禮之功亦大矣下更戰􅀦禮樂殆絶漢興禮出淹中后戴諸儒共為􅀘綴得百餘篇三鄭王肅之徒皆精其學而說或不同夫禮極天地朝廷宗廟凡人之大倫可謂廣矣雖二一作百家殊說豈不博㢤自漢以来沿革之制有司之傳著于書者可以覽焉樂􅀋三代禮樂自周之末其失一作亡已多又經秦世滅學之􅁀然書及論語孝經得蔵孔氏一作子之家易以􅁲筮不禁而詩本諷誦不專在於竹帛人得口以傳之故獨禮之於六經其亡最甚而樂又有聲􅄊尤易爲壞失及漢興考求典籍而樂最缺一作闕絶學者不能自立遂并其說於禮家書爲五經流别爲六藝夫樂􅀁以逹天地之和而飭化萬物要之感格人神象見功德記曰五帝殊時不相沿樂􅀁以王者有因時制作之盛何必區區求古遺缺一作闕至於律吕鍾石聖人之法雖更萬世可以考也自漢以来樂之沿革惟見史官之志其書不備隋唐􅀁録今著其存者云春秋􅀋昔周法壞而諸侯亂平王以後不復雅而下同列國吴楚徐夷並僣稱王天下之人不禀周命久矣孔子生其一作於末世欲推明王道以扶一作捄周乃聘諸侯極陳君臣之理一作禮諸侯無能用者退而歸魯即其舊史考諸行事加以王法正其是非凡其􅀁書一用周禮爲春秋十二篇以示後世後世學者傳習旣久其說遂殊公羊高榖梁赤左丘明鄒氏夾氏分爲五家鄒夾最微自漢世巳廢而三家盛行當漢之時易與論語分爲三詩分爲四禮兮爲二及學者散亡僅存其一而餘家皆廢獨春秋三傳並行至今初孔子大修六經之文獨扵春秋欲以禮法繩諸矦故其辭􅀹謹約而義微􅀮學者不能極其說故三家之傳扵聖人之旨各有得焉太史公曰為人君者不可不知春秋豈非王者之法具在乎論語􅀋論語者盖孔子相與弟子時人講問應答之言也孔子卒羣弟子論次其言而撰之漢興傳者三家魯人傳之謂之魯論齊人傳之謂之齊論而齊論増問王知道二篇今文無之出扵孔子壁中者則曰古論有兩子張是三家者篇第先後皆所不同考今之次即所謂魯論者也小學􅀋古者教學之法八歳而入小學以習六甲四方書數之藝至扵成童而後授經儒者究極天地人神事物之理無所不通故其學有次第而後大成焉爾雅出扵漢世正名命物講說者資之扵是有訓詁之學文字之興随世轉易務趨便省乆後乃或亡其本七字一作省或去其本三蒼之說始志字法而許慎作說文扵是有偏傍之學五聲異律清濁相生而孫炎始作字音扵是有音韻之學􅂐隸古文爲體各異秦漢以来學者務極其能扵是有字書之學先儒之立學其􅀄為法未始不詳而明而後世猶或訛失二字一作失之故雖小學不可闕焉正史􅀋昔孔子刪書上㫁堯典下訖秦誓著為百篇觀其堯舜之際君臣相與吁俞和諧扵朝而天下治三代巳下約束賞罰而民莫敢違考其典誥誓命之文純深簡質丁寜委曲為體不同周衰史廢春秋所書􅀹謹宻矣非惟史有詳略抑由時君功徳薄厚異世而殊文㢤自司馬氏上採黃帝迄于漢武始成史記之一家由漢以来千有餘歳其君臣善惡之迹史氏詳焉雖其文質不同要其治亂興廢之本可以考焉編年􅀋昔春秋之後􅁇以戰國諸侯交一作皆亂而史官廢失䇿書所載紀次不完司馬遷始為紀傳表志之體網羅千載馳騁其文其後史官悉用其法春秋之義書元最謹一時無事猶空書其首月以謂四時不具則不足成年所以上尊天紀下二字一作時紀正人事自晉荀悦為漢紀始復編年之體學徒稱之後世作者皆與正史並行云實録􅀋實録起於唐世自高祖至于一作於武宗其後兵盗相交史不暇録而賈緯始作補録十或得其二三五代之際尤多故矣天下乖隔號令並出傳記之士一作事訛謬尤多幸而中國之君實録粗備其盛衰善惡之迹較然而著者不可泯矣雜史􅀋周禮天子諸侯皆有史官晉之乗楚之檮杌考其紀事爲法不同至于周衰七國交侵各尊其主是非多異㝷亦磨一作靡滅其存無幾若乃史官失職畏怯回隱則游談處士亦必各記其說以伸所懷然自司馬遷之多聞當其作史記必上採帝繫世本旁及戰國荀􅀸所録以成其書則諸家之說可不備存乎僞史􅀋周室之季呉楚可謂彊矣而仲尼脩春秋書荆以狄之雖其屢進不過子爵所以抑黜僣亂而使後世知懼三代之弊也亂極于七雄並主漢之弊也亂極于三國魏晉之弊也亂極于永嘉以来隋唐之弊也亂極于五代一又有五代字之際天下分為十三四而私􅀼名號者七國及大宋受命王師四征其係纍負質請死不暇九服遂歸于有德歷考前世僣竊之􅀖雖一有甚字因時苟偷自彊一方然卒歸于二字一作於禍敗故録于一作於篇以為賊亂之戒云職官􅀋尭舜三代建官名數不同而周之六官備矣然漢唐之興皆因秦隋官號而損益之足以致治興化由此而言在一作存乎舉職勤一無此字事代天治物二字作工一而巳至於車服印綬爵秩俸廪因時爲制著于有司一有焉字書曰無曠庶官又曰􅁢􅁵百工夫百官象物奉職恭位此虞舜一有之字所以端拱無爲而化成天下可不重哉儀注􅀋昔漢諸儒得古禮十七篇以爲儀禮而大射之篇獨曰儀盖射主於容升降揖讓不可以失記曰禮之末節有司掌之凡爲天下國家者莫不講乎三代之制其采章文物􅀖國之典存乎禮官秦漢以来世有損益至於一作于車旗服􅄊有司􅀁記遺文故事凡可録者皆附于一作於史官云刑法􅀋刑者聖人􅀁以愛民之具也其禁暴止殺之意必本乎至仁然而執梃刃刑人而不疑者審得其當也故法家之說務原人情極其真偽必使有司不得銖寸䡖重出入則其為書不得不備歷世之治因時制法縁民之情損益不常故凡法令之要皆著于篇地理􅀋昔禹去水害定民居而别九州之名記之禹貢及周之興畫為九畿而宅其中内建五等之封外撫四荒之表職方之述備矣及其衰也諸侯並爭二字一作兼并并一作爭丨吞削奪秦漢以来郡􅀦州縣一作􅀖國郡縣廢興治亂割裂分屬更易不常至扵日月所照要荒附叛山川風俗五方不同行師用兵順民施政考扵圖諜可以覽焉氏族􅀋昔黃帝之子二十五人得姓命氏由其徳之薄厚自尭舜夏商周之先皆同出扵黃帝而姓氏不同其後世封為諸侯者或以國為姓至扵一作于公子公孫官邑謚族遂因而命氏其源流次序帝繫世本言之甚詳秦漢以来官邑謚族不自别而為姓又無賜族之禮至于近世遷徙不常則其得姓之因與夫祖宗世次人倫之記􅀹不可以不考焉歳時􅀋詩曰民生在勤勤則不匱故尭舜南面而治考星之中以授人時秋成春作教民無失周禮六官亦因天地四時分其典職然則天時者聖人之所重也自夏有小正周公始作時訓日星氣節七十二候凡國家之政生民之業皆取則焉孔子曰吾不如老圃至扵山翁野夫耕桑樹藝四時之說其可遺㢤傳記􅀋古者史官其書有法大事書之䇿小事載之簡牘至扵風俗之舊耆老所傳遺言逸行一作迹史不及書則傳記之說或有取焉然自六經之文諸家異學說或不同況乎幽人䖏士聞見各異或詳一時之所得或發史官之所諱參求考質可以備多聞焉儒家􅀋仲足之業垂之六經其道閎博君人治物百王之用微是無以爲法故自孟軻􅀭雄荀況一作卿之徒又駕其說扶而大一作本之歴世諸子轉相祖述自名一家異端其言或破碎扵大道然訂其作者之意要之孔氏不有殊焉道家􅀋道家者流本清虚去徤羡泊然自守故曰我無為而民自化我好靜而民自正雖聖人南面之術一作治不可易也至或不究其本棄去仁義而歸之自然以因循為用則儒者病之一有云字法家􅀋法家者流以法繩天下使一本扵其術商君申韓之徒乃推而大之挟其說以干世主收取功名至其尊君抑臣辨職分輔禮制扵王治不為無益然或狃細苛持刻深一作深刻不可不察者也名家􅀋名家者流所以辨覈名實流别一作源流等威使上下之分不相踰也仲尼有云必也正名乎言為政之大本不可不正者也墨家􅀋墨家者流其言貴儉兼愛尊賢右鬼非命上一作尚同此墨家之所行也孟子之時墨與楊其道塞路軻以墨子之術儉而難遵兼愛而不知親䟽故辭而闢之然其彊本嗇用之說有足取焉縱横家􅀋春秋之際王政不明而諸侯交亂談說之士出扵其間各挾其術以干時君其因時適一作遇變當權事而制宜有足取焉雜家􅀋雜家者流取儒墨名法合而兼之其言貫穿衆說無所不通然亦有補扵治理一作道不可廢焉一作也農家􅀋農家者流衣食之本一作大原也四民之業其次曰農稷播百榖勤勞天下功炳後世著見書史孟子聘列􅀦陳王道未始不究一作論耕桑之勤漢興劭農勉人爲之著令今集其樹藝之說庻取法焉小說􅀋書曰狂夫之言聖人擇焉又曰詢于蒭蕘是小說之不可廢也古者懼下情之壅扵上聞故每歳孟春以木鐸徇于路採其風謡而觀之至扵俚言巷語亦足取也今特列而存之兵家􅀋周禮夏官司馬掌軍戎以九伐之法正􅀖􅀦書之洪範八曰師易之繫辭取諸睽此兵之所由始也湯武之時勝以仁義春秋戰國出竒狃變其術無窮自田齊始著司馬之法漢興張韓之徒序次其書武帝之世楊僕又捃摭之謂之紀奏孝成命任宏乃以權謀形勢隂陽技巧析爲四種繇是兵家之文既修列矣然而司馬之法本之禮讓後世莫行焉惟孫武之書法術大詳考今之列非特四種又雜以卜筮刑政之說存諸篇云崇文總目叙􅇚卷終易􅀋聖人法一作聖人之法書􅀋梅頥當作梅􅞾春秋􅀋以後一作巳後實録􅀋得其二三一作得其二一歳時􅀋詩曰詩字疑廬陵歐陽文忠公年譜真宗景德四年丁未是歲皇考鄭國公觀爲綿州軍事推官六月二十一日寅時公生大中祥符元年戊申大中祥符二年己酉大中祥符三年庚戌是歲鄭公終於泰州軍事判官公叔父曄時任隨州推官因卜居焉公母夫人鄭氏年方二十九携公徃依之遂家于隨貧無資以荻畫地教公書字稍長多誦古人篇章使學為詩叔父後歴閬州推官江陵府掌書記仕至二千石終都官員外郎大中祥符四年辛亥是歲􅁙鄭公于吉州吉水縣瀧岡其後至和元年㭊吉水縣之報恩鎮置永豐縣遂􅀠永豐大中祥符五年壬子大中祥符六年癸丑大中祥符七年甲寅大中祥符八年乙卯大中祥符九年丙辰公年十歲在隨家益貧借書抄誦州南大姓李氏子好學公多遊其家於故書中得唐韓昌黎文六卷乞以歸讀而愛之為詩賦下筆如成人都官曰竒童也它日必有重名天禧元年丁巳天禧二年戊午天禧三年己未天禧四年庚申天禧五年辛酉乹興元年壬戌二月仁宗即位天聖元年癸亥是歲公應舉隨州試左氏失之誣論其略云石言于晉神降于莘内虵􅃲而外虵傷新􅀑大而故􅀑小人巳傳誦坐賦逸官韻黜天聖二年甲子天聖三年乙丑天聖四年丙寅公年二十自隨州薦名禮部天聖五年丁卯是春試禮部不中天聖六年戊辰是歲公携文謁胥學士偃於漢陽胥公大竒之留置門下冬携公泛冮如京師天聖七年己巳是春公從胥公在京師試國子監為第一􅀘廣文館生秋赴國學解試又第一天聖八年庚午正月試禮部翰林學士晏公殊知貢舉公復為第一三月御試崇政殿公甲科第十四名五月授將仕􅀰試祕書省校書郎充西京留守推官制詞前鄉貢進士歐陽某右可特授將仕郎試祕書省校書郎充西京留守推官替仲簡來年二月滿闕候見任官月限滿日即得赴任敕前鄉貢進士邵景先等咸以郷舉踐于貢闈属親校於藝文俾各升於科級特假讎書之秩式增結綬之榮郡縣佐僚各分其任宜思勗勵無曠乃官可依前件知制誥陳從易行天聖九年辛未三月公至西京錢文僖公惟演為留守幕府多名士與尹洙師魯梅堯臣聖俞尤善日為古文歌詩遂以文章名冠天下初胥公許以女妻公是歲親迎于東武明道元年壬申是春及秋兩遊嵩嶽秋蓋從通判謝絳奉御香告廟也禮畢同遊五人皆見峭壁大書神淸之洞詳見附録後謝希深與梅聖俞書公又甞行縣視旱蝗明道二年癸酉正月以吏事如京師因省叔父于漢東三月還洛夫人胥氏卒時生子未踰月九月莊獻劉后莊懿李后祔􅁙定陵公至鞏縣陪祭十二月進階承奉郎景祐元年甲戌三月西京秩滿歸襄城五月如京師㑹前留守王文康公曙入樞府薦召試學士院閏六月乙酉授宣德郎試大理評事兼監察御史充鎭南軍節度掌書記館閣校勘制詞勅前西京留守推官承奉郎試秘書省校書郎歐陽某辭擅菁英性推醇茂早登名於仕版遂從辟於賔筵而楙學逾惇參籌有􅁉眷吾樞近甞以薦論逮課試之爰來固辯麗之可􅅄宜預属書之列仍遷管記之資徃服清喈善持素履可特授宣德郎試大理評事兼監察御史充鎮南軍節度掌書記館閣校勘李淑行三館祕閣所藏書多脫謬七月甲辰詔委官編定倣開无四部著爲緫目公預焉是歲再娶諌議大夫楊公大雅女景祐二年乙亥是歲七月公同産妺之夫張􅀛正死于襄城謁告赴貶所十月至夷陵景祐四年丁丑三月謁告至許昌娶薛簡肅公奎女是夏叔父都官卒九月還夷陵十二月壬辰移光化軍乾德縣令制詞敕宣德郎守峽州夷陵縣令歐陽某以懿辭決科以敏智從事荐承俊選參校祕文偶弗慎於言階迺自貽於官譴遽沿遐牒亦旣逾年宜遷通邑之良且􅀉字人之劇余方甄録爾尚勉勤可特授守光化軍乹徳縣令替張宗尹來年三月成資闕散官如故仍放謝辤王堯臣行寳元元年戊寅十一月改元三月赴乹德是歲胥夫人所生子夭寳元二年己卯二月知制誥謝希深絳出守鄧州梅聖俞將宰襄城與希深偕行五月公謁告徃㑹留旬日而還六月甲申復舊官權武成軍節度判官㕔公事制詞降授宣徳郎守光化軍乹徳縣令歐陽某右可特授試大理評事兼監察御史充鎭南軍節度掌書記權武成軍節度判官􅈦公事替節度推官趙咸寜來年二月滿闕散官如故仍放謝辤勑前降授崇信軍節度掌書記監郢州酒稅務朝奉郎試大理評事兼監察御史尹洙等嚮者咸以儒才籍于文館旋坐朋游之累自罹降謫之科載軫淹沉特推甄敘或朝閨復秩分􅀉於縣章或府幕參謀差冠於賔序徃䖍予命彌愼爾爲可依前件王舉正行公自乹德奉母夫人待次於南陽冬暫如襄城康定元年庚辰二月改元是春赴滑州時范文正公起爲陜西經略招討安撫使辟公掌書記辤不就六月辛亥召還復充館閣校勘仍修崇文緫目十月轉太子中允制詞勑鎭南軍節度掌書記宣德郎試大理評事兼監察御史充館閣校勘歐陽某朕意尚儒雅博考辭藝使優游並進以光我太平之業恩亦厚矣爾徃參典校属以事譴㑹從薦引復敘官榮方思抆拭而用寜限陞遷之次宫坊美秩册府清塗嘉乃雋才尚勗來譽可特授守太子中允依舊館閣校勘散官如故聶冠卿行癸已同修禮書是歲子發生慶曆元年辛巳五月庚戌權同知太常禮院以見修崇文緫目辤許之八月乙酉許州對公事回依舊供職曽孫建也編年載此未詳十一月丙寅祀南郊攝太常博士引終獻十二月加􅀐都尉制詞勑夫三靈之交莫盛乎大旅四海以職畢奉于嚴禋還御端闈均慶緜㝢矧待時髦之地素清儒館之游宜􅀍徽章以甄英綴宣徳郎守太子中允充館閣校勘歐陽某雅材毓秀吉􅂂敦方副妙簡於石渠紬祕文於天祿列于俊藪光是珍群属此推恩遞増勲級益厲夙秉庸對寵嘉可加􅀐都尉餘如故吳育行已丑崇文緫目成改集賢校理慶曆二年壬午正月丁已考試别頭舉人三月丙辰御試進士應天以實不以文賦公擬進一首賜敕書􅅄諭四月丙子復差同知禮院契丹遣泛使求關南地宰相吕夷簡薦冨弼報聘人皆危之公上書引顔真卿使李希烈事乞留弼不報五月復應詔上書極陳弊事八月請外九月通判滑州十月上慶曆三年癸未是歲仁宗廣言路修政事人多薦公宜爲臺諌三月召還癸巳轉太常丞知諫院制詞宣德郎守太手中允充集賢校理􅀐都尉歐陽某右可特授守太常丞依舊充集賢校理知諌院事散官勲如故勑國家廣闢言路崇設諫垣擇方嚴之藎臣登諍議之清列責任尤重眷懷亦深向非練逹民彝精詳國體利權不能易所守貴􅀔無以摇其心則安可劭厥清芬􅀘予闕政以爾朝奉郎侍御史判三司都理欠司輕車都尉賜緋魚袋魚周詢等風猷鯁亮器範沖深並繇博古之文皆擢烝髦之選清心莅局交􅀒幹才議事飛章第􅀭風采僉詢朝論亟簡朕心宜進官聮徃參諌列爾其勤乃節行厲于忠誠姑務罄諤諤之辤敷陳而亡撓豈宜持庸庸之計畏避以自安勉膺寵光式遅明効可依前件孫拆行四月至京九月戊辰賜緋衣銀魚己巳同詳定國朝勲臣名次丙戌同修三朝典故十月戊申擢同修起居注十二月己亥召試知制誥公辤辛丑有旨不試􅀡以右正言知制誥仍供諌職制詞勑夫出納朕命裁成典誥號令風采布爲法度所以炳煥皇業羽儀近著匪我俊乂􅂚膺是選宣德郎守太常丞充集賢校理同修起居注知諌院事􅀐都尉賜緋魚袋歐陽某高才敏識照於當世特立不􅀝拔乎其倫秉心粹中履道夷坦學探系象之表文窮述作之源而自抱槧書林簮筆螭陛詞皆體達慮不及私俾之代言必能復古用進七人之列遂參四禁之嚴豈惟序陞斷自余志其於發揮藻潤之業坦明深厚之體皆汝素藴不煩訓詞可特授右正言知制誥依舊修起居注知諫院事散官勲賜如故李有行丁未同詳定編勑是月立春祭西太一宫爲獻官尋例賜紫章服慶曆四年甲申三月庚午兼判登聞檢院四月乙未押伴契丹賀生辰人使御筵於都亭驛己亥命公使河東計度廢麟州及盗鑄鐵錢并礬課虧額利害七月還京師八月甲午保州軍叛契丹聲言討西夏癸卯除公龍圖閣􅀡學士河北都轉運按察使制詞宣徳􅀰行右正言知制誥􅀐都尉賜紫金魚袋歐陽某右可特授依前行右正言充龍圖閣直學士河北諸州水陸計度都轉運按察使兼西路營田都大制置屯田本路勸農使替張昷之散官勲賜如故勑朝奉郎守尚書禮部郎中知制誥知兖州􅁿車都尉賜紫金魚袋梁適等四方有事才者當爲國家馳騖矣自夏人之不賔于廷而王師外戍天下共其勞夫侍從近列得無同我此憂者歟爾䓁並以才名器略爲時英俊兄予所以擢爾清切之禁延閣憲臺蓋備艱虞以爲用也三城西路之津㑹中山北道之吭喉河􅃋委輸事任尤重靈昌河上至于平陽皆方面之要害朝廷所属意處也各遷近職于蕃于宣王室之勤以慰予望可依前件張方平行九月三朝典故成書以公甞預編纂賜詔􅅄諭十一月南郊恩進階朝散大夫封信都縣開國子食邑五百户制詞勑三年而郊所以答天地尊祖考懐柔于百神福惠亍庶邦使生生之􅀋罔不滋殖則吾左右近著宜乎首􅀍凱澤者矣以爾河北都轉運按察使龍圖閣􅀡學士宣徳郎行右正言􅀐都尉賜紫金魚袋歐陽某學有師法言無畏避輟辭翰於西掖董賦輿於北道而能計國用詳􅁁謀擿史姦舒民困才識參用搢紳所推今嚴禋成百禮具有司其申講舊典導宣明命峻之階品増之封邑以均禧祉以對勤藎以永朝家之休可特授朝散大夫依前行右正言充龍圖閣􅀡學士河北都轉運按察使特封信都縣開國子食邑五百户勲賜如故仍放朝謝孫抃行慶曆五年乙酉是春眞定帥田況移秦州公權府事者三月時二府杜正獻范文正韓忠獻冨文忠公以黨論相繼去公上書辨之小人素巳憾公㑹公􅀌甥張氏犯法諫官錢明逸因以財産事及公下開封鞫治府尹楊日嚴觀望傅㑹上命户部判官蘇安世入内供奉官王昭明監勘得無他八月甲戌猶落龍圗閣􅀡學士罷都轉運按察使降知制誥知滁州制詞勑夫賞不遺功罰不阿近有􅀖之彝典也河北都轉運按察使龍圖閣􅀡學士朝散大夫行右正言􅀐都尉信都縣開國子食邑五百户賜紫金魚袋歐陽某博學通贍衆所見稱言事感激朕甞寵用而乃不能淑愼以遠罪辜知出非巳族而鞠於私門知女有室歸而納之羣從嚮以訟起晟家之獄語連張氏之貲劵旣弗明辨無所驗朕以其乆參近侍免致深文止除延閣之名還序右垣之次仍歸漕節徃布郡條體予寛恩思釋前吝可落龍圖閣􅀡學士特授依前行右正言知制誥散官勲封賜如故仍就差知滁州軍州兼管力勸農使替趙良䂓及放謝辤揚察行十月甲戌至郡是歲子奕生慶曆六年丙戌公年四十自號醉翁慶曆七年丁亥十二月以南郊恩加上􅀐都尉進封開國伯加食邑三百户制詞勑朕禮天事神以祈生民之佑尊祖親考以席鴻基之隆爰罄齋明仰膺顧諟乃眷近侍宜均恩典朝散大夫行右正言知制誥􅀐都尉信都縣開國子食邑五百户賜紫金魚袋歐陽某詞藻敏麗風韻俊豪參列諫垣蔚有敢言之節褒陞詞禁茂昭華國之文委任素煩安靜攸處屬修大祀俾洽蕃休特䟽勲爵之儀並厚邑封之數中外之寄待遇無殊深體柬求勉敦業􅂂可特授依前行右正言知制誥加上􅀐都尉進封開國伯食邑三百户散官賜如故仍放朝謝嵇頴行是歲子棐生慶曆八年戊子閏正月乙卯轉起居舍人依舊知制誥徙知揚州制詞勑勤求治道優延近著粤惟詞禁之彦乆布外邦之政特推渥洽蓋示眷懐朝散大夫行右正言知制誥知滁州上􅀐都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某智慮淹通文藻敏麗善談當世之務旋登近侍之班向􅀡内閣之嚴寔分北道之􅀉爰司方郡屢易周星軫予意而良深俾官儀而敘進記言動者良史之筆授之以清階督淮海者廣陵之區委之以㑹府仍司雅誥尚逺灋垣當欽待遇之榮益務端莊之節遲聞美績用對寵靈可特授行起居舍人知制誥知揚州軍州事兼管内堤堰橋道勸農使替張奎散官勲封賜如故仍放謝辤嵇頴行二月庚寅至郡皇祐元年己丑正月丙午移知潁州二月丙子至郡樂西湖之勝將卜居焉四月丙戌轉禮部郎中制詞勑群臣有常以善道益吾者今雖在外吾不忘也事任有期旣未得即還左右且進升其官秩亦足表待遇之意焉朝散大夫行起居舍人知制誥知潁州上􅀐都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某頃用文詞登朝居諫諍之任屢以謇諤之言陳闕失朝奉􅀰尚書工部員外郎􅀡龍圖閣知亳州上􅀐都尉賜紫金魚袋王洙徃由絰藝入侍備顧問之職甞以博洽之學禆見聞間縁薄疵並領外􅀉嚴助守籓久去承明之直望之懷闕應有本朝之思吾嘉才猷寔用矜爾爰各遷於品秩俾仍頒於教條行將召生無曰留滯詩曰心乎愛矣遐不謂矣其務淑愼體兹睠懷脩可特授尚書禮竒郎中依前知制誥知潁州散官勲封賜如故仍放朝謝洙可特授尚書刑部員外郎依前􅀡龍圖閣知許州軍州兼管内堤堰橋道勸農事及管勾開治溝洫河道事替宋祁散官勲賜如故仍放謝辤李絢行八月辛未復龍圖閣􅀡學士制詞勅思文先朝游心徃籍因層構之建設近職之華所以寵名儒訪治道我圖俊舊之望時惟鯁亮之姿差進禁聮胥恊公議翰林侍讀學士朝散大夫右諌議大夫知揚州􅀐都尉􅄮山縣開國子食邑五百户賜紫金魚袋楊察精明博洽端粹正方擢在禁林復典謨而歸厚寘之憲席處論議而不阿朝散大夫尚書禮部郎中知制誥知潁州上􅀐都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某識達才長文髙行㓗篤於信道不讀非聖之書忠於本朝屢條當世之務並膺左右之選歷宣内外之勞峻節弗渝公議彌勝用進祕圖之拜且光舊物之還旌乃名臣敷于茂典爾身有外朕心弗忘嘉竚來忠勿懲前事察可特授依前右諫議大夫充翰林侍讀學士兼龍圖閣學士依舊知揚州散官勲封賜如故仍放朝謝脩可特授依前尚書禮部郎中充龍圖閣􅀡學士依舊知潁州散官勲封賜如故仍放朝謝胡宿行是歲子辯生皇祐二年庚寅七月丙戌改知應天府兼南京留守司事己酉至府十月己未明堂覃恩轉吏部郎中加輕車都尉制詞勑朕聞王者尊其考欲以配天縁考之意故推而上於祖朕奉若斯義乃以季秋之選肇禋于大寢禮備法物樂和八音三后上帝亦旣顧饗六服群辟罔不􅀩氣眷言祕近之列方殿股肱之郡天地之福其可不均以爾樞宻􅀡學士朝散大夫右諌議大夫上􅀐都尉京兆郡開國侯食邑一千户賜紫金魚袋田況懐誠秉彝博見彊志以爾龍圖閣􅀡學士朝散大夫尚書禮部郎中上􅀐都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某議論據古忠正無私並為當世之宗精究百家之術施之政亊罔干譽而從欲立於朝廷不阿尊而事貴風動全蜀􅃳流京師古者因禘以發爵禄所以尊廟而貴命況合宫之事哉左省瑣闥之嚴中臺宰属之重懋爾述職推吾新書徃哉生生承此褒愛況可特授給事中依前充樞宻􅀡學士加輕車都尉散官封賜如故仍放朝謝脩可特授尚書吏部郎中依前充龍圖閣直學士加輕車都尉散官封賜如故仍放朝謝吕泰行是歲約梅聖俞買田於潁皇祐三年辛卯皇祐四年壬辰三月壬戌丁母夫人憂歸潁州四月起復舊官公固辤八月許之皇祐五年癸巳八月自潁州護母喪歸􅁙吉州之瀧岡胥􅀭二夫人祔焉是冬復至潁至和元年甲午三月改元五月服闋除舊官職赴闕制詞勑人臣之大莭曰忠與孝然處之者或過不及故先王設禮以爲之制喪者不呼其門盡爲子之志也外除而從政即爲臣之道也前龍圖閣􅀡學士朝散大夫尚書吏部郎中輕車都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某以文章􅀡亮擢居近侍以才略器幹屢更劇任自罹家難歸伏閭里今祥禫甫畢賁然斯來文昌清曹淵圖秘職皆爾舊秩徃服新命唯是移孝資忠之義爾其楙哉可特授尚書吏部郎中充龍圖閣􅀡學士散官勲封賜如故蔡襄行六月癸巳朝京師乞郡不許七月甲戌權判流内銓㑹小人詐爲公奏請汰内侍其徒怨怒以胡宗堯不當改官事中公戊子出知同州判吏部南曹吳充爲公辨明不報知諫院范鎭一再極言而參知政事劉沆方提舉修唐書亦乞留公修書八月丙午沆拜相戊申詔公修唐書九月辛酉遷翰林學士制詞勑帝王之制坦然明白發號出令一日萬微其代予言必資才哲龍圖閣直學士朝散大夫尚書吏部郎中輕車都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某言忠信行篤恭文參典謨心固金石頃在諫列以直誠盡規彌縫衮闕遷登禁省以深詔大冊振起國風出按朔乗罷守列郡免䘮還即蘄外􅀘朕嘉其難進易退有賢者之節又文學舊老宜居禁中是用延登玉堂典司翰墨僉謀四及咸曰得人當使炳焉之風弗獨漢邇三代也可特授依前尚書吏部郎中知制誥充翰林學士散官勲封賜如故王洙行壬戌兼史館修撰制詞勑古者左史記動右史記言得失形於一朝榮辱見於千載今而墨筆操牘緫二職之美者不在吾儒雅之臣乎翰林學士朝散大夫尚書吏部郎中知制誥刋修唐書輕車都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某學槩道真文得天粹凛然風節足爲世範休有議論實惟王體更中外之衆務在夷險而一心益知汝賢擢司内命豈特属文章以煩爾蓋將咨謀慮以弼予復此兼榮亦非貳事夫一家之法傳信於方來萬世有辤垂􅁉於不朽尚賴良􅀡以永休明徃服茂恩奚假多訓可特授依前尚書吏部􅀰中知制誥充史館修撰仍舊翰林學士刋修唐書散官勲封賜如故韓絳行又差勾當三班院十月乙巳朝饗景靈宫天興殿攝侍中捧盤取水十二月庚戌臘饗孝惠孝章淑德章懷皇后廟攝太尉行事至和二年乙未三月同孫抃考試諸司寺監人吏六月己丑上書論宰相陳執中已而乞外改翰林侍讀學士集賢殿修撰出知蔡州侍御史趙抃知制誥劉敞上疏留公七月戊午復領舊職八月辛丑假右諫議大夫充賀契丹國母生辰使將持送仁宗御容㑹虜主殂癸丑改充賀登位國信使十二月庚戌宿虜界松山嘉祐元年丙申九月改元公年五十二月甲辰使還進北使語録閏三月丁亥判太常寺兼禮儀事孟夏薦饗攝太尉行事五月癸未知通進銀臺司兼門下封駮事乙未免勾當三班院六月甲子奉勑祈晴醴泉觀八月壬戌知益州張方平除三司使甲子詔公權發遣三司公事以俟其至而命李淑代知銀臺司乙亥車駕詣景靈宫朝拜天興殿充贊導禮儀使又朝謁眞宗及章懿太后神御殿攝太常卿九月辛卯大慶殿行恭謝禮爲贊引太常卿禮成加上輕車都尉進封樂安郡開國侯加食邑五百户制詞勑施厚而報豊維人之常誠至而禮簡事天之宜朕承先烈之丕基祗畏勤紹弗敢荒寜亶勞維疚於昭降康四海萬靈莫不厎豫念所以報必竭其誠迺即太寢之嚴躬尚質之享欽翼䖍共陶匏以薦合祛大神示格于祖考明靈降監休應顯孚膺受福􅁵均自近始翰林學士朝散大夫尚書吏部郎中知制誥充史館修撰判太常寺兼禮儀事輕車都尉信都縣開國伯食邑八百户賜紫金魚袋歐陽某文字復于古雅正􅀡邁于倫􅀋辨論堅確救時爲心在􅄺不淄湜湜自信􅀝其演潤故置諸内署藉其才識故付之史筆賴其謀用故試之大計沛有餘地左右咸宜熈事思成相儀克允峻其勲䓁埤厥賦封尚體予衷以孚􅀖家于休可特授依前尚書吏部郎中知制誥史館修撰充翰林學士加上輕車都尉進封樂安郡開國侯食邑五百户散官勲賜如故差遣依舊吳奎行十二月􅀍差押伴契丹賀正旦人使御筵於都亭驛嘉祐二年丁酉正月癸未權知禮部貢舉賜御書文儒二字乙已磨勘轉右諫議大夫制詞勑禁宻之重朝廷所優率從四嵗之常俾進兩官之次示異䓁於䟽品表殊恩於邇臣推意之明在子則至顯忠之報惟汝爲深授受之間善美良盡翰林學士朝散大夫尚書吏部郎中知制誥充史館修撰判太常寺兼禮儀事上輕車都尉樂安郡開國侯食邑一千三百户賜紫金魚袋歐陽某風誼醇篤謀猷浚明憂天下之心物議許其懇到狥國家之急朕志知其勇爲矧夫統體之文綽有雅健之氣特立于世能同於人姑用歳勞升為諫長未厭搢紳之望徒収翰墨之長亦爲顯承當益章大可特授右諌議大夫依前知制誥史館修撰充翰林學士散官勲封賜如故差遣依舊仍放朝謝吳奎行三月癸卯爲狄青發哀苑中攝太常卿六月丙寅福康公主進封兖國公主七月壬午命公攝禮部侍郎以印授冊使乙未兼判尚書禮部九月己卯兼判祕閣祕書省十一月辛巳權判史館丙申權知審刑院候胡􅀫回依舊辛丑免十二月辛亥權判三班院癸亥權奉安明德元德章穆三后御容於啓聖院車駕行酌獻禮充禮儀使是月被差押伴契丹賀正旦人使御筵於都亭驛嘉祐三年戊戌正月壬午上幸興國寺及啓聖院朝謁太祖太宗神御殿攝太常卿二月癸卯契丹遣使告其國母哀差公館伴三月辛未兼侍讀學士以貟多固辤不拜癸未充宗正寺同修玉牒官甲午同陳旭考試在京百司等人六月庚戌加龍圖閣學士權知開封府制詞勑京邑翼翼四方是則商頌之明訓也朕念夫神臯奥區大衆所聚俗有五方之異吏有百司之繁貴近豪并輕犯法禁迫蹙則已苛細寛縱則有放紛尹正之才不止乎决事無留當官有守而已維其明智足以照物厚重足以鎭浮先事以銷其萌牙臨文以破其機械俾夫下國有以依放則庶㡬乎古之治矣翰林學士朝散大夫右諌議大夫知制誥充史館修撰充宗正寺修玉牒官刋修唐書判太常寺兼禮儀事兼判尚書禮部兼判祕閣祕書省上輕車都尉樂安郡開國侯食邑一千三百户賜紫金魚袋歐陽某道德仁義固其深藴文學政事矧乃兼長老於詞禁之中未愜搢紳之望今詳試以煩劇命允􅁵于浩穰寵以延閣之拜優以京輔之授爾其念古訓而用乂母曰時異稍艱乎施設也可特授依前右諫議大夫知制誥史館修撰充翰林學士兼龍圖閣學士權知開封府兼畿内勸農使仍舊刋修唐書兼判祕閣祕書省散官勲封賜如故吳奎行嘉祐四年己亥二月戊辰免開封轉給事中同提舉在京諸司庫務制詞勑漢制給事中日上朝謁平尚書奏事近世所職雖異而其親近左右爲㝡要宻非得端士不以付焉以爾翰林學士兼龍圖閣學士朝散大夫右諌議大夫知制誥充史館修撰刋修唐書兼判祕閣秘書省上輕車都尉樂安郡開國􅳜食邑一千三百户賜紫金魚袋歐陽某性資純良識用明果􅀡道自奮至忠不回向自禁林尹正京邑摧抑權幸崇􅅄善良獄訟簡稀幾至無事方此眷賴以圖靖嘉而廼屢形奏封求請便郡朕惟亮正之益不可使逺外而煩劇之任宜有以均勞延登􅃈闈以備顧問爾其祗服體朕意焉可特授給事中依前知制誥史館修撰充翰林學士兼龍圖閣學士提舉在京諸司庫務仍舊刋修唐書兼判祕閣祕書省散官勲封賜如故范鎮行是月充御試進士詳定官賜御書善經二字四月丁卯奏告今冬太廟親行祫饗之禮癸酉孟夏薦饗並攝太尉行事丙子兼充群牧使六月甲申刪定景祐廣樂記九月丁酉奉勑祈晴相國寺十月壬申車駕朝饗景靈宫癸酉祫饗太廟並攝侍中行事丁丑加護軍食實封二百户制詞勑王道之最盛者莫如宗廟宗廟之至重者莫如大祫朕祗率舊禮親執祀事神人以和祖考來格此皆辟公􅀸士肅雍顯相之効也福祉之流朕安敢專翰林學士兼龍圖閣學士朝散大夫給事中知制誥充史館修撰刋修唐書兼判祕閣祕書省兼充羣牧使上輕車都尉樂安郡開國侯食邑一千三百户賜紫金魚袋歐陽某凊識谹議搢紳之表醇文懿行名世之選此所以増朝廷之光參瑚璉之器詩不云乎左右奉璋髦士攸宜夫熈事休成惠