至待制三司副使以上臺諌官皇子宗室駙馬都尉管軍觀三聖御書又幸寳文閣親飛白書分賜群臣公得雙幅大書歲字下有御押加以御寳王珪夾題八字云嘉祐御札賜歐陽脩仍於絹尾書翰林學士臣王珪奉聖旨題賜名又出御製觀書詩一首令群臣属和公和篇在外集遂宴羣玉殿庚子再召近臣及三館臣僚赴天章閣觀三朝瑞物太宗眞宗御集次赴寳文閣觀御飛白書賜公金花牋字復燕羣玉殿後數日公以狀進詩謝狀在四六集詩在居士集按兩宴皆有賜書而實録及范蜀公東齋記事止載丙申有賜當時王歧公親奉詔爲序亦不及庚子再賜而實録及序又不及館職預召惟東齋記事言之公記陸子履家藏飛白字明言羣玉殿所賜時子履任集賢校理與東齋記事合但不知是日公得何字其爲金花牋則無疑然陳無已六一堂圖書詩乃云黄絹兩大字又何也韓忠獻公謝詩云鸞拂宫綃舞胡文恭公亦有謝御飛白扇子詩得非預坐者衆所賜或不同耶實録二十三日丙申二十七日庚子而歧公序乃作戊申壬子不應差誤如此殆傳寫訛耳歧公再觀書詩黄金塗紙看揮毫又司馬温公涑水記聞亦載兩賜飛白是月差押伴契丹賀正旦人使御筵於都亭驛嘉祐八年癸卯二月乙亥奉勑充沈貴妃冊禮使不及行禮四州壬申英宗即位甲戌奉勑書大行皇帝哀冊諡寳甲申覃恩轉户部侍郎進階金紫光禄大夫加食邑五百户食實封二百户仍賜推忠恊謀佐理功臣制詞勑朕受命先帝傳􅂌大實始􅀄踐阼居士民之上與二三丞輔講求天下之理恩意之及宜先老成推忠佐理功臣正奉大夫尚書禮部侍郎參知政事柱國樂安郡開國公食邑二千三百户食實封六百户賜紫金魚袋歐陽某氣清神深學足以飾經治推忠佐理功臣正奉大夫尚書禮部侍郎參知政事柱國天水郡開國公食邑二千五百户食實封六伯户賜紫金魚袋趙槩性和識逺言足以濟成謀皆􅂎梓良材廟堂重器乆弼亮於大本方􅀝平於至公尚書地官機政所出徃踐厥服思所以致君堯舜之任無俾專美於前人朕所望焉脩可特授金紫光禄大夫行尚書户部侍郎依前參知政事加食邑五百户食實封二百户仍賜推忠恊謀佐理功臣勲封如故槩可特授金紫光禄大夫行尚書户部侍郎依前參知政事加食邑五百户食實封二百户仍賜推忠恊謀佐理功臣勲封如故張懷行乙酉奉勑􅂐受命寳其文曰皇帝恭膺天命之寳五月戊辰爲皇帝祈福於南郊攝太尉行事七月戊申押伴契丹祭弔人使御筵於都亭驛八月癸巳奉勑篆大行皇帝諡寳其文曰神文聖武明孝皇帝之寳十月乙酉増修太廟成命告七室十二月庚午押伴契丹賀正旦人使御筵於都亭驛治平元年甲辰四月甲午奉勑祈雨社稷閏五月戊辰特轉吏部侍郎制詞勑先皇帝遺大投艱于朕躬俾守宗廟朞年于茲惟是一二政事之臣輔朕不逮以厎于治嘉乃勞止是用疇庸推忠恊謀佐理功臣金紫光禄大夫行尚書户部侍郎參知政事柱國樂安郡開國公食邑二千八百户食實封八百户歐陽某精識照於古今高名起於日月文之以禮樂濟之以公忠頃在先朝預聞大政逮予嗣訓之始繄爾定䇿之先属哀毀之過差感疾疹之甚美醫禱備至􅂔體訖康茍非與在之良􅂚見仰成之懿宜峻天臺之秩庸昭國棟之􅂭褒徳懋功於是乎在爾其夙夜茂勉左右弼諧用乂我王家爾亦有無竆之聞豈不休哉可特授行尚書吏部侍郎依前參知政事功臣散官勲封食實封如故祖行八月辛丑奉勑祈晴太社十二月壬子差押伴契丹賀正旦人使御筵於都亭驛治平二年乙巳是春上表乞外不允四月辛丑景靈宫奉安仁宗御容車駕行酌獻之禮攝侍中八月以大雨水再乞避位不允九月辛酉提舉編纂太常禮書百卷成詔名太常因革禮賜銀絹十一月庚午車駕朝饗景靈宫辛未饗太廟壬申祀南郊攝司空行事進階光祿大夫加上柱國食邑五百户制詞勑朕薦鬯清廟懷祖宗之威神什煙紫壇致天地之明察靈心顧享熈事休成臨端闈而肆霈中區奉徽號而推尊文毋眷言賦政之重宜首均釐之隆推忠恊謀佐理功臣金紫光禄大夫行尚書吏部侍郎參知政事柱國樂安郡開國公食邑二千八百户食實封八百户歐陽某道合誠明學竆元本被遇仁考􅆒休禁塗以經緯之文施於典冊以􅀡亮之節顯於巖廊荐更四近之聮罙暢萬機之㑹􅀖禋肇講朝務益繁備公衮之華章承祭除之盛禮乃順神福以甄爾勞進文散之崇階衍采田之多邑仍推勲級庸異弼臣顧褒嘉而載優當圖報而毋廢我有明命其懋承之可特授光禄大夫依前行尚書吏部侍郎參知政事加上柱國食邑五百户功臣封食實封如故宋敏求行治平三年丙午公年六十三月三日賜上已宴時初頒明天曆適值丁巳是月以言者指濮議爲邪說力求去不允七月癸酉薦饗太廟攝太尉行事十二月癸未奉敕􅂐皇帝尊號寳其文曰體乾膺曆文武廣孝皇帝之寳乙巳押伴契丹賀正旦人使御筵於都亭驛治平四年丁未正月丁巳神宗即位戊辰覃恩轉尚書左丞進階特進加食邑五百户食實封二百户仍賜推忠恊謀同德佐理功臣制詞勑在昔成王有審訓以屬於大卿惟我先帝命沖人寔託於四輔眷言涖阼之始宜首懋官之恩推忠恊謀佐理功臣光禄大夫行尚書吏郎侍郎參知政事上柱國樂安郡開國公食邑三千三百户食實封八百户歐陽某鯁亮發中誠明瀑外文蔚典謨之體學通治亂之原弼翼两朝爕熙萬務肆朕纂服載深仰成爰升肅於臺機示疇庸於台佐衍封増幹賜號進階祗式舊章併推異數噫荷祖宗之垂佑旣嗣無疆之休賴臣鄰而恊恭方求小毖之助益宣賢業茂對寵徽可特授特進行尚書左丞依前參知政事加食邑五百户食實封二百户仍賜推忠恊謀同德佐理功臣勲封如故宋敏求行二月第三子棐登進士第是月御史彭思永蔣之竒以飛語汙公上察其誣斥之公力求去三月壬申除觀文殿學士轉刑部尚書知亳州改賜推誠保徳崇仁翊戴功臣制詞勑朕惟國之大臣毗􅀝於内猶同體之股肱凌雲之羽翼莫之重也至於辤隆自㓗則必徇其雅志而尊顯之蓋所以均其勞逸也方朕守文之初而一德舊老以病自乞章數上矣其可留以佐我而骫進退之節乎推忠恊謀同德佐理功臣特進行尚書左丞參知政事上柱國樂安郡開國公食邑三千八百户食實封一千户歐陽某學通本元􅀖之讜直名重當世士林師法繇樞機之柄任賛廊廟之全謨兩受仍几之託益堅事上之誠踐更三朝出入八載需頭瀝懇守麾是蘄雖詔批不可而其請愈確是用進職書殿增秩秋官授符于价藩分憂於閫􅀉襃渥備矣書不云乎雖爾身在外乃心罔不在王室勉勤所報詎假予訓可特授行刑部尚書充觀文殿學士知亳州軍州亊兼管内何堤勸農使及管勾開治溝洫河道事仍改賜推誠保德崇仁翊戴功臣散官勲封食實封如故吕夏卿行閏三月辛巳宣簽書駐泊公事陛辤乞便道過潁少留許之五月甲辰至亳六月戊申視事熈寜元年戊申是歲連上表乞致仕不允八月乙巳轉兵部尚書改知青州充京東東路安撫使制詞勑朕惟北海九州之古郡而東人之都也近世兩府出入爲均逸之地非耆德峻望不爲􅀝毗推誠保德崇仁翊戴功臣觀文殿學士特進刑部尚書知亳州上柱國樂安郡開國公食邑三千八百户食實封一千户歐陽某以文學自進以器能自任早領樞務旋參大政奏封屢上誠請益堅俾守藩方已逾歳律乃進夏官之秩徃臨海岱之區一道兵農惠綏是賴肅予近服無假訓言可特授行兵部尚書依前充觀文殿學士知青州軍州事兼管内勸農使充京東東路安撫使功臣散官勲封食實封如故仍放謝辤李大臨行九月丙申至青十一月丁亥郊祀恩加食邑五百户食實封二百户制詞勑朕嗣位之初祗見上帝祖考九州四海莫不來􅀕惟二三元老雖爾身在外乃心罔不在王室推恩行爵必先及之推誠保徳崇仁翊戴功臣觀文殿學士特進行兵部尚書上柱國樂安郡開國公食邑三千八百户食實封一千户歐陽某文章􅀫望左右三朝艱難之時寔賴其力進退之節不累於位股肱近鎭玉帛勤王茲朕所以推神休而疏朝寵也乃眷舊德奚煩訓辭可特授依前行兵部尚書充觀文殿學士加食邑五百户食實封二百户功臣散官勲封如故吳充行是歲築第於潁熈寜二年己酉三月内侍王延慶便道傳宣撫問仍賜香藥一銀合又遞賜新校定前漢書以公甞預刋定也冬乞壽州便私計不允熈寜三年庚戌四月壬申除檢校太保宣徽南院使判太原府河東路經略安撫監牧使兼并代澤潞麟府嵐石路兵馬都總管制詞勑國家䂓悏裔邊並建帥領惟河汾之一道搤獯狁之二垂爰咨衮路之賢徃付并門之筦仍遷近府用壯奥藩具官某道德文章爲時矜式謀猷忠亮預政累朝自􅀗解於台司已再更於郡􅀉委逺時柄爾雖樂於燕安尊任賢能朕豈忘於鑒寐眷言大鹵方擇守臣俾從表海之􅀖就改近胡之鎭班通四貴所以褒寵於舊勲節制諸戎所以􅀝成於外閫惟爾同寅之德體予注意之隆亟即新州毋辤逺略可特授檢校太保宣徽南院使判太原府河東路經略安撫使兼并代澤潞麟府嵐石路兵馬都總管功臣散官勲封如故蘇頌行公堅辤不受七月辛卯改知蔡州九月甲寅至蔡是歲更號六一居士熈寜四年辛亥公在蔡累章告老六月甲子以觀文殿學士太子少師致仕制詞勑朕惟左右輔弼之臣以道徳自任者其去就進退莫不有義與命而朝廷優寵遇待不使之蚤告老以去者非獨朕之恩典爲然亦先王之禮意故也以爾推誠保德崇仁翊戴功臣觀文殿學士特進行兵部尚書上柱國樂安郡開國公食邑四千三百户食實封一千二百户歐陽某文章學問遠足以知先王德義謀猷近足以宜當世陟降祕近踐揚茲多嚮繇樞庭參决大政乃能熈天之命克勤王家均休外藩年德方茂而乃安于義命以禮請去至於勤懇雖朕之睠遇有加亦終不能易爾志重以先帝顧命輔朕眇躬勲勞問望顧可以無報稱哉是用度越常典以榮爾歸俾進東宫之師仍兼祕殿之職尚惟率身善俗以助成王德惟良顯哉可持授太子少師依前充觀文殿學士致仕功臣散官勲封食實封如故仍放朝謝張琥行七月歸潁八月將祀明堂詔赴闕陪位公上章乞免從之禮成賜衣帶器幣牲餼熈寜五年壬子閏七月庚午公薨年六十六八月丁亥贈太子太師制詞勑大臣還官告老以高秩尊爵歸第固朝廷所禮異也矧甞參弼大政有兩朝定筞援立之勲徳甚盛而弗居年未至而辤位遽兹長逝宜厚追褒故推誠保德崇仁翊戴功臣觀文殿學士特進太子少師致仕上柱國樂安郡開國公食邑四千三百户食實封一千二百户歐陽某以文章革浮靡之風以道徳鎭流競之俗挺節強毅而不撓當官明辯而莫奪三世寵榮一徳端亮朕方將圖任舊老疇咨肅乂而雅志沖邈必期退休未閱數歲章踰十上在大義難盡其力兹勤請所以不違謂其脫去人間之累當饗期頥之壽天遽殱奪曽靡憖遺覽奏之日爲之不能臨朝儲坊六傅師惟長首舉以爲贈用紓予哀尚其有知享此嘉命可特贈太子太師王益柔行熙寜七年八月諡文忠謚議見附録熈寜八年九月乙酉葬開封府新鄭縣旌賢郷元豐三年十二月以子升朝遇大禮贈太尉制詞勑朕齊明以祀得歆于神維顯及幽並受多祉奉議郎輕車都尉賜緋魚袋歐陽發父皇任觀文殿學士太子少師致仕贈太子太師某以高文典䇿冠絶譽髦以重德令名進參機要踐更事任奮發猷爲諒直公忠簡於朕志逝日逾遠賢聲不忘垂􅁉後昆序朝通籍丁時慶賚愍錫有加尚其營魂膺此明命可特贈太尉王安禮行元豐八年十一月贈太師追封康國公紹聖三年五月追封兖國公制詞勑宗祀之澤充塞穹壤國之故老褒敘有章朝請郎充祕閣校理輕車都尉賜緋魚袋歐陽棐弟通􅀡郎飛􅀐尉辯故父任觀文殿學士太子少師致仕贈太師追封康國公某名世之才出應期運明於輔弼事業而以風節始終餘慶嗣人追命成國亶惟不没尚克享茲可特贈太師追封兖國公中書舍人盛陶行崇寜三年追封秦國公政和三年追封楚國公皆以子樂遇郊恩文忠公年譜不一惟桐川薛齊誼廬陵孫謙益曾三異三家爲詳雖用舊例毎歲列其著述考文力之先後然篇章不容盡載次序寧免疑混如公曾孫建世以告勑宣劄爲編年尚多差互况餘人乎今參稽衆譜傍採史籍而取正於公之文凡居士集外集各於目錄題所撰歲月而闕其不可知者奏議表章之類則隨篇注之定爲文集一百五十三卷居士集五十卷公所定也故寘于首外集二十五卷次之易童子問三卷詩本義别行於世外制集三卷内制集八卷表奏書啓四六集七卷奏議十八卷雜著述十九卷集古錄跋尾十卷又次之書簡十卷終焉考公行狀惟闕歸榮集一卷徃徃散在外集更俟博求别有附錄五卷紀公德業此譜專敘出處詞簡而事粗備覽者當自得之慶元二年二月十五日郡人登仕郎胡柯謹記易童子問卷第一歐陽文忠公集七十六童子問曰乾元亨利貞何謂也曰衆辭淆亂質諸聖􅂏者聖人之言也童子曰然則乾無四德而文言非聖人書乎曰是魯穆姜之言也在襄公之九年童子問曰象曰天行徤君子以自強不息何謂也曰其傳久矣而世無疑焉吾獨疑之也蓋聖人取象所以明卦也故曰天行健乾而嫌其執於象也則又以人事言之故曰君子以自強不息六十四卦皆然也易之闕文多矣童子問曰乾曰用九坤曰用六何謂也曰釋所以不用七八也乾爻七九則變坤爻八六則變易用變以爲占故以名其爻也陽過乎亢則災數至九而必變故曰見群龍無首吉物極則反數窮則變天道之常也故曰天德不可爲首也隂柔之動多入於邪聖人因其變以戒之故曰利永貞童子問曰屯之􅂏象與卦之義反何謂也曰吾不知也童子曰屯之卦辭曰勿用有攸徃􅂏曰動乎險中大亨貞動而大亨其不徃乎象曰君子以經綸不徃而能經綸乎曰居屯之世者勿用有攸徃衆人也治屯之時者動乎險而經綸之大人君子也故曰利建侯童子問曰象曰山下岀泉蒙君子以果行育德何謂也曰􅂪者未知所適之時也處乎蒙者果於自信其行以育德而巳蒙有時而發也患乎不果於自脩以飬其德而待也童子問曰象曰雲上於天需君子以飲食宴樂何謂也曰需須也事有期而時將至也雲巳在天澤將施也君子之時將及矣少待之焉飲食以飬其體宴安和樂以飬其志有待之道也童子問曰師貞丈人何謂也曰師正於丈人也其􅂏曰能以衆正可以王矣童子曰敢問可以王矣孰能當之曰湯武是巳彼二王者以臣伐主其爲毒也甚矣然其以本於順民之欲而除其害猶毒藥瞑眩以去疾也故其􅂏又曰行險而順以此毒天下而民從之童子曰然則湯武之師正乎曰凡師必正於丈人者文王之志也以此毒天下而王者湯武也湯武以應天順人爲心故孟子曰有湯武之心則可也童子曰吉無咎何謂也曰爲易之說者謂無咎者本有咎也又曰善補過也嗚呼舉師之成功莫大於王也然不免毒天下而僅得補過無咎以此見兵非聖王之所務而湯武不足貴也童子問曰地上有水比先王以建萬國親諸侯何謂也曰王氏之傳曰萬國以比建諸侯以比親得之矣蓋王者之於天下不可以獨比也故建爲萬國君以諸侯使其民各比其君而萬國之君共比於王則視天下如身之使臂臂之使指矣童子問曰同人之􅂏曰唯君子爲能通天下之志象又曰君子以􅀋族辨物何謂也曰通天下之志者同人也􅀋族辨物者同物也夫同天下者不可以一槩必使夫各得其同也人睽其􅀋而同其欲則志通物安其族而同其生則各從其􅀋故君子於人則通其志於物則􅀋其族使各得其同也童子問曰天道虧盈而益謙地道變盈而流謙􅀑神害盈而福謙人道惡盈而好謙何謂也曰聖人急於人事者也天人之際罕言焉惟謙之􅂏略具其說矣聖人人也知人而巳天地􅀑神不可知故推其迹人可知者故􅀡言其情以人之情而推天地􅀑神之迹無以異也然則脩吾人事而巳人事脩則與天地􅀑神合矣童子問曰雷出地奮豫先王以作樂崇德殷薦之上帝以配祖考何謂也曰於此見聖人之用心矣聖人憂以天下樂以天下其樂也薦之上帝祖考而已其身不與焉衆人之豫豫其身耳聖人以天下爲心者也是故以天下之憂爲已憂以天下之樂爲已樂童子問曰觀之象曰先王以省方觀民設教何謂也曰聖人處乎人上而下觀於民各因其方順其俗而教之民知各安其生而不知聖人所以順之者此所謂神道設教也童子曰順民先王之所難歟曰後王之不戾民者鮮矣童子問曰剥不利有攸徃􅂏曰順而止之觀象也君子尚消息盈虚天行也者何謂也曰剥隂剥陽也小人道長君子道消之時也故曰不利有攸徃君子於此時而止與屯之勿徃異矣屯之世衆人冝勿徃而君子動以經綸之時也剥者君子止而不徃之時也剥盡則復否極則泰消必有息盈必有虛天道也是以君子尚之故順其時而止亦有時而進也童子問曰復其見天地之心乎者何謂也曰天地之心見乎動復也一陽初動於下矣天地所以生育萬物者本於此故曰天地之心也天地以生物爲心者也其􅂏曰剛反動而以順行是矣童子曰然則象曰先王以至日閉關商旅不行后不省方豈非静乎曰至日者隂陽􅀄復之際也其來甚微聖人安靜以順其微至其盛然後有所爲也不亦冝哉童子問曰大過之卦辭曰利有攸徃亨其象曰君子以獨立不懼遯世無悶者其徃乎其遯乎曰易非一體之書而卦不爲一人設也大過者橈敗之世可以大有爲矣當物極則反易爲之力之時是以徃而必亨也然有不以爲利而不爲者矣故居是時也徃者利而亨遯者獨立而無悶童子問曰坎之卦曰習坎其􅂏曰習坎重險也者何謂也曰坎因重險之象以戒人之愼習也習高山者可以追猿猱習深淵者至能泅泳出没以爲樂夫險可習則天下之事無不可爲也是以聖人於此戒人之習惡而不自知誘人於習善而不倦故其象曰君子以常德行習教事也童子問曰咸取女吉何謂也曰咸感也其卦以剛下柔故其􅂏曰男下女是以取女吉也童子又曰然則男女同􅀋歟曰男女睽而其志通謂各睽其􅀋也凡柔與柔爲􅀋剛與剛爲􅀋謂感必同􅀋則以柔應柔以剛應剛可以爲咸乎故必二氣交感然後爲咸也夫物􅀋同者自同也何所感哉惟異􅀋而合然後見其感也鐵石無情之物也而以磁石引針則雖隔物而應􅂏曰觀其所感而萬物之情可見者謂此􅀋也童子又曰然則聖人感人心而天下和平是果異􅀋乎曰天下之廣蠻夷戎狄四海九州之􅀋不勝其異也而能一以感之此王者所以爲大聖人所以爲能童子問曰恒利有攸徃終則有始何謂也曰恒之爲言久也所謂窮則變變則通通則久也久於其道者知變之謂也天地升降而不息故曰天地之道久而不已也日月徃來與天偕行而不息故曰日月得天而能久照四時代謝循環而不息故曰四時變化而久成聖人者尚消息盈虚而知進退存亡者也故曰聖人久於其道而化成童子問曰遯亨小利貞何謂也曰遯隂進而陽遯也遯者見之先也隂進至于否則不正利矣遯者隂浸而未盛陽能先見而遯猶得小利其正焉童子問曰明入地中明夷君子以莅衆用晦而明何謂也曰日君象也而下入干地君道晦而天下暗矣大哉萬物各得其隨則君子嚮晦而入宴息天下暗而思明則君子出而臨衆商紂之晦周道之明也因其晦發其明故曰用晦而明童子曰然則聖人貴之乎曰不貴也聖人非武王而貴文王矣童子問曰家人利女貞何謂也其不利君子之正乎曰是何言歟􅂏不云乎女正位乎内男正位乎外也曰然則何爲獨言利女正曰家道主於内故女正乎内則一家正矣凡家人之禍未有不始於女子者也此所以戒也嗚呼事無不利於正未有不正而利者聖人於卦隨事以爲言故於坤則利牝馬之正於同人則利君子正於明夷則利艱正於家人則利女正童子問曰睽之􅂏與卦辭之義反何謂也曰吾不知也童子曰睽之卦曰小事吉􅂏曰睽之時用大矣哉曰小事睽則吉大事睽則㓙也凡睽於此者必有合於彼地睽其下而升天睽其上而降則上下交而爲泰是謂小睽而大合使天地睽而上下不交則否矣聖人因其小睽而通其大利故曰天地睽而其事同男女睽而其志通萬物睽而其事􅀋其象又曰君子以同而異易童子問卷第一書簡卷第一歐陽文忠公集一百四十四與韓忠獻王稚圭慶曆二年􅁱頓首再拜啓仲秋漸涼伏惟觀察太尉尊候動止萬福􅁱至愚極陋不足以獻思慮於聦明至於􅁱記以問起居則當大君子憂國之時又非冝􅂺一作以干視聽是以書牘之禮曠絶一作而逾年然而千里之外威譽之聲日至京師如在耳目可以見作鎮方面懾動羌戎撫循之間優有餘􅁉此􅁱不勝西首企望拳拳之誠􅀻自爲慰者也伏念脩材薄力弱不堪世用徒􅀎少一無此字以文字之樂爲事而國家久安於無爲儒學之士莫知形容幸今剪除叛羌開拓西域紀功耀徳兹也爲時惟俟凱歌東來函馘獻廟執筆吮墨作爲詩頌以述大賢之功業以􅀭聖宋之威靈雖曰懦焉亦區區之鄙志也謹奉手啓咨問伏惟俯賜鑒察謹啓八月日太子中允集賢校理歐陽􅁱啓上又慶曆五年某頓首啓冬序極寒不審資政諌議尊候動止何若昨者偶趨府下過煩主禮自到郡踰月尚稽候問豈勝愧悚某􅀌拙多累蒙朝廷保全之恩得此郡地僻事簡飲食之物奉親頗便終日尸禄未知論報之方用此不皇爾瞻望盛府數程之近時得通訊下執謹因請絹人行附此以道萬一新歲甫邇伏乞爲國自重下情禱詠之至又同前某頓首啓近因州吏詣府請絹曽拜狀急足至特辱手書爲誨伏審􅂂此凝寒台候萬福豈勝慰抃之誠某此藏拙幸今歲淮甸大雪來春二麥有望若人不爲盗而郡素無事何幸如之惟尸禄端居未能報國此爲愧爾瞻望旌棨惟願爲國自重以副禱頌又慶曆六年某再拜啓山州窮絶比乏水泉昨夏秋之􅀄偶得一泉於州城之西南豐山之谷中水味甘冷因愛其山􅀔回抱構小亭於泉側又理其傍爲教􅂣時集州兵弓手閱其習射以警饑年之盗間亦與郡官宴集于其中方惜此幽致思得佳木羙草植之忽辱寵示芍藥十種豈勝欣荷山民雖陋亦喜遨遊今春寒食見州人靚裝盛服但於城上巡行便爲春遊自此得與郡人共樂實出厚賜也愧刻愧刻又同前某頓首啓季冬極寒伏惟某官尊體動止萬福某幸守僻陋咫尺大府常闕􅁱問左右然幸尸禄奉親軄事日益簡少養拙自便遂成習性但時自警而已冬深少雪氣候巳春和伏惟爲國自重以副瞻頌之誠又同前某啓近急足還嘗略拜問歲暮晴和伏惟台候動止萬福本州張推官欲造棨㦸云舊岀門下此人涖官㢘善謹守其軄亦可自了恐不見多年要知本官行止謹此拜聞又慶暦八年某頓首仲春下旬到郡領軄踈簡之性久習安閑當此孔道動須勉彊但日詢故老去思之言遵範遺政謹守而已其餘􅅟舍城池􅁆世之利無復増修完小小斯不敢廢壞爾今年蝗蝻稍稍生長二麥雖豐􅀨損其半民間極不易猶頼盗賊不作伏恐要知齪齪之才已難開展又值罷絶回易諸事裁損日憂不濟此尤苦爾南北遼逺音信難頻輙此忉忉以煩視聴慙悚慙悚又皇祐元年某頓首啓自去春􅀄到維􅀭嘗因蔡中孚人行奉狀自後區區不覺踰歲即日春暄不審尊候動止何似某昨以目疾爲苦因少􅀻便求得汝隂仲春􅀄旬已趨官所廣陵嘗得明公鎮撫民俗去思未逺幸遵遺矩莫敢有踰獨平山堂占勝蜀岡江南諸山一目千里以至大明井瓊花二亭此三者拾公之遺以繼盛羙爾大明井曰羙泉亭瓊花曰無􅀟亭汝隂西湖天下勝絶養愚自便誠得其冝然尸禄苟安何以報國感愧感愧邉防之事動繫安危伏惟經略之餘爲國自重又皇祐二年某頓首啓冬寒伏惟台候萬福􅁱前在潁曽一拜狀尋以移守南都苦於當道頗闕修問徒切瞻思專使枉道手書爲賜佩服感慰何可勝言北俗􅀩恵邉防有條冝歸大用以及天下不勝禱望之至謹奉狀叙謝又皇祐二年􅁱啓辱示諭邉備有倫此巳得之􅀓者乆矣閱古事蹟尤見大君子之用心動必有益于人也盛製記文并孔子廟嶽廟等記並於杜公處􅀼覽已􅀗祕傳然􅀻怪明公見遺獨不見􅀉謂於庸鄙有所惜者何邪見索亂道敢不勉彊苟得附方尺之木于梁棟間寓名諸公之後爲幸多矣所恨文字汙公好屋爾前在潁承示碑文甚多愧荷之懇已嘗附狀今者人至又恵宋公碑二木事蹟辭翰可令人想慕張迪碑并八關齋記此之所有聊答厚賜某皇恐又同前某啓冬候凝寒伏惟某官尊體動止萬福十二日所遣人至伏承賜書誨諭勤勤且榮且感嗣以近製石本俾之拭目信所謂未有不求而得之者則前之干請誠不爲非也惶恐惶恐公之徳業固巳偉然於當世矣而今又以文章筆札垂示不朽伏讀展玩之際因思窮邉武俗耳目乍此炤耀其喧傳驚動冝如何㢤後世之見者想公爲人魁傑雄偉又冝如何㢤􅀃者謂天不以全羙賦人某不信也某自夏入秋苦於親疾以故乆不修問謹因人還附此爲謝伏惟幸察又皇祐三年某頓首啓自夏迄今以老母卧疾營求醫藥加以京東盗賊縱橫朝廷督責甚急公􅀻多故遂闕拜狀中間伏承陞軄留任亦以無由馳賀但深悚仄而巳專人至辱書爲賜具審爲朝自重日膺多福邉隅巳熟恩信兵民已安衣食當還廟堂以副公議此非小子之􅀻祝真切真切冨公移蔡亦便親而請也恐却以親疾難於移動未嘗求徐然此歲滿得徙亦其幸也某再拜又皇祐四年某叩頭泣血罪逆哀苦無所告訴特􅀩台念逺賜誨言雖在哀迷實知感咽昨大禍蒼卒不知所歸遽來居潁苟存殘喘承賜恤問敢此勉述其諸􅀌苦不􅀎具道秋序已冷伏冀順時爲國自重哀誠所望又至和元年某啓伏蒙寵示閱古堂碑三本豈勝榮幸公之徳業當施本朝耀青史而刻金石淹留邉郡閑暇之餘尚足以爲一方故事煥赫塞上􅀼顧小子亦得列于衆作之間既足爲榮亦可愧也感悚感悚范公人之云亡天下歎息昨其家以銘見責雖在哀苦義所難辭然極難爲文也伏恐要知又同前某啓近范純仁寺丞見過得覩所製奏議集序豈勝榮幸文正遺忠􅀗存於不朽亦勸善之道也某亦爲其子迫令作神道碑不􅀗辭然惟范公道大材閎非拙辭所能述冨公墓刻直筆不􅀮所紀已詳而群賢各有撰述實難措手於其間近自服除雖勉牽課百不述一二今逺馳以干視聽惟公於文正契至深厚出入同於盡瘁􅀼慮有紀述未詳及所差誤敢乞􅃌諭教之此繫國家天下公議故敢以請死罪死罪又同前某啓昨自居憂服除便得召乃敢離潁至都見日便乞蒲同朝旨俾留遂領銓筦尋以引人事遽出同州入辭之際恩旨又留且領殘書旣而遂􅀍兹命􅀌拙多艱無所􅀘報屢招論議常黷上聦寵禄難忝若何爲效恐終碌碌以爲知已之羞乆不拜狀出處多滯故敢略序范公碑如所教悉已改正但候橋川檢得希文奏議實在賊界恐知之某又上又同前􅁱啓昨自服除召還闕出處不定皆由蹇拙使然諒惟悉察自忝此軄嘗於遞附啓爲謝某衰病鬚􅁂悉白兩目昬花豈復更有榮進之望而天下責望過重恨無所爲進不􅀎􅀘益朝廷退不􅀎一作得決去恐碌碌遂爲庸人以貽知己之羞爾夙夜愧懼不知何以見教願聞誨勒之言真切真切師魯及其兄子漸皆以今年十二月葬某昨爲他作墓誌事有不備知公爲作表甚詳使其不泯於後大幸大幸范公表已依所教改正只是大順時撿得希文當􅀄奏議是在賊地中伏恐要知又嘉祐元年某頓首啓秋暑尚繁不審三司尚書尊體動止何似伏覩制書以天下之計資天下之才雖未足以施䕫稷一作契之業致堯舜之道以與至治以副具瞻而天災水旱之時民困國貧之際上有以寛旰食之憂下有以救飢寒之急此縉紳之君子閭巷之愚民所以聞命之日欣歡鼓舞而引首北望惟恐來朝之緩也脩言不足信於人才不足用於世事有不得巳而未􅀎引去徒與衆人同其喜慰伏計大斾即日在塗伏惟爲國自重謹奉啓咨候不宣脩頓首再拜又嘉祐三年某頓首啓自明公進用雖愚拙有以竭其思慮效萬一禆􅀘之而久無一言甚可責也今􅀼見國子監直講梅堯臣以文行知名以梅之名而公之樂善冝不待某言固已知之久矣其人窮困于時亦不待某言而可知也中外士大夫之議皆願公薦之館閣梅得出公之門一羙事也公之薦梅一羙事也朝廷得此舉一羙事也某不敢以一言而譲三羙故言之雖公而不敢􅂥公賜擇焉惶恐惶恐又嘉祐治平間某啓兩日不奉宴言豈勝瞻系伏承台候稍爾愆和不審晚來起居何似氣脉小小留滯微行必遂清康旦夕拜見且此拜聞又同前某頓首啓數日不奉餘論􅀼承台候微傷風冷喜巳康和秋暑尚有殘歊更冀特加精攝無由咨候賔次謹勒此馳啓上問過旬休必􅀗瞻奉兹不盡區區又治平年某啓不奉顔色忽已經旬霜寒伏惟台候動􅂂清福􅀼承表啓累上聖意決不少疑量斯􅀔也似非辯􅀃可入莫且當勉屈髙􅁩兼副中外人情否某衰病最冝先去者尚此遲疑矧公繫國體重豈可輕議昔人歎好事難必成皆此􅁼也旦夕瞻近姑此以道愚見幸髙明裁察也惶恐惶恐又治平元年某啓晚來伏承台候萬福辱簡誨俾􅁧先令公真賛前世文人喜爲聖賢記述蓋欲自託以垂名矧盛徳清芬備載史牒但恐衰病乆廢筆硯不􅀎稱道萬一當試勉彊以應嘉命值夜草草又同前某啓承教俾作魏國令公真賛屢日杼思不勝艱訥蓋以鉅徳難名非委曲莫究萬一而滯於簡拙遂至窘窮實辱嘉命惟􅀒慚恐勉自録呈又治平年某啓某以􅀻門薄祐少苦終鮮惟存二姪又喪其一衰晚感痛情實難勝仰煩台慈特賜慰䘏豈任哀感之至酷暑復盛伏承台候萬福來日參假當奉言侍謹且附此叙謝又治平年某頓首啓不􅀗瞻奉忽復數日秋暑伏承台候萬福某以餘毒所攻頸頰間又爲腫核第以不入咽喉比前所苦差輕旦夕欲且勉出重煩台念特賜存問不勝感愧區區謹奉此叙謝又治平年某啓不􅀗瞻見等閑數日餘暑尚繁不審台候動履何似􅀼承有外訃之戚方此炎熾伏冀節損悲悼爲朝自愛無由馳謁門屏謹奉此陳慰又治平年某啓至日不􅀗展慶不勝馳情伏惟履長納吉爲國耆老永副中外之具瞻某所苦悉已平蓋得節假中飽於將理尚煩憂恤手筆存問其爲感激併留靣叙人還粗布萬一又治平年某啓日夕風凛伏喜台候萬福重辱手誨仰認意愛之深某所以欲速出者蓋家居不遑安爾謹當更與醫工審議昨亦有一劄乞更寛數日皆寂然所以尤難安處或因方便特爲略言及豈勝大幸承諭曽見與叔平簡拙疾更不復云惟乞不賜憂軫皇恐皇恐又治平四年某啓不侍台席忽復彌旬經節伏承動履清福杜門俟命已上三表便值休假方欲旦夕馳布懇誠于左右忽辱恵一作誨翰感慰兼深某去就之際不惟果於自決而相知者皆勉以必去不疑亮公見愛素深意必不殊也此來頼君相之明爲之辨别皎然明白中外無所疑惑矣則某之引去不嫌稍速所推恩禮不必過優使災難中遂逃禍咎而保安全於始終􅀩徳不淺矣區區所欲述者此爾伏惟幸察又治平三年某啓早暮遂凉伏承台候萬福昨日辱以相臺園池記爲貺俾得拭目辭翰之雄粲然如見衆製髙下映發之麗而樂然如與都人士女遊嬉於其間也榮幸榮幸晝錦書刻精好但以衰退之文不稱爲慚而又以得託名子後爲幸也衆篇一時盛事徃徃佳作咸得珎藏豈勝感愧昨夕偶數客坐中不時布謝皇恐皇恐謹奉此咨啓又嘉祐八年誤寘此某頓首啓板橋怱遽攀違忽復旬浹氣節遂爾寒凝伏惟台候萬福龍旌即路幸此晴明然而跋履之勞事務叢委􅀼計倍煩神用更乞爲朝自重以副傾依下情區區又治平四年某啓冬序始寒不審台候動止何似􅀼承懇請之堅遂解機政處大位居成功古人之所難公保榮名􅀍殊寵進退之際從容有餘徳業兩全讒謗自止過於周公逺矣然而朝廷慮則元老遽去􅀻自計則􅀌危失恃此不能不惘然爾其他區區非筆墨所可旣惶恐惶恐又同前某啓自承遂解政機岀鎮便郡尋奉拙記計已通呈遽審殊命優禮悉已懇辭又當馳賀也某藏拙於此幸亦優閑而衰病侵攻略無寜日歸心愈切然素計亦稍有緒也􅀼計大斾非晚啓行無由瞻望寒中伏冀爲國自重區區不宣又熈寜元年某啓東州難得酒村郡醖不堪爲信惟羔羊新得法造又以傷生不能多作然謂一無此字其味尚可少薦樽爼輕瀆台嚴惶恐惶恐又熈寜年某頓首嚮嘗以拙惡應命深愧唐突乃􅀩不鄙以之刻石得子履鉅筆錯之佳處因公勝迹託附之傳其爲榮幸多矣感惕感惕某近秋冬以來目病尤苦遂不復近筆硯小詩亦不曽作心志蕭條但思歸爾承諭臟腹多不調更乞節慎飲食酒能少戒尤佳某一向不飲遂不復思無由少侍談席區區不布萬一又熈寜二年某啓專使至􅀗捧台翰伏承經寒動止萬福下情欣慰某以病目艱於執筆稍闕拜問其爲傾嚮之勤則未始少怠也某幸東州歲豐事簡居巳踰年已再削乞壽陽蓋陳蔡􅀔難乞惟壽近潁亦便於歸計爾益逺旌棨新春伏惟爲國保重又熈寜三年某頓首啓近昨過鄆瞻望留都纔三四驛因假急足拜問粗布區區不謂逺煩專介直走淮濵誨諭勤勤仰認意愛兼審秋寒台候動止萬福下情豈勝感慰脩過潁少留以足疾爲苦不久勉之官守情悰索然素志未遂其餘鄙冗莫道萬一惟乞爲國自重以副具瞻又同前某啓某去秋留潁月餘嘗因急足還府附狀自爾勉力病軀祗赴官所忽忽遂見窮臘即日凝凛伏惟鎮撫之餘台候動止萬福某昨􅀩上恩察其實爲病瘁得蔡如請土俗淳厚本自閑僻日生新事條目固繁然上下官吏畏罰趨賞不患不及而老病昬然不復敢措意於其間若郡縣平日常事則絶爲稀少足以養拙偷安俟日而去爾甚幸甚幸荷公見愛之深欲知其如此爾歲暮雪寒伏乞爲國加愛又同前某啓立朝雖乆忝冒實多而未有卓然可稱於人者􅀩公愛念贈以嘉篇語重文雄過形襃借何以當克但祕藏榮感而巳拙句唐突大匠出於勉彊慙恐慙恐某自至蔡遂不曽作詩老年力盡兼亦憂畏頗多冀靜黙以安退藏爾又熈寜四年某啓近嘗奉記粗布區區􅀼計巳投几格專使忽至特枉親翰伏承經寒鎮撫之餘台候動履萬福豈勝感慰之極某衰病如昨老年憂畏旦暮未去間俛黙苟偷如前書所述爾忽忽又見新春惟乞爲國愛重以副中外瞻􅀝之望又同前某啓辱貺齋醖尤爲醇羙第小􅀖鮮嘉客老病少歡意不得如侍台席時豪飲之量爾可歎可歎近以序傳拜呈塵浼聽覽蓋嚮在潁因欲遂留而當權者猜忌聊以自解爾進退之間其難如此可懼也千萬保重以慰勤企又同前某頓首再拜近急足還府奉􅃺粗布謝懇新正令節限以官守無由一厠賀賔之列元勲柱石神明所相百福來臻春氣尚寒伏惟爲朝愛重上副眷􅀝下情祝頌之至又同前某啓特承寵示歸榮等五篇刻石俾遂拭目豈勝榮幸唐世勲徳鉅公爲不少而雄文逸翰兼羙獨擅孰能臻於斯也某以朽病之餘事事衰退然猶不量力不覺勉強者􅀼冀附託以爲榮爾見索拙惡不能藏黙謹以録呈慙罪慙罪某又上又同前某啓向嘗􅂺以拙詩塵浼台聽尋􅀩特賜寵和不惟以慰寂寥而雄文大句固已警動人之耳目屬閑居杜門難偶信便遂稽布謝豈勝感􅄑愧恐之至也因王郎中詣府的便少道萬一與冨文忠公彦國天聖明道間某頓首白彦國自西歸於今巳踰月無由一􅆀書蓋相別後患一大疽爲苦乆之不暇求西人行者然亦時時有客自西來獨怪彦國了無一書又疑其人不的於叚氏僕夫來􅃱㡬道書此人最的冝有書又無然後果可怪也始與足下相别時屢一作累累邀聖俞語謂書者雖於交朋間不以䟽數爲厚薄然旣不得羣居相􅀏語盡心有此猶足以通相思知動靜是不可忽苟不能具寸紙數行亦可易􅃱則可頻􅃱猶勝都不􅃱也當時相顧切切用要約如此謂今别後冝馬朝西而書夕東也不意足下自執牛耳登壇先喢降壇而吐之何邪平生與足下語思欲力行者事何限此尺寸紙爲俗累牽之不能勉強嚮所云云使僕何聖㢤洛陽去京爲僻逺孰與絳之去京師也今尚爾至絳又可知矣自相别後非見聖俞無一可語者思得足下一書不啻飢渇故不能不忉忉也秋暑差盛千萬自愛又嘉祐元年某啓暑雨不審台候何似有蜀人蘇洵者文學之士也自云奔走徳望思一見而無所求然洵逺人以謂某能取信於公者求爲先容旣不可却亦不忍欺􅂺以冐聞可否進退則在公命也又嘉祐七年某啓慰䟽巳具如别春候暄冷不常不審孝履何似伏惟以時順變徇禮節哀上副人主之眷懐下爲士民自重某自承乏東府忽已半歳碌碌無稱厚顔俯仰尚思一有論報而去然勉強庸拙不知所爲苟終止若斯顧亦安能遲乆不待彈劾當自爲計也未知尚有可教否無由瞻近豈勝下懐時事多端伊洛過客相踵必有能道其大㮣者其他委細亦非筆墨可殫也謹因遣人萬不布一某又拜又嘉祐八年某頓首啓近馳賀懇少布􅀻誠伏承大斾已及近郊道路盛暑竊審台候萬福實慰區區瞻跂之勤朝廷新有大故時事多艱舊徳元臣與國同體馳􅀐奔走不惟出處之節得冝與來者爲法康時濟物愚智所同有望於馬首之來也餘如前書所述也旦夕當得瞻見顔色第因張師逺行不可無書謹奉手啓咨問又同前某啓忽承手誨以屢辭新命未得請俾有所開陳敢不如教然愚􅀼以公自元宰還首西樞懇請而從則恩典未見其過但公以避災爲意思欲深自退抑此與上待元老之意本不相爲謀也亦竊見􅀄一劄自後更不降岀上亦未嘗語及豈非事巳決定無可商量邪若徳音有所詢當具道如所教也秋凉喜承台候萬福謹奉此不宣又治平二年某啓餘暑未祛㐲承台候動履清福人至辱賜簡豈勝感服自公在告爲常制所拘不得時伸候見固以爲恨今者大斾當西不一造門下􅀼意不近人情兼料諸公意必同此所以雖承誨勒未敢聞命也皇恐皇恐人還謹此不宣書簡卷第一與韓忠獻王第一帖尊候一作尊體以問一作候問第九帖曽一拜狀曽一作嘗第十五帖拙辭一作拙訥第十九帖自明公三字上一有伏字第二十二帖尚此一作尚尓第二十五帖仰煩一作特煩特賜一作曲賜第三十五帖酒村村疑作材第四十二帖不得一作不復歸田録卷第一歐陽文忠公集一百二十六太祖皇帝初幸相􅀦寺至佛像前焼香問當拜與不拜僧録賛寧奏曰不拜問其何故對曰見在佛不拜過去佛賛寧者頗知書有口辯其語雖􅀋俳優然適會上意故㣲􅀏而頷之遂以為定制至今行幸焚香皆不拜也議者以為得禮開寳寺塔在京師諸塔中最髙而制度甚精都料匠預浩􅀁造也塔初成望之不正而􅀔傾西北人怪而問之浩曰京師地平無山而多西北風吹之不百年當正也其用心之精盖如此國朝以来木工一人而巳至今木工皆以預都料為法有木􅀴三卷行扵世世傳浩惟一女年十餘􅀊每卧則交手於胷爲結􅌟状如此踰年撰成木經三卷仐行於世者是也國朝之制知制誥必先試而後命有國以来百年不試而命者􅂊三人陳尭佐楊億及脩忝與其一爾仁宗在東宫魯肅簡公宗道為諭徳其居在宋門外俗謂之浴堂巷有酒肆在其側號仁和酒有名於京師公往往易服一作衣㣲行飲于其中一日真宗急召公􅀅有􅀁問使者及門而公不在移時乃自仁和肆中飲歸中使遽先入白乃與公約曰上若怪公来遲當託何事以對幸先見教冀不異同公曰但以實告中使曰然則當得罪公曰飲酒人之常情欺君臣子之大罪一作罪大也中使嗟歎而去真宗果問使者具如公對真宗問曰一作公何故私入酒家公謝曰臣家貧無􅄊皿酒肆百物具一作俱備賔至如歸適有郷里親客自逺来遂與之飲然臣既易服市人亦無識臣者真宗􅀏曰卿為宫臣恐為御史􅀁彈然自此竒公以為忠實可大用晚年每為章獻明肅太后言群臣可大用者􅁆人公其一也其後章獻皆用之太宗時親試進士每以先進卷子者賜第一人及第孫何與李庶㡬同在科􅂣皆有時名庶㡬文思敏速何􅀹苦思遲會言事者上言舉子􅁿薄為文不求義理惟以敏速相誇囙言庶㡬與舉子於餅肆中作賦以一餅熟成一韻者為勝太宗聞之大怒是􅀊殿試庶㡬最先進卷子􅃍叱出之由是何為第一故參知政事丁公度晁公宗慤往時同在館中喜相諧謔晁囙遷職以啓謝丁時丁方為群牧判官乃戯晁曰啓事更不奉答當以糞墼一車為報晁答曰得墼勝於得啓聞者以為善對石資政中立好諧謔士大夫能道其語者甚多甞囙入朝遇荆王迎授東華門不得入遂自左掖門入有一朝士好事語言問石云何為自左去聲掖門入石方趂班且走且答曰秖為大音柂王迎授聞者無不大笑楊大年方與客棊石自外至坐扵一隅大年因誦賈􅁩鵩賦以戯之云止扵坐隅貌甚閑暇石遽答曰口不能言請對以臆故老能言五代時事者云馮相道和相凝同在中書一日和問馮曰公靴新買其直㡬何馮舉左足示和曰九百和性􅄶急遽回顧小吏云吾靴何得用一千八百因詬責乆之馮徐舉其右足曰此亦九百扵是烘堂大笑時謂宰相如此何以鎮服百僚錢副樞若水嘗遇異人傳相法其事甚怪錢公後傳楊大年故世稱此二人有知人之鑒仲簡􅀭州人也少習明經以貧傭書大年門下大年一見奇之曰子當進士及第官至清顯乃教以詩賦簡天禧中舉進士第一甲及第官至正郎天章閣待制以卒謝希深為奉禮郎大年􅀹喜其文每見則欣然延接既去則歎息不已鄭天休在公門下見其如此怪而問之大年曰此子官亦清要但年不及中壽爾希深官至兵部員外郎知制誥卒年四十六皆如其言希深􅀄以奉禮郎鎖􅈦應進士舉以啓事謁見大年有云曵鈴其空上念無君子者解組不顧公其如蒼生何大年自書此四句于扇曰此文中虎也由是知名太祖時郭進為西山廵檢有告其隂通河東劉􅁇元􅀅有異志者太祖大怒以其誣害忠臣命縛其人予進使自䖏置進得而不殺謂曰爾䏻為我取􅁇元一城一寨不止贖爾死當請賞爾一官􅀊餘其人誘其一城来降進具其事送之于朝請賞以官太祖曰爾誣害我忠良此􅂊可贖死爾賞不可得也命以其人還進進復請曰使臣失信則不能用人矣太祖於是賞以一官君臣之間盖如此魯肅簡公立朝剛正嫉惡少容小人惡之私目為魚頭當章獻垂簾時屢有補益讜言正論士大夫多䏻道之公既卒太常謚曰剛簡議者不知為羙謚以為囙謚譏之竟改曰肅簡公與張文節公知白當垂簾之際同在中書二公皆以清莭直道為一時名臣而魯尤簡易若曰剛簡尤得其實也宋尚書祁為布衣時未為人知孫宣公奭一見竒之遂為知己後宋舉進士驟有時名故世稱宣公知人公嘗語其一無此字門下客曰近世謚用兩字而文臣必謚為文皆非古也吾死得謚曰宣若戴足矣及公之卒宋方為禮官遂謚曰宣成其志也嘉祐二年樞宻使田公况罷為尚書右丞􅀚文殿學士兼翰林侍讀學士罷樞宻使當降麻而止以制除盖往時髙若訥罷樞宻使所除官職正與田公同亦不降麻遂以為故事真宗時丁晉公謂自平江軍節度使除兵部尚書叅知政事節度使當降麻而朝議惜之遂止以制除近者陳相執中罷使相除僕射乃降麻龐籍罷莭度使除􅀚文殿大學士又不降麻盖無定制也寳元康定之間余自貶􅀁還過京師見王君貺初作􅃕人自契丹使歸余時在坐見都知押班殿前馬歩軍聮􅀐立門外呈榜子稱不敢求見舍人遣人謝之而去至一無此字慶暦三年余作􅃕人此禮已廢然三衙管軍臣僚於道路相逢望見􅃕人呵引者即歛馬駐立前呵者傳聲太尉立馬急遣人謝之比􅃕人馬過然後敢行後子官于外十年而還遂入翰林爲學士見三衙呵引甚雄不復如當時與學士相逢分道而過更無斂避之禮盖兩制漸輕而三衙漸重舊制侍衛親軍與殿前分爲兩司自侍衛司不置馬歩軍都􅃌揮使止置馬軍􅃌揮使歩軍指揮使一止作馬歩軍指揮使以来侍衛一司自分為二故與殿前司列為三衙也五代軍制已無典法而今又非其舊制者多矣國家開寳中􅀁鑄錢文曰宋通元寳至寳元中則曰皇宋通寳近世錢文皆著年號惟此二錢不然者以年號有寳字文不可重故也太祖建隆六年􅀅議改元語􅈗相勿用前世舊號於是改元乾徳其後囙於禁中見内人鏡背有乾徳之號以問學士陶穀榖曰此偽蜀時年號也囙問内人乃是故蜀王時人太祖由是益重儒士而歎􅈗相一有之字寡聞也仁宗即位改元天聖時章獻明肅太后臨朝稱制議者謂撰號者取天字於文為二人以為二人聖者恱太后爾至九年改元明道又以為明字於文日月並也與二人㫖同無何以犯契丹諱明年􅃍一作遂改曰景祐是時連􅀊天下大旱改元詔意冀以迎和氣也五年囙郊又改元曰寳元自景祐初群臣慕唐玄宗以開元加尊號遂請加景祏於尊號之上至寳元亦然是􅀊趙元昊以河西叛改姓元氏朝廷惡之􅃍改元曰康定而不復加於尊號而好事者又曰康定乃謚爾明年又改曰慶曆至九年大旱河北尤甚民死者十八九扵是又改元曰皇祐猶景祐也六年日蝕四月朔以謂正陽之月自古所忌又改元曰至和三年仁宗不豫久之康復又改元曰嘉祐自天聖至此凡年號九皆有謂也㓂忠愍公準之貶也􅀄以列卿知安州既而又貶衡州副使又貶道州别駕遂貶雷州司戸時丁晉公與馮相拯在中書丁當秉筆􅀄欲貶崖州而丁忽自疑語馮曰崖州再渉鯨波如何馮唯唯而巳丁乃徐擬雷州及丁之貶也馮遂擬崖州當時好事者相語曰若見雷州㓂司户人生何䖏不相逢比丁之南也㓂復移道州㓂聞丁當来遣人以蒸羊逆扵一竹迎于境上而收其僮僕杜門不放出聞者多以一作公為得體楊文公億以文章擅天下然性特剛勁寡合有惡之者以事譛之大年在學士院忽夜召見扵一小閤深在禁中既見賜茶從容顧問久之出文槀數篋以示大年云卿識朕書蹟乎皆朕自起草未嘗命臣下代作也大年惶恐不知所對頓首再拜而出乃知必為人所譛矣由是佯狂奔于陽翟真宗好文􅀄待大年眷顧無比晚年恩禮漸衰亦由此也王文正公曽為人方正持重在中書最為賢相嘗謂大臣執政不當􅀵恩避怨公嘗語尹師魯曰恩欲歸已怨使誰當聞者歎服以為名言李文靖公沆為相沈正厚重有大臣體嘗曰吾為相無他能唯不改朝廷法制用此以報國士大夫􅀄聞此言以謂不切扵事及其後當國者或不思事體或收恩取譽屢更祖宗舊制遂至官兵冗濫不可勝紀而用度無節財用一作力匱乏公私困弊推迹其事皆因執政不能遵守舊規妄有更改一作改更所致至此始知公言簡而得其要由是服其識慮之精陶尚書榖為學士嘗晚召對太祖御便殿陶至望見上􅀅前而復却者數四左右催宣甚急榖終彷徨不進太祖笑曰此措大索事分顧左右取袍帶来上已束帶穀遽趨入薛簡肅公知開封府時明參政鎬為府曹官簡肅待之甚厚直以公輔期之其後公守秦益常辟以自随優禮特異有問扵公何以知其必貴者公曰其為人端肅其言簡而理盡凡人簡重則尊嚴此貴臣相也其後果至參知政事以卒時皆服公知人臘茶出一作盛扵劒建草茶盛扵兩浙兩浙之品日注為第一自景祐巳後洪州雙井白芽漸盛近􅀊製作􅀹精囊以紅紗不過一二兩以常茶十數斤飬之用辟暑濕之氣其品逺出日注上遂為草茶第一仁宗退朝常命侍臣講讀扵邇英閤賈侍中昌朝時為侍講講春秋左氏傳每至諸侯􅁋亂事則略而不說上問其故賈以實對上曰六經載此所以為後王鑒一作監戒何必諱丁􅀳公自保信軍節度使知江寧府召為參知政事中書以丁節度使召學士草麻時盛文肅為學士以為參知政事合用舎人草制遂以制除丁甚恨之㓂忠愍之貶所素厚者九二字一作之人自盛文肅已下皆坐斥逐而楊大年與㓂公􅀹善丁晉公憐其才曲保全之議者謂丁所貶朝士甚多獨扵大年能全之大臣愛才一節可稱也太祖時以李漢超為關南廵檢使捍北虜與兵三千而巳然其齊州賦稅最多乃以為齊州防禦使悉與一州之賦俾之飬士而漢超武人所為多不法久之關南百姓詣闕訟漢超貸民錢不還及掠其女以為妾太祖召百姓入見便殿賜以酒食慰勞之徐問曰自漢超在關南契丹入㓂者㡬百姓二字一作對曰無也太祖曰徃時契丹入㓂邉􅀅不能禦河北之民歳遭劫虜汝扵此時能保全其貲財婦女乎今漢超所取孰與契丹之多又問訟女者曰汝家㡬女所嫁何人百姓具以對太祖曰然則所嫁皆村夫也若漢超者吾之貴臣也以愛汝女則取之得之必不使失所與其嫁村夫孰若䖏漢超家富貴扵是百姓皆感悅而去太祖使人語漢超曰汝湏錢何不告我而取扵民乎乃賜以銀數百兩曰汝自還之使其感汝也漢超感泣誓以死報仁宗萬機之睱無所翫好惟親翰墨而飛白􅀹爲神妙凡飛白以􅀧畫􅁚物形而􅀧最難工至和中有書待詔李唐卿撰飛白三百􅀧以進自謂窮盡物象上亦頗佳之乃特為清淨二字以賜之其六􅀧􅀹為竒絶又出三百􅀧外仁宗聖性恭儉至和二年春不豫兩府大臣日至寢閤問聖體見上器服簡質用素漆唾壷盂子素甆盞進藥御榻上衾褥皆黃絁色已故暗宫人遽取新衾覆其上亦黄絁也然外人無知者惟兩府侍疾因一作因侍疾見之爾陳康肅公尭咨善射當世無雙公亦以此自矜嘗射扵家圃有賣油翁釋擔而立睨之久而不去見其發矢十中八九但微頷之康肅問曰汝亦知射乎吾射不亦精乎翁曰無他但手熟爾康肅忿然曰爾安敢䡖吾射翁曰以我酌油知之乃取一葫蘆置扵地以錢覆其口徐以杓酌油􅄋之自錢孔入而一作而入錢不濕因曰我亦無他惟手熟爾康肅笑而遣之此與莊生所謂解牛斵輪者何異至和􅀄陳恭公罷相而並用文富二公彦博弼正衙宣麻之際上遣小黄門一有三軰二字宻扵百官班中聽其論議而二公久有人望一旦復用朝士徃徃相賀黄門具奏上大悅余時為學士後數日奏事垂拱殿上問新除彦博等外議如何余以朝士相賀為對上曰自古二字一作古者人君用人或以夢卜茍不知人當從人望夢􅁲豈足慿邪故余作文公批答云永惟商周之所記至以夢卜而求賢孰若用搢紳之公言從中外之人望者具述上語也王元之在翰林嘗草夏州李􅁇遷制􅁇遷送潤筆物數倍扵常然用啓頭書送一作遂拒而不納盖惜事體也近時􅃕人院草制有送潤筆物稍後時者必遣院子詣門催索而當送者徃徃不送相承既久今索者送者皆恬然不以為怪也内中舊有玉石三清真像􅀄在真逰殿既而大内火遂遷扵玉清昭應宫巳而玉清又大火又遷扵洞真洞真又火又遷扵上清上清又火皆焚蕩無孑遺遂一有又字遷扵景靈而宫司道官相與惶恐上言真像所至輒火景靈必不免願遷二字一作乞移他所遂遷扵集禧宫迎祥池水心殿而都人謂之行火真君也丁文簡公度罷參知政事為紫宸殿學士即文明殿學士也文明本有大學士為宰相兼職又有學士為諸學士之首後以文明者真宗謚號也遂更曰紫宸近世學士皆以殿名為官稱如端明資政是也丁旣受命遂稱曰丁紫宸議者又謂紫宸之號非人臣之所宜稱遽更曰觀文觀文是隋煬帝殿名理宜避之盖當時不知然則朝廷之事一作士不可以不學也王冀公欽若罷參知政事而真宗眷遇之意未衰特置資政殿學士以寵之時㓂萊公在中書定其班位依雜學士在翰林學士下冀公因訴于上曰臣自學士拜參知政事今無罪而罷班及在下是貶也真宗為特加一作置大學士班在翰林學士上其寵遇如此景祐中有郎官皮仲容者偶出街衢為一輕薄子所戯遽前賀云聞君有臺憲之命仲容立馬媿謝久之徐問其何以知之對曰今新制臺官必用稀姓者故以君姓知之爾盖是時三院御史乃仲簡論程掌禹錫也聞者傳以為笑太宗時宋白賈黄中李至吕蒙正蘇易簡五人同時拜翰林學士承旨扈蒙贈之以詩云五鳯齊飛入翰林其後吕蒙正為一作至宰相賈黄中李至蘇易簡皆至參知政事宋白官至尚書老扵承旨皆為名臣御史臺故事三院御史言事必先白中丞自一有中山二字劉子儀為中丞始牓臺中今後御史有所言不須先白中丞雜端至今如此丁晉公之南遷也行過潭州自作齋僧䟽一有文字云􅀘仲山之衮雖曲盡扵巧心和傅說之羮實難調扵衆口其少以文稱晚年詩筆􅀹精在海南篇詠􅀹多如草解忘憂憂厎事花名含笑笑何人一有之句二字􅀹為人所傳誦張僕射齊賢體質豐大飲食過人􅀹嗜肥豬肉每食數斤天壽院風藥黒神丸常人所服不過一彈丸公常以五七兩為一大劑夾以胡餅而頓食之淳化中罷相知安州安陸山郡未嘗識達官見公飲㗖不􅀋常人舉郡驚駭嘗與賔客會食厨吏置一金漆大桶扵㕔側窺一作竊視公所食如其物投桶中至暮酒漿浸漬漲溢滿桶郡人嗟愕以謂享富貴者必有異扵人也然而晏元獻公清瘦如削其飲食甚微每析半餅以筯卷之抽去其筯内捻頭一莖而食一有之字此亦異扵常一無此字人也宋宣獻公綬夏英公竦同試童行誦經有一行者誦法華經不過問其習業㡬年矣曰十年也二公笑且閔之因各取法華經一部誦之宋公十一作五日夏公七日不復遺一字人性之相逺一有也字如此樞宻曹侍中利用澶淵之役以殿直使扵契丹議定􅉀好由是進用當莊獻明肅太后時以勲舊自處權傾中外雖太后亦嚴憚之但呼侍中而不名凡内降恩澤皆執不行然以其所執既多故有三執而又降出者一無比字則不得巳而行之久之為小人一有之字所測凡有求而三降不行者必又請之太后曰侍中已不行矣請者徐啓曰臣巳告得侍中宅妳婆或其親信為言之許矣扵是又降出曹莫知其然也但以三執不能巳僶俛行之扵是太后大怒自此切齒遂及曹芮之禍乃知大臣功髙而權盛禍患之来非智慮所能防也曹侍中在樞府務革僥幸而中官􅀹􅀍裁折羅崇勲時為供奉官監後苑作歳滿敘勞過求恩賞内中唐突不巳莊獻太后怒之簾前諭曹使召而戒勵曹歸院坐㕔事召崇勲立庭中去其巾帶困辱久之乃取狀以聞崇勲不勝其耻其後曹芮事作鎮州急奏言芮反狀仁宗太后大驚崇勲適在側因自請行既受命喜見顔色晝夜疾馳鍛成其獄芮既􅀍誅曹􅀄貶隨州再貶房州行至襄陽渡北津監送内臣楊懐敏指江水謂曹曰侍中好一江水盖欲其自投也再三言之曹不諭至襄陽驛遂逼其自縊宋鄭公庠􅀄名郊字伯庠與其弟祁自布衣時名動天下號為二宋其為知制誥仁宗驟加奨眷便欲大用有忌其先進者譛之謂其姓符􅀦號名應郊天又曰郊音交也交者替代之名也宋交其言不祥仁宗遽命改之公怏怏不獲已乃改為庠字公序公後更踐二府二十餘年以司空致仕兼享福壽而一作以終而譛者竟不見用以卒可以為小人之戒也曹武惠王彬􅀦朝名􅀅勲業之盛無與為比嘗曰自吾為􅀅殺人多矣然未嘗以私喜怒輒􅓍一人其所居堂室弊壊子弟請加脩葺公曰時方大冬牆壁瓦石之間百蟲所蟄不可傷其生其仁心愛物盖如此既平江南回詣閤門入見牓子稱奉勑江􅀯勾當公事回其謙恭不伐又如此真宗好文雖以文辭取士然必視其器識每御崇政賜進士及第必召其髙第三四人並列扵庭更察其形神磊落者始賜第一人及第或取其所試文辭有理趣者徐奭鑄鼎􅁚物賦云足惟下正詎聞公餗之欹傾鉉乃上居實取王臣之威重遂以為第一蔡齊置器賦云安天下扵覆盂其功可大遂以為第一人錢思公生長富貴而性儉約閨門用度為法甚謹子弟輩非時不能輒取一錢公有一􅃢瑚筆格平生􅀹所珍惜常置之几案子弟有欲錢者輒竊而藏之公即悵然自失乃牓于家庭以錢十千贖一作購之居一二日子弟佯為求得以獻公欣然以十千賜之他日有欲錢者又竊去一歳中率五七如此公終不悟也余官西都在公幕親見之每與同僚歎公之純徳也􅀦朝雅樂即用王朴所製周樂太祖時和峴以為聲髙遂下其一律然至今言樂者猶以為髙云今黄鍾乃古夾鍾也景祐中李照作新二字一作所作樂又下其聲太常歌工以其一作為太濁歌不成聲當鑄鍾時乃私賂鑄匠使減其銅齊而聲稍清歌乃叶而成聲而照竟不知以此知審音作樂之難也照每謂人曰聲髙則急促下則舒緩吾樂之作久而可使人心感之皆舒和而人物之生亦當豐大王侍讀洙身􅀹短小常戯之曰君樂之成能使我長一有大字乎聞者以為笑而樂成竟不用鄧州花蠟燭名著天下雖京師不能造相傳云一作亦是㓂萊公燭法公嘗知鄧州而自少年富貴不􅀧油燈􅀹好夜宴劇飲雖寢室亦燃燭達旦每罷官去後人至官􅃕見厠溷間燭淚在地徃徃成堆杜祁公為人清儉在官未嘗燃官燭油燈一炷熒然欲滅與客相對清談而巳二公皆為名臣而奢儉不同如此然祁公壽考終吉萊公晚有南遷之禍遂殁不返雖其不幸亦可以為戒也故事學士在内中院吏朱衣􅃗引太祖朝李昉為學士太宗在南衙朱衣一人前引而已昉一有因字亦去其一人至今如此徃時學士入劄子不著姓但云學士臣某先朝盛度丁度並為學士遂著姓以别之其後遂皆著姓晏元獻公以文章名譽少年居富貴性豪俊所至延賔客一時名士多出其門罷樞宻副使為南京留守時年三十八幕下王琪張亢最為上客亢體肥大琪目為牛琪痩骨立亢目爲猴二人以此自相譏誚琪嘗嘲亢曰張亢觸牆成八字亢應聲曰王琪望月呌三聲一坐為之大笑楊文公常戒其門人為文宜避俗語既而公因作表云伏惟陛下徳邁九皇門人鄭戩遽請扵公曰未審何時得賣生菜扵是公為之大笑而易之夏英公竦父官扵河北景徳中契丹犯河北遂殁于陣後公為􅃕人丁母憂起復奉使契丹公辭不行其表云父殁王事身丁母憂義不戴天難下穹廬之拜禮當枕塊忍聞夷樂之聲當時以為一作謂四六偶對最為精絶孫何孫僅俱以能文馳名一時僅為陜西轉運使作驪山詩二篇其後篇有云秦帝墓成陳勝起明皇宫就録山來時方建玉清昭應宫有惡僅者欲中傷之因録其詩以進真宗讀前篇云朱衣吏引上驪山遽曰僅小器也此何足誇遂棄不讀而陳勝禄山之語卒得不一作不得聞人以為幸也􅀭大年每欲一作遇作文則與門人賔客飲博投壷奕棊二字一作乃至語咲諠譁而不妨構思以小方紙細書揮翰如飛文不加􅀧每盈一幅則命門人傳録門人疲扵應命頃刻之際成數千言真一代之文豪也楊大年為學士時草荅契丹書云隣壌交􅂬進草既入真宗自注其側云朽壌䑕壌糞壌大年􅃍改為隣境明旦引唐故事學士作文書有􅀁改為不稱職當罷囙亟求觧職真宗語􅈗相曰楊億不通商量真有氣性一作性氣太常􅀁用王朴樂編鍾皆不圓而側垂自李照胡瑗之徒皆以為非及照作新樂􅀅鑄編鍾給銅一有扵字鑄瀉務得古編鍾一枚工人不敢銷毁逐蔵扵太常鍾不知何代􅀁作其銘曰一作云粤朕皇祖寳龢鍾粤斯萬年子子孫孫永寳用叩其聲與王朴夷則清聲合而其形不圓一有而字側垂正與朴鍾同然後知朴博古好學不為無據也其後胡瑗改鑄編鍾遂圎其形而下垂叩之揜欎而不􅀭其鏄鍾又長甬而震掉其聲不和著作佐郎劉義叟􅀼謂人曰此與周景王無射鍾無異必有眩惑之疾未㡬仁宗得疾人以羲叟之言驗矣其樂亦㝷廢一有不用二字自太宗崇奨儒學驟擢髙科至輔弼者多矣盖一作自太平興􅀦二年至天聖八年二十三榜由吕文穆公䝉正而下大用二十七一作五人而三人並登兩府惟天聖五年一榜而已是歳王文安公尭臣第一今昭文相公韓僕射􅄾西􅈦參政趙侍郎槩第二第三人也予忝與二公同府每見語此以為科􅂣盛事自景祐元年已後至今治平三年三十餘年十二牓五人已上未有一人登兩府者亦可恠也㱕田録卷第一河北奉使奏草卷上歐陽文忠公集一百十七乞許同商量保州事劄子臣準勑差充河北轉運按察使伏見河北驕兵作過見據保州招之未肯開門擊之未能速破諸將集於城下而進退攻取未有定計臣今偶􅀍􅅄擢俾當繁使至於應副糧草軍須之􅀋皆有司之常事臣雖竭力供職未足以稱陛下用臣之意臣今欲乞每遇軍馬攻討招撫應干保州事宜許臣與田況李昭亮等同共商量施行庻㡬愚慮有禆萬一如允臣所奏乞特降聖旨劄子付臣及乞劄與田況等今取進旨舉官劄子臣近􅂪聖恩擢備任使臣勘會本路州縣至多甲馬甚衆比於三路最號䌓難況今兵據保州河決徳博虜人對境未測事宜當此之時以臣非才驟當重責苟一敗職所繫非輕須藉衆能庻可共濟臣今有奏舉下項官吏五人伏乞朝廷特賜勘會本路州縣闕貟及有成資滿任闕處各與差除以備緩急勾當庻㡬職務辦集不至敗悞今具姓名畫一如後一前知長垣縣著作佐郎黄贄臣前任滑州通判日與贄縣境相隣熟聞其政治之迹本人近準勑移知大寧監竊知長垣縣係祗應北朝人使有例免得逺官臣今欲乞下審官院及開封府會問保明本官實曽祗應人使及合免逺官體例特除一河北路通判差遣一㩲兖州掌書記龔鼎臣有詞學明於吏術歴官六考有舉主磨勘循資今又成一考見有舉主臣今欲乞檢會本人考第舉主特改轉一京官除注河北路簽判知縣差遣一新授舒州團練判官徐玉爲性明敏有吏幹暁民政其人新授官未赴任臣今欲乞特除一河北職官或知縣差遣一太廟齋郎姜潜有文行通曉民間利病熟知河北事宜臣今欲乞特除一河北路縣令㦯主簿差遣一試國子四門助教李􅁁有膽勇材武夲因曰身効用捉賊得功臣今欲乞特除一河北縣尉差遣右謹具如前臣所奏舉黄贄等五人如蒙朝廷擢用後犯正入已贓及不如舉狀臣並甘同罪謹具狀奏聞伏􅃸勑旨乞不親教閱劄子臣近準中書劄子節文河北宜選轉運使二貟宻授經略之任使其熟圗利害隂爲預備仰不住遍行廵歴所到據城壁并烽火臺防城動使家事衣甲器械一一覷歩仍躬親於教閱處試驗兵士鞍馬次第者臣偶以不才􅀍此責任若乃詢究軍民之利害相度山川之險要斡運蒭粟建易城寨以至按察將吏廉其否臧營辦工材督治器甲如此等事乃是朝廷宻授臣經略之職敢不盡心至如躬親教閱此則主兵之官日行常事兼臣本司自有職事凡於軍政旣不精專而又所至州軍一歳不過一兩次暫時按視難盡精詳縱欲處置改更未必皆當況主兵之權貴於統一侵官失職於理非便臣今欲乞除􅀧檢城壁器甲並依中書劄子内聖旨指揮外所有轉運使提􅀧刑獄司等躬親教閱一事乞更不施行如允臣所奏乞明降朝旨乞許轉運司差兵士捉賊當司準樞宻院劄子節文奉聖旨令真定府路定州路髙陽關部署司各行移文字與合行本路管轄軍馬州軍今後每遇勾抽係路分管轄軍馬􅃸見本屬部署司文字即得起發并劄付河北都轉運司亦仰依此指揮右謹具如前當司近因廵歴至邢州據趙州寧􅀳縣郷兵都頭管用徳狀及口稱緝得昨來北京走却壯城兵士強賊一十一人見在趙州賛皇縣􅌪藏乞差使臣兵士指引前去掩捕臣㝷爲本州及側近地分廵檢縣尉並在磁洺州會合見捉打刼武安縣賊人次側近應急别無廵檢使臣可差又縁近準上件樞宻院劄子轉運司差撥兵士不得偶值宣撫使富弼到邢州遂具狀乞就差使臣兵士巳差殿直髙惟正帶兵甲前去掩捕次臣㸔詳近降樞宻院劄子蓋爲大叚起發兵馬須􅃸部署司勾抽不欲令他司侵主兵之權事要統一敢不遵行臣欲乞今後遇有強惡賊人之處廵檢縣尉地分遥逺夫能救應之間許令轉運司於就近州軍勾撥兵士一二百人以來應急掩捕所貴不致透漏強惡賊人其餘大改起移兵馬即依近降樞宻院劄子指揮如允臣所奏乞降付本司及部署司施行奏洺州盗賊事今月十日準樞宻院劄子邢州駐泊都監胡承澤奏近準樞宻院劄子監逐大名府磁相邢洺州廵檢等捉殺賊盗者今有賊人徒伴殺併到軍賊頭劉貴首級并前後捉殺獲共七人外只有三兩人見已殺併散相度更不消臣監逐􅀵捉欲乞却歸邢州管勾本職公事􅃸旨奉聖旨令河北都轉運司相度指揮訖奏右臣昨自到任累據北京邢洺磁等州節次申報軍賊或十人十五人至二十人在西路數州之内驚刼人戸掠奪遞馬并郷村生馬騎乗倐忽徃來不辨頭首姓名及每火人數㝷根問得元有殺廵檢縣尉軍賊劉貴一火及近日大名府走却壯城兵士九人共兩火略知姓名雖曽捉殺得數人然其餘黨昌熾愈甚或旋合火伴或脅逐村人到處一二十人動成羣隊臣今月九日廵歴到洺州南準本州廵檢走報稱有軍賊十四人打奪臨洺界馬遞鋪同時又據磁州申武安縣軍賊二十人入縣衙闘敵傷着兵士及燒􅁍草市當日又據權廵檢殿直髙惟正申邢州沙河縣九月一日有賊一火打刼村民史秀至十一日臣離洺州至故城馬鋪又聞前靣馬鋪有賊四人白日騎馬帶甲羣行過徃向東雞澤縣賊􅀔如此交横其廵檢縣尉等並各未見向前捉捕臣雖巳一靣催促廵檢縣尉等及牒逐處併力掩捕及體量廵檢縣尉内有畏懦不能捉賊者續乞替換行遣次不委胡承澤妄有申奏只有三兩人未獲意欲速罷捉賊差使兼臣曽召承澤問當口稱奉宣監捉本不令躬親捉殺兼宣撫使富弼已權差供奉官武永孚内殿承制魏辛等充邢洺五州軍捉賊方今盗賊􅀔雖未衰其胡承澤臣巳牒令却歸本任去訖乞一靣罷差兵士拽磨右臣準中書劄子訪聞昨來石待舉擘畫酒務内令兵士拽磨所貴省得草料轉運司㝷依此遍下諸州軍施行訖今仰立便指揮只依舊用驢子拽磨仍具因依聞奏臣今檢取到元􅀄一宗行遣公案勘會得慶暦三年十一月九日轉運使張􅃆因廵歴到保州本州通判石待舉擘畫申請乞更不差磨憔驢子只以廂軍兵士推磨所有轉運使張􅃆㝷依所申行下今來朝廷指揮仰疾速止絶本司相度即目已是秋深磨憔踏麴罷多日兼又保塞亂兵纔息若非時急行出上件指揮深慮扇惑小人别致引惹欲乞直􅃸來年將及踏麴之時只作本司一靣行遣依舊却差驢子所貴不至張皇引惹謹具狀奏聞奏李昭亮私取叛兵子女右臣近廵歴至保州訪聞得部署李昭亮昨因保州開門後入城將雲翼第九兵士妻女分配與諸州軍軍貟等本爲是作亂兵士妻女配與軍營要行戒勵却於其中揀選軍人女子先自將入昭亮本家及手下兵士使臣通判官等遞相倣俲亦各私取歸家軍民傳聞道路喧沸其李昭亮等知臣覺察舉行遂却轉遞岀外即目未知去處㝷據定州通判馮博文狀陳首稱􅀵得長行許秀女一人臣等勾到許秀女子小姐及元傳送兵士楊遂王在共三人巳牒送真定府通判王鵬於本府置院推勘去訖謹具狀奏聞乞不詰問劉渙斬人臣近知吉州刺史劉渙新到保州因􅀧檢軍資庫有虞􅃸張吉無禮及擅開金銀籠子不伏知州指揮已行處斬訖􅀼聞前轉運使張􅃆曾具奏聞深意朝廷别致疑惑況保州新經兵亂河北士卒素驕處置權宜難依常法伏乞朝廷更不詰問所貴不致引惹今取進旨訪問逐州利害牒當司勘㑹轄下州軍縣鎮地里闊逺户口財賦兵甲甚多逐處官吏所見公私利病竊慮當司廵歴未到之間無由一一詢訪湏議專行公文者牒具如前事湏牒某州候到仰遍牒在州及外縣鎮官貟内有見得本路及本職務不便事件及民間弊病可以興利除害者並宻具文字子細條列直赴當司投下以慿看詳可否乞不令提刑司􅀧檢賞給臣近準樞宻院劄子節文河北諸州軍將來所支廂禁軍賞給折支奉聖㫖劄與轉運提點刑獄司疾速分頭遍行􅀧檢續準宣頭節文今下河北轉運使副提􅀧刑獄朝臣使臣􅃸到逐處將賞給物色若是估價尚髙便仰重行估計其劄子宣頭並不得下司者臣伏詳朝旨本爲賞給之物不可􅃜損軍人又縁士卒素驕亦湏鎮靜故每于賞給文字多令不得下司者蓋慮張皇却生引惹今若只令轉運司􅀧檢即可以因廵歴名目每到州軍自合􅀧檢倉庫因便於軍資庫内􅀧檢如此方可不至張皇其提刑司自來不管錢榖忽至州軍却入軍資庫點檢即兵士皆知朝廷畏懼軍人特令􅀧檢如此却成引惹又慮諸州軍見自來提刑不管錢榖忽要入軍資庫不肯應副則湏明言有朝旨􅀧檢賞物又全違不下司之意有此事體不便伏乞朝廷專責轉運使一靣􅀧檢準備況臣累準朝㫖指揮丁寜嚴切巳各行下諸州軍及見廵歴因便􅀧檢亦恐州軍數多南郊漸近遍到不得即乞宻委本州通判等就􅀧檢所貴不至張皇如允臣听奏乞明降聖㫖指揮更不令提刑司􅀧檢所貴别不張皇引惹取進止保舉王果右臣等伏見前知定州皇城使王果移知宻州或聞朝議罪果昨攻保州之日傷中兵士數多及縱兵掠奪南關人户財物所以降移差遣臣等體量得昨來保州兵士作亂之􅀄便欲自南門突出頼果領兵力拒守得南關賊旣不能奔突遂閉城門兼􅀄閉門之時尚可斬關而入爲諸將心不齊一致果不能獨進其兵士傷中人多蓋是果能得士死力奮勇爭先雖有中傷㝷各完復其後累降招牓賊衆攃城投降亦因外兵攻圍示以必取賊知窮蹙方肯聽命果之力戰不爲無助其南關人户財物乃是招􅀵兩指揮􅀄作亂之時先自南關刼掠然後入城果到南關只令兵士於招􅀵叛卒營内就其糧水兵士㦯得些小物色多是叛卒遺棄之物然東關人户亦不免刼掠昨來保州城開之後兩關人户皆有狀稱刼掠財物不少足明因亂􅀍刼不獨南關蓋縁王果爲性剛勇奮不顧身但務盡忠不恤毀譽若朝廷當用兵伐叛之􅀄罪先登効命之將使冒矢石中傷者被責而避賊不戰偶無傷中者得遷竊慮賞罰失中無以勸戒兼臣昨因廵歴至㳂邊州軍訪聞軍民嗟憤皆以果當被賞而不意被責累經本司及宣撫司陳訴舉留伏望朝廷審察愛憎之言保全忠勇之士其王果伏乞特與清雪復一河北㳂邊重地差遣所貴下叶軍民之議激勸將吏之心謹具狀奏聞保明張景伯準宣頭節文磁州奏據武安知縣張景伯申今月六日有軍賊約二十餘人入縣圍却縣城有守把兵士三十餘人於縣門樓上相射賊人中箭後便惣出徃城西草市打刼劉蕳家財物乞指揮收捉去訖奏聞事宜令河北都轉運司疾速體量詣實如是上件賊人曾打刼縣城裏靣人户財物所有本縣官貟仰依近降指揮取勘施行并下提刑司火急指揮應干繫地分都同廵檢使臣及捕盗官等仰立便部領兵甲弓手等會合捉殺湏管敗獲所乞權差兵士百十人防護縣城即仰轉運司疾速相度差撥訖奏聞者右謹具如前當司勘會先據磁州狀申今月六日有軍賊二十餘人入武安縣内打刼􅀍知縣張景伯部領守把兵士於縣門樓上相射賊人中箭出徃城西草市内打刼劉簡家財物粘逐前去值夜捉賊不獲乞差廵檢縣尉會合捉殺及乞於諸縣添差守把兵士及權差義勇防托當司㝷遍牒都大捉賊徐夔及地分廵檢縣尉等分頭捉殺及牒磁州差兵士義勇量支器甲防守縣城相次據徐夔及沙河縣令申斫到賊頭一箇及胡承澤申永年縣百姓殺頭二箇又據磁州申活捉到軍賊張晸一人斫到徐木大趙二頭二箇其餘並是元􅀍賊人驅虜去遞鋪兵士及百姓等並各詣逐處首身訖外即目磁洺之間别無賊盗當司體量得上件賊人元􅀄於武安縣打刼􅀍知縣張景伯與兵士三十餘人用命射中賊人致其潰散因此徐夔等接􅀔􅀵捉斫殺方得盡靜其武安縣吏難議更行取勘謹具狀奏聞乞罷郭承祐知邢州臣近日伏覩差郭承祐知邢州臣自蒙朝廷差充轉運按察使巳來前後累準宻降不下司宣頭劄子令常用心體量轄下官吏臣細詳朝㫖本爲河北於天下諸路最爲用武之地曩因北虜通和之後弛備多年一旦恐有事宜百事隳廢朝廷悔鑒前弊故先慎擇官吏務欲脩整頽綱昨準宣頭節文一十九州軍擇人乆任外其餘州軍長吏令中書門下樞宻院選差并下轉運司體量大小文武官不堪其任者不得容庇不才因循不切糺舉却致臨事闕悞朝廷留意河北丁寧切至如此加以近自保州兵亂之後至今民尚虚驚軍情未帖相次順安軍瀛州安肅軍衞州通利軍等諸處不住驕兵扇摇結􅌟當此之際臣實不意選差郭承祐爲河北長吏承祐頃知澶州引惹修城兵士幾至作閙去年差來河北將兵臣在諫院曾極論列㝷罷知相州貪穢之狀狼籍多端又爲按察使張昷之奏論罷爲北京部署今者移陜西遷延不去又以邢臺委之當河朔多事朝廷丁寜留意之時承祐累任不離河北不審其人果以何能當此慎選承祐庸劣貪穢奴厮之材若以曾効僕使之勞不忍廢弃豈無閑處可畜養之況邪州北連鎮定控扼西山軍馬所屯人民繁富禦戎鎮俗尤湏擇吏萬一乏人選差止得中常之材尚勝承祐伏望朝廷頋惜河朔名藩重地不使庸劣小人壞之其郭承祐伏乞特賜指揮罷去邢州别選差人取進止再奏郭承祐臣昨覩朝廷差郭承祐知邢州巳曾具劄子奏論乞别選差人至今未奉朝旨臣昨因準中書劄子權知成徳自邢州經過見其城壁嚴整居人繁富不惟爲朝廷惜此名藩重地兼痛惜一城軍民將罹其毒仍採問得邢州之民自聞朝廷差下郭承祐其上等人户各訴免行户及欲逃移他郡緣承祐乆在河北其贓穢之狀人盡知之竊恐朝廷未知民情不恱如此謹再具奏聞取進止五保牒當司檢會轄下諸州軍近年不住申報盗賊羣火極多蓋緣盗賊必先湏郷村各有宿食􅌪藏之處及所得贓物常有轉賣􅀉附之家然後方能作賊所以自來每有羣盗驚刼及至官司捕捉又却分散不見蹤跡卒難㝷覔蓋爲郷村不相覺察致得姦盗之人到處便可容􅀮兼檢會準户令諸户皆以隣聚相保以相檢察勿造非違如有逺客來過止宿及保内之人有所行詣並語同保知雖然有此令文州縣多不舉行昨因廵歴到通利軍問得舊來常有盗賊逃軍爲患近歳􅀺陽衞縣各將鄕村之人五家結爲一保自結保後來絶無逃軍賊盗公私簡靜其利甚博湏議專有施行右具如前當司相度隣聚相保之法是國家見行勑令於公私甚利然今旣舉行若縣令非才不能制馭公人胥吏則勾追搔擾未見其利先爲民害以此當司未欲一槩遍行指揮今且於轄下諸縣柬選知縣縣令公明材幹可以差委者先次施行數内某官見知某縣事湏實封專牒某官候到請詳前項事理施行當司所録去合保次第只是大綱若更有合從彼處民便别加增損事件亦請一靣增損施行仍請先具如何施行次第公文供報無至張皇鹵莽者乞推究李昭亮準中書劄子節文奉聖旨馮博文爲陳首特放更不置院推勘如更有官貟使臣等將帶􅁍保州作過兵士人口徃本家者並許陳首亦與放罪仰本處依前來體例配與軍貟􅀵養者右謹具如前當司昨爲真定府定州等路部署李昭亮身爲大將不能統轄致得保州兵士作亂及朝廷累降勑牓屈法招誘叛卒方肯歸降旣城開之後其李昭亮轉帖號令諸軍不得私取人口并財物却先將叛卒女口私入本家當司爲見李昭亮忝爲大將不恤國家憂患幸此亂兵利其妻女當司職在按察理合舉行遂當靣詢問李昭亮其人妄稱不曾􅀵得及通判馮博文處亦有一人知臣覺察遂急送保州陳首當司爲要見得李昭亮處私取叛兵士女口歸着遂勾追馮博文處許秀女一人及轉送兵士等於真定府差官置院根勘本爲要李昭亮私取手下叛兵妻女歸着今準中書劄子内上項聖旨指揮欲乞除馮博文特放更不推勘及其餘官貟使臣等未發覺者並許陳首外其李昭亮身爲大將不憂國家幸此亂兵私取妻女其情理不輕況已發覺無容自首伏乞許臣根勘見歸着奏取勑裁兼本司已牒推勘院令踈放馮博文處許小姐及催促根究李昭亮私取人等早行結絶未得㫁遣繳送當司以慿看詳聞奏去訖伏縁當司職在按察今來若舉察轄下官吏未容根究便行踈放即按察之司是爲虚設今後官吏作過者無由糺舉伏乞朝廷特賜詳察謹具狀奏聞乞將誤降配廂軍依舊升爲禁軍當司近牒真定府定州等路部署司取素昨來保州分配作過兵士人數㝷準部署司公文分析到一宗分配兵士人數内二千一百六十五人配諸州軍禁軍一百九十八人配諸州軍廂軍臣昨因廵歴到通利軍勘會本軍分配係保州分配來兵士共九十人内八十人配禁軍武衞指揮十人配廂軍威􅁁保節指揮㝷體問所配禁軍兵士八十人並是城中作過殺戮吏民刼奪財物汚辱良善靡所不爲其人等並各配禁軍指揮仍升得軍分其十人配廂軍者元在保州城外廵警聞城中兵亂遂投定州别不曾作過當分配之時却責以擅離地分降配諸處充廂軍仍體問其人等爲見城中作過兵士却升得軍分亦累曾經知軍出頭有狀聲􅁈稱無過降作廂軍本軍不敢接狀然亦以其人等怨忿不敢差使功役只與閑慢處窠坐羈縻當司看詳部署司分配保州兵士之時升降之間顯是倒置今來通利軍威邉等兵士􅀍作過之人升得軍分事相形比不得無言今若先其無事之時便與措置尚全大體若萬一漸形怨忿别起事端至時難爲鎮靜不免改更則轉更引惹驕兵生事者右具如前當司雖子細體問得上件降充威邉保節等廂軍事節蓋慮引惹又不敢親喚本人取問分配因依今録白部署司元牒分析到廂軍人數頭連在前欲乞特降指揮下真定府定州等路部署司分析元降配諸處兵士元係是何指揮及坐何等過犯降配若會問得與當司體問得事理不别即乞將降配廂軍人數只作因南郊該恩赦却與升爲禁軍所貴於事稍允伏乞早降指揮乞一靣除放欠􅀒臣竊見自來每遇南郊赦勑除放天下欠􅀒朝廷雖示恩䘏而有司未甞奉行是致天下常有積年欠􅀒累經赦宥除放不得使破敗逃亡之人傳子至孫攤在親戚干繫人等追擾陪填不勝其苦臣究其弊蓋爲先降天聖編勑内欠􅀒官物該恩除放者湏得諸州軍及轉運司節次保明申奏送三司并理欠司定奪經歴官司旣多則徃復問難拖延日月故每一次赦恩除放則未能了當者蓋由關防太宻經歴處多使赦宥之恩擁隔不能及下而官司胥吏反爲搔擾之資臣伏覩今年赦書節文内所該欠􅀒官物特與除放者若干項内若干項並特與除放内一項即令本屬及轉運司保明聞奏切縁雖申奏下三司理欠司即不免徃復問難拖延日月使除放赦恩不時及下臣今欲乞除赦文内一項元指定令保明申奏者依赦施行外若干項係赦恩特與除放者並許轉運司子細勘會先行除放訖一靣申三司及理欠司乞行􅀧檢如敢夾帶不合除放之人誤行除放者其轉運司官吏並科違制之罪況三司轉運司俱是掌錢榖之司其轉運司尤以聚歛爲功只患刻剥太過雖不經三司覆驗必不敢濫行除放如允臣所請乞特降指揮下諸路申明赦文内令保明者並湏申奏其餘特與除放者許轉運司除放訖申三司今具晝一如後一應乹興年巳前諸州軍帳内有樁管諸色欠􅀒年深及累經界分登帶不見年代名件見無家業抵當及正身亡没配流不在攤在妻男及干繫人處理索自來催納不行者不以有無侵欺盗用並特與除放此一項臣今欲乞先行除放訖申三司一今日巳前諸色欠􅀒官物并於干繫十保人處攤理元不顯侵欺盗用者㦯雖是侵欺盗用本家并干繫十保人内有委實見無抵當者並仰本屬及轉運司保明聞奏當議特與除放此一項臣今欲乞依赦文保明申奏一應陜西河東諸般綱運般送衣甲器械等縁路死損却官驢騾并磨攃損折漬汚及去失疋帛係剥納􅃜官錢元不是侵欺盗用者並與除放此一項臣今欲乞先行除放訖申三司一應天下州府軍監縣等應干繫節級手分自來有失行遣催納官物并誤行支遣委不是啓倖侵欺見行攤納者並與除放此一項臣今欲乞先行除放訖申三司一應慶暦三年終巳前諸道州府軍監人户先因災傷支借過貸糧草斛㪷除納外見在欠數目並特與除放此一項臣今欲乞先行除放訖申三司一應慶暦三年巳前諸處夏秋因災傷􅀝閣稅數並特與除放此一項臣今欲乞先行除放訖申三司一應今日已前幕職州縣官在任及未到任亡没者如曾借過月俸並特與除放此一項臣今欲乞先行除放訖申三司一應諸般啓倖􅀮䧟稅租今日巳前已根磨出累年積欠數目見行理納者並特與除放此一項臣今欲乞先行除放訖申三司一應羊綱死損􅃜折斤兩别無欺弊者並特與除放此一項臣今欲乞先行除放訖申三司一應江淮兩浙荆湖福建川峽等州軍監并黃河在京肆排岸稍工兵士牽駕綱船般運物色内有少欠元無欺弊見尅折請受者並特與除放此一項臣今欲乞先行除放訖申三司一應諸處有水火損敗官物及綱船遭風水抛失不虚及賊偷盗勘會分明别無欺弊者並特與除放此一項臣今欲乞先行除放訖申三司乞真定府分驍武兵士别作指揮臣勘會昨準河北宣撫使司指揮真定府驍武雲翼共五指揮各以五百人爲一指揮外共儧併出九百三十七人别爲兩指揮本司巳依近降樞宻院劄子未敢分擘先具分擘團併人數聞奏聽候朝廷指揮去訖臣檢會昨準宣撫司劄子下河北諸路分併指揮兼令轉運司應副木植人工修蓋營房其諸處各爲少闕材木未曾修蓋營房仍未及分併指揮之間巳準樞宻院劄子令奏候朝㫖以此諸州兵士指揮各未曾分擘營房亦未敢脩蓋惟有真定府一處爲有見在木植甚多於未降到劄子巳前㝷便依準宣撫司指揮踏逐到營房地支撥一色新好材木修蓋到營一座即今將欲了手元指定作驍武兵士各爲住營内人多屋少多是兩三家共住一間經夏暑雨存住不得爲見官中修營分擘指揮人各忻然遂其私便各自用功修蓋全不曾催督只及月餘已相次了手竊慮朝廷元降劄子指揮内有七百人已上處方許分擘今來驍武三指揮各只是六百四五十人巳上以此不令分擘又慮朝廷不見得本府驍武兵士已共力興工蓋成好屋今若却不令分擘即恐兵士巳指望上件營房屋住頓然失望於軍情不便伏乞朝廷特賜詳察其諸州軍即湏候奏得朝旨分定指揮方得興蓋營房其真定府一處已蓋了營屋者伏乞早降指揮許令將驍武兵士分擘爲一指揮於新蓋成營内居住所貴下順軍情别不生事仍乞檢會部署司前奏人數早賜施行取進止乞放行牛皮膠鰾臣累據轄下州軍狀申爲剏造添修兵器乞牛皮筋角膠鰾物勘會本路見在常是全然闕絶民間雖有禁法合逐旋納官及􅀧檢帳暦亦全無人户納到數目亦曾聞奏及申三司乞自京師支撥又爲京師諸庫各稱亦是數少㦯累申奏不曾支得縱或支下亦數目不多應副使用不足其諸州軍又爲上下催促造作甚嚴每於難得之中或時支得些小不暇柬擇好弱兼更使用不足湏至減料那融只且備數修剏僅能成器全不堪用今河北一路兵器萬數雖然不少而精好堪用之器十無一二臣究其弊蓋爲皮角筋膠難得之故臣因勘㑹自來國家明有禁法民間筋角湏盡納官河南膠鰾又不許過河北旣有此禁便合民間更無兵器今河北見管義勇十七萬有餘人人自有私弓弩此是官司明知其數者更有不係義勇之家例有弓弩不少其筋角膠鰾從何而得能致弓弩如此之多以此見國家禁法未便只是禁得官中絶無民間不能禁止臣今有起請擘畫事件伏乞朝廷特賜詳度如允臣所請乞賜施行庻得今後更不專仰朝廷輟那支撥而物料漸有兵器可精今具畫一如後一未兵興以前舊制民間自死牛皮筋角並中賣入官量爲三等支價錢其不及等者退還百姓及許客旅販賣官中置􅂣􅀵買當時公私却不闕少自兵興後來改法甚嚴人户自死牛馬皮筋角限半月赴官送納許人陳告􅀮藏者支賞自有此指揮後來人户絶更不曾經官送納亦無人告首􅀮藏者豈可二年之内舉河北牛馬全然不倒死以此足見改法之弊蓋其抛死牛馬巳是下民之苦更不支得價錢令人户白納及更令陪錢於官司使用了納又令盡底納官絶却民間使用以此民不爲便縁此等物各是民間要用之物陳告又支賞錢不多所以各相蔽蓋無由發露今年雖亦許破官錢􅀵買縁已有上項盡底納官之條民若不納官而中賣即是違禁之物以此􅀵買不得臣今欲乞却依天聖編勑及前後舊條許人户自死牛馬皮筋角中賣入官分爲三等支錢不及等者退還本主及置􅂣􅀵買客旅興販者如有及等皮角不中官賣即許人陳告如此所貴却似舊日公私各獲濟用一臣體量得河北私置弓弩並無河南過者膠鰾只是河北自有蓋滄州大海出魚不異南方及塘泊之中魚亦不少河北人民並能煎鰾出處只百十文一斤自來民間公行官司只是黄河不放過南膠外本土膠鰾州縣無人􅀧檢禁絶民間取足使用但官中自禁耳臣今欲乞滄州及瀛保等州相度置􅂣􅀵買必然大叚易得竊慮議者猶恐官旣􅀵買則民間公行因此北界爲不便況今官雖不買民間亦不曾禁此人從來不藉南界販鰾豈聞無弓使用以此言之不足疑也右謹具如前所有牛皮筋角等臣只見得本路利害仍乞更下諸路轉運司相度利害取進止乞展便糴斛㪷限當司近準三司牒爲便糴斛㪷仰依編勑至三月終住便更不展限者當司勘會㳂􅁁軍儲事大累年斛斗入便不敷慶暦元年只便到八十五萬二年只便到四十五萬三年只便到一百四萬今年方遇豐熟正是好行入便之時價例比去年大叚低減兼每年客人雖有斛斗不肯便行入中湏待體探年歳豐儉及伺候官中價例髙低常至三四月間方始猛來入中今若只於三月盡頓然中止即邉儲大叚闕悞況元抛四百餘萬斛斗即今全未糴得莫州元抛二十萬方糴便到一萬二千有餘信安三十萬方便到四千有餘覇州一十九萬方便到三千有餘其餘大約似此全未及數只指望四五月間趂逐入便若便及省司元抛數目只及四百萬石不得一年約支之數若頓然住却必見大叚誤事者右謹具如前伏乞朝廷特賜詳酌體認河北軍馬糧儲事大兼累年便糴不前趂此年豐價賤之時且乞依常年便糴至五六月已來只便及省司元抛數目即止兼自有便糴巳來年年展限客人以習慣其事皆廣爲計置直􅀱依常年四五月方來入中今若只於三月止住即不惟全無入中致闕乏悞事兼恐賺悞客人向後無由入中伏乞特下三司許令且依常年體例候糴及元數别聽朝旨仍乞速降指揮乞置御河催綱臣伏見㳂􅁁鎮定等十六州軍每年入中斛㪷並支在京一色見錢自來不止全仰㳂邉入中亦於近裏州軍計置斛斗從御河漕運輸邉所以軍儲不闕近年廢却御河運船不曾般運只藉㳂邉入中加又京師近歳難得見錢客旅交鈔無價雖於㳂邉多添價例終亦入中不前近裏州軍却合相兼計置然湏先修運路俟漕運路旣行方敢近裏儲積今有擘畫事件一乞復置御河催綱二貟一乞將見行三說新法地分與㳂邉見錢糴州軍分爲兩畨更互入中所貴漕運通流邉儲易備在京亦省費見錢之半今具利害畫一如後一􅀧檢本司帳暦係管御河堪好糧船一千八百􅃗見在只有三百餘􅃗内一千五百􅃗不知所在自來不曾􅀧檢見差官二貟根磨㝷覔至今未見歸着其見在三百餘􅃗每年亦全不曾般運斛㪷只是雜般虚名占使蓋由御河催綱廢罷後來綱運無人提轄致得綱梢偷減拌和濕爛損惡却饋􅁁之粟因此轉運司漸廢漕運之利殊不思若只仰㳂􅁁入中則在京廣費見錢在京錢少則㳂邉亦難入中兼昨本司近據廣信軍通判蔣賁擘畫求得江南配來船匠打造鏁栿船比舊船減省得物料人工又可以封鏁不令偷拌巳打成一􅃗甚見利便見今廣謀打造次臣今欲乞朝廷却復催綱二貟一貟依舊於大名府一貟於乹寜軍漸用新船興行漕運之利一勘㑹沿邉十六州軍元係見錢便糴外近裏大名府等七州軍近年巳許客人三說入中然二法不可並行若兩處抄價苦相爭即客人只就近裏入中蓋沿􅁁全少土居斛斗皆藉近裏客人販去中官若㳂􅁁價髙有利即近裏少人肯入以此二法並行未便臣今欲乞將見錢三說二法分爲兩畨一年於㳂􅁁見錢入中則近裏權住三說次年於近裏行三説即㳂邉權住見錢若近裏入中而權住㳂􅁁斛斗無所徃官中便糴必多若㳂邉隔年一入則京師減費見錢之半不至滯却客抄則㳂􅁁入中亦必多矣若明立二法分畨示信於客人則乆逺不勞朝廷改法自可省得見錢邉備亦易計置然近裏㳂御河州軍用三說本要輸邉則湏先修運路故先乞復催綱二貟也右謹具如前臣所乞復置催綱及糴便利害伏乞朝廷特賜裁度如允臣所請即更有約束條件􅃸朝旨别具奏聞乞催納放外稅物臣等近覩赦書節文應今年係災傷處巳經體量見欠稅物未得催理奏取指揮當司勘㑹本路一十二州軍各係水災人户已委官體量到合放稅數具帳申奏其放外稅物並是見在苗畒上合納稅數若更行減放則姦倖之人枉有拖䧟省稅及元計度軍儲失備巳具狀奏聞乞將第四等巳下人户依赦取奏朝旨外第三等巳上人户放外合納稅物乞許依例催納至今未蒙指揮當司今再將合納合放稅數勘會合放稅數巳及七十四萬餘石束貫外合納尚有四十餘萬若更行減放即恐無名虚放數多軍儲大叚失備況今年河北大豐熟三二十年未有如此豐歳其係災傷地分巳盡數檢放外合納稅數若於豐歲更行除放即恐軍儲失備將來歳不常豐或小遇不熟及緩急闕乏不免却煩科歛臣等今欲乞朝廷檢會本司前奏特降指揮其第三等已上人户除已放外合納稅數乞依例催納外第四等巳下人户放外合納稅數仍乞與免支移折變只令納本色或見錢則優倖巳多所貴赦恩下及貧民上户不至僥倖兼即今輸納是時如允臣所請乞速降指揮今取進止乞置弓弩都作院當司勘會近曾擘畫乞於磁相州置都作院打造兵器巳蒙朝廷依奏及差到監官等見催促磁相州蓋造營房作院及抽柬工匠打造一色精好器械次切縁磁相二州只是鐡作院所有弓弩元未曾别有擘畫當司今相度得西山一帶所産弓弩良材甚多自來係相州盤陽務採斫應副諸處使用今欲乞就近於邢州置都作院一所專打造一色好弓弩乆逺甚爲利便蓋縁弓弩二物於兵器之中最難打造尤要精專至於煎膠披筋各有法度燥濕寒暑有日時製造遲速之間若一事不精遂不堪用兼亦不乆易損壞見今諸州軍弓弩造作之時旣皆草草造成不乆㝷復損壞又湏從頭修換一畨修換未了一畨巳却損壞即目諸州並不暇打造新弓弩只是終年修換舊者積壓無由了絶有打造成後不曾經使巳修三五次者修換旣頻轉不堪用虚費人功物料乆逺悞事不細其弊如此蓋由散在諸州打造工匠及監官皆不齊一本司亦難爲􅀧檢故也若蒙朝廷許置都作院即選得專一監官柬揮精好工匠製定工料法式明立賞罰可以責成兼亦易爲􅀧檢者右謹具如前所有磁相州鐡作院并今來起請弓弩都作院剏置事􅀄合立規法欲候朝旨許置弓弩作院剏置事一就條列續奏乞賜指揮遵守施行次伏乞早降指揮謹具狀奏聞乞再定奪減放應役人數臣勘會轄下州軍使州院節級前後行并通引官客司書表司等並各於元定勑額人數外有影占上等人户前轉運使張昷之等遂令諸州軍據元額合留人數外剩占之人並減放歸農雖減得人數不少其如當時逐州行遣不一或不問户等髙下從下名減放者或有於下名之中柬上等人户影占之人減放者或有不問節級前後行只柬上等人户減放者遂致減放之後不絶詞訟近累據減放公人等過狀却乞􅀵叙又縁諸州減放事體不一若盡據減放之人却行􅀵叙則顯違先降勑條額定之數若全不􅀵叙則又有前行節級繫名多年者難盡不􅀵亦有州軍經減放徃徃輙巳行􅀵叙者臣等兼檢㑹日近雖有條貫前行不免里正然額外人多終是不便若額外手分無賄賂乞覔之倖則不可使其更當兩役若有賄賂乞覔之倖則不當額外剩置人數以此而言只合依勑額爲當竊以事旣干衆必欲州縣乆逺遵行則湏乞自朝廷明降指揮庻爲定令臣等今欲乞特降朝旨申明元定人數許本司遍取轄下州軍見管人數及巳減放之人衮同依入事年月上名下次排連從上據勑額元定人數存留外截下額外之人不問户第髙下一時減放如此則年深上名却得􅀵叙額外盡減又不違勑條内有州軍元定人數全少後來户口增盈及公事委實繁多之處乞許本司差官定奪量與添人具數聞奏立定爲額庻絶詞訟兼可永乆遵行取進止乞不免兩地供輸人役近又準中書劄子節文知保州劉渙奏欲乞朝廷相度㳂邉州軍應係兩地供輸人户比附一州軍内人户量與減免州縣色役奉聖旨宜令轉運司勘會聞奏本司方行勘會相度次續再準三司牒伏乞朝廷指揮内有界河北兩地供輸衙前兩地人户全放歸農只令輸納稅賦奉聖旨依所奏施行臣勘會㳂􅁁界河以北百姓雖有兩地供輸虚名其稅賦巳經太宗皇帝朝全放即今只於北界納稅唯有差役則兩地共之今若全放界河北人户差役即是稅賦差傜全不屬中國所管旣不能賦役其民即乆逺其地亦非中國之有此事所繫利害不輕又縁放免界河以北人户歸農指揮元不曾降下本司相度只是朝廷下三司直降下㳂􅁁施行已行之事雖失難追然昨來所放只是衙前客司第一等人户差役所有以次户第等諸般差遣竊慮人户援例别有詞說及邉臣更有奏請乞不與施行其劉渙起請亦乞更不施行取進止再乞不放兩地供輸人色役臣勘會本司近準三司牒爲臣寮起請㳂邉乞減放兩地供輸衙前及係自京支下官物並令三司差軍大將管押前去及係外州軍支撥者即令支下州軍差衙前人管押赴逐處奉聖旨依奏施行臣看詳臣寮所起請上項三節事理内減放兩地供輸牙前及般運官物令支下州軍差衙前管押此二事甚爲不便其兩地供輸人減役一節本司累曾具不便利害奏聞近因程琳有奏已蒙朝廷行下却且依舊差役外有般運官物令支下州軍差衙前管押此一事蓋是元起請臣寮不見得本司逐時支移官物次第所以不詳利害切縁河北一路㳂􅁁州軍每年所用絲綿紬絹見錢等數目不少並只出在濵徳博四州每遇邉上州軍少闕即本司於此四州支撥無有虚月若一一並令此四州衙前盡應副㳂􅁁諸州軍即衙前人數有限官物般運長無虚月其四州本處亦各自有重難差遣要人差使若如此施行不待乆逺只年歳間立見四州衙前破蕩盡及逃亡避役有悞緩急㳂􅁁闕絶要用之物般運不前況自去年河水決溢徳博二州人户災傷貧困及係災傷地分破敗􅂣務甚多正是衙前人等困乏不易之時尤宜存恤臣今相度若令㳂􅁁州軍各自般運則每年轉數不多若一切令此四州應副㳂􅁁州軍則大爲繁併臣今欲除自京支與㳂邉綱運不多乞令自京差軍大將外所有本路支般官物並令㳂邉且依乆來體例般運所貴各得均濟今取進止乞重定進納常平倉恩澤臣等勘會本司近爲諸州軍有人户進納常平倉斛斗檢會到元降勑命内定到等第恩澤太優比省倉進納軍儲數日全然數少竊以募民入粟鬻以官爵蓋是􅀦家權宜不得巳之事苟遇軍湏闕乏不欲科率人民權許兼并之家進納誘以官爵蓋備一時緩急之用其常平倉乃餘力惠民之所及豈容兼并之家縁此僥倖恩澤兼慮豪民見常平倉納物不多見得恩澤一向只就常平倉進納更無進納軍儲之人失權宜鬻爵之本意本司爲見有此不便曾具狀申奏乞增起常平倉進納物數與省倉進納一般所貴杜絶僥倖兼不妨招誘進納軍儲其狀申奏多日至今未蒙降下指揮後來累準提刑司牒諸處漸有人户進納常平斛斗蓋爲恩澤僥倖所以人户各來進納本司爲巳有申奏起請乞増數目見聽候朝旨巳各牒逐處且令未得受納伺候朝廷降下指揮今再具畫一常平倉并省倉進納軍儲數目酬􅅄次第伏乞朝廷比􅀋裁酌體認本司見止住人户進納伺候勑旨次乞早降勑命指揮乞條制催綱司當司近準朝旨巳差太子中舎賈熊充潮御河等催綱伏緣御河運路不修催綱職事乆廢是致催綱兵梢因緣作過偷減官物遲滯行程所過州軍任意截撥舟船所經地分隨處拆拽釘板因此於一千八百􅃗綱船内失却一千五百􅃗至今根究不見蹤由蓋因自來全闕關防不嚴條制而致兹積弊也今已蒙朝廷􅁍置催綱所有合行起請事件今具畫一如後伏乞朝廷特賜裁酌降下本司及提轄催綱司等處遵守施行所貴革絶自來綱運積弊一自來綱船利於雜般多將未及年限糧船故意損壞及虚有申報退作雜般船旣充雜般之後多是妄稱不堪行運便行毀拆或於㳂河孤逈村落地分故意損壞靠閣便於本處拆拽堆垜枉破兵梢㸔守有至三四年者兵梢恣於村坊作過及偷賣釘板提轄催綱司元無拘轄無由􅀧檢欲乞起今年巳後打造到三百料糧船每二十􅃗爲一綱同用一字爲號并造年月刻於船梁額上用官火印記訖給與綱官梢工主管團成一綱後不得輙更分破所貴見得年限逺近不敢故意損壞及妄行毀拆一糧船每􅃗以三百料爲率逐船所用釘板小大名件旣巳一般欲乞令催綱司將三百料船所用釘板名件一一開坐雕爲印板每差梢工給帖之時頭連一本旋鑿釘板大小數目給與令據數交割主掌如遇損壞合行拆拽即却據元數釘板名件送納或有少數並勒梢工陪填如遇行運之次損壞不堪即仰申報本地分官司檢覆亦據元數拆􅀵立報催綱司指揮因便舟船附帶令元主掌梢工於造船􅂣依數交納出給􅀵附仍令造船􅂣納訖據數關報催綱司照會施行所有合退作雜般船者亦湏依刻記造成年月先後資次撥充雜般不得隔驀將新好船揀退仍每綱據少數却以新船撥填足數一自來提轄司支撥綱舩般載官物至逐處下卸了其空舩便􅀍㳂路州軍取意截撥諸般不急使用因此積弊散失數多不能拘轄􅀧檢今欲乞指揮㳂河諸州軍不得專擅截撥遇有合般載官物並申提轄催綱官梢工候見提轄催綱等司文字支撥方得裝載行運如違各乞重行勘罪官貟奏罰一御河等水並無風波走射險阻其地里行程可以制定自來上下水空重船亦有程限但無關防􅀧檢之法今欲乞委轉運司將通利軍下至潮河西盡順安軍地里逺近所至㳂河州軍立爲程限牒與提轄催綱司每遇轉運司有合般運斛㪷抛撥下數目裝發糧船即令提轄司具裝發去處至下卸州軍除裝卸各給十日限外沿路地里指定行程帖與綱官梢工等及一靣牒催綱司依程催促仍令提轄司預先將簿照會行程約度合到下卸地頭月日續便支撥㦯令回載官物或令轉載向下行運亦便牒與催綱司依程催促如是下卸後並無官物般載即仰乹寜大名兩處就近赴催綱司岸下繫泊祗候差撥所貴綱運無由散失住滯作弊一所有帳籍文簿今欲乞令提轄催轄等司各置簿三道一置綱船都暦一道抄上都大舟船數目逐綱依字號􅃗數造成年月主捉梢工姓名開坐如有退撥充雜般及損壞拆拽及新􅀵充填數目亦一一開坐轉計每半年一度造帳供申轉運司一置裝發勾朱簿一扇具逐綱􅃗數綱官姓名裝卸官物數目月日依程限抄上催促候下卸了勾鑿了畢逐旋􅀜報照會一置修拆簿一扇每遇合修舟船即上簿拘管取索造船務修􅀘日限上簿催促候修了勾鑿如合毀拆變轉即先具合拆數目上簿候拆了赴造船􅂣納畢取到􅀵附於催綱司呈驗開落勾銷仍於都暦上照㑹開落每遇轉運使廵歴並湏子細􅀧檢右謹具如前當司起請催綱司條件只是規矩大綱更有合行事件乞令催綱司續次申舉其催促行程點檢官物拘轄新舊舟船及拆修除破等事並委催綱司專切管勾所有支撥舟船應副般運即申提轄司惣領仍令本路轉運司逐時􅀧檢如有違慢並乞嚴行㫁決其情理重者仍乞奏取勑裁所貴上下遵行乆逺漕運通流不至悞事河北奉使奏草卷上紹熈五年十月郡人王伯芻校正乞放行牛皮膠鰾因此北界爲不便疑有脫字乞置弓弩都作院切縁切疑是竊再乞不放兩地洪輸人色役牙前牙疑作衙河東奉使奏草卷上歐陽文忠公集一百十五畫一起請劄子臣準勑差徃河東擘畫粮草合有起請事件今具畫一如後一臣伏詳勑㫖本爲河東民力困乏差臣擘畫利害竊慮州縣未體朝廷之意因而搔擾臣今欲乞特降聖㫖指揮下河東路候臣到彼不得令官吏及諸色人出城迎送及不得作樂筵席一臣準勑計置擘畫河東一路經乆利害竊縁河東地分闊逺山川險絶竊慮僻逺之處不能徧至又縁本路文武官吏不少内有乆諳彼處民情事體者或在不當驛路守官致臣無由見得臣今欲乞許臣採問官吏就近召與相見所貴詢訪兵民利病仍慮有合行事件亦乞於本路選擇幹事官員暫差勾當一臣所授勑只是與轉運司計置擘畫邊上粮草竊縁一路州縣賦租户口兵馬錢帛及公私財用利害要見本末文字竊慮所在不畫時應副仍乞指揮一路州軍凡有取索文字並令畫時應副一臣伏見國家自兵興以來言事之人多陳利害竊慮有前後上文字人内有陳河東一路事宜所言大體利害詳明朝廷未暇施行者乞於中書樞宻院檢尋所上文字付臣看詳到彼叅驗利害可否囬日聞奏一臣準勑除擘畫粮草外竊慮更有可以因便勾當事件伏乞令中書樞宻院畫一條目付臣施行取進止辟郭固隨行劄子臣準勑差徃河東路計置經乆利害伏見新授寧州軍事推官郭固熟知㳂邊兵民利害曽隨韓􅄾奉使陜西近差充涇原路叅謀見未赴任臣今欲乞暫將帶本人隨行候臣囬日令一面發赴本任如允臣所請乞降朝㫖指揮取進止免晉絳等州人户逺請蠶鹽牒當所訪聞晉絳慈隰四州百姓毎年所請蠶鹽並於解池請領近聞省司指揮支移徃三門鹽倉請領道路遥逺竊知百姓多不願徃彼般請須議專行公文者右具如前今欲牒州候牒到日請不移時疾速詳前項事理如委實省司有此指揮及百姓情願依舊送納鹽錢不請三門官鹽仰立復差人前路曉示百姓各令逐便不得勒抑監催須令前去免使麥蠶農忙之際虚勞百姓逺路艱辛兼當所巳具一面施行奏聞仍請具巳施行公文疾速入馬遞囬報當所不管遟延住滯者同前當所訪聞晉絳慈隰四州百姓毎年所請蠶鹽並於解池請領近聞省司指揮支移徃三門鹽倉請領道路遥逺竊知百姓多不願徃彼般請須議專行公文者右具如前當所雖已牒晉絳慈隰等四州請詳前項事理如委實省司有此指揮及百姓情願依舊送納鹽錢不請三門官鹽仰立便差人前路曉示百姓各令逐便不得抑勒監催須令前去竊慮百姓已到解池及前去未逺今欲牒解州安邑知縣請詳前項事理如是請鹽百姓見在彼處請就近告示逐人如依舊送納鹽錢情願不徃三門請鹽者各令歸本縣仍希巳施行公文回報當所者相度併縣牒當所體量得潞州八縣内屯留􅀺城壷􅀜三縣地居僻逺户口凋零全少詞訟盗賊逐縣虚占令佐及諸色公人色役今欲擘畫將三縣併省分割入隣近縣分可以寛減民役兼省吏員須議差官相度利害者右具如前今欲牒上黨縣鄶主簿請詳上項事理躬親遍徃屯留等縣相度地里逺近接連彊畔就近可以分割併省利害務令人户穩便仍具可以分併地里􅀞成紙圖及取索逐縣見在户口賦稅見役諸色公人數目畫一開坐連申無致鹵莽者同前奏狀右臣近自威勝軍至遼州體量得遼州州界東西二百五十里南北一百五十九里所管户口主客二千七百餘户地里人户不及一中下小縣而分建一州四縣内榆社縣主客一千七十二户其餘遼山縣主客五百六十九户平城縣主客六百一十八户和順縣主客四百五十九户各不及一鎮人煙及潞州管内八縣亦有似此地里絶近人户全少處虚立縣名枉占官吏毎縣曹司弓手手力解子之􅀋各近伯人外别有供應本州􅈦子客司承符散從及本村里正户長􅂄長壯丁色役人户凋零差役繁重以臣相度可以將帶就近分割併省庻使減省官吏寛紓民役縁臣時暫經過竊慮不盡民間利害已宻牒知遼州國子博士蓋平上黨縣主簿鄶唐等審細相度可與不可分併利害臣今前去所過州縣除邊防要切縣分外其餘地里迫窄人户凋零絶然小縣有可以分割併省者並欲隨近選差幹敏之官宻切先行相度可與不可分割利害候臣奉使回日别具條陳敷奏次􅀝閣忻代州和糴米奏狀右臣準中書劄子節文臣寮上言勘㑹忻代二州裏外分配博糴斛斗共玖萬餘碩即今催納方及二分今來巳是五月粒食踴貴之際民間斛斗甚是難得欲乞朝廷特賜愍許將已支絹帛及大鐵錢合納米粟特與􅀝閣候將來秋成一併送納奉聖㫖令臣與河東轉運司同共相度施行者臣尋至忻代二州取索逐州元分配錢絹次第及見納見欠白米一宗文字看詳元是冨弼起請爲去年河東秋大熟乞朝廷輟那錢銀絹廣謀粮草三司遂支雜州絹二十萬疋與河東内代州分配到伍萬疋並是在京及并晉等州比及旋旋般來徃復拖延直至冬末春􅀄方行俵散至今年五月分配纔畢巳是麥熟夏稅起納民間豈復更有白米輸官其絹五萬疋并本州舊有絹三千餘疋共博糴白米九萬五千二百餘碩州縣從春至夏枷棒催驅只納到四萬餘碩見欠五萬四千餘石本州爲催納不前遂申轉運司乞令將隔年陳米減價折納雖有此擘畫亦並無人送納蓋爲過時無可収糴其忻州差配名目尤多去年一年内除稅賦和糴㳂邊送納外配銀送納見錢収買肉羊羊皮數目不少又有酒務十五年積壓損爛酒糟白酵分配人户令納清醋價錢又有轉運司先配絹三千疋博糴諸色斛米除此多般科配巳催納了足外方到一項大鐵錢絹博糴白米是今來臣寮起請乞行􅀝閣者其鐵錢絹元抛配博糴白米肆萬餘石因轉運司自見人民不易先減一半外尚有二萬八千四百餘碩後爲送納不前運司又巳與􅀝閣一半候秋熟併納外有一萬餘碩係見行催納臣遂取索本倉受納日曆􅀧檢逐日全無人户送納亦爲過時無可収糴兼兩州百姓累經臣陳狀臣上禀朝㫖親見民間疾苦又縁轉運使二人並在潞州相去絶逺不及計㑹商量兼勘㑹二州人粮見在忻州約支二年有餘代州亦約支一年半不至闕備又前去秋熟日月不逺臣已一面出牓及牒本州令􅀝閣候至秋熟一併送納施行訖謹具狀奏聞義勇指揮使代貧民差役奏狀右臣準中書批送下二狀河東都轉運司準康定元年九月十四日勑節文河東路強壯應見充正副指揮使内雖係第一至第三等户者州縣更不得輪次别差色役竊縁義勇指揮使各是郷村第一第二等力及有家活産業人户今來一年之内只是一季上畨多在本家管勾農業兼當司體量得正副指揮使等俱是上等人户㨂充最属僥倖其餘等第人户丁數稍多亦是一般􅀧充義勇祗應仍更不免州縣差役所有軍貟巳是優便仍更依條免放州縣色役頗見影庇却郷縣重難差役却差下等義勇人户充州縣重難里正或衙前等差役計其勞逸深爲不便欲乞朝廷早賜特降指揮下諸處義勇正副指揮使乞依其餘義勇體例各依等第户例輪次差定州縣色役庻得均濟臣勘㑹河東一路郷兵除係籍強壯不勾追教閱外所有刺手背義勇見管七萬二千八百七十二人毎年秋冬上畨教閱州縣因而諸雜役使常於秋冬邊地支移稅賦和糴逺納之時復有上畨之役凡一家三兩丁者一人上州教閱一人供送一人或在州縣執役或逺地輸納稅租所存但有衰老或有全無􅀝托者廢業忘家不勝其苦其間惟有正副指揮使並是州縣中最有物力上等人户却獨得免差役是下等人户常有勞役最豪冨者獨得寛優兼自兵事已來州縣差役頻併素來力及之户累世勤儉積畜只於三五年重疊差役例各減耗貧虚逃亡破敗而州郡事多差役難減徃徃將第三第四等人差充第一等色役亦有主户小處差稍有家活客户充役勾當如此上下窘乏之際惟義勇正副指揮使豈容獨免兼自差管轄義勇以來已避免却數年色役當衆人苦於勞耗之際獨􅀗寛優之幸已多兼臣累過州軍體問得逐處義勇指揮使等家業例皆物力不減人丁又多若令一例差役可以貧冨均濟稍寛已困之民其都轉運司起請伏乞朝廷特賜允許施行今具狀奏聞伏候勑㫖舉米光濬狀右臣伏自準勑計置河東㳂邊粮草所過州軍遍見文武官吏不少其間臨民治軍可稱邊任者絶難得人伏見西頭供奉官閤門祗候岢嵐軍使米光濬年四十餘世家代州熟知本路邊事出於將種練習兵機兼有膽勇㑹弓馬自到岢嵐二年處置皆合事宜昨代州寧化各爲守將非才引惹北人爭侵疆界惟岢嵐草城川正當北界要害之地去年北人來侵疆界光濬應機拒守故獨岢嵐得不侵却地土亦不張皇臣自過本軍體問軍民備得其實伏覩近降宣命指揮差李偉替令赴闕切以邊鄙常患難材苟得其人豈宜屢易兼自有移替宣命軍民並各衆狀舉留其米光濬臣今同罪保舉再任岢嵐如再任後犯入已贓及邊防軍政但有一事敗悮並甘連坐今欲具狀奏聞伏候勑㫖米光濬斬决逃軍乞免勘狀右臣訪聞岢嵐軍昨於四月中捉􅀗逃走萬勝長行張貴虎翼張貴李徳等三人並係禁兵本軍勘正法司檢用編勑禁軍料錢滿五百文逃走捕捉􅀗者處斬訖奏其張貴等並依法處斬訖本路轉運司檢㑹先降令勑春夏不行斬刑合决重杖處死糺駮本軍不合斬斷見差嵐州團練判官劉述取勘岢嵐軍使米光濬等竊縁岢嵐軍地接西北二虜正是秋冬大屯軍馬之處若管軍將率斬一逃軍却遭勘罰則無由統衆漸啓兵驕況重杖與處斬俱是死刑無所失入運司守令勑糺按雖執常科兵官以軍令斬人亦是常事況米光濬等勘成公案亦不過得違制失入刑名論情定罪所犯至輕沮將率以長兵驕其損不細伏乞朝廷只作訪聞此事特降聖㫖與免勘劾所貴㳂邊將率知朝廷委遇之恩盡心効用兵戎畏肅不致驕恣生事謹具狀奏乞減配賣銀五萬兩狀右臣伏見河東路轉運司近準三司從京支撥得銀十萬兩於本路州軍配賣見錢臣體問得此銀本非運司因闕乏陳乞忽自省司特行支撥蓋是朝廷優恤三路軍須不足特此輟賜助濟用度以舒疲民又慮朝廷訪聞今年河東二麥大熟欲使將此銀十萬兩乗時収糴軍儲有以見聖心憂念邊防寛䘏民力臣昨因至寧化軍有百姓衆狀經臣馬前陳訴爲配銀數多臣遂取索本軍人户物力次第及前後配歛數目看詳本軍人户全少城郭主客十等共三十四戶内五等巳上只十五户其餘六等已下貧弱之家共有一十九户去年共配銀三百兩數月枷棒催驅方能了納今年所配一千兩比常年三倍是致百姓送納不前衆狀詞訴又縁寧化軍屯兵不多本軍自有納便鹽錢及諸雜課利見錢不致闕用本軍地寒民不種麥又無夏糴倉當其軍用未闕民間難得錢時可惜虚困民力臣巳牒本軍且令配賣五百兩其餘别候朝㫖尚慮河東一路州軍極有見今未至闕錢及地髙不種二麥無可収糴去處不宜一例急歛横困疲民臣今欲乞聖慈特下本路轉運司令將已分銀十萬兩除見今闕錢州軍及二麥大熟合行収糴處依數配賣其餘見不闕錢及不糴夏麥處且只配一半候闕錢不得已即漸漸分配所貴少紓民力上副陛下憂民念邊之意謹具狀奏聞伏候勑㫖相度銅利牒當所據澤州進士閻玠司法叅軍萬頥等狀並爲河東皷鑄鐵錢盗鑄者不少竊見絳州稷山垣曲縣三處皆有銅鑛欲乞遍徃有銅鑛處宻切詢訪採取烹煉皷鑄錢幣者當所檢尋古跡翼城縣有唐錢坊一在縣東十五里翔臯山下又有唐王城冶在縣北平城三十六里又有曹公冶在縣東南七十五里又有廢銅窟在縣西三十里稷山縣甘祚郷有銅冶村絳縣有唐古銅冶在縣南五十里含山谷内垣曲縣有錢坊在縣西北九十二里程子村銅源監内自唐以來絳州舊曽皷鑄銅錢鑪冶古跡見在其廢巳乆山澤銅鑛産育必多兼訪知絳州人户多私採鑄貨賣銅器近年錢幣闕乏以來亦曾有人獻言乞尋銅鑛烹鑄前後差官尋訪多是不曉事體張皇驚擾私鑄之家避犯禁之罪不肯指引採取又鑛銅側近民居懼見官中興置爐冶各相蔽固並稱無銅所差官貟又不盡心多方求訪遂使銅寳不能興發須議專委通幹之官宻切求訪者右具如前欲牒絳州管界廵檢孫借職仰細詳前項事理只作界内廵警名目遍至四縣多設方畧先且誘賺得民間私賣銅器一兩件然後訽求出鑛之家及細問烹煉之法須使姦民不能隠蔽或須要私鑄之人指引烹煉即設權宜許其免罪或别加酬􅅄務要求出銅寳不爲民間藏閉候見次第宻具公文囬申無至張皇悮事者再乞减配銀狀右臣近爲三司抛降銀一十萬兩與河東諸州軍配賣臣尋體量得河東諸州軍錢糧各有準備見今不至闕乏民間即目難得見錢遂曽具狀論奏且欲配賣一半乞朝廷特降指揮與都轉運司後來聞有朝㫖只與減得些小價錢其諸州軍百姓累經臣告訴並稱銀價雖然不髙各爲見錢難以變轉伏縁河東州軍昨來只是澤潞兩州二麥大熟晉絳并汾石隰等處係種麥地分並只熟及三五分其秋稼尋遭夏旱垂欲焦死近方得雨只可救得四五分見今物價甚髙民間窘急無異㐫􅀊況配賣銀絹乃是緩急不得巳之事今諸州軍幸各錢糧不闕不必非時抑配重擾人民只可留之以備緩急若巳知縣官實爲闕乏則勵力供納自不怨嗟以理論之其銀盡可罷配又縁都轉運司已俵與州軍故臣且乞只配一半日近臣不住見百姓以配銀爲苦已牒諸州軍且令先配一半其餘聽候朝㫖比欲候臣到闕更自論請竊慮臣離河東後轉運司依舊催促盡令俵配伏望聖慈特賜矜恤仍乞檢㑹臣前後奏狀早降朝㫖再舉米光濬狀右臣近曽同罪奏舉西頭供奉官閤門祗候米光濬再任岢嵐軍使竊知朝廷爲光濬病患曽加體量臣昨徃岢嵐親見光濬絶無病狀體問得去年偶因飲酒暫曽不安竊縁本人有心力㑹弓馬諳熟邊事善撫軍民況岢嵐當草城川一路地形平坦與北虜止隔界壕不比代州尚有險固捍禦控扼尤藉得人臣甞見朝廷選擇邊將比及於武臣中求得一人常患難得而任使俟其知次第亦須年􅀊之間其米光濬於武臣之中不易多得在岢嵐旣乆乆巳知次第其人旣不病患又無過犯料其替去别得差遣必與今任輕重一般與其移易徃來不若責之乆任況知光濬亦累曽乞替臣今所舉非徇光濬之私蓋爲邊防之計其米光濬伏望聖慈特加􅅄擢與優轉一官且令再任以防緩急可以使喚如朝廷遷官及再任後犯入已贓及邊事有所敗悮臣並甘同罪論礬務利害狀臣昨準三司牒繳連録到晉州博賣生熟礬始末一宗事理及備録中書批狀牒臣候到河東與施昌言等同共相度經乆利害聞奏臣未到河東間施昌言等巳一面先具相度申奏訖尋又準中書劄子送下施昌言等奏狀付臣奉聖㫖更切相度具經乆利害聞奏者臣看詳都運司狀内元牒晉州通判殿中丞榮諲相度事節似有未便遂牒并州通判祕書丞張日用就晉州計㑹榮諲取索一宗文字子細議定經乆利害尋據張日用狀果與榮諲始􅀄相度利害不同今具畫一如後一晉州折博務元定年額錢一十六萬餘貫自來許客人入中紬絹絲綿見錢茶貨筭請生礬上京重别煎煉後取便賣與通商路分客人後至景祐四年三司爲客旅並不入銀絹見錢只將茶貨入納遂額定令客人毎年於晉州折博務入納茶一十萬斤在京榷貨務入納見錢五萬貫文自此杜昇李慶等六户管認上件年額錢茶等請生礬於京師重煎貨賣一慶曆元年河東都轉運司始於晉州官置鍋鑊自煎熟礬一面勒杜昇等六户依舊管認年額錢茶博筭生礬一面將新煎熟礬别招客旅出賣是致杜昇等六户稱積壓礬貨出賣不行累年拖欠課利有煩官司催督及引惹六户詞訴不絶一據榮諲元狀内聲􅀃晉州起立煉礬重煎作明白熟礬貨賣慶曆元年入到絲綿見錢五萬七千八百餘貫并収在京入納見錢及晉州入到茶錢一十一萬六千八百餘貫都収一十七萬四千六百餘貫慶曆二年収絲絹綿錢四萬二千餘貫并錢茶都収一十九萬五百餘貫慶曆三年収絲綿錢四萬七千餘貫并錢茶都収二十萬五千餘貫自晉州置煉礬務後來比祖額各有増剰況自六家撲斷後來景祐四年只賣過生礬五十五萬七千餘斤寳元元年賣過生礬七十二萬二千餘斤寳元二年賣過生礬三十五萬一千餘斤康定元年賣過生礬三十六萬五千餘斤自慶曆元年起置煉礬務重煎後來當年支賣生熟礬八十四萬九千餘斤慶曆二年支賣生熟礬八十五萬五千餘斤慶曆三年支賣生熟礬一百四萬六千餘斤比附未煎已前逐年大有増剰今相度欲乞依巳前體例指揮在京榷貨務及本州折博務出牓告示招召諸色客旅投狀在京入納見錢及取便於晉潞等州入納茶貨金銀錢帛絲布斛㪷更不限定人數姓名斤兩多少取便依則例入折博筭請晉州重煉熟礬兼問得晉慈州生礬染麄色亦可以生使並許依則例筭射興販更不拘定杜昇等六户認納年額錢茶仍乞指揮逐户將煎礬鍋鑊家事納官今後更不􅂨私重煎只令晉州煉礬務一面重煎収辦課利一據張日用狀與晉州通判榮殿丞將慶曆元年置煎礬務後収到課利比對本州煎礬務止賣到折撲見錢五萬七千八百二十三貫八百三十文在京六户納折到錢一十一萬六千八百三十八貫八百五十文慶曆二年本務止賣到四萬二千一十八貫一百一十文在京六户収到一十四萬八千四百八十六貫五十文慶曆三年本務収到四萬七千二百三十三貫七百五十五文在京六户収到一十五萬八千三百四十五貫三百五十文是煉礬務出賣得錢常少六户入納數目常多遂將三年置到煎礬務通比皆不過五萬貫及四萬貫今年自正月一日至六月終収到入絲課利錢一千九百五十九貫有零課利不敷惟是六户逐年納數常多若遂放令六户逐便必致大段􅃜少課利況今用兵之際若行寛法客人有利必􅀊額遂増今將三年止於五萬數目遂便止令官賣必恐大􅃜年計今乞廢罷晉州煉礬務一就令在京六户管認年額錢茶所貴經乆通行逐年入得茶貨充備河東路并汾等十餘州軍支折和糴有備不致悮闕右謹具如前臣今將三司録到一宗始末文字子細看詳蓋由河東都轉運司改法官自煉礬出賣見一時之小利致經乆之難行從􅀄本爲課額不敷遂定爲錢茶十五萬數許六户管認即不當更自官賣與其爭利若云官賣有利則六户便合除免年額臣今看詳榮諲張日用等二人狀内開􅀃自官置煉礬務後來逐年所賣生熟礬折撲到見錢數目蓋是榮諲從􅀄將生熟兩色礬博賣到錢數衮合比筭便謂自起立煉礬務後來年額課利増盈遂欲罷六户筭請生礬舊額及榮諲再與張日用等子細將生熟兩色礬課利遞年比􅀋其熟礬自慶曆元年只賣及五萬二年三年已只及四萬貫有零今年自正月一日至六月終半年只賣及一千貫若將生礬貨利與熟礬衮合筭數則似有増盈若各别比較則熟礬賣錢全少又一年􅃜於一年今若依榮諲罷賣生熟礬即據近年課利􅃜減次第必慮向去無客筭請􅃜䧟官中年額錢茶臣今相度欲乞官罷自煎熟礬出賣只令杜昇等六户依舊管認年額入納錢茶十五萬數將見今晉州已煎下熟礬并生礬相兼其六户本爲官賣熟礬侵爭其利致其積壓貨賣不行今若官罷自賣則六户更難詞􅀃如此則官中雖􅀊失三五萬貫自賣之利而於錢茶十五萬舊額却有準的不至􅃜䧟必若不欲抑勒六户認額即乞未立定年額但選差清強官吏剏新一面博賣熟礬候三二年取一年爲定額蓋縁熟礬見巳課利大􅃜若自新官賣必不能敷及遞年與生礬俱賣時常額免使監臨官吏枉遭決罰年計用度虚爲指準於此二􅀃伏乞朝廷裁擇施行論西北事宜劄子臣昨在河東聞北虜事宜􅀃者多端而少實其役兵動衆修城堀壕凡所興爲則有蹤跡昨三月四月之間於北界地名大栁谷銀瓮口與蕃族相殺契丹累敗折却主將數人見今抄􅀧中軍秋冬必大交戰此亦􅀃者多同而不虚惟云夾山部落叛歸元昊契丹與西賊相攻又云西賊見在河灣㑹劄寨兵馬尤多或云二虜詐謀欲合而攻我此一事則􅀃者雖多而以人情料之皆不可信自西賊叛我以來更事契丹甚謹蓋已與中國交爭則屈已事隣乃其常理二虜自來未聞釁􅂩而忽納夾山小族反與契丹立爲大敵但恐元昊􅃛羌不爲此事以此言之不可信也契丹若冦邊鄙當先自河北不應便出河東若云出吾不意則兵釁未成必未突然入吾險地是北虜必不攻河東矣西賊二年之間累次遣人通好國家過當許物已多今盟約垂成而忽借契丹數百里之路﨑嶇勞師入吾險固以此而言是西賊必不攻河東此其不可信者也然北戎抄􅀧人馬聲張巳乆今漸向秋必已聚集邊臣但見虜兵聚在界上不得不至驚疑惟在朝廷料敵制謀養威持重不爲輕發使虜不可窺則得計矣其宻爲禦備次第臣今具管見畫一如後一據今事宜不問北虜攻夾城與元昊但不過夷狄自相攻耳然虜兵在我境上不可不爲支準惟當持重以待未宜便若冦至而大集窮邊虚成自擾但訓兵練卒於并忻嵐憲屯結以俟太原去忻州一日半可至忻州去代州一日半可至嵐州去岢嵐一日中可至憲州亦然今以兵屯忻并而應援代州屯嵐憲而應援岢嵐賊至則使代州岢嵐堅壁清野待其師老徐以忻嵐等兵擊之此用兵之法也如此則虜來不失應敵不來不至虚驚其代州岢嵐但用去年防秋兵數可矣惟治器械擇將帥此非倉卒可辦宜急爲之具一河東㳂邊州軍器械全然不堪臣昨到彼見逐處弓弩無十數枝可施用者問其何故云爲省司惜筋膠支請不得縱支得即角短筋碎不堪使用乆無物料修治是致廢壞臣亦知京中筋膠角絶少然若遍支與諸州軍即恐不及欲乞且只支與㳂邊州軍仍乞選差幹事官逐州自遣一貟上京支請便令自監脩􅀘其諸州木羽箭臣曽逐色用草人􅀍甲去三十歩以硬弩射之或箭幹飛掉不至或箭頭卷折不入甲此乃臨陣悮事之物十無一二堪者惟舊竹箭雖翎損鏃生秀然射之亦能入甲又數目不多亦乞委官㨂􅀧脩換一代州知州康徳輿老懦不濟事臣方欲到京奏乞替却近知已差張亢然徳輿却充并代鈐轄只此職亦非徳輿所堪乞與一近裏小處知州鈐轄别選差人一代州諸寨主監押三十餘貟内無三四人能幹而曉事者伏乞早行替換仍乞於近日臣寮準宻院劄子舉到堪充將領人内差充寨主監押一岢嵐軍地接草城川口無險可恃而城小壕淺須合増城浚壕乞降指揮下河東那打白草廂軍及本軍係役兵士早併力脩葺臣曽兩狀奏乞米光濬且令知軍蓋光濬已知彼中次第當事宜之際若李緯乍到恐處事未盡合宜又緯必非岢嵐乆住之人其米光濬伏乞檢㑹臣前奏施行取進止論宣毅萬勝等兵劄子臣昨準勑差徃河東續準樞宻院劄子奉聖㫖所到州軍體量諸軍指揮自來習學武藝并教閱戰陣次第精與未精緩急堪與不堪陣敵使喚者臣尋至諸州軍令主兵官吏依常式教閱觀其精粗所用陣法除四官陣舊法外亦有自爲新陣者大抵只是齊得進退不亂行伍而巳諸處所較不多其陣法則皆未可用惟有踏硬射親最爲實藝見今經略司分差主將諸州廵教以三等弓弩拍試漸次亦當精熟然而主將不一器械不精此二事須更别爲制置其諸軍禁兵共九萬五千餘人内駐泊兵三萬餘人惟萬勝最多最不精本路就糧禁兵六萬餘人惟宣毅最多最不精臣今欲乞定主將精器械此二事條目甚多容臣續具畫一其宣毅萬勝等兵臣今先具起請如後一臣勘㑹河東駐泊禁兵六十八指揮共三萬二千餘人内萬勝二十指揮一萬一千一百餘人當􅀄招募倉卒不能精擇此中外共知自到河東巳及三年其射親踏硬弩比􅀄到則漸慣熟但其人大小強怯不等又不耐辛苦其事藝勉力不及河東最下清邊而料錢請受與最上神衞等見今多差在河外五寨縁請受旣大於他軍則重難倫次須至差撥其使喚乃不及下軍緩急常憂敗悮臣今欲乞於河東見在廂軍三萬人數内㨂少壯有勇力者増置清邊及於京師差撥三百料錢禁軍充足一萬人數抵替萬勝抽回兼其人到河東巳二年餘人各有辛苦思歸之意一臣勘㑹河東本路就糧禁兵共一百四十九指揮六萬二千七百餘人内宣毅四十四指揮二萬二百餘人宣毅招揀不精無異萬勝惟河東稍勝諸路蓋土人天性勁勇耐辛苦然終是不及自投軍者其農夫生梗難以教訓至今全未堪使喚臣到澤州有一指揮只㨂出九十餘人呈教尚亦生踈威勝軍兩指揮内一指揮絶然不成次第問之云差出近方歸本營蓋河東多將宣毅差在廵檢下及諸處便不教閱臣今欲乞將見在宣毅委河東都轉運使親至諸州將短小怯弱者先揀退充廂軍其餘堪教者不得差徃廵檢下及防河寨栅不教閱處專令逐州軍教一二年必漸可用論麟州事宜劄子臣昨奉聖㫖至河東與明鎬商量麟州事縁臣未到間鎬已一面與施昌言等先有奏議尋再準樞宻院劄子備録鎬等所奏令臣更切同共從長相度臣遂親至河外相度利害與明鎬等再行商議乞那減兵馬人數可以粗減兵費已具連署奏聞此外臣别有短見合盡條陳其利害措置之􅀃列爲四議一曰辨衆􅀃二曰較存廢三曰減寨卒四曰委土豪如此則經乆之謀庶近禦邊之䇿謹具畫一如後一曰辨衆􅀃者臣竊詳前後臣寮起請其􅀃有四或欲廢爲寨名或欲移近河次或欲抽兵馬以減省饋運或欲添城堡以招輯蕃漢然廢爲寨而不能減兵則不若不廢苟能減兵而省費則何害爲州其城壁堅完地形髙峻乃是天設之險可守而不可攻其至黄河與府州各􅂊百餘里若徙之河次不過移得五七十里之近而弃易守難攻之天險以此而言移廢二􅀃未見其可至如抽減兵馬誠是邊議之一端然兵冗不獨麟州大弊乃在五寨若只減麟州而不減五寨與不減同凢招輯蕃漢之民最爲實邊之本然非朝廷一力可自爲必須委付邊臣許其乆任漸推恩信不限􅀊年使得失不繫於朝廷之急而營緝如其家事之專方可収其逺効非二年一替之吏所能爲也臣謂減兵添堡之􅀃近之而未得其要二曰較存廢者今河外之兵除分休外尚及二萬大抵盡河東二十州軍以贍二州五寨爲河外數百邊户而竭數百萬民財賊雖不來吾巳自困使賊得不戰疲人之䇿而我有殘民歛怨之勞以此而思則似可廢然未知可存之利今二州五寨雖云空守無人之境然賊亦未敢據吾地是尚能斥賊於二三百里外若麟州一議移廢則五寨􅀔亦難存兀爾府州便爲􅀌壘而自守不暇是賊可以入據我城堡耕牧我土田夾河對岸爲其巢穴今賊在數百里外㳂河尚費於防秋若使夾岸相望則泛舟踐氷終􅀊常憂冦至㳂河内郡盡爲邊戍以此而慮則不可不存然須得存之之術三曰減寨卒者臣勘㑹慶曆三年一年用度麟州用糧七萬餘石草二十一萬餘束五寨用糧一十四萬餘石草四十萬餘束其費倍於麟州於一百二十五里之地列此五寨除分兵歇泊外尚有七千五百人别用二千五百人􅀒糧又有并忻等十州軍百姓輸納外及商旅入中徃來其冗長勞費不可勝言逐寨不過三五十􅀐廵綽伏路其餘坐無所爲蓋􅀄建五寨之時本不如此寨兵各有定數建寧置一千五百人其餘四寨各止三百至五百今之冗數並是後來増添臣謂今事宜稍緩不比建寨之􅀄然且約舊數尚不至冗費臣請只於建寧留一千人置一都廵檢其鎮川中堠百勝三寨各留五百其餘寨兵所減者屯於清塞堡以一都廵檢領之縁此堡最在近東隔河便是保徳軍屯兵可以就保徳軍請糧則不煩輸運過河供饋若平日路人宿食諸寨五百之卒廵綽有餘或些小賊馬則建寧之兵可以禦捍若賊數稍多則清塞之兵不失應援蓋都不去百里之内非是減兵但那移就食而巳如此則河外省費民力可紓四曰委土豪者今議麟州者存之則困河東弃之則失河外若欲兩全而不失莫若擇一土豪委之自守麟州堅險與兵二千其守足矣況所謂土豪者乃其材勇獨出一方威名旣著敵所畏服又能諳敵情僞凢於戰守不至乖謀若委以一州則其當自視州如家繫巳休戚其戰自勇其守自堅又其旣是土人與其風俗情接人頼其勇亦喜附之則蕃漢之民可使漸自招集是外能捍賊而戰守内可輯民以實邊省費減兵無所不便比於命吏而徃凢事仰給於朝廷利害百倍也必用土豪非王吉不可吉見在建寧寨蕃漢依吉而耕於寨側者已三百家其材勇則素巳知名况其宫序自可知州一二年間視其後効苟能善守則可世任之使長爲捍邊之守右臣所陳乃是大計伏望聖慈特賜裁擇若可以施行則紓民減費之事容臣續具條列取進止乞罷鐵錢劄子臣準中書劄子備録臣寮四狀並爲上言河東大小鐵錢事奉聖㫖相度利害聞奏者臣尋至河東取索晉澤二州鑄錢監及諸州軍見使鐵錢數又將都轉運司供到慶曆三年一年都収支錢數約度用度多少及探問軍民用鐵錢便與不便今具利害畫一如後一見在大小鐵錢數大鐵錢自起鑄至目下共鑄到四萬四千八百餘貫小鐵錢自起鑄至目下共鑄到一十一萬七千七百餘貫是大小鐵錢未及六十萬貫銅錢數見在官私行用一大小鐵錢官本及淨利數目晉州大錢計用一萬七千八百餘貫省陌銅錢官本鑄成大錢二萬八千八百餘貫當二十八萬八千餘貫銅錢凢用一萬七千餘貫本得一十七萬餘貫利其利約一十五倍有餘晉州小錢計用四萬六千貫足陌銅錢官本鑄成一十一萬四千五百餘貫凢用四萬六千貫本得六萬八千餘貫淨利其利一倍有餘澤州大錢計用六千四百餘貫省陌銅錢官本鑄成大錢一萬六千餘貫省當一十六萬餘貫銅錢九用六千四百餘貫本得一十五萬三千八百餘貫利其利二十三倍有餘澤州小錢計用九百八十貫省陌銅錢官本鑄成四千餘貫凢用九百餘貫大得三千餘貫利其利兩倍一都轉運司一年支収錢數實収諸雜課利客便賣鹽礬斗秤夏秋稅出糴斛斗賣疋帛絲綿銀進納雜収等錢二百一十七萬二千二百三十貫實支係隨衣添支特支料錢旬設公使國忌獄空祭神地里脚錢買羊馬糧草客便招軍人户和糴礬本雜支等錢一百九十九萬八千四百一十四貫右謹具如前臣今相度大小鐵錢其可廢者有五據都轉運司慶曆三年一年支収實數比筭實収二百一十七萬二千餘貫實支一百九十九萬八千餘貫是毎􅀊只將河東一路實収錢支遣自足外尚有一十七萬四千餘貫剰數其大小鐵錢可以罷鑄一也小鐵錢將本利計筭其利甚薄不過一倍略將鑄造工課約筭兩監逐日共鑄不過四百貫文一􅀊不過鑄得十六萬貫内除約六萬貫爲官本外只􅀗淨利十萬貫若罷大錢而只用小錢是一􅀊爲十萬貫錢而壞銅錢舊法䧟民刑戮者不絶其大錢利旣博至二十餘倍議者皆謂其利厚於黄白術雖有死刑不能禁止臣昨在河東於提刑司取索得犯私錢人數已五火自臣出界後又續供到新捉􅀗二火是小錢利薄不足鑄大錢犯法者日漸多皆可以罷鑄二也今開厚利之門而致人死法則誘愚民以趍死若貸其死則犯者愈多急於捕察則良民一例搔擾縱而緩禁則民不勝姦是深法不可緩法又不可捕察又不可縱之又不可以此而言其可罷三也用之旣乆幣輕物貴惟姦民盗鑄者􅀗利而良民與官中常以髙價市貴物是官私乆逺害深其可罷四也臣勘㑹河東十九州軍凢四十九處剏新開沽酒務據轉運司供到每月約収二萬貫有餘計一􅀊合得二十四五萬貫又麟州元許入中七萬石斛㪷昨來爲入中乞免諸州一年支移劄子臣昨至河東體訪一路百姓貧弊勞擾本爲河外麟府二州闕少軍糧遂於近裏二十州軍逓相支配今來麟州見在兵馬糧可支三年府州見有一十三萬石不支糧米諸寨各有糧不少兼臣将慶曆三年轉運司抛配秋稅支移數目勘筭得今年博糴斛㪷可以減放和糴可以不支過河如此則少紓民困大息怨嗟其科配減放次第今具畫一如後一河外麟州見有三年糧府州兵士見於河南保徳軍請給府州見有不支糧一十三萬石一去年并忻嵐憲石州岢嵐火山寧化保徳等軍凢九處和糴斛㪷共十四萬二千餘石支徃河外麟府二州送納今來河外糧斛已多上件九州軍和糴只乞於保徳軍送納一去年并忻汾遼潞晉絳澤石隰慈等州威勝平定軍凢十三處博糴斛㪷共一十七萬六千餘石徃保徳軍送納今來河外旣不支移那得并忻等九州軍和糴十四萬石於保徳軍納則此十三處博糴可以減放乞不配賣醋糟與人户劄子臣昨至忻州見百姓人户經臣出頭怨嗟告訴爲轉運司將十五年積壓損爛酒糟俵配與人户要清醋價錢縁已配納了當臣方欲奏乞今後不得抑配續據石州狀申本務見管醋糟六千餘石本州見取索在州及諸縣坊郭郷村酒户等第及州縣色役公人姓名欲行俵配次其糟毎㪷價錢二十五文足陌縁臣已離河東只曽行移文字且令未得俵配别候指揮臣欲乞特降朝㫖下轉運司今後醋糟只許官務造醋沽買及令百姓取便買糟醖醋不得抑配人户其糟所得之利不多但虚爲搔擾以歛怨嗟伏望聖慈特賜矜免其石州醋糟尚慮本州已行俵配即乞特與減落一半價錢令漸次送納河東奉使奏草卷上紹熈五年十月郡人王伯芻校正義勇指揮使代貧民差役奏狀小處小疑作少客户充役此下空處疑是勾字乞減配賣銀五萬兩狀將巳分銀銀字上脫配字論礬務利害狀都運司都字下疑脫轉字今後更不此下脫許字煉礬出賣此下一有徒字罷賣生熟礬一作罷生礬只賣熟礬論麟州事宜劄子合盡條陳一本以盡字爲畫一廵綽長編作下同坐無所爲坐一作别乞罷鐵錢劄子出糴斛斗糴疑作糶乞不配賣醋糟劄子沽買買疑作賣濮議卷第一歐陽文忠公集一百二十英宗皇帝初即位旣覃大慶於天下羣臣並進爵秩恩澤遍及存亡而宗室故諸王亦巳加封贈惟濮安懿王上所生父也中書以爲不可與諸王一例乃奏請下有司議合行典禮奏狀具别卷有旨宜俟服除其議遂格音閣治平二年四月上旣釋服乃下其奏兩制雜學士待制禮官詳議翰林學士王珪等議濮安懿王髙官大國極其尊榮而巳其議狀具别卷中書以爲贈官及改封大國當降制行册命而制册有式制則當曰某親具官某可贈某官追封某國王其册則當曰皇帝若曰咨爾某親某官某今册命爾爲某官某王而濮王於上父子也未審制册稱爲何親及名與不名乃再下其議而珪等請稱皇伯而不名其議狀具别卷中書據儀禮䘮服記云爲人後者爲其父母報又據開元開寳禮皆云爲人後者爲其所生父齊衰不杖期爲所後父斬衰三年是所後所生皆稱父母而古今典禮皆無改稱皇伯之文又歴檢前世以藩侯八繼大統之君不幸多當衰亂之世不可以爲法唯漢宣帝及光武盛徳之君也皆稱其父爲皇考而皇伯之稱旣非典禮出於無稽故未敢施行乃略具古今典禮及漢孝宣光武故事并録皇伯之議别下三省集官與臺官共加詳議未及集議而皇太后以手書責中書不當一有議字稱皇考中書具對所以然其對劄子具别卷而上見皇太后手書驚駭遽降手詔罷議而追崇之禮亦寢後數日禮官范鎮等堅請必行皇伯之議其奏留中已而臺官亦各有論列上旣以皇太后之故決意罷議故凢一有有字言者一切留中上聖性聦睿英果燭理至明待遇臣下禮極謙恭然而不爲姑急臺官所論濮園事旣悉巳留中其言他事不可從者又多寢而不行臺官由此積忿出怨言并怒中書不爲施行中書亦甞奏云近日臺官忿朝廷不用其言謂臣等壅塞言路致陛下爲拒諫之主乞略與施行一二事上曰朝廷當以至公待天下若臺官所言可行當即盡理施行何止略行一二若所言難行豈當應副人情以不可行之事勉強行之豈不害事耶中書以上語切中事理不敢更有所請一作言上仍問曰所言莫有可行而未行者否韓􅄾巳下相顧曰實無之因一有奏字曰如此則未有是時雜端御史數人皆新􅀍擢用銳於進取務求速譽見事輙言不復更思職分故事多乖繆不可施行是時京師大雨水官私屋宇倒塌無數而軍營尤甚上以軍士􅁀露聖心焦勞而兩府之臣相與憂畏夙夜勞心竭慮部分處置各有條目矣是時范純仁新除御史初上殿中外竦聽所言何事而第一劄子催修營房責中書何不速了因請每一營差監官一貟中書勘會在京倒塌軍營五百二十坐如純仁所請當差監官五百二十貟每貟當直兵士四人是於國家倉卒多事闕人之際虚破役兵二千人當直五百貟監官而未有瓦木笆箔一併興修未得其狂率踈繆如此故於中書聚議時臣脩不覺􅀏之而臺中亦自覺其非後數日吕大防再言乞兩營共差一官其所言煩碎不識事體不可施行多􅀋此而臺官不自知其言不可施一無此字行但怨朝廷沮而不行故吕大防又言今後臺官言事不行者乞令中書具因何不行報臺其忿戾如此而怨怒之言一作語漸傳於士大夫間臺官親舊有戯而激一作咲之一有者字曰近日臺官言事中書盡批進呈訖外人謂御史臺爲進呈院矣此語甚著朝士相傳以爲戯􅀏而臺官益怏怏慙憤遂爲決去就之計以謂因言得罪猶足取美名是時人主聖徳恭儉舉動無差失兩府大臣亦各無大過未有事可決去就者惟濮議未定乃曰此好題目所謂竒貨不可失也於是相與力言然是時手詔旣巳罷議皇伯皇考之說俱未有適從其他追崇禮數又未甞議及朝廷於濮議未有過失故言事者但乞早行皇伯之議而已中書以謂前世議禮連年不決者甚多此事體大況人主謙抑巳罷不議有何過舉可以論列於是置而不問臺官羣至中書􅀭言曰相公宜早了此事無使一作與他人作竒貨上亦已決意罷議故言者雖多一切不聽由是臺官愈益愧耻旣􅀔不能止又其本欲以言得罪而買名故其言惟務激怒朝廷無所忌憚而肆爲誣罔多引董宏朱博等事借指臣某爲首議之人恣其醜詆初兩制以朝廷不用其議意巳有不平一有者字及臺憲有言遂翕然相與爲表裏而庸俗中下之人不識禮義者不知聖人重絶人嗣凡無子者明許立後是大公之道但習見閭閻俚俗養過房子及異姓乞養義男之􅀋畏人知者皆諱其所生父母以爲當然遂以皇伯之議爲是臺官旣挾兩制之助而外論又如此因以言惑衆云朝廷背棄仁宗恩徳崇􅅄濮王而庸俗俚巷之人至相語云待將濮王入太廟換了仁宗木王中外汹汹莫可暁諭而有識之士知皇伯之議爲非者微有一言佑朝廷便指爲姦邪太常博士孫固甞有議請稱親議未及上而臺官交章彈之由是有識之士皆鉗口畏禍矣乆之中書商量欲共定一酌中禮數行之以息羣論乃略草一事目進呈乞依此降詔云濮安懿王是朕本生親也羣臣咸請封崇而子無爵父之義宜令中書門下以塋爲園即園立廟令王子孫歳時奉祠其禮止於如此而已乃是歳九月也忘其日矣上覽之略無難色曰只如此極好然湏白過太后乃可行且少待之是時漸近南郊朝廷事多臺議亦稍中息上又未暇白太后中書亦更不議及郊禋旣罷明年正月臺議復作中書再將前所草事目進呈乞降詔上曰待三兩日間白過太后便可施行矣不期是夕忽遣髙居簡就曾公亮宅降出皇太后手書云濮王許皇帝稱親又云濮王宜稱皇三夫人宜稱后與中書所進詔草中事絶異而稱皇稱后二事上亦不曾先有宣諭從初中書進呈詔草時但乞上直降詔施行初無一語及慈壽宫而上但云欲白過太后然後施行亦不云請太后降手書此數事皆非上本意亦非中書本意一作議是日韓􅄾以祠祭致齋惟曾公亮趙槩與臣脩在垂拱殿門閤子内相顧愕然以事岀不意莫知所爲因請就致齋處召韓􅄾同取旨少頃􅄾至不及交言遂同上殿􅄾前奏曰臣有一愚見未知可否上曰如何􅄾曰今太后手書三事其稱親一事可以奉行而稱皇稱后乞陛下辭免别降手詔止穪親而却以臣等前日進呈詔草以塋爲園即園立廟令王子孫奉祠等事便載於手詔施行上欣然曰甚好遂依此降手詔施行手詔具别卷􅀄中外之人爲臺官眩惑云朝廷尊崇濮王欲奪仁宗正統故人情汹汹及見手詔所行禮數止於如此皆以爲朝廷處置合宜遂更無異論惟建一作是皇伯之議者猶一作稍以稱親爲不然而吕誨等已納告勑杜門不岀其􅀔亦難中止遂專指稱親爲非益肆其誣罔言韓埼交結中官蘇利渉髙居簡惑亂皇太后致降手書又專指臣脩爲首議之人乞行誅戮以謝祖宗其奏章正本進入副本便與進奏官令傳布誨等旣欲得罪以去故每對見所言悖慢惟恐上不怒也上亦數諭中書云誨等遇人主無復君臣之禮然上聖性仁厚不欲因濮王事逐言事官故屈意含容乆之至此知其必不可留猶數遣中使還其告勑就家宣召旣決不出遂各止以本官除外任蓋濮園之議自中書始初建一作啓請以至稱親立廟上未嘗有一言欲如何追崇但虚懷恭己一付大臣與有司而惟典禮是從爾其不稱皇伯欲稱皇考自是中書執議上亦無所偏執及誨等累論乆而不決者蓋以上性嚴重不可輕回謂巳降手詔罷議故稱伯稱考一切置而不議爾非意有所偏執也上甞諭韓􅄾等云昔漢宣帝即位八年始議追尊皇考昨中書所議何太速也以此見上意慎重不敢輕議耳豈欲過當追崇也至於中書惟稱號不敢用皇伯無稽之說欲一遵典故耳其他追崇禮數皆未甞議及者蓋皇伯皇􅀍黜便是忠臣而爭爲之譽果如誨等所料誨等旣果以此得虚名而薦誨等者又欲因以取名夫􅀭君之惡而彰已善猶不可況誣君以惡而買一作賣虚名哉嗚呼使誨等心迹不露而誣罔不明先帝之志不諭於後世臣等之罪也故直書其實以備史官之采濮議卷第一筆說一卷歐陽文忠公集一百二十九老氏說前後之相隨長短之相形推而廣之萬物之理皆然也不必更言其餘然老子爲書比其餘諸子已為簡要也其於覈見人情尤為精爾非莊周慎到之倫可擬其言雖若虚無而於治人之術至矣冨貴貧賤說貧賤常思冨貴冨貴必履危機此古人之所嘆也惟不思而得旣得而不患失之者其庶幾乎冨貴易安而患於難守貧賤難處而患於易奪居冨貴而能守者周公也在貧賤而能乆者顔回也然爲顔回者易爲周公者難也君子小人之用心常異趣於此見之小人莫不欲冨貴而不知所以守是趣禍罪而惟􅂲不及也君子莫不安於貧賤爲一无此字小人者不閔則笑是閔笑人之不捨其所樂而趍於禍罪也其爲大趣相反如此四字一作如此之反則其所爲不得不事事異也故與小人共事者難於和同凡事不和同則不濟古之君子有用權以合正者爲至難也若其一作有事君之忠主於誠信有欲濟其事顧不害其正亦有用權之助者此可以理得難以言傳孔子所以置而不論也推誠以接物有害其身者仁人不悔也所謂殺身以成仁然其所濟者逺矣非常情之可企至也鍾莛說甲問於乙曰鑄銅爲鍾削木為莛以莛叩鍾則鏗然而鳴然則聲在木乎在銅乎乙曰以莛叩垣墻則不鳴叩鍾則鳴是聲在銅甲曰以莛叩錢積則不鳴聲果在銅乎乙曰錢積實鍾一有則字虚中是聲在虚器之中甲曰以木若泥爲鍾則無聲声果在虚器之中乎駟不及舌說俗云一言出口駟馬難追論語所謂駟不及舌也若較其理即俗諺為是然則泥古之士學者患之也學書靜中至樂說有暇即學書非以求藝之精直勝勞心於他事爾以此知不寓心於物者真所謂至人也寓於有益者君子也寓於伐性汩情而爲害者愚惑之人也學書不能不勞獨不害情性耳要得靜中之樂者惟此耳夏日學書說夏日之長飽食難過不自知愧但思所以寓心而銷晝暑者惟據按作字殊不為勞當其揮翰若飛手不能止雖驚雷疾霆雨雹交下有不暇顧也古人流愛信有之矣字未至於工尚已如此使其樂之不厭未有不至於工者使其遂至於工可以樂而不厭不必取恱當時之人垂名於後世要於自適而巳嘉祐七年正月九日􅀘空學書自成家說學書當自成一家之體六字一作自家成一體其模倣他人謂之奴書安昌侯張禹曰書必博見然後識其真僞余實見書之未博者廬陵歐陽脩嘉祐三年十一月冬至日李白杜甫詩優劣說落日欲没峴山西倒着接籬花下迷襄陽小兒齊拍手大家爭唱白銅鞮此常言也至於清風明月不用一錢買玉山自倒非人推然後見其横放其所以警動千古者固不在此也杜甫於白得其一節而精強過之至於天才自放非甫可到也薛道衡王維詩說空梁落鷰泥未爲絶警而楊廣不與薛道衡解仇於泉下豈荒焬所趣止於此耶大風飛雲信是英雄之語也若漠漠水田飛白鷺隂隂夏木囀黄鸝終非已有又何必區區於竊攘哉峽州詩說春風疑不到天涯二月山城未見花􅀂無下句則上句何堪旣見下句則上句頗工文意難評蓋如此也辨甘菊說本草所載菊花者世所謂甘菊俗又謂之家菊其苗澤羙味甘香可食今市人所賣菊苗其味苦烈迺是野菊其實蒿艾之􅀋強名爲菊爾家菊性涼野菊性􅀬食者冝辨之余近來求得家菊植於西齋之前遂作詩云明年食菊知誰在自向欄邊種數叢余有思去之心乆矣不覺發於斯博物說蟪蛄是何棄物草木蟲魚詩家自爲一學博物尤難然非學者本務以其多不專意所通者少苟有一焉遂以名世當漠晉武帝有東方朔張華皆愽物道無常名說道無常名所以尊於萬物君有常道所以尊於四海然則無常以應物爲功有常以執道爲本逹有無之至理􅃴用捨之深機詰之難以言窮推之不以迹見物有常理說凡物有常理而推之不可知者聖人之所不言也磁石引針蝍蛆甘帶松化虎魄世人作肥字說世之人有喜作肥字者正如厚皮饅頭食之未必不佳而視其爲狀已可知其俗物字法中絶將五十年近日稍稍知以字書爲貴而追跡前賢未有三數人古之人皆能書獨其人之賢者傳遂逺然後丗不推此但務於書不知前日工書隨與紙墨泯棄者不可勝數也使顔公書雖不佳後世見者必寳也楊凝式以直言諫其父其節見於艱危李建中清慎温雅愛其書者兼取其爲人也豈有其實然後存之乆耶非自古賢哲必能書也惟賢者能存爾其餘泯泯不復見爾轉筆在熟說昨日王靖言轉筆誠是難事其如疑對以熟豈不爲名理之言哉往時陳堯咨以射藝自髙甞射於家圃有一賣油里翁釋擔而看射多中陳問爾知射乎吾射精乎翁對曰無他能但手熟耳陳忿然曰汝何敢輕吾射翁曰不然以吾酌油可知也乃取一胡盧設於地上置一錢以杓酌油瀝錢眼中入胡盧錢不濕曰此無他亦熟耳陳笑而釋之李晸筆說余書惟用李晸筆雖諸􅁑髙許頌皆不如意晸非金石安知其不先朝露以填溝壑然則遂當絶筆此理之不然也夫人性易習當使無所偏係乃爲通理適得聖俞所和試筆詩尤爲精當余甞爲原甫說聖俞壓韻不似和詩原甫大以爲知言然此無它惟熟而已蔡君謨性喜書多學是以難精古人各自爲書用法同而爲字異然後能名於後世若夫求恱俗以取媚兹豈復有天真耶唐所謂歐虞禇陸疑至於顔栁皆自名家蓋各因其性則爲之亦不爲難矣嘉祐四年夏納涼於庭中學書盈紙以付發峽州河中紙說夷陵紙不甚精然最柰乆余爲縣令時有孫文徳者本三司人吏也甞勸余多藏峽紙云其在省中見天下帳籍惟峽州不朽損信爲然也今河中府紙惟供公家及館閣寫官書爾誨學說玉不琢不成器人不學不知道然玉之爲物有不變之常徳雖不琢以爲器而猶不害爲玉也人之性因物則遷不學則捨君子而爲小人可不念哉付奕筆說卷終李晸筆說引歐虞褚陸參考周越古今法書􅁐及諸人􅀁論知陸名柬之虞世南甥亦學其書品在中上别有薛純學歐書又有薛稷皆非其比世􅂉􅁛歐虞褚薛故為之辨表奏書啓四六集卷第一歐陽文忠公集九十諌院謝賜章服表同王素慶曆三年九月臣某等今月日準閤門告報奉聖㫖來日改賜章服者臣等㝷以列狀具言供職以来未有能効不敢即受乞賜停寢明日朝于垂拱退立廡下俟命不報方共彷徨未知進退而閤門吏巳迫臣等入對及見于延和有司賛使俯伏受命臣等不勝惶恐趨出以辭伏􅀩遣中使宣諭云出自宸􅂨並不因臣僚薦舉不得辭讓臣等知君命甚寵不可必讓因退而拜受俯伏之際竦動羣臣伏惟陛下聖德仁慈優容臣下凢有上殿者多因事陳述自乞章服故陛下不因臣等奏事之時特召賜見又宣明命告以出自宸􅂨盖不欲使臣等雷同徼幸之流而爲外人譏議乃知陛下愛惜臣等至於如此臣等愛君憂國之勤自冝如何伏惟天地之恩無物可稱欲伸報謝惟有至誠今陛下以一章服賜臣等尚不欲令外人所非伏況陛下上承社稷之重下制元元休戚之命舉動得失所繫者大則臣等固當事無大小一一規正致陛下纎過小失不見于外然後可以稱臣等報君之心如陛下所以愛惜臣等之意臣等無任辭召試知制誥劄子慶曆三年十二月臣今早準中書傳指揮令臣到聚㕔處尋問得有聖㫖令臣就試伏念臣自忝諫垣言事無狀日月未乆恩渥己頻凢朝廷任用非人僥倖干進在於臣職皆所當言豈有自爲僥倖以冒榮寵其召試指揮伏乞特賜追寢取進止辭召試知制誥狀同前臣今日準中書召臣聞有聖語令臣就試已曽略具劄子辭免退而循省未止憂驚伏念臣本乏才能豈堪任用誤􅀩聖􅅄擢在諫垣竊自思惟無以論報但竭愚慮知無不爲凢姦邪在朝僥倖求進多以激訐沽名未察臣心紛然議誚臣亦自省忠國之節特惟陛下知之而可畏之言何由悉辨但誓不敢干進庶㡬乆乃自明今若驟覔寵榮越次升用則是譏議者謂臣向之所爲果是沽激本非爲國而去惡但務傾人而進身不惟使今後朝廷擢用忠言之臣不以自明而取信兼恐小人見言者得進旣速則各務奔趍一長其風遂成媮弊盖上干於國體非止徇於臣私況臣供職未乆言効無聞方今百度未脩四夷多事言者正當以失職坐黜豈可以亡狀遽遷其召試之命必望特賜追寢緣臣早來爲中書催召倉卒之際論述未詳謹再具狀奏聞辭直除知制誥狀同前今月六日準中書召臣試㝷曽具劄子幷奏狀辭免今日忽聞已有聖旨更不召試直除知制誥者伏以聖恩優異至寵至榮臣所以敢兹懇請者盖以上繫朝廷任人之體非專臣子飾讓之私唯冀聖明察臣悃愊竊以朝廷進用臣下患忠邪不分欲辨忠邪須覈情僞今一言事之臣得速進則小人好進紛然爭以口舌爲事至其甚弊理難抑絶則後來有讜言之士必雷同以干進見疑使君子小人情僞何別故臣以謂任人之體惟言事者不可以速冒寵榮臣累得對便殿奏事之際常陳此說伏況臣供職巳來日月未乆幸值陛下切於求理優容直言然而夷狄未賔盗賊未息官吏未汰􅀺民未蘇以事考言其効安在而數月之内恩典頻仍當黜而升冝罰而賞繫於國體則如前所陳揣於臣私則自知若此且夫設官賦祿本以勸善擢臣一人好進者得以奔趍無勞者皆容忝冒所損巳多伏望聖慈憫臣愚訥直降恩命特賜寢停辭免第二狀同前昨以準中書劄子爲臣累辭恩命奉聖㫖不得辭讓者伏以臣之事君有誠無飾若理必當受則豈敢虚辭上煩聖聰自䧟矯詐盖臣所陳述者上繫朝廷事體非獨專徇臣私如臣之愚本以言事者速進則僞言者誘以爭趍今若辭讓而不獲則僞讓者終於得進損之又損不如不辭臣猥以非材已左言責若陛下欲擢臣以責効則今所居之職自足展効但患無能若以寵典爲賞勞又無可賞伏況此來恩命特出聖心臣子至榮人所願得苟非深思熟慮理須避讓豈敢固自稽遲以干典憲伏望聖慈察臣至誠至懇所除誥勑早賜追還舉吕溱自代狀同前準先降勑節文應兩省臺官尚書六品已上諸司四品巳上授官訖具表讓一人自代於閤門投下方得入謝者右臣伏見著作郎直集賢院知蘇州吕溱首登辭科素有文學不肯碌碌以希例進請􅀘外郡躬勤政事今蘇州治狀爲兩浙第一臣甞與溱同在館閣聞其論議服其度量材羙甚衆非臣所如擢以代臣庶允公議謹具狀奏舉以聞謝知制誥表同前臣某言伏奉制命􅀩恩特授臣右正言知制誥者伏以王者尊居萬民之上而誠意能與下通奄有四海之大而惠澤得以徧及者得非號令告詔發揮而巳哉然其爲言也質而不文則不足以行遠而昭聖謨一作謀麗而不典則不足以示後而爲世法居是職者古難其人乃以愚臣而當此選臣某中謝伏惟尊號皇帝陛下茂仁聖之姿荷祖宗之業日慎一日曽未少懈而自羌夷􅀒固邊鄙用師勤儉率先於聖躬焦勞常見於玉色雖有憂民之志而億姓未蘇雖有欲治之心而群臣未副故每進一善則未甞不欲勸天下之能每官一賢則未始不欲盡人材之用雖以爵祿而砥礪尚須訓誡之丁寧尤假能言以諭至意可稱是者不又一作大艱歟伏念臣雖以儒術進身本無辭藝可取徒值嚮者時文之弊偶能獨守好古之勤志欲去於雕華文反成於樸鄙本懼不適當世之用敢期自結聖主之知陛下􅅄之特深用之太過此臣所以懇讓三四至於辭窮而天意不回寵命難止尚慮頑然之未諭更加使者以臨門恩出非常理難屢瀆及俯而受命伏讀訓辭則有必能復古之言然後益知所責之重夙夜惶惑未知所措伏况文字之職厠于侍從之班在於周行是爲超擢不徒揮翰以爲効自當死節以報恩惟所使之期於盡瘁龍圖閣直學士河北都轉運使謝上表闕慶暦四年八月謝􅅄諭編次三朝故事表慶暦四年九月臣脩言今月二十八日進奏院遞到詔書一道以臣前奉詔編次三朝故事成上進訖特賜􅅄諭者聖后當天孝循先志嘉與左右奉爲大法成編上聞懼不稱㫖􅀩詔温諭以榮以悸臣某中謝臣聞藝祖造􅀖翕受駿命文綏武服震讋萬方十七年間大業以定䄂宗享御睿謀獨斷照姦以察固賢以誠政清法明夷夏安樂章聖紹衣上下錯國旣安玉帛走於庭犀革櫜於庫刑賞有典禮樂有經草木人靈鬯懋歡喜恭惟皇帝陛下以甚盛之德位乆大之業日旰坐朝昧爽思道置器安處納民大中尚惟一祖二宗之遠謨有百世無疆之丕訓君臣所以固附天人所以調諧法令所以必行􅀖國所以從乂天垂日皎布在方册爰詔近侍採摭要實袐在大府用禆聖政盖守成念夫至艱孝者先乎善繼睿心遠紹振古與偕臣親􅀍上音適終論次慮失煩簡隕越待罪聖度兼貸錫以襃言誓􅂢微軀仰荷鴻覆瞻望宸扆無任激切謝賜慶曆五年曆日表伏以聖人在上天地節隂陽和一日十二辰五星二十八舍皆安次而行四時八風六律二十四氣各應時而至臣愚幸同萬物俱􅀍長育而得與草木自別使知寒暑之期臣某中謝伏惟尊號皇帝陛下聰明睿智天縱多能向因萬機之餘親考上元之曆以授百職以同萬方而臣官任轉輸兼司按察苦乃加正朔於四海頒政教於明堂陛下揔其要而舉其大端至於經時節勸農桑候豐凶勤畜積順時令察姦非則臣敢不守其職而行其小者庶無失業以荅洪恩滁州謝上表慶暦五年十月臣某言臣伏􅀩聖恩授臣依前右正言知制誥知滁州軍州事巳於今月二十二日赴上訖者謗䜛始作大喧群口而可驚誣罔終明幸頼聖君之在上列職尚叨於淸近爲􅀖仍竊於安閑祗荷恩榮惟知感涕臣某中謝伏念臣生而孤苦少則賤貧同毋之親惟存一妹䘮厥夫而無託携孤女以來歸張氏此時生纔七歳臣媿無蓍􅀛前知之識不能逆料其長大所爲在人情難棄於路隅緣臣妹遂養於私室方今公私嫁娶皆行姑舅婚姻況晟於臣宗巳隔再從而張非巳出因謂無嫌乃一作仍未及笄遽令出適然其既嫁五六年後相去數千里間不幸其人自爲醜穢臣之耳目不能接思慮不能知而言者及臣誠爲非意以至究窮於資産固巳吹析於毫毛若以攻臣之人惡臣之甚茍罹纎過奚逭深文盖荷聖明之主張得免羅織之􅁈枉然臣自􅀩睿􅅄甞列諫垣論議多及於貴權指目不勝於怨怒若臣身不黜則攻者不休茍令讒巧之愈多是速孤危於不保必欲爲臣明辯莫若付於獄官必欲措臣少安莫若置之閑處使其脫風波而遠去避䧟穽之危機雖臣善自爲謀所欲不過如此斯盖尊號皇帝陛下推天地之賜廓日月之明知臣幸逢主聖而敢危言憫臣不顧身微而當衆怨始終愛惜委曲保全臣雖木石之心頑實知君父之恩厚敢不䖍遵明訓上體寛仁永堅不轉之心更勵匪躬之節賀章獻明肅章懿二皇后祔廟表慶暦五年十月臣脩言伏覩十月九日赦書章獻明肅皇后章懿皇后祔廟禮畢者大孝發於宸􅂨刑于四海休氣蒸乎羙澤賚及萬方華夏歡呼人一作神祗咸一作感悅臣某中賀恭惟尊號皇帝陛下自天生德繼聖垂衣率勤儉以在躬推仁恩而浹物動稽先訓謙弗自專奉二后之慈靈永懷罔極詢百執之公議所據有經然後肅清廟以載嚴由閟宫而升祔上儀交舉大慶咸均孝思永奉於烝甞懿範有光於典䇿臣守藩地近一作逺受國恩深欣盛事之親逢與蒼生而共樂賀祔廟禮畢進奉銀五百兩狀右臣伏以廟容祔室一人式奉於孝思方物􅂶庭萬國率從於奔走前件物堅剛挺質粹羙稱珍勉脩􅀖貢之儀用罄臣忠之節謝賜慶曆六年曆日表祗膺寵錫伏積兢榮臣某伏惟尊號皇帝陛下愛人育物精意奉天日用而百姓不知聖徳與四時合序是以星辰順􅁤日月淸明隂陽和風雨節恭已南面授人以時屬此歳端大頒玉曆臣職在守土愧無他能謹守詔條其敢失墜謝賜慶曆七年曆日表臣脩言本州進奏院遞到詔書一道賜臣慶曆七年曆日一本者天序方周王正肈建凢爾守􅀖之吏皆􅀩頒曆之恩匪以爲私蓋遵彛典臣某中謝伏惟尊號皇帝陛下乾坤覆載日月照臨不言而四時行有作而萬物覩而乃考覽氣􅁚精窮天人著爲玉曆之文以叶明堂之政舟車所至正朔咸加雖􅀍謫以窮居亦以時而受賜臣敢不䖍遵聖訓順布民時上副欲治之心少逃曠官之責一作咎慰申王薨表慶暦七年五月臣某言臣得進奏院狀報五月二十三日以皇叔申王徳文薨皇帝幸後苑舉哀挂服者伏以申王徳文位崇王爵地重宗藩遽背明時奄然殂謝伏惟尊號皇帝陛下仁親九族孝治萬方成服發哀恩隆禮備臣忝居侍從遠守詔條不獲躬詣闕庭以伸奠慰臣無任哀感之至賀鴻慶宫成奉安三聖御容表慶暦七年七月臣脩言伏覩南京鴻慶宫成奉安三聖御容者一人致孝式表於奉先三后在天並垂於鴻祐人靈交感華夏歡呼臣某中賀伏惟尊號皇帝陛下以上聖之姿撫重熈之運親執玉幣禮天地之神祇時奉烝甞報祖宗之功徳乃眷别京之重載崇原廟之儀衣冠出逰仰稽於故事郡國甞幸俾得以奉祠實隆廣孝之風以著不刋之典臣猥叨辭職方守郡條瞻盛禮以阻陪效歡聲而徒切謝加上􅀐都尉進封開國伯加食邑三百戸表慶暦七年十二月訓辭深厚恩典優隆祗服以還戰兢無錯臣某中謝伏念臣材非世用行與時違過􅀩􅅄擢之私忝居侍從之列坐尸厚祿安處善􅀖當見帝以親郊莫陪嚴祀洎受釐而均慶亦􅀍寵光進爵賜勲即封加戸併兹榮數及廼無功敢不退自省循益思砥礪上答乾坤之造更堅犬馬之誠賀平貝州表慶暦八年閏正月伏聞閏月一日攻下貝州殺到妖賊王則者盗孽􅀼興人一作神祇共忿果憑睿筭悉殄兇徒臣某中賀伏惟尊號皇帝陛下推仁育物浸澤在人常服一作克儉以躬行惟足兵而在念至於多􅂢金幣講好戎夷務休戰爭蓋惜士卒徳至深而莫報恩旣厚則生驕敢肆妖狂自干斧􅃏驅脅一作脅驅士衆閉守城闉旣違天而逆人冝不攻而自破而況聖神運略將相恊忠不遺一人咸即大戮悖慢者警而肅恪一作恪肅昬愚者知有誅夷銷沮姦萌震揚威令臣幸忝郡􅀉欣聞徳音􅀭州謝上表慶暦八年二月臣脩言準樞宻院遞到誥勑一道伏􅀩聖恩授臣起居舍人依前知制誥知􅀭州軍州事巳於今月二十二日赴任訖者貶所脫身遽叨臨於督府歳成無狀仍敘進於官聮􅀍渥以優撫心増懼臣某中謝伏念臣材非適用行輙違時徒知好古之勤自勵匪躬之節誤􅀩􅅄抜驟玷寵榮小器易盈固巳冝於顛覆盡言取禍仍多結於怨仇仰恃公朝臣雖自信在於物理豈有不危矧利口之中人譬含沙之射影謂時之衆嫉者易爲力謂事之隂昧者易爲誣上一作幸繄天聴之聦終辨獄辭之濫茍此􅁈之獲雪雖永棄以猶甘而況得善地以長人享及親之厚祿坐安優逸未乆歳時亟就易於方州仍陟遷於秩序有以見聖君之意未甞忘言事之臣孤拙獲全忠善者皆當感勵姦讒不効傾邪者可使息心非惟愚臣獨以爲幸此蓋伏遇尊號皇帝陛下乾坤覆載日月照臨察人常務於究情行賞必思於有勸致兹恩典施及懦庸誓堅終始之心少荅生成之造潁州謝上表皇祐元年三月十三日臣脩言伏􅀩聖恩就差臣知潁州軍州事臣已於三月十三日赴上訖者規求安閑坐享榮祿雖大君之徳曲示含容而爲臣之心豈自遑處臣某中謝伏念臣材能淺薄性識昬􅀩偶自弱齡粗知學古謂忠義可以事國名節可以榮身自􅀩不次之恩亦冀非常之效然而進未有纎毫之益已不容於怨仇退未知􅀘報之方遽先罹於衰病神與明而並耗風乗氣以交攻睛瞳雖存白黑纔辨蓋積憂而自損信處世之多危伏􅀩尊號皇帝陛下造化陶鈞高明覆載閔其孤拙未即棄􅂢付以善􅀖俾從私便所冀療治有驗瞻視復完則及物之仁荷更生之大賜使身不廢猶後效之可圖謝轉禮部郎中表皇祐元年四月臣某言􅀩恩授臣禮部郎中知制誥依舊知潁州者恩出非常榮逾始望人以臣爲寵臣以喜爲憂伏念臣自小無能惟知嗜學常慕古人而篤行不思今世之難行而自遭遇聖明驟􅀩􅅄㧞急於報國遂欲忘軀結怨仇者皆可畏之人所違忤者悉當權之士旣將行已又欲進身惟二者之難兼雖至愚而必逹況臣粗知用捨頗識廉隅故其自􅀍讒誣迨於降黜當舉朝沸議未甞以寸牘而自明及累歳謫居不敢以半辭而自理其後再經寛赦移鎮要藩曽未逾年遽求小郡蓋臣知難當之衆怒尚未甘心思苟免之善謀惟冝退迹則臣於榮進豈敢僥求此蓋皇帝陛下日月照臨乾坤覆載不忘舊物曲軫睿慈謂臣貶職之人悉皆牽復憫臣無名之罪乆未雪除故推敘進之文特示甄收之意然臣近於去歳早巳改官逮此便蕃豈冝叨竊欲固讓則有嫌疑之避欲遽受則懷忝冒之慙進退之間凌兢失措惟當盡節上報深恩謝復龍圖閣直學士表皇祐元年八月臣脩言今月十八日樞宻院遞到誥勑各一道伏􅀩聖恩授臣依前禮部郎中􅂶龍圖閣直學士仍舊知潁州者恩還舊職事雪前誣感極心驚涕隨言出臣某中謝臣伏見前世材賢一作賢材之士身結主知勲徳之臣功施王室然尚或一遭謗毀欲辨無由少忤要權其禍不測顧如臣者何足道哉臣材不迨於中人功無益於當世用之未見其効去之無足可思矧罔極之讒交興而並進易危之迹何恃而不顛而聖心不忘恩意特至辨罔欺於曖昧沮仇嫉於衆多雖暫居譴謫之中而屢􅀍陞遷之渥今又特􅀩甄錄牽復寵名以臣之愚豈比前人而獨異推其所幸蓋由聖主之親逢謂冝如何可以論報再念臣禀生􅀌拙本乏藝能徒因學古之勤粗識事君之節苟臨危效命尚當不顧以奮身況爲善無傷何憚竭忠而報國誓期盡瘁少荅髙明南京謝上表皇祐二年七月臣某言伏􅀩聖恩就差臣知應天府兼南京留守司事臣已於今月二十四日赴上訖者守宫鑰之謹嚴敢忘夙夜布政條之纎悉上副憂勤􅀉任非堪兢營並集臣某中謝伏念臣賦才庸薄稟數竒屯毀譽交興兩甞過實寵榮踰分動輙招尤念報效之未伸敢不竭忠而盡瘁困風波之可畏則思遠去以深藏迨此六年外更三守學偷安而杜口􅀒素志以媿心朽質易衰巳凋零於齒髪良時難得尚希慕於功名豈謂皇慈未􅂢舊物擢從支郡委以名都惟此別京舊當孔道簿領少勤於職事厨傳取悅於路人苟循俗吏之所爲雖能免過非有古人之大節未足報君謝明堂覃恩轉官加勲表皇祐一年十月臣某言今月十三日進奏院遞到誥勑各一道伏􅀩聖恩授臣尚書吏部郎中加輕車都尉依前龍圖閣直學士仍舊知􅀿天府兼南京留守司事及放朝謝者天地號令風雷皷行一氣所均萬物咸􅀍遂容僥倖亦與襃升臣某中謝伏念臣材不逮人識非慮逺徒有事君之節未知報國之方冒寵貪榮已踰其量見利臨得曽不知慚此者伏遇尊號皇帝陛下堯舜聦明禹湯勤儉脩前王之曠典述先志以繼成昭致精禋躬臨路寢膺受上天之多福推與萬方而不私臣於此時限以官守講儀制禮不預議郎博士之流助祭陪祠不在諸侯方物之列旣乏一言之獻又無執事之勞徒隨翟閽共享餘賜普天率土難異衆以獨辭蹐厚跼髙但撫躬而無措表奏書啓四六集卷第一紹熈三年十月承直郎丁朝佐編次郡人孫謙益校正辭召試知制誥劄子干進一作而進辭召試知制誥狀不以自明不字疑辭免第二狀所陳一作累所陳獨專一作專獨謝知制誥表未少一作不少玉色一作顔色聖主一作明主滁州謝上表乃未及笄一作乃當未笄尊號此上一有伏遇二字賀鴻慶宫成奉安表玉幣一作圭幣賀平貝州表王則此下一有等字􅀭州謝上表以優一作巳優自勵一作每勵忘言一作廢言孤拙獲全至爲幸二十九字一作危拙獲全爲善者皆當感激罔欺不効好讒者由是沮消豈恃臣愚獨􅀩其幸頴州謝上表昬􅀩一作昬愚謝轉禮部郎中表一作臣某言樞宻院遞到勑告伏􅀩聖恩授臣尚書禮部郎中依前知制誥知潁州者自小一作自少篤行一作篤信不敢以以一作有謂臣貶職謂字下一有後字憫臣此上一有而字謝復龍圖閣直學士表曖昧瞬一作藹尚當一作尚思南京謝上表困風波困一作因試筆一卷歐陽文忠公集一百三十南唐硯某此一硯用之二十年矣當南唐有國時於歙州置硯務選工之善者命以九品之服月有俸􅅒之給號硯務官歳爲官造硯有數其硯四方而平淺者南唐官硯也其石尤精製作亦不􅀋今工之侈窳此硯得自今王舎人原叔原叔家不識爲佳硯也兒子輩棄置之予始得之亦不知爲南唐物也有江南人年老者見之悽一作淒然曰此故國之物也因具道其所以然遂始寳惜之其貶夷陵也折其一角宣筆宣筆􅀄不可用往時聖俞屢以爲惠尋復爲人乞去今得此甚可用遂深藏之琴枕說介甫甞言夏月晝睡方枕爲佳問其何理云睡乆氣蒸枕􅀬則轉一方冷處然則真知睡者耶余謂夜彈琴唯石暉爲佳蓋金蚌瑟瑟之􅀋皆有光色燈燭照之則炫燿非老翁夜視所宜白石照之無光唯目昬者爲便介甫知睡真􅈸者余知琴暉直以老而目暗耳是皆可咲余家石暉琴得之二十年昨因患兩手中指拘攣醫者言唯數運動以導其氣之滯者謂唯彈琴爲可亦尋理得十餘年巳忘諸曲物理損益相因固不能窮至於如此老莊之徒多寓物以盡人情信有以也哉鑒􅀞蕭條淡泊此難􅀞之意􅀞者得之覽者未必識也故飛走遲速意淺之物易見而閑和嚴靜趣逺之心難形若乃髙下嚮背逺近重複此􅀞工之藝爾非精鑒者之事也不知此論爲是不余非知􅀞者強爲之說但恐未必然也然世謂好􅀞者亦未必能知此也此字不乃傷俗耶一十字一作然自謂好􅀞者未必能知此也學書爲樂蘇子羙甞言明䆫淨几筆硯紙墨皆極精良亦自是人生一樂然能得此樂者甚稀其不爲外物移其好者又特稀也余晚知此趣恨字體不工不能到古人佳處若以爲樂則自足有餘學書消日自少所喜事多矣中年已來漸以廢去或厭而不爲或好之未厭力有不能而止者其愈乆益深而尤不厭者書也至於學字爲於不倦時徃徃可以消日乃知昔賢留意于此不爲無意也學書作故事學書勿浪書事有可記者它時便爲故事學真草書自此已後􅃗日學草書􅀟日學真書真書兼行草書兼楷十年不勌當得書名然虚名已得而真氣耗矣萬事一作物莫不皆然有以寓其意不知身之爲勞也有以樂其心不知物之爲累也然則自古無不累心之物而有爲物所樂之心學書費紙學書費紙猶勝飲酒費錢曩時甞見王文康公戒其子弟云吾平生不以全幅紙作封皮文康太原人世以􅀳人喜嗇資談笑信有是哉吾年向老亦不欲多耗用物誠未足以有益於人然衰年志思不壯於事少能快然亦其理耳學書工拙每書字甞自嫌其不佳而見者或稱其可取甞有􅀄不自喜隔數日視之頗若稍可愛者然此􅀄欲寓其心以銷日何用較其工拙而區區於此遂成一役之勞豈非人心蔽於好勝耶作字要熟作字要熟熟則神氣完實而有餘於靜坐中自是一樂事然患少暇豈其於樂處常不足耶用筆之法蘇子羙甞言用筆之法此乃栁公權之法也亦甞較之斜正之間便分工拙能知此及虚腕則羲獻之書可以意得也因知萬事皆有法楊子云斷木爲棋刓革爲鞠亦皆有法豈正得此也蘇子羙論書蘇子羙喜論用筆而書字不迨其所論豈其力不副其心邪然萬事以心爲本未有心至而力不能者余獨以爲不然此所謂非知之難而行之難者也古之人不虚勞其心力故其學精而無不至蓋方其㓜也未有所爲時專其力於學書及其漸長則其所一無此字學漸近於用今人不然多學書於晚年所以與古不同也秋霖不止文書頗稀叢竹蕭蕭似聽愁滳顧見案上故紙數幅信筆學書樞宻院東㕔蘇子羙蔡君謨書自蘇子羙死後遂覺筆法中絶近年君謨獨歩當世然謙讓不肯主盟徃年予甞􅃧謂君謨學書如泝急流用盡氣力不離故處君謨頗􅀏以爲能取譬今思此語巳二一無此字十餘年竟如何哉李邕書余始得李邕書不甚好之然疑邕以書自名必有深趣及看之乆遂謂他書少及者得之最晚好之尤篤譬猶結交其始也難則其合也必乆余雖因邕書得筆法然爲字絶不相􅀋豈得其意而忘其形者邪因見邕書追求鍾王以來字法皆可以通然邕書未必獨然凡學􅀞者得其一可以通其餘余偶從邕書而得之耳嘉祐五年春分日雪中西䆫一作齋信筆風法華徃時有風法華者偶然至人家見筆便書初無倫理乆而禍福或應豈非好怪之士爲之遷就其事耶余毎見筆輙書故江鄰幾比余爲風法華九僧詩近世一作時有九僧詩極有好句然今人家多不傳如馬放降來地鵰盤戰後雲春生桂嶺外人在海門西今之文士未能有此句也詳載詩話弔僧詩謝希深甞誦哭僧詩云燒痕詩一作碑入集海角寺留真謂此人作詩不求好句只求好意余以謂意好句亦好矣賈島有哭僧詩云寫留行道影焚却坐禪身唐人謂燒􅁍活和尚此句之大病也與詩話所載略同郊島詩窮唐之詩人􅀋多窮士孟郊賈島之徒尤能刻􅂐一作琢窮苦之言以自喜或問二子其窮孰甚曰閬仙甚也何以知之曰以其詩見之郊曰種稻耕白水􅀒薪斫青山島云市中有樵山我含朝無煙井底有甘泉釡中乃空然蓋孟氏薪米自足而島家柴水俱無此誠可嘆一作􅀏然二子名稱高於當世其餘林翁處士用意精到者徃徃有之若鷄聲茅店月人迹板橋霜則羇􅀌行旅流離辛苦之態見於數字之中至於野塘春水慢花塢夕陽遲則春物融怡人情和暢又有言不能盡之意兹亦精意刻琢之所得者耶謝希深論詩徃在洛時甞見謝希深誦一有曰字或作云縣古槐根出官清馬骨高又見晏丞相常愛笙歌歸院落燈火下樓臺希深曰清苦之意在言外而見於言中晏公曰世傳㓂萊公詩云老覺腰金重慵便枕玉涼以爲冨貴此特窮相者爾能道冨貴之盛則莫如前言亦與希深所評者􅀋爾二公皆有情味而善一作喜爲篇詠者其論如此歸田録亦及此温庭筠嚴維詩余甞愛唐人詩云鷄聲茅店月人迹板橋霜則天寒歳暮風凄木落羇旅之愁如身履之至其曰野塘春水慢花塢夕陽遲則風酣日煦萬物駘一作佚蕩天人之意相與融怡讀之便覺欣然感發謂此四句可以坐變寒暑詩之爲巧猶􅀞工小筆爾以此知文章與造化爭巧可也詳載詩話作詩湏多誦古今詩作詩湏多誦古今人詩不獨詩爾其他一作餘文字皆一作盡然漢人善以文言道時事漢之文士善以文言道時事質而不俚兹所以爲難蘇氏四六徃時作四六者多用古人語及廣引故事以衒二字一作自以爲博學而不思述事不暢近時文章變體如蘇氏父子以四六述敘委曲精盡不減古人一作文自學者變格爲文迨一作迄今三十年始得斯人不惟遲乆而後􅀗實􅂲此後未有能繼者爾自古異人間出前後參差不相待余老矣乃及見之豈不爲幸哉王濟譏張齊賢張齊賢形体魁肥飲食兼数人然其爲相甞有边功國朝宰相惟宋琪與齊賢知边事然其常與王濟不相能濟剛峭之士也其後齊賢罷相歸洛陽買得午橋裴晉公緑野堂營為别墅一日濟自洛至京師公卿間有問及齊賢午橋别墅者濟忿然曰昔為緑野堂今作屠兒墓園矣聞者皆笑晦明說藏精於晦則明養神以一作於靜則安晦所以畜用靜所以應動善畜者不竭善應者無窮此君子修身治人之術然性近者得之易也付棐㢘耻說㢘耻士君子之大節罕能自守者利欲勝一作牽之耳物有爲其所勝雖善守者或牽而去故孟子謂勇過賁育者誠一作信有旨哉君子之道闇然而日彰而今人求速譽遂得速毀以自損者理之當然一有也字繫辭說書不盡言言不盡意然自古聖賢之意萬古得以推而求之者豈非言之傳歟聖人之意所以存者得非書乎然則一無此字書不盡言之煩而盡其要言不盡意之委曲而盡其理謂書不盡言言不盡意者非深明之論也予謂繫辭非聖人之作􅀄若可駭余爲此論迨今二十五年矣稍稍以余言爲然也六經之傳天地之乆其爲二十五年者􅀅無窮而不可以數計也予之言乆當見信於人矣何必汲汲較是非於一世哉論樂說清濁二聲一作音爲樂之本而今自以爲知樂者猶未能逹此安得言其細微之旨六經簡要說妙論精言不以多爲貴而人非聦明不能逹其義余甞聽人讀佛書其數十萬言謂可數談一作言而盡而溺其說者以謂欲曉愚下人故如此爾然則六經簡要愚下一有人字獨不得曉耶余家多文忠公書然比其没余於篋中得十數帖耳今劉君乃能致此非篤好之不能也元豐二年正月􅀄吉蘇轍子由題此數十紙皆文忠公衝口而得信手而成􅀄不加意者也其文采字畫皆有自然絶人之姿信天下之竒蹟也元祐四年九月十九日蘇軾書試筆卷終晦明說然性近者宣和建本雪堂先生文集載公此說然作惟詩話一卷歐陽文忠公集一百二十八居士退居汝隂而集以資閑談一作話也李文正公進永昌陵挽歌辭云奠玉五回朝上帝御樓三度納降王當時羣臣皆進而公詩最爲首出所謂三降王者廣南劉鋹西蜀孟昶及江南李後主是也若五朝上帝則誤矣太祖建隆盡四年眀年􅀄郊改元乾徳至六年再郊改元開寳開寳五年又郊而不改元九年已平江南四月大雩告謝于西京蓋執玉祀天者實四也李公當時人必不繆乃傳者誤云五二字一作之耳仁宗朝有數逹官以詩知名常慕白樂天體故其語多得於容易嘗有一聮云有禄肥妻子無恩及吏民有戯之者云昨日通衢遇一輜輧車載極重而羸牛甚苦豈非足下􅏂妻子乎聞者傳以爲􅀏京師輦轂之下風物䌓冨而士大夫牽於事役良辰美景罕或一作􅀗宴遊之樂其詩至有賣花擔上看桃李拍酒樓頭一作前聽管絃之句西京應天禪院有祖宗神御殿蓋一作寺在水北去河南府十餘里歳時朝拜官吏常苦晨興而留守逹官簡貴每朝罷公酒三行不交一言而退故其詩曰正夢寐中行十里不言語處喫一作飲三杯其語雖淺近皆两京之實事也梅聖俞嘗於范希文席上賦河豚魚詩云春洲生荻芽春岸飛楊花河豚當是二字一作於此時貴不數魚鰕一有其状巳可怪其毒亦莫加忿腹若封豕怒目猶吴蛙庖煎苟失所入喉爲鏌鋣若此喪軀體何須資齒牙持問南方人黨護復矜誇皆言美無度誰謂死如麻我語不能屈自思空咄嗟退之來潮陽始憚餐籠蛇子厚居柳州而甘食蝦蟇二物雖可憎性命無舛差斯味曽不比中藏禍無涯甚美惡亦稱此言誠可嘉河豚常出於春暮羣遊水上食絮而􅏂南人多與荻芽一作笋爲羹云最羙故知詩者謂秖破題两句已道盡河豚好處聖俞平生苦於吟詠以閑逺古淡爲意故其構思極艱此詩作於罇爼之間筆力雄贍頃刻而成遂爲絶唱蘇子瞻學士蜀人也嘗於淯井監得西南夷人所賣蠻布弓衣其文織成梅聖俞春雪詩一有朔風三日暗吹沙蛟龍卷起噴成花在飛萬里奪曉月白石爛堆愁女媧大明廣庭踏朝賀雉尾不掃粘宫靴宫中才人承聖顔捧觴稱壽呼南山三公免責百姓喜斗酒十千誰復慳此詩在聖俞集中未爲絶唱蓋其名重天下一篇一詠傳落夷狄而異域之人貴重之如此耳子瞻以余尤知聖俞者得之因以見遺余家舊畜琴一張乃寳曆三年雷㑹所斵距今二百五十年矣其聲清越如撃金石遂以此布更爲琴囊二物真余家之寳玩也吴僧賛寜􅀦􅀄爲僧録頗讀儒書博覽強記亦自能撰述而辭辯縱横人莫能屈時有安鴻漸者文詞儁敏尤好嘲詠甞街行遇賛寜與數僧相隨鴻漸指而嘲曰鄭都官不愛之徒時時作隊賛寜應聲答曰秦始皇未坑之輩往往成羣時皆善其捷對鴻漸所道乃鄭谷詩云愛僧不愛紫衣僧也鄭谷詩名盛於唐末號雲臺編而世俗但稱其官爲鄭都官詩其詩極有意思亦多佳句但其格不甚髙以其易暁人家多以教小兒余爲兒時猶誦之今其集不行於世矣梅聖俞晚年官亦至都官一日㑹飲余家劉原父戯之曰聖俞官必止於此坐客皆驚原父曰昔有鄭都官今有梅都官也聖俞頗不樂未幾聖俞病卒余爲序其詩爲宛陵集而今人但謂之梅都官詩一言之謔後遂果然斯可歎也陳舎人從易當時文方盛之際獨以醇儒古學見稱其詩多􅀋白樂天蓋自楊劉唱和西崑集行後進學者爭效之風雅一一作之變謂之崑體繇是唐賢諸詩集幾廢而不行陳公時偶得杜集舊本文多脫誤至送蔡都尉詩云身輕一鳥其下脫一字陳公因與數客各用一字補之或云疾或云落或云起或云下莫能定其後得一善本乃是身輕一鳥過陳公嘆服以爲雖一字諸君亦不能到也國朝浮圖以詩名于世者九人故時有集號九僧詩今不復傳矣余少時聞人多稱其一曰惠崇餘八人者忘其名字也余亦略記其詩有云馬放降來地鵰盤戰後雲又云春生桂嶺外人在海門西其佳句多􅀋此其集已一作旣亡今人多不知有所謂九僧者矣是可嘆也當時有進士許洞者善爲辭章俊逸之士也因會一作命諸詩僧分題出一紙約曰不得犯此一字其字乃山水風雲竹石花草雪霜星月一作日禽鳥之􅀋於是諸僧皆閣筆洞咸平三年進士及第時無名子嘲曰張康渾裹馬許洞閙裝妻者是也孟郊賈島皆以詩窮至死而平生尤自喜爲窮苦之句一作辭孟有移居詩云借車載家具家具少於車乃是都無一物耳又謝人惠炭云暖得曲身成直身人謂非其身備甞之不能道此句也賈云􅁂邊雖有絲不堪織寒衣就令織得二字一作堪織能一作所得幾何又其朝飢詩云坐聞西牀琴凍折兩三絃人謂其不止忍飢而已其寒亦何可忍也唐之晚年詩人無復李杜豪放之格然亦務以精意相髙如周朴者構思尤艱每有所得必極其雕琢故時人稱朴詩月鍛季煉未及成篇巳播人口其名重當時如此而今不復傳矣余少時猶見其集其句有云風暖鳥聲碎日髙花影重又云曉一作晚來山鳥閙雨過杏花稀誠佳句也聖俞常語予曰詩家雖率一作主意而造語亦難若意新語工得前人所未道者斯爲善也必能狀難冩之景如在目前含不盡之意見於言外然後爲至矣賈島云竹籠拾山果瓦鉼擔石泉姚合云馬隨山鹿放雞逐野禽棲等是山邑荒僻官況蕭條不如縣古槐根出官清馬骨髙爲工也余曰語之工者固如是狀難冩之景含不盡之意何詩爲然聖俞曰作者得於心覽者會以意殆難指陳以言也雖然亦可略道其髣髴若嚴維桞塘春水慢花塢夕陽遲則天容時一作物態融和駘蕩豈不如在目前乎又若温庭筠雞聲茅店月人迹板橋霜賈島怪禽啼曠野落日恐行人則道路辛苦羇愁旅思豈不見於言外乎聖俞子羙齊名於一時而二家詩體特異子羙筆力豪儁以超邁横絶爲竒聖俞覃思精微以深逺閑淡爲意各極其長雖善論者不能優劣也余甞於水谷夜行詩略道其一二云子羙氣尤雄萬竅號一噫有時肆顛狂醉墨灑滂霈譬如千里馬巳發不可殺盈前盡珠璣一一難東汰梅翁事清切一作句石齒漱寒瀬作詩三十年視我猶後輩文辭愈精一作清新心意雖老大有如妖韶女老自有餘態近詩尤古一作苦硬咀嚼苦一作且難嘬又如食橄欖真味乆愈在蘇豪以氣轢舉世徒驚駭梅窮獨我知古貨今難賣語雖非工謂粗得其髣髴然不能優劣之也吕文穆公未第時薄或作甞遊一縣忘其縣名胡大監旦方隨其父宰是邑遇吕甚薄客有譽吕二字一作喻胡曰吕君工於詩冝少加禮胡問詩之警句客舉一篇其卒章云挑盡寒燈夢不成胡笑曰乃是一渇俗語轉音溘睡漢爾吕聞之甚恨而去明年首中甲科使人􅀉聲語胡曰渇睡漢狀元及第矣胡答曰待我明年第二人及第輸君一籌旣而次牓亦中首選聖俞甞云詩句義理雖通語渉淺俗而可笑者亦其病也如有贈漁父一聮云眼前不見市朝事耳畔惟聞風水聲說者云患肝腎風四字一作此漁父肝藏􅀬而腎藏虚也又有詠詩者云一無此六字盡日覓不得有時還自來本謂詩之好句難得爾而說者云此是人家失却猫兒詩人皆以爲笑也王建宫詞一百首多言唐宫禁中事皆史傳小說所不載者往往見於其詩如内一作雨中數日無呼喚傳得滕王蛺蝶圖滕王元嬰髙祖子新舊唐書皆不著其所能惟名畫録略言其善􅀞亦不云其工蛺蝶也又畫斷云工於蛺蝶及見於建詩爾或聞今人家亦有得其圖者唐世一藝之善如公孫大娘舞劒器曹剛彈琵琶米嘉榮歌皆見於唐賢詩句遂知名於後世當時山林田畒潜徳隱行君子不聞於世者多矣而賤工末藝得所附託乃垂於不朽蓋其各有幸不幸也李白戯杜甫云借問别來太痩生緫爲從前一作來作詩苦太痩生唐人語也至今猶以生爲語助如作麽生何似生之􅀋是也陶尚書榖甞曰尖簷帽子卑凡厮短靿靴兒末厥兵末厥亦當時語余天聖景祐間巳聞此句時去陶公尚未逺人皆莫曉其義王原叔博學多聞見稱於世最爲多識前言者亦云不知爲何說也第記之必有知者耳詩人貪求好句而理有不通亦語病也如䄂中諫草朝天去頭上宫花侍燕歸誠爲佳句矣但進諫必以章䟽無直用槀草之理唐人有云姑蘇臺下寒山寺半夜鍾聲到客船說者亦云句則佳矣其如三更不是打一作撞鍾時如賈島哭僧云冩留行道影焚却坐禪身時謂焼殺活和尚此尤可笑也若歩隨青山影坐學白塔骨又獨行潭底影數息樹邊身皆島詩何精麤頓一無此字異也松江新作長橋制度宏麗前世所未有蘇子羙新橋對月詩所謂雲頭灧灧開金餅水面沈沈卧彩一作綵虹者是也時謂此橋非此句雄偉不能稱也子羙兄舜元字才翁詩亦遒勁多佳句而世獨罕傳其與子羙紫閣寺聮句無媿韓孟也恨不得盡見之耳晏元獻公文章擅天下尤善一作喜爲詩而多稱引後進一時名士徃徃出其門聖俞平生所作詩多矣然公獨愛其兩聮云寒魚猶著底白鷺巳飛前又絮暖鮆魚䌓䜴添􅐜菜一作線紫余甞於聖俞家見公自書手簡再三稱賞此二一作兩聮余疑而問之聖俞曰此非我之極致豈公偶自得意於其間乎乃知自古文士不獨知已難得而知人亦難也楊大年與錢劉數公唱和自西崑集出時人爭効之詩體一變而先生老一作老先生輩患其多用故事至於語僻難暁殊不知自是學者之弊如子儀一作大年新蟬云風來玉宇烏先轉一作􅁴露下金莖鶴未知雖用故事何害爲佳句也又如一有大年二字峭帆横渡官橋栁疊鼓驚飛海岸鷗其不用故事又豈不佳乎蓋其雄文博學筆力有餘故無施而不可非如前世號詩人者區區於風雲一作雪草木之􅀋爲許洞所困者也西洛故都荒臺廢沼遺迹依然見於詩者多矣惟錢文僖公一聮最爲警絶云日上故陵煙漠漠春歸空􅁐水潺潺裴晉公緑野堂在午橋南往時甞屬張僕射齊賢家僕射罷相歸洛一作終日與賔客吟宴於其間惟鄭工部文寳一聮最爲警絶云水暖鳬鷖行哺子溪深桃李卧開花人謂不減王維杜甫也錢詩好句尤多而鄭句不惟當時人莫及雖其集中自及此者亦少閩人有謝伯􅀄者字景山當天聖景祐之間以詩知名余謪夷陵時景山方爲許州法曹以長韻見􅀉頗多佳句有云長官衫色江波緑學士文華蜀錦張余答云叅軍春思亂如雲白髮題詩愁送春蓋景山詩有多情未老巳一作先白髮三字一作頭先白野思到春如亂雲之句故余以此戯之也景山詩頗多如自種黄花添野景旋移髙竹聴秋聲園林換葉梅初熟池館無人燕學飛之􅀋皆無媿於唐賢而仕宦不偶終以一作於困窮而卒其詩今巳不見於世其家亦流落不知所在其􅀉余詩殆今三十五年矣余猶能誦之盖其人不幸既可哀其詩淪棄亦可惜因録於此詩曰江流無險似瞿唐滿峽猿聲斷旅一作盡腸萬里可堪人謪宦經年應合􅁂成霜長官衫色江波緑學士文華蜀錦張異域化爲儒雅俗逺民爭識校讎郎才如夣得多爲累情似安仁乆悼亡下國難留金馬客新詩傳與竹枝娘典辭懸待修青史諌草當來集皁囊莫爲明時暫遷謪便將纓足濯滄浪石曼卿自少以詩酒豪放自得其氣貌偉然詩格竒峭又工於書筆畫遒勁體兼顔柳爲世所珍一作好余家甞得南唐後主澄心堂􅁓曼卿為余以此紙書其籌筆驛詩詩曼卿平生所自愛者至今蔵之號爲三絶真余家寳也曼卿卒後其故人有見之者云恍惚如夢中言我今爲鬼仙也所主芙蓉城欲呼故人往遊不得忿然􅀐一素一作青騾去如飛其後又云降於亳州一舉子家又呼一有其字舉子去不得因留詩一篇與之余亦略記其一聮云鶯聲不逐春光老花影長隨日脚流神一作􅀑仙事怪不可知其詩頗􅀋曼卿平生語舉子不能道也王建霓裳詞云弟子部一作歌中留一色聽風聽水作霓裳霓裳一有羽衣二字曲今教坊尚能作其聲其舞則廢而不傳矣人間又有望瀛府獻仙音二曲云此其遺聲也霓裳曲前世傳記論說頗詳不知聽風聽水為何事也白樂天有霓裳歌甚詳亦無風水之說第記之或有遺亡四字一作必有知者爾龍圖趙學士師民以醇儒碩學名重當時為人沈厚端黙羣居終日似不能言而於文章之外詩思尤精如麥夭晨氣潤槐夏午隂清前世名流皆所未到也又如暁鶯林外千聲囀芳草堦前一尺長殆不􅀋其爲人矣退之筆力無施不可而甞以詩爲文章末事故其詩曰多情懷酒伴餘事作詩人也然其資一作發談笑助諧謔敘人情狀物態一寓於詩而曲盡其妙此在雄文大手固不足論而予獨愛其工於用韻也蓋其得韻寬則波瀾横溢泛入傍韻乍還乍離一作乍去乍还出入回合殆不可拘以常格如此日足可惜之􅀋是也得韻窄則不復傍出而因難見巧愈險愈竒如病中贈張十八之􅀋是也余甞與聖俞論此以謂譬如一作夫善馭良馬者通衢廣陌縱横馳逐惟意所之至於水曲蟻封疾徐一有彌字中節而不少蹉跌乃天下之至工也聖俞戯曰前史言退之為人木強若寬韻可自足而輒傍出窄韻難獨用而反不出豈非其拗強而然歟坐客皆為之笑也自科􅂣用賦取人進士不復留意於詩故絶無可稱者惟天聖二年省試采侯詩宋尚書祁最擅􅂣其句有色映堋雲爛聲迎羽月遲一作馳尤為京師傳誦當時舉子目公為宋采侯詩話卷終第四段食絮絮上脫柳字第八段偶得一作偶􅀵第二十段手簡一作于簡第二十四段論說一作諸說近體樂府卷第一歐陽文忠公集一百三十一樂語長短句聖節五方老人祝壽文東方老人但某太山老叟東海真仙一有一字溜穿石而曽究􅀄終一有五字松避雨而備知歳月羲氏定三百六日甞守寅賔之官夷吾紀七十二君盡覩登封之事遇安期而遺􅀥笑方朔之偷桃風入律而來自巖前斗指春而光臨洞口昔漢武帝甞懐三島之勝遊有羡門生欲謁巨公於昭代今則紫庭降聖華渚開祥逺離朝日之方來展望雲之懇千八百􅀦咸歸至治之風億萬斯年共禱無疆之壽遥望天庭敢進祝聖之頌東海蓬萊第一仙遥瞻西北祝堯天願皇長似東君壽與物爲春億萬年西方老人但某秦川故老華岳幽人詢仙掌之遺蹤咸知始末戀蓮峯之絶頂不記歳時漱流玉乳之泉枕石雲陽之洞逍遥物外笑傲林間奉王母之蟠桃甞延漢帝指老聃之仙李永佑唐基掌中五色之丸世上千年之壽欣逢聖代來至塵寰當洪河澄九曲之時是甲觀誕一人之日祥麟遊於㤗畤天馬來於大宛景星見而朱草生瑞露降而赤烏集旣遇無爲之化冝歌有道之君是以駕青牛而度凾􅀜指丹鳳而趨魏闕唯願慶源流逺齊河海以無窮睿筭緜長等乾坤而不老遥望天庭敢進祝聖之頌華岳峯頭萬葉蓮開花今古世相傳願皇長似蓮峯乆結實盤根不記年中央老人但某棲心嵩極振迹伊川年髙而可等松椿氣粹而甞飱芝术洞裏之煙霞不老壷中之日月偏長當聖主之盛時居天心之奥壤但見璿璣運而寒暑正土圭測而隂陽和冠帶􅀍於百蠻玉帛來於萬國龍在沼而麟在藪河出圖而洛出書民躋壽􅏾之中俗樂春臺之上今則堯眉誕秀舜目開祥逺離王屋之間來入帝畿之内仰瞻天表莫非嶽降之神上祝皇圖豈止山呼之歳遥望天庭敢進祝聖之頌嵩髙維嶽鎮中天王氣盤基降壽仙惟願吾皇等嵩嶽三靈齊祝一作壽萬斯年南方老人但某託迹炎洲游神衡嶽非海濵之野叟廼星極之老人當火徳爲治之朝是離明繼照之日里社鳴而聖人岀泰階正而王道平百蠻向風重譯來貢屢覩豐年之上瑞故知百姓之懽心皷腹而歌治世之音安以樂曲肱而枕化國之日舒以長斯可謂唐虞之民又豈止成康之俗今則流虹誕聖遶電開祥來趨北闕之前上祝南山之永雲翔霧集旣羅仙籍之班地乆天長以禱皇家之祚遥望天庭敢進祝聖之頌南極星中一老人南山爲壽祝吾君願君永奏南薫曲當使淳音萬􅀦聞北方老人但某修真北嶽常傾葵藿之心混俗幽都不避草茅之迹潜神自得味道爲娱易水歌風曽識荆軻於往歳燕山勒石親逢竇憲於當年仙家之景物常春人世之光隂易老華表之鶴未乆還來蓮葉之􅀛於時屢見但處積隂之境毎輸就日之誠望干吕之青雲慶流虹於華渚當萬域來王之際是千齡誕聖之􅀄是以歷沙漠而朝宗叩天閽而祝頌惟願慶基不朽永齊金石之堅寳祚無疆更等山河之固遥望天庭敢進祝聖之頌北嶽神仙九轉丹持來北闕獻君前願􅀅北極齊君壽萬國陶陶共戴天㑹老堂致語熈寜壬子趙康靖公自南京訪公於潁時吕正獻公爲守某聞安車以􅃴四方禮典雖存於往制命駕而之千里交情罕見於今人伏惟致政少師一徳元臣三朝􅀫望挺立始終之節從容進退之冝謂青衫早並於俊遊白首各諧於歸老已􅇚軒裳之累􅁍尋鷄􅁰之期逺無憚於川塗信不渝於風雨幸會北堂之學士方爲東道之主人遂令潁水之濵復見徳星之聚里閭拭目覺陋巷以生光風義聳聞爲一時之盛事敢陳口號上賛清歡欲知盛集繼荀陳請看當筵主與賔金馬玉堂三學士清風明月兩閑人紅芳已盡鶯猶囀青杏􅀄甞酒正醇羙景難并良㑹少乗歡舉白莫辭頻西湖念語昔者王子猷之愛竹造門不問於主人陶淵明之卧輿遇酒便留於道士況西湖之勝槩擅東潁之佳名雖羙景良辰固多於髙㑹而清風明月幸属於閑人並遊或結於良朋乗興有時而獨往鳴蛙暫聽安問屬官而屬私曲水臨流自可一觴而一詠至歡然而㑹意亦傍若於無人乃知偶來常勝於特來前言可信所有雖非於已有其得已多因飜舊闋之辤冩以新聲之調敢陳薄伎聊佐清歡採桑子一輕舟短棹西湖好緑水逶迤芳草是堤􅀮􅀮笙歌處處隨無風水面琉璃滑不覺􅂳移微動漣漪驚起沙禽掠岸飛二春深􅀨過西湖好百卉爭妍蝶亂蜂喧晴日催花暖欲然蘭橈􅀞舸悠悠去疑是神仙返照波間水闊風髙颺管絃三􅀞􅂳載酒西湖好急管繁絃玉盞催傳穏泛平波任醉眠行雲却在行舟下空水澄鮮俯仰留連疑是湖中别有天四群芳過後西湖好狼籍殘紅飛絮濛濛垂栁欄干盡日風笙歌散盡遊人去始覺春空垂下簾櫳􅀟燕歸來細雨中五何人解賞西湖好佳景無時飛蓋相追貪向花間醉玉巵誰知閑凭欄干處芳草斜暉水逺煙微一􅀧滄洲白鷺飛六清明上已西湖好滿目繁華爭道誰家緑桞朱輪走鈿車遊人日暮相􅀅去醒醉諠譁路轉堤斜直到城頭緫是花七荷花開後西湖好載酒來時不用旌旗前後紅幢緑蓋隨􅀞􅂳撐入花深處香泛金巵煙雨微微一片笙歌醉裏歸八天容水色西湖好雲物俱鮮鷗鷺閑眠應慣尋常聽管絃風清月白偏冝夜一片瓊田誰羨驂鸞人在舟中便是仙九殘霞夕照西湖好花塢蘋汀十頃波平野岸無人舟自横西南月上浮雲散軒檻涼生蓮芰香清水面風來酒面醒十平生爲愛西湖好來擁朱輪冨貴浮雲俯仰流年二十春歸來恰似遼東鶴城郭人民觸目皆新誰識當年舊主人十一􅀞樓鍾動君休唱往事無蹤聚散怱怱今日歡娱幾客同去年緑􅁂今年白不覺衰容明月清風把酒何人憶謝公十二十年一别流光速白首相逢莫話衰翁但鬭樽前語笑同勸居滿酌君湏醉盡日從容􅀞鷁牽風即去朝天沃舜聦十三十年前是樽前客月白風清憂患凋零老去光隂速可驚􅁂華雖改心無改試把金觥舊曲重聽猶似當年醉裏聲朝中措平山欄檻􅀝晴空山色有無中手種堂前垂栁别來幾度春風文章太守揮毫萬字一飲千鍾行樂直湏年少樽前看取衰翁歸自謡一何處笛深夜夢回情脉脉竹風簷雨寒牎隔離人幾􅀊無消息今頭白不眠特地重相憶二春艷艷江上晚山三四􅀧栁絲如剪花如染香閨寂寂門半掩愁眉歛泪珠滴破烟脂臉三寒水碧水上何人吹玉笛扁舟逺送瀟湘客蘆花千里霜月白傷行色來朝便是關山隔長相思一蘋滿溪柳遶堤相送行人溪水西回時隴月低煙霏霏風淒淒重􅀝朱門聽馬嘶寒鷗相對飛二深􅀞眉淺􅀞眉蟬􅁂鬅鬙雲滿衣陽臺行雨回巫山髙巫山低暮雨蕭蕭郎不歸空房獨守時三花似伊桞似伊花桞青春人别離低頭􅀟泪垂長江東長江西兩岸鴛鴦兩處飛相逢知幾時四深花枝淺花枝深淺花枝相並時花枝難似伊玉如肌柳如眉愛著鵝黄金縷衣啼粧更爲誰訴􅂨情眉意清晨簾幕卷輕霜呵手試梅粧都縁自有離恨故􅀞作遠山長思徃事惜流芳易成傷擬歌先歛欲笑還顰最斷人腸踏莎行一􅃸館梅殘溪橋柳細草薫一作芳風暖揺征轡離愁漸遠漸無窮迢迢不斷如春水寸寸柔腸盈盈粉泪樓高莫近危欄􅀝平蕪盡處是春山行人更在春山外二雨霽風光春分天氣千花百卉爭明媚􅀞梁新燕一雙雙玉籠鸚鵡愁􅀌睡薛荔依墻莓苔滿地青樓幾處歌聲麗驀然舊事上心來無言歛皺眉山翠望江南江南蝶斜日一雙雙身似何郎全􅀓粉心如韓壽愛偷香天賦與輕狂㣲雨後薄翅膩煙光􅂊伴遊蜂來小院又隨飛絮過東墻長是爲花忙減字木蘭花一留春不住燕老鶯慵無覔處說似殘春一老應無却少人風和月好辦得黃金須買􅀏愛惜芳時莫待無花空折枝二傷懷離抱天若有情天亦老此意如何細似輕絲渺似波扁舟岸側楓葉荻花秋索索細想前歡須著人間比夢間三樓臺向曉淺月低雲天氣好翠幕風微宛轉梁州入破時香生舞袂楚女腰肢天與細汗粉重匀酒後輕寒不著人四􅀞堂雅宴一抺朱絃初入遍慢橪輕籠玉指纎纎嫰剥葱撥頭愡利怨月愁花無限意紅粉輕盈倚暖香檀曲未成五歌檀歛袂繚繞雕梁塵暗起柔潤清圎百琲明珠一綫穿櫻唇玉齒天上仙音心下事留住行雲滿坐迷魂酒半醺生查子一去年元夜時花市燈如晝月到桞梢頭人約黄昬後今年元夜時月與燈依舊不見去年人泪滿春衫袖二含羞整翠鬟得意頻相顧鴈柱十三絃一一春鶯語嬌雲容易飛夢斷知何處深院鎻黄昬陣陣芭蕉雨瑞鷓鴣楚王臺上一神仙眼色相看意已傳見了又休還似夢坐來雖近逺如天隴禽有恨猶能說江月無情也解圎更􅀍春風送惆悵落花飛絮兩翩翩清商怨關河愁思望處滿漸素秋向晚鴈過南雲行人回涙眼􅀟鸞衾裯悔展夜又永枕􅀌人逺夢未成歸梅花聞塞管阮郎歸一東風臨水日銜山春來長是閑落花狼籍酒䦨􅃢笙歌醉夢間春睡覺晚粧殘無人整翠鬟留連光景惜朱顔黄昬獨􅀝欄二南園春早踏青時風和聞馬嘶青梅如豆桞如眉日長蝴蝶飛花露重草煙低人家簾幕垂鞦韆慵困解羅衣􅀞梁􅀟燕棲三角聲吹斷隴梅枝􅀌䆫月影低塞鴻無限欲驚飛城烏休夜啼尋斷夢掩深閨行人去路迷門前楊栁緑隂齊何時聞馬嘶四劉郎何日是來時無心雲勝伊行雲猶解􅅖山扉郎行去不歸強匀􅀞又芳菲春深䡖薄衣桃花無語伴相思隂隂月上時五落花浮水樹臨池年前心眼期見來無事去還思而今花又飛淺螺黛淡燕脂閑粧取次冝隔簾風雨閉門時此情風月知近體樂府卷第一朝中措垂栁一作楊栁歸自謡三篇並載馮延已陽春録名歸國遥第三篇夢回一作夢魂來朝一作明朝長相思第二篇尊前集作唐無名氏詞空房獨守時一作低頭􅀟淚垂生查子第一篇月到一作月在月與燈依舊一作燈月仍依舊瑞鷓鴣相看一作相勾逺如一作宛如翩翩一作范然阮郎歸三篇並載陽春録名醉桃源第一篇臨水一作吹水睡覺一作睡起第二篇春早一作春半附録卷第一祭文行狀謚誥祭文韓忠獻王􅄾維熈寧五年嵗次壬子某月某日具官某謹遣三班奉職隨行指使李珪以清酌庻羞之奠致祭于少師永叔之靈惟公之生粹禀一作禀粹元精偶聖而出逢辰以亨歷事三朝翼登太平大名既遂大功既成年未及老一作耆深虞滿盈連章得謝潁第來寧神當􅂌以福禄天冝錫之壽齡胡不憖遺遽爾摧傾此􅁳理莫得致詰而天下爲之失聲嗚呼哀哉公之文章獨歩當世子長退之偉贍閎肆曠無擬倫逮公始繼自唐之衰文弱無氣降及五代愈極頽敝唯公一作公一振之坐還醇粹復古之功在時莫二公雖云亡其傳一作在時益貴譬如天衢森布列緯海内瞻仰日髙而公之諌諍務傾大忠在慶曆初職司帝聦顔有必犯闕無不縫正路斯闢姦萌􅂺攻氣勁忘忤行􅀌少同於穆仁廟誠推一作推誠至公孰好孰惡是焉則從善得盡納治隨以隆人畏清議知時不容各礪名節恬乎處躬二十年間由公變風公之功業其大可記屢殿藩垣所至懷恵甞尹京邑沛有餘地早踐西掖晚當内制凡厥代言典謨之懿凡厥出令風雷其一作之􅀔三代炳焉公辭無媿樞幄猷爲台衡弼貳撫御四夷兵戈不試整齊百度官師咸治服勞一心定䇿二帝中外以安神人胥慰不校讒言懇求去位公之進退逺邁前賢合既不苟髙惟戒顛身雖公輔志則林泉七十致政乃先五年上惜其去公祈益堅卒遂其請始終克全嗚呼哀哉余早接公道同氣􅁼出處雖一作則殊趣向何異既忝宰司曰親髙􅁩可否明白􅁭懷坦易事貴窮理言無飾偽或不知公因罹謗忌青蠅好􅀧白璧奚累嗚呼哀哉自公還事心慕神馳徒慿翰墨莫挹姿儀公甞頋我恵以新詩雖亟詶答柰苦衰疲欲復爲問動巳踰時忽承訃音且駭且悲哀誠孰訴肝膽㡬􅤚一作隳公之逝矣世鮮余知一作我知不如從公焉一作安用生爲遐脩薄薦一作􅀕奠公一巵魂􅀆有靈其來監兹尚饗同前王荆文公安石夫事有人力之可致猶不可期況乎天理之􅁳寞一作溟漠又安可得而推惟公生有聞于當時死有傳于後世苟能如此足矣而亦又何悲如公器質之深厚智識之髙逺而輔以學術之精微故形於文章見於議論豪健俊偉怪巧瑰􅄾其積於中者浩如江河之停蓄其發於外者爛如日星之光輝其清音幽韻凄如飄風急雨之驟至其雄辭閎辯快如輕車駿馬之奔馳世之學者無問乎識與不識而讀其文則其人可知嗚呼自公仕宦四十年上下徃返一作復感世路之嶇﨑雖屯邅困躓竄斥流離而终不可掩者以其有公議之是非旣壓復起遂顯于世果敢之氣剛正之節至晚而不衰方仁宗皇帝臨朝之末年顧念後事謂如公者可􅀉以社稷之安危及夫發謀淚䇿從容指顧立定大計謂千載而一時功名成就不居而去其出處進退又庻乎英魄靈氣不隨異物腐散而長在乎箕山之側與潁水之湄然天下之無賢不肖且猶爲涕泣而歔欷而況朝士大夫平昔游從又予心之所嚮慕而瞻依嗚呼盛衰興廢之理自古如此而臨風想望不能忘情者念公之不可復見而其誰與歸同前曾舎人鞏維公學爲儒宗材不世出文章逸發醇深炳蔚體備韓馬思兼莊屈垂光簡編焯若星日絶去刀尺渾然天質辭窮卷盡含意未卒讀者心醒開蒙愈疾當代一人顧無儔匹諌垣抗議氣震囬遹鼔行無前跋㚄非恤世偽難勝􅀌堅竟窒紫微玉堂獨當大筆二典三謨生明藏室頓挫彌厲誠純志壹斟酌損益論思得失經體慮萌一作明沃心造􅂰帝曰汝賢引登輔弼公在廟堂尊明道術清淨簡易仁民愛物歛不煩苛令無迫猝棲置木索里安戸逸櫝歛兵革天清地謐日進昌言從容宻勿開建國本情忠力悉卯未之歳龍駕飈歘再拯大艱垂紳秉笏乾坤正位上下有秩功􅀍社稷等夷召畢公在廟堂緫持紀律一用公直兩忘猜昵不挾朋比不虞訕嫉獨立不囬其剛仡仡愛養人材奨成誘掖甄抜寒素振興滯屈以爲己任無有廢咈維公平生愷悌忠實内外洞徹初終若一年始六十懇辭冕黻連章累歳乃俞所乞放意丘樊脫遺羈􅎗沉浸圖史左右琴瑟志氣浩然不陋蓬蓽意謂百齡重休累吉還斡鼎軸賛微計宻云胡傾殂憗遺則弗聞訃失聲眥淚横溢戇􅁳不敏早蒙振祓言繇公誨行繇公率戴徳不酬懷情獨欝西望轜車莫持紖綍維公犖犖徳義譔述爲後世法終天不没託辭叙心􅂚能髣髴嗚呼哀哉尚饗同前范蜀忠文公鎮惟公平生諒直骨鯁文章在世煒煒炳炳老釋之闢賁育之猛拒塞邪􅀃尊崇元聖天下四方學子甫定邇來此風勃焉而盛如醒復醉如愈再病粤醒與病有幸不幸幸不見排不幸不正嗟余空踈敢處季孟公計之來淚下縻綆聞公􅁲宅許洛之境余居在焉儻得同井異時徃來或接光影薄酒一樽菲肴數皿逺不得前􅀉此耿耿同前蘇文忠公軾通判杭州日嗚呼哀哉公之生於世六十有六年民有父母國有蓍􅀛斯文有傳學者有師君子有所恃而不恐小人有所畏而不爲譬如大川喬嶽雖一無此字不見其運動而功利之及於物者蓋不可以數計而周知今公之没也赤子無所仰芘一有而字朝廷無所稽疑斯文化爲一作於異端一有而字學者至於用夷君子以爲無與一作爲爲善而小人沛然自以爲得時譬如深山一作淵大澤龍亡而虎逝則變怪雜一作百出舞鰌鱓而號狐狸昔其一作公之未用也天下以爲病而其旣用也則又以爲遅及其釋位而去也莫不冀其復用至其請老而歸也莫不悵然一作惆悵失望而猶庶幾於萬一者幸公之未衰孰謂公無復有意於斯世一作人也奄一去而莫予追豈厭世一有之字溷濁絜身而逝乎將民之無禄而天莫之遺昔我先君懷寳遁一作避世非公則莫能致而不肖無狀因一作夤縁出入受教於一無此字門下者十有六年於兹一作斯聞公之䘮義當匍匐往救一作弔而懷禄不去愧古人以忸怩緘詞千里以寓一哀而巳矣蓋上以爲天下慟而下以哭吾一作其私嗚呼哀哉同前知潁州日維元祐六年歳次辛未九月丙戍朔從表姪具位蘇軾謹以清酌肴果之奠昭告于故太師兖國文忠公安康郡夫人之靈嗚呼軾自齠齓以學爲嬉童子何知謂一作維公我師晝誦其文夜夢見之十有五年乃克見公公爲拊掌歡􅀏改容此我軰人餘子莫群我老將休付子斯文再拜稽首過矣公言雖知其過不敢不勉契闊艱難見公汝隂多士方譁而我獨南公曰子來實獲我心我所謂文必與道俱見利而遷則非我徒又拜稽首有死無易公雖云亡言如皎日元祐之初起自南遷叔季在朝如見公顔入拜夫人羅列諸孫敢以中子請婚叔氏夫人曰然師友之義凡二十年再升公堂深衣廟門垂涕失聲白髪蒼顔復見潁人潁人思公曰此門生雖無以報不辱其門清潁洋洋東注于淮我懷先生豈有涯哉尚饗同前蘇文定公轍維年月日具官蘇轍謹以清酌庶羞之奠致􅀕于故觀文少師贈太師九丈之靈嗚呼嘉祐之初公在翰林維時先君處于西南世所莫知隠居之深作書號公曰是知予公應嗟然我明子心吾於天下交逰如林有如斯文見所未曽先君來東實始識公傾蓋之歡故舊莫隆遍出所爲歎息改容歷告在位莫此蔽蒙報國以士古人之忠公不妄言其重鼎鍾厥聲四馳靡然向風嗟維此時文律頽毀竒邪譎怪不可告止剽剥珠貝綴飾耳鼻調和椒薑毒病唇齒咀嚼荆􅁄斥棄羹胾號兹古文不自愧耻公爲宗伯思復正始狂詞怪論見者投棄踽踽元昆與轍皆來皆試於庭羽翼病摧有鑒在上無所事媒馳詞數千適當公懷擢之衆中群疑相豗公恬不驚衆惑徐開滔滔狂瀾中道而回匪公之明化爲詼俳公徳日隆歷蹈二府轍方在艱撫視逾素納銘幽宅徳逮存故終喪而還公以勞去公年未衰屢告遟暮自亳徂青迄蔡而許來歸汝隂嘯傲環堵轍官在陳於潁則鄰拜公門下􅀏言歡欣柸酒相属圖史紛紜辯論不衰志氣益振有如斯人而止斯耶書來告衰情懷酸辛報不及至凶訃遄臻嗚呼公之於文雲漢之光昭回洞逹無有采章學者所仰以克嚮方知者不惑昧者不狂公之在朝以直自遂排斥姦回罔有劇易後來相承敢隕故事雖庸無知亦或勉勵此風之行逾三十年朝廷尊嚴庶士多賢伊誰云從公導其先自公之歸忽焉變遷又誰使然要歸諸天天之生物各維其時朝􅊙薫風春夏是冝凍雨急雪匪寒不施時去不返雖彊莫違矧惟斯人而不有時時旣往矣公亦逝矣老成云亡􅀖國瘁矣無爲爲善善者廢矣時實使然我誰懟矣哭公於堂維其悲矣嗚呼哀哉尚饗行狀呉正憲公充故推誠保徳崇仁翊戴功臣觀文殿學士特進太子少師致仕上柱國樂安郡開國公食邑四千三百户食實封一千二百户贈太子太師歐陽公行狀曾祖郴累贈金紫光禄大夫太師中書令祖偃累贈金紫光禄大夫太師中書令兼尚書令父觀皇任泰州軍事判官累贈金紫光禄大夫太師中書令兼尚書令追封鄭國公本貫吉州永豐縣明徳郷年六十六歐陽氏之先本出於夏禹之苗裔少康封其庶子于㑹稽以奉禹祀歴夏商周以世相傳至越王勾踐傳五世至王無疆爲楚威王所滅諸子皆受封于楚而無疆之子蹄封於歐餘山之陽是爲歐陽亭侯子孫遂以爲氏後稍北徙青之千乗冀之渤海千乗之顯者曰生字和伯以經爲漢博士所謂毆陽尚書者是也渤海之顯者曰建字堅石所謂渤海赫赫毆陽堅石者是也詢通父子顯于唐自通三世生琮爲吉州刺史又八世生萬爲吉州安福令後世或居安福或居廬陵安福之六世孫即公曽祖也生八男曰儀者中南唐進士第父母皆在郷里榮之命其郷曰儒林里曰毆桂坊曰具慶皇祖而下始居吉水至和中㭊吉水爲永豐今爲永豐人矣曽祖仕南唐爲武昌令檢校右散􅀐常侍兼御史大夫性孝友郷里稱之累贈金紫光禄大夫太師中書令曽祖妣劉氏追封楚國太夫人皇祖少以文學稱獻所爲文南唐召試爲南京街院判官累贈金紫光禄大夫太師中書令兼尚書令祖妣李氏累封吴國太夫人皇考少􅀌力學咸平中進士及第天性仁孝居官決獄主於平恕哀矜終於泰州軍事判官累贈金紫光禄大夫太師中書令兼尚書令追封鄭國公妣鄭氏累封韓國太夫人皇考之􅂢館舎公纔四歳太夫人守節自誓而教公以讀書爲文及公成人太夫人自力衣食不以家事累公使專務爲學及見公之身名偕顯而夫人壽考康寧爲善之報豈虚也哉公諱脩字永叔天聖中進士甲科􅀘西京留守推官用王文康公薦召試遷鎭南軍節度掌書記館閣校勘以書責諫官不論事諫官以聞謫峽州夷陵縣令徙光化軍乾徳令改武成軍節度判官范文正公經略陜西辟掌書記辭不就俄遷太子中允館閣校勘方修禮書命權同知太常禮院辭不受預修崇文緫目成改集賢校理遂知太常禮院請􅀘外通判滑州召以爲太常丞知諫院賜緋衣銀魚未幾同修起居注閱月拜右正言知制誥賜三品服出使河東還改龍圖閣直學士河北都轉運桉察使左遷知制誥知滁州改起居舎人知揚州徙知潁州復龍圖閣直學士知應天府兼南京留守司歷尚書禮部吏部郎中丁韓國太夫人憂服除判吏部流内銓入翰林爲學士加史館修撰勾當三班院請郡改侍讀學士知蔡州留不行判太常寺兼禮儀事權知禮部貢舉拜右諫議大夫判尚書禮部又判祕閣祕書省加侍讀辭不受同修玉牒兼龍圖閣學士權知開封府以給事中罷同提舉在京諸司庫務改羣牧使唐書成拜禮部侍郎兼侍讀學士嘉祐五年以本官爲樞宻副使明年閏八月參知政事兼譯經潤文歴戸部吏部二侍郎皆參大政進拜左丞出爲觀文殿學士刑部尚書知亳州熈寧初遷兵部尚書知青州京東東路安撫使除檢校太保宣徽南院使判太原府河東路經略安撫監牧使兼并代澤潞麟府嵐石路兵馬都緫管三辭不受徙知蔡州熈寧四年六月以觀文殿學士太子少師致仕階特進勲上柱國食邑四千三百戸食實封一千二百戸明年閏七月二十三日薨于汝隂之私第天子聞之震悼爲之一日不視垂拱朝贈太子太師䘏􅀌法􅉠皆從加等公爲人剛正質直閎廓未甞屑屑於事見義敢爲患害在前直徃不顧用是數至困逐及復振起終不改其操眞豪傑之士哉居三朝數十年間以文章道徳爲一世學者宗師接人待物誠信樂易不爲表襮諸生進者與之抗聲極談簡直明辨至於貴顯終始如一見者莫不愛服而天資髙逺常人自不能與之合公待之一也有所稱薦姑取其一善後或毁公於朝遇其人或其家厄且困必力振之曰吾行已不以喜怒私也於經術務究大本其所發明簡易明白其論詩曰察其羙刺知其善惡以為勸戒所謂聖人之志者本也因其失傳而妄自爲之􅀃者經師之末也今夫學者得其本而通其末斯善矣得其本而不通其末闕其所疑可也不求異於諸儒甞曰先儒於經不能無失而所得固多矣盡其􅀃而理有不通然後得以論正予非好爲異論也其於詩易多所發明爲詩本義所改正百餘篇其餘則曰毛鄭之􅀃是矣復何云乎公㓜􅀌家貧無資太夫人以荻畫地教以字書稍長從閭里借書讀或手抄之抄未畢而成誦公之舉進士學者方爲時文號四六公就視之曰此不足爲然切於養勉爲之而人亦不能及故屢試有司皆第一名聲籍甚及景祐中與尹師魯偕爲古學已而有詔戒天下學者爲文使近古學者盡爲古文獨公古文旣行世以爲模範自兩漢後五六百年有韓愈愈之後又數百年而公􅁇出李翶皇甫湜栁宗元之徒不足多也蓋公之文備衆體變化開闔因物命意各極其工其得意處雖退之未能過筆札精勁自成一家當世士大夫有得數十字皆藏以爲寳生平以奨進人材爲巳任一時賢士大夫雖潛晦不爲人知者必延譽慰薦極其力而後已後進之士一爲公所稱遂爲聞人篤於朋友尹師魯梅聖俞孫明復皆貧甚旣卒公力爲經紀其家表其􅀌於朝悉録以官他甞所與厚者未甞遺也公旣書責諫官以申范文正坐謫夷陵而尹洙余靖亦連貶蔡君謨為四賢詩世傳之及范公之使陜西辟公偕徃朝廷從之時天下乆無事一旦西陲用兵士之􅀒材能者皆欲因時有所施設而范公望臨一時好賢下士故士之樂從者衆公獨歎曰吾初論范公事豈以為已利哉同其退不同其進可也卒辭焉慶曆􅀄公方登朝數論天下事爲䇿以揣敵情及指陳利害甚衆旣而有詔百官上封事公又上䟽言三弊五事力陳當時之所冝憂者仁宗増諫官員首預其選是時西師乆京東西盜賊羣起中外騷然仁宗旣進退大臣欲遂改更諸事公感激恩遇知無不言時范文正公杜正獻公今司徒韓公司空冨公皆輔政公屢請召對咨訪責以所爲旣而仁宗降手詔出六條虚心以待後遂下詔勸農桑興學校多所更革小人不恱一時知名士見謂爲黨人矣公爲朋黨議以進見集中温成后方有寵公言前世女寵之戒請加裁損王薨議者以國用不足請待豐年以􅁙公言士大夫家有所待而侈不如及時薄􅁙況天子叔邪且非所以示四方也卒從公議澧州進柿木成文有太平之道字公言今四海騷然未見太平之象又太平之道其意可推自古帝王致之皆有道得道則太平失道則危亂今見其失未見其得願陛下憂勤萬務漸期致理其瑞木請不宣示于外淮南轉運使吕紹寧到任進羡餘錢十萬貫公請拒而不受以防刻剥陜西用兵之後河東困弊芻糧不足言者請廢麟州或請移於合河津或請廢五寨公旣使河外爲四議以較麟州利害請移兵就食於瀕河清塞堡緩急不失應援而平時可省餽運麟州得不廢又建言忻代岢嵐火山四州軍􅆓􅁁有禁地棄而不耕人戸私糴北界斛斗入中以爲􅁁儲今若耕之每年可得數百萬石以實􅁁朝廷從之大爲河東之利自西事後河東賦歛重而民貧道路嗟怨公奏一作表罷數十事以寛民力公自河東還㑹保州兵叛遂出爲河北都轉運使保州卒旣降大將李昭亮私納婦女通判馮博文等竊傚之公發其姦下博文獄昭亮惶恐立出之自保州之變河北兵驕小不如意即謀爲亂人情務在姑息公乞假將帥權事從鎭重以銷未萌河北卒無事保塞之脅從者二千餘人分􅀠河北宣撫使恐復生變欲以便冝悉誅之公權知成徳軍遇之於内黃宣撫使夜半屏人以告公公曰禍莫大於殺降昨保州叛卒朝廷許以不死今戮之矣此曹本以脅從故得脫奈何一旦殺無辜二千人且非朝旨若諸郡不肯從緩之必生變是趣其爲亂也且某至鎮州必不從命遂止公在河北奏置御河催綱司通糧運􅁁州賴之置都作院於磁相二州以繕戎器仁宗遇公厚甞論及當世人材目公曰如歐陽某者豈易得哉常欲大用而未果及使河北陛辭日上面諭曰無爲乆居計有事言來公對以諫官得風聞今在外使事有指越職罪也況不得其實邪上曰有事第以聞勿以中外爲辭及黨論大起公極言請加明辨􅀔益危初公妹適張􅀛正􅀛正無子有女非歐出也妹旣􅊔無所歸以􅀌女偕來及笄以嫁宗人晟張氏後以他事下獄小人欲并中公乃捃張氏貲産事窮治乆之卒無有猶貶滁上公丁太夫人憂旣免喪入見仁宗惻然怪公髪白問在外幾年今年幾何恩意甚至命判流内銓小人恐公且復用偽爲公奏乞汰内臣䟽傳之中外宦者人人切齒内官楊永徳隂以言中公出知同州而外議不平論救者衆上㝷開悟故馮翊之命卒不行公在侍從八年多所闓益初河決澶淵陳恭公爲相欲塞商胡開横壠故道公言功大恐不可成徒勞人未幾陳罷去新宰相復用李仲昌議欲開六塔河公言六塔不能吞伏且復決再爭之不得旣而果然濵徳博數千里大􅀍其害仲昌等得罪流貶至和初公奉使契丹契丹使其貴臣惕隐及北宰相蕭知足等來押宴曰非常例也以公名重故爾其爲外夷所畏如此公在翰林仁宗一日乗間見御閤春帖子讀而愛之左右曰學士歐陽某之辭也乃悉取宫中帖閱之見其篇篇有意歎曰舉筆不忘規諌真侍從之臣也毎學士院進文字必曰何人當直至公之筆必詳覽之毎加歎賞嘉祐初公知貢舉時舉者爲文以新竒相尚文體大壞公深革其弊前以怪僻在髙第者黜之幾盡務求平澹典要士人初怨怒罵譏中稍信服已而文格遂變而復正者公之力也公之尹京承包孝肅公之後包以威嚴爲治公一切循理不事風采或以爲言公曰人材性各有短長今捨所長彊其所短以徇俗求譽我不能也至寵貴犯禁令又求苟免者必寘於法雖詔命有所不從且請加本罪二等至今行之由公奏請也公在樞宻與今侍中曽魯公悉力振舉紀綱革去宿弊考天下兵數及三路屯戍多少地理逺近更爲圖籍之法􅁁防乆闕屯守者大加蒐􅀘數月之間機務浸理甞因嘉祐水災凡再上䟽請選立皇子以固天下根本言甚激切及在政府遂與諸公恊定大議而先帝力辭宗正之命公進曰宗室不領職事忽有此除天下皆知陛下將儲以爲嗣一作以爲儲嗣不若遂正其名且判宗正寺誥勑付閤門得以不受今立爲皇子止消一詔書事定矣仁宗以爲然遂下詔及先帝初年未親政事慈壽垂簾公與諸公徃來兩宫鎮撫内外而危言宻議忠力爲多至先帝親御萬機内外肅然每諸公聚議事有未可公未甞不力諍臺諫官至政事堂論事徃徃靣折其短英宗甞靣稱公曰性直不避衆怨甞稱故相王沂公之言曰恩欲歸已怨使誰當且曰貧賤常思冨貴冨貴必履危機此古人之所歎也惟不思而得旣得而不患失之者其庻幾乎及彭思永蔣之竒等以飛語汙公公杜門請付有司治之上連詔詰問所從來二人辭窮悉逐之上親遣中貴人手詔慰安公遂稱疾力解機務自嘉祐以後朝廷務惜名器而進人之路稍狹公屢建言館閣育材之地材旣難得而又難知則當博採而多畜之時冀一得於其間則傑然出爲名臣矣餘亦不失爲佳士也遂詔二府各舉五人其後中選者徃徃在清近朝廷稍􅀵其用矣京師百司所行兵民官吏財用之􅀋皆無緫數中書一有行移則下有司纂集公因暇日盡以中書所當知者集爲緫目上有所問宰相以緫目爲對公以祀假家居上遣中貴人就中書閤取而閱之連典劇郡以鎮静爲本不求赫赫名舉大體而已民便安之滁􅀭二州生爲之立祠公在亳年甫六十表致仕者六不從至蔡而請益堅卒不能奪公志其勇退如此公平生於物少所好獨好收畜古文圖書集三代以來金石銘刻爲一千卷以校正史傳百家訛繆之􅀃爲多晚年自號六一居士曰吾集古録一千卷藏書一萬卷有琴一張有棊一局而常置酒一壷吾老於其間是爲六一自爲傳以刻石甞被詔撰唐書紀十卷志五十卷表十五卷又自撰五代史七十四卷其爲紀一用春秋法於唐禮樂志明前世禮樂之本岀於一而後世禮樂爲空名五行志不書事應盡破漢儒菑異附㑹之􅀃其論著􅀋此五代史辭約而事備及正前史之失爲多公之薨上命學士爲詔求書於其家方繕寫進御甞著易童子問三卷詩本義十四卷居士集五十卷歸榮集一卷外制集三卷内制集八卷奏議集十八卷四六集七卷集古録跋尾十卷雜著述十九卷諸子集以爲家書緫目八卷其遺一作餘逸不録者尚數百篇别爲編集而未及成公初娶胥氏翰林學士贈吏部侍郎偃之女􅁇室楊氏集賢院學士諫議大夫大雅之女今夫人薛氏資政殿學士户部侍郎贈太尉簡肅公奎之女累封仁壽郡夫人男八人女三人長女師蚤卒次發光禄寺丞次女蚤卒次奕光禄寺丞次棐大理評事次某蚤卒次辯光禄寺丞次三男皆蚤卒次女封樂壽縣君蚤卒孫男四人曰愻曰憲曰恕曰愬皆以公恩試祕書省校書郎孫女六人皆㓜將以􅄉寜八年九月二十六日葬公於開封府新鄭縣旌賢郷之原謹狀熈寧六年七月日樞宻副使正奉大夫行右諫議大夫上柱國賜紫金魚袋呉充狀謚誥省司凖勑定謚據本家發到故推誠保徳崇仁翊戴功臣觀文殿學士特進太子少師致仕上柱國樂安郡開國公食邑四千三百戸食實封一千二百戸贈太子太師歐陽某行狀依例牒太常禮院擬謚今凖回牒連到議狀謚曰文忠宣徳郎守太常丞充集賢校理同知太常禮院李清臣太子太師歐陽公歸老于其家以疾不起將􅁙行狀上尚書省移太常請謚太常合議曰公維聖宋賢臣一世學者之所師法明于道徳見于文章究覽六經羣史諸子百氏馳騁貫穿述作數十百萬言以傳先王之遺意其文卓然自成一家比司馬遷􅀭雄韓愈無所不及而有過之者方天下溺於末習爲章句聲律之時聞公之風一變爲古文咸知趨尚根本使朝廷文明不愧于三代漢唐者太師之功于教化治道爲最多如太師真可謂文矣博士李清臣得其議則閱讀行狀考按謚法曰唐韓愈李翶權徳輿孫逖本朝楊億皆謚文太師固冝以文謚吏持衆議白太常官長官長有曰文則信然不復易也然公平生好諫諍當加獻爲文獻無已則加忠爲文忠衆相視曰其如何則又合言曰忠亦太師之大節太師甞參天下政事進言仁宗乞早下詔立皇子使有明名定分以安人心及英宗繼體今上即皇帝位兩預定䇿翊戴有安社稷功和􅁉内外周旋兩宫間迄于英宗之視政蓋太師天性正直心誠洞逹明白無所欺隐不肯曲意順俗以自求便安好論列是非分别賢不肖不避人之怨誹狙嫉忘身履危以爲朝廷立事按謚法道徳博聞曰文廉方公正曰忠今加忠以麗文冝爲當衆以狀授清臣爲謚議清臣曰不改於文而􅀓之以忠議者之盡也清臣其敢不從遂謚文忠謹議朝奉郎守尚書工部郎中充祕閣校理直舎人院兼同修起居注權判吏部流内銓􅀐都尉賜緋魚袋錢藻宣徳郎守尚書刑部員外郎充集賢校理兼同修起居注權同判吏部流内銓􅀐都尉賜緋魚袋竇卞伏凖太常禮院謚議如前天下文物繁盛之極學士大夫競夫鎪刻組繪日益靡靡以汨没於倬詭魁殊之􅀃而不復知淳古之爲正也於是時天下曰是太師曰非天下以爲韙太師以為陋學士大夫磨牙淬爪爭相出力以致之危害太師不之顧曰我道尭舜也我言孔子孟軻也而天下不我從將焉徃然卒由太師而一歸於醇正故仁義之言其華曄然獨輝灼乎一代之盛逺出二京之上嗚虖媺哉大丈夫束帶立夫人之朝所以大過人者大節立焉不齪齪小節以求曲全可也怫衆慮彊君以難是爲大節不徇世俗之論而先識以制未形是爲大節太師當嘉祐之間恊議建儲正名挈天下之疑而泮之萬世因而若維太山而安不危斯之謂大節謚法道徳博聞曰文㢘方公正曰忠生平論譔文章務明堯舜孔孟之教於已壞之後可謂道徳博聞矣排左右持禄取容之慮特建萬世無窮之䇿而自不以爲功可謂㢘方公正矣太常易名曰文忠庶乎天下有以知公議之不能泯也省司準例於都亭驛集合省官同參詳皆恊令式請有司準例施行謹詳定訖遂具狀中書門下取裁奉宰臣判準申謹具狀奏聞伏􅀱勑旨尚書都省末故推誠保徳崇仁翊戴功臣觀文殿學士特進太子少師致仕上柱國樂安郡開國公食邑四千三百戸食實封一千二百戸贈太子太師歐陽脩謚曰文忠附録卷第一曽舎人祭文甄抜寒素維公平生王句一本止作徳信天資志氣元豐􅀋槀作氣志行狀而夫人壽考康寧而字下一有太字謚誥則又合言曰言字一作議其下又有文獻疊犯廟謚固不可九字集古録跋尾卷第一歐陽文忠公文集一百三十四古敦銘毛伯敦龔伯彞伯庶父敦右毛伯古敦銘嘉祐中原父以翰林侍讀學士出爲永興軍路安撫使其治在長安原父博學好古多藏古竒噐物􅀎讀古文一作之銘識考知其人事蹟而長安秦漢故都時時發掘所得原父悉購而藏之以予方集録古文故毎有所得必模其銘文以見遺此敦原父得其蓋於扶風而有此銘原父爲予考按其事云史記武王克商尚父牽牲毛叔鄭奉明水則此銘謂鄭者毛叔鄭也銘稱伯者爵也史稱叔者字也敦乃武王時器也蓋余集録最後得此銘當作録目序時但有伯囧銘吉日癸巳字最逺故叙言自周穆王以来叙已刻石始得斯一作此銘乃武王時器也其後二銘一得盩厔曰龔伯尊彞其一亦得扶風曰伯庶父作舟姜尊敦皆不知爲何人也三器銘文皆完可識具列如左右真蹟毛伯敦銘釋文佳二年正月初吉王在周昭宫丁亥王格于宣射毛伯入門位中庭右祝鄭王呼内史冊命鄭王曰鄭昔先王旣命女作邑一字未詳五邑祝今余隹亂商乃命錫女赤芾同冕齊黄䜌旂用事鄭拜稽首敢對􅀭天子休命鄭用作朕皇考龔伯尊敦鄭其鬻壽萬年無疆子子孫孫永寳用享薛尚功釋云惟二年正月初吉王在周邵宫丁亥王格于宣榭毛伯内門立中廷佑祝􅌏王呼内史􅉺命􅌏王曰􅌏昔先王旣命汝作邑継五邑祝今余惟疃京乃命錫汝赤市彤冕齊黄鑾旂用事􅌏拜稽首敢對揚天子休命􅌏用作朕皇考龔伯尊敦􅌏其眉壽萬年無疆子子孫孫永實用享龔伯彞銘釋文􅯽作皇祖懿公文公武伯皇考龔伯尊彞􅯽其熈萬年無疆霝終霝始其子子孫孫永寳用享于宗室薛尚功釋云􅯽作皇祖益公文公武伯皇考龔伯䵼彞􅯽其熈萬年無疆令終令命其子子孫孫永寳用享于宗室伯庶父敦銘釋文惟二月戊寅伯庻父作王姑舟姜尊敦其永寳用薛尚功釋月爲周餘同上韓城鼎銘右原甫旣得鼎韓城遺余以其銘而太常博士揚南仲􅀎讀古文􅂐籕爲余以今文冩之而闕其疑者原甫在長安所得古竒器物數十種亦自爲先秦古器記原甫博學無所不通爲余釋其銘以今文而與南仲時有不同故并著二家所解以竢博識君子具之如左右真蹟惟王九月乙亥􅀳姜曰余惟司朕先姑君􅀳􅀖余不安寧巠雝明徳宣我猷用所辭辟剿䖍不㠯寵我萬民嘉遺我錫鹵賚千兩㐱灋文侯征綏堅乆吉金用作寳尊鼎用康妥懐逺􅀖君子􅀳姜用蘄麋壽作惠亟萬年無疆用徳畯保其孫子三壽是利右原父所冩如此佳惟王九月乙亥􅀳姜曰余佳惟司嗣孠同朕先姑君􅀳􅀖余不今作敢者籕文省􅄭寧巠經雝朙徳宣疑省隷作䘏我用辝辟疑卽母字乆灮䖍不疑㒸字讀爲墜諸覃享􅎧師我萬民我疑易字鹵或胃字省千兩勿灋文矦頵令畢疑卑字疑母字讀爲貫通征疑緐字湯受久吉金用寶􅳛鼎用康疑西夏字妥讀爲綏褱君子晉姜用疑旂字讀爲祈疑釁字讀爲眉爲亟極萬秊無彊疆用亯享用徳㽙疑允字􅍖其孫子三是右嘉祐已亥􅀊馮掖有得鼎韓城者摹其欵識于石樂安公以南仲職典書學命􅇚其字謹按其銘蓋多古文竒字古文自漢世知者已稀字之傳者賈逵許慎輩多無其說蓋古之事物有不與後世同者故不能盡通其作字之本意也其不傳者今或得於古器無所依據難以臆斷大抵古字多省偏㫄而􅃐簡易故隹司巠􅎧等字皆假借也鄭司農說周禮云古者書儀但爲義又云古者立位同字古文春秋經公即位爲公即立者是也者進取也从􅗸故疑爲母从女而象乳子形故疑爲母而讀爲緐雝用邕聲邕从巛古文作􅳓今此从水从吕故疑爲雝魯字古作􅨞􅀰旅字古文旅作而者字用爲聲蓋古文魯旅者三字通用故疑爲諸易者􅂐文象蜥易形故疑爲易而讀爲錫爲賜皆以聲假借也鹵从卤古西字中象鹽形胃上象胃中榖形故胃二字卑者从􅚀在甲下􅚀今但用左古者尚右故􅚀在甲下爲卑故疑爲卑亦恐借爲俾讀毌音冠象穿寳貨形貫字从之或卽母字今毛詩有串夷字俗用爲串穿之串而說文不載豈非字之省也故疑讀爲貫通从辶凡从辶彳之字多通用故疑爲通古語二字相屬者多爲一字書之若秦鍾銘有小子四方之字是也卤古西字故疑爲西夏字秦鍾銘亦有此字妥字說文無之蓋古綏字省糸􅈛其後相承讀如媠故疑讀爲綏㫃音偃石皷文皆作古之旌旂悉載於車故疑卽旂字而从車借讀爲祈近甞有得敦藍田者二銘皆有用萬之文故知然也釁今幡爲許刃而虋􅉮之虋音門用之爲聲詩鳧鷖在釁又省爲亹易繫辭又讀如尾釁門尾眉聲相近又古者字音多與今異徐鉉所謂如皀亦音香釁亦音門乃亦音仍它皆做此是也豈釁眉古亦同音歟秦鍾銘亦有釁字故疑爲眉爲者母猴也从爪而象其形故爲爲㽙字字書所無而於文埶宐爲允蓋用甽省聲也它字不可識者猶十一二與其偏㫄之異者若之􅀋皆今所不傳以小􅂐參求之不􅀎仿佛以今揆之其間或當時書者器者不必無謬誤矣姑盡淺學以塞公命云􅈛嘉祐壬寅冬十月太常博士知國子監書學豫章楊南仲識甞觀石皷文愛其古質物象形埶有遺思焉及得原甫鼎器銘又知古之􅂐字或多或省或移之左右上下惟其意之所欲然亦有工拙秦漢以来裁歸一體故古文所見者止此惜哉治平甲辰正月莆陽蔡襄商雒鼎銘真蹟右商雒鼎銘者原甫在長安時得之上雒其銘云惟十有四月旣死霸王在下都雝公作􅳛鼎用追享丁于皇且考用气麋壽萬年無疆子子孫孫永寳用雝公不知爲何人原甫謂古丁寧通用蓋古字簡略以意求之則得爾而蔡君謨謂十有四月者何原甫亦不􅀎言也治平元年中伏日書古器銘鍾銘二甗銘二􅇲器銘一字疑非􅇲寳敦銘一右古器銘六余甞見其二曰甗也寳龢鍾也太宗皇帝時長安民有耕地得此甗初無識者其状下爲鼎三足上爲方甑中設銅箄可以開闔製作甚精有銘在其側學士句中正工於􅂐籕能識其文曰甗也遂藏于袐閣余爲校勘時常閱于袐閣下景祐中修大樂冶工給銅更鑄編鍾得古鍾有銘于腹因存而不毀即寳龢鍾也余知太常禮院時甞於太常寺按樂命工叩之與王朴夷則清聲合初王朴作編鍾皆不圓至李照等奉詔修樂皆以朴鍾爲非及得寳龢其狀正與朴鍾同乃知朴爲有法也嘉祐八年六月十八日書右真蹟同前綏和鍾寳盉寳敦右古器銘四尚書屯田貟外郎楊南仲爲余讀之其一曰綏和林鍾其文磨滅不完而字有南仲不􅀎識者其二曰寳盉其文完可讀曰伯玉船子作寳盉其萬斯年子子孫孫其永寳用其三其四皆曰寳敦其銘文亦同曰惟王四年八月丁亥􅊌季肇作朕王母弟姜寳敦散季其萬年子子孫孫永寳蓋一敦而二銘余家集録所藏古器銘多如此也治平元年七月十三日以服藥假家居書右真蹟自余集録古文所得三代器銘必問於楊南仲章友直曁集録成書而南仲友直相繼以死古文竒字世罕識者而三代器銘亦不復得矣治平三年七月二十一有八字日一有以字孟饗攝事太廟齋宫書右真蹟終南古敦銘右終南古敦銘大理評事蘇軾爲鳳翔府判官得古器於終南山下其形制與今三禮圖所畫及人家所藏古敦皆不同初莫知爲敦也蓋其銘有寳尊敦之文遂以爲敦爾右集本叔髙父煮簋銘右煮簋銘曰叔髙父作煑簋其萬年子子孫孫永寳用原父在長安得此簋於扶風原甫曰簋容四升其形外方内圓而小堶之似􅀛有首有尾有足有甲有腹今禮家作簋亦外方内圓而其形如桶但於其蓋刻爲􅀛形一有爾字與原甫所得真古簋不同一有也字君謨以謂禮家傳其說不見其形制故名存實亡原甫所見可以正其繆也故并録之以見君子之於學貴乎多見而博聞也治平元年六月二十日書右真蹟周穆王刻石右周穆王刻石曰吉日癸巳在今賛皇壇山上壇山在縣南十三里穆天子傳云穆天子登賛皇一有山字以望臨城置壇此山遂以爲名癸巳誌其日也圖經所載如此而又别有四望山者云是穆王所登者一作山據穆天子傳但云登山不言刻石然字畫亦竒怪土人謂壇山爲馬蹬山以其字形􅀋也慶曆中宋尚書祁在鎮陽遣人於壇山模此字而趙州守將武臣也遽命工鑿山取其字龕于州廨之壁聞者爲之嗟惜也治平甲辰秋分日書右真蹟敦銘周姜寳敦張伯煑右伯囧敦銘曰伯囧父作周姜寳敦用夙夕享用蘄萬壽尚書囧命序曰穆王命伯囧爲周大僕正則此敦周穆王時器也按史記年表自厲王以上有世次而無年數共和以後接乎春秋年數乃詳蓋自穆王傳共孝懿夷厲五王而至于共和自共和至今蓋千有九百餘年斯敦之作在共和前五世而逺也古之人之欲存乎乆逺者必託於金石而後傳其堙沉埋􅃿顯晦出入不可知其可知者乆而不朽也然岐陽十鼓今皆在而文字剥缺者十三四惟古器銘在者皆完則石之堅又不足恃是以古之君子器必用銅取其不爲燥濕寒暑所變爲可貴者以此也古之賢臣名見詩書者常爲後世想望矧得其器讀其文器古而文竒自可寳而藏之邪其後張伯銘曰張伯作煮其子子孫孫永寳用張伯不知何人也二銘皆得之原父也右集本敦􅔆銘伯囧敦張仲􅔆嘉祐六年原父以翰林侍讀學士出爲永興軍路安撫使其治在長安原父博學好古多藏古竒器物而咸鎬周秦故都其荒基破􅃁耕夫牧兒往往有得必購而藏之以余方集録古文乃模其銘刻以爲遺故余家集古録自周武王以来皆有者多得於原父也歸自長安所載盈車而以其二器遺余其一曰伯囧之敦其一曰張仲之􅔆其形制與今不同而極精巧敦医皆有銘而云医獲其二皆有蓋而上下皆銘銘文皆同甚矣古之人慮逺也知夫物必有弊而百世之後埋􅃿零落幸其一在尚冀或傳爾不然何丁寧重􅃨若此之煩也其於一用器爲慮猶如此則其操修施設所以垂後世者必不苟二子名見詩書伯囧周穆王時人張仲宣王時人太史公表次三代以来自共和以後年世乃詳蓋自共和元年逮今千有九百餘年而穆王又共和前五世可謂逺矣而斯器也始獲於吾二人其中間晦顯出入不可知以其無文字以志之也蓋其出或非其時而遇或非其人者物有幸不幸也今出而遭吾二人者可謂幸矣不可以不傳故爲之書且以爲贈我之報歐陽脩記右集本張仲器銘集本張仲作寳医奉之金鏤其其其光用授熊用饗大正商王寘饔鼎召欲張仲受無疆福飲飤鼎餬張仲萬壽医銘雖四而文則一今類轉注偏傍之或異者分注釋文四十一字於其下張仲作寳簠之金鈌鈨鈌錿其熏其玄其黄用盛諸受􅧤未用饗大正音王賔飱具召飼張仲受無疆福必友飱飼鼎寳張仲畀壽薛尚功編鼎彝款識有此釋文五十一字附見于此右張仲器銘四其文皆同而轉注偏傍左右或異蓋古人用字如此爾嘉祐中原父在長安獲二古器於藍田形制皆同有蓋而上下有銘甚矣古人之爲慮逺也知夫物必有弊而百世之後埋􅃿零落幸其一在尚冀或傳爾不然何丁寧重􅃨一作復若此之煩也詩六月之卒章曰侯誰在矣張仲孝友蓋周宣王時人也距今實千九百餘年而二器始復出原甫藏其器予録其文蓋仲與吾二人者相期於二千年之間可謂逺矣方仲之作斯器也豈必期吾二人者哉蓋乆而必有相得者物之常理爾是以君子之於道不汲汲而志常在於逺大也原甫在長安得古器數十作先秦古器記而張仲之器其銘文五十有一其可識者四十一具之如左其餘以俟博學君子石鼓文右石鼓文岐陽石鼓初不見稱於前世至唐人始盛稱之而韋應物以爲周文王之鼓一有至字宣王刻詩一有尔字韓退之直以爲宣王之鼓在今鳳翔孔子廟中鼓有十先時散棄于野鄭餘慶置于廟而亡其一皇祐四年向傳師求於民間得之一有十鼓二字廼足其文可見者四百六十五一有磨滅二字不可識者過半余所集録文之古者莫先於此然其可疑者三四今世所有漢桓靈時碑往往尚在其距今未及千歳大書深刻而磨滅者十猶八九此鼓按太史公年表自宣王共和元年至今嘉祐八年實千有九百一十四年鼓文細而刻淺理豈得存此其可疑者一也其字古而有法其言與雅頌同文而詩書所傳之外三代文章真蹟在者惟此而巳然自漢巳来博古好竒之士皆略而不道此其可疑者二也隋氏藏書最多其志所録秦始皇刻石婆羅門外國書皆有而獨無石鼔遺近録逺不冝如此此其可疑者三也前世傳記所載古逺竒怪之事􅀋多虚誕而難信況傳記不載不知韋韓二君何據而知爲文宣之鼓也隋唐古今書籍粗僃豈當時猶有所見而今不見之邪然退之好古不妄者余姑取以爲信爾至於字畫亦非史籀不􅀎作也廬陵歐陽某記嘉祐八年六月十日書右真蹟秦度量銘右秦度量銘二按顔氏家訓隋開皇二年之推與李徳林見長安官庫中所藏秦鐡稱權傍有鐫銘二其文正與此二銘同之推因言司馬遷秦始皇帝本紀書丞相隗林當依此銘作隗狀遂録二銘載之家訓余之得此二銘也廼在袐閣校理文同家同蜀人自言甞遊長安買得一有此字二物其上刻二銘出以示余其一乃銅鍰不知爲何器其上有銘循環刻之乃前一銘也其一乃銅方版可三四寸許所刻乃後一銘也考其文與家訓所載正同然之推所見是鐵稱權而同所得乃二銅器余意秦時兹二銘刻於器物者非一也及後又於集賢校理陸經家得一銅版所刻與前一銘亦同益知其然也故并録之云嘉祐八年七月十日書右真蹟秦昭和鍾銘右秦昭和鍾銘曰秦公曰丕顯朕皇祖受天命奄有下國十有二公按史記秦本紀自非子邑秦而秦仲始爲大夫卒莊公立卒襄公文公寧公出公武公徳公宣公成公穆公康公共公桓公景公相次立太史公於本紀云襄公始列爲諸侯於諸侯年表則以秦仲爲始今據年表始秦仲則至康公爲十二公此鍾爲共公時作也據本紀自襄公始則至桓公爲十二公而銘鍾者當爲景公也故並列之以俟􅀶識君子治平元年二月社前一日書右真蹟秦祀巫咸神文一作秦誓文右秦祀巫咸神文今流俗謂之詛楚文其言首述秦穆公與楚成王事遂及楚王熊相之罪按司馬遷史記世家自成王以後王名有熊良夫熊適熊槐熊元而無熊相據文言穆公與成王盟好而後云倍十八世之詛盟今以世家考之自成王十八世爲頃襄王而頃襄王名横不名熊相又以秦本紀與世家參較自楚平王娶婦於秦昭王時吴伐楚而秦救之其後歷楚惠簡聲悼肅五王皆寂不與秦相接而宣王態良夫時秦始侵楚至懷王熊槐頃襄王熊横當秦惠文王及昭襄王時秦楚屢相攻伐則此文所載非懷王則頃襄王也而名皆不同又以十八丗數之則當是頃襄然則相之名理不冝繆但史記或失之爾疑相傳寫爲横也右集本之罘山秦􅂐遺文集本右秦􅂐遺文􅂊二十一字曰於乆逺也如後嗣焉成功盛徳臣去疾御史大夫臣徳其文與嶧山碑㤗山刻石二世詔語同而字畫皆異惟㤗山爲真李斯􅂐爾此遺者或云麻温故學士於登州海上得片木有此文豈杜甫所謂􅀥木傳刻肥失真者邪秦㤗山刻石一作書李斯􅂐後集本右秦二世詔李斯􅂐天下之事固有出於不幸者矣苟有可以用於世者不必皆賢聖之作也􅃖尤作五兵紂作􅃮噐不以二人之惡而廢萬世之利也􅂐字二字一作小􅂐之法出於秦李斯斯之相秦焚棄典籍遂欲滅先王之法而獨以已之所作刻石而示萬世何哉十四字一作至已之所作則爲萬世不可朽之計何其愚哉按史記秦始皇帝行幸天下凡六刻石及二世立又刻詔書于一作於其旁今皆亡矣獨泰山頂上二世一有此字詔僅在所一無二字存數十字爾今俗傳嶧山碑者史記不載又其字體差大六字一作其字特大不􅀋泰山存者其本出於徐鉉一無此六字又有别本云一無此字出於夏竦家者以今市人所鬻校之無異一無此十一字自唐封演巳言嶧山碑非真而杜甫直謂􅀥木傳刻爾皆不足貴也一無此五字余友江鄰㡬一作休復謫官於奉符甞自至泰山頂上視秦所刻石處云石頑不可鐫鑿不知當時何以刻也然而二字一作其四靣皆一有石字無草木而野火不及故􅀎若此之乆一有也字然風􅀨所剥其存者纔此數十字一無此三字而巳本鄰㡬遺余也比今俗傳嶧山碑本特爲真者爾一無此十九字只作休復字鄰㡬秦嶧山刻石右秦嶧山碑者始皇帝東廵羣臣頌徳之辭至二世時丞相李斯始以刻石今嶧山實無此碑而八家多有傳者各有所自来昔徐鉉在江南以小􅂐馳名鄭文寳其門人也甞受學於鉉亦見稱於一時此本文寳云是鉉所摸文寳又言甞親至嶧山訪秦碑莫獲遂以鉉所摸刻石於長安世多傳之余家集録别藏泰山李斯所書數十字尚存以較摸本則見真僞之相逺也治平元年六月立秋日右真蹟同前一作秦二世詔右鄒嶧山秦二世刻石以泰山所刻較之字之存者頗多而磨滅尤甚其趙嬰楊樛姓名以史記考之乃微可辨其文曰大夫趙嬰五大夫楊樛皇帝曰金石刻盡始皇帝所爲也今襲號而金石刻凡二十九字多於泰山存者而泰山之石又滅盛徳二字其餘則同而嶧山字差小又不􅀋泰山存者刻畫完好而附録于一作於此者古物難得兼資博覽爾蓋集録成書後八年得此于一作於青州而附之熈寧元年秋九月六日書右真蹟前漢二器銘林華宫行鐙一􅀊月見本文蓮勺宫博山爐劉原父帖近又獲一銅器刻其側云林華觀行鐙重一斤十四兩五鳳二年造第一今附墨本上呈右林華宫行鐙銘一蓮勺宫銅博山爐下槃銘一皆漢五鳳中造林華宫漢書不載宣帝本紀云困於蓮勺鹵中注云縣也亦不云有宫蓋秦漢離宫别館不可勝數非因事見之則史家不䏻備載也余所集録古文自周穆王以来莫不有之而獨無前漢時字求之乆而不獲毎以爲恨嘉祐中友人劉原甫出爲永興守長安秦漢故都多古物竒器埋没於荒基敗􅃁往往爲耕夫牧竪得之遂復傳於人間而原甫又雅喜蔵古器由此所獲頗多而以余方集古文故毎以其銘刻爲遺旣獲此二銘其後又得谷口銅甬銘乃甘露中造由是始有前漢時字以足余之所闕而大償其素願焉余所集録旣博而爲日滋乆求之亦勞得於人者頗多而最後成余志者原甫也故特誌之嘉祐八年􅀊在癸卯七月二十日書右真蹟前漢谷口銅甬銘􅀊月見本文右漢谷口銅甬原父在長安時得之其前銘云谷口銅甬容十其下滅兩字始元四年左馮翊造其後銘云谷口銅甬容十斗重四十斤甘露元年十月計􅁺章平左馮翊府下滅一字原父以今權量校之容三斗重十五斤始元甘露皆宣帝年號一有也字余所集録千卷前漢時文字惟此與林華行鐙蓮勺博山鑪盤銘爾治平元年六月九日書右真蹟前漢鴈足鐙銘此跋本與漢二器銘銅甬銘共爲一卷裴如晦帖煜頃甞謂周秦東漢往往有銘傳於世間獨西漢無有王原􅅩言華州片瓦有元光字急使人購得之乃好事者所爲非漢字也侍坐語及公亦謂家集所闕西漢字耳煜守丹楊日蘇氏者出古物有銅鴈足鐙制作精巧因辨其刻則黄龍元年所造其言榮宫二史間未始概見遂摹之欲􅀉左右以爲集古録之一事㑹悲苦不果昨偶開篋見之謹以上獻亦聞原甫於秦中得西漢數器不知文字與此􅀋不煜再拜治平元年十二月十四日後三年余出守亳社而裴如晦以疾卒于京師明年原甫卒于南都二人皆年壯氣盛相次以殁而余獨巋然而存也熈寧壬子四月右真蹟後漢西嶽華山廟碑􅀊月見本文右漢西嶽華山廟碑文字尚完可讀其述自漢以来云髙祖初興改秦􅁋祀太宗承循各詔有司其山川在諸侯者以時祠之孝武皇帝修封禪之禮廵省五嶽立宫其下宫曰集靈宫殿曰存僊殿門曰望僊門中宗之世使者持節􅀊一禱而三祠後不承前至於亡新寖用丘虚建武之元事舉其中禮從其省但使二千石􅀊時往祠自是以来百有餘年所立碑石文字磨滅延熹四年弘農太守􅀽逢修廢起頓易碑飾闕㑹遷京兆尹孫府君到欽若嘉業遵而成之孫府君諱璆其大略如此所謂集靈宫者他書皆不見惟見此碑一有爾字則余之集録不爲無益矣一無此十字治年元年閏五月十六日書右真蹟後漢樊毅華嶽碑􅀊月見本文右漢樊毅華嶽碑云泰華之山削成四方其髙五千仞廣十里周禮職方氏華謂之西嶽􅀕視三公者以􅀎興雲􅀨産萬物通精氣有益於人則祀之故帝舜受堯親自廵省曁夏殷周未之有改秦違其典璧遺鄗池二世以亡漢祖應運禮遵陶唐􅀕則􅀗福亦世克昌亡新滔逆􅀑神不享建武之初彗掃頑凶光和二年有漢元舅五侯之胄謝陽之孫曰樊府君諱毅字仲徳命守斯􅀖孟冬十月齋祠西嶽以傳窄狹不足處尊卑廟􅃕舊乆墻屋傾亞特部行事荀班縣令先讜以漸􅀘治此其事也又云功曹郭敏等遂刋玄石銘勒鴻勲其字畫頗完其文彬彬可喜惟以周禮職方氏爲識方氏其字畫分明非訛缺疑當時周禮之學自如此蓋識誌其義皆通也治平元年五月十日書右真蹟同前右漢樊毅修華嶽廟碑云惟光和元年􅀊在戊午名曰咸池季冬已已弘農太守河南樊君諱毅字仲徳下車之初㳟肅神祀西嶽至尊詔書奉祠躬親自往齋室逼窄法齋無所於是與令巴郡朐忍先讜圖議繕故二年正月已夘興就刻兹碑號吏卒挾路據此碑乃即時所立而太守生稱諱者何哉治平元年末伏日書右真蹟後漢修西嶽廟復民賦碑􅀊月見本文右漢修西嶽廟復民賦碑云光和二年十二月庚午朔十三日壬午弘農太守臣毅頓首死罪上尚書臣毅頓首頓首死罪死罪謹按文書臣以去元年十一月到官其十二月奉祠西嶽華山省視廟舍及齋衣􅀕器率皆乆逺有垢臣以神嶽至尊冝加恭肅輙遣行事荀班與華隂令先讜以漸繕治成就之又曰讜言縣當孔道加奉尊嶽一􅀊四祠飬牲百日用榖藁三千餘斛或有請􅀨齋禱役費兼倍小民不堪有饑寒之窘違宗神之敬乞差諸賦復華下十里以内民租田口臣輙聽盡力奉宣詔書思惟惠利増異復上臣毅誠惶誠恐頓首頓首死罪死罪上尚書漢家制度今不復見惟余家集録漢碑頗多故於磨滅之餘時見一二而此碑粗完故録其首尾以傳臣毅者樊毅也右集本後漢北嶽碑􅀊月見本文集本右漢北嶽碑文字殘滅尤甚莫詳其所載何事第其􅀮􅀮可見者曰光和四年以此知爲漢碑爾其文斷續不可次序蓋多言珪幣牲酒􅁰稷豐穰等事似是禱賽之文其後有二人姓名偶可見云南陽冠軍馮廵字季祖甘陵夏方字伯陽其餘則莫可考矣後漢無極山神廟碑􅀊月見本文右漢無極山神廟碑文字磨滅斷續然尋繹次序其可見者尚可成文云太常臣躭丞敏頓首上尚書謹按文書男子常山蓋髙上黨范遷爲元氏三公神山去年五月常山相廵詣山請􅀨山神卽使髙傳言白國縣卽與封龍靈山無極山共興雲􅀨常山相廵元氏令王翊各以一白羊賽復使髙與遷俱詣太常爲無極山神索法食臣疑髙遷言不實輙移本國今常山相廵書言郡督郵言無極山體可三里所立石爲體長二丈五尺所山周匝二十餘里其三公封龍靈山皆得法食乞令無極山比三山祠牲出王家以珪璧爲信愚臣如廵言請少府給珪璧故事湏報臣躭愚戇頓首頓首上尚書制曰可尚書令忠奏雒陽宫太常承書從事光和四年八月十七日丁酉尚書令忠下太常躭丞敏下常山相其奏章如此其後遂言造廟事而有銘其文多不載按漢奏章首尾皆言臣某頓首頓首死罪死罪上尚書而此碑所載太常一有奏字章首尾不稱死罪而丞敏又不稱臣莫曉其制碑後又列常山官屬云常山相南陽馮廵字季祖元氏令王翊字元輔云治平元年四月一日書右真蹟後漢桐柏廟碑􅀊月見本文右漢桐柏廟碑磨滅雖不甚而文字斷續粗可考次蓋南陽太守修廟碑也其辭云延熹六年正月乙酉南陽太守中山盧奴君奴下正闕一字當是其姓又云尊神敬祀立廟桐柏春秋宗禜災異告變水旱請求位比諸侯聖漢所尊一作宗太守奉祀二十餘年不復身至遣丞行事簡略不敬明神弗歆災害以生五嶽四瀆與天合徳仲尼慎􅀕常若神在君準則大聖親之桐柏来見廟祠﨑嶇逼狹開拓神門立闕四望増廣壇場又云執玉以沉爲民祈福靈祇報祐天地清和其大意止於如此其後有頌亦可讀第不見太守姓名爾然不著他事惟修廟祀神爾桐柏淮瀆廟也治平元年六月十三日書右真蹟後漢殽阬君神祠碑光和四年右漢殽阬君神祠碑在鄭縣慶曆中樞宻直學士施君爲陜西都轉運使爲余模此本云碑文已磨滅初不可辨以麫填其刻稍尋其􅀧畫命工鐫治之乃可讀漢碑今在者􅀋多磨滅不完故斯碑歷歷可見也惟裴曄姓名爲郷人鑱去矣殽阬所以畜􅂥水患據碑文云自亡新以来廢之則前漢時已有之矣光和中曄爲鄭縣令始修復之事見水經及華州圖經殽吭君祠今謂之五部神廟其像有石隄西戍􅀣谷五樓先生東臺御史王翦將軍皆莫曉其義施君名昌言今爲涇原路安撫使右集本集古録跋尾卷第一古敦銘録目元第九百四十一敦乃武王下二字一作文武韓城鼎銘元第七百六十一亦自一作甞商雒鼎銘元附九百四十一古器銘元第三百七十一存而一無而字同前元第五百九十一般子款識法帖無子字斯年款識法帖無斯字八月款識法帖此下有初吉字暨集録一作古終南古敦銘元第二百四十一初莫知爲敦也一無此六字煮簋銘元第四十一煮款識法帖作旅此盖銘此腹銘右一器其銘云叔髙父作煮簋其萬年子子孫孫永寳用其容四升外方内圜而小堶之望之畧似􅀛有首有尾有足有腹有甲也今禮家作簋内正圜外正方刻盖正爲􅀛形猶有近也不全與古同耳此銘劉原甫在永興得古銅簋模其銘以見􅀉其後原甫所書也禮家作簋傳其說不知其形制故名存實亡此器可以正其繆也甲辰正月十二日襄周穆王刻石元附七百六十一天子登上二字一作王此山一作北山癸巳至如此而十三字一作圖經云癸巳誌其日也鑿山一無山字敦銘元附八百九十一一作􅒳款識法帖作匜史記此下一有本紀二字治平元年正月二日書一有此九字敦医銘元無卷第張仲器銘元第八百九十一古人一作古之人嘉祐八年十二月二十八日書一有此十二字石鼔文元第二百一右石鼔文此下一有在字千有一無有字獨無石鼔此下一有文字猶有一作獨有秦度量銘元第六百六十一秦昭龢鍾元第三百四十一秦祀巫咸神文元第四百一熊適一作商又别本秦祀巫咸神文祀朝那文附右秦祀巫咸神文今流俗謂之詛楚文者一無此字以其言楚王熊相之罪也史記世家楚自成王以後王名一無此二字有熊疑熊良夫熊商熊槐熊元而無熊相詛一作據文言穆公與成王盟好而後云一無此二字倍十八世之詛盟則秦一無此二字自穆公十八世爲惠文王也又按秦本紀與楚世家自楚平王娶婦於秦其後累世不以兵交至宣王熊良夫時秦始侵楚及惠文王時與楚懷王熊槐屢相攻伐則秦所詛者是懷王也但史記以爲熊槐者失之爾槐相二字相近盖轉冩之誤當從詛文石刻以相爲正又有祀朝那湫文其文一無此二字與此同今附于後熈寧三年四月二十三日書秦􅂐遺文元第三百六十一嗣馬石刻作爲臣斯石刻作徳此遺一有文字或云一作曰治平元年六月二十日書一有此十字㤗山刻石元第一百三十一賢聖一作聖賢秦始一無秦字此詔一作詔書余友一有人字嘉祐八年五月十日書一無此九字嶧山刻石元第九百五十一而附一無而字漢二器銘元第八百一十一兹乆一作滋乆得於一作得之於銅甬銘鴈足鐙銘元附八百一十一華山廟碑元第八百四十一如此此下一有其記漢祠四岳事見本末十字華嶽碑元第七百二十一享古碑作亨班古碑作斑同前元第三百一復民賦碑元第二百一十一西一作華嶽廟此下一有請字荀班古碑作斑就之此下一有後仍雨甘雪五字口一有筭字治平元年六月十四日書一有此十字北嶽碑元第七百三十一考矣一作也治平元年五月十日書一有此九字無極山神廟碑元第四百九十一愚臣古碑作㠯請少府一作請以少府桐柏廟碑元第一百九十又云一無此二字災害一作異殽阬神祠碑元第二百九十一在一作今在或作在今斯碑二字上一有獨字復之此下一有時字治平元年二月一日書一有此九字
