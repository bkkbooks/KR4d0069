body:
  text: 䇿問問進士策題五道問古之人作詩亦因時之得失鬰其情於中而發之於詠歌而巳一人之爲詠歌歡樂悲瘁宜若所繫者未爲重矣然子夏序詩以謂動天地感􅀑神莫近於詩者詩之言果足以動天地感􅀑神乎問古之爲聖人者莫如舜賢而與聖人近者莫如顔回仲尼稱虞舜不可及而顔氏其殆庶㡬至其稱舜之所爲則曰好問而好察邇言而已稱顔氏之好學則曰不遷怒不貳過而巳然則如是者是爲不可及與庶㡬乎問漢宣中興丙魏爲相後之人言爲相之賢者必稽焉宜其有興􅀣之業顯於世也及觀其紀傳亦無他功徳相獨有明堂月令一章吉之事大槩而巳不識丙魏之所以得賢於後世者可得見乎問子丑寅三代之正也孔子何獨行夏之時􅀃者曰夏時質也忠質文三代之政也孔子何獨曰從周之文使夏之時爲正則商周之時不正乎周之政尚文則夏商之政無文乎夫周以子則今之冬十一月乃春正也商以丑則今之冬十二月乃春正也夫以冬十有一月十有二月頒春正於天下而教民之事無乃與天時相戾歟夫君臣之相和父子之相愛兄弟夫婦之相爲悌順是文之本也仁以守之義以制之禮樂以和節之是文之成也使夏商而無文則夏商之世無君臣父子兄弟夫婦之制歟􅀃者曰三代之正皆同也子丑寅出於後儒之妄也忠質文亦出於後儒之妄也使夫誠出於後儒之妄則孔子安有行時從文之􅀃問周天子之田方千里號稱萬乘萬乘之馬皆具又有十二閑之馬而六卿三百六十官必皆各有車馬車馬豈不多乎哉千里之地爲田㡬何其牧養之地又㡬何而能容馬若是之多乎哉千里之地爲田㡬何馬之法又如何今天下廣矣常患無馬豈古之善養馬而今不善乎宜有􅀃以對也謚議贈太尉夏守贇謚議議曰謹按謚法世篤勤勞曰忠小心恭慎曰僖今考公之行狀言其父以軍校殁戰陣遂獲賞延子以君命死道塗得謚莊一作壯恪公自束髮已能孝謹遭遇先帝給事左右材敏自力愈久益勤至於典掌師旅宿衛王宫出領節旄入登樞輔安享榮竉六十餘年方真宗時繼遷叛命用兵朔方契丹未和再駕河北多事之際其勤最著或奔走自效不暇過於私家親暱雖至未嘗敢請恩澤歷小大之職無纎毫之過先朝用此尤加􅅄擢昨者西師始出父子迭行北顧之憂選任居首迫於奄忽厥用未彰較其始終其迹可見所謂勤勞著於奕世恭慎見於小心考之不誣宜以節惠謹合二灋謚曰忠僖謹議齋文順祖惠元睿明皇帝忌辰齋文伏以積仁累德王業始於艱難追逺奉先孝治刑於遐邇式臨諱日祗率舊章順祖惠元睿明皇帝肇啓慶基克光前烈昭聖謨而貽厥隆廟德而可觀今皇帝嗣繼大明克昌盛業屬諱辰而增感因佛事以薦嚴順祖皇帝伏願如在之威亘百年而可畏無疆之祚佑億世以垂休今皇帝伏願聖夀延鴻丕圖永固然後願鈞衡舊徳宗室羣英下洎臣民咸均福祐祭文祭沙山太守祈晴文脩謹告祭于沙山太守之神脩扶護母喪歸祔先域大事有日隂雲屢興脩不孝罪逆賴天地􅀑神哀憐行四千里之江得無風波之恐今即事矣幸神寛之假三日之不雨則始終之賜報徳何窮尚饗祭五龍祈雨文一作祭五龍神伏以去秋之潦豐不􅀘凶飢民食糟麥爲命而天久不雨苗將槁焉旱非人力之能移徒知奔走雨者龍神之所作其忍不爲薄奠拙辭􅃱誠而巳尚饗祈晴文吏之所以食民之賦而神之所以享民之祭祀者吏以刑政庇民而神能以禍福加之也􅁈枉之無訴刑罰之不明此人力能爲而吏不舉之其過宜在吏水旱而不時饑饉而疾疫此人力所不能及而皆職神之由今自冬渉春雨雪不止居人無食市肆不開人皆食糟以延旦夕之命至於無食有自殺者此縣吏不能治民以􅆀神禍之過此冝罰縣令之身使爲病恙災殃以塞其責不冝使數千户人皆受其災雨雪雖乆及今而止民猶有望焉惟神閔之祭東嶽文某比者􅀗解郡章許還里閈方巾車而即路屬暑雨之時行輒以愚誠仰干大造蒙神之惠賜以不違吹清飈而散隂暴秋陽以涸轍遂無道路之阻得返草茅之居荷德之深不知爲報一觴之㓗謹用薦衷尚饗祭金城夫人文脩謹遣表弟鄭興宗以清酌庶羞之奠􅆀祭于金城夫人之靈脩遭罹酷罰方在哀疚護喪歸􅁙千里之外忽承凶訃情禮莫伸聊陳薄奠􅆀誠而巳尚饗祭王深甫文嗟吾深甫孝悌行於郷黨信義施於友朋貧與賤不爲之恥富與貴不爲之榮雖得於内者無待於外物而不可掩者蓋由其至誠故方身窮於陋巷而名巳重於朝廷若夫利害不動其心富貴不更其守處於衆而不隨臨於得而不苟惟吾知子於初世徒信子於久念昔居潁我壯而子方少年今我老矣來歸而送子于泉古人所居必有是􅀖之友況如子者豈止一􅀖之賢舉觴永訣夫復何言外集卷第二十居士集卷第二十歐陽文忠公集二十碑銘金部郎中贈兵部侍郎閻公神道碑銘并序惟閻氏世家于鄆其先曰太原王寳以武顯於梁晉之間實佐莊宗戰河上取常山功書史官爵有王土鄆之諸閻皆王後也周廣順二年以鄆州之鉅野鄆城爲濟州閻氏今爲濟州鉅野人也公生漢晉之間遭世多虞雖出將家而不喜戰鬭獨好學通三禮頗習子史爲文辭是時鉅野大賊有衆千餘人以公郷里儒者掠致賊中問以謀略公毅然未甞有所言而爲人狀皃竒偉舉止嚴重有威儀賊皆憚之莫敢害賊平公還郷里以三禮教授弟子大宋受命天下將平公乃岀以三禮舉中建隆某年某科歷漢州之金堂虢州之湖城二縣尉遷濮州濮陽令皆有吏績太宗皇帝遣使者行視天下使者還言公可用召見奏事語音鬯然殿中皆聳動太宗竒之拜太子洗馬知岳州一有遷殿中丞知均州一作鄆州呉越忠懿王再朝京師籍其所有浙東西之地納之有司天子以爲新附之􅀖乃以禁兵千人屬公安撫其人遂知蘇州一有又知婺州五代之際江海之間分爲五大者竊名號其次擅征伐故皆峻刑法急聚歛以制命於其民越雖名爲臣屬之􅀖然閡於江淮與中國隔不相及者乆矣公以齊魯之人悉能知越風俗而揉以善政或摩以漸或革以冝推凡上之所欲施寛凡民之所不堪恩涵澤濡民以蘇息政成召還以國子博士知濟州又知晉州入拜尚書水部員外郎廣平郡王府翊善賜緋衣銀魚居六年廣平封陳王出閤公以司門員外郎求知黃州陳王徙封許乃詔公還遷庫部員外郎賜金紫侍講許王府王薨公出知州居歳餘以淮陽近鉅野乃求知淮陽軍公雖居許王府而眞宗素知其賢數詔訪以經術謂之閻君子眞宗即位問公何在左右具言所以然即時召之巳在道拜金部郎中知靑州其後鄆州守臣某臨遣對殿上眞宗問鄆去靑遠近守臣對􅀂干眞宗曰爲吾告之將召也已而見召行至鉅野遇疾使者臨問慰賜滿百日賜告下濟州伺疾少間趨一作趣就道巳而疾病一作亟一作革以某年某月某日薨于濟州享年七十有七贈兵部侍郎葬于鉅野大一有關字徐村公諱􅁚字某曽祖諱某某官祖諱某某官考一作父諱某某官公娶孫氏封冨春縣君用子貴追封泗水縣太君子男三人長曰某某官次曰某某官次曰某某官女三人皆適士族孫五人一早亡次皆巳仕曽孫十人仕者五人嗚呼士患不逢時時逢矣患人主之不知知矣而不及用者命也惟公履道純正生於多艱而卒遇太平以奮其身又遭人主之知甞用矣而不暇於大用以殁殁而無章焉則其遂不見於後丗乎景祐五年冬其子光禄君自光化罷還郷閭乃謀刻其先德於墓之碑而以其辭屬脩詞曰閻世將家大纛髙牙有封太原王功桓桓公不勇力而勇於學奮身逢時卒有成業不大其榮繼丗而卿挻一作挺其後丗多有孫曽有墓于里有碑其隧郷人無傷郷之君子太子太師致仕贈司空兼侍中文惠陳公神道碑銘并序潁川公旣葬于新鄭其子尚書主客郎中述古等七人具公之行事及太常之狀祁伯之銘以來告曰唯陳氏丗有顯人我先正文惠公歷事太宗眞宗而相今天子其出處始終之大節可考不誣如此故敢請以墓隧之碑予爲考其丗次得其所以基于初盛于中有于終而大施于其後者曰信哉陳氏載德晦顯以時其畜厚來遠故能發大而流長自公五丗以上爲博州人皇髙祖翔當五代時爲王建掌書記建欲帝蜀以逆順禍福譬之不聽棄官于閬州之西水遂爲西水人皇曽祖齊國公諱詡皇祖楚國公諱昭汶皇考秦國公諱省華皆開府儀同三司太師尚書令兼中書令自翔巳下三丗不顯于蜀至秦公始事聖朝爲左諫議大夫其配曰燕國太夫人馮氏公其次子也諱堯佐字希元舉進士及第累遷太常丞知開封府録事參軍用理獄有能績遷府推官以言事切直貶通判潮州自潮還獻詩數百篇而大臣亦薦其文學得直史館知壽廬二州提􅀧府界諸縣公事丁秦公憂服除判三司都勾院兩浙轉運使徙京西河東河北三路糾察在京刑獄天禧三年編次御試進士坐誤差其第貶監鄂州茶􅂣未至丁燕國太夫人憂明年河決滑州天子念非公不可塞乃起公知滑州乾興元年作永定陵徙公京西轉運使以辦其事入爲三司戸部副使徙副度支拜知制誥兼史館修撰同知天聖二年貢舉知通進銀臺司遷龍圖閣直學士知河南府徙并州知審官院開封府拜翰林學士兼龍圖閣學士七年拜樞宻副使其年八月叅知政事居三歲間凡三請罷明道二年罷知永興軍行過鄭州爲狂人所誣御史中丞范諷辨公無罪徙知廬州又徙同州復徙永興又徙鄭州累官至戸部侍郎景祐四年四月召拜同中書門下平章事公爲人剛毅篤實好古博學居官無大小所至必聞一有其仁足以庇民智足以利物忠足以事上誠足以信于人潮州惡谿鱷魚食人不可近公命捕得鳴鼔于市以文告而戮之鱷一作其患屏息潮人歎曰昔韓公諭鱷而聽今公戮鱷而懼所爲雖異其能使異物醜􅀋革化而利人一也吾潮間三百年而得二公幸矣在潮修孔子廟韓公祠率其州民之秀者就于學知壽州遭歲大饑公自出米爲糜以食餓者吏民以公故皆爭出米其活數萬人公曰吾豈以是爲私惠邪蓋以令率人不􅀂身先而使其從之樂也錢塘江堤以竹籠石而潮嚙之不數歲輒壞而復理公歎曰堤以捍患而反病民乃議易以薪土而害公政者言于朝以爲非便是時丁晉公叅知政事主言者以黜公公爭不已乃徙公京西而籠石爲堤數歲功不就民力大困卒用公議堤乃成河東地寒而民貧奏除石炭稅減官冶鐵課歲數十萬以便民曰轉運征利之官也利有本末下有餘則上足吾豈爲俗吏哉太行山當河東河北兩路之界公以謂晉自前丗爲險國常先叛而後服者恃此也其在河東鑿澤州路後徙河北鑿懷州路而太行之險通行者德公以爲利公曰吾豈爲今日利哉河決壞滑州水力悍甚毎埽下湍激并人以没不見蹤跡者不可勝數公躬自􅁀露晝夜督促剏爲木龍以巨木駢齒浮水上下殺其􅁀堤乃成又爲長堤以護其外滑人得復其居相戒曰不可使後人忘我陳公因號其堤爲陳公堤開封府治京師公以謂治煩之術任威以擊彊盡察以防姦譬於激水而欲其澄也故公爲政一以誠信毎歲正月夜放燈則悉籍惡少年禁錮之一夲有歲以爲常公召少年諭曰尹以惡人待汝汝安得爲善吾以善人待汝汝其爲惡邪因盡縱之凡五夜無一人犯法者太常博士陳詁知祥符縣縣吏惡其明察欲中以事而詁公廉事不可得乃欲以竒動京師自録事巳下空一縣皆逃去京師果諠言詁政苛􅁀是時章獻明肅太后猶聽政怒詁欲加以罪公爲樞宻副使力爭之以謂罪詁則姦人得計而沮能吏詁由是獲免公十典大州六爲轉運副使一無副字一無副使字常以方嚴肅下一作方嚴清肅莅下使人知畏而重犯法至其過失則多保佑之故未甞桉黜一下吏公貶潮州其所言事蓋人臣所難言者其平生奏䟽􅀹多悉焚其藁其他文章有文集三十卷又有野廬編潮陽編愚丘集多慕韓愈爲文與修眞宗實録又修國史故事知制誥者常先試其文辭天子以公文學天下所知不復命試自國朝以來不試而知制誥者惟楊億及公二人而已公居官不妄進取爲太常丞者十三年不遷爲起居郎者七年不遷自議錢塘堤爲丁晉公所絀後晉公益用事專威福故人子弟以公乆于外多勉以進取公曰惟乆然後見吾守如是十五年今天子即位晉公事敗投海外公乃見召用公􅀄作相以唐劉蕡所對䇿進曰天下治亂自朝廷始朝廷賞罰自近始凡蕡之所究言者皆當今之弊此臣所欲言而陛下之所冝行且臣等之職也天子嘉納之公在相位不乆其年冬雷地震星􅁚數變公言王隨位在臣上而病不任事程琳等位皆在下乃引漢故事以災異自責求罷章凡四上明年三月拜淮康軍節度使檢校太傅同中書門下平章事判鄭州康定元年五月以太子太師致仕詔大朝㑹立宰相班遂居于鄭其起居飲食康寜如少者後四年年八十有二以疾卒于家公居家以儉約爲法雖巳貴常使其子弟親執賤事曰孔子固多能鄙事作爲善箴以戒子孫臨卒口占數十言自誌其墓公前娶曰􅂎國夫人宋氏後娶曰沂國夫人王氏子男十人長曰述古次曰比部員外郎求古主客員外郎學古虞部員外郎道古大理評事館閣校勘博古殿中丞脩古秘書省正字履古光禄寺丞游古大理寺丞襲古太常寺太祝􅁚古秦公三子長曰堯叟爲樞宻使同中書門下平章事季曰堯咨爲武信軍節度使皆舉進士第一人一無人字及第一無第字三子已貴秦公尚無恙毎賔客至其家公及伯季侍立左右坐客䠞蹜不安求去秦公笑曰此學一作兒子輩耳故天下皆以秦公教子爲法而以陳氏丗家爲榮公之孫四十人曽孫二人合伯季之後􅀂子􅀂孫􅀂曽孫六十有八人女􅀂孫曽五十有四人而仕于朝者多以材稱於時一無於時嗚呼可謂盛矣銘曰陳氏髙節在汚全潔閟德潛光有俟而發其發惟時自公啓之英英伯季踵武偕來相車崇崇武節之雄髙幢巨轂四丗六公惟丗有封秦楚及齊尚書中書儀同太師祖考在前孫曽盈後公居于中伯季左右惟勤其始以享其終惟能其約以有其豐休庸顯問播美家􅀖有遠其貽有大其繼刻詩垂聲以質來裔資政殿學士戸部侍郎文正范公神道碑銘并序皇祐四年五月甲子資政殿學士尚書户部侍郎汝南文正公薨于徐州以其年十有二月壬申葬于河南尹樊里之萬安山下公諱仲淹字希文五代之際丗家蘇州事呉越太宗皇帝時呉越獻其地公之皇考從錢俶朝京師後爲武寧軍掌書記以卒公生二歲而􅀌母夫人貧無依再適長山朱氏旣長知其丗家感泣去之南都入學舎掃一室晝夜講誦其起居飲食人所不堪而公自刻益苦居五年大通六經之㫖爲文章論􅀃必本於仁義祥符八年舉進士禮部選第一遂中乙科爲廣德軍司理叅軍始歸迎其母以養及公旣貴天子贈公曽祖蘇州粮料判官諱夢齡爲太保祖秘書監諱賛時爲太傅考諱墉爲太師妣謝氏爲呉國夫人公少有大節於冨貴貧賤毀譽歡戚不一動其心而􅁣然有志於天下常自誦曰士當先天下之憂而憂後天下之樂而樂也其事上遇人一以自信不擇利害爲趨捨其所有爲必盡其方曰爲之自我者當如是其成與否有不在我者雖聖賢不能必吾豈苟哉天聖中晏丞相薦公文學以大理寺丞爲秘閣校理以言事忤章獻太后㫖通判河中府一有陳州乆之上記其忠召拜右司諫當太后臨朝聽政時以至日大㑹前殿上將率百官爲壽有司巳具公上䟽言天子無北面且開後丗弱人主以彊母后之漸其事遂巳又上書請還政天子不報及太后崩言事者希㫖多求太后時事欲深治之公獨以謂太后受託先帝保佑聖躬始終十年未見過失冝掩其小故以全大德初太后有遺命立楊太妃代爲太后公諫曰太后母號也自古無代立者由是罷其冊命是歲大旱蝗奉使安撫東南使還㑹郭皇后廢率諫官御史伏閤爭不能得貶知睦州又徙蘇州歲餘即拜禮部員外郎天章閣待制召還益論時政闕失而大臣權倖多忌惡之居數月以公知開封府開封素號難治公治有聲事日益簡暇則益取古今治亂安危爲上開􅀃又爲百官圗以獻曰任人各以其材而百職修堯舜之治不過此也因指其遷進遲速次序曰如此而可以爲公可以爲私亦不可以不察由是吕丞相怒至交論上前公求對辨語切坐落職知饒州明年吕公亦罷公徙潤州又徙越州而趙元昊反河西上復召相吕公乃以公爲陜西經略安撫副使遷龍圗閣直學士是時新失大將延州危公請自守鄜延扞賊乃知延州元昊遣人遺書以求和公以謂無事請和難信且書有僭號不可以聞乃自爲書告以逆順成敗之􅀃甚辯坐擅復書奪一官知耀州未逾月徙知慶州旣而四路置帥以公爲環慶路經略安撫招討使兵馬都部署累遷諫議大夫樞宻直學士公爲將務持重不急近功小利於延州築靑澗城墾營田復承平永平廢寨熟羌歸業者數萬戸於慶州城大順以據要害一本有奪賊地而耕之六字又城細􅆎胡蘆於是明珠滅臧等大族皆去賊爲中國用自邊制乆隳至兵與將常不相識公始分延州兵爲六將訓練齊整諸路皆用以爲法公之所在賊不敢犯人或疑公見敵應變爲如何至其城大順也一旦引兵出諸將不知所向軍至柔遠始號令告其地處使徃築城至於版築之用大小畢具而軍中􅀄不知賊以􅀐三萬來爭公戒諸將戰而賊走追勿過河巳而賊果走追者不渡而河外果有伏賊一有旣字失計乃引去於是諸將皆服公爲不可及公待將吏必使畏法而愛己所得賜賚皆以上意分賜諸將使自爲謝諸蕃質子縱其出入無一人逃者蕃酋來見召之卧内屏人徹衛與語不疑公居三歲士勇邊實恩信大洽乃决䇿謀取橫山復靈武而元昊數遣使稱臣請和上亦召公歸矣初西人籍爲郷兵者十數萬旣而黥以爲軍惟公所部但刺其手公去兵罷獨得復爲民其於兩路旣得熟羌爲用使以守邊因徙屯兵就食内地而紓西人饋輓之勞其所設施去而人德之與守其法不敢變者至今􅀹多自公坐吕公貶羣士大夫各持二公曲直吕公患之凡直公者皆指爲黨或坐竄逐及吕公復相公亦再起被用於是二公驩然相約勠力平賊天下之士皆以此多二公然朋黨之論遂起而不能止上旣賢公可大用故卒置羣議而用之慶曆三年春召爲樞宻副使五讓不許乃就道旣至數月以爲叅知政事毎進見必以太平責之公歎曰上之用我者至矣然事有先後而革弊於乆安非朝夕可也旣而上再賜手詔趣使條天下事又開天章閣召見賜坐授以紙筆使䟽于前公惶恐避席始退而條列時所冝先者十數事上之其詔天下興學取士先德行不專文辭革磨勘例遷以别能否減任子之數而除濫官用農桑考課守宰等事方施行而磨勘任子之法僥倖之人皆不便因相與騰口而嫉公者亦幸外有言喜爲之佐佑㑹邊奏有警公即請行乃以公爲河東陜西宣撫使至則上書願復守邊即拜資政殿學士知邠州兼陜西四路安撫使其知政事􅂊一歲而罷有司悉奏罷公前所施行而復其故言者遂以危事中之頼上察其忠不聽是時夏人巳稱臣公因以疾請鄧州守鄧三歲求知杭州又徙靑州公益病又求知潁州肩舁至徐遂不起享年六十有四方公之病上賜藥存問旣薨輟朝一日以其遺表無所請使就問其家所欲一有爲贈以兵部尚書所以哀䘏之甚厚公爲人外和内剛樂善汎愛喪其母時尚貧終身非賔客食不重肉臨財好施意豁如也及退而視其私妻子僅給衣食其爲政所至民多立祠畫像其行已臨事自山林一作搢紳處士里閭田野之人外至夷狄莫不知其名字而樂道其事者甚衆及其丗次官爵誌于墓譜于家藏于有司者皆不論著著其繫天下國家之大者亦公之志也歟銘曰范於呉越丗實陪臣俶納山川及其士民范始來北中間幾息公􅁬自躬與時偕逢事有罪功言有違從豈公必能天子用公其艱其勞一其初終夏童跳邊乗吏怠一作殆安帝命公徃問彼驕頑有不聽順鋤其穴根公居三年怯勇隳完兒憐獸擾卒俾來臣夏人在廷其事方議帝趣公來以就予治公拜稽首茲惟難一作艱哉初匪其難在其終之羣言營營卒壞于成匪惡其成惟公是傾不傾不危天子之明存有顯榮殁有贈謚藏其子孫寵及後丗惟百有位可勸無怠居士集卷第二十熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正范文正公神道碑自公坐吕公貶羣士大夫各持二公曲直吕公患之凡直公者皆指爲黨或坐竄逐及吕公復相公亦再起被用於是二公驩然相約勠力平賊天下之士皆以此多二公然朋黨之論遂起而不能止按司馬文正公記聞景祐中吕許公執政范文正公知開封屢改吕短坐落職知饒州康定元年復舊職知永興㑹許公復相言於仁宗曰仲淹賢者朝廷將用之豈可但除舊職即除龍圖閣直學士陜西經略安撫副使上以許公爲長者天下亦以許公不念舊惡又蘇文定公龍川志范文正自饒州還朝出領西事恐申公不爲之地無以成功乃爲書自咎解仇而去故歐陽公作文正碑有二公晚年歡然相得之語後生不知皆咎歐陽公予見張公安道言之乃信又邵氏聞見録當時文正子堯夫不以爲然從歐陽公辯不可得則自削去驩然勠力等語公不樂謂蘇明􅁢曰范公碑爲其子弟擅於石本改動文字令人恨之故今羅氏本於坐落職知饒州下無明年吕公亦罷六字爲陜西經略安撫副使上無上復召相吕公六字又無自公坐吕公貶已下至故卒置羣議而用之一段以此觀之諸家本乃當時定本也羅氏本堯夫改本也今從衆而載堯夫所改如此陳無巳談叢叙二公曲折未必盡然吕公薨范公雖有祭文蓋交際常禮今載集中詞意亦平平無已謂歸重而自訟過矣陳文惠公碑棄官此下一有家字嚙當作齧范文正公碑來臣來一作徠
