body:
  text: 序七首章望之字序校書郎章君一作望之甞一無此字以其名望之一無二字來請字曰願有所教使得以勉焉而自勗者予爲之字曰表民而告之曰古之君子所以異乎衆人者言出而爲民信事行而爲世法其動作容貌皆可以表於民一作皆有以爲民表也故紘綖一作纓旒冕弁以爲首容佩玉玦環以爲行容衣裳黼黻一作設色以爲身容手有手容足有足容揖讓登降獻酬俯仰莫不有容又見其寛柔温厚剛嚴果毅之色以爲仁義之容服其服載其車立乎朝廷而正君臣出入宗廟而臨大事儼然人皆望而畏之曰此吾民之所尊也非民之知尊君子而君子者能自修而尊者也然而行不充于内德不備於人雖盛其服文其容民不尊也一作民弗尊也巳名山大川一方之望也山川之岳瀆一有則字天下之望也故君子之賢於一郷者一郷之望也賢於一國者一國之望也名烈著于天下者天下之望也功德被于後世者萬世之望也孝慈友悌達于一郷一作於州閭古所謂郷先生者一郷之望也春秋之賢大夫􅀂隨之季良鄭之子産者一作春秋諸侯之大夫􅀂鄭之子産吴之季札之􅀋一國之望也位于二字一作居中而姦臣賊子不敢竊一作輒發于外如漢之大將軍出入將相朝廷以爲輕重天下繫其一作以爲安危如唐之裴丞相一有􅀂此二字者天下之望也其人巳没一作死其事巳乆一作矣聞其名想其人􅀂不可及者夔龍稷契是也其功可以及百一作􅀍萬世其道可以師百王雖有賢一作後聖莫敢過之一作自謂莫及者周孔是也此萬世之望而皆所以爲民之表也傳曰其在一作在其賢者識其大者逺三字一作逺大者一有􅀂此數者皆可自擇而勉焉者也今十四字章君儒其衣冠氣剛色仁好學而有志三字一作志於古視其絜然修乎其外而煇然充乎其内以發乎一作爲文辭則又辯博放一作宏肆而無涯一作不流是數者皆可以自擇而勉焉者也一無此十三字是固一無此字能識夫一作其逺大者矣雖予何何字一作信可以勗焉苐一作敢因其志廣其􅀃一作彊爲之言以塞請慶曆三年六月日序釋祕演詩集序予少以進士遊京師因得盡交當世之賢豪然猶以謂國家臣一四海休兵革養息天下以無事者四十年而智謀雄偉非常之士無所用其能者徃徃伏而不出山林屠販必有老死而世莫見者欲從而求之不可得其後得吾亡友石曼卿曼卿爲人廓然有大志時人不能用其材曼卿亦不屈以求合無所放其意則徃徃從布衣野老酣嬉淋漓顚倒而不猒予疑所謂伏而不見者庶幾狎而得之故甞喜從曼卿遊欲因以隂求天下竒士浮屠二字一作僧祕演者與曼卿交最乆亦能遺外世俗以氣節相髙二人懽然無所間曼卿隱於酒祕演隱於浮屠皆竒男子也然喜爲歌詩以自娯當其極飲大醉一作臨水望月歌吟􅀏呼以適天下之樂何其壯也一時賢士皆願從其一作之游予亦時至其室十年之間祕演北渡河東之濟鄆無所合困而歸曼卿巳死祕演亦老病嗟一作若夫二人者予乃見其盛衰則余亦將老矣夫曼卿詩辭清絶􅀹稱祕演之作以爲雅健有詩人之意祕演狀貌雄傑其胷中浩然旣習于佛無所用獨其詩可行于世而􅂴不自惜已老胠其橐尚得三四百篇皆可喜者曼卿死祕演漠然無所向聞東南多山水其巓崖崛峍江濤洶涌甚可壯也遂欲徃遊焉足以知其老而志在也於其將行爲叙其詩因道其盛時以悲其衰慶曆二年十二月二十八日廬陵歐陽脩序釋惟儼文集序惟儼姓魏氏杭州人少遊京師三一作二十餘年雖學于佛而通儒術喜爲辭章與吾亡友曼卿交最善曼卿遇人無所擇必皆盡其忻歡惟儼非賢士不交有不可其意無貴賤一切閉拒絶去不少顧曼卿之兼愛惟儼之介所趣雖異而交合無所間曼卿甞曰君子泛愛而親仁惟儼曰不然吾所以不交妄人故能得一作得待天下士􅀂賢不肖混則賢者安肯顧我哉以此一時賢士多從其遊居相國浮圖不出其户十五年士甞遊其室者禮之惟恐不至及去爲公卿貴人未始一徃干之然甞竊怪平生所交皆當世賢傑未見一作有卓卓著一作見功業如古人可記者因謂世所稱賢材􅀂不笞兵走萬里立功海外則當佐天子號令賞罰於明堂苟皆不用則絶寵辱遺世俗自髙而不屈尚安能酣豢於冨貴而無爲哉醉則一作甞或以此誚其坐人人亦復之以謂遺世自守古人之所易􅀂奮身逢時欲必就功業此雖聖賢難之周孔所以窮逹異也今子老於浮圖不見用於世而幸不踐窮亨之塗乃以古事之已然而責今人之必然邪雖然惟儼四字一作儼雖傲乎退偃於一室天下之務當世之利病聽其言終日不猒惜其將老也已曼卿死惟儼亦買地京城之東以謀其終乃斂平生所爲文數百篇示予曰曼卿之死旣已表其墓願爲我序其文然及我之見也嗟夫惟儼旣不用於世其材莫見一作顯於時􅀂考其筆墨馳騁文章贍逸之能可以見其志矣廬陵歐陽永叔序詩譜􅀘亡後序歐陽子曰昔者聖人已没六經之道㡬熄於戰國而焚弃於秦自漢已來收拾亡逸發明遺義而正其訛繆得以粗備傳于一作於今者豈一有止字一人之力哉後之學者因迹前世之所傳而較其得失或有之矣􅀂使徒抱焚餘殘脫之經倀倀於去聖千百年後不見先儒中間之􅀃而欲特立一家之學者果有能哉吾未之信也然則先儒之論苟非詳其終始而抵捂質於聖人而悖理害經之甚有不得巳而後改易者何必徒爲異論以相訾也毛鄭於詩其學亦巳博矣予甞依其箋傳考之於經而證以序譜惜其不合者頗多蓋詩述商周自生民玄鳥上陳稷契下迄一作訖陳靈公千五六百歳之間旁及列國君臣世次國地山川封域圖牒鳥獸草木魚蟲之名與其風俗善惡方言訓故一作詁盛衰治亂美刺之由無所不載然則孰能無失於其間哉予疑毛鄭之失旣多然不敢輕爲改易者意其爲􅀃不止於箋傳而恨己一作巳恨不得盡見二家之書未能徧通其旨夫不盡見其書而欲折其是非猶不盡人之辭一作辯而欲斷其訟之曲直其能果於自決乎其能使之必服乎世言鄭氏詩譜最詳求之乆矣不可得雖崇文緫目祕書所藏亦無之慶曆四年奉使河東至于絳州偶得焉其文有注而不見名氏然首尾殘缺自周公致太平巳上皆亡之其國譜旁行􅀹易爲訛舛悉皆顚倒錯亂不可復考凡詩雅頌兼列商魯其正變之風十有四國而其次比莫詳其義惟封國變風之先後不可以不知周召王􅃎同出於周邶鄘并於衛檜魏無世家其可考者陳齊衛􅀳曹鄭秦此封國之先後也􅃎齊衛檜陳唐秦鄭魏曹此變風之先後也周南召南邶􅅠衛王鄭齊􅃎秦魏唐陳曹此孔子未刪詩之前周太師樂歌之次第也周召邶鄘衛王檜鄭齊魏唐秦陳曹􅃎此鄭氏詩譜次第也黜檜後陳此今詩次比也初予未見鄭譜甞略考春秋史記本紀世家年表而合以毛鄭之􅀃爲詩圖十四篇今因取以􅀘鄭譜之亡者足以見二家所􅀃世次先後甚備因據而求其得失較然矣而仍存其圖庶㡬以見予於鄭氏之學盡心焉耳夫盡其􅀃而有所不通然後得以論正予豈好爲異論者㢤凡補其譜十有五補其文字二百七一本注云譜序自周公致太平巳上皆亡其文予取孔頴逹正義所載之文􅀘足因爲之注自周公已下即用舊注云増損塗乙改正者三一作八百八十三而鄭氏之譜復完一有矣字集古録目序物常聚於所好而常得於有力之彊有力而不好好之而無力雖近且易有不能致之象犀虎豹蠻夷山海殺人之獸然其齒角皮革可聚而有也玉出崑崙流沙萬里之外經十餘譯乃至乎中國珠出南海常生深淵採者􅆎絙而入水形色非人徃徃不出則下飽蛟魚金礦于山鑿深而穴逺篝火餱粮而後進其崖崩窟塞則遂葬於其中者率常數十百人其逺且難而又多死禍常如此然而金玉珠璣世常兼聚而有也凡物好之而有力則無不至也湯盤孔鼎􅄮陽之鼓岱山鄒嶧㑹稽之刻石與夫漢魏巳來聖君賢士桓碑彛器銘詩序記下至古文籀􅂐分􅀠諸家之字書皆三代以來至寳怪竒偉麗工妙可喜之物其去人不逺其取之無禍然而風霜兵火湮淪磨滅散弃於山崖墟莽之間未甞收拾者由世之好者少也幸而有好之者又其力或不足故僅得其一二而不能使其聚也夫力莫如好好莫如一予性顓而嗜古凡世人之所貪者皆無欲於其間故得一其所好於斯好之巳篤則力雖未足猶能致之故上自周穆王以來下更秦漢隋唐五代外至四海九州名山大澤窮崖絶谷荒林破塚神仙􅀑物詭怪所傳莫不皆有以爲集古録以謂轉一作傳寫失眞故因其石本軸而藏之有卷帙次第而無時世之先後蓋其取多而未巳故隨其所得而録之又以謂聚多而終必散乃撮其大要别爲録目因并載夫可與史傳正其闕謬者以傳後學庶益於多聞或譏予曰物多則其􅀔難聚聚乆而無不散何必區區於是哉予對曰足吾所好玩而老焉可也象犀金玉之聚其能果不散乎予固未能以此而易彼也廬陵歐陽脩序蘇氏文集序予友蘇子美之亡後四年始得其平生文章遺藁於太子太傅杜公之家而集録之以爲十卷子美杜氏壻也遂以其集歸之而告于公曰斯文金玉也弃擲埋没糞土不能銷蝕其見遺于一時必有收而寳之于後世者雖其埋没而未出其精氣光怪巳能常自發見而物亦不能揜也故方其擯斥摧挫流離窮一本作困厄之時文章巳自行于一作於天下雖其怨家仇人及甞能出力而擠之死者至其文章則不能少毀而揜蔽一無此字之也凡人之情忽近而貴逺子美屈于今世猶􅀂此其伸於後世冝如何也公其可無恨予甞考前世文章政理之盛衰而怪唐太宗致治㡬乎三王之盛而文章不能革五代之餘習後百有餘年韓李之徒出然後元和之文始復于古唐衰兵亂又百餘年而聖宋興天下一定晏然無事又幾百年而古文始盛于今自古治時少而亂時多幸時治矣文章或不能純粹或遲乆而不相及何其難之􅀂是歟豈非難得其人歟苟一有其人又幸而及出于治世世其可不爲之貴重而愛惜之歟嗟吾子美以一酒食之過至廢爲民而流落以死此其可以歎息流涕而爲當世仁人君子之一無此字職位冝與國家樂育賢材者惜也子美之齒少於予而予學古文反在其後天聖之間予舉進士于有司見時學者務以言語聲偶擿裂號爲時文以相誇尚而子美獨與其兄才翁及穆叅軍伯長作爲古謌詩雜文時人頗共非􅀏之而一無此字子美不顧也其後天子患時文之弊下詔書諷勉學者以近古由是其風漸息而學者稍趨於古焉獨子美爲於舉世不爲之時其始終自守不牽世俗趨舎可謂特立之士也子美官至大理評事集賢校理而廢後爲湖州長史以卒享年四十有一其狀貌竒偉望之昻然而即之温温乆而愈可愛慕其材雖髙而人亦不甚嫉忌其擊而去之者意不在子美也頼天子聦明仁聖四字一作聖明凡當時所指名而排斥二三大臣而下欲以子美爲根而累之者皆􅀩保全今並列於榮寵雖與子美同時飲酒得罪之人多一時之豪俊亦被收采進顯于朝廷而子美獨不幸死矣豈非其命也悲夫廬陵歐陽脩序鄭荀改名序三代之衰學廢而道不明然後諸子出自老子猒周之亂用其小見以爲聖人之術止於此始非仁義而詆聖智諸子因之益得肆其異􅀃至於戰國蕩而不反然後山淵齊秦堅白異同之論興聖人之學㡬寽其息最後荀卿子獨用詩書之言貶異扶正著書以非諸子􅀹以勸學爲急荀卿楚人甞以學干諸侯不用退老蘭陵楚人尊之及戰國平三代詩書未盡出漢諸大儒賈生司馬遷之徒莫不盡用荀卿子蓋其爲􅀃最近於聖人而然也滎陽鄭昊少爲詩賦舉進士巳中第遂弃之曰此不足學也始從先生長者學問􅁣然有好古不及之意鄭君年尚少而性淳明輔一有之字以彊力之志得其是者而師焉無不至也將更其名數以請予使之自擇遂改曰荀於是又見其志之果也夫荀卿者未甞親見聖人徒讀其書而得之然自子思孟子已下意皆輕之使其與游夏並進於孔子之門吾不知其先後也世之學者苟如荀卿可謂學矣而又進焉則孰能禦哉余旣嘉君善自擇而慕焉因爲之字曰叔希且以勗其成焉居士集卷第四十一熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益挍正章望之字序著于一作著乎將相此下一有而字之表此下一有者字章君儒其衣冠章君之下一有之耒也三字祕演詩集序祕演隱於浮屠一無祕字下同江濤一作濤江惟儼文集序其戸一無其字世俗一作世事文章一作文辭詩譜補亡後序焚棄一無棄字去聖此下一有人字次比一作次第蘇氏文集序治矣此下一有其字冝與一作冝爲而人一作而世
