body:
  text: 墓誌七首碣一首附南陽縣君謝氏墓誌銘慶暦四年秋予友宛陵梅聖俞來自呉興出其􅂘内之詩而悲曰吾妻謝氏亡矣丐我以銘而葬焉予一有諾之二字未暇作居一􅀊中書七八至未嘗不以謝氏銘爲言且曰吾妻故太子賔客諱濤之女希深之妹也希深父子爲時聞人而世顯榮謝氏生於盛族年二十以歸吾凡十七一作八年而卒卒之夕歛以嫁時之衣甚矣吾貧可知也然謝氏怡然處之一作處之怡然治其家有常法其飲食噐皿雖不及一作至豐侈而必精以㫖其衣無故新而澣濯縫紉必㓗以完所至官舍雖􅋻陋而庭宇灑掃必肅以嚴其平居語言容止必怡怡一作從容以和吾窮於世乆矣一有不惟信於聖人以自守九字其出而幸與賢士大夫遊而樂入則見吾妻之怡怡而忘其憂使吾不以冨貴貧賤累其心者抑吾妻之助也吾嘗與士大夫語謝氏多從戸屏竊聽之間則盡能商搉其人才能賢否及時事之得失皆有條理吾官呉興或自外醉而歸必問曰今日孰與飲而樂乎聞其賢者也則恱否則歎曰君所交皆一時賢儁豈其屈已下之耶惟以道德一作得焉故合者􅀹寡一無此十七字今與是人飲而歡邪是􅀊南方旱仰見飛蝗而歎曰今西兵未解天下重困盗賊􅁀起於江淮而天旱且蝗如此我爲婦人死而得君葬我幸矣其所以能安居貧而不困者其性識明而知道理多此􅀋一作􅀋此嗚呼其生也迫吾之貧而􅃿也又無以厚焉謂惟文字可以著其不朽且其平生􅀹知文章爲可貴殁而得此庻幾以慰其魂且塞予悲此吾所以請銘於子之勤也􅀂此予忍不銘夫人享年三十七用夫恩封南陽縣君二男一女以其年七月七日卒于髙郵梅氏世葬宛陵以貧不能歸也某年某月某日葬于潤州之某縣某原銘曰髙崖一作岸斷谷􅀆京口之原山蒼水深􅀆土厚而堅居之可樂􅀆卜者曰然骨􅁏雖一作歸土􅀆魂氣則一作升天何必故郷􅀆然後爲安萬壽縣君徐氏墓誌銘并序河東都轉運使天章閣待制施君卜以慶暦五年三月某日葬其夫人萬壽縣君于蘇州呉縣三讓郷之陸公原以來請銘夫人姓徐氏世家通州之静海七􅀊喪其母哀不自勝泣曰母女所恃以生者也無母其復能生因欲投水火一無火字其父兄力止之旣長事其繼母則以孝聞年􅀂干歸于施氏逮事其姑紉縫烹飪必以身蚤暮寒暑飲食必以時姑亡哀毀得疾逾年而後能起生五男一女男曰邈舉進士某官知開封府太康縣曰述曰造皆將作監主簿曰逈曰遜尚㓜女曰錦娘慶暦三年十一月甲子以疾卒于河東之官舍享年四十有三夫人之生也事其繼母及姑皆稱曰孝及其殁也其夫之稱曰吾妻􅂇我而賢其子之㓜者曰吾母􅄌我其長者之稱曰吾母不以愛怠一作殆我而以成人朂我使我至於有立凡施氏外内婚姻宗族之稱者曰夫人遇我有禮而仁至于妾媵左右之稱者亦曰夫人於我仁而均嗚呼夫人之行至矣其勤而有法其施之各有冝可謂賢也巳􅀂夫男子見于外其善惡功過可舉而書至於婦德主内自非死節徇難非常之事則其幽間淑女之行孰得顯然列而詩之以示後惟視其所稱與其所思則其賢可知矣施君名昌言一無此三字有以明識敏行守正敢言逹於當世其稱曰􅂇我則夫人之賢又從可知矣二十八字夫人曾祖諱某祖諱某父諱某以尚書都官貟外郎致仕夫生而其善可稱未􅀂没而遺思之深也悲夫銘曰於惟夫人東海之華始來施氏有此室家爲婦爲母勤孝勞劬有女昔褓今婉其􅅂子綬煌煌弟長相趨夫爵之髙榮及親踈厥家巳成而獨不居千里之逺歸魂東呉銘以哀之巳矣嗚呼長沙縣君胡氏墓誌銘并序故太子中舍張君諱某之夫人曰一無此字長沙縣一有太字君一有曰字胡氏胡氏世爲某一作世某郡某縣人父諱震官至刺史夫人年二十七以歸中舍君君時爲融州司理叅軍歴潭州寧郷縣尉鳯州兩當福州寧德二一作兩縣令以卒夫人之爲婦也以勤儉恭肅主張氏之􅀕饋而睦其内外之宗姻生子一無此字男二人女一人男曰大年大有皆舉進士一無此四字大年今爲鄭州原武縣令大有秘書丞女適邵陽縣令錢奕夫人之爲母也以禮義慈嚴教育其子故其一無此字男也有立而克嗣其世女也適於人而冝人之家爲婦爲母之道無不俻而成其夫之家享其子之禄以某年某月某日以疾卒享年七十有五又用其子之恩追封長沙縣一有太字君嗚呼一有夫人二字可謂榮矣中舍君先以一無此二字某年某月日卒葬于某州某縣某郷夫人一無此二字以某年某月某日一有奉夫人之喪合葬于中舍君之墓銘曰婦德之備功施也一作于内銘昭其幽以法後世長壽縣太君李氏墓誌銘太中大夫尚書屯田郎中上柱國王公諱利之夫人曰李氏李氏世家湖南其父諱昭文官至國子博士贈工部侍郎夫人年二十二歸于王氏用夫封隆平縣君後以其子徙封長壽縣太君夫人爲李氏女事後母以孝聞及爲王氏婦一有以事父母者五字逮一無此字事其舅姑其舅姑嘗稱夫人以誡諸婦曰事我者當如此又以誡其諸女曰爲人婦者當如此其爲母也有三男二女及其老也鼎爲職方貟外郎震太子中舎復太常博士三子者皆有才行而復􅀹好古有文聞于當世女皆有歸孫男六人曰夷仲曰虞仲曰于仲曰南仲曰武仲曰延仲女五人一亦歸人矣餘尚㓜夫人享年八十有六以慶暦七年七月十日終于京兆子復之官舎用明年二月十七日合葬于河南洛陽大樊原王公之墓夫人於王氏積行累功其德備矣不可以徧書一作夫人之德可謂備矣書其舅姑之所嘗稱者以見其爲婦之道書其子之賢而有立以見其爲母之方書其子孫之衆壽考之隆以見其勤于其家至于有成而終享其福之厚嗚呼於夫人無不足矣而其子􅀂孫皆曰未也謂必有以示永乆而不没一有者字庻幾以慰無窮之哀乃來請銘以葬其子之友廬陵歐陽脩爲之銘曰家成于勤德隆以壽歸安其藏以昌厥後廣平郡太君張氏墓誌銘并序故右諫議大夫集賢院學士贈禮部尚書􅉑略楊公之夫人曰廣平郡太君張氏其先青州人後徙爲開封人也楊公諱大雅以文行知名於時號有清節夫人佐公以勤儉治其家教子弟和宗族皆有法公以明道元年四月某日薨後二十有四年至和二年六月某日夫人以疾卒于髙郵以嘉祐元年十二月某日葬于杭州錢塘縣履泰郷湖西村靈􅀮山祖塋之西夫人曾祖嗣當五代之亂不顯祖平舉三禮太宗皇帝爲晉王署平押衙爲人剛果有智謀以此􅀹見親信官至三司鹽鐵使父從古莊宅副使景德中以殿直從李繼隆軍擊契丹繼隆戰敗從古入見陳繼隆所以敗之狀其言甚辯稱㫖㑹冝州蠻叛乃以從古爲供奉官守冝州從古招降叛蠻秩滿罷去以内殿崇班馮勵代之蠻復叛攻冝州斬勵而去告邉吏曰得張侯守冝州我則聽命即復遣從古守冝州凡七年蠻無事徙知澧州而冝州人陳進反攻嶺南驛召從古以爲廵撫副使與賊戰象州斬首萬餘級巳破進留冝州以疾卒冝人爲立廟于州北韓婆嶺慶暦中蠻賊區希範攻冝桂轉運使杜杞禱兵于廟下更其名曰制勝嶺至今冝人祠之蓋楊氏自漢以來世有令譽迨公千餘􅀊常有顯人而張氏威烈信于一方楊氏以德張氏以功合二族之美而夫人爲淑女爲賢婦母享年六十以壽終公先娶漳南縣君張氏生子二人曰洎虞部貟外郎曰濬殿中丞女三人長適國子博士􅀽成師次大理寺丞李嚴次殿中丞温嗣良夫人生子男四人曰泳大理寺丞曰漸奉禮郎曰沆太子中舍曰渢衛尉寺丞有女一人歸于脩女之適李氏者今封武原縣太君餘女及濬泳漸皆先夫人而亡孫男十四人嗚呼惟德與功與賢法皆冝銘銘曰有邑清河遂開其􅀖又徙南陽皆以夫榮後用子封京兆廣平冝其夫子有淑其聲子孫之思考德有銘渤海縣太君髙氏墓碣故尚書兵部貟外郎知制誥知鄧州軍州事陽夏公之夫人姓髙氏宣州宣城人也父諱惠連官至兵部郎中母曰廣陵縣君句氏陽夏公諱絳姓謝氏夫人有子曰景􅀄景温景平景回女一早卒次適上虞縣令王存次適大理寺丞李處厚次􅀂干人未嫁寳元二年陽夏公卒于鄧州以其年八月某日葬于某所後􅀂干年夫人隨其子某官于某州以某年某月某日卒于官舎遂以某年某月某日合葬于公之墓夫人􅀄以夫封文安縣君後以其子封渤海縣太君謝氏世爲名族而陽夏公􅀹顯聞於時􅀄公與予俱官于洛陽而公之父太子賔客諱濤尚無恙其子景􅀄景温方爲童兒景平始生二三女子皆㓜予日至其家進拜賔客見其􅁂髮垂白衣冠肅㓗貌厚而氣清壽考君子也退而與陽夏公遊見其年壯志盛偉然方爲一時名臣而諸兒女子戯嬉罇席之間者皆穎發而秀好於是時夫人以孝力事其舅爲賢婦以柔順事其夫爲賢妻以恭儉均一教育其子爲賢毋後二三年賔客薨于京師又五六年陽夏公卒于鄧又十餘年景􅀄景温景平皆以進士及第景􅀄爲某官景温某官景平某官夫人於其舅與夫爲婦之禮備於其子立家之道成享年􅀂干以卒嗚呼予始銘賔客又銘陽夏公今又書夫人之事于碣殆見謝氏更一世矣其爲之書也冝得其詳北海郡君王氏墓誌銘太常丞致仕呉君之夫人曰北海郡君王氏濰州北海人也皇考二字一作父諱汀舉明經不中後爲本州􅂇教夫人年二十三歸于呉氏天聖元年六月二日以疾卒享年三十有七夫人爲人孝順儉勤自其㓜時凡於女事其保傅皆曰教而不勞組紃織絍其諸女皆曰巧莫可及其歸於呉氏也其母曰自吾女適人吾之内事無所􅂇而呉氏之姑曰自吾得此婦吾之内事不失時及其卒也太常君曰舉吾里中有賢女者莫如王氏於是娶其女弟以爲繼室而今夫人戒其家曰凡吾呉氏之内事惟吾女兄之法是守至今而不敢失夫人有賢子曰奎字長文􅀄舉明經爲殿中丞後舉賢良方正直言極諫一有對䇿二字今爲翰林學士尚書兵部貟外郎知制誥大人􅀄用子恩追封福壽一作昌縣君其後長文貴顯以夫人爲請天子曰近臣吾所寵也有請其可不從乃特追封夫人爲北海郡君長文號泣頓首曰臣奎不幸􅀼享厚禄不得及其母而天子寵臣以此俾以報其親一有雖然二字臣奎其何以報當是時朝廷之士大夫呉氏之鄕黨鄰里皆咨嗟歎息曰呉氏有子矣嘉祐四年冬長文請告于朝將以明年正月丁酉葬夫人于鄆州之魚山一有以書來乞銘五字夫人生三男曰奎奄胃今夫人生一男曰參女三人孫男女九人曽孫女二人銘曰奎顯矣奄早亡胃與參仕方強以一子榮一鄕生雖不及殁有光孫曽多一作已有後愈昌長安郡太君盧氏墓誌銘長安郡太君盧氏尚書刑部侍郎蔡公諱琇之夫人端明殿學士尚書禮部侍郎襄之母也以治平三年十月某日卒於杭州之官舍享年九十有二嗚呼可以爲壽矣夫壽者洪範所謂五福也福者百順之名也故離之雖爲五必合而不闕其一然後爲福之備也蓋五者其一在人曰德而其四在天必有其一於已然後能致其四而有諸己者或厚或薄故其所致亦有備有不備焉夫老而貧且病者是人之所哀非福也壽且冨康而無德以將之謂之賊與不仁非福也三者具而又有德而死非其命者謂之不幸非福也故曰必不闕其一然後爲福之備者惟夫人有之夫人在父母家奉其親以孝其歸于蔡氏也其舅姑老事之如其親其歸寧於父母也能使其舅姑不見三日必涕泣而思其事長􅄌㓜旣儉且勤乆而宗族和郷黨化其亡也匶自餘杭至里閭親戚􅂘之徃徃有過乎哀者問之皆曰夫人於我有德而人人各有述焉嗚呼可謂賢也已夫人生四子其三皆早卒而端明君第二子也獨顯赫爲時名臣自爲諫官知制誥翰林學士知開封府三司使間出知泉福二州福建路轉運使出入清要光華寵榮以爲其親之飬而夫人享此者蓋三十有六年端明君巳顯貴天子嘉之曰有子如此其母之賢可知於是有冠帔之􅃬夫人平生少疾病雖老而耳目聦明食生飲寒如壯者晚從端明君于杭州極東南冨麗海陸之珎竒以爲娯樂之奉而奄然以其壽終其於五福可謂不闕一矣方夫人之盛時凡爲人子者舉觴壽其親莫不以夫人爲祝而不幸榮不及飬者必仰天怨吁謂薄厚不均以不得如夫人爲恨蓋不知夫有諸已者厚故能致其福之備也夫人泉州惠安人也曽祖諱某祖諱某父諱某皆不仕其三子早卒者曰丕不及仕曰髙太康縣主簿曰奭福州司戸叅軍女二人皆適士族孫六人曽孫三十餘人嗚呼盛矣蔡氏之後其又將大興乎銘者所以昭徳而示後也於是端明君之友人廬陵歐陽脩爲之銘曰維治平四年十有一月某日􅀌子襄祔其母夫人盧氏于先君之墓其縣仙遊其里􅄌孝其岡半井其固其安其千萬年之永居士集卷第三十六熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正謝氏墓銘居貧一作吾貧徐氏墓銘千里一作萬里胡氏墓銘鳯州二字上一有又爲二字李氏墓銘于仲一作平仲
