body:
  text: 賜樞宻使山南東道節度使同中書門下平章事賈昌朝生日禮物口宣九月五日卿位峻樞庭望崇舊老屬誕期之斯及顧寵數以冝優體乃眷懷膺茲蕃錫皇帝賀契丹皇帝正旦書正月一日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下玉曆正時布王春而茲始寳隣敦契講信聘以交修方履新陽益綏多福其於祝詠罔罄敷言今差朝散大夫守太常少卿上騎都尉渤海縣開國男食邑三百戸賜紫金魚袋呉中復供僃庫使銀青崇禄大夫檢校太子賔客兼御史大夫騎都尉廣平縣開國男食邑三百戸宋孟孫充正旦國信使副有少禮物具諸别幅專奉書陳賀不宣白皇帝賀契丹太皇太后正旦書正月一日姪大宋皇帝謹致書于嬸大契丹仁􅄌聖善欽孝廣徳安靜正淳懿和寛厚崇覺儀天太皇太后闕下歳律更新春陽鬯逹因履端之叶吉敦永好以申歡載惟􅄌懿之和方集壽康之祉更希善攝用副遐悰今差朝散大夫守太常少卿直昭文館護軍廣陵縣開國子食邑五百戸賜紫金魚袋吕景􅀄洛苑使兼閤門通事舍人銀青崇禄大夫檢校太子賔客兼御史大夫騎都尉清河郡開國侯食邑一千七百户張利一充正旦國信使副有少禮物具諸别幅專奉書陳賀不宣謹白賜知潁州徐宗況進奉賀兖國公主出降銀絹馬等勑書勑徐宗況省所進奉賀兖國公主出降絹五百疋事具悉詩稱王􅁎之下嫁國著嘉禮而有儀惟臣職之聿脩僃物容而叙慶誠勤所至歎尚良深故茲示諭想冝知悉冬寒汝比好否遣書指不多及賜知建昌軍沈造勑書勑沈造省所進奉銀珠稻米一十石計一百黄絹袋事具悉汝職守軍符政兼民穡樂此有秋之實擇其嘉榖之英式陳常貢之儀彌體恪官之意故茲示諭想冝知悉冬寒汝比好否遣書指不多及集禧觀凝祥池崇禧殿開啓祝聖壽年交金籙道􅂣宻詞十二月十日伏以琁霄黙運推四序以循行玉曆更新集萬靈而交會俾清琳宇延格髙真薦兹精一之誠祈乃純厖之祉冀緜福祚均及含生班荆館賜契丹賀正旦人使到闕酒果口宣十二月十日卿等歳律更端隣歡交聘載馳使傳方及國郊冝推寵錫之恩式示眷懷之厚瓊林苑開啓保祐聖躬祈福道􅂣青詞十二月十二日伏以四時成歳嘉庻彚之咸新百福自天荷衆真之􅁳貺俾開靈囿恭講仙科恢寳祚之延長錫壽康之遐永是惟降鑒享乃克誠瓊林苑開啓保祐聖躬祈福道􅂣黙表伏以荷天地之鴻休席祖宗之丕業載惟勵翼敢怠憂勤屬歳律之更端冀時禧之茂集俾嚴禁籞柢率舊章庻通芬潔之誠仰格清真之馭伏冀錫齡斯永降福孔多保􅀖祚於無窮均物生而咸􅀍啓聖院齋殿内權奉明徳元徳章穆皇后今告遷赴普安院重徽隆福兩殿奉安祝文嚮以雨水為災殿塗増緝亦旣新於叢構庻來復於真遊爰揆靈辰冀茲安妥􅃡惟􅄌佑丕鑒乃誠皇帝親詣啓聖禪院告遷明徳元徳章穆皇后赴普安院奉安祝文嚮者因霖災之為沴飭殿構以増新㳙榖旦之惟良奉神遊而還止載深感慕躬薦芬馨式慰孝思冀茲臨格正月三日就驛賜契丹賀正旦人使内中酒果口宣卿等奉將隣好來會歳元載推一作惟寵賚之私冝極珎豐之品俾頒嘉味式侑宴歡瓊林苑交年禱祭太歳諸神祝文天行有度運三綂以環周歳徳所臨從百神而拱列載㳙榖旦薦此令芳惟隂鑒之享誠委時祥而昭佑班荆館賜契丹賀正旦人使到闕御筵口宣十二月十四日卿等曆紀歳元聘交隣好載馳使傳方及國門冝頒宴犒一作推寵錫之恩式示眷懷之厚賜夏國主進奉賀正馬駞詔詔夏國主省所差人進奉賀正馬駞共一百頭疋事具悉履端紀歳萬􅀖咸禀於王正効貢以時奕世克修於藩職載閱充庭之實深惟守土之勤遐體傾輸不忘歎􅅄今回賜銀絹茶等具如别録至可領也其差來人所賜物色亦具賜目故茲詔示想冝知悉春寒比平安好否書指不多及賜夏國主贖大藏經詔十二月日詔夏國主省所奏伏爲新建精藍載請贖大藏經帙籖牌等其常例馬七十疋充印造工直俟來年冬賀嘉祐四年正旦使次附進至時乞給賜藏經事具悉封奏聿來祕文爲請惟覺雄之演說推善利於無窮嘉乃純誠果於篤信所冝開允當體眷懷所載請贖大藏經帙籖牌等巳令印造􅀱嘉祐四年正旦進奉人到闕至時給付故茲詔示想冝知悉春寒比平安好否書指不多及賜新除觀文殿學士禮部侍郎孫􅃆詔嘉祐三年正月十七日勑孫􅃆省所上表伏蒙聖􅄌差使臣賫到誥勑各一道授臣觀文殿學士禮部侍郎并賜對衣金帶鞍轡馬錢五百貫文不敢恭受伏乞特改差臣知一小郡或依例除一官致仕陳乞事具悉卿蔚有敏材膺予簡任外分􅁁􅀉嘗著於恩威入贊國機早參於帷幄風猷甚美寵遇旣優適當擇帥之􅀄方鑒用謀之失是惟慎舉實允僉諧豈冝圖自便之私而罔體眷懷之意顧茲重地難久曠官往祗成命之行當略好謙之節所讓冝不允依前降指揮疾速發赴本任故茲詔示想冝知悉集禧觀奉神殿開啓謝雪道􅂣青詞近以温陽干時雨雪愆􅀱載惟寡薄敢罄精純明靈孔昭嘉應斯􅀗兆豐年而有望消癘氣於未形惟物蒙休以時申報冀清真之來格期福貺之永依自京至雄州巳來撫問契丹告哀人使口宣正月十九日卿祗戒軺軒載馳隣訃顧道塗之甚邈惟渉履之斯勤俾宣恩言式慰良苦賜契丹國告哀人使茶藥口宣正月十九日卿式將隣聘來告國哀屬春􅀱之尚寒顧驛塗之攸邈俾頒品劑用示眷懷沿路賜契丹國告哀人使赴闕茶藥口宣正月十九日勑蕭福延卿夙駕使輶遽傳國䘏屬餘寒之在􅀱想馳驛之為勞俾頒飲劑之良用示眷懷之厚景靈宫雅飾元天大聖后聖容并侍從等開啓預告道􅂣青詞正月二十日伏以珍宇邃嚴奉真靈而有素玉容清穆謹修祓以惟時爰按仙科俾伸䖍告載瞻道䕃冝鑒沖試皇帝回契丹皇帝告哀書二月日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下承遣使車特貽緘翰不意凶變太皇太后上僊載惟契好久睦仁鄰聞此訃音但増感愴姪皇帝負荷至重追慕所深冀節哀情用遵禮制已差人使專持慰禮今林牙懷徳軍節度使蕭福延回奉書陳謝不宣白雄州撫問契丹賀乾元節人使口宣二月二十四日卿等夙持信聘來講隣歡及疆􅀱以惟􅀄屬暄和之方盛冝加撫慰式示眷懷賜給事中叅知政事曽公亮生日詔二月二十五日卿蔚有時望叅于柄臣惟􅀝注之所深在眷顧之尤異屬茲誕日冝爾壽期膺此寵頒體予至意賜翰林學士兼侍讀學士尚書戸部郎中知制誥知審刑院胡􅀫詔三月三日勑胡􅀫省所奏據大理寺日奏司申二月二十一日巳前下寺公案並巳斷奏了畢無見在事具悉朕欲斯民足衣食知禮讓而竊攘爭鬭之獄猶滋欲吾吏慎刑罰盡情偽而傅予輕重之文不一卿以儒學之職總評讞之繁克勤其官曽不留事實副予意惟時可嘉若乃使天下囹圄空虚而風流篤厚是亦論思獻納者之志其勉助我以共臻焉仍依奏宣付史館故茲􅅄諭想冝知悉賜判大理寺陳太素并權少卿楊開及審刑院詳議官大理寺詳斷官等勑書三月三日勑陳太素省知審刑院胡宿奏據大理寺日奏司申二月二十一日巳前下寺公案並已斷奏了畢無見在事刑獄之重一成而不遷比􅀋之微可疑者甚衆汝好學而敏涖官以勤夫俾天下之無􅁈幾刑錯而不用此朕翼翼希慕之所未及而爾孜孜厥職之所不忘者也故茲􅅄諭想冝知悉恩州賜契丹遺留使副茶藥口宣三月二十八日卿等夙馳使傳來逹信函載惟渉履之勤當此暄和之􅀱冝加頒賚式示眷懷瀛州賜契丹賀乾元節人使却回御筵口宣四月七日卿等旣成聘好方即歸塗再惟將命之勞冝有犒勤之錫俾伸宴飫用示眷私班荆館賜契丹賀乾元節人使却回酒果口宣四月七日卿等使軺復命郊館餞行惟茲良潔之英薦以甘馨之實用伸恩錫當體眷懷十六日就驛賜契丹賀乾元節人使内中酒果口宣四月十七日卿等夙奉信函方休賔館惟此醇甘之品用推寵賚之恩聊侑宴歡以伸優遇賜知舒州齊廓進新茶并知廣徳軍浦延熈進先春茶勑書勑齊廓省所進奉新茶一銀合合重五十兩緋羅夾􅃨全事具悉百物茂生取新為貴羣方修職効貢以時汝守土有方事上惟恪閱茲來獻用體勤誠故茲示諭想冝知悉賜外任臣寮進奉乾元節銀絹馬勑書勑髙易簡省所進奉乾元節絹五百疋事具悉汝夙以敏材膺于柬􅀉及此奉觴之節載陳任土之儀􅀎因物以逹誠見事君之甚恪省閱于再歎嘉不忘故茲示諭想冝知悉班荆館賜契丹告哀人使内中酒果口宣卿夙將隣訃方屇國門載惟衝渉之勤冝有宴休之錫俾伸頒賚用示眷優一作懷開寳寺福勝院開啓道􅂣於乾元節日支散袈裟并設大㑹齋一中齋文伏以正陽旅月方及於嘉時萬壽齊天式標於令節啓真乘之祕藏集淨侣於法筵仰惟􅄌妙之仁茂委純厖之祉永隆丕筭均福羣倫東太一宫開啓保夏祝聖壽金籙道􅂣宻詞四月二十四日伏以寂然妙道推善應以無方瞻彼髙靈薦精誠而必逹屇此長嬴之􅀱是惟茂育之時爰稽玉笈之真文載潔雲壇之淨醮冀敷昭鑒來集純禧固壽曆之延昌溥蒼黔而均祐賜彰信軍節度使檢校太保同中書門下平章事判大名府李昭亮乞知西京不允詔勑昭亮省所上表乞移判河南府事具悉朕惟魏洛之重皆為别都將率所居難於屢易卿以中外勤勞之績有撫綏扞禦之材自膺􅀉任之雄方厚􅀝毗之意遽茲列奏嘉乃好謙冝體眷懷靖安爾位所乞冝不允故茲詔示想冝知悉夏􅀬卿比平安好遣書指不多及賜宣徽南院使淮康軍節度使張堯佐乞知西京不允詔五月二日勑堯佐省所奏臣皇祐三年内授宣徽南院使判河陽軍州事未滿任蒙詔赴闕供職至今六載自量尸素深不遑寧近知西京闕人未有除授伏望特賜差委事具悉宣導徽猷任親而事簡居留京邑地要而務繁惟予眷遇之臣方處清閑之職載披來牘深識乃誠雖奮其聦明尚足以臨涖而待我耆艾冝有以優游實嘉盡瘁之心難徇撝謙之意所乞冝不允故茲詔示想冝知悉賜宰臣文彦博上第一表乞解重任不允批答五月十八日省表具之夫知其人之為賢任則勿貳事其君而有道去不可輕此古之臣主之明舉措必慎所以􅀵功於一時而垂法於後世也卿夙有時望為予柄臣自復秉於國鈞僅三周於歳序若乃進退賢否誅賞罪功毎於聽納之間敢忘虚已顧彼搢紳之論曽靡異辭方期有成以副予意而乃過形謙損思避台衡豈寡徳弗明於用才而不盡將多言害正致厥位之難安苟異於斯夫何引讓矧卿忠信之節足以叶予之一心材謀之優可以斷予之大事茲所柬注寧煩諭言所請冝不允就驛賜契丹遺留使副銀䤬鑼唾盂盂子錦􅀍褥口宣五月十八日卿等馳軺來止將命有儀顧茲館憩之􅀄冝具燕私之用俾伸優錫式示眷懷通商茶法詔嘉祐四年二月四日勑古者山澤之利與民共之故民足於下而君􅁉於上國家無事刑罰以清自唐末流始有茶禁上下規利垂二百年如聞比來為患益甚民􅀍誅求之困日惟咨嗟官受濫惡之入歳以陳積私藏盗販犯者實一作寔繁嚴刑重誅情所不忍使田閭不安其業商賈不通于行嗚呼若茲是於江湖之間幅貟數千里為䧟穽以害吾民也朕心惻然念此久矣間遣使者往就問之而皆歡然願弛搉法歳入之課以時上官一二近臣件㭊其狀朕嘉覽于再猶若慊然又於歳輸裁减其數使得饒阜以相為生剗去禁條俾通商賈歷世之弊一旦以除著為經常弗復更制損上益下以休吾民尚慮喜於立異之人縁而為姦之黨妄陳奏議以惑官司必寘明刑用戒狂謬布告遐邇體朕意焉内制集卷第五賜夏國贖藏經詔大藏經帙帙字上一有及經二字通商茶法詔重誅一作峻誅外集卷第五歐陽文忠公集五十五律詩一漢宫桂館神君去甘泉輦道平翠華飛蓋下豹尾属車迎曉露寒浮掌光風細轉旌廊回偏費步珮遠尚聞聲玉樹人間老􅃢瑚海底生金波夜夜意偏照影娥清送劉半千平陽簿假道歸故里嶺梅歸驛路迢迢越鳥巢傾木半喬松徑就荒聊應召挂叢留􅀮定相招家庭噪鵲爭喧樹夜帳驚猿自擁條何䖏秋風催客􅁂青絲恐逐物華凋一作銷樓頭百尺樓頭萬疊山楚江南望隔晴煙雲蔵白道天垂幕簾捲黄昏月上弦桑落蒲城催熟酒栁衰章陌感凋年髮光如葆寧禁恨不待為郎已䬃然夕照夕照留歌扇餘輝上桂叢霞光晴散錦雨氣晚成虹燕下飜池草烏驚傍井桐無憀照湘水丹色映秋風送張學士知郢州漢郎清曉赤墀趨楚老西来望隼旟侍史護衣薫􅈍草轆轤要劒從驪駒陽春繞雪歌低扇油幕連雲水泛渠千里脩門對涔浦好尋遺玦弔三閭曉詠簾外星辰逐斗移紫河聲轉下雲西九雛烏起城􅀅曙百尺樓髙月易低露裛蘭苕惟有淚秋荒桃李不成蹊西堂吟思無人助草滿池塘夢自迷禁火火禁開何晚春芳半已凋栁風兼絮墜榆雨帶錢飄涙翦蘭膏盡弦虧桂魄消祓蘭流水曲㳺禊一相招送趙山人歸舊山屈賈江山思不休霜飛翠葆忽驚秋吟拋楚畹蘭苕老歸有淮山桂樹留聒耳春池蛙兩部比封秋塢橘千頭嗔條怒穎真堪愧莫染衣塵更逺逰閑居即事巷有容車陋門無載酒過池喧蛙怒雨客去雀驚羅握臂如枝骨哀絃繫一作擊筯歌無憀漳浦卧還似詠中阿傷春􅈍蘭蹊徑失芳期風雨春深怯減衣卷箔髙樓驚燕入揮絃逺目送鴻歸蜂催釀􅁡愁花盡絮撲暄條妬雪飛欲識傷春多少恨試量衣帶忖要圍公子黄山開􅁐獵􅀄回絳樹分行舞逓来下馬春􅂣雞􅃲距鳴弦初日雉驚媒犀投博齒呼成白橋隔車音聽似雷不問春蠶眠未起更尋桑陌到秦臺夜意􅈍炷爐薫㫁蘭膏燭艶煎夜風多起籟曉月漸􅃜弦鵲去星低漢烏啼樹暝煙惟應墻外栁三起復三眠􅀉張至祕校關山一里一重愁念逺傷離兩未休南陌望窮雲似帳西樓吟㫁月如鈎栁綿飛後一作處春應減蘭徑荒時客倦㳺擬􅀉東流問溝水亦應溝水更東流􅀉徐巽秀才瑶花飛雪蕩離愁鷤鴂驚風下緑疇睢􅁐樹荒誰共客楚江楓老獨悲秋千重錦浪飜如箭萬疊春山翠入樓章陌栁條今在否定臨溝水拂東流􅀉劉昉秀才􅁝路縈回細入雲離懷南陌草初薫茂林脩竹誰同禊明月春蘿定勒文燕憶銅鞮来不定鴻歸碣石信難分東風鸎友應相望懊惱􅀌飛不及羣送客回馬上作南浦空波緑西陂夕照寒瑶華傷逺道芳草送歸鞍翠歛遥山疊氛收古澤寛衰容畏秋色不及楚楓丹西征道中送陳舅秀才北歸棊墅風流謝舅賢髪光如葆惜窮年人隨黄鵠飛千里酒滿樓烏送一絃望驛早梅迎逺使拂鞍衰栁拗歸鞭越禽胡馬相逢地南北思歸各黯然送目送目衡一作蘅臯望不休江蘋髙下遍汀洲長堤栁曲妨回首小􅁐花深礙􅀝樓楚徑􅈍風消病渇洛城花雪蕩春愁流杯三日佳期過擲度蘭波負勝逰春曉小閤回殘夢開簾轉曉暉露寒風不定花落鳥驚飛病渇偏思柘一作蔗楚詞漢志作柘晉書杜詩作蔗朝寒怯減衣沈錢􅀅謝雪持底送春歸劉秀才宅對弈昉烏巷招邀謝墅中紫囊香珮更臨風塵驚野一作烽火遥知獵目送雲羅但聽鴻六着比犀鳴博勝百嬌柘矢捧壷空解衣對子歡何極玉井移隂下翠桐送李寔㡬幅歸㠶不暫停呉天遥望斗牛横香薫翠􅀍乗青翰波暖屏風詠紫莖江水自隨潮上下月輪閑與蚌􅃜盈河橋折柳傷離後更作南雲萬里行早夏鄭工部園池夜雨殘芳盡朝暉宿霧收蘭香纔馥徑栁暗欲翻溝夏木繁堪結春蹊一作畦翠巳稠披襟楚風快伏檻更臨流舟中􅀉劉昉秀才東南天闊漾歸流西北雲髙㫁寸眸明月隨人来遠浦青山荅鼓送行舟歸心逐夢成魚鳥夜漢看星識斗牛釅一作騃酒開樽誰共醉清江聊且玩㳺鯈一作鯈㳺月夕月氣初升海屏光半􅀮扉寒消􅁴春盡漏永送籌稀蘭燭風驚燼煙簾霧濕衣清羸急寛帶頻減故時圍奉送叔父都官知永州虎頭盤綬貴垂紳青組名郎領郡頻畫鷁千艘隨下瀨聽雞五鼓送行人楚波漾楫萍如日淮月開舲蚌有津千里壷􅄴民詠溢檣烏旟隼下汀蘋柳緑樹低昻不自持河橋風雨弄春絲殘黄淺約眉􅀟歛欲舞先誇手小垂快馬折鞭催逺道落梅横笛共餘悲長亭送客兼迎雨費盡春條贈别離舟中望京邑東北歸川決決流汎艎青渚暫夷猶遥登㶚岸空回首不見長安但舉頭揮手嵇琴空墮睫開樽魯酒不忘憂青門栁色春應遍猶自留連杜若洲小圃桂樹鴛鴦起蘭苕翡翠翔風髙絲引絮雨罷葉生光蝶粉花霑紫蜂茸露濕黄愁酲與消渇容易為春傷即目李徑隂森接翠疇押簾風日澹清秋晚烏蔵栁棲殘照逺燕傷風失故樓星漢經年雖可望雲波千疊不緘愁平居革帶頻移孔誰問無憀沈􅀮侯南征道􅀉相送者楚天風雪犯征裘誤拂京塵事遠逰謝墅人歸應作詠灞陵岸遠尚回頭雲含江樹看迷􅀁目逐歸鴻送不休欲借髙樓望西北亦應西北有髙樓楚澤宿莽湘纍怨幽蘭楚俗謡紫屏空自老翠􅀍豈􅀎招欲就蒼梧訴愁迷澧浦遥哀猿􅆧晝晦悲鴂衆芳凋紅壁丹砂板瓊鈎翡翠翹如何搴香杜一作杜若江上獨無憀題金山寺地接龍宫漲浪賖鷲峯岑絶􅀝雲斜嵓披宿霧三竿日路引迷人四照花海國盗牙爭起塔河童施鉢但驚沙春蘿攀􅀝難成去山谷踈鍾落暮霞送竇秀才晴原髙下細如鱗樹轉城回路欲分望月西樓人共逺躍鞍南陌草初薫短亭山翠偏多疊送目鴻驚不及羣一驛賦成應援筆好慿飛翼􅀉歸雲旅思調苦歌非樂岐多淚始零羞彈長鋏劔終戀五侯鯖陌草薫沙緑江楓照岸青南陔動歸思蘭葉向春馨仙意􅀌桐百尺拂非煙鳯