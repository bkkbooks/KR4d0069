body:
  text: 書四答宋咸書至和三年某啓去年冬承惠問時以奉使契丹不皇爲答兹者人至辱書豈勝感愧某區區于比無􅀘當時徒於京師大衆中汩汩人事舊學都廢耳不聞仁義之言久矣惟君子不以甘榮祿走聲利之徒見待時有所教幸甚幸甚天日之髙以其下臨於人者不逺而自古至今積千萬人之智測驗之得其如此故時亦有差者由不得其真也聖人之言在人情不逺然自戰國及今述者多矣所以吾儕猶不能黙者以前人未得其真也然亦當積千萬人之見庶㡬得者多而近是此所以學者不可以止也足下以爲如何尚或不然當賜教向􅀬爲政外自重以副所懷不宣某再拜與集賢杜相公慶暦四年秋脩皇恐頓首三兩日不審尊體動止何似某被催赴任不得躬造門下豈勝戀戀之誠保州叛卒必欲招之而外不退兵雖使忠臣孝子不免疑惑今又聞有築城之請雖知朝廷不以爲是而便宜之旨巳下軍前萬一他事盡如築城之繆遂不請而便宜從事脫有敗誤則一方之事繫天下安危伏惟聰明何以裁處某才薄力劣不足以備急緩一作緩急之用若止於調發輸餉此俗吏之所能爲故自請願與田李共議兵事至今寢而不報内竊自度不報誠宜然朝廷既已力排言事者而託以用才於外今反疑之而不任以事何以解言者之惑哉此某之不可諭也秋暑尚繁伏惟爲國自重答李大臨學士書脩再拜人至辱書甚慰永陽窮僻而多山林之景又嘗得賢士君子居焉脩在滁之三年得博士杜君與處甚樂每登臨覽泉石之際惟恐其去也其後徙官廣陵忽忽不逾歳而求一作來潁在潁逾年差自適然滁之山林泉石與杜君共樂者未嘗輒一日忘于心也今足下在滁而事陳君與居足下知道之明者固能逹于進退窮通之理能逹於此而無累於心然後山林泉石可以樂必與賢者共然後登臨之際有以樂也足下所得與脩之得者同而有小異者脩不足以知道獨其遭世憂患多齒髮衰因得閑處而爲宜爾此爲與足下異也不知足下之樂惟恐其去能與脩同否況足下學至文髙宜有所施於當世不得若某之戀戀此其與某異也得陳君所􅀉二圖覽其景物之宛然復思二賢相與之樂恨不得追逐于其間因人還草率答陳知明書脩再拜啓人至辱書有秦燕玉馬之􅀃何其謙之甚邪某昨在廣陵一相見於衆人中未有相知之意及食將徹案方接足下以言而始知其非衆人也然尚不暇少留以盡脩之所欲得者後常以爲恨也去年辱書于潁又客之來自滁者皆能道足下之事於是判然以爲士之相知或相望於千里或相追於異世知其道而已不必接其迹也則廣陵之不留無足以爲恨此前書所道勤勤僃矣某於足下不必見其文章之自述然後以爲知也明矣蓋嘗辱示詩及書讀而愛之不巳以謂閎博髙深必有放縱奔馳而可喜者雖得之多宜不厭也因復輒有求於足下者譬之垂涎已啖一臠之味而思快意於五鼎之間也何足怪哉幸足下無惜與王深甫論世譜帖脩啓惠借顔氏譜得見一二大幸前世常多喪亂而士大夫之世譜未嘗絶也自五代迄今家家亡之由士不自重禮俗苟簡之使然雖使人人自求其家猶不可得況一人之力兼考於繆亂亡失之餘能如所示者非深甫之好學深思莫能也顔譜且留愚有未逹須因見過得請集古錄未始委僮奴昨曰大􅀬艱於檢尋今送不次脩再拜同前脩啓辱示承旦莫體佳髙陽􅀃如此爲得之矣載初元年正月乃永昌年之十一月爾當與永昌同年天授庚寅載初己丑爾然自天授至長安四年甲辰凡十五年使自武徳不除周年則乾元己亥乃一百四十二年除周年則大曆乙􅆗爲一百四十年乙卯大曆十年也哥舒晃事在八年又江西出兵不當越數千里出於明州此又可疑前日奉答一作啓後再將校勘却未敢書更俟面議也蓋江西出嶺路絶近次則出湖南巳爲稍逺就令出明州非江西可節制也病一作疾嗽無悰姑此爲報脩頓首同前脩啓蒙䟽示開益巳多感服何巳唐除周歳誠如所諭兼密罷明州在建中二年則大曆八九年後儆爲明守而密代之以年數推之與乾元之􅀃不較可知但恐除周之年前人未必如此難以臆斷爲定當兩載之使來者自擇也髙陽門徒之說恐便是髙陽人未知何如一作如何郭子儀家傳等先送碑當續馳脩再拜所推誠好然更深思唐人除周之􅀃恐未必然也則天是天授中改周惟復是載初相較亦只一年爾與王深甫論五代張憲帖脩啓辱教甚詳蒙益不淺所疑所論皆與脩所考驗者同今翫疑之則欲著一小論于傳後以哀其忠如此得否脩之所書只是變賜死爲見殺於憲無所損益憲初節甚明但棄城而走不若守位而死巳失此節則見殺與賜死同爾其心則可喜但舉措不中爾更爲不見張昭傳中所載或爲錄示尤幸目痛草草不次脩再拜荘宗月一日遇弑存覇在河中聞變走太原見殺而憲亦走忻州明宗初三日入洛十日監國二十日即位憲二十四日死初以此疑之又本傳言明宗郊天憲得昭雪則似非明宗殺之更爲思之如何同前脩啓辱教益詳盡多荷多荷存覇奔太原人言其馬鞦斷疑其戰敗而來存覇乃以情告仍自髠衣僧衣見符彦超曰願爲山僧望公庇護彦超亦欲留之俟朝命爲軍衆所殺若此則憲似知荘宗已崩據張昭勸憲奉表則知新君立明矣但不知其走忻州何故也此意可喜而死不得其所爾食後見過更盡髙議可乎脩再拜問王深甫五月一日㑹朝帖脩啓信宿爲況清佳前日貪奉笑言有一事數日欲咨問偶忘之唐時有五月一日㑹朝之禮略記其始本出於道家是日君臣集會其儀甚盛而其􅀃不經不知起自何帝亦記得是開元巳後方有略與批示其時爲幸脩再拜中間嘗罷後又復行復行恐是憲宗朝亦不記子細與杜訢論祁公墓誌書脩啓專人至辱書伏承暑􅀬孝履支福深慰企想所要文字終不曽得的實􅁙日以謂十日尚逺遂未曾銓次忽辱見索亦莫知􅁙期逺近爲一兒子患傷寒三次勞發已二字一作復一月在牀虚乏可憂日夕憂迫心緒紛亂不能清思於文辭縱使強爲之辭亦不工有玷清徳如􅁙朝逼乞且令韓舍人將行狀添改作誌文脩雖遲緩當自作文一篇紀述平生知已先相公最深別無報答只有文字是本職固不辤雖足下不見命亦自當作然須慎重要傳久逺不鬭速也苟粗能傳述於後亦不必行疑況治命不用邪若􅁙期未有日可待即􅀹好也然亦只月十日可了若以愚見誌文不若且用韓公行狀爲便縁脩文字簡略止記大節期於久逺恐難滿孝子意但自報知已盡心於紀錄則可耳更乞裁擇范公家神刻爲其子擅自增損不免更作文字發明欲後世以家集爲信續得錄呈尹氏子卒請韓太尉别爲墓表以此見朋友門生故吏與孝子用心常異脩豈􅀒知已者范尹二家亦可爲鑒更思之然能有意於傳久則須紀大而略小此可與通識之士語足下必深曉此但因􅁙期速恐倉卒不及遂及斯言也幸察京師區區中日爲病患憂煎不時遣人􅆀問夏􅀬節哀自愛同前脩啓秋涼不審孝履何似前於遞中辱書所示誌文今巳撰了爲無得力人遂託李學士送逹脩愚鄙辱正獻公知遇不比他人公之知人推􅅄未有若脩之勤者脩遇知已未有若公知之深也其論報之分他事皆云非公所欲惟紀述盛徳可以盡門生故吏之分然以衰病文字不工不能次序萬分之一此􅀹爲愧恨也然所紀事皆錄實有稽據皆大節與人之所難者其他常人所能者在他人更無巨美不可不書於公爲可略者皆不暇書如作提刑斷獄之􅀋然又不知尊意以爲何如苟見信甚幸或擇一真楷書而字畫不怪者書之亦所以傳世易曉之意也刻石了多乞數本爲人來求者多􅁙事知定十月不知何人􅂐葢早了爲善昨禮院定謚曰正獻清白守節曰正正避御名音同所改也文賢有成曰獻義兼文節文正矣知已今不可得每臨公事但知感涕爾漸寒侍親千萬節哀自愛不宣脩再拜問劉原甫侍讀入閤儀帖入閤之禮起自何年閤是何殿開延英亦起何年五日一起居遂廢正衙不坐起何年三者􅀌陋所不詳乞示其本末脩啓辱示甚煩尊用然得以開釋未悟其幸􅀹多感刻感刻問此一事本爲明宗置内殿起居又復入閤當時縁昭宗朝誤繆不合故事也朔望宣政一事􅀹失紫宸入閤本制也然不見初起年代今乃入閤却御前殿此自昭宗失之延英之對與入閤合儀亦自昭宗失之起居而廢正衙自明宗失之至今遂爾含元大殿大朝㑹宣政常朝謂之正衙本爲玄宗朔望以陵寢薦食不復御正殿始於便殿召入宰臣巳下此入閤之漸今云朔望御宣政殿大失之矣延英便殿亦謂入閤乃五日一開與宰臣議事宣政立而奏事訖賜坐茶湯延英賜坐而論事盖漸密而漸親也昭宗始一日中九度開延英入閤仍於一度開延英一日行之前殿入閤唐未即於朔望日前殿正觀殿行入閤自後唐至國朝並於文明殿行入閤皆非便殿或指朔望宣政爲入閤尢誤說也脩於史巳不熟於制度又不熟乞爲參詳之與蔡君謨求書集古錄序書脩啓曏一作曩在河朔不能自閑嘗集錄前世金石之遺文自三代以來古文竒字莫不皆有中間雖罪戾擯斥水陸奔走顛危困踣兼之人事吉凶憂患悲愁無聊倉卒未嘗一日忘也蓋自慶曆乙酉逮嘉祐壬寅十有八年而得千卷顧其勤至矣然亦可謂富哉􅀼復自念好嗜與俗異馳乃獨區區􅀵拾世人之所棄者惟恐不及是又可笑也因輒自敘其事庶以見其志焉然顧其文鄙意陋不足以示人既則一作而自視前所集錄雖浮屠老子詭妄之􅀃常見貶絶於吾儒者徃徃取之而不忍遽廢者何哉豈非特以其字畫之工邪然則字書之法雖爲學者之餘事亦有助於金石之傳也若浮屠老子之􅀃當棄而獲存者乃直以字畫而傳是其幸而得所託爾豈特有助而巳哉僕之文陋矣顧不能以自傳其或幸而得所託則未必不傳也由是言之爲僕不朽之託者在君謨一揮毫之頃爾竊惟君子樂善欲成人之美者或聞斯􅀃謂宜有不能却也故輒持其􅀃以進而不疑伏惟幸察與樂秀才第一書景祐三年續添某白秀才樂君足下昨者舟行徃來皆辱見過又蒙以所業一冊先之啓事宛然如後進之見先逹之儀某年始三十矣其不從郷進士之後者於今􅂊七年而官僅得一縣令又爲有罪之人其徳爵齒三者皆不足以稱足下之所待此其所以爲慙自冬渉春隂􅂥不止夷陵水土之氣比頻作疾又苦多事是以闕然聞古人之於學也講之深而信之篤其充於中者足而後發乎外者大以光譬夫金玉之有英華非由磨飾染濯之所爲而由其質性堅實而光輝之發自然也易之大畜曰剛健篤實輝光日新謂夫畜於其内者實而後發爲光輝者日益新而不竭也故其文曰君子多識前言徃行以畜其徳此之謂也古人之學者非一家其爲道雖同言語文章未嘗相似孔子之繫易周公之作書奚斯之作頌其辭皆不同而各自以爲􅀴子游子夏子張與顔回同一師其爲人皆不同各由其性而就於道耳今之學者或不然不務深講而篤信之徒巧其詞以爲華張其言以爲大夫強爲則用力艱用力艱則有限有限則易竭又其爲辭不規模於前人則必屈曲變態以隨時俗之所好鮮克自立此其充於中者不足而莫自知其所守也竊讀足下之所爲髙健志甚壯而力有餘譬夫良駿之馬有其質矣使駕大輅而王良馭之節以和鑾而行大道不難也夫欲充其中由講之深至其深然後知自守能如是矣言出其口而皆文脩見惡於時棄身此邑不敢自齒於人人所共棄而足下過禮之以賢明巧正見待雖不敢當是以盡所懷爲報以塞其慙某頓首京本英辭􅀋槀有答樂秀才二書首尾意頗相􅀋其一居士集所無今録如右其二雖載居士集而用字或不同併列于左見居士集四十七卷外集卷第十九按居士集第四十七卷有答宋咸書論補注周易其末云屬出疆怱怱不具蓋至和二年冬也今此卷所載次年夏答咸之書謂去冬不皇爲答得非前書之後咸復有書而未答耶答宋咸書兹者人至此下一有又字與王深甫論世譜前世真蹟世字下有固字況一人之力真蹟況字下有以字同前以集古跋裴公紀徳碣觀之則此帖正論此事其書百四十年處疑脫零數同前代亡一作代之與蔡君謨書自三代此下一有秦漢二字奔走此下一有山川險阻四字不足以示人不字上一有恐字白傳此下一有也字居士集卷第十九歐陽文忠公集十九詔冊七首請皇太后權同聽政詔門下朕承大行之遺命嗣列聖之丕基踐祚之􅀄銜哀罔極遂罹疾恙未􅀗痊和而機政之繁裁決或壅皇太后母儀天下子育朕躬輔佐先朝練逹庶務因請同於聽覽蒙曲賜於矜從俾緩憂勤冀速康復候將來聽政日皇太后權同處分文武百官並放朝叅候朕平愈日如故故茲詔示想冝知悉皇太后還政議合行典禮詔勑中書門下朕頃以嗣承大統方執􅀄喪過自摧傷遂嬰疾恙皇太后尊居母道時遘家艱閔余哀荒俯徇誠請勉同聽覽用適權冝頼保護之勤劬獲淸明而康復恭惟坤德之至静實猒事機之乆煩殆此彌年荐承諄誨顧寔繁於庶政難重浼於睿􅄌然而方國多虞則共濟天下之務惟時無事亦冝享天下之安先民有言無德不報雖日以三牲之養未足盡於予心而刑于四海之風必務先於孝治惟是事親之禮蓋存有國之規當極尊崇以稱朕意應合行儀範等事令中書門下樞宻院參議以聞故茲詔示想冝知悉賜大宗正司詔勑夫明德以親九族正家而刑萬􅀖古先哲王罔不由此朕嗣守丕業率循舊章惟皇屬之敦和命宗正而董正而累聖承繼百年盛隆荷宗社之慶靈茂本支而蕃衍念其性本於仁厚冝廣學以勤修顧其日益於衆多必増員而統理故外巳詔於儒學各選於經師而内仍擇於親賢共司於屬籍庶乎恊􅐌其職並修厥官糺乃非違先以正而爲率勉夫怠墮惟其善而是從式孚于休以副予意賜夏國詔書朕嗣守丕圖日新庶政方推大信以協萬􅀖思與藩屏之臣永遵帶礪之約矧勤王而述職固奕世以推誠而近年以來將命之使或不體朝廷之意或罔循規矩之常多於臨時率爾改作旣官司之有守致事體以難從且下修奉上之儀本期効順而君有錫臣之寵所以隆恩豈冝一介於其間輒以多端而生事在國家之撫御固廓爾以無疑想忠孝之傾輸亦豈欲其如此故特申於㫖諭諒深認於眷懷今後所遣使人更冝精擇不令妄舉以紊彝章所有押賜押伴使臣等亦巳嚴行戒勵苟有違越必寘典刑載惟信誓之文炳􅀂丹靑之著事皆可守言貴弗違毋開間􅂩之萌庶敦悠乆之好英宗遺制詔内外文武百寮等朕蒙先帝之遺休荷髙穹之眷命􅀗主大器于茲五年樂與羣公講求至治先身以儉冀臻四海之富康勵志之勤未甞一日而暇逸而憂勞積慮疾恙踰時有加無瘳遂至大漸皇太子頊睿哲之性天資夙成儲兩之明人朢攸屬可於柩前即皇帝位尊皇太后爲太皇太后皇后爲皇太后諸軍賞給並取嗣君處分喪服以日易月山陵制度務從儉約在外羣臣止於本處舉哀不得擅離治所成服三日而除應縁邊州鎮皆以金革從事不用舉哀於戲死生之理聖智所同惟頼宗社之靈臣隣恊德輔我元子永康王家咨爾多方當體予意主者施行尊皇太后冊文維治平二年歲次乙巳十一月丁巳朔十有六日壬申嗣皇帝臣頊謹稽首再拜言曰臣聞昔者明王之以孝治天下者非家至而日見也蓋有要道焉推所以行於已者爲天下率盡所以奉其親者爲天下先而四海靡然而承風矣洪惟有宋受命造􅀖百年四聖而小子􅀗承之以繼我仁考之遺休餘烈方與羣公卿士夙夜以思勉其不逮庶幾如我仁考付􅂌之意以申罔極欲報之心此固慄慄祗懼不敢遑寜者巳顧惟眇末之質提攜鞠育􅄌仁咻煦至于有成自我聖母嗣位之始哀迷在疚而憂勞艱難一日萬務恊和綏靖保佑扶持功施􅀖家亦惟我聖母永惟至恩大德無物可稱是以稽參典禮率􅈼羣心合志一辭懇懇惓惓不勝大願謹遣攝太尉具官臣韓􅄾司徒具宫臣胡􅀫奉玉冊金寳上尊號曰皇太后恭惟皇太后聖善明哲柔閑静專粤自正位中宫内助先帝隂禮修而教行儉德著而下化遂及萬國先於正家逮夫玉几受遺遭時多難勉徇勤請權同聽決而明識遠慮動懷謙畏深鑒漢家母后之失訖不踐於外朝及歸政沖人合於易之進退不失其正之聖是惟全節鉅美固巳超出前古而垂法後世冝乎盛烈播于聲詩尊名光於典冊惟末小子獲奉温凊嗚呼殫九州之冨以爲養未足盡於孝心享萬壽之福而無疆期永承於􅄌訓臣頊誠懽誠抃稽首再拜謹言居士集卷第十九熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正此卷皆任叅知政事日中書所用之文公家定本元又有濮王典禮奏今旣載之濮議更不重出聽政詔候一作俟冊文司徒二字上有攝字
