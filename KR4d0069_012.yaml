body:
  text: 碑銘漳一作鄣南縣君張氏墓志銘右諫議大夫集賢院學士楊公諱大雅之夫人曰漳南縣君張氏父諱保衡官至太僕寺丞其先荆門大族劉守光亂幽州曽祖敏徙其家濟南之歷城而益盛夫人生二十有二歲歸楊氏十有五年生二男三女景德三年十月十四日終于袁州之廨其子洎濬尚幼能記其母及長聞其家與其外內宗姻之稱夫人者曰夫人生于冨族而柔明孝謹楊氏嘗世家公少孤貧始為開封縣尉夫人入其門若素小家子事其姑視日時早暮氣節之寒暑飲食起居之當進與否者不少懈如此十五年如始歸凡楊氏之內宗與其外姻賔客之至者如豐家退視其禇空如惟恐人之知也教其子不略弛其色有問之則曰慈或失之教不嚴不足以訓雖家人亦未嘗見其跋墜自開封及其為祕書丞而得封又見其夫為太常博士知袁州乃卒其後楊公登朝廷掌書命為諫議大夫居榮顯皆莫見也嗚呼可哀也巳天聖某年楊公薨景祐二年某月日子洎舉而合葬之于其葬也洎為某官濬為某官女三人皆適人其幼早亡二女皆有子娶矣銘曰嗚呼一無二字生而淑沒也何思夫安於此其從斯太子賔客分司西京謝公墓志銘惟景祐元年十月之晦太子賔客分司西京謝公薨明年三月嗣子絳自京師舉其柩南歸用八月某吉葬杭州冨陽縣某鄉某原合以夫人晉陵郡君許氏而從王父户部侍郎府君之墓次公世居冨春生十一歲時已如成人嘗與客談論侍郎竊從聽之往往能奪其客議十四歲詣州學學左氏春秋略授其説即為諸生委曲講論如其師稍長居蘇州時天子平劉繼元露布至守臣當上賀命吳中文士作表章更數人皆不可意公私作於家客有持去者吳士見之大驚遂有名於南方淳化三年以進士及第為梓州榷鹽院判官會兩川盜起攻劫州縣公乘賊未至盡伐近郊林木內城中且曰除賊隱蔽以修閉守之具有餘可給薪蒸為久圍之僃身與士卒守塹壁凡圍百日不能破賊平知州事尚書左丞張雍轉運使馬襄狀言其能就除觀察判官賜以器幣明年知益州華陽縣縣人苦兵劫皆逃失業朝廷下令許民能倍租入官者皆得占其田既而良田盡為大豪所奪而逃人歸者不復得公至則手判訟牒以謂恤亂撫人不冝利倍租而使貧人失業盡奪之格其詔書不用由華陽召改著作佐郎通判壽州筠州知興國軍三遷至太常博士真宗方考責能吏一日自內出中外賢吏有治狀者二十四人付中書以名召公由興國召見于長春殿賜緋魚袋即日試於學士院明日邊臣有急奏天子詔且親征是時大賊王長壽又劫曹濮真宗面語宰相委公曹州遂改屯田員外郎以往至則縛凶人趙諫趙諤斬於京師三字一作于市曹人以寧自曹歸朝是歲大星見西南方占曰在蜀奉使巡檢益利兩路蜀卒無事又議大鐵錢平其法至今行之使還舉州縣吏三十餘人宰相疑其多公願署連坐以取信朝延從之所舉後皆為能吏奉使舉人連坐自公始既而為三司度支判官知泰州歙州再遷司封員外郎坐三司舉吏奪官復為度支通判河南府侍中始平公自洛來朝薦之召試授兵部員外郎直史館判三司理欠慿由司出為兩浙轉運使賜金紫遷禮部郎中判司農寺朝廷方議以知制誥將試忽得疾踰旬不能興遂寢天禧五年以户部郎中兼侍御史知雜事同判吏部流內銓真宗葬永定陵詔山陵使道路所經拆民廬舍及城門以過車輿象物公上言先帝封祀行幸儀物全盛不聞所過壞民居今少府治塗車明器侈大非禮且違遺詔務儉薄之意請裁損之書奏不聽以疾求去職遷吏部郎中直昭文館知越州還遷太常少卿判太府寺登聞檢院復以疾求西京留司御史臺踰年就臺拜祕書監遂求分司明道元年轉太子賔客公少以文行有名於時自言吾於一作在天下無一嫌怨待士君子必盡其心雖人出其下亦未嘗敢懈怠家居有法度撫養孤幼極恩愛常時溫和謙厚真長者及在官臨事見義喜為過於勇夫故所至必有能稱不幸中廢以疾不得盡其所為及居西京不關人事惟理醫藥與方術士語終日不休歲時河南官屬詣門請見慘凝然肅潔有威儀不若老且病者享年七十有四以壽終嗚呼可謂君子者巳公諱濤字濟之髙祖希圖仕至衛州刺史曽祖延徽處州麗水縣主簿祖懿文杬州鹽官令父崇禮泰寧軍節度掌書記以公贈户部侍郎母崔氏博陵郡太君弟四人炎最有文行知名於時見國史子三人長曰絳次將作監主簿約次太廟齋郎綺亦有文皆早亡謝氏自曽髙不顯由公始昌其家而子絳又以文行繼之𥘉公之葬其先君也為兵部員外郎今公之葬絳亦世其官度支判官河南府通判並踐世職判太府寺實父子相代書府之任昭文史館集賢院祕閣父子同時為之見于衣冠盛事録謝氏其不衰又將大也歟銘曰謝之逺世河南緱氏四代之祖因仕過江卒葬嘉興始留南方曽祖在南佐麗水縣卒又葬焉世亦未顯祖令鹽官始葬冨陽凡三徙遷遂家於一作于杭世久當隆其昌自公冨陽之原三世有墓父大於祖子大于父後有賢嗣又有令孫公其安居有祀有承檢校司農少卿致仕張公墓志銘君諱九思鄆州陽谷縣人張氏世以明經仕宦君少習春秋三傳太平興國五年以舉中髙第凡仕若干年而致之又若干年而考終命𥘉任雅州軍事推官轉大理評事光祿大理二寺丞太子中舍殿中丞國子博士尚書虞部比部駕部三員外郎中凡居官一十有三歷知黃蘄道三州既老又加檢校司農少卿于其家年八十有五其終也實天聖某年某月某日其葬也以明道二年某月某日其葬之地汝州襄城縣某村某山之下父諱清纍贈某官母崔氏追封某縣太君𥘉娶朱氏某縣君生子龜正龜文龜文先亡女二人後娶王氏某縣君生子龜誠于其葬也龜正為鄆州支使知鄂州崇陽縣龜誠襄城縣尉君為人沉朴謹儉官能其職為政以慈仁厚下為先人有鬪訟常兩諭之𥘉強不屈化必以禮義柔之卒相服從願改自疑為善故所至人愛思之其為黃州也飛蝗越州不下州人歌之以為異凡居官所得俸廪計身衣食足而巳秩滿還家輒以所餘分親族噫其賢厚而敏亦經之效歟銘曰張世鄆居舉明經朴儉勤孝家所承公壯而仕老康寧八十其壽位則卿始終以全為家榮去鄆而汝從新塋後之世者考此銘河南府司録張君墓志銘山東道節度掌書記知伊陽縣事天水尹洙撰吾友張堯夫以今年七月癸酉葬其先君于北邙山既葬二十有九日壬寅晨起感疾復就寢弗寤若醉狀醫視其脈曰疾勢風甚盛脈冝洪今細蹶殆不可為晝未盡數刻啓手足于官署翌日殮于正寢戊申葬先君墓次實明道二年八月也堯夫內淳固外曠簡不妄與人交𥘉為河南府推官後為司録豫與之遊幾五年出處多共之其飭身臨事豫嘗愧堯夫堯夫不豫愧也嗚呼安能盡識吾友之善哉堯夫名汝士年三十七歷官至大理寺丞先君諱某終虞部員外郎母李氏隴西縣君娶崔氏生二男三女皆幼渤海歐陽修為之銘曰噫嘻哉上者蒼蒼也冝夀而夭冝福而禍有尸者邪其無也豐其躬者鮮其仁豫之賢者嗇其位豈其不可兼邪斯可怪也其有莫施其為不伐充而不光遂以昧滅後孰知也弔賔盈位哭皆有涕夫嗟於道婦咄於竈夫能使人之若此也噫嘻哉君子吾不得見而見善人善人今復不得而見也先君墓表此乃瀧岡表𥘉稿其後刪潤頗多題曰瀧岡阡表在居士集第二十五卷修不幸生四歲而孤太夫人守節自誓居貧自力於衣食以長以教俾至于成人而嘗告之曰汝父為吏廉而好施以其俸祿事賔客常不使有餘曰無以是為我纍故其亡也無一瓦之覆以庇其生然吾何恃而能自守以至此耶吾於汝父知其一二而巳也此吾之所恃也吾之始歸也汝父免於母喪方踰年歲時祭祀則必泣涕曰祭而豐不如養之薄也間居而御酒食盛饌則又涕泣曰昔不足而今有餘其何及也吾始一二見之以為新免於喪而適然耳既而其後常然至於終身未嘗不然此吾知汝父之能養也汝父為吏嘗夜燭治官書屢廢而歎吾問之則曰此死獄也我求其生不得也吾曰生可求乎曰求其生而不得則死者與我皆無恨矧求而有得耶以其嘗有得知其不求而死者恨也夫常求其生猶失之死而況世常求其死也回顧乳者抱汝而立于旁指而歎曰歲行在戍我將死不及見兒之立也後當以我語告之其平居教他子弟亦皆用此語吾耳熟焉故能詳也其施於外事接於賔客或有矜飾吾不能知其居于家無所事而其為如此是其發于中者也其心誠厚于仁者也此吾之知汝父之得疑有後也汝其勉之夫士有用捨志之得施與否不在已而為仁與孝不取於人也修泣而志之不敢忘先君少孤力學咸平三年進士及第為通州判官泗綿二州推官又為泰州判官正身懷道不及其施享年五十有九𥘉贈太子中允今贈某官太夫人姓鄭氏世為江南名族太夫人恭儉仁愛而有禮𥘉封縣太君纍封樂安安康彭城三郡太君自其子少賤時治其家以儉約其後常不使過之曰吾兒多不合于世儉薄所以安患難也修𥘉貶夷陵太夫人言笑自若曰汝家故貧賤也修察其志久而安故其後立于朝得不苟容于時蓋自先君之亡二十年修始得祿而養又二十有三年修為龍圗閣直學士尚書吏部郎中留守南京太夫人以疾卒于官舍享年七十有二修竊自念為人子而不能識其父幸而得聞吾母之言其忍廢為乃泣血而記之歐陽氏自為吉州吉水人至豫修十有五世矣沙溪吾世之家且葬也故又刻其所記者表於其阡以告其宗族及鄉之人曰而耕而田歲取百千而耘而學久而不獲田何取之囷倉峩峩學而取之簮笏盈家量功較收所得孰多先君之學獲不及時匪于其躬而利其後疾遲幾何善無不報先君之貽子修不肖矧有才子于何不有矧我歐陽世家惟舊自始氏封烏程之亭在北有聞或冀或青中顯彌長或吉或衡勢大必分枝葉婆娑惟吉舊居子孫今多木久而林有喬其秀矧我歐陽扶踈並茂先君之德吾母知隆子修不肖以俟其宗以勉同鄉敢及他人母鄭夫人石槨銘維皇祐五年癸巳六月庚午匠作石槨粵七月巳亥既成銘曰於乎有宋歐陽修母鄭夫人槨既密既堅惟億萬年其固其安胥氏夫人墓志銘公在憂制舉祔葬之禮故命門人秉筆廬陵歐陽先生語其學者徐無黨曰修年二十餘以其所為文見胥公于漢陽公一見而竒之曰子當有名于世因留置門下與之偕至亰師為之稱譽於諸公之間明年當天聖八年修以廣文館生舉中甲科文明年胥公遂妻以女公諱偃世為潭州人官至工部郎中翰林學士公以文章取髙第以清節為時名臣為人沈厚周密其居家雖燕必嚴不少懈每端坐堂上四顧終日如無人雖其嬰兒女子無一敢妄舉足發聲其飲食衣服少長貴賤皆有常數胥氏女既賢又習安其所見故去其父母而歸其夫不知其家之貧去其姆傅而事其姑不知為婦之勞後二年三月胥氏女生子未逾月以疾卒享年十有七後五年其所生子亦卒後二十年從其姑葬于吉州吉水縣沙溪之山修既感胥公之知巳又哀其妻之不幸短命顧二十年間存亡憂患無不可悲者欲書其事以銘而哀不能文因命無黨序其意又代為哀辭一篇以弔胥氏因並刻而藏于墓當胥氏之卒也先生時為西京留守推官實明道二年也其哀辭曰清泠兮將絶之語言猶可記髣佛兮平生之音容不可求謂不見為才幾時兮忽二紀其行周豈無子兮久先于下土昔事姑兮今從于此丘同時之人兮藐獨豫留顧生餘幾兮一身而百憂惟其不忘兮下志諸幽松風草露兮閟此千秋楊氏夫人墓志銘同前廬陵歐陽先生之繼室曰楊氏者故右諌議大夫集賢院學士楊公之女也楊氏逺有世德自漢至唐常出顯人故其繫譜所傳次序自震至今不絶公諱大雅以文學篤行居清顯號為古君子先生嘗謂其學者焦千之曰楊公已殁修始娶其女雖不及識公然嘗獲銘公之德究見其終始其行于巳立于朝廷發于文章者皆得考次及楊氏之歸又得見公之退施于其家者皆可法也楊氏事其姑以孝而勤友其夫以義而順接其內外宗族以禮而和方其歸也修為鎮南軍掌書記館閣校勘家至貧見其夫讀書著文章則曰此吾先君之所以樂而終身也見其夫食糲而衣弊則曰此吾先君雖顯而不過是也間因其夫之俸廪食其月而有餘則必市酒具肴果于堂上曰吾姑老矣惟此不可不勉歸之十月以疾卒享年十有八實景祐一年九月也後十有九年從其姑葬于吉州吉水縣沙溪之山乃命千之序而銘其壙曰其居忽兮而逝也遽其殁久矣一作兮而悲如新一言以志兮千萬歲之存外集卷第十二張氏墓銘其先恕本作張氏荆門荆作薊其家一作居益益上有族字嘗世家嘗作當家上有名字節之無之字跋墜作跛墮及其作及見其夫莫見見作及謝賔客魚袋無袋字張司録山東山下有南字可兼可作得先君墓表皆無恨一作皆無有恨通州判官石本瀧岡阡表作道州歲取百千百一作十抱汝文篡作劒汝吉綿本誤收天水尹府君及黃夫人墓志銘乃尹師魯文在河南集第十五卷今刪去奏議卷第十二歐陽文忠公集一百八銓部論權貴子弟衝移選人劄子至和元年六月判流內銓臣勘會銓司近年選人倍多員闕常少待闕者多是孤寒貧乏之人得替住京動經年歲遇有合入闕次多𬒳權貴之家將子弟親戚陳乞便行衝改或已注授者且一無者字且字一作却令待闕或才到任者即𬒳對移只就權貴勾當家私不問孤寒便與不便兼臣所見臣寮陳乞多非急切事故或云近便鄉里或云看覷墳塋僥幸希求妄託名目孤寒阻滯徒益怨嗟臣欲乞今後臣寮須有急切事故如委任邊寄不許般家及致仕分司丁憂病患之類方許陳乞子弟差遣其一有餘字雖無事故自將恩澤陳乞者許銓司勘會如巳注人者更不改注已到任者更不衝移並令別其陳乞仍不許連併陳乞兩任如允臣所請乞下銓司遵守施行今取進止依奏并下三班審官並依此翰苑論臣寮奏帶指使差遣劄子至和元年九月兼三班院臣等勘會本班見管使臣至八千餘員其入仕之源既巳冗濫及差遣之際又多有因緣附權貴者僥幸多門致孤寒者怨嗟不巳伏見近年文武臣寮出外任者多帶指使隨行不久便奏乞監押巡檢差遣仍多指定去處陳乞亦有元只是諸司職掌人奏帶隨行後來改轉班行並不曽歷短使監當差遣便入監押巡檢親民亦無合入逺近路分取便指射有職田處朝廷以重違臣寮奏請更不勘會差遣資序路分逺近合與不合入得便行差除相繼成例近日漸多合行釐革臣今欲乞今後臣寮奏帶隨行指使之人及三年巳上並只與理為一任候歸班依例差遣外更不得陳乞差遣所貴止絶僥幸今取進止論史館日曆狀嘉祐四年誤置于此右臣伏以史者國家之典法也自君臣善惡功過與其百事之廢置可以垂勸戒示後世者皆得直書而不隱故自前世有國者莫不以史職為重伏見國朝之史以宰相監修學士修撰又以兩府之臣撰時政記選三館之士當升擢者乃命修起居注如此不為不重矣然近年以來員具而職廢其所撰述簡略遺漏百不存一至於事關大體者皆沒而不書此實史官之罪而臣之責也然其弊在於修撰之官惟據諸司供報而不敢書所見聞故也今時政記雖是兩府臣寮修纂然聖君言動有所宣諭臣下奏議事關得失者皆不紀一作記録惟書除目辭見之類至於起居注亦然與諸司供報公文一作文字無異修撰官只據此銓次繫一作排以月日一作日月謂之日曆而已是以朝廷之事史官雖欲書而不得書也自古人君皆不自閲史今撰𫐠既成必録本進呈則事有諱避史官雖欲書而又不可得一作取書也加以日曆時政記起居注例皆承前積滯相因故纂録者常務追修纍年前事而歲月既逺遺失莫存至於事在目今可以詳於見聞者又以追修積滯不暇及之若不革其弊則前後相因史官永無舉職之時使聖朝典法遂成一有於字廢墜矣一無此字臣竊聞一作見趙元昊自初僣叛至復稱臣始終一宗事節皆不曽書亦聞修撰官甚欲紀𫐠以修纂後時追求莫得故也其於他事又可知焉臣今欲乞特詔修時政記起居注之臣並以德音宣諭臣下奏對之語書之其修撰官不得依前只據諸司供報編次除目辭見並須考驗事實其除某官者以某功如狄青等破儂智髙文彥博等破王則之類其貶某職者坐某罪如昨來麟州守將及并州龐籍緣白草平事近日孫沔所坐之類事有文據及迹狀明白一作分明者皆備書之所以使聖朝賞罰之典可以勸善懲惡昭示後世若大臣用情朝廷賞罰不當者亦得以書為警戒此國家置史之本意也至於其他大事並許史院據所聞見書之如聞見未詳者直牒諸處會問及臣寮公議異同朝廷裁置處分並書之已上事節並令修撰官逐時旋據所得録為草卷標題月分於史院躬親入匱封鎖候諸司供報齊足修為日曆仍乞每至歲終命監修宰相親至史院點檢修撰官紀一作記録事迹內有不勤其事墮一作㤢官失職者奏行責罰其時政記起居注日曆等除今日以前積滯者不住追修外截自今後並令次月供報如稍遲滯許修撰官自至中書樞密院催請其諸司供報拖延及史院有所會問諸處不畫時報應致妨修纂者其當行手分並許史院牒開封府勾追嚴斷其日曆時政記起居注並乞更不進本所貴少修史職上存聖朝典法此乃臣之職事不敢不言謹具狀奏聞伏候勑旨請駕不幸溫成廟劄子至和二年臣伏見今月八日聖旨踈決禁囚特行減降及軍士各有特支陛下聖慈本以興國寺奉安真宗皇帝御容有此恩旨而中外之議紛然不一皆云正月八日是溫成皇后周年故有此特支踈決又見聖駕朝謁萬壽宫又云溫成畫像在彼所以聖駕親臨蓋為自去年追册溫成皇后之後朝廷每於典禮過極優崇遂致議者動皆疑惑今又聞來日聖駕幸奉先寺酌獻宣祖皇帝外議喧然又云溫成皇后祠廟在彼伏以陛下聖德仁孝本為祖宗神御以時酌獻不可使中外議者言陛下意在追念後宫寵愛託名以謁祖宗虧損聖德其事不細臣欲乞明日幸奉先寺酌獻畢更不臨幸溫成祠廟以解中外之疑以止議者之説臣職忝侍從無所禆輔聞外人議論不敢不言不惟臣有愛君之心合具陳述陛下舉動為萬世法亦不可不愼取進止論臺諫官言事未蒙聽允書至和二年月日具官臣歐陽某謹昧死再拜上書于體天法道欽文聰武聖神孝德皇帝闕下臣聞自古有天下者莫不欲為治君而常至於亂莫不欲為明主而常至於昏者其故何哉患於好疑而自用也夫疑心動於中則視聽惑於外視聽惑則忠邪不分而是非錯亂是非錯亂則舉國之臣皆可疑盡疑其臣則必自用其所見夫以疑惑錯亂之意而自用則多失一有多字失則其國之忠臣必以理而爭之爭之不切則人主之意難回爭之切則激其君之怒心而堅其自用之意然后君臣爭勝於是邪佞之臣得以因隙而入希旨順意以是為非以非為是惟人主之所欲者從而助之夫為人主者方與其臣爭勝而得順意之人樂其助已而忘其邪佞也乃與之并力以拒忠臣夫為人主者拒忠臣而信邪佞天下無不亂人主無不昏也自古人主之用心非惡忠臣而喜邪佞也非惡治而好亂也非惡明而欲昏也以其好疑自用而與下爭勝也使為人主者豁然去其疑心而回其自用之意則邪佞逺而忠言入忠言入則聰明不惑而萬事得其冝使天下尊為明主萬世仰為治君豈不臣主俱榮而樂哉與其區區自執而與臣下爭勝用心益勞而事益惑者相去逺矣臣聞書載仲虺稱湯之德曰改過不吝又戒湯曰自用則小成湯古之聖人也不能無過而能改過此其所以為聖也以湯之聰明其所為不至於繆戾矣然仲虺猶戒其自用則自古人主惟能改過而不敢自用然後得為治君明主也臣伏見宰臣陳執中自執政以來不叶人望纍有過惡招致人言而執中遷延尚玷宰府陛下憂勤恭儉仁愛寬慈堯舜之用心也推陛下之用心天下冝至於治者久矣而紀綱日壞政令日乖國日益貧民日益困流民滿野濫官滿朝其亦何為而致此一作皆由陛下用相不得其人也近年宰相多以過失因言者罷去陛下不悟宰相非其人反疑言事者好逐宰相疑心一生視聽既惑遂成自用之意以謂宰相當由人主自去不可因言者而罷之故宰相雖有大惡顯過而屈意以容之彼雖惶恐自欲求去而屈意以留之雖天災水旱飢民流離死亡道路皆不暇顧而屈意以用之其故非他直欲沮言事者爾言事者何負於陛下哉使陛下上不顧天災下不恤人言以天下之事委一不學無識諂邪狠愎之執中而甘心焉言事有本欲益於陛下而反損聖德者多矣然而言事者之用心本不圖至於此也由陛下好疑自用而自損也今陛下用執中之意益堅言事者攻之愈切陛下方思有以取勝於言事者而邪佞之臣得以因隙而入必有希合陛下之意者將曰執中宰相不可以小事逐不可使小臣動搖甚者則誣言事者欲逐執中而引用他人陛下方患言事者上忤聖聰樂聞斯言之順意不復察其邪佞而信之所以拒言事者益峻用執中益堅夫以萬乘之尊與三數言事小臣角必勝之力萬一聖意必不可回則言事者亦當知難而止矣然天下之人與後世之議者謂陛下拒忠言庇愚相以陛下為何如主也前日御史論梁適罪惡陛下赫怒空臺而逐之而今日御史又復敢論宰相不避雷霆之威不畏權臣之禍此乃至忠之臣也能忘其身而愛陛下者也陛下嫉之惡之拒之絶之執中為相使天下水旱流亡公私困竭而又不學無識憎愛挾情除改差繆取笑中外家私穢惡流聞道路阿意順旨專事逢君此乃諂上傲下愎戾之臣也陛下愛之重之不忍去之陛下睿智聰明羣臣善惡無不照見不應倒置如此直由言事者太切而激成陛下之疑惑爾執中不知廉耻復出視事此不足論陛下豈忍因執中上纍聖德而使忠臣直士卷舌於明時也臣願陛下廓然回心釋去疑慮察言事者之忠知執中之過惡悟用人之非法成湯改過之聖遵仲虺自用之戒盡以御史前後章疏出付外廷議正執中之過惡罷其政事别用賢材以康時務以拯斯民以全聖德則天下幸甚臣以身叨恩遇職在論思意切言狂罪當萬死臣昧死再拜論修河第一狀同前右臣竊見朝廷近因臣寮建議欲塞商胡開橫壠回大河於故道已下三司候今秋興役見令京東計度物料次臣伏以國家興大役動大衆必先順天時量人力謀於其始而審然後必行計其所利者多乃能無悔伏見比年以來興役勤一作動衆勞民費財不精謀慮於厥𥘉輕信利害之偏説舉事之始一作𥘉既已蒼惶羣議一搖尋復悔罷臣不敢逺引他事上煩聖聰只如往年河決商胡是時執政之臣不愼計慮遽謀修塞科配一千八百萬梢芟搔動六路一百有餘州一有軍字官吏催驅急若星火民庶愁苦盈於道塗或物己輸官或人方在路未及興役遽已罷修虛費民財為國斂怨舉事輕脫為害若斯雖既往之失難追而可鑒之蹤未逺今者又聞復有修河之役聚三十萬人之衆開一千餘里之長河計其所用物力數倍往年當此天災歲旱之時民困國貧之際不量人力不順天時臣知其有大不可者五蓋自去秋以及今春半天下苦旱而京東尤甚河北次之國家常務安靜振恤之猶恐飢民起而為盜何況於此兩路聚大衆興大役此其必不可者一也河北自恩州用兵之後繼以凶年人户流亡十失八九數年以來人稍一作稍梢歸復然死亡之餘所存無一作者幾瘡痍未斂物力未完一作充今又遭此旱歲京東自去冬無雨雪麥不生苗巳及莫春粟未布種不惟目下乏食兼亦向去無望而欲於此兩路興三十萬人之役若别路差夫則逺處難為赴役就河便近則此兩路力所不任此其必不可者二也臣伏見往年河決滑州曽議修塞當時公私事力未如今日貧虛然猶收聚物料誘率民財數年之間方能興役況今國用方乏民力方疲且合商胡塞大決之洪流此自是一大役也鑿橫壠開久廢之故道此又一大役也自橫壠至海一千餘里掃岸久巳廢壞頓須修緝此又一大役也往年公私有力之時興一大役尚須數年今併三大役倉卒興為一無為字於災旱一作於旱歲貧虛之際此其必不可者三也就令商胡可塞故道可回猶冝重一作審察天時人力之難為何況商胡未必可塞故道未必可回者哉臣聞鯀障一作湮洪水九年無功禹得洪範五行之書知水趨一作潤下之性乃因水之流疏決就下而水患乃息然則以大禹之神功不能障塞其流但能因而疏決爾今欲逆水之性障而塞之奪洪河之正流斡以人力而回注此大禹之所不能此其必不可者四也橫隴湮塞巳二十年啇胡決流一作流決又亦數歲故道已塞一作平而難鑿安流巳久而難回昨聞朝廷曽遣故樞密直學士張奎計度功料極大近者再行檢計減得功料全少功料少則所開淺狹淺狹則水勢難回此其必不可者五也臣伏見國家纍歲災譴甚多其於京東變異尢大地貴安靜動而有聲巨嵎山摧海水搖蕩如此不止僅乎十年天地警戒必不虛發臣謂變異所起之方尤宜加意防懼今乃欲於凶旱之年聚三十萬之大衆於變異最大之方臣恐地動山搖災禍自此而始一作自兹而發也方今京東赤地千里飢饉之民正苦天災又聞河役將動往往伐桑拆一作毀屋無復生計流亡盜賊之患不可不虞欲望聖慈特降德音速罷其事當此凶一作荒歲務安人心徐詔有司審詳利害縱令河道可復乞候一作俟豐年餘力漸次興為臣實庸愚本無逺見得於外論不敢不言謹具狀奏聞論雕印文字劄子至和二年臣伏見朝廷纍有指揮禁止雕印文字非不嚴切而道日雕板尤多蓋為不曽條約書鋪販賣之人臣竊見京城近有雕印文集二十卷名為宋文者多是當今論議時政之言其首篇是冨弼往年讓官表其間陳北虜事冝甚多詳其語言不可流布而雕印之人不知事體竊恐流布漸廣傳入虜中大於朝廷不便及更有其餘文字非後學所須或不足為人師法者並在編集有誤學徒臣今欲乞明降指揮下開封府訪求板本焚毀及止絶書鋪今後如有不經官司詳定妄行雕印文集並不得貨賣許書鋪及諸色人陳告支與賞錢二伯貫文以犯事人家財充其雕板及貨賣之人並行嚴斷所貴可以止絶者今取進止奏議卷第十二論臺諌官言事書是非錯亂則舉國之臣皆可疑是字上脫去忠邪不分而五字盡疑盡字上一有既字與下爭勝與字下一有臣字沮言事者沮一作挋論修河第一狀乃能一作可巳及一作將踰逺處一作逺就河便近一作一出諸近收聚一作儲積因而疏決因字下一有勢字論史館日曆狀亦得以書一作亦得書以居士集卷第十二歐陽文忠公集十律詩五十六首送一作寄謝中舍二首滁南一作陽幽谷抱山斜我鑿清泉子種花故事巳傳遺一作留傳父老説世人今一作分作畫圖誇金閨引籍子方壯白髮盈簪我可嗟試問弦歌為縣政一作意何如樽爼樂無涯喜聞嘉譽藹淮壖又看吳一作送征帆解畫船隴畒遺民談舊政江山餘思入新篇人生白首一作憂傷白髮吾今爾仕路一作宦青雲子勉旃舉棹南風吹酒醒離觴莫惜少一作更留連酬張器判官泛溪園林𥘉夏有清香人意乘間味愈長日暖魚跳波面靜風輕鳥語樹隂涼野亭飛蓋臨芳草曲渚回舟帶夕陽所得平時為郡樂况多嘉客共銜觴西園石榴盛開荒臺野徑共躋攀正見榴花出短垣緑葉晚鶯啼處密紅房𥘉日照時繁最憐夏景鋪珍簟尤愛晴香入睡軒乘興便當携酒去不須旌騎擁車轅西湖戲作示同遊者一作𥘉泛西湖菡萏香清一作緑芰紅蓮畫舸浮使君寧一作不復憶揚州都將二十四橋月換得西湖十頃秋夢中作夜涼吹笛千山月路暗迷人百種花棊罷不知人換世酒闌無奈客思家秀才歐世英惠然見訪於其還也聊以贈之相逢十年舊暫喜一樽同昔日青衫令今為白髮翁俟時君子守一作處求士有司公況子之才美焉能久困窮送楊君之任永康劒峯雲棧未嘗行圖畫曽看巳可驚險若登天懸鳥道下臨無地㵼江聲折腰莫以微官恥為政須通異俗情況子多才兼美行薦章期即逹承明紀德陳情上致政太傅杜相公二首一云與丞相太傅杜公唱和一十二首自此而下儉節清名世絶倫坐令風俗可還淳貌先年老因憂國事與心違始乞身四海儀刑瞻舊德一樽談笑作間人鈴齋幸得親師席東向時容問治民事國一心勤以一作且瘁還家五福壽而康風波已出憑忠信松柏難凋耐雪霜昔日青衫遇知己今來白首再升堂里門每入從千騎賔主俱榮道路光太傅杜相公索聚星堂詩謹成一本云太傅相公寵答佳篇仍索拙詩副本謹吟成四韻以敘鄙懷楚肆固知難衒玉丘門安敢輒論詩藏之十襲真無用報以雙金豈所一作自冝已恨語言多猥冗況因杯杓一作酌正淋漓願投几格資咍噱欲展須於欲睡時和太傅杜相公寵示之作一本屢賜嘉篇褒借謹依元韻聊述愧佩之意平生孤拙荷公知敢向公前自衒詩憂患飄流誠已甚文辭衰落固其冝非髙僅比巴音下少味還同魯酒漓兩辱嘉篇永為寶豈惟榮耀詫當時太傅杜相公有答兖州待制之句其卒章云獨無風雅可流傳因輒成一本作因成四韻南都已見成新集東魯休嗟未作詩霖雨曽為天下福甘棠何止郡人思元劉事業時無取姚宋篇章世不知二美惟公所兼有後生何者欲攀追依韻答杜相公寵示之作一本云伏蒙寵示佳篇以不赴東園之會某亦經春多病誠有可嗟謹依元韻輒紓鄙素一本於經春多病下文有略無少暇四字醉翁豐樂一間身憔悴今來汴水濵每聽鳥聲知改節因吹柳絮惜殘春蓋經春罕見花也平生未省降詩敵近數和難韻甚覺牽強到處何嘗訴酒巡壯志銷磨都已盡看花翻作飲茶人依韻和杜相公喜雨之什歲時豐儉若循環天幸非由一作因拙政然一雨雖知為美澤三登猶未一作未足輔凶年京東纍歲不熟桑隂蔽日交垂路麥穗含風秀滿田千里郊原想如畫正冝携酒望晴川謝太傅杜相公寵示嘉篇凛凛節竒霜澗柏昭昭心瑩玉壷冰正身尚可清風俗當暑何須厭鬱蒸麈柄屢揮容一作曽請益龍門雖峻忝先登立朝行已師資久寧止篇章此服膺答杜相公寵示去思堂詩當年丞相倦洪鈞弭節𥘉來潁水濆惟以琴樽樂嘉客能將冨貴比浮雲西溪水色春長緑北渚花光暖一作老自薰去思堂在北渚之北臨西溪溪晏公所開也得載公詩播人口去思從此四夷聞答太傅相公見贈長韻蹤迹本羈單登門二十年平生任愚拙自進恥因緣憂患經多矣疲駑尚勉旃凋零鶯谷友修與尹師魯蘇子美同出門下憔悴鴈池邊忽忽良時失區區俗慮闐公齋每偷暇師席屢攻堅善誨常一本作當無倦餘談亦可編每接公論議皆立朝行已之節至於談笑之間亦多記朝廷故事皆可紀録以貽後生仰髙雖莫及希驥豈非賢報國如乖願歸耕寧買田期無辱知已肯逐利名遷借觀五老詩次韻為謝一本注云即丞相杜公太子賔客王渙光祿卿畢世長兵部郎中朱貫尚書郎馮平脫遺軒冕就安間笑傲丘園縱倒冠白髮憂民雖種種丹心許國尚桓桓鴻冥得路髙難慕松老無風韻自寒聞説優遊多唱和新篇何惜盡一作為傳一作畫圖看答杜相公惠詩一本云近以藥苗茶具為獻伏蒙報以嘉篇云云謹於别韻課成一首藥苗本是山一作仙家味茶具偏於野客冝敢以微誠將薄物少資清興入新詩言無俗韻精而徑筆有神鋒老更竒二寶收藏傳百一作在世豈惟榮耀詫當時去思堂手植雙柳今巳成隂因而有感曲欄髙柳拂層􅉉却憶𥘉栽映碧潭人昔共遊今孰在樹猶如此我何堪壯心無復身從老世事都銷酒半酣後日更來知有幾攀條莫惜駐征驂和陸子履再遊城西李園京師花木類多竒常恨春歸人不歸車馬喧喧走塵土園林處處鎖芳菲殘紅巳落香猶在羇客多傷涕自揮我亦悠然無事者約君聮騎訪郊圻內直對月寄子華舍人持國廷評一作呈原父禁署一作省沉沉玉漏傳月華雲表溢金盤纎埃不隔光𥘉滿萬物無聲夜向闌蓮燭燒殘愁夢斷蕙爐薰歇覺衣單水精宫鎖黃金闕故比人間分外寒答子華舍人退朝小飲官舍一作和子華朝退寒甚陪諸公飲玉階朝罷卷晨班官舍相留一笑間與世漸踈嗟巳老一作緣老態得朋為樂偶偷間紅箋搦管吟紅藥緑酒盈樽舞緑鬟自是風情年少事多慙白髮與蒼顔內直晨出便赴奉慈齋宫一作宿馬上口占一本云呈子華子履凌晨更直九門開驅馬悠悠望禁街霜後樓臺明曉日天寒煙霧著宫櫰山林未去猶貪寵樽酒何時共放懷巳覺蕭條悲晚歲更憐衰病怯清齋景靈朝謁從駕還宫琳館清晨藹瑞氛玉旒朝罷奏韶鈞緑槐夾路飛黃蓋翠輦鳴鞘向一作入紫宸金闕日髙猶泫露綵旗風細不驚塵自慙白首追時彥行近儲胥忝侍臣憶滁州幽谷滁南一作豐山幽谷抱千峯髙下山花遠近紅當日辛勤皆手植而今開落任春風主人不覺悲華髮野老猶能説醉翁誰與援琴親寫取夜泉聲在翠微中和韓學士襄州聞喜亭置酒一作和欽聖學士聞喜置酒即事嶻嶭髙城漢水邊登臨誰與共躋攀清川萬古流不盡白鳥雙飛意自間可笑沉碑憂岸谷誰能把酒對江山少年我亦曽遊目風物今思一夢還寄題梅龍圖滑州溪園一作西溪聞説溪園景漸佳遙知清興已無涯飲闌歸騎多一作去乘月雪後尋春自探花百囀黃鸝消永日雙飛白鳥避鳴笳平生喜接君酬一作嗟豫每許陪髙唱不得樽前詠落霞奉使道中五言長韻初旭一作日瑞霞烘都門祖帳供親持使者節曉出大明宫城闕青煙起樓臺白霧中繡韀一作鞍驕躍躍貂袖紫蒙蒙朔野驚飊慘邊城畫角雄過橋分一水回首羡南鴻地里山川隔天文日月同兒童能走馬婦女亦腰弓度險行愁失盤髙路欲窮一作斗絶誇天險髙盤畏路窮山深聞喚鹿林黑自生一作成風松壑寒逾響冰溪一作溪流咽復通望平愁驛逈野曠覺天穹駿足來山北輕禽出海東合圍飛走盡移帳水泉空講信鄰方睦尊賢禮亦隆斫一作研冰燒酒赤凍一作斫膾縷霜紅白草經春在黃沙盡日濛新年風漸變歸路雪初融祗事須強力嗟豫乃病翁深慙漢蘇武歸國不論功奉使契丹初至雄州一作過塞古關衰柳聚寒鴉駐馬城頭日欲斜一作駐馬關頭見落霞猶去西樓二千里行人到此莫思家奉使契丹回出上京馬上作紫貂裘暖朔風驚潢水冰光射日明笑語同來向公子馬頭今日向南行送渭州王龍圖漢軍一作兵十萬控山河玉帳優遊暇日多夷狄從來懷信義廟堂今不用干戈吟餘畫角吹殘月醉裏紅燈炫綺羅此樂直須年少壯嗟余心志已蹉跎李留後家聞箏坐上作余少時嘗聞一鈞容老樂工箏聲與時人所彈絶異云是前朝教坊舊聲其後不復聞至此始復一聞也不聽哀箏二十年忽逢纎指弄鳴絃綿蠻巧囀花間舌嗚咽交流冰下泉常謂此聲今已絶問渠從小自誰傳樽前笑我聞彈罷白髮蕭然涕泫然送鄆州李留後北州遺頌藹嘉聲東土還聞政有成組甲光寒圍夜帳綵旗風暖看春耕金叉墜鬢分行立玉麈髙談四坐傾冨貴常情誰不羡愛君風韻有餘清子華學士儤直未滿遽出館伴病夫遂當輪宿輒成拙句奉呈萬釘寶帶爛腰鐶賜一作錫宴新陪一笑歡金馬並遊年最少玉堂𥘉直夜猶寒自嗟零一作流落凋顔鬢晚得飛翔接羽翰今日遽聞催遞宿不容多病養衰殘禮部貢院閲進士就試自此而下二十首皆禮部貢院唱和一本云凡二十二首蓋二首見外集紫案焚香暖吹輕廣庭清曉席羣英無譁戰士銜枚勇下筆春蠶食葉聲鄉里獻賢光德行朝廷列爵待公卿自慙衰病心神耗賴有羣公鑒裁一作擇又作識精和梅聖俞元夕登東樓遊豫恩同萬國歡新年佳節候𥘉還華燈爍爍春風裏黃傘亭亭瑞霧間可愛清光澄夜色遙知喜氣動天顔自憐曽預一作與稱觴列獨宿冰廳夢帝關再和禁城車馬夜喧喧間繞危欄一作樓去復還遙望觚稜煙靄外似聞天樂夢魂間豈無樽酒當佳節況有朋歡慰病顔待得歸時花在否春禽􅉉際巳關關又和憑髙寓目偶乘間祇服遊人見往還明月正臨雙闕上行歌遙聽九衢間黃金絡一作束馬追朱幰紅燭籠紗照玉顔與世漸一作已踈嗟老矣佳辰樂事豈相關憶鶴呈公儀一作和公儀憶鶴一笑相歡一作從樂得朋誦君雙鶴句尤清髙懷自喜凌雲格俗耳誰思警露聲所好與時雖異趣纍心於物豈非情歸休約我携琴去共看婆娑舞月明答王禹玉見贈一作和禹玉書事昔時叨入武成宫曽看揮毫氣吐虹夢寐間思十年舊一作事笑談今此一樽同喜君新賜黃金帶顧我冝為白髮翁自古薦賢為報國幸依精識士稱公答王內翰范舍人一本云敘懷謝景仁禹玉相從一笑歡無厭屢獲新篇喜可涯自昔居前誚粳秕幸容相倚愧蒹葭白麻詔令追三代一本注禹玉年前方入翰林青史文章自一家一本注景仁修撰又同書局我亦諫垣新忝命君恩未報髮先華禹玉新除學士景仁新兼修撰戲答聖俞持燭之句辱君贈我言雖厚聽我酬君意不同病眼自憎紅蠟燭何人肯伴白鬚翁花時浪過如春夢酒敵先甘伏下風惟有吟哦殊不倦始知文字樂無窮小桃一作和公儀正月桃雪裏花開人未知摘來相顧共驚疑便當索酒花前醉𥘉見今年第一枝戲書支離多病歎衰顔賴得一作有羣居一笑歡人老思家甚年少身間泥酒過春寒來時御柳一作水天街凍歸去梨花禁籞殘縱使開門佳節晚未妨雙鶴舞霜翰一作朝鎖漢臺空悵望欲將春恨託飛翰春雪一本上有和聖俞字逗曉一作户風聲惡褰簾雪勢斜應憐未歸客故勒欲開花病思寒添睡春愁夢在家誰能慰寂寞惟有酒如霞和梅公儀嘗茶溪山擊鼓助雷驚逗曉靈芽發翠莖摘處兩旗香可愛貢來雙鳯品尤精寒侵病骨惟思睡花落春愁未解酲喜共紫甌吟且酌羡君蕭灑有餘清和較藝書事一作奉答禹玉再示之作相隨懷詔下天閽一鎖南宫隔幾旬玉麈清談消永日金樽美酒惜餘春杯盤餳粥春風冷池館榆錢夜雨新猶是人間好時節歸休過我莫辭頻和一作戲答公儀贈白一本無白字鷴梅公憐我髭如雪贈以雙禽一作鷴意有云但見尋常思白兔便疑不解醉紅裙吟齋雖喜留間客野性寧忘在嶺雲我有銅臺方尺瓦慙非玉案欲酬君再和用其韻一作依韻再答公儀白鷴佳玩能令百事忘豈惟間伴倒餘缸珍竒來自海千里皎潔明如璧一雙日暖朝籠青石砌春寒夜宿碧紗窗蠻煙瘴霧雖生處何必區區憶陋邦和聖俞春雨􅉉瓦蕭蕭雨勢踈寂寥官舍與君俱身遭鎖閉如鸚鵡病識隂晴似鵓鴣年少自愁花爛熳春寒偏著老肌膚莫嫌來往傳詩句不爾須當泥酒壷出省有日書事凌晨小雨壓塵輕間憶登髙望禁城樹色連雲春泱漭風光著草日晴明看榆吐莢驚將落見鵲移巢忽已成誰向兒童報歸日為翁寒食少一作且留餳和一本有禹玉字較藝將畢槐柳來時緑未勻開門節物一畨新踏青寒食追遊騎賜火清明忝侍臣拂面蜘蛛占喜事入簾蝴蝶報家人在李賀詩莫瞋年少思歸切白髮衰翁尚惜春喜定號和禹玉內翰用其韻一作和禹玉喜定號衡鑒慙叨選英豪此所鍾古今參雅鄭善惡雜皋共揮翰飄飄思懷竒落落胸披文驚可畏奏下始開封但喜真才得寧一作何虞橫議攻欲知儒學盛首善本三雍和出省國朝之制禮部考定卷子奏上字號差臺官一人折封出榜一作和公儀上馬有作僮奴一作奴僮襆𬒳莫相催待報霜臺御史來晴陌便當聮騎去春風任放百花開文章紙貴爭一作看馳譽朝野人言慶得才共向丹墀侍一作待臨選莫驚鱗鬛化風雷居士集卷第十二熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正紀德陳情上致政太傅杜相公二首京本作某啓謹吟成紀德陳情拙詩二章拜獻太傅相公雖不足遊揚大君子之盛美亦聊伸門下小子區區感遇之心干冒台嚴伏惟俯賜采覽太傅杜相公索聚星堂詩謹成京本作某啓伏蒙太傅相公寵答佳篇仍索拙詩副本謹吟成四韻以敘鄙懷兼伸感慰和太傅杜相公寵示之作京本作某啓伏蒙纍賜嘉篇過形褒借在於庸拙何以當之謹依元韻課成一首聊述愧佩之意依韻答杜相公寵示之作京本作某啓伏蒙寵示佳篇以不赴東園之會為恨某亦經春多病略無少暇誠有可嗟謹依元韻輒紓鄙素依韻和杜相公喜雨之什京本作某啓伏蒙太傅相公寵示喜雨之什過形奬誘感愧何勝謹依元韻奉和少伸鄙悰謝太傅杜相公寵示嘉篇京本作某啓代蒙寵示嘉篇謹課成七言四韻以敘謝答杜相公寵示去思堂詩京本作某啓伏蒙寵示去思堂詩曲有褒揚形于雅韻有以見大君子樂善之心而小子蒙幸之厚也謹課七言四韻敘謝答太傅相公見贈長韻京本作某啓伏蒙寵示長篇過褒後學其為榮幸何可勝言輒述鄙懷聊敘感槩隨髙韻文不盡誠仰浼台慈實深愧懼答杜相公惠詩京本作某啓近以藥苗茶具為獻伏蒙報以嘉篇而清韻孤髙無容攀企牽強纍日終不能成智力俱疲不知自止謹於别韻課成一首伏惟采覽右詩序定本雖從簡然公舊語不可不存酬張判官泛溪一作示泛溪之什贈歐世英之才美一作才之美手植雙柳從老一作徒憶幽谷寫取一作去和韓學士誰能一作惟當題滑州溪園遙知一作羡君奉使道中地里一作理文和梅聖俞元夕登東樓朱幰朱一作珠和出省聮騎一作連騎
