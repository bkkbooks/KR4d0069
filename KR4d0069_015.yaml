body:
  text: 序二刪正黃庭經序無僊子者不知爲何人也無姓名無爵里世莫得而名之其自號爲無僊子者以警世人之學僊者也其爲言曰自古有道無僊而後世之人知有道而不得其道不知無僊而妄學一作求僊此我之所哀也道者自然之道也生而必死亦自然之理也以自然之道養自然之生不自戕賊夭閼而盡其天年此自古聖智之所同也禹走天下乘四載治百川可謂勞其形矣而壽百年顔子蕭然卧於陋巷簞食瓢飲外不誘於物内不動於心可謂至樂矣而年不及三十斯二人者皆古之仁人也勞其形者長年安其樂者短命盖命有一作之長短禀之於天非人力之所能爲也惟不自戕賊而各盡其天年則二人之所同也此所謂以自然之道養自然之生後世貪生之徒爲養生之術者無所不至至茹草木服金石吸日月之精光又有以謂此外物不足恃而反求諸内者於是息慮絶欲鍊精氣勤吐納專於内守以養其神其術雖本於貪生及其至也尚或可以全形而却疾猶愈於肆欲稱情以害其生者是謂養内之術故上智任之自然其次養内以却疾最下妄意而貪生世傳黄庭經者魏晉間道士養生之書也其說專於養内多竒恠故其傳之久則易爲訛舛今家家異本莫可考正無僊子既甚好古家多集錄古書文字以爲翫好之娯有黃庭經石本者廼永和十三年晉人所書其文頗簡以較今世俗所傳者獨爲有理疑得其眞於是喟然嘆曰吾欲曉世以無僊而止人之學者吾力顧未能也吾視世人執竒恠訛舛之書欲求生而反害其生者可不哀哉矧以我翫好之餘拯世人之謬惑何惜而不爲乃爲刪正諸家之異一以永和石本爲定其難曉之言略爲注解庶㡬不爲訛謬之說惑世以害生是亦不爲無益若大雅君子則豈取於此送王聖紀赴扶風主簿序前年五月大霖雨殺麥河溢東畿浸下田巳而不雨至于一作於八月菽粟死髙田三司有言前時溢博州民冒河爲言得免租者盖萬計今歳秋當租懼民幸水旱因縁得妄免以虧兵食慎勑有司謹之朝廷因舉田令約束州縣吏吏無逺近皆望風惡民言水旱一以農田勑限甚者笞而絶之畿之民訴其縣不聽則訴於開封又不聽則相與聚立一作於宣德門外訴於宰相於是遣吏四出視諸縣視者還而或言災或言否然言否者十七八最後視者還言民實災而吏徒畏約束以苟自免爾天子聞之惻然盡蠲畿民之租余嘗竊歎曰民生幸而爲畿民有一作且緩急近而易知也雨降于天河溢于地與赤日之出是三者物之易見也前二三歳旱蝗相連朝廷歳歳隨其災之厚薄蠲其賦之多少至兵食不足則歳糴或入粟以爵而充之是在上者之愛人而仁人之心易惻也以易知之近言易見之事告易惻之仁然吏一壅之㡬不得逹况四海之大㡬萬里而逺事之難知不若霖潦赤日之易見者何數使上有惻之之心不得逹于下下有思告之苦不得通於上者吏居其間而壅之爾可勝歎哉扶風爲縣限關之西距京師在千里外民之不幸而事有隱微者何限其能生死曲直之者今與主簿尉三人而民之志得不壅而聞于州州不壅而聞于上縣不壅而民志通者令與主簿尉逹之而巳王君聖紀主簿於其縣聖紀好學有文佐是縣也始試其爲政焉故以夫素所歎者告之景祐三年二月二十四日廬陵歐陽脩序送太原秀才序仲尼之徒子思伋記中庸事列于曲臺學欲服圎冠習矩歩者皆造次必於中庸聞太原生得之矣生之履行無改是也月旅析木地居軫斿霜風動天萬竅號怒揺鞭長跋一作𡵨強飯自重時寳元二年十月初七日乾德令尹歐陽脩序傳易圖序孟子曰盡信書不如無書夫孟子好學者豈獨忽於書哉盖其自傷不得親見聖人之作而傳者失其真莫可考正而云也然豈獨無書之如此余讀經解至其引易曰差若毫釐謬以千里之說又讀今周易有何謂子曰者至其繫辭則又曰聖人設卦繫辭焉欲考其真而莫可得然後知孟子之嘆盖有激云爾說者言當秦焚書時易以卜筮得獨不焚其後漢興他書雖出皆多殘缺而易經以故獨完然如經解所引考於今易亡之豈今易亦有亡者耶是亦不得爲完書也昔孔子門人追記其言作論語書其首必以子曰者所以别夫子與弟子之言又其言非一事其事非一時文聮屬而言難次第故每更一事必以子曰以起之若文言者夫子自作不應自稱子曰又其作於一時文有次第何假子曰以發之乃知今周易所載非孔子文言之全篇也蓋漢之易師擇取其文以解卦體至其有所不取則文斷而不屬故以子曰起之也其先言何謂而後言子曰者乃講師自爲答問之言爾取卦體以爲答也亦如公羊榖梁傳春秋先言何曷而後道一作導其師之所傳以爲傳也今上繫凡有子曰者亦皆講師之說也然則今易皆出乎講師臨時之說矣幸而講師所引者得載於篇不幸其不及引者其亡豈不多邪嗚呼歷弟子之相傳經講師之去取不徒存者不完而其僞謬之失其可究邪夫繫者有所繫之謂也故曰繫辭焉以斷其吉凶是故謂之爻言其爲辭各聮屬其一爻者也是則孔子專指爻辭爲繫辭而今乃以孔子賛易之文爲上下繫辭者何其謬也卦爻之辭或以爲文王作或以爲周公作孔子言聖人設卦繫辭焉是斥文王周公之作爲繫辭不必復自名其所作又爲繫辭也況其文乃槩言易之大體雜論易之諸卦其辭非有所繫不得謂之繫辭也必然自漢諸儒已有此名不知從何而失之也漢去周最近不應有失然漢之所爲繫辭者得非不爲今之繫辭乎易需之辭曰需于血出自穴艮之辭曰艮其限列其夤睽之辭曰見豕負塗載鬼一車是皆險怪竒絶非世常言無爲有訓故一作詁考證而學者出其臆見隨事爲解果得聖人之㫖邪文言繫辭有可攷者其證如此而其非世常言無可攷者又可知矣今徒從夫臆出之說果可盡信之邪此孟子所歎其不如亡者也易之傳注比他經爲尤多然止於王弼其後雖有述者不必皆其授受但其傳之而已大抵易至漢分爲三有田何之易焦贛之易費直之易田何之易傳自孔子有上下二篇又有彖象繫辭文言說卦等自爲十篇而有章句凡學有章句者皆祖之田氏焦贛之易無所傳授自得乎一作之隱者之學專於隂陽占察之術凡學隂陽占察者皆祖之焦氏費直之易亦無所授又無章句惟以彖象文言等十篇解上下經凡以彖象文言等參入卦中者皆祖之費氏田焦之學廢於漢末費氏獨興遞傳至鄭康成而王弼所注或用康成之說比卦六四之類是弼即鄭本而爲注今行世者惟有王弼易其源出於費氏也孔子之古經亡矣月石硯屏歌序張景山在􅉑州時命治石橋小版一石中有月形石色紫而月白月中有樹森森然其文黒而枝葉老勁雖世之工畫者不能爲盖竒物也景山南謫留以遺予予念此石古所未有欲但書事則懼不爲信因令善畫工來松一作模寫以爲圖子美見之當愛歎也其月滿西旁微有不滿處正如十三四時其樹横生一枝外出皆其實如此不敢增損貴可信也七賢畫序某不幸少孤先人爲綿州軍事推官時某始生生四歳而先人捐館某爲兒童時先妣嘗謂某曰吾歸汝家時極貧汝父爲吏至亷又於物無所嗜惟喜賔客不計其家有無以具酒食在綿州三年他人皆多買蜀物以歸汝父不營二物而俸禄待賔客亦無餘已罷官有絹一匹畫爲七賢圖六幅此七君子吾所愛也此外無蜀物後先人調泰州軍事判官卒于任比某十許一作餘歳時家益貧每歳時設席祭祀則張此圗于壁先妣必指某曰吾家故物也後三十餘年圖亦故闇某忝立朝懼其久而益朽損遂取七賢命工装軸之更可傳百餘年以爲歐陽氏舊物且使子孫不忘先世之清風而示吾先君所好尚又以見吾母少寡而子㓜能克成其家不失舊物盖自先君有事後二十年某始及第今又二十三年矣事迹如此始爲作賛并序龍茶録後序茶爲物之至精而小團又其精者録敘所謂上品龍茶者是也蓋自君謨始造而歳貢焉一無此字仁宗尤所珍惜雖輔相之臣未嘗輙賜惟南郊大禮致齋之夕中書樞密院各四人共賜一餅宮人翦金爲龍鳯花草貼其上兩府八家分割以歸不敢碾試相一作但家藏以爲寳時有佳客出而傳翫爾至嘉祐七年親享明堂一有致字齋夕始人賜一餅余亦忝預至今藏之余自以諫官供奉仗内至登二府二十餘年纔一獲賜而丹成龍駕舐鼎莫及每一捧翫清血交零而巳因君謨著録輙附于後庶知小團自君謨始而可貴如此九字一作可貴而剏自君謨也治平甲辰七月丁丑廬陵歐陽脩書還公期書室傳桑懌傳桑懌開封雍丘人其兄慥本舉進士有名懌亦舉進士再不中去遊汝潁間得龍城廢田數頃退而力耕歳凶汝旁諸縣多盜懌白令願三字一作曰願令爲耆長徃來里中察姦民因召里中少年戒曰盜不可爲也吾在此不汝容也少年皆諾里老父子死未歛盜夜脫其衣里老父怯無他子不敢告縣臝其屍不能葬懌聞而悲之然疑少年王生者夜入其家探其篋不使之知覺明日遇之問曰爾諾我不爲盜矣今又盜里父子屍者非爾邪少年色動即推仆地縛之詰共盜者王生指某少年懌呼壯丁守王生又自馳取少年者送縣皆伏法又嘗之郟城遇尉方出捕盜招懌飲酒遂與俱行至賊所藏尉怯陽爲不知以過懌曰賊在此何之乎下馬獨格殺數人因盡縛之又聞襄城有盜十許人獨提一劒以徃殺數人縛其餘汝旁縣爲之無盜京西轉運使奏其事授郟城尉天聖中河南諸縣多盜轉運奏移澠池尉崤古險地多涂山而青灰山尤阻險爲盜所恃惡盜王伯者藏此山時出爲近縣害當此時王伯名聞朝廷爲廵檢者皆授名以捕之旣懌至廵檢者僞爲宣頭以示懌將謀招出之懌信之不疑其偽也因諜知伯所在挺身入賊中招之與伯同卧起十餘日信之乃出廵檢者反以兵邀於山口懌㡬不自免懌曰廵檢授名懼無功爾即以伯與廵檢使目爲功不復自言廵檢俘獻京師朝廷知其實罪黜廵檢懌爲尉歳餘改授右班殿直永安縣廵檢明道景祐之交天下旱蝗盗賊稍稍起其間有惡賊二十三人不能捕樞密院以傳召懌至京授二十三人名使徃捕懌謀曰盜畏吾名必已一作以潰潰則難得矣宜先示之以怯至則閉柵戒軍吏無一人得輒出居數日軍吏不知所爲數請出自效輒不許既而夜與數卒變爲盗服以出迹盗所嘗行處入民家民皆走獨有一媪留爲作飲食饋之如盗乃歸復閉柵三日又徃則携其具就媪饌而以其餘遺媪媪待以爲真盗矣乃稍就媪與語及群盗輩媪曰彼聞桑懌來始畏之皆遁矣又聞懌閉營不出知其不足畏今皆還也某在某處某在某所矣懌盡鉤得之復三日又徃厚遺之遂以實告曰我桑懌也煩媪爲察其實而慎勿泄後三日我復來矣後又三日徃媪察其實審矣明旦部分軍士用甲若干人於某所取某盗卒若干人於某處取某盗其尤彊者在某所則自馳馬以徃士卒不及從惟四騎追之遂與賊遇手殺三人凡二十三人者一日皆獲二十八日復命京師樞密吏謂曰與我銀爲君致閤職懌曰用賂得官非我欲況貧無銀有固不可也吏怒匿其閥以免短使送三班三班用例與兵馬監押未行㑹交趾獠叛殺海上廵檢昭化諸州皆警徃者數輩不能㝎因命懌徃盡手殺之還乃授閤門祗候懌曰是行也非獨吾功位有居吾上者吾乃其佐也今彼留而我還我賞厚而彼䡖得不疑我蓋其功而自伐乎受之徒慚吾心將讓其賞歸巳上者以奏藁示予予謂曰讓之必不聽徒以好名與詐取譏也懌歎曰亦思之然士顧其心何如爾當自信其心以行譏何累也若欲避名則善皆不可爲也已余慙其言卒讓之不聽懌雖舉進士而不甚知書然其所爲皆合道理多此類始居雍丘遭大水有粟二廪將以舟載之見民走避溺者遂棄其粟以舟載之見民荒歳聚其里人飼之粟盡乃止懌善劒及鐵簡力過數人而有謀略遇人常畏若不自足其爲人不甚長大亦自修爲威儀言語如不出其口卒然遇人不知其健且勇也廬陵歐陽脩曰勇力人所有而能知用其勇者少矣若懌可謂義勇之士其學問不深而能者蓋天性也余固喜傳人事尤愛司馬遷善傳而其所書皆偉烈竒節士喜讀之欲學其作而怪今人如遷所書者何少也乃疑遷特雄文善壮其說而古人未必然也及得桑懌事乃知古之人有然焉遷書不誣也知今人固有而但不盡知也懌所爲壯矣而不知予文能如遷書使人讀而喜否姑次第之外集卷第十五黃庭經序其生者者下有也字送王聖紀序前年前作二吏無無吏字言水旱旱下有事字訴於宰相四字作呌宰相以訴四出四作分畿民之三字作其㡬不得逹㡬一作畿霖潦二字作水旱易見見下又有也易一字通於於作于吏居居作隔生死曲直作曲直生死而民之志而下有巳凡二字聞于州聞于作逹乎于上作乎天子者縣不壅而民志通者巳上八字恕本作令與主簿尉先之而巳天子仁恩下而降于州州不壅而逹於縣縣不壅而得及於民亦凡三十三字接下文令與主簿尉云云主簿作爲尉佐是縣作其爲尉以夫二字作子因其行而以予二十四日作十日無二四及下六字送太原秀才序寳元二年十月乾徳令尹歐陽某序按是年六月公改武成判官明年二月當上此猶繫舊階疑未受命時作傳易圖序至其無其字有激云爾作有激而云也昔孔子子下有殁字其事無其字必以以作書夫子自作于下有所字取卦體體作辭其下有以爲問引文言六字僞謬僞作譌聮屬屬作繋孔子言孔上有故字不必作必不也必作必也其證證作謬知矣矣作也雖有述者者下有不得列于學官故上自孔子至于王弼迹其所自來以作斯圖自漢學者漸不師授而各自名家今圖之所傳者凡四十五字焦贛費直二字上各有有字自得作自言得之之學無之字漢末費氏末下有而字七賢畫序文纂作銘七賢畫事示焦生汪逵云此篇文體似非序但文纂作銘字可疑王深甫長樂集有信都公請作七賢圖詩其序云伏蒙出示先大夫所作七賢圖事又云咨求學文之士爲之頌賛將以刻石永告來裔而囘也不肖亦辱於此數則公所請作詩者不一也恕本作求七賢畫賛與焦伯強書無蜀物文纂作無一蜀物始爲賛文纂作試爲賛龍茶錄後序熈寧時文作題龍茶錄後汪逵云此篇似非序恕本作茶錄跋尾又一首贈薛少卿佳客時文作嘉客齋夕作致齋治平甲辰七月丁丑時文作治平元年七月十四日桑懌傳本舉無本字徃來文藪作得徃來徃來里中四字作得字爲也也作矣夜入作夜潜入其篋篋字下有中衣馳問里父是否里父言是即復馳還王生篋中凡二十字推仆文藪作椎仆轉運使文藪無使字崤古險崤下有澠字涂山涂作深捕之無之字宣頭無頭字授名名下有捕賊二字罪黜廵檢檢下有者字其間二字見作冀召懌至京此下脫一師字輒出出下有者字數日作十餘日民皆走民字作居字獨有無有字三日三上有後字則携文藪作則自携携其具作自携具不畏畏字上刋本缺一字恕本作不足畏某處處作所察其實作察得其實卒若干作乙若干按乙字乃對上甲字刋本作卒疑誤復命復上而有字非我我作吾送三班送下有名字與兵馬與下有嶺下二字手殺二字作平而自伐而作以與詐取譏也無與詐也三字亦思之然無此四字以行無二字二廪二廩作囤見民見上又嘗二字善劒善下有用字常畏作常謙畏遇人文藪作遇之而能者者作然偉烈偉作義古之人有然焉文藪焉字作而不誣誣作過知今人知上有又字懌所爲懌上有然字次第之之下有焉字皇祐五年序蜀畫七賢圖云爲作賛并序今此卷有其序而賛不傳閩本桑懌傳後又載錢鏐王景仁朱瑾等傳即五代史文也間有小異今不取奏議卷第十五歐陽文忠公集一百十一翰苑條約舉人懷挾文字劄子嘉祐二年正月知貢舉臣伏見國家自興建學校以來天下學者日盛務通經術多作古文其辭藝可稱履行修飭者不可勝數然累次科埸人數倍多於徃歳事旣太盛弊亦隨生竊聞近年舉人公然懷挾文字皆是小𥿄細書抄節甚備毎寫一本筆工獲錢三二十千亦有十數人共歛錢一一作三二百千雇倩一人虚作舉人名目依例下家狀入科埸只令懷挾文字入至試院其程試則他人代作事不敗則頼其懷挾共一作互相傳授事敗則不過扶出一人旣本非應舉之人雖敗别無刑責而坐獲厚利竊以國家取士務得實材今若浮僞之人容其濫進則使負辛勤藴實學者無以自别且自來科塲務存事體所以優加禮遇用待賢能今浮薄之徒不知朝廷崇獎之意自爲姦僞以至於此甚可歎也謂一作惟冝峻立科條明加約束使浮薄姦僞之徒不容於其間則實有學行之人得𬒳選進然後士子無濫舉朝廷得實才臣今欲乞増定貢院新制寛監門之責重廵鋪之賞蓋以入門之時一一搜檢則慮成擁滯故臣乞自舉人入院後嚴加廵察多差内臣及清幹京朝官廵鋪毎獲懐挾者許與理爲勞績或免逺官或指射差遣其監門官與免透漏之責若搜檢覺察得人數多者令知舉官聞奏取㫖重加酬奬其廵鋪官除只得廵察懐挾及傳授文義外不得非理侮慢舉人庻存事體且朝廷待士甚厚而小人自爲浮薄不可不行禁止以革弊源一作厚弊如允臣所奏乞立定廵鋪官賞格及懐挾人責罰刑名添入貢院新定條制仍牓南省門及下進奏院頒告天下所貴先明條約然後必行取進止論保明一無明字舉人行實一作止劄子同前臣伏覩近降勑命更定科埸條制内一節令本縣令佐知州通判保明舉人行實委無玷缺若因事彰露只罪令佐知州通判所斷刑名並用舊制雖去官經恩不得原減者伏縁舊制刑名甚重今來去官經恩不得原減則官吏所責不輕而玷缺之累中人所不能免小過微累皆爲玷缺難以必用深刑責官吏保其所不能盡知者若謂止坐大事則又無明文竊慮後有犯者難用必行之法臣今欲乞指定舉人玷缺事狀如事親不孝行止踰濫冒哀匿服曽犯刑責及雖有䕃贖而情理重者以上事節苟犯其一並不得収試如違必一作並用舊制刑名所貴事簡而易遵法嚴而必用如允臣所請乞下禮部貢院施行今取進止論契丹求御容劄子嘉祐二年臣伏見契丹所遣汎使專爲御容而來中外之議皆謂前歳旣巳許之於理不可中止失於不早踐言至彼非時遣使及朝夕以來傳聞頗異或云大臣共議欲遂拒而不與若然則臣恐釁隙之端自此而始禍患之起未昜遽言大凡爲國謀事者必先明信義重曲直酌人情量事勢四者皆得然後可以不疑苟一有未然尚恐敗事況四者俱失豈可不思契丹與中國通盟乆矣而嚮來宗真特於信好自表慇懃别有家書繼以畫像聖朝納其來意許以報之而乃遷延至今遂欲食言而中輟是則彼以推誠結我我以不信待之失信傷義甚非中國待夷狄之術而又其曲在我使彼易以爲辭自南北通和以來信問徃復之際毎於報答常從優厚假借旣乆其心巳驕況此畫像之來特表慇懃之意是則於平常之禮厚報以驕之慇懃之來則不報以沮一作阻下同之沮之彼必怒不報彼必恥懷恥畜怒何所不爲此人之常情也許其父不許其子厚薄之際此亦人情之難處也臣竊見契丹來書𥘉無寒温候問之言直以踐言孤約爲說其意在於必得若此時𬒳沮勢必更來事旣再三豈能堅執若待其失於遜順已成釁隙然後與之則重爲中國之辱又使夷狄謂中國難以恩意交惟可以勢力脅因之引惹别有它求則爲後患何可涯哉今虜主雖弱而中國邊備未完廟謀未勝未可生事而欲執我曲彼直之議以起戎而結禍夫察彼事勢必不能中止量我事勢又未能必沮之臣故曰四者俱失也臣又聞虜使入境之日地震星殞變異非常先事深防猶恐不及失計招禍豈可自爲臣願聖慈出於獨斷勿沮其善意無失我信言臣今欲乞回諭虜中告以如約直候今冬因遣常使時與之則於事體稍便伏乞速下兩府商議上繫國家利害臣不敢不言今取進止論選皇子䟽一作書嘉祐二年八月日翰林學士朝散大夫右諌議大夫知制誥充史館修撰刋修唐書判太常寺兼禮儀事上輕車都尉賜紫金魚袋臣歐陽某謹昧死再拜上書于體天法道欽文聦武聖神孝徳皇帝陛下臣聞言天下之難言者不敢冀必然之聽知未必聽而不可不言者所以盡爲忠之心況臣遭遇聖明容納諫諍言之未必不聽其可黙而不言臣伏見自去歳以來羣臣多言皇嗣之事臣亦甞因災異竊有奏陳雖聖度包容不加誅戮而愚誠懇至天聽未回臣實不勝愛君之心日夜區區未甞忘此思欲再陳狂瞽而未知所以爲言今者伏見兖國公主近巳出降臣因竊思人之常道莫親於父子之親人之常情亦莫樂於父子之樂雖在聖哲異於凡倫其爲天性於理則一陛下嚮雖未有皇嗣而尚有公主之愛上慰聖顔今旣出降漸踈左右則陛下萬機之暇處深宫之中誰可與語言誰可承顔色臣愚以謂冝因此時出自聖意於宗室之中選材賢可喜者録以爲皇子使其出入左右問安侍膳亦足以慰恱聖情臣考於書史竊見自古帝王雖曰至尊未甞獨處也其出而居外也不止百司公見奏事而巳必有儒臣學士講論於閑宴又有左右侍從顧問語言其入而居内也不止宦官宫妾在於左右而巳其平居燕寢也則有太子問安侍膳於朝夕其優游宴樂也多與宗室子弟懽然相接如家人計其一日之中未嘗一時獨處也今陛下日御前後殿百司奏事者徃徃仰瞻天顔而退其甚幸者得承一二言之徳音君臣之情不通上下之意不接其餘在廷之臣儒學侍從之列未聞一人從容親近於左右入而居内則至於問安侍膳亦闕於朝夕是則陛下冨有四海之廣躬享萬乗之尊居外則無一人可親居内則無一人得親此臣所以區區而欲言也伏況陛下荷祖宗之業承宗廟社稷之重皇子未降儲位乆虚羣臣屢言大議未決臣前所奏陳以謂未必立爲儲貳而且飬爲子旣可以徐察其賢否亦可以待皇子之降生於今爲之亦其時也臣言狂計愚伏俟斧鉞臣昧死再拜乞冩祕閣書令館職校讎劄子嘉祐二年九月兼判祕閣祕書省臣近準勑兼判祕閣檢㑹先準皇祐元年七月十一日中書劄子節文奉聖㫖祕閣有闕者書名件用崇文總目逐旋𥙷寫依例酬校了以黄絹裝褫正副二本収附準備御覽内中取索一作借本閣尋且畫一合行事件聞奏蒙依所奏施行當時雖有此行遣尋值抄寫觀文殿書權住至今㐲見館閣校讎之官貟數甚多除係省府南曹外其餘主判閑局及别無主判者並各無書校對旣無職事因此多不入館伏以館閣國家優飬賢材之地自祖宗以來號爲清職今館宇閴然塵埃滿席有同廢局甚可嘆嗟臣今欲乞檢㑹先準皇祐元年七月十一日所降指揮及一宗行遣次第許從本閣選請在院館職官員先將祕閣書目與崇文總目點對内有見闕書籍即於三館取索先校定然後抄寫成書仍差𥘉校覆校官刋正裝禠其合行事件已有畫一起請依奏指揮亦乞檢㑹施行惟元乞公用錢乞更不支破其抄寫楷書候見得闕書數目將見在楷書人數酌量多少如一作照闕人即别具擘畫聞奏今取進止乞定兩制員數劄子嘉祐三年臣竊以學士待制號爲侍從之臣所以承宴間備顧問以論思獻納爲職自祖宗以來尤精其擇一作尤所精擇苟非清徳羙行藹然衆譽髙文博學獨出一時則不得與其選是以選用至艱員數至少官以難得爲貴人以得職爲榮搢紳之望旣隆則朝廷之體増重其後用人頗易員數漸多徃時學士待制至六七十員近年以來稍慎除拜即今猶及四十餘員臣以謂愛惜名器不輕授人朝廷旣巳知之矣而為國家一無矣而家三字計者宜於此時一作亦宜及今創立經制今惟翰林學士中書舍人知制誥各有定員其餘學士待制未有定一作員數臣今欲乞檢詳前史及國朝故事自觀文殿大學士至待制並各立定員數遇有員闕則精擇賢材以充其選苟無其人尚可虚位以待如允臣所請乞賜詳議施行取進止論編學士院制詔劄子嘉祐三年臣伏見國家承五代之餘建萬世之業誅滅僣亂懷來四夷封祀天地制作禮樂至於大臣進退政令改更學士所作文書皆繫朝廷大事示於後世則爲王者之訓謨藏之有司乃是本朝之故實自明道以前文書草槀尚有編録景祐以後漸成散失臣曽試令類聚収拾𥙷綴十巳失其五六使聖宋之盛文章詔令廢失湮淪緩急事有質疑有司無所檢證蓋由從前雖有編録亦無類例卷第只是本院書吏私自抄寫所以易爲廢失臣今欲乞將國朝以來學士所撰文書各以門類依其年次編成卷秩號爲學士院草録有不足者更加求訪𥙷足之仍乞差本院學士從下兩員專切管勾自今巳後接續編聮如本行人吏不畫時編録致有漏落許令本院舉察理爲過犯此臣本院常事也所以上煩聖聽者蓋以近歳以來百司綱紀相承廢壞事有曽經奏聞及有聖㫖指揮者僅能遵守若只是本司臨時處置其主判之官纔罷去則其事尋亦廢停所以臣欲乞朝廷特降指揮所貴乆逺遵行不敢廢失今取進止請今後乞内降人加本罪二等劄子嘉祐三年臣伏見諌官陳旭起請僥求内降之人委二府劾奏于請者之罪蒙朝廷依奏施行尋聞李璋因内降責罰自後罕聞敢求内降以希恩賞者以此見至公之朝必信之法可以令行而禁止也然旭所請只爲恩賞之一端而小人僥求無所不至臣自權知開封府未及兩月之間十次承準内降或爲府司後行或爲宫院姨㜮或爲内官及干繫人吏等本府毎具執奏至于再三而干求者一無三字内降不巳至於婢妾賤人犯姦濫等事亦敢上煩聖聦以求私庇宦竪小臣自圖免過反彰聖君曲法之私雖有司執奏終許公行然小人干求未有約束止絶臣今一無此字欲乞今後應有因事敢干求内降者依舊許本府執奏外更乞根䆒因縁干求之人奏攝下府勘劾重行責罰如本人自行干請者亦乞一就勘鞫加元犯本罪二等斷遣其情理稍深及干求不已者亦許本府一靣牒報御史臺彈紏勘劾施行所貴止絶小人干亂公朝敗紊綱紀今取進止論梁舉直事封回内降劄子嘉祐二年臣勘㑹本府見勘内臣梁舉直公事兩曽執奏三準内降特與放罪臣伏見近年權倖之臣多是公然作過不畏憲法恃干求内降紊亂紀綱所以前後臣寮累具論述陛下特降明詔許承受官司執奏不得施行布告天下著爲信令今梁舉直累煩睿聽干求不巳本府遵依前後詔勑再具執奏未許公行伏以曲庇小臣撓屈國法自前世帝王苟有如此等事史冊書之以著人君之過失今梁舉直不欲受過於其身寧彰陛下之過於中外舉直此罪重於元犯之罪今縱未能法外重行以戒小人干求内降者其元犯本罪豈可曲恕舉直苟爲愛身之計不思愛君之心乃是小人全無知識爾如臣忝𬒳恩寵列於侍御職在獻納合思禆𥙷豈可阿意順㫖爲陛下曲法庇縱小臣以彰聖君之失其内降臣更不敢下司謹具狀繳連進納今取進止論郭皇后影殿劄子嘉祐三年臣所領太常禮院得御藥院公文稱奉聖㫖送畫到景靈宫廣孝殿後修盖郭皇后影殿圖子一本赴太常禮院詳定者其圖子已别具狀繳奏訖臣伏見近年京師土木之功糜耗國用其弊特深原其本因只爲差内臣監修利於偷竊官物及訖功之後僥求恩賞以故多起事端務廣興作其甚則託以祖宗神御張皇事勢近年以來如此興造略無虚歳伏以景靈宫建自先朝以尊奉聖祖陛丁又建真宗皇帝章懿太后神御殿於其間天下之人皆知陛下奉先廣孝之意然則此宫乃陛下奉天奉親之所今乃欲以後宫巳廢未一作追復之后建殿與先帝太后並列瀆神違禮莫此之甚臣竊謂此事必不出於聖意皆小人私於興作有所僥求爾蓋自前世帝王於宗廟之外别爲廟享以追奉祖宗者則有之未聞有自追奉其妃后者也蓋小人不識事體但苟一時之利不思虧損聖徳伏乞特賜寢罷以全典禮今取進止論孟陽河開掘墳墓劄子嘉祐四年春臣勘㑹府界剏開孟陽新河相次據祥符縣人户經府披訴稱𬒳人夫開掘墳墓斫伐桑棗拆拽舎屋等事尋差兵曹叅軍張稚圭徃彼檢視得已開河道六里有餘計三料開掘却村民墳墓八十二所大墓園三所草瓦屋七十七間其未開三料猶有墳墓二十五所舎屋四十七間桑五百餘株田土八十段臣因體問得村民所掘墳墓屍首骨殖布在新河兩岸子孫骨肉環坐守之仰天號慟屍骨暴露並無所歸其甚貧一作貧甚者用火燒焚向空撒棄其㽵宅屋宇累世安居旦夕毀拆全家露坐冤痛之聲聞於逺近方此春月朝廷務行仁政之時横屍暴骨殃及幽明可爲憫傷可爲驚駭兼體問得所開新河有害無利其萬勝斗門及陽武橋斗門兩處減水盡入白溝河所以年年決溢今又剏開新河亦入白溝是則三道減水盡聚一河將來決溢可知兼今所開新河深六尺至七尺白溝河只深四尺至五尺下源髙仰水勢難行臣今欲乞權住夫役三兩日差朝臣一貟計㑹都水監開封府各差官一貟同行相度苟如臣所說不虚未開三料乞更不開掘却移夫役修整舊河其元獻利見開河之人本爲自圖功賞及從𥘉檢計壕寨官吏蒙昧朝廷不言有墳墓宅舎桑棗在所開地内情理難恕欲乞下開封府取勘一作㑹其獻利之人與壕寨等並行決配官員悉與停廢所貴少謝枯骨兼慰生人今取進止乞罷上元放燈劄子嘉祐四年臣伏以三元放燈不岀典禮蓋囙前世習俗所傳陛下二字一作皆以俯徇衆心欲同民樂勉出臨幸非爲嬉㳺若乃時歳豐和一作時豐歳和人物康冨以爲樂事亦是人情今自立春以來隂寒雨雪小民失業坊市寂寥寒凍之人死損不少薪炭食物其價増倍民憂凍餓何睱遨遊臣本府日閱公事内有投井投河不死之人皆稱因爲貧寒自求死所今日有一婦人凍死其夫尋亦自縊竊惟里巷之中失所之人何可勝數昨日聖恩差官俵錢正爲如此目下隂雪未解假使便得晴明坊市不免泥淖聖駕所歴衝冒風寒況方以日蝕之災一無二字避殿減膳聖心憂畏中外所知欲乞特罷放燈所有常年酌獻之禮若至日未得晴明一作和亦乞差大臣攝事所是見今供擬遊幸及修道路寒凍兵士並乞放罷庻㡬上副陛下畏天憂民之心今取進止論包拯除三司使上書嘉祐四年三月臣聞治天下者在知用人之一作在用人知先後而巳用人之法各有所冝軍旅之士先材能朝廷之士先名節軍旅主成功惟恐其不趨賞而爭利其先材能而後名節者亦勢使之然也朝廷主教化風俗之薄厚治道之汙隆在乎用人而教化之於下也不能家至而諄諄諭之故常務尊名節之士以風動天下而聳勵其媮薄夫所謂名節之士者知廉耻脩禮讓不利於苟得不牽於苟隨而惟義之所處白刃之威有所不避折枝之易有所不爲而惟義之所守其立於朝廷進退舉止皆可以爲天下法也其人至難得也至可重也故其一無二字爲士者常一作當下同貴名節以自一無此字重其身而君人者亦常全名節以飬成善士伏見陛下近除前御史中丞包拯爲三司使命下之日中外一作外議喧然以謂朝廷貪拯之材而不爲拯惜名節然猶冀拯能執節守義堅讓以避嫌疑而爲朝廷惜事體數日之間遽聞拯巳受命是可惜也亦可嗟也拯性好剛天姿峭直然素少學問朝廷事體或有不思至如逐其人而代其位雖𥘉無是心然見得不能思義此皆不足恠若乃嫌疑之迹常人皆知可避而拯豈獨不思哉昨聞拯在臺日常自至中書詬責宰相指陳前三司使張方平過失怒宰相不早罷之旣而臺中寮屬相繼論列方平由此罷去而以宋祁代之又聞拯亦曽彈奏宋祁過失自其命出臺中寮屬又交章力言而祁亦因此而罷而拯遂代其任此所謂蹊田奪牛豈得無過而整冠納履當避可疑者也如拯材能資望雖别加進用人豈爲嫌一作間言其不可爲者惟三司使爾非惟自渉嫌疑其於朝廷所損不細臣請原其本末而言之國家自數十年來士君子務以恭謹静慎爲賢及其弊也循黙苟且頽一作媮惰寛弛習成風俗不以爲非至於百職不修紀綱廢壊時方無事固未覺其害也一旦黠虜犯邊兵出無功而財用空虚公私困弊盗賊並起天下騷然陛下奮然四字一作天子感悟思革其弊進用三數大臣銳意於更張矣於此之時始増置諌官之員以寵用言事之臣俾之舉職由是修紀綱而繩廢壊遂欲分别賢不肖進退材不材而乆弊之俗驟見而駭因共指言事者而非之或以謂好訐隂私或以爲公相傾䧟或謂沽激名譽或謂自圖進取羣言百端㡬惑上聽上頼陛下至聖一無一字至明察見諸臣本以一無此字忘身徇國非爲己利讒間不入遂荷保全而中外之人乆而亦漸爲信自是以來二十年間臺諫之選屢得讜言之士中間斥去姦邪屏絶權倖拾遺救失不可勝數是則納諌之善一作臣從古所難自陛下臨御以來實爲盛徳於朝廷𥙷助之效不爲無功今中外習安上下巳信纎邪之人凡所舉動毎畏言事之臣時政無巨細亦惟言事官是聽原其自始開發言路至於今日之成效豈易致哉可不惜㢤夫言人之過似於一無此字下同激訐逐人之位似於傾䧟而言事之臣得以自明者惟無所利於其間爾而天下之人所以爲信者亦以其無所利焉今拯併逐二臣自居其位使將來姦佞者者字一作之人得以爲說而惑亂主聽今後言事者不爲人信而無以自明是則聖明一作朝用諌之功一旦由拯而壊夫有所不取之謂㢘有所不爲之謂耻近臣舉動人所儀法使拯於此時有所不取而不爲可以風天下以廉耻之節而拯取其所不冝取爲其所不冝爲豈惟自薄其身亦所以開誘他時言事之臣傾人以覬得相習而成風此之爲患豈謂小哉然拯所恃者惟以本無一作無本心耳夫心者藏於中而人所不見迹者示於外而天下所瞻今拯欲自信其不見之心而外掩天下之迹是猶手探其物口云不欲雖欲自信人誰信之此臣所謂嫌疑之不可不避也況如拯者少有孝行聞於郷里晚有直節著在朝廷但其學問不深思慮不熟而處之乖當其人亦可惜也伏望陛下别選材臣爲三司使而處拯他職置之京師使拯得避嫌疑之迹以解天下之惑而全拯之名節不勝幸甚臣叨塵侍從職號論思昔甞親見朝廷致諌之初甚難今又復見陛下用諌之效已著實不欲因拯而壊之者爲朝廷惜也臣言狂計愚伏俟誅戮奏議卷第十五居士集卷第十五歐陽文忠公集十五賦五首雜文五首附黃楊樹子賦并序夷陵山谷間多黃楊樹子江行過絶險處時時從舟中望見之鬱鬱山際有可愛之色獨念此樹生窮僻不得依君子封殖備愛賞而樵夫野老又一無又字不知甚惜作小賦以歌之若夫漢武之宫叢生五柞景陽之井對植雙桐髙秋羽獵之騎半夜嚴粧之鍾鳯蓋朝拂銀牀暮空固巳葳蕤近日的皪一作灼爍含風婆娑萬戸之側生長深宫嘉祐元年夏大雨水奉詔祈晴于醴泉宫聞鳴蟬有感而賦云肅祠庭以祗事兮瞻玉宇之崢嶸收視聽以淸慮兮齋予心以薦誠因一作黙以靜而求一作觀動兮見乎萬物之情於時朝雨驟止微風不興四無雲以靑天雷曵曵一作隱隱其餘聲乃席芳葯臨華軒古木數株空一作荒庭草間爰有一物鳴于樹顚引淸風以長嘯抱纎柯而永歎嘒嘒非管泠泠若絃裂方號而復咽凄欲斷而還連吐孤韻以難律含五音之自然吾不知其何物其名曰蟬豈非因物造形能變化者邪出自糞壤慕淸虚者邪凌風髙飛知所止者邪嘉木茂樹喜淸隂者邪呼吸風露能尸解者邪綽約雙鬢修嬋姢者邪其爲聲也不樂不哀非宫非徴胡然而鳴亦胡然而止吾甞悲夫萬物莫不好鳴若乃四時代謝百鳥嚶兮一氣候至百蟲驚兮嬌兒姹女語鸝庚兮鳴機絡緯響蟋蟀兮轉喉哢舌誠可愛兮引腹動股豈勉彊而爲之兮至於汚池濁水得雨而聒兮飲泉食土長一無長字夜而歌兮彼蝦蟇固若有欲而蚯蚓又何求兮其餘大小萬狀不可悉名各有氣類隨其物形一有而字不知自止有若爭能忽時變以物改咸漠然而無聲嗚呼逹士所齊萬物一類人於其間所以爲貴蓋巳巧其語言又能傳於文字是以窮彼思慮耗其血氣或吟哦其窮愁或發揚其志意雖共盡於萬物乃長鳴於百丗予亦安知其然哉聊爲樂以自喜方將一作吾方考得失較同異俄而隂雲復興雷電俱擊大雨旣作蟬聲遂息一本賦後有䟦云予因學書起作賦草他兒一視而過獨小子棐守之不去此兒他日必能爲吾此賦也因以予之秋聲賦歐陽子方一無方字墨蹟止作余無上四字夜讀書聞有聲自西南來者悚然而聽之曰異哉𥘉淅瀝以蕭颯忽奔騰而砰湃如波濤夜驚風雨驟一作風驟雨而至其觸於一無於字物也鏦鏦錚錚金鐵皆鳴又如赴敵之兵銜枚疾走不聞號令但聞人馬之行聲墨蹟無聲字余謂童子此何聲也汝出視之童子曰星月一作月星皎潔明河在天四無人聲聲在樹間余曰噫嘻悲哉一作夫此秋聲也胡爲而來哉蓋夫秋之爲狀也其色慘淡煙霏雲歛其容淸明天髙日晶其氣慄冽砭人肌骨其意蕭條山川寂寥故其爲聲也凄凄切切呼號憤發豐草緑縟而爭茂佳木葱籠而可恱草拂之而色變木遭之而葉脫其所以摧敗零落者墨蹟無者字乃其一一無一字氣之餘烈夫秋刑官也於時爲隂又兵象也於行用金是謂天地之義氣常以肅殺而爲心墨蹟有大哉字天之於物春生秋實故其在樂也商聲主西方之音夷則爲七月之律商傷也物旣老而悲傷夷戮也物過盛而當殺嗟乎草木一有之字無情有時一有而字飄零人爲動物惟物之靈一作人惟動物爲物之靈百憂感其心萬事勞其形有動于中必揺其精而况思其力之所不一有能字及憂其智之所不能一有行字冝其渥然丹者爲槁木􅉳一本作黟墨蹟同然黒者爲星星奈何以一無以字非金石之質一有而字欲與草木而爭榮念誰爲之戕賊亦何恨乎秋聲童子莫對垂頭而睡但聞四壁蟲聲唧唧如一作似助余之歎息病暑賦和劉原父作吾將東走乎泰山兮履崔嵬之髙峯䕃白雲之揺曵兮聽石溜之玲瓏松林一作竹仰不見白日隂壑慘慘多悲風邈哉不可以坐致兮安得仙人之術解化如飛蓬吾將西登乎崑崙兮出於九州之外覽星辰之浮没視日月之隱蔽披閶闔之淸風飲黃流一作河之巨派羽翰不可以揷余之兩腋兮畏舉身而下墜旣欲泛乎南溟兮瘴毒流膏而鑠骨何異避喧之一作而趨市兮又如惡影之就日又欲臨乎北荒兮飛雪層冰之所聚鬼方窮髮一作徼無人迹兮乃龍虵之雜處四方上下皆不得以徃兮顧此大熱吾不知夫所逃萬物並生於天地豈余身之獨遭任寒暑之自然兮成嵗功而不勞惟衰病之不堪兮譬燎枯而灼焦矧空廬之湫卑兮甚龜蝸之跼縮飛蚊幸余之露坐兮壁蝎伺余之入屋一作蠅蚊幸余之虚坐兮蝨蝎伺余於壁屋頼有客之哀余兮贈端石與蘄竹得飽食以安一作與晝寢兮瑩枕冰而簟玉知其無可奈何而安之兮乃聖賢之髙躅惟冥心以息慮兮庶可忘於煩酷憎蒼蠅賦蒼蠅蒼蠅吾嗟爾之爲生旣無蜂蠆之毒尾又無蚊䖟之利觜幸不爲人之畏胡不爲人之喜爾形至眇爾欲易盈杯盂殘瀝砧几餘腥所希杪忽過則難勝苦何求而不足乃終日而營營逐氣尋香無處不到頃刻而集誰相告報其在物也雖微其爲害也至要若乃華榱廣厦珍簟方牀炎風之燠夏日之長神昬氣蹙流汗成漿委四支而莫舉眊兩目其茫洋惟髙枕之一覺冀煩歊之暫忘念於爾而何負乃於吾而見殃尋頭撲面入袖穿裳或集眉端或㳂眼眶目欲瞑而復警臂巳痺而猶攘於此之時孔子何由見周公於髣髴莊生安得與蝴蝶而飛揚徒使蒼頭丫髻巨扇揮颺咸頭垂而腕脫毎立寐而顚僵此其爲害者一也又如峻宇髙堂嘉賔上客沽酒市脯鋪筵設席聊娱一日之餘閑奈爾衆多之莫敵或集器皿或屯几格或醉醇酎因之没溺或投熱羮遂喪其魄諒雖死而不悔亦可戒夫貪得尤忌赤頭號爲景迹一有霑汙人皆不食奈何引類呼朋揺頭鼓翼聚散倐忽往來絡繹方其賔主獻酬衣冠儼飾使吾揮手頓足改容失色於此之時王衍何暇於淸談賈誼堪爲之太息此其爲害者二也又如醯醢之品醬臡之制及時月而收藏謹缾罌之固濟乃衆力以攻鑚極百端而窺覬至於大胾肥牲嘉肴美味蓋藏稍露於罅隙守者或時而假寐纔稍怠於防嚴已輒遺其種類莫不養息蕃滋淋漓敗壞使親朋卒至索爾以無歡臧獲懷憂因之而得罪此其爲害者三也是皆大者餘悉難名嗚呼止棘之詩垂之六經於此見詩人之博物比興之爲精冝乎以爾刺䜛人之亂國誠可嫉而可憎雜文五首醉翁吟并序一作醉翁述余作醉翁亭于滁州一作余於滁作醉翁亭有太常博士沈遵一有者字好竒之士也聞而一止作甞往遊焉愛其山水歸而以琴寫之作醉翁吟三疊去年秋一無秋字余奉使契丹沈君一作子㑹余一作于一有於字恩冀之間夜䦨酒半一無此四字援琴而作之有其聲而無其辭乃爲之辭以贈一作遺之其辭曰始翁之來二作翁之來兮獸見而深伏鳥見而髙飛翁醒而往兮醉而歸朝醒暮醉兮無有四時鳥鳴樂其林獸出遊其蹊咿嚶啁􅑜於翁前兮醉一有而字不知有心不能以無情兮有合必有離水潺潺兮翁忽去而不顧山岑岑兮翁復來而幾時風嫋嫋兮山木落春年年兮山草菲嗟我無德於其人兮有情於山禽與野麋賢哉沈子兮能寫我心而慰彼相思山中之樂并序一本題下云三章送慧勤上人佛者慧勤餘杭人也少去父母長無妻子以衣食于佛之徒往來京師二十年其人聰明材智亦甞學問于賢士大夫今其南歸遂將窮極呉越甌閩江湖海上之諸山以肆其所適予嘉其甞有聞於吾人也於其行也一本無四字爲作山中之樂三章一本有以送之旣極道山林間事以動蕩其心意而卒反之於正其辭曰江上山兮海上峯藹靑蒼兮杳㠝叢霞飛霧散兮邈乎靑空天鑱鬼削兮壁立於鴻蒙崖懸磴絶兮險且窮穿雲渡水兮一無兮字忽得路而不知其深之幾重中有平田廣谷兮與丗隔絶猶有太古之遺風泉甘土肥兮鳥獸雝雝其人麋鹿兮旣壽而豐不知人間之幾時兮但見草木華落爲春冬嗟丗之人兮曷不歸來乎山中山中之樂不可見今子其往兮誰逢其一丹莖翠蔓兮巖壑玲瓏水聲聒聒兮花氣濛濛石巉巉兮橫一作當路風颯颯兮吹松雲冥冥兮雨霏霏白猿夜嘯兮靑楓朝日出兮林間澗谷紛以靑紅千林靜兮秋月百草香兮春風嗟丗之人兮曷不歸來乎山中山中之樂不可得今子其往兮誰從其二梯崖􅌟險兮佛廟仙宫耀空山兮鬱穹隆彼之人兮固一無固字亦目明而耳聰寵辱不干其慮兮仁義不被其躬䕃長一作喬松之蓊蔚兮藉纎草之丰茸茍其中以自足兮忘其服胡而顚童自古智能魁傑之士兮固亦絶丗而逃蹤惜天材之甚良兮而一無而字自棄於無庸嗟彼之人兮胡爲老乎山中山中之樂不可乆遲子之返兮誰同其三雜說三首一有并序二字夏六月暑雨旣止歐陽子坐於樹間仰視天與月星一作日月星辰行度見星有殞者夜旣乆露下聞草間蚯蚓之聲益急其感干耳目者有動乎其中作雜說蚓食土而飲泉其爲生也簡而易足然仰其穴而鳴若號若呼若嘯若歌一作若歌若嘯其亦有所求邪抑其求易足而自鳴其樂邪苦一作抑歎其生之陋而自悲其不幸邪將自喜其聲而鳴其類邪豈其時至氣作不自知其所以然而不能自止者邪何其聒然而不止也吾於是乎有感一本此屬次篇星殞于地腥礦頑醜化爲惡石其昭然在上而萬物仰之者精氣之聚爾及其斃也瓦礫之不若也人之死骨肉臭腐螻蟻之食爾其貴乎萬物者亦精氣也其精氣不奪于物則藴而爲思慮發而爲事業著而爲文章昭乎百丗之上而仰乎百丗之下非如星之精氣隨其斃而滅也可不貴哉而生也利慾以昬耗之死也臭腐而棄之而一無而字惑者方曰足乎利慾所一無所字以厚吾身吾於是乎有感天西行日月五星皆東行日一歲而一周月疾於日一本無三字一月而一周天又疾於月一日而一周星有遲有速有逆有順是四者各自行而若不相爲謀其動而不勞運而不巳自古以來未甞一刻息也是何爲哉夫四者所以相須而成晝夜四時寒暑者也一刻而息則四時不得其平萬物不得其生蓋其所任者重矣人之有君子也其任亦重矣萬丗之所治萬物之所利故曰自彊不息又曰死而後巳者其知所任矣然則君子之學也其可一日而息乎吾於是乎有感一本此屬首篇居士集卷第十五熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正黃楊樹子賦多黃楊樹子一無子字濆激濆當作噴鳴蟬賦崢嶸石本嶸作􅗆病暑賦又如一作又同空廬一作室廬憎蒼蠅賦丫髻一作丫髮醉翁吟序作醉翁吟作一作爲雜說第三任矣此下一有乎字學也此上一有於字
