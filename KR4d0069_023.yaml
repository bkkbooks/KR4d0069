body:
  text: 雜題跋書李翺集後豫為西京留守推官得此書於魏君書五十篇子嘗讀韓文所作哀歐陽詹文云詹之事既有李翺作傳而此書亡之惜其遺闕者多矣書梅聖俞稿後凡樂逹天地之和而與人之氣相接故其疾徐奮動可以感於心歡欣惻愴可以察於聲五聲單出於金石不能自和也而工者和之然抱其器知其聲節其廉肉而調其律吕如此者工之善也今指其器以問於工曰彼簨者簴者堵而編執而列者何也彼必曰鼗鼓鍾磬絲管干戚也又語其聲以聞之曰彼清者濁者剛而奮柔而曼衍者或在郊或在廟堂之下而羅者何也彼必曰八音五聲六代之曲上者歌而下者舞也其聲器名物皆可以數而對也然至乎動蕩血脈流通精神使人可以喜可以悲或歌或泣不知手足鼓舞之所然問其何以感之者則雖有善工猶不知其所以然焉蓋不可得而言也樂之道深矣故工之善者必得於心應於手而不可述之言也聽之善亦必得於心而會以意不可得而言也堯舜之時夔得之以和人神舞百獸三代春秋之際師襄師曠州鳩之徒得之為樂官理國家知興亡周衰官失樂器淪亡散之河海逾千百歲間未聞有得之者其天地人之和氣相接者既不得泄於金石疑其遂獨鍾於人故其人之得者雖不可和於樂尚能歌之為詩古者登歌清廟大師掌之而諸侯之國亦各有詩以道其風土性情至於投壷饗射必使工歌以逹其意而為賔樂蓋詩者樂之苗裔與漢之蘇李魏之曹劉得其正始宋齊而下得其浮淫流佚唐之時子昻李杜沈宋王維之徒或得其淳古淡泊之聲或得其舒和髙暢之節而孟郊賈島之徒又得其悲愁鬱堙之氣由是而下得者時有而不純焉今聖俞亦得之然其體長於本人情狀風物英華雅正變態百出哆兮其似春凄兮其似秋使人讀之可以喜可以悲陶暢酣適不知手足之將鼓舞也斯固得深者邪其感人之至所謂與樂同其苗裔者邪余嘗問詩於聖俞其聲律之髙下文語之疵病可以指而告余也至其心之得者一作直不可以言而告也余亦將以心得意會而未能至之者也聖俞久在洛中其詩亦往往人皆有之今將告歸余因求其稿而寫之然夫前所謂心之所得者如伯牙鼓琴子期聽之不相語而意相知也余今得聖俞之稿猶伯牙之琴絃乎讀李翺文豫始讀翺復性書三篇曰此中庸之義疏爾智者誠一作識其性當讀一作復中庸愚者雖讀此不曉也不作可焉又讀與韓侍郎薦賢書以謂翺特窮時憤世無薦已者故丁寧如此使其得志亦未必然以韓為秦漢間好俠一作事行義之一豪俊亦善論一作諭人者也最後讀幽懷賦然後置書而歎歎已復讀不自休恨翺不生於今不得與之交又恨豫不得生翺時與翺上下其論也凡昔二字一作況乃翺一時人有道而能文者莫若韓愈愈嘗有賦矣不過羡二鳥之光榮歎一飽之一作而無時爾此其二字一作推是心使光榮而飽則不復云矣若翺獨不然其賦曰衆囂囂而雜處兮咸歎老而嗟卑視豫心之不然兮慮行道之猶非又怪神堯以一旅取天下後世子孫不能以天下取河北以為憂嗚呼使當時君子皆易其歎老嗟悲之心為翺所憂之心則唐之天下豈有亂與亡哉然翺幸不生今時見今之事則其憂又甚矣奈何今之人不憂也余行天下見人多矣脫有一人能如一作知翺憂者又皆賤一作疏逺與翺無異其餘光榮而飽者一聞憂世之言不以為狂人則以為病癡子不怒則笑之矣嗚呼在位而不肯自憂又禁他人使皆不得憂可歎也夫景一作皇祐三年十月十七日歐陽修書書春秋繁露後漢書董仲舒傳載仲舒所著書百餘篇第云清明竹林玉柸繁露之書蓋略舉其篇名今其書才四十篇又總名春秋繁露者失其真也豫在館中校勘羣書見有八十餘篇然多錯亂重復又有民間應募獻書者獻三一作二十餘篇其間數篇在八十篇外乃知董生之書流散而不全矣方俟校勘而豫得罪夷陵秀才田文𥘉以此本示豫不暇讀明年春得假之許州以舟下南郡獨卧閲此遂志之董生儒者其論深極春秋之旨然惑於改正朔而云王者大一元者牽於其師之説不能髙其論以明聖人之道惜哉惜哉景祐四年四月四日書書韋應物西澗詩後右唐韋應物滁州西澗詩今州城之西乃是豐山無所謂西澗者獨城之北有一澗水極淺遇夏潦漲溢但為州人之患其水亦不勝舟又江潮不至此豈詩家務作佳句而實無此耶然當時偶不以圖經考正恐在州界中也聞左司郭貟外新授滁陽欲以此事問之論尹師魯墓志志言天下之人識與不識皆知師魯文學議論材能則文學之長議論之髙材能之美不言可知又恐太略故條析其事再述于後述其文則曰簡而有法此一句在孔子六經惟春秋可當之其他經非孔子自作文章故雖有法而不簡也修於師魯之文不薄矣而世之無識者不考文之輕重但責言之多少云師魯文章不合秪著一句道了既述其文則又述其學曰通知古今此語若必求其可當者惟孔孟也既述其學則又述其論議云是是非非務盡其道理不苟止而妄隨亦非孟子不可當此語既述其論議則又述其材能備言師魯歷貶自兵興便在陜西尤深知西事未及施為而元昊臣師魯得罪使天下之人盡知師魯材能此三者皆君子之極美然在師魯猶為末事其大節乃篤於仁義窮逹禍福不愧古人其事不可遍舉故舉其要者一兩事以取信如上書論范公而自請同貶臨死而語不及私則平生忠義可知也其臨窮逹禍福不愧古人又可知也既已具言其文其學其論議其材能其忠義遂又言其為仇人挾情論告以貶死又言其死後妻子困窮之狀欲使後世知有如此人以如此事廢死至於妻子如此困窮所以深痛死者而切責當世君子致斯人之及此也春秋之義痛之益至則其辭益深子般卒是也詩人之意責之愈切則其言愈緩君子偕老是也不必號天呌屈然後為師魯稱冤一作怨也故於其銘文但云藏之深固之密石可朽銘不滅意謂舉世無可告語但深藏牢埋此銘使其不朽則後世必有知師魯者其語愈緩其意愈切詩人之義也而世之無識者乃云銘文不合不講德不辨師魯以非罪蓋為前言其窮逹禍福無愧古人則必不犯法況是仇人所告故不必區區曲辨也今止直言所坐自然知非罪矣添之無害故勉徇議者添之若作古文自師魯始則前有穆修鄭條輩及有大宋先逹甚多不敢斷自師魯始也偶儷之文苟合于理未必為非故不是此而非彼也若謂近年古文自師魯始則范公祭文已言之矣可以互見不必重出也皇甫湜韓文公墓志李翺行狀不必同亦互見之也志云師魯喜論兵論兵儒者末事言喜無害喜非嬉戲之戲喜者好也君子固有所好矣孔子言回也好學豈是薄顔回乎後生小子未經師友苟恣所見豈足聽哉修見韓退之與孟郊聮句便似孟郊詩與樊宗師作志便似樊文慕其如此故師魯之志用意特深而語簡蓋為師魯文簡而意深又思平生作文惟師魯一見展卷疾讀五行俱下便曉人深處因謂死者有知必受此文所以慰吾亡友爾豈恤小子輩哉書沖厚居士墓銘後東南固多學者而徐氏尤為大族其子弟從豫學者往往有聞于時視其子弟則可知其父兄之賢也廬陵歐陽修書讀裴寂傳豫嘗與尹師魯論自魏晉而下佐命功臣皆可貶絶以其二心舊朝叶成大謀二字一作謀主雖曰忠於所事而非人臣之正也及讀裴寂傳迹其終始良有以哉始寂為晉陽宫監私以宫人饋髙祖因見親昵可謂二隋矣及太宗以博奕啖之遂開義師之謀卒成唐室武周為冦請行自敗不即就誅者非特佐命有功豈非曩時私狎之恩哉坐交沙門法雖免官見放復有所陳太宗數之曰計公勳庸不至於此數以武德時一作官政之繆皆歸其人又聞妖言不自明乃欲殺人緘一作滅口遂𬒳流放列其四罪貸不致理蓋由進身之私恩衰即敗也韓彭之功猶終不保況寂也哉書梅聖俞河豚魚詩後豫友梅聖俞於范饒州席上賦此河豚魚詩余每體中不康誦之數過輒佳亦屢書以示人為竒贈翰林東閣書書三絶句詩後前一篇梅聖俞詠泥滑滑次一篇蘇子美詠黃鶯後一篇余詠畫眉鳥三人者之作也出於偶然𥘉未始相知及其至也意輒一作趣同歸豈非其精神會通遂暗合耶自二子死余殆絶筆於斯矣翰林東閣書跋晏元獻公書右觀文殿大學士兵部尚書晏元獻公二帖公為人真率其詞翰亦如其性是可佳也跋李西臺書嘉祐三年三月晦日和叔携以過余因得覽之不能釋手嗟今之人清尚如西臺君者何少也遂書其後而還之廬陵歐陽修同前李公為人端重清方為當時所重不徒愛其筆迹也嘉祐三年三月晦日修題跋李翰林昌武書昌武筆畫遒峻蓋欲自成一家冝其見稱於當時也修覽其書知此道七字一作風雅寂寞久矣嚮時蘇梅二子以天下兩窮人主張斯道一時士人一作人士傾想其風采奔走不暇自其淪亡遂無復繼者豈孟子所謂折枝之易第不為邪覽李翰林詩筆見故時朝廷儒學侍從之臣未嘗不以篇章翰墨為樂也記舊本韓文後豫少家漢東漢東僻陋無學者吾家又貧無藏書州南有大姓李氏者其子堯一作彥輔頗好學豫為兒童時多遊其家見有弊筐貯故書在壁間發而視之得唐昌黎先生文集六卷脫落顛倒無次序一作第因乞李氏以歸讀之見其言深厚而雄博然豫猶少未能悉究其義徒見其浩然無涯若可愛是時天下學者楊劉之作號為時文能者取科第擅名聲以誇榮當世未嘗有道韓文者豫亦方舉進士以禮部詩賦為事年十有七試于州為有司所黜因取所藏韓氏之文復閲之則喟然一有而字嘆曰學者當至於是而止爾因怪時人之不道而顧已亦未暇學徒時時獨念于豫心以謂方從進士干祿以養親苟得祿矣當盡力于斯文以償其素志後七年舉進士及第官于洛陽而尹師魯之徒皆在遂相與作為古文因出所藏昌黎集而輔綴之求人家所有舊本而校定之其後天下學者亦漸趨於古而韓文遂行于世至于今蓋三十餘年矣學者非韓不學也可謂盛矣嗚呼道固有行於逺而止於近有忽於往而貴于今者非惟世俗好惡之使然亦其理有當然者而孔孟惶惶於一時而師法於千萬世韓氏之文沒而不見者二百年而後大施於今此又非特好惡之所上下蓋其久而愈明不可磨滅雖蔽于暫而終耀于無窮者其道一有皆字當然也豫之始得於韓也當其沈沒棄廢之時豫固知其不足以追時好而取勢利於是就而學之則豫之所為者豈所以急名譽而干勢利之用哉亦志乎久而已矣故豫之仕於進不為喜退不為懼者蓋其志先定而所學者冝然也集本出於蜀文字刻畫頗精於今世俗本而脫繆尤多凡三十年間聞人有善本者必求而改正之其最後卷秩不足今不復輔者重增其故也豫家藏書萬卷獨昌黎先生集為舊物也嗚呼韓氏之文之道萬世所共尊天下所共傳而有也豫於此本特以其舊物而尤惜之題薛公期畫善言畫者多云鬼神易為工以謂畫以形似為難鬼神人不見也然至其隂威慘淡變化超騰而窮竒極怪使人見輒驚絶及徐而定視則千狀萬態筆簡而意足是不亦為難哉此畫雖傳自妙本然其筆力精徑亦自有嘉處嘉祐八年仲春旬休日竊覽而嘉之題還薛公期書室廬陵歐陽修題一作俗言見畫鬼神者易為工以其人不常見也然而隱見出沒於有無之際千狀萬態筆簡而意足難矣及其變化飛騰窮竒極怪使人見輒驚絶豈不又難哉此畫雖所傳好本然其筆力精徑亦自有佳處廬陵歐陽修竊覽而嘉之遂題其後以還公期書室嘉祐八年仲春休日跋杜祁公書右杜祁公墨迹公當景祐中為御史中丞時余以鎮南軍掌書記為館閣校勘始登公門遂見知奬後十五年余以尚書禮部郎中龍圖閣直學士留守南都公已罷相致仕于家者數年矣余歲時率僚屬候問起居見公福壽康寧言笑不倦歲餘豫遭內艱去居于潁服除來京師蒙恩召入翰林為學士與公書問往還無虛月又二歲公以疾薨于家豫既泣而論次公之功德而銘之又集在南都時唱和詩為一卷以傳二家之子孫又發篋得公手書簡尺歌詩類為十卷而藏之余與時寡合辱公之知久而愈篤冝於公有不能忘矧公筆法為世楷模人人皆寶而藏之然世人莫若余得之多也嘉祐八年六月晦日跋永城縣學記唐世執筆之士工書者十八九蓋自魏晉以來風流相承家傳少習故易為能也下逮懿僖昭哀衰亡一作世之亂冝不暇矣接乎五代四海分裂士大夫生長干戈於積尸白刃之間時時猶有以揮翰馳名於當世者豈又唐之餘習乎如王文秉之小篆李鄂郭忠恕之楷法楊凝式之行草至於羅紹威錢俶皆武夫驕將之子酣樂於狗馬聲色者其於字畫亦有以過人及宋一天下於今百年儒學稱盛矣唯以翰墨之妙中間寂寥者久之豈其忽而不為乎將俗尚苟簡廢而不振乎抑亦難能而罕至也蓋久而得三人焉嚮時蘇子美兄弟以行草稱自二子亡而君謨書特出於世君謨筆有師法真草惟意所為動造精絶世人多藏以為寶而豫得之尤多若荔枝譜永城縣學記筆畫尤精而有法者故聊志之俾世藏之知余所好而吾家之有此物也廬陵歐陽某書嘉祐八年歲在癸卯中元日書荔枝譜後善為物理之論者曰天地任物之自然物生有常理斯之謂至神圎方刻畫不以智造而力給然千狀萬態各極其巧以成其形可謂任之自然矣二十七字一作千態萬狀維不以智造而力給一任之自然故能各極其巧而其一無此字醜好精粗壽夭多少皆有常分不有尸之敦為之限數由是言之又若有為之者一無此十字是皆不可詰於有無之間故謂之神也牡丹花之絶而無甘實荔枝果之絶而非名花昔樂天二字一作人有感於二物矣是孰尸其賦豫邪然斯二者惟一一無此字不兼萬一無此字物之美故各得一作得各極其精此於造化不可知而推之至理冝如此也余少逰洛陽花之盛處也因為牡丹作記君謨閩人也故能識荔枝而譜之因念昔人嘗有感於二物而吾二人者適各得其一之詳故聊書其所以然而以附君謨譜之末嘉祐八年七月十九日廬陵歐陽修題跋學士院題名余嚮在翰林七年嘗以謂宰輔有任責之憂神仙無爵祿之寵既都榮顯又享清間而兼有人天之樂者惟學士也自頃以來叨𬒳恩私俾參政論力疲矣而勤勞不得少息心衰矣而憂患浩乎無涯却思玉堂如在天上偶因發篋間覽題名不覺慨然遂書於此嘉祐八年中秋日熙寧四年正月二十九日載覽至却思玉堂如在天上之語因思余作內制集序亦為此語英宗皇帝嘗加稱賞為之泫然感涕不能止也六一居士書跋茶録善為書者以真楷為難而真楷又以小字為難羲獻以來遺迹見於今者多矣小楷維樂毅論一篇而巳今世俗所傳出故髙紳學十家最為真本而斷裂之餘僅存者百餘字爾此外吾家率更所書溫彥博墓銘亦為絶筆率更書世固不少而小字亦止此而已以此見前人於小楷難工而傳於世者少而難得也君謨小字新出而傳者二集古録目序橫逸飄發而茶録徑實端嚴為體雖殊而各極其妙蓋學之至者意之所到必造其精豫非知書者以接君謨之論久故亦粗識其一二焉治平甲辰古之善書者必先楷法漸而至於行草亦不離乎楷正張芝與旭變怪不常出乎筆墨蹊徑之外神逸有餘而與羲獻異矣襄近年粗知其意而力已不及烏足道哉此蔡忠惠公所題跋觀文王尚書舉正書右觀文學士尚書王公字伯中清德之老也余晚接公逰愛其為人未幾公以病卒因録其遺迹而藏之實思其人不獨玩其筆也天聖中公與謝絳希深黃鑑唐卿修國史余為進士𥘉至京師因希深始識公而未接其逰後三十年余為翰林學士公以書殿兼職經筵始得竊從公後故得公手筆不多嗚呼天聖之間三人者皆一時之選今皆亡矣其遺迹尤可惜矧公素以書名當世也治平元年清明前一日書跋學士院御詩列聖御製刻石龕在玉堂北壁扃鎖甚嚴至和元年秋余𥘉蒙恩召為學士嘗因事獨對便殿先帝密諭將幸玉堂及欲如祖宗時夜召學士因問唐朝故事余奏曰唐世學士以獻替為職業至於進退大臣常參密議故當時號為內相又謂之天子私人其職在禁近故唐制學士不與外人交通比來選用非精致上恩禮亦薄漸見踈外無異百司若聖君有意崇奬則當漸修故事豫遂退而建言不許私謁執政時人喧然共以為非蓋流俗習見近事不知學士為禁職舊制不通外人也真宗時劉子儀當直既不為丁晉公草制明日晏元獻公入直劉見晏來遽趨一作移以出相遇不揖掩面而過蓋當時學士猶交直也近時當直者多不宿宿者暮入晨出玉堂終日閴然吏人共守空院而巳職隳事廢已久自朝廷近臣皆不知故事流俗不足怪也因覽刻石遂并記之于後治平元年清明日院中名畫舊有董羽水僧巨然山在玉堂後壁其後又有燕肅山水今又有易元吉猿及狟皆在屏風其諸司官舍皆莫之有亦禁林之竒玩也余自出翰苑夢寐思之今中書樞密院惟內宴更衣則借學士院解歇每至裴回畫下不忍去也跋薛簡肅公奎書右薛簡肅公詩并書其背乃天聖四年司農卿李湘門狀是歲丙寅至今丁未實四十二年矣偶得於家人篋中因褾軸而藏之公之清節直道余既銘之而有傳在國史此不復書治平四年閏月十八日跋醉翁吟余以至和二年奉使契丹明年改元嘉祐與聖俞作此詩後五年聖俞卒作詩殆今十有五年矣而聖俞之亡亦十年也閲其辭翰一為泫然遂軸而藏之熙寧三年五月十三日題青州山齋吾常喜誦常建詩云竹徑通幽處禪房花木深欲效其語作一聮久不可得乃知造意者為難工也晚來青州始得山齋宴息因謂不意平生想見而不能道以言者乃為已有於是益欲希其髣佛竟爾莫獲一言夫前人為開其端而物景又在其目然不得自稱其懷豈人才有限而不可強將吾老矣文思之衰邪兹為終身之恨爾熙寧庚戍仲夏月望日題跋三絶帖南唐澄心堂紙為世所珍今人家不復有曼卿詩與筆稱雄於一時今亦未有繼者謂之三絶不為過矣余家藏此蓋三十餘年熙寧壬子正月雨中記六一居士外集卷第二十三論尹師魯墓志故條析石本作故又條悉可當之石本作可以當之而不簡類稿作而或不簡必求其可當務盡其道理石本無二其字歷貶石本作歷官屢貶盡知師魯四字上石本有不字仁義石本作忠義其學石本無其字呌屈類稿作呌地於其銘文石本無其字乃云銘文石本無文字以非罪石本無以字未必為非石本作皆非故不此下一有必字若謂石本作若為皇甫湜韓文公墓志李翺行狀類稿作皇甫湜作韓文公志與李翺行狀志云石本作志言之戲石本作之喜孔子言石本作仲尼言故師魯之志故字下一有於字豈恤此下石本有彼字跋永城縣學記唯以真迹作唯於廢而真迹廢字上有遂字世人真迹無人字此卷論尹師魯墓志即辨志也遂寧府有石刻載師魯妻𥘉怒志文簡略新進士孔嗣宗請詣潁州與公辨論凡留半月公為添換并遺辨志又答嗣宗兩帖與今本書簡第七卷同但增一節云此不當辨為世人多云云恐尹氏惑之使其妻子不足故須委曲近曽録寄范公今録奉呈為語尹氏凡三十九字據此則所謂添換尚或可疑姑附于此外集第十九卷與杜欣書云尹氏子卒請韓太尉别為墓表以此見朋友與孝子用心常異然則當時固無甚添換也居士集卷第二十三歐陽文忠公集二十三碑銘二首忠武軍節度使同中書門下平章事武恭王公神道碑銘并序惟王氏之先為常山真定人後世葬河南密而密分入于管城遂為鄭州管城人其封國仍世于魯惟魯武康公事太宗皇帝秉節治戎出征入衛乃受遺詔輔真宗有勞有勤報恤追崇以有兹魯國是生魯武恭公公少以父任為西頭供奉官至道二年遣五將討李繼遷公從武康公出鐵門為先鋒殺獲甚衆軍至烏白池諸將失期不得進公告其父曰歸師過險爭必亂乃以兵前守隘號其軍曰亂行者斬由是士卒無敢先後雖武康公亦為之按轡追兵望其軍整不敢近武康公歎曰王氏有子矣後以御前忠佐為軍頭巡檢邢洺男子張洪霸聚盜二州間歷年吏不能捕公以氈車載勇士為婦人服盛飾誘之邯鄲道中賊黨爭前邀劫遂皆就擒由是知名公以將家子宿衛真宗為內殿直殿前左班都虞候捧日左廂都指揮使纍遷英州團練使今天子即位改博州團練使知廣信軍徙知冀州遷康州防禦使歷龍神衛捧日天武四廂都指揮使侍衛親軍步軍馬軍殿前都虞候步軍副都指揮使桂福二州觀察使是時章獻太后猶臨朝有詔補一軍吏公曰補吏軍政也敢挾詔書以干吾軍亟請罷之太后固欲與之公不奉詔乃止及太后上仙有司請衛士坐甲公以為故事無為太后喪坐甲又不奉詔於是天子知一作以公可任大事明道二年拜檢校太保簽署樞密院事遂為副使明年以奉國軍留後同知院事又明年領安德軍節度使又明年加檢校太尉宣徽南院使公為將善撫士而識與不識皆喜為之稱譽其狀貌雄偉動人雖里兒巷婦外至夷狄皆知其名氏御史中丞孔道輔等因事以為言乃罷公樞密拜武寧軍節度使言者不已即以為右千牛衛上將軍知隨州士皆為之懼公舉止言色如平時惟不接賔客而巳久之徙知一作公曹州而孔道輔卒客有謂公曰此害公者也公愀然曰孔公以職言事豈害我者可惜朝廷亡一直臣於是言者終身以為愧而士大夫服公為有量慶曆二年起公為保靜軍留後知青州未行而契丹聚兵幽涿遣使者有所求自河以北皆警乃拜公保靜軍節度使知澶州契丹使者過澶州見公喜曰聞公名久矣乃得見於此邪公為言巳衰老中國多賢士大夫因指坐客歷陳其世家使者竦聽是歲徙真定府定州等路都部署改宣徽南院使判成德軍未行徙判定州兼三路都部署公治其軍無撓其私亦不貸其過居頃之士皆可用契丹使人覘其軍或勸公執而戮之公曰吾軍整而和使覘者得吾實以歸是屈人兵以不戰也明日大閲于郊公執桴鼓誓師號令簡明進退坐作肅然無聲乃下令曰具糗糧聽鼓聲視吾旗所鄉契丹聞之震恐會復議和兵解徙知陳州道過京師天子遣中貴人問公欲見否公謝曰備邊無功幸得蒙恩徙內地不敢見明年徙河陽不行以宣徽使奉朝請已而出判相州六年拜同中書門下平章事判澶州明年徙鄭州封祁國公又明年乞骸骨不許以為會靈觀使巳而復判鄭州徙澶州除集慶軍節度使徙封冀國公皇祐三年遂以太子太師致仕大朝會許綴中書門下班居一歲天子思之起為河陽三城節度使同中書門下平章事判鄭州六年以本官為樞密使徙封魯國公既而上以富公弼為宰相是歲契丹使者來公與之射使者曰天子以公典樞密而用冨公為相得人矣語聞上喜賜公御弓一矢五十公善射至老不衰嘗侍上射辭曰幸得備位大臣舉止為天下所視臣老矣恐不能勝弓矢上再三諭之乃手二矢再拜一發中之遂將釋復位上固勉之再發又中由是左右皆歡呼賜以襲衣金帶自寶元慶曆之間元昊叛河西兵出一無出字久無功士大夫爭進計䇿多所改作公笑曰奈何紛紛兵法不如是也使士知畏愛而怯者勇勇者不驕以吾可勝因敵而勝之爾豈多言哉其在樞密亦嘗自請臨邊不許凡大謀議必以咨之其在外則遣中貴人詔問其言多見施用公自致仕復起掌樞密凡三歲以老求去位至六七上為之不得巳以為景靈宫使徙忠武軍節度使又以為同羣牧制置使五日一朝給扶者以子若孫一人是歲公年七十有八矣明年二月辛未以疾薨于家詔輟視朝二日發哀于一作於苑中贈太尉中書令其遺言曰臣有俸祿足以具死事不敢復纍朝廷願無遣使者護喪無厚賻贈天子惻然哀其志以黃金百兩白金三千兩賜其家固辭不許以其年五月甲申葬于管城明年有詔史臣刻其墓碑臣愚以謂自國家西定河湟北通契丹罷兵不用幾四十年一日元昊叛幽燕亦犯約二邊騷動而老臣宿將無在者公於是時屹然為中國巨人名將雖未嘗躬矢石攻堅摧敵而恩信巳足撫士卒名聲巳足動四夷遂登朝廷典掌機密以老還仕復起干家保有冨貴享終壽考雖古之將帥及于是者其幾何人至於出入勤勞之節與其進退綢繆君臣之恩意可以褒勸後世如古詩書所載皆應法可書一作紀謹按魯武恭公諱德用字元輔曽祖諱方追封蔣國公祖諱玄追封𨝍一作邢國公皆贈中書令父諱超建雄軍節度使贈尚書令一有中書今追封魯國公諡曰武康公娶宋氏武勝軍節度使延渥之女𥘉為安定郡夫人追封榮國公夫人五男四女男曰咸熙東頭供奉官蚤卒次曰咸融西京左藏庫使果州團練使次曰咸庶一作度內殿崇班早卒次曰咸英供備庫副使次曰咸康內殿承制銘曰魯始錫封以褒武康爰暨武恭乃克有邦桓桓武恭其容甚飭偉其名聲以動夷狄公治軍旅不寬不煩恩均令齊千萬一人公在朝廷出守入衛乃登大臣與國謀議公曰老矣乞臣之身帝曰休哉汝豫舊臣亟其強起秉我樞鈞禮不筋力老豫敢侮公來在庭拜母蹈舞若子與孫助其興俯凡百有位誰其敢儔惟時黃耇天子之優冨貴之隆亦有能保孰享其終如公壽考公有世德載勳旗常刻銘有詔俾嗣其芳贈刑部尚書余襄公神道碑銘并序始興襄公既葬于曲江之明年其子仲荀走于亳以來告曰余氏世為閩人五代之際逃亂于韶自曽髙以來晦迹嘉遁至于博士府君始有祿仕而襄公繼之以大曲江僻在嶺表自始興張文獻公有聲于唐為賢相至公復出為宋名臣蓋余氏徙韶歷四世始有顯仕而曲江寂寥三百年然後再有聞人惟公位登天臺正秩三品遂有爵土開國鄉州以繼美前哲而為韶人榮至於褒恤贈諡始終之寵盛矣蓋褒有詔恤有物贈有告而諡行考功有議有狀合而志之以閟諸幽有銘可謂備矣惟是螭首龜趺揭于墓隧以表見於後世而昭示其子孫者冝有辭而闕焉敢以為請謹按余氏韶州曲江人曽祖諱某祖諱某皆不仕父諱某太常博士纍贈太常少卿公諱靖字安道官至朝散大夫守工部尚書集賢院學士知廣州軍州事兼廣南東路兵馬鈐轄經略安撫使柱國始興郡開國公食邑二千六百户食實封二百户治平元年自廣朝京師六月癸亥以疾薨于金陵天子惻然輟視朝一日賻以粟帛贈刑部尚書諡曰襄明年七月某甲子返葬于曲江之龍歸鄉成山之原公為人質重剛徑而言語恂恂不見喜怒自少博學強記至於歷代史記雜家小説隂陽律曆外暨浮屠老子之書無所不通天聖二年舉進士為贑縣尉書判拔萃改將作監丞知新建縣再遷祕書丞刋校三史充集賢校理天章閣待制范公仲淹以言事觸宰相得罪諌官御史不敢言公疏論之坐貶監筠州酒稅稍徙泰州巳而天子感悟亟復用范公而因之以被斥者皆召還惟公以便親乞知英州遷太常博士丁母憂服除遂還為集賢校理同判太常禮院景祐慶曆之間天下怠於久安吏習因循多失職及趙元昊以夏叛師出久無功縣官財屈而民重困天子赫然思振頽弊以修百度既巳更用二三大臣又增置諌官四貟使言天下事公其一人也即改右正言供職公感激奮勵遇事輒言無所回避姦諛權幸屏息畏之其補益多矣然亦不勝其怨嫉也慶曆四年元昊納誓請和將加封册而契丹以兵臨境上遣使言為中國討賊且告師期請止母與和朝廷患之欲聽重絶夏人而兵不得息不聽生事北邊議未決公獨以謂中國猒兵久矣此契丹之所幸一日使吾息兵養勇非其利也故用此以撓我爾是不可聽朝廷雖是公言猶留夏册不遣而假公諌議大夫以報公從十餘騎馳出居庸關見虜於九十九泉從容坐帳中辨言一作折往復數十卒屈其議取其要領而還朝廷遂發夏册臣元昊西師既解嚴而北邊亦無事是歲以本官知制誥史館修撰而契丹卒自攻元昊明年使來告捷又以公往報坐習虜語出知吉州怨家因之中以事左遷將作少監分司南京公怡然還鄉里闔門謝賔客絶人事凡六年天子每思之欲用者數矣大臣有不喜者弟遷光祿少卿于家又以為某一本作右領軍衛將軍壽州兵馬鈐轄辭不拜皇祐二年祀明堂覃恩遷衛尉卿明年知虔州丁父憂去官而蠻賊儂智髙陷雍州連破嶺南州縣圍廣州乃即廬中起公為祕書監知潭州即日疾馳在道改知桂州廣南西路經略安撫使公奏曰賊在東而徙臣西非臣志也天子嘉之即詔公經制廣東西賊盜乃趨廣州而智髙復西走雍州自智髙初起交趾請出兵助討賊詔不許公以謂智髙交趾叛者冝聽出兵母沮其善意纍疏論之不報至是公曰雍州與交趾接境今不納必忿而反助智髙乃以便冝趣交趾會兵又募儂黃諸姓酋豪皆縻以職與之誓約使聽節制或疑其不可用公曰使不與智髙合足矣及智髙入雍州遂無外援既而宣撫使狄青會公兵敗賊於歸仁智髙走入海雍州平公請復終喪不許諸將班師以智髙尚在請留公廣西委以後事遷給事中諌官御史列疏言公功多而賞薄再遷尚書工部侍郎公留廣西逾年撫緝完復嶺海肅然又遣人入特磨襲取智髙母及其弟一人俘于京師斬之拜集賢院學士久之徙知潭州又徙青州再遷吏部侍郎嘉祐五年交趾冦雍州殺五巡檢天子以謂恩信著於嶺外而為交趾所畏者公也驛召以為廣西體量安撫使悉發荆湖兵以從公至則移檄交趾召其臣費嘉祐詰責之嘉祐皇恐對曰種落犯邊罪當死願歸一本作留取首惡以獻即械五人送欽州斬于界上公還雍人遮道留之不得明年以尚書左丞知廣州英宗即位拜工部尚書代還道病卒享年六十有五公經制五管前後十年凡治六州所至有惠愛雖在兵間手不釋卷有文集二十卷奏議五卷三史刋誤四十卷娶林氏封魯郡夫人子男三人伯莊殿中丞早卒仲荀今為屯田貟外郎叔英太常寺太祝女六人皆適士族孫一本有男四人孫女五人銘曰余遷曲江仍世不顯奮自襄公有聲甚逺始興開國襲美于前兩賢相望三百年間偉歟襄公惟邦之直始登于朝官有言責左右獻納姦諛屏息慶曆之治實多輔益逢時有事奔走南北功書史官名在夷狄出入艱勤險夷一德小人之讒公廢于里一方有警公起于家威行信結嶺海幽遐公之在焉帝不南顧胡召其還殞于中路返柩來歸韶人負土伐石刻辭立于墓門以貽來世匪止韶人居士集卷第二十三熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正王武恭公碑河南密此下一有縣字過險一作遇險號其軍一作號令其軍能捕一作敢捕余襄公碑曾祖諱從祖諱榮父諱慶一本如此兵馬鈐轄鈐字上一有都字某甲子一作乙酉成山一作成家山猶留猶字上一有然字某衛將軍一作雅州刺史嘉之一作喜之廣東西一作廣南東西入海一作洞太常寺太祝一作大理評事皆適士族一作長適職方貟外郎郭師愈次適屯田貟外郎孫邵次適宿州觀察支使周熊次適祕書省校書郎章惇𥙿次適越州上虞縣主簿張元淳一尚幼孫男四人一作七人嗣恭嗣昌皆大理評事嗣隆太常寺奉禮郎嗣徽嗣光嗣立嗣京未仕右石本所書較集本加詳蓋刻時所增
