front:
  text: 居士集卷䇿三十五歐陽文忠公集三十五
  hash: sha256:db28004175ba9d3d66974c76a1b3e2d22ead759f89e449a4031ea51e3645cd64
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_035-1a}
body:
  text: 墓志三首碣一首附永州軍事判官鄭君墓志銘鄭君諱平字某衡州衡陽人也少倜儻有大志舉進士中天禧三年甲科為郴州軍事推官監潭州茶場坐茶惡免官久之試祕書省校書郎知連州陽山縣為道州軍事推官丁母憂服除調永州軍事判官監衡州茭源銀冶以疾去官慶曆三年七月某日卒于家享年五十有一以某年某月某日葬于某所曾祖諱某永州祁陽令祖諱某江陵府建寧縣令父諱某道州軍事判官君娶孫氏贈尚書工部侍郎冕之女子男六人綯總紀經維綬綯早卒總舉進士出身亦早卒孫七人皆幼君世仕不顯少孤而貧毋夫人某氏賢母也教其三子以學皆有立君與其兄本弟革皆舉進士及第君𥘉監茶埸茶實不惡上官挾他事以罪中之君不自辨竭其資以償解官而去無愠色及為陽山有善政民甚愛之其既以疾廢慨然歎曰吾少力學而不幸廢以疾吾終不用於時矣安事空言哉即取其平生所為文藁悉焚之嗚呼君之志可哀也巳自三代詩書巳來立言之士多矣其始無不欲其言之傳也而散亡磨滅泯然不復見於後世者何可勝數或暫見而終沒或其言雖傳而其人不為世所貴者有矣惟君子有諸躬而不可掩者不待自言而傳也君之不欲見於空言其可謂善慮於無窮者矣其志豈不逺哉雖然君之志既不自見於言而冝有為之著者銘所以彰善而著無窮也乃為之銘曰夫惟自信有不疑知命者不惑故能得失不纍其心喜愠不見其色嗚呼鄭君學幾於此斯可謂之君子端明殿學士蔡公墓志銘公諱襄字君謨興化軍仙遊人也天聖八年舉進士甲科為漳州軍事判官西京留守推官改著作佐郎館閣挍勘慶曆三年以祕書丞集賢挍理知諫院兼修起居注是時天下無事士大夫弛於久安一日元昊叛師久無功天子慨然猒兵思正百度以修太平既已排群議進退一作用二三大臣又詔增置諫官四貟使拾遺輔闕所以遇之甚寵公以材名在選中遇事感激無所回避一有於是二字權幸畏斂不敢撓法干政而上得益與大臣圗議明年屢下詔書勸農桑興學校革弊修廢而天下悚然知上之求治矣於此之時言事之臣無日不進見而公之輔益為尤多四年以右正言直史館出知福州以便親遂為福建路轉運使復古五塘以溉田民以為利為公立生祠于塘側又奏減閩人五代時丁口稅之半丁父憂服除判三司鹽鐵勾院復修起居注今參知政事唐公介時為御史以直言忤旨貶春州别駕廷臣無敢言者公獨論其忠人皆危之而上悟意解唐公得改英州遂復召用皇祐四年遷起居舍人知制誥兼判流內銓御史吕景𥘉吳中復馬遵坐論梁丞相適罷臺職除他官公封還辭頭不草制其後屢有除授非當者必皆封還之而上遇公益厚曰有子如此其母之賢可知命特賜冠帔以寵之至和元年遷龍圗閣直學士知開封府三年以樞密直學士知泉州徙知福州未幾復知泉州公為政精明而世一作於閩人一有尤字知其風俗至則禮其士之賢者以勸學興善而變民之故除其甚害往時閩人一作士多好學而專用賦以應科舉公得先生周希孟以經術傳授學者常至數百人公為親至學舍執經講問為諸生率延見處士陳烈尊以師禮而陳襄鄭穆方以德行著稱鄉里公皆折節下之閩俗重凶事其奉浮圗會賔客以盡力豐侈為孝否則深自愧恨為鄉里羞而姦民遊手無賴子幸而貪飲食利錢財來者無限極往往至數百千人至有親亡祕不舉哭必破産辦具而後敢發喪者有力者乘其急時賤買其田宅而貧者立劵舉責終身困不能償公曰弊有大於此邪即下令禁止至於巫覡主病蠱毒殺人之類皆痛斷絶之然後擇民之聰明者教以醫藥使治疾病其子弟有不率教令者條其事作五戒以教諭之久之閩人大便公既去閩人相率詣州請為公立德政碑吏以法不許謝即退而以公善政私刻于石曰俾我民不忘公之德嘉祐五年召拜翰林學士權三司使三司開封世稱省府為難治而易以毁譽居者不由以遷則由以敗而敗者十常四五公居之皆有能名其治京師談笑無留事尤喜破姦一有發字隱吏不能欺至商財利則較天下盈虛出入量力以制用必使下完而上給下暨百司因習蠹弊切磨剗剔久之簿書纎悉紀綱條目皆可法七年季秋大享明堂後數月仁宗崩英宗即位數大賞賚及作永昭陵皆猝辦於縣官經費外公應煩愈間暇若有餘而人不知勞遂拜三司使居二歲以母老求知杭州即拜端明殿學士以往三年徙南京留守未行丁母夫人憂明年八月某日以疾卒于家享年五十有六蔡氏之譜自晉從事中郎克以來世有顯聞其後中衰隱德不仕公年十八以農家子舉進士為開封第一名動京師後官于閩典方州領使一路二一作而親尚皆無恙閩人瞻望咨嗟不榮公之貴而榮其父母母夫人尤有壽年九十餘飲食起居康強如少者歲時為壽母子鬢髮皆皤然而命服金紫煌煌如也至今閩人之為子者必以夫人祝其親為父母者必以公教其子也公於朋友重信義聞其喪則不御酒肉為位以哭盡哀乃止嘗會飲會靈東園坐客有射矢誤一有中傷人者客遽指為公矢京師喧然事既聞上一又有上字以問公公即再拜愧謝終不自辨退亦未嘗以語人公為文章清遒粹美有文集若干卷工於書畫頗自惜不妄為人書故其殘章斷藁人悉珍藏而仁宗尤愛稱之御製元舅隴西王碑文詔公書之其後命學士撰溫成皇后碑文又勑公書則辭不肯書曰此待詔職也公纍官至禮部侍郎既卒翰林學士王圭等十餘人列言公賢其亡可惜天子新即位未及識公而聞其名久也為之惻然特贈吏部侍郎官其子旻為祕書省正字孫傳一作傅及弟之子均皆守將作監主簿而優以􅉠恤以旻尚幼命守吏助給其喪事曾祖諱顯皇不仕祖諱恭贈工部貟外郎父諱琇贈刑部侍郎毋夫人盧氏長安郡太君夫人葛氏永嘉郡君子男三人曰勻將作監主簿曰旬大理評事皆先公卒幼子旻也女三人一適著作佐郎謝仲規二尚幼以某年某月某日葬公於莆田縣某鄉將軍山銘曰誰謂閩逺而多竒産産非物寶惟士之賢嶷嶷蔡公其人傑然奮躬當朝讜言正色出入左右彌縫輔益一作闕間歸于閩有政在人食不畏蠱喪不憂貧疾者有醫學者有師問誰使然孰不公思有髙其墳有拱其木凡閩之人過者必肅集賢院學士劉公墓志銘公諱敞字仲原父姓劉氏世為吉州臨江人自其皇祖以尚書郎有聲太宗時遂為名家其後多聞人至公而益顯公舉慶曆六年進士中甲科以大理評事通判蔡州丁外艱服除召試學士院遷太子中允直集賢院判登聞鼓院吏部南曹尚書考功於是夏英公既薨天子賜諡曰文正公曰此吾職也即上疏言諡者有司之事也且竦行不應法今百司各得守其職而陛下侵臣官疏凡三上天子嘉其守為更其諡曰文莊公曰姑可以止矣權判三司開坼司又權度支判官同修起居注至和元年九月召試遷右正言知制語宦者石全彬以勞遷宫苑使領觀察使意不滿退而愠有言居三日正除觀察使公封還辭頭不草制其命遂止二年八月奉使契丹公素知虜山川道里虜人道自古北口回曲千餘里至桞河公問曰自一有古字松亭趨桞河甚直而近不數日可至中京何不道彼而道此蓋虜人常故迂其路欲以國地險逺誇使者且謂莫習其山川不虞公之問也相與驚顧羞愧即吐其實曰誠如公言時順州山中有異獸如馬而食虎豹虜人不識以一有為字問公曰此所謂駮也為言其形狀聲音皆是虜人益歎服三年使還以親嫌求知揚州歲餘遷起居舍人徙知鄆州兼京東西路安撫使居數月召還糾察在京刑獄修玉牒知嘉祐四年貢舉稱為得人是歲天子卜以孟冬祫既廷告丞相用故事率文武官加上天子尊號公上書言尊號非古也陛下自寶元之郊止群臣毋得以請逮今二十年無所加天下皆知甚盛德奈何一旦受虛名而愪實美上曰我意亦謂當如此遂不允群臣請而禮官前祫請祔郭皇后於廟自孝章以下四后在别廟者請母合食事下議議者紛然公之議曰春秋之義不薨于寢不稱夫人而郭氏以廢薨按景祐之詔許復其號而不許其諡與祔謂冝如詔書又曰禮於祫未毀廟之主皆合食而無帝后之限且祖宗以來用之傳曰祭從先祖冝如故於是皆如公言公既驟屈廷臣之議議者已多仄目既而又論吕溱過輕而責重與臺諌異由是言事者亟攻之公知不容于時矣會永興闕守因自請行即拜翰林侍讀學士充永興軍路安撫使兼知永興軍府事長安多冨人右族豪猾難治猶習故都時一無此字態公方發大姓范偉事獄未具而公召由是獄屢變連年吏不能決至其事聞制取以付御史臺乃決而卒如公所發也公為三州皆有善政在揚州奪發運使冒占雷塘田數百項豫民民至今以為德其治鄆永興皆承旱歉所至必雨雪蝗輒飛去歲用豐稔流亡來歸令行民信盜賊禁止至路不拾遺公於學博自六經百氏古今傳記下至天文地理卜醫數術浮圗老莊之説無所不通其為文章尤敏贍嘗直紫微閣一日追封皇子公主几人公方將下直為之立馬却坐一揮九制數千言文辭典雅各得其體公知制誥七年當以次遷翰林學士者數矣久而不遷及居永興歲餘遂以疾聞八年八月召還判三班院太常寺公在朝廷遇事多所建明如古渭州可棄孟陽河不可開樞密使狄青冝罷以保全之之類皆其語在士大夫間者若其規切人主直言逆耳至於從容進見開導聰明賢否人物其事不聞于外廷者其輔益尤多故雖不合於世而特𬒳人主之知方嘉祐中嫉者衆而攻之急其雖危而得無害者仁宗深察其忠也及侍英宗講讀不專章句解詁而指事據經因以諷諌每見聽納故尤竒其材巳而復得驚眩疾告滿百日求便郡上曰如劉某者豈易得也復賜以告上每宴見諸學士時時問公少間否賜以新橙五十勞其良苦疾一有久字少間復求外輔上悵然許之出知衛州未行徙汝州治平三年召還以疾不能朝改集賢院學士判南京留司御史臺熙寧元年四月八日卒于官舍享年五十嗚呼以先帝之知公使其不病其所以甲之者豈一翰林學士而止哉方公以論事忤於時也又有􅌟為謗語以怒時相者及歸自雍丞相韓公方欲還公學士未及而公病遂止於此豈非其命也夫公纍官至給事中階朝散大夫勳上輕車都尉開國彭城爵公邑戶二千一百實食者三百曾祖諱琠贈大理評事祖諱式尚書工部貟外郎贈戶部尚書考諱立之尚書主客郎中贈工一作禮部尚書公再娶論氏皆侍御史程之女前夫人先公早卒後夫人以公貴纍封河南郡君子男四人長定國郊社掌座早卒次奉世大理寺丞次當時大理評事次安上太常寺太祝女三人長適大理評事韓宗直二尚幼公既卒天子推恩録其兩孫望旦一族子安世皆試將作監主簿公為人磊落明白推誠自信不為防慮至其屢見侵害皆置而不較亦不介于胸中居家不問有無喜賙宗族既卒家無餘財與其弟攽友愛尤篤有文集六十卷其為春秋之説曰傳曰權衡曰説例曰文權一無三字曰意林合四十一一無此字卷又有七經小傳五卷弟子記五卷而七經小傳今盛行於學者二年十月辛酉其弟攽與其子奉世等葬公於某所一作葬公祥符縣魏陵鄉祔于先墓以來請銘乃為之銘曰嗚呼維仲原父學強而博識敏而明坦其無疑一以誠見利如畏義必爭觸機履險危不傾畜大不施奪其齡惟其文章粲日星雖欲有毀知莫能維古聖賢皆後亨有如不信考斯銘零陵縣令贈尚書都官貟外郎吳君墓謁銘并序君諱舉字太沖姓吳氏興國軍永興人也曾祖諱瑗祖諱章父諱思逈五代之際自江以南為南唐吳氏亦微不顯君當李煜時以明經為彭澤主簿太祖皇帝召煜來朝煜不奉詔遣曹彬討之前鋒兵破池陽遣使招降郡縣使者至彭澤其令欲以城降君以大義責之且曰吾能為李氏死爾乃共殺使者為煜守煜巳降君為遊兵執送軍中主將責以殺使者君曰固當如是爾主將義而釋之當是時嘗仕煜者皆隨煜至京師得復輔吏君獨棄去不顧太平興國二年詔求李氏時故吏所在敦遣君始至京師以為鄆州平隂主簿歷益州成都令陜州録事參軍襄州之冝城洋州之真符福州之連江楚州之鹽城耀州之同官最後為零陵令以祥符九年八月二十六日道卒于揚州享年七十有六夫人伏氏能讀書史有賢行後君十有四年以卒享年八十有二子男二人長曰晛早卒次曰中復今為起居舍人以景祐三年十有一月甲子合葬君夫人于南康軍都昌縣之長城君學春秋通三傳其臨大節知所守當五代時僭竊分裂喪君亡國不勝數士之不得守其節與不能守者世皆習而不怪君於此時獨區區志不忘李氏其義有足動人然而亦無為君道者考君之出處自重不妄冝其世莫之知而潛德晦善顯於後世克有賢子為時名臣君以子恩纍贈尚書都官貟外郎考於令品文得碣于其墓以昭令德而示子孫於是史官廬陵歐陽修曰此余職也乃為之辭曰世逢屯兮廉耻道缺中國五禪兮九州分裂朝存夕亡兮士莫守節昧者習安兮懦夫志奪偉哉吳君兮凛矣其烈世莫我知兮不妄自伐有韞必昭兮後世而發嗚呼吳君兮寓銘斯碣居士集卷第三十五熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正鄭君墓銘天禧三一作二年劉公墓銘得也也一作耶定國一作充國吳君墓碣不勝數一作不可勝數然而此下一有人字
