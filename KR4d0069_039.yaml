body:
  text: 記十首泗州先春亭記景祐二年秋清河張侯以殿中丞來守泗上旣至問民之所素病而治其尤暴者曰暴莫大於淮越明年春作城之外堤因其舊而廣之度爲萬有九千二百尺用人之力八萬五千泗之民曰此吾利也而大役焉然人力出於州兵而石出乎南山作大役而民不知是爲政者之私我也不出一力而享六利不可相與出米一千三百石以食役者堤成髙三十三尺土實石堅捍暴備災可乆而不壞旣曰泗四逹之州也賔客之至者有禮於是因前蔣侯堂之亭新之爲勞餞之所曰思邵亭且推其美於前人而志邦人之思也又曰泗天下之水㑹也歳漕必廪於此於是治常豐倉西門二夾室一以視出納曰某亭一以爲舟者之寓舎曰通漕亭然後曰吾亦有所休一有暇其勞三字乎乃築州署之東城上爲先春亭以臨淮水而望西山是歳秋予貶夷陵過泗上於是知張侯之善爲政也昔周單子聘楚而過陳見其道穢而川澤不陂梁客至不授館羇旅無所寓遂知其必亡蓋城郭道路旅舎寄寓皆三代爲政之法而周官尤謹著之以爲禦備今張侯之作也先民之備災而及于賔客徃來然後思自休焉故曰知爲政也先時歳大水州㡬溺前司封貟外郎張侯夏守是州築堤以禦之今所謂因其舊者是也是役也堤爲大故予記其大者詳焉夷陵縣至喜堂記峽州治夷陵地濵大江雖一無此字有椒􅃮紙以通商賈而民俗儉陋常自足無所仰於四方販夫所售不過鱐魚腐鮑民所嗜而巳冨商大賈皆無爲而至地僻而貧故夷陵爲下縣而峽爲小州州居無郭郛通衢不能容車馬市無百貨之列而鮑魚之肆不可入雖邦君之過市必常下乘掩鼻以疾趨而民之列處竈廪匽井無異位一室之間上父子而下畜豕其覆皆用一作以茅竹故歳常火災而俗信鬼神其相傳曰作一無此字瓦屋者不利夷陵者楚之西境昔春秋書荆以狄之而詩人亦曰蠻荆豈其陋俗自古然歟景祐二年尚書駕部貟外郎朱公治是州始樹木増城􅔐甓南北之街作市門市區又教民爲瓦屋别竈廪異人畜以變其俗旣又命夷陵令劉光裔治其縣起勑書樓飾㕔事新吏舎三年夏縣功畢某有罪來是邦朱公於某有舊且哀其以罪而來爲至縣舎擇其㕔事之東以作斯堂度爲䟽絜髙明而日居之以休其心堂成又與賔客偕至而落之夫罪戾之人冝棄惡地處窮險使其憔悴憂思而知自悔咎今乃賴朱公而得善地以偷宴安頑然使忘其有罪之憂是皆異其所以來之意然夷陵之僻陸走荆門襄陽至京師二十有八驛水道大江絶淮抵汴東水門五千五百有九十里故爲吏者多不欲逺來而居者徃徃不得代至歳滿或自罷去然不知夷陵風俗朴野少盗爭一作少盜亊静而令之日食有稻與魚又有橘柚茶筍四時之味江山美秀而邑居繕完無不可愛是非惟有罪者之可以忘其憂而凡爲吏者莫不始來而不樂旣至而後喜也作至喜堂記藏其壁夫令雖卑而有土與民冝志其風俗變化之善惡使後來者有考焉爾一作使後來有考其歳月云爾峽州至喜亭記蜀於五代爲僭國以險爲虞以冨自足舟車之迹不通乎中國者五十有九年宋受天命一海内四方次第平太祖改元之三年始平蜀然後蜀之絲枲織文之冨衣𬒳於天下而貢輸商旅之徃來者陸輦秦鳯水道岷江不絶于萬里之外岷江之來合蜀衆水岀三峽爲荆江傾折回直捍怒鬪激束之爲湍觸之爲旋順流之舟頃刻數百里不及顧視一失毫釐與崖石遇則糜潰漂没不見蹤迹故凡一有西字蜀之可以充内府供京師而移用乎諸州者皆陸出而其羨餘不急之物乃下于江若棄之然其爲險且不測如此夷陵爲州當峽口江出峽始漫爲平流故舟人至此者必瀝酒再拜相賀以爲更生尚書虞部郎中朱公再治是州之三月作至喜亭于江津以爲舟者之停留也且誌夫天下之大險至此而始平夷以爲行人之喜幸夷陵固爲下州廩與俸皆薄而僻且逺雖有善政不足爲名譽以資進取朱公能不以陋而安之其心又喜夫人之去憂患而就樂易詩所謂愷悌君子者矣自公之來歳數大豐因民之餘然後有作惠于徃來以館以勞動不違時而人有賴是皆宜書故凡公之佐吏因相與謀而屬筆於脩焉御書閣記醴陵縣東二十里有宫曰登眞其前有山丗傳仙人王喬錬藥於此唐開元間神仙道家之說興天子爲書六大字賜而揭焉太宗皇帝時詔求天下前世名山異迹而尤好書法聞登眞有開元時所賜字甚竒乃取至京師閱焉巳而還之又賜御書飛帛字使藏焉其後登眞大火獨飛帛書存康定元年道士彭知一探其私笈一作篋以市工材悉復宫之舊建樓若干尺以藏賜書予之故人處士任君爲予言其事來乞文以志凡十餘請而不懈予所領職方悉掌天下圖書考圖驗之醴陵老佛之居凡八十而所謂登眞者其說皆然乃爲之記夫老與佛之學皆行於世乆矣爲其徒者常相訾病若不相容於世二家之說皆見斥於吾儒冝其合勢并力以爲拒守而乃反自相攻惟恐不能相弱者何哉豈其死生性命所持之說相盭而然邪故其代爲興衰各繫於時之好惡雖善辯者不能合二說而一之至其好大宫室以矜世人則其爲事同焉然而佛能箝人情而鼓以禍福人之趣者常衆而熾老氏獨好言清淨逺去靈仙飛化之術其事㝠深不可質究則其爲一無此字常以淡泊無爲爲務故凡佛氏之動揺興作爲力甚易而道家非遭人主之好尚不能獨興其間能自力而不廢者豈不賢於其徒者哉知一是已慶曆二年八月八日廬陵歐陽脩記畫舫齋記予至滑之三月即其署東偏之室治爲燕私之居而名曰畫舫齋齋廣一室其深七室以戸相通凡入予室者如入乎舟中其温室之奥則穴其上以爲明其虚室之䟽以逹則欄檻其兩旁以爲坐立之倚凡偃休於吾齋者又如偃休乎舟中山石􅍶崒佳花美木之植列於兩簷之外又似汎乎中流而左山右林之相映皆可愛者故因以舟名焉周易之象至於履險蹈難必曰渉川蓋舟之爲物所以濟險難而非安居之用也今予治齋於署以爲燕安而反以舟名之豈不戾哉矧予又甞以罪謫走江湖間自汴絶淮浮于大江至于巴峽轉而以入于漢沔計其水行㡬萬餘里其羇窮不幸而卒遭風波之恐徃徃二字一作或叫號神明以脫須臾之命者數矣當其恐時顧視前後凡舟之人非爲商賈則必仕宦因竊自歎以謂非冒利與不得巳者孰肯至是哉賴天之惠全活其生今得除去宿負列官于朝以來是州一無此二字飽廩食而安署居追一作遐思曩時山川所歷舟檝之危蛟鼉一有白鱀二字之出没波濤之洶歘冝其寢驚而夢愕而乃忘其險阻猶以舟名其齋豈眞樂於舟居者邪然予聞古之人有逃世逺去江湖之上終身而不肯反者其必有所樂也苟非冒利於險有罪而不得巳使順風恬波傲然一無此二字枕席之上一日而一無此字千里則舟之行豈不樂哉一作誠可樂也顧予誠有所未暇而此八字一作今舟之制尤多舫者宴嬉之舟也姑以名予齋奚曰不冝予友蔡君謨善大書頗怪偉將乞其大字以題於楹懼其疑予之所以名齋者故具以云又因以一無此字置于壁壬午十二月十二日書王彦章畫像記太師王公諱彦章字子明鄆州壽張人也事梁爲宣義軍節度使以身死國葬於鄭州之管城晉天福二年始贈太師公在梁以智勇聞梁晉之爭數百戰其爲勇將多矣而晉人獨畏彦章自乾化後常與晉戰屢困莊宗於河上及梁末年小人趙巖等用事梁之大臣老將多以讒不見信一作用皆怒而有怠心而梁亦盡失河北事勢巳去諸將多懷顧望獨公奮然自必不少屈懈志雖不就卒死以忠公旣死而梁亦亡矣悲夫五代終始纔五十年而更十有三君五易國而八姓士之不幸而出乎其時能不汙其身得全其節者鮮矣公本武人不知書其語質平生甞謂人曰豹死留皮人死留名蓋其義勇忠信出於天性而然予於五代書竊有善善惡惡之志至於公傳未甞不感憤歎息惜乎舊史殘略不能備公之事康定元年予以節度判官來此求於滑人得公之孫睿所録家傳頗多於舊史其記德勝之戰尤詳又言敬翔怒末帝不肯用公欲自經於帝前公因用笏畫山川爲御史彈而見廢又言公五子其二同公死節此皆舊史無之又云公在滑以讒自歸於京師而史云召之是時梁兵盡屬叚凝京師羸兵不滿數千公得保鑾五百人之鄆州以力寡敗於中都而史云將五千以徃者亦皆非也公之攻德勝也𥘉受命於帝前期以三日破敵梁之將相聞者皆竊笑及破南城果三日是時莊宗在魏聞公復用料公必速攻自魏馳馬來救已不及矣莊宗之善料公之善一無此字出竒何其神哉今國家罷兵四十年一旦元昊反敗軍殺將連四五年而攻守之計至今未決予甞獨持用竒取勝之議而歎邊將屢失其機時人聞予說者或笑以爲狂或忽若不聞雖予亦惑不能自信及讀公家傳至於德勝之捷乃知古之名將必出於竒然後能勝然非審於爲計者不能出竒竒在速速在果此天下偉男子之所爲非拘牽常筭之士可到也毎讀其傳未甞不想見其人後二年予復來通判州事歳之正月過俗所謂鐵槍寺者又得公畫像而拜焉歳乆磨滅隱隱可見亟命工完理之而不敢有加焉懼失其眞也公一有尤字善用槍當時號王鐵槍公死已百年至今俗猶以名其寺童兒牧竪皆知王鐵槍之爲良將也一槍之勇同時豈無而公獨不朽者豈其忠義之節使然歟畫已百餘年矣完之復可百年然公之不泯者不繫乎畫之存不存二字一作否也而予尤區區如此者盖其希慕之至焉耳讀其書尚想乎其人況得拜其像識其面目不忍見其壞也畫旣完因書予所得者于後而歸其人使藏之一有焉字襄州榖城縣夫子廟記釋奠釋菜祭之略者也古者士之見師以菜爲摯故始入學者必釋菜以禮其先師其學官四時之祭乃皆釋奠釋奠有樂無尸而釋菜無樂則其又略也故其禮亡焉而今釋奠幸存然亦無樂又不徧舉於四時獨春秋行事而已記曰釋奠必有合有國故則否謂凡有國各自祭其先聖先師若唐虞之夔伯夷周之周公魯之孔子其國之無焉者則必合於鄰國而祭之然自孔子没後之學者莫不宗焉故天下皆尊以爲先聖而後世無以易學校廢乆矣學者莫知所師一有則字又取孔子門人之髙第曰顔回者而配焉以爲先師隋唐之際天下州縣皆立學置學官生貟而釋奠之禮遂以著令其後州縣學廢而釋奠之禮吏以其著令故得不廢學廢矣無所從祭則皆廟而祭之荀卿子曰仲尼聖人之不得勢者也然使其得勢則爲堯舜矣不幸無時而没特以學者之故享弟子春秋之禮而後之人不推所謂釋奠者徒見官爲立祠而州縣莫不祭之則以爲夫子之尊由此爲盛甚者乃謂生雖不得位而没有所享以爲夫子榮謂有德之報雖堯舜莫若何其謬論者歟祭之禮以迎尸酌鬯爲盛釋奠薦饌直奠而巳故曰祭之略者其事有樂舞授器之禮今又廢則於其略者又不備焉然古之所謂吉凶郷射賔燕之禮民得而見焉者今皆廢失而州縣幸有社稷釋奠風雨雷師之祭民猶得以識先王之禮器焉其牲酒器幣之數升降俯仰之節吏又多不能習至其臨事舉多不中而色不莊使民無所瞻仰見者怠焉因以爲古禮不足復用可勝歎哉一無此四字大宋之興於今八十年天下無事方修禮樂崇一作尊儒術以文太平之功以謂王爵未足以尊夫子又加至聖之號以褒崇之講正其禮下於州縣而吏或不能諭上一有之字意凡有司簿書之所不責者謂之不急非師古好學者莫肯盡心焉榖城令狄君栗爲其邑未逾時修文宣王廟易於縣之左大其正位爲學舎於其旁藏九經書率其邑之子弟興於學然後一作后考制度一作圖記爲爼豆籩篚罇爵簠簋凡若干一作凡百餘事以與其邑人行事一本大宋之興至謂之不急一叚載于此下穀城縣政乆廢狄君居之朞月稱治又能載國典修禮興學急其有司所不責者諰諰然惟恐不及可謂有志之士矣吉州學記慶曆三年秋天子開天章閣召政事之臣八人問治天下其要有㡬施於今者冝何先使坐而書以對八人者皆震恐失位俯伏頓首言此非愚臣所能及惟陛下所欲爲則天下幸甚於是詔書屢下勸農桑責吏課舉賢才其明年三月遂詔天下皆立學置學官之貟然後海隅徼塞四方萬里之外莫不皆有學嗚呼盛矣學校王政之本也吉者致治之盛衰視其學之興廢記曰國有學遂有序黨有庠家有塾此三代極盛之時大備之制也宋興蓋八十有四年而天下之學始克大立豈非盛美之事須其乆而後至於大備歟是以詔下之日臣民喜幸而奔走就事者以後爲羞其年十月吉州之學成州舊有夫子廟在城之西北今知州事李侯寛之至也謀與州人遷而大之以爲學舎事方上請而詔巳下學遂以成李侯治吉敏而有方其作學也吉之士率其私錢一百五十萬以助用人之力積二萬二千工而人不以爲勞其良材堅甓之用凡二十二萬三千五百而人不以爲多學有堂筵齋講有藏書之閣有賔客之位有游息之亭嚴嚴翼翼壯偉閎耀而人不以爲侈旣成而來學者常三百餘人予世家于吉而一無此字濫官于朝一有廷字進不能􅐌揚一作明字天子之盛美退不得與諸生揖讓乎其中然予聞教學之法本於人性磨揉遷革使趨於善其勉於人者勤其入於人者漸善教者以不倦之意須遲乆之功至於禮讓興行而一無此字風俗純美然後爲學之成今州縣之吏不得乆其職而躬親於教化也故李侯之績及於學之立而不及待其成惟後之人母廢慢天子之詔而殆一作怠以中止幸予他日因得歸榮故郷而謁於學門將見吉之士皆道德明秀而可爲公卿問於其俗而婚喪飲食皆中禮節入於其里而長㓜相孝慈於其家行於其郊而少者扶其羸老壯者代其負荷於道路然後樂學之道成而得時從先生耆老席于衆賔之後聽郷樂之歌飲獻酬之酒以詩頌天子太平之功而周覽學舎思詠李侯之遺愛不亦美哉故於其始成也刻辭于石而立諸其廡以俟豐樂亭記脩旣治滁之明年夏始飲滁水而甘問諸滁人得於州一作城西南百歩之近其上豐山聳然而特立下則幽谷窈然而深藏中有清泉滃然而仰一無此字出俯仰左右顧而樂之於是䟽泉鑿石闢地以爲亭而與滁人徃遊一作還一有於字其間滁於五代干戈之際用武之地也昔太祖皇帝甞以周師破李景兵十五萬於清流山下生擒其將皇甫暉姚鳯於滁東門之外遂以平滁脩甞考其山川按一作桉其山水考其圖記升髙以望清流之關欲求暉鳯就擒之所而故老皆無在者蓋天下之平乆矣自唐失其政海内分裂豪傑並起而爭一有而字所在一有自字爲敵國者何可勝數及宋受天命聖人出而四海一嚮之憑恃險阻剗削消磨百年之間漠然徒見山髙而水清欲問其事而遺老盡矣今滁介於江淮之間舟車商賈四方賔客之所不至民生不見外事而安於畎畝衣食以樂生送死而孰知上之功德休養生息一作覆𬒳休養涵煦百年之深也脩之來此樂其地僻而事簡又愛其俗之安閑旣得斯泉于山谷之間乃一無此字日與滁人仰而望山俯而聽泉掇幽芳而䕃喬木風霜水雪刻露清秀四時之景一作美無不可愛又幸其民樂其歳物之豐成而喜與予遊也因爲本其山川道其風俗之美使民知所以安此豐年之樂者幸生無事之時也夫宣上恩德以與民共樂刺史之事也遂書以名其亭焉慶曆丙戌六月日右正言知制誥知滁州軍州事歐陽脩記醉翁亭記環滁皆山也其西南諸峯林壑尤美望之蔚然而深秀者琅邪也山行六七里漸聞水聲潺潺而瀉出于兩峯之間者讓泉也峯回路轉有亭翼然臨于泉上者醉翁亭也作亭者誰山之僧曰一無此字智僊也名之者誰太守自謂也太守與客來飲于此飲少輒醉而年又最髙故自號曰醉翁也醉翁之意不在酒在乎山水之間也山水之樂得之心而寓之酒也若夫日出而林霏開雲歸而巖穴暝晦明變化者山間之朝暮也野芳發而幽香佳木秀而繁隂風霜髙潔水清一作涸一作落而石出者山間之四時也朝而徃暮而歸四時之景不同而樂亦無窮也至於負者歌于塗行者休于樹前者呼後者應傴僂提攜徃來而不絶者滁人遊也臨谿而漁谿深而魚肥釀泉爲酒泉香而酒洌一作泉洌而酒香山肴野䔩雜然而前陳者太守宴也宴酣之樂非絲非竹射者中奕者勝觥籌交錯起坐而諠譁者衆賔懽也蒼顔白髪頽然乎其間者太守醉也已而夕陽在山人影散亂太守歸而賔客從也樹林隂翳鳴聲上下遊人去而禽鳥樂也然而禽鳥知山林之樂而不知人之樂人知從太守遊而樂碑有而字不知太守之樂其樂也醉能同其樂醒能述以文者太守也太守謂誰廬陵歐陽脩也居士集卷第三十九熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正御書閣記醴陵縣東有宫曰登眞朝佐按長沙志登眞觀名非宫也公父名觀故其功德觀亦曰西陽宫蓋避諱易之三十四卷胡文恭公墓誌醴泉觀使爲宫使亦以此至喜亭記始平蜀石本無始字于萬里于石本作千合蜀衆水出三峽爲荆江宋文粹云合蜀衆水歷三峽爲别江峽山之險與江相傾捍石本作悍舟人至此一作舟人之至此更生石本此字下有朝奉郎三字之停留也石本作弭櫂之地誌石本作識喜幸石本此字下有也字固爲下州石本無固字固爲固一作舊廪與俸一作守之廩俸朱公能朱一作獨愷悌石本作豈弟數大豐一作頻大登畫舫齋記以舟名之之一作焉榖城縣夫子廟記大宋之興一作宋興太平之功一無之功二字爲其邑其一作是有志之士矣此下一有寳元元年廬陵歐陽脩記十字吉州學記西北石本作西南知州事石本此字下有殿中丞三字人不以爲多石本無人字下句人不以爲侈亦無人字世家于吉于石本作於其入其石本作而者漸石本此字下有故字㛰石本作昬長幼石本作幼長至喜亭記吉州學記各有石本豐樂亭記欲求一無欲字之所一作之處道其此上有而字以與民共樂以一作而醉翁亭記宴酣一作宴適此卷峽州至喜亭記縠城夫子廟記再以慶曆四年宋文粹本挍之尚有不同又吉州學記以挍承平時閩本徃徃異辭疑是𥘉稾先巳傳布今録全篇附外集十三卷之後使學者有考焉
