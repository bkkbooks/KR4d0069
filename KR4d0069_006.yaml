body:
  text: 恩州賜契丹皇太后賀乾元節大使茶藥詔嘉祐四年二月二十四日卿夙將信聘方止中塗惟兹藥籙之良加之一作于茗品之美特伸頒一作恩賚式示眷懷恩州賜契丹皇太后賀乾元節副使茶藥詔同日卿肅将聘幣來及壽觴載嘉道路之勤宜有頒宣之寵仍伸撫勞當體眷優恩州賜契丹皇帝賀乾元節大使茶藥詔同日卿將命寳隣講歡壽節屬此暄和之候載惟渉履之勤宜頒品劑之良式示眷懷之意恩州賜契丹皇帝賀乾元節副使茶藥詔同日卿夙副聘軺來陳壽祝顧川塗之攸邈屬氣節之方和俾頒飲餌之精式助宣調之理端午帖子皇帝閤六首其一天容清永晝風色秀含薰五日逢佳節千齡奉聖君其二綵索盤中結楊梅粽裏紅宫闈九重樂風俗萬方同其三寳典標靈日明離正午方五行當火徳萬壽續天長其四歲時令節多休宴風俗靈辰重祓禳肅穆皇居百神衞滌邪寧待浴蘭湯其五香菰黏米著佳名古俗相傳豈足矜天子明堂遵月令含桃初薦黍新登其六聖主憂勤致治平仁風惠澤被羣生自然四海歸文徳何用靈符號辟兵皇后閤五首其一繭館覆柔桑新絲引更長紉爲五色縷續壽獻君王其二槐綠隂初合榴䌓􅝰欲然翠筒傳角黍嘉節慶年年其三煙含玉樹風生細日永宫花漏出遲深殿未甞知暑氣水精簾拂砌琉璃其四玉壷氷彩瑩寒光避暑宸遊樂未央采艾不須禳毒沴塗椒自已馥清香其五蘭苕擢秀迎風𬗋槿豓繁開照日紅嘉節相望傳有舊深宫行樂自無窮溫成閤四首其一香黍筒爲糭靈苗艾作人芳音邈已逺節物自常新其二珠箔涼颸入金壷晝刻長鸞臺塵不動銷盡故時香其三聞說仙家事杳微世傳真僞豈能知遥思海上三山樂寧記人間五日時其四雲散風流歳月遷君恩曽不減當年非因掩面留遺愛自爲難忘窈窕賢夫人閤五首其一冰壷凝皓彩水殿漾䡖漣繡繭誇新巧縈絲喜續年其二黄金仙杏粉赤玉海榴房共鬭今朝勝盈䄡百草香其三光風細細飄香轉綠葉隂隂覆檻涼雲物鮮明時節麗水精宫殿侍君王其四蓬萊仙闕彩雲中端日一作午欣逢歳歳同皎潔霜紈空詠扇深沉玉宇自生風其五古今風俗記佳辰樂事深宫日日新巧女金盤絲五色皇家玉曆夀千春皇帝回契丹皇帝賀乾元節書四月日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下乾陽正月紀兹載誕之辰隣聘修歡貺以千齡之祝書言既縟禮幣兼豐感著之私敷陳罔罄今彰聖軍節度使蕭供等回專奉書陳謝不宣白皇帝回契丹皇帝達皇太后賀乾元節書四月日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下壽節届期隣歡惇契仍導柔慈之旨過申延祝之言兼厚物容用増刻著顓希侍次達此悰誠今左監門衞上將軍耶律偘等回專奉書陳謝不宣白恩州賜契丹皇太后賀乾元節人使茶藥口宣卿等夙奉信函及兹誕節載勤馳傳方止中塗宜有寵頒用伸撫慰恩州賜契丹皇帝賀乾元節人使茶藥口宣卿等甫臨誕日來講隣歡載惟將命之嚴宜有勞勤之錫俾伸寵賚式示眷嘉天齊仁聖帝廟開啓祈祥迎福催生金籙道塲宻詞三月二十日伏以髙穹降慶方垂佑於邦家彌月吿期用薦誠於科籙冀衆真之昭鑒臻百順以儲休廣聖宫開啓催生道塲黙表三月二卜日伏以帶韣迎祥慶禖祠之叶應潔壇修薦致精懇以㝠祈俾因鱗瑞以通誠仰冀靈真之報福内中福寧殿開啓天祺節道塲青詞三月二十日伏以候臨初燠節紀嘉名肅嚴祕殿之居降集清真之馭薦之馨苾報以善祥豈惟敷佑於眇躬兼冀均休於庶品内中福寧殿罷散天祺節道塲青詞同日伏以薫風應候瑞節紀時按琳簡之真文嚴𬗋庭之邃宇衆靈來格㝠感交通嘉乃羣生蒙兹百福載傾䖍意鑒此明誠後苑親稼殿開建鎮星祈福道塲青詞三月二十日伏以祠禖叶應彌月告祥肅依科籙以薦誠仰冀照臨之降鑒錫之祉福佑以休一作保寧惟集慶於邦家永延鴻於基緒萬壽觀開啓永嗣保安道塲青詞伏以廟社降祥宫庭叶慶載㳙吉旦交薦明誠期仰格於清真俾敷延於祉福永昌基祚遐企靈休景靈宫天興殿開啓催生保慶道埸青詞伏以誕彌叶慶蠲潔修誠嚴祕殿於靈宫誦真文於蘂簡通此苾芬一作芳之薦祓其菑害之虞仰冀昭回丕符鑒祐護國顯應公廟開啓保安催生道埸青詞伏以正陽旅月載育開祥式因靈宇之嚴交薦精衷之潔仰冀衆真之貺敷昭百順之休永祚皇圖實希道䕃賜新除行刑部尚書依前觀文殿大學士知陳州劉沆讓恩命不允詔四月五日卿嚮以宰弼之崇屢形懇避居留之任因用均勞而休風藹然嘉問時至方深眷倚遽閱奏封顧惟陪輔之邦俾遂便安之請増之美秩優我舊臣豈祗循於故常蓋以示夫褒寵膺受之際逡廵以辭雖言匪飾文見於能讓而令行巳出難矣復還其體余懷徃祗新命雄州白溝驛賜契丹賀乾元節人使却回御筵兼撫問口宣四月十三日卿等聘函時達使傳言旋冒兹炎燠之辰渉此川塗之邈宜申宴錫式示眷懷賜中書門下戒僣奢詔五月四日敕中書門下朕纉承丕基撫有方夏謂教之不可以家至而行之毎務於身先惟是儉勤敢忘勉勵期與羣庶臻于富康而人殆乆安驕於佚欲物豐太盛耗以浮虚苟奉養以自私忘僣奢之爲戾士民交黷貴賤靡分惟其彊力之能無復等威之制考於著令雖有舊章顧在攸司鮮聞用法民遂安於常習弊罔革以滋深紀綱旣紊於度程風俗以至於流蕩俾朕有欲治之意不能副余之誠心而民多自陷之愚未免煩余之訓導夫令信由於貴始下化先於上行眷予一二之臣其率庶工而警職俾爾多方之衆勿踰常憲一作法以干刑庶漸革於侈風以共趨於治路凡居室之制器用之度冠服之章妾媵之數其令中外臣庶遵守前後條詔如有違犯仰御史臺及開封府糺察聞奏其諸路州軍即委轉運使提點刑獄臣寮及逐處長吏施行布告中外咸使聞知故兹詔示想宜知悉西太一宫續催生道埸宻詞四月二十六日伏以吉月迎祥靈禖叶應爰即清真之宇䖍修科式之儀冀祓滌於害災俾敷昭於福應載昌儲慶永佑基圖東太一宫開啓保夏祝聖壽金籙道埸宻詞四月二十六日伏以珍館邃嚴格真靈而來宅明誠蠲潔薦馨苾以交修導迎百順之祥及此長嬴之序伏願寳圖綿固壽曆延長永敷佑於邦家溥均休於品庶爲將來祫享禮畢奏謝内中福寧殿并景靈宫等處諸神表六月二十五日伏以清廟有嚴仲冬正序乃先時祭躬講禮文賴真靈之集休俾容典之咸舉仰膺佳貺彌勵丹衷爲將來祫享禮畢奏謝諸寺院表同日伏以宗廟之嚴祭祀惟重矧兹合食之義尤爲盛禮之文乃顧眇躬克成大饗實繄貺祐用薦菲誠内中爲將來祫享禮畢奏謝露香表同日伏以月正仲冬禮成大饗所以序昭穆之位格祖宗之靈荷清穹之降休俾盛典之獲舉敢伸昭謝冀達精衷爲將來祫享禮畢奏謝諸寺院神御表同日伏以兹者祗率孝心躬修合祭潔精誠而是薦蒙顧享之來臨惟慈聖之降休俾眇沖之成禮敢忘勵翼永荷基圖爲將來祫享禮畢奏謝永安陵等處表同日伏以恭承先烈獲守慶基式因冬物之有成載肅廟容而合食上繄丕貺克展孝思是惟感慕之誠益勵祗寅之志爲將來祫享禮畢奏謝泰山廟等處表同日伏以兹者因歳物之冬成講祭容而時舉豆籩有序禮樂交修顧惟眇躬克遵盛典實賴明靈之佑敢忘報貺之誠賜歩軍副都指揮使涇州觀察使秦鳳路副都部署王凱赴闕茶藥口宣六月二十五日卿祗膺召節方届都畿載惟道路之勤屬此炎薫之候宜頒良劑式示眷懷賜歩軍副都指揮使涇州觀察使秦鳳路副都部署王凱赴闕生料口宣同日卿出膺邊寄入恪覲容顧就館以云初方奉圭而來見宜頒餼勞式示眷懐除宋庠制加恩進封門下盡其志以饗親因而餕惠爵于朝而示衆所以襃功考祭典而可稽著國章而有舊矧乃樞機之任惟余鼎鼐之臣飭事齊莊宣力左右方此慶行之始宜推寵數之隆推忠恊謀同徳佐理功臣樞宻使開府儀同三司檢校太尉行兵部尚書同中書門下平章事兼羣牧制置使上柱國廣平郡開國公食邑七千八百户食實封二千九百户宋庠履行清純器識深茂夙有佳譽蔚爲名臣文足以爲國華學足以謀王體入則登于三事僃罄謨猷出則殿于大邦藹存風績自還機務頗歷歳時秉一徳以協恭出處不更其守展四體而盡瘁夙夜匪懈其勞屬盛禮之有成廣推恩而自近按夫輿地特啓於新封加以寵名蓋遵於故事惟是便蕃之錫式伸眷倚之懷於戯君子者邦之基大臣者民之表搢紳之望所屬老成徳業之隆豈煩多訓服我休命徃惟欽㦲可特授依前檢校太尉行兵部尚書同中書門下平章事兼羣牧制置使充樞宻使特封莒國公仍賜推忠協謀同徳守正佐理功臣散官勲食實封如故主者施行除李昭亮制加恩門下朕卜吉孟冬躬薦清廟祖考來格貺以百福之多慶賜遂行均于四海之廣惟子將相之任是謂股肱之良宜擇剛辰誕揚休命忠果守正佐運翊戴功臣彰信軍節度曹州管内觀察處置等使開府儀同三司檢校太保同中書門下平章事持節曹州諸軍事行曹州刺史上柱國隴西郡開國公食邑一萬一千五百户食實封三千四百戸李昭亮志尚純慤資識敏明世蒙舊徳之餘早遘重熈之盛僃于器使奮厥材猷好學詩書知將率之爲體兼推威信撫士卒以克和入則有宿衞之勤出則著扞城之效寄之方面屢守於要藩班乃政條頗一作頻聞於佳譽乃眷别都之重實司留鑰之嚴擁節秉鈞並享崇髙之貴治戎撫俗兼資鎮靜之材兹惟圖任之艱方屬倚毗之意是用因霈恩之浹洽推異數之便蕃廣乃䟽封増其真戸仍疇美績襃以嘉名於戯秉徳不回所以見始終之操好謙自守乃能居寵祿之榮汝其欽哉膺此優渥可特授依前檢校太保同中書門下平章事使持節曹州諸軍事行曹州刺史充彰信軍節度曹州管内觀察處置等使加食邑七百戸食實封四百户仍賜推誠保徳守正佐運翊戴功臣散官勲封如故主者施行除梁適制特授特進加恩門下王者嚴其宗廟饗必及其時盡其誠心祭則受其福朕躬執圭瓉率諸臣工因百物之成冬格列聖而合食嘉與有位之衆均兹錫祉之䌓矧惟槐鼎之舊臣實繫國家之大體宜優新命以告外庭推誠保徳忠亮翊戴功臣定國軍節度同州管内觀察處置等使光祿大夫檢校太傅使持節同州諸軍事同州刺史兼御史大夫上柱國安定郡開國公食邑四千七百戸食實封一千五百戸梁適世胄之華早躋仕路藝文自奮繼踐辭科進階顯榮亟被獎擢優游侍從之列甞奉於清間出入中外之勤實勞於夙夜既贊樞府遂登宰司啓沃之謀話言猶在進退之際禮遇兼隆自􅍓藩垣頗更歳月近惟大鹵實宿勁兵俾分節制之權以爲方面之重撫兹雅俗藉爾敏材屬熈事之有成均慶恩而方洽是用敘陟崇階之貴兼增食户之多推兹寵章蓋率舊典於戯執忠信之一節所以事君守富貴而不驕乃能終吉是惟素學寧假訓辭徃服茂恩當體予意可特授特進依前檢校太傅使持節同州諸軍事行同州刺史兼御史大夫充定國軍節度同州管内觀察處置等使加食邑七百戸功臣勲封食實封如故主者施行除許懷徳制加恩門下賞以懋功俾有能之知觀祭之爲澤思在位以咸均嘉盛禮之斯成務推恩而惟廣矧乃耆明之哲是爲心膂之臣宜示優隆式揚誕吿衞聖忠果雄勇翊戴功臣殿前都指揮使保寧軍節度婺州管内觀察處置等使特進檢校尚書左㒒射使持節婺州諸軍事行婺州刺史兼御史大夫上柱國潁川郡開國公食邑五千戸食實封一千二百戸許懷徳勁勇之質蓋稟天姿忠厚之良自爲國器少有四方之志出逢千載之辰藴其材謀能自奮勵訓我士卒號令之信甚明爲予爪牙介胄之色難犯爰採軍中之譽俾分闑一作閫外之權遂膺旄節之榮專董貔貅之旅宿衞宫禁周旋歲時宣力甚勤有知無不爲之節盡瘁後已加老而益壯之心誠未耗於精明豈但矜於矍鑠屬受釐之均慶方浹宇以蒙休載推圖舊之懷式叙疇勞之典益其封食錄乃功庸於戯享爵祿之崇髙荷寵靈之優渥挺金石不渝之操兹惟事上之誠知富貴克守之難用保有終之吉勉矣來効徃其欽㢤可特授依前檢校尚書左㒒射使持節婺州諸軍事行婺州刺史兼御史大夫充殿前都指揮使保寧軍節度婺州管内觀察處置等使加食邑七百戸食實封三百戸仍賜衞聖忠果雄勇宣力翊戴功臣散官勲封如故主者施行翼祖皇帝冊文維嘉祐四年歲次己亥十月壬戌朔十二日癸酉孝曾孫嗣皇帝臣某敢昭吿于髙祖翼祖簡恭睿徳皇帝伏以皇天眷命興徳造邦始基之功實自積累獲嗣丕烈敢忘翼勵孟冬吉月歳事旣成合祭以時舉兹禮典惟是僃物將以誠慤之心神其歆之錫以多福謹以一元大武柔毛剛鬛粢盛薌合薌萁嘉𬞞嘉薦醴齊嚴恭備物式薦䖍心髙祖妣簡穆皇后劉氏配尚饗真宗皇帝冊文維嘉祐四年歳次已亥十月壬戌朔十二日癸酉孝子嗣皇帝臣某敢昭吿于皇考真宗膺符稽古成功讓徳文明武定章聖元孝皇帝伏以古之以孝而饗親者氣節旣至感其思心礿禘甞烝禮以時舉然猶未猒其志也則又大合祖宗而享焉顧惟小子克守成業治民事神動有不訓是用躬執圭瓚薦其芬芳㑶一作愾又作慨然如聞來格來貺謹以一元大武柔毛剛鬣粢盛薌合薌萁嘉𬞞嘉薦醴齊嚴恭僃物式薦䖍心皇妣章穆皇后郭氏皇妣章獻明肅皇后劉氏皇妣章懿皇后李氏配尚饗淑徳皇后冊文維嘉祐四年歳次巳亥十月壬戌朔十二日癸酉孝孫嗣皇帝臣某敢昭告于皇祖妣淑徳皇后尹氏伏以彤管有煒内徳茂焉清廟載嚴合食爲重卜月惟吉僃物有容威靈來臨昭穆序配薦以誠潔神其顧思謹以一元大武柔毛剛鬣粢盛薌合薌萁嘉𬞞嘉薦醴齊嚴恭備物式薦䖍心尚饗賜樞密使宋庠讓恩命第一表不允批答省表具之朕以因時致享克展於孝思已祭受釐大均於慶澤乃眷耆明之哲實予體貌之臣肅臨事之有容既交神而蒙貺宜推異數以示眷懐雖嘉好謙曷止成命所讓宜不允賜樞密使宋庠讓恩命第二表不允斷来章批答省表具之卿藴純和端慤之誠富敏贍通明之學惟時舊徳實我柄臣當祀事之有成廣慶恩而方洽疇其封爵錫以號名兹爲寵章蓋舉常典無煩避讓其徃欽承所讓宜不允仍斷来章賜樞密使宋庠讓恩命第一表批答口宣熈事旣成方大均於祭澤寵章所異宜首及於樞臣當即徃膺勿煩沖讓賜樞宻使宋庠并河陽三城節度使判河南府文彦博加恩吿敕口宣朕以饗親致孝餕惠均恩宜有寵章以襃舊徳徃欽新命當體眷懷閤門賜華原郡王允良感徳軍節度使允初吿敕口宣蔚爲賢王陪我祀事旣膺福貺宜被寵靈徃體予懷祗服新命賜皇弟奉寧軍節度使華原郡王允良讓恩命第一表不允批答朕合食祖考以昭孝推恩宗族以展親所以厚人倫明教愛卿以近屬肅然在庭能盡志以修容不違禮而終事方慶典之均洽宜寵章之所先好謙之懷雖可嘉尚巳出之命其徃欽承賜皇弟奉寧軍節度使華原郡王允良讓恩命第二表不允斷來章批答卿擢秀宗英作屏王室從我祠事罄其齊明因餕惠之均恩示推仁而睦族避讓之節固巳識於沖懷敦諭旣勤宜徃祗於成命賜皇弟感徳軍節度使允初讓恩命第一表不允批答朕因時孟冬薦鬯清廟蒙祖考之來貺均慶賜以推行乃眷宗藩宜優寵數蓋克遵於舊典何過自於撝謙其欽訓言往服休命賜皇弟感徳軍節度使允初讓恩命第二表不允斷來章批答朕親𣢾太宫致饗列聖蒙神貺其百福思慶及扵多方乃眷宗藩宜優寵數惟是便蕃之錫式推敦睦之仁嘉乃沖懷形于懇避禮有常節無爲過恭命之巳行難或中止賜皇弟華原郡王允良感徳軍節度使允初讓恩命第一表不允批答口宣卿以宗藩之近參閟祀之嚴爰疇乃勞優以異數宜思祗受勿復固辭賜皇弟華原郡王允良感徳軍節度使允初讓恩命第二表不允斷來章批答口宣卿以宗支之賢陪廟祀之重均兹慶典遽述讓誠命出巳行理難中止所宜祗受以副予懷内制集卷第六外集卷第六歐陽文忠公集五十六律詩二雙桂樓嘉樹叢生秀兹樓層漢傍飛甍臨萬井伏檻出垂楊卷幕晴雲度披襟夕籟涼山河瞻帝里風月坐胡牀愛客東阿宴清歡北海觴淮南多雅詠歲晚翫幽芳題張應之縣齋小官歎簿領夫子卧髙齋五斗未能去一丘真所懷緑苔一作蘚長秋雨黄葉堆空堦縣古仍無栁池清尚有蛙琴觴開月幌窻戸對雲崖嵩少亦堪老行當與子一作子與偕和梅聖俞杏花誰道梅花早殘年豈是春何如艷風日獨自占芳辰錢相中伏日池亭宴㑹分韻罇爼逢佳節簮纓奉宴居林光拂衣冷雲影入池虚酒色風前緑蓮香水上踈飛談交玉麈聽曲躍文魚粉籜春苞解紅榴夏實初睢園多羙物能賦謝相如送辛判官𬒳薦方趨召還郷仍綵衣看山向家近上路逐鴻飛結綬同為客登髙獨送歸都門足行者莫訝柳條稀叢翠亭柳色滿重城岧岧出翠甍春雲依檻暖夕照落山明走馬章街曉飜鴻洛浦晴清罇但留客桴鼓晝無驚賀九龍廟祈雪有應真宰調神化幽靈應不言朝雲九淵闇暮霰六花繁朔吹縈歸斾賔𥚑載後軒睢園有客賦郢曲㡬人飜槐座方虚位鋒車佇改轅願移盈尺瑞為雨徧羣元早春南征寄洛中諸友楚色窮千里行人何苦賖芳林逢旅鴈候館噪山鵶春入河邊草花開水上槎東風一罇酒新歲獨思家花山寒食客路逢寒食花山不見花歸心隨北鴈先向洛陽家寒食值雨禁火仍風雨客心愁復悽隂雲花更重春日水平堤一作還西油壁逢南陌鞦韆出緑蹊尋芳無厭逺自有錦障泥寄謝晏尚書二絶送盡殘春始到家主人愛客不湏嗟紅泥煑酒嘗青杏猶向臨流藉落花爛漫殘芳不可收歸来惆悵失春逰綠隂深處聞啼鳥猶得追閑果下騮留守相公移鎮漢東周郊徹楚坰舊相擁新旌路識青山在人今白首行相公舊有方城題句問農穿稻野候節見梅英腰組人稀識偏應邸吏驚寄聖俞平沙漫去聲飛雪行旅斷浮橋坐覺山陂阻空嗟音信遥窮隂變寒律急節慘驚飈野霽雲猶積河長冰未銷山陽人半在洛社客無聊寄問陶彭澤籃輿誰見邀柴舍人金霞閣簷前洛陽道下聽走轅聲樹䕃春城緑山明雪野晴雲藏天外闕日落栁間營緩歩應多樂壷歌詠太平送王公慥判官久客倦京國言歸歲巳冬獨過伊水渡猶聽洛城鍾山色經寒緑雲隂入暮重臘梅孤館路疲馬有誰逢伊川獨逰緑樹遶伊川人行亂石間寒雲依晚日白鳥向青山路轉香林出僧歸野渡閑巖阿誰可訪興盡復空還逰彭城公白蓮荘謝墅多幽賞華軒曾共尋人閑聊載酒臺迥獨披襟水落陂光淡城當山氣隂惟餘桃李樹日覺翠蹊深普明院避暑選勝避炎鬱林泉清可佳拂琴驚水鳥代麈折山花就簡刻筠粉浮甌烹露芽歸鞍微帶雨不惜角巾斜送髙君先軰還家閑居寂寞靣重城過我時欣倒屣迎入洛機雲推俊譽逰梁枚馬得英聲風晴秀野春光變梅發家林鳥哢輕秖待登髙成麗賦漢庭推轂有公卿憶龍門楚客有歸心因聲道故岑依依動春色藹藹望香林山日巖邉下溪雲水上􅙨遥知懷洛社應復動郷吟贈梅聖俞時聞敗舉黄鵠刷金衣自言䏻逺飛擇侣異棲息終年脩羽儀朝下玉池飲暮宿霜桐枝徘徊且垂翼㑹有秋風時郡人獻花蝶遶蜂逰露滿盤芳條可惜折来殘我縁多病經春卧砌下花開不暇看龍門泛舟晚向香山暫解塵中􅌧来尋物外逰搴蘭流水曲弄桂倚山幽波影巖前緑灘聲石上流忘機下鷗鳥至樂翫㳺鯈梵響雲間出殘陽樹杪收溪窮興不盡繫榜且淹留荷葉與梅二分題採掇本芳陂移根向玉池晴香滋白露翠色弄清漪雨歇涼飈起煙明夕照移如何江上思偏動越人悲早赴府學釋奠羽籥興東序春秋紀上丁行祠漢丞相學禮魯諸生爼豆兼三代罇罍奠兩楹霧中槐市暗日出杏壇明昔齒公卿胄嘗聞絃誦聲何湏向闕里首善本西京和晏尚書夏日偶至郊亭關關啼鳥樹交隂雨過西城野色侵避暑誰能陪劇飲清歌自可滌煩襟稻花欲秀蟬𥘉嘒菱蔓𥘉長水正深知有江湖杳然意扁舟應許共追尋和晏尚書自嘲未歸歸即秉鴻鈞偷醉関亭醉㡬春與物有情寜易得莫嗔花解久留人題薦嚴院那堪多難百憂攻三十衰容一病翁却把西都看花眼斷膓来此哭東風寄題嵩巫亭平地煙霄向此分繡楣丹檻照清芬一作汾風簾暮捲秋空碧剰見西山數嶺雲題淨慧大師禪齋景徳寺普光院巾屨諸方遍莓苔一室前萎花吟次一作處落孤月定中圓齋鉢都人施談機海外傳時應暮鍾響来度禁城煙琵琶亭樂天曾謫此江邊已嘆天涯涕泫然今日始知予罪大夷陵此去更三千𥘉至虎牙灘見江山類龍門曉鼔潭潭客夢驚虎牙灘上作船行山形酷似龍門秀江色不如伊水清平日兩亰人少壯今年三峽歲崢嶸卧聞乳石淙流響疑是香林八節聲題張損之學士蘭臯亭碕岸接芳蹊琴觴此自怡林花朝落砌山月夜臨池雨積蛙鳴亂春歸鳥哢移惟應乗興客不待主人知霽後看雪赱筆呈元珍判官二首江上寒山秖對門野一作山花巖草共嶙峋獨吟羣玉峯前景閑憶紅蓮幕下人嘉景無人把酒看一作尊縣樓終日獨凭欄山城歲暮驚時節巳作春風料峭寒送致政朱郎中平生不省問田園白首忘懷道更尊已上印書辤北闕稍留冠蓋餞東門馮唐老有為郎戀踈廣終無任子恩今日榮歸人所羡兩兒腰綬擁髙軒留題安州朱氏草堂俯檻臨流蕙徑深平泉花木繞隂森蛙鳴鼓吹春喧耳草暖池塘夢費吟賭墅乞甥賔對弈驚鴻送目手揮琴嗟予逺捧從軍檄不得披裘五月尋題光化張氏園亭君家花㡬種来自洛之濵惟我曾逰洛看花若故人芳菲不改色開落㡬經春陶令来常醉山公到最頻曲池涵草樹啼鳥恱松筠相徳今方賴思歸未有因和聖俞百花洲二首野岸溪㡬曲松一作沿蹊穿翠隂不知芳渚逺但愛綠荷深荷深水風闊雨過清香發暮角起城頭歸橈帶明月魚秋水澄清見髪毛錦鱗行處一作慢水紋揺岸邉人影驚還去時向緑荷深䖏跳月天髙月影浸長江江闊風微水靣涼天水相連為一色更無纎靄隔清光棖子嘉樹團團俯可攀壓枝秋實漸斕斑朱欄碧瓦清霜曉粲粲繁星緑葉間初冬歸襄城弊居日落原野晦天寒閭市閑牛羊逺陂去鳥雀空簷間慿髙植藜杖曠目瞻前山壠麥風際綠霜鵶村外還禾黍日已熟杯酒聊開顔酣歌歲云暮寂寞向柴關和晏尚書對雪招飲瑶林瓊樹影交加誰伴山翁醉帽斜自把金船浮白蟻應湏紅粉唱梅花滑州歸鴈亭長河終歲足悲風亭古臺荒半倚空惟有鴈歸時最早柳含微緑杏粘紅送黄通之鄖郷君子貴從俗小宦能養賢無慚折腰吏勉食落頭鮮均人相尚食腐魚故俗傳爲落頭鮮困有亨之理窮當志益堅惟冝少近禍親髪況皤然秋日與諸君馬頭山登髙晴原霜後若榴紅佳節登臨興未窮日泛花光揺露際酒浮山色入樽中金壷恣灑毫端墨玉麈交揮席上風惟有淵明偏好飲籃輿酩酊一衰翁送楊君歸漢上我昔謫窮縣相逢清漢隂拂塵時解榻置酒屢横琴介節温如玉嘉辭擲若金趣當郷士薦無滯計車音後潭逰船見岸上看者有感河朔之俗不知嬉逰大名與真定以三月十八日爲行樂之日其俗頗盛喧喧誰暇聽歌謳浪遶春潭逐綵舟爭得心如汝無事明年今日更来逰春日獨居衆喧爭去逐春逰獨靜誰知味最優雨霽日長花爛漫春深睡羙夢飄浮常憂任重才難了偶得身閑樂暫偷因此益知為郡趣乞州仍擬乞山州得滕岳陽書大誇湖山之羙郡署懷疑物甚野其意有戀著之趣作詩一百四十言為寄且警激之峭巘孤城倚平湖逺浪来萬尋迷島嶼百仞起樓臺太守凭軒䖏群賔奉笏陪清霜薦丹橘積雨過黄梅逸思歌湘曲遒文繼楚材魚貪河岫樂雲忘帝郷回遥信雙鴻下新緘尺素裁因聞誇野景一作境自笑擁邉埃龍漠方多孽旄頭久示災旌旗時映日鼙鼓或驚雷有志皆嘗膽何人可鑿坏儒生半投筆牧竪亦輸財沮澤辭猶慢蒲萄館未開支離莫攘臂天子正求才幽谷種花洗山洗出峯巒看臘雪栽成花木趂新年央君功行今将滿誰肻同来作地仙鷺鷥激石灘聲如戰鼔飜天浪色似銀山灘驚浪打風兼雨獨立亭亭意愈閑贈歌者病客多年掩緑罇今宵爲爾一顔醺可憐玉樹庭花後又向江都月下聞初春新年變物華春意日堪嘉霽色初含栁餘寒尚勒花風絲飛蕩漾林鳥哢交加獨有無悰者誰知老可嗟送田䖏士秦士多豪俠夫君久遁名青山對髙卧白首喜論兵洛社當年盛莫加洛陽耆老至今誇梅聖俞張尭夫張子野延仲與予皆在洛中死生零落餘無㡬齒髪衰殘各可嗟北庫酒醪君舊物延仲前守汝隂西湖煙水我如家已将二羙交相勝仍枉新篇麗彩霞常州張卿養素堂江左衣冠世有名㡬人今復振家聲朝廷獨立清冰節閭里歸来白首卿志在言談猶慷慨身閑耳目益聦明長松野水誰為伴顧我堪羞戀寵榮西湖泛舟呈運使學士張掞波光柳色碧溟濛曲渚斜橋畫舸通更逺更佳唯恐盡漸深漸宻似無窮綺羅香裏留佳客絃管聲来颺晚風半醉廻一作還舟迷向背樓臺髙下夕陽中去思堂㑹飲得春字甲午四月潁州張唐公座上世事紛然百態新西岡一醉十三春自慚白髪隨年少猶把金鍾勸主人黄鳥亂飛深夏木紅榴初發艷清晨佳時易失閑難得有酒重来莫猒頻太傅相公入陪大祀以疾不行聖恩優賢詔書俞允發扵感遇紀以嘉篇小子不揆輒亦課成拙惡詩一首驛騎頻来急詔隨都人相與竊嗟咨自非峻節終無改安得清衷乆益思前席蓋将求讜議在庭非為乏陪祠尊賢優老朝家羙他日安車召未遲寄子春發運待制廣陵花月嘗同醉睢苑風霜暫破顔但喜交情久彌重休嗟人事老多艱壯心未忍悲華髪强飲猶能倒玉山留滯江一作五湖應不久多為春酒待君還答許發運見寄許詩云芍藥瓊花應有恨維揚新什獨無名瓊花芍藥世無倫偶不題詩便怨人曽向無雙亭下醉自知不負廣陵春贈廬山僧居訥方瞳如水衲披肩邂逅相逢為洒然五百僧中得一七始知林下有遺賢過塞二首一首巳見居士集身驅漢馬踏胡霜每嘆勞生秖自傷氣候愈寒人愈北不如征鴈解隨陽晏元獻公挽辭三首接物襟懷曠推賢品藻精謀猷存二府臺閣徧諸生帝念宫臣舊恩隆衮服榮春風緑野迥千兩送銘旌四鎮名藩忽十春歸来白首兩朝臣上心方喜親耆徳物論猶期秉國鈞退食圖書盈一室開罇談笑列嘉賔昔人風采今人少慟哭何由贖以身富貴優㳺五十年始終明哲保身全一時聞望朝廷重餘事文章海外傳舊館池臺閑水石悲笳風日慘山川解官制服門生禮慙負君恩隔九泉酬滑州公儀龍圖見寄畫舫齋前舊菊叢十年開落任秋風知君為我留紅斾猶記栽花白髪翁外集卷第六題張應之縣學夫子一作丈人錢相中伏日池亭宴㑹分韻中伏集本皆作中秋而詩無秋意又梅聖俞同賦此題亦云中伏且有徂暑之句今改正寄聖俞聊一作寥歸襄城弊居古詩誤入律詩中霽後看雪呈元珍判官第一首野花一作春花嶙峋一作璘珣奏議卷第六歐陽文忠公集一百二諌院論乞令宣撫使韓琦等經略陜西劄子慶曆三年臣竊聞已降中書劄子抽回韓琦田況等歸闕昨来琦等奉命廵邊本為西賊議和未决防其攻冦要為禦備今西人再来方有邀請在於事體必難便從邊上機冝正湏處置仍聞韓琦田況各有奏狀言邊防有備請朝廷不湏怯畏毎事曲從竊以勝敗之間安危所繫料琦等如此奏来則邊事可知自有枝梧不至敗誤臣謂且令琦等在彼撫遏則朝廷與賊商議自可以持重不湏屈就今議方未決中道召還則是使賊知朝廷意在必和自先弛備況事無急切何必召歸其召韓琦劄子伏乞速賜指揮抽回且令琦等在彼經略以俟西賊和議如何取進止論西賊議和請以五問詰大臣狀同前右臣伏見張子奭奉使賊中近已一作以到闕風聞賊意雖肯稱臣一有受冊字而尚有數事邀求未審朝廷如何處置臣聞善料敵者必揣其情偽之實能知彼者乃可制勝負之謀今賊非難料難知但患爲國一有誤字計者昧於逺見落彼姦謀茍一時之暫安召無涯之後患自為削弱助賊姦謀此左傳所謂疾首痛心賈誼所以太息慟哭者也今議賊肯和之意不過兩端而已欺罔天下者必曰賊困窘而求和稍能曉事者皆知賊權詐而可懼若賊實困窘則正冝持重以裁之若知其詐謀則豈可厚以金繒助成姦計昨如定等囬但聞許與之數不過十萬今子奭所許乃二十萬仍聞賊意未巳更有過求先朝與契丹通和只用三十萬一旦劉六符軰来又添二十萬今昊賊一口一有已字許二十萬到一作則他日更来又湏一二十萬使四夷窺見中國廟謀勝一作神筭惟以金帛告人則邈川首領豈不動心一旦興兵又湏三二十萬生民膏血有盡四夷禽獸無猒引之轉来何有限極今巳許之失既不可追分外過求尚可抑絶見今北虜往来尚在沿邊市易豈可西蕃絶逺湏要直至京師只用一作以此詞自可拒止至如青鹽弛禁尤不可從於我雖所損非多在賊則為利甚博況鹽者民間急用既開其禁則公私往来姦細不分若使賊捐一作損百萬之鹽以㗖邊民則数年之後皆為盗用矣凢此三事皆難允許今若只為目下苟安之計則何必愛惜盡可曲從若為社稷乆逺之謀則不止目前湏思後患臣願陛下試發五問詢於議事之臣一問西賊不因敗衂忽肯通和之意或用計困之使就和乎或其與北虜連謀而偽和乎二問旣和之後邊備果可徹而寛國用乎三問北使一来與二十萬西人一去又二十萬從今更索又更與之凡廟謀為國計者止有此䇿而已乎四問既和之後能使北虜不邀功責報乎虜或一動能使天下無事乎五問元昊一議許二十萬他日保不更有邀求乎他日有求能不更添乎陛下赫然以此五事問之萬一能有說焉非臣所及若其無說則天下之憂從此始矣方今急和謬議既不汚事發内葛宗古情理尤惡臣伏覩去年朝廷命賈昌朝等減省天下冗費上自陛下供御之物至於皇后宫嬪飲食已來盡皆減節盖謂調度至多公私已乏故陛下以身先天下自行減刻一作省要供軍費凡為邉将者所得一錢一帛冝思此物自生民困苦之中取其膏血陛下憂勞之際減自聖躬如此得之冝作如何使用今乃盗朝廷賞勞蕃夷之物贍飬求食婦人全家骨肉及供自已家口并營造工作私家冗用之類量其如此用心豈是愛君憂國忘身破賊之人何足愛惜若律文已重即乞盡行更不減法若舊法尚輕仍望特加重斷其滕宗諒王克庸若事狀分明亦望早賜勘鞫正行國典竊慮議者為宗古等方任邊陲冝從寛貸臣非不知駕馭英雄難拘常法如太祖委用李漢超等盖漢超能捍冦戎不為邊患功大過小理可優容諸將守邊未有尺寸之効而先已踰違不一無踰不二字法外恃敵在而欲望朝廷屈法姑息今朝廷未曽行寛假之患一作惠而此三人不法一作已各如此若更寛之則今後邊臣不復可以法制矣臣思邊上公使必欲使将臣不拘常法者若用之隂飬死士招延布衣利㗖敵人賞勞將校如此之數皆不必問其出入可恣所為或其性本闊略偶不點檢誤用於私家原其本情亦可輕恕若宗古等故意偷謾減刻宴犒蕃夷軍士之物入已者有何可恕之理特減從輕有何可贖之功得以屈法若此三人不行重斷則邊臣知元昊常在則一無則字可以常為不法臣恐翫冦弄兵事無了日今取進止論燕度勘滕宗諒事張皇太過劄子同前臣昨日風聞張子奭未有歸期消息賊昊又别遣人来必恐子奭𬒳賊拘留西人之来其意未測邊鄙之事不可不憂正是要藉將帥効力之際旦夕来三字一作近者傳聞燕度勘鞫滕宗諒事枝蔓勾追直得使盡邠州諸縣枷杻所行栲掠皆是無罪之人囚繫滿獄邊上軍民將吏見其如此張皇人人嗟怨自狄青种世衡等並皆解體不肯用心朝廷本為䑓官上言滕宗諒支用錢多未明虚實遂差燕度勘鞫不期如此作事揺動人心若不早止絶則恐元昊因此邊上動揺將臣憂恐解體之際突出兵馬誰肯為朝廷用死命向前臣忝為陛下耳目之官外事常合採訪三五日来都下喧傳邊將不安之事亦聞田況在慶州日見滕宗諒别無大段罪過并燕度生事張皇累具奏狀並不蒙朝廷報答況又遍作書告在朝大臣意欲傳逹於聖聽大臣各避嫌疑必不敢進呈況書臣伏慮陛下但知宗諒用錢之過不知邊將憂嗟搔動之事只如臣𥘉聞滕宗諒事發之時獨有論奏乞早勘鞫行遣臣若堅執前奏一向遂非則惟願勘得宗諒罪深方表臣前来所言者是然臣終不敢如此用心寜可因前来不合妄言得罪於身不可今日遂非致誤事於國臣竊思朝廷於宗諒必無愛憎但聞其有罪則不可不問若果無大過則必不湏要求瑕疵只恐勘官希望朝廷意旨過當張皇搔動邊鄙其滕宗諒伏望速令結絶仍乞特降詔旨告諭邊臣以不枝蔓勾追之意兼令今後用錢但不入已外任從便冝不湏畏避庶使安心放意用命立功其田況累次一作度奏狀并與大臣等書伏望聖慈盡取詳覽田況是陛下侍從之臣素非姦佞其言可信又其身在邊上事皆目見必不虚言今取進止再論燕度鞫獄枝蔓劄子同前臣昨日風聞燕度勘滕宗諒事枝蔓張皇邊陲搔動曽有論奏乞降詔旨安慰邊臣今日又聞度輙行文牒劾問樞宻副使韓琦議邊事因依不知燕度實敢如此否若實有之深可驚駭竊以韓琦是陛下一有左右二字大臣繫國家事體輕重今燕度敢兹無故意外侵陵乃是輕慢朝廷舞文弄法一作舞弄文法臣毎見前後險薄小人多為此態得一刑獄勘鞫踴躍以為竒貨務為深刻之事以邀強幹之名自謂䧟人若多則進身必速所以虚張聲勢肆意羅織今燕度本令只勘滕宗諒使過公用錢因何劾問大臣議邊事顯是節外生事正違推勘勑條況樞宻使是輔弼之任宣撫使將君命而行本藉重臣特行鎭撫今若無故遭一獄吏侵欺而陛下不與主張則今後奉君命而出使者皆為邊鄙所輕為大臣而作事者反畏小人所制故燕度論於國體便合坐以深刑責其俗吏亦自違於條制罪湏行遣情不可容今樞宻副使尚𬒳侵陵則以下將帥無辜遭其技蔓者不少據其如此作事此獄必無平允其滕宗諒一宗刑獄狀一作伏乞别選差官取勘結絶其燕度亦乞别付所司勘罪行遣取進止論乞不勘狄青侵公用錢劄子同前臣風聞邊臣張亢近為使過公用錢見在陜西置院根勘其勘官所取于連人甚衆亦聞狄青曽隨張亢入界見巳勾追照對臣㐲見國家兵興以来五六年所得邊將惟狄青种世衡二人而已其忠勇材武不可與張亢滕宗諒一例待之臣料青本武人不知法律縱有使過公用錢必不似葛宗古故意偷謾不過失於點檢致誤侵使而已方今議和之使正在賊中苟一言不合則忿兵為患必至侵邊謹備過防正藉勇將況如青者無三兩人一作三兩人而巳可惜因􅞫小公用錢於此要人之際自將青等為賊拘囚使賊聞之以為得計伏望特降指揮元勘官只將張亢一宗事節依公根勘不得枝蔓勾追其狄青縱有干連仍乞特與免勘臣於邊臣本無干渉豈有愛憎但慮勘官只希朝廷意㫖不顧邊上事機將國家難得之人與常人一例推鞫一旦乏人誤事則悔不可追伏乞朝廷特賜寛貸邊臣知無功之將犯法必誅一作行要藉之人以能贖過則人人自勵將見成功取進止論體量官吏酷虐劄子同前臣等風聞朝廷近降指揮與諸路轉運使令體量州縣官吏酷虐軍民者臣料朝旨如此必是因韓綱酷虐近致光化兵士亂作一作作亂故有此指揮竊以昨来光化兵變雖因韓綱自致其如兵亦素驕處置之間湏合中道韓綱自當行法驕兵亦合討除如此兩行方始得體今若明行號令徧約官吏則驕兵増氣轉更生心長吏畏避無由行事其所降與轉運司文字竊慮朝夕之間傳播中外扇動羣小引惹事端然巳失之令既不可追伏乞速降㫖揮與諸路轉運使令宻切禀行不得漏洩所貴别不生事取進止論募人入賊以壞其黨劄子同前臣竊聞京西賊盗日近轉多在處縱横不知火數所患者素無禦備不易枝梧然獨幸賊雖猖狂未有謀畫若使其得一暁事之人教以計策不掠婦女不殺人民開官庫之物以振貧窮招愁怨之人而為黨與況今大臣不肯行國法州縣不復畏朝廷官吏尚皆公然迎奉疲民易恱豈有不從若兇徒漸多而不暴虐則難以常賊待之可為國家憂矣以此思之賊衆雖多尚可力破使有一人謀主卒未可圖臣前因王倫賊時曾有起請十餘事内一件乞出牓招募諸處下第舉人及山林隱士負犯流落之人有能以身入賊筭殺首領及設計誤賊䧟於可敗之地者優一作重與酬獎所貴兇黨懷疑不納無頼之人以為謀主當時議者頗以為然伏乞採臣此意速降指揮與杜𣏌令所在張牓使賊聞知所貴投賊之人懷疑不納但無謀主尚可剪除取進止論冝專責杜𣏌捕賊劄子同前臣伏見昨張海等賊勢𥘉盛之時一有言字京西未有得力官吏遂自朝廷差臺官蔡禀催督一作監催捉殺後来巳别選杜𣏌充京西轉運使委以一路之事兼近日差出兵馬甚多分為頭項不少部分一作内進退湏要綂一指蹤一作縱號令不可二三竊慮杜𣏌蔡禀不相叶同各出異見凡指揮諸事使諸將難從一失事機反成敗誤自兵士差出今巳多時然未聞奏報與賊鬪敵及殺獲次第竊慮官兵互相廻避空作往来或恐進退之間號令不一致兹逗遛未見成功今雖賊奏稍稀然亦未見殺獲之數困獸猶鬪不可不虞冦死命窮一作冦賊死命恐未易敵合早除剪仍一作切湏一作湏由督貴況蔡禀是應急差出杜𣏌乃選材用之責任之間冝專在𣏌兼聞蔡禀自到京西處置多未合冝近聞欲枷一廵檢致得兵士喧譟㡬至生變苟或如此張皇竊恐别致生事其蔡禀伏乞早賜指揮抽回只委杜𣏌一面催捉庶得一作使專一早能一作得了當取進止論江淮官吏劄子同前臣聞江淮官吏等各為王倫事奏案已到多時而尚未聞斷遣仍聞議者猶欲一作為寛貸臣聞昨来江淮官吏或歛物獻送或望賊奔迎或獻兵甲或同飲宴臣謂倫一叛卒偶肆猖狂而官吏敢如此者盖知賊可畏而朝廷不足畏一有故字也今若更行寛貸則紀綱隳壞盗賊縱横天下大亂從此始矣何以知之昨王倫事起江淮官吏未行遣之間京西官吏又已弃城而走望賊而迎若江淮官吏不重行遣則京西官吏亦湏輕恕京西官吏見江淮官吏巳如此則天下諸路亦指此兩路為法在處官吏皆迎賊弃城獻兵納物矣則天下何由不大亂也臣伏思祖宗艱難創造塞圖陛下憂勤嗣守先業而一旦四夷外叛盗賊内攻其壞之者誰哉皆由前後迂繆之臣因循寛弛使朝威不振綱紀遂隳今巳壞之至此而猶不革前非以寛濟寛何以救弊如晁仲約等情法至重俱合深行議者無由曲解或聞以謂自是朝廷素不為備不可全罪外官假如有殺父與兄者豈可只言自是朝廷素無教化而不罪殺親之人又如有人掠奪生人男女金帛不可只言自是朝廷素無禮讓而不罪劫人之賊迃儒不可用可笑如此李熈古豈獨是朝廷素有備之州傳永吉豈獨是朝廷素練之兵盖用命則破賊矣今朝廷素無禦備爲大臣者又不責之守州縣者合有罪又寛之天下之事何人任責竊縁韓綱是大臣之家父子兄弟並一作盡在朝廷權要之臣皆是相識多方營救故先於江淮官吏寛之只要韓綱行遣不重今大臣不思國體但樹私㤙惟陛下以天下安危爲計出於聖斷以勵群下則庶㡬國威粗振賞罰有倫其晁仲約等乞重行朝典乞不寛恕取進止奏議卷第六論乞令韓琦經略陜西劄子如何一作之決論西賊議和狀彼者一作彼巳一旦二字一作及忽肯一作而肯一議此字下有和字論勘滕宗諒事劄子支用錢多一作用錢過多在慶州日日一作目憂嗟一作驚嗟獨有論奏獨一作猶再論燕度鞫獄枝蔓劄子虚張虚一作廣論乞不勘狄青劄子必不似葛宗古故意八字一作必非故意論江淮官吏劄子情法一作情理居士集卷第六歐陽文忠公集六古詩二十五首奉使契丹道中答劉原父桑乾河見寄之作憶昨𥘉受命同下紫宸朝問君當何之笑指北斗杓共念到幾時春風約囬鑣所持旣異事前後忽相遼歳月坐易一作若失山川行知遥囬頭三千里雙闕在紫霄我老倦鞍馬安能事吟嘲君才綽有餘新句益一作亦飄飄前日逢吕郭解鞍憇山腰僮僕相問喜馬鳴亦蕭蕭出君桑乾詩寄我慰寂寥又喜前見君相期駐征軺雖知不乆留一笑樂亦聊歸路踐冰雪還家脫狐貂君行我即至春酒待相邀書素屏我行三千里何物與我親念此尺素屏曽不離我身曠野多黃沙當午白日昏風力若牛弩飛砂還射人暮投山椒館休此車馬勤開屏置牀頭輾轉夜向晨卧聽穹廬外北風驅雪雲勿愁明日雪且擁狐貂温君命固有嚴羇旅誠苦辛但苟一夕安其餘非所云馬齧雪馬飢齧雪渇飲一作行踏冰北風卷地來一作寒峥嶸馬悲躑躅人不行日暮塗逺千山橫我謂行人止歎聲馬當勉刀無悲鳴白溝南望如掌平十里五里長一作長亭與短亭臘雪銷盡春風輕火燒原頭青草生逺客還家紅䄂迎樂哉人馬歸有程男兒雖有四方志無事何須一作煩勤逺征風吹沙一本題上有北字北風吹沙千里黃馬行确犖悲摧藏當一作窮冬萬物慘顔一作無色冰雪射日生一作争光芒一年百日風塵道安得朱顔長美好攬鞍鞭一作起鞭歸馬行勿遲酒熟花開二月時重贈劉原父一作憶昨呈劉原父憶昨君當使北時我往别君飲君家愛君小鬟𥘉買得如手未觸新開花醉中上馬不知夜但見九陌燈火人諠譁歸來不記與君别酒醒起坐空咨嗟自言我亦隨往矣行即逢君何恨邪豈知前後不相及歳一作日月怱怱行無涯古北嶺口踏新雪馬盂山西㸔落霞風雲一作雪暮慘失道路磵谷夜静聞麏䴥行迷方嚮但看日度盡山險方逾一作行沙客心漸逺誠易感見君雖晚喜莫加我後君歸秖一作纔十日君先躍馬未足誇新年花發見囬鴈歸路柳暗藏嬌鴉而今一作今來春物巳爛漫念昔草木冰未芽人生毎苦勞事役老去尚能憐物華從今有暇即相過安得載酒長盈車贈沈遵一作贈沈博士歌并序一本序云予昔於滁州作醉翁亭於瑯瑘山有記刻石往往傳人間太常博士沈遵好竒之士也聞而往遊焉愛其山水歸而以琴寫之作醉翁吟一調惜不以傳人者五六年矣去年冬予奉使契丹沈君㑹予恩冀之間夜䦨酒半出琴而作之予旣嘉君之好尚又愛其琴聲乃作歌以贈之羣動夜息浮雲隂沈夫子彈醉翁吟醉翁吟以我名我𥘉聞之喜且驚宫聲三疊何泠泠酒行暫止四坐傾一本有爲君屏百慮各以兩耳聽兩句有如風輕日煖好鳥語夜静山響春泉鳴坐思千巖萬壑醉眠處寫君三尺膝上橫沈夫子恨君不爲醉翁客不見翁醉一作醉翁山間亭翁歡不待絲與竹把酒終日聽泉聲有時醉倒枕谿石青山白雲爲枕屏花間百鳥喚不覺日落山風吹自醒一本有沈夫子君過滁陽今幾時滁人皆喜醉翁醉至今人人能道之長記山間逢太守籃轝酩酊揷花歸六句我時四十猶彊力自號醉翁聊戯客爾來憂患十年間一本客字下作爾來纔十年遇酒飲不得軒裳外飾誠可榮鬢髮未老嗟先白滁人思我雖未忘見我今應不能識沈夫子愛君一罇復一琴萬事不可干其心自非曽是醉翁客莫向俗耳求知音一本末兩句作髙懷所得貴自適俗耳何用求知音可笑人生不飲酒惟知白首戀黃金答聖俞一本題下有髙車見過人皆喜詩翁有酒誰肯一醉之嗟我獨無酒數往從一作就翁何所爲翁居南方我北走世路離合安可期汴渠千艘日上下來及水門猶未知五年不見勞夢寐三日始往何其遲城東賺河有名字萬家弃水爲汙池人居其上苟賢者我視此水猶漣漪入門下馬解衣帶共坐習習清風吹溼薪熒熒煑薄茗四顧壁立空無遺萬錢方丈飽則止一瓢飲水樂可一作何涯況出新詩數十首珠璣大小光陸離他人欲一不可有一作得君家筐篋滿莫持才大一作多名髙乃冨貴豈比金紫包愚癡貴賤同爲一丘土聖賢獨一作長如星日垂道德内樂不假物猶一作所須朋友并良時蟬聲漸巳變秋意得酒安問醇與醨玉堂官閑無事業親舊幸可從其私與翁老矣㑹有幾當弃百事勤追隨感興五首齋於醴泉宫作奉祠嚴祕館攝事罄精誠歳晏悲木落天寒聞鶴鳴念昔丘壑趣豈知朝市情弱齡嬰仕宦壯節慕功名多病慙厚禄早衰歎餘生未知犬馬報安得遂歸耕懷禄不知慙人雖不吾責貧交重意氣握手猶感激煌煌腰間金兩鬢颯巳白有生天地間壽考非金石古人報一飯君子不苟得憂來自悲歌涕淚下沾臆清夜雖云長白日亦易晚循環百刻中勢若丸走坂盈虧自相𥙷得失何足算餐霞可延年飲酒誠自損未知辛苦長孰若適意短二者一何偷百年皆不免顔囬不著述後世存愈逺聖賢非虚名惟善爲可勉仕宦希寸禄庶無飢寒迫讀書事一作爲文章本以代耕織學成頗自喜禄厚愈多責挾山以超海事有非其力君子貴量能無輕食人食唧唧復唧唧夜歎曉未息蟲聲急愈尖病耳聞若刺壯士易爲老良時難再得日月相隨東天行自西北三者不相謀萬古無窮極安知人間世歳月忽已易呉學士石屏歌一作和張生鵶樹屏一無和字晨光入林衆鳥驚腷膊羣飛鴉亂鳴穿林四散投空去黃口巢中飢待哺雌者下啄雄髙盤雄雌相呼飛復還空林無人鳥聲樂古木參天枝屈蟠下有恠石橫樹一作其間煙埋草没苔蘚斑借問此景誰圗寫乃是呉家石屏者虢工刳山取山骨朝鑱暮斵非一日萬象皆從石中出吾嗟人愚不見天地造化一作造物之𥘉難乃云萬物生自然豈知鐫鑱刻畫醜與妍千狀萬態不可殫神愁鬼泣晝一作日夜不得閑不然安得巧工妙手憊精竭思不可到若無若有縹緲生雲煙鬼神功成天地惜藏在虢山深處石惟人有心無不獲一作乃知人爲天地賊天地雖神一作公有物藏不得又疑鬼神好勝憎吾儕欲極竒恠窮吾才乃一作故傳張生自西來呉家學士見且咍醉點紫毫淋墨煤君才自與鬼神鬪嗟我老矣安能陪初食車螯一本題上云京師纍纍盤中蛤來自海之涯坐客𥘉未識食之先歎嗟五代昔乖隔九州如剖瓜東南限淮海邈不通夷華於一作于時北州人飲食陋莫加雞豚爲異味貴賤無等差自從聖人出天下爲一家南産錯交廣西珍富卭巴水載毎連舳陸輸動盈車谿濳細毛髮海恠雄鬚牙豈惟貴公侯閭巷飽魚鰕此蛤今始至其來何晚邪螯蛾聞二名車螯一名車蛾乆見南人誇璀璨殻如玉斑斕點生花含漿不肯吐得火遽已呀共食惟恐後爭先屢成譁但喜美無猒豈思來甚遐多慙海上翁辛苦斵泥沙送裴如晦之呉江一本無下三字注云席上分得己字雞鳴車馬馳夜半聲未巳皇皇走聲利與日争寸晷而我獨何爲閑宴奉君子京師十二門四方來萬里顧吾坐中人暫聚浮雲爾念子一扁舟片帆如鳥起文章冨千箱吏禄求斗米白玉有時沽青衫豈須恥人生足憂患合散乃常理惟應當歡時飲酒如飲水盤車圗一本上題和聖俞下注呈楊直講淺山嶙嶙亂石矗矗山石磽聱車碌碌山勢盤斜隨澗谷側轍傾轅如欲覆出乎兩崖之隘口忽見百里之平陸坡長坂峻牛力疲天寒日暮人心速楊襃一作生忍飢官太學得錢買此纔盈幅愛其樹老石硬山囬路轉髙下曲直橫斜隱見妍媸嚮背各有態逺近分毫皆可辨自言昔一作古有數家筆畫古一作乆傳多名姓失後來見者知謂誰乞詩梅老聊稱述古畫畫意不畫形梅詩詠物無隱情忘形得意知者寡不若見詩如見畫乃知楊生眞好竒此畫此詩兼有之樂能自足乃一作即爲富豈必金玉名髙貲朝看畫暮讀詩楊生得此可不飢答梅一作和無梅字聖俞莫登樓在禮部貢院鎖試進士上元夜作莫登樓樂哉都人方競遊樓闕夜氣春煙浮玉輪東來從海陬纎靄洗盡當空留燈光月色爛不收火龍㗸山祝千秋縁竿踏索雜幻優鼓喧管咽耳欲咻清風嫋嫋夜悠悠瑩蹄文一作輪蹄文角車如流婭姹扶欄車兩頭髧髦垂鬟嬌未羞念昔年少追朋儔輕衫駿馬今則不中年病多昏兩眸夜視曽不如鵂鶹足雖欲往意巳休惟思睡眠擁衾禂人心利害兩不謀春陽稍愆天子憂安得四野隂雲油甘澤以時豐麥麰遊騎踏泥非我愁答聖俞莫飲酒此巳下皆貢院中作子謂莫飲酒我謂莫作詩花開木落蟲鳥悲四時百物亂我思朝吟揺頭暮蹙眉雕肝琢腎聞退之此翁此語還自違豈如飲酒無所知自古不飲無不死惟有爲善不可遲一作遺功施當世聖賢事不然文章千載垂其餘酩酊一罇酒萬事峥嶸皆可齊腐腸糟肉兩家說計較屑屑何其卑死生壽夭無足道百年長短纔幾時但飲酒莫作詩子其聽我言非癡思白兎雜言戲答公儀憶鶴之作君家白鶴白雪毛我家白兎白玉毫誰將贈兩翁謂此二物皎潔勝瓊瑶已憐野性易馴擾復愛仙格何孤髙玉兎四蹄不解舞不如雙鶴能清皥低垂兩翅趂節拍一作拍節婆娑弄影誇嬌饒兩翁念此二物者乆不見之心甚勞京師少年殊好尚意氣橫出争雄豪清罇羙酒不輒飲千金争買紅顔韶莫令少年聞我語笑我乖僻遭譏嘲或𬒳偷開兩家籠縱此二物令逍遥兎奔滄海却入明月窟鶴飛玉山千仞直上青松巢索然兩衰翁何以慰無憀纎腰緑鬢旣非老者事玉山滄海一去何由招戲答聖俞鶴行而啄青玉觜枯松脚兎蹲而纍尖兩耳攅四蹄往往於人家髙堂浄屋一作室曽見之錦裝玉軸掛壁垂乍見拭目猶驚疑羽毛襂褷眼睛活若動不動如風吹主人矜誇百金買云此絶筆人間竒畫師畫生不畫死所得百分三二爾豈如翫物翫其眞凡物可愛惟精神況此二物物之珍月光臨静夜雪色凌清晨二物於此時瑩無一點纎埃塵不惟可醒醉翁醉能使詩老詩思添清新醉翁謂詩老子勿誚我愚老弄兎兒憐鶴雛與子俱老其衰乎奈何反捨我欲向一作去東家看舞姝須防舞姝見客笑白髮蒼顔君自照和梅龍圗公儀謝鷴有詩鶴勿喜無詩鷴勿悲人禽固異性所趣各有冝朝戲青竹林暮棲髙樹枝咿􅊯山鹿鳴格磔野鳥啼聲音不相通各以類自隨使鶴居籠中垂頭以一作似聽詩鶢鶋享鍾鼓魚鳥見西施鷴鶴不冝争所争良可知蚍蜉與蟻子爲物固已微當彼兩交鬪勇如聞鼓鼙有心皆好勝未免争是非於我一何薄於彼一何私欄檻啄花卉叫號驚睡兒跳踉兩脚長落泊雙翅垂何足充翫好於何定妍媸鷴口不能言夜夢以告之主人起謝鷴從我今幾時僮奴謹守護出入煩提攜逍遥遂捿息飲啄安雄雌花底弄日影風前理毛衣豈非主人恩報効爾冝思主人今白髮把酒無翠眉養鶴鷴又妬我言堪解頥和聖俞感李花昨日摘花𥘉見桃今日摘花還見李晴風暖日苦相催春物所餘知有幾中年多病壯心衰對酒思歸未得歸不及牆根花與草春來隨處自芳菲折刑部海棠戲贈聖俞二首揺揺牆頭花笑笑弄顔色荒涼衆草間露此紅的皪草木本無情及時如自得青春不可恃白日忽已􅉴繞之重吟哦歸坐成歎息人生浪自苦得酒且開釋不見宛陵翁作詩頭早白揺揺牆頭花豔豔争青娥朝見開尚少暮看繁已多不惜花開繁所惜時節過昨日枝上紅今日隨流波物理固如此去一作古來知奈何達人但飲酒壯士徒悲歌刑部看竹効孟郊體花妍兒女姿零落一何速竹色君子徳猗猗寒更緑京師多名園車馬紛馳逐春風紅紫時見此蒼翠玉凌亂迸青苔蕭踈拂華屋森森日影閑濯濯生意足幸此接清賞寧辭薦芳醁黃昏人去一作黃昏寂寂一作寂寂人去鎻空廊枝上月明春一作看鳥宿居士集卷第六熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正答聖俞則止一作即止石屏歌斵一作琢雄雌一作雌雄食車螯但喜一作知莫飲酒雕肝琢腎一作雕琢肝腎思白兎白鶴白雪毛石本作雙鶴輕霜毛嬌饒一作妖饒爭買石本作鬪買感李花摘花還見李花一作桃書簡卷第六歐陽文忠公集一百四十九與梅聖俞明道元年某再拜聖俞二哥昨日賢弟至辱寄書并前所寄二書及夢中詩又五百言詩頻於學士處見手迹毎一覩之便如相對別後雖尹氏弟兄王三並至然幕中事比聖俞在此時差多蓋東都興造日有湏求倉卒供辦未甞暫休息職此未始得從容聚首獨游嵩事一勝爾然而歷覽中春之遊山水之狀皆如故獨昔之青林翠壑今爲槁葉又目前不見聖俞回憶當時之事未一歳間再至尋見前迹已若夢中又河陽咫尺顧足下若萬千里又曩日恨不得同者尹十二王三今反俱遊而聖俞獨不至人生不一歳參差遂如此因思百年中升沈生死離合異同不知後㑹復幾人得同不得同也自足下去後未甞作詩前枉製未及和尹十二去應能盡說此中事故略不論知與師魯相見少酒爲歡值無酒寄去柰何漸寒千萬自愛不宣某白又明道元年某啓藥簡再至兩承示諭八老之名誠一時羙事然某本以寒郷下流後進𥘉學諸君子不知其駑下業巳致之交遊一旦坐評賢否欲求純雅沉實之名終不可得而乃特以輕儁裁之是知善譽者不能羙無鹽矣子評人正如是矣夫大雅之稱老成人重於典刑而仲尼謂三十而立某年二十有六尚未能立敢當老耶又今日不在㑹中自可削也夫人之美惡待其自然之譽乃見其實今縱求而得之是諸君待我素淺可知也所以孜孜不能黙受者諸君當世名流爲人所重一言之出取信將來使後世知諸君子以輕逸名我復自苦求方以美稱借之益重某之不可也削之益便某再拜七老又同前某啓捧來簡釋所以名老之義甚詳某常仰希儁游所望正在規益豈敢求辯博文才之過美哉前承以逸名之自量素行少岸檢直欲使當此稱然伏内思平日脫冠散髮傲卧笑談乃是交情巳照外遺形骸而然爾諸君便以輕逸待我故不能無言今若以才辯不窘爲逸又不足以當之也師魯之辯亦仲尼孟子之功也子聦之俊詩所謂譽髦之士乎公慥之慧亦大雅之明哲幾道之循有顔子之中庸堯夫之晦子野之黙得易之君子晦明語黙之道聖俞之懿是尤爲全德之稱矣必欲不遺逹字敢不聞命然冝盡焚徃來問答之簡使後之人以諸君自以逹名我而非苦求而得也又明道元年某啓承惠詩并序開闔數四紙弊墨渝不能釋手縁文尋意益究益深清池茂林俯仰觴詠它腸藴此欲寫未能聖俞所得文岀人外昔之山陽竹林以髙標自遇推今較古何下彼哉但恐荒淫不及而文雅過之也公操諸君詩未至今當以盛作遍呈因督之爾又明道二年某頓首再拜𥘉四日陳秀才來自河橋喜聆動静歳暮憀慄履況清佳甚慰甚慰又知府公已發薦章聖俞在洛時常言親老南方思一歸侍今應獲素志亦朋友之共榮也然作宰江浙山水秀麗益爲康樂詩助誰與敵哉某自奉別以來未甞作詩亦無文酒之㑹所謂三日不談道德則舌本強也𥘉六日有少吏事至彭婆約子聦應之宿香山獨恨不得與聖俞同爾逢彦國行聊寓此草草又同前某頓首再拜聖俞足下去月王侍禁者送及所惠書販傘船至又得書并鮑魚及問傘客知動静備詳甚慰甚慰僕來京師巳及歳矣未與足下別時毎相見惟道無憀賴憶洛中時以爲感況爾南北一異雖鬱鬱復誰道邪年来但不病爾往在臨清恨無舊歡今思臨清又不可得事事漸不如𥘉人生秖爾大可歎也足下素善南方今居之樂否比比得書甚略不能究所懷訝乆不作詩亦疑清興頓損也京師侍親窘衣食欲飲酒錢不可得悶甚時與師魯一髙論爾子漸在此毎相見欲酤酒飲亦不可得挍勘者非好官但士子得之假以營進爾余旣與世踈闊人所能爲皆不能正賴閑曠以自適若爾奚所適哉販傘者回來索書聊寫區區捨足下欲語誰邪臨紙徘徊不免忉忉又景祐五年某頓首啓去歳西陵曽拜狀今春量移此邑得子聰書知已在京尋得所示書伏承榮改京秩伏惟慶慰聖俞乆滯州縣今而泰矣下交忻慰何可勝言脩昨在夷陵郡將故人幕席皆前名縣有江山之勝雖在天涯聊可自樂此邑雖便於飲食醫藥然官屬無雅士軍牧虞曹此況不言可知也所幸老㓜無病恙而巳不知聖俞美任何處囚拘之迹相見未涯思渇思渇自拜别將五歳矣友益日踈俗狀日増篇詠之興略無清思聖俞新作雖京師多事不惜録示以開昬鈍而慰相思故人之惠莫越於此也至禱至禱賢弟云亡必深痛悲前得謝丈書已知之不勝歎悼也因人行速聊拜此冬寒希保愛不宣某頓首有亂道一兩首在謝丈處爲無人寫録得也聖俞略與臧否之某有少吏事告謝丈望聖俞與咨啓之略語伊法官少爲庇隱某自作令毎日區區不敢似西都時放縱此来事亦得正但爲上官見怒曲有駮議然亦終無可駮縱有亦非大罰其如危辱之跡不欲使有小過也或聖俞問得謝丈一言乞批數字送與附書人也千萬千萬某又上又寳元二年某頓首啓前者見邸報有㐮城之命乃知當與謝公偕行然竊料舊尹當徙蜀聖俞即留領縣事㐮城居孔道音信自此可日置疑是以慢然未能作書及縣走接太守還得手書乃知前至南陽南陽去邑其間一驛爾某當請見直以公新下車方布條教伸威信門生故人未冝徃累於其間湏其旬浹少定爾又恐聖俞莫能乆留或略命駕見過此大幸也爲别五六歳貶徙三年水陸走一萬二千里乃於此處得見故人所以不避百餘里勞君子而坐邀也顒俟顒俟相見旦夕爾他不復道又同前某啓承九月一日就道雖爲遲留然清風白牛乆雨泥淖尤湏大晴然後不阻某自解官觸事不快至今幾五十日未能脫去豈其屯蹇未極邪所幸親老漸安更三五日可以卜行南陽之居依賢主人實佳事但恨聖俞不在爾昨夏中雖喜㑹於清風然猶未盡區區之懷今兹寓居方欲悉屏他事爲聖俞極數日之歡而先後參差若相避然又見聖俞書中言有事欲相見以不充爲恨者益令人怏怏爾到官必有日南陽人便無惜寄音一作意相及秋寒自愛又同前某頓首前遣公幹馳信迎候蓋𥘉約然亦頗疑酷暑如此非乗興之時人還得書果爾及急足至又沐榮問承暑中起居無恙甚慰甚慰前累求新作今者書尾有自厭之說豈可疾淫哇而欲廢置律吕百花洲唱和必多欲一讀以祛俗累之心何可得也孫書注說日夕渇見已經奏御敢借示否蒙索亂道恰來盡呵呵講席所說何書因信乞示及晝寢之樂當輸閑者聖俞不得獨擅也謝氏詩昨忘附去今又却尋不見候見納去矣旱熱可畏千萬保重又同前某頓首啓谷正來得所示書及見與謝家書甚詳云買洪氏莊與卜葬市屋業皆其所急者也又云減俸爲助此特聖俞患於力弱不能厚報知已而然爾恐於謝氏無益而於聖俞有損爾聖俞若此月減三五千如失萬錢謝氏族大費多得之未覺甚助謝家亦自有書必言幸思之也洪氏莊極佳爾不湏聖俞竭嚢槖此固親朋好事然幸其可以自辦爾望聖俞力爲幹之某行必爲帶錢去葬地已就此營卜及市屋業差有緒然此不可倉卒爾他細故盡諭谷正可詢之鄧氏醵賻巳止皆如雅意某年盡必到㐮城祭文挽辭極佳冬冷保重又康定元年某頓首再拜啓自八月一日至京師及今已兩辱書并在東都凡三辱詩皆未還答非惟恃聖俞不以書之䟽數爲親踈又以將遣專人而多事未能便遣故也前知爲水災所苦此常事不足置胷中親老求官南方此理當然安撫見辟不行非惟奉親避嫌而巳從軍常事何害奉親朋黨蓋當世俗見指吾徒寧有黨耶直以見召掌牋奏遂不去矣文雅處家事方於薛氏求一屋爲貯之勿慮也某於此幸老㓜無恙但尤貧不可住京師非乆亦却求外𥙷日一作旦夕相識多忙不暇作詩足下必不憚見寄閑吟者皆録示千萬冬冷保重又同前某頓首啓前謝監簿行附書問差遣書去後兩日知審官擬定湖州城中監稅不勝喜慰然不即走書專報者意謂勑下自當知及弓手至得書尚云云始怪何處稽留至今未到然今必至矣不爾當爲督也俟春入京尤便但不知何處少留某自還館日夕怱怱筆研非答書簡寫門刺未甞視昨夕子履偶來㑹宿聮句數十韻奉寄且以爲謔又有前奉答長句併録附去可笑可笑歳陽以来風日慘然土霧雜下氣候不常萬萬自重又慶曆四年某頓首累辱書爲慰何巳然乆不致問者勞逸不同於理冝然諒不爲罪經城楊宰來備詢動止承乆困輦下何時可赴任所示盛編云巳了甚於飢渇也此人回望一信容專令人去取使人致來恐糜費銘文不煩見督不乆納上秖爲湏索要好者恐未盡爾呵呵昨在真定有詩七八首今録去班門弄斧可笑可笑然相別乆無以爲娯爾前有水谷詩見祁公云子美祕不令人見畏時譏謗吾徒廓然以文義爲交豈避此輩子美豪邁何乃如此世塗萬態善惡由已所謂禍福有非人力而致者一一畏避怎生過日月也其它非面不盡近書見教審聽敢不佩服咫尺更有所聞不惜一一示及有酒少人致去柰何柰何夏熱千萬保重又慶曆六年某頓首貶所僻逺特煩遣人至此并得陳留書新集詩見寄詩見和詩外雜詩一卷碑文數本千字文等豈勝慰喜瑯瑘泉石篆詩秖候子美詩來巳招子美自來書而刻之遊山六詠等即欲更立一石不惜早見寄也詩序謹如命附去蓋述大手作者之美難爲言不知稱意否其他事谷正在此數日備見所爲可知居此之況不煩述也閉戸飽韲之句怎生諱得呵呵相次奉和見寄詩別拜狀次春暖千萬保重又慶曆七年某又啓去年夏中因飲滁水甚甘問之有一土泉在城東百歩許遂徃訪之乃一山谷中山勢一面髙峯三面竹嶺回抱泉上舊有佳木一二十株乃天生一好景也遂引其泉爲石池甚清甘作亭其上號豐樂亭亦宏麗又於州東五里許菱溪上有二怪石乃馮延魯家舊物因移在亭前廣陵韓公聞之以細芍藥十株見遺亦植於其側其他花竹不可勝紀山下一徑穿入竹篠蒙宻中豁然路盡遂得幽谷泉名幽谷已作一記未曾刻石亦有詩託王仲儀寄去不知逹否告乞一篇留亭中因便望示及千萬千萬又慶曆七年某頓首谷僕来捧書得詢動靜又見詩中所道有相遊從唱和之樂備詳平日幕中所爲可勝慰也某此愈乆愈樂不獨爲學之外有山水琴酒之適而已小邦爲政朞年粗有所成固知古人不忽小官有以也示及飲酒今春來頗覺風壅亦不能劇飲如徃時然自作主人後從已便承見戒多荷多荷他事非獨不挂口亦不關心固無淺深可示人也某母老多病而身纔過四十頓爾心䦨岀處君子大節有所未果不敢効俗夫妄言爾春暄千萬保重又慶曆六年某頓首啓自谷正去後更不曽上狀蓋以經夏大暑秋來或聞移南京或云来與刁氏成親一向因循遂成踈懶然中間却得聖俞所寄六詠及桐花啼鳥等詩近又得刁十六所寄詩書即日必已還許冬冷尊候萬福某居此乆日漸有趣郡齋靜如僧舎讀書倦即飲射酒味甲於淮南而州僚亦雅親老一二年多病今歳夏秋以来安樂飲食充恱省自洛陽别後始有今日之樂詩頗多不能一一録去未相見間惟冀保愛多時欲作書無便今託提刑趙學士謹附此不宣又慶曆𥘉某啓爲親老乆疾乍進乍退醫工不可用日夕憂迫不知所爲蓋京師近上醫官皆有職局不可請他兼亦傲然請他不得近下者又不知誰可用親疾如此無醫人下藥爲人子何以爲心京師相知少不敢託他告吾兄與問當看有不繫官醫人或秀才處士之類善醫者得一人垂報待差人賫書帛去請他幸爲博訪之聖俞聞此必挂意更不奉禱也如有所得亦速遣此人回其他不暇忉忉又某啓近君謨學士行曽奉狀尋得邸報承有岀身之命士大夫公議未厭皆爲聖俞嗟惋獨某不然未知髙明自以爲如何也聖俞卓卓於後世者不以名位爲輕重取重於今世者亦豈以此小得失哉苟以寵辱爲意則布衣之樂有優於華衮之憂畏也老兄應能自逹不忉忉也已寒保愛又皇祐五年某啓見謝亶言新生小息不安甚撓懷然書中不言難以爲信聖俞居京師冝其不樂然業巳至此當少安之某哀苦殊無生理閑中靜思處世無有好處惟當識者自遣之爾云欲来此深荷厚意然恐差遣理當難得遂止爲佳已熱慎疾寛中爲禱又皇祐五年某啓徐先輩人至辱書果承有小嬰之念時暑益當自寛爾某孤苦中中外多事偷閑便思一得故人爲㑹某不可徃聖俞不可来柰何柰何惟當一讀新篇若㑹面而聖俞惜不寄又將柰何柰何陳碑不可增矣斯人不曉文義有三兩處是行狀所無出米修路等意若果有當書何故而略切丁寧喻之此輩不向道亦終不知近併作書此不一一某再拜四月十九日賜茶賜醫常事爾謚前面官衘中巳有贈官亦然散侍郎作相不足爲榮但問人如何爾若材堪則自胥靡亦作相如不堪則乃是僥倖但如是向道無妨又同前某啓謀葬事未得恐遂後時日極撓悶蓋以術者太精自家又全不㑹秖信他人道不好便疑惑不敢使非效俗流求吉地圖官國山髙也夏侍中父葬于虜契丹必不與你擇官國山地葬也閑中不曽作文字秖整頓了五代史成七十四卷不敢多令人知深思吾兄一看如何可得極有義類湏要好人商量此書不可使俗人見不可使好人不見柰何柰何失音可救曽記得一方秖用新好槐花尋常市中買來染物者於新瓦上慢火炒令熟置懷䄂中隨行隨坐卧譬如閑送一二粒置口中咀嚼咽之使喉中常有氣味乆之聲自通病愈新篇幸多爲寄此小簡立焚勿漏史成之語惟道意於君謨同此也失音脚氣皆是下虚吾徒老矣省些斟酌斟酌某此居哀獨宿然以憂惱亦自多病恐知又皇祐五年某頓首聖俞博士兄徐無黨人回奉狀隂雪不止體氣若何某爲近得君貺家書報薛家夫人不安老妻日夕憂撓尊年乆患誠亦可憂但薛宅書來止云無大段疾苦奉煩吾兄因見公期爲與問一的信因便相報吾兄書家人不見略要知其増減又爲妻子要去歸省其母亦欲過中祥遣他去貴先知彼中逺近爾某自要知謝氏有人還幸批數字逼節哀苦中立偶人行草此又皇祐五年某啓近謝秀才人行甞奉狀日來起居清勝某哀苦如昨私門日益多事又爲妻母近病湏令家人一徃省之前甞奉託詢問乆候来報也近爲子羙編成文集十五卷凡述作中人可及者巳削去之留其警絶者尚得數百篇後世視之爲如何人也朋友之間可以爲慰爾某益衰病庻事不耐煩惟常守書冊危坐爾聖俞數許新詩不見寄似近日頗以爲難何也因兒子輩行奉此春一作巳暄保重又同前某啓寄惠鴨脚子甚竒趙三書信已領聖俞詩屢見許甚渇見何必自冩小兒輩可録某亦厭書字因思學書各有分限殆天之禀賦有人力不可彊者往年學弓箭銳意三四年不成遂止後又見君謨言學書最樂又銳意爲之冩來冩去却轉不如舊日似逆風行船著盡氣力秖在舊處不能少進力竭心勌遂巳身老矣安能自苦如此耶乃知古今好筆一作書蹟真可貴重也今後秖看他人書亦可爲樂不能生受得也數日隂悶昬然因作聖俞書頓覺豁然如有所釋若遂一握手可勝爲慰也謝景平文字下筆便佳他日當有立於世何止取一科第而已吾徒可爲希深喜也胥太祝且爲伸意某卜葬地尚未買得相次決定當有書報他也怱怱不宣又皇祐五年某啓前日謝氏人還辱書承尊候已復康佳新正必倍清勝某孤苦如昨爲有二小姪一在象州乆不得信一在袁州欲乞渠来潁以辦葬今劄其官位姓名託與問一消息恐難得便但却因謝氏人見示可也吾兄清一作情懷不樂俗事某寡相識煩聒甚悚甚悚又皇祐五年某啓忽忽度日無生意衙前行曽奉狀徐生人至辱書承春寒尊體清勝爲慰無已某哀苦中尋得葬地欲趂八月十月襄事但庻事少人辦集小姪煩爲問當巳有削必得請師魯文字俗本妄傳殊不知昨范公已爲作序李厚編次爲十卷甚有條理厚約春末見過當與之議定別謀鏤本也自春隂寒少晴明病體不勝疲勞勌於書字不能周悉又嘉祐三年某啓動輒旬浹不奉顔采雪寒如此無復清思區區可知亦怪聖俞未甞見顧得簡示乃云不登權門若以此見格何望於老兄某毎日晚多在家因岀望見過幸甚如晦所欲已起奏難於更奏蔡州亦應湏得簿書煩擁走此爲答殘雪可愛能見顧尤望又嘉祐二年某啓大熱甚於湯火之烈兩日差涼粗若有生意然以家人病患飲食不能自給區區煎迫殊亂情悰乆不承問不審尊體何似二十二日欲就浴室或定力餞介甫子固望聖俞見顧閑話恐別許人請故先拜聞禮部詩納上又嘉祐二年某啓承惠答蘇軾書甚佳今却納上農具詩不曽見恐是忘却將來今再今去取讀軾書不覺汗出快㢤快㢤老夫當避路放他出一頭地也可喜可喜罰金未下何害不必居家俟命因出頻見過某居常在家吾徒爲天下所慕如軾所言是也柰何動輒逾月不相見軾所言樂乃某所得深者爾不意後生逹斯理也又同前某啓以小兒子傷寒巳較因勞復發今日錫慶齋㑹亦去不得愁坐忽得所示爲之豁然憂煎病患常以爲苦思効榴花之飲不可得也三兩日兒子安聖俞過不惜頻相訪借馬若脩家又何厭也三十年前事信如前生憂樂不同可歎可歎亦約子固子履當奉白也秖候兒子稍安爾人還謹此又嘉祐二年某啓經節伏惟以時納祐昨日早至薛二家空心飲十數杯遂醉歸家却與諸薛飲承見過仍留刺何乃煩老兄如此旣醒不遑無以自處也節下外處送酒頗多徃時介甫在此毎助他爲壽昨秖送王樂道及吾兄爾愚性踈簡人事不能周然意之所至實發於誠心蒙惠簡云有所答則非也恐不知鄙懷故略自陳述二十二日欲同子履和叔閑話少時先白恐他有所適也又同前某啓隂雨累旬不審體氣如何北州人有致逹頭魚者素未甞聞其名蓋海魚也其味差可食謹送少許不足助盤飡聊知異物爾稍晴便當書局奉見又同前某啓中前在范家坐中已覺不佳所以都無情緒數日勉強有事相役旣歸遂倒卧以岀汗頗多亦利動臓腑頓覺體虚幸連日不朝免得請告更三兩日不知可出未承問念感愧亦審中酒吾輩年髙不獨他事至於飲酒亦不能如故時也更希慎愛又嘉祐二年某啓谷正来承惠詩老重深粹不似頃刻間成何其敏妙至此也早来得筆絶佳不圖若此之精其精如此豈常有邪然乆無稱手者乍得甚快意多感多感暑中絶近文字不得無以度日時因作書簡得一揮毫尚可銷憂爾人還姑此奉謝又同前某啓兩日不出方爲杜公作銘承惠詩絶髙恐不可繼且留欵曲試和待稍髣髴則將出雨乆作柰何天災斯人豈惡之也其亦有以邪昨夜暫止頗緩奔走之計然遑遑何時得遂安居漸涼思奉言笑何可得人還姑此又同前某啓自入夏閭巷相傳以謂今秋水當不減去年𥘉以爲訛言今乃信然兩夜家人皆戽水并廼翁逹旦不寐街衢浩渺岀入不得更三數日不止遂復謀逃避之處住京況味其實如此柰何柰何方以爲苦不意公家亦然且湏少忍特承惠問存䘏多感多感蔡君謨寄茶来否悶中喜見慰人還忉忉又嘉祐四年某啓適至書局承自釋奠處方歸困倦不敢坐邀忽辱惠教兼得唐子方家行狀謹當牽課然少寛數日爲幸其如行狀中泛言行已殊不列事迹或有記得者幸更得數件則甚善又云有尹師魯所作墓誌亦得一本尤幸也尋常人家送行狀来内有不備處再三去問蓋不避一時忉忉所以垂永乆也乞以此意逹之又嘉祐三年某啓旦夕寒色尤盛衰病者殆不能勝矣不知吾兄尊候如何昨夜再讀和景仁雪詩甚妙兼以韻難如何可和且秖和得歳日書事一篇其元所示遂留之過節更送他處告别冩去也手筆凍縮書字不得韓范二公詩看了示下印卷子何日了因出見過隂寒公事頗少甚閑恐知又嘉祐三年某啓累日不奉見不審體氣如何兼以俗事無由奉詣理固當然聖俞遂以權門見薄無乃太僣也前承惠白兎詩偶尋不見欲别求一本兼爲諸君所作皆以常一作蟾娥月宫爲說頗願吾兄以他意别作一篇庻幾髙出羣類然非老筆不可亦聞有與如晦一篇甚佳皆乞取蘇大挽辭一首閑寫助一笑今日偶在家謹奉此又嘉祐四年某啓前日承見過偶他客多不遂𣢾曲快晴意體想佳梅公儀來要杭州一亭記述游覽景物非要務閑辭長說巳是難工兼以目所不見勉彊而成幸未寄去試爲看過有甚俗惡幸不形迹也程碑當便下手秖如唐書亦湏了爾又嘉祐年某啓雨不止情意沈鬱泥深不能至書局體候想佳某以手指爲苦旦夕來書字甚難恐遂廢其一支豈天苦其勞於筆研而欲息之邪悶中謹白又嘉祐三年某啓經節隂雨猶幸且晴不審尊候何似閑作歸田樂四首秖作得二篇後遂無意思欲告聖俞續成之亦一時盛事來日食後早訪及爲望又同前某啓承寵惠二篇欽誦感愧思之正如雜劇人上名下韻不來湏勾副末接續爾呵呵家人見誚好時節將詩去人家厮攪不知吾輩用以爲樂爾後日絶早過喫不托適簡誤云食後這回不是􅈦子誤也又嘉祐四年某啓自承在式告兼以假故多遂阻奉見秋氣稍涼喜承體候清安辱惠建茗此誠近所難得特爲珎貺也然莫妨待客否恐彼闕當却分納一半也原甫髙論少抑亦當不復較難來日朝中當面叙人還謹此爲謝某再拜書簡卷第六與梅聖俞第一帖事一勝爾一本作事勝爾第三帖笑談一作談笑諸君一作疑諸君第六帖販傘者者一作人第十一帖此固一作此乃第十六帖移在一作移至第二十八帖無巳一作何巳第三十三帖諸薛飲一作諸胥薛飲第三十八帖此帖合在第三十七帖之前第四十三帖天苦一作天惡第四十五帖後日一作来日表奏書啓四六集卷第六歐陽文忠公集九十五上胥學士偃啓天聖六年某聞在昔築黄金之館首北路以争趨附青雲之名使西山而起價誠以求千里之迹者先其市骨得一字之寵者榮於衮章而況天下之風采聳聞口吻之雌黄並出以末塗之佁儗說定鑒於妍媸目論所加能令重於九鼎髦端或倚可使逸於太霄是冝殫重趼宿舂之勞懷漫刺署里之字鋪論有素題品攸歸伏惟某官禀粹天英抽華道秘虹蜺逺映拂霄堮而垂光黼黻摛文絢雲河而發藻遊士郷而著品入聖域以踐優爽爽之聲軼前良而通羙琅琅其璞瑞昭世以稱珍爰自覽輝下翔階木特起掎𬒮於羣英之彀頍弁乎千齡之辰列坐棘以聮曹署法庭而奏讞若若懐綬宛轉於一綸翹翹聘車雍容於半刺陳仲舉以題輿而擅羙何恭祖以纚幘而馳稱垂腰佩刀見賞三公之器追鋒給傳終膺雙武之皮第連最以推髙賁𥘉儀而上獲公車以兩令而持牘綈几以十篇而奏文禪衣曲𥚑暮召犬臺之對尚方給札霈灑鴻都之毫雖西崑者冊書之藏是開乎仙室而東壁者文章之府載郁於時風居爲顯化之階式是育材之地爰膺麗正之選首𬒳集仙之名白蟫芸簡以生香兹焉辟惡紫祫荷囊而備問最近清光固巳丹轂解嘲天禄草經而擬聖金刀博學太一秉藜而下觀頃縁泛駕之求亟發違行之訟耻從吏對出檢猾商謂軒冕之儻來視同於寄物履名教之中樂坦照乎清襟旋關掌於郡條久從容於别乗一麾出守固雅尚之所存千里佩青乃上心之攸注距楗江之清郡摽軍壁之上游犬氂之警無譁賈室之繁甚冨足以坐棠聽訟閉閤凝神秀野頒春過蘅臯而倦目清言捉麈臨雅俗以鎮浮然而未央居半夜而生思安石以蒼生而待一作特起望之𥙷吏意雅在於本朝主父出遊帝已嗟於見晚行奉一封之傳入隨三節之趨見堂堂之姿送之迄目對顒顒之表威不違顔登渉乎赤墀之塗進重於髙門之地卓然逺韻度越諸公霑芳潤者漱其清芬仰龍光者思其作於末照英風冇煥物議攸歸矧此妄庸盍希品目伏念某社樗樠槁膏棗鈍昬抱器質以何堪賦天機而甚淺晞髪華旦徒跂於清流措足英躔終慙於逺到自遭家之不造早遂一作逢生於百憂茹歎之音悲存乎手澤動明之韻逺失於先時西華以孤露而見哀庾信以流離而多感矧復齊氣多緩嵇筋甚駑乏朽木之先容無一錢而爲地旁魄而論都邑則𬒳傖父之訶頑鈍以取世資但聽斵輪之暁終非令器第困窮塗一昨竊萬家之應書隨重車而上計方䇿條對廑至猥并雅拜匪儀失於盤辟甘觸聞而引去但飲墨以蒙羞卧漳濵而養痾竄身兹乆弔湘纍而感賦些語迷招當樹之於無何冝匠者之不顧而或竊先生之餘論企諸公之末暉聞伯夷之名增其懦氣伏海濵之下久以望風是敢强飾固陋之容庻伸伏拜之謁綴窮愁之汗簡奏蕪累之庸音竊覘崇閎將塵隱几登太山者小天下在培塿以冝慚奏咸池而張洞庭非蛙咬一作蛙蚊之可度然一作伏遇某官量陂無際宇䕃甚穠一作濃推轂成猷嘘枯振徳裹陽秋於皮裏不言備乎四時吞雲夢於胷中兼容盡於一介幸望許承音㫖少貶光塵曲乗褒采之私俾獲題評之目如是則六轡在手驥足何滯於蟻封五色成文樂節或資於牛鐸荷恩有素累牘奚陳胥學士荅啓伏蒙眷私以盛製文筆二編先之長牋爲贄者恭以某人象輿異禀龍輔至珍奉奕世之貽謀克隆堂室傾群言之妙旨深逹淵源伏一作服膺聖域以惟勤䇿足俊躔而逈異敏學該乎變貫英識極於覃研秉節髙竒發清吟於梁甫締交名勝綴雅聚於蘭臺飄飄之逸思無窮籍籍之芳塵自逺偶衂一飛之翼行躋多士之魁何誤采於虚聲辱逺垂於厚顧方披晬表遽捧雄篇恣探賞以忘勞信窺側而靡暇幽意絢於道德髙義薄於雲天飛染遒麗以盈箱彫繢紛華而滿眼賞孫詩之零雨何止一章賛沈賦之磓星豈惟數句固將備西崑之玉府奚獨易東堂之桂枝允矣難能誠哉可畏雖亨衢自至靡資左右之先容而名路共成敢惜齒牙之餘論謝胥學士啓近贄蕪音仰塵紬几載形答復深極褒稱弊帚無庸愧藏家而自享重言外獎干尺牘以必珍始繩窮而匣開爛然在目旋骨驚而心折至矣聞音退揆頑踈隂加震疊竊以昔者魯衮垂乎一字寵極於華章汝月更乎坐評自成於徃法得河南之口占多藏去以爲榮獲江左之筆蹤則神明之來復至有不喜人事常堆案而弗詶靡答私書或矜才而格物未若翠緌鳴玉之彦蘭臺金馬之英品風流坐正物之源交七林忘公侯之貴俯存寒素之目毋宻謦咳之音兎墨流英洒鴻都百金之筆犀談對客發荆州一日之凾有煥私藏因爲殊遇某倥蒙惟舊操撿弗支乏沃若之軒髦有尾兮之長醜顧右臂而爲彈早歎􅒒疲雖左肘之生楊徒能殫化爰以自童髪之交剪浴聖日之光華勉紹箕裘懼隳門素冠乎枝木莫踐化人之埸鈍若神槌爰對囊錐之頴一昨與偕外計續食縣官之郵召詣中臺果玷浮華之目州閭貶於素論篋衍棄於祭芻委末路而弗振與清涂而自隔然或皷舞至化呻吟變儒効騷人之鬱伊慕漳濵之模楷品之上下曽弗齒於鍾評擲中宫商冝逺慚於孫賦奚辨麗而可紀徒骩骳以興譏何弗避於詆訶輙外彰於嗤鄙踸踔短韻迨無取於擊轅盧胡見貽乃自珍於乾璞所期用覆醬瓿譬十年之練都投置皮箱資一笑於相樂伏蒙某官憫芚愚之無似加品目之惟優醜以愛忘音縁賞奏許上修名之謁獲伸拜徳之恭後堂執經飫陪一肉之賜西齋坐宴宻親三雅之歡執如意以指譚務車轂而推引噴咳珠玉大小以之成珍指頋飛沈眄睞於焉起色出乎望表溢乃情涯而復俾十倍而増榮示一嗛而爲羙當黯閤之多暇枉虞筆以摛文縟旨星稠襞牋雲落布帛之言甚暖暴以秋陽齒牙之論所加重於大吕譬以明月闇投於人不意此音猥來入耳謹當納藏行禇歸耀當閭襲以十綈爲天下之至寶脫復一讀解躰中之不安貴洛紙而爭傳與其刀而共布隱恩所及頂踵奚勝謝國學解元啓天聖七年右脩啓伏覩解文濫膺名薦肄三合雅方列於胄筵旅百在庭遽陪於方貢惟遴柬之彌衆叨首舉以爲榮飾讓無從循涯有溢竊以姬庭講治務多士之思皇漢席遲一作優賢以得人而爲盛然皆謹能書而上獻始揚進造之名隨計吏而與偕乃署秀㢘之等一適謂之有徳九變選乎知言所以樂育群材並賛郁乎之化潤色鴻業恊暢炳然之風用登至平皆由此道而況成均講藝昭五帝之遺文辟廱環流聳三宫而對峙自京師而首善俾天下之向風卓爾丕彛垂之來葉皇上握褒文而統理坐法宫以垂精並舉豐規丕揚先烈恢迓衡之至治擥入彀之群雄躬孝武招徠之勤紹永嘉敦樸之舉取之數路並用文武以兼通託之百朋思講天人之相與並申辨論之法待爲孝秀之門責土著以占名謹一作詳郷評之清議一郡國之衆咸一作或使得以應書百孝㢘之群皆勸令其趨駕固以厚一馬乗軺之聘光束帛賁園之招張羅挂雲盡取於逸翮傾崑取琰無復於遺珍超振古以無前契千齡而猶是而復詔大胥之掌版登遊倅於上庠謹從事以新書先考言而明試才可嘉於辨麗擇之妍詞言㭊理以精詳求於閎論當此三道使無諱以著于篇對有百人盡揮毫欲善其事自非行能髙妙業履優殊關覽乎九家之流含漱乎六藝之潤講乎髙誼而巳久識必研㡬施之當世而可行言皆詣理則何以當重圍之樹棘並列於名聞佩後席之容刀得趨於臺試如脩者天機甚淺俗韻素冥響未徹於一臯器不賈於當世瑣尾成乎長醜寒素本乎後門撫頑鈍以無庸常拙艱而茹歎首戴蒲而服業早失先疇書剖楹而發函僅存手澤毀瓦居慚於志或作求食不龜安可以得封勉爲佔畢以呻吟動取戯儒之詬病晞髪光華之旦徒慶於逢辰䇿足英雄之躔奚能於逺到甞因續食於縣次獲陪待詔於公車對䇿無爲終以空言而罷雅拜非禮㡬坐舉者之人辱皮相以堪羞耗心氣而都盡諱窮極於反𬒮鎩羽嗟其觸隅學揣摩而不成反嗤於丘㛐旁離騷而發詠㡬吊於湘纍志銷落以堙沈迹零丁而孤苦頃自脫身僑籍著録師黌學狗曲以見譏肄鱣堂而卒業入梁兹久敢期英俊之並遊論都未成殆以傖荒而見隔對合鰭而記食躧訛履以倦遊會深詔之急賢俾命郷而論士靡慚衒鬻之技上充跅㢮之求輙以復來勉兹再鼔當翰埸之斯闢接儁軌以並馳秃千兎之毫筆不停而爭綴舉連帷之𬒮𫀆何白以太紛曽是鯫生最當前列躑躅燥吻舌不下以喬然彫琢曼詞思彌枯而兀若率有枚生之累句僅同睢苑一作范之後成日佇報聞隂圖引去夫何濫吹之曲誤中程文之規用冠譽髦越陞上級屏間誤墨本無望於成蠅竈下焦桐豈有思於爲器玷兹襃采實駭群倫顧揚粃以増羞在冠鼇而曷稱再循竊據實用􅌤顔此蓋伏遇某官表燭群倫丹青上化雌黄在口捉麈尾而不休翦拂長鳴託旌一作旄端而可逝因興民於三物務推轂於諸生致此妄庸及於甄采敢不仰銜提獎益勵進脩磨鈆鈍以爲銛䇿蹇歩而睎驥哆兮箕舌巳簸糠而在前沛乎鴻毛使培風而直上用於知已答乃𥘉心過此以還未知所措謝進士及第唘天聖八年楓宸蠖濩方賛趨而在庭雲幄靚深遽臚傳而唱第竊顧無庸一作用之品仍躋異等之科祗服寵靈實増震悸竊以思皇之詠多士雅頌播於姬庭間出之有異人文章炳乎漢徳選知言於九變東都下深詔之辭開孝秀之一門唐家有得賢之盛皆所以招徠時彦樂育人材講求精祲之原潤色帝王一作皇之羙卓爲徃範垂照來今丕哉文物之華屬我神靈之運國家右賢興治若古敷猷休聲塞乎淵泉至徳湧於烽火彌文上化䟽璧水以環流儲精太寜坐蒿萊而講道爛乎舜日之晏晏煥乎堯章之巍巍而且優游巖廊夢想豪俊下賢書而旁午諭上意之丁寜復詔䇿於㢘科謹郷能於歲舉馳封一馬使者在道而相望翹首群英天下嚮風而咸靡逮計車之偕上首方貢以前陳委宻侍之鉅賢先春闈而覆較氊筆署乎重棘奏可而後行錦几坐乎中楹親臨而明試森陳奏牘逮兩令之不勝精閱書衡㡬百斤而未止自匪該明治具佩服儒規行實藹乎徽猷識宇包乎賢業寖明寖昌之畢講學際乎天人之交至纎至悉而不遺言逹於國家之體則何以上當乙覽榮中甲科聮俊乂以服官陪英雄而入彀如某者風猷靡立操植素淪樹樗甚乎液樠膏棗嗟乎昬鈍戴枝冠而竦誚切愧命儒問天一作尺咫以不知終然懵學加以素鍾舛運生遘百罹自翦髪以交垂已不髦而茹歎逐耕夫而衣襏早去先疇署生版以占名轉隨僑籍流離末路佁儗後塵借譽羣公之遊本無題目接足諸生之後多見排拫嗟盛際之親逢忍窮途而自竄陪貢㢘於百郡毎與計偕飲試墨之一升甞從罷去退慙踸踔數此隻竒撫骨嗟乎淪鋪卷耳甘於藏宻然而良裘學治惜先芬而懼隳母髪垂星感親闈之思養未及衰於駒齒勉自奮於駑筋乗下澤以去郷棄裂繻而爲誓車騎乏甚都之雅風塵有化俗之勞上國連衡仰攀於俊軌橋門掎一作倚𬒮獲覘於邦光會泛駕之求才輙應書而充賦以孝㢘而射䇿本無百六之能自衒鬻之上書蓋逾千數之衆逮漢庭之籍奏咸以名聞同矍圃之去賔僅有存者顧一作故惟庸妄首玷甄陞獲召於公車之庭給試乎上方之札致狂言之誤擇叨署第以開榮若若飛華交垂宛轉之綬諄諄其誨載聆郁穆之言浸雲澤以芬流沐天光之下燭竊慙鈆鈍甞厠翰埸屢以下中之才當乎第一之選冝不失於舊物期仰荅於知人然其戰屢勝而後驕鼔至三而乃竭綆短禇小嗟逺用以奚勝弓撥矢鉤惜前功之皆廢誠以九閽坐狄百㦸森庭就列瞻天駭威臨於咫尺爭觀落筆紛立若於堵墻怳訝鈞庭之夢遊驟覺幹䰟之驚去僅成牽課靡中科程瀆睿覽之至精冝報聞於獨罷尚賴黈旒之過聽兼求箕斗之虚名謂簛揚之在前常先於羣彦以薦藉之良厚重違於大臣猥自下流參聮上列省逢辰之至幸實叨恩之有因此蓋某官闡繹帝猷雍容朝首粉澤光華之治表燭薦脩之倫膺上心之柬求主斯文之盟㑹言皆有味務推轂以彌勤先爲之容俾朽株之見用致兹孱瑣及此抽揚敢不慎服官箴遵修士則鞭後䇿足更希逺致之塗鎔金鈞泥尚依陶者之力誓殫用拙之効少酬再造之恩過此以還未知所措代王狀元拱辰謝及第啓夫聖八年右某啓云云坐火啓扉並集千人之俊賜𫀆在笥驟紆一采之綸矧惟蕞爾之軀仍玷褎然之首仰膺渥渙伏積震惶竊以周陳三物以賔賢必慎乎命郷之選漢開數路而求士乃盛乎得人之稱用能暢郁乎之文一變而至道飾炳然之化二代以同風闡是齊明之猷允屬神靈之旦國家景炎興運赤伏膺圖敷四葉以重光式九圍而用乂銷鋒偃革外憺乎靈威卷領垂衣坐朝乎夷憬上方穆然無事監于太清崇庠序以興文飾弓旌而招俊苹歌式宴咸預於計偕洊棘樹圍載嚴於籍奏敞中楹而親試署異等以精求所冝得命世之偉才爲一時之清選夫何么一作側陋前玷寵光如某者業履空踈才猷散戾門緒本乎寒素人品㡬乎下中竊逢待旦之盛期寖𬒳右文之上化激昂稚節䇿發蒙襟溲雞白以樹碑偶能於童戯炙簡青而嗜學常訪於師嚴徒有志於雕蟲僅不成於刻鵠陸機閱史尚靡識於撑犂枚臯屬文徒率成於骫骳早縁妄動竊企英游貢版齎行常從於末薦佩刀脫去尋觸於報聞何天幸之聿臻遘賢書之荐降濫乎事舉猥以名聞洪惟聖治之光華蔚有俊才而遝集並進乎千篇之牘精覽於百斤之衡曽是孤生絶企殊級豈期庸鄙偶中科程採乎一日之長冠乃諸生之列旣行能之無取加世胄以非髙踸踔後塵迹靡參於俊軌雌黄餘論名不齒於人評驟從底下之才擢居第一之選顧掎裳之在列誠揚粃以貽譏明命已行固無容於反汗多言可畏諒彌甚於鑠金豈非思致異才揖怒蛙而兹始將招駿足假死骨以爲先則何以靡遺譾薄之姿偶首清明之舉再省循而是懼實獎擢一作抜之有因斯蓋伏遇某官黼黼斯文丹青至化嘉猷屢進務推轂以爲先賢路一開使騰夷而有始敢不仰銜恩遇進勵操脩循士則以爲勤佩官箴而有守在鈞以播旣由陶者之爲摩頂無忘誓答知人之賜過此以徃未知所圖代謝唐簽判俞啓天聖八年第一甲伏自某人飛䇿上第就辟𥘉筵千里奮乎鴻軒方訝雀知之晚一木爲乎大厦豈無燕賀之私屬被責於吏訶方罷歸於士伍翟公之門有大署意欲謝交嵇康之性不便書􅎊而成懶屏居田里遂隔音徽豈謂某官俯示存臨過敦禮意廼金廼玉堅乎乆而不渝如璧如珪問以音而厚賜服勞謙而自牧若飲醇而醉人恭佩恩勤敢忘寢寐伏況以英英之善譽丁晏晏之休辰徳行中乎妙科諮謀參乎六府運籌帷幄豈足盡於上才垂光虹蜺固莫量於逸致内惟衰退但積欣愉答李秀才啓脩再拜天錫友兄足下此月八日叔父自貴郡回轅首得所賜書教一筒開闔數四歡喜無量逃虚旣乆驟聞足音以跫然迷䰟若招頓歸常幹而來些惜乎一失交臂之舊一作樂再見回星之周薫歇燼銷壤斷土絶昔人以三月不見尚或嗟於生鄙羣居乆離則弗能於無過況孤矇之有素邈師友以斯䟽妍皮褁骨而益癡獨學靣牆而奚嚮薫濡弗及寡一作孤陋巳増豈意此音猥來入耳羙乎此四字一作人且羡羙溢雲紙以摛思掞春華而發藻厚乎養鳥誤奏咸池之和豁若覩天驟發醯雞之覆兹焉匠一作五者之規矩誓訂漳濵之模楷承平居之無俚方枕塊以罹憂不見齒而三年合乎禮制加於人之一等時以孝聞願思肯􅌟之不忘無使過哀而至毀而況天錫標一作振絶俗之儁軌包大賢之茂器學兼九變辯雕一作智刻萬物竊伏一郷之評冝首幽人之聘而屈試方䇿見枉有司薦紳冤嗟道路譁鑠且夫好惡之異古今所均仲尼至賢乃取侮於盗跖帝莖大樂猶見非於墨子撫絃在乎流水難矣賞音珍髢鬻於九戎誰其識寳使懷道而委莽動直士之盱衡然而㤗先否而後傾禍爲福之所伏鷙鳥將擊先卑而飛流川乆壅其決孰禦一作心在願飬髙而全道宻中藏而竢時掩乎十仞以韜光去則萬里而不息良工晚成者器必大寧以朴而示人逐水一作榮又作未先至者驥之能豈與駑而爭路斯皆雅量之素藴誠非兩好之溢言某之妄庸本無似肖誤蒙甄擢遂見収齒衆珉入寳至璞使之見遺我軰登科前賢所以媿讓循涯巳溢􅌤目無容江關複重音問睽阻時旣昬而將暮人在隂而鮮歡逖懷英俊之並遊恨無羽翮而飛肉冀綏吉履之福以迎來譽之光𥿄盡筆窮辭不逮意與西京留府交代推官仲簡啓天聖九年三月某啓此者竊吹一作玷下科濫巾一作升大府懷檄之嘉一作喜容外見迫感於逮親負薪之足力不彊靡遑於媿讓在業官之資始懼傷錦以貽譏況上邦英俊之躔大相熒煌之座幕中諸彦泛泛蓮池之賔門下並遊一一蘭臺之衆一作聚勉䇿駑筋之緩仰陪席聘之珎問祈招而不知因慙諮訪奉南陽之坐嘯曷有籌謀賴乎天幸之然續於賢者之躅睨伐柯而取則獲企前規告舊政以乞靈得師餘矱巳積想風之慕彌増竊抃之懷俟燋墨以戒辰即齎行而首路傾依一作系之至談悉非終謝人投贄啓伏蒙某人寵貽妙製兼枉長牋欽玩懿辭􅋏銘丹臆恭以某人機神邃茂識理淹和徽名籍布於士郷睟表挺生於王國言章絢羙搴六藝之英㽔一作精竒思緒藴華漱五河之芳潤揆兹逸軌冠乃烝髦今國家崇柬駿珍寤求孝秀下細文於方國騰賁帛於丘園而某人夙藴瑰材襃膺温詔占磐鴻而啓繇俟苹鹿以送賔顧以某體質頑踈聲猷隘薄誤中程文之選猥參籲俊之求承版謁以見臨䄂瑶華而伸貺仰銜清眷荷襃衮以奚勝載抉蒙襟念英瓊而曷報欽降至極敷染奚周所示盛編輙敢留借謝石秀才啓某啓累日前伏承惠然見過仍以嘉什一筒寵示者獵纓拜賜刮自披文𥿄弊墨渝不能捨手伏以某人英躔逸軌天驥上才好學屢空浸潤淵源之奥知言九變窺見天人之交久巳擅一郷之評早亦應萬家之令然而奏磬俚耳難矣賞音抱石荆山終爲至寳而自慕幅巾於衡巷乗下澤於郷閭晦丘園之養髙輕鴈纁而堅卧冥飛已逺笑弋者之何求齷齪坐談嗟律魁之獨棄而以錦帶居士白蓮社人効菩薩之坐家去塵自逺掃維摩之一室敢入者稀是冝邈爲方外之遊隔乃一作此俗中之軌而乃過存庸妄曲借獎題因隱几之閑居抽吮毫之餘思灑乃藻麗用飾愚矇爲鼷䑕而抉機僅成輕發養鶢鶋而奏曲徒使眩悲矧夫峭格峻髙春華掞羙暢來雲依月之句擅落花映草之評内惟棗鈍之姿奚稱衮褒之寵去天尺五巳服於清標和者數人蔑聞一作階於絶調未遑賡報徒用􅌤慙上隨州錢相公惟演啓明道二年𥘉惟演以使相判河南府後落平章事以崇信軍節度使歸本鎮此者及期𬒳代投版言歸宿官早愧於迷方書課麈能於自脫徒以無庸之迹曽希一盻之榮當懷檄以云𥘉属擁旄之方始相公坐於雅俗鎮以無爲民豐四輔之年市息三九之盗行郊憇樹絶無兩造之辭託乗載賔惟奉百金之宴而況西河幕府最盛於文章南國蘭臺莫非乎英俊豈伊末迹首玷𥘉筵至於憐嵇懶之無能容禰狂而不辱告休漳浦許淹卧以彌旬偶造習家或忘歸而終日但覺從軍之樂豈知爲吏之勞芘徳已深遊藩未㡬旣而持山國之瑞節改戎乗而啓行荆州遽失於所依周南遂留於滯迹稍以引去無復並遊之人巋然自存時有思歸之嘆毎臨風而結想徒零涕以懷恩相公以彛鼎之勲極公台之重獨立不倚群言互興中山之篋雖盈南海之車終辯繫辭有云崇髙莫大乎冨貴古人歎曰冨貴必履於危機伏惟推盈虚消長之言究動靜吉㐫之理秉珪璋之徳何䘏瑕疵挺松筠之心不變霜雪雖流路之謗未免三年以居東而在廷之臣豈無一言之悟主俟聞來復以慶終亨願無以理而自明當要旣久而復見區區之志實在於斯徒有戀軒之心未知報恩之所謝校勘啓景祐元年用王文康公薦入館仰服恩榮實増震慄竊以校讎之職是一作辨正爲難委方冊於程文折群疑於獨見一作斷脫絢組之三寸簡編多前後之乖并盤庚之一篇文章有合離之異以仲尼之博學猶存郭公以示疑非元凱之勤經孰知門王一作五而爲閏況乃西崑冊府備帝者之來臨蓬萊道山非人間之所見自匪識窮元本學漸淵源究百世之放紛揔群言而博逹則何以效官天禄對青藜而属書抱簡羽陵拂白蟫而辨蠧如脩者器惟庸妄族本覊單雖出逢千載之期而生有百罹之苦入橋門而著録最後諸生聞月旦之坐評敢希一目徒以浸潤聲明之代優柔教育之仁過時之年巳捍堅而難入少作可悔終雕刻以無功早濫吹以決科旋釋巾而𥙷吏逮親而得斗禄雖慰於子心歛版以揖上官遂成於俗狀學乆矣而將落思兀然而欲枯進無取當塗之資退已失故時之歩歳月其忽徒有志於分隂英俊並遊方問途而孤進内顧拙艱之若此敢懷榮遇以爲心豈期天幸之來特𬒳柄臣之薦敢辱知人之羙蓋因連茹而陞蒙曲造之并容俾考言而善擇顧無庸之末學已屢試於有司碩䑕之有五能盡於是矣鈆刀之堪一割其可再乎固無可喜之文過辱太優之等俾從賔席入預書林一進階而可榮何勝於睿渥三下拜而聞命深服於訓辭天闕乍趨迷目睛而眩轉芸臺深敞近星象以昭回恣窺金匱之書坐費太官之膳内循忝據有溢情涯此蓋伏遇昭文相公獎物均私樂材推羙圓方有範大陶冶以埏鎔髙下不欺正權衡而輕重閔此庸懦曲以甄収誓堅頂踵之誠永荷丘山之賜謝襄州燕龍圖肅恵詩啓景祐二年秋時公自館閣謁告視妺家昨日伏蒙知府龍圖即席寵示五言詩一章者脩聞古者賔主之間獻酬已接將見其志必有賦詩託於咏嘆之音以通歡欣之意然而工一作正歌三夏使者再辭及於皇華然後拜貺是則施於貴賤各有所當脩賤士也何足當之伏惟某官以侍從之臣當藩屏之任徳爵之重與齒俱尊學通天人識洞今古綽有餘𥙿多爲長言談笑樽爼之間舒卷風雲之際成於俄頃蓋其咳唾之餘得而秘藏巳如金玉之寳豈伊孱陋敢辱襃稱形於短篇以爲大賜伏讀三四且喜且慙譬夫四靣之宫鏗鏘之奏愚者驟聽駭然震蕩及夫心平㑧定然後知於至和在於頑蒙獲此開警然貺之厚者不敢報之以薄禮所尊者不敢敵之以平顧惟愚庸豈得賡繼但佩黄金之賜無忘長者之言夷陵上運使啓景祐三年脩近以狂言當蒙大譴荷乾坤之厚施全螻蟻之微生得一邑以庇身使之思過竊三鍾而就養猶足爲榮獲在公庥是爲天幸伏以運使郎中懿猷經逺茂業康時當一靣之利權竦百城之威譽凡居属部皆仰餘輝顧此孤生最爲沉迹時蒙眄睞曲賜拊存安其惶懼之心慰乃危疑之慮敢不銘之肌骨佩恩紀以無忘䇿其筋骸盡疲駑而爲報將謀就道即遂公趁瞻企門閎忻愉罔旣謝朱推官啓某啓伏念某出自寒郷本非茂器束髪州里絶無一日之評彯纓王畿竊階羣俊之後加以識非逺到才不及中惟至治之方隆顧上官之並恪蘋蘩之不失職咸盡其能庖祝之各有司悉共爾位豈伊下列遂敢奸官因忿躁之使然奮狂愚而不顧惡訐爲直仲尼之所深譏盡言招人武子之猶不免在於庸妄冝抵譴訶尚頼至仁特加寛議投之遐僻使自省思猶寸禄以事親守一同而庇邑有民與社足爲政以効勤退食自公敢忘心於𥙷過是惟天幸徒自􅌤顔伏遇某官式佐郡符屈臨賔席烜赫天下方想於風猷從容幕中暫爲於府望是惟孱昧得庇光華然而從事有便冝之權縣吏本徒勞之迹負弩而隨伍伯當備前驅折腰以揖上官敢羞歛板況兹選懦素本孤危犯忌於時竄身無所棄芻道上過者踐之揺尾穽中人誰憐爾豈謂某官哀其戇朴賜以存憐削去常儀自敦髙議猥因介使先辱長緘過形溢羙之辭曲盡至勤之意片言之辱榮於儀父之褒一顧所臨増其大吕之律徒益撝謙之盛羙豈冝鄙陋之敢當歳律巳殘寒威方肅更祈珍攝以副傾依囬三舍人尭臣啓景祐四年伏審某官光膺寵擢入掌命書竊以三代之興兩漢之治蔚聲名之爲盛何前後之相望蓋以髙文大冊之所傳遺風餘烈之盡在是以代言之任難乎命世之才至於雷動風行金相玉振至意難諭必盡于丁寧盛徳有容兼資於粉澤適當休運允屬鉅賢伏惟某官識際天人學通今古而自親膺聖擇第中甲科聞乎風采而天下悚一作聳然論之人物而時無先者若乃從容禁署潤色皇猷使徳澤之流下淪於民髓文章之盛交映於國華遂階榮塗以致公輔斯皆雅度之素藴考於羣議而猶稽豈惟愚矇私獨稱賛某跡居遐邑名在罪人忽以踰時未能𥙷過省孤危之巳甚惟藏縮以爲冝豈望龍光之末輝希咳唾之餘潤匪期齒論猶録踈頑先以珍函越於常禮遺簮已棄尚以舊物而見憐窮谷乆寒忽如温律之來煦幽憂併釋榮感兼深瞻望門閎無任飛越謝李秀才贄見啓寳元二年在乾徳日某啓自某獲罪於時竄身南楚楚之爲邑旣陋且窮詩稱荆蠻以比戎狄覉遊宦學之不至風俗言語之不通頑然因拘誰與爲偶孤陋之誚古人所憂今者上蒙寛仁徒之善地始得與士君子揖讓進退周旋方將沐而薫之自與人齒秀才首迂玉趾贄以長牋升自賔階肅有儀矩開函啓𥿄粲然詞章蓋夫逃於虚空聞足音而尚喜友於賢者況邦士之所推願斥簿領沈迷之勞以從間燕仁義之樂區區之意言豈足殫回糓城狄令啓某啓此者縣徒云至書牘見貽載道鄙文曲加榮獎伏以某官以文飾吏學古任官講事勸功脩舊起廢示之典一作曲禮固巳警於愚民刻以銘文又將貽於來者足見仁人之意非惟吏最之優顧爾訥辭矧非善敘已然之諾將止以奚能旣出之言雖追而莫及豈敢逃於衆誚但慮玷於清猷慙愧之誠敷陳罔罄上執政謝館職啓康定二年十二月因崇文總目成書自館閣校勘遷集賢校理脩啓今月日蒙恩以本官充前件職者受命之始榮懼交并伏以國家悉聚天下之書上自文籍之𥘉六經傳記百家之說翰林子墨之文章下至醫卜一作卜醫禁呪神仙黄老浮圖異域之言靡所不有號爲書林又擇聦明俊乂之臣以遊其間因其校讎得以考閱使知天地事物古今治亂九州四海幽荒隱恠之說無所不通名曰學士一日天子闕左右之人思宏一作閎博之彦出賛明命入承顧問遂登宰輔以釐百工一有取焉多從此出所以平居優游崇獎一作素服其業館以禁署食於太官詩菁莪之育人材易鼎飪之養賢者凡在兹選得非茂歟然而廪重職閑則未免尸禄官無吏責則可容幸人若脩者以寒陋之資𬒳文藝之舉自𥘉營職巳與書筵於時上有鴻儒侍從之才下多群賢論撰之衆而脩方𬒳罪譴竄之荆蠻流離五年赦宥三徙山川跋履風波霧毒凡萬四千里而後至于京師其奔走之役憂思之勞形意俱衰豈暇舊學比其來復書已垂成遂因衆功豈有微効奏御之日鳬鴈而前例蒙褒嘉正以職秩雖因時而幸會實有􅌤於靣顔此蓋伏遇某官柱石之功佐佑明主鈞衡之任進退百官方疇衆勞不忍獨棄遂令忝冒出自生成在於顓愚何以論報雖未能著見徳業以稱君子教育之仁猶可以作爲歌詩稱頌聖朝功化之羙過此以徃未知所裁回滑州知郡啓慶曆三年三月自滑倅召知諌院四月荅此啓伏審某官顯膺羙詔移領陪藩彫弊之民方仰思於恵煦撫綏之術況舊著於政謡猥以下僚獲陳大府近膺朝命俾擢諌垣實自揣於非才豈敢同於飾讓日祈聦睿哀此孤蒙庻所請之曲從即依仁而有幸凡云詹企但切忻愉𥘉暑方隆就塗甚邇伏惟上爲邦國倍保興居回賀環慶師天章滕待制宗諒謝賜龜紫啓慶曆三年伏以龜紫之重唐制所難武元衡牛僧孺爲宰相裴度爲中丞李宗閔爲學士方有是賜聖朝推恩庻位半乎朱藍然𬒳之則負器藝兼名實者惟一人所貴恭惟知府待制歷諫局以蹇正聞領麾守以恵養及臨邊鎮靜訓士精研歳功遽成時議頗鬱果襃三品之麗特煥五府之光其在欣慰増倍衆多展慶未皇麾毫爲贈載仰明庭之命如瞻君子之容謝知制誥啓慶暦三年十二月此者蒙恩授前件官并職者祗荷寵靈不任戰懼伏念某學非逮古材匪適時勵孤進以立朝偶四方之多事雖聖聦廣納獲盡狂夫之言而闇慮空勞未聞愚者之得方虞官謗敢冀主知擢自周行塵于華選代言禁掖巳愧才難兼職諫垣猶當責重𥙷報不可以淺則憂愧不得不深此蓋某官過採庸虚甞形獎飾致兹忝冐驟此寵榮敢不勉拙以勤誓身許國上酬天造次答巳知懇愊之誠敷宣曷罄上提刑司封啓慶暦五年冬此後皆滁州作伏念自臨貶所屢辱誨音霜雪方嚴見不彫之雅操蕙蘭其意佩可服之清芬慰此孤危奚勝感佩某人學通治亂識逹古今奮經逺之才謨慰甚髙之議論六條頒政早欽善最之竒列郡按刑行迓陟明之典隆冬式序保履惟和瞻企禱祈交于誠素回挍理邵學士必啓慶暦五年冬伏審召試榮庭升華儒館方思馳賀遽辱飛牋伏惟某人性禀生知材惟秀出學通今古究明人事之始終辭冨典謨煥發文章之雅頌一作爾雅蔚然茂器藹著休聲惟上相之知人務薦賢而報國況此圖書之府素爲俊彦之遊峻乃清資豈止文翰之樂兹焉養士以取公輔之材豪英旣登朝野共慶顧兹淪謫敢謂記存已懷欣抃之誠又積感銘之懇患於澁訥匪可殫陳回河北安撫王騏驥書右脩啓此者伏承顯奉朝恩峻遷使軄寵光甚渥輿論僉和卓然髙世之才久藴經時之略山川指畫千旱如在於日前帷幄坐籌百勝無窮於術内是冝聽之前膝副乃沃心遂寛北顧之憂行正中權之任敢期眷與尚頋衰殘辱誨問以彌勤積成銘之徒切傾瞻企詠兼集悰靈回賈狀元黯啓慶暦六年伏以狀元廷評行久著於郷書聲素馳於文囿果先羣彦榮中甲科英雄入於彀中衆稱妙選風采傾一作駭乎天下爭仰餘光蓋以擢才之難近世爲重趍好尚而成俗則文章坐變其風繫利害於斯民則公輔常由此出一賢旣進㧞茅皆可以彚征一士以一作巳旌勸善不勞於家至得人之要其利若斯鴻惟治朝臻此盛事方深竊抃遽辱恵音顧惟棄置之餘冝此退藏之宻久稽裁敘但切一作積悚惶回賀楊翰林察啓同前伏審某人榮奉宸恩入陞禁署伏惟慶慰恭以某人聲猷峻立徳宇宏深學洞淵源煥發六經之藴文含純粹邈追三代之風雍容侍從之華柬注顒昻之眷亟由星掖入踐鑾坡天邑之雄雖暫煩於尹正國鈞之重行即俟於疇庸事業炳於丹青勲徳光於鼎鼐寔繫縉紳之望非惟禱頌之私某幸守陋邦遥聞羙拜迹冝藏宻非敢怠於致誠恩厚記存特辱垂於榮問忻愉感愧交集難陳上都運待制啓慶曆六年夏昨者解官河外竄迹淮壖顧乃孤危便於藏縮雖瞻依之甚久在訊候以闕脩某人天禀中和材惟周洽凛然風操早肅於朝倫蔚若謀猷實禆於聖治自輟從於侍從暫臨緫於劇繁足食彊兵雖並資於經畫先機別事誠有繫於安危況成績之巳彰佇褒功之不次時炎燠若天宇泰然更冀珍調以符傾禱回賀李待制柬之啓慶暦七年九月伏審肅奉寵靈峻升侍從得賢之慶固冝發於歡愉待罪之人方自思於藏宻遂稽馳賀敢謂不遺先辱榮函可勝愧色伏惟某官懿文經國敏識造微學探姬孔之淵源世濟臯䕫之德業立朝正色凛風憲以載嚴造膝沃心頼仁言之甚博遂膺簡注升著清華上寛乃顧之憂聊假有餘之刃作時霖雨當均及於疲民秉國大鈞實久顒於群望凉秋之謝嚴律將凝冀爲邦朝善綏福履賀文參政彦博啓慶暦七年九月伏以光膺制命參秉國鈞爰擇令辰巳諧禮上伏惟慶慰恭以某人學通繫表識照㡬先懿文爲大國之光華偉望乃一時之柱石上心所柬適符賚弼之祥輿頌載喧久渇爲霖之望果膺寵數式副具瞻進退羣材運誠衡之輕重調和元氣登至治於升平然後正台衮以代天工列功勲而銘廟器符爲元志一作徳以重熈朝某幸在陶鎔惟知慶抃啇秋式序歳物方成伏請上爲邦家精調寢膳回賀集賢韓學士絳啓慶暦七年十月伏承𬒳召試文升華儒館伏惟歡慶伏以某人天麟異禀廟璉至珍學通今古之淵源言合質文之體要英躔髙歩羣俊聳一作戢以望風雄彀籠材妙選稱爲得士果膺帝柬入耀書林給札揮毫聳如墻而駭目奏篇稱善喧貴𥿄以傳都惟祕府之育賢乃熈朝之盛羙優游歳課豈鈆槧之是專選取國材實棟梁之此出蔚然茂業奚測逺塗方懷抃躍之私遽辱置郵之問仰銜隆眷徒切愧誠冬序云𥘉天和善保傾瞻感頌交集悰靈上致政王太保啓某啓昨者太保還政王朝榮歸故里暫留齋舫云止陋邦竊省孤危方嬰罪讁一作譴逃虚易喜蓋人迹之罕逢道舊爲歡矧平生之有素特荷眷私之厚不爲位貌之嚴金玉之堅弗渝於彌久松筠之操獨見於大寒感慰所一作攸深幽憂如釋捨舟趨陸去險騰夷懷組郷閭雖暫伸於夙尚追鋒疾置將入副於精求惟期善衛襟靈以迎休寵回泗州通判勾龍都官書右脩啓此者特蒙恵頋逺辱誨言副以雄編俾之拭目通判都官識窮淵韞學探本原一作元講於仁義之餘深得風騷之旨雜然衆體各極其精時無鍾期誰識髙山之意人非季札豈知治世之音矧惟朽拙之無堪方幸退藏而自屏敢期時彦不我鄙遺諭之累幅之勤貺以百篇之冨四靣之宫並奏驟聽於鏗鍠三歎之音有餘豈窮於杳黙但駭夜光之投闇徒令海鳥之驚魂媿乏重言以起連城之價用爲永好惟期十襲之藏感幸之誠敷陳㒺旣回和州通判啓自睽風表曠有歳時邈絶奉於聲塵蓋率奔於事役幸兹鄰郡首辱誨言締縟旨之勤隆若清徽之晤挹政條關決難久滯於材猷臺彦飛英即入承於光寵更希珍攝以副禱祈謝黄巖李主簿啓伏念爲邦誠樂懷舊則勞風月佳時久辜燕集文酒勝處動渇清狂亦惟愛忘未棄踈外猥蒙流問但喜拜嘉某官力學多文射䇿得儁枳棘甚賤非翔鳯之所棲𣏌梓惟材冝大厦之可用窮冬不雪多温少寒勾稽之餘嗇神爲最益期勤懋庸迓升揚回陳殿丞啓伏念睽闊英猷貿遷時籥竄身窮僻方便於自藏恵問周隆遽承於曲顧欽雅材之髙妙播華譽以芬揚貳政藩宣諒難於滯俊飛緌臺閣行𬒳於寵遷歳律斯回陽和將布善綏嘉履以副願言賀文相公拜相啓慶暦八年正月伏審就降命書入持宰柄伏惟慶慰恭以某官際天藴識名世摽才以文章甲賢科以忠義挺臣節華要之選翺翔逮周素藴内充所臨必最化行右蜀政貳中樞屬邊冦之肆狂仗使威而殄滅暫形籌略已取蕩平還居廟堂副聖主仰成之意坐調鼎鼐洽群生咸遂之和凡𬒳陶鎔皆知抃頌矧居庻列實倍常情表奏書啓四六集卷第六上胥學士啓蛙咬蛙一作哇胥學士答啓雄篇一作雄編亨衢自至至一作致謝胥學士啓兎墨一作墨兎犀談一作談犀操撿一作撿操謝國學解元啓對有疑是對者彫琢琢一作瑑謝進士及第啓緘啓新範首云伏蒙聖恩賜進士及第仍當日釋褐者實増新範作伏増蒿萊新範作蒿宫明堂也見大戴禮爛乎舜日之晏晏新範作爛兮舜日之旦旦見書大傳卷耳新範作卷迹化俗新範作化素而後驕新範作而則驕兼求新範作兼収此蓋某官此下頌徳新範云潤色丕猷述宣上徳當物鈞而獨播式繫陶者之爲執鼎上以􅝂和謂成天下之化招徠衆善官使群才樂在阿而育賢助尊天而呼俊逺致新範作逺到尚依陶者之力新範作尚假此謝宰執者前本乃謝試良工之化官其全篇書以新範爲正代王狀元及第啓世胄世一作地以播以一作巳代謝唐簽判啓飛䇿䇿疑是英答李秀才啓取侮於盗跖取侮一作低頭筆窮一作墨窮謝挍勘啓盤庚之一之一作於碩䑕碩疑是鼯謝燕龍圗恵詩啓不敢敵一作不可敵回滑州知郡啓獲陳陳一作塵彫弊彫當作凋上提刑司封啓不彫彫當作凋回王騏驥書之徒切之一作而回賈狀元啓廷評新範作監丞爲是回賀楊翰林啓恩厚一作意厚特辱一作辱特集古録跋尾卷第六歐陽文忠公集一百三十九唐八都壇實録歳月見本文右八都壇實録撰人名元質不見其姓又不著書人名氏其字畫亦可愛碑首題云大唐八都壇神君之實録其文云都望八山之始壇也此地名山封龍之類有八因壇立廟遂爲號焉封龍山在今鎮州其餘七山不見其名又云漢光和中有碑而今亡此碑垂拱三年立右集本唐魏載墓誌銘歳月見本文右魏載墓誌銘其序云祖徴謚曰文正父叔玉光禄卿載以弘文生對䇿居甲授太常寺奉禮郎以疾謝職尋調懷州司兵參軍屬惟集本作維下同揚詭道不戢斯焚譴及宗姻旋加此累以垂拱三年终於嶺外春秋三十有二所謂惟揚詭道者乃徐敬業起兵於揚州誅武后不克也時敬業以前盩厔尉魏思温爲軍師集本作帥所謂譴及宗姻者疑敬業敗載坐思温竄死嶺南耳今據新唐書宰相世繫表鄭公諸房都無思温及載而叔玉但著一子膺爲祕書丞豈載以官卑貶死無後而殁不見耶載死不幸而家譜不録史官不書八字集本作家譜史官不録非事載斯誌而誌録於余其遂泯滅於無聞乎治平元年四月廿三日書右眞蹟唐乙速孤神慶碑載𥘉元年右乙速孤神慶碑弘文館學士苗神客撰神慶唐初仕三衛髙宗時爲太子右虞候副率以卒乙速孤氏在唐無顯人惟以其姓見於當時者神慶一人而巳元和姓纂但云代人隨魏南徙而巳其叙神慶世次又多闕繆而此碑所載頗詳云其先王氏太原人有闕文代祖顯爲後魏驃騎大將軍賜姓乙速孤氏遂爲京兆醴泉人曽祖貴隋河州刺史和仁郡公祖安隋益州都督父晟唐驃騎將軍乙速孤氏世無可稱而其姓出夷狄莫究其詳惟見於此碑者可以𥙷姓纂之略以備考求故特録之右集本唐薛仁貴碑天寳二年右薛仁貴碑苗神客撰云公諱禮字仁貴河東汾隂人也唐書列傳云仁貴絳州龍門入又不云名禮余家集録薛氏碑尤多據仁貴子楚玉碑亦云父仁貴爾仁貴爲唐名將當時甚顯著徃徃見於他書未甞有云薛禮者仁貴本田家子奮身行陣其僅知姓名爾其曰名禮字仁貴者疑後世文士或其子孫爲増之也列傳又載仁貴降九姓事云軍中爲之歌曰將軍三箭定天山戰士長歌入漢關仁貴卒於永淳中碑以天寳中建不載漢關之歌不應遺略疑時未有此歌五字集本作當時無此歌亦爲後人所増爾治平元年端午日書右眞蹟唐尹氏闕文歳月見本文右尹氏闕文在襄州題云唐孝子尹仁恕闕萬歲通天二年旌表萬歲通天則天之年號也可謂昬亂之世矣然尹氏猶見旌表孔子以謂忠信可行於蠻貊信矣孝悌見尊於昬亂也唐尹孝子旌表文歲月闕唐之致治之意深矣嗚呼不得而見矣此碑尤可惜也右集本唐孝子張常洧旌表碣貞觀五年誤雕在此右唐孝子張常洧旌表碣文字磨滅僅可見其髣髴蓋孝悌之爲名人之所甚慕而旌表非爲一世勸也故特録之者惜其將遂不見於後世也其文辭筆畫亦自可佳然不專取乎此也右集本唐渭南令李君碑聖曆元年右鴻州渭南縣令李君清徳碑馬吉甫撰按唐書則天天授二年析雍州之渭南慶山置鴻門縣遂以慶山鴻門渭南髙陵櫟陽置鴻州大足二年廢治平二年正月十四日書右眞蹟同前右渭南令李君碑其首題云大周鴻州渭南縣按新唐書則天天授二年析雍州之渭南慶山置鴻門縣遂以渭南慶山鴻門髙陵以置鴻州大足二年州廢矣右集本唐流杯亭侍宴詩歳月見本文右流杯亭侍宴詩者唐武后乆視元年幸臨汝湯留宴羣臣應制詩也李嶠序殷仲容書開元十年汝水壞亭碑遂沉廢至正元中刺史陸長源以爲嶠之文仲容之書絶代之寳也乃復立碑造亭又自爲記刻其碑隂武氏亂唐毒流天下其遺蹟冝爲唐人所棄而長源當時號稱賢者乃獨區區於此何哉然余今又録之蓋亦以仲容之書可惜是以君子患乎多愛右眞蹟同前右流杯亭侍宴詩者唐武后乆視元年幸汝州温湯群臣應制詩也李嶠序殷仲容書開元中汝水壞其碑亭碑亦沉没貞元中陸長源爲刺史以爲嶠序仲容書絶代之寳也乃爲之造亭立碑自記其事於碑隂武氏亂唐毒流天下其遺跡宜爲唐人所棄而長源當時賢者區區於此何哉然余今又録之者特以仲容書尓是以君子患乎多愛右集本唐司刑寺大脚跡勑長安二年右司刑寺大脚跡并碑銘二閻朝隱撰附詩曰匪手擕之言示之事蓋諭昬愚者不可以理曉而決疑惑者難用空言雖示之已驗之事猶懼其不信也此自古聖賢以爲難語曰中人以下不可以語上者聖人非棄之也以其語之難也佛爲中國大患非止中人以下聦明之智一有惑焉有不能解者矣方武氏之時毒𬒳天下而刑獄慘烈不可勝言而彼佛者遂見光蹟於其間果何爲哉自古君臣事佛未有如武氏之時盛也視朝隱等碑銘可見矣然禍及生民毒流王室亦未有若斯之甚也碑銘文辭不足録録之者所以有集本無比字警也俾覽者知無佛之世詩書雅頌之聲斯民䝉福者如彼有佛之盛其金石文章與其人之𬒳禍者如此可以少思焉嘉祐八年重陽後一日書右眞蹟唐韓覃幽林思武后時右幽林思廬山林藪人韓覃撰余爲西京留守推官時因遊嵩山得此詩愛其辭翰皆不俗後十餘年始集古金石之文發篋得之不勝其喜余在洛陽凡再登嵩嶽其始徃也與集本作以梅聖俞揚子聦俱其再徃也與謝希深尹師魯王幾道揚子聦俱當發篋見此詩以入集時謝希深揚子聦已死其後師魯幾道聖俞相繼皆死蓋遊嵩在天聖十年是歲改元明道余時年二十六距今嘉祐八年蓋三十一年矣遊嵩六人獨余在尔感物追徃不勝二字集本作可為愴然六月旬休日書右眞蹟唐武盡禮寧照寺鍾銘景龍三年右武盡禮筆法精勁當時冝自名家而唐人未有稱之見於文字者豈其工書如盡禮者徃徃皆是特今人罕及尓余每得唐人書未甞不嘆今人之廢學也右眞蹟唐韋維善政論先天元年右韋維善政論著作郎楊齊哲撰維先天中爲坊州刺史齊哲所撰其實徳政碑也特異其名爾余甞患文士不能有所發明以警未悟而好爲新竒以自異欲以怪而取名如元結之徒是也至於樊宗師遂不勝其弊矣如齊哲之文𥘉無髙致第易碑銘爲論賛爾右集本唐令長新戒開元中右令長新戒唐開元之治盛矣玄宗甞自擇縣令一百六十三人賜以丁寧之戒其後天下爲縣者皆以新戒刻石今猶有存者余之所得者六世人皆忽不以爲貴也玄宗自除内難遂致集本作至太平世徒以爲英豪之主然不知其興治之勤用心如此可謂爲政知本末矣然鮮克有終明智所不免惜哉新戒凡六其一河内其二虞城其三不知所得之處其四汜水其五穰其六舞陽嘉祐八年六月十日書右眞蹟唐華陽頌天寳九年右華陽頌唐玄宗詔附玄宗尊號曰聖文神武皇帝可謂盛矣而其自稱曰上清弟子者何其陋哉方其肆情奢淫以極冨貴之樂蓋窮天下之力不足以贍其欲使神僊道家之事爲不無亦非其所可冀矧其實無可得哉甚矣佛老之爲世惑也佛之徒曰無生者是畏死之論也老之徒曰不死者是貪生之說也彼其所以貪畏之意篤則棄萬事絶人理而爲之然而終於無所得者何哉死生天地之常理畏者不可以苟免貪者不可以苟得也惟積習之乆者成其邪妄之心佛之徒有臨死而不懼者妄意乎無生之可樂而以其所樂勝其所可畏也老之徒有死者則相與諱之曰彼超去矣彼解化矣厚自誣而託之不可詰或曰彼術未至故死爾前者苟以遂其非後者從而惑之以爲誠然也佛老二者同出於貪而所習則異然由必棄萬事絶人理而爲之其貪於彼者厚則捨於此者果若玄宗者方溺於此而又慕於彼不勝其勞是真可笑也右集本唐有道先生葉公碑開元五年右有道先生葉公碑李邕撰并書余集古所録李邕書頗多最後得此碑於蔡君謨君謨善論書爲余言邕之所書此爲最佳也右眞蹟唐李邕嵩嶽寺碑開元二十七年右嵩嶽寺碑唐淄州刺史李邕撰胡英書英之書世所重也其文云寺後魏孝明帝之離宫𥘉名閑居寺仁壽二年改爲嵩嶽寺也右集本唐李邕端州石室記開元十五年右端州石室記唐李邕撰不著書人名氏考其筆蹟似張庭珪書疑庭珪所書也右集本唐獨孤府君碑歳月闕右獨孤府君碑李邕撰蕭誠書誠書世多有而此尤佳碑在峴山亭下余自夷陵徙乾徳令甞登峴山讀此碑碑爲四面而一面字完今人家所傳秖有一面而余所得有二面故其一面頗有訛缺也府君諱冊字伯謀河南人也其文不完故不見其終始右集本同前歳月闕右碑在峴山亭下余自夷陵徙乾徳令甞登峴山讀此碑碑爲四面而一面字完人家多有之而余所得蓋二面也故其一面頗有訛缺也蕭誠書世數數有之而此尤佳也右眞蹟唐裴大智碑開元二十九年右裴大智碑李邕撰蕭誠書誠以書知名當時今碑刻傳於世者頗少余集録所得纔數本爾以余之博采而得者止此故知其不多也然字畫筆法多不同疑模刻之有工拙惟此碑及獨孤冊碑字體同而最佳冊碑在襄陽而不完可惜也二碑皆李邕撰而誠書集本有焉字治平元年清明後一日書右眞蹟唐張嘉正碑開元二十六年右張嘉正碑李邕撰蔡有鄰立書集本有按字李絳論事集言吐突承璀欲於安國寺爲憲宗立紀聖徳碑乃先立碑建樓請學士撰文絳䟽論以爲不可憲宗遽命以牛百頭拽碑倒蓋未撰文而先立碑建樓此碑有鄰又三字集本作文云立書亦應先立石矣今人立碑湏鐫刻成文然後建立蓋今昔所爲不同各從其便爾治平元年七月二十日書右眞蹟已上六碑類李邕所撰不以歳月為序唐郭知運碑銘開元十年右郭知運碑銘蘇頲撰其書知運子四人皆有次第曰英傑英竒英恊英彦而張說亦爲集本有郭字知運撰碑其書知運子與頲集本有此碑二字正同而唐書知運傳書其子二人而無英竒英協英彦但云二子英傑英乂而巳十八字集本作英傑英乂而無英奇英協英彦而蘇張二碑又無英乂英竒等三子在唐不顯史家集本作官闕略尚或有之英乂甞爲西川節度集本有使字其事甚著史官不應失集本作差其世家而集本有蘇張二字二公作銘在郭知運卒後不逺亦不應闕其子孫莫可究其孰失也姑志集本作誌之以俟知者嘉祐八年十月十八日書右眞蹟唐御史臺精舎記開元十一年右御史臺精舎記崔湜撰梁昇卿書讀其文則湜於佛可爲疑篤信者矣唐書列傳云桓彦範等當國畏武三思使湜隂伺其姦而三思恩寵日盛湜反以彦範等計告之遂勸三思速殺彦範等以絶人望因薦其外兄周利正以害彦範等又云湜貶襄州刺史以譙王事當死賴劉幽求張說救護得免後爲宰相䧟幽求嶺表諷周利正殺之不果又與太平公主逐張說其餘傾邪險惡不可勝紀世言佛之徒能以禍福怖小人使不爲惡又爲虚語矣以斯記之言驗湜所爲可知也故録之于此其碑首題名多知名士小字頗佳可愛也治平元年三月九日書右眞蹟唐西嶽大洞張尊師碑開元十四年右西嶽大洞張尊師碑王延齡撰李慈書尊師名敬忠其事迹余無所取所録者以慈書爾慈之書體兼虞楮而遒麗可喜然不知爲何人以其書當時未必不見稱於世蓋唐人善書者多遂不得獨擅既又無他可稱遂至泯然於後世以余集録之博慈所書碑秖得此爾尤爲可惜也治平元年七月廿日書右眞蹟唐景陽井銘開元二十一年右景陽樓下井銘不著撰人名氏述隋滅陳叔寳與張麗華等投井事其後有銘以爲集本作著戒又有唐江寧縣丞王震井記云井在興嚴寺其石檻銘有序稱余者晉王廣也其文字皆磨滅僅可識其十一二叔寳事前集本無此字史書之甚詳不必見於此然録之以見焬帝躬自滅陳目見叔寳事又甞自銘以爲戒如此及身爲淫亂則又過之豈所謂下愚之不移者哉今其銘文隱隱尚可讀處有云前車已傾負乗將没者又可歎也嘉祐八年十二月二十六日書右眞蹟唐華嶽題名歳月見本文右華嶽題名自唐開元二十三年訖後唐清泰二年實二百一年題名者五百集本有十字一人再題者又三十一人集本有録爲十卷四字徃徃當時知名士也或兄弟同遊或子姪並侍或寮屬將佐之咸在或山人處士之相携或奉使奔命有行役之勞或窮髙望逺極登臨之適其冨貴貧賤歡樂憂悲非惟人事百端而亦世變多故開元二十三年集本有歲在二字丙午集本作子是歲天子集本有躬字耕籍田肆大赦羣臣方頌太平請封禪蓋有唐極盛之時也清泰二年集本有歲在二字乙未廢帝簒立之明年也是歳石敬瑭以太原反召契丹入自鴈門廢帝自焚于洛陽而晉髙祖入立蓋二字集本作自太原五代極亂之時也始終二百年間或治或亂或盛或衰而徃者來者先者後者雖窮逹壽夭參差不齊而斯五百人者卒歸於共盡也其姓名歳月風霜剥裂亦或在或亡其存者獨五集本作有千仞之山石爾故特録其題刻毎撫卷慨然何異臨長川而歎逝者也治平元年清明後一日書右眞蹟唐石臺道徳經歳月見本文右老子道徳經唐玄宗注開元二十三年道門威儀司馬秀等請於兩京及天下應修官齋等州皆立石臺刋勒其經文御書其注皆諸王所書此本在懷州右集本唐羣臣請立道徳經臺奏答歳月見本文右羣臣請立道徳經臺奏答并書注諸王列名附唐玄宗諸子三十人其一是爲肅宗其七不及得封而早夭唐書列傳所載二十二人以注經列名于此者十八人按集本有明皇既書道德經七字道士尹愔奏請懷州依京様摹勒石臺乃開元二十五年也皇太子瑛以二十五年廢二十六年始立忠王璵爲皇太子二十七年始更名紹則當書注時不得有皇太子紹也信王珵義王玼豐王珙陳王珪涼王璿汴王璥皆以二十一年封當書注時皆年尚㓜集本有疑字未能書而集本作又今經注字皆一體疑非諸王所書而後人追寓其名爾舊唐書以信王珵爲瑝濟王環爲瓌壽王琩爲瑁瑁名集本别字有見於武惠妃碑爲琩與此同當爲瑁也集本無也字有不疑而三字此碑列名旣可疑則環瑝二名未知孰是也嘉祐八年癸卯九月十日書右眞蹟唐陜州盧奐㕔事讃開元二十四年右盧奐㕔事譛唐玄宗撰并書奐爲陜州刺史玄宗行幸過陜州書其㕔壁而刻之右集本唐鶺鴒頌歳月闕當皇祐至和之間余在廣陵有勑使黄元吉者以唐明皇自書鶺鴒頌本示余把玩乆之後二十年獲此石本於國子博士楊襃又三年來守青州始知刻石在故相沂公宅熈寧三年五月二十八日書右集本唐玄宗謁玄元廟詩歳月闕右謁玄元廟詩唐玄宗撰并書余甞見世有玄宗所書鶺鴒頌與此字法正同碑在北邙山上洛陽人謂之老君廟也右集本唐裴光庭碑歳月見本文右裴光庭碑張九齡撰玄宗御書按唐書列傳云光庭素與蕭嵩不平及卒博士孫琬希嵩意以其用循資格非奬勸之誼謚曰克平帝聞特賜謚曰忠憲今碑及題額皆爲忠獻傳云撰搖集本作瑶山徃則而碑云徃記光庭以開元二十一年薨二十四年建此碑玄宗自書不應誤皆當以碑爲是集本有也字治平元年三月二十日書右眞蹟唐萬回神迹記碑開元二十五年右萬回集本有神迹記三字碑徐彦伯撰其事固已集本作可怪矣玄宗英偉之主彦伯當時名臣也而君臣相與尊寵稱述之如此欲使愚庸之人不信不惑其可得乎世傳道士罵老子云佛以神怪禍福恐動世人俾皆信嚮集本有故僧尼得享豐饒七字而爾徒二字集本作吾老子髙談清淨遂使我曹寂寞此雖鄙語有足采也治平元年三月八日書右眞蹟唐安公美政頌開元二十九年右安公美政頌房璘妻高氏書安公者名庭堅其事蹟非竒而文辭亦匪佳作惟其筆畫遒麗不類婦人所書余所集本無此字集録亦已博矣而婦人之筆二字集本作筆畫著於金石者髙氏一人而已然余常與蔡君謨論書以謂書之盛莫盛於唐書之廢莫廢集本作甚於今余之所録如于頔髙駢下至集本有楷書手三字陳游瓌等書皆有蓋集本有唐之二字武夫悍將暨楷書手輩字皆可愛今文儒之盛其書屈指可數者無三四人非皆不能蓋忽不爲尓唐人書見於今而名不知於當時者如張師丘繆師愈之類蓋集本有又字不可勝數也非余録之則將遂泯然於後世矣余於集古不爲無益也夫治平元年正月十三日書右眞蹟唐石壁寺鐡彌勒像頌開元二十九年右太原府交城縣石壁寺鐡彌勒像頌者集本有林諤撰三字參軍房璘妻髙氏書余所集録古文自周秦以下訖于顯徳凡爲千卷唐居其十七八其名臣顯逹下至山林幽隱之士所書莫不皆有而婦人之書惟此髙氏一人爾然其所書刻石存于今者惟此頌與安公美政頌爾二碑筆畫字體逺不相類殆非一人之書疑模刻不同亦不應相逺如此又疑好事者寓名以爲竒也識者當爲辨之治平元年端午日書右眞蹟唐郎官石記歳月闕右唐右司貟外郎陳九言撰張旭書旭以草書知名此字真楷可愛記云自開元二十九年已後郎官姓名列于次而此本止其序爾右集本唐開元聖像碑天寳元年右開元聖像碑陳知温書唐開元之治盛矣至於天寳而溢焉方其盛時人主意氣之驕超然遂欲追真僊於雲表其夢寐恍忽集本作惚云有見焉者雖是非真僞難明於杳藹亦其注心於物精神㑹通集本作通㑹志苟至焉無不獲也唐書著集本作紀玄宗事至於神仙道家頗集本作類不詳悉而此碑所集本無此字載夢真容事最備故特録之以見其集本作當時君臣吁俞相與言語者止於如集本無此字此俾覽者得以迹其盛衰治亂云右眞蹟唐大照禪師碑歳月見本文右大照禪師碑唐吏部貟外郎盧僎撰伊闕縣尉集賢院待制兼挍理史惟則書碑天寳元年立唐世分書名家者四人而巳韓擇木李潮蔡有鄰及惟則也右集本唐舞陽侯祠堂碑歳月見本文右舞陽侯祠堂碑唐王利器撰史惟則八分徐浩篆額天寳二年縣令張紫陽修樊噲廟文及書篆皆可愛也右集本唐崔潭龜詩天寳五年右崔潭龜詩蔡有鄰書唐世以八分名家者四人韓擇木蔡有鄰李潮史惟則也韓史二家傳於世者多矣李潮僅有存者有鄰之書亦頗難得而小字尤佳若石經藏譛崔潭龜詩與三代彞鼎銘何異右眞蹟唐興唐寺石經藏讃開元中右興唐寺石經藏讃皆其作者自書而八分者數家惟蔡有鄰著其姓氏有鄰名重當世杜甫甞稱之於詩其爲苑咸所書小字與三代器銘何異可謂名實相稱也余家集録有鄰書頗多皆不若此讃故尤寳之余初不識書因集古著録所閱既多遂稍識之然則人其可不勉彊於學也治平元年三月晦日書右眞蹟唐蔡有鄰盧舎那珉像碑開元十六年右盧舎那珉像碑蔡有鄰書在定州唐世名能八分者四家韓擇木史惟則世傳頗多而李潮及十七字集本作韓擇木等四家為最而有鄰特爲難得慶曆中今昭文韓集本作相公在定州爲余得此本余所集録自非衆君子共成之不能若此之多也右眞蹟唐植柏頌天寳元年唐世八分四家而巳韓擇木史惟則之書見於世者頗多蔡有鄰甚難得而李潮僅有亦或作尓皆後人莫及也不惟筆法難工亦近時學者罕復專精如前輩也右集本唐美原夫子廟碑天寳八年右美原夫子廟碑縣令王嵒字山甫撰并書碑不知在何縣嵒天寳時人字畫竒怪初無筆法而老逸不羈時有可愛故不忍棄之蓋書流之狂士也文字之學傳自三代以來其體隨時變易轉相祖習遂以名家亦烏有集本有定字法邪至魏晉以後漸分真草而羲獻父子爲一時所尚後世言書者非此二人集本有則字皆不爲法其藝誠爲精絶然謂必爲法則初何所據所謂集本無此二字天下孰知夫正法哉嵒書固自放於怪逸矣聊存之以備傳覽治平元年八月十一日書右眞蹟唐鄭預注多心經天寳九年右鄭預注多心經不著書人名氏疑預自書蓋開元天寳之間書體類此者數家如擣練石韓公井記洛祠志皆一體而皆不見名氏此經字體不減三記而注尤精勁蓋他處未甞有故録之而不忍棄矧釋氏之書因字而見録者多矣余毎著其所以録之意覽者可以察也治平元年夏至日大熱翫此以忘暑因書右眞蹟集古錄跋尾卷第六八都壇實録元第三十文云一作曰魏載墓誌銘元第五百六十四居甲一作髙甲乙速孤神慶碑元第八百五十二代祖二字上一有五字治平甲辰社日書一有此七字薛仁責碑元第六百五十二君氏闕文元第一百六十二尹孝子旌表文元附一百六十二深矣此下一有乎字孝子張常洧旌表碣元第二百三十二渭南令李君碑元第一百一十九流杯亭侍宴詩元第二百二十二臨汝此下一有温字同前碑亭一無碑字司刑寺大脚跡敕元第五百一十二脚跡一作佛跡敕一作記若斯此下一有時字甚也一作盛也斯民一作人幽林思元第二十九寧照寺鍾銘元第五百九十六韋維善政論元第八百五十治平甲辰秋社日書一有此八字唐令長新戒元第三百九華陽頌元第二百一十七所以貪畏一作所貪所畏之心一作性或曰彼術未至故死爾一無此九字於彼此下一有其字笑也此下一有巳字治平元年正月四日書一有此九字有道先生葉公碑元第二百四十爲最一作最爲嵩嶽寺碑元第一百十七端州石室記元第四十四獨孤府君碑元第四十七伯謀一作仲謀同前缺也一無也字裴大智碑元第四百三十五張嘉正碑元第六百二十二至六百二十三郭知運碑元第三十七知者此下一有注云英又紀徳碑云知運第七子也今碑與唐書互見者五人尚闕其二御史臺精舎記元第三百七十三張尊師碑元第六百七十景陽井銘元第二百六皆磨一無皆字華嶽題名元第四百二十一至四百三十開元二十三年真蹟誤作丙午集本改作丙子其實歳在乙亥其無歳月不可次第者别爲一卷第十跋後一有此十五字石臺道徳經元第二至七唐群臣請立道德經臺奏荅元第十玼一作玭廬陵歐陽某家藏一有此七字盧奐㕔事讃元第九十五鶺鴒頌元無卷第沂公二字上一有王字唐玄宗謁玄元廟詩元第七十九裴光庭碑元第四百五十七萬回碑元第三百七十八安公美政頌元第二百五十二師丘一作求鐵彌勒像頌元第六百七十七唐郎官石記元第九十八至一百開元聖像碑元第二百九十七嘉祐八年歳在癸卯𥘉伏日書一有此十二字大照禪師碑元第五十八舞陽侯祠堂碑元第六十三崔潭龜詩元第五百四十興唐寺石經藏讃元第四百八十六盧舎那珉像碑元第二百三十三至二百三十四余所集録自五字一作所集録目植栢頌元第一百五十九植一作桐甚難一作差難美原夫子廟碑元第九百七十七鄭預注多心經元第七百八十二
