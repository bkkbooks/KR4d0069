body:
  text: 近體賦詩附進擬御試應天以實不以文賦并引狀臣伏覩今月十三日御試應天以實不以文賦題目初出中外群臣皆歡然以謂至明至聖有小心翼翼事天之意蓋自四年來天災頻見故陛下欲修應天以實之事時謂出題以詢多士而求其直言外議皆稱自來科埸只是考試進士丈辭但取空言無益時事亦一作未有人君能上思天戒廣求規諫以為試題者此乃自有殿試以來數百年間景美之事獨見於陛下然臣竊慮逺方貢士乍對天威又迫三題不能盡其説以副陛下之意臣忝列書林粗知文字學淺文陋不自揆度謹擬御題撰成賦一首不敢廣列前事但直言當今要務皆陛下所欲聞者臣聞古者聖帝明王皆不免天降災異惟能修德修政則變災為福永享無窮之休臣不勝大願其賦一首謹隨狀上進賦推誠應天豈尚文飾天災之示人也若響應聲君心之奉天也惟德與誠固當務實以推本不假浮文而治情彼雖不言謫見以時而下告吾其修德禍患可銷於未萌臣聞天所助兮惟善則降祥德苟至兮雖妖而不勝皆由人事之告召然後天心之上應若國家有闕失之政則當頻見於衆災欲人主知戒懼之心所以保安於萬乘臣請述當今之所為引近事而為證至如陽能和隂則雨降若歲大旱則陽不和隂而可推去年大旱隂不侵陽則地靜若地頻動則隂干於陽而可屆去年河東地頻動又如黑者隂之色晦者隂之時或暴風慘黑而大至白晝晦冥而四垂康定元年三月黑風起白日晦日食正旦雨冰木枝今春二月如此之類皆隂之為蓋隂為小人與婦人又為大兵與蠻夷若四者之為患則群隂之失冝故天象以此告吾君不謂不至陛下所冝奉天戒不可不思是謂應以實者臣敢列而言之若夫慎擇左右而察小人則視聽之不惑肅清宫闈而減冗列則恭儉而成式況乎逺佞人者孔宣父之明訓放宫女者唐太宗之盛德又若西師久不利冝究兵弊而改作叛羌久未服冝講廟謀之失得在陛下之至聖行此事而不忒庶天意之可回雖有災而自息方今民疲賦斂之苦又值飢荒之年資財盡於私室苗稼盡於農田劫掠居人盜賊並起流離道路老幼相連陛下視民如子覆民如天在於仁聖非不矜憐故德音除刻削之令赦書行賑濟之權然而詔令雖嚴州縣之吏多慢人死相半朝廷之惠未宣夫天至髙逺也惟可動以精誠民之休戚也皆繫君之好尚惟善政之能惠則休符之並貺而況冨有四海之大獨制萬民之上一言之出兮誰敢不從百事責實兮自然無曠發號施令在聖意之必行變災為祥則太平之可望今漢史有五行之志尚書有洪範之文願詔侍臣之講説許陳古事於聽一作聰聞可以見自召妖災雖由於時政能招福應亦自於明君故禾偃於風表周王之覺悟雉鳴于鼎成商帝之功勳蓋恐懼修省者實也在乎不倦祈禳消伏者文也皆不足云臣生逢納諌之聖明不間直言之狂斐惟冀愚衷一作忠之可採苟避誅夷而則豈蓋賦者古人規諌之文臣故敢上干於旒扆監試玉不琢不成器賦良玉非琢安得成器至寶雖美因人乃彰欲成器而斯尚由載琢以為良瑕玷弗施始中含於溫潤切瑳有則取應用於圎方披大禮之遺言洞先儒之所録以謂玉不因琢器莫得以自貴人不因學道無由而內朂故我誘之於人諭之以玉內含其美雖稟質而可嘉外飾其形假載雕而後足然以寶有可尚世誠所希價連城而有待氣如虹而上揮禮神之用斯在磨玷之言則非稟爾天真包十德而成質制由工巧參六瑞以凝輝然則攻自它山列乎良璞雖曰寶也不能效於自用雖曰堅也未有成於不琢美在中矣徒內抱於英華礲而錯諸始外成於圭角豈不以玉者華於國而可重器者用於人而克安規矩殊形於圭璧短長具制於躬桓亦猶在鎔者金必資乎煆礪之設從繩者木遂分乎曲直之端且夫人務其師玉貴其德􅒏雖本善不學則弗至於道質雖至美不琢則弗成其飾稽匪刻匪雕之説理實異斯嘉如切如磋之言義誠有得彼大圭貴乎尚質鳴珮取乎揚聲雖效珍而並用在設諭以非精曷若彰教誨而有漸譬琢雕而可成是故西琥東圭捨規模而安創半璋全璧非制度以難明向若追琢不加刻畫非備雖縝密以含彩在文華而曷視故楊子以謂玉不雕則璠璵不作器國學試人主之尊如堂賦堂陛隆峻人主尊矣位既異等君冝有常惟居尊而體國爰取諭於如堂望而畏之使下民之咸仰髙為貴者譬逺地以同彰稽往諜之遺文懿嘉言之洞啓謂立制於君上諭相承于堂陛蓋以貴賤殊品尊卑異禮下臨於物必也尊嚴而有儀上譬於堂所以崇髙乎正體誠以赫赫化𬒳巍巍道隆儼正寧以居極統群黎於宅中蓋取乎馭民之貴非資於構厦之功位正當陽若盛九筵之制民欣戴后如瞻七尺之崇然則堂非髙則逼下而易陵君弗尊則保位而難慎卑髙必貴乎不瀆上下於焉而克順邇臣內附類榱棟之相依一作髙列辟下陳由陛廉而比峻豈不以冨有函夏躬臨兆民示臣庶之弗越表等威之有倫將使制爾萬國宗豫一人下絶僣王非歷階之可及世惟與子彰肯構以相因是知制衆室者莫先乎堂奄九有者必尊其主蓋兼統於邦國匪專稱於棟宇化有於下奉穆穆以深居仰之彌髙若耽耽之可覩蓋由堂不可以卑而亂制君不可以黷而不尊喻穹隆於九仞用總制於群元且異夫蓋之如天但述居髙之旨就之如日惟明照下之言大哉陛峻而堂髙者勢之然臣貴而君尊者國之理伊制度之有别俾崇髙而是視所以建公卿大夫而天子加焉其尊也於斯見矣詔重修太學詩漢詔崇儒術虞庠講帝猷叢楹新寶構萬杵逐歡謳照爛雲甍麗回環璧水流冠童儀盛魯蒿柱德同周舞翟彌文郁橫經盛禮修微生聽昕鼓願齒夏弦遊省試司空掌輿地圖賦平土之職圖掌輿地率土雖廣披圖可明命乃司空之職掌夫輿地之名奉水土以勤修慎司無曠覽山川而盡載按諜惟精所以專一官而克謹辨九區而砥平者也伊昔令王尊臨下土以謂綿宇非一不可以周覽衆職異守俾從於各主故我因地理二字一作輿地之察冝建冬官而法古將使如指諸掌括乎地以無遺皆聚此書著之圖而可覩險固咸在方隅異冝分形勝以昭若庶指陳而辨之度地居民既修官而有舊辨方正位俾披文而可知其或作屏建親命侯封國小大有民社之制逺邇異封圻之式非圖無以辨乎數非官無以奉其職主於空土既險阻之盡明别爾分疆志廣輪而可識誠由據函夏之至要贊大君之永圖上以體國而經野下以建邦而設都參古號於周官各司其局辨群方於禹迹無得而踰是何標區域以並分限華夷而靡爽域中所以張乎大天下無以逾其廣亦猶五土異物必辨於司徒之官九州有冝乃命乎職方之掌用能三壤咸則四民奠居窮人迹於遐域包坤載於方輿且異夫充國論兵但模方略之狀鄼俟創業惟收圖籍之餘彼夏貢紀乎州名漢史標乎地志雖前䇿之並載在設官而未備曷若我謹三公於漢儀專掌圖於輿地翠旌詩盛禮郊儀肅純音帝樂清葳蕤飄翠羽赫奕展華旌鳳邸光交覆鸞旗色共明􅌭紛拂葩蓋輝映雜緌纓且異文竿飾非同翿舞名竹宫歌毖祀雅曲播遺聲殿試藏珠於淵賦君子非貴難得之物稽治古之敦化仰聖人之作君務藏珠而弗寶俾在淵而可分效乎至珍雖希世而弗産棄於無用嫓還浦以攸聞得外篇之寓言述臨民之致理將革紛華於偷俗復芚愚於赤子謂非欲以自化則爭心之不起蓋賤貨者為貴德之義敦本者由抑末而始示不復用雖乎寶而奚為捨之則藏祕諸淵而有以誠由窒民情者在杜其漸防世欲者必藏其機使嗜欲不得以外誘則淳朴於焉而可歸將抵璧以同議諒彈雀而誠非照乘無庸盡遺崎岸之側連城奚取皆沉媚水之輝用能崇儉德以外昭復淳風而有謂民心朴以歸本物産全而靡費珍雖無脛俾臨淵而盡除事異暗投永沉川而不貴然而道既散則民薄風一澆而朴殘玩好既紛乎外役質素無由而內安故我斥乃珍竒之用絶乎侈靡之端將令物遂乎生老蚌蔑剖胎之患民知非尚驪龍無探頷之難是則恢至治之風揚淳古之式不寶於逺則知用物之足不見其欲則無亂心之惑上苟賤於所好下豈求於難得是雖寶也將去泰而去奢從而屏之使不知而不識彼捐金者由是類矣摘玉者可同言之諒率歸於至理實大化於無為致爾漢臯之濵各全其本雖有淮蠙之産無得而窺自然道著不貪時無異物民用遵乎至儉地寶蕃而不屈所以虞舜垂衣亦由斯而弗咈博愛無私詩賞以春夏賦天子行賞欽順時令賞出於國時行在天紀勳庸而有序順春夏以昭宣無忘爾勞法蠢生而布惠用嘉乃績因長飬以旌賢原夫執政者君為民之紀懼賞罰之一失則恩威之兩弛受焉不以其私賜之非為其喜蓋夫欲固其國者必謹國之常能奉乎天者是謂天之子將出令以無僣必順時而后軌顯庸制爵爰占星鳥之中茂德建官當俟薰風之始且夫春居東以首歲夏司南而執衡在氣為燠於時主生東動也以之起南任也以之成我所以推本萬事之理欽象四時之行政刑由是以有度寒暑於焉而不爭頒以土田順木行而養育昭其服物助火德之光明故曰天之大端在隂陽君之大柄在刑賞操其柄以歸巳求其端而取象法太蔟贊陽之月行慶有常體林鍾種物之時勸功無爽誠以賞當則民協澤流而德深但慮過時之失敢懷虛受之心故月令有布德之文前規具在景風為賜爵之候往牒攸欽嗚呼王者畏天以臨民天道在人而可信事與時合則為和而為福時與事逆則有災而有饉在乎察動靜以為本布仁恩而克慎亦由獮田主教非仲秋而不行議獄齗刑須大冬而乃順故能光昭國體欽奉邦彞用豈有於踰德舉無聞於振時且異夫賜以鞶纓示假人而取誚贈其衮冕譏錫命以非冝大哉君之舉者必書上之出者為令苟違時而不度懼招尤而失正故左氏載聲子之言以戒後王之立政畏天者保其國賦祗畏天道能守其國聖人以凝命恭默膺圖肅祗爰務畏天之義但彰保國之規惟帝難之翼翼固欽於乾道為人上者兢兢慎守於邦基用能御寶位而惟永隆昌運以咸熙者也探齊王之式陳懿子輿之所謂將設治民之術先本為君之貴且曰天惟簡在誠由乎不敢荒寧國乃洽平是冝乎克自抑畏惠此方國欽若昊天實克遵於栗栗示無爽於乾乾慮威宣咫尺之間所以嚴恭罔怠致疆啓幅貟之內所以砥定無愆蓋由仰髙明以惟勤遂邦家而永保又新之戒斯在無逸之篇可考順帝之則始敦危懼之誠俾民不迷終得阜安之道豈不以天者本降鑒而是顯國者在緝綏而以興畏乎天表降鑒之甚邇保乎國示緝綏而可慿審雖休勿休之理遵日慎一日之稱是故懼無災以為懷見楚莊之勿伐不敢康而在念識周成之有能夫如是則垂拱是圖持盈可久不遑啓居兮以圎靈之是奉無敢暇豫兮以中區而自守昭事而冝乎宗社咸寧之旨攸同欽承而惠彼民人設險之功何有不然又安得惟寅謹爾匪懈昭其蓋足憚於覆燾必克固於蕃維周詩垂陟降之文亦足畏也洊雷著修省之説于時保之至哉闡繹聖猷鋪昭皇極眷戁悚以為本在撫綏而作式有以見惟天為大而君則之故定于萬國斫雕為朴賦除去文飾歸彼淳朴德以儉而為本器有文而可除爰斫載雕之飾將全至朴之餘篆刻未銷見背偽歸真之始鏤章咸滅知去華務實之初稽史牒之前聞述政風而遐舉懿淳儉之攸尚斥浮華而可沮謂乎防世偽者在塞其源全物性者必反其所素以為貴將抱朴而是思煥乎有文俾運斤而悉去誠由淳自澆散器隨朴分騁匠巧而傷本掩天真而蔑聞故我反淳風而矯正杜末作之紛紜剖刻桷之形復采椽而不琢滅鏤簋之僣反木器於無文則知工巧盡捐浮淫是抑道尚取乎反本理何求於外飾圭磨嶽鎮歸璞玉以全真罍去山雲表瓦樽而務德是則遵乎朴者將反始而臻極斫乎雕者惡亂真而飾非約澆風於一變矯治古以同歸礲而錯諸盡滅雕蟲之巧質為貴者寧慙朽木之譏用能杜文彩之煥然返淳和而遵彼雕雖著則尚可磨也朴其復則在其中矣棄末反本小巧之工盡捐革故取新見素之風可美彼琢玉然後成器命工列乎雕人務以文而勝質徒散朴以還淳曷若剞劂之功靡施大巧若拙刻鏤之華盡減其德乃真懿之隆者非假飾以為資儉之至者匪竒淫而是覺但期乎去泰去甚寧患乎匪雕匪斫有以知一變至道之風由是而復歸乎朴祭先河而後海賦王者行祭先務其本在祭者必有常典務本者貴乎不忘既先河而告備乃後海以為常幣玉始陳恭視諸侯之瀆牲牢繼列方祠百谷之王探國典之舊文撫禮經之大旨以謂河導其派本一勺而始矣海納其會實百川之委也祀容肅設必先有事於靈長望秩並修然後功歸於善下誠以決九川而分導括衆流而混并一則窮本而有自一則兼容而積成是用分禮章而異數昭祭典以推行命祀首陳始則出圖之所禱辭以設方祈紀地之名用能縟乃令儀昭夫重祭利萬物以斯善用五材而並濟無文既秩禜經瀆以領祠羣望繼行禱朝宗而用幣外則盡物中惟告虔既義取於源委乃禮分於後先一禱致誠必告榮光之涘大川並走嗣臨重潤之淵得非衆嶽肇乎一拳椎輪生乎五輅考厥初之攸在彰返始而為務亦猶文王之祀雖貴不踰后稷之尊齊人之事將行敢越配林之故是知河必居首取發源而肇兹海不自大由積衆以成其導洪流而並注散靈潤以旁滋顧乃濫觴之因必有先也視爾委輸之廣然後從之異哉祭尚潔誠禮惟思反將展報以為義必討源而自逺故夫三王之祭川必務其本大匠誨人以規矩賦良匠之誨人以規矩工善其事器無不良用準繩而相誨由規矩以為常度木隨形俾不欺於曲直運斤取法必先正於圎方載考前文爰稽哲匠伊作器以祖善必誨人而攸尚有模有範俾從教之克精中矩中規貴任材而必當誠以人於道也非學而弗至匠之能也在器而攸施既諄諄而誨爾俾拳拳而服之默受以全曲則輪而直則軫動皆有法完為鞠而斷為棊然則道不可以弗知人不可以無誨苟審材之義失則教人之理昧規矩有取為圭為璧以異冝制度可詢象地象天以是配匠之心也本乎大巧工之事也作干聖人因從繩而取諭彰治材而有倫學在其中辨蓋輿之異狀藝成而下明鑿枘之殊陳義不徒云道皆有以將博我而斯在寧小巧而專美殊玉工之作器惟求磨琢之精異扁人之斫輪但述苦甘之旨是知直在其中者謂之矩曲盡其妙者本乎規然工藝以斯下俾後來之可師道或相營引圎生方生而作諭言如未逹譬周旋折旋而可知是何朴斫為工剞劂斯主玩其役以雖未聽乃言而可取故孟子謂學者之誨人亦必由於規矩魯秉周禮所以本賦魯公之後某本周禮見振竒集巳下續添侯國修度時王著彞惟東魯之大本秉西周之舊儀曲阜襲封率奉先規之盛鎬京遺法限為至治之基説者謂惟王建邦裂疆分土稟正朔者歸於元后尊制度者合於前古惟周之典世為大則惟魯之盛法為常矩及夫姬道衰逸邦侯侵侮雖周公之才之美不行於時文王之德之純盡在於魯述夫禮與時至教由治隆翊奉孺子位為上公千乘之國仰有遺法數世之後敢棄元功雖治邦治刑尚可宏宣於祖業而教典教法能固本於民風大德純純兮世不敢忘至文微微兮流而自逺守茂典之惟永遵飛疑休而可損一變于道聖人之後所以昌百世可知先王之法以為本且夫德固則邦化法行則教流治而久於諸侯則莫若魯教而正於三代則莫如周在隱桓之世力行純軌至定哀之後不棄芳猷蓋固蒂以惟至以治人而可求彼雖發歎於詩人改王室而作離黍何俟興言於聲子見易象之與春秋蓋夫與治同道罔不興安上治民莫如禮禮與邦化則莫窺其枝葉法因時至則深蟠其根柢亦如齊有太公之遺制定作民彞杞觀夏道之可知式成邦體嗚呼聖之所治人不可追移茂實以參用著通規而有冝遂使化民之議有所經理之大者治國之君無亂紀則而行之大哉周世所行魯邦慎守秉其法為治之極則其文延付而後故仲孫知魯而不可取者禮為本焉致邦儀之含厚秋獮詩見古省題詩豳籥迎寒至商飈應節流戎容修大獮殺氣順行秋多稼登方茂三農隙始休飲歸軍實獻誓衆黻為裘索享儀非蠟圍田禮異搜國威思逺播神武暢皇猷外集卷第二十四進擬御試賦引狀自四年來四字下一有五字玉不琢不成器賦可成一作可名難成一作難明賞以春夏賦必順一作先順東動也以之起南任也以之成一作東動也事之以發南任也物之以成養育一作長育有常一作無差無爽一作不爽具在一作其載往牒攸欽一作往諜攸藏事逆一作事戾有災而有饉一作或災而或饉主教一作主殺而不行不一作後故能一作蓋其且異夫賜以鞶纓一作豈北夫賜以繁纓贈其衮冕一作贈夫衮冕大匠誨人以規矩賦完為鞠完當作梡居士集卷第二十四歐陽文忠公集二十四墓表八首石曼卿墓表曼卿諱延年姓石氏其上世為幽州人幽州入于契丹其祖自成始以其族間走南歸天子嘉一作喜其來將祿之不可乃家于宋州之宋城父諱補之官至太常博士幽燕俗徑武而曼卿少亦以氣自豪讀書不治章句獨慕古人竒節偉行非常之功視世俗屑屑無足動其意者自顧不合於時乃一混以一作干酒然好劇飲大醉頽然自放由是益與時不合而人之從其遊者皆知愛曼卿落落可竒而不知其才之有以用也年四十八康定二年二月四日以太子中允祕閣校理卒于京師曼卿少舉進士不中一有第字真宗推恩三舉進士皆補奉職曼卿初不肯就張文節公素竒之謂曰母老乃擇祿耶曼卿矍然起就之遷殿直久之改太常寺太祝知濟州金鄉縣歎曰此亦可以為政也縣有治聲一有用薦者三字通判乾寧軍丁母永安縣君李氏憂服除通判永靜軍皆有能名充館閣校勘纍遷大理寺丞通判海州還為校理莊獻明肅一有皇字太后臨朝曼卿上書請還政天子其後太后崩范諷以言見幸引嘗言太后事者遽得顯官欲引曼卿曼卿固止之乃巳自契丹通中國德明盡有河南而臣屬遂務休兵養息天下然內外弛武三十餘年曼卿上書言十事不報已而元昊反西方用兵始思其言召見稍用其説籍河北一無二字河東陜西之民得鄉兵數十萬曼卿奉使籍兵河東還稱旨賜緋衣銀魚天子方思盡其才而且病矣既而聞邊將有欲以鄉兵扞賊者笑曰此得吾粗也夫不教之兵勇怯相雜若怯者見敵而動則勇者亦牽而潰矣今或不暇教不若募其敢行者一有用字則人人皆勝兵也其視世事蔑若不足為及聽其施設之方雖精思深慮不能過也狀貌偉然喜酒自豪若不可繩以法度退而質其平生趣一作取舍大節無一悖于理者遇人無賢愚皆盡欣歡一作歡欣及間而可不天下是非善惡當其意者無幾人其為文章徑健稱其意氣有子濟滋天子聞其喪官其一子使祿其家既卒之三十七日葬于太清之先塋其友歐陽修表於其墓曰嗚呼曼卿寧自混以為髙不少屈以合世可謂自重之士矣士之所負者愈大則其自顧也愈重自顧愈重則其合愈難然欲與共大事立竒功非得一無得字難合自重之士不可為也古之魁雄之人未始不負髙世之志故寧或毀身汚迹卒困於無聞或老且死而幸一遇猶克少施於世若曼卿者非徒與世難合而不克所施亦其不幸不得至乎中壽其命也夫其可哀也夫尚書屯田貟外郎李君墓表漢水東至乾德匯而南民居其衝水悍暴而岸善崩然其民尤冨完其下南山一作山南之材治室屋聚居蓋數千家皆安然易漢而自若者以有石隄為可恃也景祐五年余始為其縣令既行漢上臨石隄問其長老皆曰吾李君之作也於是喟然而歎求李君者得其孫厚厚舉進士好學能自言其世云李氏貝州清河人君舉進士中淳化三年乙科鎮州真定主簿齊化基為吏以強察自喜惡君廉直不為屈多求事可釀為罪者責君理之君辨愈明不可汚卒服其能反薦之遷威虜軍判官秩滿一無二字河北轉運使又薦為冀州軍事判官逾年一無二字吏部考一無此字籍凡四較考者外皆召還公考當召是時契丹侵邊冀州獨乞留君督軍餉課為最多遷大理寺丞乘傳治一作理壁州疑獄既還轉運使又請通判冀州督旁七縣軍餉課尤多而民不勞遭歲飢悉出庾粟以貸民且曰凶豐甚必復使豐而歸諸庾是化吾朽積而為新乃兩利也轉運使以為然因請君益貸貝魏滄諸州後歲果豐飢民德君粟歸諸庾無後者蓋賴而活者數十萬家一本有居三年轉運使上冀人言乞留許留一歲就拜殿中丞歲滿將去冀民夜私入其府塹其居若不可出君諭之乃得去通判河南一有府字未行契丹兵指邢洺天子擇吏之能者改君通判邢州其守一無二字趙守一當守邢以扞冦辭不任邢事天子曰李某佐汝可無患守一至邢悉以州事任君御史中丞王嗣宗辟推直官遂薦為御史以疾不拜求知光化軍作所謂石隄者孫何薦其材拜三司戶部判官改知建州皆以疾辭又求知漢陽軍居三歲而漢陽之獄空者二歲卒以疾解退居于漢旁大中祥符六年五月某日卒于家遂葬縣東遵教鄉之友于村子孫因留家焉君諱仲芳字秀之享年五十有三一作二官至尚書屯田貟外郎君為人敦敏而材以疾中止一有善不享其厚用不既其能余聞古之有德於民者殁則鄉人祭於其社今民既不能祠君于一作於漢之一無之字旁而其墓幸在其縣余令也又不表以示民嗚呼其何以章乃德俾其孫刻石于隧以永君之揚一作賜內殿崇班薛君墓表公諱孰字宗道姓薛氏資政殿學士兵部尚書簡肅公之弟薛之世德終始有簡肅公之志與碑公官至內殿崇班以某年某月某日卒官于蜀州其子仲孺以其喪歸葬于絳州之正平先葬而來乞銘以志豫幸嘗紀次簡肅公之德而又得銘公其銘曰公躬直清官以材稱惟賢是似不愧其兄既葬而仲孺又來請曰銘之藏誠一作者以永吾先君于不朽然不若碣于隧以表見于世之昭昭也豫惟薛氏於絳為著姓簡肅公於公為兄弟而公之世德豫既見之銘而其子又欲碣以昭顯于世可謂孝矣然豫考古所謂賢人君子功臣烈士之所以銘見于後世者其言簡而著及後世衰言者自疑於不信始繁其文而猶患於不章又備其行事惟恐不為世之信也若薛氏之著于絳簡肅公之信于天下而豫之銘公不愧於其兄則公之銘不待繁言而信也然其行事終始豫亦不敢略而志諸墓矣今之碣者無以加焉則取其可以簡而著者書之以慰其子之孝思而信于絳之人云連處士墓表連處士應山人也以一布衣終于家而應山之人至今思之其長老教其子弟所以孝友恭謹禮讓而溫仁必以處士為法曰為人如連公足矣其矜寡孤獨凶荒飢饉之人皆曰自連公亡使吾無所告依而生以為恨嗚呼處士居應山非有政令恩威以親其人而能使人如此其所謂行之以躬不言而信者歟處士諱舜賔字輔之其先閩人自其祖光𥙿嘗為應山令後為磁郢二州推官卒而反葬應山遂家焉處士少舉毛詩一不中而其父正以疾廢于家處士供養左右十餘年因不復仕進父卒家故多資悉散以賙鄉里而教其二子以學曰此吾資也歲飢出穀萬斛以糶而市榖之價卒不能增及旁近縣之民皆賴之盜有竊其牛者官為捕之甚急盜窮以牛自歸處士為之愧謝曰煩爾送牛厚遺以遣之嘗以事之信陽遇盜於西關左右告以處士盜曰此長者不可犯也捨之而去處士有弟居雲夢往省之得疾而卒以其柩歸應山應山之人去縣數十里迎哭爭負其柩以還過縣市市人皆哭為之罷市三日曰當為連公一作當與處士行喪處士生四子曰庶庠庸膺其二子教以學者後皆舉進士及第今庶為壽春令庠為冝城令處士以天聖八年十二月某日卒慶曆二年某月日葬于安陸蔽山之陽自卒至今二十年應山之長老識處士者與其縣人嘗賴以為生者往往尚皆在其子弟後生聞處士之風者尚未逺使更三四世至于孫曽其所傳聞有時而失則懼應山之人不復能知處士之詳也乃表其墓以告于後人一作云八年閏正月一日廬陵歐陽修述尚書屯田貟外郎張君墓表君諱谷字應之世為開封尉氏人曾祖節祖遇皆不仕父炳為鄭州原武縣主簿因留家焉今為原武人也君舉進士及第為河陽河南主簿蘇州觀察推官開封府士曹參軍遷著作佐郎知陽武縣通判眉州纍遷屯田貟外郎復知陽武縣以疾致仕卒于家享年五十有九君為人剛介一作毅好學問事父母孝與朋友信其為吏潔廉所至有能稱其在河南時豫為西京留守推官與謝希深尹師魯同在一府其所與遊雖他掾屬賔客多材賢少壯馳騁於一時而君居其間年尚少獨苦羸病肺唾血者巳十餘年幸其疾少間輒亦從諸君飲酒諸君愛一作惜而止之君曰我豈久生者邪雖他人視君亦若不能勝朝夕者其後同府之人皆解去而希深師魯與當時少壯馳騁者喪其十八九而君癯然唾血如故後二十年始以疾卒君雖病羸而力自為善居官為吏未嘗廢學問多為賢士大夫所知乃知夫康強者不可恃以久而羸弱者未必不能生雖其遲速長短相去幾何而強者不自勉或死而泯沒於無聞弱者能自力則必有稱於後世君其是巳君嘗謂豫曰吾旦暮人耳無所取於世也尚何區區於仕哉然吾常哀祿之及於親者薄若幸得不死而官登于朝冀竊國家褒贈之寵以榮其親然後歸病于原武之廬足矣乃益買田治室於原武以待君自河南蘇州纍為名公卿所薦乃遷著作為郎官贈其父太子中允一作舍母宋氏京兆一作司氏未安縣太君於是遂致仕歸于原武營其德政鄉之張固村原將葬其親卜以皇祐五年十一月某日用事前四日君亦卒遂以某日從葬于原上豫與君遊久記其昔所謂豫者且哀君之賢而不幸又嘉君之志信而有成於其葬也不及銘乃表於其墓君娶祝一作竹氏封華陽縣君有子曰損試將作監主簿至和二年三月七日翰林學士尚書吏部郎中知制誥充史館修撰歐陽修撰龍武將軍薛君墓表薛姓居河東者自唐以來族最盛宋興百年而薛姓五顯資政殿學士尚書户部侍郎贈兵部尚書簡肅公當天聖中參輔大政以亮直剛毅為時名臣公絳州正平人也有子直孺早卒無後以其弟之子仲孺為後然其兄弟五人及其諸子皆用公廕祿仕以忠厚孝謹多材能為絳大族君諱某字某簡肅公之兄也少有髙節仕而不得志退老于家以德行文學為鄉善人君少好學工為文辭應有司格既而曰是豈足學也哉乃棄而不為其後簡肅公貴顯以恩例補君右班殿直君篤愛其弟不得巳為強起就職居頃之卒棄去遂不復仕君居鄉里孝悌於其家忠信於其朋友禮讓於其長老鄉里之人始而愛久而化既殁而猶思焉君以天聖二年十一月某日以疾卒于家享年六十有九以某年某月某日葬于正平縣清原鄉之周村原曽祖景贈太保祖溫瑜贈太傅父光化贈太師母曰鄭國夫人費氏子男二人長曰長孺今為尚書虞部貟外郎知絳州軍州事次曰良孺殿中丞女三人君以子恩纍贈右龍武軍將軍夫人鄭氏正平縣太君君卒之若干年其子始以尚書郎來守是州豫薛氏壻也且嘉君之隱德以終而有後乃為表于其墓既又作詩以遺之曰伊絳之人其出如雲往于周原從我邦君周原有墓鬱鬱其松絳無居人惟邦君是從來以春秋執事必躬邦君在絳禮我耆艾惟父之執其恭敢怠邦君有政惠我後生從民上冢閭里之榮嗟我絳人孝慈友悌為善有後惟邦君是視永春縣令歐君墓表君諱慶字貽孫姓歐氏其上世為韶州曲江人後徙均州之鄖鄉又徙襄州之榖城乾德二年分榖城之隂城鎮為乾德縣建光化軍歐氏遂為乾德人修嘗為其縣令問其故老鄉閭之賢者皆曰有三人焉其一人曰太傅贈太師中書令鄧文懿公其一人曰尚書屯田郎中戴國忠其一人曰歐君也三人者學問出處未嘗一日不同其忠信篤於朋友孝悌稱於宗族禮義逹于一作於鄉閭乾德之人初未識學者見此三人皆尊禮而愛親之既而皆以進士舉于鄉里一無里字而君獨黜于有司後二十年始以同三禮出身為潭州湘潭主簿陳州司法參軍監考城酒稅遷彭州軍事推官知泉州永春縣事而鄧公巳貴顯于朝君尚為州縣吏所至上官多鄧公故舊君絶口不復道前事至終其去不知君為鄧公友也君為吏廉貧宗族之孤幼者皆養于家居鄉里有訟者多就君決曲直得一言遂不復爭人至于今傳之嗟夫三人之為道無所不同至其窮逹何其異也而三人者未嘗有動於其心雖乾德之人稱三人者亦不以貴賤為異則其幸不幸豈足為三人者道哉然而逹者昭顯于一時而窮者泯沒於無述則為善者何以勸而後世之來者何以考德於其先故表其墓以示其子孫君有子世英為鄧城縣令世績舉進士君以天聖七年卒享年六十有四葬乾德之西北廣節山之原一有云字河南府司録張君墓表一作碣故大理寺丞河南府司録張君諱汝士字堯夫開封襄邑人也明道二年八月壬寅以疾卒于官享年三十有七卒之七日葬洛陽北邙山下其友人河南尹師魯志其墓而廬陵歐陽修為之銘以其葬之速也不能刻石乃得金谷古磚命太原王顧以丹為隸書納于一作於壙中嘉祐二年某月某日其子吉甫山甫改葬君于伊闕之教忠鄉積慶里君之始葬北邙也吉甫才數歲而山甫始生余及送者相與臨穴視窆且封哭而去今年春余主試天下貢士而山甫以進士試禮部乃來告以將改葬其先君因出銘以示余蓋君之卒距今二十有五年矣初天聖明道之間錢文僖公守河南公王家子特以文學仕至貴顯所至多招集文士而河南吏屬適皆當世賢材知名士故其幕府號為天下之盛君其一人也文僖公善待士未嘗責以吏職而河南又多名一無名字山水竹林一作蔥竹茂樹竒花忹石其平臺清池上下荒墟草莽之間余得日從賢人長者賦詩飲酒以為樂而君為人靜默修潔常坐府治事省文書尤盡心於獄訟初以辟為其府推官一作察推既罷又辟司録河南人多賴之而守尹屢薦其材君亦工書喜為詩間則從余遊其語言簡而有意飲酒終日不亂雖醉未嘗頺墮與之居者莫不服其德故師魯志之曰飭身臨事余嘗愧堯夫堯夫不余愧也始君之葬皆以其地不善又葬速一有其字禮不備君夫人崔氏有賢行能教其子而二子孝謹克自樹立卒能改葬君如吉卜君其可謂有後矣自君卒後文僖公得罪貶死漢東吏屬亦各引去今師魯死且十餘年王顧者死亦六七年矣其送君而臨穴者及與君同府而遊者十蓋八九死矣其幸而在者不老則病且衰如豫是也嗚呼盛衰生死之際未始不如是是豈足道哉惟為善者能有後而託於文字者可以無窮故於其改葬也書以遺其子俾碣于墓且以寫余之思焉吉甫今為大理寺丞知緱氏縣山甫始以進士賜出身云翰林學士右諌議大夫史館修撰歐陽修撰居士集卷第二十四熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正連處士墓表羅氏本葬安陸蔽山之原諸本以陸為陵朝佐按安州安陸郡其倚郭有安陸縣應山乃鄰邑今從羅本石曼卿墓表然好一無然字連處士墓表連處士此下一有者字張屯田墓表幸其疾三字上一有時字龍武將軍薛君墓表清原鄉原一作源
