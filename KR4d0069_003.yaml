body:
  text: 河南府平陽洞河陽濟瀆北海水府投送龍簡青詞八月十六日伏以九區至廣萬物類居惟川嶽之宅靈繫真仙而總治載稽道祕實有舊章粲然玉簡之清文蜿若金鱗之瑞質茲爲鎮信輔以精誠伏冀沖鑒昭臨純祺錫羡保邦家之永固均動植以蒙休雄州開啓北朝皇帝盡七道埸齋文八月二十六日伏爲一作以北朝皇帝世結隣歡歳交聘問方睦敦隆之好遽聞訃告之音深極哀懷用伸資薦廣梵筵而斯啓陳法供以惟嚴冀仰助於仙遊庻永孚於冥祐班荆館賜北朝告哀人使御筵口宣八月二十六日卿載馳使介来訃國哀當節物之凛秋嘉道塗之良苦冝頒燕犒以示眷勤班荆館賜契丹告哀人使酒果口宣八月二十六日卿載馳國訃来及都城顧惟跋履之勞冝有頒宣之寵俾推珍錫式示眷懷故秦晉國夫人林氏祭文堂祭八月二十六日維靈歸全叶禮卜吉有期念將閟於幽扃俾載陳於祖奠歆茲芳潔尚體追懷故秦晉國夫人祭文墳祭八月二十六日惟靈壽考有終勞能可録安茲宅兆僃有物容載申奠訣之恩式盡追榮之美内中福寧殿罷散三長月祝聖壽道埸青詞八月三十日伏以清霜肅候資萬物以將成嘉月齋心延百祥而並集有嚴祕殿来格衆靈冀真鑒之妙沖答精衷之蠲潔保鴻圖而緜固均庻品以阜康契丹告哀人使回至北京賜御筵口宣九月四日卿逺將國命来告訃音當使傳之言旋俾宴需之加錫用申眷勞式示寵恩契丹告哀人使回至雄州賜御筵兼傳宣撫問口宣九月四日卿逺馳國訃旋飭使軺載嘉復命之勤爰錫示慈之宴式彰寵數冝體至懷賜鎮海軍節度使檢校太尉同中書門下平章事判亳州陳執中生日禮物口宣九月四日卿榮擁節旄出臨藩翰屬茲誕日冝有寵頒當體眷懷克膺茂數太平興國寺開先殿開啓太祖皇帝忌辰道埸齋文九月八日伏以紹百王而開綂昭著於祖功植衆善之妙因爰憑於覺力循有邦之舊典稽諱日以先期載肅齋埸並延淨侣瞻玉毫之具相誦貝葉一作牒之靈文仰依慈慧之仁遐薦清真之馭庻資冥祐式廣孝思太平興國寺開先殿開啓太祖皇帝忌辰道埸功徳䟽右語九月八日伏以受命造邦耀無窮之丕烈以時薦福資妙用於能仁爰及諱辰式遵彞憲即神居之寳殿廷法侣於祗園仰冀覺慈廣敷勝利威靈如在冥助於真遊運祚克昌永隆於卜世賜西南蕃蠻人張漢頂等敕書九月十二日勑張漢頂省所附進馬并朱砂等事具悉汝世安邊徼逺效𣢾誠渉道里以甚勤脩貢輸而自逹載嘉忠順冝有寵頒今回賜汝紅中錦旋襴一領八兩渾鍍銀腰帶一條衣著二十疋至可領也故茲示諭想冝知悉秋冷汝比好否遣書指不多及増修青帝朝日風師先𧖟等壇祭告逐壇并當處土地祝文九月十二日壇壝之嚴神明所格以時修舊式叶彞儀㳙此吉辰用伸昭告皇帝回契丹皇帝告哀書九月日伯大宋皇帝致書于姪大契丹皇帝闕下特枉使軺遽馳國訃不意㓙變文成皇帝上僊載念久敦世好方睦隣歡聞問震驚撫懷感惻姪皇帝始茲纘紹深極哀摧冀節至情以遵典禮已差人使專持慰禮今右宣徽使忠順軍節度使左金吾衛上將軍耶律元亨回奉書陳謝不宣白皇帝回契丹皇太后告哀書九月日姪大宋皇帝謹致書于嬸大契丹仁慈聖善欽孝廣徳安靜正淳懿和寛厚崇覺儀天皇太后闕下不意㓙變文成皇帝上僊方敦隣睦遽及訃音載惟慈慕之懷必極哀傷之念冀從順變式副瞻言已差人使專持慰禮今右宣徽使忠順軍節度使左金吾衛上將軍耶律元亨回奉書陳謝不宣謹白贈昭信軍節度使遂國公宗顔祭文堂祭九月十三日夜維爾㓜而敏明長克有立胡謂為善而不永年奠斚在茲營魂其慰贈昭信軍節度使遂國公宗顔祭文櫕所九月十三日維爾禀質甚秀享齡不遐日月有期厝安惟吉陳茲奠酌實悼余懐賜右領軍衛将軍克沖獎諭勑書九月十五日朕覽先帝之遺文愴然増慕嘉汝志之顓學期乃有成惟睿制之坦明合聖經之一作而雅奥傳冩之善茲謂藝能誦習不忘是為寳訓冝加襃勗以勉進脩呉王院上梁祭告土地祝文九月十五日本支之盛棟宇有嚴吉日旣㳙脩梁始構冀神之祐永壯厥居南京鴻慶宫開啓皇帝本命道埸青詞九月二十三日伏以帝運開先建别都而雄壯神遊欽奉肅真館以邃嚴適臨元命之辰恭按仙科之式薦茲嘉潔仰彼穹靈敢祈善應之祥永固無疆之壽賜鎮海軍節度使檢校太尉同中書門下平章事判亳州陳執中詔十月二日卿近辭宰柄出守蕃宣方受署以云𥘉効右牽而米獻式彰誠藎深用歎嘉賜知建昌軍張貴和勑書十月二日敦本勸農惟汝之職因時任土脩貢有儀載省勤誠用増奨歎啓聖禪院修設故秦晉國肅恭賢正夫人林氏盡七大會齋一中齋文十月二日伏以覺慈廣𬒳兼濟於含生冥福所資必憑於慧力惟懿柔之秉徳享壽考而有終隆睿眷以不忘集勝縁而增僃願乗妙果一作道超薦真乗賜吏部尚書同中書門下平章事文彦博生日禮物口宣十月二日卿以名世之材當秉鈞之任乃顧具瞻之重適臨載誕之辰爰示頒宣用彰眷遇西太一宫開啓皇帝本命道埸青詞至和三年二月十五日伏以真遊所集靈宇載嚴聿臨元命之辰恭按仙科之式冀紫清之垂鑒感蠲潔以濳通百福來臻克彰於善應萬齡増固永保於無疆撫問麟府代州路臣寮口宣二月五日卿汝等各藴材猷出膺寄任綽著綏寧之績克彰勤藎之勞冝示撫存用推眷遇皇帝回契丹太皇太后回謝書三月日姪大宋皇帝謹致書于嬸大契丹仁慈聖善欽孝廣徳安靜正淳懿和寛厚崇覺儀天太皇太后闕下嚮以訃音来告方深感愴之懷賵禮是將用繼講修之好豈期懿念復枉使車且承春候之和克固壽康之福其於感慰罔罄敷陳今順義軍節度使左監門衛上將軍蕭佶等回專奉書陳謝不宣謹白皇帝回契丹皇帝囬謝書三月日伯大宋皇帝致書于姪大契丹皇帝闕下頃承哀訃甞遣使軺惟久睦於仁隣俾往伸於􅉠禭復蒙惠問仍示腆儀方此春和克支福履其為慰浣奚旣名言今順義軍節度使左監門衛上將軍蕭佶等回專奉書陳謝不宣白建隆觀翊敎院開啓皇帝本命道埸青詞閏三月四日伏以道妙無方黙運清真之氣日躔有次式臨元本之辰恭按仙儀俾陳淨醮伏願蒼靈昭鑒福嘏駢臻萬壽無疆永隆於鴻筭羣生咸遂均𬒳於餘休賜侍衛親軍歩軍副都指揮使涇州觀察使王凱赴闕茶藥口宣二十五日卿逺戒戎車夙祗召節式及炎薰之候載惟道路之勤冝頒飲劑之良用示眷懷之厚賜龍圖閣直學士給事中施昌言巳下為修河了畢御筵口宣四月四日卿等分庀工徒繕修隄楗遽茲訖事嘉乃有成冝推宴犒之恩用獎勞能之効賜鎮東軍節度觀察留後知潁州李端愿赴闕茶藥詔八日卿出布詔條入祗召節屬此炎歊之候深惟道路之勤冝頒藥劑之良用示眷懷之厚賜契丹賀乾元節國信使副生餼口宣八日卿等式將聘幣來講隣歡載嘉道路之勤冝厚餼牽之品往膺寵錫用示眷懷賜文武百官文彦博巳下於大相國寺罷散乾元節道埸香合口宣八日卿等式因誕節祗率寀寮修梵供以惟精罄臣誠而申祝載嘉忠愛冝示頒宣賜文武百官文彦博已下於錫慶院罷散乾元節道埸酒果兼敎坊樂口宣八日卿等叶徳同寅愛君盡禮因誕彌之紀節申祝頌之常儀冝示宴私用彰優寵大慶殿行恭謝之禮御札五月二日勑内外文武臣寮等執珪璧以事神嚴祖宗而配帝雖有國之常典亦困時而制冝朕承三聖之丕基撫萬邦之有衆儉于已思天下之民豐勞于心致天下之民佚罔敢怠忽庻幾治一作洽平而首春以來偶爽調適頼三靈敷祐百福來臻順以節宣獲茲康𥙿加以邊偶不聳風雨以時雖庻物之咸和顧眇躬之一作而増惕是用稽先朝之成憲詢故實於有司即廣殿之翼嚴擇靈辰之良吉式伸昭謝以格純休冝示先期俾茲誕告朕取今年九月内於大慶殿行恭謝之禮其今年冬至親祀南郊即冝權罷所有合行諸般恩賞並特就恭謝禮畢一依南郊例施行至日朕親御宣徳門宣制仍令所司詳定儀注以聞務遵典禮勿俾煩勞咨爾多方咸體予意故茲札示想冝知悉東太一宫開啓保夏祝聖壽金籙道埸宻詞四月二十七日伏以風薫紀候阜庻物以蕃滋道妙無言集百祥而善應即琳宫之福地考金籙之秘文薦此令芳通乎肹蠁冀延純錫保乃昌圖資壽考於無疆均蠢生而咸𬒳賜五臺山十寺僧正知今等勑書五月七日汝等並懷出俗之心而有愛君之志因王正之肇序遵佛事以修嚴期申祝延來効誠獻載嘉勤𣢾冝有恩頒賜天章閣待制知揚州許元詔五月七日汝以材敏班余詔條眷乃淮海之濵産茲草木之美以時采掇來效貢輸嘉爾勤誠良深歎獎天貺節謝内中露香表五月七日伏以薫風應候滋阜於羣生嘉節紀時恭承於景貺已嚴淨館䖍奉祕詞仍假薰脩附通精意蒼靈昭鑒純祉来臻撫問廣南西路臣寮口宣五月十七日卿汝等並以幹能出分寄任顧此藴隆之候載嘉宣布之勤冝示慰存用彰眷遇除授陳執中行尚書左僕射充觀文殿大學士依舊判亳州加食邑食實封餘如故仍放朝謝制六月十日門下爵禄之寵所以優老而崇賢退讓之風所以勵俗而敦化眷我元輔殿于近邦屢辭將相之榮僃述君臣之遇雖重違懇悃之請而豈無恩意之隆爰告外庭以旌嘉尚具官陳執中質性剛直姿識敏明出於名臣之家早有時材之用自更中外之任實勤夙夜之勞出撫師徒宣威種落之外入參機要竭忠帷幄之間至於兩踐台司首當國論杜門絶請善避權勢以逺嫌處事執心不為毁譽而更守顧方深於倚信乃祈解於鈞衡兼秉旄調鼎之榮資鎮俗偃蕃之重所以優逸耆哲養頥精神而數形奏封毎以疾告察其誠至良為惻然若夫中臺之崇端揆是為於師長秘殿之職詢訪實思於老成推此茂恩俾如爾志仍廣邑封之數即安屏翰之居於戯壹思慮以專心勤藥石以自輔人實求舊予惟不忘勉期壽康往服休命可特授行尚書左僕射充觀文殿大學士依舊判亳州加食邑七百戸食實封三百戸功臣散官勲封如故仍放朝謝主者施行宣召曽公亮口宣六月六日有勑卿自辭職禁林班條近輔休有政績播于民聲旣深柬於予衷俾召還其舊物矧爾材望著于搢紳豈惟潤色之文方佇論思之益撫問河北路臣寮諸軍將校口宣七月三日卿等任膺委寄職在綏寧當茲災沴之餘僃著勞能之效俾伸撫慰冝體眷懷撫問樞宻直學士施昌言為患口宣七月十日卿方委政條遽聞疾告致爽調和之理豈非夙夜之勞勉輔天真冀遵藥喜俾伸撫慰式示眷懷撫問澶州滑州衛州通利軍梅摯等及存恤逐州軍為水災及防護堤岸口宣七月七日卿汝等列蕃宣之重寄罹澍潦之時災顧乃兵民載深隱惻尚頼班條之善克伸捍患之勞往道予懷俾伸慰撫萬壽觀延祥殿開啓中元節資薦真宗皇帝道埸青詞七月七日伏以道生萬物運元氣於無形節正三元紀清商之令序洪惟先聖邈矣真遊貽睿業以嗣承増孝思之時感式陳淨醮仰薦精衷伏願靈馭在天愈資於冥祐寳圖綿世永庇於羣生内制集卷第三除陳執中制名臣一竹大臣撫問河北路臣寮諸軍將校口宣一作撫問脩河臣寮口宣外制集卷第三歐陽文忠公集八十一制五十首左班殿直李徳隆母王氏可追封永安縣君制勑夫觀其子之孝可以知其父母之賢具官李徳隆亡母永安縣君王氏生此孝子一作是生此子能守其家請以身官移於泉壤夫禄養於親有時而止榮名之及存不朽焉䰟兮享之可以爲慰可比部貟外郎知綿州薛貽應轉駕部貟外郎虞部貟外郎知博州薛綸轉司門貟外郎祕書丞知嘉州洪雅縣李述轉太常博士制並磨勘改官勑具官薛貽應等吏之庸庸而無聞者吾所不取章章而特見者必擢一有而字用之若夫奉法循職守其官而無過者不亦吏之良哉念其勤勞豈可不録三年考績敘進有常徃服新恩無渝爾守可司門貟外郎李公謹祕書丞充集賢校理楊儀殿中丞叚髙磨勘改官制勑具官李公謹等夫令在必信法在必行今審官考課增以舉類之科乃吾示信之令而新行之法也汝等敘進於比猶用常文其後當遷皆須應格勉勤其業以俟爾知可范仲温可台州黄巖縣尉制勑具官范仲温爾弟仲淹參吾大政方欲輔眹平賞罰推至公以脩紀綱而正庶位爾今所任有土與民惟過與功則有賞罰爾勤厥職可不戒哉可東頭供奉官閤門祗候石宗尹可内殿崇班制勑具官石宗尹陳力效官積有歳月㑹其課最來上有司按於舊文當得敘進升之朝列可謂寵榮徃服新章益勤後效可著作佐郎盧革潘泳一作詠等磨勘改官制勑具官盧革等州縣之職治有常法而逺方之俗風土異冝若夫上克奉於教條下不違於民欲惟勤與敏乃克濟焉爾等服職有勞㑹課來上膺兹敘進無廢官箴可史館書直官潘宗益可梓州司户參軍制勑具官潘宗益給事有年其勞可録冝命以秩俾旌厥勤兄爲有司惟久則習尚安乃職以慎克終可角厮波男合羅角可本族軍主制勑合羅角生禀勁勇之姿而濟以忠果之性屢陳厥効咸可旌襃俾升官榮以勸諸部勉圖功業無自失時可軍事推官龔待問可桂州觀察推官制勑具官龔待問捕盗之格有功者賞而吏能應書者少非吾有所愛焉苟有其勞豈不甄録今有司言爾於格當遷方兹多盗之時用勸不能之者一作吏可進士劉純可試將作監主簿制勑劉純自兵興累年而功效未立然游談之士以兵爲說而得禄者多矣吾猶意乎厥路尚狹而未足以來特起之人故甄收未始少懈况爾屢經器使而言者謂材冝有推恩以勸來者可祕書丞竇隨可本官致仕制勑具官竇隨夫老而致其政於君者士之懿節也爾壯而登仕困於數竒今其老焉可以歸矣安而一作於眉壽膺此羙名可邢州觀察支使張徳熈可著作佐郎制勑具官張徳熈士之在下位而能以聞于上者不有言者乎一失其言則有常罰焉知人而薦豈爲易㢤今爾由舉者而𬒳升擢尚勤其業無累爾知可大理寺丞薛仲孺可太子右賛善大夫制勑具官薛仲孺爾之伯父奎爲吾大臣參議國政剛直之節見於臨事殁而無嗣吾甚哀之爾㓜以奎䕃而登仕籍今由累歳遂升于朝惟爾伯父之行有司考法易一作謚以一徳不懈執心决斷之名可謂羙矣守爾家法克勤厥官可殿中丞王正民大理寺丞朱景陽陳侁等磨勘改官制勑具官王正民等審官之法三歳一遷惟無過焉乃得㑹課爾等服於官政以涖吾民奉法守職積勞歳月膺兹敘進此乃常科勉爾之爲以期懋賞可内殿崇班李允恭可内殿承制制勑具官李允恭朕患州縣之吏不職者不能禦姦禁暴而憫吾民罹於賊盗一作盗賊故於捕盗之吏推賞尤厚非以爲私蓋有爲也今爾之請一作課自陳其勞方吾以賞行勸之時惟恐不及故加爾寵非徇爾私夫古有讓功不言之賢惟爾冝慕可節度推官張紳可大理寺丞制勑具官張紳朕閔夫兵興而費廣不忍加歛於吾民凡能佐國足用者皆思懋賞以勸其勤今薦爾者皆曰爾材而吾近臣尤所取信故增汝秩不易厥官夫官惟業勤常患不乆爾其自勉無替乃勞可學士院孔目官遂州司户參軍李懷徳可特授州陽信縣尉充學士院録事制勑具官李懷徳夫有司之事一作掌惟乆則習次遷之例顧一作惟汝冝升無忘克勤慢則有罰可虞部貟外郎李備太子中舍侯克明大理寺丞曹一作唐琰等磨勘改官制勑具官李備等國家外建庻位以官羣士而賞罰進退之法掌一作行於有司者所以待中材之無過者爾髙能異效吾有不次之用焉爾等咸服于官久勤歳月以勞序進雖曰寵榮勉爾所爲以期懋賞可彰武軍節度推官李仲昌可大理寺丞簽署渭州判官公事制勑具官李仲昌羣材之在下者思逹其上難矣而在上者思得可用之材豈爲易㢤朕頃自擇能臣使舉其類而洙以爾充薦今琦又以爲言琦洙皆能體吾勞於擇士之心者舉爾不應不慎霈然推寵吾所不疑爾尚勉㢤以稱兹舉可故尚父汾陽王郭子儀孫元亨可永興軍助教制勑郭元亨繼絶世襃有功非惟推恩以及逺所以勸天下之爲臣者焉況爾先王名載舊史勲徳之厚冝其流澤於無窮而其後裔不可以廢往服新命以榮厥家可奉禮郎李景圭可大理評事制勑具官李景圭九州四海風俗不同而王者之化無不及吾於逺者尤加意焉夫吏非敏於其事則不能通俗習而順其冝政一失焉下則重困邈兹南海爾涖吾民今㑹課上聞增爾榮秩克勤厥職以副予懷可故右驍衛大將軍致仕王元祐男知信可内殿崇班制勑具官王知信爾父元祐陳力事予告老以休位終環尹殁而餘慶尚及爾身爾嗣厥家茍能有立則始終寵榮一作榮寵視汝父焉惟孝與忠勉思兩得可前楚州團練判官丁宗臣可著作佐郎制勑具官丁宗臣庻官之在位者衆矣吾思一善之取而無失則惟舉類之法所得尤一作冝多今薦者交章言爾可取爾其自勉以稱吾思善之心焉可左侍禁李從式孫清並可太子左清道率府副率致仕制勑具官孫清等壯而陳力老也告休古人所難有始有卒爾能至此可謂克終尚有推恩以嘉爾節歸安眉壽服此新榮可權無爲軍判官劉皆洪州録事參軍張徳元並可太子中舎致仕制勑具官劉皆等禮與法之爲書其於老者皆有優焉今爾等學於禮法而能安其老思以歸休吾所嘉襃冝推寵命可國子監直講青州千乗縣主簿孫復可大理評事制勑具官孫復昔聖人之作春秋也患乎空文之不足爲故一作信著之於行事以爲萬世之法然學而執其經者豈可徒誦其言㢤惟爾復行足以爲人師學足以明人性不徒誦其說而必欲施於事吾將見吾國子蔚然而有成冝有嘉襃以爲學者之寵可太子中舎孫礪李國慶並可殿中丞制勑具官孫礪等六經皆載治民之術而法者爲吏一無此字之資也汝等學之用以從政經之道廣矣擇其冝於民者法之文宻矣取其平而不害者足以涖爾官而成厥績焉膺兹敘遷勉用爾學可祕書丞黄正殿中丞盧咸並可太常博士制勑具官黄正等自兵興一作興兵以來調度日廣其能勤征㩁以佐經費而均漕運使不滯以通諸用者皆方今之急務其爲勞力冝有勸焉因兹歳成寵爾榮秩可原州彭陽縣令郝嗣宗可某州推官制勑具官郝嗣宗吏三歳而一易其法久矣然議者莫不以屢易爲患苟有能者吾豈奪焉爾一作汝於彭陽數有稱者就增其秩無易其居勉爾所爲以俟成績可供備庫副使張禮一可西京左藏庫副使制勑具官張禮一考課之法計過與功皆有常文得以敘進此所以待夫中材而勉其不及者也茍能有立吾必異之爾其往哉思所自效可杜諮轉官制勑具官杜諮吏部之格吏之升降逺邇勞逸之均皆有法焉不可以亂今衍以爾爲請一作今以爾為大臣所薦吾旣重違大臣之言而顧有司之法茍不甚戾則吾豈不從無專爾私其率厥職可柴宗慶第三女可封郡君制勑某人相與將人臣之極也爾父常兼享其位而連戚里其於存殁冝有寵焉況其生也貴而殁也無嗣續之裔此吾尤所憫焉加一作䟽爾郡封此非常典所以申吾不忘爾父之意可洛苑使英州團練使内侍省内侍右班副都知藍元用可眉州防禦使罷副都知制勑具官藍元用爾之事予陳力兹久旣明而敏能濟以勤慎宻一心不見過失屢更器任實柬予懷屢披奏章陳疾自請願解要職以思便安惟爾之舊予所嘉惟爾有勞予所録雖可爾請豈無加一作嘉襃服兹寵榮勉爾一作惟後效可西頭供奉官閤門祗候綦恩可内殿承制制勑具官綦恩用兵久矣而將吏能以材武稱於軍中者豈不多哉苟有聞焉無不用也况如世衡吾所信者今其稱爾吾豈不然夫信以出令仁以撫人一作之勇以臨戰而嚴以一衆必皆出於智而後成功雖大將不過此也爾其勉之一作哉可逹州司户參軍呉沖可奉寜軍節度推官制勑具官呉沖嚮者盜起州縣久而未捕議者皆曰素備不謹賞罰不明听以盜滋而吏怠今考爾所獲嘉爾之能第賞推恩予無所愛一作愛矣凡謹備者爾則勉之當使怠吏由爾而勸可内殿崇班程逸可左監門衛將軍致仕制勑具官程逸將軍之職居則宿衛天子岀則征伐四方此武人之重也今假爾兹寵以爲歸老之榮者以爾服勞旣久能克厥終而不忘爾勤之意也其往欽㢤可懷州防禦判官倪俊可著作佐郎制勑具官倪俊凡官人之法莫不期於得材而或失之於有遺或失之於太濫故有司之守厥有常文苟能應書皆可選擢一作擇可使中材之並進不濫而無遺此吾所以慎於擇材之意也爾膺一作之兹舉其不勉哉可大理寺丞宋緬孫周蘇逢等磨勘改官制勑具官宋緬等庻官之守位者衆予欲一有其字百職並舉而人各趨之則於考功敘進之科厥有常法使夫自勉者無不得焉蓋所以示勸而及衆也今考爾歳績法當遷秩爾無以爲例得其體一作思予勸功進善之心以勉爾職其無懈可盧守勤致仕制勑具官盧守勤少也陳其力病而養其衰非惟安生樂壽人之所欲而朝廷待勞能之臣厚始終之意考之典禮亦有彞章爾之事予旣勤且乆今其病矣可以息焉尚有恩榮以爲爾寵夫勞無不報旣享爵禄之豐身孰與親冝專輔養之理可曹元賔轉官制勑具官曹元賔夫用兵之法不可先言則爲將之材亦難先見國家用兵久矣求之行陣堪將者少夫士有素藴之材未得逹者比降明詔廣其詢求而方平等以汝爲言吾將觀汝之能試汝以事俾升朝序徃自勉焉可司理參軍杜彭壽可大理寺丞制勑具官杜彭壽士有潔身以㢘而服官以勤者長吏皆得薦論有司加之考閱用而進秩俾以臨民雖曰常科豈不慎選汝膺兹命其徃勉哉可户曹參軍尹植可某官致仕制勑具官尹植惟爾陳力二十餘年以老而歸朕豈不憫升之朝序榮以宫僚徃其休哉安爾眉壽可開封府開封縣主簿孫量可保大軍節度掌書記制勑具官孫量用兵之法不欲久惟能使調歛發輸不勞而民有餘力則可以制敵二字一作乆而有待於必勝西師之出乆矣不惟將帥之選爲重其州縣臨民之吏能不乏民之力而佐吾之軍者亦難其人今爾旣薦者皆曰材而臨涇乃爾自請徃膺新命將試汝能可内殿崇班韓守允可左監門衛將軍致仕制勑具官韓守允自兵興于邊天下多事吏強有力者猶不能稱厥職而況於老者乎夫老者吾所優也豈冝强其力之所不逮徃從爾請以安爾私尚有茂恩以爲爾寵可泰州興化縣主簿朱思道可衛尉寺丞制勑具官朱思道夫廉爲吏之一節也今保薦之法惟以受財爲同坐則待夫能吏豈盡其材爾其奮厥所長思有所立不獨守夫一節而已焉可溪洞楊先贇可權知古城州制勑楊先贇世號材勇雄于一州威能服其部人忠能奉其職貢冝加寵秩以紹厥家徃服恩章一作榮無忘報效可京西轉運垵察使虞部貟外郎杜𣏌可刑部貟外郎直集賢院充廣西轉運使制勑具官杜𣏌自一隅用兵而調發輸役之繁無逺不及況廣東西之路於東南尤爲逺者而吏多不良吾之疲民旣有賦歛之勞而今又罹盗賊之患吾一慮及爲之惻然凡與吾憂國者豈遑暇於安居哉汝爲吾往其一作安可憚勞吾又嘉汝名臣之後好學博文一作聞尚有榮名以爲汝寵凡吾寄汝之事繄汝之材吾惟責成一作惟責厥成爾可自勉可内殿承制孟均可千牛衛將軍制勑具官孟均諸衛之置將軍唐之盛時兵官之重者也衛兵之制廢久矣其官雖存而世不知其重也自頃西北用師講求武事而議者多言唐之府兵可復朕方思之而爾能有請朕甚嘉焉爾其徃哉吾將有用可殿中丞史吉亨王珣瑜著作佐郎蘇黄中等磨勘改官制勑具官史吉亨等夫官者所以盡人之材也至乎材之難得則姑以歲月常法積勞而敘遷誠亦冀有異材之善出於其間非止於此而巳也爾等各膺例進冝自勉旃可蘄州廣濟縣令充國子監直講邵必可大理寺丞制勑具官邵必夫學所以爲治也而儒者以記誦爲專多或不通於世務但能傳古之說而不足施之於事使愚者益固一作昧而不明而材者聽之而怠一作殆以爲儒迂不足學故教人之法必該於古今以博其識而成其業焉惟爾之學能明當世之事而屢形議論朕甚嘉焉爾其守節礪行以率諸生而取古之有以冝于今者而養成之則功利廣矣可不勉哉可外制拾遺孫復可祕書省校書郎國子監直講制朕勤治體喜賢俊甞慮四方遺逸之善有不吾聞者間屬近列屢騰薦章以爾孫復深經術荏徳行躬耕田畒以給歳時東州士人皆師尊一作隷之吾命汝校文於書省講藝於胄序不由郷舉不俟科選汝姑直屏雜說純道粹經使搢紳子弟聞仁義忠孝之樂此吾所以待汝意往欽㢤可周陵荆湖轉運使制勑具官周陵朕思欲寛民賦役而衣食給足天下之飢寒而患州縣之吏不能稱職其老疾闇懦而縱其下與夫貪暴而自爲殘者皆所以蠧於物而重困吾民者也然按察之司視而不舉反一作乃務較錙銖毫末之遺利而欲足用舒民豈不失其術而且勞者哉今荆湖之南十一州一監三十有一縣吏貟不爲不多矣爾其察其不良者而舉其賢者使州縣得良吏未有民冨而用不足者廣西之最知汝爲材今其徃哉無替朕命可皇弟安靜軍節度使允廸可責授右監門衛大將軍制勑皇弟具官允廸五刑之屬三千其罪莫大於不孝小民無知犯者猶鮮況爾燕恭肅王之子而朕之諸弟也冝率訓義以廸四方而乃忘苴麻哭泣之哀爲酣飲沈酗之佚肆情鄙行害于而家逹於朕聽嗟惋無已朕苟貸法何以處王公之上而教天下哉冝歸爵秩下領屯衛蓋寛於馭過而欲循省其非無蹈後悔也可楊畋屯田貟外郎直史館制勑尚書省二十四司散郎皆當今要官況分直史館提太史筆蓋位之髙者非材資甚羙安可以兼此授以爾東染院使湖南鈐轄楊畋出自將家有文武器幹早由辭科歷任郡縣至提按之職嚮以羣蠻繹騷湖嶺未靖故特命以使名往專討輯逮兹二歳谿洞帖然而勤勞積時重㾽生疾瀝懇來上願還朝行予旣嘉爾作事不怠以集疹于厥躬又重煩爾以軍旅之役冝改田曹之號且以表年爲業苟能有以益於國家則執干戈書簡牘其義一也可司勲郎中張從革可衛尉少卿制勑洛宅朕之西都而居之未皇暇也然有司百職莫不具焉其留務之多閑在憲司之尤簡最爲清峻可以優賢具官某久服官勞頗彰吏最老于郎署分領西臺用乎考績之文俾列命卿之貴仕而至此是亦爲榮可殿中丞府司録李虞卿可國子博士制勑具官某司録爲府曹首民閥閱増減吏詞桉曲直皆繫焉前涖此者或苛悍或懦軟率不免缺折之患惟爾慎不踰節㢘不撓人吾用嘉之俾增秩于庠列爾其惟祗惟畏以茂對我朝家休命可大名府推官徐治可著作佐郎制勑某朝廷置磨勘之法必以考限用人者使詳試吏能而後進也則仕者由銓調改京秩乃榮階之始固非輕授以爾進士登第歴佐大幕所知論薦是用進擢爾惟自勉以副恩命可平陽縣尉林術可試祕校知永州祁陽縣事制勑具官某南方之吏不能爲吾以恩信撫兹谿蠻而使毒吾民於攻劫爾甞𬒳甲操矢而逐之則蠻之害民也深民之瘡痍者衆所冝自見焉今録汝之勞命汝以縣勉勤其政以撫吾人可大理寺丞彭通程濬可殿中丞某人可賛善制勑具官某等仲尼有云言寡尤行寡悔禄在其中矣今有司大比羣吏之治不待悉最課而後遷也但不處于尤悔斯遷矣某等或賛治逺藩或長人大邑奉法循職克無累疵銓一作鉤考歳成用應陟典盾省儲坊俾通朝守盍勤官業以對恩榮可奏舉人杭州觀察推官吕遘可大理寺丞制勑具官某夫士之處世如錐在囊中其鋒立見爾以選吏爲藩府賔佐凡薦爾材者自戩等十有二人是必脫頴而出其輩者矣不然何言者之多也擢爾卿屬試爾治民無謂寵利之可圖因違道以干譽其思行義以自立務求已而爲人服此訓辭則無疵吝可軍事推官王野民可大理寺丞制勑具官王野民自兵興用乏而能不取民以佐有司之急者利入之法尤多非勤且敏者則莫能焉不惟干賞者趨之蓋亦適時之用也爾職酒利厥課屢聞所冝襃陞以勸怠者可録事參軍張一作王師民可大理寺丞制勑具官某方今官人之法由舉善而遷者必試之以臨民而觀其從政自兵興以來吾民可謂勞矣惟吏之良者能爲吾休息之今爾𬒳舉曰材亟遷其秩將觀汝政其不勉哉可閻文寳供備副使監亳州茶鹽稅制勑具官某國家因山澤之饒興筦搉之利以足邦用實湏幹臣爾其絶侵牟謹出入使歳課增羡而績効著明敘進之榮兹廼常典疇勞之賞尚有優恩可滕公輔衛州推官制勑具官滕公輔堂洎昷之皆朕侍從之臣而外當寄任之重交章來上薦爾爲材必有可觀以稱公舉冝從其請以察爾能徃其勉㢤無廢爾職可藍田縣主簿權充府學教授可華州蒲城主簿就差管勾永興府學制勑具官某古之斆學之法肄習以時而難易先後教之有方非乆而安之則不能以成其業今學者言爾講說訓導可以爲師吾欲觀汝之道至于有成故假爾大邑之佐使禄足以充然後安然克終其業可不勉㢤可外制集卷第三外制序云所作纔一百五十餘篇今衢本分三卷通科舉條法議僅百五十篇而京閩吉綿諸本乃多十五篇以仁宗實録考之慶曆二年十一月孫復除校書直講公尚倅滑四年正月周陵移湖南轉運公所草制已載第一卷除授同而詞異五年二月允迪責環衛皇祐元年三月楊畋換官直史館皆在公去朝之後張從革李虞卿徐冶林術程濬王野民張師民閻文寳滕公輔及永興府學教授十人難盡稽考吕遘轉寺丞制見張方平集公旣自云一百五十餘篇則其間或出公手亦未可知縁諸本散在四方傳信已久恐後人疑爲脫逸復收之故命曰垥遺必有能辨之者周陵兩制當出公手蓋是時中書省在禁中毎有除授隨即命詞給告陵初移湖南不曾轉官其制行而未下㝷再降旨轉官故别草詞今第一卷所載是也潘宗益制潘一作汪進士劉純制故甄収故字下脫扵字劉皆等制寵命一作恩命郝嗣宗制苟有一作苟得柴宗慶第三女制連戚里連字下一有榮字倪俊制皆可選擢可一作得盧守勤制勤一作懃曹元賔制試汝以事此上一有而字孫量制開封縣一作封丘縣楊元贇制報効一作夙夜杜杞制爾可一作汝可史吉亨䒭制蘇黄中一作蘇莘邵必制爲治也此上一有學字吕遘制脫穎一作穎脫外集卷第三歐陽文忠公集五十三古詩三南獠洪宋區夏廣恢張際四維狂孽乆不聳民物含一作涵春熈耆稚適所尚游泳光華時遽然攝提歲南獠掠邊陲予因叩村叟此事曷如斯𥘉似却人問未語先涕垂収涕謝客問爲客陳始基撫水有上源水淺山嶮巇生民三千室聚此天一涯狠勇復輕脫性若鹿與麋男夫不耕鑿刀兵動相隨冝融兩境上殺人取其貲因斯乆乆來此冦易爲覊䑕竊及蟻聚近裏焉敢窺勢亦不乆住官軍來即馳景徳祥符後時移事亦移四輔哲且善天子仁又慈將軍稱招安兵非羽林兒龍江一牧拙邏騎材亦非威惠不兼深徒以官力欺智略仍復短從此難覊縻引兵缷甲嶺部陣自參差鋒鏑殊未接士卒心先離奔走六吏死𥘉在懷逺軍缷甲嶺殺傷范禮賔王崇班等六人落陣死明知國挫威自兹賊聲震直冦融州湄縣宇及民廬燬蕩無孑遺利鏃淬諸毒中膚無藥醫長刀斷人股橫屍滿通逵婦人及孳産驅負足始歸堂堂過城戍何人敢正窺外計削奏䟽一一聞宸闈赫爾天斯怒選將興王師精甲二萬餘猛毅如虎貔劒㦸凛秋霜旌棨閃朝曦八營與七萃豈得多于兹外統三路進小敵胡能爲前驅已壓境後軍猶未知逶迤至蠻域但見空稻畦捜羅一月餘不戰師自罷荷戈莫言苦負糧深可悲哀㢤都督郵無辜遭屠糜昭州都曹皇甫僅三人部糧入洞遭蠻賊掩殺及害夫力千餘嘵咋計不出還出招安辭半降半來拒蠻意猶狐疑厚以繒錦贈狙心詐爲卑戎帳草草起賊戈躡背揮我聆老叟言不覺顰雙眉吮毫兼疊簡占作南獠詩願值采詩官一敷于彤墀寄聖俞西陵山水天下佳我昔謪官君所嗟官閑憔悴一病叟縣古瀟灑如山家雪消深林自斸一作斲筍人響空山隨摘茶有時携酒探幽絶往往上下窮煙霞嵓蓀緑縟軟可藉野卉青紅春自華風餘落蘂飛靣旋日暖山鳥鳴交加貪追時俗翫歲月不覺萬里留天涯今來寂寞西岡口秋盡不見東籬花市亭揷旗鬪新酒十千得斗不可賖材非世用自當去一舸聱牙揮釣車君能先往勿自滯行矣春洲生荻芽答梅聖俞寺丞見寄憶昔識君𥘉我少君方壯風期一相許意氣曽誰譲交遊盛京洛罇爼陪丞相騄驥日相追鸞凰志髙颺詞章盡崔蔡論議皆歆向文㑹忝予盟詩壇推子將談精鋒愈出飲劇歡無量賈勇爲無前餘光誰敢望兹年五六歲人事堪悽愴南北頓暌乖相離獨飄蕩失杯由畫足傷手因代匠移書雖激切拙語非欺誑安知乃心愚而使所言妄權豪不自避斧質誠爲當蒼皇得一邑奔走踰千嶂楚峽聽猿鳴荆江畏蛟浪蠻方異時俗景物殊氣象緑髪變風霜丹顔侵疾痒常憂鵩鳥窺幸免江魚葬今兹荷寛宥遷徙來漢上憔悴戴囚冠驅馳嗟俗狀王事多倥偬學業差遺忘未能解綬去所戀寸禄養舉足畏逢仇低頭惟避謗忻聞故人近豈憚驅車訪一别各衰翁相見問無恙交情宛如舊歡意獨能強幸陪主人賢更值芳洲漲菱荷亂浮泛水竹涵虚曠清風滿談席明月臨歌舫已見洛陽人重聞畫樓唱怡然壹鬱冩蹔爾累囚放自從還邑來㑹此驕陽亢神靈多請禱租訟煩笞榜猶湏新秋涼漢水臨一作㵼清漾野稼蕩浮雲晴山開疊障聊以助吟詠亦可資酣暢北轅如未駕幸子能來貺酬聖俞朔風見寄因君朔風句令我苦寒吟離别時未幾崢嶸歲再隂驚飈擊曠野餘響入空林客路行役逺馬蹄冰雪深瞻言洛中舊期我髙陽吟故館哭知已新年傷客心相逢豈能飲惟有涕沾襟送琴僧知白吾聞夷中琴巳乆常恐老死無其傳夷中未識不得見豈謂今逢知白彈遺音髣髴尚可愛何況之子傳其全孤禽曉警秋野露空澗夜落春嵓泉二年遷謪寓三峡江流無底山侵天登臨探賞乆不厭毎欲圖畫存於前豈知山髙水深意乆以寫此朱絲絃酒酣耳熱神氣王聽之爲子心肅然嵩陽山髙雪三尺有客擁鼻吟苦寒負琴北走乞其贈持我此句爲之先聽平戎操西戎負固稽天誅勇夫戰死智士謨上人知白何爲者年少力壯逃浮屠自言平戎有古操抱琴欲進爲我娱我材不足置廊廟力弱又不堪戈殳遭時有事獨無用偷安飽食與汝俱爾知平戎競何事自古無不由吾儒周宣六月伐獫狁漢武五道征匈奴方叔召虎乃真將衛青去病誠區區建功立業當盛日後世稱詠於詩書平生又欲慕賈誼長纓直請繫單于當衢理檢四靣啓有䇿不獻空踟蹰慙君爲我奏此曲聽之空使壯士吁推琴置一作耽酒恍若失誰謂子琴能起予書冝城修木渠記後奉呈朱寺丞因民之利無難爲使民以說民忘疲樂哉朱君鄣靈堤導鄢及蠻興衆陂古渠廢乆人莫知朱君三月而復之沃土如膏瘠土肥百里歲歲無凶菑一作災鄢蠻之水流不止襄人思君無時已谷正至始得先所寄書及詩不勝喜慰因書數韻奉酬聖俞寒日照深巷柴門朝尚閉有客自江來尺書千里至啓書復何云但言南北異南方地常暖風物稱佳麗梅蘤入新年蘭臯動芳氣樂哉登臨興豈厭江湖滯伊予方寂寞刻苦窮文字萬國㑹王州群英馳儁軌方朔常苦餓子雲非官意歲暮慘風塵官閑倦朝市出處一云别所思寧可冀春江有歸鴈但使音書繼答梅聖俞寒日照窮巷荆扉晨未開驚聞逺方信有客渡江來開緘復何喜宛若見瓊瑰一爾乖出處未嘗持酒盃官閑隱朝市歲暮慘風埃音書日可待春鴈暖應回病中聞梅二南歸聞君解舟去秋水正沄沄野岸曠歸思都門辭世紛稍逐商㠶伴𥘉隨征鴈羣山多淮甸出栁盡汴河分楚色蕪尚一作上緑江煙日半一作畔曛客意浩已逺離懷寧復云宣城好風月歸信幾時聞送蟾上人遊天台昔年在伊洛林壑毎相從對掃竹下榻坐思湖上峯自言伊洛波毎起滄洲憶今兹道行遊千里東南國都門汴河上栁色入青煙流水向淮浦歸人隨越船東南遍林巘萬壑新流滿小桂緑應芳江春行已晚藹藹赤城隂依依識古岑一去誰復見石橋雲霧深送徐生秀州法曹一笑暫相從結交方恨晚猶兹簿領困況爾東南逺落㠶淮口暮採石江洲暖黄鴿可寄書惟嗟雙翅短讀山海經圖夏鼎象九州山經有遺載空濛大荒中杳靄群山㑹炎海積歊蒸隂幽異明晦奔趨各異種倐忽俄萬態群倫固殊禀至理寧一槩駭者自云驚生兮孰知怪未能識造化但爾披圖繪不有萬物殊豈知方輿大依韻和聖俞見寄與君結交深相濟同水火文章發春葩節行凜筠笴吾才已愧君子齒又先我君惡予所非我許子云可厥趣共乖時畏塗難轉輠道肥家所窮身老志彌果毎嗟游從異有甚樊籠鏁天匠染青紅花腰呈裊娜茍能柸酌同直待冠巾墮無欺挍讎貧鹽米尚餘顆晏太尉西園賀雪歌隂陽乖錯亂五行窮冬山谷暖不冰一陽且出在地上地下誰發萬物萌太隂當用不用事蓋由姦將不斬虧國刑遂令邪風伺間隙潛中瘟疫於疲氓神哉陛下至仁聖憂勤懇禱通精誠聖人與天同一體意未發口天已聽忽収寒威還水官正時肅物凛以清寒風得勢獵獵走瓦乾霰急落不停恍然天地半夜白群雞失曉不及鳴清晨拜表東上閤鬱鬱瑞氣盈宫庭退朝騎馬下銀闕馬滑不慣行瑶瓊晚趨賔館賀太尉坐覺滿路流歡聲便開西園掃徑歩正見玉樹花凋零小軒却坐對山石拂拂酒靣紅煙生主人與國共休戚不惟喜恱將豐登湏憐鐡甲冷徹骨四十餘萬屯邊兵送吴照鄰還江南霜前江水磨碧銅岸背菱葉翹青蟲吴郎鬢絲生幾縷不羞月上扶桑東羞見清波照人景去時黒髪吹春風五年歸來婦應喜從此不問西飛鴻答朱宷捕蝗詩捕蝗之術世所非欲究此語興於誰或云豐凶歲有數天孽未可人力支或言蝗多不易捕驅民入野踐其畦因之姦吏恣貪擾户到頭歛無一遺蝗災食苗民自苦吏虐民苗皆𬒳之吾嗟此語秖知一不究其本論其皮驅雖不盡勝養患昔人固已決不疑秉蟊投火況舊法古之去惡猶如斯旣多而捕誠未易其失安在常由遲詵詵最說子孫衆爲腹所孕多蜫蚳始生朝畒暮已頃化一爲百無根涯口含鋒刃疾風雨毒腸不滿疑常飢髙原下濕不知數進退整若隨金鼙嗟兹羽孽物共惡不知造化其誰尸大凡萬事悉如此禍當早絶防其微蠅頭出土不急捕羽翼巳就功難施只驚群飛自天下不究生子由山陂官書立法空太峻吏愚畏罰反自欺蓋藏十不敢申一上心雖惻何由知不如寛法擇良令告蝗不隱捕以時今苗因捕雖踐死明歲猶免爲蝝菑吾嘗捕蝗見其事較以利害曽深思官錢二十買一斗示一作亦以明信民爭馳歛微成衆在人力頃刻露積如京坻乃知孽蟲雖甚衆嫉惡苟銳無難爲往時姚崇用此議誠哉賢相得所冝因吟君贈廣其說爲我持之告採詩答蘇子美離京見寄衆竒子美貌堂堂千人英我獨疑其胷浩浩包滄溟滄溟産龍蜃百怪不可名是以子美辭吐出人輙驚其於詩最豪奔放何縱橫衆絃排律吕金石次第鳴間以險絶句非時震雷霆兩耳不及掩百痾爲之醒語言旣可駭筆墨尤其精少雖嘗力學老乃若天成濡毫弄點畫信手不自停端莊雜醜怪群星見欃槍爛然溢紙幅視乆無定形使我終老學得一已足矜而君兼衆美磊落猶自輕髙冠出人上誰敢揖其膺群臣列丹陛幾位缺公卿使之束帶立可以重朝廷況令參國議髙論吐崢嶸惜哉三十五白髪今已生近者去江淮作詩寄離情口誦不及冩一日傳都城退之序百物其鳴由不平天方苦君心欲使發其聲嗟我非鸑鷟徒思和嚶嚶因風幸數寄警我聾與盲立秋有感寄蘇子美庭樹忽改色秋風動其枝物情未必爾我意先已悽雖恐芳節謝猶忻早涼歸起歩雲月暗顧瞻星斗移四時有大信萬物誰與期故人在千里歲月令我悲所嗟事業晚豈惜顔色衰廟謀今謂何胡馬日以肥喜雪示徐生清穹一作空凛冬威旱野渇天澤經旬三尺雪萬物變顔色愁雲嘘不開慘慘連日夕寒風借天勢豪忽肆陵轢空枝凍鳥雀癡不避彈弋長河寂無聲厚地若龜坼隂階夜自照缺瓦晨復積貯㓗瑩􅖅壷量深埋玉尺凝隂反窮剥陽九兆𥘉畫春回百草心氣動黄泉脉堅冰雖未破土潤已潛釋常聞老農語一臘見三白是爲豐年候占驗勝蓍䇿天兵血西陲萬轍走供億嗟予媿疲俗奚術肥爾瘠惟幸歲之穰兹惠豈人力非徒給租調且可銷盗賊從今㓗鬴廪期共飽麰麥賦竹上甘露梢梢兩竹枝甘露葉間垂草木有靈液隂陽疑以時深山與窮谷往往嘗有之幸當君子軒得爲衆人知物生隨所託晦顯各有冝聊以助歌詠兼堪飲童兒和對雪憶梅花昔官西陵江峡間野花紅紫多斕斑惟有寒梅舊所識異郷毎見心一作必依然爲憐花自洛中看花上蜀鳥啼綿蠻當時作詩誰唱和粉蘂自折清香繁今來把酒對殘雪却憶江上髙樓山群花四時媚者衆何獨此樹令人攀窮冬萬木立枯死玉艷獨發陵清寒鮮妍皎如鏡裏靣綽約對若風中仙惜哉北地無此樹霰雪漫漫平沙川徐生隨我客比郡冰霜旅舎逢新年憶花對雪晨起坐清詩寳鐡裁琅玕長河風色暖將動即看緑栁含春煙寒齋寂寞何以慰卯盃且醉酣午眠歸鴈亭荒蹊臘雪春尚埋我𥘉獨與徐生來城髙樹古禽鳥野聲響格磔寒毰毸頽垣敗屋巍然在略可逺眺臨傾臺髙株唯有栁數十夾路對立𥘉誰栽漸誅榛莾辨草樹頗有桃李當墻隈欣然便擬趂時節斤鋤日夕勞耘培新年風色日漸好晴天仰見鴈已回枯根老脉凍不發遶之百匝空俳佪頑姿野態煩造化勾芒不肯先喣吹酒酣幾欲揈大鼓驚起龍蟄驅春雷偶然不到才數日顔色一變由誰催翠芽紅粒迸條出纎趺嫰蕚如剪裁卧槎燒枿亦強發老朽不避衆艷咍姹然山杏開最早其餘紅白各自媒𥘉開盛發與零落皆有意思牽人懷衆芳勿使一時發當令一落續一開畢春應湏酒萬斛與子共醉三千盃送韓子華嗟我乆不見韓子如讀古書思古人忽然相逢又數日笑語反不共一罇諌垣尸居職業廢朝事汲汲勞精神子華筆力天馬足駑駘千百誰可群嗟予老鈍不自笑尚欲疾走追其塵子華有時髙談駭我聽榮枯萬物移秋春所以不見令我思見之如飲玉醴醇叩門下馬忽來别髙㠶得風披飛雲離懷有酒不及冩别後慰我寓於文送李太傅知冀州端懿吾慕李漢超爲將勇無儔養士三千人人人百貔貅關南三十年天子不北憂吾愛李允則善覘多計籌虜動靜寢食皎如在雙眸出入若變化談笑摧敵謀恩信浹南北聲名落燕幽二公材各異戰守兩堪尤天下不用兵爾來三十秋今其繼者誰守冀得李侯李侯年尚少文武學彬彪河朔一尺雪北風煖貂裘上馬擘一作臂長弓白羽飛金鍭臨行問我言我慙本儒鯫漢超雖已乆故來尚歌謳允則事最近猶能想風流將此聊爲贈勉哉行無留石篆詩并序某啓近蒙朝恩守此州州之西南有瑯琊山唐李㓜卿庻子泉者某在館閣時方國家詔天下求古碑石之文集于閣下因得見李陽冰篆庻子泉銘學篆者云陽冰之迹多矣無如此銘者常欲求其本而不得于今十年矣及此來已獲焉而銘石之側又陽冰别篆十餘字尤竒於銘文世罕傳焉山僧恵覺指以示予予徘徊其下乆之不能去山之竒迹古今紀述詳矣而獨遺此字予甚惜之欲有所述而患文辭之不稱思予嘗愛其文而不及者梅聖俞蘇子羙也因爲詩一首并封題墨本以寄二君乞詩刻于石寒嵓飛流一作溜落青苔旁斲石篆何竒哉其人已死骨巳朽此字不滅留山隈山中老僧憂石泐印之以紙磨松煤欲令留傳在人世持以贈客比瓊瑰我疑此字非筆畫又疑人力非能爲始從天地胚渾判元氣結此髙崔嵬當時野鳥踏山石萬古遺迹於蒼崖山祇不欲人屢見毎吐雲霧深藏埋群仙飛空欲下讀常借海月清光來嗟我豈能識字法見之但覺心眼開辭慳語鄙不足記封題逺寄蘇與梅題滁州醉翁亭四十未爲老醉翁偶題篇醉中遺萬物豈復記吾年但愛亭下水來從亂峯間聲如自空落瀉向兩簷前流入巖下溪幽泉助㳙㳙響不亂人語其清非管絃豈不美絲竹絲竹不勝繁所以屢携酒逺歩就潺湲野鳥窺我醉溪雲留我眠山花徒能笑不解與我言惟有巖風來吹我還醒然贈學者人禀天地氣乃物中最靈性雖有五常不學無由明輪曲揉而就木直在中繩堅金礪所利玉琢器乃成仁義不逺躬勤勤入至誠學旣積於心猶木之敷榮根本旣堅好蓊鬱其幹莖爾曹冝勉勉無以吾言輕春寒効李長吉體東風吹雲海天黒飢龍凍雲雨不滴嗔雷隱隱愁煙白宿露無光瑶草寂東皇染花滿春國天爲花迷借春色呼雲鏁日一作月恐紅蔫幾日春隂養花魄悠悠逺絮縈空擲愁思一作絲織春挽不得髙樓去天無幾尺逺岫參差亂屏碧幽谷一作豐樂亭晚飲一徑入蒙宻已聞流水聲行穿翠篠盡怱見青山横山勢抱幽谷谷泉含石泓旁生嘉樹林上有好鳥鳴鳥語谷中靜樹涼泉影清露蟬巳嘒嘒風溜時泠泠渇心不待飲醉耳傾還醒嘉我二三友偶同丘壑情環流席髙䕃置酒當崢嶸是時新雨餘日落山更明山色巳可愛泉聲難乆聽安得白玉琴冩以一作之朱絲繩外集卷第三答梅聖俞兹年疑是兹來酬聖俞朔風見寄此詩押兩吟字一本第一韻作吟寒乃别韻聽平戎操競何事競疑是竞書冝城修木渠記後呈朱寺丞朱名絃字儀甫治平中為冝城令脩木渠有功熈寧二年冬吴充薦改大理寺丞鄭獬為作渠記公詩當在三年合入外集第四卷誤寘第三奉酬聖俞答梅聖俞二詩多同而韻異故兩存之答蘇子美子美慶曆文粹作倩仲蓋舜舊字後篇同賦竹上甘露嘗有之嘗一作常歸鴈亭時發慶曆文粹作時歌石篆詩序子嘗一作予常奏議卷第三歐陽文忠公集九十九諫院論郭承祐不可將兵狀慶暦三年右臣伏聞朝㫖用郭承祐爲鎮定部署臣自聞此除改夙夜思惟一作竊見朝廷以郭承祐爲鎮定路緫管事關利害臣職當言國家用兵巳五六年未有纎毫所得挫盡朝廷威勢困却天下生靈細一作深思厥由其失安在患在朝廷拘守常例不肯越次擇材心知小一作非人付以重一作要任後雖敗事亦終不悔今毎有除擬一作差不當人或問於大臣則曰雖知非材捨此别無人一有矣字甚者欲塞人言則必曰爾試别思更有誰可用乎一作者臣亦嘗聞此言毎退而歎息夫所謂别無人者豈是天下真無人乎蓋不力一作肯求之耳今不肯勞心一無二字選一作㨂擇越一作不次而用一有而字但守常循例輕用小人寧誤犬計一誤不一作一悔後又復然至如葛懷敏頃在西邊天下皆知其不可當時議者但曰捨懷敏一有則字别未有人難爲換易一無此四字及其戰敗身亡横屍原野懷敏旣不復生亦湏别求一作别湏有人用臣謂二字一作且今日任作用承祐亦猶當時用懷敏也況如一無如字承祐者凡庸一無三字奴隷之才不及懷敏逺甚頃在澶州只令一有營字築一有州字城㡬至生變豈可當此一路一作道臣謂朝廷一作天下非不知承祐非才議者不過曰例當敘進别更無人此乃因循之說爾方今黠一作醜虜狂謀禍端已兆中外之士一無二字見國家輕忽戎患弛武北方人皆獻言願早爲備忽見如此除改誰不驚憂前者劉六符之一作暫來一有便使二字朝廷忍耻就議蓋爲河朔無可自一作素無可恃難與速一作力爭湏至屈意苟和少寛禍患今幸得此自紓之計所冝多方汲汲一無二字精意一作選將臣先爲禦一作預備猶恐不及豈是因循守例輕任一作用小人之日也一無也字其郭承祐欲乞早移與一不用兵處知州或召還别與一閑慢職秩若欲録其勤一作勲舊優其戚里之恩閑官厚禄足可飬之不必湏令居此要任伏願陛下深思大計不憚改爲則天下幸甚取進止論元昊來人不可令朝臣管伴劄子同前臣風一作竊聞朝旨一作廷欲以殿中丞任顓管領元昊遣來一行人等一本此十字只作管待西人臣竊知元昊此來全無好意一無此四字不一作未肯稱臣一有又字索物太多其志不小一作少乃是欲以強相迫脅爾一無此九字朝廷旣一作必不能從則待其來人凡事不可過分至於禮數厚薄賜與多少雖云小事不足較量然於事體之間所繫者大凡兵交之使來入一無入字大國必湏窺伺將相勇怯覘察國家強弱若一作如見朝廷威怒未息一作回事勢一作意未削則必内憂斬戮次恐拘留一本此十二字只作莫測必有斬使出兵之懼拘日在館之憂使其偶得生歸自爲大幸則我弱形未露壯論可持今若便損國威過加厚禮先爲自弱長彼驕心使其知我可欺則議論愈一作論事恐益難合矣必若成就其事尤湏鎮重爲先況其議必不成可惜空損事體前次元昊來人至少朝廷只差一作以一班行一有人字待之今來漸多遂差朝士若其後次一無次字來者漸一作更盛則必湏差近侍矣是彼一本彼字作令賊轉自強我轉自弱一有矣字況聞邵良佐昨來往彼僅免屈辱而還則彼雖戎一作夷狄不謂無謀今其來人必湏極騁強辭以圖相勝若能一無能字先薄其禮以折之亦挫賊一作廟謀之一端也其元昊來人欲乞更不差官管領送置驛中不湏急問一本其字下卄一字止作冝罷館待而比於前次更可減損至於監視饋犒一作館待傳道語言一了一作幹事班行足一作可矣臣料今國家若不能曲從其意即一本無此十字雖尊寵一無寵字來人厚加禮遇一本人字下四字作而不從其請則元昊不免出兵一無此二字攻冦一有邊鄙字逞一作肆彼忿心等是不和何必自虧事一作國體不若急脩一作速嚴邊備以圖勝筭一作廟勝取進止三字一作惟陛下留意論元昊不可稱吾祖劄子同前臣伏見如定等來西賊欲稱吾祖嚮聞朝議巳不許之今日風聞議却未定不知虚的深切驚憂且吾祖兩字是何等語便當拒絶理在不疑安有未定之說哉夫吾者我也祖者俗所謂翁也今匹夫臣庻尚不肯妄呼人爲父若欲許其稱此號則今後詔書湏呼吾祖是欲使朝廷呼蕃賊爲我翁矣不知何人敢開此口且蕃賊撰此名號之時故欲侮翫中國而已今若得其稱臣則此二字尤湏論辨今自元昊已下名稱官號皆用夷狄若蕃語兀卒華言吾祖則今賊中每事自用夷禮安得惟於此號獨用華言而不稱兀卒且彼於我稱臣而使我呼爲祖於禮非便故當以此折之可也朝廷自有西事以來處置乖方取笑於人者多矣未有如此一事最可笑也竊慮小人妄有議論伏乞拒而不聽取進止論乞廷議元吴通和事狀同前右臣近有奏論今後軍國大事不湏祕密請集百官廷議近聞以上一作伏見元昊再遣使人將至闕下一無下字和之與否決在此行竊計廟謀合思成筭臣謂此最大事也天下安危繫之今公卿士大夫愛君憂國者人人各爲陛下深思極一作逺慮惟恐廟堂之失䇿遂落夷狄之姦謀衆口云云一作紛紛各有論議一曰天下困矣不和則力不能支少屈就之可以紓患一曰羌夷險詐雖和而不敢罷兵則與不和無異是空包一作抱屈就之羞全無紓患之實一曰自屈志一無此三字講和之後一有不過欲字退而休息練兵訓卒一作訓兵選將以爲後圖然此亦必不能者只以河朔一有料字之事可知蓋慮纔和之後便忘發憤因循弛廢一作廢弛爲患轉深一曰縱使元昊復一作稱臣一有而字西邊減費不弛武備不忘後圖然猶有大可憂者北戎將一作必攬通和之事以爲己功過有邀求遂興兵革是暫息小患於關西復生大患於河北臣忝爲耳目之官見國有大事旁採外一作衆論所聞如此異同然大抵皆謂就和則難不和則易不和則害少和則害多然臣又不知朝廷之意其議云何臣見漢唐故事一有祖宗旧制大事必湏廷一作集議蓋以朝廷示廣大不欲自狹謀臣思公共不敢自強故舉事多臧衆心皆服伏思國家自兵興以來常祕大事𥘉欲隱藏護惜不使人知及其處置乖違豈能掩蔽臣謂莫若採大公之議収衆善之謀待其都無所長四字一作所言無可採自用廟謀一有固亦未晚其元昊請和一事伏乞二字一作請於使人未至之前一有先字集百官廷議臣只自朝夕以來諸處詢訪已聞衆說如此若使並集於廷各陳所見必有長策以禆萬一一有惟陛下裁幸無下九字謹具狀奏聞伏候勑旨論西賊議和利害狀同前右臣伏自一作見如定等到京以來竊聞朝議不許賊稱吾祖必欲令其稱臣然後許和此乃國家大計廟堂得策蓋由陛下至聖至明不苟目前之事能慮嚮去之憂斷自宸衷決定大議然數日來風聞頗有無識之人妄陳愚見不思逺患欲急就和臣雖知必不能上惑聖聦然亦慮萬一少生疑沮則必壞巳成之計臣職在言責理合辨明伏自西賊請和以來衆議頗有異同多謂朝廷若許賊不稱臣則慮北戎别索中國名分此誠大患然臣猶謂縱使賊肯稱臣則北戎尚有邀功責報之患是臣與不臣皆有後害如不得已則臣而通好猶勝不臣然於後患不免也此有識之士憂國之人所以不願急和者也今若不許通和不過懼賊來冦耳且數年西兵遭賊而敗非是賊能善戰蓋由我自繆謀今如遣范仲淹處置邊防稍不失所一有則字賊之勝負尚未可知以彼驕兵當吾整旅使我因而獲勝則善不可加但得兩不相傷亦巳一作足挫賊銳氣縱仲淹不幸小敗亦所失不至如前後之繆謀一作戰是比於通和之後别有大患則所損猶少此善筭之士見逺之人所以知不和害小而不懼未和也臣謂方今不羞屈志急欲就和者其人有五一曰不忠於陛下者欲急和二曰無識之人欲急和三曰姦邪之人欲急和四曰疲兵懦將欲急和五曰陜西之民欲急和自用兵以來居廟堂者勞於斡運在邊鄙者勞於戎事若有避此勤勞茍欲陛下屈節就和而自偷目下安逸他時後患任陛下獨當此臣所謂不忠之臣欲急和者也和而偷安利在目下和後大患伏而未發此臣所謂無識之人欲急和者也自兵興以來陛下憂勤庻政今小人但欲苟和之後寛陛下以太平無事而望聖心怠於庻政一作事因欲進其邪佞惑亂聦明大抵古今人主憂勤小人所不願也此臣所謂姦邪之人欲急和也屢敗之軍不知得人則勝但謂賊來常敗此臣所謂懦將疲兵欲急和也此四者皆不足聽也惟西民困乏意必望和請因宣撫使告以朝廷非不欲和而賊未遜順之意然後深戒有司寛其力役可也其餘一切小人無識之論伏望聖慈絶而不聽使大議不沮而善筭有成則社稷之福也謹具狀奏聞伏候勑㫖論乞不遣張子奭使元昊劄子同前臣竊聞昊賊來人議論數日全無遜順之意朝廷又欲遣張子奭復往賊中仍聞且只一有令字在延州伺候賊意待其來迎方敢前進不知果有如此議否若實有之大爲不便臣謂方今兩議未決正是各爭名分之時尤不可自虧事體元昊旣見朝廷議論不合必料邊防湏爲準備其僞以好辭來迎子奭使我望和而少弛然後不意以出一作出不意以攻子奭或𬒳拘留或遭虐害以爲中國萬世之辱則悔何及焉雖不如此使子奭端坐延州不來省問欲歸則又慮來迎乆待則寂然無報進退不得何耻如之蓋元昊已與中國三次商量必知難合子奭之往又别無議論未盡之事彼一有必字不急求相見則於臣二說慮有一焉臣不知朝廷以昊賊爲可臣乎不可乎若有可臣則自當以重兵壓境仍選忠厚知謀之士直入賊中說令臣伏如其不可則何必遣人或但欲遷延歳月不拒絶之則只當因如定之回賜以甘言許其厚賂諭以若能遜順則使通意邊臣俟得其實然後定議乃是未絶其來之意也不可令天子使臣待賊命而進退萬一遭其拒絶或𬒳拘執則於事無益空損國威爲今計者不若速遣范仲淹嚴備邊境徐放如定等還當自爲謀以求勝筭取進止論乞不受吕紹寜所進羡餘錢劄子同前臣風聞轉運使吕紹寜纔至淮南便進見錢十萬貫不知是一作果否臣見兵興以來天下困弊者非獨備邊之費半由官吏壞之今三司自爲闕錢累於東南剗刷及以糓帛回易則南方庫藏豈有剰錢閭里編民必無藏鏹故淮甸近歳號爲錢荒不知紹寜纔至淮南用何術於何處得此錢以進若將官庫錢上進則逐州合使錢處甚多必致闕乏若於民間科率則人力豈任且十萬緡錢國家得之所益至微外處取之爲害不細往年李定王逵一作逹軰皆刻剥疲民進奉至今南方嗟怨況今年江淮王倫大三字一作諸路自警劫後繼以蝗旱爲孽民間困窘尤要撫存而紹寜欺罔朝廷妄有進獻伏乞特降指揮下别路選差一精強官將淮南一路見管錢帛磨勘大數取見紹寜所進何處得來苟渉欺妄乞賜重行朝典其所進錢伏乞聖慈拒而不受以彰朝廷均䘏外方防禦姦吏刻剥之意取進止論孫抃不可使契丹劄子慶暦三年臣伏見差孫抃等充契丹人使臣謂朝廷新遭契丹侮慢陵辱之後必能發憤毎事挂心几在機冝合慎措置及見抃等𬒳選乃知忘忽慮患依舊因循今西賊議和事連北虜中間屢牒邊郡來問西事了與未了今專使到彼必先問及應對之際動關利害一言苟失爲患非輕豈可四人之中令抃先往抃本蜀人語音訛謬又其爲性靜黙自安軍國之謀未甞與議凡關機事多不諳詳臣聞古者遣使最號難才不受以辭許其專對蓋取其臨事而敏應卒一作變無窮今抃旣不可預教以言則將何以應卒苟一踈脫取笑四夷其孫抃欲乞不令出使或恐中書不能逆抃人情尚執一作守前議即乞别今一人言語分明稍知朝廷事者先往貴不誤事且醜虜君臣頗爲強黠中國常落其計不可不知今欲雪前耻雖知未能其如後患豈可不慮伏望聖慈早令兩府别議取進止論范仲淹宣慰陜西劄子同前臣風聞如定等不乆放還竊縁此來議論必未諧和湏慮驕賊猖狂忿兵攻冦凡関邊備正要枝梧伏覩朝旨己差范仲淹田況等爲宣撫使今日風聞韓琦以仲淹已作參政欲自請行不知是否以臣愚見不若且遣仲淹速去琦與仲淹皆是國家委任之臣材識俱堪信用然仲淹於陜西軍民恩信尤爲衆所推伏今若仲淹外捍冦兵而琦居中應副必能共濟大事庻免後艱若陛下以新用仲淹責其展効則且令了此一事俟邊防稍定不兩三月自可還朝旣先弭於外虞可漸修於闕政今邊事是目下之急不可遲緩以失事機伏望斷自宸衷輟仲淹速去以備不虞取進止奏議卷第三論廷議元昊通和事狀將至至一作到所聞如此異同一作雖有異有同置一作措置論乞不受吕紹寧所進羡餘劄子紹寧所進此下一有自字論孫抃劄子際一作間居士集卷第三歐陽文忠公集三古詩三十一首啼鳥窮山候至陽氣生百物如與時節爭官居荒涼草樹宻撩亂紅一作亂紅殷紫開繁英花深葉暗耀朝日日一作一暖衆鳥皆嚶鳴鳥言我豈解爾意綿蠻但愛聲可聽南䆫睡多春正羙百舌未曉催天明黄鸝顔色巳可愛舌端啞咤如嬌嬰竹林靜啼一作啼盡青竹笋深處不見惟聞聲陂田遶郭白水滿戴勝榖榖催春耕誰謂鳴鳩拙無用雄雌各自知隂晴雨聲蕭蕭泥滑滑草深苔緑無人行獨有花上提葫蘆勸我沽酒花前傾其餘百種各嘲􅑜異郷殊俗難知名我遭讒口身落此毎聞巧舌冝可憎春到山城苦寂寞把盞常恨無娉婷花開鳥語輙自醉醉與花鳥爲交一作友朋花能嫣然顧我笑鳥勸我飲非無情身閑酒羙惜光景惟恐鳥散花飄零可笑靈均楚澤畔離騷憔悴愁獨醒遊瑯瑘山南山一尺雪雪盡山蒼然澗谷深自暖梅花應巳繁使君猒騎從車馬留山前行歌招野叟共歩青林間長松得髙䕃盤石堪醉眠止樂聽山鳥携琴冩幽泉愛之欲忘返但苦世俗牽歸時始覺逺明月髙峯巔讀徂徠集徂徠魯東山石子居山阿魯人之所瞻子與山嵳峩今子其死矣東山復誰過精魄已埋没文章豈能磨壽命雖不長所得固巳多舊藁偶自録滄溟之一蠡其餘誰付與散失存㡬何存之警後世古鑑照妖魔子生誠多難憂患靡不罹音羅宦學三十年六經老研摩問胡所專心仁義丘與軻揚雄韓愈氏此外豈知他尤勇攻佛老奮筆如揮戈不量敵衆寡膽大身么麽徃年遭母䘮泣血走岷峨垢面跣雙足鋤犁事田坡至今郷里化孝悌勤蠶禾昨者來太學青衫踏朝靴陳詩頌聖徳厥聲續猗那羔鴈聘黄晞晞驚走鄰家施爲可恠駭世俗安委蛇謗口由此起中之若飛梭上頼天子明不挂網者羅憶在太學年大雪如翻波生徒日盈門飢坐列鴈鵝絃誦聒鄰里唐虞賡詠歌常續最髙第騫游各名科豈止學者師謂冝國之皤夭壽反仁鄙誰尸此偏頗不知詉詉者又忍加詆訶聖賢要乆逺毀譽暫諠譁生爲舉世疾死也一作者魯人嗟作詩遺魯社祠子以爲歌大熱二首四時成萬物寒暑迭鈞陶壯陽當用事大夏蒸炎歊造化本無情怨咨徒爾勞身微天地闊四顧無由逃九門閶闔開萬仞崑崙髙積雪寒凛凛清風吹寥寥嗟我雖欲徃而身無羽毛陽暉爍四野萬里纎雲収羲和困路逺正午當空留枝條不動影草木皆含愁深林虎不嘯卧喘如呉牛蜩蟬一何微嗟爾徒啾啾幽谷泉踏石弄泉流尋源入幽谷泉傍野人家四面深篁竹漑稻滿春疇鳴渠遶茅屋生長飲泉甘䕃泉栽羙木潺湲無春冬日夜響山曲自言今白首未慣逢朱轂顧我應可恠每來聽不足百一作栢子坑賽龍嗟龍之智誰可拘出入變化何須臾壇平樹古潭水黒沉沉影響疑有無四山雲霧忽晝合瞥起直上拏空虚龜魚帶去半空落雷輷電走先後驅傾崖倒澗聊一戯頃刻萬物皆涵濡青天却掃萬里靜但見緑野如雲敷明朝老農拜潭側鼔聲坎坎鳴山隅野巫醉飽廟門闔狼藉烏鳥爭殘餘憎蚊擾擾萬類殊可憎非一族甚哉蚊之微豈足汙簡牘乾坤量廣大善惡皆含育荒茫一作荒三五前民物交相黷禹鼎象神姦蛟龍逺濳伏周公驅猛獸人始居川陸爾來千百年天地得清肅大患已云除細微遺不録蠅䖟蚤虱蟣蜂蝎蚖蛇蝮惟爾於其間有形纔一粟雖微無柰衆惟小難防毒嘗聞髙郵間猛虎死凌辱哀哉露䈥女萬古讎不復水郷自冝爾可恠窮邊俗晨飱下帷幬盛暑泥駒犢我來守窮山地氣尤卑溽官閑懶所便惟睡冝偏足難堪爾類多枕席猒縁撲燻簷一作之苦煙埃燎壁疲照燭荒城繁草樹旱氣飛炎熇羲和驅日車當午不轉轂清風得夕涼如赦脫囚梏掃庭露青天坐月䕃嘉木汝寧無他時一作日忍此見一作見此迫促翾翾伺昏黒稍稍出壁屋填空來若翳聚隙多可掬叢身疑䧟圍聒耳如遭哭猛攘欲張拳暗中甚一作疑飛鏃手足不自救其能營背腹盤飡勞扇拂立寐僵僮僕端然窮百計還坐瞑雙目於吾固不較在爾誠爲酷誰能推物理無乃乖人欲騶虞鳯皇麟千載不一矚思之不可見惡者無由逐重讀徂徠集我欲哭石子夜開徂徠編開編未及讀涕泗已漣漣勉盡三四章収淚輙忻懽切切一作昭昭一作昭晰善惡戒丁寧仁義言如聞子談論疑子立我前乃知長在世誰謂巳一作子沉泉昔也人事乖相從常苦艱今而毎思子開卷子在顔我欲貴子文刻以金玉聮金可爍而銷玉可碎非堅不若書一作傳以紙六經皆紙傳但當書百本一作傳十以爲百傳百以爲千或落於四夷或藏在一作於深山待彼謗熖一作艶熄放此光芒懸人生一世中長短無百年無窮在其後萬世在其先得長多幾何得短未足憐惟彼不可朽名聲文行然讒誣不須辨亦止百年間百年後來者憎愛不相縁公議然後出自然見媸妍孔孟困一生毀逐遭百端後世苟不公至今無聖賢所以忠義士恃此死一作輕死此不難當子病方革謗辭正騰喧衆人皆欲殺聖主獨保全巳埋猶不信僅免斵其棺此事古未有毎思輙長嘆我欲犯衆怒爲子記此冤下紓冥冥忿仰叫昭昭天書於蒼翠石立彼崔嵬巔詢求子丗家恨子兒女頑經歳不見報有辭未能銓一作詮忽開子遺文使我心已寛子道自能乆吾言豈須鐫汝癭答仲儀一作答王素汝癭君嗟汝癭多誰謂汝土惡汝癭雖云苦汝民居自樂郷閭同飲食男女相媒妁習俗不爲嫌譏嘲豈知怍汝山西南險平地猶磽确一作确犖一作磽䃕一作确䃕汝樹生擁一作癰腫根株浸溪壑山川固巳然風氣冝其濁接境化襄鄧餘風𬒳伊雒思予昔曽遊所見可驚愕喔喔聞語笑纍纍滿城郭傴婦懸甕盎嬌嬰包卵鷇無由辨肩頸有類龜縮殻噫人禀最靈反不如鳬鶴駢枝雖形累小小固一作故可略癰瘍暫畜聚決潰終當涸贅疣附攴體幸或不爲虐未若此巍然所生非所託咽喉繫性命鍼石難砭一作破削農皇古神聖爲世名百藥豈不有方書頑然莫銷爍一作鑠温湯汝靈泉亦不能湔瀹君官雖謫居政可瘳一作療民瘼奈何不哀憐而反恣訶一作嘲謔文辭騁新工醜恠極名貌汝士雖多竒汝女少纎弱翻愁太守宴誰與唱清角乖離南北殊魂夢山陂邈握手未知期寄詩一作書聊一噱滄浪亭一本上云寄題子羙子羙寄我滄浪吟邀我共作一作賦滄浪篇滄浪有景不可到使我東望心悠然荒灣野水氣象古髙林翠阜相回環新篁抽笋添夏影一作景老枿亂發爭春妍水禽閑暇事髙格山鳥日夕相啾喧不知此地幾興廢仰視喬木皆蒼煙堪嗟人迹到不逺雖有來路曾無縁窮竒極恠誰似子搜索幽隱探神仙𥘉尋一逕入䝉密豁目異境無窮邊風髙月白最冝夜一片瑩淨鋪瓊田清光不辨水與月但見空碧涵漪漣一有姑蘇臺邊人響絶夜靜徃徃聞鳴船兩句清風明月本無價可惜秖賣四萬錢又疑此境一作景天乞與壯士憔悴天應憐鴟夷古亦有獨徃江湖波濤渺飜天﨑嶇世路欲脫去反以身試蛟龍淵豈如一作知扁舟任飄兀紅渠渌浪揺醉眠丈夫身在豈長弃新詩羙酒一作詩新酒羙聊窮年雖然不許俗客到莫惜佳句人間傳寳劒寳劒匣中藏暗室夜常一作明欲知天將雨錚爾劒有聲神龍本一物氣類感則鳴常恐躍匣去有時暫開鋦疑止當作扄煌煌七星文照曜三尺冰此劒在人間百妖夜收形姦兇與佞媚膽破骨亦驚試以向星月飛光射攙槍藏之武庫中可息天下兵柰何狂胡兒尚敢邀金繒秋晚凝翠亭探韻作黃葉落一作落葉滿空城青山遶官廨風雲凄已髙歳月驚何邁陂田寒未收野水淺生派晴林紫榴坼霜日紅梨曬蕭踈喜竹勁寂寞傷蘭敗叢菊如有情幽芳慰孤介嘉客日可携寒醅羙新醡音債登臨無猒頻冰雪行即届菱溪大一本無大字石新霜夜落秋水淺有石露出寒溪垠苔昏土蝕禽鳥啄出没溪水秋復春溪邊老翁生長見疑我來視何殷勤愛之逺徙向幽谷曵以三犢載兩輪行穿城中罷市看但驚可恠誰復珍荒煙野草埋没乆洗以石竇清泠泉朱欄緑竹相掩映選一作邀致佳處當南軒南軒旁列千萬峯曾未有此竒嶙峋乃知異物世所少萬金爭買傳幾人山河百戰變陵谷何爲落彼荒溪濆山經地誌不可究遂令異說爭紛紜皆云女媧𥘉鍜錬融結一氣凝精純仰視蒼蒼𥙷其缺染此紺碧瑩且温或疑古者燧人氏鑚以出火爲炮燔苟非神聖親手迹不爾孔竅一作穴誰雕剜又云漢使把漢節西北萬里窮崑崙行經于闐得寳玉流入中國隨河源沙磨水激自穿穴所以鐫鑿無瑕痕嗟予有口莫能辨歎息但以兩手捫盧仝韓愈不在世彈壓百恠無雄文爭竒鬪異各取勝遂至荒誕無根原天髙地厚靡不有一作有定醜好萬狀奚足論惟當掃雪席其側日與嘉客陳清罇送姜秀才遊蘇州憶從太學諸生列我尚弱齡君秀發同時並薦幾存亡一夣十年如倐忽壯心君未減青春多難我今先白髮山花撩亂鳥綿蠻更盡一罇明日别送孫秀才髙門煌煌爀如赭勢利聲名爭借假一作假借嗟哉子獨不顧之訪我千山一羸馬明珠渡水覆舟失贈我璣貝猶滿把生携文數十篇見訪渡江而失遲遲顧我不欲去問我無窮慚報寡時之所弃子獨嚮無乃與世異取捨新霜二首天雲慘慘秋隂薄卧聽北風鳴屋角平明驚鳥四散飛一夜新霜群木落南山鬱鬱舊可愛千仞巉巖如刻削林枯山瘦失顔色我意豈能無寂寞衰顔得酒猶彊發可醉豈須嫌酒濁泉傍菊花方爛漫短日寒輝相照灼無情木石尚須老有酒人生何不樂荒城草樹多隂暗日夕霜雲意濃淡長淮漸落見洲渚野潦𥘉清一作晴收瀲灩蘭枯蕙死誰復弔殘菊籬根爭豔豔青松守節見臨危正色凛凛不可犯芭蕉芰荷不足數狼藉徒能汚池檻時行收斂歳將窮冰雪嚴凝從此漸咿􅊯兒女感時節愛惜朱顔屢窺鑑惟有壯士獨悲歌拂拭塵埃磨古劒豐樂亭小飲造化無情不擇物春色亦到深山中山桃溪杏少意思一作有誰顧自趂時節開春風看花遊女不知醜古粧野態争花紅人生行樂在一作當勉彊有酒莫負瑠琉鍾主人勿笑花與女嗟爾自是花前翁四月九日幽谷見緋桃盛開經年種花滿幽谷花開不暇把一巵一作枝人生此事尚難必况欲功名書鼎彛深紅淺紫看雖好一作羙顔色不柰東風吹緋桃一樹獨後發意若待我留芳菲清香嫰蘂含不吐日日恠我來何遲無情草木不解語向我有意偏依依羣芳落盡始爛漫榮枯不與衆豔随念花意厚何以報唯有醉倒花東西盛開比落猶數日清一作芳罇尚可三四携秋懷二首寄聖俞一本擬孟郊體秋懷孤管叫秋月清砧韻霜風天涯逺夣歸一作歸逺夢驚斷山千重群物動巳息百憂感從中日月矢雙流四時環無窮隆隂夷老物摧折壯士胷壯士亦何爲素絲悲青銅羣木落空原南山髙巃嵸巉巖想詩老瘦骨寒愈聳詩老類秋蟲吟秋聲百種披霜一作芳掇孤英泣古弔荒冢琅玕叩金石清響聽生悚何由幸見之使我滌煩冗飛鳥下東南音書無日捧希眞堂東一本無東字手種菊花十月始開當春種花唯恐遲我獨種菊君勿誚春枝滿園爛張錦風雨須臾落顚倒看多易猒情不專鬪紫誇紅隨俗好豁然髙秋天地肅百一作萬物衰零誰暇弔君看金蘂正芬敷曉日浮霜相照耀一本有後時寧與竹栢榮媚世不爭桃李笑兩句煌煌正色秀可餐藹藹清香寒愈峭髙人避喧守幽獨淑女靜一作靚容修一作羞窈窕方當揺落看轉佳慰我寂寥何以報時携一罇相就飲如得貧交論乆要我從多難壯心衰迹與世人殊靜躁種花勿一作不種兒女花老大安能逐年少挋霜花芳菲能幾時顔色如自愛鮮鮮弄霜曉裊裊含風態蕙蘭殞秋香桃李媚一作嬌春醉時節雖不同盛衰終一致莫笑黄菊花籬根守憔悴懷嵩樓晚飲示徐無黨無逸一本作奉和徐生見示懷嵩樓晚飲一本無見示字滁山不通車滁水不載舟舟車路所窮嗟誰肯來遊念非吾在此二子來何求不見忽三年見之忘百憂問其别後學𥘉若繭緒抽縱横漸組織文章爛然浮引伸無窮極卒歛以軻丘少進日如此老退誠可羞弊邑亦何有青山遶城樓泠泠谷中泉吐溜彼一作𬒳山幽石醜駭溪恠天竒瞰龍湫子𥘉如可樂乆乃歎以愀云此譬圖畫暫看已宜收荒涼一作村草樹間暮館城南陬破屋仰見星䆫風冷如鎪歸心中夜起輾轉卧不周我爲辦酒肴羅列蛤與蛑酒酣微探之仰笑不頷頭曰予非此儂又不負譴尤自非世不容安事此爲囚幸以主人故﨑嶇幾摧輈一來勤已多而況欲乆留我語頓遭屈顔慚汗交流川塗冰已壯霰一作霜雪行將稠羡子兄弟秀雙鴻翔髙秋嗈嗈飛且鳴歳暮憶南州飲子今日歡重我明日愁來貺辱已厚贈言媿非酬瑯瑘山六題一本作山中六題注云瑯瑘山中歸雲洞洞門常自一作似起煙霞洞穴傍穿透谿谷朝看石上片雲隂夜半山前春雨足瑯瑘谿空山雪消谿水漲遊客渡谿横古槎不知谿源來逺近但見流出山中花石屏路石屏自倚浮雲外石路乆無人跡行我來携酒醉其下卧看千峯秋月明班春亭信馬尋春踏雪泥醉中山水弄清輝野僧不用相迎送乘興閑來興盡歸庶子泉庶子遺蹤留此地寒嵓徙倚弄飛泉古人不見心可見一片清光長皎然惠覺方丈青松行盡到山一作松門亂峯深處開方丈已能宴坐老山中何用聲名傳海上居士集卷第三熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正汝癭詩平地猶确䃕衢本作确犖吉本作磽䃕建本作确䃕蜀本羅氏本作磽确朝佐按字書磽通作墝确通作埆礜磽确不平也犖駮牛也䃕石相扣聲确犖磽䃕确䃕字各不同今從蜀本羅氏本作磽确而以諸本注其下語笑一作笑語啼鳥花開一作間讀徂徠集唐虞賡詠歌歌一作謌反仁一作及仁幽谷泉日夜石本作夜夜憎蚊出壁屋出一作去汝癭有類一作似滄浪亭到不逺到一作去紅渠一作蕖寳劒照曜曜一作燿菱溪大石𥘉鍜一作所鍜歎息一作惜送孫秀才争借假一作相假借與世一作時新霜風鳴一作吹歳將一作歳物幽谷見緋桃人生此事尚難必一作世間小事尚如此秋懷吟秋一作鳴秋琅玕一作琅琅下東南下一作不懷嵩樓晚飲日如此日一作且欲乆留乆一作之南州州一作洲易童子問卷第三歐陽文忠公集七十八童子問曰繫辭非聖人之作乎曰何獨繫辭焉文言說卦而下皆非聖人之作而衆說淆亂亦非一人之言也昔之學易者雜取以資其講說而說非一家是以或同或異或是或非其擇而不精至使害經而惑世也然有附託聖經其傳已久莫得究其所從来而覈其真僞故雖有明智之士或貪其雜博之辯溺其冨麗之辭或以爲辨疑是正君子所愼是以未始措意於其間若余者可謂不量力矣邈然逺出諸儒之後而學無師授之傳其勇於敢爲而決於不疑者以聖人之經尚在可以質也童子曰敢問其略曰乾之初九曰潜龍勿用聖人於其象曰陽在下也豈不曰其文巳顯而其義已足乎而爲文言者又曰龍德而隱者也又曰陽在下也又曰陽氣潜蔵又曰潜之爲言隱而未見繫辭曰乾以易知坤以簡能易則易知簡則易從易知則有親易從則有功有親則可久有功則可大可久則賢人之德可大則賢人之業其言天地之道乾坤之用聖人所以成其德業者可謂詳而備矣故曰易簡而天下之理得矣者是其義盡於此矣俄而又曰廣大配天地變通配四時隂陽之義配日月易簡之善配至德又曰夫乾確然示人易矣夫坤隤然示人簡矣又曰夫乾天下之至健也其德行常易以知險夫坤天下之至順也其德行常簡以知阻繫辭曰六爻之動三極之道也者謂六爻而兼三材之道也其言雖約其義無不包矣又曰易之爲書也廣大悉備有天道焉有人道焉有地道焉兼三材而兩之故六六者非他也三材之道也而說卦又曰立天之道曰隂與陽立地之道曰柔與剛立人之道曰仁與義兼三材而兩之故易六畫而成卦分隂分陽迭用柔剛故易六位而成章繫辭曰聖人設卦觀象繫辭焉而明吉凶又曰辨吉凶者存乎辭又曰聖人有以見天下之動而觀其㑹通以行其典禮繫辭焉以斷其吉凶是故謂之爻人曰易有四象所以示也繫辭焉所以告也定之以吉凶所以斷也又曰設卦以盡情僞繫辭焉以盡其言其說雖多要其旨歸止於繫辭明吉凶爾可一言而足也凡此數說者其略也其餘辭雖小異而大旨則同者不可以勝舉也謂其說出於諸家而昔之人雜取以釋經故擇之不精則不足􅏜也謂其說出於一人則是繁衍叢脞之言也其遂以爲聖人之作則又大繆矣孔子之文章易春秋是巳其言愈簡其義愈深吾不知聖人之作繁衍叢脞之如此也雖然辨其非聖之言而巳其於易義尚未有害也而又有害經而惑世者矣文言曰元者善之長也亨者嘉之㑹也利者義之和也貞者事之幹也是謂乾之四德又曰乾元者始而亨者也利貞者性情也則又非四德矣謂此二說出於一人乎則殆非人情也繫辭曰河出圖洛出書聖人則之所謂圖者八卦之文也神馬負之自河而出以授於伏羲者也盖八卦者非人之所爲是天之所降也又曰包羲氏之王天下也仰則觀象於天俯則觀法於地觀鳥獸之文與地之宜近取諸身逺取諸物於是始作八卦然則八卦者是人之所爲也河圖不與焉斯二說者已不能相容矣而說卦又曰昔者聖人之作易也幽賛於神明而生蓍參天兩地而倚數觀變於隂陽而立卦則卦又出於蓍矣八卦之說如是是果何從而出也謂此三說出於一人乎則殆非人情也人情常患自是其偏見而立言之士莫不自信其欲以垂乎後世惟恐異說之攻之也其肯自爲二三之說以相抵捂而疑世使人不信其書乎故曰非人情也凡此五說者自相乖戾尚不可以爲一人之說其可以爲聖人之作乎童子曰於此五說亦有所取乎曰乾無四德而洛不出圖書吾昔巳言之矣若元亨利貞則聖人於彖言之矣吾知自堯舜已来用卜筮爾而孔子不道其初也吾敢妄意之乎童子曰是五說皆無取矣然則繁衍叢脞之言與夫自相乖戾之說其書皆可廢乎曰不必廢也古之學經者皆有大傳今書禮之傳尚存此所謂繫辭者漢𥘉謂之易大傳也至後漢巳爲繫辭矣語曰爲趙魏老則優不可以爲滕薛大夫也繫辭者謂之易大傳則優於書禮之傳逺矣謂之聖人之作則僣僞之書也蓋夫使學者知大傳爲諸儒之作而敢取其是而捨其非則三代之末去聖未逺老師名家之世學長者先生之餘論雜於其間者在焉未必無益於學也使以爲聖人之作不敢有所擇而盡信之則害經惑世者多矣此不可以不辨也吾豈好辨者哉童子曰敢問四德曰此魯穆姜之所道也𥘉穆姜之筮也遇艮之隨而爲隨元亨利貞說也在襄公之九年後十有五年而孔子始生又數十年而始賛易然則四德非乾之德文言不爲孔子之言矣童子曰或謂左氏之傳春秋也竊取孔子文言以上附穆姜之說是左氏之過也然乎曰不然彼左氏者胡爲而傳春秋豈不欲其書之信於世也乃以孔子晚而所著之書爲孔子未生之前之說此雖甚愚者之不爲也蓋方左氏傳春秋時世猶未以文言爲孔子作也所以用之不疑然則謂文言爲孔子作者出於近世乎童子曰敢問八卦之說或謂伏羲巳授河圖又俯仰於天地觀取於人物然後畫爲八卦爾二說雖異會其義則一也然乎曰不然此曲學之士牽合傳會以苟通其說而遂其一家之學爾其失由於妄以繫辭爲聖人之言而不敢非故不得不曲爲之說也河圖之出也八卦之文已具乎則伏羲授之而巳復何所爲也八卦之文不具必須人力爲之則不足爲河圖也其曰觀天地觀鳥獸取於身取於物然後始作八卦盖始作者前未有之言也考其文義其創意造始其勞如此而後八卦得以成文則所謂河圖者何與於其間哉若曰巳授河圖又須有爲而立卦則觀於天地鳥獸取於人物者皆備言之矣而獨遺其本始所授於天者不曰取法於河圖此豈近於人情乎考今繫辭二說離絶各自爲言義不相通而曲學之士牽合以通其說而悞惑學者其爲患豈小哉古之言僞而辨順非而澤者殺無赦嗚呼爲斯說者王制之所宜誅也童子曰敢問生蓍立卦之說或謂聖人已畫卦必用蓍以筮也然乎曰不然考其文義可知矣其曰昔者聖人之作易也者謂始作易時也又曰幽賛於神明而生蓍參天兩地而倚數觀變於隂陽而立卦發揮於剛柔而生爻者謂前此未有蓍聖人之将作易也感於神明而蓍爲之生聖人得之遂以倚數而立卦是言昔之作易立卦之始如此爾故漢儒謂伏羲畫八卦由數起者用此說也其後學者知幽賛生蓍之恠其義不安則曲爲之說曰用生蓍之意者將以救其失也又以卦由數起之義害於二說則謂已畫卦而用蓍以筮欲牽合二說而通之也然而考其文義豈然哉若曰巳作卦而用蓍以筮則大衍之說是已大抵學易者莫不欲尊其書故務爲竒說以神之至其自相乖戾則曲為牽合而不能通也童子曰敢請益曰夫諭未逹者未能及於至理也必指事據迹以爲言余之所以知繫辭而下非聖人之作者以其言繁衍叢脞而乖戾也蓋略舉其易知者爾其餘不可以悉數也其曰原始反終故知死生之說又曰精氣爲物遊䰟為變是故知鬼神之情状云者質於夫子平生之語可以知之矣其曰知者觀乎彖辭則思過半矣又曰八卦以象告爻彖以情言云者以常人之情而推聖人可以知之矣其以乾坤之策三百有六十當期之日而不知七八九六之數同而乾坤無定策此雖筮人皆可以知之矣至於何謂子曰者講師之言也說卦雜卦者筮人之占書也此又不待辨而可以知者然猶皆迹也若夫語以聖人之中道而過推之天下之至理而不通則思之至者可以自得之童子曰既聞命矣敢不勉易童子問卷第三易童子問繫辭然有附託有一作其莫不自信其此下一有言字其肯其一作豈洛不出一作河洛不出則三代之末則字下一有自字其間者在焉此下一有取之二字之不為不字上一有所字遂其一家其一作爲聖人之將此上一有由字用生蓍一作生用蓍不能通也而乖戾也二也字下一本各有如此二字七八九六之數同同字上一有不字書簡卷第三歐陽文忠公集一百四十六與趙康靖公叔平至和三年某啓辱教并髙郵二書不勝感刻足以仰見仁人之心惻物垂憫之深也方欲專馳人去請時暑重煩揮翰来旦併伸面謝人還姑此又至和三年七月某啓累日阻拜見不審尊候何似某爲水所渰倉皇中般家来唐書局又爲皇城司所逐一家惶惶不知所之欲却且還舊居白日屋下夜間上栰子露宿人生之窮一至于此人馬隨多少借般賤累幸不阻又嘉祐四年某頓首啓𥘉夏巳熱不審動止何似鄆去京師不爲逺而叔平在外冝日走訊問候興居而動輒逾時雖云人事區區實亦可責也某昨衰病屢陳蒙恩許解府事雖江西之請未獲素心而疲憊得以少休豈勝感幸卜居城南粗亦自便自在府中數月以几桉之勞凭損左臂積氣留滯疼痛不可忍命醫理之迄今未愈天府孰不爲之獨衰病者如此爾東平風物甚佳爲政之暇想多清趣更冀爲朝自重以俟嚴召遞中謹奉此有懇如別幅焦千之秀才乆相從篤行之士也昨來科埸偶不曽入其人專心學古不習治生妻子寄食婦家遑遑無所之徃時聞鄆學可居所資差厚可以託食而焦君以郡守貴侯難以屈迹今遇賢主人思欲徃託竊計髙明必亦聞此但恐鄆學難居今巳有人爾若見今無人則焦君不止自託其於教導必有𥙷益亦資爲政之一端也更在髙明詳擇可否俟有寵報決其去就也謹於遞中布此懇又同前某啓乆不奉狀乃以今夏暑毒非常歳之比壯者皆苦不堪況早衰多病者可知自盛暑中忽得喘疾在告數十日近方入趨而疾又作動輒伏枕情緒無悰深思外𥙷以遂𥘉心而唐書不乆終篇用是更少盤桓侍祠旣畢當即決去形容心志皆難勉強矣焦秀才事荷挂念方走淮南欲挈家而其婦翁作省判遂𬒳留連勢不能去然渠感愧非一也某乆欲作書屬病今猶居告自叔平兄去後子華作憲遂鮮歡又同前某啓近甞奉狀秋雨早寒不審尊候何似昨辱書言郡封不安勞慮醫藥數日前聞果不起伏惟哀悼之懷何以堪處無由陳慰徒用瞻仰叔平素喜浮圖之說死生之際固巳深逹茲顧未能頓至無念諒用此可以少寛哀苦之情爾交游無以爲言聊以此塞悲奈何奈何更希爲國自重也謹於遞中附此又嘉祐五年某頓首啓伏承榮𬒳制書入司天憲中外欣愜以謂肅政綱以重朝廷於茲有望焉至於朋舊又喜来歸獨不得親𣢾宴言以爲恨爾竊計旌斾巳及郊畿無由瞻迎溽暑惟爲國自重又熈寧二年某再拜自承榮遂挂冠之請日欲馳賀而病悴無堪事多稽廢其如不勝欣慕瞻仰之誠也即日隆暑伏惟台候動止康福竊惟宴間之樂大愜雅懷回視塵瑣必深閔歎也某衰病日増尚此遷延爲愧不淺然亦不晚必能勉追髙躅也瞻見未涯惟冀順時加重又熈寧三年某衰病退藏人事曠廢理無足怪然亦不承問不勝傾馳屢得君貺書及見唱和新篇粗審動靜喜承台候萬福嚮甞辱許枉顧雖日企竚乃岀於乗興不敢坐邀然又思潁之請決在此春若得自乗一鹿車造門求見亦未爲晚未間春暖惟冀以時衞重又熈寧四年某啓自退居杜門人事㡬絶養成踈慵稍闊拜問塗中忽辱書頓慰岑寂兼審經寒尊候萬福某衰病如昨目足尤苦殊不少損茲亦老年常態爾閑居之樂無待於外而自足處多惟朋舊相從爲難得自安道得請南臺竊思二公物外得朋之樂不勝羡慕所承寵諭春首命駕見訪此自山隂訪戴之後數百年間未有此盛事一日公能發於乗興遂振髙風使衰病翁因得附託垂名後世以繼前賢其幸其榮可勝道哉在公勉強而成之爾餘具別紙與馮章靖公當世嘉祐三年某頓首區區乆闕致問中間辱書爲感何已冬寒伏惟台候萬福某以衰病期一作思得一小郡養拙三二年間謀一歸老之地此願未獲遽𬒳責以吏事精力秏竭何止彊勉不岀歳末春𥘉當有江西之行矣薛親幹敏河東風土民間事緒可以詢問得佐幕府甚幸甚幸某爲目疾爲梗臨紙草率惟冀鎮撫外以時爲國自重又嘉祐四年某啓自承移鎮合肥甞一得奉狀其後區區更闕附問不審酷暑以來尊候何似廬在淮南爲劇郡竊惟下車布治之𥘉當少煩條教旣而可樂之趣則有多於他邦也伏惟視政之暇爲時自重佇俟來歸以慰士大夫朋友之望又嘉祐五年某啓伏自移鎮肥上甞一奉書忽已踰歳續雖乏馳問然瞻企之勤則未甞懈也即日春寒不審尊候何似某以衰病無堪自解秩天府於今一朞正以唐史殘編爲累今幸成書不乆進御遂當南去世事老来益有可厭者矣自當世治肥然大率諸相知皆云不得書某亦以地僻少有來使得詢動止朝廷公議與交親私望皆願還歸未間向暖惟冀爲國自重又同前某啓昨自罷煩劇卜居城南少獲休息然猶此盤桓未遂決去正以唐史將遂終篇然亦不過秋末時事爾廬去京師不逺計可備聞難於紙筆具道也當世據名藩優游文史自足爲樂其餘一付公議但朝多賢士而獨在外與相知之私立欲公來歸之速爾某衰病俱攻去心甚速諸公察其實然而未肯決然放去柰何柰何原父雖歸子華作憲朋友益蕭索當世尚壯及時讀書行樂此外稍隙時當得數奉問大熱更冀自重又同前某啓自承移鎮金陵遂踈奉問經暑竊惟體履多福江山之勝實足以資清興而賢者乆居于外豈朝廷之意哉朋友區區之私又可知也某衰病迫於歸計唐史奏御遽陳危懇而未蒙聽允進無所𥙷退不獲志負愧周行不知所措一作處相見益無涯惟爲時自愛以副瞻望又同前某啓自成書請外所陳哀切冀以危誠有以感動而二三公過爲顧慮曲以見留在意實厚於計則非便也柰何柰何本欲爲郡下客少溷主人復未可得然使少遷延終當必償夙志也濟叔窮居得當世在鎮必以慰意不乆當應稍起此公議乆所鬱鬱也前承惠碑多佳者甚濟編録感幸感幸聞金陵有數廳梁陳碑及蔣山題名甚多境内所有幸爲博采以爲惠實寡陋之益也病暑草率又同前某啓承惠寄碑刻旣博而精多所未見寡陋蒙益而私藏頓冨矣中年早衰世好漸薄獨於茲物厥嗜尤篤而俗尚乖殊毎患不獲同好凡如所惠僅得二三固已爲難而驟獲如是之多冝其如何爲喜幸也濟叔公議猶屈乃吾徒之責未甞少忘于懷而造物者第與衆人同爲嗟歎而已豈賢人君子亨否有命殆非人力能致邪雖然敢不竭力辱諭感愧感愧承專遣人至數召問其還期毎云有故未歸遂且於郵中附此俟渠行別當奉狀也又嘉祐六年某啓衰病碌碌無所稱徒負愧耻區區強顔人事廢曠乆闕致問但深瞻企昨承進寵經筵而尚留居外未足以慰士大夫之望實非交游之私論也辱惠書承經暑渉秋動履清安江山英勝聊助公餘之興未嚴召間希爲國自重與王副樞景彛嘉祐五年某啓自承軒騎歸止屬以多故未克祗謁暄和竊審氣體清安適辱簡誨兼示鄭州書信等偶在院中定題不時爲答深所感愧謹馳此爲謝幸加恕察不宣某再拜景彞舎人閤下八日與王懿敏公仲儀嘉祐二年某啓數日之間併承寄惠蠏栗雖不得書亦喜尊候萬福某居此如魚鳥之池籠歳律忽巳遒盡衰病日復侵攻交游多在外塊然處此情緒可知今日得蔡大書言乆病近方就安人生聚散憂患百端相見何時況開年決求南去遂益爲胡越也惟以時自重臨紙區區又嘉祐三年某啓稍不附問新春尚寒不審尊體何似歳月不覺又添一歳目日益昬聽日益重其情悰則又可知嚮者公廨錢事知巳息就令不息徒喧噪人耳何足恤也邊州無事誠爲可樂然俗吏亦不能也近來班著蕭條群賢在外皆當召歸而議者不及衰病思去又亦未得守常不變其弊乃爾其他時事不能悉具惟過年益區區但時與韓三吴大相從爾燈夕却在李端慤家爲㑹諸君皆奉思也數數附回州人書皆不親付常意不逹今偶此人取書適在家湖柑閑寄數十箇去到彼得三四不損尚可表意若遂無可入口亦無如之何也不罪不罪因人幸時惠問又嘉祐二年某啓昨日自貢院出得所寄書伏承春暄氣體清福兼知深樂北土之善爲郡處處皆佳況此帥府雄盛邊鄙無事固足以優游也某昨被差入省便知不靜縁累舉科埸極弊旣痛革之而上位不主權貴人家與浮薄子弟多一作爲在京師易爲揺動一旦喧然𥘉不能遏然所得頗當實材旣而稍稍遂定去冬求洪井未得便差主文今旣喧噪漸息遂復理前請期於必得也中年衰病尤甚自出試院痛不能飲人生聚散安能區區於此進無所𥙷退又不能自遂荏苒歳月有甚了期其他非筆墨可述惟爲國自重因人時枉問以慰無憀又嘉祐三年某啓自承有益都之命必謂來朝當得相見不意遂爾西行實増怏怏又聞闕逺却於沿路盤桓深欲奉狀以莫知旌斾所止不審即日春寒尊候如何計以仲春至鎮在路亦不乆留成都風物非老者所冝仲儀雖爲同甲然心意壯銳諒可爲樂難以病夫忖度也諸賢在外者爲復來歸獨公逺去相見何時某非乆於此者然素志未遂心徃形留因指使來辭得附書新春爲國自重又嘉祐四年某啓自去歳秋冬已來益多病加以目疾復左臂舉動不得三削請洪諸公畏物議不敢放去意謂寧俾爾不便而無爲我累柰何柰何然且告他秖解府事必可得不過月十日且得作閑人爾少緩湯火煎熬有無限鄙懷不能具述薛婆老亦多病於錦繡無用秖是兒婦輩或恐有所要臨時奉煩爾土冝歸日惟好且當正如寛厚之說也呵呵酒絶喫不得聞仲儀日飲十數杯旣徤羡又不能奉信蜀中碑文雖古碑斷缺僅有字者皆打取來如今秖見此等物粗有心情餘皆不入眼也遞中續得來書京師自立春泥雪至今凍屍横路遂罷放燈經節不敢過諸人皆云寂寞恐知恐知踈拙無佳物表意不怪不怪又同前某啓昨在府中區區不時奉問理不爲怪自罷去益怱怱度日不能爲一事公私俱廢此所以日夢南歸視居此如桎梏之思脫也自仲儀到蜀未甞承問但時見宅中子弟問動靜云起居甚安異方下車必煩條教計今人情習安粗可以爲樂矣因書幸示某昨在府几案之勞氣血極滯左臂疼痛強不能舉罷居城南粗得安養迄今病目尚未復差厭苦人事實不能支秖候夏秋唐書了成禠却梅二遂決南去未間時得奉問夏熱爲國自重又同前某啓區區多故乆不附問不審尊體何似自春中曽一奉狀尋於遞中見答昨見公謹云得仲儀書怪某乆無信蓋亦未甞得仲儀書也但聞蜀人與自西歸者言善政日新兩川蒙賜聞之竊喜大用之有期也某益多病目昬手顫脚膝行履艱難衆疾並攻唐書巳了秖候冩了進本遂決南昌之請自此可圖一作蠒處矣京師事體亦迫促動有嫌忌無復縱適歳暮索然殊尠歡意惟希公外多愛因暇時作數字以慰曕企又嘉祐五年某啓乆不奉狀亦乆不辱書惟見諸賢姪得聞動靜前日郵中忽承惠問喜渉夏秋體履休勝深以爲慰也某自罷府又一歳有餘方得唐書了當遽申前請懇乞江西前後累削辭極危苦而二三公若不聞近年眼目尤昬又却送在經筵事與心違無一是處未知何日遂得釋然一償素志於江湖之上然後歸老汝隂爾昨蒙詔諭俾請假旣以地逺暫歸不能辦事又一請假後難更請郡以此不敢但更少盤桓㑹當有時得歸爾承見問所以略道一二終日區區不曽勾當得公私一事人事殆廢以此不時作書應不爲怪嚮寒爲國自重又嘉祐六年某啓近甞於遞中拜問辱書承春寒動履佳安兼蒙逺惠佳篇衰病之人豈敢萌心至於自顧惟知憂畏而衆論實可多懼獨見愛之深至於歌詠感愧感愧數十日來茫然未知所爲答問後遂如此其何以免於罪戾老退之心不敢望有所立以希名譽但厚恩當報爾仲儀何以見教寳臣雖不乆當發其如逺甚計湏夏方得到闕鄙懷千萬不能具述惟期握手爲一笑爾盛作少暇當勉強爲答次因書略道區區餘寒爲國自重又同前某啓自春以来私門多故遂闕致問兼承歸騎巳東但日冀相見也碌碌於此忽焉半歳思去之心雖切而未有以發近外處相知多見問以求罷太速不知何以傳此豈中外人情已欲其去邪不相見數年人事百變前夕清卿之室巳與擇之共牢而食士夫聞之莫不竊歎冨貴浮名何可乆恃至於妻子亦不能保然盛衰之理固常如此奚足爲之悲也君謨巳歸皤然一翁病勢自到京来頓減前日與余廣州在弊齋閑㑹坐中相顧歷道諌院中語笑但奉思爾衰病索然百事俱懶惟故人相見庻幾有少清況爾瞻近匪遐跋履之勞更冝避暑慎攝又同前某啓人至辱惠以佳篇豈勝珍誦益見治煩餘暇猶能及此弊齋有菊數叢去歳自開便邀諸公比過重陽凡作數㑹今秋無復一賞軒裳外物爲累於人細較其得失何用區區自仲儀與數公自外歸甚思少奉從容殊未有暇今有㑹亦不放曠可歎可歎值夜且奉此爲謝又同前某啓區區不得數奉言宴可勝瞻勤昨日以疾病發動請告家居不知賢郎寵過今日見二公言請許此實仲儀附就秉鈞者當以爲漸爾然佳郡不逺且少盤桓聊爲偃息也某衰病漸不能支更見楊樂道長徃同甲勾落太半矣深思一作蠒處未有去端爾客多偷隙作此簡鄙懷欲述者多不覺忉忉又同前某啓近以口齒淹延遂作孽兩頰俱腫飲食言語皆不能呼四醫工並來未有纎効聞仲儀有蜀中真山豆根乞一二兩病苦加以餓損薾然疲卧不暇及他不罪不罪又嘉祐七年某啓少别忽已更月秋氣漸清竊惟動履勝常受署方𥘉冝少煩條教吏民旣已蒙惠則湖上清曠浩然放懷可以遺外世俗區區可憎之態至於憂悲煩惱亦自以理遣之某竊位於此不能明辨是非黙黙苟且負抱愧耻何可勝言獨於朋友之間常懷區區之願如此而巳謹奉啓咨問又同前某啓自別日欲致問而公私多故賢郎訪及得聞動靜則云甚安昨日公謹相過廼云近少違和豈非追感悲戚使然邪此事實難遽遣其如無可柰何當推以至理不得不少自寛釋也竊計即日悉已平愈如常不勝瞻想之誠也某至今猶爲風毒所苦情緒蕭然不知名宦何處爲好合宫禮近日益牽忙不勝勉強也其他區區臨別亦甞少道秖得如公西湖之樂一二歳比謀成歸計遂爲田畆之人矣難信之言不敢爲踈者道也相見未期但増引領因風枉問以慰勤企又治平元年某啓公私忽怱乆闕奉狀蓋以衰病交攻心力疲秏而憂責無涯日苟一日是以百事皆廢於因循然亦乆不承惠問但屢見賢姪賢郎得聞動靜新歳晴和不審尊體何似湖園清曠春物嚮榮然尚在遏音必未欲㑹聚其如間適之趣幽靜尤佳毎苦紛勞但深傾羡也老年相知無幾尺書相問略亦無嫌餘暇何惜數字少慰病翁然以自乆無書不敢奉怪也嚮暖千萬加愛又同前某啓乆不蒙惠問方積瞻思指使來忽辱書可勝欣慰兼審靜鎮安閑放懷取適自非嚮用全福何由及此固徤羡之乆矣某疲病不支憂責無際自匪獲罪譴困廢不能薄展㣲効捨是三者未有偷安之計自齒牙浮動飲食艱難切於身者惟此一事旣巳如此其他復何所得然則勉強於茲顧何戀也因仲儀有見憫之言乃略及此經春潤澤稍足相去不逺必同和暖更希爲時自重與王懿恪公君貺至和二年某啓日思奉問別後人事益多端倪但見邸報知已禮上秋冷道塗貴眷各安某幸如常昨受命使北𥘉欲辭免蓋以目疾畏風寒兼多著綿毳衣服不得其如受勑之日北人訃音已至由此更不敢辭因改爲賀使行期頗緩正在嚴凝與君貺行時無異也家中少人照管且移髙橋去薛家稍近然公期管勾徃來湏及百餘日但得回來耳靜便是幸也呵呵自大斾西行羣議遂息請無過慮也佳時美景臨觴之樂不可涯得失外物可置而勿問其餘逹識以道消息故不待言也又嘉祐元年某啓急足至辱書伏承履兹新正台候萬福少慰翹企之素也某尸竊于此思逃罪戾未知其所年齒日増心意日秏歸洛之興何可遏承示許以卜鄰亦一時盛事但湏公功業成爾否泰常理亦難稽乆豈止交親之願也陽候嚮和惟冀以時自愛又嘉祐四年某啓太祝來得詢動靜甚詳尋又辱惠書承經寒尊候萬福門内諸貴愛康安深浣瞻想居秦乆議者皆謂當還不然遷鎮近甸應在朝夕浮議多端惟靜安可以銷弭修唐史已寫進本然卷秩多湏數月方了南去有期心欲飛動過年衰病益侵見諭辯欲加収録此子庸駑詎可出明公門下不柰何爲誤聽但與家人大咍爾徐當議未晚賢郎在都下殊之祗迎悚愧悚愧漸暖爲時自重因賢郎行謹布區區又嘉祐五年某啓近因急足還府略布謝懇即日春寒仰惟鎮撫外台候萬福某尚此遷延又見春花益盛第以目病眩晃不勝飲酒鮮悰爾不審大府花時如何憶曩在彼不甚盛也前承問及石研今且致三枚續當更求佳者咫尺瞻企惟以時自重又嘉祐六年某以衰病碌碌無稱莫塞咎責徒自爲勞區區乆不奉記屢見家人得書承夫人尊候微有違和兼知來召夏醫方欲馳問太祝遽至得聞子細喜已漸安兼見過客言花時名園數有家㑹聞之益用爲慰某自過年兒女多病小女子患目殆今未較日頗憂煎前日太清賞花省自入館惟景祐之㑹以選人獨不與殆今二十五年始遇兹盛事是日兼承見寄絶品雖有已凋者然所存不勝其麗見之病目開豁勉強飲數酌以當佳惠閑恐知也見太祝言來擇壻兹事難於倉卒冝精慎也多日欲作書適聞有專人立草此其他諸懇俟太祝歸時致狀又同前某頓首近於遞中甞獻拙句急足遽至承賜手書兼惠新笋併増感愧竊審春和體況清福普明寺卅年前亂道冝爲削去以藏醜拙廼蒙刋著何以堪之春旱差逺京洛飢民亮煩賑䘏計亦不廢行春也某忽忽少貺真蹟如此冩第未能遂去餘無可言爾薛司勲過府下事有可詢當得其詳惟以時爲朝自重不宣某手啓上留守尚書學士清明日京醖二器聊表意但患人力難致偶薛君有卒擔之爾又同前某頓首啓自薛司勲行後更闕奉狀見家人得十四姨夫人書竊知近苦牙痛道家修養先於固下不冝有此疾然此患中年以後人皆有之患者醫方亦多難得効某數年來頗以爲苦用藥多殊未有驗近於張唐公處得一方他言親用有効然亦未曽合今粗録呈可試用也春旱甚闊逺以貽上心焦勞之慮近躬禱太一遂獲嘉澤河洛間應巳霑足民歳當有望不審邇日爲政外尊體何如更希慎攝因附藥方遞中謹此咨問又同前某啓謝懇巳具如右秋寒台候萬福某衰病忝冒以寵爲憂自省蹇拙曷甞敢萌此望人亦曷甞期此然事出意外猶竊叨據君貺材望德業三十餘年一日歸副具瞻以快士大夫之願老朽之人當在汝隂田畆與農夫野叟相賀人事固常如此所示排擯曽何之恤矧洛政善譽𥘉無間言也恐知之以新忝命人事紛紛致謝稽晚皇恐皇恐又同前某啓自叨竊非望甞於郵中致謝懇即日冬候遂爾凝寒仰惟動履清福某勉強衰病才薄寵益損必隨之親朋見愛何以爲教有望有望見家人言十四姨夫人昨夕違和喜巳平愈公期由此專去省候鄙懷區區因話一可詢問凡諸委瑣不復煩言歳晚憀慄惟以時爲國自重又治平元年某啓嚮自遭國䘏公私事緒旣多而衰病之年憂哀並集餘生朽質殆弗能支顧於人事曠闕交親冝以相寛自春不常拜問然昆弟多在京師薛九與二夫人書信時時獲聞動止即日秋暑猶盛不審寢味如何朝家方恃羣賢共此康濟邊寄雖重難恐淹留未候見間惟以時爲國保重又治平二年某啓專人至辱手書承履此春和台候萬福某衰病眊然思一藏拙之地未能遂心日夕勉強不勝其勞其餘幸悉如常承示諭請覲尚未見奏削安道特地以親爲辭必留滯旌車然辭官亦當俟報爾適以私家少故牽忙作書不周謹惟爲朝自重以副區區又治平三年某啓近併捧遞中專人所惠三書竊承經暑台候萬福貴眷康寧粗慰瞻企諭以請洛之意甚詳自公留滯于外士大夫之論鬱然而當職者負慚與責乆矣今茲所請在理何疑諸公諒不煩丁寧某又可知也有欲知者私門所便備問及爾亦巳盡諭但奏削尚未至爾某瘠病薾然昨屢乞懇以經此詆辱於國體非便第顧勢未得遽去以此強顔成何情況事有所激實如来諭其諸多端匪逺可以面叙本末餘當續報惟酷暑爲時自愛與執政熈寧三年某再拜啓仲夏炎毒伏惟台候萬福某以官守一作守官居外具瞻之地非時不敢通問今迫以懇悃不能自黙某衰病累年中外具察不待煩言自去冬漸難勉強遂有壽陽之請而朝恩未許間以接奉春陽攻注眼目服藥過度渇淋復作遂不能支自三月下旬在假亦兩曽奏知不期於病告中忽蒙此恩選事出意外莫不驚憂竊意朝廷必以居東逾歳別無大過遂以爲可委爾其如東州秖是尋常一大郡無兵馬無邊事又幸豐熟其如老病諸事曠廢處自知極多而過徃不察其詳反以廢職爲少事此其可笑者也并晉一路外鄰二敵使某不病亦不敢當況尫悴不能䇿勵巳具劄子細陳乞􅊵此誤恩敢望台造察其誠實其餘區區常談難信之語更不復云惟早賜允俞免再三煩瀆則大造也不宣書簡卷第三與馮章靖公第五帖獲志一作獲心無涯一作未涯與王懿敏公第五帖古碑斷缺一作古而㫁缺踈拙二字上一有性字第十帖清況一作情况與王懿恪公第九帖致謝懇三字上一有略字第十二帖牽忙此下一有人還二字第十二帖自愛一作愛重初元昊擾邉北虜自以勸和爲功慶暦四年昊旣納欵虜復與之交兵且遣泛使來止昊封册仁宗答書云若以其於北朝失事大之禮自宜問罪若以彼於本朝稽效順之故不煩出師况昊巳遣使齎誓文入界何辭沮却方遣余靖報聘㑹八月甲午保州軍亂宻邇北境朝廷以爲慮癸卯命田况爲真定府定州路安撫使而公自右正言知制誥知諫院除龍圖閣直學士爲河北諸州水陸計度都轉運使兼西路營田都大制置屯田本路勸農使替張昷之時方歸自河東諫官蔡襄孫甫請留公不許上靣諭公勿爲乆居計有事第言之公曰諫官乃得風聞今在外使事有指越職罪也上曰事苟宜聞不可以中外爲辭明年八月坐張氏事降知制誥守滁陽凡河北奏陳皆聚此書云奏議集載契丹侵地界第三狀論憂懼不同極爲詳明與前兩狀相應此卷乃闕而不録莫暁其故今合附入上時相書一首乃慶暦五年二月時杜衍方罷相賈昌朝代之公巳失助首相實章得象而叅政則宋庠也此書舊入奏議尤無謂今移附此卷末庻成全書所云大綱具别𥿄不可得而見矣臣下奏劄例云取進止葉夢得石林燕語甞論之今奏事第一篇作取進旨者按唐陸贄奏議亦甞互用如云中使某乙奉宣進旨㦯云奉宣進止㦯云奉宣聖旨至國初尚多如此慮後人妄塗改略及之紹熈五年十月日郡人王伯芻校正乞條制都作院墮錢墮字疑並勒專工匠疑脫字論契丹侵地界狀蓋其實弱而示彊彊字下長編有爾實弱而示彊六字而殆疑當作怠況於邉要之任乎乎字下長編有然臣謂爲國計者若以北虜爲憂深思極慮而不敢暫忘則其選材任將皆若是乎三十二字臣愚以以字下長編有謂字則又長編無則字尚遟長編作遷論河北財産上時相書仲春王萬福十四字一作新春氣候漸和不審尊候何如備諫諍此上一有忝字次第行之此下一有矣字凢河北大事富公經營之外其要一作凢河北之亊其大者朝廷已委富公矣其外大要故捨此一無故字右河東奉使奏草一卷按仁宗實録慶曆四年四月已亥上謂輔臣上封者數請廢麟州以其饋糧勞民利害如何章得象曰麟州四面蕃漢户皆爲元昊所掠今野無耕民一路困於饋運欲更爲寨徙其州少近府州以省邊民之役上曰州不可廢但徙屯軍馬近府州别置一城亦可紓患乃命右正言知制誥知諫院事歐陽脩徃河東與轉運司同計置㳂邊糧草𥘉本路轉運使張奎鑄鐵錢於晉州民多盗鑄而知并州楊偕請徙麟州於合河津又晉州礬課歲虧併下脩計度之此卷乃當時奏報也按公乞罷刈白草劄子云七月𥘉離汾州又水谷夜行詩我來夏云𥘉素節今已届殆以是月末至闕八月復出爲河北都轉運使當時行狀墓碑不云有河東河北奏草惟摘取其要切數篇入奏議集今旣備載二書則奏議不必重出止就逐卷存其事目使來者有考焉又仁宗實録及李燾長編所収間與此小異蓋經史氏筆削詳具奏議第十六十八卷後舉米光濬狀末云今欲具狀奏聞相度銅利欲牒孫廵檢或者除去欲字是未知古今具槀吏文如此旣云奏草自不須去條列文武官材能劄子可幹者九人雖是九項而有十人姓名見本文論永寧軍捉獲作過兵士劄子此是河北事而元本載之河東奏草末未詳始以爲戒始字恐誤濮議卷第三歐陽文忠公集一百二十二中書請議濮王典禮奏狀韓琦等状奏伏以出扵天性之謂親縁扵人情之謂禮雖以義制事因時適宜而親必主扵恩禮不忘其本此古今不易之常道也伏惟皇帝陛下奮乾之健乘離之明擁天地神靈之休荷宗廟社稷之重即位以来仁施澤浹九族既睦萬國交歡而濮安懿王徳盛位隆宜有尊禮陛下受命先帝躬承聖統顧以大義後其私恩慎之重之事不䡖發臣等忝備宰弼實聞國論謂當考古約禮因宜稱情使有以隆恩而廣愛庻㡬上以彰孝治下以厚民風臣等伏請一本臣等四字却作願字下有司議濮安懿王及譙國太夫人王氏襄國太夫人韓氏仙逰縣君任氏合行典禮詳䖏其當以時施行兩制禮官議狀臣等謹按儀禮喪服為人後者傳曰何以三年也受重者必以尊服服之為所後者之祖父母妻妻之父母昆弟昆弟之子若子若子者言皆如親子也又為人後者為其父母報傳曰何以期也不貳斬也何以不貳斬也持重扵大宗者降其小宗也又為人後者為其昆弟傳曰何以大功也為人後者降其昆弟也以此觀之爲人後者爲之子不敢復顧私親聖人制禮尊無二上若恭愛之心分施扵彼則不得專一扵此故也是以秦漢以来帝王有自旁支入承大統者或推尊父母以爲帝后皆見非當時取譏後世臣等不敢引以爲聖朝法況前代入繼者多宫車晏駕之後援立之䇿或出母后或出臣下非如仁宗皇帝年齡未衰深惟宗廟之重祗承天地之意扵宗室衆多之中簡㧞聖明授以大業陛下親爲先帝之子然後繼體承祧光有天下濮安懿王雖扵陛下有天性之親顧復之㤙然陛下所以負扆端冕富有四海子子孫孫萬世相承者皆先帝之徳也臣等愚淺不達古今竊以為今日所以崇奉濮安懿王典禮宜一凖先朝封贈期親尊属故事髙官大國極其尊榮譙國太夫人襄國太夫人仙逰縣君亦改封大國太夫人考之古今實為宜稱中書進呈劄子準内降翰林學士王珪等奏崇奉濮安懿王典禮宜一準先朝封贈期親尊属故事髙官大國極其尊榮譙國太夫人襄國太夫人仙逰縣君亦改封大國太大人考之古今實為宜稱者伏詳王珪等所奏未見詳定濮安懿王當稱何親名與不名欲乞再下王珪䓁詳定聞奏兩制禮官再議稱皇伯狀臣䓁叅詳真宗大中祥符八年楚王元佐以皇兄詔書不名仁宗即位涇王元儼以皇叔賛拜不名天聖五年加詔書不名此國朝崇奉尊属故事今濮安懿王扵仁宗皇帝其属為兄扵皇帝合稱皇伯而不名謹具狀聞奏伏候敕旨中書請集官再議進呈劄子準内降翰林學士王珪䓁狀稱臣䓁參詳真宗大中祥符八年楚王元佐以皇兄詔書不名仁宗即位涇王元儼以皇叔賛拜不名天聖五年加詔書不名此國朝崇奉尊屬故事今濮安懿王扵仁宗皇帝其屬為兄扵皇帝合稱皇伯而不名者臣等謹按儀禮為人後者為其父母報及按令文與五服年月勑並云為人後者為其所後父斬衰三年為人後者為其父母齊衰期即出繼之子扵所繼所生皆稱父母又漢宣帝光武皆稱其父為皇考今来王珪等議稱皇伯扵典禮未見明有引據伏請下尚書省集三省御史臺官定議聞奏奏慈夀宫劄子二十三日中使韓和齎到皇太后實封劄子一封付中書為尚書省集議濮王典禮事中書檢勘自皇帝登極後應皇親尊屬並各追封加贈惟有濮王并夫人為是皇帝本生父母合下有司檢㝷典禮并前代故事遂具奏請㝷奉聖旨候過諒闇别取㫖近自皇帝釋服從吉遂再奏乞下兩制以上及太常禮院詳㝎㝷據王珪䓁奏稱崇奉濮安懿王典禮冝一凖先朝封贈期親尊屬故事髙官大國極其尊榮中書為未見議定合稱何親再下詳議續據王珪等議稱皇伯中書檢詳儀禮爲人後者爲其父母報及令文與五服年月敕並云爲人後者爲所後父斬衰三年係義服爲人後者爲其父母齊衰期係正服即出繼之子於所繼所生皆稱父母是古今禮律明文其王珪䓁議稱皇伯即前代並無典故須今奏乞下尚書省集官再議只是令議合稱呼何親所有合行尊崇典禮未曽議及今来忽蒙皇太后降出指揮臣䓁竊恐是間諜之人故要衒惑聖聴離間兩宫将前代已行典禮隱而不言但進呈一无呈字皇伯無稽之說欲撓公議臣䓁各是先朝舊臣若於仁宗承繼大統有礙事體豈敢妄爲自取衆人之罪況今来已奉皇帝手詔今權罷集議臣等若不具述前後理道慮皇太后不知始末兼外廷凡百公一作博議若皇太后却欲親見兩府并百官理㑹竊恐有虧聖徳兼臣等限以朝廷規制亦必不敢對見謹具奏聞謹奏稱親手詔朕面奉皇太后慈旨爲議濮安懿王典禮久未施行巳降手書付中書濮安懿王譙國太夫人王氏襄國太夫人韓氏仙逰縣君任氏令朕稱親仍尊濮安懿王爲濮安懿皇王氏韓氏任氏並稱后朕以方承大統懼徳不勝稱親之禮謹遵慈訓追崇之典豈易克當且欲以塋為園増置吏卒守衞即園立廟俾王子孫主奉祠事皇太后諒兹誠懇即賜允從宜令中書門下依此施行牓朝堂手詔朕近奉皇太后慈旨濮安懿王令朕稱親仍有追崇之命朕惟漢一有史字宣帝本生父稱曰親又謚曰悼裁置奉邑皆應經義既有典故遂遵慈訓而不敢當追崇之典朕又以上承仁考宗廟社稷之重義不得兼奉其私親故但即園立廟俾王子孫世襲濮國自主祭祀逺嫌有别蓋欲爲萬世法豈皆權宜之舉㢤而臺官吕誨等始者專執合稱皇伯進一作追封大國之議朕以本生之親改稱皇伯歴考前世並無典據進一作追封大國則又禮無加爵之道向自罷議之後誨等奏促不巳忿其未行乃引漢哀帝去恭皇定陶之號立廟京師干亂正統之事皆朝廷未嘗議及者歴加誣詆自比師丹意欲揺動人情衒惑衆聽以至封還告敕擅不赴臺明繳留中之奏扵中書録傳訕上之文扵都下暨手詔之出誨等則以稱親立廟皆爲不當朕覽誨等前䟽亦云生育之恩禮宜追厚俟样禫既畢然後講求典禮襃崇本親今反以稱親爲非前後之言自相抵牾繼以堯俞等不顧義理更相唱和既撓權而恃衆復歸過以取名朕姑務含容屈扵明憲止命各以本官補外尚慮搢紳之間士民之衆不詳本末但惑傳聞欲釋羣疑理宜申諭宜令中書門下俾御史臺出牓朝堂及進奏院遍牒告示庻知朕意濮議卷第三表奏書啓四六集卷第三歐陽文忠公集九十二辭特轉吏部侍郎表治平元年閏五月受寵若驚況𬒳非常之命事君無隱敢傾至懇之誠仰黷髙明唯知跼蹐臣某中謝伏念臣性姿庸近識局昬冥學古自愚非有適時之用論材甚薄豈堪任重之難徒以荷先帝之誤知自孤生而㧞擢犬馬未報但虞填壑之有時弓劒忽遺遽歎攀髯之莫及而屬皇明繼照聖治惟新送徃事居雖䇿疲駑而自勵進思退𥙷未知罪戾之所逃至於貪踰分之寵榮冀無功之爵賞非惟愚慮所不敢及顧有公議其將謂何而甫兹彌年再以増秩方命書之始下駭群聽以生疑此臣所以剖瀝肺肝不能自止彷徨夙夜莫獲偷安伏望皇帝陛下囬日月之餘光廓乾坤之大度察其悃愊一作迫假以矜寛雖成命巳行國體當嚴於出令而從人之欲天髙幸或於聽卑特收渙汗之恩以息諠譁之論庻安常業誓畢愚衷再辭轉官第一劄子臣此者伏蒙聖恩特除臣吏部侍郎依舊居職臣早來獲對天顔雖略具陳述退而循省未盡懇誠伏念臣本以常材誤蒙任使問其所職則皆朝廷之大事較其成効則無尺寸之可稱外惟碌碌以隨人内則區區而自守當陛下聖政惟新之始勵精求治之時雖天度包容未加斥罷而臣心自揣常負驚憂豈謂冝黜而升當責而賞非惟臣自知不可顧於物論其謂如何況自去年陛下即位之初均慶之典臣巳首叨遷秩今來恩命實出非常在臣之愚難以自處欲望聖慈矜察特賜寢停今取進止第二劄子臣今日伏蒙聖慈差中使傳宣令於後殿告謝臣與趙槩等遂詣垂拱殿門請對欲再具敷陳續奉聖㫖須管便受告勑臣以聖駕巳起君命甚嚴惶惑之間不知所措雖巳受告勑尋於延和殿得對巳曾瀝懇備述聖恩非次義實難安蓋以無功受賞者衆以爲非若竊事爲功則罪又大矣伏以陛下承先帝已定之命入繼大統此天人之意也而即位之始偶因過哀致違和𥙿旣而勿藥有喜聖躬清寧蓋由宗社神靈顯此異事欲彰皇天眷祐陛下使不由人力而致康復而臣今乃貪以爲功坐獲厚賞此臣所謂於義難安者也至於陛下未親庻政之間中外幸得無事此有宋百年四聖相繼威徳在人顧臣等軰有何施設過蒙睿獎以此疇勞況臣猥以庸材參聞國政上所賞罰臣職奉行若羣臣之間有功狀不明迹渉僥倖尚當裁抑以絶濫恩而臣乃自貪寵榮以速議論此臣所以區區不能自巳也故聖恩雖極優異而臣不免屢瀆天聽一作聦伏乞早回聖斷追寢成命俾臣獲安常分以息羣言今取進止第三劄子臣今日伏蒙聖慈差入内髙品陳日新至中書傳宣令臣繫新除官臣尋與曽公亮等具劄子奏乞候來日覆奏伏縁此來恩命出於非常臣與韓琦等進退惶懼夙夜思惟雖君恩至優違則有咎然事體所繫義有難安所恃者睿聖聦明必察臣等懇誠之至聖心寛恕不以臣等屢黷爲煩欲望天慈省閱臣等前後所陳事理曲加裁擇特賜寢停免於此四方旱灾百姓嗷嗷之際是臣等合𬒳責之時濫受非次之賞則臣不勝幸甚臣誠迫意切言不成文干冒冕旒伏俟誅戮今取進止謝特轉吏部侍郎表驟膺渙渥備瀝愚誠雖至辭窮㒺避煩言之爲黷重乎令出莫回成命於巳行祗受以還驚一作兢惶失節臣某中謝伏念臣學不通於元本材不足以經綸但知守拙以爲忠毎務師心而自信徒以遭逢先帝㧞自衆人乆參侍從之聮遂玷機衡之貳而屬大横啓兆嗣統膺期方初政之清明思百度之脩理内量譾薄實憂以聖而責愚矧迫衰殘方念乞身而告病不謂皇慈曲𬒳寵數屢加當覃大慶之初已無功而冒賞曽未踰年之久復進秩以叨榮此蓋伏遇皇帝陛下聖政惟新用人務廣謂才難於求備思恱使以忘勞憫其勤劬錫以優洽雖榮踰於望表亦寵與其憂并誓殫犬馬之微少答乾坤之造乞外任第一表治平二年正月二十三日上二十五日批答不允臣某言臣聞事君以忠本期盡瘁不能者止亦貴自知敢傾悃愊之誠仰瀆髙明之聽臣某中謝伏念臣本由寒素偶踐科埸秖希干禄以養親敢冀逄時而見用蓋以腐儒章句之學豈堪王佐之材童子雕篆之文固異賢人之事而誤蒙睿獎俾貳宰司訖無豪髪之可稱常懼滿盈之必覆加以年齡迫於衰晚氣血損於憂傷惟兩目之舊昬自去秋而漸劇精明晻藹瞻視茫洋冬春以來職業多廢當聖君求治之始是群臣宣力之時自嗟犬馬之微生遽先疲乏惟恃乾坤之大度曲賜含容雖未責於曠官亦難安於尸禄與其坐待於彈劾豈如自乞於哀憐伏望推天地之恩回日月之照察其愚直不敢矯誣許辭政事之名假以州符之寄則臣不止偷安而養拙亦將自療以求痊尚冀昬瞳之復明會圖後効而論報第一劄子臣所有誠懇昨日獲對便坐巳具敷述蓋臣自去年八月喪一女子凡庻常情不免悲苦因此發動十年來乆患眼疾又爲老年全服涼藥不得自深冬巳來氣暈昬澁視物艱難接此春旱陽氣上攻遂至大段妨事然臣愚心秖欲俟壽聖節隨班上壽一展臣子之誠以爲榮幸然後懇求罷去所以勉彊遷延至今縁此是臣私故瑣屑雖臣子之於君父理當無隱然難委曲盡載表章所以先具奏陳冀蒙省察臣以非才過蒙任用使其聦明彊徤猶懼不能稱職況此衰病何以堪處昨日雖面奉聖㫖令且未要入文字蓋臣迫於情懇退不自安今巳具表陳乞伏望聖慈哀許今取進止第二表正月二十六日上二十九日批答不允臣某言臣近貢封章乞解政事伏奉批答不允者天甚仁而溥愛人有欲而必從苟睿聽之未回由懇誠之不至敢干斧鉞再瀝肺肝臣某中謝伏念臣學不通經材非適用徒以遭逢亨㑹進冒寵榮一玷機衡五遷歲律伏遇皇帝陛下握圖撫運嗣統當天覽決萬事則尭舜之聦明愛養群生則禹湯之勤儉賢材並進聖治惟新臣於此時得與大政何脩何飾而可以稱職旅進旅退而莫知所爲巳慚廊廟之訏謨旣無逺略惟有簿書之瑣屑尚可宣勞而苦此雙瞳莫能久視眊然終日兀爾尸居上無以副人主之憂勤下無以伸臣子之報效久而不去罪則奚逃此臣所以夙夕彷徨難安自黙者也伏望皇帝陛下曲回天聽少軫皇慈念臣日侍冕旒察臣心非木石禄位者人情之所顧惜孰肯妄辭筋骸者物理之有盛衰不能無乏哀其可憫寛以不誅俾諧得請之恩當識謝生之所第二劄子臣受國厚恩叨與機政材識庸下不能有所𥙷報上頼聖君含垢未即斥去而又不思勉彊竭力以脩職業輙以衰疾自陳欲圖安便重煩聖念特降中使傳宣賜以訓誨丁寧切至而又頑然未即聽從在臣之罪可誅者非一臣以方具表陳乞理當闔門俟命不得進見闕庭面陳悃愊臣聞自古君臣去就之際與今不同蓋昔之公卿解職便歸田里其朝居君側暮巳絶於朝廷所以臣重去其君君亦難其臣之去然猶去者相繼今則不然凡辭職任者皆不去禄仕或優游侍從之班或出守藩要之地豈爲避寵辭榮乃是免勞就逸實人臣之僥倖也況如臣者尸禄終日無勞可均實以兩目俱昬是十年舊疾自去秋發動日益昬澁看讀文字艱難憂慮職事曠廢有悮國家所以敢布懇誠乞憐君父冀一閑僻處將養三二年或目復清明却乞一邊逺繁難處展効乃是臣自爲僥倖之計與辭榮避寵者不同欲望聖慈不以爲難早賜恩許今取進止第三表正月二十九日上二月二日批答不允臣某言近上表章乞解政事伏蒙聖慈再降批答不允者臣聞事君以忠信爲本立朝以進退爲難惟不自疑乃能取信於上苟無大過庻㡬善退其身昔之爲臣全此者少今臣遇聦明之聖主固不自疑荷保庇之寛仁幸無大過是以敢因疾病直露情誠而封章屢陳俞㫖未賜臣竊謂日月之明無不照豈不諒臣之乃心得非天地之恩有所憐未忍許臣之遽去在臣自揣何以克堪豈合更此多言上煩宸聽所難遂黙蓋切懇私臣某中謝伏念臣以中下之才𬒳非常之任日諧進見則蒙眷待之優隆退接同寮則絶纎毫之間隙自可安然樂職亦復何所憂危況千載一遇者盛時之難逢髙秩厚禄者常情之貪得苟非迫於衰病豈敢固自欺誣伏望皇帝陛下曲軫睿慈俯哀愚欵念其蒲柳質易朽而先衰譬若馬牛力巳疲而則止賜其如請恕以苟安則臣刮膜祛昬尚冀清明之來復捐軀殞命終圖報效於餘生爲雨水爲災待罪乞避位第一表治平二年八月臣某言臣聞任非其人則官必曠職時多闕政則天爲降災惟譴咎之有歸難僥倖於獨免臣某中謝伏念臣本以庸妄遭逢盛明擢貳宰司與聞國論不能叶宣上徳輔導至和頻年巳來害氣交作春飢巳甚饉疫相望秋潦暴興覆溺無數下致生民之愁苦上貽聖主之焦勞臣獨何心安於厥位舉朝廷之典法便合黜幽頼覆燾之寛仁尚容自劾伏望皇帝陛下特回天造俯察愚忠俾解政機推行憲罰以塞上穹之降責以警庻位之脩官然後别選儁賢俾居參輔益圖更化之術上副求治之心自然人神以和災異咸弭不惟臣適其分亦俾國無屈刑第二表臣某言近以雨水之變上表待罪蒙降批答不允者上天告戒比屋罹災䖍思消異之方願避進賢之路特迀聖訓未諒愚誠退自省循豈遑安處臣某中謝伏以天人之相去不逺見於事者若響之應聲賞罰之至要易知舉其大則以一而警百是以政有得而有失則災祥以類而來官若成而若虧則黜陟以時而舉伏念臣猥由愚陋進冒寵榮一貳政機五更歳律相府之事無不揔旣皆得以與聞斯人之居不聊生欲於何而歸咎辜朝廷之委任貽君父之憂勞此而不誅何以勵衆伏望皇帝陛下奮然睿斷赫以皇明理其曠敗之愆正厥經常之法置之散地全以寛恩誓堅犬馬之心終效涓埃之報第三表臣某言近以雨水之災再上表待罪蒙降批答不允仍斷來章者隂沴干時聖心軫慮明詔一下群臣震惶況居任責之司敢爲幸免之計臣某中謝伏惟皇帝陛下自膺眷命光紹丕圖揔覽萬機之繁講求三代之治旰不遑食勵文王之小心行之以勤躬伯禹之盛徳固巳生民受賜品彚蒙休冝召至和以來嘉應而善氣未效時災荐臻惟天聦明異不虚出示人警戒咎必有歸所以三事之臣連章瀝懇況臣最爲濫竊尤玷寵榮方平日以尸居不知引分及敗官而冝罰其敢逃刑伏望皇帝陛下俯抑至慈深思大譴退其不肖以爲脩政之先不以空文庻得應天之實再乞外任第一表治平三年三月二十四日上二十七日批答不允臣聞忠以事上雖見義而必爲力有不能則知難而當止是惟臣子進退之分寔繫國家利害之機則其居也敢懐竊位之安其去也豈止全身之計輙殫拙訥上黷髙明臣某中謝伏念臣本以庸妄出於孤平一作單學不通方識非慮逺徒以遭逢先帝誤𬒳聖知擢自諸生俾參大政伏遇皇帝陛下膺期出震繼統當天方聖政之惟新思群材而並濟臣以衰遲之朽質久當機要以妨賢有守經泥古之愚無應變適時之用考於外論早合黜幽伏蒙皇帝陛下廓大度以兼容謂衆惡者一作之必察特加庇覆俾獲保全固當勉勵疲駑誓圖報效而臣量盈器極福過災生兩目眊昬積年舊苦中消渇涸新歳所加精液銷凘志與神而並耗革膚朘削氣將力以俱殫臣若猶彊殘骸竊貪厚禄坐取敗官之責上累知人之明苟以此致興於人言則乃是可畏之公議異夫誣謗難復主張此臣所以深自揣思敢陳悃迫一作愊伏望皇帝陛下曲回睿眷俯察愚忠念其獲親日月之光頗歴歳時之乆居常碌碌曽莫異於片言一有紛紛遂獨當於衆怒尚乏周身之智豈堪爲國之謀因其自訴於病衰幸俾獲逃於罪戾退之散地得盡餘齡則臣永荷天地之恩敢忘犬馬之報乞出第一劄子臣昨日獲對便坐輙述懇私乞解政事之任縁臣疾患累日氣血虚乏頭目昬眩不能乆立不得乆侍天顔悉陳悃愊伏自濮園之議旣興言事之臣荒唐不學妄執違經非禮無稽之說耻於不用不勝其忿遂厚誣朝廷借以一作臣爲名因乃一作以肆言訕上指臣爲姦邪首議之人陛下至聖至明洞見中書與兩制所議本未察臣無罪曲賜保全而吕誨等附下㒺上語言悖慢無復君臣之禮以至斥黷母后非毀詔書等事陛下皆屈意含容不加顯戮止於退罷而巳及詔定濮王典禮不如誨等所誣旣又詔牓朝堂諭以本末由是中外釋然凡素爲誨等誣誑衒惑之人皆識朝廷本意但恨暁諭之晚今則是非巳正曲直巳分臣所𬒳誣亦巳獲雪然則更何所辨豈合有言而臣義有不得巳者蓋以執政之臣天下之所瞻望朝廷以爲重輕若其名譽烜赫非止一人之榮乃是朝廷之光也其或身名毀辱非止一人之辱乃是朝廷之辱也昔唐文宗甘露事後小人用事宰相李石爲其所惡乃遣盗殺之不中而斷石馬尾石遂求罷文宗雖知石賢相可惜亦不得已而罷石爲荆南節度使蓋顧國體當爾也今臣固無李石可惜之賢而其所𬒳毀辱者何止斷馬尾而巳吕誨等連章累䟽惡言醜詆陛下爲臣愛惜留中而不出誨等自寫章䟽宣布中外今閭巷之人皆能傳誦雖誨等急於賣直取名肆其誣罔不暇惜國體而自爲傳播如臣者豈合彊顔忍耻猶安厥位使天下何所瞻望凡臣所貪以爲榮者乃朝廷之辱也由是言之臣豈得巳哉使臣無疾病猶當懇自一作白引去況臣不幸適值自春來痟渇不止昨日面奉徳音陛下悉巳知臣所苦聖恩憫恤爲之惻然伏望陛下特賜除臣近京一郡俾養衰殘則臣未死之間誓當別圖報効今取進止第二表三月二十八日上四月三日批答不允臣近貢封章願還政事伏蒙聖慈特降批荅不允者臣聞愚誠雖微而茍至可以動天大仁博愛而無私未甞違物敢殫懇悃再冒誅夷臣某中謝伏念臣智識非精器能甚淺禀生竒薄自少甞履於艱虞雖處困窮所守粗知於名節而自早蒙擢用思奮猷爲不善自謀遂致怨仇之積罔知避禍屢觸䧟穽之機先皇帝深察孤忠悉排群議甄収獎進終始保全以至晚年致之二府念𥘉無於報効徒久玷於恩榮逮逢神聖之嗣興顧巳歳時之三易問其職業曽無𥙷於毫分聽於諠譁則不勝於詆辱猶彊尫殘之質坐懷寵禄之貪昔一作古云髙位之疾顚何況千人之所指繼以恙痾之苦􅒒然氣血之衰藥石之功旣難求於速効機政之地豈冝乆於曠官伏望皇帝陛下曲軫睿慈俯哀危懇謂獻納訏謨之任已無益於明時而沮傷憔悴之餘寔難安於乆處許其引避寛以優容儻後來因此以得賢則臣去猶爲於有𥙷茍未填於溝壑誓終竭於㳙埃第二劄子臣近再述懇誠上干天聽乞解重任伏蒙聖慈特降批答丁寧訓誨未賜允俞臣本庸材不堪大用遭逢聖主誤𬒳獎知陛下急於求治取信輔弼言無不從臣於此時不謂不得君不謂不得位而智識駑下𥘉無𥙷報旣不能建明大義鎮遏群言又不能和㑹衆心叶于一徳遂致浮詞異論中外諠譁惟務含胡無一言以辨正但欲因循茍於無事以此養成群小誣謗聖朝上則煩黷睿聦下則自取身辱雖陛下閔臣拙直衆怒獨當察臣暗愚不識䧟穽然臣拙於謀身不堪任用巳驗如此可黜不疑陛下聖度寛仁曲加保庇以爲簮履舊物不忍一旦棄捐然臣夙夜彷徨不能安於自處者蓋以朝廷輕重繫在大臣若大臣望重則朝廷尊大臣望輕則朝廷不重大臣望輕猶爲不可何況惡言醜詆毀辱百端今豺狼當路姦邪在朝之語下傳閭巷外播四夷以是而言何止望輕而巳陛下有臣如此豈不爲朝廷之辱哉雖陛下至聖至明察臣無過臣能自信無愧於心而中外之人不可家至而户暁百辟之瞻望衆人之譏誚臣亦何顔以處之與其負慙俛首以見縉紳孰若乞身逺去少避指目是則聖恩許臣解罷俾臣稍獲便安乃是臣居位也以榮爲辱其去也以黜爲升惟望天慈曲從人欲今臣巳上第二表伏望聖慈曲從人欲除臣蔡亳一州差遣第三表四月𥘉四日上𥘉七日批答不允斷來章臣近以疾患自陳乞解重任伏蒙聖慈再降批答不允者坐貪國寵旣以難安仰呌帝閽期於必逹臣某中謝伏念臣早縁幸㑹親遘休辰以一經之腐儒參萬機之宻論違時背俗速謗招尤雖無獨立弗懼之明粗懷可殺不辱之節所以彊顔忍耻不知軒冕之榮加之多病乆衰難勝筋力之任近從去歳益以中乾渴如鼴䑕之飲河喘若呉牛之見月多言外噪衆疾内攻心已自危豈足當於謀慮力雖欲彊㡬或一作不至於踣顛方奮銳於壯時猶無可道迨摧傷於晚節亦復何堪雖幸聖君容覆之恩豈逭神理滿盈之罰苟不知退其將殞生伏望皇帝陛下推天地之私回日月之照察臣粗識廉耻閔臣遽此衰疲丐以一州俾從素志如此則力排群議已荷於保全遂養殘生更繄於亭育雖同草木之賤尚識造化之仁第三劄子臣近以疾病乞解重任除一蔡亳州差遣巳三上表及兩具劄子陳𫐠伏蒙聖慈累降批答不允斷來章者臣竊伏思惟臣之披瀝肝血祈天請命之懇其說甚詳而其誠至矣陛下毎降答諭丁寜獎朂所以過賜優待臣之恩禮亦巳至矣而臣不能仰遵聖訓功疾就職而猶更哀鳴上煩天聽者蓋臣義不獲已與近日韓琦曽公亮胡宿等從容於進退者事體不同也臣以非才𬒳任違時忤衆自招謗怒不容其身今上自朝廷下至閭閻巷陌逺洎四海外及夷狄皆能傳吕誨等章䟽矣其罔誣醜詆之語莫不能道之矣而臣以顧惜國體旣不當更與誨等辯正便合引避去位而以是非曲直付之公議乃爲合理昔漢世大臣有𬒳誣以罪者例不對理陳冤蓋其人或遂廢黜或𬒳刑誅所以更不自辨可矣未有論議喧沸不自辯明而頑然自安其位者也今朝廷處臣者何位任臣者何事所繫事體者如何而誨等詆臣者何語臣其可安處此位者乎昨濮園之議自手詔告示中外後凡中書論議本未邪正及誨等加誣詆訕等事皆已幸蒙辨正矣惟臣所𬒳邪謀首議姦䛕徼寵之惡名旣不能自辨若又不識㢘耻頑如木石遂安其位陛下謂有臣如此其可當國家之大任乎此臣所以夙夜思惟誨等詆臣者䛕佞希榮寵耳故惟有懇辭重任逺避寵榮乃可以塞小人之口然則陛下聖恩一許臣罷去是爲臣辨誣謗全名節其賜臣者多矣厚於賜以髙秩重禄萬萬也臣幸蒙陛下知獎久矣臣之心迹聖鑒昭然洞見表裏此臣不當復言臣所謂辨誣謗全名節者爲中外之人不可家至户暁者爾蓋非早自引去無以塞誣謗臣者之口也夫爵禄朝廷所以寵臣下也使身心安㤗名譽光顯者居之則不勝其榮也若毀辱媿耻憤悶憂鬱者居之適足爲苦耳伏望聖慈察臣哀切懇迫之誠不以臣比從容於進退者特許臣解罷政事除臣一外任差遣則臣雖死之日猶生之年今取進止第四劄子臣近以疾病乞解重任巳具劄子罄述懇私更不敢重疊叙陳上煩天聽臣以非才誤膺獎任存之旣無所惜去之何足可思然而不早罷去此乃陛下至仁至慈憐臣衰殘不忍遽一作遂便棄捐務欲退人以禮今臣表章劄子各巳三上伏蒙三降批答丁寧訓朂未即允俞中外之人皆知陛下曲意留連恩禮巳足伏乞出自宸斷早賜恩許除臣一外任差遣第五劄子臣昨日獲對威顔備陳懇迫而言意拙訥不能感動愚誠雖切天聽未回夙夜省循莫遑安處臣本庸材不足比數然而職所任者國政身所繫者國體而遭罹誣枉毀辱百端旣不自辨明便當引去加以年齒凋耗疾病侵凌豈可勉彊衰殘不知㢘耻此臣所以披肝瀝血干冒誅夷不能自止者也再念臣材識駑下過蒙陛下獎用固當奮發事業粗立功名上報君恩次雪身辱然臣出入二府已七八年迄無一言建明一事可採以前日之碌碌如此可知後日之無所爲也若終於尸禄偷安茍貪榮寵不惟上辜委遇實亦自負𥘉心蓋材力短長固有不能勉彊若進退名節尚可自擇前世人主之待其臣也事非一端或髙其行義不奪其志或許其閑退俾自安全不必悉以髙秩厚禄但曲從所欲便是君恩伏望聖慈察臣悃愊特許臣所乞則臣未盡之年尚知論報今取進上辭覃恩轉左丞表治平四年正月神宗登極二月上臣某言伏奉制命蒙恩特授臣行尚書左丞依前參知政事加階食邑食實封及賜功臣者澤施無外雖務極於汪洋寵至若驚實難安於唘處敢傾拙訥上黷髙明臣某中謝伏念臣本以妄庸早由平進一經之學乃自守之迂儒十駕其駑終不堪於逺用徒以旦暮千載遭逢兩朝擢貳鈞衡坐淹歳月國恩未報但虞填壑以遺羞金鼎巳成豈謂攀胡之莫及幸遇皇帝陛下重離繼照正統當天萬物覩而咸忻大號渙其均慶致茲孱朽亦玷光華然夫位髙而疾顛者是亦其勢然器滿而必覆者蓋由於量過敢忘戒懼誠迫懇私伏望皇帝陛下特軫睿慈俯矜愚守當萬機之新政收厚賞於無功則臣雖蒲柳之易一作巳衰尚冀㳙埃於後效謝覃恩轉左丞表臣某言云云大慶均行霶流而甚渥鴻恩曲𬒳俯僂以無容臣某中謝伏念臣性質迂愚器能淺陋言不足以備典謨之奥學不足以通治亂之原徒以早荷兩朝之誤知㧞自孤生而獎用疲駑雖一作難勉訖無𥙷於毫分歳月屢遷猶坐貪於寵禄方懼黜幽之典敢希冒進之榮此蓋伏遇皇帝陛下光紹寳圖惟新聖政繼離明而大照推乾施以無偏致此妄庸首霑渙汗臣敢不退思警懼益勵衰疲感風雲際㑹之難依日月光華之未少圖後効冀盡夙心表奏書啓四六集卷第三紹熈三年十月承直郎丁朝佐編次郡人孫謙益校正辭吏部侍郎表幸或一作或幸第三劄子夙夜一作夙夕睿聖一作睿聽近體樂府卷第三歐陽文忠公集一百三十三長短句南歌子鳳䯻金泥帶龍紋玉掌梳走來䆫下笑相扶愛道畫眉深淺入時無弄筆偎人乆描花試手𥘉等閑妨了繡功夫笑問雙鴛鴦字怎生書御街行夭非華艷䡖非霧来夜半天明去來如春夢不多時去似朝雲何䖏乳鷄酒燕落星沉月紞紞城頭皷參差漸辨西池樹朱閣斜欹户緑苔深徑少人行苔上屐痕無數遺香餘粉剰衾閑枕天把多情賦桃源憶故人一名虞羙人影一梅梢弄粉香猶嫰欲寄江南春一作芳信别後寸腸縈一作愁損說與伊爭穩小爐獨守寒灰燼忍泪低頭二字一作無言畫盡眉上萬重新恨竟日無人問二鸎愁燕苦春歸去寂寂花飄紅雨碧草緑楊岐路況是長亭暮少年行客情難訴泣對東風無語目斷兩三煙樹翠隔江淹浦臨江仙一栁外䡖雷池上雨雨聲滴碎荷聲小樓西角斷虹明欄干倚䖏待得月華生燕子飛來窺畫棟玉鈎垂下簾旌涼波不動簟紋平水精雙枕傍有墮釵横二記得金鑾同唱第春風上國繁華如今薄宦老天涯十年岐路空負曲江花聞說閬山通閬苑樓髙不見君家孤城寒日等閑斜離愁難盡紅樹逺連霞聖無憂世路風波險十年一别湏臾人生聚散長如此相見且懽娱好酒能消光景春風不染髭鬚為公一醉花前倒紅䄂莫來扶浪淘沙一把酒祝東風且共從容垂楊紫陌洛城東緫是當時携手䖏遊遍芳叢聚散苦怱怱此恨無窮今年花勝去年紅可惜明年花更好知與誰同二花外倒金翹飲散無憀柔桑蔽日栁迷條此地年時曾一醉還是春朝今日舉輕橈帆影飄飄長亭回首短亭遥過盡長亭人更逺特地魂銷三五嶺麥秋殘荔子𥘉丹絳紗囊裏水晶丸可惜天教生䖏逺不近長安往事憶開元妃子偏怜一從魂散馬嵬關只有紅塵無驛使滿眼驪山四萬恨苦綿綿舊約前懽桃花溪畔栁隂間幾度日高春睡重繡戸深關樓外夕陽閑獨自憑欄一重水隔一重山水闊山髙人不見有淚無言五今日北池遊漾漾輕舟波光㶑灧栁條柔如此春来春又去白了人頭好妓好歌喉不醉難休勸君滿滿酌金甌縱使花時常病酒也是風流定風波一把酒花前欲問他對花何恡一作惜醉顔􅋳春到幾人能爛賞何況無情風雨等閑多艷樹香叢都幾許朝暮惜紅愁粉柰情何好是金船浮玉浪相向十分深送一聲歌二把酒花前欲問伊忍嫌金盞負春時紅艷不能旬日看冝筭湏知開謝只相隨蝶去蝶來猶解戀難見回頭還是度年期莫候飲闌花巳盡方信無人堪與𥙷殘枝三把酒花前欲問公對花何事訴金鍾為問去年春甚䖏虚度鶯聲撩亂一場空今歳春來湏愛惜難得湏知花面不長紅待得酒醒君不見千片不隨流水即隨風四把酒花前欲問君世間何計可留春縱使青春留得住虚語無情花對有情人任是好花湏落去自古紅顔能得幾時新暗想浮生何事好唯有清歌一曲倒金樽五過盡韶華尸作光不可添小樓紅日下層簷春睡覺來情緒惡寂寞楊花繚亂拂珠簾早是閑愁依舊在無柰那堪更𬒳宿酲兼把酒送春惆悵甚長恁年年三月病厭厭六對酒追歡莫負春春光歸去可饒人昨日紅芳今緑樹已暮殘花飛絮兩紛紛粉面麗姝歌窈窕清妙樽前信任醉醺醺不是狂心貪燕樂自覺年來白髮滿頭新驀山溪新正𥘉破三五銀蟾滿纎手染香羅剪紅蓮滿城開遍樓臺上下歌管咽春風駕香輪停寳馬只待金烏晚帝城今夜羅綺誰為伴應卜紫姑神問歸期相思望斷天涯情緒對酒且開顔春宵短春寒淺莫待金杯暖浣溪沙一雲曵香綿彩柱髙絳旗風颭出花梢一梭紅帶往來拋束素羙人羞不打却嫌裙慢褪纎腰日斜深院影空摇二堤上遊人逐畫船拍堤春水四垂天緑楊樓外出鞦韆白髮戴花君莫笑六么催拍盞頻傳人生何䖏似樽前三湖上朱橋響畫輪溶溶春水浸春雲碧瑠璃滑淨無塵當路遊絲縈醉客隔花啼鳥喚行人日斜歸去柰何春四葉底青青杏子垂枝頭薄薄桞綿飛日髙深院晚鶯啼堪恨風流成薄倖斷無消息道歸期托腮無語翠眉低五青杏園林煑酒香佳人𥘉着薄羅裳桞絲揺曵燕飛忙乍雨乍晴花自落閑愁閑悶晝偏長為誰消瘦損容光六紅粉佳人白玉杯木蘭船穩棹歌催緑荷風裏笑聲來細雨䡖煙籠草樹斜橋曲水遶樓臺夕陽髙䖏畫屏開七翠䄂嬌鬟舞石州兩行紅粉一時羞新聲難逐管絃愁白髮主人年未老清時賢相望偏優一樽風月為公留八燈燼垂花月似霜薄簾映月兩交光酒醺紅粉自生香雙手舞餘拖翠袖一聲歌已釂金觴休回嬌眼斷人腸九十載相逢酒一巵故人纔見便開眉老來遊舊更同誰浮世歌歡真易失宦途離合信難期樽前莫惜醉如泥御帶花青春何䖏風光好帝里偏愛元夕萬重繒綵構一屏峯嶺半空金碧寳檠銀釭耀絳幕龍虎騰擲沙堤逺雕輪綉轂爭走五王宅雍容熈熈作晝㑹樂府神姬海洞仙客拽香摇翠稱執手行歌錦街天陌月淡寒䡖漸向曉漏聲寂寂當年少狂心未已不醉怎歸得虞羙人爐香晝永龍煙白風動金鸞額畫屏寒掩小山川睡容𥘉起枕痕圎墜花鈿樓髙不及煙霄半望盡相思眼艷陽剛愛挫愁人故生芳草碧連雲怨王孫鶴沖天梅謝粉栁拖金香滿舊園林養花天氣半晴隂花好却愁深花無數愁無數花好却愁春去戴花持酒祝東風千萬莫怱怱夜行船一憶昔西都懽縱自别後有誰能共伊川山水洛川花細尋思舊遊如夢今日相逢情愈重愁聞唱畫樓鍾動白髮天涯逢此景倒金樽殢誰相送二滿眼東風飛絮催行色短亭春暮落花流水草連雲看看是斷腸南浦檀板未終人去去扁舟在緑楊深䖏手把金樽難為别更那聽亂鶯踈雨洛陽春紅紗未曉黄鸝語蕙爐銷蘭炷錦屏羅幕護春寒昨夜三更雨綉簾閑倚吹輕絮歛眉山無緒看花拭泪向歸鴻問來䖏逢郎否一叢花此篇世傳張先子野詞傷春懷逺幾時窮無物似情濃離愁正恁牽絲亂更南陌飛絮濛濛歸騎漸遥征塵不斷何䖏認郎蹤雙鴛池沼水溶溶南北小橋通梯横畫閣黄昬後又還是新月簾櫳沉恨細思不如桃李還解嫁春風雨中花千古都門行路能使離歌聲苦送盡行人花殘春晚又到君東去醉藉落花吹暖絮多少曲堤芳樹且携手留連良辰羙景留作相思䖏千秋歳數聲鶗鴂又報芳菲歇惜春更把殘紅折雨輕風色暴梅子青時節永豐栁無人盡日花飛雪莫把絲絃撥怨極絃能說天不老情難絶心似雙絲網終有千千結夜過也東䆫未白殘燈滅越溪春三月十三寒食日春色遍天涯越溪閬苑繁華地傍禁垣珠翠煙霞紅粉墻頭鞦韆影裏臨水人家歸來晚駐香車銀箭透䆫紗有時三點兩點雨霽朱門栁細風斜沉麝不燒金鴨冷籠月照梨花賀聖朝影白雪梨花紅粉桃露華髙垂楊慢舞緑絲絛草如𫀆風過小池輕浪起似江臯千金莫惜買香醪且陶陶洞天春鶯啼緑樹聲早檻外殘紅未掃露點真珠遍芳草正簾幃清曉鞦韆宅院悄悄又是清明過了燕蝶輕狂栁絲撩亂春心多少憶漢月紅艷幾枝輕裊新𬒳東風開了倚煙啼露為誰嬌故惹蝶怜蜂惱多情遊賞䖏留戀向緑叢千繞酒䦨歡罷不成歸腸斷月斜春老清平樂一雨晴煙晚緑水新池滿雙燕飛来垂栁院小閣畫簾髙捲黄昬燭倚朱欄西南𥘉月眉彎砌下落花風起羅衣恃地春寒二小庭春老碧砌紅萱草長憶小欄閑共遶携手緑叢含笑别來音信全乖舊期前事堪猜門掩日斜人靜落花愁點青苔應天長一一彎𥘉月臨鸞鏡雲鬢鳳釵慵不整珠簾淨重樓逈惆悵落花風不定緑煙低桞徑何䖏轆轤金井昨夜更䦨酒醒春愁勝却病二石城山下桃花綻宿雨𥘉晴雲未散南去棹北飛鴈水闊山遥腸欲斷倚樓情緒懶惆悵春心無限燕度蒹葭風晚欲歸愁滿面三緑槐隂裏黄鶯語深院無人日正午繡簾垂金鳳舞寂寞小屏香一炷碧雲凝合䖏空役夢魂來去昨夜緑䆫風雨問君知也否涼州今東堂石榴翠樹芳條颭的的裙腰𥘉染佳人携手弄芳菲緑隂紅影共展雙紋簟挿花照影窺鸞鑑只恐芳容減不堪零落春晚青苔雨後深紅點一去門閑掩重來却尋朱檻離離秋實弄輕霜嬌紅脉脉似見燕脂臉人非事往眉空歛誰把佳期賺芳心只願長依舊春風更放明年艷南郷子一翠宻紅繁水國涼生未是寒雨打荷花珠不定輕翻冷潑鴛鴦錦翅斑盡日凭欄弄蘂拈花子細看偷得褭蹄新鑄様無端蔵在紅房艷粉間二雨後斜陽細細風來細細香風定波平花映水休蔵照出輕盈半面粧路隔秋江蓮子深深隱翠房意在蓮心無問䖏難忘泪裛紅腮不記行鵲橋仙月波清霽煙容明淡靈漢舊期還至鵲迎橋路接天津映夾岸星榆點綴雲屏未卷仙鷄催曉腸斷去年情味多應天意不教長恁恐把歡娱容易芳草渡梧桐落蓼花秋煙𥘉冷雨纔收蕭條風物正堪愁人去後多少恨在心頭燕鴻逺羌笛怨渺渺澄波一片山如黛月如鈎笙歌散夢魂斷倚髙樓珠簾捲暮雲愁垂楊暗鎻青樓煙雨濛濛如畫輕風吹旋收香斷錦屏新别人閑玉簟𥘉秋多少舊懽新恨書杳杳夢悠悠更漏子風帶寒枝正好蘭蕙無端先老情悄悄夢依依離人殊未歸褰羅幕凭朱閣不獨堪悲揺落月東出鴈南飛誰家夜搗衣摸魚兒卷繡簾梧桐秋院落一霎雨添新緑對小池閑立殘粧淺向晚水紋如縠凝逺目恨人去寂寂鳯枕孤難宿倚欄不足看燕拂風簷蝶翻露草兩兩長相逐雙眉促可惜年華婉娩西風初弄庭菊況伊家年少多情未巳難拘束那堪更趂涼景追尋甚處垂楊曲佳期過盡但不說歸來多應忘了雲屏去時祝少年遊一去年秋晚此園中携手翫芳叢拈花嗅蘂惱煙撩霧拚醉倚西風今年重對方叢處追徃事又成空敲遍欄干向人無語惆悵滿枝紅二肉紅圎様淺心黄枝上巧如裝雨輕煙重無憀天氣啼破暁來粧寒輕貼體風頭冷忍拋棄向秋光不㑹深心爲誰惆悵回面恨斜陽三玉壷冰瑩獸爐灰人起繡簾開春叢一夜六花開盡不待剪刀催洛陽城闕中天起髙下遍樓臺絮亂風輕拂鞍霑袖歸路似章街行香子舞雪歌雲閑淡粧匀藍溪水染輕裙酒香醺臉粉色生春更雅談話好情性美精神空江不斷凌波何處向越橋邊青柳朱門斷鍾殘角又送黄昬奈眼中涙心中事意中人鷓鴣天學畫宫眉細細長芙蓉出水鬭新粧只知一笑能傾國不信相看有斷腸雙黄鵠兩鴛鴦迢迢雲水恨難忘早知今日長相憶不及從初莫作雙近體樂府卷第三情動於中而形於言人之常也詩三百篇如俟城隅望復關摽梅實贈勺藥之類聖人未甞刪焉陶淵明閑情一賦豈害其爲逹而梁昭明以爲白玉微瑕何也公性至剛而與物有情蓋甞致意於詩爲之本義温柔寛厚所得深矣吟詠之餘溢爲歌詞有平山集盛傳於世曽慥雅詞不盡収也今定為三卷且載樂語于首其甚淺近者前輩多謂劉煇偽作故削之元豐中崔公度跋馮延已陽春録謂皆延已親筆其間有誤入六一詞者近世桐汭志新安志亦記其事今觀延已之詞往往自與唐花門集尊前集相混而桞三變詞亦雜平山集中則此三卷或甚浮豔者殆非公之少作疑以傳疑可也郡人羅泌校正浪淘沙第一篇可惜一作料得第三篇麥秋殘殘一作寒囊裏一作囊褁一從一作自從關驀山溪歌管一作歌吹浣溪沙第二篇樓外一作梢外第五篇𥘉着一作𥘉試夜行船第二篇人去去一作人又去清平樂第一篇又載陽春録應天長三篇並載陽春録第一篇彎𥘉一作鈎新第二篇山遥一作天遥燕度一作忍淚第三篇花間集作皇甫松詞金奩集作温飛卿詞鶯語二集並作梅雨日正午一作春晝午問君知也否諸集並作断腸君信否芳草渡又載陽春録澄波一作清江更漏子又載陽春録情悄悄一作雲杳杳附録卷第三傳神宗實録本傳墨本歐陽脩字永叔唐太子率更令詢之後詢一無此三字四世孫琮爲吉州刺史又八世生萬爲吉州安福令其子孫或居安福或居廬陵萬之八世孫觀脩父也徙居永豐四字一作自觀父徙居吉水至和中析吉水爲永豐今爲永豐人脩四歲而孤母鄭氏有女節以荻畫地教脩書字稍長從鄰里借書讀或手抄之抄未竟而成誦舉進士有聲𥙷西京留守推官召試學士院遷鎮南軍節度掌書記館閣校勘脩爲人質直閎廓見義敢爲機穽在前直行不顧每放逐困㚄輙數年及復振起終不改其操范仲淹貶知饒州論救者衆諫官髙若訥獨不言脩以書責若訥言其不復知人間有羞耻事三十六字一本只作坐以書責諫官髙若訥不論救范仲淹言若訥不復知人間有羞耻事若訥以聞讁峽州夷陵令徙光化軍乾德一有令字改武成軍節度判官遷太子中允館閣校勘修崇文總目一有同脩字禮書總目成改集賢校理知太常禮院數論天下事陜西用師上三䇿以揣敵情及指陳利害甚衆詔百官上封事又上䟽言三敝五事力陳當時之所冝憂者以貧求𥙷外得通判滑州仁宗增諫官貟用天下名士召脩知諫院是時西師乆京東西群盜起中外騷然仁宗既進退大臣欲遂改更諸事范仲淹杜衍韓琦冨弼皆輔政脩屢請召對咨訪責以所爲一有而字仁宗降手詔出六條一有虛心以待四字後遂下詔勸農桑興學校多所更革用脩同修起居注閱月拜右正言知制誥初吕夷簡罷相夏竦爲樞宻使復奪之代以杜衍同時進用冨弼韓琦范仲淹等一無此三十一字石介作慶曆聖德詩言退姦不易進賢之難而終篇意在夏竦竦尤不悅因與其黨造爲黨論二十九字一作詩云云其𬒳指名者皆不悅仲淹衍等柄用欲盡去之因造爲黨論目仲淹衍及脩一有以字爲黨人脩乃止朋黨論其大略言小人無朋惟君子則有之蓋小人所好者利禄所貪者財貨當其同利之時蹔相黨引以爲朋及其見利而爭先或利盡而交踈則反相賊害雖其兄弟親戚不能相保故曰小人無朋君子則不然所守者道義所行者忠信所惜者名節以之脩身則同道而相益以之事國則同心而共濟終始如一故君子有一有多字朋也又上䟽言杜衍韓琦范仲淹冨弼相繼罷去天下皆知其有可用之賢而不聞其有可罷之罪自古小人讒害忠賢一作良其說不逺欲廣䧟良善不過指爲朋黨欲動揺大臣必湏誣以專權其故何也去一善人而衆善人尚在則未爲小人之利欲盡去之則善人少過難爲一無此字一一求瑕唯是指以爲朋則可一時盡逐至如自古大臣已𬒳主知而蒙信任則難以他事動揺惟有專權是上之所惡必湏此語方可傾之正士在朝群邪所忌謀臣不用敵國之福也一無此字今此四人一旦罷去而使群邪相賀於内四夷相賀於外臣所以爲陛下惜之也爲黨論者尤惡脩異巳又善言其情狀至使内侍藍元震上䟽言范仲淹歐陽脩尹洙金靖前日蔡襄謂之四賢斥去未㡬復陞天衢四賢得時遂引蔡襄以爲同列下則以國家爵禄爲已私惠上則朋黨膠漆皆聚本朝設使逐人私黨不過十數同心醜正已爲五六十人相依爲重將紊紀綱九重至深萬機至重一有陛下二字何由察知頼仁宗一有􅐶聖二字終不之信一作終察其姦脩之使河東以陜西用兵乆河東芻粮不足言者請廢麟州或請移治合河津或請廢五寨脩爲四議以較麟州利害請移兵就食於濵河一作河濵清塞堡緩急不失應援平時可省餽運麟州得不廢又建言忻代岢嵐火山四郡有禁地棄而不耕民私糴虜中以應軍湏今悉耕之歲可得數百萬石以實邊又言河東民故貧軍興以來賦歛尤重行路嗟怨條上可罷者數十事以寛民力脩自河東還㑹保州兵叛出脩爲龍圖閣直學士河北都轉運使保州平大將李昭亮私納婦女通判馮博文等竊効之脩捕博文繫獄昭亮皇恐立出之自保州之變河北兵驕小不可意則思亂人情務在姑息脩乞假將帥權一有事從鎮三字重以消未萌保塞之脅從者二千餘人分隷河北夏竦爲宣撫使事迹神道碑並以爲冨鄭公曰是去禍而遺根也欲以便冝誅之脩權知成徳軍遇之於内黃竦夜半屏人以告脩脩曰禍莫大於殺降昨保州叛卒朝廷許以不死今戮之矣此曹本以脅從故得脫柰何一旦殺無辜二千人既非朝㫖諸郡且不肯從緩之則籍籍必生變是趣之爲亂也一有且脩至鎮州必不從命九字遂止河決澶淵陳執中欲塞商胡決横隴故道脩言功大必一作恐不可成徒勞人一有未㡬二字執中罷一有去字文彦博復用李仲昌議欲開六塔河脩言六塔河不能吞伏且復決再爭之不得既而濵徳博數千里皆被一有水字害初脩出河北仁宗靣諭曰勿爲乆居計有事言來脩對曰諌官乃得風聞今在外使事有指越職罪也仁宗曰有事但以聞勿以中外爲詞爲黨論者愈益惡之一有務爲竒巧以中六字脩妹適張龜正龜正無子而死有龜正一無二字前妻之女才四歲無所歸以俱來及笄脩以嫁族兄之子晟張氏後在晟所與奴姦事一無此字下開封府一作獄獄吏附致其言以三字一作曖昧之言及脩乃以戸部判官蘇安世内侍王昭明雜治之卒無秋毫乃三字一本只作狀坐用張氏匳中物買田立歐陽氏劵左遷知制誥知滁州一本有用事者猶不快意坐安世昭明以移三司取録問吏不先聞皆奪官二十六字乆之遷起居舎人知揚州徙潁州復龍圖閣直學士知應天府以母憂去既免喪入見仁宗惻然怪脩髪白問在外㡬年今年㡬何恩意甚至命判流内銓小人恐脩復用偽爲脩奏乞澄汰内侍兩省挟威令爲姦利者書騰都下宦者人人切齒楊永徳者隂以言中脩出知同州外議不平論救者衆遂留刋修唐書爲翰林學士加史館修撰勾當三班院改侍讀學士知蔡州未行復爲翰林學士判太常寺脩在朝以奨進天下士爲已任延譽尉薦極其力而後巳於經術治其大㫖不爲章句不求異於諸儒景祐中與尹洙皆爲古學巳而有詔戒天下學者爲文使近古學者盡爲古文而脩之文章遂爲天下宗匠蜀人蘇洵甞論脩文章詞令雍容似李翶切近適當似陸贄而脩之才亦似一作自過此二人至脩作唐書志一無此字五代史叙事不愧劉向班固也權知貢舉文士以新竒相尚文體大壞脩深革其弊前以怪僻在髙第者黜之幾盡務求平淡典要士人初怨怒罵譏中稍信服已而文格變而復正拜右諫議大夫判尚書禮部又判祕閣祕書省加兼侍讀辭不受同修玉牒兼龍圖閣學士權知開封府承包拯威儀之後一切循理不事風采或以為言脩曰人材性各有短長實不能舎所長彊其所短以給事中罷同提舉諸司庫務改群牧使唐書成拜禮部侍郎一有遂字為樞宻副使與曽公亮同力振舉紀綱革去宿弊考天下兵數及三路屯戍㡬何地里近逺皆為圖籍未㡬參知政事預定策立英宗為皇子事見韓琦傳十四字一作仁宗失襃豫鄂三王後遂無皇子至和三年正月疾暴作數十日不能朝中外憂恐乆乃康復自是言者常以立皇子固天下根本爲急包拯范鎮所言尤激切其餘不為外人所知者不可勝數冨弼韓琦亦屢進說脩因水災亦再上䟽每輙留中不下如此五六年言者亦巳稍怠嘉祐六年内出諫官司馬光知江州吕誨言立皇嗣事脩與韓琦曽公亮奏事垂拱殿讀二章畢未及有所啓仁宗遽曰朕意亦决矣但未得其人左右顧曰宗室中誰可者琦皇恐對曰此事非臣下敢議當巳簡在聖心仁宗即道英宗藩邸名且曰今三十許歲矣琦等乃議定又奏曰此事至大陛下今夕更思之明日奏事崇政殿又啓之仁宗曰決無疑矣於是琦等言事當有漸乃以英宗判宗正寺而英宗猶在濮王喪辭讓再三有旨聽終䘮七年二月服除英宗稱疾堅卧不起至七月琦議曰宗正之命初出則外人皆知必為皇子也不若遂正其名使知愈讓而愈進示朝廷有不可回之意公亮脩皆以為然琦乃以英宗累表進仁宗問如何琦未對脩進曰宗室不領職事忽有此除天下皆知陛下将立為皇子也不若遂正其名且判宗正寺誥敕付閤門得以不受今立為皇子上用一詔書告天下事即定矣仁宗湛思乆之顧韓琦曰如此莫亦好不琦力賛之仁宗曰如此則明堂前了當遂降詔書而中外晏然嘉祐之事脩自序云爾英宗初年未親政事慈聖光獻太后垂簾脩與二三大臣佐佑兩宫鎮撫四海執政聚議事有未可脩未甞不力爭臺諫官至政事堂論事往往靣折其短英宗甞靣稱脩曰性直不避衆怨脩亦嘗稱誦故相王曽之言曰恩欲歸已怨使誰當自嘉祐以後朝廷務惜名器而進人之路稍陿脩屢建言館閣育材之地人材既難得而又難知則當博采而多畜之時冀一得於其間則傑然出爲名臣矣餘亦不失爲佳士也遂詔韓琦曽公亮趙㮣及脩各舉五人其後中選者多在清近朝廷亦稍收其用矣京師百司所行兵民官吏財用皆無總數中書一有行移則下有司考㑹脩因暇日盡以中書所當知者集爲總目上有所問宰相以總目對脩以奉祠假一無此字家居上遣内侍就中書閣取而閱之蔣之竒言脩帷箔事事連其長子婦脩杜門請付有司案治詔詰問之竒語所從来之竒言得之彭思永思永言出於風聞曖昧無實甞戒之竒勿言天子為其辭窮降思永知黄州之竒監道州酒遣中使手詔慰安脩脩遂稱疾力解機務以觀文殿學士刑部尚書知亳州年六十矣乞致仕者六不從遷兵部尚書知青州除檢校太保宣徽南院使判太原府三辭不受徙知蔡州以老病乞骸骨章數上乃為觀文殿學士太子少師致仕卒年六十有六贈太子太師一有謚文忠三字太常初謚曰文四字一作初請謚文常秩曰脩有定䇿之功請謚一有曰字文忠乃用之方英宗亮隂而脩以治平元年五月建議濮安懿王徳盛位隆冝有尊禮詔湏大祥後議之一作定二年四月乃詔禮官與待制以上詳議而有司以為冝凖先朝封贈期親尊屬故事尊以髙官大國朝廷以典禮未稱下尚書省集三省御史臺官議奏一無官奏二字而皇太后手書以議事詰責執政於是手詔罷議令有司博求典故以聞御史吕誨等彈奏脩首𨳩邪議琦公亮槩附㑹不正請如有司所議而脩論本生之親改稱皇伯歷考前世並無典據進封大國則又禮無加爵之道已而皇太后出手書濮安懿王及譙國太夫人王氏襄國太夫人韓氏仙㳺縣君任氏可令皇帝稱親仍尊濮安懿王為皇三夫人三字一作王氏韓氏任氏並稱后是日手詔欲遵慈訓稱親而不敢當追崇之典誨及范純仁傅堯俞趙瞻趙鼎論列不巳英宗問執政當如何脩對曰御史以為理難並立臣等有罪即留御史若以臣等為無罪則取聖㫖英宗猶豫良乆乃令出御史而曰不冝責之太重蔣之竒者私論濮園事與脩合脩薦之時已用王珪等所薦御史孫昌齡郭源明黄照又特批以之竒為御史論者以此短脩脩議濮園事雖不叶群議觀脩結髪立朝讜直不回身任衆怨至於白首而謗訕不已卒以不汚年六十以一有大臣二字論政不合固求去位可謂有君子之勇而言者指脩既為執政行私以專寵禄亦過矣脩博極群書好學不倦集三代以來金石刻為一千卷校正史氏百家譌謬之說為多所著易童子問三卷詩本義十四卷居士集五十卷内外制奏議四六集又四十餘卷子發奕棐辯重修實録本傳朱本葉濤脩字永叔唐太子率更令詢之後詢裔孫萬為吉州安福令其子孫因家焉至脩父觀始徙居永豐脩四歳而孤母鄭氏力教以讀書爲文及冠舉進士翕然有聲𥙷西京留守推官召試學士院遷鎮南軍節度掌書記館閣校勘時范仲淹以陳時政得失不顧避忤宰相意貶知饒州論救者甚衆而諌官髙若訥獨含胡不言脩以書質責若訥至以爲不知人間有羞耻事若訥大憤連其書以聞坐貶峽州夷陵令徙光化軍乾徳令改武成軍節度判官遷太子中允館閣校勘預修崇文總目書成改集賢校理知太常禮院出通判滑州慶曆初吕夷簡以老病在相位主斷既乆天下事積成抏弊不思所以振治而最後元昊盜邊陜右師老兵頓天子憂之未知所出一日夷簡罷相夏竦爲樞宻使既除復罷而更用杜衍又范仲淹冨弼韓琦同時擢執政收攬一時名士増諫官貟而脩首在選中擢太常丞知諌院脩極力左右時事屢請召對執政責以時所可爲於是仁宗開天章閣給二府筆札令具所以施行條上其後下詔勸農桑興學校於僥倖多所裁革脩之發明居多是時執政皆脩素所厚善而脩所言事一意徑行略不以形迹嫌疑顧避亦卒無懷利附㑹之實天下之士知其立朝有本末質行正直一有亦字頗推許之於是小人自此側目而黨人之論作矣初石介作慶曆聖徳詩言進賢退姦之不易其指以美杜衍等進而竦見黜也竦既懷不滿因與其黨造爲黨論目仲淹衍及脩爲黨人脩乃上朋黨論其大略言小人無朋惟君子則有之如書曰受有臣億萬惟億萬心周有臣三千惟一心紂億萬人各異心可謂無朋矣而紂用以亡武王之臣三千人可謂大朋矣而周用以興蓋君子之朋雖多而不厭故也俄擢同修起居注閱月拜右正言知制誥於是爲黨論者惡脩擿語其情状至使内侍藍元震宻上䟽言范仲淹歐陽脩尹洙余靖前日蔡襄謂之四賢斥去未㡬復還京師四賢得時遂引蔡襄以爲同列以國家爵禄爲私惠膠固朋黨苟以報謝當時歌詠之徳今一人私黨止作十數合五六人門下黨與巳無慮五六十人使此五六十人逓相提挈不過三二年布滿要路則誤朝迷國誰敢有言挾恨報讎何施不可九重至深萬機至重何由察知然仁宗終不之信也㑹𬒳㫖使河東河東自陜西兵興芻糧久不繼言者屢請廢麟州脩請移兵就食一有於字濵河諸堡使緩急不失應援平時可省餽運一有而字麟州以故不廢又建言忻代州岢嵐火山軍故時並邊皆民田潘美患虜入㓂乃使民内徙空其地號禁地自後虜人歳盜耕不已請益募民賦田入租歲可得榖數百萬斛給邊仍計頃出丁爲兵不者他日盡爲虜所有矣朝廷從之會保州兵叛出脩爲龍圖閣直學士河北都轉運使仁宗靣諭曰勿爲乆居計有事第言之脩對以諫官乃得風聞今在外使事有指越職罪也仁宗曰事苟冝聞豈可以中外爲辭耶甞上䟽言今杜衍韓琦范仲淹冨弼相繼罷去天下皆知其有可用之賢而不聞其有可罷之罪自古小人敗事其說不逺欲廣陷良善不過指爲朋黨欲動摇大臣必湏誣以專權者蓋去一善人而衆善人尚在則未爲小人之利欲盡去之則善人少過難以一一求瑕唯是指以爲朋則可一時盡逐至如自古大臣巳𬒳主知而蒙信任則難以他事動揺惟有專權是上之所惡方可傾之夫正士在朝群邪所忌謀臣不用敵國之福今此四人一旦罷去而使群邪相賀於内四夷相賀於外此臣所以爲陛下惜之也於是爲黨論者愈益忌之初脩妹適張龜正龜正卒無子而有女女實前妻所生甫四歲以無所歸其母擕養於外氏及笄脩以嫁族兄之子晟㑹張氏在晟所與奴姦事下開封獄獄吏因附致其言以及脩詔以戸部判官蘇安世内侍王昭明雜治之卒無狀乃坐用張氏匳中物置田立歐陽氏劵左遷知制誥知滁州乆之遷起居舎人知揚州徙潁州復龍圖閣直學士知應天府以母憂去既免䘮入見仁宗惻然怪脩髪白問在外㡬年今年㡬何恩意甚至命判一有吏部二字流内銓小人恐脩復用乃偽為脩奏乞汰内侍挾威令爲姦利者一有於是二字宦者人人忿怨楊永徳者隂以言中脩出知同州外議不平仁宗復悟留刋修唐書為翰林學士加史館修撰勾當三班院改侍讀學士知蔡州未行復為翰林學士判太常寺時文士以磔裂怪僻相尚文體大壞及是脩知貢舉深革其弊前在髙第者盡黜之務求平淡典要士人初怨怒罵譏已而文格卒變拜右諫議大夫判尚書禮部又判祕閣祕書省加兼侍讀辭不受同修玉牒兼龍圖閣學士權知開封府以給事中罷同提舉諸司庫務改群牧使唐書成拜禮部侍郎為樞宻副使甞因水災凡再上䟽請立皇子言甚激切未幾參知政事與韓琦等恊定大議立英宗巳而英宗力辭宗正之命脩進曰宗室不領職事今忽有此除天下皆知陛下将以為嗣也則不若遂正其名且宗正誥勑付閤門故得不受若立為皇子則止降一詔書大事定矣不可辭也仁宗以為然遂下詔及英宗以疾未親政事慈聖光獻太后垂簾脩與二三大臣主國論每簾前奏事或執政聚議事有未可脩未甞不抗是非力爭臺諫官至政事堂論事事雖非已出同列未及啓口而脩巳直前折其短以至士大夫建明利害及所祈請前此執政多媕阿不明白是非至脩必一二數之曰某事可行某事不可行用是怨誹者益多英宗甞靣稱脩曰性直不避衆怨脩亦甞稱誦故相王曽之言曰恩欲歸已怨使誰當及上即位御史蔣之竒言脩帷箔事事連其長子婦呉氏脩杜門請付有司案治先是脩妻之從弟薛宗孺坐舉官𬒳劾内冀㑹赦免而脩乃言不可以臣故徼幸乞特不原以故宗孺坐免官而怨脩切齒因構為無根之言苟欲以汙辱脩㑹劉瑾亦素仇家乃騰其謗以語中丞彭思永思永間以語之竒之竒始以私議濮王事與脩合而脩特薦為御史時方患衆論指目為姦邪及得此因亟持以自解於是詔詰語所從來之竒言得之思永思永以與瑾同郷里且相習熟故力抵以爲風聞天子為三字一作上以其辭窮降思永知黄州之竒監道州酒遣中使手詔慰安脩脩遂稱疾力乞解機務以觀文殿學士刑部尚書知亳州時脩年六十乃連六表乞致仕不從遷兵部尚書知青州以擅止散青苗錢詔特放罪除檢校太保宣徽南院使判太原府三辭不受徙知蔡州以老病乞骸骨章數上乃為觀文殿學士太子少師致仕卒年六十六贈太子太師太常初謚曰文常秩曰脩有定策之功請加以忠乃謚曰文忠初英宗即位按祖宗故事追贈宗室尊屬至濮安懿王中書以本朝未有故事請付有司詳議英宗謙恭重其事詔湏大祥後議之後乃詔禮官與待制以上詳議而有司以爲王當稱伯改封大國朝廷以典禮未正再下尚書省集議而一作㑹皇太后手書以議事詰責執政於是手詔權罷議令有司博求典故以聞御史吕誨等彈奏脩首開邪議琦公亮槩附㑹不正請如有司所議脩論本生之親改稱皇伯歷考前世皆無典據進封大國則又禮無加爵之道巳而皇太后出手書曰濮安懿王及譙國太夫人王氏襄國太夫人韓氏仙㳺縣君任氏可令皇帝稱親仍尊濮安懿王爲皇三夫人並稱后是日手詔欲遵太后手書稱親而不敢當追崇之典誨及范純仁傳堯俞趙瞻趙鼎論列不巳英宗問執政當如何脩對曰御史以爲理難並立若以臣等有罪即留御史若無罪則惟聖㫖是聴英宗猶豫良乆乃令出御史其後脩著濮議引䘮服記曰爲人後者爲其父母報報者齊衰期也謂之降服親不可降䧏者降其外物爾䘮服是也其必降者示有所屈也以其承大宗之重尊祖而爲之屈爾屈於此以伸於彼也生莫重於父母而爲之屈者以見承大宗者亦重也此以義制者也父子之道天性也臨之以大義有可以降其外物而本之於一作以至仁則不可絶其天性絶人道而滅天理此不仁者之或不爲也故聖人制服爲降三年爲朞而不没其父母之名以見服可降而名不可没也此以仁存心者也又曰今議者欲以爲人後之故使一旦反視父母若未甞生我者其絶之已甚矣使其真絶之歟是非人情也迫於義而僞絶之歟是仁義者敎人爲偽者也所議大略如此國朝接唐五代未流文章專以聲病對偶爲工剽剥故事雕刻破碎甚者若俳優之辭如楊億劉筠輩其學博矣然其文亦不能自拔於流俗反吹波揚瀾助其氣勢一時慕効謂其文爲崑體時韓愈文人尚未知讀也脩始年十五六於鄰家壁角破簏中得本學之後獨一作卒能擺棄時俗故歩一有獨字與司馬遷賈誼揚雄劉向班固韓愈柳宗元爭馳逐侵㝷乎其相及矣是時尹洙與脩一無二字亦皆一無此字以古文倡率學者然洙材下人莫之與至脩文一出天下一有之字士皆嚮慕爲之唯恐不及一時文字大變從古庻㡬乎西漢之盛者由脩發之然至論易則以繫辭非孔子之言論周禮則疑非周公所作是以君子之愛其文者猶嘆息於斯焉脩性剛直處善惡黒白分明於當路有權勢者雖知其設機穽見待必直前觸發之不顧其放逐流離至數年者屢矣而復振起志氣故自若也脩雖以文雄一時然無忌前好勝之氣喜推轂賢士而身下之一時聞人多出其門嘉祐間朝廷進人之路陿脩建言以館閣多蓄人材後詔韓琦曽公亮各舉六人歐陽脩趙㮣各五人一時得士爲多脩集三代以來金石刻爲一千卷頗是正譌謬所著易童子問三卷詩本義十四卷居士集五十卷内外制奏議四六集又四十餘卷子發奕棐辯附録卷第三集古録跋尾卷第三歐陽文忠公集一百三十六後漢費鳳碑歲月見本文右漢費鳳碑云集本有君諱鳳三字字伯蕭梁相之元子也集本無也字漢安二年舉孝廉拜郎中除陳國新平長又云試守故障長其文班班可見而卒葬年壽皆不載其後悉爲五言韻語其略曰不悟集本作語奄忽終藏形而匿景集本作影耕夫釋耒耜桑女投鈎筥道阻而且長起坐淚如雨其文旣非工故不悉録八字集本作文字工拙古今皆然惟漢隷難得故録爾熈寧二年十一月十六日山齋書右真蹟略曰一作云後漢武班碑歲月見本文右漢班碑者蓋其字畫殘滅不復成文其氏族州里官閥卒葬皆不可見其僅見者曰君諱班爾其首書云建元年太歲在丁亥而建下一字不可識以漢書考之後漢自光武至獻帝以建名元者七謂建武建初建光建康建和建寧建安也以歷推之歲在丁亥乃章帝章和元年後六十一年桓帝即位之明年改本初二年爲建和元年又歲在丁亥則此碑所缺一字當爲和字真蹟無此六字迺建和元年也碑文缺滅者十八九惟亡者多而存者少尤爲可惜也故録之治平元年四月二十日書右集本後得别本模榻粗明始辨其一二云武君諱班乃易去前本熈寧二年九月朔日記後漢中常侍費亭侯曹騰碑歳月見本文真蹟右漢中常侍費亭侯曹騰碑文字磨滅其粗可見者云維建和元年七月二十二日已已皇帝若曰其遣費亭侯之國其餘不可識也建和桓帝即位之元年也後三十七年獻帝中平元年騰養子操始爲騎都尉集本有領兵二字擊黄巾矣治平元年六月十日書後漢司隷楊君碑歲月見本文右漢司隷校尉楊厥碑云惟巛靈定位川澤攸同澤有所注川有所通余谷之川其澤南隆八方所逹益城爲充髙祖受命興於漢中道由子午出散入秦建定帝位以漢詆焉後以子午塗路澀難更隨圍谷復通堂光凡此四道垓鬲允艱至於永平其有四年詔書開余鑿通石門中遭元二西夷虐殘橋梁斷絶子谷復循於是故司隷校尉犍爲武陽楊厥字孟文深執忠伉數上奏請廢子由斯得其度經至建和二年漢中太守王升字稚紀嘉君明知羙其仁賢勒石頌徳以明厥勲其辭大略如此其刻畫尚完可讀大抵𫐠厥修復斜谷路爾但其用字簡省復多舛繆惟以巛爲坤以余爲斜漢人皆爾獨詆字未詳永平明帝建和桓帝年號也右集本後漢樊常侍碑歲月見本文右漢樊常侍碑云君諱安字子佑南陽湖陽人也君㓜學治韓詩論語孝經歷中黄門拜小黄門小黄門右史遷藏府令中常侍年五十有六永壽四年四石本作二月甲辰卒其先爲中黄門後爲小黄門又爲小黄門右史蓋漢官之制今不詳其次序也余少家漢東天聖四年舉進士赴尚書禮部道出湖陽一本作間見此碑立道左下馬讀之徘徊碑下者乆之後三十年始得而入集録蓋初不見録于世自予集録古文時人稍稍知爲可貴自此古碑漸見収采也右集本後漢郎中鄭固碑固一本作宣歲月見本文右漢郎中鄭固碑文字磨滅其官閥卒葬年月皆莫可考其僅可見者云君諱固字伯堅孝友著于閨門至行立乎郷黨初授業於歐陽仕郡諸曹掾史主簿督郵五官掾功曹又曰忠以衛上清以自修其餘殘缺不復成文又云延熹元年二月詔拜而不見其官惟其碑首題云漢故郎中鄭君之碑以此知其官至郎中爾漢隷刻石存於今者少惟余以集録之勤所得爲獨多然類多殘缺一作滅不完蓋其難得而可喜者其零落之餘尤爲可惜也延熹元年二月之下一本云詔拜郎中非其好也以疾錮辤年四十二遭命殞身而中間又有逡遁退讓之語遁當作循錮當作固疑漢人用字多假借又疑以疾錮辤謂疾巳堅固若云以疾篤辭覽者詳之右集本後漢田君碑歳月見本文真蹟右漢田君碑今在沂州其名字皆巳磨滅惟云其先出自帝舜之苗裔自完適齊因以爲氏乃知爲姓田爾又云周秦之際家於東平陽君緫角修韓詩京氏易真蹟作易京氏究洞神變窮奥極微爲五官掾功曹州從事辟太尉延熹二年辛亥詔書泰山瑯耶盗賊未息州郡吏有仁惠公清撥煩整化者試守滿歲爲真州言名時牧劉君知君宿操表上試守費自此以後殘鈌不可次第而隱隱可見蓋無年壽卒葬月日而有故吏薛咸等立石勒銘之語乃費縣令長徳政去思碑爾治平元年六月二十九日書後漢孫叔敖碑延熹三年右漢孫叔敖碑云名饒字叔敖而史記不著其名而見於他書者亦皆曰叔敖而已微斯碑後世遂不復知其名饒也此集本無此字碑世亦集本作所罕傳余以集録二十年間求之博且勤乃得之然則世之未見此碑者猶不知爲名饒也謂余集古爲無益可乎集本無此右真蹟九字後漢王元賞碑歲月見本文右漢王元賞碑云君諱某字元賞御史君之孫茂才君之子也歷秦及漢有國有家宰相牧守踵武相襲又曰遭父喪以孝立稱土堦環堵兼業並受門徒雨集盛於洙泗又云郡察孝廉郎中謁者宛陵丞封丘令母憂去官服祥辟司空府延熹四年五月辛酉遭命而終其文字磨滅隱隱可見者如此其名旣亡又不序其姓惟其銘云於惟王君以此知其姓王爾右集本後漢祝睦碑歲月見本文真蹟右漢祝睦碑云君諱睦字元其下遂缺滅不能成文惟其官壽年月可見云賔于王庭除北海長史潁川郾令辟司空府北軍中候拜大尚書尚書僕射遷常山相山陽太守年六十有八延熹七年八月丁巳卒睦有二碑皆在今南京虞城縣此碑不見世次而隱隱有云其先髙辛尔其後碑則頗完故録于次也治平元年六月立秋日書後漢祝睦後碑延熹七年右漢祝睦後碑其前碑不知所立人名氏兩碑所載官閥壽考年月悉同而此碑有立碑人名氏及睦世次云故吏王堂等竊聞下有述上之功臣有叙君之徳又曰君􅖕自黎辛祝融苗胄鄭有祝􅡭君其胤也其餘文字亦完可讀二銘皆以三言爲文而後銘尤完云穆我君邦之陽資五就闓道綱綱下滅一字表微準樞衡稽列宿覽四方徳合乾道應皇領二郡曜重光化流洽緄豳昌性天約元用長頌聲作謡令香功烈著遺椒芳存覿榮淪弗忘其後二句磨滅難詳故録其成文以見其雅質亦可佳也治平元年六月立秋日書右真蹟後漢衡方碑歲月見本文真蹟右漢衡方碑云府君諱方字興祖其先伊尹在殷號稱阿衡因而氏焉又曰州舉孝廉除郎中即丘侯相膠東令州舉尤異遷㑹稽東部都尉又拜議郎北平太守遷潁川太守又曰拜歩兵校尉年六十有三建寧元年二月五日癸丑卒於是海内門生故吏采嘉石樹靈碑鐫茂伐祕將来此其始終之大略其餘歴歷可見而時亦磨滅以其文多不備録也治平元年六月三日書後漢冀州從事張表碑歲月見本文真蹟右漢冀州從事張表碑云君諱表字元異其碑首題云漢故冀州從事張君碑而文爲韻語叙其官閥不甚詳但云春秋六十四以建寧元年三月癸巳蘉疾而終其辭有云仕郡爲督郵鷹撮盧擊是以狗喻人集本有也字又有畔桓利正之語蓋漢人猶質不嫌取類於鷹犬畔桓疑是盤桓集本有漢時二字文字簡少假借尓治平元年六月廿九日書後漢竹邑侯相張壽碑歲月見本文右漢竹邑侯相張壽碑云君諱壽字仲吾其先晉大夫張老盛徳之裔孝友恭懿明允篤信博物多識獵一作略渉傳記臨疑獨照確然不撓有孔甫之風舉孝廉除郎中給事謁者遷竹邑侯相年八十建寧元年五月辛酉卒其大略可見者如此其餘殘缺或在或亡亦班班可讀爾右集本後漢金郷守長侯君碑歲月見本文真蹟右漢金郷守長侯君碑云君諱成字伯盛山陽防東人也其先出自豳岐周文之後封于鄭鄭共仲賜氏曰侯厥胤宣多以功佐國漢之興也侯公納䇿濟太上皇於鴻溝之阨謚曰安國君曽孫酺封明統侯光武中興玄孫霸爲臨淮太守轉拜執法右刺姦五威司命大司徒公封於陵侯枝葉繁茂或家河洧或邑山濟君卽上黨太守之弟郡請署主簿督郵五官掾功曹守金郷長建寧二年四月癸酉卒年八十一碑文首尾皆完故得詳其世次其云上黨太守不見其名按漢書執法左右刺姦五威司命皆王莽官名侯霸列傳云霸莽時爲隨令遷執法刺姦而未甞爲五威司命後事光武代伏湛爲大司徒封關内侯旣薨光武下詔追封則郷侯而此碑言封於陵侯未知孰是據碑言刺姦司命爲光武時官蓋碑文之繆矣治平元年四月二十九日書後漢慎令劉君墓脾建寧四年右漢慎令劉君墓碑在今南京下邑其名巳磨滅其字伯麟少罹艱苦身服田畒舉孝廉除郎中辟從事司徒掾遷慎令卒年六十有二其銘曰於惟君徳忠孝正直至行通洞髙明柔克鬼神福謙受兹介福知命不延引輿旋歸忽然䡖舉志激拔葵人皆有亡貴終譽兮殁而不朽垂名著兮余家漢碑常患其銘多缺滅而斯銘偶完故録之右真蹟後漢北軍中候郭君碑歲月見本文右漢北軍中候郭君碑其名字磨滅云元城君第四子也其先蓋周之由緒枝葉雲布列於州郡自東郡衛國家於河内汲兄竹邑侯相次尚書侍郎次濟北相順弟臨沂長次徐州刺史次中山相次雒陽令君爲五官掾功曹司隷中都官從事三辟將軍府舉廉比陽長復辟司徒拜北軍中候年六十有六建寧四年九月丙子卒其於兄竹邑侯相上一字缺滅不完疑是惠字其下又云順弟莫曉其義豈漢人謂兄弟爲此語邪故闕其疑以俟知者治平元年六月廿九日書右真蹟後漢司隷從事郭君碑嵗月見本文右漢司隷從事郭君碑云君諱究汲人也元城君之孫雒陽令之適歷主簿督郵五官掾功曹守令長辟司隷從事部郡都官春秋二十八而卒中平元年歲在甲子三月而葬據北軍中候碑爲元城君子而弟爲雒陽令考其世次皆同前世碑碣但書子孫而不及兄弟惟郭氏碑載其兄弟甚詳蓋古人譜牒旣完而於碑碣又詳如此可見其以世家爲重不若今人之苟簡也治平元年六月廿九日書右真蹟後漢魯峻碑歲月見本文集本右漢魯峻碑云君諱峻字仲嚴山陽昌邑人監營謁者之孫修武令之子治魯詩顔氏春秋舉孝㢘除郎中謁者河内太守丞辟司徒司空府舉髙第御史東郡頓丘令遷九江太守拜議郎太尉長史御史中丞司隷校尉遭母憂自乞拜議郎服竟還拜屯騎校尉以病遜位熹平元年卒門生于商等二百三十人謚曰忠惠父其餘文字亦粗完故得遷拜次序頗詳以見漢官之制如此惟云遭母憂自乞拜議郎又其最後爲屯騎校尉而碑首題云漢故司隷校尉忠惠父魯君碑二者莫曉其義治平元年四月二十三日後漢玄儒婁先生碑歲月見本文右漢玄儒婁先生碑云先生諱壽字元考南陽隆人也祖太常博士父安貧守賤不可營集本作榮以禄先生童孩多竒岐嶷有志好學不猒不飭小行善與人交乆而能敬榮沮溺之偶耕甘山林之杳藹又曰有朋自逺冕紳莘莘講習不倦年七十有八熹平三年二月甲子不禄今光化軍乾徳縣圖經載此碑景祐中余自夷陵貶所再遷乾徳令按圖求碑而壽有墓在穀城界中余率縣學生親拜其墓見此碑在墓側遂據圖經遷碑還縣立於勑書樓下至今在焉治平元年六月十三日書右真蹟後漢郭先生碑真蹟歲月未詳右漢郭先生碑云諱輔字輔成其先出於王季之中子爲文王卿士食菜於􅉑後世謂之郭歷戰國秦漢子孫流分来居荆土先生其少也孝友而恱學其長也寛舒如好施是以宗親歸懷郷䣊髙尚年五十有二遇疾而終其以而爲如及用郷䣊字與婁壽碑同蓋漢人如此尓治平元年六月二十日書又集本右不見書撰人名氏碑在襄州榖城縣界中其辭云先生諱輔字輔成其先出自有周王季之中子爲文王卿士食菜於􅉑至于武王錫而封之後世謂之郭春秋之時爲晉所并歷戰國秦漢子孫派分来居荆土氏國立姓焉傳云聖賢之後必有逹者先生應焉孝友而說學其長也寛舒如好施是以宗親歸懷郷䣊髙尚年五十有二遇疾而終其文字古質蓋漢之碑也其用郷䣊字與漢婁壽碑同其曰寛舒如好施蓋以如字爲而也春秋書星隕如雨釋者曰如而也然施於文章以如爲而始見于此也後漢桂陽太守周府君紀功銘熹平中此君檢漢書無之今碑石缺不見其名惜乎遂不見於世也南人紀其所修瀧水即韓文公所謂昌樂瀧者是也至今以爲利祠宇甚嚴云右集本後漢桂陽周府君碑熹平中右漢桂陽周府君碑按韶州圖經云後漢桂陽太守周府君碑按廟在樂昌縣西一百一十八里武溪上武溪驚湍激石流數百里昔馬援南征其門人轅寄生善吹笛援爲作歌和之名曰武溪深其辭曰滔滔武溪一何深鳥飛不渡獸不能臨嗟哉武溪何毒淫周使君開此溪下合真水桂陽人便之爲立廟刻石又云碑在廟中郭蒼文今碑文磨滅云府君字君光而名已訛缺不可辨圖經但云周使君亦不著其名後漢書又無傳遂不知爲何人也按武水源出郴州臨武縣鸕鷀石南流三百里入桂陽而桂陽真水一有梨溪二字盧溪曹溪諸水皆與武水合流其俗謂水湍峻爲瀧韓退之詩云南下昌樂瀧即此水也碑首題云神漢者如唐人云聖唐爾蓋當時已爲此語而史傳他書無之獨見於此碑也右集本後漢桂陽周府君碑後本熹平中右漢桂楊周府君碑余初得前本恨其名遂磨滅後有國子監直講劉仲章者因出其碑而爲余言前爲樂昌令因道府君事云名憬問其何以見之云碑刻雖闕尚可識也乃以此碑并隂遺余蓋前本特模者不工爾又余初以韓集云昌樂瀧疑其誤乃改從樂昌仲章曰不然縣名樂昌而瀧名昌樂其舊俗所傳如是韓集不誤也乃知古人傳疑而慎於更改者以此右集本後漢費府君碑歲月未詳集本右漢梁相費府君碑其名字若云諱況字仲慮而況疑爲汎慮疑爲寛其官閥可見者爲蕭令九年沛有蝗獨不入其界國以狀聞朝廷嘉諸拜梁相春秋八十卒其銘頗簡而文字粗完云顯祖厥徳懿鑠播勛於前丕碩基業遺愛於民福流於後胙自此磨滅不可識者八字其卒章云功烈休矣来昆勠力而穆字爲古文多然後漢郎中王君碑光和元年右漢郎中王君碑文字磨滅不復成文而僅有存者其名字官閥卒葬年月皆莫可考惟其碑首題云漢故郎中王君之銘知君爲漢人姓王氏而官爲郎中爾蓋夫有形之物必有時而弊是以君子之道無弊而其垂世者與天地而無窮顔回髙卧於陋巷而名與舜禹同榮是豈有託於物而後傳邪豈有爲於事而後著耶故曰乆而無弊者道隱而終顯者誠此君子之所貴也若漢王君者託有形之物欲垂無窮之名及其弊也金石何異乎瓦礫治平元年四月晦日書右眞蹟後漢太尉陳球碑歲月見本文右漢太尉陳球碑云君諱球字伯真廣漢太守之元子也又云除郎中尚書符節郎慎陵園令換中東城門候遷繁陽令拜侍御史其後又云拜将作大匠其餘磨滅僅存按後漢書球傳云父亹廣漢太守陽嘉中球舉孝㢘稍遷繁陽令太尉楊秉表球零陵太守後累拜司空光和元年遷太尉坐日食免復拜光禄大夫與司徒劉郃等謀誅宦官曹節等不果下獄死球在零陵破賊胡蘭朱蓋有功威著南邦今碑破蘭蓋事班班可讀與傳皆合惟不著誅宦官事至其卒時文字磨滅不可識惟云六十有二亦與傳合予所集録古文與史傳多異惟此碑所載與列傳同也治平元年四月晦日書右真蹟後漢敬仲碑歲月見本文右漢敬仲碑者其姓名字皆不可見惟其初有敬仲二字尚可識故以寓其名爾蓋疑其人姓田氏也大抵文字磨滅比其他漢碑尤甚字可識者頗多第不成文爾惟云州郡課最臨登大郡又云居喪致哀又云司隷從事治書侍御史又云光和四年閏月庚申此數句粗可讀爾其餘字畫廑完者以漢隷今爲難得録之爾治平元年閏五月廿九日書右真蹟後漢無名碑此與前跋大槩同右漢無名碑文字磨滅其姓氏名字皆不可見其僅可見者云州郡課最臨登大郡又云居喪致哀曽參閔損又曰辟司隷從事拜治書侍御史又曰奮乾剛之嚴威揚哮虎之武節又曰年六十三光和四年閏月庚申遭疾而卒其餘字畫尚完者多但不能成文爾夫好古之士所藏之物未必皆一作能適世之用惟其埋没零落之餘尤以爲可惜此好古之僻也治平元年六月五日書右真蹟後漢槀長蔡君頌碑光和四年真蹟右漢稾長蔡君頌碑在鎮府故天章閣待制楊畋甞爲余言漢時隷書在者此爲最佳畋自言平生惟學此字余不甚識隷書因畋言遽遣人之常山求得之遂入于録後漢唐君碑歲月見本文右漢唐君碑其名巳磨滅其字正南云集本作云字正南潁川郾人也其先出自慶都感赤龍生堯王有天下苗胄枝分相土視居因氏唐焉君父孝㢘郎中早卒君繼厥緒躭道好古敦書味詩守舞陽丞潁陽令察能治劇遷豫章其後遂復磨滅雖文字班班可見而不能得其次序其後又云換君昌陽令吏民慕戀牽君車輪不得行君臣流涕道路琅玕是故從事郡掾刋石樹頌歌君之羙據此蓋縣令去思碑爾其後又云光和六年二月壬午朔二十五日丙午則知唐君爲後漢時人矣治平元年閏五月二十八日右真蹟後漢朱龜碑歲月見本文右漢朱龜碑云字伯靈察孝㢘除郎中尚書侍郎以將事去官于時幽州州下滅一字夷侵冦以君爲御史中丞討伐其後磨滅又云鮮卑侵犯障塞復舉君拜幽州刺史年六十四光和六年卒龜之事迹不見史傳其僅見於此碑者如此碑在今亳州界中云將事去官莫曉其語治平元年六月十四日書右真蹟後余守亳州徙碑置州學中後漢小黄門譙君碑歲月見本文右漢小黄門譙君碑云君諱敏字漢逹年五十七中平二年卒其文不甚磨滅而官閥無所稱述惟云肅將王命守静韜光以逺悔咎而巳後漢官者用事靈帝時尤盛敏卒之歲張讓等十二人封侯於斯之時能守靜逺悔是亦可佳然敏以一小黄門而立碑稱頌於此可見卜官之盛也治平元年四月三日書右真蹟後漢熊君碑歲月見本文右漢熊君碑云君諱喬字舉舉上滅一字其官閥不可詳考其僅可知者劉表時爲綏民校尉後遷騎都尉建安二十一年卒享年七十有一其云治歐羊尚書其字非訛闕而以陽爲羊蓋古文字少故湏假借至漢字巳備而猶假用何哉後云太歲在甲申上滅一字以曆推之當是丙申又云碑師舂陵福造福上滅一字當是其姓其書顯字皆爲按許慎說文顯從㬎聲而轉爲累其失逺矣莫曉其義也右集本後漢俞郷侯季子碑歲月未詳右漢俞郷侯季子碑云君諱熊字孟下闕一字廣陵海西人也厥祖天皇大帝垂精接感篤生聖明子孫享之分源而流枝葉扶踈出王别胤受爵列土封侯載徳君光武皇帝之玄廣陵王之孫俞郷侯之季子也由是而後文字缺滅其稍稍可讀者時得其一二云六籍五典如源如泉旣練州郡卷舒委隨化流南城政猶北辰三祀有成来臻我邦仁恩如冬日威猛烈夏日吏民愛若慈父畏如神明其後又云採摭謡言作詩三章據碑文無卒葬年月而其辭若此似是徳政碑按後漢書光武皇帝子曰廣陵思王荆荆子元壽等四人皆封郷侯史略而不載其名俞郷侯者不知爲誰也思王荆之第㡬子也天皇大帝之語自漢以来有矣右集本後漢武榮碑歲月未詳右漢武榮碑云君諱榮字舍集本作含和治魯詩經韋君章句孝經論語漢書史記左氏國語爲州書佐郡曹史集本作文學主簿督郵五官掾功曹年三十六南蔡府君察舉孝㢘執金吾丞孝桓大憂屯守玄武闕加遇害氣遭疾殞靈其餘文字殘缺不見其卒葬年月又不著氏族所出惟其碑首題云漢故執金吾丞武君之碑云治平元年五月六日書右真蹟後漢秦君碑首歲月見本文漢碑今存者少此篆亦與今文小異勢力勁徤可愛蔡君謨題右漢熹平中碑在南陽界中字巳摩或作磨非滅不可識獨其碑首字大僅存其筆畫頗竒偉蔡君謨甚愛之此君謨過南都所題乃皇祐三年也今一紀矣嘉祐八年九月十七日書右真蹟又此集本與真蹟頗不同故兩存右漢秦君碑首題云漢故南陽太守秦君之碑秦君不知爲何人碑在南陽界中字巳磨滅不可識獨其碑首字大僅存其筆畫頗竒偉蔡君謨甚愛之後漢元節碑歲月未詳右漢元節碑文字磨滅不見其氏族其可見者纔數十字爾云君集本無此字諱立字元節其先出自伊尹其餘不復成文其銘云於穆從事疑其姓伊而爲從事也碑無年月而知爲漢人者以其隷體與他漢碑同爾治平元年五月三日書右真蹟後漢殘碑歲月未詳真蹟右漢殘碑不知爲何人所存者纔三十二字不復成文惟云髙字㓜知其名高又云漢一有中字興復知爲後漢時人而隷字在者甚完體質淳勁非漢人莫能爲也故録之後漢天禄辟邪字歲月未詳右漢天禄辟邪四字在宗資墓前石獸膊上按後漢書宗資南陽安衆人也今墓在鄧州南陽界中墓前有二石獸刻其膊上一曰天禄一曰辟邪余自天聖中舉進士徃来穰集本作襄鄧間見之道側迨今三十餘年矣其後集録古文思得此字屢求於人不能致尚書職方貟外郎謝景初家於鄧爲余模得之然字畫集本作或訛缺不若余見時完也按黨錮傳云資祖均自有傳今後漢書有宋均傳云南陽安衆人而無宗均傳疑黨錮傳轉集本無此字寫宋爲宗爾蜀志有宗預南陽安衆人豈安衆當漢時有宗宋二族而字與音皆相近遂至訛謬邪史之失傳如此者多矣嘉祐八年臘日書集古録跋尾卷第三費鳳碑元第九百九十一起坐一作坐起按古碑作望逺武班碑元第五百五十一書云一無云字又歲一作歲又曹騰碑元第一百七十一司隷楊君碑元第六百九十一至六百九十二右漢一有故字攸同一作股躬益城一作域樊常侍碑元第一百四十二右漢至序也九十四字一本無集録一無録字古碑一無此二字嘉祐八年十月十四日書一有此十字鄭固碑元第五百四十一又曰一作云治平元年四月十二日書一有此十字田君碑元第四百五十一今在一作在今爲姓一作其姓孫叔敖碑元第二百八十一王元賞碑元第六百四十一茂才一作材治平元年五月二日書一有此九字祝睦碑元第三百一十一皆在今一作今皆在祝睦後碑元第三百二十一衡方碑元第九百二十一張表碑元第四百一十漢故真蹟圈去漢字張君此下一有之字張壽碑元第六百七十一治平元年端午日書一有此八字侯君碑元第六百三十一碑文一無文字繆矣一無矣字劉君墓碑元第七百五十一北軍中候郭君碑元第四百三十一司隷從事郭君碑元第四百四十一魯峻碑元第五百六十一司空一無二字故得此下一有其字婁先生碑元第一百五十一偶一作耦藹一作靄郭先生碑元第五十一碑云此下一有先生字輔成古碑作甫成歷一作婁壽二字上一有漢字二十日一作二十二日周府君紀功銘元第一百八十一周府君碑元第一百八十一碑按一無此二字桂陽一作桂水或作桂陽桂水湍峻一作浚周府君碑後本元附一百八十一因出其碑而一無此五字費府君碑元第七百一十一文字一無此一字於後一無於字磨滅不可識者八字一作八字巳滅不可識其卒一無其字多然一作多如此也熈寧二年十一月十六日山齋書一有此十三字王君碑元第六百一陳球碑元第六百一十一敬仲碑元第九百一十一無名碑元第六百八十一又云一作日蔡君頌碑元第五百八十一爲最一作最爲唐君碑元第八百八十一朱龜碑元第二百三十一譙君碑元第五百一十一熊君碑元第九百一其云一作其辭有云熈寧二年十月晦日山齋書一有此十一字季子碑元第九百三十一字孟一本此下再有孟字夏日一作炎夏史略一無此二字誰也一無此二字天皇至有矣十二字一本無治平元年六月五日書一有此九字武榮碑元第五百三十一南古碑作汝南秦君碑首元第八十一元節碑元第六百五十一後漢殘碑元第三百三十一天禄辟邪字元第七十一集録一無録字
