front:
  text: 居士集卷第四十五歐陽文忠公集四十五
  hash: sha256:5d74bd96acc6c9b5d00f3dd9f4c90c2444c8d35047e94ca804490906c2f8ad09
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_045-1a}
body:
  text: 上書一首通進司上書十二月二十四日宣德郎守太子中乆充館閣挍勘臣歐陽脩謹昧死再拜上書于皇帝闕下臣伏見國家自元昊叛逆關西用兵以來爲國言事者衆矣臣𥘉竊爲三䇿以料賊情然臣迂儒不識兵之大計始猶遲疑未敢自信今兵興旣乆賊形巳露如臣素料頗不甚逺故竊自謂有可以助萬一而塵聽覽者謹條以聞惟陛下仁聖寛其狂妄之誅幸甚夫關西弛備而民不見兵者二三十年矣使賊萌亂之𥘉藏形隱計卒然而來當是時吾之邊屯寡弱城堡未完民習乆安而易驚將非素選而敗怯使其羊驅豕突可以奮然而深入然國威未挫民力未疲彼得城而居不能乆守虜掠而去可邀擊其歸此下䇿也故賊知而不爲之戎狄侵邉自古爲患其攻城掠野敗則走而勝則來蓋其常事此中䇿也故賊兼而用之若夫假僭名號以威其衆先擊吾之易取者一二以恱其心然後訓養精銳爲長乆之謀故其來也雖勝而不前不敗而自退所以誘吾兵而勞之也或擊吾東或擊吾西乍出乍入所以使吾兵分備多而不得減息也吾欲速攻賊方新銳坐而待戰彼則不來如此相持不三四歳吾兵巳老民力巳疲不幸又遇水旱之災調斂不勝而盜賊羣起彼方奮其全銳擊吾困弊可也使吾不堪其困忿而岀攻決於一戰彼以逸而待吾勞亦可也幸吾苦兵計未知岀遂求通聘以邀歳時之賂度吾困急不得不從亦可也是吾力一困則賊謀無施而不可此兵法所謂不戰而疲人兵者上䇿也而賊今方用之今三十萬之兵食於西者二歳矣又有十四五萬之郷兵不耕而自食其民自古未有四五十萬之兵連年仰食而國力不困者也臣聞元昊之爲賊威能畏其下恩能死其人自𥘉僭叛嫚書巳上逾年而不岀一出則鋒不可當執劫蕃官獲吾將帥多禮而不殺此其兇謀所畜皆非倉卒者也柰何彼能以上䇿而疲吾吾不自知其巳困彼爲乆計以撓我我無長䇿而制之哉夫訓兵養士伺隙乘便用間岀竒此將帥之職也所謂閫外之事而君不御者可也至於外料賊謀之心内察國家之勢知彼知此因謀制敵此朝廷之大計也所謂廟筭而勝者也不可以不思今賊謀可知以乆而疲我耳吾勢可察西人巳困也誠能豐財積粟以紓西人而完國壯兵則賊謀沮而廟筭得矣夫兵攻守而巳然皆以財用爲彊弱也守非財用而不乆此不待言請試言攻昔秦席六丗之彊資以事胡卒困天下而不得志漢因文景之冨力三舉而纔得河南隋唐突厥吐蕃常與中國相勝敗擊而勝之有矣未有舉而滅者秦漢尤彊者其所攻今元昊之地是也況自劉平䧟没賊鋒熾銳未甞挫衂攻守之計非臣所知天威所加雖終期於掃盡然臨邊之將尚未聞得賊釁隙挫其兇鋒是攻守皆未有休息之期而財用不爲長乆之計臣未見其可也四五十萬之人坐而仰食然關西之地物不加多關東所有莫能運致掊克細碎旣以無益而罷之矣至於鬻官入粟下無應者改法權貨而商旅不行是四五十萬之人惟取足於西人而巳西人何爲而不困困而不起爲盜者須水旱尔外爲賊謀之所疲内遭水旱而多故天下之患可勝道哉夫關西之物不能加多則必通其漕運而致之漕運巳通而關東之物不充則無得而西矣故臣以謂通漕運盡地利權商賈三術並施則財用足而西人紓國力完而兵可乆以守以攻惟上所使夫小瑣目前之利旣不足爲長乆之謀非旦夕而可効故爲長乆而計者𥘉若迂愚而可笑在必而行之則其利博矣故臣區區不敢避迁愚之責請上便冝三事惟陛下裁擇其一曰通漕運臣聞今爲西計者皆患漕運之不通臣以謂但未求之耳今京師在汴漕運不西而人之習見者遂以爲不能西不知秦漢隋唐其都在雍則天下之物皆可致之西也山川地形非有變易於古其路皆在昔人可行今人胡一作何爲而不可漢𥘉歳漕山東粟數十萬石是時運路未修其漕尚少其後武帝益修渭渠至漕百餘萬石隋文帝時沿水爲倉轉相運置而關東汾晉之粟皆至渭南運物最多其遺倉之迹徃徃皆在然皆尚有三門之險自唐裴耀卿又尋隋迹於三門東西置倉開山十八里爲陸運以避其險卒泝河而入渭當時歳運不減二三百萬石其後劉晏遵耀卿之路悉漕江淮之米以實關西後丗言能經財利而善漕運者耀卿與晏爲首今江淮之米歳入于汴者六百萬石誠能分給關西得一二百萬石足矣今兵之食汴漕者出戍甚衆有司不惜百萬之粟分而及之其患者三門阻其中尔今冝浚治汴渠使歳運不阻然後按求耀卿之迹不憚十許里陸運之勞則河漕通而物可致且紓關西之困使古無法今有可爲尚當爲之況昔人行之而未逺今人行之而豈難哉耀卿與晏𥘉理漕時其得尚少至其末年所入十倍是可乆行之法明矣此水運之利也臣聞漢髙祖之入秦不由東關而道南陽過酈析而入武關曹操等起兵誅董卓亦欲自南陽道丹析而入長安是時張濟又自長安出武關奔南陽則自古用兵徃來之徑也臣甞至南陽問其遺老云自鄧西北至永興六七百里今小商賈徃徃行之𥘉漢髙入關其兵十萬夫能容十萬兵之路冝不甚狹而險也但自雒陽爲都行者皆趨東關其路乆而遂廢今能按求而通之則武昌漢陽郢復襄陽梁洋金商均房光化沿漢之地十一二州之物皆可漕而頓之南陽自南陽爲輕車人輦而遞之募置遞兵爲十五六鋪則十餘州之物日日入關而不絶沿漢之地山多美木近漢之民仰足而有餘以造舟車甚不難也前日陛下深恤有司之勤内賜禁錢數十萬以供西用而道路艱逺輦運逾年不能畢至至於軍裝輸送多苦秋霖邊州巳寒冬服尚滯於路其艱如此夫使州縣綱吏逺輸京師轉冒艱滯然後得西豈若較南陽之旁郡度其道里入于武關與至京師逺近等者與其尤近者皆使直輸于關西京師之用有不足則以禁帑岀賜有司者代而充用其迂曲簡直利害較然矣此陸運之利也其二曰盡地利臣聞昔之畫財利者易爲工今之言財利者難爲術昔者之民賦稅而已故其不足則鑄山煑海榷酒與茶征關市而筭舟車尚有可爲之法以茍一時之用自漢魏迄今其法日増其取益細今取民之法盡矣昔者賦外之征以備有事之用今盡取民之法用於無事之時悉以冗費而糜之矣至卒然有事則無法可増然獨猶有可爲者民作而輸官者巳勞而㳺手之人方逸地之産物者耕不得代而不墾之土尚多是民有遺力地有遺利此可爲也況歴視前丗用兵者未甞不先營田漢武帝時兵興用乏趙過爲畎田人犁之法以足用趙充國攻西羌議者爭欲岀擊而充國深思全勝之䇿能忍而待其弊至違詔罷兵而治屯田田於極邊以遊兵而防鈔冦則其理田不爲易也猶勉爲之後漢之時曹操屯兵許下彊敵四面以今視之疑其旦夕戰爭而不睱然用棗祗韓浩之計建置田官募民而田近許之地歳得穀百萬石其後郡國皆田積穀無數隋唐田制尤廣不可勝舉其勢艱而難田莫若充國迫急而不暇田莫如曹操然皆勉焉不以迂緩而不田者知地利之博而可以紓民勞也今天下之土不耕者多矣臣未能悉言謹舉其近者自京以西土之不闢者不知其數非土之瘠而棄也盖人不勤農與夫役重而逃尔乆廢之地其利數倍於營田今若督之使勤與免其役則願耕者衆矣臣聞郷兵之不便於民議者方論之矣充兵之人遂棄農業託云教習聚而飲博取資一有於字其家不顧無有官吏不加禁父兄不敢詰家家自以爲患也河東河北關西之郷兵此猶有用若京東西者平居不足以備盜而水旱適足以爲盜其尤可患者京西素貧之地非有山澤之饒民惟力農是仰而今三夫之家一人五夫之家三人爲游手凡十八九州以少言之尚可四五萬人不耕而食是自相糜耗而重困也今誠能盡驅之使耕于棄地官貸其種歳田之入與中分之如民之法募吏之習田者爲田官優其課最而誘之則民願田者衆矣太宗皇帝時甞貸陳蔡民錢使市牛而耕眞宗皇帝時亦用耿望之言買牛湖南而治屯田今湖南之牛歳賈于北者皆出京西若官爲買之不難得也一有又冝重爲法以困所謂私牛之客者使不客於民而樂爲官耕凢民之巳有牛者使自耕則牛不足而官市者不多四十四字且郷兵本農也籍而爲兵遂棄其業今幸其去農未乆尚可復驅還之田畒使不得羣游而飲博以爲父兄之患此民所願也一夫之力以逸而言任耕縵田一頃使四五萬人皆耕而乆廢之田利又數倍則歳穀不可勝數矣京西之分北有大河南至漢而西接關若又通其水陸之運所在積穀惟陛下詔有司而移用之耳其三曰權商賈臣聞秦廢王法啓兼并其上侵公利下刻細民爲國之患久矣自漢以來甞欲爲法而抑奪之然不能也蓋爲國者興利日繁兼并者趨利日巧至其甚也商賈坐而權國利其故非他由興利廣也夫興利廣則上難專必與下而共之然後通流而不滯然爲今議者方欲奪商之利一歸於公上而專之故奪商之謀益深則爲國之利益損前日有司屢變其法法毎一變則一歳之間所損數百萬議者不知利不可專欲專而反損但云變法之未當變而不已其損愈多夫欲十分之利皆歸于公至其虧少十不得三不若與商共之常得其五也今爲國之利多者茶與鹽耳茶自變法巳來商賈不復一歳之失數年莫𥙷所在積朽棄而焚之前日議者屢言三說之法爲便有司旣以詳之矣今誠能復之使商賈有利而通行則上下濟矣解池之鹽積若山阜今冝暫下其價誘羣商而散之先爲令曰三年將復舊價則貪利之商爭先而湊矣夫茶者生於山而無窮鹽者出於水而不竭賤而散之三年十未減其一二夫二物之所以貴者以能爲國資錢幣尔今不散而積之是惜朽壤也夫何用哉夫大商之能蕃其貨者豈其錙銖躬自鬻於市哉必有販夫小賈就而分之販夫小賈無利則不爲故大商不妬販夫之分其利者恃其貨博雖取利少貨行流速則積少而爲多也今爲大國者有無窮不竭之貨反妬大商之分其利寧使無用而積爲朽壤何哉故大商之善爲術者不惜其利而誘販夫大國之善爲術者不惜其利而誘大商此與商賈共利取少而致多之術也一有又今商賈之難以術制者以其積貨多而不急故也利厚則來利薄則止不可以號令召也故每有司變法下利旣薄小商以無利而不能行則大商方幸小商之不行適得獨賣其貨尚安肯勉趨薄利而來哉故變法而刻利者適足使小商不來而爲大商賈積貨也今必以術制商冝盡括其居積之物官為賣而還之使其貨盡而後變法夫大商以利為生一􅍲不營利則有惶惶之憂彼必不能守積錢而閑居得利雖薄猶將勉而來此變法制商之術也夫欲誘商而通貨莫若與之共利此術之上也欲制商使其不得不從則莫若痛裁之使無積貨此術之下也然此可制茶商耳若鹽者禁益密則冐法愈多而刑繁凡二百三十八字若乃縣官自爲鬻市之事此大商之不爲臣謂行之難乆者也誠能不較錙銖而思逺大則積朽之物散而錢幣通可不勞而用足矣臣愚不足以知時事若夫堅守以扞賊利則出而擾之凡小便冝願且委之邊將至於積榖與錢通具漕運不二三歳而國力漸豐邊兵漸習賊銳漸挫而有隙可乘然後一舉而滅之此萬全之䇿也願陛下以其小者責將帥謀其大計而行之則天下幸甚臣脩昧死再拜居士集卷第四十五熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益挍正通進司上書財用足一作財足用耕于一作耕於大商之不爲一作不自爲
