body:
  text: 墓誌五首翰林侍讀學士給事中梅公墓誌銘翰林侍讀學士給事中一云行給事中知許州上柱國南昌郡開國公食邑三千二百户實封六百户賜紫金魚袋梅公旣卒之明年其孤及其兄之子堯臣來請銘以葬曰吾叔父病且亟矣猶卧而使我誦子之文今其葬冝得子銘以藏公之名在人耳目五十餘年前卒一歲予始拜公於許公雖衰且一無此字病其言談詞氣尚足動人嗟予不及見其壯也然甞聞長老道公咸平景徳之初一遇眞宗言天下事合意遂以人主為知已當時搢紳之士一無此二字望之若不寸及巳而擯斥流離四十年間白首翰林卒老一州嗟夫士果能自爲朴邪惟世用不用爾故予記公終始至於咸平景徳之際尤為詳焉良以悲其志也公諱詢字昌言世家宣城年二十六進士及第試校書郎利豐監判官遷將作監丞知杭州仁和縣又遷著作佐郎舉御史臺推勘官時亦未之竒也咸平三年與考進士於崇政殿眞宗過殿廬中一見以為竒材召試中書直集賢院賜緋衣銀魚是時契丹數寇河北李繼遷急攻靈州天子新即位銳於為治公乃上書請以朔方授潘羅支使自攻取是謂以蠻夷攻蠻夷眞宗然其言問誰可使羅支者公自請行天子惜之不欲使蹈兵間公曰苟活靈州而罷西兵何惜一梅詢天子壯其言因遣使羅支未至而靈州没于賊召還遷太常丞三司户部判官數訪時事一有使得以書論於是屢言西北事時邊將皆守境不能出師公請一有出字大臣臨邊督戰募遊兵擊賊一有論曹瑋馬知節才可用又十字論傅潜楊瓊敗績當誅一有以正刑三字而田紹斌王榮等可責其効以贖過凡數十事其言甚壯天子益器其材數欲以知制誥宰相有言不一作未可者乃已其後繼遷卒爲潘羅支所困而朝廷以兩鎭授徳明徳明頓首謝罪河西平天子亦再幸澶淵一有以金帛三字盟契丹而河北之兵解天下無事矣公旣見踈不用初坐斷田訟失實通判杭州徙知蘇州又徙兩浙轉運一有副字使還判三司開拆司遷太常博士用封禪恩遷祠部貟外郎又坐事出知濠州以刑部貟外郎爲荆湖北路轉運使坐擅給驛馬與一作假人奔喪而馬死奪一官通判襄州徙知鄂州又徙蘇州天禧元年復爲刑部貟外郎陜西轉運使靈州弃已乆公與秦州曹瑋得胡蘆河路一有無沙二字可出兵無沙行之阻而能徑一無此八字趨靈州遂請瑋居環慶以圖出師㑹瑋入爲宣徽使不克而止遷工部郎中坐朱能反貶一作左遷懷州團練副使再貶一作改池州天聖元年拜度支貟外郎知廣徳軍徙知楚州遷兵部貟外郎知壽州又知陜府六年復直集賢院又遷工部郎中改直昭文館知荆南府召為龍圖閣待制紏察在京刑獄判流内銓改龍圖閣直學士知并州未行遷兵部郎中樞密直學士以徃就遷右諌議大夫入知通進銀臺司復判流内銓改翰林侍讀學士羣牧使遷給事中知審官院以疾出知許州康定二年六月某日卒于官公好學有文尤一無此五字喜為詩為人嚴毅修潔而材辯敏明少能慷慨見竒眞宗自𥘉召試感激言事自以謂君臣之遇巳而失職逾二十年始復直於集賢一作始復直集賢院比登侍從而門生故吏曩時所考進士或至宰相居大官故其視時人常以先生長者自處論事尤多發憤其在許昌繼遷之孫復以河西叛朝廷出師西方而公已老不復言兵矣享年七十有八以終一無此二字梅氏逺出梅伯世乆而譜不明公之皇曾祖諱超皇祖諱逺皆不仕父諱邈贈刑部侍郎夫人劉氏彭城縣君子五人長曰鼎臣官至殿中丞次曰寶臣皆一無皆字先公卒次曰得臣太子中舍次曰輔臣前將作監丞次曰清臣大理評事公之卒天子贈賻優恤一無此二字加一作拜得臣殿中丞清臣衛尉寺丞明年八一作九月某日葬公宣州之某縣某郷某原一作葬于宣城縣長安郷西山里銘曰士之所難有藴無時偉歟梅公人主之知勇無不敢惟義之為困于翼飛中垂以歛一失其塗進退而坎理不終窮旣晚而通惟其壽考福禄之隆一作終尚書都官貟外郎歐陽公墓誌銘公諱曄字日華於檢校工部尚書諱託彭城縣君劉氏之室爲曽孫武昌縣令諱郴蘭陵夫人一作蘭陵郡無夫人字蕭氏之室爲孫贈太僕少卿諱偃追封潘原縣太君李氏之室爲第三子於脩爲叔父脩不幸㓜孤依于叔父而長焉甞奉太夫人之教曰爾欲識爾父乎視爾叔父其狀貌起居言笑皆爾父也脩雖㓜巳能知太夫人言爲悲一作哀而叔父之爲親也歐陽氏世家江南僞唐李氏時爲廬陵大族李氏亡先君昆弟同時而仕者四人獨先君早世其後三人皆登于朝以殁公一有以字咸平三年舉進士甲科歷南雄州判官隨閬二州推官江陵府掌書記拜太子中允太常丞博士尚書屯田都官二貟外郎享年七十有九最後終于家以慶曆四年三月十日葬于安州應城縣髙風郷彭樂村於其葬也其素所養兄之子脩泣而書曰嗚呼叔父之亡吾先君之昆弟無復在者矣其長養教育之恩旣不可報而至於狀貌起居言笑之可思慕者皆不得而見焉矣惟勉而紀吾叔父之可傳于世者庶以盡脩之志焉公以太子中允監興國軍鹽酒稅太常丞知漢州雒縣博士知端州桂陽監屯田貟外郎知黃州遷都官知永州皆有能政坐舉人奪官復以屯田通判歙州以本官分司西京許家于隨復遷都官于家遂致仕景祐四年四月九日卒公為人嚴明方質尤以潔廉自持自為布衣非其義不輙受人之遺少而所與親舊後或甚貴終身不造其門其涖官臨事長於決斷初為隨州推官治獄之難決者三十六一有人字大洪山竒峯寺聚僧數百人轉運使疑其積物多而僧為姦利命公徃籍之一有官為岀入四字僧以白金千兩餽公公笑曰吾安用此然汝能聽我言乎今歲大凶汝有積榖六七萬石能盡以輸官而賑民則吾不籍汝僧喜曰諾飢民頼以全活陳堯咨以豪貴自驕一有所居為不法五字官屬莫敢仰視在江陵用私錢詐為官市黃金府吏持帖强僚佐署公呵吏曰官市金當有文符獨不肯署堯咨雖憚而止然諷轉運使出公不使居府中鄂州崇陽素號難治乃徙公治之至則決滯獄百餘事縣民王明與其同母兄李通爭産累歲明不能自理至貧為人賃舂公折之一言通則具伏盡取其産鉅萬一有一字歸于明通退而無怨言桂陽民有爭舟而相毆至死者獄乆不決公自臨其獄出囚坐庭中去其桎梏而飲食之食訖悉勞而還于獄獨留一人于庭留者色動惶顧公曰殺人者汝也囚不知所以然公曰吾視食者皆以右手持匕而汝獨以左今死者傷在右肋此汝殺之明也囚即涕泣曰我殺也不敢以累他人公之臨事明辨有古良吏決獄之術多如此所居人皆愛思之公娶范氏封福昌縣君子男四人長曰宗顔次曰宗閔其二早亡女一人適張氏亦早亡銘曰公之明足以决於事愛足以思於人仁足以施其族清足以潔其身而銘之以此足以遺其子孫江寧府句容縣令贈尚書兵部貟外郎王公墓誌銘代恕王氏世家開封陳留之通許鎭咸平中分通許為咸平縣故王氏今為開封咸平人公諱某字某曾祖諱丕祖諱祚父諱銳世以貲雄里中不樂仕宦而好施其有以賙人之急及公而貲益衰乃歎曰吾聞施於為政其利可以賙天下貲安足道㢤乃慨然以孔氏尚書舉於有司累不中因就他選曰可以為政何擇焉初任萊州萊陽主簿㑹令坐事解去公署令事告其民曰令欲為法簡而利民博者當何為去其甚惡可也乃縛故吏唐權條其宿惡上于州杖其脊而還之縣之姦豪皆歛色屏氣指權相戒不可犯公法公曰使我為令朞年不獨善人不懼惡人可使惡人爲善也巳而河決東平公部縣丁夫數千召權署隊長權喜曰公許我自新矣卒以丁夫治河為諸縣最歷婺州蘭溪尉陳州項城主簿㑹歲旱蝗州守風吏按田者言旱不為灾公與守爭至三四民得復乃巳改潁州司法叅軍州民藥氏為盜㑹赦出入里閭操弓矢為民害有朱氏者募客二人謀殺之法當死公曰為法所以輔善而禁惡也今殺良民為惡盜報仇豈法意邪乃狀列之朱氏得減死改華州司法遷蘇州之呉江江寧之句容二縣令遂老于京師以某年某月某日卒于家享年六十有九公好學善書喜賔客務賙人緩急而為性寛靜沈黙一有及於吏事敢於所為不屈其守左右丞史有不如意未甞笞責諸子問之則曰刑法豈為喜怒設邪公𥘉娶趙氏永安郡太君後娶李氏陳留郡太君子男十人二早卒女二一作一人一一無一字卒于家一適朱氏慶曆四年九月庚申葬于開封尉氏蔣成郷栢子原之新塋於其葬也長子拱璧右侍禁次拱之左班殿直次拱徳衛州獲嘉縣令次拱安右班殿直次拱巳守將作監主簿次拱式尉氏縣尉次拱辰右諌議大夫權御史中丞次拱著歙州司户叅軍以中丞之貴累贈尚書兵部貟外郎將葬中丞君泣而語其伯仲曰吾家通許世有隂徳于人而無興者至吾先君不有于其躬而以貽後世小子不侫幸得備貟御史府進退大夫之後小子何有焉然懼乎後世徒見王氏之興而不知吾世積漸之所以來者若此其可無銘乃來求銘銘曰公世以貲施徳于人至公貲衰乃施于官有子之一足大公門矧公多子多子多孫惟彼世徳如流有源其來者逺愈積益蕃銘昭其昧以永厥存張子野墓誌銘吾友張子野旣亡之二年其弟充以書來請曰吾兄之喪將以今年三月某日葬于開封不可以不銘銘之莫如子冝嗚呼予雖不能銘然樂道天下之善以傳焉况若吾子野者非獨其善可銘又有平生之舊朋友之恩與其可哀者皆冝見於予文冝其來請於予也初天聖九年予爲西京留守推官是時陳郡謝希深南陽張堯夫與吾子野尚皆無恙於時一府之士皆魁傑賢豪日相徃來飲酒歌呼上下角逐爭相先後以爲笑樂而堯夫子野退然其間不動聲氣衆皆指爲長者予時尚少心壯志得以爲洛陽東西之衝賢豪所聚者多爲適然耳其後去洛來京師南走夷陵並江漢其行萬三四千里山砠水厓窮居獨遊思從曩人邈不可得然雖洛人至今皆以謂無如嚮時之盛然後知世之賢豪不常聚而交遊之難得為可惜也初在洛時巳哭堯夫而銘之其後六年又哭希深而銘之今又哭吾子野而銘一有之字於是又知非徒相得之難而善人君子欲使幸而乆在於世亦不可得一有也嗚呼可哀也巳子野之世曰贈太子太師諱某曽祖也宣徽北院使樞密副使累贈尚書令諱遜皇祖也尚書比部郎中諱敏中皇考也曽祖妣李氏隴西郡夫人祖妣宋氏昭應郡夫人孝章皇后之妹也妣李氏永安縣太君子野家聮后姻世乆貴仕而被服操履甚於寒儒好學自力善筆札天聖二年舉進士歷漢陽軍司理叅軍開封府咸平主簿河南法曹叅軍王文康公錢思公謝希深與今叅知政事宋公咸薦其能改著作佐郎監鄭州酒稅知閬州閬中縣就拜秘書丞秩滿知亳州鹿邑縣寶元二年二月丁未以疾卒于官享年四十有八子伸郊社掌坐次從次㓜未名女五人一適人矣妻劉氏長安縣君子野為人外雖愉怡中自刻苦遇人渾渾不見圭角而志守端直臨事敢一作果決平居酒半脫冠垂頭童然秃且白矣予固巳悲其早衰而遂止於此豈其中亦有不自得者邪子野諱先其上世博州髙堂人自曽祖巳來家京師而葬開封今為開封人也銘曰嗟夫子野質厚材良孰屯其亨孰短其長豈其中有不自得而外物有以戕開封之原新里之鄕三世于此其歸其藏孫明復先生墓誌銘并序先生諱復字明復姓孫氏晉州平陽人也少舉進士不中退居㤗山之陽學春秋著尊王發微魯多學者其尤賢而有道者石介自介而下皆以弟子事之先生年逾四十家貧不娶李丞相迪將以其弟之女一作子妻之先生疑焉介與羣弟子進曰公卿不下士乆矣今丞相不以先生貧賤而欲託以子是髙先生之行義也先生冝因以成丞相之賢名於是乃許孔給事道輔為人剛直嚴重不妄與人聞先生之風就見之介執杖屨侍左右先生坐則立升降拜則扶之及其徃謝也亦然魯人旣素髙此兩人由是始識師弟子之禮莫不歎嗟之而李丞相孔給事亦以此見稱於士大夫其後介為學官語于朝曰先生非隱者也欲仕而未得其方也慶曆二年樞密副使范仲淹資政殿學士冨弼言其道徳經術冝在朝廷召拜校書郎國子監直講甞召見邇英閤說詩一有且字將以為侍講而嫉之者言其講說多異先儒遂止七年徐州人孔直温以狂謀捕治索其家得詩有先生姓名坐貶監䖍州商稅徙泗州又徙知河南府長水縣簽署應天府判官公事通判陵州翰林學士趙槩等十餘人上言孫某行為世法經為人師不冝棄之逺方乃復為國子監直講居三歲以嘉祐二年七月二十四日以疾卒于家享年六十有六官至殿中丞先生在太學時為大理評事天子臨幸賜以緋衣銀魚及聞其喪惻然予其家錢十萬而公卿大夫朋友太學之諸生相與弔哭賻治其喪於是以其年十月二十七日葬先生於鄆州須城縣盧一作靈泉郷之北扈原先生治春秋不惑傳註不為曲說以亂經其言簡易明於諸侯大夫功罪以考時之盛衰而推見王道之治亂得於經之本義為多方其病時樞密使韓琦言之天子選書吏給紙筆命其門人祖無擇就其家得其書十有五篇録之藏干秘閣先生一子大年尚㓜銘曰聖旣殁經更戰焚逃藏脫亂僅傳一作得存衆說乘之汨其原恠迁百出雜僞眞後生牽卑習前聞有欲患之寡攻羣徃徃止燎以膏薪有勇夫子闢浮雲刮磨蔽蝕相吐吞日月卒復光破昏博㦲功利無窮垠有考其不在斯文居士集卷第二十七熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正梅公墓銘於許一作于許見其一作譏其時邊將三字上一有是字孫先生墓銘聖旣殁經更戰焚一作聖人旣没經更焚
