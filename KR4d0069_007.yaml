body:
  text: 賜河陽三城節度使同中書門下平章事判河南府文彥博加恩告勑詔朕因孟冬之吉辰饗太宫而合食膺受神貺推行慶恩眷惟同德之臣方處居留之任宜優異數少示眷懷既敷告於外庭其往祗於休命內中福寧殿開啓祫享預告道埸青詞十月十九日伏以宗廟之嚴祫祭為重乃卜孟冬之吉躬修合食之儀仰企上靈冥孚隂佑俾克成於盛禮冀永錫於純禧式展孝思用膺神貺在外五嶽四瀆四海并諸神廟等處謝祫享禮畢祝文十月十九日屬者卜吉孟冬致饗清廟聖靈來格福祉沓臻荷神貺之不違俾縟儀之克舉敢忘神報達此明誠泗州塔下并峨嵋山開啓謝祫享禮畢道埸齋文兹者冬物告成因饗親而達孝神釐來貺既均慶之以時惟盛一作成禮之弗違荷巨慈之旁祐即靈埸而申報冀冥鑒之孔昭薦此誠明期於福應太平興國寺開先殿開啓孝明皇后忌辰道埸齋文十一月一日伏以柔明之範瞻厚德而巳遐感慕之思託洪慈而申薦載嚴寶殿恭啓貝函惟淨福之是資冀靈遊之永祐太平興國寺開先殿開啓孝明皇后忌辰道埸功德疏右語右伏以真覺之慈應物溥示於能仁孝思之感以時式臨於諱日俾延淨侶交奏𣑽功冀承勝利之因永獲冥深之祐賜西南蕃蠻人張光現等敕書十一月三日汝世守邊疆逺輸忠順時修職貢附達𣢾誠載嘉勤恪之心宜示褒優之錫賜宰臣富弼乞退不允批答省表具之夫知人之明可謂難矣而任賢之術兹豈易哉若乃聽之不聰信之不篤施設之方未盡弗極其材遲速之效有時莫能少待則被其任者實亦艱歟卿以純一忠亮之誠藴宏深逺大之業朕虛巳以聽推心仰成至於一二之臣是惟同德下逮衆多之論曽靡間然方將甄敘賢愚修明法度務究本根而更治不求歲月之近功期於有成兹乃豫意奈何中道而將止夫亦奚託以為辭矧上下既交寧有不通之志而君臣相遇豈為易得之時當體余懷勉安厥位所乞宜不允賜外任臣寮進奉助祫享銀絹等敕書朕卜吉孟冬合食清廟禮樂交舉臣工畢從嘉守土之修官咸以時而來助各以其物粲然在庭載省勤誠良深歎尚賜觀文殿學士禮部尚書王舉正乞致仕不允詔十一月十四日夫朝廷之廣大賢俊之衆多必有皤然耆壽之臣以當上所優禮之異或事思所訪則有老成俾時之式瞻以為人望故禮雖七十猶有不得謝者焉卿懿文髙行有君子之風清節令問為當世所重閲書祕殿日侍清間進讀經筵坐論道德固非有官司之責筋力之勞宜思少安副我眷待鎮潼軍華隂縣雲臺觀修整真宗皇帝御容等殿今已了當扶請御容入本殿奉安祝文十一月十四日屹爾名山斯為福地翼然寶構式奉威靈繕完既新考卜惟吉鑒兹懇至永以妥安鎮潼軍華隂縣雲臺觀修整聖祖及真宗御容等殿今巳了當乞請御容入本殿奉安青詞十一月十四日伏以靈峯甚峻仙宇載嚴爰考吉辰奉寧真聖式伸祗告昭鑒乃誠賜相州觀察使劉從廣進奉乾元節馬詔卿蔚有敏材膺于寄任逺瞻壽節效乃誠勤在庭之獻肅陳事上之忠可見省閲之際嘉歎不忘賜觀文殿大學士尚書户部侍郎知定州龐籍乞退不允詔敕龐籍省所劄子奏以年齒衰殘自去年七月後纍奉表及劄子輸􅅹懇誠尋蒙差知定州亦曾面告秖乞一年許賜請老歸第伏望早賜差人承替得遂前懇事具悉夫難進易退雖士節之甚美而尚賢優老亦朝家之所先故禮稱引年而有不得謝卿以俊德為時舊臣柬於豫衷任以方面材猷甚壯視聽方強矧夫邊候無虞民事尤簡固可以偃息藩屏養頥精神而逺慕昔賢願還官政雖止足之意誠可尚於髙懷而眷遇之深難遽從於來請所乞宜不允故茲詔示想宜知悉冬寒卿比平安好遣書指不多及賜河陽三城節度使同中書門下平章事判河南府文彥博辭加恩不允詔十一月十七日敕彥博省所上表陳讓祫享禮畢加恩事具悉朕屬者潔齊精誠薦見宗廟蒙神之貺受福孔多推慶賜以大行均中外而咸及矧我同德乃時舊臣惟體貌之隆宜加於異數而褒優之意未稱於豫衷嘉讓節之甚勤顧成命之難止所讓宜不允故兹詔示想宜知悉冬寒卿比平安好遣書指不多及賜樞密使檢校太尉同中書門下平章事宋庠讓恩命第二表不允斷來章批答口宣卿陪祀疇勞啓封加命再形懇讓深識沖懷顧定志之弗移宜承命而毋忽西太一宫開啓祝聖壽年交金籙道埸青詞十一月二十三日伏以萬物堅成樂歲功之斯就四時迭運荷乾施之無窮爰即靈埸載啓科式薦以芬芳之潔通於杳默之神伏願威鑒昭臨福禧穰集固穹隆之壽曆延綿永之皇圖下逮羣生咸均餘祐萬壽觀寧華殿開啓溫成皇后忌辰道埸青詞十一月二十九日伏以妙道無方推乎善應清真昭格通以明誠追內則之有儀藹餘芳而未逺式臨諱日俾按醮科爰即琳宫肅延羽士冀資冥福永助仙遊閣門賜許懷德張茂實告敕口宣卿素稱忠勇僃著勞能俾更旄節之榮仍董貔貅之旅往膺寵命其體眷懷賜觀文殿學士禮部尚書王舉正乞致仕不允詔十一月二十九日卿精深之學足以待問清懿之望足以鎮浮嚮從守藩念逺賢之在外來侍經席冀開豫於未聞惟道德之所資非耆舊而誰處雖引年之制禮固有常而愛老之心豫寧敢怠所宜勉近醫藥輔安精神期臻壽康以副虛佇所乞宜不允賜馬步軍副都指揮使張茂實赴闕生料口宣十二月六日卿逺趨召節方屆都城惟兹餼品之豐式舉彞章之舊往祗寵錫式體眷懷班荆館賜契丹賀正旦人使到闕御筵口宣十二月九日卿等歲元兹始鄰好時修載馳使傳之勞方次都門之近宜伸頒錫式示眷懷正月五日賜賀正旦人使內中酒果口宣卿等夙將信聘來結鄰歡方伸宴飫一作飲之豐式示眷懷之意芳醪嘉實宜厚寵頒賜侍衛親軍馬軍副都指揮使張茂實讓恩命不允詔十二月十五日卿蔚有材武稱於周行早罄忠力膺豫寄任自分齊鉞屢易名邦俾更節制之權入總禁嚴之旅扞城宿衛皆汝職焉載閲來章雖嘉讓節趨祗成命宜體眷懷所讓宜不允內中福寧殿開啓天慶節道埸青詞伏以新陽叶律肇正於歲端嘉節紀時蓋遵於國典載嚴祕殿遐企上真薦兹蠲潔之誠杳達清冥之應冀承靈貺永祐皇圖內中福寧殿罷散天慶節道埸青詞伏以元符肇貺先聖是膺紀為令節之名著乃仙科之式用嚴禁密恭薦苾芬冀真馭之昭臨貺嘉祥而茂集基圖永固動植均休賜新除建雄軍節度使依舊殿前都指揮使許懷德讓恩命第二表不允斷來章批答十二月五日省表具之卿拔從行伍之微董我師徒之衆嘉爾勞舊優之寵榮乃思功效之未彰能形避讓之沖懇巳行之命其往欽承事上之忠無或怠忽所讓宜不允仍斷來章內中御侍巳下賀皇帝年節詞語妾等言伏以堯官謹曆萬物惟新夏數得天四時以正恭惟尊號皇帝陛下睿明稟哲慈儉保邦正朔頒行極舟車之所至仁恩一作慈溥及順天地以發生妾等忝僃掖庭獲瞻黼座順三微之首月祝萬壽於無疆賜夏國主進奉賀正旦馬駝詔王正首歲玉曆頒春眷惟繼世之忠克效守藩之職勤修時貢來旅明庭言念傾輸良深歎獎皇帝回契丹皇帝賀正旦書正月日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下歲端更始順陽律以布和信聘時修講鄰歡而增固閲書言之勤好加篚幣之腆豐感戢所深述宣罔既今懷化軍節度使耶律嘏等回專奉書陳謝不宣白皇帝回契丹皇帝達皇太后賀正旦書正月日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下玉曆頒時寶鄰交聘兼馳使馹别枉信函載傳慈懿之言益固講修之好顓希侍次達此悰誠今歸德軍節度使耶律思寧等回專奉書陳謝不宣白賜起居舍人知制誥劉敞等奬諭詔十二月九日敕劉敞省所進祫享詩事具悉祫大祭也禮久闕焉朕因時孟冬躬薦圭鬯永惟祖考之烈格于天地禮樂之盛昭乎一作于物容宜有儒學之臣形為頌歎之美卿議論閎博辭章爛然敷訓告以代豫言是惟其職發揄揚而稱上德聊見餘才省閲巳還嘉尚良切故兹獎諭想宜知悉賜刑部郎中充天章閣待制錢象先等獎諭詔十二月九日敕象先省所進祫享詩事具悉祫大祭也禮久闕焉朕因時孟冬躬薦圭鬯永惟祖考之烈格于天地禮樂之盛昭乎一作于物容宜有儒學之臣形為頌歎之美覽奏篇之來上慶熙事之有成文采可觀歎嘉于再故兹獎諭想宜知悉賜屯田貟外郎國子監直講梅堯臣獎諭敕書十二月九日敕梅堯臣省所進祫享詩事具悉汝行懿而粹學優而純以詩自名為衆所服矧乃詠祖宗之功德述禮樂之聲容宜被朱絃以薦清廟載披來獻深用歎嘉故兹獎諭想宜知悉賜西京作坊使知麟州王慶民獎諭敕書十二月十七日敕王慶民省所奏準密院劄子節文以臣撰成麟府二州絹圖一面并序目二册詣闕上進事具悉古之用兵者必因地形制方略然後可以策勝敗之算運竒正之謀爾以材武之資有敏明之識自膺柬寄出守邊封而能周知山川險易之形歷覽亭障屯防之要列為凡目粲爾一作可條陳不惟指掌於披圖足以因時而制變遽兹來上深體乃忠省閲以還歎嘉曷已故兹獎諭想宜知悉集英殿告遷宣祖皇帝昭憲皇后御容赴奉先禪院慶基殿奉安祝文伏以祖烈昭宣威神緬邈顧祠庭之夙敞崇寶構以載新冀即妥安永伸一作申嚴奉奉先禪院法堂上告遷宣祖皇帝昭憲皇后御容赴內中奉安祝文伏以早嚴寶殿以佇神遊今奉威靈即安清禁仰惟鑒格歆此精衷景靈宫奉真殿開啓真宗皇帝忌辰道埸看佛經都功德疏語伏以威神在天奉真逰而時格覺慈宣化敷慧福以無窮追諱日之甫臨演袐言而申薦永繄仁佑式慰孝衷景靈宫奉真殿真宗皇帝忌辰道埸看道經都功德疏語伏以琳宫嚴敞奉真馭以來臨寶笈飛華演靈篇而甚祕式屇遏音之日載深濡露之懷遐薦福因永資道蔭景靈宫廣孝殿章懿皇后忌辰道埸看佛經都功德疏語伏以諱日斯臨孝心增感永慕至慈之德載瞻大覺之雄既集善因遐資福果景靈宫廣孝殿章懿皇后忌辰道埸看道經都功德疏語伏以春露既濡孝思罔極即仙庭之祕邃誦金簡之精微仰冀清真永資遐福賜新除建雄軍節度使殿前都指揮使許懷德讓恩命第一表不允批答口宣卿以宿衛之勤勞能備著俾移使節式示眷懷冝體優恩勿持堅讓賜新除建雄軍節度使殿前都指揮使許懷德讓恩命第二表不允斷來章批答口宣卿夙推材武久擁節旄俾易名藩用伸優遇無煩固避往服新恩賜觀文殿學士尚書右丞田況乞致仕不允批答嘉祐五年正月八日省表具之卿德量足以容衆材識足以濟時蔚然君子之風綽有大臣之體自嬰疾恙求解樞機朕心惻然深以為惜乃惟書殿之清職自非耆哲而弗居俾從優遊以便頥飬所期福善之理當蒙勿藥之休還來輔豫以盡賢業遽形引謝良異眷懷所乞冝不允皇第九女封福安公主制正月二十四日門下朕稽有國之彞章著皇女之稱謂取其主以同姓所以見王體之尊必也錫之美名所以彰禮命之寵載涓吉日敷告在庭皇第九女岐嶷之姿有生知之異稟柔順之質得天性之自然方嚴保傳之規以飬肅雍之德俾遵舊典褒以徽章嘉乃妙齡盛哉儀服考僉言而惟允非豫意之敢私於戲隆仁恩以厚親兹惟教愛習圖史而循法繄乃夙成祗若訓言往膺渙渥一作命可封福安公主仍令所司擇日備禮册命主者施行皇第十女封慶壽公主制同日門下詩紀王姬之盛車服之制甚嚴漢優帝女之儀湯沐之封並列蓋敦國體匪曰親私惟始𬒳于寵章常推擇于嘉號載稽成憲誕告外庭皇第十女寶婺分暉仙源襲慶天姿異稟溫而有儀姆教不煩生而知善方居妙歲蔚有令猷朕仰承燕翼之謀兹膺一作膺兹蕃衍之祉俾新禮命式示褒榮於戲寵秩既崇在乎有德名稱甚美享乃多休祗服茂恩勿忘明訓可封慶壽公主仍令所司擇日僃禮册命主者施行內中御侍已下賀皇帝乾元節詞語正月二十六日妾等言正陽旅月式符誕聖之期令節稱觴共獻無疆之夀伏惟尊號皇帝陛下法堯聰睿躬禹儉勤厚德浸于黎元至仁同于覆載舟車所及聲教咸均罄兹率土之濵共效南山之祝妾等欣逢嘉會獲侍嚴宸敢望清光恭陳善頌無任歌時樂聖歡呼激切之至內制集卷第七在外嶽瀆等謝祫享禮畢祝文神報疑是伸報外集卷第七歐陽文忠公集五十七律詩三贈王介甫翰林風月三千首吏部文章二百年老去自憐心尚在後來誰與子爭先朱門歌舞爭新態緑綺塵埃試拂絃常恨聞名不相識相逢樽酒盍留連蘇才翁挽詩二首握手接歡言相知二十年文章家世事名譽弟兄賢可惜英魂掩惟餘醉墨傳秋風衰柳岸撫柩送歸船雄心壯志兩崢嶸誰謂中年志不成零落篇章為世寶平生風義見交情青松月下泉臺路白草原頭薤露聲自古英豪皆若此哭君徒有淚沾纓送石揚休還蜀長愛謫仙誇蜀道送君西望重吟哦路髙黃鵠飛不到花發杜鵑啼更多清禁寒生鳯池水繡衣榮照錦江波昔年同舍青襟子夾道歡迎鬢已皤和景仁試明經大義多不通有感庠序制猶闕鄉閭教不行古于經學政今也藝虛名來者益可鄙待之因愈輕無徒誚其陋講勸在公卿和公儀試進士終埸有作朝家意在取遺才樂育推仁亦至哉本欲勵賢敦古學可嗟趨利競朋來昔人自重身難進薄俗多端路久開何異鱣魴爭尺水巨魚先已化風雷久在病告近方赴直偶成拙詩二首經時移病久端居玉署新秋獨直廬夜靜樓臺落銀漢人間鈴索少文書江湖未去年華晚燈火微涼暑雨初敢向聖朝辭寵祿多慙禁籞一作闕養慵踈清晨下直大明宫馳馬悠然宿露中金闕雲開滄海日天街雨後緑槐風歲華忽忽雙流矢鬢髮蕭蕭一病翁名在玉堂歸未得西山畫閣興何窮送潤州通判屯田船頭初轉兩旗開清曉津亭疊鼓催自古江山最佳處況君談笑有餘才雲愁海闊驚濤漲木落霜清畫角哀善政已成多雅思寄詩宜逐驛筒來和劉原甫平山堂見寄督府繁華久已闌至今形勝可躋攀山橫天地蒼茫外花發池臺草莽間萬井笙歌遺俗在一樽風月屬君間遙知為我留真賞恨不相隨暫解顔送張吉老赴浙憲吳越東南冨百城路人應羡繡一作錦衣榮昔時結客曾逰處今見焚香夾道迎治世用刑期止殺仁心聽獄務求生時豐訟息多餘暇無惜新篇屢寄聲春日詞五首宫壇青陌賽牛回玉琯一作管東風逗曉來不待嶺梅傳逺信剪刀先放綵花開試粉東窗待曉回共尋春柳傍香臺不驚樹裏禽初變共喜叉頭燕已來紅霧初開上曉霞共驚風色變年華香車遙認春雷響庭雪先開玉樹花玉琯吹灰夜色殘雞鳴紅日上仙盤初驚百舌綿蠻語已覺東風料峭寒待曉銅荷剪蠟煤繡簾春色犯寒來畫眉不待張京兆自有新妝試落梅走筆答原甫提刑學士慶曆五年詳見卷末歲暮山城喜少留西亭尚欲挽行輈一樽莫惜臨岐别十載相逢各白頭酬淨照大師説佛説吾不學勞師忽𣢾關吾方仁義急君且水雲間意淡宜松鶴詩清叩珮環林泉苟有趣何必市㕓間和劉原父從幸後苑觀稻呈講筵諸公禁籞皇居接香畦鏤檻邊分渠自靈沼種稻滿滮田六榖名居首三農政所先擢莖蒙德茂飬實以時堅曉謁龍墀罷行瞻鳯蓋翩粹容知一作和喜色嘉瑞奏豐年衰病慙經學陪逰與俊賢安知帝力及但樂歲功全拜賜秋風裏分行黼座前自憐臺笠叟來綴侍臣篇送薛水部通判并州胸懷磊落逢知已氣略縱橫負壯心玉麈生風賔滿坐金鱗照甲士如林牛羊日暖山田美雨雪春寒土屋深自古幽并重豪俠秖應行樂費黃金鶴樊籠毛羽日低摧野水長松眼暫開萬里秋風天外意日斜間啄岸邉苔鴈來時沙磧已冰霜飛過江南木葉黃水闊天低雲暗淡朔風吹起自成行鶻依倚秋風氣象豪似欺黃雀在蓬蒿不知羽翼青冥上腐鼠相隨勢亦髙原甫致齋集禧余亦攝事後廟謹呈拙句兼簡聖俞受命分行攝上公紫微人在玉華宫樓臺碧瓦輝雲日蓮芰清香帶水風每接少年嗟老病尚能聮句惱詩翁凌一作臨晨已事追佳賞緑李甘瓜興未窮同年祕書丞陳動之挽詞二首埸屋當年氣最雄交遊樽酒弟兄同文章落筆傳都下議論生鋒服座中自古聖賢誰一作猶不死況君門戶有清風凋零三十年朋舊在者多為白髮翁冨貴聲名豈足論死生榮辱等埃塵青衫照日誇春榜白首餘年哭故人盛德不忘存志刻話言能記有朋親吳江草木春風動瀝酒誰瞻壠樹新奉和劉舍人初雪夜雪填空曉更飄龍墀風冷珮聲髙瓊花落處縈仙仗玉殿光中認赭袍下直笑談多樂事平時樽酒屬吾曹羡君年少才無敵顧我雖衰飲尚豪暮春書事呈四舍人樹隂初合苔生暈花蘂新成蜜滿脾鶯燕各歸巢哺子蛙魚共樂雨添池少年春物今如此老病衰翁了不知飽食杜門何所事日長偏與睡相宜荷葉池靣風來波瀲瀲波間露下葉田田誰於水上張青蓋罩却紅妝唱採蓮小池深院無人鎖曲池莓苔繞岸雨生衣緑萍合處蜻蜓立紅蓼開時蛺蝶飛釣者風牽釣線裊長竿短笠輕蓑細草間春雨濛濛看不見一作足水煙埋却靣前山霜一夜新霜著瓦輕芭蕉心折敗荷傾奈寒惟有東籬菊金蘂繁開曉更清牛日出東籬黃雀驚雪銷春動草芽生土坡平慢陂田闊橫載童兒帶犢行送劉虛白二首祕訣誰傳妙若神能將題品遍朝紳因言禍福兼忠孝吾愛君平善誨人我嗟韁鎖若牽拘久羡南山去結廬自顧豈勞君借譽偶然章服裹猿狙劉丞相挽詞二首南國鄰鄉邑東都並俊逰賜袍聮唱第命相見封侯念昔趨黃閣相看笑白頭盛衰同俯仰旌旐送山丘連章相府辭榮寵擁斾名都出鎮臨年少已推能宰社鄉人終不見揮金長蛟息浪歸帆穩喬木生煙蔽日深平昔家庭敦友愛可憐松檟亦連隂寄大名程資政琳龍門長恨晚方登便以忘年接後生談劇每容陪玉麈飲豪常憶困金觥冰開御水春應緑雲破淮天月自明醉倒離筵聽别曲醒來猶尚記餘聲東齋對雪有懷東齋坐客飲方豪誰報風簾雪已飄貪聽樽前歌裊裊不聞窗外響蕭蕭已憐殘臘催梅蘂更約新春探柳條共憶瀛洲人獨直神仙清景正寥寥雪後玉堂夜直雪壓宫墻鎖禁城沉沉樓殿景尤清玉堂影亂燈交晃銀闕光寒夜自明塵暗圖書愁獨直人間鈴索久無聲鑾坡地峻誰能到莫惜宫壷酒屢傾官舍假日書懷奉呈子華內翰長文原甫景仁舍人聖俞博士鎖印春風雪入簾天寒鳥雀聚空簷青幡受歲兒童喜白髮催人老病添艷舞回腰飛玉盞清吟擁鼻對冰蟾相從一笑兩莫得簿領區區嘆米鹽酬王君玉中秋席上待月值雨池上雖然無皓魄樽前殊未減清歡緑醅自有寒中力紅粉尤宜燭下看羅綺塵隨歌扇動管絃聲雜雨荷乾客舟間卧王夫子詩陳教誰主將壇中秋不見月問客試問玉蟾寒皎皎何如銀燭亂熒熒不知桂魄今何在應在吾家紫石屏張仲通示墨竹嗣以嘉一作佳篇豈勝欽玩聊以四韻仰酬厚貺數竿蒼翠寫生綃寄我公齋伴寂寥不待雪霜常一作長凛凛雖無風雨自蕭蕭嗟豫心志俱憔悴羡子文章騁一作足冨饒嗣以嘉一作佳篇誠厚貺逺慚為報乏瓊瑶奉寄襄陽張學士兄東津渌水南山色夢寐襄陽二十年豫昔遊漢上嘗愛其山川逮今十六七年矣顧我百憂今白首羡君千騎若登仙花開漢女遊堤上人看仙翁擁道邉況有玉鍾應不負夜槽春酒響如泉奉答聖俞宿直見寄之作寒夜分曹直嚴城隔幾層豫慚批鳯詔一作諾君歎守螢燈病骨羸漳浦官書蠹羽陵無嫌學舍冷文字比清冰和原甫舍人閣下午寢歸有作遙知好睡紫微郎枕簟清薰緑蕙芳五色詔成人不到萬年風動閣生涼平時下直歸宜早陋巷相過意未忘揚子不煩多載酒主人猶可具一作共黃粱聞原甫久在病告有感東城移疾久離居安得疑蛇意盡祛諸老何為讒賈誼君王猶未識相如浮沉俗喜隨時態磊落材多與世踈誰謂文章金馬客翻同憔悴楚三閭試筆試筆消長日耽書遣百憂餘生得如此萬事復何求黃犬可為戒白雲當自由無將一抔土欲塞九河流齋宫感事寄原甫學士曾向齋宫詠麥秋緑隂佳樹覆墻頭重來滿地新霜葉却憶初聞黃栗留戲答仲儀口號弊居回看如蛙穴華宇來棲若燕身寄宿人家敢望笙歌行樂事只憂無米過來春今年逺近大水稼穡何望觀龍圖閣三聖御書應制層􅌟嚴清禁披圖爛寶文虹霓光照物龍鳯勢騰雲妙極功歸一真隨體自分孝思遵寶訓聖業廣惟勤題東閣後集一作題營丘集後東閣三朝多大事營丘二載足三字一作兩郡半間辭近詩留作歸榮集何日歸田自集詩日長偶書日長漸覺逍遙樂何況終朝無事人安得遂為無事者人間萬慮不關身寄答王仲儀太尉素豐樂山前一醉翁餘䶖有幾百憂攻平生自恃一作是心無愧直道誠知世不容換骨莫求丹九轉榮名豈在祿千鍾明年今日如尋我潁水東西問老農解官後答韓魏公見寄報國勤勞已蔑聞終身榮遇最無倫老為南畝一夫去猶是東宫二品臣侍從籍通清切禁笑歌行作太平民欲知念舊君恩厚二者難兼始兩人新制推恩致仕許依舊兼職自王仲儀始今某仍出特恩余昔留守南都得與杜祁公唱和詩有答公見贈二十韻之卒章云報國如乖碩歸耕寧買田期無辱知已肯逐利名遷逮今二十有二年祁公捐館亦十有五年矣而余始蒙恩得遂退休之請追懷平昔不勝感涕輒為短句置公祠堂掩涕發陳編追思二十年門生今白首墓木已蒼煙報國如乖碩歸耕寧買田此言今始踐知不愧黃泉答端明王尚書見寄兼簡景仁文𥙿二侍郎二首日久都城車馬喧豈知風月屬三賢唱髙誰敢投詩社行處人爭看地仙酒靣撥醅浮大白舞腰催拍趂繁絃與公等是休官者方把鋤犁學事田多病新還太守章歸來白首興何長琴書自是千金産日月間銷百刻香尚有俸錢酤美酒自栽花圃趂新陽醉翁生計今如此一笑何時共一觴寄題景純學士藏春塢新居清才四紀擅時名晚卜丘林遂解纓欲借青春藏向此須知白首尚多情水浮花出人間去山近雲從席上生漫一作謾説市朝堪大隱仙家誰信在重城會老堂古來交道愧難終此會今時豈易逢出處三朝俱白首凋零萬木見青松公能不逺來千里我病猶堪釂一鍾已勝山隂空興盡且留歸駕為從容叔平少師去後會老堂獨坐偶成積雨荒庭遍緑苔西堂瀟灑為誰開愛酒少師花落去彈琴道士月明來雞啼日午衡門靜鶴唳風清晝夢回野老但欣南畝伴豈知一作峯髙名籍在蓬萊退居述懷寄北京韓侍中一首悠悠身世比浮雲白首歸來潁水濆曾看元臣調鼎鼐却尋田叟問耕耘一生勤苦書千卷萬事銷磨酒百分放浪豈無方外士尚思親友念離羣書殿宫臣寵並叨不同憔悴返漁樵無窮興味間中得強半光隂醉裏銷靜愛竹時來野寺獨尋春偶過溪橋猶須五物稱居士不及顔回飲一瓢贈潘道士門無車轍紫苔侵雞犬蕭條陋巷深寄語彈琴潘道士雨中尋得越江吟答樞密吳給事見寄老得間來興味長問將何事送餘光春寒擁𬒳三竿日宴坐忘言一炷香報國愧無功尺寸歸田仍值嵗豐穰樞庭任重才餘暇猶有新篇寄草堂答判班孫待制見寄三朝竊寵幸逢辰晚節恩深許乞身無用物中仍老病太平時得作間人鳴琴酌酒留嘉客引水栽花過一春惟恨江淹才已盡難酬開府句清新初夏西湖積雨新晴漲碧溪偶尋行處獨依依緑隂黃鳥春歸後紅花青苔人迹稀萍匝汀洲魚自躍日長欄檻燕交飛林僧不用相迎送吾欲臺頭坐釣磯寄河陽王宣徽誰謂蕭條潁水邊能令嘉客少留連肥魚美酒偏宜老明月清風不用錢況值湖園方首夏正當櫻筍似三川自知不及南都會勉強猶須詫短篇寄韓子華并序余與韓子華長文禹玉同直玉堂嘗約五十八嵗致仕子華書于柱上其後荐蒙恩寵世故多囏歷仕三朝備位二府巳過限七年方能乞身歸老俗諺云也賣弄得過裏人事從來無處定世塗多故踐言難誰如潁水間居士十頃西湖一釣竿戲劉原甫見蔡絛西清詩話已下續添平生志業有誰先落筆文章海內傳昨日都城應紙貴開簾却扇見新篇仙家千載一何長浮世空驚日月忙洞裏新花莫相笑劉郎今是老劉郎和子履逰泗上雍家園長橋南走群山間中有雍子之名園蒼雲蔽天竹色淨暖日撲地花氣繁飛泉來從逺嶺背林下曲折寒波翻珍禽不可見毛羽數聲清絶如哀彈我來據石弄瑟瑟惟恐日暮登歸軒塵紛解剝耳目異秖疑夢入神仙村知君襟尚我同好作詩閎放莫可攀髙篇絶景兩不及久之想像空冥煩右雍家園詩吉綿閩本皆入公外集而王荆公四家詩選亦有之今乃載蘇子美滄浪集後人安得不疑或謂公親作滄浪集序不應誤雜巳詩可以無疑姑附見于此按王荆公取公詩凡一百二十五首內一百三首載居士集二十一首載外集又一篇即此詩其它或全改一聮或增減一聮甚者至增四聮或移兩聮之類巳注一作于逐篇豈當時傳本不同抑荆公自加潤色也京本子履姓陳衆本並作弄琴瑟惟蜀本作瑟瑟外集卷第七嘉祐三年二月公館伴北使在都亭驛有戲寄梅聖俞絶句聖俞集中次韻云去年鎖宿得聮華二月墻頭始見花今日都亭公感物明朝太學我辭家上丁釋奠致齋公詩無之久在病告近方赴直偶成拙詩二首宿露一作宿霧答原甫提刑學士慶曆五年冬公守滁州而前政趙良規帶祕閣校理移京西提刑即其人也合入苐六卷陳動之挽詞或作洞非登科記可據釣者釣線一作鈎線退居述懷寄韓侍中頴水濆衆本皆作濵不特别韻而韓公文集載和篇亦作濆今從之奏議卷第七歐陽文忠公集一百三諌院論捕賊賞罰劄子慶曆三年臣伏見方今天下盜賊縱橫王倫張海等所過州縣縣尉巡檢有迎賊飲宴者有獻其器甲者有畏懦走避者有𬒳其驅役者朝廷於此憂賊之時正患乏人之際或於巡檢縣尉之內得一捕賊可使之人則必須特示旌酬以行激勵苟或未能者猶須懸賞以待之何況有而失賞伏見吏部選人區法自出身以來兩任縣尉𥘉任臨江軍新淦縣三年之內大小賊盜獲四十餘火內雖小盜數多其如強劫群賊亦不為少據於賞格合改京官而有司守纎細之文執尋常之例謂其所獲雖為全火而不同時因不與理為勞績臣料一作謂天下州縣盜賊之多無如新淦天下縣尉能捉賊之多亦無如區法又聞法次任吉水縣尉使其縣民結為伍保至今吉水一縣全無盜賊民甚便之法為縣尉官至卑賤所至之處皆有可稱臣思朝廷非不欲賞善罰惡以行勸戒而患於有司法弊拘守常文致抑才能失於旌賞其區法偶與臣相識因得知之然人所不知抑而不申者何可勝數竊以盜賊是方今急患縣尉方今切要之人皆朝廷常合留意之事臣輒有起請事件具畫一如後一選人區法捕賊之效甚多但為有司拘守細碎之文不理勞績其人已升得職官伏乞追取本人歷子别加考驗如實有勞能即乞不拘常格特與酬獎以勸後來一臣謂天下群盜縱橫皆由小盜合聚今但患其大而不防其微故必欲止盜先從其小能絶小盜者巡檢縣尉也然而賞罰之法其弊極多只如捕盜去惡但要淨盡豈必須是一日之內同時捕獲假如有全火強盜縣尉巡檢以死命鬪敵若於兩日內捉盡已不理為勞績其守文之弊如此極多欲乞下銓司重定捕賊賞格施一作頒行一臣伏見自天下有盜賊以來議者多陳禦盜之䇿皆欲使民結為伍保則姦惡不容今區法於吉水縣立伍保之法三年之內劫賊不敢入其縣界臣欲乞特降指揮下江南西路體量吉水縣自區法創立伍保之法以來如實全無劫賊又一作及民間以為便利即乞頒行伍保之法於天下右謹具如前取進止論光化軍叛兵家口不可赦劄子同前臣竊見近日盜賊縱橫張海等二三百人未能敗滅光化軍宣毅又二三百人作亂臣謂朝廷致得盜賊如是者不惟中外無備蓋由威令不行昨王倫賊殺主將自置官稱著黃衣改年號事狀如此乃是反賊使其不敗為患如何既敗之後不誅家族凡小人作事亦須先計成敗今使其事成則獲大利不成則無大禍有利無害誰不欲反只如淮南一帶官吏與王倫飲宴率民金帛獻送開門納賊道左參迎苟有國法豈敢如此而往來取勘一作會巳及半年未能斷遣古者稱罰不踰時所以威激士衆今遲緩如此誰有懼心遂致張海等官吏依前迎奉順陽縣令李正巳延賊飲宴宿于縣廳恣其劫掠鼓樂送出城外其人敢如此者蓋為不奉賊則死不奉朝廷則不死所以畏賊過如畏國法臣恐朝廷威令從此遂弱盜賊凶勢從此轉強臣聞刑期無刑殺以止殺寬猛相濟用各有時伏望陛下勿採迂儒所説婦人女子之仁尚行小惠以誤大事其宣毅兵士必有家族伏乞盡戮於光化市中使逺近聞之悚畏以止續起之賊其李正己仍聞已有臺憲上言亦乞斬於鄧州使京西一路官吏聞之畏恐知國法尚存不敢奉賊從來只𬒳迂懦之人因循不斷誤陛下事壞得天下事勢巳如此不可更循舊弊有失威斷惟陛下力行之取進止薦李允知光化軍劄子同前臣近為光化軍遭韓綱酷虐致得兵士作亂曽薦國子博士李允前知光化軍日軍民畏愛乞却令依舊知軍不蒙朝廷施行近聞光化軍兵民官吏列狀奏乞李允知軍正與臣等所言符合臣等職在諌諍事無大小只要上益朝廷下叶物議今來所薦李允臣皆不識其面但採訪得此人實有吏才在光化日甚有惠政當此軍城一作賊燒劫之後此人必可撫綏今朝廷只見臣等薦論未賜深信既是本軍陳乞可以不疑朝廷前來失選良吏致因韓綱屠虐軍城今又不能別選良吏撫綏殘破致使軍民自乞一舊知軍若又不與則臣恐軍民怨怒變亂復生其李允伏乞依光化軍民所請却令知軍取進止論韓綱棄城乞依法劄子同前臣伏見前知光化軍韓綱近為酷虐兵士致兵士等作亂攻劫州縣驚動朝廷上貽君父之憂下致生民之患而又不畏法棄城遁走其罪狀顯著便合誅夷朝廷慎於用刑尚令勘鞫至今多日未見施行竊以斷獄之議不過兩端而已有正法則依法無正法則原情今韓綱所犯法有明文情無可恕謹按律文主將守城為賊所攻不固守而棄者斬此韓綱於法當斬有明文也綱不能撫綏士卒致其叛亂但其棄城而走情最難容當𥘉亂兵未有器械韓綱手下自有六十餘人不亂兵士又有官庫器甲既不能盡力禦捍又不能閉城堅守公然將手下兵士津送全家上船便棄牌印城池而去致兵之亂起自綱身臨難逃身而不死國方今盜賊可憂之際若使天下州縣皆效韓綱見賊便走則在處城池皆為賊有陛下州縣誰肯守之此韓綱之情又無可恕也綱之一死理在不疑一有然字外人但見拖延多日未行斷決皆謂朝廷好行姑息漸有恩貸之意又緣綱是大臣家子作如此大過生如此大患犯如此大刑名若曲法不行即不知一作今後孤寒有罪者何以行法其韓綱伏望聖慈出於睿斷早賜依法施行取進止論乞賑救飢民劄子慶曆三年臣伏見近降大雪雖是將來豐熟之兆然即日一作目陜西飢民流亡者衆同華河中尤甚往往道路遺棄小兒不少只聞朝旨令那移近邊兵馬及於有官米處出糶此外未聞别行賑救此急在旦夕不可遲回其遺棄小兒亦乞早降指揮令長吏收恤仍聞京西東大雪不止毀折桑柘不少竊慮向去絲蠶稅賦無所出致貧民起為盜賊亦乞特降指揮體量臣竊見國史書祖宗朝每奏一兩州軍小有災傷亦隨多少賑恤或蠲免稅租蓋以所放者少不損國用又察民疾苦微細不遺所以國恩流布民不怨嗟不必須待災傷廣闊方行賑救也方今人貧下怨之際不厭頻推恩惠伏望聖慈特賜矜憫取進止論救賑雪後飢民劄子同前臣風聞京城大雪之後民間飢寒之人甚多至有子母數口一時凍死者雖豪貴之家往往亦無薪炭則貧弱之民可知矣蓋京師小民例無蓄積只是朝夕旋營口食一日不營求則頓至乏絶今大雪已及十日使市井之民十日不營求雖中人亦乏絶矣況小民哉雪於農民雖為利澤然農畒之利逺及春夏細民所苦急在目前日夕已來民之凍死者漸多未聞官司有所賑救欲乞特降聖旨下開封府或分遣使臣遍録民間貧凍不能自存者量散口食并各於有官埸柴炭草處就近支散救其將死之命至於諸營出軍家口亦冝量加存恤以示聖息所散不多所利者衆仍令兩府條件應有軍七在外辛苦及民人支移稅賦殘零輸送艱辛等處並與擘畫早加存恤若使戍兵愁苦道路怨嗟飢凍之尸列于京邑則大雪之澤其利未見而數事之失所損已多伏乞聖慈特賜留意取進止論澧州瑞木乞不宣示外廷劄子同前臣近聞澧州進柿木成文有太平之道四字其知州馮載本是武人不識事體便為祥瑞以媚朝廷臣謂前世號稱太平者須是四海晏然萬物得所方今西羌叛逆未平之患在前北虜驕悖藏伏之禍在後一患未滅一患巳萌加以西則瀘戎南則湖嶺凡與四夷連接無一處無事而又內則百姓困弊盜賊縱橫昨京西陜西出兵八九千人捕數百之盜不能一時剪滅只是僅能潰散然却於别處結集今張海雖死而逹州軍賊巳却百人又殺使臣其勢不小興州又奏八九十人州縣皇皇何以存濟以臣視之乃是四海騷然萬物失所實未見太平之象臣聞天道貴信示人不欺臣不敢逺引他事只以今年內事驗之昨夏秋之間太白經天纍月不滅金木相掩近在端門考於星占皆是天下大兵將起之象豈有才出大兵之象又出太平之道一無道字字一歲之內前後頓殊豈非星象麗天異不虛出凡一作冝於戒懼常合修省而草木萬類變化無常不可信慿便生懈怠臣又思若使木文不偽實是天生則亦有深意蓋其文止曰太平之道者其意可推也夫自古帝王致太平皆自有道得其道則太平失其道則危亂臣視方今但見其失未見其得也願陛下憂勤萬務舉賢納善常如近日不生逸豫則三二歲間漸期修理若以前賊張海等小衰便謂後賊不足憂以近京得雪便謂天下大豐熟見北虜未來便謂必無事見西賊通使便謂可罷兵指望太平漸生安逸則此瑞木乃誤事之妖木耳臣見今年一作頃見太平州曽進芝草者今又進瑞木竊慮四方相效爭造妖妄其所進瑞木伏乞更不宣示臣寮仍乞速詔天下州軍告以興兵纍年四海困弊方當責已憂勞之際凡有竒禽異獸草木之類並不得進獻所以彰示聖一作明德感勵臣民取進止論美人張氏恩寵冝加裁損劄子同前臣近風聞禁中因皇女降生於左藏庫取綾羅八千匹染院工匠當此大雪苦寒之際敲冰取水染練供應頗甚艱辛臣伏思陛下恭儉勤勞愛民憂國以此勞人枉費之事必不肯為然外議相傳皆云見今染練未絶臣又見近日內降美人張氏親戚恩澤太頻臣忝為諌官每聞小有虧損聖德之事須合力言難避天譴臣竊見自古帝王所寵嬪御若能謙儉柔善不求恩澤則可長保君恩或恣意驕奢多求恩澤則皆速致禍敗臣不敢逺引古事只以今宫禁近事言之陛下近年所寵尚氏楊氏余氏苗氏之類當其𬒳寵之時驕奢自恣不早裁損及至滿盈今皆何在況聞張氏本良家子昨自修媛退為美人中外皆聞以謂與楊尚等不同故能保寵最久今一旦宫中取索頓多恩澤日廣漸為奢侈之事以招外人之言臣不知陛下欲愛惜保全張氏或欲縱恣而敗之若欲保全則須常令謙儉不至驕盈臣料八千匹綾羅豈是一作必非張氏一人獨用不過支散與衆人而巳乃是枉費財物盡為衆人至於中外譏議則陛下自受以此而言廣散何益昨正月一日曹氏封縣君至𥘉五日又封郡君四五日間兩度封拜又聞别有內降應是踈逺親戚盡求恩澤父母因子而貴可矣然名分亦不可太過其他踈逺皆可減罷臣謂張氏未入宫之前踈逺親戚各皆何在今日冨貴何必廣為間人自招謗議以纍聖德若陛下只為張氏計亦冝如此況此事不獨為張氏大凡後宫恩澤太多宫中用度奢侈皆是虧損聖德之事繫於國體臣合力言伏望聖慈防微杜漸早為裁損取進止論乞止絶河北伐民桑柘劄子同前臣風聞河北京東諸州軍見修防城器具民間配率甚多澶州濮州地少林木即今澶州之民為無木植送納盡伐桑柘納官臣謂農桑是生民衣食之源租調繫國家用度之急不惟絶其根本使民無以為生至於供出賦租將來何以取足臣伏思兵興以來天下公私匱乏者殆非夷狄為患全由官吏壞之其誅剝疲民為國斂怨蓋由郡縣之吏不得其人故臣前後纍乞澄汰天下官吏者蓋備見其弊如此也今澶州之民驟罹此苦豈非長吏非才處事乖繆所致兼聞澶州民桑巳伐及三四十萬株竊慮他郡盡皆效此伏乞早賜旨揮禁絶其合用材木仍乞下轉運司令相度漸次那容準備其澶州人户經伐桑者乞差官檢覆量多少與權免將來絲綿紬絹之稅竊以軍國所須出自民力必欲外禦契丹之患常須優飬河朔之民若使道路怨嗟人心離叛則內外之患何以枝梧伏望聖慈特賜留意取進止論方田均稅劄子同前臣竊見近有臣寮上言均天下稅賦已送三司商量施行臣嘗聞自前諸處亦曽有均稅者多是不知均定一作稅之術或嚴行刑法或引惹詞訟或姦民欺隱或官吏誅求稅未及均民已大擾臣前任通判滑州日有祕書丞孫琳與臣同官其人言先差往洺州肥鄉縣與郭咨均稅創立千步方田法括定民田並無欺隱亦不行刑罰民又絶無詞訟其時均定稅後逃户歸業者五百餘家復得稅數不少公私皆利簡當易行其千步均田法自有制度二十餘條臣在滑州時因聞此事遂略行體問鄰近州軍大率稅賦失陷一半方欲陳述乞行琳等均田之法今來已有臣寮上言均稅事竊慮未得千步方田簡當之法其孫琳見任滑州職官郭咨為崇儀副使在外欲乞召此二人送三司令一處商量一有取進止字奏議卷第七薦李知允光化軍劄子允臣此下少一等字失選一作不能選論韓綱棄城劄子其棄城一作棄其城在處城在一作到論乞救賑飢民劄子京西東一作京東京西免稅租一作免租稅論澧州瑞木劄子未來一字一作不舉兵論美人張氏恩寵劄子以此勞人以一作似論方田均稅劄子郭咨一作咨居士集卷第七歐陽文忠公集七古詩二十二首贈沈博士歌遵一作醉翁吟沈夫子胡為醉翁吟醉翁豈能知爾琴滁山髙絶滁水深空巖悲風夜吹林山一作泉溜白玉懸青岑一瀉萬仞源莫尋醉翁每來喜登臨醉倒石上遺其簮雲荒石老歲月侵子有三尺徽一作暉黃金寫我幽思窮﨑嶔自言愛此萬仞水謂是太古之遺音泉淙石亂到不平指下嗚咽悲人心時時弄餘聲言語軟滑如春禽嗟乎沈夫子爾琴誠工彈且止我昔𬒳謫居滁山名雖一作雖名為翁實少年坐中醉客誰最賢杜彬琵琶皮作絃自從彬死世莫傳玉練鎖東坡詩云新客從翻王連鎖練疑當作連聲入黃泉死生聚散日零落耳冷心衰翁索莫國恩未報慙祿厚世事多虞嗟力薄顔摧鬢改真一翁心以一作巳憂醉安知樂沈夫子謂我翁言何苦悲人生百年間飲酒能幾時攬衣推琴起視夜仰見河漢西南移和聖俞李侯家鴨腳子鴨腳生江南名實未相浮絳囊因入貢銀杏貴中州致逺有餘力好竒自賢侯因令江上根結實夷門秋始摘才三四金奩獻凝旒公卿不及識天子百金酬歲久子漸多纍纍枝上稠主人名好客贈我比珠投博望昔所徙蒲萄安石榴想其𥘉來時厥價與此侔今也遍中國籬根及牆頭物性久雖在人情逐時流惟當記其始後世知來由是亦史官法豈徒續君謳京師無鴨腳樹駙馬都尉李和文自南方移植于其第送吳生南歸一作送吳孝宗字子京自我得曽子於兹二十年今又得吳生既得喜且歎古士不並出百年猶比肩區區彼江西其産多材賢吳生𥘉自疑所擬豈其倫我始見曽子文章𥘉亦然崑崙傾黃河渺漫盈百川決疏以道一作導之漸斂收橫瀾東溟知所歸識路到不難吳生始見我袖藏新文篇一作編忽從布褐中百寶寫一作瀉我前明珠雜璣貝磊砢或不圎問生久懷此奈何𥘉無聞吳生不自隱欲吐羞俯顔少也不自重不為鄉人憐中雖知自悔學問苦賤貧自謂久而信力行困彌堅今來決疑惑幸冀蒙洗湔我笑謂吳生爾其聽我言世所謂君子何異於衆人衆人為不善積微成滅身君子能自知改過不逡巡惟於斯二者愚智遂以分顔回不二過後世稱其仁孔子過而更日月披浮雲子路初來時雞冠佩猳豚斬蛟射白額後卒為名臣子既悔其往人誰禦其新醜夫祀上帝孟子豈不云臨行贈此言庶可以書紳樂哉襄陽人送劉太尉從廣一作景元赴襄陽一本無下三字景元蓋字嗟爾樂哉襄陽人萬屋連甍清漢濵語言輕清微帶秦南通交廣西峨岷羅縠纎麗藥物珍枇杷甘橘薦清樽磊落金盤爛璘璘槎頭縮項昔所聞黃橙搗一作橙搗新虀香復辛春雷動地竹走根錦苞玉筍味爭新鳯林花發南山春掩映谷口藏山門樓臺金碧瓦鱗鱗峴首髙亭倚浮雲漢水如天瀉沄沄斜陽返照白鳥羣兩岸桑柘雜耕耘文王遺化已寂寞千載誰復思其仁荆州漢魏以來重古今相望多名臣嗟爾樂哉襄陽人道扶白髮抱幼孫逺迎劉侯朱兩一作望朱輪劉侯年少氣甚淳詩書學問若寒士樽爼談笑多嘉賔往時邢洺一作臺有善政至今遺愛留其民誰能持我詩以往為我先賀襄陽人奉酬楊州劉舍人見寄之作原父一作酬劉原父見寄别君今幾時歲月如插羽悠悠寢與食忽忽朝復暮紛紛竟何為凜凜還自懼朝廷無獻納倉廩徒耗蠹風霜苦見侵衰病日增故江湖豈不思懇悃布已屢美哉廣陵公風政傳道路優遊侍從臣左右天子顧君來一何遲我請亦有素何當兩還分尚冀一相遇把手或未能尺書幸時寓西齋手植菊花過節始開偶書奉呈聖俞秋風吹浮雲寒雨灑清曉鮮鮮牆下菊顔色一何好好色豈能常得時仍不早文章損精神何用覻天巧四時悲代謝萬物惜凋稿豈知寒鑑中兩鬢甚秋草東城彼詩翁學問同少一作年小風塵世事多日月良會少我有一樽酒念君思共倒上浮黃金蘂送以清歌裊為君發朱顔可以却君老於劉功曹家見楊直講褒女奴彈琵琶戲作呈聖俞大絃聲遲小絃促十歲嬌兒彈啄木啄木不啄新生枝惟啄槎牙一作牙槎枯樹腹花繁蔽日鎖空園樹老參天杳深谷不見啄木鳥但聞啄木聲春風和暖百鳥語山路磽確行人行啄木飛從何處來花間葉底時丁丁林空山靜啄愈響行人舉頭飛鳥驚嬌兒身小指撥硬功曹廳冷絃索鳴繁聲急節傾四坐為爾飲盡黃金觥楊君好雅心不俗太學官卑飯脫栗嬌兒兩幅青布裙三腳木牀坐調曲竒書古畫不論價盛以錦囊裝玉軸披圗掩卷有時倦卧聽琵琶仰看屋客來呼兒旋梳洗滿額花鈿貼黃菊雖然可愛眉目秀無奈長飢頭頸縮宛陵詩翁勿誚渠人生自足乃為娛此兒此曲翁家無長句送陸子履學士通判宿州一本作亳州非古人相馬不相皮瘦馬雖瘦骨法竒世無伯樂良可嗤千金市馬惟市一作其肥騏驥伏櫪兩耳垂夜聞秋風仰秣嘶一朝絡以黃金羈旦刷一作發吳越暮燕陲丈夫可憐憔悴時世俗庸庸皆見遺子履自少聲名馳落筆文章天下知開懷吐胸不自疑世路迫窄多穽機鬢毛零落風霜摧十年江湖千首詩歸來京國舊遊非大笑相逢索酒巵酒酣猶能弄蛾眉山川搖落百草腓愛君不改青松枝念君明當整驂騑贈以瑤華期早歸豈惟朋友相追隨坐使臺閣生光輝送公期得假歸絳風吹積雪銷太行水暖河橋楊柳芳少年𥘉仕即京國故里幾歸成鬢霜山行馬瘦春泥滑野飯天寒餳粥香留連芳一作風物佳節過束帶還來朝未央送宋次道學士赴一作知太平州敏求古堤老柳藏一作楊柳棑春煙桃花水下清明前江南太守見之笑擊鼓插旗催解船一作打鼓插旗催發船侍中令德冝有後學士清才方少年文章秀粹得家法筆畫點綴多餘一作逾妍藏書萬卷復強記故事纍朝能口傳來居侍從乃其職逺置州郡誰謂本多作為然交遊一時盡英一作豪俊車馬兩岸來聮翩船頭朝轉暮千里有酒胡不為一作為不留連謝觀文王尚書惠西京牡丹舉正京師輕薄兒意氣多豪俠爭誇朱顔事年少肯慰白髮將花插尚書好事與俗殊憐我霜毛苦蕭颯贈以一作寄贈洛陽花滿盤鬪麗爭竒紅紫雜兩京相去五百里幾日馳來足何捷紫檀金粉香未吐緑蕚紅苞露猶浥謂我嘗為洛陽客頗向此花曽涉獵憶昔進士𥘉登科始事相公沿吏牒河南官屬盡賢俊洛城池一作苑籞相連接我時年才二十餘每到花開如蛺蝶姚黃魏紅腰帶鞓潑墨齊頭藏緑葉鶴翎添色又其次此外雖妍猶婢妾爾來不覺三十年歲月才如熟羊胛無情草木不改色多難人生自摧拉見花了了雖舊識感物依依幾抆睫念昔逢花必沽酒起坐歡呼屢傾榼而今得酒復何為愛花繞之空百匝心衰力懶難勉強與昔一何殊勇怯感公意厚不知報墨筆淋漓口徒囁送朱職方提舉運鹽一本云表臣齊人謹一作建鹽策伯者之事爾計口收其餘登耗以生齒民充國亦冨粲若有條理惟一作雖非三王法儒者猶為恥後世益不然榷奪由漢始權量自持操屑屑已甚矣穴竈如蜂房熬波銷海水豈知戴白民食淡有至死物艱利愈厚令出姦隨起良民陷盜賊峻法難禁止問官得幾何月課煩笞箠公私兩皆然巧拙可知已英英職方郎文行粹而美連年宿與泗有政皆可紀忽來從辟書感激赴知已閔然哀逺人吐䇿獻天子治國如治身四民猶四體奈何窒其一無異釱厥趾工作而商行一作與商賈本末相表裏臣請通其流為國掃泥滓金錢歸府藏滋味飽閭里利害難先言歲月可較比鹽官皆謂然丞相曰可喜適時乃為才髙論徒譎詭夷吾苟今一作復出未以彼易此隋堤樹毶毶汴水流瀰瀰子行其勉旃吾黨方傾耳嘗新茶呈聖俞建安三千里京師三月嘗新茶人情好先務取勝百物貴早相矜誇年窮臘盡春欲動蟄雷未起驅龍一作龍未起驅蟲蛇夜聞擊鼓滿山谷千人助叫聲喊呀萬木寒廢睡不醒惟有此樹先萌芽乃知此為最靈物冝一作疑其獨得天地之英華終朝採摘不盈掬通犀銙小圎復窊鄙哉榖雨槍與旗多不足貴如刈麻建安太守急寄我香蒻包褁封題斜泉甘器潔天色好坐中揀擇客亦嘉一作佳新香嫩色如始造不似來逺從天涯停匙側盞試水路拭目向空看乳花可憐俗夫把金錠一作挺一作鋌茶録多用挺字為古按集韻錠字去聲訓鐙鋌字上聲訓銅鐡朴猛火炙背如蝦蟇由來真物有真賞坐逢詩老頻咨嗟須臾共起索酒飲何異奏雅終淫哇次韻再作一本云茶歌吾年向老世味薄所好未衰惟飲茶建溪苦逺雖不到自少嘗見閩人誇每嗤江浙凡茗草叢生狼藉惟藏蛇今江浙茶園俗言多蛇豈如含膏入香作金餅蜿蜒兩龍戲以呀其餘品第亦竒絶愈小愈精皆露芽泛之白花如粉乳乍見紫面生光華手持心愛不欲碾有類弄印幾成窊論功可以療百疾輕身久服勝一作如胡麻我謂斯言頗過矣其實最能祛睡邪茶官貢餘偶分寄地逺物新來意嘉親烹屢酌不知厭自謂此樂真一作誠無涯未言久食成手顫已覺疾飢一作病生眼花客遭水厄疲捧碗口吻無異蝕月蟇僮奴傍視疑復笑嗜好乖僻誠堪嗟更蒙酬句怪可駭兒曹助噪聲哇哇樂郊詩為劉原甫作一本注原父鄆州東園也樂郊何所樂所樂從公遊三日公不出其民蹙然愁一聞車馬音從者如雲浮吾問鄆之人無乃失業不云惟安其業然後樂其休樂郊何所有胡不考公詩有山在其東有水出逶夷有臺以臨望有沼以遊嬉俯仰迷上下朱欄映清池草木非一種青紅隨四時其餘雖瑣屑處置各有冝樂郊何以名吾為本其意自古賢哲人所存非一世當時偶然迹來者因不廢鄆非公久留公去民孰賴此亭公所登此樹公所憩俾民百年思豈取一日醉洗兒歌為聖俞作一本云前日送酒遂助洗兒輒成短歌更資一笑呈聖俞月暈五色如虹霓深山猛虎夜生兒虎兒可愛一作憐光陸離開眼巳有百步威詩翁雖老神骨秀想見嬌嬰目與眉木星之精為紫氣照山生玉水生犀兒一作此翁不比他兒翁三十年名天下知材髙位下衆所惜天與此兒聊慰之翁家洗兒衆人喜不一作莫惜金錢散閭一作鄰里宛陵他日見髙門車馬煌煌梅氏子鳴鳩崇政殿後考試所作天將隂鳴鳩逐婦鳴中林鳩婦怒啼無好音天雨止鳩呼婦歸鳴且喜婦不亟歸一作急還呼不巳逐之其去恨不早呼不肯來固其理吾老病骨知隂晴每愁天隂聞此聲日長思睡不可得遭爾聒聒何時停衆鳥笑鳴鳩爾拙固無匹不能娶巧婦以共營家室寄巢生子四散飛一身有婦長相失夫婦之恩重太山背恩棄義須臾間心非無情不得已物有至拙誠可憐君不見人心百態巧且艱臨危利害兩相關朝為親戚暮仇敵自古常嗟交道難代鳩婦言一本注聞士有欲棄妻者作斑然錦翼花蔟蔟雄雌相隨樂不足抱雛出卵翅羽成豈料一朝還反目人言嫁雞逐雞飛安知嫁鳩被鳩逐古來有盛必有衰冨貴莫忘貧賤時女棄父母嫁一作婦曰歸中道捨君何所之天生萬物各有類誰謂鳥獸為無知雖無仁義有情愛茍聞此言寧不悲看花呈一本有韓子華內翰崇政殿後考試作老雖可憎還可嗟病眼眵昏愁看花不知花開桃與李但見紅白何交加春深雨露新洗濯日暖金碧相輝華浮香著物收不得含意欲吐情無涯可愛踈簾靜相對最冝落日初西斜時傾賜壷共斟酌及此蜂鳥方喧譁凡花易見不足數禁籞難到堪歸誇老病對此不知猒年少何用苦思家啼鳥崇政殿後考試舉人卷子作提葫蘆提葫蘆不用沽美酒宫一作官壷日賜新撥醅老病足以扶衰朽百舌子百舌子莫道泥滑滑宫花正好愁雨來暖日方催花亂發苑樹千重緑暗春珍禽綵羽自成羣花開秖慣迎黃屋鳥語𥘉驚見外人千聲百囀忽飛去一作來枝上自落紅紛紛畫簾隂隂隔宫燭禁漏杳杳深千門可憐枕上五更聽不似滁州山裏聞和聖俞一本二字作人唐書局後叢莽中得藝香一本之作用其韻有藝黃其華在彼衆草中清香濯曉露秀色搖春風幸依華堂隂一顧曽不蒙大雅彼君子偶來從學宫文章髙一世論議一作議論伏羣公多識由博學新篇匪雕蟲唱酬爛衆作光輝發幽叢在物苟有用得時寧久窮可嗟凡草木糞壤自青紅答劉原父舍人見過後中夜酒定復追昨日所覽雜記并簡梅聖俞之作君子忽我顧一作顧我貧家復何有虛堂來清風佳果薦濁酒簡編記遺逸論議相可否欲知所書人其骨多巳朽前者既巳然後來寧得久所以昔人云杯行莫停手居士集卷第七熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正朝佐謂樂郊詩有水出逶夷夷平也傷也與逶字不類按説文逶迤斜去貌集韻委曲自得貌詩作委蛇漢書作逶蛇恐合作逶迤而蜀本建本羅氏本誤作逶夷永嘉錢文子謂詩羔羊篇有委蛇字離騷載雲旗之委蛇一本作逶迤一本作委移劉向九歎遵江曲之逶移蓋變委作逶變蛇作迤移二字矣張衡西亰賦女娥坐而長歌聲清暢而蜲蛇又以委為蜲孫綽天台山賦既克濟於九折路威夷而修通潘安仁金谷集詩回溪縈曲阻峻阪路威夷又盡變作威夷字皆委曲貌今作逶夷乃參古今之變必有所據其實則平夷也右逶夷二字𥘉不必辨著此以為輕改字畫之戒送吳生我前一作在前顔回一作顔子雞冠一作冠雞祀上帝祀一作事楊直講女奴彈琵琶行人舉頭飛鳥驚一作衆鳥啁啾飛且驚盛以錦囊一作古錦裁囊送公期歸絳還來一作歸來謝王尚書牡丹事年少事一作競復何為復一作亦力懶一作力乏嘗新茶三月一作二月此為一作草木向空一作向簷次韻再作豈如一作豈知亦竒絶亦一作各偶分寄偶一作忽疑復笑復一作且看花老病一作老翁年少一作少年和聖俞藝香光輝一作光耀答原甫見過佳果一作佳景書簡卷第七歐陽文忠公集一百五十與謝舍人絳字希深寶元元年某頓首再拜兵部學士三丈久以多故少使不果拜狀春暄尊候萬福省榜至獨遺聖俞豈勝嗟惋任適吕澄可過人邪堪怪聖俞失此虛名雖不害為才士奈何平昔並遊之間有以處下者今反得之覩此何由不痛恨欲作一書與胥親及李舍人宋學士論理之又恐自有失誤不欲輕發不爾何故見遺可駭可駭由是而較科埸果得士乎登進士第者果可貴乎日日與師魯相對驚歎不巳伏承殿試考校今必已了某替人猶未至拜見未間伏惟保重因人謹附狀不宣又寶元二年某頓首百拜知府舍人三丈三兩日毒暑尤甚不審尊候何似某昨走鈴下久溷賔館旱暑交作晏隂方興當君子定心靜事休息之時暑夕屢煩長者其如乘餘間奉樽爼泛覽水竹登臨髙明歡然之適無異京洛之舊其小别者聖俞差老而修為窮人主人腰雖金魚而鬢亦白矣其清興則皆未減也臨别之際感戀何勝西禪竹林又辱餞送自夜出南城凡再宿始至弊邑私門老幼往往病暑正如所慮此所以眷眷門下而不候久留者也自鄧至汝隂道出田間由巨欣橋而西秋稼甚盛時雨巳足問之乃覽秀所望而腳正在陋邦然鄧州界二字一作則莫及也豈騎立之神一作邪憎家雞而愛野雉乎自還縣便苦一作繫俗事書記未能詳悉謹拜此敘謝伏惟幸察不宣從表姪歐陽修頓首百拜與王待制質字子野慶曆三年某頓首再拜運使學士子野兄春暄伏惟尊候萬福自去年閏月來東郡以就祿養幸如所欲惟僻陋日益愚鄙爾在都下時子野兄舟行不克攀别其後送者還頗知留客甚歡而飲酒差多親族皆以素羸奉憂不知其後復飲否子野善自攝猶能絶葷血甘淡薄況於酒邪一别頓爾南北闕於候問惟冀自重以慰區區不宣某頓首與李賢良覯字泰伯嘉祐𥘉某啓冗事牽迫久踈奉長者之論不知兩辱過門甚愧甚愧某來日有少事須出即今幸家居可以拂席奉俟軒蓋顒企顒企不然當别拜聞貴不失約也某頓首賢良先生與曽舍人鞏字子固慶曆六年某啓雖久不相見而屢辱書及示新文甚慰瞻企今歲科埸偶滯遐舉畜德養志愈期逺到此鄙劣之望也某此幸自如山州少朋友之遊日逾昏塞加之老退於舊學巳為廢失而韓子所謂終於小人之歸乎因風不惜逺垂見教未良會間自重自重又治平四年夏某啓奉別忽忽暑候巳深不審動履何似某昨假道于潁者本以歸休之計𥘉未有涯故須躬往及至則弊廬地勢喧靜得中仍不至狹隘但易故而新稍增廣之可以自足矣以是功可速就期年挂冠之約必不愆期也甚幸甚幸昨在潁無所營為所以少留者蓋避五月上官未能免俗爾亳之佳處人所素稱者往往過實其餘不及陳潁逺甚然俯仰年歲間如傳郵爾𥘉亦不以為佳蓋自便其近潁爾至此便值酷暑未能多作書相知或有見問者幸略道此意惟慎夏自愛與蘇編禮泃字明允嘉祐二年某啓自足下西歸承有家問匆遽而行時一小子卧病方憂悶中不淂相見中間淂還蜀後所惠書及今者賢郎人至得書承尊履休康併以為慰足下文行見推於時豈久窮居於逺方者未相會間千萬自愛又治平間某啓承示表本甚佳前所借諡法三卷值公私多事近方遍得披閲文字更不待愚陋稱述第新法增損今別為一書則無不可矣成一家之言吾儕喜若巳出爾諡録卷秩既多秖欲借草本又治平三年某啓多日不奉見承遷居不易𥘉聞風氣不和謂小小爾昨日賢郎學士見過始知尚未康平旦夕來體中何似更冀調慎藥食無由馳候專奉此又治平三年某啓自以拙疾數日闕於致問不審體中何如必遂平愈孫兆藥多涼古方難用於今更且參以他醫為善也專此不宣又同前某啓數日來尊候必更痊安單藥得效應且專服千萬精審無求速功不欲頻去咨問恐煩倦也亦不煩答簡或賢郎批數字可矣與費縣蘇殿丞皇祐年某啓特承書問兼惠篆碑滁陽山泉誠為勝絶而率然之作文鄙意近乃煩雋筆以傳于逺既喜斯亭之不朽又愧陋文莫掩感仰之抱寧復宣陳專人還謹此敘謝舊用龍尾硯一枚鳯茶一斤聊表意又某啓前者辱見顧屬苦多事不得少伸𣢾曲比奉詗則承巳歸縣矣但深怏怏也辱惠書竊審經春體氣清𥙿某衰病疲憊日自強勉未知報效不敢言勞咫尺阻闊惟多愛與澠池徐宰無黨皇祐五年某啓久不得書自聞省試日望一信人至忽得所示大慰鄙懷兼喜春寒所履無恙程試賦詩極工矣䇿贍博而辨論偉然皆當在髙等人力所可為者止於如此耳其他有命然俗言運亨者臨事不惑揮翰之際能至此其亦奮發於兹時乎計此書至巳在髙第故不子細不涎修書白又至和元年某啓真陽相別忽以及兹日月不居大祥奄及攀號劈踊五內分崩不孝罪逆蒼天莫訴哀苦哀苦久不得書日與無逸弟想望忽捧來示承在道曽感疾喜今復常又知淮水淺澀雖深欲相見但恐阻滯遂失赴官之期若於事有妨則不若且就汴流西上如淮水可行與汴不爭逺近即兹來為善賢弟在此寂寞中相伴大幸某秋涼方卜離此南北未知何適五代史昨見曽子固議今却重頭改換未有了期仍作注有難傳之處蓋傳本固未可不傳本則下注尤難此須相見可論改服哀苦中忙迫偶奉接人行聊此又至和二年某啓專人至辱書承官下無恙深慰示及志文甚佳無逸弟又有煩惱可哀適值有人在此志文當附去又知且權河南澠池本邑自可讀書為政何必求來府中所云冬末當至京師暫來甚善一作喜無欲弟居監中時相見焦秀才亦在太學輔監生恐知某碌碌于此士大夫有所論當悉以見告庶助其不及實有望也未相見多愛又同前某啓人至辱書承官下無恙深慰深慰所云進取之道能具逹其如此夫復何患諭及富公言范文正公神道碑事當時在潁已共詳定如此為允述吕公事於范公見德量包宇宙忠義先國家於吕公事各紀實則萬世取信非如兩仇相訟各過其實使後世不信以為偏辭也大扺某之碑無情之語平冨之志嫉惡之心勝後世得此二文雖不同以此推之亦不足怪也其官序非差但略爾其後巳自解云居官之次第不書則後人不於此求官次也幸為一一白冨公如必要換則請他別命人作爾又嘉祐元年某啓縣人來得書承寒凝公外體氣無恙深慰深慰所寄近著尤佳論議正冝如此然著撰苟多他日更自精擇少去其繁則峻潔矣然不必勉強勉強簡節之則不流暢須待自然之至其如常冝在心也代天論既各有篇目不必謂之代天可也某近權省得罷稍間已有削乞洪井若果得則私便尤多況非要任求之必可得也無欲弟在太學見兒子云甚安某一向多事少暇他亦踈及門恐知銓中新制破考之事稍緩若在本州無妨亦可巳新年多愛又嘉祐二年某啓人至辱書承涖官進學無恙甚以為慰所寄文字大佳然作文之體𥘉欲奔馳久當收節使簡重嚴正或時肆放以自舒勿為一體則盡善矣某此待罪誠碌碌然期必有為而自效士大夫見責者深是待我厚而愛之過爾敢不佩服冬寒自愛在致齋處草草與焦殿丞千之皇祐五年某啓自相别無日不奉思急足辱書深所浣慰然聞不遂解名在於俗情豈不怏怏若足下素所自待與某所以奉待者豈在一得失之間但以科埸文字不得專意經術而某亦有人事今足下三數年間且可棄去科埸文字而僕亦端居無一事惟於此時可以講訓素所聞未舉者過此恐彼此難得工夫也足下為人明果以此思之亮可㳏然北首深恨間居無人既不能專遣人去奉招當正𥘉南歸亦不為久別計但仰首傾望也某於哀苦中奉思諸君子此又不可言巳寒多愛又至和二年隂雨泥甚不欲頻奉邀蓋知請假甚艱也某恐不久出疆欲且奉託與照管三數小子某來日遂移過髙橋宅中俟稍定疊便去般出學恐先要知仍請具此白胡先生知為妙至時恐要人般挈請示及待令去晚間可出即見過間話某再拜又嘉祐元年某啓知昨日巳差試官庶事便當牽率稍涼體中佳否近晚或能見過間話少時恐遂難得暇也粗細米各二斛聊飼僮僕輩必不以輕鮮為怪有無相通亦鄰里之常事慙仄慙仄又同前某啓以數日齋祠今早方歸知曽來取藥體中佳否見解榜張燾秀才巳獲薦不知肯且來此過冬否秪恐他要冬課嫌小兒喧聒不然蒙益則多矣某今日在家隨早晚見過間話少時又嘉祐元年某啓今日見解榜尚疑脫漏姓名然𥘉以得失委命而進則臨事自應不動于懷此孟子之勇也適歸家偶早幸略見過間話某頓首又同前某啓數日大熱不審意思如何適令發至羣牧司云已却歸西岡不審何謂此中西位頗寬涼多南風甚可居至於飲食亦可取性固無形迹矣兼時得間話請更思之勿以為疑也謹此咨啓俟報某啓又同前某啓見兒子言尊候違和豈非患腹臟邪秋後慎生冷為佳以數日不相見甚思渴某一出參假便有人事區區加以兩日復熱恐彼中窄狹無事且來書院取涼無形迹也前時奉白嚮有䇿題彼中收得者幸為録示或秖檢得本子此中亦有人寫蓋人事易因循也又嘉祐元年某數日不承問不審體中如何當漸平和但怪不見過故此奉問凡疾病不欲滯鬱頗須消息有以散釋其效多於服藥若能出入幸相過要人馬來取至於藥物亦當商榷乃盡其理謹此咨啓某再拜又同前某啓稍寒想益佳𥙿數日人事忙迫非常前夕至學舍中見狼籍可憎所以未敢便請他張秀才更俟一二日大太祝歸略令灑掃兼庶事有所備緣某多故不能躬視也兩日欲去報此意亦無暇作簡衮衮度日公私不濟一事此京師之態也某奉白又嘉祐二年某啓昨日以客多飢疲風眩發作卧不能起承示簡不及時答所言張先輩但怪其登第後絶不相過餘非所聞也亦欲旦夕召渠相見但以多事忽忽未暇爾今日知聞喜宴來日約其見過也又嘉祐六年某啓有無相通蓋為常理更不存形迹也船不必白省主自遣人問當亦可得蘇氏昆仲連名並中自前未有盛事盛事姚闢詩説請試看有長處簽出示及為無工夫細看故也又嘉祐六年承惠胡公銘兹人美德固樂為之紀述第以文字傳逺須少儲思蓋尋常意思未及為人強作多不佳也自來日巳往併無假故直至旬休如所諭行期甚迫當且前之續可附致潤州諒不為晚也人還謹此白知小兒不安且慎調護大熱難將息也又同前某啓自相别後方欲作書遽承不疑學士有來歸之命自後更欲附書則思舟行必已在道無處可附亦以不久相見不必為書也適得信喜來甚速且承酷熱中體氣清安其他皆可盡於相見也某為今夏病暑不可勝任又得喘疾遂且在告蓋衰老之態自然如此也略留來人附此草草又嘉祐六年某啓自相別更不聞問近得邵學士書云已到家方喜知動靜兼承所履安和實以為慰某病衰如昨不惟任責愈難常至於勞苦亦筋骸不能支等為可責惟早自知止猶勝強顔以貪寵利自計非不熟但恐未得如志遂為君子之棄而小人之歸爾南方冝多有聞見不惜垂諭猶勝不知也有望有望前者胡公墓表誤書陵州人當問其家為改正歲晚寒凛以時自愛因人惠問又嘉祐末遽爾大熱病軀殊不可當數日不相見體中佳否知已授樂清果如何來日見過家飱幸早枉步乘午前稍涼庶幾可坐也無它客姚祕校劉真迹至此止又治平年某啓范氏子書來并獲所寄書自承赴樂清後方拜此一書審此居官下安和稍釋傾想陋巷之士得以自髙於王侯者以道自貴也一從吏事便為禮法所繩若居人下而欲有設施則世事難如人意更當屈伸取捨要於濟務此非獨小官自古聖賢尚以為難所以前世一節之士以貧賤為易守也自臨縣治今將及期諒深諳此態也某嘗再為縣令然遂得周逹民事兼知宦情未必不為益某愈覺衰殘齒牙搖動飲食艱難食物十常忌八九情懷益蕭索物外浮榮信乎不為吾儕得失也有名即去矣未相見間公餘慎愛因人時惠問不宣某書白與王主簿回字深甫某啓嚮者深甫在京師則以俗冗不常得相見既去又不時為信問視其外豈非踈且慢哉然求諸中則不然也人至惠問承奉太夫人萬福下情瞻慰某衰病日增殊無世間意趣近買田潁上思幅巾與二三君往來田閭間其樂尚可終此餘年爾而其勢未能速去非為之不果猶須晚獲也深甫以謂如何賢弟昨西略見爾祁寒更乞自愛又某啓纍日以聖節諸事區區未得祗候大熱不審體氣如何來日見過家飱庶得接清論少時幸早垂訪也專此咨啓不宣某再拜深甫先輩常君未及作書續得馳問因見為伸意千萬千萬又某啓人至辱示借書並領昨日少奉清論開沃無限嗽良減否師魯文略讀一二篇令人感涕碑并集録皆納去某又上與姚編禮闢字子張皇祐五年某頓首間居絶無人使又不欲頻煩郡中借人所以久不作書上杜公然哀苦中無限瞻依也因請見為多道哀懇希文得美諡雖無墓志亦可況是冨公作必不泯昧修亦續後為他作神道碑中懷亦自有千萬端事待要舒寫極不憚作也只是劣性剛𥚹平生喫人一句言語不得居喪犯禮名教所重况更有纎毫譬如間事亦常不欲人擬議況此乎然而不失為他紀述只是遲著十五箇月爾此文出來任他姧邪謗議近我不得也要得挺然自立徹頭須步步作把道理事任人道過當方得恰好杜公愛賢樂善急欲范公事迹彰著耳因侍坐亦略道其所以但言所以遲作者本要言語無屈準備仇家爭理爾如此須先自執道理也餘事不必云云背碑子極奉煩多荷多荷因見杜贊善託問實録不必封但只恁寄來此中程判官亦為伸謝將書來後信有書去某再拜又某啓專人辱書承守道為學自如甚善見諭紹巖事止於如此則又何言君子之言必誠誠久必見凡有諸中未有不形于外者惟當以久見吾子之誠爾禮記雜亂之書能如此指擲其繆其功施後世無窮非止效俗儒著述求一時之名也然其中好語合於聖人者多但當去其泰甚者爾更冝慎重如坊記一篇難破請更思之然遇所見但且論次不惜録示與王幾道復景祐元年某頓首白幾道先輩足下段氏家人至蒙示書及詩并子聰聖俞書與詩後於東山處又見詩何其勤而周也聖俞得詩大喜自謂黨助漸熾又得一豪者然微有飢態幾道未嘗為此詩落意便爾清逺自古善吟者益精益窮何不戒也呵呵間別後事自彥國去後患一腫疽二十餘日不能步履甚苦之時惟聖俞一來相問臨清之歡何可得邪師魯巳有召不冝更俟嫁女幾道與彥國冝督以來走明日就試恐要知之惠詩未暇答以此也答孔嗣宗字伯紹河南人皇祐元年某啓辱書甚善尹君志文前所辨釋詳矣某於師魯豈有所惜而待門生親友勤勤然以書之邪幸無他疑也餘俟他時相見可道不欲忉忉於筆墨加察加察某再拜又同前東方學生皆自石守道誘倡此人專以教學為巳任於東諸生有大功與師魯同時人也亦負謗而死若言師魯倡道則當舉天下言之石遂見掩於義可乎若分限方域而言之則不茍故此事難言之也察之與尹材慶曆八年墓銘刻石時首尾更不要留官銜題目及撰人書人刻字人等姓名秖依此寫晉以前碑皆不著撰人姓名此古人有深意況久逺自知篆蓋秖著尹師魯墓四字與蔡交皇祐五年某啓人至辱書感尉何巳且承春序履況清休范公襄事修以孤苦哀困中杜門郊外殊不知端息情禮都闕但得淮西寄到志銘豈任感涕文正平生忠義道德之光見於志諡為信萬世亦足慰也神刻謹如所諭敢不盡心某忝以拙訥獲銘當世仁賢多矣如此文復何所讓但以禮制為重亦不遲年歲中貴萬全無他議也悉察悉察述夢後序更當勘尋史傳續報然亦當慎文正所慮至深某亦疑其有意不用此篇果如所料矣試期不逺佇奉賀加愛加愛某再拜答曽舍人鞏字子固熙寧四年續添某自歸里舍以杜門罕接人事少便奉書中間嘗見運鹽王郎中得問動靜兼承傳誨近又聞曽少違和急足至辱書喜遂已康𥙿甚慰甚慰某秋冬來目足粗可勉強苐渴淋不少減老年衰病常理不足怪也餘在別紙某白見諭乞潁且止亦佳此時尤冝安靜為得理也惠碑文皆佳多荷多荷常筆百枚表信不罪不罪又同前辱示為人後議筆力雄贍固不待稱贊而引經據古明白詳盡雖使聾盲者得之可以釋然矣父子三綱人道之太學者久廢而不講縉紳士大夫安於習見閭閻俚巷過房養子乞丐異姓之類遂欲諱其父母方羣口喧譁之際雖有正論人不暇聽非著之文章以要於久逺謂難以口舌一日爭也斯文所期者逺而所輔者大固不當以示常人皆如來諭也某亦有一二論述未能若斯文之曲盡然亦非有識之士未嘗出也間居乏人寫録須相見可揚榷而論也自去年至蔡遂絶不作詩中間惟有答韓邵二公應用之作不足采惟續思潁十餘篇是青州以前者并傳記皆石本今納上自歸潁它文字亦絶筆不作恐知恐知青州十餘篇亂道為説道上石彼近必見矣書簡卷第七與王待制子野兄舟行一作承兄舟行攀别一作攀送自攝此下一有治字與焦殿丞第十一帖不必白白一作須與姚編禮第二帖不惜録示此下一有容細看商議去留之耳為來人督回書不容少頃當續有具白也二十三字與孔嗣宗第一帖尹君一作尹公然以一作然後忉忉一作刀刀第二帖若言此上一有今字不苟一作不可表奏書啓四六集卷第七歐陽文忠公集九十六與晏相公殊書皇祐元年知潁州日春暄伏惟相公閣下動止萬福修伏念曩者相公始掌貢舉修以進士而𬒳選掄及當鈞衡又以諌官而蒙獎擢出門館不為不舊受恩知不謂不深然而足迹不及於賔階書問不通於執事豈非飄流之質愈逺而彌踈孤拙之心易危而多畏動常得咎舉輒纍人政於退藏非止自便今者偶因天幸得請郡符問遺老之所思流風未逺瞻大邦之為殿接壤相交因得自伸懇悃之誠庶幾少贖曠怠之責伏惟相公朝廷元老學者宗師尚屈蕃宣行膺圗任伏惟上為邦國倍保寢興企望旌麾無任激切答胡秀才啓當是從官在朝時修啓竊以考行選賢故人皆修德而自厚論才較藝則下或衒巳而忘廉誠誘養之道殊致進趨之勢異寖久之俗益薄惡而可嗟習見為常遂安恬而不怪伏以秀才學優墳史詞冨文章能力行以自強方韞藏而待價豈期誤舉遂爾遺材惟賢食之不家顧良時之難得譬夫餓者雖耻嗟來因而無言亦將不及既一慙之莫忍遂兩訟以交興逮乎究窮果自明白矧朝廷之選士惟寒俊之是先雖爾𥘉屯理將後得必也涖官學古為政臨民當獄訟而平心視斯為戒利公家而忘巳效此必爭苟終身之不回雖一作維一眚之何患如此則圭璧之玷猶或可磨日月之更其將皆仰至於較定能否明辨是非形長者豈度之私貌妍者非鑒之惠但慚淺識惟竭至公漁者讓泉思古人而莫見私門受謝亦鄙志之不為辭副樞密與兩府書嘉祐五年十一月右修啓伏奉制命特授依前官充樞密副使者聞命若驚撫躬無措伏念修稟生孤苦賦性拙踈才不足以適時少本無於逺志早迫逮親之祿學為應用之文而自叨塵侍從之聮荏苒歲月之積𥘉無實效少輔明時中𬒳謗讒固多憂而速老素非強力加困病以成衰白首禁林厚顔時彥方欲自請江湖之上漸謀田畝之歸屢瀝危誠未蒙恩許敢希聖選登二樞庭夙夕內循俯仰惟懼巳形懇奏期必寢停伏望昭文相公借以閔憐察其悃迫幸因對見特為開陳俾遂牢辭庶安常分謹奉狀披聞又謝兩府書同前此者叨膺聖選俾二樞庭渙命巳行循涯匪稱伏念修學非臻奧才不逮中仰屬昌期猥塵膴仕抱孤忠而自許顧獨立之易危竊比古人每常嗟其選懦有志當世徒自愧於衰遲雖䇿厲之愈勤信技能之奚取久尸厚祿進無輔於髙明屢乞方州冀漸謀於退縮敢期誤寵繆及匪才此蓋伏遇昭文相公叶贊大猷翊宣元化為時柱石持物權衡急於甄才過及庸品第堅一節力勉不能上酬聰睿之知次答陶鎔之賜謝參政與兩府書嘉祐六年閏八月寵兼憂而並至恩與責以俱深叩讓靡從撫循無措伏念修稟生孤懦賦識迂愚力微非致逺之才學陋無適時之用徒緣士類早借稱揚幸會聖時過加奬擢既叨塵於侍從遂竊與於謀謨待罪樞庭顧無分一作功而可録備貟政府用纍日以敘升豈惟致冦之虞奚逭曠官之誚此蓋某官心存體國道廣濟時謂庶政之交修必群材之博取誤加品目俾玷光靈雖冥拙之無知豈忘感勵苟疲駑之可䇿尚冀涓塵鄙訥之誠敷陳罔罄回池州吕侍讀溱謝到任書嘉祐八年春伏承祗奉明恩巳臨善治雖未充於士望聊有漸於復亨深慮危心君子固嘗多難處窮與否昔賢因以知人矧逺器之莫量佇華塗之歸踐過承謙挹曲損諭言感愧之誠敷宣罔既春和在候福履增休英宗覃恩轉官回前兩府賀書嘉祐八年四月叨膺渙渥敘進官聮祗荷恩榮豈任戰懼伏念某識非周物學不逮人蒙先帝之誤知自諸生而獎擢久塵侍從蔑著聲猷不圖衰病之齡進備政機之二幸久安於無事容充位以素餐未知報國之方遽結遺弓之恨屬皇明之繼照均慶萬邦發大號以惟新推恩一切致兹濫及莫獲懇辭內省庸虛實虞顛覆此蓋某官為時元老協德一心言成華衮之文志樂菁莪之育素加品目遂至叨踰方懷感勵之私遽辱誨存之枉佩銘悚愧交集襟靈回文相公辭起復使相判河南書嘉祐八年四月伏承光奉制書起從哀次未皇馳賀特辱貽函伏惟留守太師相公望重搢紳道髙巖廟出處之際繫中外之重輕弛張有冝兼將相之文武蔚為元老東在先朝雖孝性之隆專守經而執禮而權時之制或以義而斷恩副聖君仄席之思見忠臣許國之急諒難遵於固避幸勉屈於至情修方與蒼生同兹引領遽煩誨諭但極感悰回冨相公弼辭樞密使書嘉祐八年五月此者伏審光膺制命登贊國機渙號始行群情胥恱伏惟樞密相公搢紳舊德社稷元勳維石巖然朝廷以為輕重長城隱若中外繫其安危嚮由執禮以居憂重於至性之難奪聖君仄席而勞想樞庭虛位以待賢自聞召節之來歸故雖行路而相慶矧惟庸昧早辱知憐幸陪副二之聮得企光塵之未賴庇冀逃於罪戾望賜有過於蒼黔敢謂謙撝例貽誨翰罔知承命但極感悰又回冨相公謝書同前伏承顯奉制書茂膺寵數伏惟歡慶伏惟樞密太師相公學優孔孟道協臯夔屏于萬邦申伯之兼文武秉乎一德仲山之不剛柔嘉謀早著於先朝時望久隆於巖石屬嗣聖繼明之始乃宵衣講治之𥘉首速兀臣來還宰席三接之際群心以安出納樞機雖為於要任調和鼎鼐當正於鴻鈞始塞輿談實非私論敢期謙眷曲示誨函既深抃躍之誠復積悚銘之抱回鄭獬錢公輔一舍人謝新除書嘉祐八年八月伏承顯奉制恩升華禁掖允膺聖選式協輿談朝廷之體尊嚴王者之居淵默德澤宣布必使入人心之深號令發揮而能鼓天下之動惟是代言之任實資博古之英伏惟某官履行敦方材猷敏茂藹一鄉之佳譽掩衆俊以名科通逹古今固巳優遊於儒學出入侍從是冝顧問於清間果𬒳僉俞並司典訓竦萬方之視聽追三代之文章遂升榮塗益奮賢業共慶得人之盛方深竊抃之私遽辱謙撝特貽誨翰感銘之素敷敘奚殫回皇子神宗辭使相封淮陽郡王書嘉祐八年九月伏承光奉制書峻膺寵數伏惟歡慶竊以命官有秩正上下之等威制禮緣情以親踈而隆殺惟是國家之舊典蓋推天下之至公郡王相公識稟誠明學窮原本篤於樂善因天性之自然舉必有儀秉君子之常德地崇冢嗣望著宗英兼升將相之榮顯𬒳山川之錫有光典册允叶朝僉豈謂仁私曲貽誨翰感銘之素敷𫐠奚殫與安撫密學啓伏自安撫密學顯奉寵靈出分寄任邊氓𬒳德蔚興𥜗袴之謡宸眷倚材隱若金湯之固實藉威名之重即疇勳績之華入踐廊廟之崇以副搢紳之望祁寒在候福履凝休瞻頌傾虔罔殫庸鄙賀延州程太尉戡加節度使再任啓治平元年伏審賜節中宸建侯巨屏伏惟慶慰恭惟太尉閣下剛明稟哲純一端誠嘉猷夙著於本朝韙望尤先於舊德久鬱巖廊之用屢淹藩翰之居惟關陜之一方苦干戈而纍一作屢歲用兵之後疲傷尤急於撫綏難信之盟醜黠冝先於經制是膺帝眷實允朝僉大纛髙牙雖暫煩於節度鴻鈞元鼎行即俟於登庸乃公議之久然匪私情之獨禱春陽式序幕府肇開伏惟上為邦家精調寢膳轉吏部侍郎回謝親工書治平元年五月祗膺渙渥交積兢慚伏念某學問不強顓蒙自守流離當世而寡合幸會先朝之誤知拔自衆人俾參國論而屬承祧嗣慶布治惟新以聖主而責愚臣方懷惕懼假小人而乘大器豈不隮顛故當成命之𥘉行屢竭愚誠而必請而君恩至篤天聽莫回此蓋某官借以餘光致兹冒寵仍貽誨翰曲賜褒揚感佩之私敷陳罔既回潁王書治平元年六月右修啓伏承顯膺帝制榮啓國封伏惟歡慶某官宇量閎深機神敏悟玉質非由於追琢天姿自發於純明德盛地尊乃王家之屏衛色溫言厲為宗籍之表儀顧惟爵秩之崇實繫朝廷之體真王錫號蓋遵有國之彛章寵命始行方愜至公之輿議豈期謙挹曲示誨函感戢之私欣瞻併集賀潁王書同前右某啓伏承顯頒帝制榮啓國封伏惟歡慶某官純茂凝姿溫仁秉哲濟之學問而以廣其業履夫崇髙而能守以謙蔚然德譽之隆式是宗藩之列遂膺典册進位真王胙之土以建邦實資親屏爵于朝而示衆蓋匪私恩方寵命之𥘉行聽僉言而惟允莫遑伸慶徒積欣瞻回宋相公庠謝除司空致仕書治平元年十二月右修啓伏承顯奉制書入膺召節一作節召遂諧歸政之請兼升論道之崇伏惟慶慰司空相公道覺天民學臻聖域兩朝碩望文武兼資四海具瞻搢紳取法雖欲優遊於進退實繫輕重於朝廷矧𥘉政之日新方任人而圖舊所以奏封纍上眷遇彌隆終於雅志之重違難徇輿情之所惜聳髙風以勵偷俗介眉壽而膺百祥若賢若愚以榮以祝況惟庸懦早荷知憐方深欣頌之私遽辱誨存之厚感銘之至敷敘奚周回文相公謝服闋入覲書治平二年月右某啓伏承榮奉制恩顯膺寵典伏惟慶慰恭惟相公道兼文武功著鼎彞言行搢紳之表儀出入朝廷之輕重自執至情而不奪勉從制禮之難逾爰𬒳徽章􅨕趨召節介圭來覲方優體貌之隆前席嘉謀即正弼諧之任實繫士夫之素論豈惟朽拙之焉依敢謂謙撝特貽誨翰感銘之至欣抃交深又回文相公服除遷侍中移判永興書治平二年四月右修啓竊承顯奉制恩荐膺寵拜伏惟歡慶恭惟太師侍中器深宏逹業茂經綸弛張文武之才出入將相之任而日者來覲冕旒之邃喜聞履舄之聲從容話言固多仁者之利體貌耆哲是惟先帝之臣冝加異數之優以為一靣之重雖方勞於憂顧藉有素之威名然而患輕四支不足爬搔於蟣虱坐制萬里理當根本於朝廷即期廊廟之來歸始慰士夫之素望過蒙謙挹曲示誨言趨賔戺以無由積感悰而徒切又回文相公辭避樞密使啓同前古修啓此者伏承顯膺制命首贊樞庭伏惟某官業茂兩朝望崇百辟嚮自入親法座欣體貌於元勳出撫西師藉威名於獷俗然而籌謀當出於帷幄根本固在於朝廷果兹暖席之未遑已𬒳追鋒之迅召揚庭誕告方喜動於朝紳仄席來儀固渴聞於嘉話竊承謙挹尚欲逡巡敢謂不遺亦貽善誨即期前賀但切感銘回杭州蔡端明襄謝到任書治平二年十月右修啓伏承出領要藩巳諧禮上伏惟歡慶某官剛毅體仁粹明迪哲直道信於中外髙風凛乎搢紳頃煩持橐之清資蓋賴冨民之餘術經綸之業蓄素藴以未施偃息于藩邈沖懷而自逺雖重違於誠請實深鬱於輿情諒暖席之未遑即追鋒而迅召遂登大用顧匪私言寒律向嚴神襟善嗇瞻凝感著交集悰靈曰吳侍郎奎辭副樞書治平四年二月右修伏承顯奉制恩寵升樞近伏惟某官材兼文武業茂臯夔左右帷幄之謀謨出入朝廷之輕重自丁至戚暫解繁機執喪禮以過哀雖君命而難奪祥琴甫御召節甚嚴尚少鬱於登庸姑復還於舊物光輔一人之新政式副四海之具瞻敢謂謙撝曲貽誨翰方屬卧漳之告莫伸賀厦之誠感抃之私敷陳罔既回諫院傅龍圖卞攀違書治平四年三月修猥以非才久竊重任報效𥘉無於毫髮怨仇巳積於丘山近蒙睿恩曲徇誠請與之近郡俾養衰年荷聖主之保全賴公朝之議論俾獲奉身而退方懷去德之思諫院龍圖舍人深閔孤危特迂誨翰意愛勤甚有踰平時風義凛然可激薄俗仰止門仞莫遑敘違銘之肌膚永以佩賜瞻依之懇敷道奚周亳州到任謝兩府書治平四年修此者祗荷朝恩出分郡寄退循忝冒徒積兢慚伏念修學知行已而智不周身才匪適時而任參大政用過其量危而必顛乃物理之冝然偶天幸而獲免昨以怨仇並作讒謗交興蓋逢堯舜之聰明方與夔龍而左右講新至治銷伏狂邪而市虎之言雖驚於衆聽投豺之惡遽屏於逺方得逃九死於非辜實荷更生之大賜今者特蒙睿眷深察孤忠樂土近藩巳曲從於私欲清資顯秩仍過竊於寵靈捨衰疲勉強之勞就空曠逍遙之適然而坐思輔報歎心存而願違却視風波猶寢驚而夢噩顧獲全身而至此豈非宰物之深功仰佩恩私但銘肌骨載念修以至愚之朴陋蹈可畏之危機徇物從時既昧自容之計拂衣逺去又無先見之明惟貪得於暮年致以身而取辱而識雖不早悔尚可追至於緝風雨之敝廬治松菊之三徑少假歲年之頃即為田畒之人固將追野老而行歌永陶聖化恃仁人之在上必保餘生尚有斯誠猶煩再造炎歊方盛機務至繁上為廟朝精調寢膳瞻依之懇敷述奚周回潁州通判楊虞部書修啓兹者赴郡假塗久留賔次過承眷與日接宴言遽此睽違實增感戀但以柅車之始視職方𥘉雖云陋邦粗有人事加以大暑遂成病軀旦夕之間方思布𣢾急遽之至先以惠音且承别來福履清勝修以衰朽得此退藏如夙昔之所聞皆少過於其實惟寂寞之為樂須漸久而益佳餘非悉談更冀多愛回西京留守韓侍郎贄書治平四年六月右修啓此者祗荷朝恩出分郡寄顧惟庸妄早乏聲猷才非經濟之謀位玷光華之寵進陪國論無輔於休明動觸禍機可嗤於朴戇賴聖神之燭理獲終始以保全許解要權俾逃重責仍分善地以養衰齡留守龍圖侍郎清德鎮浮純誠接物曲敦故舊不我鄙遺逺形誨獎之言以慰孤危之迹嗟時久薄孰為金石之交因歲大寒方見松筠之色凛然髙誼可激偷風永佩恩私但銘肌骨晤言未遂溽暑方隆更冀珍調以符瞻詠回寶文吕內翰溱書治平四年九月右修啓茲者伏承寶文內翰𬒳召禁林升華內閣仰惟道德名望之老久淹言語侍從之流以望之之忠誠兼孔光之慎密豈止典謨潤色朝廷遂變於斯文固巳朝夕論思天下獲受其隂賜雖未正秉鈞之任而姑副仄席之求凡在搢紳皆同慶抃況於庸鄙最荷知憐而多病早衰思乞骸而巳久因間成懶顧與世而益踈豈無嚮慕之私殊闕寢興之問敢期惠眷先辱誨言世路多虞方歎風波之惡歲寒巳甚始知松柏之心感慰之深敷陳奚既清霜戒候內直方嚴惟冀珍調以符瞻詠賀樞密使吕太傅公弼書治平四年右修啓伏承顯膺寵典登進樞庭成命始行與言僉允伏惟某官存誠直諒蹈道中和學臻三代之英世濟八人之美論思獻納巳多輔益之勤謨明弼諧久韞經綸之業三朝眷遇一德老成尚虛黃閣之居姑正紫樞之位坐籌帷幄方資制勝之謀正席鈞台始慰具瞻之望顧惟衰朽早辱知憐惟與蒼黔同深慶抃賀韓相公琦罷相轉司徒兩鎮節度使判相州書治平四年冬右修啓伏審榮𬒳恩俞勉從懇請極便蕃之寵命均休逸於名邦伏惟司徒侍中誠明發揮德業久大三朝顧遇百辟表儀挺金石之純誠當國家之大事上所取信有疑決於元龜民之具瞻為望重於九鼎屬聖神之嗣統方毗倚於老成而功髙不居志確難奪爰併推於異數用顯答於元勳孰不秉旄詎有兼持於雙節昔嘗衣錦今而盛服於九章極古今儒者之至榮保進退君子之全德顧惟庸懦久辱知憐聆誕告之頒行極私誠之竊抃隆寒戒候大斾啓行伏惟上為廟朝精調寢膳一作寤傾依瞻頌筆舌奚殫回青州吳資政本書治平四年右修啓伏承光𬒳制恩出臨藩服斯民之幸將蒙豈弟之仁有識所嗟共惜忠賢之去伏惟資政侍郎智周物表性自誠明學窮仁義之本原識逹古今之治亂匪躬之操出入三朝秉心不回進退一德方聖神之嗣統賴耆哲以倚衡送往事居其勤亦至沃心造膝為益已多毅然君子之剛卓爾大臣之節信於中外明若丹青雖就逸均勞暫倚殿邦之重而用人圖舊諒難暖席之安顧惟衰退之蹤終託光輝之末隆寒戒候大斾啓行上為廟朝精調寢膳回陳州王密學陶賀冬書治平四年右修啓天心來復七日之亨有𥘉陽氣潛萌萬物之生以此兹謂履長之慶冝膺多福之祥伏惟某官性稟純誠識窮至韞講明道德是惟舊學之臣啓沃謀猷蔚有嘉言之話暫遂偃藩之便巳勞側席之思即膺圖任之求庸慰具瞻之望顧慙衰朽方卜退藏自期田畒一作里之獲安惟幸仁人之在上傾依祝詠交集悰靈回諫院吳舍人充書熙寧元年二月右修啓伏承光奉制恩入司書命得人為一作之盛輿頌同欣伏惟某官器稟純明道探淵藴清名峻望獨映於一時碩學髙文素推於群彥果𬒳上心之柬進膺寵命之華紅藥翻階直禁垣之清切紫荷持橐陪法從以雍容文章追三代之風號令警四方之聽允歸鴻筆增重本朝顧惟衰朽之退藏方與搢紳而竊抃豈期謙眷特枉誨函感服之私敷言罔既與開封知府吕內翰公著啓熙寧元年四月伏自某官輟從邇列暫領陪藩竊顧愚矇獲兹庇賴載惟孤拙每荷優容積於佩德之誠無異遺民之愛恭惟入趨宸扆榮署天畿仰匪日以政成即疇賢而柄用始兹歊溽冝乃髙明伏惟上為邦家精調寢膳回王先輩安國謝賜及第書熙寧元年某啓伏審先輩顯承嚴召明試雄文立若堵墻駭筆端之灑落程之衡石留帝覽以稱嗟遂膺賜第之榮式副求賢之意講明仁義之奧久以充中發揮德業之光實從兹始凡居交舊孰不欣愈雅眷不忘惠音斯及其為銘佩難罄敷宣謝判大名府韓侍中惠書啓熙寧二年夏右修啓伏念東秦僻處在海一涯全魏相望遡風千里特枉惠音之問實惟眷與之私兼承鎮撫之餘克集休祥之祐伏惟某官道優文武業茂臯夔為百辟之表儀首三朝之勳德從容進退雖不有於成功出入勤勞實未忘於憂國頃遂便藩之請豈遑暖席之安屬北州大震之災加仍歲荐飢之後流亡殍踣民未復於故居招輯綏來上方倚於元老豈不少煩於思慮夫何暇顧於衰殘乃知才大經綸固多餘𥙿契敦道義敻出常情辱知己之既深輒忘言於敘感統臨寄重炎燠時繁更祈上為邦家精調寢餗即還大用均福群黎蕞爾孤生但同輿頌回宫教丘寺丞書熙寧二年六月右修啓不聆嘉話忽已再期晚節無堪久思歸於南畒上恩未忍猶復委於東州但謀屏迹以深藏敢冀時髦之枉顧逺貽誨問實慰病衰示之進退之方勵以始終之節愛人不茍知君子之用心服義甚髙俾懦夫之有立仰銜眷與徒極佩銘載嗟疾恙之攻兼以年齡之迫雖請纓自效豈不竊慕於功名而伏櫪已疲第恐難勝於鞭䇿未期披𣢾徒以傾馳暑伏方炎襟靈善嗇區區之懇敷布奚殫回李舍人壽朋書熙寧三年冬右修啓此者伏承顯膺寵命入直禁垣臺閣登賢搢紳共慶舍人器涵閎逺德藴純深講仁義之淵源極天人之精祲備言語侍從之列承清間顧問之榮時望蔚然輿談久屬果𬒳上心之柬進司書命之嚴惟帝制之坦明必訓辭之深厚金相玉振煥三代之文章雷動風行警四方之耳目遂歸鴻筆增重本朝顧惟衰病之餘敢辱眷勤之貺遽先惠問益認撝謙感服欣愈敷陳罔既賀王相公安石拜相啓熙寧四年春伏審榮膺帝制顯正台司伏惟慶慰伏以史館相公誠明稟粹精祲窮微髙步儒林著三朝甚重之望晚登文陛當萬乘非常之知論道黃扉沃心黼扆果𬒳往諧之命遂膺爰立之求左右謀謨方切倚衡之任搢紳中外益崇巖石之瞻竊顧病衰恪居官守莫陪班謁徒用馳誠春序布和政機惟密伏惟上為邦國精調寢興欣抃之誠敘陳罔既致仕謝兩府書熙寧四年六月某啓此者獲解郡章許歸田畒荷聖君之念舊越常典以推恩內自省循惟知感涕伏念某猥以一介之賤幸會千齡之期學業素荒早接俊遊之末謀謨無取晚陪國論之餘訖於報效之蔑聞徒蹈危機之可畏而年齡遲暮疾病侵攻乃以難強之筋骸坐尸踰分之榮祿自陳懇悃頗歷歲時猶蒙上之哀憐久乃賜其開可奉身而去悵負國之巳多受寵至優但捫心而自愧此蓋伏遇某官權衡萬物佐佑三朝思輔治於和平務敦行於仁厚不遺故舊期俗革於偷風過借寵光俾民知於愛老致兹渙渥併及衰殘巳自屏於明時惟永藏於大賜代辭胥學士啓巳下續添某聞駑蹇之材雖謝終戀於故軒頡頏之羽方歸尚懷於廣厦何則物由時制質以願違瞻後來以不遑豈卑飛而自適矧在最靈之品優叨再造之仁拘文憲以難踰捨藩墻而輕去翩如秋蒂臨一水以將歸䨴若晨霞與孤舟而遂往恩渥山積感緒絲棼竊念某材實懦庸識惟黭淺謬偷生於人壤獲遘幸於王塗弓冶傳家耒耜遵業嘗畏圈牢之誚樂聞詩禮之言逮過弱齡粗堅苦節且親闈就養宦路隨方西走巴賨南浮江澨登稽山而訪古學謝前良歷劒阪以刋銘文慙往哲何嘗不跋清徽於朝闥詠鴻藻於聖門丈席是依寸晷惟競僅偕重刻之技終無老成之風性既愚而不移齒及壯而自愓幸遘當陽求士上哲持衡勉趨翰墨之埸濫齒孝廉之舉𫀆紛紛而若雪志凛凛以懷霜鑒本無私敢逃於蚩鄙材非有備遽荷於甄收玷妙簡以惟精撫微生而何幸洎春闈之較藝叨雲陛以䇿名山木呈材自選掄而為器冶金效用荷鎔造以成功進匪時來幸由恩假自此從風宦牒授任選臺俾外掌於司刑尋參滎於軍幕幸涖熙熙之壤姑隨冉冉之趨若乃民命所矜在一成而致慎憲條具設知五聽之惟難允非幹明曷副欽恤而某身專吏局世匪法家象斗之制斯嚴肇聞甲令磔鼠之能素寡舉乏片言矧乎人有刻木之嫌口擅鑠金之利或行如黠虜或巧過騰猿居多納履之防願奉酌泉之戒事機匪一識局難周惟曠弛之是憂在憲章而可懼弱羽未沈於泥滓福星聚列於珠躔幸遇某官京輔移轅軍牙涖政金鼇虛署久稽上笏之榮銀兔分符實重專車之任撫治綱之大振使訟牒以寖銷茂草鞠扉甘棠蔽坐不謂斗筲之役載依旌棨之門榮立府庭恪奉條教卿雲之蔭雖廣潤及於纎荆冬日之愛至髙惠先於一物降包荒之大體示含垢之深仁賜以雍容優其顔色嘗與言於麈柄許獻技於鈴齋曲矜蹇蹇之軀過損循循之誘重念某襟靈不爽道藝非優自竊吹於秀科頗空食於官舍嘗欲溫故於案几之暇勵力於歲月之餘冀少益於顓愚庶上禆於亨遇而寡聞自任扞格奚勝學圃遂荒整一經而不治文緒難繹懼彌日而無成露狂狷以居多黷聰明而為甚斷無他技動乏所長徒祗事於麾旄固無施於塵露豈謂伏蒙某官恢山藪之量納菲葑之言回掩疵瑕荐加題品褒采一介靡遺五管之微甄拔下流有過衆人之遇舉空踈之器爰定品於優長飾暗弱之姿將類能於開敏矜其拙效嘉乃妄庸上辱哲明曲形表薦且俾預官聮於轂下參器使於民間苟檢操之有渝引簡書而共守所念名編桂籍已塵玷於大猷迹厠金臺復叨居於始賞恩踰素望理邁常均永懷肉骨之私寧止捐軀之報方幸輝光末運使節少留願旅翮之有依適諧棲集何飛蓬之易轉遽至飄離俄及戍期倐辭藩嶽結課蔑聞於最賦省躬幸免於常刑𥘉履有光優慈是賴而自解曹符而退處終歲律以寓居荷眷待以特殊沐霑濡之至澤越後筵之禮分接右席之賔儀置酒梁園幾逢於美景觀容相圃屢奉於清歡給舳艫以備行假輿臺而輔乏士林增耀民巷改觀今則巳揆良辰將還舊蓽建樂郊而去德戀大幕以銷魂行當聞優詔於塗中候歸艎於日下瀛洲祕局式瞻侍從之班溫樹近司永託陶鎔之造願趨槐府獲效蓬心攬涕敘誠隕首誓報卑情無任代人辭官狀溫辭甫及渥命駢臻竊用退思匪遑祗受伏念某本以孤宦託於盛時專室之性甚愚外廷之遊粗足寅緣聖獎寵濫朝榮屬潛邸之署官首膺表擢陪學黌之講道無所發明旋預政機益承恩紀欽纘圖而布慶亞司會以名官隘薄奚勝深懼覆於公餗毫分未報自愧食於土毛而乃曲𬒳宸慈驟隆禮秩既褒異於邦爵復登二於天官震悸來并􅌤墨無措已陳車府之奏冀息鄉校之譏方聽俞音尚希舊貫伏望某官􅎮念庸識鑒諒危衷享其所冝勿使其進冒誠有所訴特示於保全獲追寢於恩章實有依於德蔭上李學士啓二首某猥䇿草茅之愚近膺寒素之目沿宦牒而便道許以過家入里門而下趨遂兹稅鞅想孤生之弱植早自困於無津竊希上國之並遊偶以諸生而著録久彈鐔於外舍託推轂於名卿然而泰機後門最嗟於晚出蘭臺雅聚本格於清流某官屣履起迎一顧增價借以左右之譽視如子姓之親辱謝公之齒牙憐其未立經平子之題目時不敢更一作不敢更非遂慿外獎之華獲致榮階之漸仰銜殊遇隂誓銘藏至於當便坐而執經對諸公而隸筆聞麈尾之餘論入於耳而不忘得師門之一言書諸紳而故在越流離於下國悵洵逺於崇閎在隂鮮歡歲崢嶸而倐盡一作忽逃虛既久音謦咳而不聞逖仰墮鱣之庭豈勝疲馬之戀同前某啓伏自學士𬒳渥帝宸躋榮史局嘗貢躍螽之懇諒塵隱几之觀然而偃宣父之風草蒂一作帶何勝於餘暖望長安之日葵心愈屬於愛輝計六氣之順調降百祥而穰簡恭以學士星奎稟粹玉鎮凝華敏學兼該復一變而歸乎道美文鼓動導元氣而泄其和自丁千載以親逢出協五靈而瑞聖當天下之第一非公甚明今加以代字辭官啓𥘉似為晏元獻作徐考官職則又不然或是他人之文李學士二篇據蔡康祖跋云王銍性之搜求文忠公遺文已多某復於家藏李邯鄲録遺中得此啓狀按公天聖八年登科淑已為史館檢討尋遷直集賢院於公為先進逮景祐三年公貶夷陵淑在翰林以書附遞問五代史公巽辭答之則𥘉第或曽投啓但公後來奏疏極口詆淑今第一啓乃有沿牒過家并子姓師門等語與公出處交際殊不相應吉綿本既已收入姑存之回潁州吕侍讀逺迎狀熙寧三年右某啓某此者誤恩擢任嗟癃病之不堪危懇力辭蒙睿慈之垂閔許從易地俾養衰齡方趨便道之行適遂過家之樂敢期雅眷逺辱惠音雖瞻𣢾之尚遙若話言之已接傾馳之素欣感交深謹奉狀謝與潁州吕侍讀賀冬狀同前右某啓伏以七日告期候天陽之來復百祥佑德冝君子之承休知府侍讀侍郎經濟嘉謨論思碩望宣風撫俗一方式藉於鎮臨獻可告猷三接佇升於近密屬迎長之屆旦當受社於無疆頌詠傾勤敷宣罔既謹奉狀賀伏惟照察謹狀右公熙寧三年改知蔡州與吕正獻公二狀今載吕公五州録公嘗典數郡凡應用之文如頒曆恤刑賀正賀冬歲歲皆當上表而集中才見一二至於監司鄰郡往復書啓亦僅有之按蘇丞相跋公帖在書簡第二卷謂南京幕府二年府事外章奏書疏悉以見託然則公委人代作者固多此二狀未知出公手與否姑存之謝張先輩啓明道前吉綿本及文海皆有之早者公步至伏蒙以七言雅什一篇為贈者承命之辱拜賜甚嘉亟淪心而玩辭殆驚魂之去體伏以秀才即先輩象輿稟異廟璉凝姿服懿行以弸中騰藉華而冒逺遊聖門而入其閾洞際天人之交塞疑藝圃而漱其芳獵取菁英之妙目叨一日之雅巳服百人之豪方育賢而在阿久俟時而踠足第一鄉之品推月旦之美評遊諸公之門有名卿之屣履而乃過存庸妄之品曲借交遊之光采箕斗之虛名靡責其實謂粳秕之無用偶置于前特迂夢草之餘妍摛寫陽春之雅曲加華衮之一字寵示榮褒鬻珍髢於九戎委之非所矧復警辭猋駭峭格鋒生挫萬物以揮毫入無間而抽祕蕩蕩默默而滿坑滿谷雅韻迭揚郁郁紛紛而非霧非煙文華炳發屬苦中於清聖方卧歎於酸痟倐駭無因而至前不醉為之而強起病酲都釋颯若清風之襲人紬繹並輝永訂至珍之藏衍顧迫持於歸鞅慚弗獲於披風恭佩之私談非終悉回發運主客啓見文及仕塗必用伏審顯膺寵命榮總使權伏惟慶慰恭以某官才猷經世問望光朝資敏議以通微竭精誠而濟務自居漕職克邁官能九年之一作厚儲已豐於茂最三載考績遽𬒳於陟明重膺柬注之求奚測亨騰之執幸依使部致辱誨函銘佩欣祈併交悰悃與辛郎中啓慶曆二年冬倅滑州見緘啓新範右某此者得請便親署官近郡始臨舊府邈想清風依聽訟之甘棠餘音疑可愛步飛觴之月榭遺址尚存其如邊鄙多虞公私並乏簿書期會常苦紛紜樽俎笑談豈如疇昔方兹感誠疑遽辱誨存顧冬律之嚴凝喜天利之保嗇佇膺茂渥以副企翹與吕轉運啓見緘啓新範伏審顯奉宸息入趨入闕方欣庇賴遽失於焉依仍沐撝謙特貽於嘉問某人圭玉茂德棟幹丄材藹清望於朝端柬乃心於帝眷列城按俗喧美政於民謡會課及期走旌賢之召節鬱去思而雖甚諒峻陟以非遙冬序方凝神襟善嗇傾祈禱戀交集感悰答運使啓見緘啓新範伏審榮􅈾帝渥出領漕權方懷竊抃之誠遽辱誨存之惠某人廟璉重器國棟上才茂績藹於朝端嘉猷均於宸柬果𬒳僉諧之命實資冨庶之謨攬轡有𥘉已風行於列郡追鋒訊疑召即柄用於本朝矧託公庥但深久禱賀新發運啓見緘啓新範伏審榮抱使權巳諧禮上猥居屬郡竊庇公庥方深欣幸之私遽辱誨存之厚伏惟某人才優學古業茂經時久妙柬於上心屢委分於劇任果疇懿績亟𬒳陟明投刃皆虛豈足煩於餘地期年入報行别迓於寵靈屬此春和冀綏福履欣依禱頌倍萬常情與李吉州寬啓慶曆五年冬𥘉到滁州見緘啓新範伏念待罪山城絶迹人事敢期音誨屢以顧存飲疑風義以甚髙若話言之方晤坐麾千里矧茂最之巳成入覲四門佇寵光之休𬒳冬疑在候福履惟寧瞻詠感銘倍為誠素别紙附人至辱書為誨承臨郡之暇體况甚休鄉郡多幸得賢侯為立學舍蒙索鄙文竊喜載名廡下遂不敢辭筆語粗惡幸望與伯鎮學士評改而刻石也冬冷千萬加愛與許發運啓慶曆年滁州見緘啓新範伏念僻守郡封殆不通於轍迹邈詹風采缺馳問於興居恭惟按者之餘克保粹和之妙治朝急士方渴仲於宏材漕最淹賢況巳升於美績即期迅用以奮逺圖企頌之私縷言非罄又慶曆六年春滁州見緘啓新範伏念睽異風徽屢更年律河壖阻邈常辱郵音淮郡僻荒亦蒙誨問荷顧存之至厚慰艱拙以兹多此者伏審某人榮𬒳恩俞近移使節望行舟而非逺伸良覯以未涯惟賢業之素彰藹勳勤而夙著佇從公議别霈寵光豈此漕輸可淹傑俊春陽方盛福履惟休感詠詹依交集誠悃上李端明狀見緘啓新範伏審逺驅旌斾巳及郊圻和氣所充與民謳而先浹餘塵可望欣馬首之獲詹即遂攀迎交深祝詠某不任激切依歸之至回知郡賀冬狀見緘啓新範天序欲周物生伊始惟君子福綏之吉順陽和來復之時即迓寵光以符善禱敢祈隆顧先辱惠音荷慰誨之尤多積感銘而但切與楊太傅狀見緘啓新範右某伏念畫圻雖邇遘德未由幸時接於誨音良若披於徽采夫何定瑣辱此記憐春序已暄神襟善嗇佇膺茂渥以副傾祈答李寺丞狀見緘啓新範早欽秀望忽枉榮緘以州部之相望加門闌之最舊過形來問但切中藏答王供奉狀見緘啓新範乍間清徽兩蒙芳訊審憩車之伊始欣妙嗇以惟和即奉渥恩以符瞻禱與鄰郡官狀見緘啓新範伏念封圻甚密官守有常雖傾企德之勤尚阻披風之便承屢形於謙顧常曲示於誨言冬序方凝陽和將動伏惟為國自重以副詹祈答賀赴闕狀見緘啓新範近蒙朝旨召赴闕庭方瀝懇以致辭敢辱書而為賀仰承詔疑眷但切悚惶謝真州知郡見緘啓新範伏念幸守陋邦獲鄰善壤側聽下車之始巳喧載路之聲方渴仰於風徽遽先貽於誨問某人材雄通敏器藴宏深撫俗班條綽聞於餘𥙿陟明升最行𬒳於殊恩方此春陽冀綏福履禱祈感詠言述非周謝劉真州見緘啓新範幸鄰善壤日孰政聲雖談笑之靡親辱誨言之屢及少浣詹翹之貇奚勝感愧之私行因溢路之謡入𬒳中臺之召清和始屆寢寐增休縷縷之誠一一奚既右張先輩啓公所作無疑四六集偶失編入餘得之仕塗必用緘啓新範者皆京師舊本也或出公手或人代作其説與蘇丞相跋語同表奏書啓四六集卷第七按公行狀墓碑並云四六集七卷近歲浙西嘗刋行然甚無倫理大抵表奏書啓古皆散文後世始駢儷如公謝章服謝知制誥河北謝獎諭謝曆日表皆古文也不應以四六名集疑非當時定本又如謝致仕表反置集外其他散在諸卷光錯亂今用蘇文忠手編東坡前集法後集其子過編亦同凡表狀悉以遷拜為序其丐外乞休致之類則取之奏議以類相從各繫歲月于下所逸者河北都轉運使謝上表耳熙寧三年五月庚戍擅止散青苗錢放罪旨揮雖在四月移判太原之後七月改知蔡州之前然公尚留京東本任故繫謝表於夏然後公履歷出處昭然矣至於同是四六而或曰書或曰啓皆從其舊仍略考先後而推其姓氏之可知者合為七卷題曰表奏書啓四六集不敢失元目也紹興間從官與人雙緘皆題曰書上前賢𥘉除館職𥘉拜兩制𥘉入政府往往致謝在外之先進公答啓可考近世無此風矣詩藹藹王多吉士楚詞讒夫藹藹而曼著皆取茂盛之意公表章用藹昧蓋古字多假借俗本改作曖昧今存一二以警來者賀程太尉啓藩翰一作藩屏亳州到任謝兩府書至治一作治理寢驚一作寐驚上為此上一有伏惟二字與吕內翰啓恭惟一作恭審榮署榮一作受代辭胥學士啓司刑一作刑司福星聚列聚一作驟輝光末運一作奎躔末運國史公列傳末云中子棐字叔弼登進士第乙科修所為文須人代者多出其手修薨代草遺表神宗讀而愛之意修自作也集古録跋尾卷第七歐陽文忠公集一百四十唐開元金籙齋頌天寶九年衛包書撰右開元金籙齋頌雖不著書人姓氏而字為古文實為包書也唐世華山碑刻為古文者皆包所書包以古文見稱當時甚盛蓋古文世俗罕通徒見其字畫多竒而不知其筆法非工也余以集録所見三代以來古字尤多遂識之爾右集本唐龍興七祖堂頌天寶十年右龍興寺七祖堂頌陳章甫撰胡霈然書霈然筆法雖未至而媚熟可喜今上黨佛寺畫壁有霈然所書多為流俗取去匣而藏之以為竒玩余數數於人家見之其墨迹尤工非石刻比也右真迹唐明禪師碑天寶十年鄭炅之撰徐浩書秋暑困甚覽之醒然治平丙午孟饗致齋東閣書右真迹唐徐浩玄隱塔銘天寶十一年右玄隱塔銘徐浩撰并書嗚呼物有幸不幸者視其所託與其所遭如何爾詩書遭秦不免煨燼而浮圖老子以託於字畫之善遂見珍藏余於集録屢志此言蓋慮後世以余為惑於邪説者八字集本作之疑余也比見當世知名士方少壯時力排異説及老病畏死則歸心釋老反恨得之晚者往往如此也可勝歎哉右真迹唐顔真卿書東方朔畫贊天寶十三年右東方朔畫贊晉夏侯湛撰唐顔真卿書贊在文選中今較選本二字不同而義無異也選本曰棄俗登仙而此云棄世選本曰神交造化而此云神友右集本唐畫贊碑隂歲月見本文右畫贊碑隂唐顔真卿撰并書湛贊開元八年德州刺史韓思復刻于廟天寶十三年真卿始别書之右集本唐顔魯公題名歲月見本文右靖居寺題名唐顔真卿題按唐書紀傳真卿當代宗時為撿校刑部尚書為宰相元載所惡坐論祭器不修為誹謗貶硤州貟外别駕撫州湖州刺史載誅復為刑部尚書而此題名云永泰二年真卿以罪佐吉州與史不同據真卿湖州放生池碑隂所序云貶硤州旬餘再貶吉州蓋真卿未嘗至硤遂貶吉而史氏但據𥘉貶書于紀傳耳真卿大曆三年始移撫州當遊靖居時猶在吉也右集本同前右魯公題名言五字集本作顔魯公華嶽靖居寺東西二林題名靖居寺在吉州據魯公言永泰二年真卿以罪貶佐吉州據舊二字集本作按唐書列傳云真卿代宗時為刑部尚書為宰相元載所惡貶硤州貟外别駕撫州湖州刺史載誅復為刑部尚書不書其貶吉州也按真卿湖州放生池碑隂自敘云貶硤州旬餘再貶吉州蓋真卿未嘗至硤遂貶吉州集本無此四字而史官闕漏但書其初貶爾嘉祐八年十月草三日書右真迹唐顔真卿麻姑壇記大曆六年右麻姑壇記顔真卿撰并書顔公忠義之節皎如日月其為人尊嚴剛徑象其筆畫而不免惑於神仙之説釋老之為斯民患也深矣右集本唐顔真卿小字麻姑壇記歲月闕右小字麻姑壇記顔真卿撰并書或疑非魯公書魯公喜書大字余家所藏顔氏碑最多未嘗有小字者惟干祿字書注最為小字而其體法與此記不同蓋干祿之注持重舒和而不局蹙此記遒峻緊結尤為集本無此字精悍此所以或者疑之也余𥘉亦頗以為惑及把玩久之筆畫巨細皆有法愈看愈佳然後知非魯公不能書也故聊志之以釋疑者治平元年二月六日書右真迹唐中興頌大曆六年右大唐中興頌元結撰顔真卿書書字尤竒偉而文辭古雅世多模以黃絹為圖障碑在永州磨崖石而刻之模打既多石亦殘缺今世人所傳字畫完好者多是傳模輔足非其真者此本得自故西京留臺御史李建中家蓋四十年前崖石真本也尤為難得爾右集本又右中興頌世傳顔氏書中興頌多矣然其崖石歲久剝裂故字多訛缺近時人家所有往往為好事者嫌其剝缺以墨增輔之多失其真余此本得自故西臺李建中家蓋四十年前舊本最為真爾右真迹唐干祿字樣大曆九年右干祿字樣别有模本文注完全可備檢用此本刻石殘缺處多直以魯公所書真本而録之爾魯公書刻石者多而絶少小字惟此注最小而筆力精徑可法尤冝愛惜而世俗多傳模本此以殘缺不傳獨余家藏之治平丙午九月二十九日書右集本唐干祿字樣模本歲月見本文右干祿字樣模本顔真卿書楊漢公模真卿所書乃大曆九年刻石至開成中遽已訛缺漢公以謂一二工人用為衣食之業故摹多而速損者非也蓋公筆法為世楷模而字書辨正偽繆尤為學者所資故當時盛傳於世所以模多爾豈止工人為衣食業邪今世人所傳乃漢公模本而大曆真本以不完遂不復傳若顔公真迹今世在者得其零落之餘藏之足以為寶豈問其完不完也故余并録二本並藏之亦欲俾覽者知模本之多失真也右集本又右顔魯公干祿字書乃大曆九年刻石至開成中遽巳訛缺蓋由公筆法為世楷模而字書辨正偽繆尤為學者所資而當時盛傳於世爾漢公謂一二工人用為衣食之業者惜其傳模多而早損然豈止為工人為衣食業也今世人多傳漢公模本而大曆真本以不完遂不復傳若顔公真迹今世在者得其零落之餘藏之尤足為寶豈問其完不完也故余并録二本並藏之亦欲俾覽者知模本之多失真也治平元年正月五日錫慶院賜壽聖節宴歸書右真迹唐歐陽琟碑大曆十年右歐陽琟碑顔真卿撰并書余自皇祐至和以來頗求歐陽氏之遺文以續家譜之闕既得顔魯公歐陽琟碑又得鄭真義歐陽諶墓銘以與家所傳舊譜及陳書元和姓纂諸書參較又問於吕學士夏卿夏卿世稱博學精於史傳因為余考正訛舛而家譜遂為定本然獨琟碑所失者四顔公書穆公封山陽郡公吕學士云陳無山陽郡山陽今楚州是也當梁陳時自為南兖州而以連州為陽山郡然則陳書及舊譜皆云穆公封陽山公為是而顔公所失者一也舊譜皆云堅石子質南奔長沙顔公云自景逹始南遷其所失者二也歐陽生自前漢以來諸史皆云字和伯而顔公獨云字伯和二字義雖不異然當從衆又顔氏獨異初無所據蓋其繆爾其所失者三也元和姓纂及諶銘皆云㣧約之子而顔公獨以為紇子其所失者四也琟之世次不應舛亂如此蓋諶之卒葬在咸亨上元之間去率更未逺真義所志冝得其實琟卒大曆中唐之士族遭天寶之亂失其譜繫者多顔公之失當時所傳如此不足怪也治平元年夏至日書銘闕其末數句不輔右真迹唐杜濟神道碑大曆十二年右杜濟神道碑顔真卿撰并書藝之至者如庖丁之刀輪扁之斫無不中也顔魯公之書刻於石者多矣而有精有粗雖他人皆莫可及然在其一家自有優劣余意傳模鐫刻之有工拙也而此碑字畫遒徑豈傳刻不失其真者皆若是歟碑巳殘缺銓次不能成集本有其字文第録其字法爾嘉祐八年中元假日書右真迹唐杜濟墓志銘大曆十二年右杜濟墓志銘但云顔真卿撰而不云書然其筆法非魯公不能為也蓋世頗以為非顔氏書更俟識者辨之右真迹唐顔真卿射堂記大曆十二年右射堂記顔真卿書魯公在湖州所書刻于石者余家集録多得之惟放生池碑字畫完好如干祿字書之類今已殘闕每為之歎惜若射堂記者最後得之今僕射相公筆法精妙為余稱顔氏書射堂記最佳遂以此本遺余以余家素所藏諸書較之惟張敬因碑與斯記為尤精徑惜其皆殘闕也右集本唐張敬因碑大曆十四年右張敬因碑顔真卿撰并書碑在許州臨潁縣民田中慶曆初有知此碑者稍稍往模之民家患其踐田稼遂擊碎之余在滁陽聞而遣人往求之得其殘闕者為七假矣其文不可次第獨其名氏存焉曰君諱敬因南陽人也乃祖乃父曰澄曰運其字畫尤竒甚可惜也右集本又右魯公之碑世所竒重此尤可珍賞也廬陵歐陽修書右續添唐顔勤禮神道禆大曆十四年右顔勤禮神道碑顔真卿撰并書序顔溫二家之盛云思魯大雅在隋俱仕東宫愍楚彥博同直內史省遊秦彥將皆典祕閣按唐書云溫大雅字彥弘弟彥博字大臨弟大有字彥將兄弟義當一體而名大者字彥名彥者字大不應如此蓋唐世諸賢名字可疑者多封德彞云名倫房玄齡云名喬髙士廉云名儉顔師古云名籀而皆云以字行倫喬儉籀在唐無所諱不知何避而行字余於中書見顔氏裔孫有獻其家世所藏告身三卷以求官者其一思魯除儀同制其一勤禮除詹事府主簿制其一師古加正議大夫制思魯制云內史令臣瑀宣者蕭瑀也侍郎臣封德彞奉舍人臣彥將行不應內史令書名而侍郎舍人書字又必不稱臣而書字則德彞彥將皆當為名師古制有尚書左僕射梁國公玄齡右僕射申國公士廉又有吏部尚書君集者侯君集也侍郎纂者楊纂也四人並列於後不應二人書名二人書字也則玄齡士廉亦皆當為名矣又師古與令狐德棻同制不應德棻書名而師古書字則師古亦當為名也然余家集録有申文獻公塋兆記是髙宗時許敬宗撰云公諱儉字士廉敬宗與士廉同時人而為其家作記必不繆誤則士廉又當為字也然告身書字在理豈安今新唐書雖云房玄齡字喬顔師古字籀以髙儉塋兆記為名則喬籀果為字乎又按元和姓纂封氏蓨人隋通州刺史繡生四子曰德潤德輿德如德彞又云德彞更名倫亦不知果是否唐去今未逺事載文字者未甚訛舛殘缺尚可考求而紛亂如此故余嘗謂君子之學有所不知雖聖人猶闕其疑以待來者蓋慎之至也右集本唐顔氏家廟碑建中元年右顔氏家廟碑顔真卿撰并書真卿父名惟貞仕至薛王友真卿其第七子也述其祖禰羣從官爵甚詳右集本唐顔魯公書殘碑歲月闕右顔氏殘碑以家廟碑考之是顔允南碑也家廟碑云允南歷殿中膳部司封郎中司業金鄉男此碑云肅宗入中京遷司封尋封金鄉縣男又云遷國子司業此碑云二子潁熲熲好為五言詩授校書郎早卒家廟碑亦云熲好五言校書而此碑又云與弟允臧同時臺省則為允南可知不疑惟書潁事家廟碑云侍郎蔣冽賞其判此碑云為崔器所賞小不同爾治平元年寒食日書右真迹又余謂顔公書如忠臣烈士道德君子其端嚴尊重人初見而畏之然愈久而愈可愛也其見寶于世者不必多然雖多而不厭也故雖其殘缺不忍棄之右集本唐湖州石記歲月闕右湖州石記文字殘缺其存者僅可識讀考其所記不可詳也惟其筆畫竒偉非顔魯公不能書也公忠義之節明若日月而堅若金石自可以光後世傳無窮不待其書然後不朽然公所至必有遺迹故今處處有之唐人筆迹見于今者惟公為最多視其巨書深刻或託于山崖其用意未嘗不為無窮計也蓋亦有趣好所樂爾其在湖州所書為世所傳者惟干祿字放生池碑尚多見於人家而干祿字書乃楊漢公摹本其真本以訛缺遂不復傳獨余集録有之惟好古之士知前人用意之深則其堙沉磨滅之餘尤為可惜者也右集本唐顔魯公帖歲月闕右蔡明逺帖寒食帖附皆顔魯公書魯公後帖流俗多傳謂之寒食帖集本無此十三字其集本有後字印文曰忠孝之家者錢文僖公自號也希聖錢公字也又曰化鶴之系者丁崖相印也潤州觀察使者錢惟濟也右真迹唐顔魯公二十二字帖嵗月闕斯人忠義出於天性故其字畫剛徑獨立不襲前迹挺然竒偉有似其為人右真迹唐顔魯公法帖虞世南帖附歲月闕右顔真卿書二帖并虞世南一帖合為一卷顔帖為刑部尚書時乞米於李大夫云拙於生事舉家食粥來巳數月今又罄乏實用憂煎蓋其貧如此此本墨迹在豫亡友王子野家子野出於相家而清苦甚於寒士嘗模帖刻石以遺朋友故人云魯公為尚書其貧如此吾徒安得不思守約世南書七十八字尤可愛在智永千字文後今附于此右集本唐元次山銘歲月闕右元次山銘顔真卿撰并書唐自太宗致治之盛幾乎三代之隆而惟文章獨不能革五國二字集本作陳隋之弊既久而集本有其字後韓栁之徒出蓋習俗難變而文章變體集本作之又難也次山當開元天寶時獨作古文其筆力雄健意氣超拔不減韓之徒也十二字集本作雖少雄健而意氣不俗亦可謂特立之士哉右真迹唐吕諲表上元二年右吕諲表元結撰顧戒奢八分書景祐三年余謫夷陵過荆南謁吕公祠堂見此碑立廡下碑無趺石埋地中勢若將踣惜其文翰遂得斯本而入于地處字多缺滅今世傳元子文編亦有此文以碑考之集本首尾不完中間時時小異當以石本為是然石本亦自多亡缺可不惜哉右集本又景祐三年余謫夷陵過荆南謁吕公祠堂見此碑立廡下碑無趺石埋地中勢若將踣惜其文翰遂得斯本而入于地處字多缺滅今世傳元子文編所載首尾不完中間時時小異當以石本為是集録實不為無益矣然石本亦自多亡缺可不惜哉書者顧戒奢也余得此碑三十年矣暇日因偶題之嘉祐八年五月中旬休日書右真迹唐元結窪樽銘永泰二年右窪樽銘元結撰瞿令問書次山喜名之士也其所有為惟恐不異於人所以自傳於後世者亦惟恐不竒而無以動人之耳目也視其辭翰可以知矣古之君子誠耻於無聞然不如是集本有人字之汲汲也右真迹唐元結陽華巖銘永泰二年右陽華巖銘元結撰瞿令問書元結好竒之士也其所居山水必自名之惟恐不竒而其文章用意亦然而氣力不足故少遺韻集本無此九字君子之欲著于不朽者有諸其內而見於外者必得於自然顔子蕭然卧於陋巷人莫見其所為而名髙萬世所謂得之自然集本有者字也結之汲汲於後世之名亦已勞矣嘉祐八年十二月二十六日書右真迹唐元結峿臺銘大曆二年右斯人之作非好古者不知為可愛也然來者安知無同好也邪右真迹唐張中丞傳歲月闕古張中丞傳李翰撰嗚呼集本無此二字張巡許逺之事壯矣秉筆之士皆喜為之稱述也然以翰所記考唐書列傳及韓退之所書皆互有得失而列傳最為踈略雖云史家當記大節然其大小數百戰屢敗賊兵其智謀材力亦有過人可以示後者史家皆滅而不著甚可惜也翰之所書誠為太繁然廣記備言所以備史官之采也右真迹唐李陽冰城隍神記乾元二年右城隍神記唐李陽冰撰并書陽冰為縉雲令遭旱禱雨約以七日不雨將焚其祠既而雨遂徙廟于西山陽冰所記云城隍神祀典無之吳越有爾然今非止吳越天下皆有而縣則少也右集本唐李陽冰忘歸臺銘乾元二年右忘歸臺銘唐李陽冰撰并書銘及孔子廟城隍神記三碑並在縉雲其篆刻比陽冰平生所篆最細瘦世言此三石皆活歲久漸生刻處幾合故細爾然時有數字筆畫特偉徑者乃真迹也右集本唐縉雲孔子廟記上元二年右縉雲孔子廟記李陽冰撰并書孔子廟像之制前史不載開元八年國子司業郭瓘奏云先聖孔宣父以先師顔子配其像為立侍配享冝坐弟子十哲雖得列像而不在祀享之位按祠令何休范寧等二十二賢猶蒙從祀十哲請列享在何休等上於是詔十哲皆為坐像據陽冰記云換夫子之容貌增侍立者九人蓋獨顔回配坐而閔損等九人為立像矣陽冰修廟在肅宗上元二年其不用開元之詔何也右集本唐裴虬怡亭銘永泰元年右怡亭在武昌江水中小島上武昌人謂其地為吳王散花灘亭裴鶠造李陽冰名而篆之裴虬銘李莒八分書刻于島石四十六字集本作怡亭銘李陽冰篆裴虬撰李莒書銘在武昌江水中有小島亭在其上人謂其地為吳王散花灘銘刻于島石常為江水所沒故世亦罕傳鶠集本以鶠字作亭裴公作不知何人虬代宗時集本有為字道州刺史韓愈集本作退之為其子復墓志云虬為諌議大夫有寵代宗朝屢諫諍數命以官多辭不拜然唐史不見其事李莒華弟也治平二年正月十日孟春薦饗攝事致􅷜中書東閣書右真迹唐李陽冰庶子泉銘大曆六年右庶子泉銘李陽冰撰并書慶曆五年余自河北都轉運使貶滁陽屢至陽冰刻石處未嘗不裴回其下庶子泉昔為流溪今為山僧填為平地起屋于其上問其泉則指一大井示余集本無此二字曰此庶子泉也可不惜哉右真迹唐李陽冰阮客舊居詩歲月闕右李陽冰阮客舊居詩云阮客身何在仙雲洞口橫人間不到處今日此中行阮客者不見其名氏蓋縉雲之隱者也彼以遁俗為高而終以無名於後世可謂獲其志矣然聖人有所不取也陽冰欲稱其人而不顯其名字何哉豈阮客見稱於當時而陽冰不慮於後世邪夫士固有顯聞於一時而泯沒於萬集本作後世者矣顧其道何如集本作如何也陽冰篆字世傳多矣此磨滅而僅存尤可惜也治平元年四月二十有六日書右真迹唐裴公紀德碣銘歲月見本文右裴公紀德碣銘唐越州刺史王密撰國子監丞集賢院學士李陽冰篆裴公警為明州刺史密代之為作此文其文云皇唐御神器一百四十二年天下大康海隅小冦結亂甌越因言明州當出兵之衝民物殘弊警撫綏有惠愛而人思之爾按唐自戊寅武德元年受命至己亥乾元二年乃一百四十二年是時肅宗新起靈武上皇自蜀初還史思明僣號于河北是嵗洛陽汝鄭等州皆陷于賊不得云天下大康而海隅小寇也考于史傳又不見其事惟台州賊袁朝攻陷浙東州郡乃寶應元年當云一百四十五年又據密代警為明州刺史至大曆十四年移湖州則警密相繼為刺史冝在代宗時然密當時人推次唐年不應有失余友王回深父曰唐自武德至大曆八年實一百五十六年中間除則天稱周十四年則正得一百四十二年是時天下粗定文人著辭以為大康理亦可通是歲廣州哥舒晃作亂海隅小冦豈謂此歟余以謂晃之亂唐命江西路嗣恭討平之不當自明州出兵深父曰然兵家出竒明州海道去廣不逺亦或然也故并著之右集本又右裴公紀德碣王密撰裴公名警代宗時為明州刺史密代之碣文云皇唐御神器一百四十二載天下大康而海隅小冦結亂甌越按唐自武德元年至乾元二年實一百四十二年是時肅宗新起靈武上皇自蜀初還史思明僣號于河北是歲洛陽汝鄭等州皆陷于賊不得云天下大康而海隅小冦考于史傳又不見其事然密當時人推次唐年不冝有失王回曰大曆八年廣州哥舒晃作亂此所謂海隅小冦者也自武德元年至是歲實一百五十六年中間則天稱周者十四年去之正得一百四十二年矣豈謂此歟以事考驗理冝如此又不知密意為如何也姑志其語以俟知集本有之字者嘉祐八年十月三十日書右真迹唐玄靜先生碑大曆七年右玄靜先生碑柳識撰張從申書李陽冰篆額唐世工書之士多故以書知名者難自非有以過人者不能也然而張從申以書得名於當時者何也從申每所書碑李陽冰多為之篆額時人必稱為二絶其為世所重如此余以集録古文閲書既多故雖不能書而稍識字法從申所書棄者多矣而時録其一二者以名取之也夫非衆人之所稱任獨見以自信君子於是慎之故特録之必待知者右真迹售龍興寺四絶碑首大曆八年右四絶碑首者李陽冰篆法慎律師碑額也在揚州龍興寺售李華文張從申書李陽冰篆額律師者淮南愚俗素信重之謂此碑為四絶碑律師非余所知華文與從申書余亦不甚好故獨録此篆爾右集本唐滑州新驛記大曆九年右新驛記李陽冰篆碑在今滑州驛中其隂有銘曰斯去千載冰生唐時冰今又去後來者誰後千年有人吾不知之後千年無人當盡於斯嗚呼郡人為吾寶之不知作者為誰然賈耽嘗為李騰序説文字源盛稱陽冰此記耽為滑州刺史因見斯記而稱之耳陽冰所書世固多有可愛者不獨斯記也嘉祐八年十二月甘六日書右真迹唐王師乾神道碑大曆十三年右王師乾神道碑張從申書余初不甚以為佳但怪唐人多稱之第録此碑以俟識者前歲在亳社因與秦玠郎中論書玠學書於李西臺建中而西臺之名重於當世余因問玠西臺學何人書云學張從申也問玠識從申書否云未嘗見也因以此碑示之玠大驚曰西臺未能至也以此知世以鑒書為難者誠然也從申所書碑今絶不行於世惟豫集録有之者吳季子碑隂記崔圓頌德碑并此才三爾熙寧三年十月二十七日書右真迹集古録跋尾卷第七開元金籙齋頌元第七百二十七姓氏一作名氏治平元年七月三十日一有此九字七祖堂頌元第三十三明禪師碑元第五百二十五玄隱塔銘元第五百九十東方朔畫贊元第五十九畫贊碑隂元第六十顔魯公題名元第一百二麻姑壇記元第四十小字麻姑壇記元第三百唐中興頌元第四十八至五十干祿字樣元第二百三十七干祿字樣模本元第二百三十八歐陽琟碑元第七百七十六至七百七十七杜濟神道碑元第曰百五碑巳一作以杜濟墓志銘元第三百七十七射堂記元第五百三十為余二字上一有數字諸書一作本治平元年七月二十二日中書東閣書一有此十五字或問余曰何謂六一居士余曰吾家有書一萬卷集古録一千卷棊一局琴一張常置酒一壺問者曰此五一也奈何余曰以吾一翁老於五物之間豈非六一乎治平丙午秋饗攝事齋于東閣書跋後一有此七十五字張敬因碑元第四十二至四十三顔勤禮碑元第三百四十五至三百四十六彥將皆當為名此下一有也字字乎一作否治平元年二月二十八日書一有此十一字顔氏家廟碑元第五十二至五十三顔魯公書殘碑元第三百九十七又棄之一作也湖州石記元第二百七十七後世此下一有而字不朽此下一有也字亦有一作其治平元年正月二十日書一有此十字顔魯公帖元第一百八十罄乏石本作罄竭顔魯公二十二字帖元無卷第顔魯公并虞世南帖元無卷第元次山銘元第二百四十三吕諲表元第一百五十五窪樽銘元第三百一十八陽華巖銘元第二百二見於此下一有其字峿臺銘元第一百七十六張中丞傳元第二百八十二至二百八十三最為一無為字城隍神記元第一百三忘歸臺記元附一百四縉雲孔子廟記元第一百四郭瓘一作郭元瓘或作李元瓘案唐志李元瓘為是嘉祐八年十月二十三日一有此十字怡亭銘元第一百一十二庶子泉銘元第七十裴回一作徘徊阮客舊居詩元第五百九十五裴公紀德碣元第一百一十八玄靜先生碑元第五百二十七之必二字一作以四絶碑首元第一百七十九覺寂碑首附嘉祐八年夏至日書一有此八字覺寂碑首亦陽冰篆也跋後又有此九字滑州新驛記元第二百一十王師乾碑元第七百五
