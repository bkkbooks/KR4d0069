body:
  text: 內制集卷第二歐陽文忠公集八十三景靈宫奉真殿看經堂開啓真宗皇帝忌辰黃籙道埸青詞正月十一日伏以崇妙道於清虛實惟先志感時思於雨露式表孝心按金籙之真科即琳宫之福地薦茲精潔庶以感通冀善應之無方期水資於沖蔭景靈宫廣孝殿看經堂開啓章懿皇后忌辰黃籙道埸青詞正月十一日伏以坤儀永閟昭厚德於無疆蘂館載嚴奉真遊而如在式臨逺諱用感孝思薦時品之惟新啓齋埸而增肅仰祈歆鑒永集祥祺慈孝寺開啓真宗皇帝忌辰資薦道埸齋文正月十一日伏以仙馭乘雲式臨於逺日春陽濡露載感於孝思爰即梵居俾延淨侣瞻玉毫之妙相啓貝葉之真文集此勝因仰資冥祐集英殿開啓真宗皇帝忌辰道埸齋文正月十一日伏以神遊斯逺方仰於軒威諱日茲臨載深於舜慕虔依正覺俾集善因敞禁殿以有嚴啓法筵而夙設仰祈冥助用慰孝思內中福寧殿罷散三長月道埸青詞正月十七日伏以首春紀序標令月以惟時善氣宣和紛百祥而來集載嚴祕殿恭按真科依妙道之沖虛薦清一作精衷之蠲潔冀迎純祐均𬒳羣倫撫問真定府定州等路臣寮口宣正月二十二日卿汝等並韞時才出分邊寄屬新陽之戒候念宣力以惟勞特示撫存體茲眷遇撫問保州路臣寮口宣正月二十一日卿汝等夙臨邊圉盡瘁公家當春序之方和念朔陲之尚凛俾茲撫慰式示眷懷撫問北京并恩州臣寮口宣正月二十二日卿汝等並膺柬寄方布教條惟夙夜之宣勤在眷懷而彌切特加存撫冝體優隆雄州撫問契丹賀乾元節人使口宣二月二十三日卿等並持使節叶講鄰歡飭車馭以載勞及疆亭而茲喜一作始俾伸慰撫式示眷懷贈保順軍節度使張惟吉祭文堂祭二月二十六日維至和二年歲次乙未三月已未朔皇帝遣入內內侍省內西頭供奉官勾當延福宫康為政致祭于贈保順軍節度使張惟吉之靈惟靈忠勤之節克保於有終存殁之恩僃隆於異數仍加祖奠式表哀榮尚享贈保順軍節度使張惟吉祭文墳所二月二十六日惟靈佐佑宣力始終不渝載嘉遺忠實用追惻奠爾臨壙魂其有知賜契丹賀正旦人使却回班荆館酒果口宣十二月二十九日卿等並持信節繼講鄰歡既夙駕以言歸俾及郊而留餞冝伸寵錫用示眷懷賜鎮安軍節度使同中書門下平章事判陳州程琳進奉乾元節詔三月十五日誕祥著節延祝申誠顧豫同德之臣首列充庭之貢式彰勤藎深用歎嘉賜外任臣寮進奉乾元節銀絹馬等詔敕書司三月十五日夏時正候誕節戒辰惟事君之盡忠因效貢而申祝嘉乃勤意勿忘于懷賜樞密使河陽三城節度使同中書門下平章事王德用生日禮物口宣三月二十五日卿勳閥名家樞機重任式因誕日用示優恩冝體眷懷膺茲蕃錫廣聖宫開啓乾元節青詞三月二十五日伏以月旅正陽當百嘉之茂盛祥標誕節期萬壽之穹隆式案舊章載嚴祕殿延紫霄之飛馭誦玉笈之靈篇伏冀誠慤上通聖真垂佑錫之多福均動植之幽微永以無疆並乾坤而悠久撫問河東路沿邊臣寮夏藥口宣三月二十五日卿汝等並膺寄任深柬器能顧隆暑之惟時念禦邊之宣力俾分珍劑式示眷懷撫問麟府路一無路字臣寮及并代州路臣寮口宣三月十五日卿汝等蔚有時才並分邊寄顧藴隆之在候嘉勤瘁以不忘式示撫存體茲柬注撫問宣徽南院使彰信軍節度使判真定府李昭亮口宣四月六日卿宣勞邊鄙頗歷歲時因乃子之言行俾過家而賜問式彰寵眷以耀私門錫慶院賜宰臣巳下罷乾元節道埸酒果口宣卿等任國鈞軸為豫股肱因誕節之屇辰嚴梵宫而申祝載嘉忠藎冝示寵頒端午帖子詞二十首三月二十五日皇帝閣六首其一天清槐露浥歲熟麥風涼五日標嘉節千齡獻壽觴其二午位星杓正人間令節同四時和玉燭萬物𬒳薰風其三舜舞來遐俗堯仁浹九區五兵消以德何用赤靈符其四椘國因讒逐屈原終身無復入君門願因角黍詢遺俗可鑒前王惑巧言其五嘉辰共喜沐蘭湯毒沴何須採艾禳但得臯夔調鼎鼐自然災祲變休祥其六炎暉流爍蕙風薰草木蕃滋德澤均畜藥蠲痾雖故事使民無疾乃深仁皇后閣五首其一畫扇催迎暑靈符喜辟邪風光麗宫禁時節重仙家其二椒塗承茂渥嬪壼範柔儀更以親𧖟繭紉為續命絲其三覆檻午隂黃鳥囀烘簾曉日絳榴繁六宫綵縷爭新巧共續千齡奉至尊其四紫蘭淅淅光風轉緑葉隂隂禁苑涼天子萬機多暇日喜逢嘉節奉瑶觴其五五色雙絲獻女功多因荆椘記遺風聖君照物同天鑒不用江心百鍊銅溫成皇后閣四首其一密葉花成子新巢燕引雛君心多感舊誰獻辟兵符其二旭日映簾生流暉槿艷明紅顔易零落何異此花榮其三綵縷誰云能續命玉奩空自鎖遺香白頭舊監悲時節珠閣無人夏日長其四依依節物舊年光人去花開益可傷聖主聰明無色惑不須西國返魂香夫人閣五首其一梅黃𥘉過雨麥實巳登秋避暑多佳賞皇歡奉一作奏豫遊其二鳴蜩驚早夏鬭草及良辰共薦菖華一作蒲酒君王壽萬春其三椘俗傳筒黍江人喜競船深宫亦行樂綵索續長年其四涼生玉宇來風細日永金徒報漏稀皎潔冰壷清水殿三千爭捧赭黃衣其五仙盤冷泛銀河露紈扇香搖緑蕙風禁掖自應無暑氣瑶臺金闕水精宫賜右屯衛大將軍叔韶獎諭勑書四月十二日勑叔韶省所進祝聖壽歌日月元樞論共二軸事具悉朕固嘉汝嚮學勵善蔚然而有文與夫習冨貴之驕而樂狗馬之玩者異矣然夫學者所以知君臣父子之禮出可以施於國入可以施於家汝其慎擇厥師講救其闕使言而無過以自逺於悔尤夫能異於衆人誠為有立必至乎君子然後大成汝其勉之無或中止故茲獎諭想冝知悉十九日契丹賀乾元節人使朝辭訖就驛賜酒果口宣四月十二日卿等夙持鄰聘申慶誕辰嘉成禮之有儀在眷懷而增厚冝頒優賚式示寵章集禧觀凝祥池崇禧殿就上清宫功德前開啓保夏祝聖壽金籙道埸密詞五月十八日伏以道本無為功施萬物福惟善應信若四時當茂育之屇辰薦精明而交感載嚴珍館恭按仙科伏願飈歘來臨清真垂祐保壽齡之永錫均動植以咸休賜判大名府賈昌朝判陳州程琳判成德軍李昭亮等進奉上壽金酒器一副馬六匹詔五月二十三日載誕及辰萬邦咸慶顧乃蕃宣之重實惟耆哲之明休有物容來陳壽祝嘉乃誠意不忘于懷兖州會真宫等處開啓皇帝本命道埸青詞伏以三辰昭運六甲馴行當薰風阜育之時屬正命本元之日謹遵科式上薦誠明誦琳蘂之真文延紫清之諸聖伏冀蒼靈降鑒福嘏駢臻蒙休匪止於眇躬博施咸均於庶品除皇弟允𥘉特授依前檢校尚書右僕射充感德軍節度使加食邑食實封餘如故制五月二十八日門下爵賞當功則為善之勸廣名器不假則至公之道存然而隆恩睦親所以厚乎風俗建侯作屏所以扞乎一作捍我王家非余敢私乃國舊典具官允𥘉質性純茂稟乎天姿學問發明一作聞由於師訓維我叔父時為賢王緬懷遺烈之存屬乃克家之善自𬒳蕃宣之寄久參朝請之聮冝從留務之繁進委臨戎之重節旄並建井賦兼增僉謀克諧寵數惟渥於戲干戈衛社內有宣勤夙夜之臣甲胄在躬外有奮力行伍之將爾其念宴安之懷毒知冨貴之難居戒損於滿而罔敢自驕勞身以謙而克保其位無忘勗勵往服恩榮可特授依前檢校尚書右僕射使持節耀州諸軍事耀州刺史兼御史大夫充感德軍節度使耀州管內觀察處置等使仍加食邑七百戶食實封二百戶散官勳封如故主者施行賜鎮海軍節度使檢校太尉同中書門下平章事判亳州陳執中讓恩命第二表不允仍斷來章批答至和二年六月十八日卿自再司鈞軸未久歲時乃者數上封章願還叩綬朕惟委任之際古今所難知之不盡如不知用之不終如不用所以悉格羣議獨斷余衷非惟勉爾以胡恤人言亦庶幾乎任賢勿二之意也而卿一無卿字避讓之節再三益堅事有重違理當俯徇夫進退以禮豈惟優大臣堂陛俱隆蓋以尊人主是用寵爾以節旄之寄兼之以槐鼎之榮雖為新恩實爾舊物出入中外載嘉夙夜之勤待遇始終當盡君臣之分無煩封執用體眷懷所讓冝不允仍斷來章賜新除宰臣冨弼赴闕茶藥口宣至和二年六月十八日卿祗若新恩式趨近甸炎歊方鬱衝冒良勤冝有頒宣用伸眷遇賜新除宣徽北院使檢校太保判并州王拱辰讓恩命不允仍斷來章批答至和二年六月十八日省表具之宣導徽猷號為近職鎮撫方靣實惟難才余思其人於爾為得至於儒學雍容於顧問勤勞出入於劇繁考資望以孰先在甄升而惟允辭讓之節誠雖可嘉詢謀既同命則無易所讓冝不允仍斷來章賜新除宣徽南院使檢校太保判延州吳育讓恩命不允仍斷來章批答至和二年七月十七日省表具之卿學足以治人知足以謀事夙有問望稱于搢紳惟時舊人常歷二府一使二字一作宣徽之職夫復何讓若乃居則道古先之訓講朕以六經出則重朝廷之威撫余之逺俗才無不可用之文武而皆冝忠無不為任以內外而何異余考於衆僉惟汝諧所讓冝不允仍斷采章賜新除昭德軍節度使知鄆州龐籍赴闕生料口宣至和二年七月二十一日卿言秉覲圭甫臨畿甸屬此新商之序載嘉執轡之勤冝有頒宣以彰寵待賜新除昭德軍節度使知鄆州龐籍赴闕茶藥詔同日勑龐籍擁節之蕃飭車來覲顧都圻之甫及嘉跋履之斯勞特頒飲劑之良以示眷懷之厚醴泉觀本觀三門上梁文至和二年七月二十一日兒郎偉我國家膺三靈之眷命革五代之荒屯多壘削平包干戈而偃武四夷靣內解辮索以承風逮先聖之撫臨躋羣生於冨壽乃欲追羲軒以並軌欵云亭而勒成容典交修遂舉曠古難行之禮瑞應來集有非人力可致之祥卿雲裔露之光紛綸而雜委朱草靈芝之秀焜耀而叢生爰有神泉湧茲福地甘如飲醴美可蠲痾湛靈液以淵渟敞琳宫而崛起歲時遊豫順民俗之樂康棟宇翼嚴表京師之壯麗近以有司不謹飛熖延災皇上愛物推仁因民所利顧遺基之巋爾回聖慮以惻然爰飭良工載新有作損其土木之費所以寬民適其奢儉之中俾之可久用涓吉日構此修梁盍效歡謳形于善祝兒郎偉拋梁東危搆岧嶤彩露中欲識聖君仁及物靈源一勺本無窮兒郎偉拋梁西金碧相輝俯仰迷萬瓦寒光浮瑞露層簷晚景挂晴霓兒郎偉拋梁南善利深功一作功深不可談但喜斯民無疾癘誰知靈液有餘甘兒郎偉拋梁北觀者如雲來九陌四方萬國會京師有類衆星環斗極兒郎偉拋梁上棟宇規摹摽大壯落成行即慶良辰望幸何時來綵仗兒郎偉拋梁下祈福為民崇廣夏四時和氣致休祥萬國多歡洽朝野伏願上梁以後三辰順軌百榖豐登卉服雕題咸𬒳垂衣之化行歌戴白永為繫壤之氓皇帝萬歲皇帝萬歲皇帝萬萬歲賜新除宰臣文彥博讓恩命第二表不允仍斷來章批答至和一年七月二十八日省表具之朕躬儉約以先人而生民未足勤憂勞以勵政而百職多隳豈布德之不明抑任人之弗至是以齋居正慮先志後占鑒屢易以為煩念難知之可慎永惟商周之所記至以夢卜而求賢孰若用搢紳之公言從中外之人望卿以舊哲比嘗相豫惟宇量能寬以服人惟純誠故久而益信勳德兼著可以重朝廷忠信不回可以臨大事夫謀於其始而既審則果於必用而不疑汝其欽哉朕命無易所讓冝不允仍斷來章賜新除宰臣冨弼讓恩命第二表不允仍斷來章批答至和二年七月二十八日省表具之卿有憂國愛君之心而忠以忘其已有經邦濟時之學而用未究其能夫畜久而積厚則施之不窮慮深而計熟則謀無不獲茲朕所以虛心仄席有望於卿也矧卿正直不回庸邪素忌小人所異君子所同是以在外十年而左右之譽不及履躬一德而搢紳之望愈隆朕內決於心外詢于衆敢謂有得卿其可辭所讓冝不允仍斷來章南京鴻慶宫開啓皇帝本命道埸青詞八月一日伏以紫清垂祐資道妙之沖虛甲乙馴行會天辰於元本欵别都之福地舉淨醮之真科薦以潔精通乎肹蠁伏願衆靈昭鑒百福來臻隆萬壽於無疆溥群生而咸遂撫問真定府髙陽關河東等路臣寮口宣八月六日卿汝等出分邊寄僃罄材謀載嘉宣力之勞屬此爽秋之候冝加撫慰俾示眷懷撫問邠寧環慶涇原鎮戎軍德順軍路臣寮口宣八月八日卿汝等各韞材猷並膺寄任屬商秋之在候念障圉之為勞冝有恩言用彰眷待後苑華景亭開啓故秦晉國夫人林氏追薦道埸齋文伏以淑懿之賢巳賁追榮之典隂幽之助仍資衆善之因爰即華林載陳法供冀慈仁之廣𬒳均勝利於無窮乘此妙緣超升福果後苑華景亭開啓安土地道埸齋文八月二十二日伏以后皇安靜稟厚德以無疆靈貺冥符惟至誠而有一作交感載嚴淨侣夙按梵儀冀祓滌於百邪俾妥安於庶品為秦晉國永壽聖祐夫人林氏身亡於壽星觀修設九幽道埸青詞生而有盡是謂於物常道本無形實資於冥助虔依仙字載肅淨埸追懿德之巳遙冀明靈之垂祐薦茲勤潔庶逹精誠一無此八字故秦晉國夫人祭文路祭八月二十二日惟靈蔚有令儀著于茂則顧追褒之寵數巳極恩榮念永閟於佳城載深惻怛列茲奠禮用慰營魂故秦晉國夫人祭文夜排敕祭八月二十三日惟靈懿德惟舊嘉問克彰奄然淪逝惻爾追感侑以禮奠庶乎來歆荆南府紫府觀并潭州南嶽真君觀開啓皇帝本命道埸青詞八月二十六日伏以道非常名無方而善應誠之所至有感而必通惟南服之奧區敞清真之靖館因本元之吉日僃科式之多儀延集衆靈仰祈沖鑒冀咸臻於百福期永固於千齡廣聖宫開啓祝聖壽道埸青詞八月二十六日伏以百工休力標禮典以順時衆善延祥紀道家之吉月恭陳祕館式按常科瑶席瓊樽夙陳於芳潔芝華羽葆紛集於真靈伏願錫祉眇躬隆壽齡於無極遂生庶品臻隱伏以咸均論獎諭叔韶奏續添臣伏凖中書劄子下本院為右屯衛大將軍叔韶進祝聖壽歌日月玄樞論奉聖旨令學士院降勑書獎諭竊以叔韶宗室之子好學修辭誠可嘉獎然臣伏見玄字自來公私文字悉皆諱避其叔韶所進日月玄樞論欲暫降付本院略更詳其文理庶於詔辭褒勸之間因而得以訓勵今取進止四月日學士臣歐陽某劄子貼黃所有獎諭勑書未敢修撰乞早降指揮內批其元樞論名以犯諱字因而諷諭使後來所撰益精其文字更不付外只如此降詔施行右至和二年四月奏審叔韶獎諭勑書奏劄後有內批三十四字今真本尚存其勑書在內制第二卷而無此奏按蘇文忠內制集如乞勿免文吕拜禮乞許安樞密辭轉官之類皆以元奏與詔書並載故用此例附卷末內制集卷第二除皇弟允𥘉制作屏一作樹屏賜吳育讓恩命不允批答常歷常當作嘗醴泉觀上梁文裔露裔疑作矞廣聖宫祝聖壽青詞恭陳一作恭臨外制集卷第二歐陽文忠公集八十制五十首內殿承制桑逵可左監門衛將軍致仕制勑具官桑逵夫少也用其力老也優其秩在豫推恩之意固亦仁矣於汝克終之善豈不美哉況爾方置朝行又升環列歸安汝壽服此新命可駕部員外郎致仕席夷甫男汝賢可將作監主簿制勑具官席夷甫男汝賢夫力強一作壯而仕老至而一作則休還其官政于君傳其家事於一作干子士之美一作盡行不亦榮哉在爾承之冝勤以孝惟善事父乃能事君可內殿崇班柴貽坦可內殿承制制勑具官柴貽坦自列朝班克一作久勤官次用有司之常典因滿嵗以一作之當遷往服新恩益思後一作克勤厥效可福州寧德縣令孫知古可太子中舍致仕制勑具官孫知古禮於老者尚不責其筋力而況涖官行法非強而敏者莫能焉士之老而還政者不惟示國之優恩一作禮亦自愛其身者得以遂其安一無此字養也矧加寵命豈不榮哉可前太常寺奉禮郎司馬旦前將作監主簿司馬光前祕書省校書郎黃元規丁憂服闋復舊官制勑司馬旦等先王制禮之中不使賢者過而愚者不及故三年之喪謂之通制者人皆所共一作人皆可以行焉惟立身事君用顯親揚名之節則必賢者勉焉而可至二字一作石可下至此孝之大者也爾其思一作勉之可比部員外郎知眉州馮平轉虞部員外郎太常博士知秀州嘉興縣胡昉轉祕書丞制並磨勘改官勑具官馮平等朕頃因考績之文增以薦材之法夫纍日月以敘進則患賢愚之不分因舉類而觀能則慮奔趨而一作以求譽知人選士其難若此惟材茂而一無此字業廣既久而自彰者不亦優哉爾冝一作惟不懈其勤以求諸巳可東頭供奉官鍾懷德可內殿崇班制勑具官鍾懷德臨于管榷頗服勤勞因兹會課之來冝舉敘遷之例升之朝序勉荷寵章可東頭供奉官夏惟慶可內殿崇班制勑具官夏惟慶爵祿王者所以厲世磨鈍之具非徒為進者積日之資也一作惟字爾考績有司例當遷秩升于朝序可謂寵榮惟材與能在爾自力可進納人空名誥海詞勑某人等官者所以治人而非以假人之器也朕閔西人之勞而欲紓其乏有出其私以佐吾之用者是亦有益于吾民俾命于官所以示勸爾其往矣服我茂恩可三班借職崔瑾可換縣尉制勑具官崔瑾夫器人之材術者無施而一無此字不宜其次用其所長而各盡其善今爾猒夫武吏之不足為而思自擇以奮厥效從爾之請必有可觀可太子中允通判秦州馮誥可太常丞制勑具官馮誥西鄙用師久矣而未見成功然凡從事於兵間者微勞小善未嘗不録而稍為久次已曰滯材夫材者必能集吾事賞者所以圖厥功吾無愛焉以觀汝效可文學李長卿可長史制勑具官李長卿文學長史皆無職事而有秩俸吾設科一無此字以待天下之士而官其才者其不中於有司者猶祿其終身吾於養士之仁至矣汝其知之可著作佐郎張去惑可祕書丞制勑具官張去惑國家設官之法患乎巧偽千譽者之難止故考績之格三載而一例遷所以使沉實守正之人得以自進及其弊也庸人希纍日之賞而賢者不能自别故又增舊法稍欲因舉類而求能者焉惟爾之材世所稱美夫纍日而遷一作進非爾一有所字志干譽而進不可為一有偽字惟思厥中務廣其業可任若拙牛文渥等改官制勑具官任若拙等朕閔夫士有少而執經老不及祿者其勤可嘉不可以棄故皆登一有官字于仕以榮厥躬歲月久焉又增以秩吾之不忘于爾也厚矣往其勉哉可殿中丞通判延州髙良夫可國子博士制勑具官髙良夫邉鄙之事不徒衽金革而當矢石至於撫民人平政賦凡關決于兵一作其間者不亦勞乎惟爾之材久于其事今三載考績而例一有當字進秩乃為常典況爾有勞冝推茂恩以旌能吏可前司門貟外郎樂許國殿中丞路綸李仲宣丁憂服闋復舊官制勑樂許國等夫生事而死祭苴麻哭泣之禮二十七月而後止孝子之服於其親也足矣奉其遺體立身揚名而施于有政孝子之忠於事君也吾欲觀爾之能焉勉膺新恩無怠其志可內殿崇班劉顯可內殿承制制勑具官劉顯以爾習知河事二十餘年既久而勤有勞可録冝增榮秩以示褒嘉無易其官一作守俾終厥效可澤州推官李泰可大理寺丞制勑具官李泰誦習之學患乎專固少通而難施於事爾由學禮以登仕而涖官行法能使薦者稱之為材是亦可嘉冝推寵命可大理寺丞知巨野縣孟皆可太子中舍制勑具官孟皆夫執經之士不徒誦其文而必知其義一縣之政有土與民用爾所通之經求其治人之術苟有善問一作譽豈無褒榮勉服新恩以率爾一作厥職可陳曙李方改官制勑具官陳曙等朕嚮以州縣之間備盜不謹而官吏畏怯擒捕失時雖置于刑以警不職而思得材武之士旌其功伐以廣勸一作勤能爾於兹時以捷來上霈然推賞朕所樂焉服我新恩益勤後效可駙馬都尉柴宗慶可贈中書令制勑具官柴宗慶夫爵祿王者所以賞功懋德之器古之聰明材智之士處乎崇髙猶或顛覆爾以名臣之家為國近戚惟冨與貴享兹兼美乃能守而不一作弗失克保厥終一作終厥身蓋朕思廣孝愛之心務推仁恩之厚而致也夫生而寵之以位則殁也不可不榮其終在乎朕心既所嗟閔考之國典則有彞章魂而有知膺此休命可前觀察支使試大理司直張德熙懷州防禦判官試大理司直倪俊並可檢校水部員外郎制勑具官張德熙等士之在乎一作夫下位其有所稱道者吾無不二字一作乃擢其材而用之其積日纍久而未聞於豫者猶有兼試檢校階勳之次而敘升之所以念勞也況郊祀之禮慶賜所均冝有茂恩以彰寵典可永興軍節度推官董士廉可著作佐郎制勑具官董士廉一有朕觀二字自古竒偉之士因時立功而名在竹帛者率皆不以細文常行責其備蓋於其大者人二字一作以有所不能而能者焉惟爾少而好竒不徇小節喜從兵事思奮其材今積久録一作纍勞蓋從請者若夫異賞待爾有為可潭州録事參軍楊令聞可太子中舍致仕制勑具官楊令聞嚮因疾病自請退休少有間焉復思從政今其決矣可以止哉俾升朝序之榮以為歸老之美可權保安軍判官王溫恭可知延州延水縣制勑具官王溫恭自西鄙用兵而智謀材敏一作勇之士奮然而爭出者非唯吾爵賞是利蓋士之負其能者亦欲因時而有立焉百里之縣有民與土課田而實軍備平政以懷邊一作疲人亦足有為將觀汝效可平陽郡王允升第二十二女趙氏可某縣主制勑王者之以孝治天下也必先仁其九族然後刑于四海故具官允升女趙氏幼而淑美將及有行沐邑之封蓋稽舊典其勤女訓往冝汝一作爾家可入內內侍省內東頭供奉官李允恭可內殿承制一作崇班制勑具官李允恭昨者亡命之卒攻劫京西而吏不能捕煩吾出兵爾一有能字稱我使令克奮厥效録勞第賞冝有及一作且及身焉升爾于朝往膺一作服寵命可真州推官陳則可大理寺丞制勑具官陳則朕撫有萬邦以官多士而材能廉善之迹茍有聞于豫聽者必一無二字皆進而用之而申以二字一作與申賞罰之文懼乎言者之不信今爾之善屢有以聞勉爾之勤克廣其業無使言者干豫之罰可內殿崇班郝質可內殿承制制勑具官郝質夫𬒳甲馳馬出而與敵周旋于原野搴旗斬馘歸而與士卒數俘獲于軍中量功較計蒙褒𬒳寵進而受賞于朝廷此將帥之事也一無此字豈不榮且樂一無二字哉戰之功有大小國之賞有重輕膺此茂恩更期後效可龍衛指揮使开贇拱聖指揮使胡元並可內殿承制制勑具官开贇等朕之徑兵鋭將戍于邊者不可勝數惟爾能以武勇出乎其間方吾思得猛士之時吾之大臣以爾來上髙爵厚祿為爾等而設也往其勉矣吾將觀汝一作覩爾之能可年而能獲還政之名以歸冝推褒恩以寵田里可右侍禁田延昭可右內率府率制勑具官田延昭爾之子況乃吾侍從之臣一作官既不得去吾而從汝而念汝之老思得來歸朕亦嘉汝世陷虜中能識忠義自拔歸國致子顯榮冝有嘉一作加褒以旌美節服兹休命慰子孝心可三司前行胡敏可許州長史制勑胡敏陳力涖事積有歲年自知不能以疾而止俾列州佐以榮厥終可前將作監主簿張盛丁憂服闋復舊官制勑張盛爾幼未任事而巳命于官蓋承其祖父之遺業長而冝思有立以顯其親惟學可以成人爾其勉而無怠可大理寺丞王諄轉左贊善大夫贊善大夫王若谷轉殿中丞著作佐郎李望周輔並轉祕書丞制並磨勘改官勑具官王若谷等庶官之在位者吾不能遍察其常行而一有委之二字有司考第歲月以為進退之法惟治之有聲者五字一作治之有迹善而有聲也吾未嘗遺必有甄擢子聞無壅各勉所為可前漣水軍判官吳知幾可大理寺丞制勑具官吳知幾士之飭躬勵行以勤厥官未有不知於人者知而薦之吾亦無所遺焉惟爾之能數有稱道有司較最於格當升勉膺新恩無廢其業可供備庫副使郭承緒可西京左藏庫副使制勑具官郭承緒夫善訓卒者少而愈精善用兵者寡可擊衆一障之守茍得其人推恩信以恱士心明教習以修武備扞城禦冦其任豈輕顧爾宣勞頗勤歲月今兹考績冝有一作被寵章爾其勉哉思奮厥效可秦州觀察支使喬察可靜難軍節度推官知隴城縣制勑具官喬察夫吏之不能稱一有其字職者或謂數易使之一作之使然今爾嘗佐於一作于州就臨屬縣其上下政令之便否土風民俗之所安皆所習知可以為治將觀汝績無替其勤可吳守一改官制勑具官吳守一夫文士之職有常守而循敘進之科至夫出類之材尚有不次之用況夫武吏有可以奮節立功之資而當兹用武之時其材易施其效易著歲月考課是為常格膺兹新命其往勉哉可沂州沂水縣主簿韓道可大理評事制勑具官韓道自京以東比苦多盜而臨沂狂卒一歲再變汝以主簿領尉職而能力捕首惡上功第二凡真捕賊吏後時而無所獲與夫不獲而坐黜罰者豈不愧於汝哉夫事無不能惟不勉爾以褒以勸一作其勤冝有寵恩可比部貟外郎致仕張緯一作倬男允修可將作監主簿制勑具官張緯男允修凡人之既老且病而見其子之得祿豈不榮哉爾冝一作其修身勵節入而思有以慰一作榮其親出而思有以報於國可杜惟序可西上閣門使福州刺史知涇州一作四方館使涇原鈐轄兼知涇州制勑具官杜惟序西鄙用兵五六歲矣凡是中外文武之吏其材勇而可任者無不柬在於一無此字豫心茍思得人則擇而用惟爾久習戎事勤於北邊素有能稱熟于朕聽涇原重地當賊之衝督視兵師兼撫其俗惟爾為可往其勉哉佩兹新恩以觀厥效可左藏庫使涇原鈐轄王從政可西上閣門使益州鈐轄制勑具官王從政西蜀之人性本輕悍易搖以事動輒驚搔而禦冦扞城兵任尤重夫馭兵之法威主於肅令一則威明恩患乎私信著則恩浹使士卒和而武備謹則軍有善政民無姦心此惟材者能之而爾久習兵戎嘗委邉寄克堪一作膺兹任往服訓詞可大理寺丞王陶轉殿中丞大理寺丞郭佑賢王正已並轉太子中舍制並磨勘改官勑具官王陶等州縣之政其文具矣吏之良者能舉一作學而行之足以為治故夫奉法守職積勞歲月而無過者皆有進秩之資所以褒勸一作勤而勉夫不及也今爾之課考於有司膺兹敘升慎守厥位可試助教郭固可寧州軍事推官制勑具官郭固自邊陲用兵而天下遊談之士趍時蹈利者吾非不知其濫而未始怠焉者冀必有得於其間惟爾之能乃其素學夫學有實者詰之不窮而推之可用嘉汝施設精而有條慮變適冝將觀汝用可東頭供奉官李禹言一作臣可內殿崇班制勑具官李禹言惟爾陳力效職三十餘年而後登于朝序雖命官進秩厥有常法而爾之積勞至此不亦勤哉一作乎夫得之惟艱守之不可不慎往膺明訓服此寵章可禮院副禮直官王永可益州司户參軍充職制勑王永太常所上禮皆祖宗之法朝廷之儀掌在有司爾所當習成書第賞及下不遺往膺新恩慎守而職可太常寺太祝張觀一作覲可大理評事制勑具官張觀有司上爾會課之書考其日時當得敘進夫有勞必録其信不渝惟勤與能不可不勉可故國子博士李克明可贈度支貟外郎制勑國家務以孝治為人子者欲有所申於其父母則其為請不一作豈可不從故具官某有子德隆克嗣其世效官陳力當得敘遷而思以其榮報於罔極合於經之以顯父母之義朕甚嘉之魂而有知膺此追命可外制集卷第二席汝賢張允修可將作監主簿兩可字下一本各有試字鍾懷德制管榷一作榷管樂許國等復舊官制吉綿本以司門為司勳服於其親也足矣作報於其親也足以觀爾一作觀汝孟皆制皆一作階平陽郡王允升女制蓋稽一作蓋循郭固制慮變一作應變外集卷第二歐陽文忠公集五十二古詩二數詩一室曽何掃居間俗慮平二毛經節變青鑑不須驚三復磨圭戒深防悔吝生四愁寧敢擬髙詠且陶情五鼎期君祿無思死必烹六竒還自祕海宇正休兵七日南山霧彪文幸有成八門當鼓翼凌厲指霄程九德方居位皇猷日月明十朋如可問從此卜嘉亨答錢寺丞憶伊川之子問伊川伊川已春色緑芷雜芳浦青溪含白石山阿昔留賞屐齒無遺迹惟有嵓桂花留芳待歸客書懷感事寄梅聖俞相别始一歲幽憂有百端乃知一世中少樂多悲患平聲每憶少年日未知人事艱顛狂無所閡落魄去羇牽三月入洛陽春深花未殘龍門翠鬱鬱伊水清潺潺逢君伊水畔一見已開顔不暇謁大尹相携步香山自兹愜所適便若投山猿幕府足文士相公方好賢希深好風骨迥出風塵間師魯心磊落髙談羲與軒子漸口若訥誦書坐千言彥國善飲酒百盞顔未丹幾道事間逺風流如謝安子聰作參軍常跨破虎韀子野乃秃翁戲弄時脫冠次公才曠竒王霸馳筆端聖俞善吟哦共嘲為閬仙惟豫號逹老醉必如張顛洛陽古郡邑萬户美風煙荒涼見宫闕表裏壯河山相將日無事上馬若鴻翩出門盡垂柳信步即名園嫩籜筠粉暗渌池萍錦翻殘花落酒靣飛絮拂歸鞍尋盡水與竹忽去嵩峯巔青蒼緣萬仞杳藹望三川花草窺澗竇﨑嶇尋石泉君吟倚樹立我醉欹雲眠子聰疑日近謂若手可攀共題三醉石留在八仙壇水雲心巳倦歸坐正杯盤飛瓊始十八妖妙猶雙環疑寒篁暖鳳觜銀甲調鴈絃自製白雲曲始送黃金船珠簾捲明月夜氣如春煙燈花弄粉色酒紅生臉蓮東堂榴花好點綴裙腰鮮插花雲髻上展簟緑隂前樂事不可極酣歌變為歎平聲詔書走東下丞相忽南遷送之伊水頭相顧淚潸潸臘月相公去君隨赴春官送君白馬寺獨入東上門故府誰同在新年獨未還當時作此語聞者已依然雜言答聖俞見寄兼簡東京諸友昔君居洛陽樂事無時有竇府冨文章謝墅從親友豐年政頗簡命駕時為偶不問竹林主仍携步兵酒芬芳一作菲弄嘉月翠緑相森茂聞梅二授德興戲書君家小謝城為客洛陽裏緑髮方少年青衫喜為吏重湖亂山緑歸夢寄千里洛浦見秋鴻江南老芳芷自言北地禽能感南人耳京國本繁華馳逐多英軌爭歌白雪曲取酒西城市朝逢油壁車暮結青驄尾歲月倐可忘行樂方未巳忽爾畏簡書翻然浩歸思江山故國近風物饒陽美楚柚煙中黃吳蓴波上紫還鄉問井邑上堂多慶喜離别古所難更畏秋風起戲贈莫愁家住洛川傍十五纎腰聞四方堂上金樽邀上客門前白馬繫垂楊春風滿城花滿樹落日花光爭粉光城頭行人莫駐馬一曲能令君斷腸寄左軍巡劉判官遙聽洛城鍾獨渡伊川水緑樹鬱參差行人去無巳因髙望京邑驅馬沿山趾落日亂峯多龍門何處是罷官後𥘉還襄城弊居述懷十韻回寄洛中舊寮路盡見家山欣然望吾廬陋巷叩柴扉迎候遙驚呼兒童戲竹馬田里邀籃輿春桑鬱已緑歲事催農夫朝日飛雉雊東臯新雨餘植杖望逺林行歌登故墟夙志在一壑兹焉將荷鋤言謝洛社友因招洛中愚馬卿巳倦客嚴安猶獻書行矣方于役豈能遂歸歟和聖俞聚蚊頽陽照窮巷暑退涼風生夫子臥環堵振衣步前楹愁煙四鄰起鳥雀喧空庭餘景藹欲昏衆蚊復一作聚薨薨群飛豈能數但厭聲營營抱琴不暇撫揮塵無由停散帙復歸卧詠言聊寫情覆載無巨細善惡皆生成朽木出衆蠧腐草為飛螢書魚長隂溼醯雞由鬱蒸豕鬛固多虱牛間常聚虻元氣或一鬱􅠜之為孽腥卑臭乃其類清虛非所經華堂敞髙棟綺疏仍藻扃金釭瑩椒壁玉壷含夜冰終朝事薰祓豈敢近簷甍冨貴非苟得抱節居茅衡隂墻百蟲聚下偃衆穢盈何嘗曲肱樂但苦聚雷聲江南美山水水木正秋明自古佳麗國能助詩人情喧囂不可久片席何時征送劉學士知衡州楊子懶屬書平居惟嗜酒一沐或彌旬解酲須五斗淡爾輕榮利何常問無有忍憶四一作回馬歸行為一麾守湘酎自古醇醽水聞名久簿領但盈几聖經不離口湖田賦稻蟹民訟爭壠畒兀爾即沈冥安能知可否聊為寄情樂豈與素懷偶藏器思適時投刃寧煩手行當考官績勿復困罌缶送張屯田歸洛歌昔年洛浦見花落曽作悲歌歌落化愁來欲遣何可奈時向金河尋杜家杜家花雖非絶品猶可開顔為之飲少年意氣易成歡醉不還家伴花寢一來京國兩傷春憔悴窮愁九陌塵紅房紫莟處處有騎馬欲尋無故人黃河三月入隋河河水多時悵望多為憐此水來何處二字一作處逺中有伊流與洛波忽聞君至自西京洗眼相看眼暫明心衰靣老畏人問驚我廋骨清如冰今年七月妹喪夫稚兒孀女啼􅈱􅈱季秋九月豫喪婦十月厭厭成病軀端居移病新城下日不出門無過者獨行時欲強髙歌一曲未終雙涕灑可憐明月與春風歲歲年年事不同暫别已嗟非舊態再來應是作衰翁感時惜别情無巳無酒送君空有淚西歸必有問君人為道别來今若此述懷送張惣之鬱鬱河堤緑樹平送君因得到東城落花已盡鶯猶囀垂柳𥘉長蟬欲鳴去年送客亦曽到正值楊花亂芳草人心不復故時歡景物自隨時節好感今懷昔復傷離一别相逢知幾時莫辭今日一樽酒明日思君難重持東吳山水天下秀羡君輕舟片帆逗江城月下夜聞歌淮浦山前朝放溜樂哉此行時未晚萬壑千巖不知逺可憐病客猒京塵寂寞淹留巳再春扁舟待得東南下猶更河橋送幾人送子野四時慘舒不可調冬夏寒暑易鬱陶春陽著物大軟媚獨有秋節最徑豪金方堅剛屏炎瘴兊氣髙爽清風飈煙霞破散灝氣豁山河震發地脈搖天開寶鑑露寒月海拍積雪卷怒潮光輝通透奪星耀蟠潛驚奮鬪蜃蛟髙樓精爽毛髮竦壯懷直恐衝斗杓欲飛輕衣上拂漢擬乘王氣戲鷺濤念時文法密於織羈縻束縛不自聊豈無䇿議獻人主扼持舌在口巳膠當秋且幸際軒豁誰能兒女聽螳蜩君方壯歲襟宇快名聲樂與家聲髙輕舟從遊山川底詩酒合興皆翹翹堪嗟宋玉自悲攪可並張翰同逍遙功名冨貴有時到忍把壯節良辰消送劉十三南遊決決汴河流櫓聲過晚浦行客問吳山舟人多楚語春深紫蘭澤夏早黃梅雨時應賦登眺聊以忘羇旅與李獻臣宋子京春集東園得節字緑野秀可餐遊驂喜𥘉結藝局苦寂寥禁署隔清切歡言得幽尋况此及嘉節鳥哢已關關泉流𥘉決決紫蕚繁若綴翠苕柔可擷屢期無後時芳物畏鶗鴂晚泊嶽陽卧聞嶽陽城裏鍾繫舟嶽陽城下樹正見空江明月來雲水蒼茫失江路夜深江月弄清輝水上人歌月下歸一闋聲長聽不盡輕舟短楫去如飛新開棊軒呈元珍表臣竹樹日巳滋軒窗漸幽興人間與世逺鳥語知境靜春光藹欲布山色寒尚映獨收萬慮心於此一枰競代贈田文𥘉感君一顧重千金贈君白璧為妾心舟中繡𬒳薰香夜春雪江頭三尺深西陵長官頭已白憔悴窮愁一作顔愧相識手持玉斝唱陽春江上梅花落如積津亭送别君未悲夢闌酒解始相思須知巫峽聞猿處不似荆江夜雪時惠泉亭一木序云某啓伏覩知軍學士丈丈新理惠泉謹為拙詩十六句伏惟來覽翠壁刻孱顔煙霞跬步間使君能愛客朝夕弄山泉春巖雨過春流長置酒來聽山溜響鑑中樓閣俯清池雪裏峯巒開曉幌須知清興無時已酒美賔嘉自相對席間誰伴謝公吟日暮多逢山簡醉淹留桂樹幾經春野鳥巖花識使君使君今是樽前客誰與山泉作主人過張至祕校莊田家何所樂籉笠日相親桑條起蠶事菖葉候耕辰望歲占風色寬徭知政仁樵漁逐晚浦雞犬隔前村泉溜塍間動山田樹杪分鳥聲梅店雨野色栁橋春有客問行路呼童驚候門焚魚酌白醴但坐且歡欣行次葉縣朝渡汝河流暮宿楚山曲城隂日下寒野氣春深緑征車倦長道故國有喬木行行漸樂郊東風滿平陸將至淮安馬上早行學謝靈運體六韻晴霞煦東浦驚鳥動煙林曙河兼斗沒沓一作杳嶂隱雲深寒雞隔樹起曲塢留風吟征夫倦行役秋興感登臨衡一作蘅臯積塗一作滁迥江蘺香露沉行矣歲華晚歸歟勞歎音自𡵨一作枝江山行至平陸驛五言二十四韻岐江望平陸百里千餘嶺蕭條斷煙火莽蒼無人境峯巒氐前後南北失壬丙天秋雲愈髙木落歲方冷水涉愁蜮射含沙也林行憂虎猛萬仞懸巖崖一彴履枯梗緣危類猿猱陷淖若蛙黽腰輿懼傾撲煩馬倦鞭警攀躋誠畏塗習俗羡蠻獷度隘足雖踠因髙目還騁九野畫荆衡群山亂巫郢煙嵐互明滅點綴成一作若圖屏時時度深谷往往得佳景翠樹鬱如蓋飛泉溜垂綆幽花亂黃紫蒨粲弄光影山鳥囀成歌寒蜩嘒如哽登臨雖云勞一作廣巨細得周省晨裝趂徒旅夕宿訪閭井村暗水茫茫雞鳴星耿耿登髙近佳節歸思時引領溪菊薦山樽田鴽佑烹鼎家近夢先歸夜寒衾屢整﨑嶇念行役昔宿已為永豈如江上舟棹歌方酩酊𥘉泛舟荆江棋酒甚歡故有此句春日西湖寄謝法曹歌西湖春色歸春水緑於染群芳爛不收東風落如糝西湖者許昌勝地也參軍春思亂如雲白髮題詩愁送春謝君有多情未老巳白髮野思到春如亂雲之句遙知湖上一樽酒能憶天涯萬里人萬里思春尚有情忽逢春至客心驚雪消門外千山緑花發江邊二月晴少年把酒逢春色今日逢春頭已白異鄉物態與人殊惟有東風舊相識答謝景山遺古瓦硯歌火數四百炎靈銷誰其代者當塗髙窮姦極酷不易取始知文景基扃牢坐揮長喙啄天下豪傑競起如蝟毛董吕傕汜相繼死紹術權備爭咆咻力強者勝怯者敗豈較才德為功勞然猶到手不敢取而使螟蝗生蝮蜪子丕當𥘉不自耻敢謂舜禹傳之堯得之以此失亦此誰知三馬食一槽當其盛時爭意氣叱吒靁雹生風飈干戈戰罷數功閥周蔑方召堯無臯英雄致酒奉髙會巍然銅雀髙岧岧圎歌宛轉激清徴妙舞左右回纎腰一朝西陵一作西朝或作兩朝看拱木寂寞繐帳空蕭蕭當時淒涼已可歎而況後世悲前朝髙臺已傾漸平地此瓦一墜埋蓬蒿苔文半滅荒土蝕戰血曽經野火燒敗皮弊網各有用誰使鐫鑱成凸凹景山筆力若牛弩句遒語老能揮毫嗟豫奪得何所用簿領朱墨徒紛淆走官南北未嘗捨緹襲三四勤緘包有時屬思欲飛灑意緒軋軋難抽繅舟行屢備一作𬒳水神奪往往冥晦遭風濤質頑物久有精怪常恐變化成靈妖名都所至必傳玩愛之不換魯寶刀長歌送我怪且偉欲報慙愧無瓊瑶古瓦硯甎瓦賤微物得厠筆墨間於物用有冝不計醜與妍金非不為寶玉豈不為堅用之以發墨不及瓦礫頑乃知物雖一作微賤當用價難攀豈惟瓦礫爾用人從古難一作然新營小齋鑿地爐輒成五言三十七韻霜降百工休居者皆入室墐户畏𥘉寒開爐代溫律規模不盈丈廣狹足容膝軒窗共幽窳竹柏助蒙密辛勤慚巧宦窮賤守卑秩無術政奚為有年秋屢實文書少期會租訟省鞭抶地僻與世踈官間得身佚荆蠻苦卑陋氣候常一鬱天日每隂翳風飈多凛溧衰顔慘時晚病骨知寒疾蠻牀倦晨興籃輿厭朝出南山近樵採僮僕免呵叱禦歲畜蹲鴟饋客薦包橘霜薪吹晶熒石鼎沸啾唧披方養丹砂候節煎去聲秋术西鄰有髙士轗軻卧蓬蓽鶴髮善髙談鮐背便平聲炙尉披裘屢相就束緼亦時乞傳經伏生老愛酒楊雄吃晨灰暖餘杯夜火爆山栗無言兩忘形相對或終日微生慕剛毅徑強去聲早難屈自從世俗牽常恐天性失仰兹微官祿養此多病質省躬由一言無枉慕三黜因知吏隱樂漸使欲心窒靣壁或僧禪倒冠聊酒逸螟􅘾輕二豪一馬齊萬物啓期為樂三叔夜不堪七負薪幸有一作自瘳舊學頗思𫐠興亡閲今右一作古今圖籍羅甲乙魯册謹會盟周公彖凶吉詳或作鮮明左丘辨馳騁馬遷筆金石互鏗鍧風雲生倐忽豁爾一開卷慨然時掩帙浮沈恣其間適若遂聱耴一作邀佚吾居誰云陋所得乃非一五斗豈須慚優遊歲將畢外集卷第二送劉學士知衡州何常常疑是嘗述懷復傷離復一作更寄謝法曹思春一作思君古瓦硯歌致酒疑是置酒新營小齋詳明衆本皆作鮮明唯薛齊誼編年引此詩作詳明奏議卷第二歐陽文忠公集九十八諌院論沂州軍賊王倫事冝劄子慶曆三年臣近聞沂州軍賊王倫等殺却忠佐朱進打劫沂密海楊泗楚等州邀呼官吏公取器甲橫行淮海如履無人比至髙郵軍已及二三百人皆靣刺天降聖捷指揮字號其王倫仍衣黃衫據其所為豈是常賊驟聞可駭深思可憂臣竊見自古國家禍亂皆因兵革先興而盜賊繼起遂至橫流後漢隋唐之事可以為鑒國家自𥘉兵興必知須有盜賊便合先事為備而謀國之臣昧於先見致近年盜賊縱橫不能撲滅未形之事雖或有所不及已兆之患豈可因循不為臣遍思天下州軍無一處有備假令王倫等周遊江海之上驅集罪人徒衆漸多南越閩廣而斷大嶺西走巴峽以窺兩蜀所在空然誰能禦之一作制禦若不多為方略竊恐未可剪除而朝廷之臣尚若常事不過差一兩人使臣領兵捕捉此外更無處置竊以去患冝速防禍在微伏望陛下深懼禍端督責宰輔早為擘畫速務剪除臣亦有短見數事謹具條列以禆萬一一乞訪尋𬒳殺朱進或有兒男便與一官令其捕賊以復父讎仍許令乘驛隨逐一作處指射兵士隨行一竊知王倫在沂密間只有四五十人及至髙郵已二三百人皆是平民𬒳其驅脅欲乞除軍賊不赦外特赦驅脅之人先與安慰其家各令家人以書招諭有能殺軍賊脫身自歸者等第重與酬賞可使自相疑二壞散凶徒一竊慮江淮諸處先有賊盜漸與王倫合勢則凶徒轉熾卒難剪滅欲乞指揮募諸處未獲盜賊有能謀殺軍賊者亦等第重行酬獎可使賊心自疑徒黨難集一乞出榜招募諸處下第舉人及山林隱士負犯流落之人有能以身入賊算殺首領及設計誤賊陷於可敗之地者重與酬獎所貴凶黨懷疑不肯招延無賴之人以為謀主一竊見朝廷雖差使臣領兵追捕而凶賊已遍劫江淮深慮趕趂一作追趕不及徒黨漸多欲乞特差中使馳騎先計會沿江淮諸路州軍會合巡檢縣尉預先等截續發禁兵隨後追逐所貴不至走透右臣所陳五事伏乞詳擇施行外有先𬒳王倫脅從人等首身者百餘人其中有當與酬賞及合行分配者乞早賜施行用安反側謹具狀奏聞論王舉正范仲淹等劄子慶曆三年臣伏見朝廷擢用韓琦范仲淹為樞密副使萬口歡呼皆謂陛下得人矣然韓琦稟性忠鯁遇事不避若在樞府必能舉職不須更藉仲淹如仲淹者素有大材天下之人皆許其有宰輔之業外議皆謂在朝之臣忌仲淹材名者甚衆陛下既能不惑衆説出於獨斷而用之是深知其可用矣可惜不令一有居字大用蓋樞府只掌兵戎中書乃是天下根本萬事無不總治伏望陛下且令韓琦佐樞府移仲淹於中書使得參預大政況今參知政事王舉正最號不才久居柄用柔懦不能曉事緘默無所建明且可罷之以避賢路或未欲罷亦可且令與仲淹對換當今四方多事二虜交侵正是急於用人之際凡不堪大用者去之乃叶天下公論不必待其作過亦不須俟其自退也況若令與仲淹對換則於舉正不離兩府全無所損伏望陛下思國家安危大計不必顧惜不材之人使妨占賢路如允臣所請即乞留中特出聖斷指揮或尚未欲施行即乞降付中書令舉正自量材業優劣何如仲淹若實不如即須自求引避以副中外公議取進止論趙振不可將兵劄子同前臣風聞河東近日纍奏事冝探得昊賊點集兵馬伏緣昨來張延壽議和之際尚有朝廷未許事節深慮狂賊因忿出兵即三路邊防皆合設備伏見河東都部署明鎬雖是材臣未諳戰陳副部署趙振人品庸劣全不知兵只是好交結沽買聲譽所以不因功業擢至將帥前在延州遂致敗誤雖行責降不及期年却授兵權全無報效其人少壯尚不堪用今又年老病患全然不堪戰鬪一旦臨事必誤國家臣聞將者國之司命今陛下安危之機繫於將帥而河東一路無一戰將只有趙振老病一人而已細思此事大可寒心苟有誤事憂在朝廷其趙振伏乞速下本路體量如或實老病不任即乞罷歸散秩别委將臣竊以河東一路兵馬極多豈是蓄養病將之處西北二虜為患如此亦非趙振可當若使臨事敗誤悔恐不及伏望聖慈深思大計無惜一老病敗事之人取進止再論王倫事冝劄子同前臣竊見近日四方盜賊漸多凶鋒漸熾撲滅漸難皆由國家素無禦備官吏不畏賞罰臣謂夷狄者皮膚之患尚可治盜賊者腹心之疾深可憂而朝廷弛緩終未留意每遇有一火賊則臨事驚駭倉皇旋發兵馬終不思經久禦賊之計只如王倫者今若幸而剪撲則其殺害人民為患巳廣如更未能剪撲使其據城邑則患禍不細矣臣數日前巳有奏論只是條列招捉王倫一火事冝至如池州解州南京鄧州諸處強賊甚多今後亦須禁絶其端不可更令頻有臣欲乞陛下特勑兩府大臣議定經制臣亦有短見數事備列如後一臣竊見一作知王倫所過楚泰等州知縣縣尉巡檢等並不鬪敵却赴王倫茶酒致𬒳奪却衣甲蓋由法令不峻無所畏稟官吏見一作知朝廷寬仁必不深罪而賊黨凶虐時下可懼寧是畏賊不畏朝法臣今欲乞凡王倫所過州縣奪却衣甲處官吏並與追官勒停其巡檢仍先除名令白身從軍自效俟賊破日却議敘用仍今後用此為例一外處知州本號郡將都監監押只管在城巡檢若賊入城不能擒捕則設之何用臣欲乞應有不能禦備致賊人入城打劫不尋時鬪敵致全火走透者知州亦特勒停都監監押除名白身從軍自效能獲賊則議敘用一臣見諸處有賊多是自京師别差使臣兵馬捉殺則本地分元置都監巡檢縣尉等設之何用每有􅞫小賊盜不獲又無深責稍似強賊則别差人捉殺如此可以推避因循臣欲乞若朝廷别差人捉獲則本地分巡檢縣尉仍坐全不獲賊之罪及從𥘉不切收輔致走透他處及潰散後别地分巡檢縣尉捉獲者元出賊處官吏不得與破全火批書一竊見諸處縣尉多是新及第少年儒生怯懦往往不能捉賊虛令陷罪臣今欲乞下銓司詳議選擇縣尉之格以武勇人材堪充者充仍重定賞罰之法其一作若見今有新及第少年怯懦者委諸路按察使先次舉奏替換一臣竊見自來所差巡檢兵士多不能捕賊反與州縣為患臣今欲乞自朝廷選募使臣令使臣自選募兵卒不拘廂禁軍令所在州軍指名抽射仍重立賞罰之法論蘇紳姦邪不冝侍從劄子同前臣昨日竊聞勑除太常博士馬端為監察御史中外聞之莫不驚駭端為性險巧本非正人往年常發其母隂事母坐杖脊端為人子不能以禮法防其家陷其母於過惡又不能容隱使毋𬒳刑理合蒙羞負恨終身不齒官聮豈可更為天子法官臣不知朝廷何故如此用人縱使天下全無好人亦當虛此一位不可使端居之況剛明方正之士不少臣求其故蓋是從𥘉不合令蘇紳舉人紳之姦邪天下共惡視正人端士一作端人正上如仇讎惟與小人氣類相合冝其所舉如此也端之醜惡人誰不知而紳一作輒敢欺罔朝廷者獨謂陛下不知耳此一事尚敢欺罔一作惑人主其餘讒毀忠良以是為非之説其可信乎其馬端伏乞追寢成命蘇紳受詔舉此醜惡之人罔上欺下亦乞坐此黜外任不可更令為人主侍從取進止論乞令百官議事劄子同前臣伏見祖宗時猶用漢唐之法凡有軍國大事及大一作不決刑獄皆集百官參議蓋聖人慎於臨事不敢專任獨見欲採天下公論擇其所長以助不逮之意也方今朝廷議事之體與祖宗之意相背每有大事祕不使人知之惟小事可以自決者却送兩制定議兩制知非急務故忽略拖延動經年歲其中時有一兩事體大者亦與小事一例忽之至於大事祕而不宣此尤不便當處事之始雖侍從之列一作例皆不與聞已行之後事須彰布縱有乖誤却欲論列則追之不及況外廷百官踈逺者雖欲有言陛下豈得而用哉所以兵興數年西北二方纍有事冝處置多繆者皆由大臣自無謀慮而杜塞衆見也臣今欲乞凡有軍國大事度外廷須知而不可祕密者如北虜去年有請合從與不合從西戎今歲求和當許與不當許凡知此事之類皆下百官廷議隨其所見同異各令署狀而陛下擇其長者而行之不惟慎重大事廣採衆見兼又於庶官寒賤踈逺人中時因議論可見其髙材敏識者國家得以用之若百官都無所長則自用廟堂之議至於小事並乞只令兩府自定其錢穀合要見本末則召三司官吏至兩府討尋供析而使大臣自擇至於禮法亦可召禮官法官詢問如此則事之大小各得其體如允臣所請且乞將西戎請和一事先集百官廷議取進止論諫院冝知外事劄子同前臣竊聞近日為軍賊王倫事江淮州軍頻有奏報朝廷不欲人知召進奏官等於樞密院責狀不令漏泄指揮甚嚴不知此事出於聖旨或只是兩府大臣意欲如此以臣料之為近日言賊事者多朝廷欲人不知以塞言路耳臣謂方今多事之際雖有獨見之明尚須博採善謀以求衆助豈可聾瞽羣聽杜塞人口況朝廷處事未必盡能合冝臣下獻忠未必全無可採至如王倫驅殺士民攻劫州縣江淮之上千里驚搔事已若斯何由掩蓋當今列辟之士極有憂國之人欲為人主獻言常患聞事不的況臺諫之官尤一作元是本職凡有論列貴在事𥘉善則開端惡則杜漸言於未發庶易回改今事無大小常患後時或號令巳行或事迹已布縱欲論救多不能及若更祕密不使聞知則言事之臣何由獻説臣今欲乞指揮進奏院凡有事非實封者不須祕密臣因此更有起請事件畫一如後一竊見御史臺見有進奏官逐日專供報狀欲乞依御史臺例選差進奏官一人凡有外方奏事及朝廷詔令除改並限當日內報諫院一竊見唐制諫臣為供奉之官常在天子仗內朝廷密議皆得聞之今雖未曽恢復舊制欲乞凡遇朝廷有大處置四方奏報事非常程及諫官風聞事未得實者並許詣兩府請問庶知審實得以論列右件二事如允臣所請乞降指揮施行取進止論河北守備事冝劄子同前臣伏見朝廷方遣使與西賊議通和之約近日竊聞邊臣頻得北界文字來問西夏約和了與未了苟實如此事深可憂臣以謂天下之患不在西戎而在北虜縱使無此文字終須貽患朝廷契丹通好僅四十年無有纎介之隙而輒萌姦計妄有請求竊以戎狄貪婪性同犬彘遇強則伏見弱便欺見我無謀動皆屈就謂我為弱知我可一作易欺故添以金繒未滿其志更邀名分抑使必從無事而來尚猶如此若更因西事攬以為功别有過求將何塞請此天下之人無愚與智共為朝廷寒心者也今若果有文字來督通和之事則臣謂醜虜狂計其迹已萌不和則詰我違言既和則論功責報不出年歲恐須動作茍難曲就必至交兵至於選將練師既難卒辦禦戎制勝當在機先一有然字臣竊怪在朝之臣尚偷安靜自河以北絶無處置因循弛慢誰復挂心豈可待虜使在廷冦兵壓境然後計無所出空務張皇而巳哉今國家必謂兩意雖乖尚牽盟誓邊防處置夫敢張皇以臣思之莫若精選材臣付與邊郡使其各圖禦備密務修完此最為得也況今邊防處置百事乖方惟有擇人最為首務今北邊要害州軍不過十有餘處於文武臣寮中選擇十餘人不為難得各以一州付之使其各得便冝如理家事完城壘訓兵戎習山川蓄糧食凡百自辦不煩朝廷經度以兹預備尚可枝梧至如鎮定一路最為要害張存昔在延州以不了事罷去今乃委以鎮府王克基凡庸輕巧非將臣之材而任定州其餘州郡多匪其人臣欲乞陛下特詔兩府大臣取見在邊郡守臣可以禦敵捍城訓兵待戰者留之其餘中常之材不堪邊任者悉行換易若一有使字秋風漸徑虜釁一作隙有端陛下試思邊鄙之臣誰堪力戰朝廷之將誰可出師當臣𥘉十諫職之時見朝廷進退大臣陛下鋭意求治必謂群臣自此震懾百事自此修舉西北二事最為大者自當處置不徒人言及就職以來已數十日而政令之出漸循舊弊惟言事之臣拾遺輔闕者勉強施行其一二至如講大利害正大紀綱外制四夷內紓百姓凡廟堂帷幄之謀未有一事施行於外者臣忝司諫諍豈敢不言伏望陛下不忘社稷之深耻無使夷狄之交侵駿發天威督勵臣下仍一作伏乞詢問兩府大臣西鄙和與不和能保契丹别無辭説否苟有所説能以廟謀竒算沮止之否苟無謀以止之則練兵選將備邊待冦賊至而後圖能不敗事否臣願陛下勿謂去歲六符之來可以賄解今而有請則事難從矣勿謂纍年西賊為患習以為常若此事一動則天下搖矣臣所言者社稷之大計也願陛下留意而行之取進止論軍中選將劄子同前臣伏見國家自西鄙用兵纍經敗失京師徑卒多在征行禁衛諸軍全然寡少又無將帥以備爪牙方今為國計者但務外憂夷狄專意邊陲殊不思根本內虛朝廷勢弱萬一有事一作事有萬一無以枝梧今軍帥暗懦非其人禁兵驕惰不可用此朝廷自以為患不待臣言而可知也臣亦歷考前世有國之君多於無事之際恃安忘危備患不謹使禍起倉卒而至敗亡者有矣然未有於用兵之時而反志武備如今日者兵法曰將者民之司命國家安危之主也今外以李昭亮王克基輩當契丹內以曹琮李用和等衛天子如當今之事勢而以民之司命國之安危繫此數人安得不取笑四夷遭其輕侮臣謂去歲北虜忽興狂悖今年元昊妄有請求若使朝廷有一二人中材之將叩頭效死奮身請戰誓雪君耻少增國威則戎狄未敢侵陵朝廷未至屈辱奈何自中及外都無一人既無可恃以力爭遂至甘心於自弱夫天下至廣遂無一人者非真無人也但求之不勤不至耳臣伏思自用兵以來朝廷求將之法不過命近臣舉朝士煥武官及選試班行方略等人而巳近臣所舉不過俗吏材幹之士班行所選乃是弓馬一夫之勇至於方略之人尤為乖濫試中者僅堪借職縣尉參軍齋挽而已於此求將而欲捍當今之患此所以困天下而敗於一作取侮夷狄者也臣不知朝廷以此數事為求將之術果是乎果非乎以為是則所得何人知其非則盍思改革又不知朝廷以將為易得乎為難得乎為易得則數歲未見一人知其難得則當多方用意早思求擇俟其臨患何可得乎伏望陛下特詔兩府大臣别議求將之法盡去循常之格以求非常之人苟非不次以用人難弭當今之大患臣亦嘗有愚見久欲條陳若必講求庶可參用臣伏見唐及五代至乎國朝征伐四方立功行陳其間名將多出軍卒只如西鄙用兵以來武將稍可稱者往往出於軍中臣故謂只於軍中自可求將試略言求將之法謹條如左凡求將之法先取近下禁軍至廂軍中年少有力者不拘等級一作仗因其伎同者每百人團為一隊而教之較其伎精而最勇者百人之中必有一人矣得之以為隊將此一人伎勇實能服其百人矣以為百人之將可也合十隊將而又教之較其伎精而最勇者十人之中必有一人矣得之以為禆將此一人之伎勇實能服其千人矣以為千人之將可也合十禆將而又教之夫伎勇出千人之上而雞為勝矣則當擇一作較其有識見知變通者十人之中必有一人矣得之以為大將此一人之伎勇乃萬人之選而又粗知變通因擇智謀之佐以輔之以為萬人之將可也幸而有伎勇不足而材識出乎萬人之外者此不世之竒將非常格之所求也臣所謂只於軍中自可求將者此也誠能如此得五七萬兵隨而又得萬人之將五七人下至千人百人之將皆自足然後别立軍名而為階級之制每萬人為一軍以備宿衛有事則行師出征無事則坐威天下比夫以豐衣厚祿飬驕惰無用之卒而遞遷次輔至于校帥皆是凡愚暗懦之人得失相萬矣若臣之説果可施行俟成一軍則代舊禁兵萬人散出之使就食于外新置之兵便制其始稍增舊給不一作勿使太優常役其力不令驕惰比及新兵成立舊兵出盡則京師減冗費得精兵此之為利又逺矣右臣所陳只是選勇將訓衛兵之一法耳如捍邊破賊竒才異略之人不可謂無伏乞早賜留意精求謹具奏聞伏候勑旨奏議卷第二再論王倫事冝劄子仍先先一作乞論諫院冝知外事劄子雖未曽曾一作能論河北守備事冝劄子約和此下一有之事二字若更因一作若使更因駿發一作峻發論軍中選將劄子為易得為字上疑脫一字居士集卷第二歐陽文忠公集二古詩二十首送楊闢秀才吾竒曽生者始得之太學𥘉謂獨軒然百鳥而一鶚既又得楊生群獸出麟角乃知天下才所識慚未博楊生𥘉誰師仁義而禮樂天姿朴且茂美不待追琢始來讀其文如渴飲醴一作湩酪既坐即之談稍稍吐鋒鍔非唯冨春秋固已厚天爵有司選群材繩墨困量度胡為謹毫分而使遺磊落至寶異常珍夜光驚把握駭者棄諸塗竊拾充吾橐其於獲二生厥價玉一玨嗟吾雖得之氣力獨何弱帝閽啓巖巖一作嚴嚴欲獻前復却遽令扁舟下飄若吹霜籜世好競辛鹹古味殊淡泊一作薄否泰理有時惟窮見其確送孔生一本生作監薄再遊河北志士惜白日髙車無停輪孔生東魯儒年少勇且仁大軸獻理匭長𥚑弊街塵門無黃金聘家有白髮親寒風八九月北渡大河津玉塞積精甲金戈耀秋雲孔生力數斗其智兼千人短褐不自暖髙談吐陽春北州多賢侯待一作得七誰最勤一見贈雙璧再見延上賔丈夫患不遇豈患長賤貧送慧勤歸餘杭越俗僭宫室傾資事雕牆佛屋尤其侈耽耽擬侯王文彩瑩丹漆四壁金焜煌上懸百寶蓋宴坐以方牀胡為棄不居棲身客京坊辛勤營一室有一作乃類燕巢梁南方精飲食菌一作箘笋鄙羔羊飯以玉粒粳調之甘露漿一饌費千金百品羅成行晨興未飯僧日􅉴不敢嘗乃兹隨北客枯粟充飢腸東南地秀絶山水澄清一作鮮光餘杭幾萬家日夕焚清香煙霏四面起雲霧雜芬芳豈如車馬塵鬢髮染成霜三者孰苦樂子奚一作兮勤四方乃云慕仁義奔走不自遑始知仁義力可以治膏肓有志誠可樂一作嘉及時冝自強人情重懷土飛鳥思故鄉夜枕聞北鴈歸心逐南檣歸兮能來否送子以短章讀張李二生文贈一本作謝張續李常寄石先生先生石介也先生二十年東魯能使魯人皆好學其間張續與李常剖琢珉石一作如剖珉石一作如剖衆石得天璞大圭雖不假雕瑑一作鐫但未磨礲出圭角二生固是天下寶豈與先生私禇橐先生示我何矜誇手携文編謂新作得之數日未暇讀意欲百事先一作前屏却夜歸獨坐南窗下寒燭青熒如熠爚病眸昏澀乍開緘燦若月一作日星明錯落辭嚴意正質非俚一作髙且簡古味雖淡醇不薄千年佛老一作老佛賊中國禍福依憑群黨惡拔根掘窟期必盡有勇無前力何犖乃知二子果可用非獨詞一作特言堅由志確朝廷清明天子聖陽德彚進羣隂剝大烹飬賢有列一作味别鼎豈久師門共藜藿一本有先生在魯魯皆化苟用於朝其利博兩句又一本在作居朝作時豫一作我慚職諫未能薦有酒且慰先生酌絳守居園池一本上有留題字嘗聞紹述絳守居偶來覽登一作登覽周四隅異哉樊子怪可吁心欲獨出無古𥘉窮荒搜幽入有無一作無有一語詰曲百盤紆孰云已出不剽襲句斷欲學盤庚書一本有方言爾雅不訓詁幾欲舌譯從象胥兩句荒煙古木蔚遺墟我來嗟秖一作止得其餘柏槐端莊偉丈夫蒼顔鬱鬱老不枯靚容新麗一一何姝清池翠蓋擁紅蕖胡鬅虎搏豈足道記録細碎何區區虙氏八卦畫河圖禹湯臯虺一作陶暨唐虞豈不古奧萬世模嫉世姣巧一作好習卑汙以竒矯薄駭羣愚用此猶得追韓徒我思其人為躊躇作詩聊謔為坐娛晉祠一本作過并州晉祠泉古一作故城南出十里間鳴渠夾路一作石渠夾道何潺潺行羣峯擁軒檻竹樹隂漠漠公胡苦思山規􅌟自心作惟豫一作豫亦愛山者𥘉仕即京洛嵩峯三十六終日對髙閣隂晴無朝暮紫氣常浮泊雄然九州中氣象壓寥廓亦嘗步其巔培塿視一作觀四嶽其後竄荆蠻始識峽山惡長江㵼天來巨石忽開拓始疑茫昧𥘉渾沌死鐫鑿神功夜催就萬仞成一作或一削尤竒十二峯隱見入冥邈人蹤斷攀緣異物冝所託顧瞻但徘徊想像逢綽約嵩山近可愛泉石吾巳諾終期友幽人白首老雲壑荆巫惜遐荒詭怪杳難貌至今清夜思魂夢輒飛愕偶來玩兹亭塵眼刮昏膜况逢秋雨霽濃翠新染濯峯端上明月且可留幽酌水谷夜行寄子美聖俞一本題上有輔成字寒一作晨雞號荒林山壁月倒挂披衣起視夜攬轡念行一作遐邁我來夏云𥘉素節今巳屆髙河㵼長空勢落九州外微風動涼襟曉氣清餘睡一作色清餘曖緬懷京師友文一作有酒邈一作邀髙會其間蘇與梅二子可畏愛篇章冨縱橫聲價相磨一作摩蓋子美氣尤雄萬竅號一噫有時肆顛狂醉墨灑雱霈譬一作勢如千里馬一作足巳發不可殺盈前盡珠璣一一難柬汰梅翁事清切石齒漱寒瀨作詩三十年視我猶後一作後猶無輩文詞愈清新心意雖一作難老大譬如妖韶女老自有餘態近詩尤古硬一作淡咀嚼苦難嘬𥘉如食橄欖真味久愈在蘇豪以氣轢一作礫舉世徒一作盡驚駭梅窮獨我知一作我獨竒古貨今難賣一作物今誰買二子雙鳯凰百鳥之嘉瑞雲煙一翺翔羽翮一摧鎩安得相從遊終日鳴噦噦問胡一作相問苦思之對酒把一作把酒對新蟹病中代書奉寄聖俞二十五兄一本無奉及下四字憶君去年來自越值我傳車催去闕是時新秋蟹正肥恨不一醉與君别今年得疾一作别病因酒作一春不飲氣彌劣飢腸未慣飽甘脆一作平生乍得飽甘肥九蟲寸白一作腹蟲不慣爭為孽一飽猶能致身患寵祿豈無神所罰乃知賦豫分有涯適分自然無夭閼昔在洛陽年少時春思每先花亂發萌芽不待楊柳動探春馬蹄常踏雪到今年才三十九怕見新花羞白髮顔侵塞下風霜色病過鎮陽桃李月兵間事簡居可樂心意自衰非屑屑日長天暖惟欲睡一作眠睡美尤猒春鳩聒北潭去城無百步渌水氷銷魚撥刺經時曽未著腳到好景但聽遊人説官榮雖厚世味薄始信衣纓乃羈紲故人有幾獨思君安得見君憂暫豁公厨酒美逺莫致念君貰一作慣飲衣屢脫郭生書來猶未到想見新詩甚飢渴少年事事今巳去惟有愛詩心未歇君間可能為我作莫辭自書藤紙滑少低筆力容一作留我和無使難追韻髙絶鎮陽殘杏一本有寄聖俞字鎮陽二月春苦寒東風力弱冰雪頑北潭跬步病不到即常山宫後池也州之勝遊惟此何暇騎馬尋郊原雕一作雕丘新晴暖巳動砌下流水來潺潺雕丘水在州西十五里以長渠引走城中但聞簷間鳥語變不覺桃杏開巳闌人生一世浪自苦盛衰桃杏開落間西亭昨日偶獨到一作往猶有一樹當南軒殘芳爛漫看更好皓若春雪團枝繁無風巳恐自零落長條可愛不可攀猶堪携酒醉其下誰肯伴我頽巾冠班班林間鳩寄內班班林間鳩榖穀命其匹逮天之未雨與汝勿相失春原洗新霽緑葉暗朝日鳴聲相呼和一作呼相諧應答如吹一作若吕應嘉律深棲柔桑暖下啄髙田實人皆笑汝拙無巢以家室易安由寡求吾羡拙之佚吾雖有室家出處曽不一一本有豈如鳴鳩樂天性免乖咈兩句荆蠻昔竄逐奔走若鞭抶山川瘴霧深江海波濤䫻跬步子所同淪棄甘共沒投身去人眼巳廢誰復嫉山花與野草我醉子鳴瑟但知貧賤安不覺歲月忽還朝今幾年官祿霑兒姪身榮責愈重器小憂常溢今年來鎮陽留滯見春物北潭新漲渌魚鳥相聱耴魚乙切一作歡聲逸我意不在春所憂空自咄一官誠易了報國何時畢髙堂母老矣衰髮不滿櫛昨日寄書言新陽發舊疾藥食一作石子雖勤豈若我在膝又云子亦病蓬首不加佛書來本慰我使我煩憂鬱思家春夢亂妄意占凶吉却思夷陵囚其樂何可述前年辭諫署朝議不容乞孤忠一許國家事豈復一作暇恤橫身當衆怒見者旁可栗近日讀除書朝廷更輔弼君恩優大臣進退禮有秩小人妄希旨論識爭操筆又聞説朋黨次第推甲乙而我豈敢逃不若先自劾上賴天子聖必未一作未必加斧鑕一身但得貶羣口息啾唧公朝賢彥衆避路一本作讓當揣質茍能因謫去引分思藏密還爾禽鳥性樊籠免驚怵子意其謂何吾謀今巳必一本有試思憂與樂便可齊升黜兩句子能一作如甘藜藿我易解簪紱嵩峯三十六蒼翠爭聳出安得携子去耕桑老蓬蓽暮春有感幽憂無以銷春日靜愈長薰風入花骨花枝午低昻往來採花蜂清蜜未滿房春事巳爛漫落英漸飄揚蛺蝶無所為飛飛助其忙啼鳥亦屢變新音巧調篁遊絲最無事百尺拖晴光天工施造化萬物感春陽我獨不知春久病卧空堂時節去莫挽浩歌自成傷洛陽牡丹圖洛陽地脈花最冝牡丹尤為天下竒我昔所記數十種於今十年半忘之開圖若見故人面其間數種昔未窺客言一作云近歲花特異往往變出呈新枝洛人驚誇立名字買種不復論家資比新較舊難一作莫優劣爭先擅價各一時當時絶品可數者魏紅窈窕姚黃妃壽安細葉開尚少一作早朱砂玉版人一作猶未知傳聞千葉昔未有只從左紫名𥘉馳四十年間花百變最後最好濳溪緋今花雖新我未識未信與舊誰妍媸當時一作年所見巳云絶豈有更好一作妍此可疑古稱天下無正色但恐世好隨時移鞓紅鶴翎豈不美斂色如避新來姬何况逺説蘇與賀有類異世誇嬙施造化無情冝一槩偏此著意何其私又疑人心愈巧偽天一作各欲鬪巧窮精微不然元化朴散久豈特近歲尤澆漓爭新一作先鬪麗若不已更後百載知何為但應新花日愈好惟有我老年年衰鎮陽讀書春深夜苦短燈冷熖不長塵蠹文字細病眸澀無光坐久百骸倦中遭群慮戕尋前顧後失得一念一作而十忘乃知學在少老大不可強廢書誰與語歎息自悲傷因憶石夫子徂徠有茅堂前年來京師講學居上庠青衫綴朝士面有一作乃棄數畒桑不耐群兒嗤束書歸故鄉却尋茅堂在髙卧泰山傍聖經日陳前弟子羅兩廂大論叱佛老髙聲一作言誦虞唐賔朋足棗栗兒女飽糟粳雖云待官闕便欲解朝裳有似蠶作繭縮身思自藏嗟我一何愚貪得不自量平生事筆硯自可娛文章開口攬時事論議爭煌煌退之嘗有云名聲暫羶香誤蒙天子知侍從列班行官榮日巳寵事業暗不彰器小以一作而任大躋顚理之常聖君雖不誅在汝一作尓豈自遑不能雖欲止恍一作恍若失其方却欲尋舊學舊學巳榛荒有類邯鄲步兩失皆茫茫便欲乞身去君恩厚須償又欲求一州俸錢買歸裝譬如歸巢鳥將棲少徊翔自覺誠未晚收愚老縑緗留題鎮陽潭園官雖鎮陽居身是鎮陽客北園潭上花安問誰所植春風無先後爛漫爭紅白一花聊一醉盡醉猶須百而我病不飲對花空歎息朝來不能歸暮看不忍摘謂言花縱落滿地猶可席不來才幾時人事已非昔芳枝結青杏翠葉新奕奕落絮風卷盡春歸不留迹空餘緑潭水尚帶餘春色疑一作思春竟何之意謂追可得東西繞潭行蜂鳥已寂寂惘然無所依歸駕不停軛寓興誠可樂留情豈非惑至今清夜夢猶繞北潭北讀一本有聖俞字蟠桃詩寄子美韓孟於文詞兩雄力相當一本有偶以怪自戲作詩驚有唐兩句篇章綴談笑雷電擊幽荒衆鳥誰一作不敢和鳴鳯呼其皇孟窮苦纍纍韓冨浩穰穰窮者啄其精冨者爛文章發生一為宫揫斂一為商二律雖不同合奏乃鏘鏘天之産竒怪希世不可常寂寥二百年至寶埋無光郊死不為島聖俞發其藏患世愈不出孤吟夜號一作夜號清霜霜寒入毛骨清響哀一作乃愈長玉山禾難熟終歲苦飢腸我不能飽之更欲不自量引吭和其音力盡猶勉強一本有嗟我於韓徒足未及其墻而子得孟骨英靈空北印四句誠知非所敵但欲繼前芳近者蟠桃詩有傳來北方發我衰病思藹如得春陽欣然便欲和洗硯坐中堂墨筆不能下恍恍一作恍恍若有亡老雞觜爪硬未易犯其埸不戰先一作輒自却雖奔一作然未甘降更一作便欲呼子美子美隔濤江其人雖憔悴其志獨軒一作昂昂氣力誠當對勝敗可交相安得二子接揮鋒兩交鋩我亦願助勇鼓旗譟其旁快哉天下樂一釂冝百觴乖離難會合此志何由償𥘉伏日招王幾道小飲北園數畒官墻下嗟我官居如傳舍滹沱北渡馬踏一作蹄冰西山病歸花巳謝落英不見空繞樹細草𥘉長猶可藉空園一鎖不復窺不覺芳蹊繁早夏隔墻時時聞好鳥如得嘉一作佳客聽清話今朝試去繞園尋緑李橫枝礙行馬蒲萄憶見𥘉引蔓翠葉隂一作成隂還滿架紅榴一作榴花最晚子已繁猶有殘花藏葉罅一本有雖無桃李競繁華固有竹柏資瀟灑兩句人生有酒復何求官事無了須偷暇古云伏日當早歸况今著令許休假能來解帶相就飲為子掃月開風榭白髮喪女師作一本無下四字吾年未四十三斷哭子腸一割痛莫忍屢痛誰能當割腸痛連心心碎骨亦傷出我心骨血灑為清淚行淚多血已竭毛膚冷無光自然鬚與鬢一作鬢與鬚未老先蒼蒼永陽大雪清流關前一尺雪鳥飛不度人行絶冰連一作沍溪谷麋鹿死風徑野田桑柘折江淮卑濕殊北地歲不苦寒常疫癘老農自言身七十曽見此雪才三四新陽漸動愛日輝微和習習東風吹一尺雪幾尺泥泥深麥苗春始肥老農爾豈知帝力聽我歌此豐年詩送章生東歸窮山一作廬荒僻人罕顧子以一身千里來問子之勤何所欲自慚報子無瓊瑰非徒多難學久廢世事漸懶由心衰吳興先生冨道德侁侁弟子皆賢材鄉閭禮讓巳成俗餘風漸𬒳來江淮子年方少力可勉往與夫子為顔回居士集卷第二熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益挍正送楊闢秀才詩如渴飲醴酪諸本同惟衢本作潼酪朝佐按列子乳湩有餘謝承後漢書乳為生湩湩乳汁也音種訛而為潼史記胸奴傳湩酪之美今正之送慧勤歸餘杭詩箘笋鄙羔羊衢本建本吉本作箘從竹吉州羅寺丞家京師舊本蜀本作菌從草朝佐按箘簵美竹也菌菌也吕氏春秋越駱之菌注竹筍也本亦從草今兩存之送慧勤未飯一作供歸兮一作歸去絳守居園池駭羣一作駮羣晉祠窺一作觀豪俠一作遊俠髙壘一作孤壘登嵩巫亭朝暮石本作昏朝綽約京本作婥約莊子作淖約水谷夜行轢一作鑠病中寄聖俞冰消一作涓涓班班林間鳩官祿一作官祿鎮陽讀書官榮一作宦榮躋顚一作顚躋讀蟠桃詩子美二字上一有蘇字寥一作寞𥘉伏小飲殘花一作殘紅永陽大雪鳥飛一作飛鳥此卷班班林間鳩寄內云次第推甲乙廣韻第字注云次第説文云本作弟韋束之次弟也今為兄弟字又漢復姓玉篇亦謂第字今為第幾明非古也然則古惟用弟字未嘗加竹史傳皆然故公集凡言次弟兄弟之類並用弟字近世既分而為二印本從之今難盡正書此以示後人易童子問第三乾坤乾爻七九則變坤爻八六則變一作乾爻七九九則變坤爻八六六則變第四屯動乎險而經綸之險字下一有中字第五蒙以養其德以一作不第七師臣伐主主一作君以本於順以當作心兵非聖王王一作人第九同人急於人事急一作適第十一觀下觀於民於一作乎第十二剝動以經論易釋文黃潁云經論匡濟也本亦作綸第十三復見乎動復也復字下一有動字第十六咸男女同類歟曰此下一有男女異類也故睽之彖曰二女同居其志不同行又曰二十二字其志通此下一有也字第十七恆而久成久字上疑脫能字而化成而字下疑脫天下字不正利一作不利正第十八明夷出而臨衆臨二作蒞易童子問卷第二歐陽文忠公集七十七童子問曰履險蹈難謂之蹇解難濟險謂之解二卦之義相反而辭同皆曰利西南者何謂也曰聖人於斯二卦辭則同而義則異各於其彖言之矣蹇之彖曰往得中也解之彖曰往得衆也者是巳西南坤也坤道主順凡居蹇難者以順而後免於患然順過乎柔則入於邪必順而不失其正故曰往得中也解難者必順人之所欲故曰往得衆也童子問曰損損下益上益損上益下何謂也曰上君而下民也損民而益君損矣損君而益民益矣語曰百姓足君孰與不足此之謂也童子又曰損之象曰君子以懲忿窒欲益之象曰君子以見善則遷有過則改何謂也曰嗚呼君子者天下繫焉其一身之損益天下之利害也君子之自損忿欲爾自益者遷善而改過爾然而肆其忿欲者豈止一身之損哉天下有𬒳其害矣遷善而改過者豈止一已之益哉天下有蒙其利者矣童子曰君子亦有過乎曰湯孔子聖人也皆有過矣君子與衆人同者不免乎有過也其異乎衆人者過而能改也湯孔子不免有過則易之所謂損益者豈止一身之損益哉童子問曰夬不利即戎何謂也曰謂其已甚也去小人者不可盡蓋君子者養小人者也小人之道長斯害矣不可以不去也小人之道巳衰君子之利及乎天下矣則必使小人受其賜而知君子之可尊也故不可使小人而害君子必以君子而養小人夬剛決柔之卦也五陽而一隂決之雖易而聖人不欲其盡決也故其彖曰所尚乃窮也小人盛則決之衰則養之使知君子之為利故其象曰君子以施祿及下小人巳衰君子已盛物極而必反不可以不懼故其象又曰居德則忌童子問曰困亨貞大人吉無咎其彖曰險以説困而不失其所亨何謂也曰困亨者困極而後亨物之常理也所謂易窮則變變則通也困而不失其所亨者在困而亨也惟君子能之其曰險以説者處險而不懼也惟有守于其中則不懼于其外惟不懼則不失其所亨謂身雖困而志則亨也故曰其惟君子乎其象又曰君子以致命遂志者是也童子又曰敢問正大人吉無咎者古之人孰可以當之曰文王之羑里箕子之明夷童子問曰革之彖曰湯武革命順乎天而應乎人何謂也曰逆莫大乎以臣伐君若君不君則非君矣是以至仁而伐桀紂之惡天之所欲誅而人之所欲去湯武誅而去之故曰順乎天而應乎人也童子又曰然則正乎曰正者常道也堯傳舜舜傳禹禹傳子是已權者非常之時必有非常之變也湯武是巳故其彖曰革之時大矣哉云者見其難之也童子又曰湯武之事聖人貴之乎曰孔子區區思文王而不已其厚於此則薄於彼可知矣童子又曰順天應人豈非極稱之乎何謂薄曰聖人於革稱之者適當其事爾若乾坤者君臣之正道也於乾坤而稱湯武可乎聖人於坤以履霜為戒以黃裳為吉也童子問曰革去故而鼎取新何謂也曰非聖人之言也何足問革曰去故不待言而可知鼎曰取新易無其辭汝何從而得之夫以新易舊故謂之革若以商革夏以周革商故其象曰湯武革命者是也然則以新革故一事爾分於二卦者其誰乎童子又曰然則鼎之義何謂也曰聖人言之矣以木巽火亨飪也童子問曰震之辭曰震驚百里不喪匕鬯者何謂也曰震者雷也驚乎百里震之大者也處大震之時衆皆震驚而獨能不失其守不喪其器者可以任大事矣故其彖曰震驚百里驚逺而懼邇也不喪匕鬯出可以守宗廟社稷為祭主者謂可任以大事也童子曰郭公夏五聖人所以傳疑彖之闕文奈何曰聖人疑則傳疑也若震之彖其辭雖闕其義則在又何疑焉童子問曰艮之象曰君子以思不出其位何謂也曰艮者君子止而不為之時也時不可為矣則止而以待其可為而為者也故其彖曰時止則止時行則行於斯時也在其位者冝如何思不出其位而已然則位之所職不敢廢也詩云風雨如晦雞鳴不巳此之謂也童子問曰歸妹征凶彖曰歸妹天地之大義人之終始也其卦辭凶而彖辭吉何謂也曰合二姓具六禮而歸得其正者此彖之所謂妹者也若婚不以禮而從人者卦所謂征凶者也童子曰敢問何以知之曰咸之辭曰取女吉其為卦也艮下而兊上故其彖曰上柔而下剛男下女是以吉也漸之辭曰女歸吉其為卦也艮下而巽上其上柔下剛以男下女皆與咸同故又曰女歸吉也歸妹之為卦也不然兊下而震上其上剛下柔以女下男正與咸漸反故彼吉則此凶矣故其彖曰征凶位不當也者謂兊下震上也童子曰取必男下女乎曰夫婦所以正人倫禮義所以養廉耻故取女之禮自納采至于親迎無非男下女而又有漸也故漸之彖曰漸之進也女歸吉也者是已奈何歸妹以女下男而往其有不凶者乎童子問曰兊之彖曰順乎天而應乎人何謂也曰兊説也説以先民民忘其勞説以犯難民忘其死説莫大於此矣而所以能使民忘勞與死者非順天應人則不可由是見小惠不足以説人而私愛不可以求説童子問曰萃聚也其辭曰王假有廟渙散也其辭又曰王假有廟何謂也曰謂渙為散者誰歟易無其辭也童子曰然則敢問渙之義曰吾其敢為臆説乎渙之卦辭曰利涉大川其彖曰乘木有功也其象亦曰風行水上渙而人之語者冰釋汗浹皆曰渙然則渙者流行通逹之謂也與夫乖離分散之義異矣嗚呼王者冨有九州四海萬物之象莫大於萃可以有廟矣功德流行逹于天下莫大於渙可以有廟矣童子問曰節之辭曰苦節不可貞者自節過苦而不得其正歟物𬒳其節而不堪其苦歟曰君子之所以節於已者為其愛於物也故其彖曰節以制度不傷財不害民者是也節者物之所利也何不堪之有乎夫所謂苦節者節而太過行於己不可久雖久而不可施於人故曰不可正也童子口敢問其人曰異衆以取名貴難而自刻者皆苦節也其人則鮑焦於陵仲子之徒是矣二子皆苦者也童子問曰小過之象曰君子以行過乎恭喪過乎哀用過乎儉者何謂也曰是三者施於行己雖有過焉無害也若施於治人者必合乎大中不可以小過也蓋仁過乎愛患之所生也刑過乎威亂之所起也推是可以知之矣童子問曰既濟之象曰君子思患而豫防之者何謂也曰人情處危則慮深居安則意怠而患常生於怠忽也是以君子既濟則思患而豫防之也童子問曰火在水上未濟君子以慎辨物居方何謂也曰未濟之象火冝居下而反居上水冝居上而反居下二物各失其所居而不相濟也故君子慎辨其物冝而各置其物於所冝居之方以相為用所以濟乎未濟也易童子問卷第二易童子問第一履坤道主順此下一衆也三有又字第二損君子之自損此下一有者字有𬒳其害矣矣字上一有者字第五革貴之乎一作所貴乎順天應人此上一其曰二有字第八艮可為而為者也為者一作有為第十兊萬物之象象一作衆第十一莭皆苦者也皆苦一作其甚第十二小過於治人者一無者字書簡卷第二歐陽文忠公集一百四十五與晏元獻公同叔慶曆七年某啓孟春猶寒伏惟判府相公尊體動止萬福前急足自府還伏蒙賜書為報且承臨鎮之餘日有林湖間燕之樂此乃大君子以道出處之方而元老明哲所以為國自重之意也幸甚幸甚有魏廣者好古守道之士也其為人外柔而內剛一作內剛而外柔新以進士及第為滎陽主簿今因吏役至府下非有它求一有也字宜以卑賤不能自逹欲一趨門仞而已伏惟幸賜察焉不備某再拜又皇祐六年某叩首孟春猶寒伏惟留守相公大學士動止萬福某罪逆不孝不自死滅猶存喘息自齒人曹近者輒以哀誠具之號疏台慈軫惻憐念孤窮亟遣府兵賜以慰答有以見厚德載物無所不容求舊拾遺雖弊不棄捧讀感涕不知自已內惟孤賤受賜有年豈獨兹時乃爾忉怛蓋以感激臨紙發於其誠而不能止也留務清間伏惟上為邦家精調寢膳下情區區謹因人還附以敘謝某再拜與杜正獻公世昌慶曆五年某頓首啓仲夏毒熱伏惟相公閣下尊候動止萬福某蒙國厚恩任責尤重殆此期歲曠無所聞不惟上辜陶鈞實亦慚愧知已瞻望門館豈勝區區然自東藩下車巳纍月而尚稽修問左右之禮蓋其進不能為朝廷辨邪正而使讒言勝於公議退亦何所述其私焉用此倣徨非懈怠也伏以大臣出處自繫時事惟望為國自重以享多福卑情不任禱頌懇切之至謹奉啓起居伏惟幸察又慶曆八年某啓仲夏毒熱不審相公閣下尊體動止何如某昨蒙恩自滁徙揚揚古名都嘗多巨公臨治憶為進士時從故胥公自南還舟次郡下遊里市中但見郡人稱頌太守之政愛之如父母某時尚未登公之門然始聞公之盛德矣因竊歎慕不已以為君子為政使人愛之如此足矣然不知公以何道而能使人如此又不知使已他日為之亦能使人如此否是時天聖六年冬也去今幾二十年而幸得繼公為政於此以償夙昔歎慕之心而其材薄力劣復何能為徒有志爾相公道德材業著子天下一郡之政不足多述因小生之幸遂以及之聊陳始未不覺言繁恐悚恐悚拜見未由伏惟為國自重又皇祐元年某啓孟秋猶熱伏惟致政相公閣下尊體動止萬福昨者某以目疾為苦自揚州求潁至此經時闕於奉狀蓋以目疾一作目病無悰私門多故然其企望門館何日而忘頃自去冬子美之逝賢人不幸天下所哀伏計台慈倍深痛悼某年方四十有三而鬢鬚皆白眼目昏暗慈母垂老羸病厭厭身世若斯國恩未報每以自念慨然興嗟知遇至深敢兹瑣碎皇恐皇恐秋暑未退霖雨為災伏惟順時倍加保重卑情所望不任區區謹奉啓起居又同前某頓首啓季冬極寒伏惟相公閣下尊候動止萬福某幸得守官近郡當時欲奔走候問起居而自秋以來老母卧病郡既僻小絶無醫藥逮冬至之後方得漸安由此踰月曠闕書啓之禮蕞爾小子蒙德有年瞻望門墻何日而巳伏願順時自重以迎遐福以隆壽考卑情不任區區謹奉啓咨問又皇祐四年某啓前月𥘉專於郡中借人拜問不謂至今不逹必以大水為阻急足至伏喜秋來台候萬福得贊善書承頗多故亦云微恙今必已平康諒煩台慮也寵示寄君謨唱和詩并梅書豈勝珍荷梅君窮困晚遇真知不為否也某此苟活但葬事未有涯大事惟此固難容易自秋來忽患腰腳醫者云脾元冷氣下攻遂勉從教誨食肉古人三年不食鹽酪誠有愧也不孝不孝延陵葬子孔子猶往觀之蓋君子於哀樂喜怒必有可觀以為人法也今世士人居喪不及處多風俗久弊恬不為怪心常患之不意自犯名教然存身亦以奉後此蒙寵誨之意也荷見憂愛至深不覺言多死罪死罪某上與曽宣靖公明仲慶曆五年某啓山郡僻寂習間成懶凡於人事幾廢絶前者送起居院文字人回特沐手誨違别兹久伏承德履甚休可勝慰浣某居此雖僻陋然奉親尸祿優幸至多愚拙之心本貪報國招仇取禍勢自當然然禆輔未有一分而緣某之故事起多端有損無益可為愧歎今而冒寵名飽食自便何以為顔也未期良會冬冷保重與吕正獻公晦叔皇祐二年某啓别後人還兩辱書暑中喜承寢味多福某十三日受命與孫公易地此月下旬當行效官不憚宣力苟為公家何所不可若區區應接人事以避往來之謗秖恐違其天性難久處也西湖宛然再來之計不難圖而與賢者共樂知其不可得也秋涼惟冀保重又熙寧年某啓某以衰病之質幸此優間中性易習遂成懶墮嚮審召還禁林固與士大夫同其慶抃而久闕馳誠恃知之厚必不罪其踈慢也辱書重增感愧未涯瞻邇漸寒為國自重又熙寧三年某啓養拙東州久自藏縮加之病苦廢事遂闕拜問比者得請淮西道出治下方俟及疆奉狀行次南郡一作都遽辱賜教其為感愧何可勝言仍審坐鎮之餘動履多福某衰晚之年蒙上信其實病不以避事為責而從其所欲恩出萬幸何感如之餘不復云皆留靣布又熙寧五年某啓晴隂不常不審動履何似前日四望一賞群芳之盛已而遂雨古人謂四樂難并信矣十三日欲枉軒騎顧訪蓋以草堂僅成幸一光飾之爾謹此咨布餘留面敘又同前某啓昨晚辱教答承齒疾尚未平若苦不敢勸酒莫可略枉顧否蓋欲少接清論不主於酒食物亦令減滋味也矧兹疾某亦嘗苦每蒙寬假也更此咨啓與程文簡公天球皇祐年某啓哀誠迫塞不敢時通記問蒙存録過厚荷知有素不當煩述也賤纍往來鎮下特承差人送至及勞賜稠重秖以愧感佳釀拜惠甚頻增􅌤增靦衰病咫尺未由號一作就見依戀依戀又至和元年某頓首啓依戀之懇略布具前大暑中特煩眷接纍日連夕不見倦色私懷感著非一二所可陳舟行病酒纍日不解府人屢還皆不能奉啓才過長平遂苦大熱比及都下俗狀益勞瞻想清宴其可再得餘當續具咨目兹少敘依依不悉又至和二年蒙頒寄佳醖感愧非一京師日苦俗狀無復清思臨觴之樂未始有之思去歲留奉清歡不覺巳期年矣栁湖陳之甘棠思有所頌述以遺陳人為他日故事以彰公之雅志不惟拙訥直以多事匆匆殊所不暇秋涼必償素願得次詩榜之末亦大幸矣又同前某啓昨得請淮西方作書乞舟謀出府下冀得一奉言色私懷喜幸何可勝言而改職未謝恩旨復留孤拙無庸於時何報進退遑遽莫知所為重以屢煩朝聽未敢輕有所陳􅌤顔周行碌碌而巳荷公愛顧非比他人出處之節不敢自默時事日新未知如何區區非紙墨所布也秋熱惟乞以時為國自重又同前某啓忽忽久踈奉問近以𬒳命出疆𥘉緣持送御容須一學士同列五人皆以曽往遂不敢辭繼以虜中凶訃義益難免然冒風霜衣皮毛附火食麵皆於目疾有損亦無如之何比者當馳問示諭栁湖嘉致誠願有所述以姓名附見為榮北行馬上當得杼思偶祕書歸省顧治行計隨分牽率鄙懷不能盡萬一又至和元年某頓首伏承台誨欲使撰述先公神道碑豈勝愧恐某才識卑近豈足以鋪列世德之清芬然蒙顧有年義不得辭其如大懼不稱所使以辱執事是用進退惕然餘當詣節下受教舟船荷德無巳又同前某啓辱賜問并録到贈告屢煩台聽悚仄可知所要碑文今巳牽課衰病無悰言無倫理不足以揚先烈愧汗而巳某自病起益疲不能復舊豈遂衰邪碌碌處此思去未果但思明公栁湖春色不得陪俊騎為恨爾大用猶稽時事多端思見舊德物論如此非諛也未間樽爼為適亦有嘉趣臨紙區區不能盡惟冀為國珍重與孫威敏公元規皇祐四年某僦居西郊苟活無求於世號奉几筵而巳諸事無便不便也幸無恤秖如卜葬茫然未有涯然汲汲須於明年了却某邇來目昏略辨黑白耳復加重恐知之西行漸相逺哀苦中瞻望依依范杜二家之子不歸京西此不足怪人事就易爾仕宦子孫多在北古賢亦皆如此不以去就為輕重也某亦不忍以先妣有歸子孫以逺不得時省墳墓也哀切哀切又同前某叩首急足自徐還辱書承以七月首塗大斾遂西即日秋暑伏惟台候萬福昨日范公宅得書以埋銘見託哀苦中無心緒作文字然范公之德之才豈易稱述至於辨讒謗判忠邪上不損朝廷事體下不避怨仇側目如此下筆抑又艱哉某平生孤拙荷范公知獎最深適此哀迷别無展力將此文字是其職業當勉力為之更須諸公共力商榷須要穩當承公許作行狀甚善便將請諡議官文書有司據以為議大是一重公據請早揮筆秖見行狀亦當牽率為之也入對少留應當西邁殘暑千萬保攝時乞惠問以慰孤窮與蘇丞相子容同前某啓哀窮苟活奄及仲秋孤苦之心何以自處昨急足還府嘗奉號疏必逹秋涼寢味如何昨聞入京今必歸府某此幸幼賤如常相見未涯嚮寒保愛因人奉此不次某再拜推官學士執事八月五日狀昨大禍倉卒離南都來不記料錢劵曆何在後來須繳納省中不知省中曽催否是王仲文手分託與問之又同前某啓近急腳子還嘗奉訊專人至辱書審秋寒以來體況佳福修苟自存活諸況前書具之此不繁述職租極荷挂意前者為料錢曆子承封送王仲文等狀蓋當時作書誤寫本為添支曆尓更説與問看記得當時離南都時似繳納了恐未曽繳時須要見歸著也此中尋來並不見故也更為王渭州織紗如何亦告因書批及見解榜喜賢弟𬒳薦歲杪多愛某再拜職田絲十二兩有公文却送還府又皇祐五年某啓近纍纍辱書承夏熱幕中清勝某居此以來事緒纍次書中應悉但卜葬心欲速了而事未有涯絶無人相助又無弟姪可使者茫然中心未知所措吾弟替期應亦不逺公租極小事煩挂意悚悚苟圖存活所須至鮮然有不得已處也窮居危坐病目眊然無以度日又為一妹喪夫惸然無依居處相逺力未相及添此一重煩惱爾人還作書回謝事多未能子細思渴思渴又疑某啓晴色可佳必遂出城之行泥濘竊惟勞頓清明之約幸率唐公見過喫一碗不托爾餘無可以為禮也專此不宣又疑某啓雨晴便苦客多牽強攀和盛篇已不能如韻實愧於詩老也早來承見問所聞再三疑惑不審何事彼有所傳幸以為示也為客在門前守定寫簡不成悉之又疑某啓拙詩趂韻有梅二之業病無其工也早來許行香後見過何為復輟所欲示者何事來日能見顧否行香後乘涼枉駕作一盂飯奉待却有絶品茶數種可試若所説事不妨時幸就近約介甫同來為幸惟以方上號請告不敢聚飲爾其他並無害批示某再拜又治平四年某啓近嘗奉狀急足還并遞中併捧惠問所以慰誨存恤之甚厚兼審經暑動履多福乃誠瞻嚮欣感可量汴流駛激承使舟即日東下得與民吏奔走道左豈勝馳情謹先奉此攀迎伏惟幸察不宣又同前某啓某以孤拙蒙上恩憐豫之一州俾養衰朽又得在使部遂依公庇頓安危心豈勝天幸某至此已數月幸歲豐盜息民事亦稀蝗蝻不多隨時撲滅承齋舲下汴首及弊封當得親受約束靣布懇誠謹因迎迓人行姑此上問尊候不宣余皇祐庚寅歲為南都從事會樂安公來守留司以余乃昔所舉送進士待遇特厚府中之務皆以見屬嘗謂余曰愛君至誠喜得共事故事事奉諉必不憚煩也又嘗親書余考牒曰才可適時識能慮逺圭璋粹美是為邦國之珍文學純深當備朝廷之用又其所遺書簡往往指事詰難盡其底處余亦荷其知照於論議間纎悉無隱前後諸帖雖祕藏之或為親識携去者多矣今聞公薨謝感舊愴懷不能已已因索巾禇尚得數十紙命工裝背庶幾藏於久逺尓熙寧五年十月草五日東陽郡思堂丹揚蘇頌子容題豫在樂安幕府二年日接論議聞所未聞府事之外則章奏書疏悉以見託至於私家細故亦多詢其何如故其簡札丁寧委曲雖至親亦不過如此自公之薨豫每與親舊語言未嘗不及之抑其風尚之可懷故彌久而不能忘也蘇頌子容題與王文公介甫嘉祐年某再拜相别忽焉遂見新歲中間嘗一得附書其如匆遽不盡鄙懷於今猶以為恨雖然遂使不匆遽區區之懷亦不能盡也賢弟來得相見備審動止即日春寒奉太夫人萬福喜慰無限賢者不能留之朝衰病者不得放去皆失其分歸咎何所其自新春來目益昏耳亦不聰大懼難久於筆硯平生所懷有所未畢遂恐為庸人以死爾其他細故不足道惟奉親自愛又嘉祐三年某啓近託揚州附書必逹自拜别無日不瞻企秋氣稍涼伏惟尊候萬福毗陵名郡下車之始民其受賜然及侍親為道之樂日益無涯矣某怏怏于此素志都違諸公特以外議為畏勉相留古之君子去就乃若是也吕惠卿學者罕能及更與切磨之無所不至也因其行謹附此咨起居又嘉祐元年近得揚州書言介甫有平山詩尚未得見因信幸乞為示此地在廣陵為佳處得諸公録於文字甚幸也賢弟平甫秀才不及别書愚意同此前亦承惠詩多感多感與韓獻肅公子華嘉祐六年某啓多日思致問近見發遣使臣來請公用物呼渠欲附書待之終不至遂以稽滯不審秋涼所履何似某碌碌無所稱遂為朋友之羞第以體難輕發當更小忍慙尓君謨自南歸皤然一翁但喜其病渴且止遂當安也仲儀頑健如故惟不能屢相見交遊索漠子華豈當久外何時來歸未間因風時枉數字猶足以慰衰病之懷竊冒寵榮不知為樂但覺其勞與負愧尓茶三二種託賢弟致逹勿罪少邉州早寒惟為時自愛公儀云謝禮闈唱和巳失二梅可歎可歎與韓門下持國至和二年承巳受命未克馳賀蓋以治行徙居日併牽率也隂雨體況佳否小詩幸同作以送介甫因出見過思仰思仰某再拜十三日何時可入史院幸先示諭為望與吳王獻公沖卿嘉祐六年某啓奉别忽見新歲辱書承經寒動履休勝某以孤拙之姿不求合世加以衰病心在江湖久矣此交親所共亮之也兹者遽叨誤選實出意外任責已重而無素藴不敗何待見愛深者但可弔也不然何以教之惶恐惶恐新春保愛以副瞻祝某再拜又嘉祐八年某啓公私多故久闕奉狀辱書承經暑動履清和併深慰戀近審將漕京西但欣按部過都當遂瞻見亦承曽有章奏必難遂髙懷莫且勉就否某自春涉夏以小兒女多病不無憂撓加以待罪碌碌不知所為情緒蕭索無復前日惟握手一笑庶幾尚慰衰殘豈勝企望也未間盛者為時自重人還草率為謝不宣又同前某啓公私多故稍闕致問自因山赴役事非素料每見奏削足知勞慮也亦承邇來頗有倫緒諒非精敏不能濟也某以衰朽謬膺器使當此多艱未知何以免於罪戾也即此衰病之餘與兒婦輩各安恐知乂治平四年某啓違逺台席忽復更時秋暑尚繁不審動履何似某向以孤危之迹當羣論洶湧之時獨賴至公遏以清議保全至此恩德可量赴職以來日享安逸兹為受賜不淺矣乃情傾嚮豈勝區區惟冀以時為國自重又熙寧四年某啓感激之誠巳具前幅某十七日受命行裝素具適值久雨積水為阻三五日始遂東歸某此來恩數出於望外然猶有私門合乞恩澤上煩朝廷幸乞留念一作意蓋他門不敢言恃以親契皇恐皇恐某又上又治平元年某啓多故稍闕致問辱書感愧新正竊承動履休福貴眷各安某與兒婦等幸如宜第苦殘衰齒牙搖脫飲食艱難殊無情況爾京西忽已踰年承見諭謹當志在下懷也過年賔客書題坌集日益區區修報草率不以為罪春和惟以時慎愛又熙寧五年某頓首啓某田野之人自冝屏縮而況機政方繁猶蒙曲記其生日貺之厚禮仰佩眷意之篤感懼交并某以衰病退藏人事或不能勉力交親必賜寬恕謹此以代布謝之萬一又熙寧五年竊承懇章屢上而中外瞻矚方切恐未能遽遂髙懷也近叔平自南都惠然見訪此事古人所重近世絶稀始知風月屬間人也呵呵有會老堂三篇方刻石續納兒子在宅叨聒感愧感愧與吳正肅公長文嘉祐二年某啓前日齋所却成叨聒纍日宿齋不易承手教存問雨勢不減去年弊居上漏下浸壓溺是憂更三數日如此當須奔避皇皇不知何適為可居京師其況如此奈何奈何承惠竒物逺來更要新如何可得也呵呵感著感著人還謹此不宣又同前某再拜纍日不瞻奉渴仰可勝酷暑中承氣體清適某自𥘉旬內嘗冒熱赴宿為暑毒所傷絶然飲不得加以腹疾時時作遂在告數日前下榜子欲見以虛羸未任遂復中止更三五日當出承手教存問感慰感慰謹此奉謝又同前某啓在告纍日不獲瞻見尤所企渴辱教承餘寒體氣清佳衰病極不自勝左臂疼痛繫衣搢笏皆不得懇告諸公幾乎乞骸也何暇復顧外論如何哉承見諭感仰感仰乍出事叢草草不悉又嘉祐四年某啓承奉祠齋宿喜體候清休某參假方三日左眼臉上生一瘡疼痛牽連右目不可忍旦夕未止又須在告屢廢職事豈得安穩諸公不諒未肯令罷奈何奈何承惠佳篇甚釋病思和得納上目痛甚書不得勿訝又同前某病中聞得解府事如釋籠縛交朋聞之應亦為愚喜也請外又須更作一節般挈上下重以為勞數日卜居稍定遂得從公遊矣拙詩取笑又此帖乃是嘉祐三年二月誤置此某啓一兩日不奉見伏惟體候清佳孫明復春秋文字知在彼傳録欲告借一兩册或彼中巳寫了者若或未寫到者皆得此中一二筆吏間坐必不久滯某遂赴班荆忽忽五七日不相見謹此不宣又同前某啓昨日聖俞處見一篇又辱寵示其鋒豈易當也然自此極有工夫却歸人道上也呵呵云百司者尚未見報來不知的否某巳有祕閣唐書便更無兼局亦情願臉瘡未愈未得奉見區區不悉又同前某啓昨日奉見偶忘咨聞為親戚喬孝本避嫌當易局乞早與施行況武平郎君例甚近幸冀留念前時亂道數篇必已寵和專令咨請望付人也忙不詳悉又同前某啓在告久不瞻顔采頓涼伏計德履康𥙿某病體得涼漸愈思欲朝參以奉言宴而假故須𥘉三日方可出昨見新制京朝官不自下文字令審官舉行磨勘朝士唧唧皆為不便某亦思之有數節未便蓋為害甚廣然不知長文曽留意否始𥘉莫與建議否欲有所陳未敢先此咨問幸思而見教又嘉祐六年某啓自大斾東出忽復踰時春氣猶寒竊承動履清勝前約臨行少留會話終不克遂至今為恨東土雨雪不愆年豐俗阜為郡之樂想亦無涯某衰病日增勉強碌碌卒無毫分以塞咎責奈何奈何前日賞花釣魚獲侍清宴自景祐三年逮今二十六年獲見盛事獨恨長文不在爾嚮暑政暇惟以時自愛因風惠問以慰瞻渴又治平二年某啓以公私多故久不奉疏秋暑伏承孝履支福賢郎來因得聞動靜粗慰瞻企然而倚廬逺去城邑飲食非便亦承臟腑不調諒由𬞞食所致某向居憂於潁每每因食素生疾遂且食肉然服除半歲猶未平復此在典禮亦當從權前時傳侍講還朝尤病甚有羸色久之方復公奉侍慈顔尤當勉強間食少葷味以養助真氣交舊奉祝惟此為切餘不煩言也亦知室居稍亦完緝嚮寒更冀節哀慎護以副瞻祝又治平元年某自春末家中疫疾深夏甫定遽此水災驚奔不暇僅有餘生入今年來兩目昏甚屯滯百端直以京師飢疫復此水患上心憂勞正當竭力未敢請外其如無所禆輔其責愈深奈何奈何賜茶數餅表信然亦不冝多飲也又熙寧元年某啓暑伏巳深不審台候動履何似修赴職巳旬餘幸歲豐盜賊衰息地僻人事稀簡蹇拙之迹臨禍獲全荷德巳多而又假以寬間之處俾養衰病之餘其受賜亦不淺矣昨過潁尾蓋十五六年不到矣而風氣之變物産益佳巨蟹鮮蝦肥魚香稻不異江湖之富故亳雖名郡而歸思不可遏也固不待巢成而斂翼矣公方上副聖君眷委之重下為善人良士所賴惟為國自重以副區區不宣某再拜與蘇丞相子容皇祐棊年已下續添誠如所諭甚善早來所聞是生開者河道云太淺却髙如西靣二尺已來更請子細看過或果如此即更須那工開令深峻方可行水仍云大抵近東河底漸髙恐流水不快千萬且與挂意某兩日拖病來日方可到城外恐知之某白子容足下又至和元年某自去秋扶護南歸水陸往還四千餘里幸無風水之恐得遂安祔哀苦中獨力粗如私願其如水往陸還奔馳勞苦故自春多病僅有餘生中間承改秩召試帖職未遑為賀亦以哀苦杜門少見人便故也即日供職奉親外氣體休佳某六月當勉從人事未知所向何方相見未可期企仰企仰因人不惜垂問此外珍重某又門哀苦中承示啓事相知何必更如是未禫除稽於復謝諒可情恕也又嘉祐七年某啓中間辱書承為政外體履安和近又沐惠問適以合宫大禮前後事叢不時致謝第深感愧也頴城佳郡足以優賢然當舒發逺大則難久留也未間湖園亦少資清興某衰病碌碌厚顔已多有名即得引去矣未果談𣢾𥘉寒以時慎愛不宣某再拜知郡子容學士足下十一月一日與杜正獻公慶曆年見英辭類藁某頓首啓仲秋漸涼伏惟致政相公尊體起居萬福前者所遣人還伏蒙寵賜書答因得備問起居之節進退之冝私心喜幸何可勝道淮南歲旱飛蝗羣下來自淮泗至秋暑毒不解不審沿汴如何更望順時倍保尊重又慶曆年見英辭類藁某頓首山僻少便闕於修問伏惟台候萬福進士曽鞏者好古為文知道理不類鄉閭少年舉子所為近年文稍與疑後進中如此人者不過一二閣下志樂天下之英材如鞏者進於門下冝不遺之恐未知其實故敢以告伏惟矜察書簡卷第二與杜正獻公第一帖尊候一作尊體第四帖當時欲欲字疑與吕正獻公第二帖瞻邇一作瞻近與曾宣靖公幾廢絶一作幾至廢絶手誨一作手教事起多端一作事紛然多端與孫威敏公第二帖請早一作早請與蘇丞相第三帖思渴此下一有多愛多愛某再拜子容足下十一月一日一十六字于簿知不安來今應安也見且伸意帖後又有此一十四字與王文公第一帖得相見三字一作得書歸田録卷第二歐陽文忠公集一百二十七真宗朝歲歲賞花釣魚羣臣應制嘗一歲臨池久之而御釣不食時丁晉公謂應制詩云鶯驚鳯輦穿花去魚畏龍顔上釣遲真宗稱賞羣臣皆自以為不及也趙元昊二子長曰佞令受次曰諒祚諒祚之母尼也有色而寵佞令受母子怨望而諒祚母之兄曰沒藏訛哤者亦黠虜也因教佞令受以弒逆之謀元昊已見殺訛哤遂以弒逆之罪誅佞令受子母而諒祚乃得立而年甚幼訛哤遂專夏國之政其後諒祚稍長卒殺訛哤滅其族元昊為西鄙患者十餘年國家困天下之力有事于一方而敗軍殺將不可勝數然未嘗少挫其鋒及其困于女色禍生父子之間以亡其身此自古賢智之君或不能免況夷狄乎訛哤教人之子殺其父以為已利而卒亦滅族皆理之然也晏元獻公喜評詩嘗曰老覺腰金重慵便枕玉涼未是富貴語不如笙歌歸院落燈火下樓臺此善言富貴者也人皆以為知言契丹阿保機當唐末五代時最盛開平中屢遣使聘梁梁亦遣人報聘今世傳一有學士二字李琪金門集有賜契丹詔乃為阿布機當時書詔不應有誤而自五代以來見于他書者皆為阿保機雖今契丹之人自謂之阿保機亦不應有失又有趙志忠者本華人也自幼陷虜為人明敏在虜中舉進士至顯官既而脫身歸國能述虜中君臣世次山川風物甚詳又云阿保機虜人實謂之阿保謹未一作莫知孰是一有也字此聖人所以慎于傳疑也真宗尤重儒學今科埸條制皆當時所定至今每親試進士已放及第自十人已上御試卷子並録本于真宗影殿前焚燒制舉登科者亦然近時名畫李成巨然山水包鼎虎趙昌花果成官至尚書郎其山水寒林往往人家有之巨然之筆惟學士院玉堂北壁獨存人間不復見也包氏宣州人世以畫虎名家而鼎最為妙今子孫猶以畫虎為業而曽不得其髣佛也昌花寫生逼真而筆法軟俗一作劣殊無古人格致然時亦未有其比一作未有過此者寇萊公在中書與同列戲云水底日為天上日未有對而會楊大年適來白事因請其對大年應聲曰眼中人是面前人一坐稱為的對朝廷之制有因偶出一時而遂為故事者契丹人使見辭賜宴雜學士員雖多皆赴坐惟翰林學士秖召當直一員一作人餘皆不赴諸王宫教授入謝祖宗時偶因便殿不御𫀆帶見之至今教授入謝必俟上入內解袍帶復出見之有司皆以為定制也處士林逋居于杭州西湖之孤山逋工筆畫善為詩如草泥行郭索雲木呌鈎輈頗為士大夫所稱又梅花詩云踈影橫斜水清淺暗香浮動月黃昏評一作能詩者謂前世詠梅者多矣未有此句也又其臨終為句云茂陵他日求遺稿猶喜曽無封禪書尤為人稱一作傳誦自逋之卒湖山寂寥一作寞未有繼者俚諺云趙老送燈臺一去更不來不知是何等語雖士大夫一作君子亦往往道之天聖中有尚書郎趙世長者常以滑稽自負其老也求為西京留臺御史有輕薄子送以詩云此回真是送燈臺世長深惡之亦以不能酬酢為恨其後竟卒于留臺也官制一作稱廢久矣今其名稱訛謬者多雖士大夫皆從俗不以為怪皇女為公主其夫必拜駙馬都尉故謂之駙馬宗室女封郡主者謂其夫為郡馬縣主者為縣馬不知何義也唐制三衛官有司階司戈執干執戟謂之四色官今三衛廢無官屬惟金吾有一人每日于正衙放朝喝不坐直謂之四色官尤可笑也京師諸司庫務皆由三司舉官監當而權貴之家子弟親戚因緣請託不可勝數為三司使者常以為患田元均為人寬厚長者其在三司深厭干請者雖不能從然不欲峻拒之每溫顔強笑以遣之嘗謂人曰作三司使數年強笑多矣直笑得面似靴皮士大夫聞者傳以為笑然皆服其德量也茶之品莫貴于龍鳯謂之團茶凡八餅重一斤慶曆中蔡君謨為福建路轉運使始造小片龍茶以進其品絶精一作精絶謂之小團凡二十餅重一斤其價直金二兩然金可有而茶不可得每因南郊致齋中書樞密院各賜一餅四人分之宫人往往縷一作覆金花于其上蓋其貴重如此太宗時有待詔賈玄以棊供奉號為國手邇來數十年未有繼者近時有李憨子者頗為人所稱云舉世無敵手然其人狀貌昏濁垢穢不可近蓋里巷庸人也不足置之樽爼間故胡旦嘗語人曰以棊為易解則如旦聰明尚或不能以為難解則愚下小人往往造于精絶信如其言也王副樞疇之夫人梅鼎臣之女也景彞𥘉除樞密副使梅夫人入謝慈壽宫太后問夫人誰家子對曰梅鼎臣女也太后笑曰是梅聖俞家乎由是始知聖俞名聞于宫禁也聖俞在時家甚貧余或至其家飲酒甚醇非常人家所有問其所得云皇親有好學者宛轉致之余又聞皇親有以錢數千購梅詩一篇者其名重于時如此錢思公雖生長富貴而少所嗜好在西洛時嘗語寮屬言平生惟好讀書坐則讀經史卧則讀小説上厠則閲小辭蓋未嘗頃刻釋卷也謝希深亦言宋公垂同在史院每走厠必挾書以往諷誦之聲琅然聞於逺近其篤學如此余因謂希深曰余平生所作文章多在三上乃馬上枕上厠上也蓋惟此尤可以屬思爾國朝宰相最少年者惟王溥罷相時父母皆在人以為榮今富丞相弼入中書時年五十二太夫人在堂康強後三年太夫人薨有司議贈恤之典云無見任宰相丁憂例是歲三月十七日春宴百司已具前一夕有旨富某母喪在殯特罷宴此事亦前世未有皇祐二年嘉祐七年季秋大享皆以大慶殿為明堂蓋明堂者路寢也方于寓祭圜丘斯為近禮明堂額御篆以金填字門牌亦御飛白皆皇祐中所書神翰雄偉勢若飛動余詩云寶墨飛雲動金文耀日晶者謂二牌也錢思公官兼將相階勳品皆第一自云平生不足者不得于黃紙書名每以為恨也三班院所領使臣八千餘人涖事于外其罷而在院者常數百人每歲乾元節醵錢飯僧進香合以祝聖壽謂之香錢判院官常利其餘以為餐錢羣牧司領內外坊監使副判官比他司俸入最優又歲收糞墼錢頗多以充公用故京師為之語曰三班喫香羣牧喫糞也咸平五年南省試進士有教無類賦王沂公為第一賦盛行于世其警句有云神龍異稟猶嗜欲之可求纎草何知尚薰蕕而相假時有輕薄子擬作四句云相國寺前熊翻筋斗望春門外驢舞柘枝議者以謂言雖鄙俚亦著題也國朝之制自學士已上賜金帶者例不佩魚若奉使契丹及館伴北使則佩事巳復去之惟兩府之臣則賜佩謂之重金𥘉太宗嘗曰玉不離石犀不離角可貴者惟金也乃創為金銙之制以賜羣臣方團毬路以賜兩府御仙花以賜學士以上今俗謂毬路為笏頭御仙花為荔枝皆失其本號也宋丞相庠早以文行負重名于時晚年尤精字學嘗手挍郭忠恕佩觽三篇寶玩之其在中書堂吏書牒尾以俗體書宋為宋公見之不肯下筆責堂吏曰吾雖不才尚能見姓書名此不是我姓堂吏惶懼改之乃肯書名京師食店賣酸䭑者皆大出一作書牌榜于通衢而俚俗昧于字法轉酸從食䭑從舀有滑稽子謂人曰彼家所賣餕饀音俊叨不知為何物也飲食四方異宜而名號亦隨時俗言語不同至或傳者轉失其本湯餅唐人謂之不托今俗謂之餺飥矣晉束晳餅賦有饅頭薄持起溲牢九之號惟饅頭至今名存而起溲牢九皆莫曉為何物薄持荀氏又謂之薄夜亦莫知何物也嘉祐八年上元夜賜中書樞密院御筵于相國寺羅漢院國朝之制歲時賜宴多矣自兩制巳上皆與惟上元一夕秖賜中書樞密院雖前兩府見任使相皆不得與也是歲昭文韓相一作公集賢曽公樞密張太尉皆在假不赴惟余與西廳趙侍郎槩副樞胡諌議宿吳諫議奎四人在席酒半相顧四人者皆同時翰林學士相繼登二府前此未有也因相與道玉堂舊事為笑樂遂皆引滿劇飲亦一時之盛事也國朝之制大宴樞密使副不坐侍立殿上既而退就御厨賜食與閣門引進四方館使列坐廡下親王一人伴食每春秋賜衣門謝則與內諸司使副班于垂拱殿外廷中而中書則别班謝于門上故朝中為之語曰厨中賜食階下謝衣蓋樞密使唐制以內臣為之故常與內諸司使副為伍自後唐莊宗用郭崇韜與宰相分秉朝政文事出中書武事出樞密自此之後其權漸盛至今一作本朝遂號為兩府事權進用祿賜禮遇與宰相均惟日趨內朝侍宴賜衣等事尚循唐舊其任隆輔弼之崇而雜用內諸司故事使朝廷制度輕重失序蓋沿革異時囚循不能釐正也蔡君謨既為余書集古録目序刻石其字尤精徑為世所珍余以鼠鬚栗尾筆銅緑筆格大小龍茶惠山泉等物為潤筆君謨大笑以為太清而不俗後月餘有人遺余以清泉香餅一篋者君謨聞之歎曰香餅來遲使我潤筆獨一作猶無此一種佳一無此字物兹又可笑也清泉地名香餅石炭也用以焚香一餅之火可終日不滅梅聖俞以詩知名三十年終不得一館職晚年與修唐書書成未奏而卒士大夫莫不歎惜其𥘉受勑修唐書語其妻刁氏曰吾之修書可謂猢猻入布袋矣刁氏對曰君于仕宦亦何異鮎魚上竹竿耶聞者皆以為善對一作昔梅聖俞以詩名當世然終不得一館職晚年在唐書局充修書官尚冀書成疇勞得一貼職以償素願書垂就而卒時人莫不歎其竒薄其𥘉修唐書也常竊歎曰吾今可謂猢猻入布袋仁宗𥘉立今上為皇子令中書召學士草詔學士王圭當直召至中書諭之王曰此大事也必須面奉聖旨于是求對明日面稟得旨乃草詔羣一作詰公皆以王為真得學士體也盛文肅公豐肌一作肥大腹而眉目清秀丁晉公踈瘦如削二公皆兩浙人也並以文辭知名于時梅學士詢在真宗時巳為名臣至慶曆中為翰林侍讀以卒性喜焚香其在官所每晨起將視事必焚香兩爐以公服罩之撮其袖以出坐定撒開兩袖郁然滿室濃香有竇元賔者五代漢宰相正固之孫也以名家子有文行為館職而不喜修飾經時未嘗沐浴故時人為之語曰盛肥丁瘦梅香竇臭也寶元中趙元昊叛命朝廷命將討伐以鄜延環慶涇原秦鳯四路各置經略安撫招討使余以為一作謂四路皆內地也當如故事置靈夏四面行營招討使今自于境內何所招討余因竊料王師必不能出境其後用兵五六年劉平任福葛懷敏三大將皆自戰其地而大敗由是至于罷兵竟不能出師吕文穆公蒙正以寬厚為宰相太宗尤所眷遇有一朝士家藏古鑑自言能照二百里欲因公弟獻以求知其弟伺間從容言之公笑曰吾面不過楪一作鏡子大安用照二百里其弟遂不復敢言聞者歎服以謂賢于李衛公逺矣蓋寡好而不為物纍者昔賢之所難也國朝百有餘年年號無過九年者開寶九年改為太平興國太平興國九年改為雍熙大中祥符九年改為天禧慶曆九年改為皇祐嘉祐九年改為治平惟天聖盡九年而十年改為明道唐人奏事非表非狀者謂之榜子亦謂之録子今謂之劄子凡羣臣百司上殿奏事兩制以上非時有所奏陳皆用劄子中書樞密院事有不降宣勑者亦用劄子與兩府自相往來亦然若百司申中書皆用狀惟學士院用咨報其實如劄子亦不書一作出名但當直學士一人押字而巳謂之咨報今俗謂草書名為押字也此唐學士舊規也唐世學士院故事近時墮廢殆盡惟此一事在爾燕王元儼太宗幼子也太宗子八人真宗朝六人一無此字巳亡殁至仁宗即位獨燕王在以皇叔之親特見尊禮契丹亦畏其名其疾亟時仁宗幸其宫親為調藥平生未嘗語朝政遺言一二事皆切于理余時知制誥所作贈官制所載皆其實事也華元郡王久良燕王子也性好晝睡每自旦酣寢至暮始興盥一作頮濯櫛漱衣冠而出燃燈燭治家事飲食宴樂逹旦而罷則復寢以終日無日不如此由是一宫之人皆晝睡夕興允良不甚喜聲色亦不為他驕恣惟以夜為晝亦其性之異前世所未有也故觀察使劉從廣燕王壻也嘗語余燕王好坐木馬子坐則不下或飢則便就其上飲食往往乘興奏樂于前酣飲終日亦其性之異也皇子皓封東陽郡王除婺州節度使檢校太傅翰林賈學士黯上言太傅天子師臣也子為父師于體不順中書檢勘自唐以來親王無兼師傅官者蓋自國朝命官秖以差遣為職事自三師三公以降皆是虛名故失于因循爾議者皆以賈言為當也端明殿學士五代後唐時置國朝尤以為貴多以翰林學士兼之其不以翰苑兼職及換職者百年間才兩人特拜程戡王素是也慶曆八年正月十八日夜崇政殿宿衛士作亂于殿前殺傷四人取準備救火長梯登屋入禁中逢一宫人問寢閣在何處宫人不對殺之既而宿直都知聞變領宿衛士入搜索已復逃竄後三日于內城西北角樓中獲一人殺之時內臣楊懷敏受旨獲賊勿殺而倉卒殺之由是竟莫究其事葉子格者自唐中世以後有之説者云因人有姓葉號葉子青一作清或作晉者撰此格因以為名此説非也唐人藏書皆作卷軸其後有葉子其制似今䇿子凡文字有備檢用者卷軸難數卷舒故以葉子寫之如吳彩鸞唐韻李郃彩選之類是也骰子格本備檢用故亦以葉子寫之因以為名爾唐世士人宴聚風行葉子格五代國𥘉猶然後漸廢不傳今其格世或有之而人無知者惟昔楊大年好之仲侍制簡大年門下客也故亦能之大年又取葉子彩一作歌名紅鶴皂鶴者别演為鶴格鄭宣徽戩章郇公得象皆大年門下客也故皆能之余少時亦有此二格後失其本今絶無知者國朝自下湖南始置諸州通判既非副二又非屬官故常與知州爭權每云我是監郡朝廷使我監汝舉動為其所制太祖聞而患之下詔書戒勵使與長吏協和二字一作同押凡文書非與長吏同簽書者所在不得承受施行自此遂稍稍戢然至今州郡往往與通判不和往時有錢昆少卿者家世餘杭人也杭人嗜蟹昆嘗求補外郡人問其所欲何州昆曰但得有螃蟹無通判豦則可矣至今士人以為口實嘉祐二年余與端明韓子華翰長王禹玉侍讀范景仁龍圖梅公儀同知禮部貢舉辟梅聖俞為小試官凡鎖院一有經字五十日六人者相與唱和為古律歌詩一百七十餘篇集為三卷禹玉余為校理時武成王廟所解進士也至此新入翰林與余同院又同知貢舉故禹玉贈余云十五年前出門下最榮今日預東堂余答云昔時叨入武成宫曽看揮毫氣吐虹夢寐間思十年事笑談今此一作日一樽同喜君新賜黃金帶顧我宜為白髮翁也天聖中余舉進士國學南省皆忝第一人薦名其後景仁相繼亦然故景仁贈余云淡墨題名第一人孤生何幸繼前塵也聖俞自天聖中與余為詩友余嘗贈以蟠桃詩有韓孟之戲故至此梅贈余云猶喜共量天下士亦勝東野亦勝韓而子華筆力豪贍公儀文思溫雅而敏捷皆勍敵也前此為南省試官者多窘束條制不少放懷余六人者歡然相得羣居終日長篇險韻衆製交作筆吏疲于寫録僮史一作隸奔走往來間以滑稽嘲謔形一作加于風刺更相酬酢往性烘堂絶倒自謂一時盛事前此未之有也往時學士循唐故事見宰相不具靴笏繫鞋坐玉堂上遣院吏計會堂頭直省官學士將至宰相出迎近時學士始具靴笏至中書與常參官雜坐于客位有移時不得見者學士日益自卑丞相禮亦漸薄蓋一作並習見巳久恬然不復為怪也張堯封者南京進士也纍舉不第家甚貧有善相者謂曰視子之相不過一幕職然君骨貴必享王封人𥘉莫曉其旨其後堯封舉進士及第終于幕職堯封溫成皇后父也后既貴堯封纍贈太師中書令兼尚書令封清河郡王由是始悟相者之言治平二年八月三日大雨一夕都城水深數尺上降詔責躬求直言學士草詔有大臣惕思天變之語上夜批出云淫雨為災專戒不德遽令除去大臣思變之言上之恭已畏天自勵如此章郇公得象與石資政中立素相友善而石喜談一作詼諧嘗戲章云昔時名畫有戴松牛韓幹馬而今有章得象也世言閩人多短小而長大者必為貴人郇公身既長大而語聲如鍾豈出其類者是為異人乎其為相務以厚重鎮止浮競時人稱其德量金橘産于江西以逺難致都人𥘉不識明道景祐初一作中始與竹子俱至京師竹子味酸人不甚喜後遂不至而金橘香清味美置之樽爼間光彩灼爍一作的皪如金彈丸誠珍果也都人初亦不甚貴其後因溫成皇后尤好食之由是價重京師余世家江西見吉州人甚惜此果其欲久留者則于菉豆中藏之可經時不變云橘性熱而豆性涼故能久也凡物有相感者出于自然非人智慮所及皆因其舊俗而習知之今唐鄧間多大柿其初生澀堅實如石凡百十柿以一榠樝置其中榅桲亦可則紅熟爛如泥而可食土人謂之烘柿者非用火乃用此爾淮南人藏鹽酒蟹凡一器數十蟹以皂策半挺置其中則可藏經歲不沙一作損至于薄荷醉貓死貓引竹之類皆世俗常知而翡翠屑金人氣粉犀此二物則世人未知者余家有一玉罌形製甚古而精巧始得之梅聖俞以為碧玉在潁州時嘗以示僚屬坐有兵馬鈐轄鄧保吉者真宗朝老內臣也識之曰此寶器也謂之翡翠云禁中寶物皆藏宜聖庫庫中有翡翠盞一隻所以識也其後豫偶以金環于罌腹信手磨之金屑紛紛而落如硯中磨墨始知翡翠之能屑金也諸藥中犀最難搗必先鎊屑乃入衆藥中搗之衆藥篩羅巳盡而犀屑獨存四字一作犀獨在余偶見一醫僧元達者解犀為小塊子方一寸半許四字一作半寸許以極薄紙裹置于一無此字懷中一有使字近肉以人氣蒸之候氣薰蒸浹洽乘熱投曰中急搗應手如粉因知人氣之能粉犀也然今醫工皆莫有知者石曼卿磊落竒才知名當世氣貌雄偉飲酒過人有劉潛者亦志義之士也常與曼卿為酒敵聞京師沙行王氏新開酒樓遂往造焉對飲終日不交一言王氏怪其所飲過多非常人之量以為異人稍獻肴果益取好酒奉之甚謹二人飲啖自苦慠然不顧至夕殊無酒色相揖而去明日都下喧傳王氏酒樓有二酒仙來飲久之乃知劉石也燕龍圖肅有巧思𥘉為永興推官知府寇萊公好舞柘枝有一鼓甚惜之其鐶忽脫公悵然以問諸匠皆莫知所為燕請以鐶腳為鎖簧內之則不脫矣萊公大喜燕為人寬厚長者博學多聞其漏刻法最精今州郡往往有之劉嶽書儀婚禮有女坐壻之馬鞍父母為之合髻之禮不知用何經義據嶽自敘云以時之所尚者益之則是當時流俗之所為爾嶽當五代干戈之際禮樂廢壞之時不暇講求三王之制度茍取一時世俗所用吉凶儀式略整齊之固不足為後世法矣然而後世猶不能行之今嶽書儀十巳廢其七八其一二僅行于世者一作悉皆茍簡粗略不如本書就中轉失乖繆可為大笑者坐鞍一事爾今之士族當婚之夕以兩倚相背置一馬鞍反令壻坐其上飲以三爵女家遣人三請而後下乃成婚禮謂之上髙坐凡婚家舉族內外姻親與其男女賔客堂上堂下竦立而視者惟壻上高坐為盛禮爾或有偶不及設者則相與悵然咨嗟以為闕禮其轉失乖繆至于如此今雖名儒巨公衣冠舊族莫不皆然嗚呼士大夫不知禮義而與閭閻鄙俚同其習一作所見而不知為非者多矣前日濮園皇伯之議是已豈止坐鞍之繆哉世俗傳訛惟祠廟之名為甚今都城西崇化坊顯聖寺者本名蒲池寺周氏顯德中增廣之更名顯聖而俚俗多道其舊名今轉為菩提寺矣江南有大小孤山在江水中嶷然獨立而世一作俚俗轉孤為姑江側有一石磯謂之澎浪磯遂轉為彭郎磯云彭郎者小姑壻也余嘗過小孤山廟像乃一婦人而勑額為聖母廟豈止俚俗之繆哉西京龍門山夾伊水上自端門望之如雙闕故謂之闕塞而山口有廟曰闕口廟余嘗見其廟像甚勇手持一屠刀尖鋭按膝而坐問之云此乃豁口大王也此尤可笑者爾今世俗言語之訛而舉世君子小人皆同其繆者惟打字爾打丁雅反其義本謂考擊故人相驅以物相擊皆謂之打而工造金銀器亦謂之打可矣蓋有槌一作撾擊之義也至于造舟車者曰打船打車網魚曰打魚汲水曰打水役夫餉飯曰打飯兵士給衣糧曰打衣糧從者執傘曰打傘以糊黏紙曰打黏以丈尺量地曰打量舉手試眼之昏明曰打試至于名儒碩學語皆如此觸事皆謂之打而遍檢字書了無此字丁雅反者其義主考擊之打自音謫疑當作滴耿以字學言之打字從手從丁丁又擊物之聲故音謫耿為是不知因何轉為丁雅也用錢之法自五代以來以七十七為百謂之省陌今市井交易又尅其五謂之依除咸平五年陳恕知貢舉選士最精所解七十二人王沂公曽為第一御試又落其半而及第者三十八人沂公又為第一故京師為語曰南省解一百依除殿前放五十省陌也是歲取人雖少得士最多宰相三人乃沂公與王公隨章公得象參知政事一人韓公億侍讀學士一人李仲容御史中丞一人王臻知制誥一人陳知微而汪白青陽楷二人雖不逹而皆以文學知名當世唐李肇國史輔序云言報應敘鬼神述夢卜近帷箔悉去之紀事實探物理辨疑惑示勸戒採風俗助談笑則書之余之所録大抵以肇為法六字一作亦然而小異于肇者不書人之過惡以謂職非史官而掩惡揚善者君子之志也覽者詳之歸田録卷第二第一段魚畏一作魚怯第九段臨終為句為一作遺第十段真是送燈臺燈一作登第二十段不得于黃紙書名不字上一有惟字第二十四段惶懼一作遑遽第二十六段酒半相顧半一作行第二十九段上竹竿耶耶一作也第五十段薄荷一作葧荷第五十四段余嘗過至繆哉二十六字一作余嘗過小孤山廟下見廟像乃一婦人而俚俗之繆至于如此河北奉使奏草卷下歐陽文忠公集一百十八乞免差人往岢嵐軍築城臣近準朝旨令於河北差兵士二千人往岢嵐軍修城本司尋曾奏乞於間慢路分抽差今奉樞密院劄子奉聖旨如委實人數不足即仰抽差一千人者雖蒙朝廷許減一千人伏緣本路除祁灜定雄霸等州見闕修城兵士外近又節次據滄博州狀申為河水泛漲向著緊急乞差人夫兵士應副功役本司為轄下例各闕人巳牒滄州如河水大假泛漲令應急量差人夫功役博州即見於諸州軍剗刷例各無可抽差方欲奏聞乞朝廷於鄰路抽差應副次今準朝旨令依前降指揮於近便州軍應急抽那臣非不知河北河東俱係邉防路分若本路實有兵數不少臣亦豈敢自私一路妄有占留只緣本路實為闕人處多今若朝廷須令差撥即將轄下見役處罷役那往岢嵐縱河北事有闕誤緣臣巳有奏請朝廷必未深罪其如於事有闕在臣之職不敢不言況今年黃河水勢不類常年即今五月已泛漲如此將來夏末秋𥘉必犬假漲溢本司方别具奏乞於京東西路差人次兼本路役兵多惟河上及修城西山採木等處各有人數河上既不可抽那若抽河北修城兵士與河東修城又兩處事體不異而西山採木蓋為即今諸處分擘七百巳上人禁軍别立指揮各要營房及敵棚樓子防城器用並是緊切不可闕用之物若不於逐處功役內抽人即轄下例各别無間占之人可差伏乞朝廷更賜體恤且乞令河東路一靣應副岢嵐功役謹具再奏聞再奏臣近準朝旨令本路差兵士一千人往岢嵐軍修城臣巳再具劄子奏乞占留其本路黃河及修城採木緊切功役浩大及闕人次第巳具前奏劄子臣伏詳朝廷指揮令於近便州軍應副剗刷勘會本路與河東近便惟有成德軍最近其路出土門經天威軍平定軍至并州又出天門關經憲州飛鳶軍入洪谷一至岢嵐約一千五百餘里據明鎬元奏稱向去二十二箇月方了今縱河北差一千人往彼逺涉一千五百里山險到彼卒未了當將來冬月岢嵐苦寒役兵各須歸營歇泊令一千人往來三千里苦寒山路必致大假逃亡作賊況北虜縱有事宜必先河北河北重地莫如定州今定州所修城池將元計工料及見役人數亦須五六年方了今若更抽減人往河東即河北完緝禦備全然弛廢況除定州外瀛雄祁霸等州修城處亦須向秋兼用強壯一二年內期可了當本司非不能張皇事體煩黷朝廷乞人蓋以北虜即今别無事宜一二年間幸可漸次了當今岢嵐修城功限比定州全小路分事宜緊慢又與河北不同亦未銷得逺涉三千里於緊切處抽人所有德博黃河今年水勢甚大於去年今春朝廷差到河上兵士全少如去歲若旦夕逐州更有申報須至煩朝廷乞人外所有諸處修城功役雖見闕人本司亦當斟量事體緊慢只於本路漸次修葺惟乞朝廷體恤更不抽撥往别路庶免本路闕誤其抽差一千人劄子臣亦未敢施行取進止乞選差文臣知定州臣等伏見知定州李昭亮已抽赴闕見闕知州定州控扼西山險要於河北三路最為重地軍民政事邊鄙機宜須藉通才方能辦集況即今北界見於界首興建寨柵及於銀坊口侵占疆封處置之間或須應變鎮撫之術尤要得人沅河北比於陜西四路事體甚重今秦渭延慶並用文臣伏乞朝廷特於文臣兩制巳上選差一員知定州或便兼部署或别差武臣充部署所貴委任得人邊事有備取進止乞預聞邉事臣昨蒙朝廷選擢差充河北都轉運使之日授到付身不下司劄子云河北宜選有文武才識轉運使二員密授經略之任使其熟圖利害隂為預備以臣非才誠不當文武才識之目其如朝廷責任之意然而必欲密為經略熟圖利害則須外詳邊鄙之事內不為朝廷所疑竭慮盡心猶恐不副委寄檢會去年定州軍城寨為北虜於石臼子口侵入內界卓立鋪屋本寨為地分不屬沿邊安撫司遂依例申報轉運司無何安撫司並不勘會不係地分便發怒妄奏軍城官吏不合申轉運司乞行取勘又蒙朝廷更不照會便下轉運司詰問軍城官吏賴本寨引執元降勑條分明臣與本寨主等偶免罪譴其不屬安撫地分合申轉運司者尚如此其他沿邉係安撫司地分固不得與聞矣昨來北虜於安肅軍北欲移界摽南侵邉臣既承例不以事報轉運司臣心不能安因以手書問知軍侍其濬濬亦不敢答又昨臣寮有起請復支保州沿邊巡檢兵士口食者是臣本路本司職事竊聞本為小人上言不識事體乞不下轉運司朝廷因此只下程琳一靣相度臣竟不得與聞臣既親蒙密授經略之任使其圖利害為預備而外則邉防之事了不聞知內則不足為朝廷取信而本司職事亦不得與議平日無事之時尸祿而居尚當憂愧況聞近日邉鄙頻有事端飛狐界上興立城柵漸貯甲兵又於銀坊冶谷以來壘石為城包侵南界大役人夫卓立堡寨竊慮嚮去沿邉别有事宜臣既授上件劄子內委任之意凡事不可不知兼臣體問得舊日邊上州軍事宜並申轉運司只自通和後漸廢臣今欲乞應係沿邊事宜自來申報安撫部署司者亦乞令逐州軍申報轉運司所貴稍得與聞邉事至於儲畜糧草修城池器械亦量酌事體緊慢不至乖方其間愚慮或有所長更冀禆助萬一而少副委任之意如允臣所請乞明降指揮取進止再奏臣近曾奏為先授朝廷密旨令熟圖河北利害隂為預備然邊防事意元不與聞乞今後沿邉事宜並令申報轉運司至今未奉朝旨者臣伏以轉運使雖合專掌錢榖不與兵戎然河北事體不同他路故授之密旨常使經營況今沿邊知州武臣不過諸司使副巳下其通判即是常參初入京朝官等臣被朝廷責任比沿邉知州通判故不為輕下至機宜司手分亦是轉運司所差並得盡聞機宜事臣之本司獨不得與且臣愚慮非欲侵邉臣之權攬事多管以招罪纍蓋臣所職糧草錢帛蓄積之備其賦斂緩急須量邊事緊慢以至按察沿邉將吏能否亦要知其處事如何伏望朝廷細詳元降不下司劄子內事意及比類沿邉通判初入京朝官等許本司今後與聞邊事所有沿邊申到事宜即不得直便行遣文字苟有所見須令密具奏陳不得下司漏泄如此則本司得知邊事緩急凡於計置準備不至緊慢乖方而又愚見苟有所思亦得少禆萬一取進止乞令邉臣辨明地界臣伏見近日北虜於四望口起立寨柵及於銀坊冶谷巳來侵過南界壘石為城寨等事竊以北虜創立寨柵巳違誓書然猶在彼界內可以佯為不知不須緊問兼萬一中國却合有興修去處可以引彼為詞以塞問難雖然如此亦當早為預備便合於界首分明界防彼亦必更南侵事既造形理須杜漸其如朝廷選任非人從來以定州一路付與李昭亮其人昏懦而不曉事機雖有勾當事人並不能先詗探得起寨事端及已立了寨柵又不能預防侵界之患直至囚捉了巡邉指揮使湯則侵了銀坊以南邉地大興人夫壘立城寨至今終亦不能辨理疆界拒絶侵凌竊以北虜號為犬戎自古畏強欺弱今若便示以怯不爭於初則必更引其貪心别有侵擾養成事體漸大而不與之爭則為患不細爭之則必起事端惟在即今速為處置據今事體不煩朝廷只委邉臣自可了當然湯則𬒳囚之後亦不聞别有擘畫至仐侵界立寨等事但聞婉順止約彼既不聽亦别無謀臣近體問得往年雄州西北亦曾為北戎侵界立數處鋪屋當時邊臣葛懷敏力以公牒往來爭辨拆却鋪屋北人竟不敢爭況今來所侵南界百姓見耕種田中地界分明易為理會今來巳蒙朝廷差王德基知定州其人久在雄州頗諳邊事伏乞早降朝旨下邊臣速令止絶辨理地界早見分明兼軍城西北山路險絶銀坊等口皆可出兵我於此口扼其險要是中國必爭之地彼於今日侵得此一二十里則險固在彼而他日行兵是彼可以來我不可往之勢以此言之尤不比河東陽武天池等處侵地便因循不爭伏乞朝廷早賜指揮王德基如婉順止約不得即須力與論辨仍乞令檢會雄州安撫司等處往年曾拆却鋪屋行遣令依此相度施行所貴邊防不生他患取進止乞差武衛人貟臣昨權成德軍日為屯駐淄州武衛第六十六指揮兵士髙林等乞替曾有劄子奏聞尋蒙朝旨以京東一路所管武衛不少例各差在别路屯駐奉聖旨劄與臣詳此照會者臣尋作本府行遣備録聖旨告示本營知委訖臣今勘會上件武衛兵士共六百三十一人並無正轄官貟只有權管副都頭四人並是往年曾在信安軍作過之人及本營雖有正軍頭十將等八人亦並是曾在信安軍作過之人部轄此六百人思歸之卒久逺深不為便伏乞朝廷檢會早賜自京選差有心力能部轄正副指揮使及逐都正都頭所貴可以部轄久逺别不生事臣亦密體問得權管人貟姓名因依今具如後一人軍頭劉緒三人右十將孫榮田榮蔡斌巳上四人元係本州武衛第九指揮內軍頭及右十將昨於慶曆三年十一月內準州帖準步軍司牒權充第六十六指揮副都頭勾當並未曾正授宣其人等各係曾在信安軍作過之人一人軍頭韓筠七人左右十將四人左徐吉賀進谷興假千三人右王清丁用楚興巳上八人亦元係本州武衛第九指揮將虞候承局昨於慶曆三年正月內授州帖差到於慶曆四年四月授步軍司帖正充六十六指揮勾當亦係曾在信安軍作過人數右具如前所有上件武衛兵士髙林等當京東武衛刺靣排定軍分之時獨此一指揮纍次糾合陳詞今來準密院劄子告示後雖不敢别有詞説然此一軍兵士巳是纍日扇搖人數既多又無正管人貟只令曾作過人權管深為不便伏乞朝廷特賜允臣所奏早與差輔有心力正副指揮使及軍頭等部轄乞住買羊勘會河北自前不曾配買羊畜自西事已來分配於河北收買竊見京師羊畜有備準三司指揮截住榷埸上供羊綱於西路州軍牧放一萬六千餘口至冬深死却五千餘口所有今年人户配買羊巳上京送納訖却儧下榷埸羊綱在邢洺等州牧養竊慮冬深枉有死損臣等相度剩數羊綱見在河北州軍牧養只以盡數上京自可供用得足乞今後河北特住配買羊數委得公私俱利仍乞今後京師羊少却於陜西依舊配買取進止乞條制都作院當司檢會近蒙朝廷依奏差到磁相二州都鐵作院監當使臣二貟各巳赴任訖所有作院工匠營房蓋造亦已了畢當司見揀選轄下州軍內打造得兵器精好處取樣及於本路軍器庫內揀選往時經使舊兵器內試驗精利者取為樣及申三司於南北作坊檢會工課料例及於轄下抽揀工匠令都作院依樣打造次伏緣本路鐵炭出自磁相二州自來諸州軍不以逺近並於磁相般請生鐵差占衙前枉費腳乘般於不出炭州軍廣破官錢買炭變煉及散在逐州軍打造監官多不得人加又當司巡歷地分闊逺每年內不過各到得一次往往有不及到處難為點檢不惟虛破人工物料不少兼更造成不精器械久逺有誤使用今來巳蒙朝旨許置都作院若制置得久逺不廢本路兵器必皆精好其利甚博伏緣創置事初合有諸般規式今具畫一如後伏乞朝廷特賜勑命指揮所貴久逺官吏遵守施行一都作院所造兵器其間雜不急名件欲乞並不得打造只令打造一色切要使用之物箭頭甲葉槍劒手刀等候打造成於本州軍內送納仍令别作一項封樁專準備緩急支與合要州軍除許轉運司支撥本州不得專擅使用所有其餘間雜之物及修輔舊器械並令諸州軍量留工匠自造一本路轉運提刑共四貟欲乞每次季輪一貟專至都作院點檢將前季工課文字磨算造到兵器候見數即依數點檢試驗內手刀及劒每一百口內抽揀三二十口用甲葉或墮錢斫試鋼刃箭頭亦於每一百箇內揀三二十箇安入箭幹用鐵甲硬弓弩試射槍亦試驗鋼刃如是槍刀劒刃軟卷缺及箭頭尖卷鐔折甲葉長闊厚薄不依斤重者並勒專工匠等陪填打造及等第區分一都作院逐作工課欲乞依本州作院起置工課文曆監官與本州知州通判都監依例簽押及旬呈如是一任內造到兵器經轉運提刑點檢並無揀退各得精好即乞據造成萬數批上曆子理為勞績內本監官將見監一任理合入差遣得替優與先次點差如任內更有知州提刑轉運三人保舉即乞與轉官酬獎如逐季點檢揀退三分已上並畫時取勘奏乞重行朝典如知州通判都監候一年終如揀退三分已上亦乞等第責罰如揀退二分本監官乞許本司量罪勘罰如揀退不及分數即工匠干繫人等許點檢官貟酌量勘斷一河北一路諸州軍作院欲乞且令依舊內合行造作及合減罷者乞許當司相度施行候年歲間都作院打造兵器各及萬數可以應副諸處使用即將諸州軍作院工作及舊有監官處漸次減省右謹具如前所有上件畫一事理更乞朝廷特賜詳酌如得允當乞降勑命指揮下本司及磁相州都作院及提點刑獄司等處遵守施行再乞放行皮角臣近為兵興以來改法禁絶民間牛皮筋角等令人户盡底直納入官因此却致官中闕絶使用後來雖亦許破官錢收買緣巳有上項盡底納官禁法民若不納入官却於官埸中賣即是違禁之物致人户不敢赴埸中賣乞却依天聖編勑及前後舊條許人户自死牛馬皮筋角中賣入官分為三等支錢其不及等者退還本主及置埸收買客旅興販者所貴却似舊日公私各獲濟用曾具利害劄子奏聞至今未奉朝旨臣近體問得河東路亦為禁止牛皮筋角巳來闕絶使用近巳却依舊放行即今河東大段有牛皮筋角等使用甚為利便勘會本路合修兵器萬數不少自來纍據諸州乞支物料本司只是牒逐處拘攔使用及申奏乞自京支撥檢會只自今年正月後諸州所少牛皮筋角等七萬一千餘事件纍次申省乞支撥及令逐處拘攔自死者使用據諸州軍所申即云無可拘攔乞行支撥及申奏乞支撥即準省牒又却令逐處拘攔空煩行遣文字繁多積壓下未修軍器萬數終是無由了當況今見行之法其弊易見禁民令盡納則絶無納者置埸妝買則民礙法不敢中賣兼河東近巳放行甚見其利欲乞朝廷檢會臣前奏劄子特賜詳酌明降指揮許依舊法令人户將三等牛皮筋角入官中賣支與價錢及許收買客旅興販者其不中等者退還本主所貴公私各獲濟用不至時時紊煩朝省乞行支撥及不空費文移令逐處拘攔虛積壓下未修軍器久逺深為不便今取進止奏北界爭地界準密院劄子節文北界於銀坊城創修寨壘侵占南界奉聖旨令程琳河北都轉運司提點刑獄司擘畫如何理占拆去者右謹具如前當司勘會昨據定州軍城寨申銀坊城南冶谷口有北界兵馬創起寨子當司尋具聞奏乞下沿邉安撫司施行自後雖知安撫司曾與北界公文往來至今未曾拆去寨子又緣自來安撫司邊機文字不曾關報當司不見得安撫司逐度説何事意如何占理及不知北界却以何詞為答今來巳立寨子貯畜器甲及防戍之人不少事勢巳成竊恐難為追理蓋是邉臣從初失於違慢當其建寨未成之時不早爭占及建寨雖成未貯甲兵之際又不能拆去今已縱成其計却欲理會必須費力兼當司全不知北界與沿邊往復意度見行體問候見次第或有管見别具奏聞次謹具狀奏論契丹侵地界狀右臣伏見北虜近於界首添建城寨及拘囚定州巡兵湯則侵過銀坊冶谷地界等事竊聞朝廷至今未有分明嚴切指揮令邉臣以理爭辨竊料朝廷之意必謂爭之恐有引惹之虞此乃慮之過而計之失也夫虜性貪狠號為犬戎欺弱畏強難示以怯今杜之於早而力為拒絶猶恐不能若縱之不爭而誘其來侵乃是引惹況西山道路有三十餘處皆可行兵其險要所扼在於軍城銀坊等路為彼奪據而不爭則比寨王柳等口漸更來侵豈能爭矣是則西山險要盡為彼奪一日使虜以大兵渡易水由威虜之西平陸而來以竒兵自飛狐出西山諸口而下則我腹背受敵之患不知何以禦之此蓋兵法必爭之地也且與人為鄰敵而自棄險要任彼奪據而不爭雖使我弱彼強尚須勉強何況勢鈞力敵又違誓約而彼曲我直乎臣謂朝廷所以然者蓋由未察虜中強弱之形而不得其情偽之實也臣又見朝廷常有懼虜之色而無憂虜之心夫憂之與懼名近而意殊憂者深思極慮而不敢暫忘懼者臨事惶惑而莫知所措今邉防之事措置多失其機者懼虜之意過深也若能察其強弱之形得其情偽之實則今日之事誠不足懼而將來之患深有可憂奈何不憂其深可憂而反懼其不足懼且戎虜雖以戰射為國而耶律氏自幼承其父祖與中國通和之後未嘗躬戰陳遭勍敵謀臣舊將又皆老死今其臣下如貫寧者無三兩人寧才不及中人巳是彼之傑者所以君臣計事動多不臧當𥘉對梁適遣使河西使與中國通好及議和垂就不能小忍以邀中國厚利乃與元昊爭夾山小族遂至交兵而纍戰纍敗亡人失馬國內瘡痍誅斂山前漢人怨怒往時虜殺漢人者罰漢人殺虜者死近聞反此二法欲恱漢人漢人未能收其心而虜人亦巳怒矣又聞今春女真渤海之類所在離叛攻劫近才稍定方且招輯敗亡修完器甲內恐國中之復叛外有西夏之為虞心自懷疑憂我乘虛而北襲故於界上勉強虛張囚我巡兵侵我地界蓋其實弱而示強者用兵之詭計故臣謂苟能察其強弱知其情偽則無不爭之理何必懼其不足懼哉自國家困於西鄙用兵常慮北戎合謀乘隙而動及見二虜相失而交攻議者皆云中國之福夫幸其相攻為我之福則不幸使其解仇而復合豈不為我禍乎臣謂北虜昨所以敗於元昊者亦其久不用兵驟戰而逢就敵耳聞其自敗衄以來君臣恐懼日夜謀議通招丁口柬募甲兵處處開教閲之埸家家括糧馬之數以其天姿驍徑之俗加以日夜訓練之勤則其強難敵矣今虜國雖未有人然大抵為國者久無事則人難見因用兵則將自出使其交戰既頻而謀臣猛將爭能並出則是夾山一敗警其四十年因循之弊變驕心而為憤志化墯卒而為徑兵因屢戰而得驍將此乃北虜之福非中國之福也此臣所謂將來之患者也然二虜勢非久相攻者也一二年間不能相并則必復合使北虜驅新勵之強兵無西人之後害而南向以窺河北則又將來之患大者也臣雖不知朝廷顧河北為如何但於本路之事以今年較去年則亦可見去年以前河北官吏無大小皆得舉材而擇能急於用人如不及者惟恐一事之失計故也自今春巳來差除漸循舊弊凡幹敏之吏熟於北方事者舉留奏乞百不一從不惟使材臣能吏不勸而殆亦足見朝廷不憂河北之事辦否也至如廢緣邉久任之制而徙劉貽孫以王世文當冀州李中吉當廣信王中庸當保州劉忠順當邢州如此數人於間慢州軍尚憂敗政況於邉要之任乎臣愚以朝廷不以北事為憂則又怯懼如此既曰懼矣則於用人之際又若忽而不憂此臣之所未諭也臣聞虜人侵我冶谷雖立寨屋三十餘間然尚遲延未敢便貯兵甲更伺我意緊慢若不及早毀拆而少緩縱之使其以兵守之則尤難爭矣此旦夕之間不可失也至於湯則亦聞囚而未敢殺此亦不可不爭臣願陛下但以將來之患為憂不忘此事用人之際草去舊例而惟材是擇勿聽小人之繆謀勿於忠良而疑二使得上下畢力庶幾漸成禦備至於目今小事未銷過自怯懼夫事之利害激切而言則議者以為太過言不激切則聽者或未動心此自古以為難也況未形之事雖曰必然而敢冀盡信乎伏望陛下留意聽納不以人廢言則庶竭愚瞽少禆萬一謹具狀奏聞謹奏論河北財産上時相書某頓首啓仲春漸暄伏惟相公尊體動止萬福某不佞少以文章言語自任而頃備諫諍之臣得與朝廷論議當中外多事天子急於聽納之時不以為愚而屢加獎擢及得寵太過受恩太深則自視區區素所任者不足以報一作稱萬一故方欲勉強不能以圖自五字一作以伸報效而蒙相公不以為不才而擇天下諸路中最重之地以授之而責其所為一作報效當此之時自宜如何可以塞責及臨職以來逮一作近將半歲齷齪自守未知所措一作為非敢怠也誠有説也一作焉至於山川險易城寨屯防邉陲守備等事是皆河朔之大者朝廷巳委樞密富公經畫之矣而本司之事自不為少凡自河以北州軍縣寨一作州府軍縣一百八十有七城主客之民七十萬五千有七百户官吏在職者一千二百餘貟廂禁軍馬義勇民兵四十七萬七千人騎歲支糧草錢帛二千四百四十五萬而非常之用不與焉其間事目之節利害之源非詳求而審察之不能得其要前張昷之等急於舉職公家之利知無不為其興利除害便於事者極多而時有失於不審更改過繁而涉一作失於苛碎者故自繼職以來遵其所長戒其所短凡事關利害者慎之重之未敢輕議今半歲矣官吏之能否公私之弊病粗已得其十七八而又取一作先求其事涉苛碎紛繁而下切患之有司自可改復不煩朝廷處分者先以次第行之乃暇及於其它然其事繫利害有司不敢自決必當一作而必上聞者其類甚多而久之一作初則未敢干一作以煩朝聽者不惟自疑於不審誠慮朝廷鑒昷之等前失不能盡信其説而必一無必字從之今慎之久矣得之詳矣苟有所請實有望於見信而從之也凡河北大事富公經營之外其要不過五六其一作凡不可為者一其可為者四五耳雖皆有司之事然朝廷主張之則能行不主張之則亦不能為也自古邦國財産之利必出山澤故傳曰山海天地之藏也自兩漢以來􅎥山煮海之利必歸公上而今天下諸路山澤悉巳榷之無遺利矣獨河北一方兵民所聚最為重地而東負大海西有髙山此財利之産天地之藏而主計之吏皆不得取焉祖宗時哀閔河北之民歲為夷狄所困盡以海鹽之利乞與疲民此國家恩德在人巳深而不可奪者也西山之長數百里其産金銀銅鐵丹砂之類無所不有至寶久伏于下而光氣苗礦往往溢發而出地官禁之不許取故捨此惟有平地耳河北之地四方不及千里而緣邉廣信安肅順安雄霸之間盡為塘水民不得耕者十八九澶衛德博濵棣通利大名之界東與南歲歲河災民不得耕者十五六今年大豐秋稅尚放一百萬石滄瀛深冀邢洺大名之界西與北鹹鹵大小鹽池民不得耕者十三四又有泊淀不毛監馬棚牧與夫貧乏之逃而荒棄者不可勝數大山大海之利既不可取而平地堪出財賦者又有限而不取一作又不多其助者不過酒稅之入耳其入有數而用度無常也故雖研桑之心計捨山澤與平地不能為之此所謂不可為者一也一本無此九字及其用有不足不過上干朝廷乞銀絹而配一作下殃疲民號為變轉爾此近年之弊也此六字一作所謂不可為者二也然若能擇官吏以辦職事裁僥幸以減浮費謹良材精器械以助武備因貴賤通漕運而移有無如此之類苟能為之尚可使邉防粗足而京師省費用此冀此三字一作尚足以禆萬一而皆有弊病理須更改事目委曲非書可殫敢具其大綱列于别𥿄伏望特加省覽察其利害或其所説不至大乖戻望少信而從之俾畢其所為若夫盡其所為而卒無成焉則不待朝廷之責而自當劾去若其有以禆萬一則何幸如之伏惟聰明少賜裁擇不宣某頓首再拜自劾乞罷轉運使右臣檢會轉運司近為相度順安軍塘泊水口子與楊懷敏等所奏頗有異同議方未決近準樞密院劄子節文臣寮奏乞今後近塘泊州軍人户地內蘆葦等並不得採取及自順安軍以西漸近西山水難潴聚今即不住開治及乞今後摽占却人户田土即將官地給還人户或估計價錢給付等第奉聖旨依奏仍令本路提刑田京專切管勾者臣伏見國朝之制河北轉運使皆領都大制置屯田使之名兼臣赴職之初𬒳朝旨密授經略之任以此見朝廷差選之際其任非輕於臣職分之間所責尤重至於塘泊邊防利害之事皆其職也職隳其守咎將安歸豈有親蒙密授經略之旨身領都大制置之名而煩朝廷别委他官專切管勾則臣之不才不能任事不待彈劾可以自知況臣將及期年絶無績效考其常課巳合黜幽又以不才失其本職且都大制置豈是假人之虛名苟非其人自當易去豈可容不才之人尸位移本職於他司使臣偷安實難自處伏望聖慈據臣不才失職之狀降授一小郡差遣庶以警勸在位之人臣無任祈天望聖激切屛營之至謹具狀自劾奏聞伏候勑旨河北奉使奏草卷下河東奉使奏草卷下歐陽文忠公集一百十六乞減放逃户和糴劄子臣伏見河東百姓科配最重者額定和糴糧草五百萬石往時所糴之物官支價直不虧百姓盡得茶絲見錢自兵興數年糧草之價數倍踴貴而官支價直十分無二三百姓每於邊上納米一斗用錢叄伯文而官支價錢三十內二十折得朽惡下色茶草價大約類此遂致百姓貧困逃移而州縣例不申舉其本户二稅和糴不與開閣稅則户長陪納和糴則村户均攤已逃者既破其家而未逃者科配日重臣至代州崞縣纍據百姓陳狀其一村有逃及一半人户者尚納全村和糴舊額均配與見在人臣兼曽差大理寺丞史談檢得嵐州平夷一縣已逃未檢人户共四十一户諸州似此者甚衆臣今欲乞下轉運司差清幹官三兩人於并代等十五州軍係有和糴處檢括已逃人户其逐户下二稅和糴額定數目並與倚閣候招輯得人户歸業各令依舊均配仍許諸縣人户見均攤著和糴及户長陪納逃稅者列狀自陳所貴重困之民免此重疊科配請耕禁地劄子臣昨奉使河東相度沿邊經久利害臣竊見河東之患患在盡禁沿邊之地不許人耕而私糴北界斛斗以為邊儲其大害有四以臣相度今若募人耕植禁地則去四大害而有四大利河東地形山險輦運不通邊地既禁則沿邊乏食每歲仰河東一路稅賦和糴入中和博斛斗支往沿邊人户既阻險逺不能輦運遂賫金銀絹銅錢等物就沿邊貴價私糴北界斛斗北界禁民以粟馬南入我境其法至死今邊民冒禁私相交易時引爭鬪輒相斫射萬一興訟遂構事端其引惹之患一也今吾有地不自耕植而偷糴鄰界之物以仰給若敵常歲豐及緩法不察而米過吾界則尚有可望萬一虜歲不豐或其與我有隙頓嚴邊界禁約而閉糴不通則我軍遂至乏食是我師飢飽繫在敵人其患二也代州岢嵐寧化火山四州軍沿邊地既不耕荒無定主虜人得以侵占往時代州陽武寨為蘇直等爭界訟久不決卒侵却二三十里見今寧化軍天池之側杜思榮等又來爭侵經年未決岢嵐軍爭掘界壕賴米光濬多方力拒而定是自空其地引惹北人歲歲爭界其害三也禁膏腴之地不耕而困民之力以逺輸其害四也臣謂禁地若耕則一二歲間北界斛斗可以不糴則邊民無爭糴引惹之害我軍無飢飽在敵之害沿邊地有定主無爭界之害邊州自有粟則內地之民無逺輸之害是謂去四大害而有四大利今四州軍地可二三萬頃若盡耕之則其利歲可得三五百萬石伏望聖慈特十兩府商議如可施行則召募耕種稅入之法各有事目容臣續具條陳取進止乞減樂平縣課額劄子臣昨至河東據平定軍知樂平縣孫直方狀為本縣酒稅課利錢舊額四千一百餘貫本縣不當驛路舊有兵士四指揮軍營在縣自慶曆三年三月內移起軍營往并州在縣只有居民百餘户人煙既少客旅不來酒稅課利無由趂辦本軍亦曽申奏乞行減額省司下轉運司保明尋蒙轉運司令將起移軍營後一年比較重立祖額只及二千八百餘貫亦曽差遼州知州孟濟定奪及轉運司保明申省省司指揮勒本縣收趂課利不得減額臣勘會平定軍樂平縣最處孤僻若無軍營人户絶少實難趂辦課利見今專副等逐月逐季逐年各有比較決責未嘗虛日及虛令監官殿降考第臣今欲乞特降勑旨下轉運司令自起却樂平縣軍營後來一年內所收課利立為祖額與免舊額虛數所貴專副不至重疊𬒳刑監官虛負殿罰取進止乞放麟州百姓沽酒劄子臣伏見麟州元是百姓沽酒自經事宜後來轉運司擘畫官自開沽臣昨令本州勘會一年自去年十二月開沽至今年六月用米麴本錢三千五百貫所收淨利只及一千八百貫然官私勞費不少自并嵐等州造麴千里般運又配百姓造酒黃米逺行輸納麟州自經賊馬後來人户才有三二百家又榷其沽酒之利市肆頓無營運居者各欲逃移今來麟州既不移廢則凡事却須葺理其沽酒之利官中所得不多而勞費甚大臣今欲乞令百姓依舊開沽所貴存養一州人户漸成生業今取進止舉孫直方奏狀右臣伏見平定軍知樂平縣事著作佐郎孫直方進士及第為性明敏有吏材臣昨至河東備見直方治縣事善狀臣今保舉堪充大藩通判兼臣勘會代州通判李舜元到任已及二年三箇月有餘見今北面事宜代州最為要地尤藉得人伏乞就差孫直方充代州通判如後犯正入已贓及職事敗闕並甘同罪謹具狀奏聞條列文武官材能劄子臣昨奉勑差往河東體量得一路官吏才能善惡其間文武官共二十五人各有所長堪備任使今具姓名條列如後一戰將八人緩急可以使喚如京使孟元知兵書踈財善撫士然未經戰陳內殿承制郝質沉厚有勇善用兵纍經戰陳北作坊使田朏有勇纍戰有功崇儀副使王吉臣已有論薦禮賔副使張􅯀河西人有武勇智謀善戰百勝寨主折繼長有勇好戰曽立功權鎮川堡陳懷順府州人有勇好戰麟州兵馬都監田嶼有勇好戰一武臣中材幹者三人岢嵐軍使米光濬已曽薦舉知保德軍劉承嗣建寧寨主陳昭兼有勇好戰未曽經行陳岢嵐軍五谷巡檢夏侯合一通判中五人可以升陟差使并州通判祕書丞張日用通曉民事嵐州通判殿中丞董沔清潔勤於吏事寧化軍通判大理寺丞武陶勤幹屯田貟外郎麟州通判孫預清勤保德軍通判贊善大夫吳中廉幹一知縣令州縣職官中材幹可用者九人著作佐郎知平定軍樂平縣事孫直方代州崞縣令王旭府州簽署判官公事史談絳州稷山縣令劉處中潞州屯田縣令張曜縣尉王荀龍大理寺丞知并州陽曲縣事張景儉知并州大谷縣張伯玉大理寺丞知榆次縣吳天常岢嵐軍嵐谷縣尉安吉右謹具如前伏乞聖旨送中書樞密院記録姓名差使今取進止舉劉羲叟劄子臣昨奉勑差往河東伏見澤州進士劉羲叟有純朴之行為鄉里所稱博涉經史明於治亂其學通天人禍福之際可與漢之歆向張衡郎顗之徒為比致之朝廷可備顧問伏乞特賜召試或不如所舉臣甘當朝典今取進止繳進劉羲叟春秋災異奏狀右臣近曽薦舉澤州進士劉羲叟學通天人禍福之際如漢歆向張衡郎顗之比乞賜召試升之朝廷可備顧門臣今有收得劉羲叟所撰春秋災異集一册其辭章精博學識該明論議有出於古人文字可行於當世然止是羲叟所學之一端其學業通博詰之不可窮屈其文字一册臣今謹具進呈伏望聖慈下兩制看詳如有可採乞早賜召試謹具狀奏聞論代州開壕事宜劄子臣昨到代州見其城壁甚堅壕雖三重而地髙無水惟一面有城中棄水停聚其壕不足恃以為固然尚為三重髙下相連猶可以隔奔突近年有臣寮擘畫欲掘出重岸通為一壕以臣相度若壕無水而通為一則坦為平地不異無壕又工料極大去年大役鄉兵所開未及三二分又治險為平非自固之計兼工大猝難了當虛勞人力欲乞特賜止絶取進止舉張旨代王凱劄子臣昨至河東伏見西京作坊使王凱見在麟府路勾當軍馬司公事此一職乃是河外將領其任非輕凱雖將家姿性柔謹雖聞前後纍經戰鬪而詢訪彼中衆議皆云得功非實冒賞最多見今勾當軍馬一司雖無大過而軍民將校不得其情衆口紛然莫能服衆臣亦纍詢其緼畜絶無所長緩急邊防事宜必不能指揮諸將奮勇立功況其在彼將及二年伏見河東提點刑獄職方貟外郎張旨為人有心力膽勇材幹可稱先在府州經第一次圍閉倉卒之際應變有謀至今府人思之不巳兼諳知邊事曉逹軍情臣今保舉堪充邊將任使欲乞特出聖恩與超換一近上使名令代王凱庶幾緩急可捍邊防如蒙朝廷擢用後犯正入已贓及邊事敗悮臣並甘同罪今取進旨論不才官吏狀臣昨往河東一路所見官吏內有全然不任其職須至替移者今具姓名如後一知澤州度支郎中直史館鮑亞之年老昏昧視聽不明行步艱澀本州職事全然不治昨轉運使劉京至澤州決遣公人手分六十餘人兼信縱手分拆諸縣村學要蓋州學及斂掠人户錢一千餘貫充蓋造州學使用等事件甚多其人西京廣有家活而昏病之年貪祿不止伏乞轉與一致仕官一知汾州虞部郎中范尹年老昏昧不能檢束子弟在州販賣搔擾人民伏乞特與一致仕官一憲州通判國子博士劉與年及七十行步艱難精神昏昧雖巳得替伏乞特與一致仕官一平定軍樂平縣監酒借職石貴本是軍中出職因捉賊不獲降充監當其人不識字又是獨貟如允臣所奏乞下樞密院三班著為定令右謹具如前今取進止乞罷刈白草劄子臣昨至河東問得去年轉運司擘畫於諸州軍差兵士收刈白草數目雖多然其害不淺臣所過州軍皆稱白草為患蓋河東山嶮地土平闊處少髙山峻坂並為人户耕種惟荒間草地去人絶逺兼又不多兵士收刈般擔地里闊逺工課不辦其兵士往往逃亡州縣遂差鄉兵及村民配數般擔百姓避見逺般辛苦褁費又多遂只將稈草送納非次更成一重科配其納下真白草者支與軍人餵馬不及稈草又皆不樂及草埸中不耐停留專副有損爛陪填之患兼虛占却雜役兵士諸處修輔城壁諸般工役處處闕人不便事多臣今略舉數事如後一據遼州狀分析勘會在州及外縣寨專副楊晸等下山白草共肆萬柒阡伍伯陸拾肆束內在州每月約支叄伯一拾叄束及外縣寨每月約支一伯肆拾餘束約得向去捌年零柒箇月支遣其上件山白草自去年八月巳後至年終本州及外縣鎮差兵士并散從官步奏官承符手力諸色公人等入山收刈到逐旋般運赴埸送納積疊收管其上件山白草若經今夏雨水必是大段損爛不堪經久存留委是詣實一臣昨六月中旬內至保德軍聞得本處白草差百姓公人般擔至今尚未了疑其白草是去年秋間刈下積露田野必須損爛因採問得村外白草巳並無其差配著擔草人户却於請白草兵士處旋買納官每一馱子三百文省一據岢嵐軍狀自八月二日起首至十月三日住止元差兵士一千三十八人至放散日逃亡一百三十六人只有九百餘人入役收刈到草玖萬二千九百餘束將軍人請受諸般錢物計七千三百七十二貫文若比算買草價錢每束及七十九文省一平定軍元差宣毅兵士刈草本軍為兵士辛苦逃亡及自縊者一月中四五十人遂枚散兵士差兩縣村民往往只將稈草送納欣州亦為刈下無人般擔配與百姓人户亦多將稈草送納右具如前其諸州軍各稱白草不便不能一一條列伏乞特降朝旨速令止絶緣臣昨七月𥘉離汾州見轉運司已抽晉絳兵士稱於沿邊刈草竊恐即今已下手收刈乞早降指揮放散況勘會本路一年秋稅和糴等草共五百餘萬束慶曆三年一年只支四百餘萬今年馬軍抽減歸京後馬數少於去年其稈草等數必不至闕少今取進止乞免浮客及下等人户差科劄子臣昨見河東人民疲弊道路怨嗟蓋自兵革一興調斂繁重今兵未能減用未能節但當恤其貧困稍得均平則民力粗寬怨嗟可息往時因為臣寮起請將天下州縣城郭人户分為十等差科當定户之時繫其官吏能否有只將堪任差配人户定為十等者有將城邑之民不問貧窮孤老盡充十等者有只將主户為十等者有并客户亦定十等者州縣大小貧冨既各不同而等第差科之間又由官吏臨時均配就中僻小州縣官吏多非其人是小處貧民常苦重斂河東諸州并州最大遼州最小并州客户不入等第遼州盡入等第臣昨至遼州人户纍有詞狀遂牒本州據州狀稱檢估得第七等一户髙榮家業共直十四貫文省其人賣松明為活第五等一户韓嗣家業二十七貫文第八等一户韓祕家業九貫文第四等一户開餅店為活日掠房錢六文其餘嵐憲等州岢嵐寧化等軍並係僻小凋殘之處其十等人户內有賣水賣柴及孤老婦人不能自存者並一例科配臣勘會慶曆三年一年諸州軍科配惟并遼州火山軍三處第九第十兩等人户免得配率若并州免得則他處豈可不免蓋由官吏臨時均配是致不均臣今欲乞特降朝旨下河東路一槩將貧民下户減放差配今具畫一如後一并州最大在城浮客不入等第遼州最小縣郭浮客盡充等第臣今欲乞將遼州客户比類并州特與放免等第其岢嵐保德軍嵐欣等州亦有浮客充等第者緣彼處浮客當屯兵之地經營物力過於主户尚堪差配遼州荒僻與近邊州郡不同乞特與放免一臣體問得河北陜西二路州縣科配止於第六第七等今河東除并遼火山三處外並差配下及十等臣今欲相度并晉絳潞汾澤等六州在河東物力比他州富實其第九第十兩等人户乞與免差配其餘州軍第八第九第十三等人户並乞特與放免差配取進止乞免蒿頭酒户課利劄子臣竊見河東買撲酒户自兵興數年不計逺近並將月納課利支往邊上折納米粟近又轉運司擘畫將課利稍多者四十九處並巳官自開沽其餘衙前百姓買撲者皆是利薄之處其衙前公人差遣重難百倍往日而酬獎埸務有利處官已奪之其見今利薄埸務又更有邊逺折納陪填之費兊欠課額破家業𬒳鞭撲不堪其苦其百姓買撲者自兵興以來苦於支移輸納並無人肯承替有開沽五七年十年已上者家業已破酒務不開而空納課利民間謂之蒿頭供輸臣昨至欣州據百姓陳明狀稱元有蓋順天禧四年買撲酒務至乾興元年身死家破什保人陳明等蒿頭代納至今二十五年臣遂差崞縣令王旭於欣代二州一一點檢酒户見今開沽及即目正名身死人户蒿頭代納者尋據王旭狀列一十八户係正名身死什保人開沽送納十二户係並無人開沽只是什保及干繫公人里正等陪納及什保人家破後來承買什保人産業户下蒿頭代納臣略行勘會二州已有三十户則諸州其數極多臣今欲乞下轉運司差官遍詣諸州點檢應有蒿頭供納者並與開閣放免係代保人開沽并正名買撲見開沽人並乞特與權免支移邊上三二年所貴利薄酒户稍獲寬舒況今沿邊糧儲不至闕少舉陸詢武劄子臣昨奉使河東得西頭供奉官并代州駐泊都監米光濬西京作坊使并代州鈐轄王凱四方館使并代州鈐轄張亢內殿承制并代州都監郝質供備庫使并代州都監田朏崇儀副使麟府路都監王吉等六狀各為進士陸詢武有材勇久在邊上纍曽隨諸將戰鬪乞朝廷録用臣亦曽召詢武詢問其人曽應進士舉熟知邊事通習兵書善弓馬有膽勇伏乞朝廷特賜收録與一借奉職或縣尉名目安排令於邊防或內地多賊縣分展效如後本人犯入已贓及不如舉狀臣並甘同罪今取進止論舉官未行劄子臣近曽有劄子奏舉河東路提點刑獄張旨乞超換一近上使額替王凱勾當麟府路軍馬公事兼奏舉平定軍知樂平縣孫直方堪充代州通判替李舜元各未蒙朝廷棹用臣伏見近日保州兵士作過與國家生一大患尺為知州通判非人不能早察軍情制於永亂朝廷以此可為鑒戒王凱在河外不得軍民之情及李舜元不曉邊郡事體臣所舉張旨孫直方並無僥幸但以臣忝在兩制奉朝命巡行邊郡所見宦吏能否合有陳列兼臣並是同罪保舉伏望朝廷特加信納其張旨孫直方早與升擢移換論永寧軍捉獲作過兵士劄子臣近據永寧軍捉獲作過兵士已曽具結集作過因依聞奏訖蓋以河北屯聚兵馬雖多自來未有威名將帥鎮撫而卒士驕狠相習為常昨自保州變亂之後安肅軍衛州通利軍等處相繼結集不已只如今來趙牧等本亦别無酷虐情狀只是偶然柬試不當況自有部署轉運提點刑獄司等處自可依公論訴豈得小不如意便謀結集以此見雖是官吏乖方亦由驕兵好亂臣伏見有唐驕兵逐帥之禍起自河北始務姑息養成大患況今河北為國家重地事之利害所繫不輕尤宜逺慮周思防微杜漸今官吏敗事偶寬責罰未至失刑若驕兵過示姑息一啓其端則他時有不可制之患昨保州之事知州通判並遭殺害其餘官吏各重行責降至今保兵自為得志動皆引以為言而即目統兵之官亦自始以為戒軍威日削士氣益驕今永寧之事亦因兹而馴致也其趙牧等雖為可罪若便重行黜責則河北驕兵結集竊恐自此漸多開啓其端養成後患以此而言趙牧等可罪之人誠不足惜所可惜者朝廷事體也其趙牧等欲乞候斷訖作過兵士且與移一河北鄰近依舊資序差遣不使驕兵得志而後患轉滋必欲更行移降事疑朝旨定逾時亦未為晚河東奉使奏草卷下濮議卷第二歐陽文忠公集一百二十一或問罷議之詔有權罷之文議者謂權罷者有待之言也蓋朝廷迫於皇太后不得已而罷故云權罷者欲俟皇太后千秋萬歲後復議追崇耳朝廷之意果如是乎答曰此厚誣之一事也使朝廷果有此意手詔雖無權字他日别議追崇何施不可何必先露此意示人是時臺諌方吹毛求疵以指為朝廷過失若君臣果有此意亦當深謀密計豈肯明著詔令以資言者之口問者曰然則何故云權罷答曰事體自當如此爾追崇以彰聖君之孝而示天下也本無中罷之理今不得己而罷當為迤邐之辭故云㩲罷集議更令禮官徐求典禮者乃體當如此一有耳字此事人所易知而吕誨等欲恐迫人主故厚誣以有待之説也先帝每語及此事則不勝其憤仰天而歎曰天鑒在上豈有此心或問皇太后既巳責中書不當議稱皇考而手書復有稱皇稱后等事議者謂韓琦交結髙居簡惑亂皇太后請降手書其稱親稱皇稱后皆非皇太后本意果若是乎答曰手書非皇太后本意事出禁中非外人所得知也若云因韓琦使髙居簡請降手書則又厚誣也何以明之若手書是韓琦所請既降出便合奉行豈敢却有沮難又請上别降手詔也以此而言但見韓琦沮止手書稱皇稱后二事不見琦請降手書一作詔也問者又曰然則出於上意乎答曰亦非也若出於上意亦一作則當先諭中書商議安得絶無一言及之又若上意果有所主而中書雖欲不奉行猶須再三論列方可回聖意豈有韓琦一言上即從之略無難色以此知上意不主也問者又曰然則稱皇稱后是哀桓之事中書以為非而不奉行者也而吕誨表乃一作反云致主之謀不耻哀桓之亂制者何謂也答曰此所以為厚誣也且稱親置園寢及稱皇考皆是漢宣光故事吕誨等指以為哀桓之亂制乃是指鹿為馬爾以此見其誣罔何所不至也據漢書師丹上疏云定陶恭皇諡號既已前定義不可復改據此則恭王稱皇乃師丹許以為是者故云不可復改爾昨國家於濮王固自不議稱皇就使稱皇亦是師丹所許者也問者曰若此則師丹當時與漢爭論何事答曰董宏欲去定陶國號而止稱恭皇及欲立廟亰師爾此二事是師丹所爭也蓋恭皇之號常繫於定陶則自是於諸侯國稱皇爾與漢不相千也若止稱恭皇而不繫以國則有進干漢統之漸又立廟京師則亂漢宗廟此師丹不得不爭也昨濮王既不稱皇而立廟止在濮園事無差僣而吕誨等動以師丹自比不知朝廷有何過舉誨等果爭論何事也問者曰誨等所論者稱親也稱親果是乎答曰稱親是矣此乃漢宣故事也謹按宣帝之父曰史皇孫初丞相蔡義議稱親諡曰悼裁置奉邑而已其後魏相始改親稱皇考而立廟京師至哀帝時議毁漢廟不合禮經者于是毀悼皇考廟在京師者是時丞相平晏等百餘人議曰親諡曰悼裁置奉邑皆應經義由是言之立廟京師則當毁稱親置奉邑則自合經義也所謂應經義者即儀禮云為人後者為其父母報是也親者父母之稱也問者曰京師廟既毀而又毁奉明園者何也答曰漢制宗室諸矦王皆有園悼皇考自合置園初名奉明園置奉邑三百家可矣其後增為一千六百家而改奉明園為縣則僣天子之制矣故議毁之也今國家追崇濮王其禮數三而已稱親一也置園二也立廟三也稱親則漢儒所謂應經義者也置園則漢宗室諸矦王之制也立廟則一品家廟之制也如漢諸王廟當在本國今濮國一有為字虛名無立廟處故即園而立廟爾其依經合古可以為萬世法也問者曰漢儒既以稱親為應經義又以兩統二父為非一有禮字者何謂也豈其議自相矛楯乎答曰兩議皆是不相矛楯也其𥘉稱親而置邑也止在下國與漢朝不相干故不違經義也及其後立廟于京師與漢祖宗並立至元帝時議毁親盡之廟時昭帝既以親未盡不毁悼皇考亦以親未盡不毁是則悼皇考與漢祖宗並為世數此為一作所謂兩統二父也元帝既上承昭宣而又承悼皇考為世所謂違離祖統者其議皆是也使悼皇考廟在奉明園而不與漢朝宗廟相干豈有兩統二父之説乎問者曰父有二乎答曰何止二也父之別有五母之別有八皆見于經與禮而父之別曰父也所生父也所後父也同居繼父也不同居繼父也不同居繼父者父死而母再適人子從而暫寓其家後去而異居矣猶以暫寓其家之恩終身謂其人為父而所生父者天性之親也反不得謂之父是可謂不知輕重者也問者曰父母之名果不可改乎對曰能深嫉為後者尊其父母莫如魏明帝也明帝之詔曰有謂考為皇稱妣為后者大臣共誅之然則稱皇與后是其所禁而考妣之名雖明帝不能易也明帝之不能易是不可改也問者曰所生所後父之名徒見于禮文而今世未嘗用也今公卿士大夫至于庶人之家養子為後者皆以一有其字所生父為伯叔久矣一旦欲用古禮而違世異俗其能使衆論不喧乎答曰禮之廢失久矣始于閭閻鄙俚之人不知義禮者壞之而士族之家因相習見遂以成風然國家之典禮則具存也今士大夫峩冠束帶立于朝廷號為儒學之臣為天子議禮乃欲不遵祖宗之典禮謂開寶通禮五服年月等書而徇閭閻鄙俚之弊事此非臣某之所敢知也使臣以此得罪臣固無慙而不悔也況所謂以養子所生為伯叔父者今但行于私家爾有司之議禮議律則未嘗不遵典禮也方禮官議以濮王為皇伯也是時王子融卒初故相王曽之無子也以其兄子融之子繹為後及子融之死也禮官議繹服所生父齊衰期而心喪三年夫以子融為所生父是典禮也以濮王為伯是閭閻之所稱也兩議並發于一時而為臣下議則用典禮為天子議則用閭閻其任情顛倒有如此而人莫與之辨也問者曰或謂所生父之名出于喪服記止可為議服而言其他不可稱也果若是乎答曰律言所養父殺其所生父聽其子告者又豈因議服而言乎問者曰禮有明文一作禮存父名而世不用者何也答曰聖人以立後為公不畏人知故不諱不諱則其子必有所生父母也小人不知義禮以養子為私畏人知之故諱其自有父母欲一心以為我生之子故惟恐諱之不密也嘗試論之曰一本無比五字古之不幸無子而以其同宗之子為後者聖人許之著之禮經而不諱也而後世閭閻鄙俚之人則諱之諱之則不勝其欺與偽也故其苟偷竊取嬰孩襁褓之子諱其父母而自欺以為我生之子曰不如此則不得其一志盡愛于我而其心必二也而為其子者亦自諱其所生而絶其天性之親反視以為叔伯父以此欺其九族而亂其人鬼親踈之序凡物生而有知未有不愛其父母者使是子也能忍一有而字真絶其天性歟曽禽獸之不若也使其不忍而外陽絶之是大偽也夫閭閻鄙俚之人之一作其慮于事者亦已深矣然而茍竊欺偽不可以為法者小人之事也惟聖人則不然以為人道莫大于繼絶此萬世之通制而天下之至公也何必諱哉所謂子者未有不由父母而生者也故為人後者必有所生之父此理之自然也其簡易明白不茍不竊不欺不偽可以為通制而公行者聖人之法也又以謂為人後者所承重故加其服以斬而所生之親恩有屈于義故降其服以期服可降父母之名不可諱故著於經曰為人後者為其父母報目三代以來有天下國家者莫不用之問者曰以濮王稱親則於仁宗之意如何答曰大哉仁宗皇帝之至聖至明也知立後為公不畏人知而不諱也故明詔天下曰是濮安懿王之子也然則濮安懿王者為所生父可知矣此仁宗先告于天下矣所謂簡易明白不苟不竊不欺不偽者聖人之法也問者曰議者以謂恭愛之心分施於彼則不得專一於此也此兩制議稱皇伯議狀之文也如是則恭愛可專施於一而不分施於二也使上之待濮王也既不施恭又不施愛是以行路之人待其所生也不亦過乎答曰行路之人遇其鄉閭之長者與有德者則必竦然有肅恭之容遇其交遊故舊久不相見者則必欣然有歡愛之語今遇其所生而既不施恭又不施愛是不如行路之人也忍為斯言者誰乎君子之為言也度可行於已然後可責於人今斯人也偶不為人後耳使其自度為人後而能以不恭不愛待其父母則能忍而為此言也問者曰為人後而不絶其所生之恩者施於臣民可矣施於國家而有宗廟社稷之重則將干乎正統奈何答曰濮園之稱親立廟今二歲矣而與宗廟朝廷了不相關也其於正統有何所干乎於此足以見言者之誣罔也復何疑乎濮議卷第二表奏書啓四六集卷第二歐陽文忠公集九十一謝賜對衣狀至和元年六月右臣伏以粹然玉色方覲於清光賁以身章遽蒙於寵賜授受之際兢懼交相伏念臣材靡及中器非周用遘光華之在旦荷榮祿以逾涯非惟罪謗之多罹實亦禍罰之並至苟存遺體僅續餘生敢謂伏蒙尊號皇帝陛下覆燾之恩幽微必及召從廬次復以官聮當陛見之云初陳笥衣而有煥飾躬增耀愈彰不稱之譏處物雖愚猶識謝生之所臣無任辭翰林學士奏至和元年九月臣今日準閣門告報蒙恩除臣翰林學士所降勑告臣未敢祗受竊以內制之職選用非輕臣以庸虛繆塵侍從歲月雖久能效無聞居外任不歷煩難在朝廷未有輔益見居學士之職巳甚厚顔豈敢更希榮進況臣屯蹇之迹憂患所侵齒髮凋殘心志衰耗嚮侍老母久纏疾恙尋丁憂制僅有餘生纍歲以來學業荒廢詔誥之任尤非所當欲望聖慈察臣衰拙所有恩命特賜寢停臣無任謝宣召入翰林狀使車入里君命在門閭巷驚傳豈識朝廷之故事搢紳竦歎以為儒者之至榮在臣之愚何以堪此竊以文章一作詞之任自古非輕待遇寵榮至有私人之目詢謀獻納因加內相之名恩既異於常倫人愈難於稱職伏念臣器非宏遠識匪該明學不通古今之冝材不識方圓之用久叨塵於侍從曽莫著於勞能而自出守外藩近遭家禍苟存餘喘復齒周行風波流落者十年天日再瞻於雙闕進對之際巳蕭颯於霜毛慰勞有加賜憫憐於玉色形神若此志意可知身巳分於早衰心敢萌於希進加以羇危之迹仇嫉交攻進退動繫於群言論議多煩於睿聽雖覆載之造每賜保全而孤蹇偷安常思引去敢謂伏蒙尊號皇帝陛下俯憐舊物曲軫宸慈因內署之闕貟俾備官而承乏臣敢不勉尋舊學益勵前修感遺簮未棄之仁竭駑馬巳疲之力庶伸薄效少答鴻恩謝對衣金帶鞍轡馬狀同前右臣伏蒙聖慈以臣入院特賜衣一對金帶一條金鍍銀鞍轡馬一匹者禁林促召彌峻於近班慈澤逾涯復叨於蕃錫退循昧陋曷稱暉榮伏念臣素乏藝文久塵清近神都繁浩常懼於曠官內署凝嚴遽叨於厠職便蕃曲𬒳兢慓方深豈謂載厚宸慈式垂寵賚兼金錫帶榮踰廓落之名在笥頒衣愧甚曵婁之刺輟以內間之駿飾精寶校之光俯耀微軀仰慚殊渥庸何酬輔但誓糜捐臣無任乞洪州劄子嘉祐二年臣去冬曽有奏陳乞差知洪州一次尋以差入貢院無由再述懇私伏念臣本以庸愚叨塵恩寵一入禁署逮今三年進無輔於朝廷退自迫於衰病眼目昏暗腳膝行步頗艱右臂疼痛舉動費力雖翰苑事無繁劇聖恩曲賜優容然非養病尸居之地兼臣鄉里在吉州昨於丁憂持服時歸葬亡母荒迷之中庶事未備本期服闋還朝上告聖慈乞一近鄉州郡貴得俸祿因便營緝而自叨禁職荏苒歲時貪寵忘親此又人子之責也所以夙夜倣徨不能自止欲望聖慈憫臣衰朽察臣懇迫特許差知洪州一次取進止辭侍讀學士劄子嘉祐三年三月臣準閣門告報伏蒙聖恩授臣兼侍讀學士臣伏見侍讀之職最為清近自祖宗以來尤所慎選居其職者常不過一兩人今經筵之臣一十四人而侍讀十人可謂多矣臣以愚繆忝厠翰林又充史職太常禮儀袐閣袐書省尚書禮部刋修唐書然則在臣不謂無兼職而經筵又不闕人忽沐聖慈特此除授蓋以近年學士相承多兼此職朝廷以為成例不惜推恩比來外人議者皆云講筵侍從人多無坐處矣每見有除此職者則云學士俸薄朝廷與添請俸官以人輕一至於此欲乞罷臣此命不使聖朝慎選之清職遂同例授之冗貟況臣材識淺薄自少以來粗習辭章過蒙進擢俾塵禁署中年衰病常憂廢職至於講説經義博聞強記矧復非臣所長今耆舊之臣經術之士並侍講讀者足以備顧問承清光欲望聖慈矜臣不材自知俾免冒榮之誚所有告勑不敢祗受取進止再辭侍讀學士狀嘉祐三年三月右臣準中書劄子以臣辭免侍讀學士恩命奉聖旨不許辭讓者伏念臣猥以庸虛過蒙獎擢禁署為一時清選既巳忝竊經筵況近例多兼何必辭讓蓋以臣身見兼八職侍讀巳有十人為朝廷惜清職遂為冗貟況講席不添人未至闕事所以敢陳瞽説乞免冒榮臣伏見國家近年以來恩濫官冗議者但知冗官之弊不思致弊之因蓋由凡所推恩便為成例在上者稍欲裁減則恐人心之不足在下者既皆習慣因謂所得為當然積少成多有加無損遂至不勝其弊莫知所以裁之中外之臣無有賢愚共知患比而臣為陛下學士職號論思豈有目覩時弊心知可患無所獻納而又自身蹈之今既巳陳述若又不自踐言則貪榮冒寵不止尋常之責而虛辭飾讓又為矯偽之人此臣所以恐迫惶惑不自知止也伏望聖慈矜臣至懇察臣狂言許寢新恩俾安常分謹具狀奏聞伏候勑旨辭開封府劄子嘉祐三年六月臣伏聞內出誥勑各一道付閣門除臣兼龍圖閣學士權知開封府臣以庸拙久塵侍從初無勞效以伸輔報日夕循省常愧心顔今者曲蒙聖慈誤加選用豈可苟避繁劇輒希辭免蓋臣有不得巳者須至縷陳臣自前歲巳來纍有奏列一作狀乞一外任差遣蓋以臣久患目疾年齒漸衰昏暗愈甚又自今年春末忽得風眩昨於韓絳入學士院勑設日衆坐之中遽然昏踣自後往往發動緣臣所修唐書巳見次第所以盤桓欲俟書成便乞輔外豈期聖造委以治煩臣素以文辭專學治民臨政既非所長加以早衰多病精力不強竊慮隳官敗事上誤聖知兼所修唐書不過三五月可以畢手置局多年官吏拘留糜耗供給今巳垂成若別差人轉成稽滯只委臣了畢則恐無暇及之欲望聖慈矜臣衰病才非所長欲乞别選材能許臣且仍舊職候唐書成日乞一外任差遣以養衰殘今取進止乞洪州第二劄子嘉祐四年正月臣輒有愚懇上干聖聰出於至誠不敢緣飾臣本以愚懦别無材能過蒙恩私列在侍從初無輔報之效每以尸素為慙昨者忽𬒳選差俾權京尹臣雖知材力淺薄衰病侵陵當此浩穰實難辦濟直以忝厠翰苑逮今數年所職清間過享優逸一旦遽蒙煩使不可再辭亦欲勉強年歲之間少陳筋力之效苟無曠敗乞一外州不意眼目舊疾遽然發動蓋自供職以來旦旦常於燈燭下看讀文字及簽書發遣自早至夜率以為常全藉眼力而臣舊患巳及十年兩目眊然中外具見近一兩月來暗昏疼痛屢在假告不無廢事人雖未責臣豈自安臣自前纍曽陳乞江西差遣一任欲乞檢會臣前後陳乞依蔡襄例除臣洪州一次俾解繁劇以養衰殘伏望聖慈特賜矜允今取進止乞洪州第三狀右臣近罄懇私自陳衰病願罷權尹乞一外州伏蒙聖恩降詔不允臣以庸繆過叨獎擢不能陳力輒欲辭勞當𬒳刑誅敢期詔諭理冝祗惕明訓勉勵疲駑而敢再干天聰固自愚執者蓋臣有不得巳也臣舊患兩目於今十年近日以來發作一作動尤甚眵淚浸澀睛瞳眊昏視物稍多其痛如割欲頻請假告則浩穰之地豈自遑安欲竭力枝梧則疾患內攻有難勉強夙夜憂畏不知所為欲望聖慈憫臣衰殘察臣愚拙許解繁劇假一遠外之州俾之待罪臣無任瞻天祈恩激切之至謹具狀陳乞伏候勑旨乞洪州第四劄子臣近兩曽陳乞差知洪州一任未蒙恩許蓋以臣衰病不支難當任使素心所切茍欲便私非敢自圖外州以就優逸臣年雖五十三歲鬢鬚皓然兩目昏暗自丁憂服闋便患腳膝近又風氣攻注左臂疼痛舉動艱難一身四肢不病者有幾以此貪冒榮祿兼處劇繁實知難濟矧自權行府事以來三致臺諫上言兩煩朝廷起獄其它碌碌常事亦無分寸可稱蓋其資材本自庸虛加以精神日漸耗竭處之清職則論議謀猷無一可取擢以煩使又心力疲憊自訴不能上賴聖慈憐憫雖未欲遽棄于外而臣自處實所難安伏見侍從之班交相出入昨吕溱劉敞並請輔外不三數歲今悉召歸況如臣者留之無所輔去之無所惜者哉欲望聖慈矜臣此志乞一外任差遣得以養理衰殘誓於餘年少圖報效今取進止辭轉給事中劄子嘉祐四年二月臣近曽陳乞外任差遣伏蒙聖慈許臣解罷府事兼授臣給事中臣本以庸虛誤蒙奬任不能陳力況未及期遽以衰病自求罷去理當黜責以勵不才豈冝非時濫𬒳恩賞況臣權府之初巳蒙加以兼職到今才及半年有餘不因朝廷别有差使只是自以疾病求罷豈可又轉一官雖聖恩優厚過寵衰殘而臣自揣量無容濫受所有恩命乞賜停寢只許令臣歸院供職所貴少安疲病今取進止再辭轉給事中劄子同前臣近準閣門告報蒙恩授臣給事中臣尋曽瀝懇乞賜寢停今準中書劄子奉聖旨不許辭讓便令授告勑者臣本庸材蒙陛下擢在翰苑言語侍從既無所納以伸報效任以煩使又自陳疲病訴以不能然則如臣久冒寵榮果堪何用上賴聖君優容未加黜責豈可授命之日巳蒙加職不久罷去又復轉官此臣所以慙懼徊徨不敢即授也臣竊見前知府吕公弼差知益州授樞密直學士及公弼辭免不行徙領群牧遂却只依舊充龍圖閣直學士王素蔡襄並因方面之寄乃遷職是則罷府供職京師者不當别有遷轉此近例也臣非敢飾偽上煩聖聰直以恩寵頻併理當辭避欲望聖慈察臣無所堪用矜臣能自揣量俾寢新恩免貽群議今取進止舉吕公著自代狀同前臣伏見司封員外郎崇文院檢討吕公著出自相門躬履儒行學贍文冨器深識遠而靜默寡欲有古君子之風用之朝廷可抑浮俗置在左右必為名臣非惟臣所不如實當今難得之士臣今舉以自代進新修唐書表嘉祐五年七月戊戌為提舉編修曽公亮作臣公亮言竊惟唐有天下幾三百年其君臣行事之始終所以治亂興衰之迹與其典章制度之英冝其粲然著在簡册而紀次無法詳略失中文采不明事實零落蓋百有五十年然後得以發揮幽昧輔緝闕亡黜正偽謬克備一家之史以為萬代之傳成之至難理若有待臣某中謝伏惟尊號皇帝陛下有虞舜之智而好問躬大禹之聖而克勤天下平和民物安樂而猶垂心積精以求治要日與鴻生舊學講誦六經考覽前古以謂商周以來為國長久惟漢與唐不幸接乎五代衰世之士氣力卑弱言淺意陋不足以起其文而使明君賢臣俊功偉烈與夫昏虐賊亂禍根罪首皆不足暴其善惡以動人耳目誠不可以垂勸戒示久遠甚可歎也乃因邇臣之有言適契上心之所閔於是刋修官翰林學士臣歐陽修端明殿學士臣宋祁與編修官知制誥臣范鎮臣王疇集賢校理臣宋敏求祕書丞臣吕夏卿著作佐郎臣劉羲叟等並膺儒學之選悉發祕府之藏俾之討論共加刪定凡十有七年成二百二十五卷其事則增於前其文則省於舊至於名篇著目有革有因立傳紀實或增或損義類凡例皆有據依纎悉綱條具載别録臣公亮典司事領徒費日月誠不足以成大典稱明詔無任慙懼戰汗屏營之至辭轉禮部侍郎劄孒嘉祐五年七月庚子臣準閣門告報蒙恩除臣禮部侍郎令臣授告勑者臣伏思聖恩所及必以臣近進唐書了畢凡與修書官並均睿澤竊緣臣與他修書官不同檢會宋祁范鎮到局各及一十七年王疇一十五年宋敏求吕夏卿劉羲叟並各十年巳上內列傳一百五十卷並是宋祁一面刋修一部書中三分居二范鎮王疇吕夏卿劉羲叟並從初置局便編纂故事分成卷草用功最多如臣者蓋自置局巳十年後書欲有成始差入局接續殘零刋撰紀志六十卷是臣到局月日不多用功最少今來一例受賞臣實愧心兼臣自嘉祐二年蒙恩轉諫議大夫三年蒙恩加龍圖閣學士四年蒙恩轉給事中到今方及一年豈可又一作加以無功濫賞臣不敢虛飾辭讓煩黷朝廷理有不安實難自默欲望聖慈特寢新命今取進止再辭轉禮部侍郎狀右臣今月二十三日奉𬒳詔書一道以臣乞寢新除禮部侍郎恩命不允事伏念臣出自孤寒纍蒙獎擢職忝學士官至給事中前後所授恩命不少豈敢頓於此際過飾偽辭取好讓之虛名為有識之所誚實以臣撫心內愧不敢自欺蓋以唐書置局已十餘年纂録垂就臣最後至接續分撰卷數不多用功最少不敢與從初置局及在局年深用功勤勞人一例受賞所陳情實皆有據依不敢過言冀為可信敢謂特煩詔諭前例所無上體聖恩便合祗受而臣迫於懇悃實所難安夙夜徊徨莫知所措若以臣雖無功效不欲獨遺欲望聖慈稍加裁損或於階勳食邑一有所霑俾臣得不過分足以為榮臣若自欺不言則冒寵雖多為愧愈甚臣不勝激切戰懼屏營之至謹具狀陳乞以聞伏候勑旨賀壽星表至和三年二月誤雕在此臣某等言天雖不言事以象見保祐聖德其祉無疆臣某等中賀伏惟尊號皇帝陛下以憂勞勤儉之志躬自發憤而以仁慈寬厚之惠愛養元元下洎萬邦小大諸物咸欲各正性命而畢安其生上天降監冝有以報庚寅之夕星見南方占考天文福在人主惟天去人不遠如此災祥在德可不戒哉臣等忝備詞臣無所禆輔惟願清心屏欲以隆南山之固而享一有夫字無疆之休乞洪州第五劄子嘉祐五年七月臣猥以庸虛過蒙獎擢久列侍從訖無輔報年齒老大疾病侵陵聽重目昏聰明並耗髮白手顫精力俱衰兼以父母墳塋逺在江外未有得力子弟照管誠心迫切臣自三四年來纍曽陳乞一外任差遣中間緣奉勑刋修唐書未見次第所以盤桓歲月不敢再三堅請今來唐書已得了當欲望聖慈差臣知洪州一次所冀退養衰一作踈拙兼便私塋取進止乞洪州第六狀嘉祐五年某月右臣近瀝懇私上干睿聽以臣年衰多病父毋墳墓在遠無人照管乞一次江西差遣至今未蒙恩旨臣以病攻干外一作內事迫于中一作外既不自安實難緘默將期得請不避煩言重念臣不幸少孤先父遠葬鄉里在吉州之吉水昨臣丁母憂日又扶護歸葬然臣方在憂禍故事力有所不周臣但仰天長號撫心自誓秖期服闋便乞一江西差遣庶幾近便營緝至於種植松柏置田招客蓋造屋宇刻稟碑碣之類事雖倉卒冀於一二年間勉力可就當是時鄉人父老親族故舊環列墓次並聞臣言自臣除服還朝皆引領望臣歸踐前約而臣遷延荏苒一住七年是臣欺罔幽明貪戀一作其榮祿食言不信罪莫大焉兼臣稟賦竒薄衰羸多病兩目昏暗巳踰十年近又兩耳重聽如物閉塞前患左臂疼痛舉動無力今年以來又患右手指節拘攣至於鬚鬢蕭颯一作條久巳皤然臣自視形容如此不惟不宜濫厠賢材英俊之士出入朝廷以取笑於搢紳之列實慮早衰易殞恐遂不得一償素志以為終身之恨臣自數年以來雖纍曽陳乞而懇誠不至天聽未回亦嚮欲伺候唐書了畢今者幸巳成書上奏其餘所領並是尋常職務别無朝廷差委勾當未了事件臣是敢罄述愚衷備盡微瑣伏念臣本乏材能初無階援特蒙睿獎拔自常流置在侍從殆今十有七年矣訖無輔報孤負恩榮伏望聖慈察臣心志凋零形骸朽悴閔臣昔當少壯鋭意立朝今而衰退一至於此哀臣情實迫切乞賜檢會數年以來前後陳乞特許與除知洪州一次臣雖疲憊猶能遵奉詔條修舉常職誓殫犬馬之力上酬天地之仁臣無任徊徨激切謹具狀奏聞伏候勑旨乞洪州第七狀同前右臣奉𬒳今月二十一日詔書一道以臣陳乞江西差遣冝不允者伏念臣早以孤賤誤玷恩榮而生稟拙艱動罹謗咎往自河北斥守滁陽在外十年遂至白首頃除憂制還奉內朝幸蒙聖恩收以桑榆置之翰苑凡今仕宦光寵孰不樂在朝廷職任清優顧亦無出禁近臣豈不思嚮之流落引領欲一作願還而乃却蹈風波自投遠外此之愚計豈近人情蓋以臣事迫心危有不得巳凡諸懇悃嘗具剖陳不敢煩言況巳罄盡再念臣遭遇明聖過彼恩私犬馬無知猶能報效而臣性既踈簡識非敏明少以專學而自愚不能趨世以濟務效當求實而安事虛名才貴適時而一無可用至於上所詢訪時有論議亦碌碌隨衆人未嘗有所建言縱令有之亦不足采惟有文字繆為流俗過稱而自供職禁庭殆今七載屬中外無事文書甚簡不過月赴四五直飽食甘寢止撰青詞齋文一兩通只此為臣所能是臣事業去之亦何闕於事存之又奚輔於時將何以上煩睿慈曲示恩意特頒詔諭前例所無捧讀驚慙繼以感涕臣亦竊聞近日兩制臣寮多求外任彼皆材業有素年齒方強又無事於外方可以且留供職惟臣材無可用年又漸衰外有私營冀償夙素欲望聖慈卑之一郡使其志畢願從若天幸餘齡未填溝整則遺簮舊物尚或冀於見收而疲馬君軒豈不知於有戀臣無任祈恩激切之至謹具狀陳乞以聞伏候勑旨辭侍讀學士狀嘉祐五年九月右臣凖閣門告報蒙恩除臣兼侍讀學士者竊以學士不冝兼侍讀臣於前歲巳具陳論當時蒙恩遂許辭免在於今日豈冝復授得非以方今經筵闕人而臣在學士中適當次輔聖恩優異不忍獨遺臣以衰殘久塵禁署已兼龍圖閣學士而在院學士多未有兼職況臣前已有言理冝自踐欲乞許臣只兼舊職其經筵闕侍讀別賜除人所有誥勑臣不敢祗受今取進止辭樞密副使表嘉祐五年十一月臣某言伏奉制命蒙恩特授臣依前禮部侍郎充樞密副使仍加食邑實封散官勳賜如故者成命始行驟驚於衆聽撫心增懼曽莫以自容臣某中謝竊以樞要之司朝廷慎選出納惟允實贊於萬機禮遇均隆號稱於二府顧任人之得失常繫國一作體之重輕苟非其材所損不一伏念臣器能甚薄風力不強少喜文辭殆浮華而少實晚勤古學終迂闊以自愚而自遭逢盛明擢在侍從間嘗論天下之事言出而衆怨巳歸思欲報人主之知智短而萬分無輔徒厝危躬於禍咎每煩聖造之保全既不適於時冝惟可置之間處故自叨還禁署逮此七年屢乞方州幾于十請瀝愚誠而懇至𬒳明詔之丁寧雖大度并包猥荷優容之賜而群賢在列敢懷希進之心豈謂伏遇尊號皇帝陛下急於求人思以濟治因柄臣之並選憐舊物以不遺然而致逺之難力不勝者必速其覆量材不可能自知者猶得為明敢冀睿慈察其迫切俾回渙渥更選俊良如此則器不假人各適賢愚之分物皆知報何勝犬馬之心謝樞密副使表臣某言伏奉制命蒙恩特授臣依前官充樞密副使尋具表陳免蒙降批答不允斷來章者右樞虛府充位冝求於俊賢多士盈庭誤選乃先於庸妄既牢辭之靡獲徒以寵而為憂臣某中謝伏念臣少本賤愚初無志慮為小人之事力不勝於負薪程有司之文學止期於干祿過𬒳仁恩之樂育早從英俊之並遊遂叨侍從之流久玷論思之地方時求治殆無輔於毫分一作分毫顧質早衰況漸凋於齒髮但思藏縮敢望甄升矧惟贊萬事之機必也極一時之選豈容濫得猥以備員當命令之始行方惶惑以自失而睿恩至渥召旨甚嚴莫諧懇避之誠徒負貪榮之愧此蓋伏遇尊號皇帝陛下廓天地之量垂日月之光憐朴直之無他謂疲駑之可勉俾承闕乏以效拙勤臣敢不奮勵無能之姿感激難逢之會職思其位庶免於曠官謀不以身少期於報國辭參知政事表嘉祐六年八月職參論道冝極選於一時授匪其人實駭聞於衆聽恩榮所𬒳局蹐難安臣某中謝伏念臣本乏材能徒緣幸會列于侍從白首無聞置在樞機素餐巳甚雖聖主之恩天地曲示含容而朝廷之事毫釐動關利害豈止曠官之誚每懷誤國之憂矧惟政事之臣實代天工之任俾之贊二冝擇材賢伏望尊號皇帝陛下收誤獎之恩廣僉諧之訪憫疲駑之巳試備見無庸求俊乂於在廷擢之不次俾獲安於舊職冀免速於罪辜報效之誠殞糜後巳謝參知政事表贊二國鈞參聞廟論謂冝不次而選冀得非常之材乃以敘遷俾之承乏誤恩過𬒳訴讓靡從臣某中謝伏念臣少迫賤貧偶勤學問儒者博而寡要況匪多聞文章世之空言豈能適用徒以早遘亨嘉之會驟蒙獎拔一作擢之私叨言語侍從之流逮今踰紀玷出納樞機之任初乏可稱幸先彈理之未加每欲逡巡而引去敢期睿眷俾與政機優以寵章進其爵秩望非意及榮與憂并此蓋伏遇尊號皇帝陛下堯德聰明禹躬勤儉博求俊乂以濟治康謂臣既朴且愚必能循於忠謹雖庸而懦尚可䇿其疲駑猥以備貟遂兹冒寵臣敢不益堅素守自勉不強惟殫犬馬之勞上答乾坤之造辭明堂加恩表嘉祐七年九月祭之為惠雖澤貴乎均而賞不因功則士無以勸既難安於兢愧敢自避於黷煩臣某中謝伏念臣性本顓愚學無師法才不適當世之用識不通治古之原誤蒙聖知擢自平進俾參國論幸有藴而得施坐耗歲時訖無稱而取誚方懼素餐之責敢懷濫得之心屬宗祀之有嚴奉精禋之致孝陪一二大臣之後既竊窺於盛儀獻千萬歲壽之觴獲共慶於成禮然而賜之胙餕蒙福巳多加以寵榮在臣豈稱伏望尊號皇帝陛下回高明之聽察懇至之誠推一人有慶之恩務先於幽逺憫小器易盈之量俾免於覆顚特收渙汗之行仰冀曲全之造謝賜飛白并賜宴詩狀嘉祐八年正月右臣去月二十七日伏蒙聖慈召赴天章閣觀太宗真宗御集次赴寶文閣觀御飛白書賜以金花箋字遂錫宴於群玉殿臣本出寒儒遭逢盛旦誤𬒳獎擢參贊鈞衡陛下憂勤萬機德𬒳四海邊鄙不聳年榖順成民物熙間聖心怡豫臣於此際既得以尸素偷安而又獲親侍清光便蕃恩錫一時之盛事千載之難遇臣不勝至榮至幸謹課成召赴天章閣寶文閣觀祖宗御集賜飛白羣玉殿賜宴五言八韻詩一首隨狀上進干瀆宸嚴無任惶恐戰汗屏營之至謝覃恩轉戶部侍郎表嘉祐八年英宗登極四月上皇明繼照如日之升睿澤雱流溥天咸𬒳時惟朽懦亦玷光華臣某中謝伏念臣本以庸虛僅知學問識不周於往行一作時用材莫逮於中人方其壯年喜論時事名聲濫得招謗咎以偕來榮寵踰涯蹈憂危而亦至晚𬒳先朝之誤獎俾陪二府之後塵居無輔於休明方自期於引避遽號弓而結恨雖殞體以何追伏遇皇帝陛下奮發乾剛嗣承天統當茂業繼文之始乃歡謳歸啓之初宗社獲安人神洽一作合慶矧惟新之號令方無間於幽遐顧於兹時其敢獨異俯從祗受但益凌兢敢不勉勵衰殘感遇今昔更竭疲駑之效庶伸塵露之微謝皇太后表嗣聖當天法重離而正位鴻恩浹物均萬國以同休遂容尸素之臣猥𬒳優隆之渥臣某中謝伏念臣名雖學古性實迂儒徒誦習於典墳靡該通於今古爰從束髮遭會明時蒙先帝之誤知與羣英而並進紫樞黃閣叨陪論道之司白首丹心徒有報君之志屬綴衣之揚命奉主鬯以承祧方推慶賜之行遽荷便蕃之寵伏遇皇太后殿下坤元厚載毋道居尊惟兹聽覽之初務霈汪洋之澤臣敢不勉修職業上副憂勤送往事居忘身盡節庶展涓埃之效少酬覆燾之私表奏書啓四六集卷第二紹熙三年十月承直郎丁朝佐編次郡人孫謙益校正謝對衣金帶鞍馬狀促召一作祗召辭侍讀學士劄子朝廷與添請俸朝廷二字一作恩進新修唐書表百有五十此上一有又字萬代一作萬世平和一作不幸此上一有字不足暴其足一作得辭轉禮部侍郎劄子六十卷此上一有才字賀壽星表英辭類稿題作中書賀壽星表故其後云忝備宰臣案中書公用表章例是知制誥撰乞洪州第六狀刻稟一作刻立事雖雖疑是難字乞洪州第七狀隨衆人一無衆字辭樞密副使表殆浮華殆一作苐晚勤古學晚一作志禍咎一作悔咎優容之賜賜一作德謝樞密副使表俊賢一作俊良以寵而為憂一作冒寵以為憂早從從一作參極一極一作副朴直一作忠直少期一作少圖謝參知政事表俾之一作任之此卷謝賜對衣狀云授受之際廣韻受字上聲納也承也盛也得也繼也授字去聲付也公之它文或以授為受以受為授蓋一時互用不可輕改此卷謝賜衣帶鞍馬狀乃初入翰苑時其云神都繁浩者謂前任南都留守也或疑解開封府之後誤矣廣韻以謬為差誤繆為紕繆皆非美意此卷辭翰林學士奏云繆塵侍從乞洪州第三狀云臣以庸繆修唐書表云黜正偽謬并集古跋真迹凡言訛謬盡用繆字可見互用之意元文不可輕改按兩朝國史至和三年二月辛卯壽星見此卷賀表云庚寅之夕蓋隂陽家分亥子為兩日又太史例以次日奏故史書辛卯正應表文吉本作臣等忝備詞臣乃與翰苑同僚共上表也英辭類稿題云中書賀表改詞臣為宰臣雖故事舍人當作詳注纂誤然慶曆四年春公知制誥時初無此祥當以吉本為正近體樂府卷第二歐陽文忠公集一百三十二長短句蝶戀花一名鳯棲梧又名鵲踏枝一簾幕東風寒料峭雪裏香梅先報春來早紅蠟枝頭雙燕小金刀剪綵呈纎巧旋暖金爐薰蕙藻酒入橫波困不禁煩惱繡被五更春睡好羅幃不覺紗窗曉二南鴈依稀回側陳雪霽墻隂遍覺蘭芽嫩中夜夢餘消酒困爐香卷穗燈生暈急景流年都一瞬往事前歡未免縈方寸臘後花期知漸近東風巳作寒梅信三臘雪𥘉銷梅蘂綻梅雪相和喜鵲穿花轉睡起夕陽迷醉眼新愁長向東風亂瘦覺玉肌羅帶緩紅杏梢頭二月春猶淺望極不來芳信斷音書縱有爭如見四海燕雙來歸畫棟簾影無風花影頻移動半醉騰騰春睡重緑鬟堆枕香雲擁翠被雙盤金縷鳳憶得前春有箇人人共花裏黃鶯時一弄日斜驚起相思夢五面旋落花風蕩漾栁重煙深雪絮飛來往雨後輕寒猶未放春愁酒病成惆悵枕畔屏山圍碧浪翠被華燈夜夜空相向寂寞起來褰繡幌月明正在梨花上六六曲欄干偎碧樹楊栁風輕展盡黃金縷誰抱鈿箏移玉柱穿簾海燕雙飛去滿眼遊絲兼落絮紅杏開時一霎清明雨濃醉覺來鶯亂語驚殘好夢無尋處七遙夜亭臯間信步乍過清明漸覺傷春暮數點雨聲風約住朦朧淡月雲來去桃杏一作李依俙香暗度誰上一作在鞦韆笑裏輕輕語一寸相思千萬緒人間沒箇安排處八簾幕風輕雙語燕午後醒來栁絮飛撩亂心事一春猶未見紅英落盡青苔院百尺朱樓間倚遍薄雨濃雲抵死遮人面羌管不須吹别怨無腸更為新聲斷九庭院深深深幾許楊桞堆煙簾幕無重數玉勒雕鞍遊冶處樓髙不見章臺路雨橫風狂三月暮門掩黃昏無計留春住泪眼問花花不語亂紅飛過鞦韆去十永日環隄乘綵舫煙草蕭踈恰似晴江上水浸碧天風皺浪菱花荇蔓隨雙槳紅粉佳人翻麗唱驚起鴛鴦兩兩飛相向且把金樽傾美釀休思往事成惆悵十一越女採蓮秋水畔窄袖輕羅暗露雙金釧照影摘花花似面芳心只共絲爭亂鸂鷘灘頭風浪晚霧重煙輕不見來時伴隱隱歌聲歸棹逺離愁引著江南岸十二水浸秋天風皺浪縹眇山舟只似秋天上和露採蓮愁一餉看花却是啼粧樣折得蓮莖絲未放蓮斷絲牽特地成惆悵歸棹莫隨花蕩漾江頭有箇人相望十三梨葉𥘉紅蟬韻歇銀漢風髙玉管聲淒切枕簟乍涼銅漏徹誰教社燕輕離别草際蟲吟秋露結宿酒醒來不記歸時節多少衷腸猶未説珠簾夜夜朦朧月十四獨倚危樓風細細望極離愁黯黯生天際草色山光殘照裏無人會得憑欄意也擬踈狂圖一醉對酒當歌強飲還無味衣帶漸寬都不悔況伊銷得人憔悴十五簾下清歌簾外宴雖愛新聲不見如花面牙板數𫾣珠一串梁塵暗落琉璃盞桐樹花深孤鳳怨漸遏遙天不放行雲散坐上少年聽未慣玉山將倒腸先斷十六誰道間情拋棄久每到春來惆悵還依舊日日花前常病酒不辭鏡裏朱顔瘦河畔青蕪堤上桞為問新愁何事年年有獨立小橋風滿袖平林新月人歸後十七翠苑紅芳晴滿目綺席流鶯上下長相逐紫陌間隨金轣轆馬蹄踏遍春郊緑一覺年華春夢促往事悠悠百鍾尋思足煙雨滿樓山斷續人間倚遍欄干曲十八小院深深門掩亞寂寞珠簾畫閣重重下欲近禁煙微雨罷緑楊深處鞦韆挂傅粉狂遊猶未捨不念芳時眉黛無人畫薄幸未歸春去也杏花零落香紅謝十九幾日行雲何處去忘了歸來不道春將暮百草千花寒食路香車繫在誰家樹淚眼倚樓頻獨語雙燕來時陌上相逢否撩亂春愁如栁絮依依夢裏無尋處二十欲過清明煙雨細小檻臨窗點點殘花墜梁燕語多驚曉睡銀屏一半堆香被新歲風光如舊歲所恨征輪漸漸程迢遞縱有逺情難寫寄何妨解有相思泪二十一畫閣歸來春又晚燕子雙飛桞軟桃花淺細雨滿天風滿院愁眉斂盡無人見獨倚欄干心緒亂芳草芉綿尚憶江南岸風月無情人暗換舊遊如夢空腸斷二十二嘗愛西湖春色早臘雪方銷已見桃開小頃刻光隂都過了如今緑暗紅英少且趂餘花謀一笑况有笙歌艷態相縈繞老去風情應不到憑君剩把芳樽倒漁家傲一一派潺湲流碧漲新亭四面山相向翠竹嶺頭明月上迷俯仰月輪正在泉中漾更待髙秋天氣爽菊花香裏開新釀酒美賔嘉真勝賞紅粉唱山深分外歌聲響二十月小春梅蘂綻紅爐畫閣新裝遍錦帳美人貪睡暖羞起晚玉壷一夜氷澌滿樓上四垂簾不卷天寒山色偏冝逺風急鴈行吹字斷紅日短江天雪意雲撩亂三與趙康靖公四紀才名天下重三朝􅌟厦為梁棟定册功成身退勇辭榮寵歸來白首笙歌擁顧我薄才無可用君恩近許歸田壠今日一觴難得共聊對捧官奴為我髙歌送四暖日遲遲花裊裊人將紅粉爭花好花不能言惟解笑金壷倒花開未老人年少車馬九門來擾擾行人莫羡長安道丹禁漏聲衢鼓報催昏曉長安城裏人先老五紅粉墻頭花幾樹落花片片和驚絮墻外有樓花有主尋花去隔墻遙見秋千侶緑索紅旗雙綵柱行人只得偷回顧腸斷樓南金鎖户天欲暮流鶯飛到秋千處六妾本錢塘蘇小妹芙蓉花共門相對昨日為逢青傘蓋慵不採今朝斗覺凋零晒愁倚畫樓無計奈亂紅飄過秋塘外料得明年秋色在香可愛其如鏡裏花顔改七花底忽聞𫾣雨槳逡巡女伴來尋一作相訪酒盞旋將荷葉當蓮舟蕩時時盞裏生紅浪花氣酒香清厮釀花腮酒面紅相向醉倚緑隂眠一餉驚起望船頭閣在沙灘上八葉有清風花有露葉籠花罩鴛鴦侣白錦頂絲紅錦羽蓮女妬驚飛不許長相聚日腳沉紅天色暮青涼傘上微微雨早是水寒無宿處須回步枉教雨裏分飛去九荷葉田田青照水孤舟挽在花隂底昨夜蕭蕭踈雨墜愁不寐朝來又覺西風起雨擺風搖金蘂碎合歡枝上香房翠蓮子與人長厮類無好意年年苦在中心裏十䈎重如將青玉亞花輕疑是紅綃挂顔色清新香脫灑堪長價牡丹怎得稱王者雨筆露箋勻彩畫日爐風炭薰蘭麝天與多情絲一把誰厮惹千條萬縷縈心下十一粉蘂丹青描不得金針線線功難敵誰傍暗香輕採摘風淅淅船頭觸散雙鸂鷘夜雨染成天水碧朝陽借出煙脂色欲落又開人共惜秋氣逼盤中巳見新荷的十二幽鷺謾來窺品格雙魚豈解傳消息緑柄嫩香頻採摘心似織條條不斷誰牽役珠泪暗和清露滴羅衣染盡秋江色對面不言情脈脈煙水隔無人説似長相憶十三楚國細腰元自瘦文君膩臉誰描就日夜鼓聲催箭漏昏復晝紅顔豈得長如舊醉拆嫩房紅蘂嗅天絲不斷清香透却傍小欄凝望久風滿袖西池月上人歸後十四七夕喜鵲填河仙浪淺雲軿早在星橋畔街鼓黃昏霞尾暗炎光斂金鈎側倒天西面一别經年今始見新歡往恨知何限天上佳期貪眷戀良宵短人間不合催銀箭十五乞巧樓頭雲幔卷浮花催洗嚴粧面花上蛛絲尋得遍顰笑淺雙眸望月牽紅線奕奕天河光不斷有人正在長生殿暗付金叉清夜半千秋願年年此會長相見十六别恨長長歡計短踈鍾促漏真堪怨此會此情都未半星𥘉轉鸞琴鳳樂匆匆卷河鼓無言西北盻香蛾有恨東南逺脈脈橫波珠泪滿歸心亂離腸便逐星橋斷十七九日歡遊何處好黃花萬蘂雕欄繞通體清香無俗調天氣好煙滋露結功多少日腳清寒髙下照寶釘密綴圎斜小落葉西園風嫋嫋催秋老叢邊莫厭金樽倒十八青女霜前催得綻金鈿亂散枝頭遍落帽臺髙門雅宴芳樽滿挼花吹在流霞面桃李三春雖可羡鶯來蝶去芳心亂爭似仙潭秋水岸香不斷年年自作茱茰伴十九露裛嬌黃風擺翠人間晚秀非無意仙格淡粧天與麗誰可比女真裝束真相似筵上佳人牽翠𬒮纎纎玉手挼新蘂美酒一杯花影膩邀客醉紅瓊共作熏熏媚二十對酒當歌勞客勸惜花只惜年華晚寒艷冷香秋不管情眷眷憑欄盡日愁無限思抱芳期隨塞鴈悔無深意傳雙燕悵望一枝難寄逺人不見樓頭望斷相思眼玉樓春題上林後亭名木蘭花令一風遲日媚煙光好緑樹依依芳意早年華容易即凋零春色只冝長恨少池塘隱隱驚雷曉柳眼未開梅蕚小樽前貪愛物華新不道物新人漸老二西亭飲散清歌闋花外遲遲宫漏發塗金燭引紫騮嘶柳曲西頭歸路别佳辰只恐幽期闊密贈殷勤衣上結翠屏魂夢莫相尋禁斷六街清夜月三春山斂黛低歌扇暫解吳鈎登祖宴畫樓鍾動巳魂銷何況馬嘶芳草岸青門桞色隨人逺望欲斷時腸已斷洛城春色待君來莫到落花飛似霰四樽前擬把歸期説未語春容先慘咽人生自是有情癡此恨不關風與月離歌且莫翻新闋一曲能教腸寸結直須看盡洛城花始共春風容易别五洛陽正值芳菲節穠艷清香相間發遊絲有意苦相縈垂桞無端爭贈别杏花紅處青山缺山畔行人山下歇今宵誰肯逺相隨惟有寂寥孤館月六殘春一夜狂風雨斷送紅飛花落樹人心花意待留春春色無情容易去髙樓把酒愁獨語借問春歸何處所暮雲空闊不知音惟有緑楊芳草路七常憶洛陽風景媚煙暖風和添酒味鶯啼宴席似留人花出墻頭如有意别來巳隔千山翠望斷危樓斜日墜關心只為牡丹紅一片春愁來夢裏八池塘水緑春微暖記得玉真𥘉見面從頭歌韻響錚鏦入破舞腰紅亂旋玉鈎簾下香階畔醉後不知紅日晚當時共我賞花人點撿如今無一半九兩翁相遇逢佳節正值栁綿飛似雪便須豪飲敵青春莫對新花羞白髮人生聚散如弦筈老去風情尤惜别大家金盞倒垂蓮一任西樓低曉月十西湖南北煙波闊風裏絲簧聲韻咽舞餘裙帶緑雙垂酒入香腮紅一抹杯深不覺琉璃滑貪看六么花十八明朝車馬各西東惆悵畫橋風與月十一燕鴻過後春歸去細算浮生千萬緒來如春夢幾多時去似朝雲無覔處聞琴解珮神仙侣挽斷羅衣留不住勸君莫作獨醒人爛醉花間應有數十二蝶飛芳草花飛路把酒已嗟春色暮當時枝上落殘花今日水流何處去樓前獨繞鳴蟬樹憶把芳條吹暖絮紅蓮緑芰亦芳菲不奈金風兼玉露十三别後不知君逺近觸目淒涼多少悶漸行漸逺漸無書水闊魚沉何處問夜深風竹𫾣秋韻萬葉千聲皆是恨故欹單枕夢中尋夢又不成燈又燼十四紅絛約束瓊肌穩拍碎香檀催急衮隴頭嗚咽水聲繁葉下間關鶯語近美人才子傳芳信明月清風傷别恨未知何處有知音常為此情留此恨十五檀槽碎響金絲撥露濕潯陽江上月不知商婦為誰愁一曲行人留夜發畫堂花月新聲别紅蘂調長彈未徹暗將深意祝膠絃唯願絃絃無斷絶十六春蔥指甲輕攏撚五彩垂絛雙袖卷雪香濃透紫檀槽胡語急隨紅玉腕當頭一曲情何限入破錚鏦金鳳戰百分芳酒祝長春再拜斂容擡粉面十七金花盞面紅煙透舞急香茵隨步皺青春才子有新詞紅粉佳人重勸酒也知自為傷春瘦歸騎休交銀燭候擬將沉醉為清歡無奈醒來還感舊十八雪雲乍變春雲簇漸覺年華堪送目北枝梅蘂犯寒開南浦波紋如酒緑芳菲次第還相續不奈情多無處足樽前百計得春歸莫為傷春歌黛蹙十九栁黃金弄色輕於粉濯濯春條如水嫩為緣力薄未禁風不奈多嬌長似困腰柔乍怯人相近眉小未知春有恨勸君著意惜芳菲莫待行人攀折盡二十珠簾半下香銷印二月東風催栁信琵琶傍畔且尋思鸚鵡前頭休借問驚鴻過後生離恨紅日長時添酒困未知心在阿誰邊滿眼泪珠言不盡二十一沉沉庭院鶯吟弄日暖煙和春氣重緑楊嬌眼為誰回芳草深心空自動倚欄無語傷離鳳一片風情無處用尋思還有舊家心蝴蝶時時來役夢二十二去時梅蕚𥘉凝粉不覺小桃風力損梨花最晚又凋零何事歸期無定準欄干倚遍重來憑淚粉偷將紅袖印蜘蛛喜鵲誤人多似此無憑安足信二十三酒美春濃花世界得意人人千萬態莫教辜負艷陽天過了堆金何處買已去少年無計奈且願芳心長恁在間愁一點上心來算得東風吹不解二十四湖邊柳外樓髙處望斷雲山多少路欄干倚遍使人愁又是天涯𥘉日暮輕無管繫狂無數水畔花飛風裏絮算伊渾似薄情郎去便不來來便去二十五南園粉蝶能無數度翠穿紅來復去倡條冶葉恣留連飄蕩輕於花上絮朱欄夜夜風兼露宿粉棲香無定所多情翻却似無情贏得百花無限妬二十六子規江南三月春光老月落禽啼天未曉露和啼血染花紅恨過千家煙樹杪雲垂玉枕屏山小夢欲成時驚覺了人心應不似伊心若解思歸歸合早二十七東風本是開花信及至花時風更緊吹開吹謝苦忩忩春意到頭無處問把酒臨風千萬恨欲掃殘紅猶未忍夜來風雨轉離披滿眼淒涼愁不盡二十八隂隂樹色籠晴晝清淡園林春過後杏腮輕粉日催紅池面緑羅風卷皺佳人向晚新粧就圎膩歌喉珠欲溜當筵莫放酒杯遲樂事良辰難入手二十九芙蓉鬭暈燕支淺留著晚花開小宴畫船紅日晚風清栁色溪光晴照䁔美人爭勸梨花盞舞困玉腰裙縷慢莫交銀燭促歸期已祝斜陽休更晚漁家傲續添正月斗杓𥘉轉勢金刀剪綵功夫異稱慶高堂歡幼稚看栁意偏從東面春風至十四新蟾圎尚未樓前乍看紅燈試冰散緑池泉細細魚欲戲園林已是花天氣同前二月春耕昌杏密百花次第爭先出惟有海棠梨第一深淺拂天生紅粉真無匹畫棟歸來巢未失雙雙𣢾語憐飛乙留客醉花迎曉日金盞溢却憂風雨飄零疾同前三月清明天婉娩晴川祓禊歸來晚況是踏青來處逺猶不倦秋千别閉深庭院更值牡丹開欲遍酴醿壓架清香散誰解勸增眷戀東風回晚無情絆同前四月園林春去後深深密幄隂𥘉茂折得花枝猶在手香滿袖葉間梅子青如豆風雨時時添氣候成行新筍霜筠厚題就送春詩幾首聊對酒櫻桃色照銀盤溜同前五月榴花妖艷烘緑楊帶雨垂垂重五色新絲纏角粽金盤送生綃畫扇盤雙鳯正是浴蘭時節動昌蒲酒美清尊共葉裏黃鸝時一弄猶鬆等間驚破紗窗夢同前六月炎天時霎雨行雲涌出竒峯露沼上嫩蓮腰束素風兼露梁王宫闕無煩暑畏日亭亭殘蕙炷傍簾乳燕雙飛去碧碗𫾣冰傾玉處朝與莫故人風快涼輕度同前七月新秋風露早渚蓮尚折庭梧老是處瓜華時節好金樽倒人間綵縷爭祈巧萬葉𫾣聲涼乍到百蟲啼晚煙如掃箭漏𥘉長天杳杳人語悄那堪夜雨催清曉同前八月秋高風歷亂衰蘭敗芷紅蓮岸皓月十分光正滿清光畔年年常願瓊筵看社近愁看歸去燕江天空闊雲容漫宋玉當時情不淺成幽怨鄉關千里危腸斷同前九月霜秋秋巳盡烘林敗葉紅相映惟有東籬黃菊盛遺金粉人家簾幕重陽近曉日隂隂晴未定授衣時節輕寒嫩新鴈一聲風又徑雲欲凝鴈來應有吾鄉信同前此篇巳載本卷但數字不同十月小春梅蘂綻紅爐畫閣新裝遍鴛帳美人貪睡暖梳洗懶玉壷一夜輕澌滿樓上四垂簾不卷天寒山色偏冝逺風急鴈行吹字斷紅日晚江天雪意雲撩亂同前十一月新陽排壽宴黃鍾應管添宫線獵獵寒威雲不卷風頭轉時看雪霰吹人面南至迎長知漏箭書雲紀候冰生研臘近探春春尚逺間庭院梅花落盡千千片同前十二月嚴凝天地閉莫嫌臺榭無花卉惟有酒能欺雪意增豪氣直教耳熱笙歌沸隴上雕鞍惟疑數騎獵圍半合新霜裏霜重鼓聲寒不起千人指馬前一鴈寒空墜荆公嘗對客誦永叔小闋云五綵新絲纒角粽金盤送生綃畫扇盤雙鳳曰三十年前見其全篇今才記三句乃永叔在李太尉端願席上所作十二月鼓子詞數問人求之不可得嗚呼荆公之沒二紀余自永平幕召還過武陵始得於州將李君誼追恨荆公之不獲見也誼太尉猶子也年中秋日金陵闕其名政和丙申冬余還自京師過歙州大守濠梁許君頌之席上見許君舉荆公所記三句且云此詞才情餘它人不能道也後十二年建炎戊申偶得此本於長樂同官方君後四年辛亥紹興二月朔自尤溪避盜宿龍􅐡以待二弟適無事謾録于此吏部貟外郎朱松喬年近體樂府卷第二蝶戀花第六篇載陽春録誰抱一作誰把雙飛一作驚飛濃醉一作濃睡鶯亂語一作慵不語第七篇尊前集作李王詞乍過一作過了傷春暮一作春將暮依俙一作無言誰一作人輕輕一作低低相思一作芳心第九篇亦載陽春録易安李氏稱是六一詞第十四十五篇並載栁三變樂章集第十六篇亦載陽春録拋棄一作拋擲小橋一作小樓第十九篇亦載陽春録漁家傲第三篇羞起晚晚一作懶紅日短短一作晚第十四篇霞尾暗一作亂玉樓春第十篇舞餘文海作舞徐第十一篇幾多一作不多第十八篇此篇尊前集作馮延巳而陽春録不載送目十作縱目還相一作長相不奈一作自是附録卷第二墓志銘神道碑墓志銘并序宋故推誠保德崇仁翊戴功臣觀文殿學士特進太子少師致仕上柱國樂安郡開國公食邑四千三百戶食實封一千二百戶贈太子太師文忠歐陽公墓志銘并序淮南節度觀察處置等使開府儀同三司守司徒檢校太師兼侍中判相州軍州事上柱國魏國公韓琦撰朝散大夫右諫議大夫充集賢院學士史館修撰權判尚書都省判袐閣提舉醴泉觀公事上護軍賜紫金魚袋宋敏求書翰林侍讀學士龍圖閣學士朝散大夫尚書吏部郎中知河陽軍州事兼管內勸農使上護軍賜紫金魚袋韓維題蓋熙寧五年閏七月二十三日觀文殿學士太子少師致仕歐陽公薨于汝隂之私第年六十六上聞震怛不視朝贈公太子太師太常諡曰文忠恤後加􅉠不與常比天下正人節士知公之亡罔不駭然相弔痛失依仰其孤寺丞君乃以樞密副使吳公所次功緒并致治命以墓銘為請竊惟當世能文之士比比出公門下不屬于彼而獨以見屬豈公素諒其愚謂能直筆足信後世邪此其敢辭公諱修字永叔唐太子率更令詢四世孫琮嘗為吉州刺史又八世生萬復為吉之安福令子孫因家焉曽祖諱郴安福六世孫也孝悌之行鄉里師服仕南唐為武昌令纍贈太師中書令曽祖妣劉氏追封楚國太夫人祖諱偃強學善屬文南唐時獻所為文十餘萬言召試輔南京街院判官纍贈太師中書令兼尚書令祖妣李氏追封吳國太夫人父諱觀性至孝力學咸平中擢進士第當官明而尚恕每決重辟尤加審慎茍理有可脫必平反之終泰州軍事判官纍贈太師中書令兼尚書令追封鄭國公自公祖始徙居吉水後吉水析為永豐今為永豐人公四歲而孤母韓國太夫人鄭氏守志不奪家雖貧力自營贍教公為學公亦天資警絶經目一覽則能誦記為文下筆出人意表及冠聲聞卓然天聖中舉進士凡兩試國子監一試禮部皆為第一逮崇政試雖中甲科人猶以不魁多士為恨初輔西京留守推官洛尹文康王公知非常才歸薦于朝景祐初召試遷鎮南軍節度掌書記館閣校勘時文正范公權尹京邑以直道自進每因奏事必陳時政得失大忤宰相意斥守饒州諫官不敢言公貽書責之坐貶峽州夷陵令余安道尹師魯繼上書直范公復𬒳逐當時天下以四賢稱之俄徙光化軍乾德令改武成軍節度判官康定初召還復館閣校勘遷太子中允預修崇文總目成改集賢校理同知太常禮院請外輔通判滑州事慶曆初仁宗御天下久周悉時弊重以西師未解思欲整齊衆治以完太平登進輔臣必取人望收用端鯁以增諫員公首𬒳其選擢太常丞知諫院事賜五品服未幾同修起居注公素凛忠義遭時遇主自任言責無所顧忌橫身正路風節凛然時正獻杜公文正范公今司空冨公皆在二府公每勸上乘間延見推誠咨訪上後開天章閣屢召諸公詢究治本長䇿大議稍稍施用一作行紀綱日舉僥幸頓絶小人始大不喜相與巧詆必期破壞公常極力左右之俄拜右正言知制誥賜三品服大臣有建白請廢麟州徙其治於合河津以省餽餉者命公親往相視使回奏曰麟州天險正據要害不可廢第減其兵駐並河諸堡有警呼集數舍之近爾兵既減糧自不乏詔從之又奏欣代州岢嵐火山軍並邊民田始潘美為帥患虜時入寇徙其民以空之遂號禁地自景德通好我雖循舊而虜人盜耕不巳請募民計頃出丁為兵量入租粟以耕之歲可得數百萬斛邊用給矣不然他日必盡為虜人所有時并帥耻謀不自已沮撓久之其後卒如公請凡賦斂過重民所不堪者又奏罷十數事疲俗以安四年秋北虜盛兵雲州聲言西討朝廷疑其有謀議選文武材臣密為經畫二府請輟公以往即以公為龍圖閣直學士河北都轉運使公至則區别一作分官吏使能者盡力均徙財用而邊計有餘奏廣御河漕運造鎖栿船以絶侵盜置都作院于磁相州一道兵械悉仰給焉方條列北方利病欲大為措置會文正范公與同時入輔者終為讒説所勝相繼罷去一時進用者皆指之為黨公復慨然上書極言論救執政與其朋益怒協力擠之初公有妹適張龜正龜正亡無子妹挈前室所生孤女以歸及笄公為選宗人晟以嫁之會張氏以失行繫獄言者乘此欲并中公復捃張氏資産事遂興詔獄窮治上為命內臣監劾卒辨其誣猶降授知制誥知滁州事執政意不快托勘官與監劾內臣細故皆𬒳責八年春就改起居舍人知揚州事踰年徙知潁州事皇祐初復龍圖閣直學士二年秋移知應天府兼南京留守司事歷尚書禮部吏部郎中丁太夫人憂去職服除入見上怪公須髮盡白惻然存撫恩意甚厚命判吏部流內銓素忌公者恐將大用乃偽為公疏請汰內臣以激衆怒有選人胡宗堯者當引對改官前任本州嘗以官舟假人已而經赦去官止得循資公與判南曹官對日取旨上欣然令改官宦者楊永德密奏曰宗堯翰林學士宿之子有司援救之私也遂出公知同州事物論一作議不平上亟開悟留公刋修唐書俄入翰林為學士史館修撰勾當三班院至和二年夏請郡改侍讀學士知蔡州事留不行復除翰林學士判太常寺兼禮儀事遷右諫議大夫嘉祐三年夏兼龍圖閣學士權知開封府事前尹孝肅包公一作包孝肅公以威嚴得名都下震恐而公動必循理不求赫赫之譽或以少風采為言公曰人材性各有短長吾之長止于此惡可勉其所短以徇人邪既而京師亦治四年春請罷府事改給事中充羣牧使唐書成拜禮部侍郎俄兼翰林侍讀學士五年冬以本官為樞密副使明年秋參知政事英宗登極遷户部侍郎治平𥘉特轉吏部侍郎今上嗣位改尚書左丞公自處二府益思報稱毅然守正不為冨貴易節凡大謀議大利害與同官論辨或在上前必區判一作别是否未嘗少有回屈文武之士陳請百端公常委曲開諭曰某事可行某事不可行用是人多怨誹至于臺諫官論事有不中理者往往正色折之其徒尤切齒日欲求疵合攻公自視無他不恤也始一無此字英廟一作宗踐祚按祖宗舊典皇族尊屬之亡者皆贈官改封濮安懿王英廟所生父也中書以本朝未有故事請付有司詳處一作審其當上謙恭慎重命過仁廟大祥下禮院與兩制官同議如期詔下衆乃言王當稱伯改封大國中書以所生父稱伯疑無經據方再下三省議上遽令權罷俾有司徐求典故事久不行臺官挾憤不巳遂持此斥公為主議上章歷詆必請議定及以朝廷未嘗議及之事肆為誣説欲惑衆聽又相率納告身以示必去上數敦諭知不可留各以本官輔外後來者以風憲不勝為耻窺伺愈急今上即位初御史蔣之竒者乃造無根之言一作語欲以汙公中丞彭思永乘虛助之公退伏私居力請公辨上照其誣罔連詔詰問二人者辭窮皆坐貶公遂懇辭柄任上不得巳除公觀文殿學士刑部尚書知亳州事熙寧元年秋遷兵部尚書知青州事充京東東路安撫使時散青苗錢法初行衆議皆言不便朝廷既申告誡公猶請除去二分之息令民止納本錢明不取利又請先罷提舉管勾官然後可以責州縣不得抑配不報三年夏除檢校太保宣徽南院使判太原府河東路經略安撫使公纍上章辭丐易蔡州大略以久疾昏耗不任重寄復曰時多喜新竒而臣思守拙衆方興功利而臣欲循常執政知終不附已俄詔聽以舊官知蔡州事公在亳已六上章請致政上眷惜之不允至蔡踰年復申前請志益堅確上察其誠命優改官致仕年方六十有五天下士大夫聞公勇退無不驚歎云近古所無也公天資剛徑見義敢為襟懷洞然無有城府常以平心為難故未嘗挾私以為喜怒奬進人物樂善不倦一長之得力為稱薦故賞識之下率為聞人惟視姦邪嫉若仇敵直前奮擊不問權貴後雖隂𬒳讒逐公以道自處怡怡如也平生篤于朋友如尹師魯梅聖俞孫眀復既卒其家貧甚公力經營之使皆得以自給又表其孤于朝悉録以官自唐室之衰文體隨而不振陵夷至于五代氣益卑弱國初柳公仲塗一時大儒以古道興起之學者卒不從景祐初公與尹師魯專以古文相尚而公得之自然非學所至超然獨騖衆莫能及譬夫天地之妙造化萬物動者植者無細與大不見痕迹自極其一作於工於是文風一變時人競為模範自漢司馬遷沒幾千年而唐韓愈出愈之後又數百年而公始繼之氣𦦨相薄莫較髙下何其盛哉所治經術務究大本嘗以先儒於經所得多矣而不能無失惟其説或有未通公始為辨正不過求聖人之意以立異論嘉祐初權知貢舉時舉者務為險怪之語號太學體公一切黜去取其平淡造理者即預奏名初雖怨讟紛紜而文格終以復古者公之力也筆翰遒徑自成一家人有得其片幅必寶藏之歷典大郡以鎮靜為本明不至一作及察寬不至縱吏民受賜既去追思不巳滁揚二州皆立生祠嘗奉使契丹其主必遣貴臣押宴出于常例且謂公曰以公名重故爾其為外夷欽服如此至和中陳恭公為相欲塞商胡決河使歸橫壠故道公言橫壠地巳髙仰功大不可為未幾陳罷去有李仲昌者乃議道商胡水入六塔河公復上言六塔素隘狹不能容大河若為之必潰決害愈甚時執政是仲昌議又不用公言後六塔隄果壞不成自博以下數州皆𬒳水患衆服公先識在侍從八年竭誠輔益前後上言百餘事仁宗嘗曰如歐陽某者何處得來故其言多所聽納因嘉祐水災凡兩上疏請選立皇子以固根本及在政府遂與諸公參定大議方英廟過自謙退未即承命事久未決衆悉危之公協心開助忠力為多及即位之初感疾未能聽覽一作斷慈壽預政事出權冝公與諸公往來兩宫鎮安內外卒復明辟人無間言嘗𬒳詔撰唐書紀十卷志五十卷表十五卷又自撰五代史七十四卷易童子問三卷詩本義十四卷居士集五十卷歸榮集一卷外制集三卷內制集八卷奏議十八卷四六集七卷集古録跋尾十卷雜著十九卷公於物無他玩好獨好收古文圖書集三代以來金石銘刻為一千卷用以校正傳記訛繆人得不疑晚年自號六一居士曰吾集古録一千卷藏書一萬卷有琴一張有棊一局常置酒一壷吾老于其間是為六一因自為傳以志之初娶胥氏翰林學士偃之女繼室楊氏集賢院學士諫議大夫大雅之女今夫人薛氏資政殿學士户部侍郎簡肅公奎之女纍封仁壽郡夫人男八人長發次奕光祿寺丞次棐大理評事次辨光祿寺丞餘皆早卒女三人皆早卒孫男四人曰遜曰憲曰恕曰訴皆以公恩試祕書省校書郎孫女六人皆幼熙寧八年九月庚申朔二十六日乙酉諸孤奉公之喪葬于開封府新鄭縣旌賢鄉之原銘曰噫公之節其剛烈烈弼違斥姦義不可折噫公之文天資不群光輝古今左右典墳直道而行屢以讒蹶卒寤而知惟帝之哲升贊機務方隅以寧參議宰政社稷是經成此王功大忠以效德髙毁及退不吾較公之來歸既安且怡冝報以壽戾也胡為公文在人公迹在史兹惟不窮亘千萬祀神道碑蘇文定公熙寧五年秋七月觀文殿學士太子少師致仕一無此十一字歐陽文忠公薨于汝隂八年秋九月諸子奉公之喪葬于新鄭旌賢鄉自葬至崇寧五年凡三十有二年矣公子棐以墓隧之碑來請轍方以罪廢于家且病不能執筆辭不獲命乃曰病苟不死當如君志既而病巳謹桉毆陽氏自唐率更令之四世孫琮為吉州刺史後世因家于吉曽祖諱郴南唐武昌令贈太師中書令妣劉氏追封楚國太夫人祖諱偃南唐南京街院判官贈太師中書令兼尚書令妣李氏追封吳國太夫人考諱觀泰州軍事推官贈太師中書令兼尚書令封鄭國公妣鄭氏追封韓國太夫人公諱修字永叔生四歲而孤韓國守節自誓親教公讀書家貧至以荻畫地學書公敏悟過人所覽輒能誦比成人將舉進士為一時偶儷之文巳絶出倫輩翰林學士胥公時在漢陽見而竒之曰子必有名於世館之門下公從之京師兩試國子監一試禮部皆第一人遂中甲科輔西京留守推官始從尹師魯遊為古文議論當世事迭相師友與梅聖俞遊為歌詩相倡和遂以文章名冠天下留守王文康公知其賢還朝薦之景祐初召試遷鎮南軍節度掌書記館閣校勘時范文正公知開封府每進見輒論時政得失宰相惡之斥守饒州公見諌官髙若訥若訥詆誚范公以為當黜公為書責之坐貶峽州夷陵令明年移乾德令復為武成軍節度判官康定初范公起為陜西經略招討安撫使辟公掌書記公笑曰吾論范公豈以為利哉同其退不同其進可也辭不就召還復校勘遷太子中允與修崇文總目慶曆初遷集賢校理同知太常禮院求輔外通判滑州事時西師未解契丹初復舊約京東西盜賊蜂起國用不給仁宗知朝臣不任事始登進范公及杜正獻公冨文忠公韓忠獻公分列二府增諌貟取敢言士公首被選以太常丞知諫院賜五品服未幾修起居注公每勸上延見諸公訪以政事上再出手詔使諸公條天下事又開天章閣召對賜坐給紙筆使具疏于前諸公惶恐退而上時所冝先者十數事於是有詔勸農桑興學校革磨勘任子等弊中外悚然而小人不便相與騰口謗之公知其必為害常為上分别邪正勸力行諸公之言初范公之貶饒州公與尹師魯余安道皆以直范公見逐目之黨人自是朋黨之論起久而益熾公乃為朋黨論以進言君子以同道為朋小人以同利為朋人君但當退小人之偽朋用君子之真朋其言懇惻詳盡其後諸公卒以黨議不得久留於朝公性疾惡論事無所回避小人視之如仇讎而公愈奮厲不顧上獨深知其忠改右正言知制誥賜三品服仍知諫院故事知制誥必試上知公之文有旨不試與近世楊文公陳文惠公比逮公三人而巳嘗因奏事論及人物上目公曰如歐陽修何處得來蓋欲大用而未果也四年大臣有言河東芻糧不足請廢麟州徙治合河津或請廢其五寨命公往視利害公曰麟州天嶮不可廢也麟州廢則五寨不可守五寨不守則府州遂為孤壘今五寨存故虜在二三百里外若五寨廢則夾河皆虜巢穴河內州縣皆不安居矣不若分其兵駐並河清塞堡緩急不失應副而平時可省轉輸由是麟州得不廢又言欣代州岢嵐火山軍並邊民田廢不得耕號為禁地吾雖不耕而虜常盜耕之若募民計口出丁為兵量入租粟以耕歲可得數百萬斛不然他日且盡為虜有議下太原帥臣以為不便持之久之乃從凡河東賦斂過重民所不堪奏罷者十數事自河東還會保州兵亂又以公為龍圖閣直學士河北都轉運使陛辭上靣諭無為久留計有所欲言言之公曰諫官得風聞言事外官越職而言罪也上曰第以聞勿以中外為意河北諸軍怙亂驕恣小不如意輒脅持州郡公奏乞優假將帥以鎮壓士心軍中乃定初保州亂兵皆招以不死既而悉誅之脅從二千人亦分隸諸州冨公為宣撫使恐後生變與公相遇於內黃夜半屏人謀欲使諸州同日誅之公曰禍莫大於殺已降況脅從乎既非朝命州郡有一不從為變不細冨公悟乃止公奏置御河催綱司以督糧餉邊州賴之又置磁相州都作院以繕一路戎器河北方小治而二府諸公相繼以黨議罷去公慨然上書論之用事者益怒會公之外甥女張嫁公族人晟以失行繫獄言事者乘此欲并中公遂起詔獄窮治張資産上使中官監劾之卒辨其誣猶降官知滁州事居二年徙揚州又徙潁州遷禮部郎中復龍圖閣直學士留守南京遷吏部郎中丁韓國太夫人憂至和初服除入見鬚髮盡白上怪之問勞惻然恩意甚厚命判吏部流內銓小人畏公且大用偽為公奏乞澄汰宦官宦官聞之果怒會選人胡宗堯當改官坐嘗以官舟假人經赦去官法當循資公引對取旨上特令改官宦官有密奏者曰宗堯翰林學士宿之子有司右之私也遂出公知同州言者多謂公無罪上悟留刋修唐書俄入翰林為學士自滁州之貶至是十二年矣上臨御既久遍閲天下士羣臣未有以大稱上意上思冨公韓公之賢復召置二府時慶曆舊人惟二公與公三人皆在朝廷士大夫知上有致治之意翕然相慶公以學士判三班院二年奉使契丹契丹使其貴臣宗願宗熙蕭知足蕭孝友四人押燕曰此非常例以卿名重故爾嘉祐初判太常寺二年權知貢舉是時進士為文以詭異相高文體大壞公患之所取率以詞義近古為貴凡以嶮怪知名者黜去殆盡榜出怨謗紛然久之乃服然文章自是變而復古三年加龍圖閣學士權知開封府事所代包孝肅公以威嚴御下名震都邑公簡易循理不求赫赫之譽有以包公之政勵公者公曰凡人材性不一用其所長事無不舉強其所短勢必不逮吾亦任吾所長耳聞者稱善四年求罷遷給事中充羣牧使唐書成拜禮部侍郎俄兼翰林侍讀學士公在翰林凡八年知無不言所言多聽河決商胡賈魏公留守北京欲開橫壠故道回河使東有李仲昌者欲道商胡入六塔河詔兩省臺諌集議公故奉使河北知河決根本以為河水重濁理無不淤淤從下起下流既淤上流必決水性避髙決必趨下以近事驗之決河非不能力塞故道非不能力復但勢不能久必決於上流耳橫壠功大難成雖成必有復決之患六塔狹小不能容受大河以全河注之濵德博必𬒳其害不若因水所趨增治隄防疏其下流浚之入海則河無決溢散漫之憂數十年之利也陳恭公當國主橫壠之議恭公罷去而宰相復以仲昌之言為然行之而敗河北𬒳害者凡數千里狄武襄公為樞密使奮自軍伍多戰功軍中服其威名上不豫諸軍訛言籍籍公言武臣掌機密而得軍情不惟於國不便鮮不以為身害請出之外藩以保其終始遂罷知陳州公嘗因水災上言陛下臨御三十餘年而儲宫未建此久闕之典也漢文帝即位羣臣請立太子羣臣不自疑而敢請文帝亦不疑其臣有二心後唐明宗尤惡人言太子事然漢文帝立太子之後享國長久為漢太宗明宗儲嗣不早定而秦王以窺覬陷于大禍後唐遂亂陛下何疑而久不定乎公言事不擇劇易類如此五年以本官為樞密副使明年為參知政事公在兵府與曽魯公考天下兵數及三路屯戍多少地里逺近更為圖籍凡邊防久闕屯戍者必加搜輔其在政府凡兵民官吏財利之要中書所當知者集為總目遇事不復求之有司時冨公久以毋憂去位公與韓公同心輔政每議事心所未可必力爭韓公亦開懷不疑故嘉祐之政世多以為得時東宫猶未定臣僚間有言者然皆不克行最後諫官司馬光知江州吕誨言之中書將因一作因將二疏以請幸上有可意相與力贊之一日奏事垂拱讀二疏未及有言上曰朕有意久矣顧未得其人耳宗室中誰可者韓公對曰宗室不接外人臣等無由知之抑此事非臣下所敢議當出自聖斷上乃稱英宗舊名曰宫中嘗養此人今三十許歲矣惟此人可耳是日君臣定議於殿上將退公奏曰此事至大臣等未敢即行陛下今夕更思之來日取旨明日請之崇政上曰決無疑矣諸公皆曰事當有漸容臣等議所除官時英宗方居濮王憂遂議起復除泰州防禦使判宗正寺來日復對上大喜諸公奏曰此事既行不可中止乞陛下斷之於心內批付臣等行之可也上曰此豈可使婦人知之中書行之足矣時六年十月也及命下英宗力辭上聽候服除七年二月英宗既免喪稱疾不出至七月韓公議曰宗正之命既出外人皆知必為皇子矣今不若遂正其名使知愈退而愈進示朝廷不可回之意衆稱善乃以其纍表上之上曰今當如何韓公未對公進曰宗室舊不領職事今有此命天下皆知陛下意矣然誥勑付閣門得以不受今若以為皇子詔書一出而事定矣上以為然遂下詔及宫車晏駕皇子嗣位海內泰然有磐石之固然後天下皆詠歌仁宗之聖以及諸公之賢而向之黨議消釋無餘至於小人亦磨滅不見矣英宗即位之初以疾未親政慈聖光獻太后臨朝公與諸公往來二宫彌縫其間卒復明辟樞密使嘗闕人公當次輔韓公曽公議將進擬不以告公公覺其意謂二公曰今天子諒隂母后垂簾而二三大臣自相位置何以示天下二公大服而止其後張康節公去位英宗復將用公公又力辭不拜公再辭重位諸公不喻其意而服其難八年遷户部侍郎治平初特遷吏部神宗即位遷尚書左丞公性剛直平生與人盡言無所隱及在二府士大夫有所千請輒靣諭可否雖臺諫論事亦必以是非詰之以此得怨而公不恤也朝廷議加濮王典禮詔下禮官與從官定議衆欲改封大國稱伯父議未下臺官意公主此議遂專以詆公言者既以不勝輔外而來者持公愈急御史蔣之竒并以飛語汙公公杜門求辨其事神宗察其誣連詔詰問詞窮逐去公亦堅求退上知不可奪除觀文殿學士知亳州事熙寧初遷兵部尚書知青州事充京東東路安撫使時諸路散青苗錢公乞令民止納本錢以示不為利罷提舉管勾官聽民以願請不報三年除檢校太保宣徽南院使判太原府河東路經略安撫使公辭求知蔡州從之公在亳巳六請致仕比至蔡逾年復請四年以觀文殿學士太子少師致仕公年未及謝事天下益以髙公公昔守潁上樂其風土因卜居焉及歸而居室未完處之怡然不以為意公之在滁也自號醉翁作亭琅邪山以醉翁名之晚年又自號六一居士曰吾集古録一千卷藏書一萬卷有琴一張有棊一局而常置酒一壼吾老於其間是為六一自為傳刻石亦名其文曰居士集居潁一年而薨享年六十有六贈太子太師諡文忠天下學士聞之皆出涕相弔後以諸子贈太師追封兖國公公之於文天材有餘豐約中度雍容俯仰不大聲色而義理自勝短章大論施無不可有欲效之不詭則俗不淫則陋終不可及是以獨步當世求之古人亦不可多得公於六經長於易詩春秋其所發明多古人所未見嘗奉詔撰唐本紀表志撰五代史二書本紀法嚴而詞約多取春秋遺意其表傳志考與遷固相上下凡為易童子問三卷詩本義十四卷唐本紀表志七十五卷五代史七十四卷居士集五十卷外集若干卷歸榮集一卷外制集三卷內制集八卷奏議集十八卷四六集七卷集古録跋尾十卷雜著述十九卷昔孔子生於衰周而識文武之道其稱曰文王既沒文不在兹乎雖一時諸侯不能用功業不見於天下而其文卒不可掩孔子既沒諸弟子如子貢子夏皆以文名於世數傳之後子思孟子孫卿並為諸侯師秦人雖以塗炭遇之不能廢也及漢祖以干戈定亂紛紜未巳而叔孫通陸賈之徒以詩書禮樂彌縫其闕矣其後賈誼董仲舒相繼而起則西漢之文後世莫能髣佛蓋孔氏之遺烈其所及者如此自漢以來更魏晉歷南北文弊極矣雖唐正觀開元之盛而文氣衰弱燕許之流倔強其間卒不能振惟韓退之一變復古閼其頽波東注之海遂復西漢之舊自退之以來五代相承天下不知所以為文祖宗之治禮文法度追迹漢唐而文章之士楊劉而巳及公之文行於天下乃復無愧於古於乎自孔子至今千數百年文章廢而復興惟得二人焉大豈偶然也哉公篤於朋友不以貴賤生死易意尹師魯石守道孫明復梅聖俞既沒皆經理其家或言之朝廷官其子弟尤奬進文士一有所長必極口稱道惟恐人不知也公前後歷七郡守其政察而不苛寬而不弛吏民安之滁揚之人至為立生祠鄭公嘗有遺訓戒慎用死刑韓國以語公公終身行之以謂漢法惟殺人者死今法多雜犯死罪故死罪非殺人者多所平反蓋鄭公意也一本自公篤於朋友至鄭公意也一假在昔孔子生於衰周之前公初娶胥氏即翰林學士偃之女再娶楊氏集賢院學士大雅之女後娶薛氏資政殿學士簡肅公奎之女追封𡵨國太夫人男八人發故承議郎奕故光祿寺丞棐朝奉大夫辨故承議郎餘早亡孫男六人遜故臨邑縣尉憲通仕郎恕奉議郎訴故宣義郎願懋皆將仕郎孫女七人皆適士族公之在翰林也先君文安先生以布衣隱居鄉閭聞天子復用正人喜以書遺公公一見其文曰此孫卿子之書也及公考試禮部亡兄于瞻以進士試稠人中公與梅聖俞得其程文以為異人是歲轍亦中下第公亦以謂不忝其家先君不幸捐館舍亡兄與轍皆流落不偶元祐𥘉會於京師公家以公碑諉子瞻子瞻許焉既又至於大故轍之不敏以父兄故不敢復辭銘曰於穆仁宗有臣文忠自嶮而夷保其初終惟古君臣終之實難匪不用賢有孽其間公奮自南聲𬒳四方允文且忠有煒其光上實開之下實柅之三起三僨誰實使之僨而復全惟天子明克明克忠乃卒有成逮歲嘉祐君臣一德左右天造民用飲食舜禹相授不改舊臣白髮蒼顔翼然在廷功成而歸維公本心彼其何知言恐不深潁水之濵甲第朱門新鄭之墟茂木髙墳野人指之文忠之遺忠臣不危仁祖之思附録卷第二神道碑諸路散青苗錢諸路一作諸縣彼其何知其一作亦集古録跋尾卷第二歐陽文忠公集一百三十五後漢堯母碑嵗月見本文右漢堯母碑漢建寧五年造其文略曰堯母慶都感赤龍而生堯遂以侯伯恢踐帝下有闕慶都仙沒蓋葬于兹欲人莫知名曰靈臺上立黃屋堯所奉祠三代改易荒廢不修漢受濡期興滅繼絶如堯為之遂遭亡新禮祠絶矣故廷尉姓名磨滅不可讀矣深惟大漢堯之苗胄當修堯祠追逺復舊前後奏上帝納其謀歲以春秋奉大牢祠時濟隂太守魏郡審晃成陽令博陵管遵各遣大掾輔助闕一字君經之營之不日成之此其大槩也按皇覽云堯家在濟隂城陽吕氏春秋云堯葬榖林皇甫謐云榖林即城陽然自史記地志及水經諸書無堯母葬處惟見於此碑蓋亦葬城陽也而諸書俗本多為城陽獨此碑為成陽當以碑為正碑後列當時人名民又云審晃字元讓管遵字君臺又云漢受濡期莫曉其義也右集本後漢堯祠碑歲月見本文右漢堯祠碑在濟隂碑云帝堯者蓋昔世之聖王也又曰聖漢龍興纂堯之緒祠以上犧至于王莾絶漢之業而壇場夷替屏懾真迹作攝無位大抵文字磨滅字雖可見而不復成文其後有云李樹連理生於堯祠太守河南張寵到官始初出錢二千敬致禮祠其餘不能一作可讀也碑後有年月蓋熹平四年建也治平元年五月晦日書真迹後漢堯祠祈雨碑嵗月見本文右漢堯祠祈雨碑首尾殘滅其僅可識者有云股肱賢良廣祈多福虔虔夙夜又云常以甲子日詔太常陳上古之禮舞先王之樂又云延熹十年仲春二月陽氣侵隂又云享祀羣神仰瞻雲漢又曰嘉澍優霑利茂萬物又云孟府君知堯精靈與天通神修治大殿以此知為祈雨於堯祠也堯祠在漢濟隂郡孟府君者當是濟隂郡太守也其餘隸字完者頗多亦往住成句但斷續不可次序爾右集本後漢老子銘歲月見本文右漢老子銘按桓帝本紀云延熹八年正月遣中常侍左悺之苦縣祠老子至十一月又遣中常侍管霸祠之而此碑云八月夢見老子而祠之世言碑銘蔡雍作今檢雍集無此文皆不可知也右真迹後漢魯相置孔子廟卒史碑歲月見本文右漢魯相置孔子廟卒史碑云司徒臣雄司空臣戒稽首言魯前相瑛書言詔書崇聖道孔子作春秋制孝經演易繫辭經緯天地故特立廟褒成侯四時來祠事巳即去廟有禮器無常人掌領請置百石卒史一人典主守廟謹問太常祠曹掾馮牟史郭玄辭對故事辟雍祠先聖太宰太祝各一人備爵太常丞監祠河南尹給牛羊豕大司農給米臣愚以為如瑛言可許臣雄臣戒愚戇誠惶誠恐頓首頓首死罪死罪臣稽首以聞制曰可按漢書元嘉元年吳雄為司徒二生趙戒為司空即此云臣雄臣戒是也魯相瑛者據碑言姓乙字仲卿漢碑在者多磨滅此幸完可讀録之以見漢制三公奏事如此與羣臣上尚書者小異也又見漢祠孔子其禮如此治平元年六月二十日書右真迹後漢修孔子廟器碑一作表歲月見本文右漢一有朝字韓明府修孔子廟器碑云永壽二年青龍二字一作嵗在涒灘霜月之靈皇極之日永壽桓帝年號也按爾雅云歲在申曰涒灘桓帝永興三年正月戊申大赦改元永壽明年一有嵗次二字丙申曰歲在涒灘是矣云霜月之靈皇極之日莫曉其義疑是九月五日前漢文章之盛庶幾三代之純深自建武以後頓爾衰薄崔蔡之徒擅名當世然其筆力辭氣非出自然與夫楊馬之言醇醨異味矣及其末也不勝其弊霜月皇極是何等語韓明府者名勑字叔節前世見於史傳未有名勑者豈自余學之不博乎春秋左氏傳載古人命名之説不以為名者頗多故以勑為名者少也治平元年二月晦日書右真迹後漢魯相晨孔子廟碑歲月見本文右漢魯相上尚書章其略云建寧二年三月癸卯朔七日已酉魯相臣晨長史臣謙頓首死罪上尚書臣晨頓首頓首死罪死罪臣以元年到官行秋饗飲酒泮宫復禮孔子宅而無公出酒脯之祠臣輒依社稷出王家榖春秋行禮建寧靈帝年號也於此見漢制天子之尊其辭稱頓首死罪而不敢斥至尊因尚書以致逹而巳余家集録漢碑頗多亦有奏章患其磨滅獨斯碑首尾完備可見當時之制也又云孔子乾坤所挺西狩獲麟為漢制作故孝經援神契曰玄丘制命帝卯行又尚書考靈耀曰丘生倉際觸期稽度為赤制讖緯不經不待論而可知甚矣漢儒之狹陋也孔子作春秋豈區區為漢而巳哉治平元年三月草五日書右真迹後漢碑隂題名歲月未詳右漢碑隂題名不知為何人碑余家集録古文既多或失其所得之自然漢碑存於今者惟華嶽與孔子廟最多其隂往往列修廟人姓名并記其所出錢數不過三百至五百今斯碑所題文字缺滅而中間有錢各五百四字則似是修廟人所記其人可見者有濟隂定陶蔡皓子盛山陽金鄉張諺季德河南宛陵趙堂世萇南陽南鄉鄧升升逺濟隂成武周鳳季節而其餘人姓名邑里多不完又時時有故吏字不知為何人祠廟第以漢隸難得録之爾治平元年閏五月八日書右真迹同前右漢碑隂題名不知為何碑之隂蓋余家集録既多而或失其所得之處又其文字磨滅莫可考究惟有錢各五百四字似是漢時修廟人爾漢碑今在者惟華嶽與孔子廟中最多其碑隂題名者往往各書所出錢數不過三百五百也而此碑所列邑里姓名字完可見者尚十餘人然皆是濟隂山陽彭城汝南陳留人則疑為修孔子廟人也今列于後覽者可以察焉濟隂定陶蔡皓子盛濟隂張翔季審陳留酸棗李直顯節山陽金鄉張諺季德河南宛陵趙堂世萇南陽南鄉鄧升升逺濟隂成武周鳳季節山陽昌邑田胤元尊濟隂成武史楞世明彭城朱翔元舉右真迹同前右漢碑隂題名二皆不知為何碑隂其人各記所出錢數似是漢時修廟人題名余家集録華嶽及孔子廟碑多如此此亦疑是二廟中碑前碑殘滅尤甚第時有門生濟南東郡等字而姓名無復完者後碑則有議曹功曹騎吏有蓮勺左鄉有秩池陽左鄉有秩池陽集丞有秩皆不知是何名號又有闕一字陽候長祋祤候長則是縣吏之名其隸字不甚精又無事實可考姑録其名號以俟知者爾右集本後漢張公廟碑歲月君本文真迹右漢張公廟碑在黎陽而碑無題首又其文字殘滅不可考究莫知為何碑第時時得其字之可識而僅成文者曰惟和平元年正月丙寅和平桓帝年號以此知為漢碑也又曰豐碑廟堂之前又曰於穆張公則又知為張公廟碑矣又云國無災屢獲豐年作歌九章頌公德芳其辭有云公與守相駕蜚魚往來倐忽逺熹娛祐此􅖕民寧厥居其餘字畫尚完者甚多但不成文爾治平元年閏五月九日書是日奏事垂拱退召赴延和閲謝契丹禮物遂歸休後漢公昉碑一作仙人唐君碑歲月未詳右漢公昉碑者乃漢中太守南陽郭芝為公昉修廟記也漢碑今在者類多磨滅而此記文字廑存可讀所謂公昉者初不載其姓名但云君字公昉爾又云耆老相傳以為王莾居攝二年君為郡吏啖瓜旁有真人一有居字左右莫察君獨進美瓜又從而敬禮之真人者遂與期谷口山上乃與君神藥曰服藥以後當移意萬里知鳥獸言語是時府君去家七百餘里休謁往來轉景即至闔郡驚焉白之府君徙為御史一作吏鼠齧𬒳具君乃畫地為獄召鼠誅之視其腹中果有𬒳具府君欲從學道頃無所進府君怒勑尉部吏收公昉妻子公昉呼其師告以厄其師以藥飲公昉妻子曰可去矣妻子戀家不忍去於是乃以藥塗屋柱飲牛馬六畜須臾有大風雲來迎公昉妻子屋宅六畜翛然與之俱去其説如此可以為怪妄矣嗚呼自聖人殁而異端起戰國秦漢以來一作之際竒辭怪説紛然爭出不可勝數久而佛之徒來自西夷老之徒起於中國而二患交攻為吾儒者往往牽而從之其卓然不惑者僅能自守而已欲排其説而黜之常患乎力不足也如公昉之事以語愚人竪子皆知其妄矣不待有力而後能破其惑也然彼漢人乃刻之金石以傳後世其意惟恐後世之不信然後世之人未必不從而惑也治平元年四月二十三日以旱開宫寺祈雨五日中一日休務假書右真迹後漢析里橋郙閣頌歲月見本文右漢析里橋郙閣頌建寧五年立云惟斯析里處漢之右溪源漂疾橫注于道涉秋霖漉稽滯商旅休謁往還常失日晷行理咨嗟郡縣所苦斯溪既然郙閣尤甚臨深長淵三百餘丈接木相連號為萬柱遭遇隤納人物俱隋一作隳沈沒洪淵酷烈為禍於是太守阿陽李君諱會字伯都以建寧三年二月辛巳到官思惟惠利有以綏濟聞此為難其日久矣乃俾府掾仇審改解危殆即便求隱析里大橋於爾乃造又醳散關之􅢉漯徙朝陽之平慘減西髙閣就安寧之石道禹導江河以靖四海經紀厥績艾康萬里乃作頌曰頌後又有詩皆磨滅不完其云遭遇隤納又云醳散關之􅢉漯徙朝陽之平慘刻畫適完非其訛繆而莫詳其義疑當時人語與今異又疑漢人用字簡略假借不同爾故録之以俟博識君子治平元年六月十日書右真迹後漢人闕銘歲月未詳真迹右漢人闕銘二其一曰永樂少府賈君闕其一曰雒陽令王君闕二者皆不知為何人按漢書桓帝母孝崇匽皇后居永樂宫和平元年詔置太僕少府如長樂故事又按顔師古注地里志曰魚豢真迹誤作劵云漢火行忌水故去洛水加隹師古謂光武以後始改為雒然則二人者皆後漢時人也又按漢官儀長樂少府以宦者為之則賈君者蓋亦宦者也治平元年九月十五日書後漢文翁石柱記歲月見本文右漢文翁石柱記云漢初平五年倉龍甲戌旻天季月修舊築周公禮殿始自文翁開建泮宫據顔有意益州學館廟堂記云按一無此字華陽國志文翁為蜀郡守造講堂作一無此字石室一名玉堂安帝永初間烈火為災堂及寺舍並皆焚燎惟石室獨存至獻帝興平元年太守髙朕於玉堂東復造一石室為周公禮殿有意又謂獻帝無初平五年當是興平四字一作當如華陽志為興平元年蓋時天下喪亂西蜀僻逺年號不通故仍稱舊號也今檢范曄漢書本紀初平五年正月改為興平顔説是也治平元年六月十三日書右真迹後漢文翁學生題名右漢文翁學生題名凡一百有八人文學祭酒典學從事各一人司儀主事各二人左生七十三人右生三十人文翁在蜀教學之盛為漢稱首其弟子著籍者何止於此蓋其磨滅之餘所存者此爾治平元年六月二十日書右真迹後漢泰山都尉孔君碑歲月見本文右漢泰山都尉孔君碑云君諱宙字季將二字一作秀特孔子十九世之孫也年六十一延熹四年正月乙未以疾卒一有于家二字其序官閥甚簡又或殘滅不完但見其舉孝廉為郎遷元城令遂為泰山都尉爾其辭有云躬忠恕以及人兼禹湯之罪已宙人臣而引禹湯以為比在今人於文為不類蓋漢世近古簡質猶如此也治平元年閏五月二十一日書右真迹後漢孔宙碑隂題名百人其親授業者為弟子轉相傳授者為門生今宙右漢孔宙碑隂題名漢世公卿多自教授聚徒常數碑殘缺其姓名邑里僅可見者才六十二人其稱弟子者十人門生者四十三人故吏者八人故民者一人宙孔子十九世孫為泰山都尉自有録治平元年閏五月二十一日書右真迹後漢孔君碑歲月見本文真迹右漢孔君碑其名字磨滅不可見而世次官閥粗可考云孔子十九代孫潁川君之元子也舉孝廉除郎中博昌長遭太守君憂服竟拜尚書侍郎治書御史博陵太守遷下邳相河東太守建寧四年十月卒其餘文字歷歷可讀以其斷絶處多文理難續故不復盡録然其終始略可見矣惟其名字皆亡為可惜也治平元年五月十日書後漢孔德讓碑一作碣歲月見本文右漢孔德讓碑蓋其名巳磨滅但云字德讓者宣尼公二十世孫都尉君之子也仕歷郡諸曹史年二十永興二年七月遭疾不祿碑在今兖州孔子墓林中永興孝桓帝年號也一有都尉者宙也五字其人二字一作德讓早卒無事迹可考余集録所藏一有獨闕二字孔林中漢一無此字碑最後得此遂無遺者蓋以其文字簡少無事實故世人遺而不取獨余家有之也治平元年閏五月二十日書右真迹而傳載遷官次序頗略蓋史之所記善惡大事官次雖小略不足為失惟其繆誤與闕其大莭不可不正碑云大將軍以禮脅命拜侍御史遷梁令三府並用博士徴皆不就司隸校尉舉其有道公車徴拜議郎司徒長史而傳但云大將軍辟五遷司徒長史今據碑止四遷爾博士未嘗拜也碑於長史下遂云入登侍中延熹八年地震有詔詢異而拜尚書遷南陽太守拜太中大夫復拜侍中屯騎尉宗正光祿勳遂授太尉傳至太中大夫始云遷侍中其前自長史入登侍中史闕書也碑又云固疾遜位拜光祿大夫遷衛尉復作太尉而傳云以日食免拜衛尉以日食免當從傳為正而不書光祿大夫史闕也其餘皆同故不復録右集本後漢太尉劉寬碑隂題名歲月見本文右漢太尉劉寬碑隂題名寬碑有二其故吏門生各立其一也此題名在故吏所立之碑隂其别列於後者在寬子松之碑隂也寬以漢中平二年卒至唐咸亨元年其裔孫湖一作胡城公爽以碑歲久皆仆于野為再立之并記其世序嗚呼前世士大夫世家著之譜牒故自中平至咸亨四百餘年而爽能知其世次如此之詳也蓋自黃帝以來子孫分國受姓歷堯舜三代數千歲間詩書所紀皆一有各字有次序豈非譜繫源流傳之百世而一無此字不絶歟此古人所以為重也不然則士生於世皆莫自知其所出而昧其世德逺近其所以異於禽獸者僅能識其父祖爾其可忽哉唐世譜牒尤備士大夫務以世家相高至其弊也或陷輕薄婚姻附託邀求貨賂君子患之然而士子修飭喜自樹立兢兢惟恐墜其世業亦以有譜牒而能知其世也今之譜學亡矣雖名臣巨族未嘗有家譜者然而俗習苟簡廢失者非一豈止家譜而已哉嘉祐八年七月二十九日書右真迹後漢楊震碑嵗月未詳右漢楊震碑首題云漢故太尉楊公神道碑銘文字殘缺首尾不完其可見而僅成文者云聖漢龍興神祇降祉乃生于公又云窮神知變與聖同符鴻漸衡一作于門羣英雲集又云貽我三魚以章懿德又云大將軍辟舉茂材除襄城令遷荆州刺史東萊涿郡太守又云司徒太尉立朝正色恪勤竭忠其餘字存者多而不復成文矣治平元年六月十日書右真迹後漢楊震碑隂題名右漢楊震碑隂題名者一百九十人其餘磨滅不完者又十餘人余家所録漢碑隂題名頗多或稱故吏門生弟子或稱從事曹掾之類其人皆著州縣邑里名字甚詳獨此碑所書簡略直云河間賈伯錡博陵劉顯祖之類凡百九十人者皆然疑其所書皆是字爾蓋後漢時人見於史傳者未嘗有名兩字者也漢隸世所難得幸而在者多殘滅不完獨此碑刻畫完具而隸法尤精妙甚可喜也治平元年中伏日書真迹後漢沛相楊君碑歲月見本文真迹右漢沛相楊君碑在閿鄉楊震墓側碑首尾不完失其名字按後漢書震及中子秉秉子賜賜子彪皆有傳又云震長子牧冨波相牧孫竒侍中竒子亮陽成亭侯又云少子奉奉子敷敷子衆蓩亭侯又有彪子修楊氏子孫載于史傳者止此爾不知沛相為何人也碑云孝順皇帝西巡以掾史召見拜郎中遷常山長史換犍為府丞宰司纍辟應于司徒州察茂才遷鮦陽侯相後拜議郎五官中郎將沛相年五十六建寧元年六月癸丑遘疾而卒其終始尚可見而惜其名字亡矣治平元年六月十日書後漢繁陽令楊君碑熹平中右漢繁陽令楊君碑首尾不完文字磨滅可識者四百三十字不可識者六十一字碑云君遭叔父太尉薨委榮輕舉吏民攀轅守闕上書運榖萬斛助官賑貧以乞君還又云一作君冨波君之子按漢書楊震子牧為冨波相君乃牧子也叔父太尉者秉也出米乞令前史所無惜其名字磨滅不可見矣嘉祐八年十月草三日書右真迹後漢髙陽令楊君碑歲月未詳右漢髙陽令楊著碑首尾不完而文字尚可識云司隸從事定潁侯相最後為善侯相善上一字磨滅不可見蓋其中間嘗為髙陽令而碑首不書最後官者不詳其義也按楊震碑髙陽令著震孫也今碑在震墓側一有右真迹也字後漢楊君碑隂題名真迹右漢楊君碑隂題名首尾不完今可見者四十餘人楊震子孫葬閿鄉者數世碑多殘缺此不知為何人碑隂其後有云右後公門生又云右沛二字集本作後史君門生沛君疑是沛相者自有碑而亡其名字矣後公亦不知為何人也治平元年六月十日書同前真迹右漢楊君碑隂題名凡一百三十一人有稱故吏者故民者處士者故功曹史者故門下佐者類例不一似當時人各隨意書之而文字磨滅僅可讀其姓名字俱完可識者八十三人其餘或在或亡蓋後漢楊震墓域中碑也楊氏墓在閿鄉有碑數廳皆漢世所立余家集録得其四震及沛相繁陽髙陽令碑并得碑隂題名然一有嚮字得時參錯不知為何碑之隂也其名氏可見者當時皆無所稱述顧其人亦不足究考第以漢隸真迹金石所傳者至今類多磨滅可惜故録之爾治平元年三月晦日書後漢碑隂題名右漢碑隂題名在閿鄉楊震墓側文字磨滅不復可考其僅可見者曰候長汾隂趙遺子宣候上滅一字又曰故督郵曹史縣功曹鄉部吏柏昱等人名鄉上又滅一字又曰西鄉亭長柏昱子政又曰鄉亭長翟國相如鄉上又滅一字又曰麟都亭長隂定安定谷口亭長方文雅方上又滅一字東門亭長梁忠子孝四望亭長吳鴻子名麟武亭長常皓君宣其餘缺裂不完蓋楊氏子孫當時皆葬閿鄉碑碣往往磨滅此不知為誰碑也治平五年五月草日謝雨致齋于太社書右真迹後漢楊公碑隂題名真迹右漢楊公碑隂題名楊氏世葬閿鄉墓側皆有碑今其存者四余家集録皆得之乃太尉沛相髙陽繁陽令也此碑隂者不知為何人碑文字殘缺其僅存者十五人又滅其一其在者十四人曰懷陵圉令相蔣禧字武仲冝祿長蕭劉瑞字仲祐孝廉杼秋劉旭字子明太官日丞譙曹臻字建國辭曹史鄲公孫銀字山根門下書佐史韓純字子敬豐畢珮字廣世鄲孟縱字河雒決曹書佐鄲公孫晹字元晹皆稱故吏又有故吏一無二字贊陳俊字仲顯蘄夏陽字儀公蘄兒銀字伯玉杼秋劉順字子選沛周儀字帛民凡五人皆不著職一有但稱故吏四字而孟縱字河雒周儀字帛民文字皆完非訛繆而莫曉其義也治平元年六月十四日書後漢殘碑隂歲月未詳右漢殘碑隂前後二字一作亦磨滅不知為何人碑其知為漢碑者蓋其隸字非漢人莫能為也其字僅可見者尚數十而姓名完者九人曰王伯鄉趙仲方賈元周王景陽賈元輔宗石處王仲宣馬安國王通國皆無官號邑里莫知為何人惟漢隸在者少為難得故録之治平元年五月十八日書右真迹後漢朔方太守碑隂歲月見本文右漢朔方太守碑隂題名一無此字云永壽二年朔方太守上郡仇君察察下滅一字除郎中大曲長大下又滅一字延熹四年九月乙酉詔書遷衙令五年正月到官奉見明府見下又滅一字立祠刋石表章大聖之遺靈永示來世之未一作末未下又滅一字謹出錢千千下又滅兩字者下行因紀姓名一無七字據此乃當時修廟出錢人爾今其姓名往往可見云衙鄉三老時勤伯秋上官鳳季方録事史楊禹孟布衙主記椽楊綬子長門下功曹裴篤伯安倉曹掾任就子優又有集曹掾軍一作君假司馬之類名字多不完其所出錢不過三百至五百蓋漢世物輕幣重今華嶽孔子廟碑隂所列亦皆如此其所立祠蓋不知為何廟也治平元年夏至日書右真迹後漢劉曜碑一有并隂二字歲月未詳真迹右漢劉曜碑在今鄆州界中文字磨滅僅有存者云諱曜字季尼年七十三其餘爵里官閥卒葬歲月皆不可見字為漢隸亦不甚工惟其銘云天臨大漢錫以明哲碑首題云漢故光祿勳東平無鹽劉府君之碑以此知為漢碑也治平元年四月一日書後漢北海相景君銘歲月見本文右漢北海相景君銘其碑首題云漢故益州太守北海相景君銘其餘文字雖往往可讀而漫滅多不成文故君之名氏邑里官閥皆不可考一作見其可見者云惟漢安二年北海相任城府君卒城下一字不可識當為景也漢功臣景丹封櫟陽侯傳子尚尚傳子苞苞傳子臨以無嗣絶安帝永𥘉中鄧太后紹封苞弟遽為監亭侯以續丹後自是而後史不復書而他景氏亦無顯者漢安順帝年號也君卒於順帝時蓋與遽同時人也碑銘有云不永麋夀余家集録三代古器銘有云眉壽者皆為麋蓋古字簡少通用至漢猶然也治平元年四月二十九日書右真迹後漢謁者景君碑右漢景君碑尤磨滅惟謁者任城景君數字尚完其餘班班可見者皆不能成文故其年世壽考功行卒葬莫可考也蓋漢隸今尤難得其磨滅之餘可惜爾右集本後漢景君石郭銘右景君石郭銘者余既得前景君碑又得此銘皆在任城不知一景君乎將任城景氏之族多耶文字磨滅不可考故附于此熙寧三年正月朔旦山齋記右真迹後漢袁良碑歲月見本文右漢袁良碑云君諱良字卿卿上一字磨滅陳國扶樂人也厥先舜苗世為封君周興虞閼父自此而滅又云滿為陳侯至玄孫濤塗以字立姓曰袁自此又滅又云當秦之亂隱居河洛髙祖破項實從其册天下既定還宅扶樂蓋不知為何人也又云孝武征和三年曾孫斬賊先勇拜黃門郎曽孫滅其名賊下亦一作又滅一字又曰封關內侯食遺鄉六百戶薨子經嗣經薨子山嗣傳國三世至王莽而絶君即山之曽孫也舉孝廉郎中謁者將作大匠丞相令廣陵太守討江賊張路等威震徐方謝病歸家孝順𥘉𥘉下數字滅一作滅數字又云府舉君拜議郎符節令其後又云永建六年二月卒其碑首題云漢故國三老袁君碑而碑文有使者持節安車又有几杖之尊袒割之養君實饗之之語以此知良嘗為三老矣其餘磨滅雖時時可讀而不能次第也又云帝御九龍殿引對飲宴九龍殿名惟見於此治平元年五月二十九日夏至假書右真迹後漢張平子墓銘永和四年右漢張平子墓銘世傳崔子玉撰并書按范曄漢書張衡傳贊云崔子玉謂衡數術窮天地制作侔造化此銘有之四字一作今銘有此語則真子玉作也其刻石為二本一在南陽一在向城天聖中有右班殿直趙球者知南陽縣事因治縣署毀馬臺得一石有文驗之乃斯銘也遂龕于聽事之壁其文至凡百君子而止其後一有半字亡矣其在向城者今尚書屯田貟外郎謝景𥘉得其半於向城之野自凡百君子巳上則亡矣三字一作其前半亡矣今以二本相輔續其文遂復完而闕其最後四字然則昔人為二本者不為無意矣據徐方回所記二十一字乃趙球所得南陽石之亡者二十一字一作唐寶應中有徐方回者别得二十一字云是銘最後文疑球所得南陽石之半亡者爾今不復見則又亡矣惜哉嘉祐八年歲在癸卯十月十八日書右真迹集古録跋尾卷第二堯母碑元第四百六十一堯母一有祠字恢踐帝一有宫字奉祠一作祀讀矣一無矣字諸書此下一有皆字嘉祐元年三月二十九日書一有此十一字堯祠碑元第七百九十一屏懾真碑及公跋皆作屏懾或因國語并左氏傳疑懾為攝非祈雨碑元第九百六十一又曰一作云斷續一作絶治平元年六月六日書一有此九字老子銘元第一百六十一置孔子廟卒史碑元第三百九十辟雍一作雍碑作雍修孔子廟器碑元第三百五十一莫曉莫字上一有者字孔子廟碑元第四百七十一異碑隂題名元第八百一斯碑一無碑字世萇一作長同前元第八百三十一又有此下闕一夏字治平元年閏五月九日書一有此十字張公廟碑元第八百二十一災一作冦公昉碑元第五百七十府君一無君字君徙碑作從郙閣頌元第九百八十一府掾碑作衡官掾徙朝碑作從朝經紀碑作記後漢人闕銘元第七百八十一人也一無也字石柱記元第二百二十一文翁學生題名元第六十一都尉孔君碑元第三百八十一宙人臣一作宙為人臣此也一無也字沛相揚君碑元第十一長子一無長字右漢楊君碑者其名字皆巳磨滅惟其銘云明明楊君其姓尚可見爾其官閥始卒則粗可考云孝順皇帝西巡以掾史召見帝嘉其忠臣之苗器其璵璠之質詔拜郎中遷常山長史換犍為府丞非其好也乃翻然輕舉宰司纍辟應于司徒州察茂林遷鮦陽侯相金城太守南蠻蠢迪王師出征拜車騎將軍從事軍還䇿勳復以疾辭後拜議郎五官中郎將沛相年五十六建寧元年五月癸丑遘疾而卒其終始頗可詳見而獨其名字泯滅為可惜也是故余嘗以謂君子之垂乎不朽者顧其道如何爾不託於事物而傳也顔子窮臥陋巷亦何施於事物耶而名光後世物莫堅於金石蓋有時而弊也治平元年閏五月二十八日書此與前本不同故兩存之繁陽令楊君碑元第一百一髙陽令楊君碑元第一百十一楊君碑隂題名元第二十一亦不知為一作不知其為同前元第四百八十一楊君一作氏史者一無者字同前元第七百四十二五年一作元年同前元第二百二十一後漢殘碑隂元附二百二十一惟漢隸在者少為難得故録之一無此十二字朔方太守碑隂元附二百二十一劉曜碑元第五百一哲一作詰景君銘元第六百二十一景君碑元第九百七十一熙寧二年十月朔一作晦日山齋書一有此十一字景君石郭銘元附九百七十一袁良碑元第七百七十一時時一作有時張平子墓銘元第三十一謂衡一作稱衡
