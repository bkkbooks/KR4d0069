body:
  text: 書三與謝景山書修頓首再拜景山十二兄法曹昨送馬人還得所示書并古瓦硯歌一軸近著詩文又三軸不勝欣喜景山留滯州縣行年四十獨能異其少時俊逸之氣就於法度根蒂一作柢前古作為文章一下其筆遂髙於人乃知駔駿之馬奔星覆駕及節之鑾和以駕五輅而行於大道則非常馬之所及也古人久困不得其志則多躁憤佯狂失其常節接輿屈原之輩是也景山愈困愈刻意又能恬一作安然習於聖人之道賢於古人逺矣某嘗自負平生不妄許人之交而所交必得天下之賢才今景山若此於吾之交有光所以某益得自負也幸甚幸甚與君謨往還書不如此何以發明然何必懼人之多見也若欲衒長而恥短則是有爭心於其中有爭心則意不在於謀道也荀卿曰有爭氣者不可與辨此之謂也然君謨既規景山之短不當以示人彼以示人景山不當責之而欲自蔽也願試思之此縣常有人入京頻得書信往還今者兹人入京作書多未能子細夏熱千萬自愛答李淑內翰書修啓修違去門館今三年矣罪棄之迹不敢自齒於人是以雖有誠心飢渴之勤而奏記通問彌時曠闕惟恃憐憫寬而置之今月六日郵中蒙賜手書加以存恤憔悴之意感恱何勝幸甚幸甚問及五代紀傳修曩在京師不能自間輒欲妄作幸因餘論發於教誘假以文字力欲奬成不幸中間自罹咎責爾來三年陸走三千水行萬里勤職輔過營私養親偷其暇時不敢自廢收拾綴緝粗若有成然其銓次去取須有義例論議褒貶此豈易當故雖編托甫就而首尾顛倒未有卷第當更資指授終而成之庶幾可就也蕞爾之質列一作限於囚拘瞻望門墻豈任私恨答孫正之侔第一書修白孫生足下丁元珍書至辱所示書及雜文二篇辭博義髙而不違於道甚喜甚喜元珍言足下好古自守不妄接人雖居鄉閭罕識其面其特立如此而乃越千里以書見及若某者何以當之豈足下好忽近而慕逺邪得非以道見謀不為逺近親疏然者也僕愚學不足以自立而氣力不足以動人而言不見信於世不知足下何為而見及今又豈足下所取信者丁元珍愛我而過譽邪學者不謀道久矣然道固不茀廢而聖人之書如日月卓乎其可求苟不為刑禍祿利動其心者則勉之皆可至也惟足下力焉而不止則不必相見以目而後可知其心相語以言而後可盡其説也以所示文求足下之志苟不惑而止則僕將見足下大發于文著于行而質于行事以要其成焉答孫正之第二書某再拜人至辱書甚勤前年丁元珍得所示書喜吾子之好學自立然未深相知及得今書乃知吾子用心如此僕與吾子生而未相識面徒以一言相往來而吾子遽有愛我之意欲戒其過使不陷於小人此非惟朋友之義乃一作而吾父兄訓我者不過如此也僕自知何足愛而吾子所愛者道也世之知道者少幸而有焉又自為過失以取纍不得為完人此吾子之所悉也僕知道晚三十年一作以前尚好文華嗜酒歌呼知以為樂而不知其非也及後少識聖人之道而悔其往咎則巳布出而不可追矣聖人曰勿謂小惡為無傷言之可慎也如此為僕計者已無奈何惟有力為善以自贖爾書曰改過不吝書不譏成湯之過而稱其能改則所以容後世之能自新者聖人尚爾則僕之改過而自贖其不晚也吾子以謂如此可乎尚為未可則願有可進可贖之説見教吾子待我者厚愛我者深惜乎未得相見以規吾子之所未至者以報大惠蓋其他不足以為報也值多事不子細與王源叔問古碑字書修頓首白源叔學士秋涼體候無恙修以罪廢不從先生長者之遊久矣今春蒙恩得徙兹邑然地僻而陋罕有學者幸而有之亦不足與講論或事有凝滯無所考正則思見君子北首瞻望而已縣有古碑一片一作斫在近郊數大冢之間圖經以為儒翟先生碑其文云先生諱壽字元考南陽隆人也大略述其有道不仕以斆學為業然不著其姓氏其題額乃云玄孺一作玄儒先生碑字疑非翟字而莫有識者許慎説文亦不載外方無他書可考正其文辭簡質皆隸書書亦古朴隱隱猶可讀乃云熹平三年所立去今蓋八百五十六年矣漢之金石之文存于今者蓋寡惜其將遂磨滅而圖記所載訛謬若斯遂使漢道草莽之賢湮沒而不見源叔好古博學知名今世必識此字或能究見其人本末事迹悉以條示幸甚幸甚原叔居京師事多不當以此煩聽覽漸寒千萬保重不宣與刁景純學士書修頓首啓近自罷乾德遂居南陽始見謝舍人知丈丈內翰凶訃聞問驚怛不能巳已丈丈位望並隆然平生亦嘗坎軻數年以來方履亨塗任要劇其去大用尺寸間爾豈富與貴不可力為而天之賦豫多少有限邪凡天之賦豫人者又量何事而為之節也前既不可詰但痛惜感悼而巳某自束髮為學初未有一人知者及首登門便被憐獎開端誘道勤勤不巳至其粗若有成而後止雖其後遊於諸公而獲齒多士雖有知者皆莫之先也然亦自念不欲效世俗子一遭人之顧已不以至公相期反趨走門下脅肩諂笑甚者獻讒諛而僃使令以卑昵自親名曰報德非惟自私直亦待所知以不厚是故懼此惟欲少勵名節庶不泯然無聞用以不負所知爾某之愚誠所守如此然雖胥公亦未必諒某此心也自前嵗得罪夷陵奔走萬里身日益窮迹日益踈不及再聞語言之音而遂為幽明之隔嗟夫世俗之態既不欲為愚誠所守又未克果惟有望門長號臨柩一奠亦又不及此之為恨何可道也徒能惜不永年與未大用遂與道路之人同歎爾知歸葬廣陵遂謀京居議者多云不便而聞理命若斯必有以也若須春水下汴某歲盡春初當過京師尚可一拜見以盡區區身賤力微於此之時當有可致而無毫髮之助慚愧慚愧不宣某再拜按內翰胥偃以寶元二年八月卒此書乃當時所作既與刁君不應稱文人若與胥氏子又不應稱胥公當考與陳貟外書陳君足下無恙近縣幹上府得書一角屬有少吏事不皇作報既而私有惑者修本愚無似固不足以希執友之逰然而羣居平日幸得肩從齒序跪拜起居竊兄弟行寓書存勞謂宜有所款曲以親之之意奈何一幅之紙前名後書且狀且牒如上公府退以尋度非謙即疏此乃世之浮道之交外陽相尊者之為非宜足下之所以賜修也古之書具惟有鉛刀竹木而削札為刺止於逹名姓寓書於簡止於舒心意為問好惟官府吏曹凡公之事上而下者則曰符曰檄問訊列對下而上者則曰狀位等相以往來曰移曰牒非公之事長吏或自以意曉其下以戒以飾者則曰教下吏以私自逹於其屬長而有所候問請謝者則曰箋記書啓故非有狀牒之儀施於非公之事相參如今所行者其原蓋出唐世大臣或貴且尊或有權於時縉紳湊其門以傅嚮者謂舊禮不足為重務稍增之然始於刺謁有參候起居因為之狀及五代始復以候問請謝加狀牒之儀如公之事然止施於官之尊貴及吏之長者其偽繆所從來既逺世不根古以為當然居今之世無不知此而莫以易者蓋常俗所為積習以一作巳牢而不得以更之也然士或同師友締交遊以道誼相期者尚有手書勤勤之意猶為近古噫候問請謝非公之事有狀牒之儀以施于尊貴長吏猶曰非古之宜用況又用之於肩從齒序跪拜起居如兄弟者乎豈足下不以道義交遊期我而惜手書之勤邪將待以牽俗積習者而姑用世禮以遇我之勤邪不然是為浮道以陽相尊也是以不勝拳拳之心謹布左右屬以公檄赴滑臺行視驛傳迫於促裝楊秀才旦一作且詣縣府中事可悉數答祖擇之書修啓秀才人至蒙示書一通并詩賦雜文兩策諭之曰一覽以為如何某既陋不足以辱好學者之問又其少賤而長窮其素所為未有足稱以取信於人亦嘗有人問者以不足問之愚而未嘗答人之問足下卒然及之是以愧懼不知所言雖然不逺數百里走使者以及門意厚禮勤何敢不報某聞古之學者必嚴其師師嚴然後道尊道尊然後篤敬篤敬然後能自守能自守然後果於用果於用然後不畏而不遷三代之衰學校廢至兩漢師道尚存故其學者各守其經以自用是以漢之政理文章與其當時之事後世莫及者其所從來深矣後世師法漸壞而今世無師則學者不尊嚴故自輕其道輕之則不能至不至則不能篤信信不篤則不知所守守不固則有所畏而物可移是故學者惟俯仰徇時以希祿利為急至於忘本趨末流而不返夫以不信不固之心守不至之學雖欲果於自用莫知其所以用之之道又況有祿利之誘刑禍之懼以遷之哉此足下所謂志古知道之士世所鮮而未有合者由此也足下所為文用意甚高卓然有不顧世俗之心直欲自到於古人今世之人用心如足下者有幾是一作士則鄉曲之中能為足下之師者謂誰交遊之間能發足下之議論者謂誰學不師則守不一議論不博則無所發明而究其深足下之言髙趣逺甚善然所守未一而議論未精此其病也竊惟足下之交遊能為足下稱才譽美者不少今皆捨之逺而見及乃知足下是欲求其不至此古君子之用心也是以言之不敢隱夫世無師矣學者當師經師經必先求其意意得則心定心定則道純道純則充於中者實中充實則發為文者輝光施於世者果致疑三代兩漢之學不過此也足下患世未有合者而不棄其愚將某以為合故敢道此未知足下之意合否與田元均論財計書修啓承有國計之命朝野欣然引首西望近審已至闕下道路勞止寢味多休弊乏之餘諒煩精慮建利害更法制甚易若欲其必行而無沮改則實難裁冗長塞僥幸非難然欲其能久而無怨謗則不易為大計既遲久而莫待收細碎又無益而徒勞凡相知為元均慮者多如此説不審以為如何但日冀公私蒙福爾春暄千萬為國自厚一作重不宣修再拜答徐無黨第一書修白人還惠書及始隱書論等并前所記獲麟論文辭馳騁之際豈常人筆力可到於辨論經旨則不敢以為是蓋吾子自信甚鋭又嘗取信於某苟以為然誰能奉奪凡今治經者莫不患聖人之意不明而為諸儒以自出之説汨之也今於經外又自為説則是患沙渾水而投土益之也不若沙土盡去則水清而明矣魯隱公南面治其國臣其吏民者十餘年死而入廟立諡稱公則當時魯人孰謂息姑不為君也孔子修春秋凡與諸侯盟會行師命將一以公書之於其卒也書曰公薨則聖人何嘗異隱於他公也據經隱公立十一年而薨則左氏何從而知其攝公羊榖梁何從而見其有讓桓之迹吾子亦何從而云云也仲尼曰吾其為東周乎與吾子起於平王之説何相反之甚邪故某常告學者慎於述作誠以是也秋初許相訪此不子細略開其端吾子必能自思而得之不宣某書白答徐無黨第二書修再拜白前夜自外歸燈下得吾子書言陳烈事亟讀之未暇求陳君之所為尤愛吾子辭意甚質徑知吾子之有成不負其千里所以去父母而來之之意修亦粗塞責不愧干吾子之父母與親戚鄰里鄉黨之人甚善甚善修今歲還京師職在言責值天下多事常日夕汲汲為明天子求人間利病無小大皆躬自訪問於人又夏大暑老母病故不得從今學者以逰得少如前歲之樂自入京來便聞陳君之名數以問於人多不識今得吾子所言如見其面矣幸母病今巳愈望時過且謀共見陳君與陳之方書某白陳君足下某憂患早衰之人也廢學不講久矣而幸士子不見棄日有來吾門者至於粹然仁義之言韙然閎博之辨蔚然組麗之文閲於吾目多矣若吾子之文辨明而曲暢峻潔而舒遲變動往來有馳有止而皆中於節使人喜慕而不厭者誠難得也某固不能悉得天下之士然盡某所見如吾子之文豈一二而可數哉為而不止行而必至畜厚而發益逺吾雖不能悉得天下之士然天下之士如吾子者可一二而數也某老矣心耗力憊有所不能徒喜後生之奮於斯也恨不得鳴躍於其間而從之姑奉此為謝外集卷第十八答孫正之第一書今又二字疑衍第二書三十年前一作年三十以前答祖擇之書兩策一作兩册未知足下之意合否知字下一有於字答徐無黨書於辨論經旨於字上一有至字并前所記記一作寄奏議卷第十八歐陽文忠公集一百十四政府言西邊事宜第一狀治平二年右臣伏見諒祚狂僣釁隙已多不越歲年一無此字必為邊患臣本庸暗不逹時機輒以外料敵情內量事勢鑒往年已驗之失思今日可用之謀雖兵不先言俟見形而應變然坐而制勝亦大計之可圖謹具條陳庶禆萬一臣所謂外料敵情者諒祚世有夏州自彛興克睿以前止於一鎮五州而巳太宗皇帝時繼捧繼遷始為邊患其後遂陷靈鹽盡有朔方之地蓋自淳化咸平用兵十五餘年既不能剪滅遂務招懷適會繼遷為潘羅支所殺其子德明乃議歸欵而我惟以恩信復其王封歲時俸賜極於優厚德明既無南顧之憂而其子元昊亦壯遂併力西攻回紇拓地千餘里德明既死地大兵強元昊遂復背叛國家自寶元慶曆以後一方用兵天下騷動國虛民弊如此數年元昊知我有厭兵之患遂復議和而國家待之恩禮又異於前矣號為國主僅得其稱臣歲豫之物百倍德明之時半於契丹之數今者諒祚雖曰狂童然而習見其家世所為蓋繼遷之叛而復王封元昊再叛而為國主今若又叛其志可知是其欲自比契丹抗衡中國以為鼎峙之勢爾此臣竊料敵情在於如一無此字此也夫所謂內量事勢者蓋以慶曆用兵之時視方今禦邊之備較彼我之虛實強弱以見勝敗之形也自真宗皇帝一無二字景德二年盟北虜於澶淵明年始納西夏之欵遂務休兵至寶元𥘉元昊復叛蓋三十餘年矣天下安於無事武備廢而不修廟堂無謀臣邊鄙無勇將將愚不識干戈兵驕不識一作知戰陳器械朽腐城郭隳頽而元昊勇鷙桀黠之虜也其包畜姦謀欲窺中國者纍年矣而我方恬然不以為慮待其謀成兵具一旦一作日反書來上然後茫然不知所措中外震駭舉動蒼惶所以用兵之𥘉有敗而無勝也既而朝廷用韓琦范仲淹等付以西事極力經營而勇夫鋭將亦因戰陳稍稍而出數年之間人謀漸得武備漸修似可枝梧矣然而天下巳困也一無此字所以屈意忍耻復與之和此慶曆之事爾今則不然方今甲兵雖未精利不若往年之腐朽也城壘粗嘗完緝不若往年之隳頽也土兵蕃落增添訓練不若往年寡弱之驕軍也大小將校曽經戰陳者往往尚在不若往年魏昭炳夏隨之徒綺紈子弟也一二執政之臣皆當時宣力者其留心西事熟矣不若往時大臣茫然不知所措者也蓋往年以不知邊事之謀臣馭不識干戈之將用驕兵執朽器以當桀黠新興之虜此所以敗也方今謀臣武將城壁器械不類往年而諒祚狂童不及元昊逺甚往年忽而不思今又巳先覺可以早為之備苟其不叛則巳若其果叛未必不為中國利也臣謂可因此時雪前耻收後功但顧人謀如何爾若上慿陛下神威睿算係纍諒祚君臣獻於廟社此其上也其次逐狂虜於黃河之北以復朔方故地最下盡取山界奪其險而我守之以永絶邊患此臣竊一作內量事勢謂或如此臣所謂鑒往年巳驗之失者其小失非一不可悉數臣請言其大者夫夷狄變詐兵交陳合彼佯敗以為誘我貪利而追之或不虞橫出而為其所邀或進陷死地而困于束手此前日屢敗之戒今明習兵戰者亦能知之此雖小事也亦不可忽所謂大計之繆者攻守之䇿皆失爾臣視慶曆禦邊之備東起麟府西盡秦隴地長二千餘里分為路者五而路分為州軍者又二十有四而州軍分為寨為堡為城者又幾二百皆須列兵而守之故吾兵雖衆不得不分所分既多不得不寡而賊之出也常舉其國衆合聚為一而來是吾兵雖多分而為寡彼衆雖寡聚之為多以彼之多擊吾之寡不得不敗也此城寨之法既不足自守矣而五路大將所謂戰一無此字兵者分在二十四州軍欲合而出則懼後空而無備欲各留守備而合其餘則數少不足以出攻此當時所以用兵纍年終不能一出者以此也夫進不能出攻退不足一作能自守是謂攻守皆無䇿者往年已驗之失也臣所謂今日可用之謀者在定出攻之計爾必用先起制人之術乃可以取勝也蓋列兵分地而守敵得時出而撓於其間使我處處為備常如敵至師老糧匱我勞彼逸昔周世宗以此䇿困李景於淮南昨元昊亦用此䇿以困我之西鄙夫兵分備寡兵家之大害也其害常在我以逸待勞兵家之大利也其利常在彼所以往年賊常得志也今誠能反其事而移我所害者豫敵奪敵所利者在我則我當先為出攻之計使彼疲於守禦則我亦得志矣一無此字凡出攻之兵勿為大舉我每一出彼必呼集而來拒彼集於東則别出其西我歸彼散則我復出而彼又集我以五路之兵畨休出入使其一國之衆聚散奔走無時暫停則無不困之虜矣此臣所謂方今可用之謀也蓋往年之失在守方今之利在攻昔至道中亦嘗五路出攻矣當時將相為謀不重一作審蓋欲攻黠虜方強之國不先以謀困之而直為一戰必取之計大舉深入所以不能成功也夫用兵至難事也故謀既審矣則其發也必果故能動而有成功也若其山川之險易道里之迂直蕃漢兵馬之強弱騎軍步卒長兵短兵之所利與夫左右前後一出一入開闔變化有正有竒一無四十八字凡用兵之形勢有可先知者有不可先言者臣願陛下遣一重臣出而巡撫遍見諸將與熟圖之以先一無此字定大計凡山川道里蕃漢步騎出入之一無此字所宜可先知者悉圖上方略其餘不可先言付之將率使其見形應變因敵制勝至於諒祚之所為宜少屈意含容而曲就之既以驕其心亦少緩其事以待吾之為備而且嚴戒五路訓兵選將利器甲畜資糧常具軍行之計待其反書朝奏則王師暮出以駭其心而奪其氣使其枝梧不暇則勝勢在我矣往年議者亦欲招輯橫山蕃部謀取山界之地然臣謂必欲招之亦須先藉勝捷之威使一有其字知中國之強則方肯來附也由是言之亦以出攻為利矣凡臣之所言者大略如此爾一無此字然臣足未嘗踐邊陲目未嘗識戰陳以一儒生偏見之言誠知未可必用直以方當陛下勞心西事廣詢衆議之時思竭愚慮備芻蕘之一説爾言西邊事宜第二劄子同前臣近曽上言諒祚為邊患朝廷宜早圖禦備及乞遣一重臣親與邊將議定攻守大計等事至今多日未蒙降出施行臣竊見慶曆中元昊作過時朝廷輕敵玩冦無素定之謀每遇邊奏急來則上下惶恐倉卒指揮既多不中事機所以落賊姦便敗軍殺將可為痛心今者諒祚以萬騎冦秦渭兩路焚燒數百里間掃蕩俱盡而兩路將帥不敢出一人一騎則國威固巳挫矣諒祚負恩背德如此陛下未能發兵誅討但遣使者齎詔書賜之又拒而不納使者羞愧俯首懷詔而回則大國不勝其辱矣當陛下臨御之𥘉遭此狂童威沮國辱此臣等之罪也臣謂陛下宜赫然發憤以邊事切責大臣至於山川形勢有利有不利士卒勇怯孰可用孰不可用何處宜攻何處宜守何兵宜屯某地何將可付某兵如此等事甚多皆陛下聖慮所宜及者臣謂陛下宜因間時御便殿召當職之臣使按圖指畫各陳所見陛下可以不下席而盡在目前然後制以神機睿略責將相以成功而陛下以萬機之繁既未及此兩府之臣如臣一無二字等日所進呈又皆常程公事亦未嘗聚首合謀講定大計外則四路邊臣自賊馬過後亦不聞别有擘畫臣恐上下因循又如慶曆之初矣近者韓琦曽將慶曆中議山界文字進呈此邊事百端中一端爾蓋琦亦患事未講求假此文字為題目以牽合衆人之論爾自進呈後尋送密院至今多日亦未曽擬議臣以非才陛下任之政府便是國之謀臣若其謀慮淺近所言狂妄自可黜去不疑臣亦昨因目疾懇求解職曲蒙聖恩未許其去既使在其位又棄其言而不問使臣尸祿厚顔何以自處所有臣前來所上奏狀欲望聖慈一無二字降付中書密院與韓琦山界文字一處商量若其言果不足取棄之未晚今取進止乞輔館職劄子治平三年臣竊以治天下者用人非止一端故取士不以一路若夫知錢榖曉刑獄熟民事精吏幹勤勞夙夜以辦集為功者謂之材能之士明於仁義禮樂通於古今治亂其文章論議與之謀慮天下之事可以決疑定䇿論道經邦者謂之儒學之臣善用人者必使有材者竭其力有識者竭其謀故以材能之士布列中外分治百職使各辦其事以儒學之臣置之左右與之日夕謀議講求其要而行之而又於儒學之中擇其尤者置之廊廟而付以大政使總治羣材衆職進退而賞罰之此用人之大略也由是言之儒學之士可謂貴矣豈在材臣之後也是以前世英主明君未有不以崇儒嚮學為先而名臣賢輔出於儒學者十常八九也臣竊見方今取士之失患在先材能而後儒學貴吏事而賤文章自近年以來朝廷患百職不修務一作而獎材臣故錢榖刑獄之吏稍有寸長片善為人所稱者皆巳擢用之矣夫材能之士固當擢用然專以材能為急而遂忽儒學為不足用使下有遺賢之嗟上有乏材之患此甚不可也臣謂方今材能之士不患有遺固不足上煩聖慮惟儒學之臣難進而多棄滯此不可不思也臣以庸繆過蒙任使俾陪宰輔之後然平日論議不能無異同雖日奉天威又不得從容曲盡拙訥今臣有館閣取士愚見具陳一作列如别奏一作劄欲望聖慈因宴間之餘一迂睿覽或有可采乞常賜留一有聖字意今取進止又論館閣取士劄子同前臣竊以館閣之職號為育材之地今兩府闕人則必取於兩制翰林學士謂之內制中書舍人知制誥謂之外制今并雜學士待制通謂之兩制兩制闕人則必取於館閣然則館閣輔相養材之地也材既難得而又難知故當博採廣求而多畜之時冀一得於其間則傑然而出為名臣矣其餘中人以上優遊養育以獎成之亦不失為佳士也自祖宗以來所用兩府大臣多矣其間名臣賢相出於館閣者十常八九也祖宗用人𥘉若不精然所采既廣故所得亦多也是以有文章有學問有材有行或精於一藝或長於一事者莫不畜之館閣而獎養之其傑然而出者皆為賢輔相矣其餘不至輔相而為一時之名臣者亦不可勝數也先朝循用祖宗舊制收拾養育得人尤多自陛下即位以來所用兩府之臣一十三人而八人出於館閣此其驗也只自近年議者患館職之濫遂行釐革而改更之𥘉矯失太過立法既峻取人遂艱使下多遺賢之嗟國有乏材之患今先朝收拾養育之人或已𬒳遷擢或老病死亡見在館者無幾而新法艱阻近年全無選進臣今略具館閣取人舊制并新格則可見取人之法如何所得之人多少也一舊制館閣取人以三路進士髙科一路也大臣薦舉一路也歲月疇勞一路也進士第三人以上及第者并制科及第者不問等第並只一任替回便試館職進士第四第五人經兩任亦得試此一路也兩府臣寮𥘉拜命各舉三兩人即時召試此一路也其餘歷任繁難久次或寄任重處者特令帶職此一路也今三路塞其二矣自科埸改為間歲後第一人及第者須兩任回方得試自第二人至第王人更永不試制科入第三者亦須兩任回方得試凡五七次科埸未有一人中第三等者其餘等第並永不試則進士髙科一路巳塞矣兩府大臣所薦之人並只上簿候館職有闕則於簿內點名召試其如館閣本無貟數無有闕時故自置簿來至今九年不曽點試一人則太臣薦舉一路又塞矣惟有疇勞帶職一路尚在爾一新制館閣共置編校八貟本為館中書籍久不齊整而館職多别有差遣不能專一校正乃别置此八貟故選新進資淺人令久任而專一校讀所以先令作編校二年然後升為校勘未是王館職為校勘四年後升為校理始是正館職為校理又一年方罷編校别任差遣然自置編校後適值館閣取人之路漸廢今議者遂只以編校為取士新格往時直館直院直閣校理皆無定貟惟材是用不限人數今編校限以八貟為定以此待天下之多士宜其遺材於下矣八貟之內仍每七年方遇一貟一有之字闕而輔一人以此知天下滯材者衆矣右以臣愚見編校八貟自可仍舊每有貟闕令中書擇人進擬陛下必欲牢籠天下英俊之士則宜脫去常格而獎拔之今負文學懷器識磊落竒偉之士知名於世而未為時用者不少惟陛下博訪審察悉召而且置之館職養育三數年間徐察其實擇其尤者而擢用之知人自古聖王所難然不以其難而遂廢但拔十而得一二亦不為無益矣況中人上下養育獎成之不止十得一二也薦司馬光劄子治平四年臣伏見龍圖閣直學士司馬光德性淳正學術通明自列侍從久司諌諍讜言嘉話著在兩朝自仁宗至和服藥之後羣臣便以皇嗣為言五六年間言者雖多而未有定議最後光以諌官極論其事敷陳激切感動主聽仁宗豁然開悟遂決不疑由是先帝選自宗藩入為皇子曽未踰年仁宗奄棄萬國先帝入承大統蓋以人心先定故得天下帖然今以聖繼聖遂傳陛下由是言之光於國有功為不淺矣可謂社稷之臣也而其識慮深逺性尤慎密光既不自言故人亦無知者臣以忝在政府因得備聞其事臣而不言是謂蔽賢掩善詩云無言不酬無德不報光今雖在侍從日承眷待而其忠國大節隱而未彰臣既詳知不敢不奏青州言青苗錢第一劄子熙寧三年臣伏見朝廷新制俵散青苗錢以來中外之議皆稱不便多乞寢罷至今未蒙省察臣以老病昏忘雖不能究述利害苟有所見其敢不言臣今有起請事件謹具畫一如後一臣竊見議者言青苗錢取利於民為非而朝廷深惡其説至煩聖慈一作聽命有司具述本末委曲申諭中外以朝廷本為惠民之意然告諭之後搢紳之士論議益多至於田野之民蠢然固不知周官泉府為何物但見官中放債每錢一百文要二十文利爾是以申告雖煩而莫能諭也臣亦以謂等是取利不許取三分而許取二分此孟子所謂以五十步笑百步者以臣愚見必欲使天下曉然知取利非朝廷本意則乞除去二分之息但令只納元數本錢如此始是不取利矣蓋二分之息以為所得多耶固不可多取於民所得不多耶則小利又何足顧何必以此上纍聖政臣檢詳元降指揮如災傷及五分巳上則夏料青苗錢令於秋料送納秋料於次年夏料送納臣竊謂年歲豐凶固不可定其間豐年常少而凶歲常多今所降指揮蓋只言偶然一料災傷爾若連遇三兩料水旱則青苗錢積壓拖欠數多若才遇豐熟却須一併催納則農民永無豐歲矣至於中小熟之年不該得災傷分數合於本料送納者或人户無力或頑猾拖延本料尚未送納了當若令又請次料合俵錢一作散數則積壓一作欠轉多必難催索臣今欲乞人户遇災傷本料未曽送納者及人户無力或頑猾拖延不納者並更不支俵與次料錢如此則人户免積壓拖欠州縣免鞭撲催驅官錢免積久一作欠失陷一臣竊聞議者多以抑配人户為患所以朝廷屢降指揮丁寧約束州縣官吏不得抑配百姓然諸路各有提舉管勾等官往來催促必須盡錢俵散而後止由是言之朝廷雖指揮州縣不得抑逼百姓請錢而提舉等官又却催促盡數散俵故提舉等官以不能催促盡數散俵為失職州縣之吏亦以俵錢不盡為弛慢不才上下不得不遞相督責者勢使之然各不獲已也由是言之理難獨責州縣抑配矣以臣愚見欲乞先罷提舉管勾等官不令催督然後可以責州縣不得抑配其所俵錢取民情願專委州縣隨多少散之不得一作必須要盡數亦不必須要闔縣之民户户盡請如此則自然無抑配之患矣右謹具如前臣以衰年昏病不能深識逺慮所見目前止於如此然而青苗之議久已喧然中外羣臣乞行寢罷者不可勝數其所陳久逺利害必已詳盡而無遺矣一日陛下赫然開悟悉採羣議追還新制一切罷之以便公私天下之幸也若中外所言雖多猶未能感動天聽則見行不便法中有此三事尤繫目下利害如臣畫一所陳伏望聖慈特賜裁擇今取進止言青苗第二劄子同前臣近曽奏為起請俵散青苗錢不便事數內一件乞遇災傷夏料未納及不係災傷人户頑猾拖欠者並更不俵散秋料錢數至今未奉指揮臣勘會今年二麥才方成熟尚未收割巳係五月又合俵散秋料錢數竊緣夏料巳散錢尚未有一户送納若又俵散秋料錢竊慮積壓拖欠枉有失陷官錢臣已指揮本路諸州軍並令未得俵散秋料錢别候朝廷指揮去後一作訖臣伏思除臣近所起請災傷未納及人户拖欠不納者乞且不俵次料一事外臣今更有愚見不敢緘默臣竊見自俵青苗錢巳來議者皆以取利為非朝廷深惡其説遂命所司條陳申諭其言雖煩而終不免於取利然猶有一説者意在惠民也以臣愚見若夏料錢於春中俵散猶是青黃不相接之時雖不户户闕乏然其間容有不濟者以為惠政一作濟尚有説焉一作可説若秋料錢於五月俵散正是蠶麥成熟人户不乏之時何名濟闕直是放債取利爾若二麥不熟則夏料尚欠豈宜更俵秋料錢使人户積壓拖欠以此而言秋料錢可以罷而不散欲望聖慈特賜詳擇伏乞一無八字早降指揮今取進止舉宋敏求同知太常禮院劄子嘉祐二年臣等勘會同知太常禮院張師中近𬒳朝命差充兩浙提點刑獄伏見太常丞集賢校理宋敏求文學該贍多識故事家藏古今書史禮樂制度記傳尤多禮官博士每有所疑多就之質證其人見是知州差遣資望不淺臣等今保舉欲乞就差充同知太常禮院一次如後不如舉狀臣等甘當朝典今取進止六月日右公在翰苑時薦宋敏求奏劄得之汪逵既云臣等則非獨薦或公自草或止預名不可知也奏議卷第十八論館取士劄子先朝一作先帝言青苗錢第一劄子若才一作又若才公奏議十八卷總一百六十三篇仁宗實録李燾長編因事而書者八十有八其間論唃厮囉者一論陳洎王倫水洛城者再論修河者三以挍集本類多增損蓋自古史官往往於制誥奏疏時有修潤長編則又本之實録故其語欲簡其事欲首尾相貫此其所以異同比公元文殊不敷暢當以集為正奏議雖以年月編次間有論事在前降旨在後尚或疑混未能盡正覽者詳之衢州刻公奏議十八卷如辭免遷轉丐去乞休致之類皆在焉巳移入表奏四六中韶州從諌集八卷諌院奏疏也公家書目無此名合併入奏議二者總十八卷仍以公歷官先後為序凡兩州印本頗經後人輕改今悉為考證讀者審之可也居士集卷第十八歐陽文忠公集十八經旨十一首辨一首附易或問三首或問大衍之數易之緼一作數乎學者莫不盡心焉曰大衍易之末也何必盡心焉一無此字也易者文王之作也其書則六一無此字經也其文則聖人之言也其事則天地萬物君臣父子夫婦人倫之大端也大衍筮占一作卜筮之一法耳非文王之事也然則不足學乎曰得其大者可以兼其小未有學其小而能至其大者也知此然後知學易矣六十四卦自古用焉夏商之丗筮占之説略見于書文王遭紂之亂有憂天下之心有慮萬丗之志而無所發以謂一作為卦爻起於竒耦之數隂陽變易交錯而成文有君子小人進退動靜剛柔之象而治亂盛衰得失吉凶之理具焉因假取以寓其言而名之曰易至其後丗用以占一作卜筮孔子出於周末懼文王之志不見于後丗而易專為筮占一作卜筮用也乃作彖象發明卦義必稱聖人君子王后以當其事而常以四方萬國天地萬物之大以為言蓋明非止於卜筮也所以推原本意而矯丗失然後文王之志大明而易始列乎六經矣易之淪于卜筮非止今丗也微孔子則文王之志沒而不見矣夫六爻之文占辭也一有文王之作也五字大衍之數占法也自一作皆古所用也文王更其辭而不改其法故曰大衍非文王之事也所謂辭者有君子小人進退動靜剛柔之象治亂盛衰得失吉凶之理學者專其辭於筮占一作卜筮猶見非於孔子況遺其辭而執其占法欲以見文王作易之意不亦遠乎凡欲為君子者學聖人之言欲為占者學大衍之數惟所擇之一無此字焉耳或問繫辭果非聖人之作前丗之大儒君子不論何也曰何止乎繫辭舜之塗廩浚井不載於六經不道於孔子之徒蓋俚巷人之語也及其傳也久孟子之徒道之事固有出於繆妄之説其𥘉也大儒君子以丗莫之信置而不論及其傳之久也後丗反以謂更大儒君子而不非是實不誣矣由是曲學之士溺焉者多矣自孔子殁周益衰王道喪而學廢接乎戰國百家之異端起十翼之説不知起於何人自秦漢以來大儒君子不論也或者曰然則何以知非聖人之作也曰大儒君子之於學也理逹而巳矣中人已下指其迹提其耳而譬之猶有惑焉者溺於習聞之久曲學之士喜為竒説以取勝也何謂子曰者講師之言也吾嘗以譬學者矣元者善之長亨者嘉之會利者義之和貞者事之幹此所謂文言也方魯穆薑之道此言也在襄公之九年後十有五年而孔子生左氏之傳春秋也固多浮誕之辭然其用心亦必欲其書之信後丗也使左氏知文言為孔子作也必不以追附穆薑之説而疑後丗蓋左氏者不意後丗以文言為孔子作也孟子曰盡信書不如無書孟子豈好非六經者黜其雜亂之説所以尊經一有也字或問一有曰字大衍筮占之事也其於筮占之説無所非乎曰其法是也其言非也用蓍四十有九分而為二挂一揲四歸竒再扐其法是也象兩象三至于乾坤之䇿以當萬物之數者其言皆非也傳曰知者創物又曰百工之事皆聖人之作也筮者上古聖人之法也其為數也出於自然而不測四十有九是也其為用也通於變而無窮七八九六是也惟不測與無窮故謂之神惟神故可以古今為大衍者取物合數以配蓍是可測也以九六定乾坤之䇿是有限而可窮也矧占之而不效夫竒耦隂陽之數也隂陽天地之正氣也二氣升降有進退而無老少且聖人未嘗言而雖繫辭之痝雜亦不道也問者曰然則九六何為而變曰夫蓍四十有九無不用也昔之言大衍者取四揲之䇿而捨挂扐之數兼知挂扐之多少一又有多少字則九六之變可知矣蓍數無所配合隂陽無老少乾坤無定䇿知此然後知筮占矣嗚呼文王無孔子易其淪於卜筮乎易無王弼其淪於異端之説乎因孔子而求文王之用心因弼而求孔子之意因豫言而求弼之得失可也明用乾之六爻曰𥘉九潛龍勿用九二見龍在田九三君子終日乾乾夕惕若厲無咎九四或躍在淵九五飛龍在天上九亢龍有悔又曰用九見羣龍無首吉者何謂也謂以九而名爻也乾爻七九九變而七無為易道占其變故以其所占者名爻不謂六爻皆常九也曰用九者釋所以不用七也及其筮也七常多而九常少有無九者焉此不可以不釋也曰羣龍無首吉者首先也主也陽極則變而之他故曰無首也凡物極而不變則弊變則通故曰吉也物無不變變無不通此天理之自然也故曰天德不可為首又曰乃見天則也坤之六爻曰𥘉六履霜堅冰至六二直方大不習無不利六三含章可貞或從王事無成有終六四括囊無咎無譽六五黃裳元吉上六龍戰于野其血玄黃又曰用六利永貞者何謂也謂以六而名爻也坤爻八六六變而八無為亦以其占者名爻不謂六爻皆常六也曰用六者釋所以不用八也及其筮也八常多而六常少有無六者焉此不可以不釋也隂柔之動或失於邪故曰利永貞也隂陽反復天地之常理也聖人於陽盡變通之道於隂則有所戒焉六十四卦陽爻皆七九隂爻皆六八於乾坤而見之則其餘可知也春秋論上事有不幸出於久遠而傳乎二説則奚從曰從其一之可信者然則安知可信者而從之曰從其人而信之可也衆人之説如彼君子之説如此則捨衆人而從君子君子博學而多聞矣然其傳不能無失也君子之説如彼聖人之説如此則捨君子而從聖人此舉丗之人皆知其然而學春秋者獨異乎是孔子聖人也萬丗取信一人而巳若公羊髙榖梁赤左氏一本氏作丘明三子者博學而多聞矣其傳不能無失者也孔子之於經三子之於傳有所不同則學者寧捨經而從傳不信孔子而信三子甚哉其惑也經於魯隱公之事書曰公及邾儀父盟于蔑其卒也書曰公薨孔子始終謂之公三子者曰非公也是攝也學者不從孔子謂之公而從三子謂之攝其於晉靈公之事孔子書曰趙盾弒其君夷臯三子者曰非趙盾也是趙穿也學者不從孔子信為趙盾而從三子信為趙穿其於許悼公之事孔子書曰許丗子止弒其君買三子者曰非弒之也買病死而止不嘗藥耳學者不從孔子信為弒君而從三子信為不嘗藥其捨經而從傳者何哉經簡而直傳新而竒簡直無恱耳之言而一無此字新竒多一作有可喜之論是以學者樂聞而易惑也豫非敢曰不惑然信於孔子而篤者也經之所書豫所信也經所不言豫不知也難者曰子之言有激而云爾夫三子者皆學乎聖人而傳所以述經也經文隱而意深三子者從而發之故經有不言傳得而詳爾非為二説也豫曰經所不書三子者何從而知其然也曰推其前後而知之且其有所傳而得也國君必即位而隱不書即位此傳得知其攝也弒君者不復見經而盾復見經此傳得知弒君非盾也君弒賊不討則不書葬而許悼公書葬此傳得知丗子止之非實弒也經文隱矣傳曲而暢之學者以謂三子之説聖人之深意也是以從之耳非謂捨孔子而信三子也豫曰然則妄意聖人而惑學者三子之過而巳使學者必信乎三子豫不能奪也使其惟是之求則豫不得不為之辨春秋論中孔子何為而修春秋正名以定分求情而責實别是非明善惡此春秋之所以作也自周衰以來臣弒君子弒父諸侯之國相屠戮而爭為君者天下皆是也當是之時有一人焉能好廉而知讓立乎爭國之亂丗而懷讓國之髙節孔子得之於經冝如何而别白之冝如何而褒顯之其肯沒其攝位之實而雷同衆君誣以為公乎所謂攝者臣行君事之名也伊尹周公共和之臣嘗攝矣不聞商周之人謂之王也使息姑實攝而稱號無異於正君則名分不正而是非不别夫攝者心不欲為君而身假行君事雖行君事而其實非君也今書曰公則是息姑心不欲之實不為之而孔子加之失其本心誣以虛名而沒其實善夫不求其情不責其實而善惡不明如此則孔子之意踈而春秋繆矣春秋辭有同異尤謹嚴而簡約所以别嫌明微慎重而取信其於是非善惡難明之際聖人所盡心也息姑之攝也會盟征伐賞刑祭祀皆出於已舉魯之人皆聽命於巳其不為正君者幾何惟不有其名爾使其名實皆在巳則何從而知其攝也故息姑之攝與不攝惟在為公與不為公别嫌明微繫此而巳且其有讓桓之志未及行而見殺其生也志不克伸其死也被虛名而違本意則息姑之恨何申於後丗乎其甚髙之節難明之善亦何望於春秋乎今説春秋者皆以名字氏族與奪為輕重故曰一字為褒貶且公之為字豈不重於名字氏族乎孔子於名字氏族不妄以加人其肯以公妄加於人而沒其善一作實乎以此而言隱實為攝則孔子決不書曰公孔子書為公則隱決非攝難者曰然則何為不書即位曰惠公之終不見其事則隱之始立亦不可知孔子從二百年後得其遺書而修之闕其所不知所以傳信也難者又曰謂為攝者左氏耳公羊榖梁皆以為假立以待桓也故得以假稱公豫曰凡魯之事出於已舉魯之人聽於已生稱曰公死書曰薨何從而知其假春秋論下弒逆大惡也其為罪也莫贖其於人也不容其在法也無赦法施於人雖小必慎况舉大法而加大惡乎既輒加之又輒赦之則自侮其法而人不畏春秋用法不如是之輕易也三子説春秋書趙盾以不討賊故加之大惡既而以盾非實弒則又復見于經以明盾之無罪是輒加之而輒赦之爾以盾為無弒心乎其可輕以大惡加之以盾不討賊情可責而冝加之乎則其後頑然未嘗討賊既不改過以自贖何為遽赦使同無罪之人其於進退皆不可此非春秋意也趙穿弒君大惡也盾不討賊不能為君復讎而失刑於下二者輕重不較可知就使盾為可責然穿焉得免也今免首罪為善人使無辜者受大惡此決知其不然也春秋之法使為惡者不得幸免疑似者有所辨明一有此字所謂是非之公也據三子之説𥘉靈公欲殺盾盾走而免穿盾族也遂弒而盾不討其迹涉於與弒矣此疑似難明之事聖人尤當求情責實以明白之使盾果有弒心乎則自然罪在盾矣不得曰為法受惡而稱其賢也使果無弒心乎則當為之辨明必先正穿之惡使罪有所歸然後責盾縱賊則穿之大惡不可幸而免盾之疑似之迹獲辨而不討之責亦不得辭如此則是非善惡明矣今為惡者獲免而疑似之人陷于大惡此決知其不然也若曰盾不討賊有幸弒之心與自弒同故寧捨穿而罪盾此乃逆詐用情之吏矯激之為爾非孔子忠恕春秋以王道治人之法也孔子患舊史是非錯亂而善惡不明所以修春秋就令舊史如此其肯從而不正之乎其肯從而稱美又教人以越境逃惡乎此可知其繆傳也問者曰然則夷臯孰弒之曰孔子所書是矣趙盾弒其君也今有一人焉父病躬進藥而不嘗又有一人焉父病而不躬進藥而二父皆死又有一人焉操刃而殺其父使吏治之是三人者其罪同乎曰雖庸吏猶知其不可同也躬藥而不知嘗者有愛父之孝心而不習於禮是可哀也無罪之人爾不躬藥者誠不孝矣雖無愛親之心然未有殺父之意使善治獄者猶當與操刃殊科况以躬藥之孝反與操刃同其罪乎此庸吏之不為也然則許丗子止實不嘗藥則孔子決不書曰弒君孔子書為弒君則止決非不嘗藥難者曰聖人借止以垂教爾對曰不然夫所謂借止以垂教者不過欲人之知嘗藥耳聖人一言明以告人則萬丗法也何必加孝子以大惡之名而嘗藥之事卒不見于文使後丗但知止為弒君而莫知藥之當嘗也教未可垂而巳陷人於大惡矣聖人垂教不如是之迂也果曰責止不如是之刻也難者曰然則盾曷為復見于經許悼公曷為書葬曰弒君之臣不見經此自三子説爾果聖人法乎悼公之葬且安知其不討賊而書葬也自止以弒見經後四年吳敗許師又十有八年當定公之四年許男始見于經而不名許之書于經者略矣止之事迹不可得而知也難者曰三子之説非其臆出也其得於所傳如此然則所傳者皆不可信乎曰傳聞何可盡信公羊榖梁以尹氏卒為正卿左氏以君氏卒為隱母一以為男子一以為婦人得於所傳者蓋如是是可盡信乎春秋或問或問春秋何為一無此字始於隱公而終於獲麟曰吾不知也問者曰此學者之所盡心焉不知何也曰春秋一有之字起止吾所知也子所問者始終之義吾不知也吾無所用心乎此一有也字昔者孔子仕於魯不用去之諸侯又不用困而歸且老始著書得詩自關雎至于魯頌得書自堯典至于費誓得魯史記自隱公至于獲麟遂刪修之其前遠矣聖人著書足以法丗而巳不窮遠之難明也故據其所得而修之孔子非史官也一無此字不常職乎史故盡其所得修之而止耳魯之史記則未嘗止也今左氏經可以見矣曰然則始終無義乎曰義在春秋不在起止春秋謹一言而信萬丗者也豫厭衆説之亂春秋者也或問子於隱攝盾止之弒據經而廢傳經簡矣待傳而詳可廢乎曰吾豈盡廢之乎夫傳之於經勤矣其述經之事時有賴其詳焉至其失傳則不勝其戾也其述經之意亦時有得焉及其失也欲大聖人而反小之欲尊經而反卑之取其詳而得者廢其失者可也嘉其尊大之心可也信其卑小之説不可也問者曰傳有所廢則經有所不通奈何曰經不待傳而通者十七八因傳而惑者十五六日月萬物皆仰然不為盲者明而有物蔽之者亦不得見也聖人之意皎然乎經惟明者見之不為他説蔽者見之也泰誓論書稱商始咎周以乘黎乘黎者西伯也西伯以征伐諸侯為職事其伐黎而勝也商人已疑其難制而惡一作患之使西伯赫然見其不臣之狀與商並立而稱王如此十年商人反晏然不以為怪其父師老臣如祖伊微子之徒亦默然相與熟視而無一言此豈近於人情邪由是言之謂西伯受命稱王十年者妄説也以紂之雄猜􅤒虐嘗醢九侯而脯鄂侯矣西伯聞之竊歎遂執而囚之幾不免死至其叛巳不臣而自王乃反優容而不問者十年此豈近於人情邪由是言之謂西伯受命稱王十年者妄説也孔子曰三分天下有其二以服事商使西伯不稱臣而稱王安能服事於商乎且謂西伯稱王者起於何説而孔子之言萬丗之信也由是言之謂西伯受命稱王十年者妄説也伯夷叔齊古之知義之士也方其讓國而去顧天下皆莫可歸聞西伯之賢共往歸之當是時紂雖無道天子也天子在上諸侯不稱臣而稱王是僭叛之國也然二子不以為非依之久而不去至武王伐紂始以為非而棄去彼二子者始顧天下莫可歸卒依僭叛之國而不去不非其父而非其子此豈近於人情邪由是言之謂西伯受命稱王十年者妄説也書之泰誓稱十有一年説者因以謂自文王受命九年及武王居喪二年并數之爾是以西伯聽虞芮之訟謂之受命以為元年此又妄説也古者人君即位必稱元年常事爾不以為重也後世曲學之士説春秋始以改元為重事然則果常事歟固不足道也果重事歟西伯即位已改元矣中間不冝改元而又改元至武王即位冝改元而反不改元乃上冒先君之元年并其居喪稱十一年及其滅商而得天下其事大於聽訟遠矣又不改元由是言之謂西伯以受命之年為元年者妄説也後之學者知西伯生不稱王而中間不再改元則詩書所載文武之事粲然明白而不誣矣或曰然則武王畢喪伐紂而泰誓曷謂稱十有一年對曰畢喪伐紂出於諸家之小説而泰誓六經之明文也昔者孔子當衰周之際患衆説紛紜以惑亂當世於是退而修六經以為後世法及孔子既殁去聖稍遠而衆説復興與六經相亂自漢以來莫能辨正今有卓然之士一取信乎六經則泰誓者武王之事也十有一年者武王即位之十有一年爾復何疑哉司馬遷作周本紀雖曰武王即位九年祭於文王之墓然後治兵于盟津至作伯夷列傳則又載父死不葬之説皆不可為信是以吾無取焉取信于書可矣縱囚論信義行於君子而刑戮施於小人刑入于死者乃罪大惡極此又小人之尤甚者也寧以義死不苟幸生而視死如歸此又君子之尤難者也方唐太宗之六年録大辟囚三百餘人縱使還家約其自歸以就死是以君子之難能期小人之尤者以必能也其囚及期而卒自歸無後者是君子之所難而小人之所易也此豈近於人情或曰罪大惡極誠小人矣及施恩德以臨之可使變而為君子蓋恩德入人之深而移人之速有如是者矣曰太宗之為此所以求此名也然安知失縱之去也不意其必來以冀免所以縱之乎又安知夫被縱而去也不意其自歸而必獲免所以復來乎夫意其必來而縱之是上賊下之情也意其必免而復來是下賊上之心也吾見上下交相賊以成此名也烏有所謂施恩德與夫知信義者哉不然太宗施德於天下於茲六年矣不能使小人不為極惡大罪而一日之恩能使視死如歸而存信義此又不通之論也然則何為而可曰縱而來歸殺之無赦而又縱之而又來則可知為恩德之致爾然此必無之事也若夫縱而來歸而赦之可偶一為之爾若屢為之則殺人者皆不死是可為天下之常法乎不可為常者其聖人之法乎是以堯舜三王之治必本於人情不立異以為髙不逆情以干譽怪竹辨謂竹為有知乎不冝生於廡下謂為無知乎乃能避檻而曲全其生其果有知乎則有知莫如人人者萬物之最靈也其不知於物者多矣至有不自知其一身者如駢拇枝指懸疣附贅皆莫知其所以然也以人之靈而不自知其一身使竹雖有知必不能自知其曲直之所以然也竹果無知乎則無知莫如枯草死骨所謂蓍龜者是也自古以來大聖大智之人有所不知者必問於蓍龜而取決是則枯草死骨之有知反過於聖智之人所知遠矣以枯草死骨之如此則安知竹之不有知也遂以蓍龜之神智而謂百物皆有知則其他草木瓦石叩之又頑然皆無所知然則竹未必不無知也由是言之謂竹為有知不可謂為無知亦不可謂其有知無知皆不可知然後可萬物生於天地之間其理不可以一槩謂有心然後有知乎則蚓無心謂凡動物皆有知乎則水亦動物也人獸生而有知死則無知矣蓍龜生而無知死然後有知也是皆不可窮詰故聖人治其可知者置其不可知者是之謂大中之道居士集卷第十八熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正初公作易或問三篇第二篇論卦爻彖象其後刪去别作一篇論繫辭此卷所載是也元論卦爻彖象一篇諸本皆不載恐遂棄遺今編入外集第十卷明用無首無當作無下同春秋論下而嘗藥之事而一作又
