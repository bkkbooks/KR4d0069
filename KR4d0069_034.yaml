body:
  text: 墓志五首尚書駕部貟外郎致仕薛君墓志銘并序尚書駕部貟外郎致仕薛君諱長孺字元卿絳州正平人也贈太傅諱溫瑜之曽孫殿中丞贈太師諱化光之孫右班殿直贈左驍衛大將軍諱睦之子尚書户部侍郎贈司空簡肅公兄之子薛為絳大族簡肅公為時名臣君為薛氏良子弟少用簡肅公蔭輔郊社齋郎將作監主簿太常寺太祝大理評事衛尉大理寺丞太子右一作左贊善大夫殿中丞國子博士尚書虞部比部駕部三貟外郎歷知趙州臨城縣通判漢湖滑三州知彭州坐斷獄降監陽武縣稅會簡肅公夫人薨葬于絳州即起君知州事以辦葬歲滿通判成都府未行遂以疾致仕居于許州之郾城嘉祐六年七月丙午以卒享年六十有一君在漢州州兵數百殺其軍校燒營以為亂君挺身徒步自壞垣入其營中以禍福語亂卒曰叛者立左脅從者立右於是數百人者皆趨立於右獨叛者十三人亡去州遂無事明年蜀大飢今韓丞相安撫兩川獨漢人不甚殍賜詔書獎諭其在絳也曰絳吾鄉里也長老乃吾父師子弟猶吾子弟也為立學置學官以教之為政有惠愛絳人大恱君為人謹默淳質平居似不能言而其臨事如此先娶李氏早亡後娶董氏封范陽縣君子男二人長曰延永興軍醴泉縣主簿次曰通蔡州司戶參軍孫男曰震孫女三人以治平三年二月乙酉葬于絳州正平縣清原一作源鄉周村原將葬其女弟之夫歐陽修為之銘曰維聖有言兮仁勇而壽壽胡不多兮勇則信有為政鄉州兮稱于長老匶車來歸兮鄉人奔走遺思在人兮刻銘不朽國子博士薛君墓志銘并序君諱良孺字得之姓薛氏絳州正平人也少孤育於其叔父是為簡肅公以公蔭為將作監主簿太常寺奉禮郎大理評事將作監丞大理寺丞遷太子右贊善大夫殿中丞嘗知秦州清水縣縣雜蕃夷君為簡其政令示之必信蕃夷畏愛歲滿罷去人甚思之其後簽書通利軍判官公事與其軍守爭事坐停官久之復為殿中丞遷國子博士監陳州清酒務嘉祐八年二月甲午以疾卒于官舍享年四十有六宋興百年薛姓五顯而簡肅公以清德直節聞故其家法嚴而子弟多賢材君為人開爽明秀幼為簡肅公所愛若已一作過其子長工書作歌詩嘗一舉進士不中以蔭輔例監庫務無所施其能一為民政遂有聲平居喜飲酒談笑與其親戚朋友歡然未嘗有怨惡其在通利與其軍守所爭皆公事既廢無懟色至卒窮以死豁如也嗚呼可哀也巳曾祖贈太傅諱溫瑜祖贈太師諱化光父右班殿直贈左驍衛大將軍諱睦君娶張氏故樞密直學士逸之女封仁壽縣君先君二歲而卒子男一人曰遜女三人長適大理評事王正甫次適太常寺太祝王端甫次尚幼治平三年二月乙酉其孤遜舉其喪合葬于絳州正平縣清原一作源鄉周村原將葬廬陵歐陽修曰余薛氏壻也與君遊而賢其人冝有以哀之乃為之銘曰維古才子兮出于名族嗟吾得之兮既哲而淑有能不施兮不遐以趣卒困于艱兮泰乎自足絳水深長兮山岡起伏利我後人兮安于吉卜徂徠石先生墓志銘并序徂徠先生姓石氏名介字守道兖州奉符人也徂徠魯東山而先生非隱者也其仕嘗位於朝矣魯之人不稱其官而稱其德以為徂徠魯之望先生魯人之所尊故因其所居山以配其有德之稱曰徂徠先生者魯人之志也先生貌厚而氣完學篤而志大雖在畎畒不忘天下之憂以謂時無不可為為之無不至不在其位則行其言吾言用功利施於天下不必出乎已吾言不用雖獲禍咎至死而不悔其遇事發憤作為文章極陳古今治亂成敗以指切當世賢愚善惡是是非非無所諱忌一作忌諱世俗頗駭其言由是謗議喧然而小人尤嫉惡之相與出力必一有欲字擠之死先生安然不惑不變曰吾道固如是吾勇過孟軻矣不幸遇疾以卒既卒而姦人有欲以竒禍中傷大臣者猶指先王以起事謂其詐死而北走契丹矣請發棺以驗賴天子仁聖察其誣得不發棺而保全其妻子先生世為農家父諱丙始以仕進官至太常博士先生年二十六舉進士甲科為鄆州觀察推官南京留守推官御史臺辟主簿未至以上書論赦罷不召秩滿遷某軍節度掌書記代其父官于蜀為嘉州軍事判官丁內外艱去官垢靣跣足躬耕徂徠之下葬其五世未葬者七十喪服除召入國子監直講是時兵討元昊久無功海內重困天子奮然思欲振起威德而進退二三大臣增置諫官御史所以求治之意甚鋭先生躍然喜曰此盛事也雅頌吾職其可巳乎乃作慶曆聖德詩以褒貶大臣分别邪正纍數百言詩出太山孫明復曰子禍始於此矣明復先生之師友也其後所謂姦人作竒禍者乃詩之所斥也先生自間居徂徠後官于南京常以經術教授及在太學益以師道自居門人弟子從之者甚衆太學之興自先生始其所為文章曰某集者若干卷曰某集者若干卷其斥佛老時文則有怪説中國論曰去此三者然後可以有為其戒姦臣宦女則有唐鑑曰吾非為一世監也其餘喜怒哀樂必見於文其辭博辨雄偉而憂思深逺其為言曰學者學為仁義也一有仁急於利物義果於有為十字惟忠能忘其身信篤於自信者乃可以力行也以是行於巳亦以是教於人所謂堯舜禹湯文武周公孔子孟軻楊雄韓愈氏者未嘗一日不誦於口思與天下之士皆為周孔之徒以致其君為堯舜之君民為堯舜之民亦未嘗一日少忘于心至其違世驚衆人或笑之則曰吾非狂癡者也是以君子察其行而信其言推其用心而哀其志先生直講歲餘杜祁公薦之天子拜太子中允今丞相韓公又薦之乃直集賢院又歲餘始去太學通判濮州方待次于徂徠以慶曆五年七月某日卒于家享年四十有一友人廬陵歐陽修哭之以詩以謂待彼謗熖熄然後先生之道明矣先生既沒妻子凍一作寒餒不自勝今丞相韓公與河陽冨公分俸買田以活之後二十一一無此字年其家始克葬先生于某所將葬其子師訥與其門人薑潛杜默徐遁等來告曰謗熖熄矣可以發先生之光矣敢請銘某曰吾詩不云乎子道自能久也何必吾銘遁等曰雖然魯人之欲也乃為之銘曰徂徠之巖巖與子之德兮魯人之所瞻汶水之湯湯與子之道兮逾一作愈逺而彌長道之難行兮孔孟一有亦云二字遑遑一世之屯兮萬世之光曰吾不有命兮安在夫桓魋與臧倉自古聖賢皆然兮噫子雖毀其何傷故霸州文安縣主簿蘇君一作趙郡蘇明允墓志銘并序有蜀君子曰蘇君諱洵字明允眉州眉山人也君之行義修於家信於鄉里聞於蜀之人一無此二字久矣當至和嘉祐之間與其二子軾轍偕至京師翰林學士歐陽修得其所著書二十二篇獻諸朝書既出而公卿士大夫爭傳之其二子舉進士皆在髙等亦以文學稱於時眉山在西南數千里外一日父子隱然名動京師而蘇氏文章遂擅天下君之文博辨宏偉讀者悚然想見其人既見而溫溫似不能言及即之與居愈久而愈可愛間而出其所有愈叩而愈無窮嗚呼可謂純明篤實之君子也曽祖諱祐祖諱杲父諱序贈尚書職方貟外郎三世皆不顯職方君三子曰淡曰渙皆以文學舉進士而君少獨不喜學年巳壯猶不知書職方君縱而不問鄉閭親族皆怪之或問其故職方君笑而不答君亦自如也年二十七始大發憤謝其素所往來少年閉戶讀書為文辭歲餘舉進士再不中又舉茂材異等不中退而歎曰此不足為吾學也悉取所為文數百篇焚之益閉戶讀書絶筆不為文辭者五六年乃大究六經百家之説以考質古今治亂成敗聖賢窮逹出處之際得其粹精一作精粹涵畜充溢抑而不發久之慨然曰可矣由是下筆項刻數千言其縱橫上下出入馳驟必造於深微而後止蓋其稟也厚故發之遲志也慤故得之精自來京師一時後生學者皆尊其賢學其文以為師法以其父子俱知名故號老蘇以别之𥘉修為上其書召試紫微閣辭不至遂除試祕書省校書郎會太常修纂建隆以來禮書乃以為霸州文安縣主簿使食其祿與陳州項城縣一無此字令姚闢同修禮書為太常因革禮一百卷書成方奏未報而君以疾卒實治平三年四月戊申也享年五十有八天子聞而哀之特贈光祿寺丞勑有司具舟載其喪歸于蜀君娶程氏大理寺丞文應之女生三子曰景先早卒軾今為殿中丞直史館轍權大名府推官三女皆早卒孫曰邁曰遲有文集二十卷諡法三卷君善與人交急人患難死則恤飬其孤鄉人多德之蓋晚而好易曰易之道深矣汨而不明者諸儒以附會之説亂之也去之則聖人之旨見矣作易傳未成而卒治平四年十月壬申葬于彭山之安鎮鄉可龍里君生於逺方而學又晚成常歎曰知我者惟吾父與歐陽公也然則非余誰冝銘銘曰蘇顯唐世實欒城人以宦留眉蕃蕃子孫自其髙曾鄉里稱仁偉歟明允大發於文亦既有文而又有子其存不朽其嗣彌昌嗚呼明允可謂不亡贈太子太傅胡公墓志太子少師致仕贈大子太傅胡公諱宿字武平其先豫章人也後徙常州之晉陵世有隱德為晉陵著姓公舉進士中天聖二年乙科為真州楊子尉縣大水漂溺居民令不能救公曰拯溺吾職也即率公私舟活數千人歲滿調廬州合淝主簿張丞相士遜稱其文行薦諸朝召試學士院為館閣校勘與修北史改集賢校理通判宣州三遷太常博士判吏部南曹賜緋衣銀魚一有出字知湖州為政有惠愛築石塘百里捍水患大興學校學者盛於東南自湖學始公丁母夫人憂去而州人思之名其塘口胡公塘學者為公立生祠于學中至今祠之公居喪毀瘠過禮三年不居于內服除為三司鹽鐡判官轉尚書祠部貟外郎判度支句院知蘇州兩浙路轉運使召還修起居注以本官知制誥兼句當三班院巳而兼判吏部流內銓入內都知楊懷敏坐衛士夜盜入禁中驚乘輿斥出為和州都監懷敏用事久勢動中外未幾召復故職公封還辭頭不草制論曰衛士之變蹤迹連懷敏得不窮治誅死幸矣豈冝復在左右其命遂止久之拜公翰林侍讀學士遷翰林學士兼史館修撰判館事兼端明殿學士纍遷尚書左司郎中兼知通進銀臺司審刑院群牧使提舉在京諸司庫務醴泉宫判尚書禮部遂判都省再知禮部貢舉奉使契丹館伴北朝人使亦皆再而虜人嚴憚之公為人清儉謹默內剛外和群居笑語歡譁獨正容色溫溫不動聲氣與人言必思而後對故其涖官臨事慎重不輒發發亦不可回止而其趣要歸於仁厚朝議在官年七十而不致仕者有司以時按籍舉行公以謂飬廉耻厚風俗冝有漸而欲一切以吏議從事殆非所以優老勸功之意當少緩其事一作法使人得自言而全其美節朝廷嘉其言是至今行之皇祐新樂成議者多異論有詔新樂用於常祀朝會而郊廟仍用舊樂公言書稱同律而今舊樂髙新樂下相去一律難並一作遂用而新樂未施於郊廟先用之朝會非先王薦上帝配祖考之意皆不可一作遂不行近制禮部四歲一貢士議者患之請更為間歲議巳定公獨以為不然曰使士子廢業而奔走無寧歲不知復用三歲之制也衆皆以公言為非行之數年士子果以為不便而卒用三歲之制仁宗久未有皇子群臣多以皇嗣為言未省公以學士當作青辭禱嗣一作祠于山川即建言儲位久虛非所以居安而慮危願擇宗室之賢者立之以慰安天下之心語甚切至公學問該博兼通隂陽五行天人一作文災異之説南京鴻慶宫災公以謂南京聖宋所以受命建號而大火主於商丘國家乘火德而王者也今不領於祠官而比年數災冝修火祀事下太常歲以長吏奉祠商丘自公始慶曆六年夏河北河東京東同時地震而登萊尤甚公以歲推之曰明年丁亥歲之刑德皆在北宫隂生於子而極於亥然隂猶強而未即伏陽猶微而未即勝此所以震也是謂龍戰之會而其位在乾今西北二虜中國之隂也冝為之備不然必有內盜起於河朔明年王則以貝州叛公又以為登萊視京師為東北隅乃一作易艮少陽之位也今二州並置金坑多聚民以鑿山谷陽氣損泄故隂乘而動縣官入金歲幾何小利而大害可即禁止以寧地道皇祐五年正月會靈宫災是歲冬至祀天南郊以三聖並配明年大旱公曰五行火禮也去歲火而今又旱其應在禮此殆郊丘並配之失也即建言並配非古冝用迭配如𥘉詔其後并州議建軍為節鎮公以星土考之曰昔髙辛氏之二子不相能也堯遷閼伯於商丘主火而商為宋星遷實沉於臺駘主水而參為晉星國家受命始於商丘王以火德又京師當宋之分野而并為晉地參商仇讎之星今欲崇晉非國之利也自宋興平僣偽并最後服太宗削之不使列於方鎮八十年矣謂冝如舊制公在翰林十年多所輔益大扺不為苟止而妄隨故其言或用或不用或後卒如其言然天子察公之忠欲大用者久矣嘉祐六年八月拜公諫議大夫樞密副使公既愼靜而當大一作重任尤顧惜大體而群臣方建利害多更張庶事以革弊公獨猒之曰變法古人一作今之難不務守祖宗成法而徒紛紛無益於治也又以謂契丹與中國通好六十餘年自古未有也善待夷狄者謹為備而巳今三邊武備多弛牧馬著虛名於籍可乘而戰者百無一二又謂滄州冝分為一路以禦虜此今急務也若其界上交侵小故乃城寨主吏之職朝廷冝守祖宗之約不冝爭小利而隳大信深戒邊臣生事以為功在位六年其論議類皆如此英宗即位拜一作遷給事中治平三年纍上表􆂌致仕未一作不允久之拜尚書吏部侍郎觀文殿學士知杭州為政不略細故或謂大臣不冝自勞公曰此民事也吾不敢忽以是民尤愛之明年今上即位遷左丞五月公以疾告遂除太子少師致仕命未至而公以六月十一日薨于正寢享年七十有三一作二即以其年十一月某日葬于某州某縣某鄉之某原一作常州晉陵縣萬安鄉之隆亭公之曾祖諱持纍贈太傅曾祖妣歐陽氏追封晉陵郡太夫人祖諱徽纍贈太師祖妣楊氏追封華隂郡太夫人余氏嘉興郡太夫人余氏丹陽郡太夫人龔氏武陵郡太夫人父諱㝝纍贈太師兼中書令妣沈氏追封東陽郡太夫人貝氏南陽郡太夫人李氏金城郡太夫人公纍階光祿大天勳上柱國開國安定爵公食邑二千八百户食實封四百户賜推誠保德翊戴功臣𥘉娶吳氏追封蘭陵郡夫人再娶何氏封南康郡夫人子男五人長曰宗堯今為都官貟外郎次曰遵路早卒次曰宗質國子博士次曰宗炎著作佐郎次曰宗厚祕書省正字早卒女四人皆適士族孫志修太常寺太祝行修守祕書省校書郎簡修試祕書省校書郎世修德修安修奕修愼修益修公自一無此字為進士知名于時楊文公億得其詩題于祕閣歎曰吾恨未識此人其舉進士也謝陽夏公絳薦公為第一公名以此益彰而謝公亦以此自負少嘗善一浮圗其人將死謂公曰我有祕術能化瓦石為黃金子其葬我我以此報子公曰爾之後事吾敢不勉祕術非吾欲也浮圗歎曰子之志未可量也其篤行自勵至於貴顯常如布衣時有文集四十一有一字卷銘曰允矣胡公順外剛中惟𥘉暨終一德之恭公之燕居其氣溫溫舉必可法思而後言公在朝廷正色侃侃蔚有嘉話一作謀憂深慮逺不迎利趨不畏勢反有或不從後必如之久一作多而愈信一作篤孰不公思侍從之親樞機之密名望三朝清職峻秩愷悌之仁一作化宜國黃耇七十而止孰云多壽惟善在人刻銘一作知名不朽居士集卷第三十四熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正薛長孺墓銘鄉州一作故州稱于于一作於蘇君墓銘志也慤一作其志也慤胡公墓銘兩浙路一無路字風俗一作化于山一作於山隂生於子當作午入金歲幾何一作歲入金幾何十一月某日一作甲申追封一本惟曾祖妣用追封二字祖妣妣皆削去
