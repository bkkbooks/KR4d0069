body:
  text: 賜昭徳軍節度使龐籍并武康軍節度使韓琦龍神衛四廂都指揮使英州團練使郝質各進奉瑞午馬詔勑七月七日卿外分寄任方切眷懷屬令節之紀時効駿足而來貢僃彰勤藎深所歎嘉賜溪洞進奉乾元節并端午勑書汝夙𬒳朝恩克綏種落屬茲佳節来効貢儀省乃勤誠良深歎獎賜外任臣寮進奉乾元節功徳䟽詔勑七月七日卿汝夙韞材猷出分委寄屬茲誕節来効勤誠載詳善禱之言彌見愛君之義良深歎尚冝體眷懷賜外任臣寮進奉助恭謝禮畢銀絹等詔勑七月二十五日國有大事嚴祀以薦馨臣能盡忠因物而脩禮卿汝分職居外乃心于朝載陳來助之儀深歎勤誠之至賜武康軍節度使韓琦到闕生料口宣八月五日卿徳著耆明時膺材任祗趨召節方及國門冝示頒宣式彰眷遇賜新授四方館使依舊英州刺史馬懷徳進奉謝恩馬勑書八月十日汝近以疇勞擢陞要職乃求良駿來僃貢輸深惟報國之試更俟奮身之効良深嘉獎當悉眷懷賜知池州包拯進奉石菖蒲一銀合勑書八月十日汝識逺言忠身外心内乃因時物來効貢儀深體誠勤益増歎尚賜新授觀文殿大學士行尚書左僕射陳執中詔七月二十五日卿出守蕃垣自陳疾恙祕殿之職揆路之崇所以襃優輔臣増重朝體而乃發於試慤來効貢輸載省恪一作忠勤但深嘉尚賜新除資政殿大學士知青州孫沔告勑并對衣鞍轡馬口宣八月十六日卿蔚為名臣久撫方靣俾加美職徙領要蕃仍推寵錫之優式示眷懷之厚賜護國軍三軍將吏僧道百姓等為護國軍節度使樞宻使狄青罷政加平章事判陳州示諭勑書八月十六日勑護國軍某人等朕以狄青夙兼忠勇之姿嘗著勤庸之効自叅機務頗歷歳時載深乃眷之懷優以均勞之寵惟命崇於名器蓋體繫於朝廷是加鼎軸之司委以藩垣之任乃人臣之榮遇想輿論之僉諧賜翰林學士尚書左司郎中知制誥權知審刑院曽公亮詔八月十六日國家致治之難惟刑是恤使民無犯嗟訓導之未純執法必平顧重輕而冝允卿以精識附一作傅之經術不恃明而克審旣能敏而加勤期於無刑予敢不勉靡有留事爾實爲材副乃憂勞良深歎獎賜尚書刑部貟外郎兼侍御史知雜事權判大理寺郭申錫等勑書八月十六日獄重事也余所慎焉五刑之難請比之文毛舉四海之廣報決之書日䌓汝以通敏之姿濟之夙夜之力厝刑不用余實慕於前猷俾獄無留汝則能於厥職副我欽恤良増歎嘉除劉沆特授行工部尚書充觀文殿大學士知應天府加食邑實封仍改賜功臣餘如故制嘉祐元年十一月五日門下罄一節以事君中外之任無間處大臣而有體進退之禮必優矧余輔弼之良方頼股肱之寄屢形懇避嘉敦慤之弗移冝峻寵章示眷懷之特異具官劉沆質性剛鯁姿材敏明早以藝文策儁科於異等遂追髦彦騰夷路以飛華入必侍於清閑出屢更於事任翼翼是則有聲京邑之雄巖巖具瞻遂參廊廟之用乃疇嘉績爰正台司執毀譽不回之心篤於自信勤夙夜匪懈之志久而益勞顧方厚於倚毗乃遽思於退讓宴見之際有言而必誠封章之來雖却而復至察其所守實亦重違惟茲祕殿之嚴眷乃留都之重旣増美秩仍益真封寵我邇臣斯為異數雖如汝志尚柬予衷於戯秉國之鈞居則坐而論道為時舊老往則殿于大邦是惟出處之榮勉服便蕃之命可特授行工部尚書充觀文殿大學士知應天府加食邑一千戸食實封四百戸仍改賜推誠保徳崇仁忠亮功臣散官勲封如故主者施行㬱錢明逸賜新除同中書門下平章事判大名府依前彰信軍節度使李昭亮讓恩命不允詔十二月五日卿勲閥之門世承舊徳忠勤之節効著厥官惟别都管鑰之嚴兼方面鎮臨之重俾提相印増寵將旄嘉辭讓之有儀在眷懷而豈易爾毋固執往服新恩賜溪洞進奉助恭謝賀冬賀正水銀綿紬等勑書十二月五日汝世膺朝寵能撫其人時効乃誠善修其貢載惟忠恪深用歎嘉東太一宫開啓年交祝聖壽金籙道埸宻詞十二月十日伏以三陽肇序始變於凝隂萬壽無疆冝膺於茂祉俾延淨侣祗欵嚴祠按金籙之仙科格紫清之真馭冀迎福應永固丕圖下逮庻邦咸均純錫賜夏國主一有賵賻二字詔十二月二十五日詔夏國主䘮葬之儀孝子之大節賵􅉠之禮國家之至恩眷惟忠順之邦冝厚哀榮之䘏𬗟思荼毒深用惻傷俾遣使車勉膺慰錫今差文思院使張惟志充弔慰使兼賜安葬故母物色具如别録至可領也故茲詔示想冝知悉冬寒比平安好否書指不多及正月六日朝辭訖就驛賜契丹賀正旦人使御筵口宣十二月二十五日卿等聘禮有成使軺云復嘉肅祗於將事冝宴飫以勞勤式示眷懷勉膺寵錫班荆館賜契丹賀正旦人使却回酒果口宣卿等載馳瑞節來會王正嘉成禮以言旋念戒塗之伊始式推寵眷勉服恩頒賜樞宻副使程戡生日詔嘉祐二年三月四日卿久罄謀猷叶宣機政眷惟誕日屬此令時冝推寵賚之優式示顧懷之厚賜諸道州府軍監及四京恤刑詔勑朕欲使民知禮義以逺罪而患乎勸戒之未明蠢茲羣愚猶冒常憲顧此溽暑閔然拘纍卿汝夙以敏材外分憂寄惟刑之恤當體於朕心舉政以時勉思於汝職務從欽慎庸副哀矜契丹國信使副回入四月沿路賜夏藥扇子甘蔗等口宣三月十九日卿等載驅使傳言復歸塗顧茲溽暑之辰冝有優恩之賚俾頒品劑當體眷懷瀛州賜契丹國信使副却回御筵口宣三月十九日卿等將命逹辭回轅屇道方渉川塗之邈冝申宴犒之私式示優延體茲眷厚北京賜契丹國信使副却回御筵口宣二月二十九日卿等夙將信聘言復使軺方就館於别都冝示恩於錫宴式彰優渥當體眷懷就驛賜契丹賀乾元節人使内中酒果口宣卿等將乃聘儀及茲壽節冝示燕私之惠用彰眷寵之懷推以甘珍體予嘉錫賜河北東西路邉臣夏藥及傳宣撫問口宣卿汝等各以敏材任茲邊寄屬此炎歊之候深惟勤悴之勞俾頒藥劑之良式示眷懷之厚東太一宫開啓保夏祝聖金籙道埸宻詞四月二十六日伏以道妙無言惟一資生於萬物歳功有序以時均播於五行當火徳之盛明順南訛而阜育式稽金簡祗即琳宫祈降集於上靈冀迎來於衆福伏願齊天永筭益保於鴻休觸類賦形皆均於純錫賜昭徳軍節度使檢校太傅知并州龐籍撫諭戒朂詔五月二十三日勑龐籍省所上表麟州申管勾麟府州軍馬司郭恩領兵過屈野河䧟沒待罪事具悉卿以文武之才更將相之任入籌帷幄早資決勝之謀出撫邊隅方重臨戎之寄載惟同徳可諒宣勤而禆校貪功曽罔虞於蠆毒敗沒衘辱致輕損於國威嘉封奏之上陳能列言而引咎雖勇夫僨於輕敵彼實自貽而智者慮於未形冝無不僃巳失難追於旣往後圖猶倚於老成勉思節制之方用副眷懷之厚故茲詔示想冝知悉夏熱卿比平安好遣書指不多及大相國寺開啓爲民祈福道埸齋文伏以薫風恊序阜百物以蕃昌慧福均慈蒙萬生而廣𬒳顧惟編俗屬此煩蒸庻依妙覺之仁護此含靈之衆祓除時沴迎集天祺凡載坤輿共臻壽域醴泉觀感通殿開啓為民祈福道埸青詞伏以瑞泉涵液湛一勺之靈源琳館凝華嚴衆真之福地眷茲炎鬱閔彼蒸黔俾肅按於仙科冀導迎於善氣伏願紫清昭鑒飈歘來臨旁均海㝢之遐下逮翾蠕之細並蒙道䕃咸𬒳時禧賜宰臣冨弼上第三表乞退不允斷來章批答省表具之朕眷惟宰輔之司實繫一作繄朝廷之重職或非稱勢因易揺比以連年猒於屢易或用人之不審致厥位之靡安故於圖任之𥘉尤極精求之意而議者謂卿有天下之譽慶朕得非常之才豈惟斷不惑於予心固以慰久鬱之人望則朕之用卿者至矣卿之自待者如何而方沃嘉猷遽形退讓駭無因而及此曽莫諭於乃誠豈廊廟之崇責重者其憂難任而冨貴之至位髙則其慮易危邪朕嘗歷考往昔之人其於進退之際過計而圖全者未必無患忘身而徇國者固多令名惟爾之明必知所擇冝少安於職業用深體於倚毗所乞冝不允仍斷來章賜兖國公主陳讓恩命第三表不允斷來章手詔七月七日省所三上表陳讓兖國公主事具悉古者周姬下嫁車服不繫於其夫漢女有封湯沐並開於新邑所以重國家之體隆親愛之恩稽累聖之舊章皆按圖而啓國汝以天姿之甚淑習姆敎而已閑方及有行乃遵先制俾襃賢懿用錫土田而乃志在撝謙願還渥澤固辭以禮旣深體於懇誠承命必恭冝勉祗於寵數所讓冝不允仍斷來章付兖國公主賜賢妃苗氏陳讓恩命第三表不允斷來章批答省所三上表陳讓賢妃事具悉妃嬪之制秩叙著於王宫爵賞之行名數存乎國典舉必謀衆予其敢私眷柔閑淑慎之賢有輔佐憂勤之徳更歳時而惟舊列號位以旣隆屬者因築館之將行示縁恩而推寵雖朕心之乃眷必廷論之曰然而能恪一作封執謙沖深形懇避然而讓冝有節禮不越於再三命出惟行告已申於中外往祗休渥母或固辭所讓冝不允仍斷來章付賢妃苗氏賜知乾寧軍髙遵約獎諭勑書七月七日勑髙遵約省河北安撫提刑司奏勘會乾寧軍去歳值大雨河水泛漲衝破護城堤渰浸城壁其河岸大段墊壞軍城危急汝乗此水災徑赴本任交割勾當㝷計度功料多方用心躬親部役修築河堤及護城堤至今年三月内了當甚得堅固本軍久逺委不消遷廢伏乞特加旌賞事嚮以暑雨失節悍湍迅流水防廢官衝溢為患汝能奔走就職勤勞匪躬民氓無墊溺之虞壁壘得繕完之固厥效明著攸司以聞載寛憂顧之懷冝示襃嘉之意故茲獎諭想冝知悉秋熱汝比好否遣書指不多及福寧公主宅開啓道埸青詞七月十五日伏以妙道無形宅真靈於杳黙精衷有感延福應之純厖眷外館之有嚴肅行車而伊始俾遵科式祓以芬芳冀冥祐之敷垂集休寧而永保内中福寧殿開啓三長月祝聖壽道埸青詞八月二十六日伏以凛秋肅物嘉歳序之成功吉月延祥按仙科之舊式瞻彼清真之馭敞茲禁宻之廷薦以芬芳通於杳黙伏冀壽齡永固福應來臻隆寳歷以遐昌均庻邦而康靖玉津園開啓保祐聖躬為民祈福道埸青詞八月二十六日伏以祗紹慶圖撫寧一作摩方夏仰荷百祥之時集思同庻品以均休乃即清郊載嚴淨侶誦蘂宫之真訓瞻琁極之髙靈伏願聖壽無疆永錫厖鴻之祐物生咸遂並臻康泰之期南京鴻慶宫開啓皇帝本命道埸青詞九月十三日伏以寳圖興運茲惟受命之邦琳館凝祥肅奉真遊之馭惟本元之令日薦精潔之明誠按金籙之科儀瞻紫霄之杳黙伏冀衆靈敷祐百福來臻保遐筭於無疆圴含生之賴徳賜樞宻副使田況生日禮物詔九月十三日卿夙韞才猷贊吾機務屬涼秋之肅物嘉誕日之屇一作戒期冝有寵頒以彰恩眷班荆館賜契丹國信使副到闕酒果口宣九月卜三日卿等祗命使軺修歡隣聘式交都畿之近冝推宴勞之恩錫以甘芳用彰眷遇班荆館賜契丹國信使副到闕御筵口宣卿等肅持聘問恊講隣歡渉川陸之甚遐戒郊圻而茲始冝申宴犒用示眷優玉津園賜契丹國信使副弓箭御筵口宣卿等荐脩聘好方憩輶軒肅射圃以有儀豐宴籩而加品膺茲寵錫式體眷懷雄州白溝驛賜北朝契丹賀正旦人使御筵兼傳宣撫問口宣卿等言飭使軺時修聘好渉此沍寒之候載惟行李之勤冝示宴慈用彰眷撫内制集卷第四此卷賜陳執中詔出守蕃垣孫沔詔徙領要蕃元本皆用蕃字按字書蕃屏也藩籬也亦藩屏也其義相通故公集互用之正月六日賜契丹賀正使御筵口宣宴飫一作宴飲東太一宫保夏道埸宻詞祝聖一作祝聖壽賜冨弼第三表乞退批答或用人或一作戒謂卿謂一作以福寧公主宅開啓道埸青詞福寧一作福康外集卷第四歐陽文忠公集五十四古詩四桐花猗猗井上桐花葉何蓑蓑下䕃百尺泉上聳陵雲材翠色洗朝露清隂午當階幽蟬自嘒嘒鳴鳥何喈喈日出花照耀飛香動浮埃今朝一雨過狼籍黏青苔斯桐乃誰樹意若銘吾齋常聞漢道隆上下相和諧選吏擇孝㢘視民嬰與孩政聲如九韶百物絶妖災優優潁川守能致鳯凰來到此幾千載丹山自崔嵬聖君勤治理百郡列賢才嗟爾不自勉鳳凰其來哉思二亭送光禄謝寺丞歸滁陽吾嘗一作常思醉翁醉翁名自我山林本我性章服偶包裹君恩未知報進退奚爲可自非因讒逐決去焉一作詎能果前時永陽謪誰與脫韁鏁山氣無四時幽花常婀娜石泉咽然鳴野艷笑而傞賔歡正諠譁翁醉巳岌峩我樂世所悲衆馳予坎軻惟兹三二子嗜好其二字一作學甚同頗因歸謝巖石爲我刻其左吾嘗一作常思豐樂魂夢不在身三年永陽謪幽谷最來頻谷口兩三家山泉爲四鄰但聞山泉聲豈識山意春春至換群物花開思故人故人今何在憔悴潁之濵人去山自緑春歸花更新空令谷中叟笑我種花勤堂中畫像探題得杜子美風雅乆寂寞吾思見其人杜君詩之豪來者孰比倫生爲一身窮死也萬世珍言茍可垂後士無羞賤貧和徐生假山匠智無遺巧天形極幽探謂我愛山者爲山列前簷頽垣不數尺萬嶮由心潛或開如斷裂或吐似谺􆈆或長隨靡迤或瘦露􅻊嵌隂一作險穴覻杳杳髙屏立巉巉後出忽孤聳群奔沓相參靉若氣融結突如鬼鐫鑱昔歲貶荆楚扁舟極東南孤山馬當夾兩岸臨江潭常恨江水惡輕風不留帆峯巒千萬狀可愛不可談但欲借粉繪圖之掛紈縑豈如几席間百態生濃纎暮雲點新翠孤煙起朝嵐況此窮冬節隂飈積凝嚴幽齋喜深處逺目生遐瞻晝卧不移枕晨興自開簾吾聞君子居出處無常占卷道或獨善施物仁貴兼於時苟無益懷禄古所慙嵩山幸不逺薇蕨豈不甘自可結幽侣披雲老溪巖胡爲不即往一室安且恬辱子贈可愧因詩以自讒送楊貟外予昔走南宫江湖浩然渉今來厭塵土常懷把輕楫聞君東南行山水恣登躡秋江湛巳清樹色映丹葉羡君舟揷㯭去若魚鼓鬛君家兄弟才門族當世甲行期薦賢書疾驛來上閤讀梅氏詩有感示徐生子美忽已死聖俞舎吾南嗟吾譬馳車而失左右驂勍敵嘗壓壘羸兵當戒嚴凡人貴勉強惰逸易安恬吾旣苦多病交朋復凋殱篇章乆不作意思如膠粘良田失時耕草莾廢鋤芟美井不日汲何由發濤甘偶開梅氏篇不覺日掛簷乃知文字樂愈乆益無厭吾嘗一作常哀世人聲利競爭貪哇咬聾兩耳死不享韶咸而幸知此樂又常深討探今官得閑散舎此欲奚耽頑庸湏警䇿賴子發其箝和人三橋笳鼓下層臺旌旗轉長嶼橋響騖歸軒溪明望行炬北臨白雲澗南望清風閣出樹見人行隔溪聞魚躍斷虹跨曲岸倒影涵清波爲愛斜陽好廻舟特特過𥘉夏劉氏竹林小飲春榮忽已衰夏葉換𥘉秀披荒得深蹊掃緑䕃清晝萬竿交已聳千畒蔚何冨驚雷迸狂鞭霧籜舒文繡虚心髙自擢勁節晚愈瘦雖慙桃李妖豈愧松栢後川源湛新霽林麓洗昬霿猗猗色可餐滴滴翠欲溜況兹夏首月景物得嘉候晚蝶舞新黃孤禽弄清咮窺深入牎蒙玩宻愛林茂依依帶幽澗隱隱見孤岫林蓀縟堪眠野汲冷可漱鳴琴㵼山風髙籟發仙奏暑却自蠲渇心閑疑愈疚杯盤雜芬芳圖籍羅左右怡然忘簮組釋若出羈廐矧予懷一丘未得解黃綬官事偶多閑郊扉湏屢叩新篁漸添林晚筍堪薦豆誰邀接籬公有酒幸相就眼有黒花戯書自遣洛陽三見牡丹月春醉往往眠人家揚州一遇芍藥時夜飲不覺生朝霞天下名花惟有此罇前樂事更無加如今白首春風裏病眼何湏厭黒花送朱生萬物各有役無心獨浮雲遂令幽居客日與山雲親植桂比芳操佩蘭思㓗身何必濯於水本無纓上塵雪時在潁州作玉月棃梅練絮白舞鵝鶴銀等事皆請勿用新陽力微𥘉破蕚客隂用壯猶相薄朝寒稜稜風疑莫犯暮雪緌緌止還作驅馳風雲𥘉慘淡炫晃山川漸開廓光芒可愛𥘉日照潤澤終爲和氣爍美人髙堂晨起驚幽士虚牎靜聞落酒壚成徑集缾􅎆獵騎尋蹤得狐貉龍虵掃處斷復續猊虎團成呀且攫共貪終歲飽麰麥豈恤空林飢鳥雀沙墀朝賀迷象笏桑野行歌没芒屩乃知一雪萬人喜顧我不飲胡爲樂坐看天地絶氛埃使我胷襟如洗瀹脫遺前言笑塵雜搜索萬象窺冥漠潁雖陋邦文士衆巨筆人人把矛槊自非我爲發其端凍口何由開一噱雪晴悠悠野水來灧灧西溪闊曉日披宿雲荒臺照殘雪風光變窮臘歲律新陽月凍卉意𥘉回緑醅浮可撥人閑樂朋友鳥哢知時節豈止探芳菲耕桑行可閱琴髙魚琴髙一去不復見神仙雖有亦何爲溪鱗佳味自可愛何必虚名務好竒竹間亭二首其一巳見居士集髙亭照𥘉日竹影涼蕭森新篁漸解籜翠色日已深雨多苔莓疑青幽徑無人尋靜趣乆廼得暫來聊解襟清風䬃然生鳴鳥送好音佳時不易得濁酒聊自斟興盡即言返重來期抱琴箕山朝下黄蘆坂夕望箕山雲𬗟懷巢上客想彼嵓中人弱歲慕髙節壯年嬰世紛漱流羡潁水振衣嗟洛塵空祠亂驚鳥山木含餘曛聊兹謝芝桂歸月及新春西園落日叩溪門西溪復何所人侵樹裏耕花落田中雨平野見南山荒臺起寒霧歌舞昔云誰今人但懷古白兎天冥冥雲濛濛白兎擣藥姮娥宫玉關金鏁夜不閉竄入滁山千萬重滁泉清甘瀉大壑滁草軟翠揺輕風渇飲泉困棲草滁人遇之豐山道網羅百計偶得之千里持爲翰林寳翰林酬酢委金璧珠箔花籠玉爲食朝隨孔翠伴暮綴鸞皇翼主人邀客醉籠下京洛風埃不霑席群詩名貌極豪縱爾兎有意果誰識天資㓗白已爲累物性拘囚盡無益上林榮落幾時休回首峯巒斷消息偶書吾見陶靖節愛酒又愛閑二者人所欲不問愚與賢柰何古今人遂此樂尤難飲酒或時有得閑何鮮焉浮屠老子流營營盈市㕓二物尚如比仕宦不待言官髙責愈重禄厚足憂患暫息不可得況欲閑長年少壯務貪得銳意力爭前老來難勉强思此但長歎決計不冝晚歸耕潁尾田日本刀歌昆夷道逺不復通世傳切玉誰能窮寳刀近出日本國越賈得之滄海東魚皮裝貼香木鞘黄白閑雜鍮與銅真鍮似金真銅似銀百金傳入好事手佩服可以禳妖凶傳聞其國居大島土壤沃饒風俗好其先徐福詐秦民採藥淹留丱童老百工五種與之居至今器玩皆精巧前朝貢獻屢住來士人往往工詞藻徐福行時書未焚逸書百篇今尚存令嚴不許傳中國舉世無人識古文先王大典藏夷貊蒼波浩蕩無通津令人感激坐流涕鏽澁短刀何足云㑹峯亭山勢百里見新亭壓其巔群峯漸靡迤髙下相綿聮下窺疑無地杳藹但蒼煙是時新雨餘衆壑鳴春泉林籟靜更響山光晚逾鮮嵓花爲誰開春去夏猶妍野鳥窺我醉谿雲留我眠日暮山風來吹我還醒然醉醒各任物雲鳥徒留連晚歩緑隂園遂登凝翠亭餘春去巳逺緑水涵新塘漸愛樹隂宻𥘉迎蕙風涼髙亭可四望繞郭青山長野色晚更好嵐曛共微茫幽懷不可冩雅詠同誰觴明月如慰我開軒送清光聖俞惠宣州筆戯書聖俞宣城人能使紫毫筆宣人諸葛髙世業守不失緊心縛長毫三副頗精宻硬軟適人手百管不差一京師諸筆工牌榜自稱述纍纍相國東比若衣縫蝨或柔多虚尖或硬不可屈但能裝管榻有表曽無實價髙仍費錢用不過數日豈如宣城毫耐乆仍可乞贈潘景温叟秦盧不世出俗子相矜誇治疾不知一作求源橫死紛如麻番陽竒男子衣冠本儒家學本得心訣照底窮根厓泠然鑒五藏曽靡毫釐差公卿掃榻迎黄金載盈車語言無羽翰飛入萬齒牙相逢京洛下使我驚且嗟七年慈母病庸工口咿啞恨不早見君以乞壷中砂通宵耳髙論飲恨知何涯瞥然别我去征途指煙霞孤雲不可留淚線風中斜學書二首蘇子歸黄泉筆法遂中絶賴有蔡君謨名聲馳晚節醉翁不量力毎欲追其轍人生浪自苦以取兒女恱豈止學書然自悔從今決學書不覺夜但怪西䆫暗病目故己昬墨不分濃淡人生不自知勞苦殊無憾所得乃虚名榮華俄頃暫豈止學書然作銘聊自鑒奉使道中作三首執手意遲遲出門還草草無嫌去時速但願歸時早北風吹雪犯征裘夾路花開回馬頭若無二月還家樂爭柰千山逺客愁爲客莫思家客行方逺道還家自有時空使朱顔老禁城春色暖融怡花倚春風待客歸勸君還家湏飲酒記取思歸未得時客夢方在家角聲巳催曉怱怱行人起共怨角聲早馬蹄終日踐冰霜未到思回空斷腸少貪夢裏還家樂早起前山一作山前路正長奉使道中寄坦師道人少賈海上遊海舶破散身沉浮黄金滿篋人所寄吹簸偶得還中州臝身歸金不受報秪取斗酒相獻酬歡娯慈母終一世脫棄妻子藏巖幽蒼煙寥寥池水漫白玉菡蓞吹髙秋夜燃栢子煑山藥憶此東望無時休塞垣春枯積雪溜沙礫威怒黄雲愁五更匹馬隨鴈起想見鄮郭花今稠百年夸奪終一丘世上滿眼真悠悠寄聲萬里心綢繆莫道異趣無相求勉劉申有司精考覈中第爲公卿本基在積習優學登榮名吾子齒尚少加勤無自輕弩力圖樹立庻幾終有成夀樓碧瓦照日生青煙誰家髙樓當道邊昨日丁丁斤且斲今朝朱欄横翠幕主人起樓何太髙欲誇冨力壓群豪樓中女兒十五六紅膏畫眉雙鬢緑日暮春風吹管弦過者仰首皆留連應笑樓前騎馬客腰垂金章頭已白苦貪名利損形骸爭若庸愚恣聲色朝見騎馬過暮見騎馬歸經年無𥙷朝廷事何用區區來往爲試院聞奚琴作奚琴本出奚人樂奚虜彈之雙淚落抱琴置酒試一彈曲罷依然不能作黄河之水向東流鳬飛鴈下白雲秋岸上行人舟上客朝來暮去無今昔哀絃一奏池上風忽聞如在河舟中絃聲千古聽不改可憐纎手今何在誰知着意弄新音斷我罇前今日心當時應有曽聞者若使重聽湏淚下乞藥有感呈梅聖俞宣州紫沙合圓若截郫筒偶得今十載走宦一作官南北東持之聖俞家乞藥戒羸僮聖俞見之喜遽以手磨礱謂此吾家物問誰持贈公因嗟與君交事事無不同憶昔𥘉識靣青衫游洛中髙標不可揖杳若雲間鴻不獨體輕徤目明仍耳聦爾來三十年多難百憂攻君晚得竒藥靈根斸離宫其狀若狗蹄其香比芎藭愛君方食貧靣色恱以豐不憚乞餘劑庻幾助衰癃平時一笑歡飲酒各爭雄向老百病出區區論藥功衰盛物常理循環勢無窮寄語少年兒慎勿笑兩翁擬剥啄行寄趙少師剥剥復啄啄柴門驚鳥雀故人千里駕信士百金諾搢紳相趨動顔色閭巷歡呼共嗟愕顧我非惟慰寂寥於時自可警偷薄事國十年憂患同酣歌幾日暫相從酒醒𥘉不戒徒馭歸思瞥起如飛鴻車馬閴然人巳去荷鋤却向野田中絶句臨薨作冷雨漲焦陂人去陂寂寞惟有霜前花鮮鮮對髙閣聮句三首冬夕小齋聮句寄梅聖俞陸經寒牎明夜月歐一作夜自明散帙耿燈火破硯裂冰凘陸敗席薦霜笴廢書浩長吟歐想子實勞我清篇追曹劉陸若語侔島可酣飲毎頽山歐談笑工炙輠駕言當有期陸歲晚何未果幽夢亂如雲歐别愁牢若鎻雪水漸漣漪陸春枝將婀娜客心莫遲留歐苑一作范葩即紛墮何當迎笑前陸相逢嘲飯顆歐劒聮句范仲淹滕宗諒聖人作神兵以定天下厄范蚩尤發靈機干將構雄績歐槖籥天地開鑪冶隂陽闢滕南帝輸火精西皇降金液歐炎炎崑岡熒洶洶洪河擘范雷霆助意氣日月淪精魄滕神氣不在大錯落就三尺直淬靈溪泉橫磨太行石歐雄雌威並立晝夜光相射范提携風雲生指顧煙霞寂滕堅剛正人心耿介志士跡歐𥘉疑成夏鼎魑魅世所適滕又若引吴刀犀象謂疑無隔范截波虬尾滑脫浪鯨牙直頑冰挂隂霤皎月乗孤隙歐河角起彗氣雲罅露秋碧曉鐔星斗爛夜匣飛龍宅范舞酣霰雪回彈俊球琳擊鮮揺霅水光膩刮湘山色滕青蛟渇雨瘦素虺蟠霜瘠歐清音鏘以鳴寒姿堅且澤范鬼類喪影響佞黨摧肝膈歐一旦㑹神武四海屠兇逆范周王奉天討商郊千里赤歐楚子揚軍聲秦師萬首白祥輝冠吴楚殺氣橫燕易范與君斬鼇足八極停震􅊒歐與君刜鵬翼三辰増煥赫莫使化猿翁辱我爲幻惑范莫使暴虎人屈我執仇敵滕尊嚴俟冠冕左右舞干戚歐功成不可留延平空霹靂范鶴聮句范仲淹滕宗諒上霄降靈氣鍾此千年禽范幽閑靖節性孤髙伯夷心歐頡頏紫霄垠飄颻滄浪潯歐岳湛有仙姿鈞韶無俗音范毛滋月華淡頂粹霞光深歐目流泉客淚翅垂羽人襟滕騰漢雪千丈點溪霜半尋范纎喙礪青鐡脩脛雕碧琳歐巖棲干溪樹澤飲卑朱汵滕鸞皇自塤箎燕雀徒商參范獨翅聳瓊枝群舞傾瑶林歐病餘霞雲段夢回松吹吟滕靜嫌鸚鵡言髙笑鴛鴦淫范金清冷澄澈玉格寒蕭森歐㓗白不我恃腥羶非所任滕稻粱不得已蟣虱胡爲侵范天池憶鵬遊雲羅傷鳳沈滕風流超縞一作起績素雅淡絶規箴歐相親長道情偶見銷煩襟范西漢惜馮唐華皓欲投簮歐南朝仰衛玠清羸疑不禁滕端如方直臣處群良足欽范介如㢘退士驚秋猶在隂范幾誚鷹隼鷙覊韝俄見臨歐還嗤鳬鷖貪弋繳終就擒歐乗軒乃一芥空籠仍萬金滕片雲伴遥影冥冥越煙岑范長飈送逸響亭亭疑出一作幽霜砧歐蓬瀛忽往來桑田成古今歐願下八佾庭鼓舞薫風琴滕來鷰堂與趙叔平王禹玉王原叔韓子華聮句嘉祐三年見華陽集續添賢侯謝郡歸從游樂吾黨林泉冨餘地卜築䟽陳莾是時春正中來鷰音下上若賀大厦成喜留衆賔賞槩得名因談笑揮墨􅙾題榜所夸賢豪盛豈止池榭廣人心樂且閑鳥意頡而頏吟罇敞花軒醉枕酣風幌脩輕雲薄藻棟𥘉日麗珠網紅𬒮生暗香清絃泛餘響林深隱飛蓋岸曲遲去槳波光欄檻明竹飛衣巾爽珪虚容涼樾入影與文漣蕩晨飈轉緑蕙夕雨滋膏壤嘉辰喜盍朋命駕期屢往觴詠陶淑真世俗豈吾倣洙得以爲勝游蕭然散煩想公子固好士世徳復可象今此大基􅌟不圖專奉養美哉風流存來葉足師仰絳賢侯謂鎮東軍節度觀察留後李端愿外集卷第四奏議卷第四歐陽文忠公集一百諫院論京西賊事劄子慶曆三年臣竊聞近日張海郭貌山與范三等賊勢相合轉更猖狂諸處奏報日夕不絶伏惟聖慮必極憂勞不聞廟謀有何處置臣竊見朝廷作事常有後時之失又無慮逺之謀患到目前方始倉忙而失措事纔過後已却弛慢而因循昨王倫暴起京東轉攻淮甸横行千里旁若無人旣於外處無兵湏自京師發卒孫惟忠等未離都下而王倫已至和州矣賴其天幸偶自敗亡然而驅殺軍民焚燒城市瘡痍塗炭毒遍生靈此州郡素無守備而旋發追兵誤事後時之之字一作皆有明驗臣謂朝廷因此必悔前非湏有改更以防後患而自王倫敗後居兩府者了無擘畫有上言者又不施行上下拖延日過一日遂致張海郭貌山等又起京西攻劫州縣横行肆毒更甚王倫依前外處無兵又自京師發卒臣聞張海是李宗火内惡賊郭貌山在商山已及十年其驍勇兇姦不比王倫偶起之賊縱使官兵追及亦其勝負未知天下之憂恐自此始臣亦知近日臣寮上言賊事者甚衆竊慮兩府進呈文字之時必湏奏言已差使臣選兵追捕將此拙計便爲廟謀上寛聖懷苟自塞責張海等二百餘人盡有甲馬日行一二百里馬力困乏則弃别奪民間生馬乗騎竊料官兵必難追逐縱使追兵能及生靈已受其殃此度賊雖能平後患豈可不慮以今四方盗起所在各要隄防則臣前所言禦賊四事之中州縣置兵最爲急務伏望陛下憫此生民見受屠戮之苦不聽迃儒遲緩誤事之言其州縣置兵事件冨弼巳有起請伏乞決於宸意速與施行取進止再論置兵禦賊劄子同前臣近爲張海等賊勢猖狂曽上言禦賊四事内一件州郡置兵爲備風聞朝議已依冨弼起請施行其餘三事一乞選捕盗官二乞定賞罰新法三乞按察老病貪贓之官此三事至今未聞擬議臣伏見去年朝廷於諸道州府招宣毅兵士及添置郷兵弓手當時搔擾次第不小本要爲州縣禦賊之備及一旦王倫張海等相繼而起京東淮南江南陜西京西五六路二三十州軍數千里内殺人放火肆意横行入州入縣如入無人之境則去年所置宣毅兵郷兵弓手等盡皆何在無一處州縣得力者蓋由官吏不得其人賞罰無法而所置宣毅郷兵弓手皆不一作無堪使用一作者所以張皇搔擾空有爲備之名而無爲備之用今朝廷雖依冨弼起請令州郡置兵若不先擇官吏嚴立法令則依前置得不堪使用之兵空有其名終不濟事故臣謂必欲州郡置得精兵則湏採臣所陳三事一一施行方可集事其州縣官吏誤事臣請試言京西一兩處則其他可知郢州知州王昌運老病腰脚行動不得毎日令二人扶出坐衙三年之内州政大壞臨替得一比部貟外郎劉依交代其劉依亦是七十餘歳昬昧不堪昨在滑州寄居臣爲通判三四度來看臣每度問臣云中書有一个王參政名甚如此不知人事陛下試思如此等人能爲國家置兵禦賊乎人汝州知州鮑亞之是三司以不才柬退者鄧州知州朱文郁是轉運使中不材選退者二人老懦不才如此等人能爲國家置兵禦賊乎陛下欲知全盛之世盗賊便敢如此者蓋爲處處官吏非人故臣前後累言乞按察冗濫之官者蓋爲恐有此事也兩府之議不肯於無事之時先爲禦備直待打破一州方議換知州打破一縣方議換縣令其餘未經打破州縣一任老病貪繆之官壞之臣謂是大臣不欲以身當怨之過也今天下生民獲安樂則皆湏上感陛下聖徳若其父子殺戮離散不安則亦必歸怨陛下今大臣不肯澄汰蓋避百十人官吏怨其身寧使百萬蒼生塗炭而怨國家今盗賊一年多如一年一火強如一火天下禍患豈可不憂伏望聖明一作慈特出睿斷如必行州郡置兵之法則先湏慎擇官吏免致虚爲搔擾反更害民臣前後三次乞按官吏況國家自來每有災傷路分累曽遣使安撫豈於今日視民如此塗炭頓以遣使爲難願陛下力主而行之則天下幸甚取進止論盗賊事冝劄子同前臣近因軍賊王倫等事累有論奏爲見天下空虚全無武備指陳後漢隋唐亡國之鑒皆因兵革先興而盗賊繼起不能撲滅遂至横流又見國家綱紀隳頽法一作政令寛弛賞罰不立善惡不分體弱勢危可憂可懼欲乞朝廷講求禦盗之術峻行責下之法兼聞搢紳之内憂國者多日有封章皆論賊事臣但謂朝廷見已形之患聞衆多之言必動於心略知恐懼及聞樞宻院戒勵進奏官不使外人知事方認兩府猒苦獻言之人又見自和州奏破王倫之後更不講求禦賊之䇿又認上下已有偷安之意殊不知前賊雖滅後賊更多今建昌軍一火四百人桂陽監一火七十人草賊一火百人其餘池州解州鄧州南京等處各有強賊不少皆建旗鳴鼔白日入城官吏逢迎飲食宴樂其敢如此者蓋爲朝廷無賞罰都不足畏盗賊有生殺時下湏從臣恐上下因循日過一日國家政令轉弱盗賊威勢轉強使畏賊者多向國者少天下之勢從兹去矣臣竊聞京西提點刑獄張師錫爲部内使臣與賊同坐喫酒及廵檢縣尉不肯用心曽有論奏其言甚切臣舊識師錫其人恬靜長者遲緩優柔不肯生事今尚有此奏則臣謂天下無賢愚皆爲國家憂之獨不憂者朝廷爾嗟夫古之智士能慮未形之機今之謀臣不識已形之禍以患爲樂以危爲安見盗賊雖多而時有敗者遂生翫冦之意見言事者衆而聽之已熟遂有忽人之心臣近曽求對便殿伏䝉陛下語及賊事憂形于色及退見宰輔間暇從容天下之事深可憂矣今建昌桂陽一有軍字賊數不少想其爲害尤甚王倫在於逺處更合留意今自京發兵則道逺不及外處就撥則處處無兵欲乞嚴勑大臣鑒此巳成難救之患速講定禦盗之法頒行天下使四方漸爲備禦及一作仍早擘畫剪撲諸處見在賊數自有賊巳來群臣上言者皆爲自來寛法致得不肯用心捉賊皆乞峻行法令近見池州官吏各只罰銅五斤乃知言者皆不蒙聽納臣謂大臣爲國計者寜猒忠言之多不猒盗賊之多乃如此行事爾臣前後上言賊事文字不少仍乞類聚擇其長者講定法制陛下欲知大臣不肯峻國法以繩官吏蓋由陛下不以威刑責大臣此乃社稷安危所繫陛下之事也伏望留意而行之取進止論學士不可令中書差除劄子慶曆三年臣近見翰林學士蘇紳葉清臣等相繼解職風聞侍從之臣内有姦憸小人頗急經營爭先進用至有喧忿之語傳聞中外者旣虧廉讓之風又損朝廷之體臣伏思翰林之職重於唐世乃是天子親信朝夕謀一作謀夕議内助之臣當時號爲内相故其進用尤極精選只用一作取材識不限資品往往自州縣官一有擢字而拜者國朝近歳於此一職頗非其人旣見其材識愚下不足以備訪問一本有之事二字人主因之薄一本作薄之其待遇迹漸踈外同於冗官遂容小人得以濫進臣思其弊蓋由不合令中書依資差除且學士之職本要内助天子講論外朝闕失今若却令中書除人致於内一作置之内制則是恩出中書之人雖在天子左右與無無字一作外官同也伏乞自今後翰林學士不必足貟用人不限資品但擇有才望正人堪充者出自上意一作聖明擢用以杜小人爭進之端而天子左右更無姦邪之人庻清侍臣之列取進止論吕夷簡劄子同前臣昨日伏覩外廷宣制吕夷簡守太尉致仕以夷簡爲陛下宰相而致四夷外侵百姓内困賢愚失序一作倒置紀綱大隳二十四年一作十四年間壞了天下人臣大冨貴夷簡享之而去天下大憂患留與陛下當之夷簡罪惡滿盈事迹彰著然而偶不敗亡者蓋其在位之日專奪國權脅制中外人皆畏之莫一作不敢指一作發擿及其疾病天下共喜姦邪難去之人且得巳爲天廢又見陛下自夷簡去後進用賢才憂勤庻政聖明之徳日新一作日又新故識者皆謂但得大姦巳廢不害陛下聖政則更不復言所以使夷簡平生罪惡偶不發揚上一作正賴陛下終始保全未汚斧鑕是陛下不負夷簡夷簡上負朝廷今雖陛下推廣仁恩厚其禮數然臣料夷簡必不敢當理湏陳讓臣乞因其來讓便與寢罷别檢自來宰相致仕祖宗舊例與一合受官名然臣猶恐夷簡不識廉耻便一作更受國家過分之恩仍慮更乞子弟恩澤縁夷簡子弟因父僥倖恩典已極今邊鄙多事外靣臣寮辛苦者未甞非次轉官豈可使姦邪巨蠹之家貪贓愚騃子弟不住加恩竊恐朝廷貽濫賞之譏未弭物論其子弟伏乞更不議恩典取進止論吕夷簡僕人受官劄子同前臣伏見國家毎出詔令常患官吏不能遵行不知患在朝廷自先壞法朝廷不能自信則誰肯信而行之然多因小人僥倖而不加抑絶所與之恩雖少所損之體則多臣聞去年十月中曽有臣寮上言乞今後大臣厮僕不得奏薦班行勑旨頒下纔三四月巳却用吕夷簡僕人袁宗等二人爲奉職夷簡身爲大臣壞亂陛下朝政多矣苟有利於其私雖敗天下事尚無所顧况肯爲陛下惜法但朝廷自冝如何今一法纔出而爲大臣先壞之則其次臣寮僕人豈可不與不與則是行法有二與之則近降勑㫖今後又廢有司爲陛下守法者不思國體但徇人情或云二僕得旨與官在降勑前奈何授官在降勑後凡出命令本爲釐革前弊法家以後勑衝前勑今袁宗等雖曽得旨而未授命之間已該新制自合釐革夷簡不能止絶而恣其僥求朝廷又不舉行近勑而自隳典法今後詔令何以遵行其袁宗等伏乞特追奉職之命别與一軍將之類閑慢名目足示優恩不可爲無功之臣私寵僕奴而亂國法取進止論止絶吕夷簡暗入文字劄子同前臣風聞吕夷簡近日頻有宻奏仍聞自乞於御藥院暗入文字不知實有此事否但外人相傳上下疑懼臣謂夷簡身爲大臣乆在相位尚不能爲陛下外平四夷内安百姓致一作使得二虜交構中國憂危兵民疲勞上下困乏賢愚失序賞罰不中凡百紀綱㡬至大壞筋力康徤之日尚且如此乖繆況已罷政府乆病家居筋力已衰神識昬耗豈能更與國家圖事據夷簡當此病廢即合杜門自守不交人事縱有未忘報國之意凡事即合公言令外廷見當國政之臣共議一作擬可否豈可暗入文書眩惑天聽況夷簡患攤風手足不能舉動凡有奏聞一作䟽必難自寫其子弟軰又不少一作肖湏防作僞或恐漏泄於體尤爲不便雖陛下至聖至明於夷簡姦謀邪說必不聽納但外人見夷簡宻入文書恐非公論若誤國計爲患不輕夷簡所入文字伏乞明賜止絶臣聞任賢勿貳去邪勿疑見今中外群臣各有職事茍有闕失自可任責不可更令無功巳退之臣轉相惑亂取進止薦姚光弼狀同前右臣等伏覩慶暦元年南郊赦書節文委史院檢閱國朝將帥有威名勲業者尋訪子孫録用風聞史院已具檢勘姓名聞奏至今未見施行伏以赦令之文國家大信度必難行之事則不當輕言若巳布告天下則不可失信況此一節自是當今合行之事必慮將家子孫例多不肖則冝於尋訪之時便責州郡察其行止無大過惡者乃得以聞今舊將名在史官能應赦書所求者有㡬若更去一作擇其不肖者不用則推恩所及不過一二十人耳不至濫行恩賞所可惜者因此一二十人而失國家大信臣等伏見故慶州刺史姚内斌有孫光弼好學有行止能記前世兵法及史籍所載名將用兵取勝之術比於累年所試方略濫進之人不可同類若蒙擢用必有所爲伏乞舉行赦書特賜召試仍下所居州縣鄰里考其行實參驗而行其餘將家亦乞遍行一作加尋該臣等職在諫諍當𥙷闕遺見國家赦令已行而自失大信及士有豪俊沉棄而未用者皆當論列臣等又覩赦書節文云本房子孫與班行安排如實有膽勇謀略者仍與邊上任使詳此雖無材藝者亦預推恩也今光弼據其學識況有可採臣等所陳只乞比近年方略之人特與一試上以全國家大信下可収遺逸之人伏望聖慈特賜施行取進止論李淑姦邪劄子同前臣昨日因奏事於延和殿巳曽靣論李淑嚮在開封府猶爲踈外今拜學士是禁中親近之職竊縁此人不冝在侍從之列其姦邪隂險之迹陛下素已知之今外邊臣寮骨肉同坐者不敢道李淑姓名蓋其穢惡醜不可當據外人如此惡之豈合却在人主左右淑自來朋附夷簡在三尸五鬼之數蓋夷簡要爲肘腋所以援引至此不知今日朝廷如此清明更要此人何用若欲藉其詞業則臣謂才行者人臣之本文章者乃其外飾耳況今文章之士爲學士者得一兩人足矣假如全無文士朝廷詔勑之詞直書王言以示天下尤足以敦復古朴之羙不必雕刻之華自古有文無行之人多爲明主所弃只如徐鉉胡旦皆是先朝以文章著名於天下二人皆以過惡廢弃終身不齒當時朝廷亦不至乏人淑居開封過失極多然止是一府之害今在朝廷若有所爲少肆其志則害及忠良沮壞政治是爲天下之害故臣不可不言今雖陛下主張正人不信讒巧然淑之爲惡出於天性恐不能悛改竊慮依舊譛毀好人伏望聖慈一切不納早與一外任差遣使正人端士安心作事無讒毀之避取進止再論李淑劄子同前臣近日竊聞李淑巳有聖㫖令與壽州却知中書不肯便行湏得淑自上章求一作乞出方敢差除臣謂李淑姦邪之迹陛下旣已盡知若得斷自宸衷則使天下之人皆知陛下聦明神聖辨别忠邪黜去小人自出聖斷如此則今後姦邪險惡之人可使知懼而不敢爲害今若如中書之意湏待其自求退則是賞罰之柄不由明主自行去住之謀一任臣下取便如此則今後小人皆知雖爲姦邪險惡天子欲力去而中書必未一作未必肯行若不自退則一作别無人敢差臣恐自此小人轉爲得計不肯悛心進賢退不肖者宰相之職也今大臣旣自避怨不肯爲陛下除去姦邪賴陛下聖明洞分邪正又不能便依聖旨直與差除更湏曲収人情優假群小三四日來外邊聞陛下欲除李淑壽州人人鼓舞皆賀聖徳蓋淑二三十年出入朝廷姦險傾邪害人不少一旦見人主斥去左右莫不欣抃却聞中書如此迂迴自相顧避可惜聖明之斷不盡施行臣欲望更不湏候其請郡因兩府奏事之時特出聖旨處分直除一外郡使天下皆知此姦邪穢惡之人是人主力自除去以彰聖明之徳取進上論慎出詔令劄子同前臣伏以朝廷毎出詔令必湏合於物議下恱民情真宗皇帝𥘉置諫官詔書内條列六事首言詔令不便者許諫官論列蓋朝廷慎於出令之意也近見詔書襃羙陜西轉運使卞咸風聞咸在陜西爲買百姓青苗及轉般大麥此兩事大與西人爲一作大爲西人患逃移却人户一無此三字極多至今西人怨謗不已賴吴遵路減得轉般一事人獲稍寜今所降詔書兩人一時一作例襃羙善惡不分無所激勸使陜西人見者必謂朝廷咫尺絶不䘏念西人不知西事誤下詔書羙此與民爲害之人必轉生怨謗臣竊料朝廷必因邊臣奏舉咸等能積糧儲故賜一作此獎諭蓋失於採訪不知咸處置乖方之事致西民流移怨謗之因欲乞今後戒此失誤慎出詔令及戒勵羣臣今後薦舉人不得妄有稱羙其已出之詔旣不可追臣又恐朝廷因此遂待卞咸爲材一作能吏别有任用却致敗事臣職在諫諍不可不言奏議卷第四論京西賊事劄子甞有後時甞疑作常再論置兵禦賊劄子郷兵弓手此下一有等字前後三次比下一有言字論盗賊事宜劄子戒勵勵一作勤外處無兵外處誤作處處論學士不可令中書差除劄子上意一作聖意論吕夷簡劄子二十四年四一作餘國權一作主權論李淑劄子穢惡穢字下一有徳字人主力自除去人主一作陛下居士集卷第四歐陽文忠公集四古詩二十四首贈無爲軍李道士二首名景仙無爲道士三尺琴中有萬古無窮音音如石上㵼流水㵼之不竭由源深彈雖在指聲在意聽不以耳而以心心意旣得形骸忘不覺天地白日愁雲隂李師琴紋一作形如卧蛇一彈使我三咨嗟五音商羽主肅殺颯颯坐上風吹沙忽然黃鍾回暖律當冬草木皆萌牙郡齋日午公事退荒涼樹石相交加李師一彈鳯凰聲空山百鳥停嘔啞我怪李師年七十面目明秀光如霞問胡以然一作試問胡以一作試問胡然笑語我愼勿辛苦求丹砂惟當飬其根自然燁其華一本無上二句又云理身如理琴正聲不可干以邪我聽其言未云足野鶴何事還思家抱琴揖我出門去獵獵歸袖風中斜拜赦一作勑拜赦一作勑古州南山火明烈烈州人共喧喧兩丱扶白髮丁寧天語深曠蕩皇㤙闊乃知天地施幽逺無間别欣欣草木意喜氣消殘雪彈琴效賈島體古人不可見古人琴可彈彈爲一作琴聞古曲聲如與一作聞古人言琴聲雖可聽琴意誰能論橫琴置牀頭當午曝背眠夢見一丈夫嚴嚴古衣冠登牀取之坐一作我琴調作南風絃一奏風雨一作南來再鼓變雲烟鳥獸盡嚶鳴草木亦滋蕃乃知太古時未逺可追還方彼夢中樂心知口難一作難口傳旣覺失其人起坐涕汍瀾酬學詩僧惟晤詩三百五篇作者非一人羇臣與弃一作賤妾桑濮乃淫奔其言苟一作或可取痝雜不全純子雖一作之爲佛徒未易廢其言其言在合理但懼學不臻子佛一作之與吾儒異轍難同輪一作共論子何獨吾慕自忘夷其身苟能知所歸固有路自新誘進或可至拒之誠不仁維詩於文章太山一浮塵又如古衣裳組織一作繡爛成文拾其裁剪餘未識衮服尊嗟子學雖一作已勞徒自苦骸筋一作自逺渉江津勤勤袖卷軸一歳三及門惟一作何求一言榮歸以耀一作輝其倫與夫榮其膚不若啓一作豈若習其源韓子亦甞謂收斂加一作以冠巾别後奉寄聖俞二十五兄一本作叙别寄聖俞兼酬進道堂夜話見寄之什長河秋雨多夜揷寒潮一作湖入歳暮孤舟遲客心飛鳥急君老忘卑窮文字或綴緝余生苦難阨一作拙世險蹈已習離合二十年乖睽多聚集常時飲酒别今别輙飲泣君曰吾老矣不覺兩袖濕我年雖少君白髮巳揖揖即入反憶初京北門送我馬暫立自兹遭檻穽一落誰引汲顚危偶脫死藏竄甘自縶一作蟄但令身尚在果得手重執聞來喜迎前貌改驚乍揖别離纔幾時舊學廢百十殘章一作編與斷藁草草各收拾空䆫一作堂語青燈夜雨聽霵霵一作濈濈明朝解舟南歸翼縱莫戢還期明月飲幸此中秋及酒酣弄篇章四坐困供給歡言正喧譁别意忽於邑日暮北亭上濁醪聊一作猶共挹輕一作歸橈動翩翩晚水明熠熠行心一作貪前去雖迫訣語出猶澁歸來録君詩卷軸多􅋾􅋾誰一作雖云巳老矣意氣何嶪岌惜哉方壯時千里足常馽知之莫予深力不足呼吸歎吁偶成篇聊用綴君什紫石屏歌一本作月石硯屏歌寄蘇子羙月從海底來行上天東南正當天中時下照千丈潭潭心無風月不動倒影射入紫石巖月光水㓗石瑩淨一作徹感此隂魄來中濳自從月入此石中天有兩曜分爲三清光萬古不磨滅天地至寳難藏緘天公呼雷公夜持巨斧隳嶄巖墮此一片落千仞皎然寒鏡在玉匳蝦蟇白兎走天上空留桂影猶杉杉一作毶毶景山得之一作􅉑州刺史惜不得贈我意與一作比千金兼自云每到月滿時石在暗室光出簷大哉天地間萬怪難悉談嗟予不度量每事思窮探欲將兩耳目所及而與造化争毫纎煌煌三辰行日月尤尊嚴若令下與物爲比去聲擾擾萬類將誰瞻不然此石竟何物有口欲說嗟如鉗吾竒一作知蘇子胷羅列萬象中包含不惟胷寛膽亦大屢出言語驚愚凡自吾得此石未見蘇子心懷慚不經老匠先指決有手誰敢施鐫鑱呼工畫石持寄似一作此幸子留意其無謙聚星堂前紫薇花亭亭紫薇花向我如有意髙煙晚溟濛清露晨點綴豈無陽春月所得時節異静女不争寵幽姿如自喜音戯將期誰顧眄獨伴我憔悴而我不彊飲繁英行亦墜相看兩寂寞孤詠聊自慰獲麟贈姚闢先輩世已無孔子獲麟意誰知我甞爲之說聞者未免非而子獨曰然有如塤應篪惟麟不爲瑞其意乃可推春秋二百年文一作辭約義甚夷一從聖人没學者自爲師崢嶸衆家說平地生嶮巇相㳂益迃怪各鬪出新竒爾來千餘歳一作千載餘一作千歳餘舉世不知迷焯哉聖人經照耀萬世疑自從蒙衆說日月遭蔽虧常患無氣力掃除浮雲披還其自然光萬物皆見之子昔已好古此經手常持超然出衆見不爲俗牽卑近又脫賦一作賤格飛黃擺銜羈聖門開大道夷路肆騰嬉便可勦衆說旁通一作異端塞多歧正途趨一作常簡易愼勿事嶇﨑著述須待老積勤冝少時苟思垂後世大禹尚胼胝顧我今老矣兩瞳一作目一作眼蝕昏眵大書難乆視心在力已衰因思少自弃今縱悔可追戒我以勉子臨文但吁嘻喜雨大雨雖霶霈隔轍分晴隂小雨散浸淫爲潤廣且深浸淫苟不止利澤何窮已無言雨大小一作言雨大小異小雨農尤喜宿麥巳登實新禾未抽秧一作穗及時一日雨終歳飽豐穰夜響流霡霂晨暉霽蒼涼川原淨如洗草木自生光童稚喜瓜芋耕夫望陂塘誰云田家苦此樂殊未央飛蓋橋翫月一本題上有六月十四夜天形積輕清水德本虚静雲收風波止始見天水性澄光與粹容上下相涵映乃於其兩間皎皎掛寒鏡餘暉所照耀萬物皆鮮瑩矧夫人之靈豈不醒視聽而我於此時翛一作倐然發孤詠紛昏忻洗滌俯仰恣涵泳一本無上二句人心曠而閑月色髙愈一作逾迥惟恐清夜䦨時時瞻斗柄竹間亭啾啾竹間鳥日夕相嚶鳴悠悠水中魚出入藻與萍水竹魚鳥家伊誰作斯亭翁來無車馬非與彈弋并潜者入深淵飛者散縱橫奈何翁屢來浪使飛走驚忘爾榮與利脫爾冠與纓還來尋魚鳥傍此水竹行鳥語弄蒼翠魚遊翫清澄而翁乃何爲獨醉還自醒三者各自適要歸亦同情翁乎知此樂無猒日來登荅吕公著見贈一本作奉荅通判太博爲予不飲見贈之作晉人歌蟋蟀孔子録於詩因知聖賢心豈不惜良時行樂不及早朱顔忽焉衰馳光如騕褭一去不可追今也不彊飲後雖悔奚爲三年謫永陽䧟穽不知危種樹滿幽谷䟽泉㵼清池新陽染山木撩亂發枯枝無人歌青春自釂白玉巵今者荷寛宥一作恩乞一作得州從爾宜西湖舊已聞旣見又過之菡蓞間紅緑鴛鴦浮渺瀰四時花與竹罇爼一作酒動可隨況與賢者同薫然襲一作偉蘭芝醁醅寒且醥清唱婉而遲一作竒四坐各已醉臨觴獨何疑昔人逢麴車流涎尚垂頥況此盃中趣乆得樂無涯多憂衰病早心在良可噫一作嘻譬若卧櫪馬聞􅤯一作皷尚鳴悲春膏已動脉一作忽巳動百卉漸葳蕤丹砂得新方舊疾庶可治尚可執鞭弭周旋以忘疲送滎陽魏主簿廣一本作送魏廣卓犖東一作魏都子姓名聞十年窮冬雪塞空千里至我門子足未及閾我衣驚倒顚僕童一作童僕相視疑寮吏或不然俛首鵠鶴啄進趨鳬鴈聮青衫靴兩一作兩靴脚言色倩一作情以温於公門豈少乃獨得公懽受知固不易知士誠尤難我思屈童吏欲辯難以言觴豆及嘉節髙堂列羣賢文章㸔落筆論議馳後先破石出至寳決髙㵼長川光暉相磨晻浩渺肆波瀾寮吏媿我歎僕童一作童僕恪生顔我顧寮吏嘻士豈以此觀此聊爲戯耳以驚僕童一作童僕昏士欲見其守視其居賤貧欲知其所趨試以義利干我始識其面巳窺其肺肝禮有來必往木瓜報琅玕十年思見之一日捨我還何用慰離居贈子以短篇青松贈林子國華一本作贈林國華秘校青松生而直繩墨易爲功一作攻良玉有天質少加一作假磨與礲子誠懷美材一作君實有美才但未遭良工飬育旣堅好英華充厥中於誰以成之孟韓荀曁雄人日聚星堂燕集探韻得豐字汙池以其下衆流之所鍾尺水無長瀾蛟龍豈其容顧予誠鄙薄羣俊枉髙蹤得一不爲少雖多肯辭豐譬如登圎壇羅列璧與琮又若饗鈞天左右間笙鏞文章爛照耀應和相撞舂而予處其間眩晃不知從退之亦甞云青蒿倚長松新陽發羣枯生意漸丰茸暮雪浩一作皓方積醁醅寒更濃毋言輕此樂此樂難屢逢橄欖五行居四時維火盛南訛炎焦陵木氣橄欖得之多酸苦不相入初争乆方和霜苞入中州萬里來江波幸登君子席得與衆果羅中州衆果佳珠圎玉光瑳媿兹微陋質以逺不見訶餳飴兒女甜遺味乆則那良藥不甘口厥功見沉痾忠言𥘉猒之事至悔若何世已無採詩詩成爲君哦鸚鵡螺大哉滄海何茫茫天地百寳皆中藏牙鬚一作鬣甲角争光鋩腥風怪雨灑幽荒珊瑚玲瓏巧綴裝珠宫貝闕爛煌煌泥居殻屋細莫詳紅螺行沙夜生光一本作珠宫貝闕爛煌煌泥居殻室細莫詳珊瑚玲瓏巧綴粧腥風怪雨灑幽荒紅螺行砂夜生光負材自累遭刳腸匹夫懷璧古所傷濃沙剥蝕隱文章一本注胡人謂􅓀砂爲濃沙出本草磨以玉粉縁一作釦金黃清罇旨酒列華堂隴鳥回頭思故鄕美人清歌蛾眉揚一釂凛冽回一作爲春陽物雖微逺用則彰一螺千金價誰量豈若泥下追含漿食糟民田家種糯官釀酒榷利秋毫升與斗酒沽得錢糟弃物一作不弃大屋經年堆欲朽酒醅瀺灂如沸湯東風來吹酒瓮香纍纍罌與瓶惟恐不得嘗官沽味醲村酒薄日飲官酒誠可樂不見田中種糯人釡無糜粥度冬春還來就官買糟食官吏散糟以爲德嗟彼官吏者其職稱長民衣食不蠶耕所學義與仁仁當飬人義適一作識宜言可聞達力可施上不能寛國之利下不能飽爾一作民之飢我飲酒爾食糟爾雖不我責我責何由逃送焦千之秀才焦生獨立士勢利不可恐誰言一身窮自待九鼎重有能揭之行可謂仁者勇吕侯一作倅相家子德義勝華寵焦生得其隨道合若膠鞏始生及吾門徐子喜驚踊曰此難致寳一失何由踵自吾得二生一作子粲粲獲雙珙奈何奪其一使我意紛􅽅吾甞愛生材抽擢方鬱翁音委勇反一作蓊猶須老霜雪然後見森聳况從主人賢髙行可傾竦讀書趨簡要害說去雜冗新文時我寄庶可蠲煩壅伏日贈徐焦二生一本作徐焦二子伏日遊西湖余以病不能往因以贈之徐生純明白玉璞焦子皎㓗寒泉冰清光瑩爾互輝映當暑自可消炎蒸平湖緑波漲渺渺髙榭一作樹古木隂層層嗟哉我豈不樂此心雖欲往身未能俸優食飽力不用官閑日永一作心樂睡莫興不思髙飛慕鴻鵠反此愁卧償蚊蠅三年永陽子所見山林自放樂可勝清泉白石對斟酌巖花野鳥一作草爲交朋﨑嶇磵谷窮上下追逐猿狖争超騰一作陞酒美賔佳足自負飲酣氣橫猶驕矜奈何乖離纔幾日蒼顔非舊白髮増彊歡徒勞歌且舞勉飲寧及合與升行揩眼眵一作􅛳旋看物坐見樓閣先愁登頭輕目明脚力徤羡子志氣將飄凌只今心意巳如此終竟事業知一作將何稱少壯及時宜努力老大無堪還可憎寄生槐一本題上有荅張推官庭檜檜惟凌雲材槐實凡木賤奈何柔脆質累此孤髙幹龍鱗老蒼蒼䑕耳光粲粲因縁初莫原感吒徒自歎偷生由附託得勢争葱蒨方其榮盛時曽莫見眞贗欲知窮悴節宜試以霜霰萌牙起微蘖辨别乖先見剪除初非難長飬遂成患雖然根性殊常恐枝葉亂惟應植者深幸不習而變含容固有害勦絶須明斷惟當審斤斧去惡無傷善韓公一本公作定州閱古堂兵閑四十年士不識金革水旱數千里民流誰墾闢公初來視之嘻此乃予責將法多益辦萬千由十百整齊一作容談笑間進退有寸尺曰此易爲耳在吾繩與墨天成而地出古所重民食貯儲非一朝人命在旦夕惟兹將奈何敢不竭吾力木牛尚可運玉罄一作磬猶走糴因難乃見材不止將有得公言初未信終歳考成績驕墯識恩威謳吟起羸瘠貔貅著行伍倉廩飽堆積文章娱閑暇一作弄閑散傳記尋一作觀往昔英英文與武粲粲圖四壁酒令列諸將談鋒摧辯客周旋顧視間是不爲無益循吏一州守將軍萬夫敵於公豈止然事業本夔稷冨壽及黎庶威名懾夷狄當歸廟堂上有位乆一作况虚席大匠不揮斧衆工隨指畫從容任羣材文武各以職永州萬石亭寄知永州王顧一本上有寄題注云柳子厚亭天於生子厚禀予獨艱哉超凌驟拔擢過盛輙傷摧苦其危慮一作厲心常使鳴聲哀投以空曠地縱橫放天才山窮與水險下上極沿洄故其於文章出語多崔嵬人迹所罕到遺蹤乆荒頽王君好竒士後二百年來翦薙發幽薈搜尋得瓊瑰咸物不自貴因人乃爲材惟知古可慕豈免今所咍我亦竒子厚開編毎徘徊作詩示同好爲我銘山隈居士集卷第四熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益挍正答吕公著見贈百卉漸萎蕤按字書萎於危切草木枯皃旣云春膏巳動脉豈有萎枯之理當作葳蕤葳蕤草木華垂皃選詩文物共葳蕤東都賦望翠華之葳蕤今改作葳贈李道士石本作贈宗教李尊師名景仙牙石本作芽惟當石本作但當燁石本作曄别後寄聖俞夜揷一作牐君老一作去難阨一作艱阨檻穽一作䧟穽尚在一作幸在𬗋石屏歌在玉匳在一作生獲麟難乆視難一作雖吁嘻一作吁噫飛蓋橋翫月風波一作浪答吕公著晉人晉一作昔送魏主簿我歎一作歎我人日聚星堂燕集探韻得豐字豐一作松閱古堂周旋一作摳衣萬石亭於文章於一作爲書簡卷第四歐陽文忠公集一百四十七與余襄公安道慶曆元年某頓首再拜啓爲別五六歳未甞一日不企而南望然某携老㓜浮水奔陸風波霧毒周行萬三四千里侍母幸無恙其如頑然學不益進道不益加而年齒益長血氣益衰遂至碌碌隨世而無稱邪安道又不幸丁家艱窮居極一有處字起居安否不通於朋友況欲施於他邪嗚呼天果欲窮吾人乎承不乆服除當早治裝以少解積歳區區之思廣文曽生文識可駭云甞學於君子略能道動靜因其行聊書此爲問與王文恪公樂道慶曆八年某啓至節方欲拜狀遽辱惠問感愧感愧新陽納慶奮發賢藴以澤斯民不勝祝願也某近以上熱太盛有見教云水火未濟當行内視之術行未逾月雙眼注痛如割不惟書字艱難遇物亦不能正視但恐由此遂爲廢人所憂者少撰次文字未了爾恃相知敢布深寒保重又皇祐𥘉某頓首啓昨日州吏行甞奉訊徐君來具道相見甚慰所懷某此幸郡小事稀苟見惡者稍息心此亦安然矣自到此公私未甞發尺牘惟有書來即答餘外惟自藏於宻但時有一二文字此事吾徒斷不得爾進取不可于大禍患當避自餘愛惡豈能周䘏也到此極無事所恨漸老益懶墮空過日月不曽成頭叚著得些文字五代史近方求得少許所闕書亦未能了人生多因循巳十三年矣足下幕中苟有著述無惜寄示李習之文字序附上冬冷保重又嘉祐四年某啓區區乆不附問人至辱書具承動靜康和姑以為慰某衰病處此數月不爲住計遇事在目前者遣之以自免過其他如在郵傳也自期以半歳求解復尋江西前請比可得亦湏來春矣此外毀譽都不曽問十年不曽燈下看一字書自入府來夜夜燈下閱數十紙目疾大作一月之内巳在告如此安能乆於此乎承書果亦以此見憂眼稍開得纔兩日猶在告中惜目力又不可不自書草率保愛又熈寧元年某啓自承大斾臨許更闕拜問蓋以衰病無悰人事多廢恃頼相知不以書信䟽數爲意爾人至惠教益荷勤眷兼審經秋尊候康寧併増感慰氣節嚮寒未召用間惟冀爲時自愛以副區區又同前某啓病目艱於書字咫尺闕奉狀蒲支使者過府下云得請見顔色尚覺清廋辱書承手足遂已輕安其慰可量公之功在朝廷不淺所藴未施萬一潁田謾置之爲他日計亦無害累甞具此獻說爾某以決計止在來春亮可奉爲徐求也人事日新閑處尚有所聞然益覺靜勝爾日夕欲奉狀續當馳啓兹不具悉餘乞慎藥食以自輔也又同前某拜啓近急足自府回辱書承此𥘉涼動履清福甚慰勤企兼審中間小疾爲苦喜巳平和仁政清簡歳豐民樂亮足頥神某衰病難名凡老患或耳或目不過一二諸老之疾併在一身所以歸心不得不速也蒙恵藥方益荷意愛已依方合和也咫尺未涯瞻𣢾惟時自愛又熈寧三年某啓某以閑僻養成懶慢乆闕拜問專人辱書感慰曷已某此幸藏拙極遂優安其如衰病侵淩加以私門煩惱無復情悰亮由福過災生致此爾所以量分知止切於思歸也咫尺莫奉宴言歳暮隆寒伏冀爲時自重又同前某年齒日加衰殘日甚理所冝然不足多怪昨者蒙上哀憐信其實病免并得蔡恩出萬幸兼去潁數程便於歸計再尋前請不逺朝夕承樂道亦有卜居許下之意柴車藜杖歳時徃來此自一叚事古人難遂蓋公素藴未施盛年方壯也若某則實難䇿勵爾又熈寧四年某啓昨蒙上恩閔其衰老許遂退休自杜門里巷人事幾廢以是乆闕致誠而雅眷不忘惠然垂問誨諭稠重以慰寂寞於交情乃見之時以勵俗風義所及其利博矣非止病夫之荷德也感愧感愧兼審經寒台候萬福閑中優幸實多但交親益難㑹見此爲區區歳晚凝冽惟宴居頥養以需復用與滕待制子京慶曆五年某頓首自夷陵之貶獲見於江寧逮今十年而執事謫守湖濵某亦再逐淮上音塵靡接㑹遇無期則人事之多端勞生之自困可爲歎息何所勝言急歩忽來惠音見及伏承求䘏民瘼宣布詔條去宿弊以便人興無窮之長利非獨見哲人明逹之量不以進退爲心而竊喜逺方凋瘵之民獲𬒳愷悌之化示及新堤之作俾之紀一作記次其事舊學荒蕪文思衰落旣無曩昔少壯之心氣而有患禍難測之憂虞是以言澁意窘不足盡載君子規模閎逹之志而無以稱岳人所欲稱揚歌頌之勤勉強不能以副來意媿悚愧悚秋序方杪洞庭早寒嚴召未間千萬自重與章伯鎮慶曆五年某頓首山郡僻絶不與人通毎辱誨問何勝感愧某材薄寵過得禍甚輕獲此優安至爲天幸伯鎮尚淹江郡忽已踰年大亨有時先以小抑亦通否之理然也惟冀自愛以副瞻禱又慶曆六年某頓首州幹至蒙問以書承此新春福履休𥙿詩文新作金石交奏某處窮僻不接先生長者之論乆矣忽然得之開發鄙滯況得見其人接其道其樂冝如何哉此志未諧惟用瞻企保重保重又同前某頓首急足至郡辱誨以書承臨郡之暇寢味休適可勝瞻慰也示及傳記三本文偉意嚴記詳語簡而賞罰善惡勸戒丁寧述作之功正爲此爾欽服欽服某幸閑僻甚可尋繹然獨懶於撰述爾嘉話未卜冬冷千萬保重偃虹隄記滕侯牽強不意敢煩餘暇特與揮翰荒惡之文假飾傳乆感媿感媿又皇祐元年某昨以目病爲梗求潁自便養慵藏拙深得其冝泛舟長淮翛然其樂急足逺至辱書爲別且承春暄寢味多福相去益逺瞻望徒勞千萬保重又同前某自聞子美之亡使人無復生意交朋淪落殆盡存者不老即病不然困於世路愁人愁人就中子美尤甚哀哉祭文讀之重増其悲爾盛作俟至西湖方快吟味淮陽若區區到彼必少祛俗慮尚可勉強以攀作者惠茗正爲所少之物多荷多荷自病來絶不飲酒尤爲無聊正藉此物以増清興爾與王郎中道損慶曆八年某啓向在河朔甞辱書爲誨人事多故未暇復問尋而又聞子野之訃值某遷郡淮南扶挈老㓜凡再登舟再出陸始至弊邑用此亦未暇與交游相弔子野之賢難得此天下公議共惜之若相知之難二字一作與相得則某私恨亦有萬萬不窮之意苦事苦事自古賢者無不死惟令名不朽則爲永存矣凡朋友爲子野痛惜者惟可以此一事自寛而巳范公誌文詳悉而實録甚善甚善新歳伊一作甫始千萬保重以慰瞻詠又嘉祐三年某啓專入至辱書承經寒爲政外福履清康實慰瞻企某衰病不支遽蒙以煩冗驅䇿不敢固辭其實非所能亦非所樂又非所堪也居華已逾年當別有美用承見諭敢不如教某病目十年遽爲几案所苦冬至後自當請麾南去矣嚮寒保攝又嘉祐五年某啓辱見諭碑文及拙詩續當遞中奉寄蓋以唐書甫了𥘉謂遂得休息而却送本局寫印本一字之誤遂傳四方以此湏自校對其勞苦牽迫甚於書未成時由是未遑及他事以屢失信於長者不避忉忉承首塗有日旦夕當詣謁人還且此不能盡所懷與杜大夫慶曆八年某再拜乆不聞問經夏渉秋榮侍外體履多福近爲澶魏河決淮南例令勸誘人戸進納梢草淮人旣貧而道逺期促絶無應命者朝旨勸誘使人傳宣又令差定莫知所從南京亦必湏有指揮不知本府如何擘畫見勸到人戸多少如何誘之孰是差定某才薄能劣受恩厚甚聞朝廷以河事爲急正當竭力𥙷報然若於事無益而爲國歛怨於淮人則重爲可罪也爲逺方不知事體急走此奉咨或有勸誘之術願乞餘矩稍濟其急忙中不子細秋涼保重又皇祐四年某啓閑居乏人乆不奉問得遞中書承榮侍多福又知有悼嬰之戚斯事無可柰何惟當自寛上慰慈顔也臨政之始勞慮想多前曽託姚教授奉問實録蓋自居憂日苦閑坐無由度景又近日有一閑人頗能裝裁諒彼視事開決却少暇時以此欲於閑中銷日也不訝不訝及聞近有悲戚則猶不可以閑事干聒深悔前言之容易也悚惕悚惕方欲奉䟽偶姚教授介來聊述此冬深保重與張職方皇祐二年某啓相聚逾年別來豈勝思戀道塗無阻行巳及陳時時得雨舟中不熱自過界溝地土卑薄桑柘蕭條始知潁真樂土益令人眷眷爾小兒輩望見萬壽塔尚指以為臺頭聞其語不覺愴然爾過陳恐難附書秋暑多愛又皇祐三年某啓自承遷秩甞辱惠書迫以多故尋踈奉問近得康一作唐下同屯田信方知巳授蘄春且居潁上即日寒凛寢味多福某自至此以親疾厭厭無暇外事欲求一僻地以便侍養而逺處不可迎侍側近又多爲清要所居不敢陳乞區區于此無復情悰非復湖上之時也未涯相見千萬自重因康屯田人回附此相次專馳狀也又皇祐六年某啓乆不聞問人至得書爲慰不巳六月一日從吉得郡必南正值大熱應湏秋𥘉方可離潁簟真病與懶者所冝珍荷珍荷丁太博却有書一封幸爲致逹斯人文章君子不幸遭此在憂患中難得信問徃來早爲逹一作送之也縣境有好碑試爲訪之別後所収必多也閑中無物爲信慚悚慚悚與劉學士湜字子正皇祐四年某叩頭言罪逆餘生護䘮假道乃勞台斾枉顧孤窮感愧之誠何以云諭限兹凶斬無由詣見斯又重以爲恨也乍逺爲邦自重謹附手䟽叙謝又同前某啓哀苦中幸得相見辱眷甚厚行計所迫不勝依戀嗣沐手誨併深感怍乍逺珍重行次草草爲謝與知縣寺丞皇祐五年某啓自相別後至王回秀才來始一得所惠書承居京師無恙某哀苦如昨近擇得葬地在潁西四十里土厚水深略依山水向背其餘隂陽家說皆莫能一一如法也卜用今秋恐知恐知示及杜漳州有事令人感涕不已與之同甲内顧身世可爲凛凛此人有材能而氣儁冝其與監司違戾然怒者秖能言其率意行事是保無他過矣某閑居無人又不知其所止無處附書信恐知其家屬所居因信切言及千萬千萬徐謝髙科今必已決俟見春牓附書也因見伸意某以妻母病家人兒子輩入京相看因得附此不悉巳暄多愛不次某再拜與臨池院主皇祐五年某啓小姪人還曽附問邇來暑毒安和某今謀奉太君神柩南歸將遂相見因小姪先行奉此不次某書白七月十六日小師等各安建茶二角表信與吴給事名中復皇祐末某啓罪逆餘生逺屏郊外特承顧訪感咽何勝仍沐寵惠雄編俾遂榮覽雖在哀迷亦知開警如嘉州淯井之作有以見仁言之利博而非文字之空言也欽孰一作仰材譽固巳有日粗窺髙藴益用歎服限以衣制不能謁謝聊叙此不次某再拜仲庻太博執事二月二十八日又嘉祐三年某啓思奉清論不可得徒用企想夏熱承體氣佳𥙿某此者忽有尹命殊出意外不惟才非所長加以他慮不淺昨巳懇辭庻可得免如其不獲恐難堅避辱命誌文鄙拙豈足當之弟以欣慕忠義樂於紀次因得附名于石末遂不敢辭爾惶悚一作恐下同惶悚鄙懷區區不能具道某頓首諌院舎人執事又同前某啓新令雖許徃還尚以職事牽冗未皇祗謁計寒凛體氣清康前承要墓碣乆稽應命近因病目在告始得牽強衰朽無意思僅能成文不足以發揚令徳慙恐慙恐昬眩不能多書謹此與李留後公謹至和元年某啓昨自居潁服除乆俟外𥙷旣而召見尋乞蒲同出處倉皇諒聞于外也前日入拜恩旨復留孤生多難鬢髪蕭然心形兩衰豈有榮進之望但區區未能即去爾承坐鎮餘閑甚有清趣然想非乆外留當𬒳嚴召老朽或未出都尚得一相見則爲幸矣瞻仰瞻仰又嘉祐二年某啓嚮以僑寄僧坊公私多故忽忽爲別豈勝馳情使至惠書竊承下車經寒動履清福粗慰瞻仰某一守經愚儒爾豈堪適時之用加以衰病勉強實難過禋慶得遂一麾爲幸矣公謹爲郡誠可樂然賢者逺外於今之時勢必難乆目疾得靜安息慮當益清明某昬花日甚書字如隔雲霧亦冀一閑處將養爾深寒惟望爲時自重又同前某啓自旌斾之南數於他書中承見問中間寄惠八功德水又辱手書及今者人至又辱書感慰何巳兼審經寒爲政外體履清康某自過年如陡一作頓添十數歳人但覺心意衰秏世味都無可樂百事強勉而已請外決在今春惟不知相見何時爾鄙懷千萬莫能具述惟以時爲國自愛瞻仰瞻仰又嘉祐三年某再拜近因人還甞得附狀兹者寄水人至又辱書審春寒體況清康兼惠清泉亟飲甚甘實如不疑所品物固有處於幽晦而發於賢哲者兹鄙夫欣慕樂於紀述也適值館伴契丹人使旦夕到闕頗區區湏事畢當馳上也人還謹奉此又同前某啓自春氣候不常伏惟攝理清康前承惠浮槎山水俾之作記又於遞中辱書乆不爲報蓋牽強拙記未成爾某中年多病文思衰落所記非工殊不堪應命文辭巳如此不欲更自繆書亮不爲罪然得子履一揮尤幸蓋不敢煩公謹真翰也皇恐皇恐又同前某頓首急足至辱書一有惠字承此𥘉暑尊候萬福浮槎拙記託賢弟附去多日疑其未至間此急足發來也𥘉深欲自書屢試書數本皆自嫌不過意遂已前書具道必可亮也向時竊見議科埸奏甚佳然欲必行其言尤難也論外計刻剥此非守道守官君子孰肯奮然發憤前潁人已受此賜矣若使常人用心皆如君子生民豈有弊病天下豈有不治㢤鄆州還闕方一相見京師乆雨近方晴乾不審江淮如何向熱以時自重人還謹此不宣某再拜又同前某啓自附浮槎拙記去後捧遞中所惠書尋以修報兹者人至又辱賜教某昨承恩俾侍經席輒以近歳貟多濫選官以人輕遂至學士例爲兼職用此爲說得以懇辭聖恩矜察特許寢停甚幸也承示啓更不修答也感愧感愧某苦風眩甚劇若遂不止當成大疾作書未竟巳數眩轉屢停筆瞑目鄙懷區區不可盡惟爲國慎夏自重又同前某啓承誨示至於勤勤所寄浮槎水味尤佳然豈减惠山之品乆居京師絶難得佳山水頓食此如飲甘醴所患逺難多致不得猒飫爾此山前世粗有名然皆因僧居以爲勝今所記者特水爾故不及其他也張又新水記與陸羽不同考於二家之書可見矣今更録徃時所作大明井記奉呈庶可知其詳也因人入都小缾時爲致一兩器千里致水恐渉好竒之弊然若不勞煩則亦無害更裁之與向觀察嘉祐五年某啓中間辱書承經暑德履清佳深浣遐想足下留遊河朔忽巳數年保塞邊要朝廷寄任之重行第嘉績別膺峻用某衰病無堪待罪西府深愧碌碌秋涼珍愛又至和元年冬某啓伏自使斾之西及此兩辱書承祁寒爲政外體履清福深慰企渇某居此區區近又領三班坐曹牽冗乆闕拜狀仍思舊同局言笑之樂不可復得也請外開春決可去未知𣢾奉何日新正以時自愛書簡卷第四與余襄公又别本某頓首再拜啓為别五六歳未甞一日不思企而南望然某侍老親携孱㓜浮江奔陸衝冒風波霧毒之間凢行萬三四千里其勞亦甚矣侍母幸粗無恙其如頑然學不益進道不益加而年齒益長血氣益衰遂至碌碌隨世俯仰而何足稱邪安道又不幸丁家艱窮居極南起居安否不通於朋友況欲施其他邪嗚呼天果欲窮吾人乎承不乆服除當早治裝以少解積歳區區之思廣文曾生文識可駭云甞學於君子因其行略以通動靜之問此帖與本卷者大同而小異載閩本及京師名賢簡啓中疑有改定處與第五卷劉原甫書同說與王郎中第二帖為几案所苦五字上一有此字與杜大夫第一帖開決正謂開決汴河閩本作闊決乃是常談與張職方第二帖寒􅏮一作寒疑濮議卷第四歐陽文忠公集一百二十三劄子一首是歳十月撰不曽進呈臣伏見朝廷議濮安懿王典禮兩制禮官請稱皇伯中書之議以謂事體至大理宜慎重必合典故方可施行而皇伯之稱考扵經史皆無所據方欲下三省百官博訪群議以求其當陛下屈意手詔中罷而衆論紛然至今不巳臣以謂衆論雖多其說不過有三其一曰宜稱皇伯者是無稽之臆說也其二曰簡宗廟致水災者是厚誣天人之言也其三曰不當用漢宣哀為法以干亂統紀者是不廣本末之論也臣請為陛下條列而辨之謹按儀禮喪服記曰為人後者為其父母報報者齊衰期也謂之降服以明服可降父母之名不可改也又按開元開寳禮國朝五服年月喪服令皆云為人後者為其所生父齊衰不杖期蓋以恩莫重扵所生故父母之名不可改義莫重扵所繼故寜抑而降其服此聖人所制之禮著之六經以為萬世法者是中書之議所據依也若所謂稱皇伯者考扵六經無之方今國朝見行典禮及律令皆無之自三代之後秦漢以来諸帝由藩邸入繼大統者亦皆無之可謂無稽之臆說矣夫儀禮者聖人六經之文開元禮者有唐三百年所用之禮開寳通禮者聖宋百年所用之禮五服年月及喪服令亦皆祖宗累朝所定方今天下共行之制今議者皆棄而不用直欲自用無稽之臆說此所以不可施行也其二曰簡宗廟致水災者臣伏以上天降災皆主人事故自古聖王逢災恐懼多求闕政而修之或自知過失而改悔之庻㡬以塞天譴然皆湏人事巳著扵下則天譴為形扵上今者濮王之議本因兩制禮官違經棄禮用其無稽之臆說欲定皇伯之稱中書疑其未可施行乃考古今典禮雖有明據亦未敢自信而自專方更求下外廷博議而陛下遽詔中罷欲使有司徐求典禮是則臣下慎重如此人君謙畏如此君臣不敢輕議妄舉而天遽譴怒殺人害物此臣所謂厚誣天也議猶未決仍罷不議而便謂兩統二父以致天災者厚誣人也其三引漢宣哀之事者臣謹按漢書宣帝父曰悼皇考初稱親謚曰悼置奉邑寢園而巳其後改親稱皇考而立廟京師皇考者親之異名爾皆子稱其父之名也漢儒𥘉不以為非也自元帝以後貢禹韋玄成等始建毀廟之議數十年間毁立不一至哀帝時大司徒平晏等百四十七人奏議云親謚曰悼裁置奉邑皆應經義是不非宣帝稱史皇孫為親也所謂應經義者即儀禮云為人後者為其父母報是也惟其立廟京師亂漢祖宗昭穆故晏等以謂兩統二父非禮宜毀也定陶恭王𥘉但號共皇立廟本國師丹亦無所議至其後立廟京師欲去定陶不繫以國有進干漢統之漸丹遂大非之故丹議云定陶恭皇謚號巳前定議不得復改而但論立廟京師為不可爾然則稱親置園皆漢儒所許以為應經義者惟去其國號立廟京師則不可爾今言事者不究朝廷本議何事不㝷漢臣所非者何事此臣故謂不原本末也中書之議本謂稱皇伯無䅲而禮經有不改父名之義方議名號猶未定故尊崇之禮皆未及議而言事者便引漢去定陶國號立廟京師之事厚誣朝廷以為干亂大統何其過論也夫去國號而立廟京師以亂祖宗昭穆此誠可非之事若果為此議宜乎指臣䓁為姦邪之臣而人主有過舉之失矣其如陛下之意未嘗及此而中書亦初無此議而言事者不原本末過引漢世可非之事以為說而外庭之臣又不審知朝廷本議如何但見言事者云云遂以為欲加非禮干亂統紀信為然矣是以衆口一辭紛然不止而言事者欲必遂其皇伯無稽之說牽引天災恐迫人主而中書守經執禮之議反指以為姦邪之言朝廷以言事之臣禮當優容不欲與之爭辨而外庭羣論又不可家至而戸曉是非之禮不辨上下之情不通此所以呶呶而不止也夫為人後者既以所後為父矣而聖人又存其所生父名者非曲為之意也盖自有天地以來未有無父而生之子也既有父而生則不可諱其所生矣夫無子者得以宗子為後是禮之所許也然安得無父而生之子以為後乎此聖人所以不諱無子者立人之子以為後亦不諱為人後者有父而生盖不欺天不誣人也故為人後者承其宗之重任其子之事而不得復歸扵本宗其所生父母亦不得徃與其事至扵喪服降而抑之一切可以義㫁惟其父母之名不易者理不可易也易之則欺天而誣人矣子為父母服謂之正服出為人後者為本生父母齊衰期謂之降服又為所後父斬衰三年謂之義服今若以本生父為皇伯則濮安懿王為從祖父反為小功而濮王夫人是本生嫡母也反為義服自宗懿巳下本生兄弟扵禮雖降猶為大功是禮之齊衰期今反為小功禮之正服今反為義服上扵濮王父也反服小功扵宗懿等兄弟也反服大功此自古所以不稱所生父為伯父叔父者稱之則禮制乖違人倫錯亂如此也伏惟陛下聦明睿聖理無不燭今衆人之議如彼中書之議如此必将從衆乎則衆議不見其可欲違衆乎則自古為國未有違衆而能舉事者願陛下霈然下詔明告中外以皇伯無稽決不可稱而今所欲定者正名號爾至扵立廟京師干亂統紀之事皆非朝廷本議庻㡬羣疑可釋若知如此而猶以謂必稱皇伯則雖孔孟復生不能復為之辨矣爲後或問上或問爲人後者不絶其所生之親可乎曰可矣古之人不絶也而降之何以知之曰扵經見之何謂降而不絶曰降者所以不絶也若絶則不待降也所謂降而不絶者禮爲人後者降其所生父母三年之服以爲朞而不改其父母之名者是也問者曰今之議者以謂爲人後者必使視其所生若未嘗生已者一以所後父爲尊卑踈戚若扵所後父爲兄則以爲伯父爲弟則以爲叔父如此則如之何余曰吾不知其何所稽也苟如其說沒其父母之名而一以所後父爲尊卑踈戚則宗從世數各随其逺近䡖重自有服矣聖人何必特為制一有為字降服乎此余所謂若絶則不待降者也稽之聖人則不然昔者聖人之制禮也為人後者扵其父母不以所後之父尊卑踈戚為别也直自扵其父子之間為降殺爾親不可降降者降其外物爾喪服是也其必降者示有所屈也以其承大宗之重尊祖而為之屈爾屈扵此以伸扵彼也生莫重扵父母而為之屈者以見承大宗者亦重也所以勉為人後者知所承之重以專任人之事也此以義制者也父子之道天性也臨之以大義有可以降其外物而本之扵至仁則不可絶其天性絶人道而滅天理此不仁者之或不為也故聖人之扵制服也為降三年以為朞而不沒其父母之名以著扵六經曰為人後者為其父母報以見服可降而父母之名不可沒也此所謂降而不絶者以仁存也夫事有不能兩得勢有不能兩遂為子扵此則不得為子扵彼矣此俚巷之人一作人之所共知也故其言曰為人後者為之子此一切之論非聖人之言也是漢儒之說也及一作乃衆人之所能道也質諸禮則不然方子夏之傳喪服也苟如衆人一切之論則不待多言也直為一言曰為人後者為之子則自然視其父母絶若未嘗生己者矣自然一以所後父為尊卑踈戚矣奈何彼子夏者獨不然也其扵傳經也委曲而詳言之曰視所後之某親某親則若子若子者若所後父之真子以自䖏而視其族親一以所後父為尊卑踈戚也故曰為所後者之祖父母妻妻之父母昆弟昆弟之子若子猶嫌其未備也又曰為所後者之兄弟之子若子其言詳矣獨扵其所生父母不然而别自為服曰為其父母報蓋扵其所生父母不使若為所後者之真子者以謂遂若所後者之真子以自䖏則視其所生如未嘗生已者矣其絶之不已甚乎此人情之所不忍者聖人亦所不為也今議者以其所生扵所後為兄者遂以為伯父則是若所後者之真子以自䖏矣為伯父則自有服不得為齊衰期矣亦不得云為其父母報矣凡見扵經而子夏之所區區分别者皆不取而又忍為人情之所不忍者吾不知其何所稽也此大義也不用禮經而用無稽之說可乎不可也問者曰古之人皆不絶其所生而今人何以不然曰是何言歟今之人亦皆然也而又有加扵古焉今開寳禮及五服圖乃國家之典禮也皆曰為人後者為其所生父母齊衰朞服雖降矣必為正服者示父母之道在也為所後父斬衰三年服雖重矣必為義服者示以義制也而律令之文亦同五服者皆不改其父母之名質扵禮經皆合無少異而五服之圖又加以心喪三年以謂三年者父母之喪也雖以為人後之故降其服扵身猶使行其父母之喪扵其心示扵所生之恩不得絶扵心也則今人之為禮比扵古人又有加焉何謂今人之不然也為後或問下問者曰子不能絶其所生見扵經見扵通禮見扵五服之圖見扵律見扵令其文則明矣其所以不絶之意如之何曰聖人以人情而制禮者也問者曰事有不能兩得勢有不能兩遂為子扵此則不得為子扵彼此豈非人情乎曰是衆人之論也是不知仁義者也聖人之扵人情也一本扵仁義故能兩得而兩遂此所以異乎衆人而為聖人也所以貴乎聖人而為衆人法也父子之道正也所謂天性之至者仁之道也為人後者權也權而適冝者義之制也恩莫重扵所生義莫重扵所後仁與義二者常相為用而未嘗相害也故人情莫厚扵其親抑而降其外物者迫扵大義也降而不絶扵其心者存乎至仁也抑而降則仁不害乎義降而不絶則義不害乎仁此聖人能以仁義而相為用也彼衆人者不然也其為言曰不兩得者是仁則不義義則不仁矣夫所謂仁義者果若是乎故曰不知仁義者衆人也嗚呼聖人之以人情而制禮也順適其性而為之莭文爾有所強焉不為也有所拂焉不為也況欲反而易之其可得乎今謂爲人後者必絶其所生之愛豈止強其所難而拂其欲也是直欲反其天性而易之曰爾所厚者為我絶之易爾之厚扵彼者一以厚扵此是其可以強乎夫父母猶天地其大恩至愛無以加者以其生我也今苟以為人後之故一旦反視若末嘗生我者其絶之固已甚矣使其真絶之歟是非人情也迫扵義而一育偽字絶之歟則是仁義者教人為偽也是故聖人知其無一可也以謂進承人之重而不害扵仁退得伸其恩而不害扵義又全其天性而使不䧟扵為偽惟降而不絶則無一不可矣可謂曲䀆矣夫惟仁義能曲䀆人情而善養人之天性以濟扵人事無所不可也故知義可以為人後而不知仁不絶其親者衆人之偏見也知仁義相為用以曲䀆人情而善養人之天性使不入扵偽惟達扵禮者可以得聖人之深意也問者曰為人後而有天下者不絶其所生則将干乎大統奈何曰降則不能干矣自漢以來為人後而有天下者尊其所生多矣何嘗干扵大統使漢宣哀不立廟一有扵字京師以亂昭穆則其扵大統亦何所干乎漢魏五君篇治平二年秋八月京師大雨水壞官私廬舍而民𬒳壓溺者千餘人或謂是時方議濮王典禮議者以謂天災之應信乎曰議猶未決而天已降災殺人害物此厚誣天人之言也余巳論之詳矣問者曰前世已驗之事如之何曰自漢以来由諸侯入繼大統之君多矣不可遍舉今略舉入繼大統之君追尊所生父母者二人不追尊父母者三人而試推以禍福之驗可以知之矣其追尊所生者二人曰漢宣帝也光武也宣帝𥘉稱其父曰親置園邑而奉之漢儒以為應經義者也光武稱其父為皇考立廟南陽而祭之後世無非者是皆進不干大統退不絶本親最為得禮而宣帝為前漢中興之主光武為後漢世祖其徳業隆盛天下富安享國長久此二人者追尊所生者也天不降以禍而降之以福生為明帝殁享榮名為萬世所尊者也其不追崇所生者三人曰魏廢帝也髙貴郷公也常道郷公也魏自明帝無子養齊王芳以為子乃下詔後世有入繼之主敢追尊父母者大臣共誅之故終魏之世謹遵其約然自明帝下詔後連三世皆以宗子入繼皆不敢追尊其父母其一曰齊王芳立十六年而𬒳廢謂之廢帝其次曰髙貴郷公立七年為司馬文王所弒其次曰常道郷公立七年為晉所篡魏遂以滅亡此三人者能不追尊其所生者也天不降以福而降之以禍一𬒳廢一𬒳弑一𬒳簒喪身亡國為萬世所悲者也彼漢魏五君者其享國盛衰長短雖自有歴數繫扵天命不繫扵一作其追尊所生與不追尊也然就以禍福推之追尊者未必不享福不追尊者未必不得禍也晉問或謂為人後者改其所生父母之名考扵六經與古今典禮固無之矣而前世有天下之君多矣果無之乎曰有而不足法也盖自漢以来由藩侯入繼大統其為人後合禮而得正之君皆無之也惟五代晉出帝嘗以其所生父為皇伯矣此何足道也彼出帝者立不以正非為後繼統之君也盖其不當立而立必絶其所生則得立不絶則不得立故不得巳而絶之也出帝父曰敬儒髙祖之兄也敬儒早卒髙祖憐出帝孤而養以為巳子而髙祖自有子五人髙祖疾病以其子重睿託扵大臣及髙祖崩晉大臣背約欲得長君故捨重睿而立出帝其義不當立惟欺天下以為髙祖真子故得立則其勢豈敢復顧其所生父也㢤其以為皇伯者不得已也盖立不以正之君又不得已而至此其可為後世法㢤嗚呼五代之際禮樂崩壤三綱五常之道絶先王之制度文章扵是掃地矣盖篡逆賊亂之始一作世也而晉氏尤甚自髙祖與契丹為父子出帝以耶律德光則為祖以其所生父則臣而名之是其可以人理責乎是其可以為世法乎出帝既立不旋踵而契丹滅晉遷其族于北荒幽之黃龍府舉族餓死永為夷狄之鬼其滅亡禍敗自古未有若斯之酷也議者謂漢哀桓亂世不足為法可矣若晉出帝者果可為法乎濮議卷第四禮家聚訟自古固然濮議是非諸儒互有去取今不必論惟公此書力辨英廟本無固必寧以一身而當衆怒深得善則稱君過則稱已之義且公晚年所著故筆力尤髙或者乃謂可以無傳不已過乎近歳吴仁傑作濮議墨守二十篇志在助公然公何待助也紹熈五年十月郡人孫謙益王伯芻校正表奏書啓四六集卷苐四歐陽文忠公集九十三乞根究蔣之竒彈䟽劄子治平四年二月臣近因誤於布衣下服紫襖爲御史所彈臣即時於私苐待罪蒙聖恩差中使傳宣召入中書供職今竊聞蔣之竒再有文字誣臣以家私事臣忝荷國恩備貟政府横𬒳汗辱情實難堪雖聖明洞照察臣非辜而中外傳聞不可家至而戸暁欲望聖慈解臣重任以之竒所奏出付外庭公行推究以辨虚實顯示多方取進止再乞根究蔣之竒彈䟽劄子臣昨日曽有奏陳爲臺官蔣之竒誣奏臣以家私事乞以之竒所奏出付外庭公行推究以辨虚實未蒙降出施行臣夙夕思惟之竒誣罔臣者乃是禽獸不爲之醜行天地不容之大惡臣若有之萬死不足以塞責臣若無之豈得含胡隱忍不乞一作與辨明伏況陛下聖政惟新萬方幽逺咸仰朝廷至公不疑爲辨曲直而臣身爲近臣忝列政府今之竒所誣臣之事茍有之是犯天下之大惡無之是負天下之至冤犯大惡而不誅負至冤而不雪則上累聖政其体不細由是言之則朝廷亦不可含胡不爲臣辨明也大抵小人欲中傷人者必以曖昧之事貴於難明易爲誣汙然而若以無根之謗絶無形迹便可加人則人誰不可誣人人誰能自保欲望聖慈特選公正之臣爲臣辨理先賜詰問之竒所言是臣閨門内事之竒所得必有從來因何彰敗必有蹤跡據其所指便可推尋盡理根窮必見虚實若實則臣甘從斧鉞若虚則朝廷典法必有所歸如允臣所請乞以臣劄子并蔣之竒所奏降出施行乞罷政事苐一表臣某言臣聞事君之節雖盡瘁以爲期量力而行有不能而則止敢黷蓋髙之聽瀝陳至悃之誠臣某中謝伏念臣本出覊單粗知業履逢右文崇學之代竊並群英之遊當好問納諌之朝獲從諸老之後遂蒙獎用叨貳機衡幸四海之無虞得容尸素荷三聖之殊遇特察孤忠坐貪寵禄之榮不覺歳時之乆而餘齡嚮晚百疾交侵四體癯羸甚巳衰之蒲柳雙瞳眊瞀㡬不辨於騧驪頃自去秋累陳愚𣢾先皇帝惻然垂閔慰以恩言許至新年俾解重任萬乗之仙遊忽逺孤臣之素願莫從方今聖統嗣興皇明繼照人神胥恱中外晏安顧無避事之嫌敢遂乞身之請伏望皇帝陛下特回睿眷俯察懦衷念孤根之易危哀小器之難用置之閑處賜以保全如此則天地之仁曲從於物性犬馬之報尚識於主恩又乞罷任根究蔣之竒言事劄子臣爲臺官蔣之竒誣奏隂私事已具劄子乞差官根究明辨虚實伏縁臣見任政府在於事體理合避嫌欲望聖慈先罷臣參知政事除一外任差遣臣旣解去事權庻使所差之官無所畏避得以盡公根究臣竊慮朝廷未明虚實不欲直以此事罷臣職任臣巳别具表章伏乞早賜施行神宗御札治平四年二月二十四日差中使朱可道賜春寒安否前事朕巳累次親批出詰問因依從來要卿知付歐陽脩謝賜手詔劄子臣伏蒙聖慈差内臣朱可道傳宣撫問仍賜臣手詔委曲慰安臣孤危之迹横爲言事者誣以莫大之罪自非遭遇聖明特爲窮究則當爲冤死之鬼然事出曖昧上煩天造累行詰問必見蹤由臣仰恃聖君在上内省亍心必冀終獲辨雪臣無任捧詔涕泗感天荷聖激切屏營之至謹奏乞詰問蔣之竒言事劄子臣近爲蔣之竒誣奏臣以隂私事前日再具劄子乞詰問之竒自何所得因何蹤跡彰敗乞差官據其所指推究虚實伏縁之竒所誣臣者乃是非人所爲之大惡人神共怒心殺無赦之罪傳聞中外駭聽四方四方之人以謂朝廷執政之臣犯十惡死罪乃曠世所無之事皆延首傾耳聽朝廷如何處置惟至公以服天下之心若實有之則必明著事迹暴揚其惡顯戮都市以快天下之怒若其虚妄使的然明白亦必明著其事彰示四方以釋天下之疑至如臣者若實有之則當萬死若實無之合窮究本末辨理明白亦不容苟生若托以曖昧出於風聞臣雖前有鼎鑊後有鈌鉞必不能中止也以此言之繫天下之瞻望繫朝廷之得失繫臣命之死生其可忽乎其得巳乎伏乞以臣所奏詰問蔣之竒得於何人其人所說有何事更不得徒說虚辭直具所說人姓名及所聞事狀據實聞奏臣所瀝血懇必望朝廷理辨虚實乞不留中再乞詰問蔣之竒言事劄子臣近累陳血懇煩黷天聽爲彭思永蔣之竒誣奏臣隂私事乞辨明虚實伏蒙聖恩累賜詰問至今未聞有所指陳竊以臺憲之司雖許風聞言事然所謂風聞者謂事不親見而有聞於他人耳然其說必有其人其人必有姓名若所聞小事則有不足論若所聞大事繫人命之死生則必須審問所說之人事狀虚實然後可以上言況之竒明列章䟽伏地頓首堅請必行若不明見事狀審知虚實豈敢果決如此及朝廷窮究又却不指定所聞之人姓名亦不明言有何事迹但飾遊辭無所的確蓋之竒𥘉以大惡誣臣期朝廷更不推究便有行遣及累加詰問遂至辭窮也不然思永之竒懼見指說出所說人姓名後朝廷推鞫必見其虚妄所以諱而不言也臣忝列政府動繫國體不幸枉遭誣䧟惟頼朝廷至公推究别證虚實使罪有所歸則臣雖死之日猶生之年也臣竊慮朝廷須所說人姓名思永之竒無事指說必以朝廷拒諫爲言此乃辭窮理屈而妄說也臣謂若朝廷聞言事不行則是拒絶言者今以所言事體不可直行須當根究虚實乃是用臺官之言即須行遣爾豈足爲拒諫也封進批出蔣之竒文字劄子臣以拙直受恩兩朝惟以至公之心爲報國之効凡於親舊不敢有纎介阿私是致怨怒臣深者造爲飛語誣臣以家私隂事是人倫之大惡所以語駭人聽易於傳布竊以言事之臣謂之天子耳目之官本期禆益聦明若聞外有怨家仇人造作飛語中傷執政之臣正當奮然嫉惡爲臣根窮起謗之人辨别虚實明其誣罔使後㐫人不敢䧟害良善以彰朝廷之明此乃言事之職今思永心知事無實狀而不能爲臣辨明反碌碌隨衆騰口揺舌蔣之竒專用怨仇人飛語便以虚爲實上惑聖聦及至朝廷再三詰問須要事實則各不能明指一人之言明陳一事之壉思永旣云無實狀則知虚妄可知之竒則飾游辭謂風聞於衆且臺官雖許風聞而朝廷行事豈可不辨虚實大凡可駭之語易於傳布假如怨仇之人有誣大臣以叛逆不道者飛語一出則必騰口相傳豈可便以傳聞之衆致大臣族誅如此則爲大臣者終日恐懼彌縫不暇何敢盡公行事以身當怨而一夫之怒飛語騰出可以揺動朝廷則正人端士不立足矣以此言之則思永之竒專用風聞惑亂聖聦爲耳目之官罔上欺君其害豈細今閭巷小民有罪猶須證驗分明案節圓備方可行刑之竒言臣死罪未明虚實豈可含胡伏乞朝廷以至公之眀必爲分别令事理窮盡止於兩端不過虚與實而巳實則臣當死虚則之竒安得無罪使事實而臣不死不足以顯之竒之言使事虚不罪之竒不足以雪臣之冤枉臣非敢固惜名位不自引去但以冤若不得雪則身是罪人朝廷自當行法豈容臣自引退若虚則幸望朝廷辯別分明使中外之人知臣無罪然後可以容臣自陳引去臣𥘉乞朝廷差官根究虚實故當乞解權任以避嫌今旣蒙朝廷直行詰問故臣合杜門俟命乞不留中降出施行乞辨明蔣之竒言事劄子臣先於慶暦中擢任諌官臣感激仁宗恩遇不敢顧身力排姦邪不避仇怨舉朝之人側目切齒惡臣如讎適㑹臣有一妹夫張龜正前妻女嫁臣一踈族不同居姪晟於守官處一作所與人犯姦是時錢明逸爲諌官遂言臣侵欺本人財物與之有私旣蒙朝廷置獄窮勘並無實狀事得辯明而當時執政之臣惡臣者衆其隂私事雖巳辯明猶用財物不明降臣知滁州今惟趙槩知此事甚詳若非仁宗至聖至明察臣無辜爲臣窮究則臣豈復更有今日仁宗豈有用臣至此今臺官方舉前事彈錢明逸䧟害良善不意蔣之竒自又効尤欲望朝廷特加裁察若以蔣之竒所對語無事實知其虚妄乞早賜明告中外以辨臣冤若猶疑於虚實之間則乞更加盡理推窮辯正再乞辯明蔣之竒言事劄子臣近以蔣之竒誣奏臣家私事乞賜辯正杜門俟命今巳多日雖䝉朝廷累賜詰問之竒則但云得自彭思永而思永又云事無實狀是曖一作藹昧之言若此便欲加臣十惡大罪雖州郡小民犯罪官司斷獄必未敢便斷其死臣孤拙無黨特𬒳兩朝眷遇忝列政府横𬒳小人誣以禽獸不爲之惡本因臣以至公報國以身當怨不徇親黨阿私至多積仇怨造作飛語中傷而以忠取禍之竒乃以虚爲實欺天罔上及至朝廷詰問則辭窮理屈並無實狀指陳至於彭思永亦自言曖一作藹昧無實各自乞罷去若臣果有實狀何故惜而不言何故自言無實狀而自乞罷去以此見思永之竒專欲以曖一作藹昧之事惑亂聖聦使臣不能自辯冀望朝廷更不辯明便以風聞行法況聖君在上公道方行臣必不能枉受大惡之名當舉族碎首呌天號冤仰訴于闕庭必不能含胡而自止當陛下聖政惟新之日使執政之臣守闕號冤固知非朝廷羙事然臣以惡名不可虚受將不得巳而爲之期於以死必辯而後止臣無任懇血哀號激切之至取進止神宗御札三月四日差中使朱可道賜春暖乆不相見安否數日來以言者汚卿以大惡朕曉夕在懷未常舒釋故累次批出再三詰問其從來事狀訖無以報前日見卿文字力要辨明遂自引過今日巳令降黜仍出牓朝堂使中外知其虚妄事理旣明人疑亦釋卿冝起視事如𥘉無恤前言賜歐陽脩謝賜手詔劄子同日臣今日㐲蒙聖慈差中使朱可道傳宣撫問賜臣手詔爲言者汚臣以大惡巳令降黜仍出牓朝堂令中外知其虚妄勑臣冝起視事如𥘉無恤前言者臣捧讀感咽不知涕泗之横流竊伏自念天地父母能生臣身不能免臣於憂患陛下神聖聦明無幽不燭察臣孤危辨臣冤枉使臣不䧟大惡得爲完人至徳大恩過於天地父母萬倍則臣餘生之命是陛下所延之命今日之身是陛下再造之身雖盡此命捐此身亦不能上報至徳大恩之萬一而臣又有大罪者蒙國寵榮忝居重位處危機之地而自任拙直不防禍患怨仇所積謗怒交興當陛下即位之初外有機政之繁内有孝思感慕之戚於此之時致言事者以隂私之惡醜穢之言上黷聖聽煩陛下暁夕在懷爲臣親加詰問特賜辨明臣之此罪何以自贖捫心内省何以自安臣無任感天荷聖慙懼涕泗激切屏營之至臣巳依詔㫖來日詣閤門祗候入見冀面天顔別陳血懇次乞罷政事第二表臣某言臣近貢封章乞解職任伏奉批答未賜允俞者臣聞髙而必危蓋處易傾之勢滿則招損實存至戒之言敢再瀝於懇私輙自干於斧鉞臣某中謝伏念臣本以庸妄出於遭逢誤𬒳國恩俾參政論材非適用而當重任之難智不周身而履危機之地旣不能於阿徇故多積於怨仇謗怒之興紛紜靡一所恃者聖君在上公道方行雖構造中傷人言可畏而聦明聽察天鑒孔昭旣悉辨於罔誣遂判分於柱直俾臣不䧟大惡得爲完人今亂國之讒巳蒙於逺屏立朝之士皆保於自安則臣仰銜再造之鴻慈正合損軀而自效然念臣病羸之質年迫巳衰寵禄之盈理難乆䖏頃事先帝之日屢貢乞骸之言間奉徳音亦蒙恩許一麾之請素志甚勤伏望皇帝陛下推天地之仁回日月之照閔其孤拙曲賜矜從予之一州俾自退處亦有民社可宣教條苟知盡瘁之方未失事君之節第三表臣某言臣近再上表乞解政事除一外郡差遣奉今月八日批答所乞冝不允者臣聞士之行巳所慎者始終之不渝臣之事君所難者進退而合理苟無大過善退其身昔之爲臣全此者少臣頃侍先帝屢陳斯言今之懇誠蓋迫於此臣某中謝伏念臣識不足以通今古材不足以語經綸幸逢盛際之休明早自諸生而拔擢方其與儒學文章之選居言語侍從之流毎蒙過獎於群公常媿虚名之浮實暨晚叨於重任益可謂於得時何甞敢傷一士之賢豈不樂得天下之譽而動皆臣忌毀必臣歸人之愛憎不應遽異臣之本末亦豈頓殊蓋以處非所冝用過其量惟是要權之地不勝指目之多周防所以履危而簡踈自任委曲所以從衆而拙直難移冝其舉足則蹈禍之機以身爲歛怨之府復盤桓而不去遂謗議以交興讒說震驚輿情共憤皇明洞照聖斷不疑孤臣獲雪於至冤四海共忻於新政至於頼天地保全之力脫風波險䧟之危使臣散髪林丘幅巾衡巷以此没地猶爲幸民況乎擁蓋垂䄡其榮可喜撫民求瘼所寄非輕苟可效於勤勞亦寧分於内外伏望皇帝陛下曲回天造俯察愚衷許解劇繁處之閑僻物還其分庻獲遂於安全心匪無知豈敢忘於報效又乞外郡第一劄子臣前日獲對便坐巳具血懇披陳爲臺官一作臣寮誣臣以隂醜之事臣聞詩曰中冓之言不可道也所可道也言之醜也蓋隂醜之事君子之所深惡猶不可自道於口而況上逹君父之聽汚黷朝廷驚駭中外事雖起於誣罔然本臣而發此臣所以夙夜慙懼而無地自容也伏況當陛下即政之𥘉日有軍國萬機之繁乃以人口不道之事上煩聖慮蒙陛下暁夕在懷親批詰問再三窮究得其虚妄之狀特賜行遣暁告中外使臣大冤獲雪人疑盡釋夫辯枉直雪幽冤以釋天下之疑以快輿情之憤此固陛下神聖聦明自是新政之一事然亦因臣致勞聖慮此亦臣所以夙夜慙懼而無地自容也秪此二事臣自循省巳不能安然而上頼陛下至寛至仁必以此事是臣寮中傷臣非臣自作以紊煩朝廷以此必賜矜恕然臣有不得巳而必不能處者蓋臣所以致此大謗者本出怨仇之口由臣拙直多忤於物而在位巳乆積怨巳多若使臣頓然變節勉學牢籠小人以弭怨謗非惟臣所不能亦非陛下所以任臣之意若使臣復居于位秖如前日所爲則臣恐怨家仇人以臣不去必須更爲朝廷生事臣亦終不能安況臣一二年來累爲言者攻擊心志摧沮加以衰病所侵兩目昬暗四支骨立顧身巳如此而人情又如此亦復何心貪冒榮寵伏望聖慈憫臣之志誠可哀矣察臣之迹實難安矣特許臣解罷除一外郡則天地保全之恩何以論報臣今巳上第三表伏乞早賜降出施行第二劄子臣近者䖍露懇誠乞解政事巳三上表殆今累日夙夕俟命跼蹐靡遑臣竊伏自思理冝罷退者其事非一臣聞所謂大臣者必能宣布上徳叶和中外使人心恱豫朝政肅清此乃輔弼之任也臣性既簡拙耻爲阿徇又復愚暗不識禍機多積怨仇動遭指目謗怒毀辱不可勝言一二年來屢爲言事者攻擊以臣一人無日不煩君父不惟朝廷未甞少静而臣亦未甞少安則臣之小一作不材不堪大用從可知矣臣又思朝廷毎用柄臣必取人望者以其爲衆人所服故使處衆人之上也今如臣者舉必爲衆人所怒動必爲衆人所怨讒謗忌嫉叢集于一身以此而居要任者八年矣其未䧟於禍咎者臣竊自恠以爲晚也所頼者聖君在上朝廷至公察臣孤危辨正誣罔使臣不罹枉横得爲完人臣於此時不自引去是不知進退矣臣竊見前世元勲舊徳社稷之臣一有間隙尚或罹於禍咎而臣能薄材劣竊位巳乆語其勤則勞一作功効未著於毫髪詢于衆則怨毀巳積於丘山所謂衆怒難犯孤根易危豈敢與人自結仇敵昨縁思永等誣臣以大惡之名於義不可虚受若不辨於今時則無以自明於後世故臣屢乞辨理者蓋事不獲巳而爲之非敢與言事者爭勝負也而自思永等得罪以來言事者固巳耻於不勝若臣復處事權遷延不去彼必自疑而不安是臣下有衆人之怨嫉旁爲言事者切齒他人視之猶爲臣寒心顧臣何以自處伏望聖慈哀臣言之至懇察臣勢巳難安予之一州俾自藏縮如此則臣大冤巳雪旣彰新政之清明孤迹獲安又荷聖恩之優假言事者但得臣去亦稍釋其忿必無疑而安處别不爲朝廷生事則臣之一去所利甚多惟乞出自一作於睿斷早賜允俞第三劄子臣今月二十日伏蒙聖恩以臣所上第三表乞解政事特降批答不允仍斷來章者聞命以還憂惶殞越懇誠所迫欲止不能臣以非才誤膺委用歳月巳乆不知引避而寵禄盈滿福過災生仇怨旣多謗讒一作讒謗大作衆情不與孤迹巳危陛下既巳深察一有臣字而哀憐之矣臣之憂危迫切披肝瀝血之誠亦巳屢瀆於天聦而陛下固巳諒臣至誠至懇察臣事勢當去而無疑矣然而聖恩未忍遽許臣解罷者必以不欲今臣因言者而罷爾蓋自思永等逺竄牓朝堂告示以來中外皆知臣事已辨雪陛下至聖至明言事者不能動揺朝廷矣今臣自以懇請與言事者不復相關若賜允俞是陛下出臣於萬死之中保全其終始而使之善退也如此則臣之大冤巳蒙辨雪危迹又保安全陛下天地父母之恩自非殞骨糜軀何以論報臣自上三表後巳兩具劄子披陳必巳蒙省覽臣之血誠竭於是矣今更不敢煩言上黷睿聽惟乞聖慈哀憫早賜施行謝傳宣撫問劄子治平四年三月壬申臣今日伏蒙聖慈差中使傳宣撫問以臣累表乞解政事之職已除觀文殿學士刑部尚書知亳州仍問臣㡬日朝參者臣近以迫切之誠累形章表上煩天聽合𬒳罪誅乃蒙睿恩曲賜矜許旣特加羙職乂超轉官資仍假善邦俾從私便臣孤危之迹巳荷保全衰晚之年猶貪榮寵但以未受新命無由入謝又蒙聖造曲賜記録丁寧慰諭趣其入見恩數優異舉族歡呼伏縁自二十六日後前後殿不坐臣欲乞候御殿日參假冀靣天顔别披血懇次辭刑部尚書劄子治平四年三月二十六日臣今月二十六日伏䝉聖恩賜臣告勑各一道授臣刑部尚書充觀文殿學士知亳州臣猥以庸材乆竊重任雖䇿勵駑蹇訖無𥙷報而荏苒歳月漸迫衰殘所以屢陳危懇之誠上干宸造者正以願避寵榮冀全衰朽而天私曲𬒳恩命過優旣加以羙職又超轉官資臣竊尋前例參貳之職出處非一而推恩之數罕有若臣之優者況臣近遇覃慶巳叨遷秩未逾兩月恩典頻仍無功之賞度越常格非惟臣自循省莫知所措而名器所假人言謂何欲望聖慈憫臣孤拙察臣畏避寵榮之懇特許臣只以本官兼職或止轉一官庻俾少安常分臣誓竭晚節上報鴻恩今取進止謝觀文殿學士刑部尚書表職清書殿寔爲儒者之榮望峻天䑓仍忝刑官之重内循譾薄仰玷光華臣某中謝伏念臣稟質迂愚粗知業履因時幸㑹遂竊寵靈無拾遺𥙷闕之勤常陪法從非大冊髙文之手乆厠翰林晚綴宰寮俾聞國論荷三朝之眷遇毎察懦衷幸四海之清平得容尸禄居滿盈而不戒積災釁以自貽屬聖統之嗣興赫皇明而繼照誣言詰服已大釋於羣疑危跡保全俾不虧於素守犬馬合思於報效桑榆柰迫於衰遲屢貢懇私上干聦睿遂蒙開允俾解繁機然而晚節餘生本期避寵清資顯秩益更貪榮𬒳優渥之非常但凌兢而失措此蓋伏遇皇帝陛下聖神御極亭育推仁閔孤拙之勢危無容自立謂疲駑之力竭難責逺圖曲軫至慈俯從誠請仍憐舊物特示殊恩顧非木石之頑冝識乾坤之造颯然素領雖難强於筋骸皎若丹心猶自期於塵露進永厚陵挽歌辭三首引狀治平四年閏三月右臣伏蒙聖恩差臣知亳州軍州事見發赴本任次伏見大行皇帝將來八月遷坐于永厚陵中外群臣咸進挽歌辭臣以非才乆竊重任遭遇先帝蒙𬒳聖知恩極昊天未知論報痛深䘮考徒切攀號臣今謹撰成大行皇帝靈駕發引日挽歌辭三首謹隨狀上進伏候勑㫖亳州謝上表治平四年六月臣某言伏蒙聖恩授臣觀文殿學士刑部尚書知亳州軍州事巳於今月二日赴上訖者貳政非才雖獲奉身而退分符善地猶懐竊禄之慙祗荷寵靈惟知戰懼臣某中謝伏念臣章句腐儒之學也豈足經邦斗筲小器之量也寜堪大用而叨塵二府首尾八年荷三朝之誤知罄一心而盡瘁若乃樞機冝慎而見事輙言䧟穽當前而横身不避竊尋前載未有能全一昨怨出仇家􅌟爲死禍造謗于下者𥘉若含沙之射影但期隂以中人宣言于廷者遂肆鳴梟之惡音孰不聞而掩耳頼聖神之在上廓日月之至明悉究網誣遂投讒賊再念臣性實甚愚而踈於接物事多輕信者蓋以至誠如彼匪人失於泛愛平居握手惟期道義之交延譽當朝常丐齒牙之論而未乾薦儞之墨巳彎射羿之弓知士其難世必以臣爲戒常情共惡人將不食其餘而臣與遊旣昧於擇賢在滿不思於將覆自貽禍釁㡬至顛隮上煩睿聖之保全得完名節於終始洎懇辭於重任尤深惻於皇慈雖避寵辭隆僅能去位而清資顯秩愈更叨榮莫逃僥倖之譏實負心顔之􅌤斯蓋伏遇皇帝陛下乾坤大度堯舜至仁察臣自取於怨仇本由孤直憫臣力難於勉强蓋迫衰殘旣獲免於非辜仍曲從於私欲遂同萬物俾無失所之嗟未盡餘生敢忘必報之效謝賜仁宗御集表治平四年月臣某言伏準御藥院告報伏蒙聖慈賜臣仁宗御集一部一百卷者倬彼雲章方聮於寳軸刻之玉版忽𬒳於恩頒臣某巾謝恭惟仁宗皇帝睿哲聦明寛仁恭儉毎虚心而訪道務嚮學以崇儒天縱生知臻作者之謂聖功髙徳盛由煥乎其有文伏惟皇帝陛下纂紹丕圖善繼先志惟仁祖發揮於衆製乃英考序𫐠而成編昭如三光並照萬物法彼後世同符六經方副本之頒行非近輔而莫獲敢期睿眷尚及愚臣寵異群邦光生蔀室載念臣出身寒苦自少遭逢晚蒙獎任之殊甞與賡歌之後捐軀論報餘生巳負於素心拜賜爲榮撫事但零於清血亳州乞致仕第一表熈寜元年春臣某言臣聞難進易退者禮經之格言知足不辱者道家之明戒茍貪榮而不止冝招損以自貽況災疾之所纏顧筋力之難强輙披悃愊自冒誅夷臣某中謝伏念臣生也多屯少雖有志而識不明於大體用不適於當時徒以荷三朝之誤知屬四方之無事遂容章句之學竊與機政之司逮更二府之繁蓋亦八年之乆既不能遇事發憤慨然有所建明又不能與世浮沉黙爾以爲阿徇毎多言而取怨積衆怒以難當繼逢時事之方艱思欲乞身而未獲不虞暗禍䧟臣於風波必死之淵上頼至仁脫臣於鮫鰐垂涎之口以至平生所守之名節晚暮未盡之年齡豈臣能於自全皆陛下之所賜旣懇辭於重任仍假守於善邦固巳坦無危疑幸此優逸而風霜所迫鬢髮凋殘憂患巳多精神耗盡加之肺肝渇涸眼目眊昬去秋以來所苦増劇兩脛惟骨拜履俱艱雙瞳雖存黒白纔辨顧形骸之若此尸寵禄以何安伏望皇帝陛下特軫睿慈俯從人欲許還官政俾返田廬白首明時幸遘垂衣之治酣歌聖化願追擊壤之民雖居畎畒之間永荷乾坤之造第一劄子臣輙瀝一作有血懇上干宸慈臣本以庸虚誤蒙獎擢一作推用濫塵二府獲事三朝無徳一作一事可稱無言一作一言可採旣不能報國又不善謀身怨嫉謗䜛喧騰衆口風波䧟穽一作檻阱僅脫餘生憂患旣多形神俱瘁齒髪凋落疾病侵陵故自數年以來竊有退休之志而臣猥以非才乆叨重任連值國家多事所以未敢遽言頃自去春伏蒙陛下矜憫孤危保全晚節許解政事得從外𥙷臣於此時遂乞守亳一作乞守亳社蓋以去潁最近便於私營及入辭之日亦具奏陳乞枉道至潁脩葺故居幸蒙聖恩皆賜允許臣自到亳以來殆將朞歳一作歳暮舊苦痟渇蓋巳三年腰脚細痩惟存皮骨行歩拜起乘騎鞍馬俱覺艱難而眼目昬花氣暈侵蝕視一成兩僅分黒白職事至簡猶多妨廢坐尸厚禄益所難安然臣嚮者不敢啓言而今乃輙茲有請者蓋以方今朝廷無事中外晏然臣亦幸無任責之重其進退之際旣無所嫌避又不繫重輕故敢直以臣子之私誠自乞君父之憐憫臣以守官在外不得親伏旒扆之前縷陳悃愊臣今巳具表章欲乞一致仕名目就近於潁州居止以養殘年伏望聖慈特賜開許臣無任祈天俟命第二表臣某言臣近貢封章乞還官政伏奉詔答未賜允俞退自省循奚勝殞越臣聞神功不宰而萬物得以曲成者惟各從其欲天鍳孔昭而一言可以感動者在能致其誠敢傾䖍至之心再瀆髙明之聽臣某中謝伏念臣本以一介之賤叨塵二府之聮知直道以事君毎師心而自信然而旣乏捐軀之效又無先覺之明用之已過其分而曽不自量毀者不堪其辱而莫知引去幸頼乾坤之再造得逃䧟穽之危機仍許避於要權俾退安於晚節今乃苦於衰病莫自支持顧難冒於寵榮始欲収於骸骨敢期聖念過軫天慈謂雖迫於桑榆未忍弃於草莽竊以古今之制㳂襲不同蓋由兩漢而來雖處三公之貴毎上還於印綬多自駕於車轅朝去朝廷暮歸田里一辭髙爵遂列編民豈如至治之朝深篤愛賢之意毎示隆恩之典以勸知止之人故雖有還政之名而仍享終身之禄固巳不類昔時之士無殊居位之榮然則在臣素心雖切退休之志迹臣所乞尚虞僥倖之譏伏望皇帝陛下惻以深仁矜其至懇俾解方州之任遂歸環堵之居固將優游垂盡之年涵泳太平之樂惟辛勤白首迄無一善之稱孤負明時莫報三朝之徳此爲慙恨何可勝陳第二劄子臣近以疾病衰遲再上表一作封章瀝陳血懇乞一致仕名目以養殘年聖恩憐憫不忍遽棄特降詔諭未賜允俞承命之際惟知感泣臣竊以七十之制雖著禮經而歴代以來人臣進退多不拘此有年巳過而不得去者有年未及而可以去者蓋以人有賢愚理難一槩一作致其或上智髙才元勲舊徳用捨去就繫朝廷得失輕重者故雖年巳過之理不得去而人皆不以爲非也若中常之人碌碌備位存之旣無所益去之亦無可思其用捨不爲得失去就不繫輕重其人茍能量分知止奉身而退朝廷則必嘉其趣尚而成就其志故雖年未及而特許其去而人亦不以爲非也彼中常之人者居常則無足可稱及能識分自量不待年及而知止則尚有一節可取故人君推樂賢養士之心務欲獎成其名節所以不待年及而亦一作方許其去也如臣愚陋不敢過自陳其不肖輙竊自比於中常之人所謂碌碌備位存之無所益去之無可思而用捨去就不繫朝廷得失輕重者臣某是也然臣比於中常之人猶有不及者貪冒榮寵過其涯分荷三朝之恩徳而無所報効𬒳小人之摧辱而不能逺去固非有識分知止之明而直以疾病侵陵心神昬耗力不能勉然後不得巳而自陳耳此臣自媿於心者也雖然臣以犬馬之賤蒙陛下天地養育之恩始終保全以至今日惟晚暮一節尚頼君父之仁獎成其志臣今巳具第二表陳乞伏望聖慈特賜開許一作允今取進止第三表臣某言臣近者再貢封章乞從致仕伏奉詔書冝不允者竊稽典禮退止一辭上黷睿慈臣今三請雖未忍弃捐之意曲煩再諭以丁寧而不勝迫切之誠尚冀終蒙於開可臣某中謝伏念臣禀生至陋力學不强徒以略誦仁義之言粗知㢘耻之節早縁一藝擢自諸生智非先見之明材無適用之敏但知報國不敢謀身惟枉尋直尺之不爲故圓鑿方枘而難合以至𬒳侵凌於群小遭詆毀之百端而臣忍辱强顔踰時歴歲蓋思責任之方重顧於去就而難輕今者幸蒙寛恩獲保孤拙脫於死地優以便藩旣無效於勤勞徒坐尸於寵禄加以艱危備歴憂患巳多老將疾以偕來形與神而俱瘁昔而少徤黔驢之伎已殫今也病衰駑馬之疲難强始露肺肝之懇乞収骸骨而歸迹臣前後之心可見遲徊之乆不敢爲於妄舉蓋幸冀於必從伏望皇帝陛下推天地之仁垂日月之照察臣旣非狷憤以肆一朝之忿又非矯激而希髙世之名本由多難之餘誠以不能而止矜其朽憊賜以哀憐許上印章退居田里使病樗擁腫盡爾天年斥鷃逍遥遂其物性幸克成於素志惟仰頼於鴻私第三劄子臣輙有血懇上干天慈意迫言煩合從誅戮臣近以衰年疾病三上表章乞一致仕名目伏蒙聖恩一作慈累降詔諭未賜允俞祗服訓辭惟知感涕臣聞陳力就列不能者止此臣子之常分也臣以庸繆遭遇三朝誤𬒳獎擢叨塵二府論其報効𥘉無取一作𥙷於毫分積爲怨仇則不勝於詆訾雖忠邪善惡上則難逃聖鑒之明毀譽是非下則一付至公之論可以撫心省已自信不疑其如蹇拙孤危亦巳甚矣而猶貪冐榮寵不知進退以至横遭誣䧟㡬至顚擠上頼陛下推天地父母之恩以保全之察其誠心許解重任􅖍以善地從其私便偷安茍禄優幸巳多而臣量盈器極福過災生衰疾所嬰積年滋甚中虚渇涸若注漏巵腰脚伶俜僅存皮骨舊患兩目氣暈侵蝕日加昬暗簽書文字轉覺艱難一郡之間事多曠廢是敢直露肺肝願還印綬而皇慈垂惻未忍遽弃三賜詔諭慰以恩言中外之人皆知聖君恩禮之數過厚於臣者至矣而臣之懇悃迫切不能自止之誠亦巳至矣伏望聖慈憫臣衰殘衰臣懇迫特賜允臣累表所乞俾以本官致仕一作政歸老田閭一作廬則臣雖死之年猶生之日今取進止第四表臣某言臣累貢封章乞從致政伏奉詔書所乞冝不允者未忍遽捐幸曲憐於舊物尚兹再黷蓋中迫於危誠進冒誅夷俯深殞越臣某中謝伏念臣以一介無能之賤荷三朝特逹之知仁宗擢自諸生俾參二府先帝力排羣議深察孤忠暨逢神聖之纂臨竊幸風雲之感㑹至於辨正誣枉保全始終雖天地之施無私恩非責報而犬馬之微自效力不逮心繼之衰疾之纒綿加以年齡之晚暮寵榮旣過小器盈而必顛筋力已疲飛鳥倦而思止輙露乞身之請願諧解組之歸而皇慈惻然明詔屢下示廓含容之大度慰安憔悴之餘生祗服訓辭惟知感涕然而忠信所以事上理無弗踐之空言進退各有其冝力或不能而當止雖禮著引年之制必待及時而身有負薪之憂亦容辭仕是敢再殫悃愊仰冀哀矜伏望皇帝陛下軫尭舜之深仁推乾坤之曲造憫其確至賜以允俞俾還潁尾之居遂養漳濵之病再念臣早從壯歳粗學文辭乆冒榮階常豐禄賜尚能遇樵夫而談道宣上徳以諭愚民與故老而揮金均君恩而榮里卷此聮一作談王道揮賜金似衍二字以終晚節永荷鴻私第四劄子臣近者累具章表劄子披𫐠懇誠上干宸造乞一致仕名目歸考田廬伏蒙五降詔書未賜俞允訓諭丁寜恩意深至捧讀之際惟知感泣而臣情迫於中不能自止者蓋以疾病侵攻心志衰盡欲於未填溝壑之間自爲苟且朝暮之計是敢更瀝肝膈一作膽冀蒙哀憐臣自治平二年巳來遽得痟渇四肢痩削脚膝尤甚行歩拜起乗騎鞍馬近益艱難而兩目昬暗多年舊疾氣暈侵蝕積日轉深視瞻恍惚一作恍恍數歩之外不辨人物至於公家文字看讀簽書動成妨廢臣本庸常之人非有深識逺慮毎見比來臣寮多因疾病致仕其人旣遂閑退徃徃稍復康安一作寜臣伏自念無才無能叨竊榮寵滿盈之罰福過災生亦欲量分知止辭去官禄庻於晚暮之年少免災疾之苦又臣所患眼目一作疾自今年春夏以來日更増加其勢未止惟恐年歳之間遂成廢疾若幸於未廢之前獲遂退休之請與其病廢尚竊羙名臣之愚慮所希實止於此臣遭遇明聖過蒙知獎其孤危蹇拙之迹荷保全終始之恩可謂至矣而未知報効遽迫病衰天心仁憫必垂矜惻臣不敢避煩言屢黷之罪今巳再具表陳乞伏望聖慈特賜開許今取進止第五表臣某言臣近者累具陳乞願還官政伏蒙聖慈五降詔書未賜俞允上恩曲諭巳至矣而丁寜下愚弗移但頑然而迷執論罪合當於誅戮原情尚冀於矜從臣某中謝伏念臣以空言少實之文守泥古不通之學遭逢亨㑹玷竊寵靈禄利巳豐乃辭陳力恩私未報輙欲便身推是以言固難逃責若乃艱危險䧟僅存將盡之餘齡沮辱摧傷無復平生之壯氣加以形骸衰颯疾病侵凌顧難戀於軒裳遂退甘於畎畒語其此志又若可哀自伸五請之勤巳渉三時之頃天慈惻隱聖度優容謂駑馬雖疲念服轅之巳乆而蓍簮至賤閔舊物而不忘固當上體至仁勉安厥位而夏秋交際痾疹日増弱脛零丁惟存骨立昬瞳眊瞀常若冥行旣未知痊損之期終當廢去而苟遂退休之懇尚竊羙名是敢更殫悃愊之私冀動髙明之聽伏望皇帝陛下推乾坤亭育之施回日月照臨之光少寛屢黷之刑俯徇至誠之請庻使戒滿盈而知止免災疾以全生老安治世之和永荷終身之賜第五乞守舊任劄子熈寜元年月臣今月六日準樞宻院遞到詔書一道以臣上第五表乞致仕伏蒙聖恩未賜俞允者伏念臣以庸虚淺末之學遭遇三朝荷非常不次之恩寵未知報効之方而遽迫衰病自懼盈滿思慕古人知止之節願於聖世獲遂退休陛下仁聖寛慈俯哀誠悃旣恕其屢黷之罪未加誅戮而又推天地父母之恩不忍遽令退去六降詔書丁寜訓諭感極惟泣不知所容再念臣昨蒙恩許守此便郡以養衰殘今到任巳及一年蓋爲脚膝乗騎鞍馬艱難憂慮非時别有移替欲望聖慈許臣且更於此將理一二年間若稍獲安痊則不敢上煩聖聽臣以孤危蹇難之迹荷陛下始終保全之恩以至今日猶以衰殘疾病之懇煩君父含容養育之私臣無任表奏書啓四六集卷第四紹熈三年十月承直郎丁朝佐編次郡人孫謙益校正乞詰問蔣之竒言事劄子天下之心之一作爲封進批出蔣之竒上字劄子使事虚此下一有而字乞罷政事第三表動皆臣忌臣一作過亳州謝上表于廷一作于朝知士其難其一作爲懇辤一作懇還必報之効一作爲効之報亳州乞致仕第三劄子累表一作累奏第四劄子明聖一作聖朝附録卷第四傳神宗舊史本傳歐陽脩字永叔吉州永豐人四歳孤母鄭教讀書爲文中進士第𥙷西京留守推官召試學士院遷鎭南軍節度掌書記館閣校勘時范仲淹以言事忤宰相貶知饒州論救者甚衆而諌官髙若訥獨不言脩以書責之以爲不知耻若訥怒連其書以聞坐貶峽州夷陵令徙光化軍乾徳令改武成軍節度判官遷太子中允館閣校勘預修崇文總目書成改集賢校理知太常禮院出通判滑州慶曆初吕夷簡老病在相位天下事積成抏弊元昊盜邊陜右師老兵頓天子憂之一日夷簡罷相夏竦爲樞宻使既除復罷而更用杜衍又范仲淹冨弼韓琦同時擢執政收攬一時名士增諌官貟脩首在選中擢太常丞知諫院脩力時事屢請責執政以時所可爲者於是仁宗開天章閣給二府筆札令具所以施行條上其後下詔勸農桑興學校抑僥倖脩之發明居多是時執政皆脩素所厚善而脩所言事一意徑行不以形迹嫌疑顧避天下之士知其立朝有本未質行正直衆頗推許小人自此側目而黨人之論興矣初石介作慶曆聖徳詩言進賢退姦之難其指以美杜衍等進而竦見黜也竦既懷不滿因與其黨造爲黨論目仲淹衍及脩爲黨人脩乃上朋黨論其大略言小人無朋惟君子則有之如書曰受有臣億萬惟億萬心周有臣三千惟一心紂億萬人各異心可謂無朋矣而紂因以亡武王之臣三千人可謂大朋矣而周用以興蓋君子之朋雖多而不厭故也擢同修起居注閱月拜右正言知制誥於是爲黨論者惡脩擿語其情狀使内侍藍元震宻上䟽言范仲淹歐陽脩尹洙余靖前日蔡襄謂之四賢斥去未㡬復還四人得志遂引襄爲同列以爵禄爲私惠膠固朋黨轉相汲引不過三二年布滿要路則誤朝迷國誰敢有言仁宗不聽㑹𬒳㫖使河東自陜西兵興芻糧乆不繼言者屢請廢麟州脩請移兵就食於濵河諸堡使緩急不失應援平時可省餽運麟州以故不廢又建言忻代州岢嵐火山軍故時並邊皆民田潘美患虜入㓂乃使民内徙空其地自後虜人盜耕不巳請益募民賦田入租歳可得榖數百萬斛給邊仍計頃出丁爲兵不者他日盡爲虜所有矣從之㑹保州兵叛出脩爲龍圖閣直學士河北都轉運使仁宗靣諭曰勿爲乆計有事第言之脩對以諫官乃得風聞今在外使事有指越職罪也仁宗曰事苟冝聞豈可以中外爲辭甞上䟽言今杜衍韓琦范仲淹冨弼相繼罷去天下皆知其有可用之賢而不聞其有可罷之罪自古小人敗事其說不逺欲廣䧟良善則指爲朋黨欲動摇大臣則誣以專權蓋去一善人而衆善人尚在則未爲小人之利欲盡去之則善人少過難一一求瑕唯是指以爲朋則可盡逐至如自古大臣𬒳主知而蒙信任則難以他事動摇惟有專權是上之所惡方可傾之夫正士在朝羣邪所忌謀臣不用敵國之福今此四人一旦罷去而使群邪相賀於内四夷相賀於外臣所以爲陛下惜之也於是爲黨論者愈益忌之初脩妹適張龜正卒無子而有女女實前妻所生甫四歳以無所歸其母擕養於外氏及笄脩以嫁族兄之子晟㑹張氏與奴姦事下開封獄獄吏因附致其言以及脩詔以户部判官蘇安世内侍王昭明雜治之卒無狀乃坐用張氏匳中物買田立歐陽氏劵左遷知制誥知滁州乆之遷起居舎人知揚州徙潁州復龍圖閣直學士知應天府以母憂去既免喪入見脩老矣髪白仁宗惻然問在外㡬年今年㡬何恩意甚渥命判流内銓小人恐脩復用乃僞爲脩奏乞汰内侍挾威令爲姦利者宦者人人忿怨楊永徳者隂以言中脩出知同州仁宗悟留刋修唐書爲翰林學士加史館脩撰勾當三班院改侍讀學士知蔡州未行復爲翰林學士判太常寺時文士以磔裂怪僻相尚脩知貢舉深革其敝前在髙第者盡黜之務求平淡典要舉子皆造言謗之巳而文亦卒變拜右諌議大夫判尚書禮部又判祕閣祕書省加兼侍讀辭不受同修玉牒兼龍圖閣學士權知開封府以給事中罷同提舉諸司庫務改羣牧使唐書成拜禮部侍郎爲樞宻副使嘗因水災凡再上䟽請立皇子言甚激切未幾參知政事與韓琦等恊定大議立英宗巳而英宗力辭宗正之命脩進曰宗室不領職事今忽有此除天下皆知陛下将以爲嗣也不若遂正其名且宗正誥敕付閤門故得不受若立為皇子則止降一詔書大事定矣不可辭也仁宗以為然遂下詔及英宗以疾未親政事慈聖光獻太后垂簾脩與二三大臣主國論每簾前奏事或執政聚議有未可脩未嘗不抗是非力爭臺諫官至政事堂論事事雖非已出同列未及啓口而脩已直折其短以至士大夫建明利害及所祈請前此執政多媕阿不明白是非至脩必一二數之曰某事可行某事不可行用是怨誹者益多英宗嘗面稱脩曰性直不避衆怨脩亦嘗稱誦故相王曽之言曰恩欲歸已怨使誰當及上即位御史蔣之竒言脩帷箔事連其長子婦吴氏脩杜門請付有司按治先是脩妻之從弟薛宗孺坐舉官𬒳劾内冀㑹赦免而脩乃言不可以臣故徼幸乞特不原以故宗孺坐免官怨脩因構爲無根之言欲以汙辱之㑹劉瑾亦素仇家乃騰其謗以語中丞彭思永思永以語之竒之竒始以私議濮王事與脩合而脩特薦爲御史時方患衆論指目爲姦邪及得此因亟持以自解扵是詔詁語所從來之竒言得之思永以與瑾同郷故力抵以爲風聞上爲其辭窮降思永知黄州之竒監道州酒遣中使手詔慰安脩脩遂稱疾力乞解機務以觀文殿學士刑部尚書知亳州時脩年六十乃連六表乞致仕不從遷兵部尚書知青州脩嘗薦王安石扵朝及安石執政助神宗有爲脩不悅常平法下乃以擅止散青苗錢詔釋其罪除檢校太保宣徽南院使判太原府三辭不受徙知蔡州以老病乞骸骨章數上乃爲觀文殿學士太子少師致仕卒年六十六贈太子太師太常𥘉謚曰文常秩曰脩有定䇿之功請加以忠乃謚曰文忠𥘉英宗即位追贈宗室尊屬至濮安懿王中書以本朝未有故事請付有司詳議英宗謙恭重其事詔湏大祥後議之後乃詔禮官與侍制以上詳議而有司以爲王當稱伯改封大國朝廷以典禮未正再下尚書省集議而皇太后手書以議事詰責執政扵是手詔權罷議令有司博求典故以聞御史吕誨等彈奏脩首𨳩邪議琦公亮槩附㑹不正請如有司議脩論本生之親改稱皇伯歷考前世皆無典據進封大國則又禮無加爵之理已而皇太后出手書曰濮安懿王及譙國太夫人王氏襄國太夫人韓氏仙㳺縣君任氏可令皇帝稱親仍尊濮安懿王爲皇三夫人並稱后是日手詔欲遵太后手書稱親而不敢當追崇之典誨及范純仁傳堯俞趙瞻趙鼎論列不巳英宗問執政當如何脩對曰御史以爲理難並立若以臣等有罪即留御史若非罪則惟聖㫖是聴英宗乃令出御史其後脩著濮議引䘮服記曰爲人後者爲其父母報報者齊衰期也謂之降服親不可降降者降其外物爾喪服是也其必降者示有所屈也以其承大宗之重尊祖而爲之屈爾屈扵此以伸扵彼也生莫重扵父母而爲之屈者以見承大宗者亦重此以義制者也父子之道天性也臨之以大義有可以降其外物而本之扵至仁則不可絶其天性絶人道而滅天理此不仁者之或不為也故聖人制服為降三年爲朞而不没其父母之名以見服可降而名不可没也此以仁存心者也又曰令議者欲以為人後之故使一旦反視父母若未嘗生我者其絶之巳甚矣使其真絶之歟是非人情也迫扵義而偽絶之歟是仁義者敎人為偽也所議大略如此國朝接唐五代末流文章專以聲病對偶為工剽剥故事彫刻破碎甚者若俳優之辭如楊億劉筠輩其學博矣然其文亦不能自拔扵流俗反吹波揚瀾助其氣勢一時慕効謂其文為崑體時韓愈文人尚未知讀也脩始年十五六扵鄰家壁角破簏中得本學之後獨能擺弃時俗故歩與劉向班固韓愈柳宗元爭馳逐是時尹洙與脩亦皆以古文倡率學者然洙材下人莫之與至脩文一出天下士皆嚮慕為之唯恐不及一時文章大變庶幾乎西漢之盛者由脩發之然至論易則以繫辭非孔子之言論周禮則疑非周公所作是以君子之愛其文者猶嘆息扵斯焉脩性剛直處善惡黒白明遇事直前不避機穽其放逐流離者屢矣而復振起志氣猶自若也嘗集三代以来金石刻爲一千卷頗是正譌謬所著易童子問三卷詩本義十四卷居士集五十卷内外制奏議四六集又四十餘卷子發奕棐辯文史臣曰法言變而有離騷自是而降相望千百年其間雖有名世者而馬遷韓愈莫能過也宋興承平百年士生斯時多矣然接五代琱瑑之習風聲氣俗尚在也歐陽脩奮然躡二子之後無愧焉至其以繫辭爲非孔子所作此道隱扵小成言隱扵浮華者歟四朝國史本傳淳熈間進歐陽脩字永叔吉州永豐人四歳而孤母鄭氏親誨之學及冠嶷然有聲宋興且百年而文章體裁猶仍五季餘習鎪刻駢偶淟涊弗振士因陋守舊論卑氣弱蘇舜元舜欽柳𨳩穆脩輩咸有意作而張之而力不足韓愈遺藁閟扵世學者不復道脩㳺隨得扵廢書簏中讀而心慕焉晝停飡夜忘寐苦志探賾必欲并轡絶馳而追與之並舉進士試南宫第一擢甲科調西京推官留守錢惟演器其材不攖以吏事脩以故益得盡力扵學入朝爲館閣校勘范仲淹以言時事貶在廷多論救司諫高若訥獨以爲當黜脩詒書責之謂不知世間有羞恥事若訥上其書坐貶夷陵令稍徙乾德令武成節度判官仲淹使陕西辟掌書記脩笑而辭曰昔者之舉豈以爲利哉同其退不同其進可也乆之復校勘進集賢校理慶曆三年知諫院時仁宗更用大臣杜衍富弼韓琦仲淹皆在位增諫官員脩首在選中每進見勸帝延問執政咨所宜行旣多所張施小人翕翕不便脩慮善人必不勝數爲帝分别言之又上朋黨論其畧以謂小人無朋惟君子則有之小人所好者利禄所貪者財貨當同利之時暫相黨引及見利而爭先則反相賊害雖兄弟親戚不能相保故曰小人無朋君子則不然所守者道義所行者忠信所惜者名節以之脩身則同道而相益以之事國則同心而共濟終始如一故曰君子有朋紂有臣億萬惟億萬心可謂無朋矣而紂用以亡武王有臣三千惟一心可謂大朋矣而周用以興蓋君子之朋雖多而不厭故也脩天性疾惡論事無所回隱人視之如仇而愈奮厲不顧帝獨奨其敢言靣賜五品服顧侍臣曰如歐陽脩者何處得來同脩起居注遂知制誥故事必試而後命詔特除之奉使河東自西方用兵議者欲廢麟州以省餽餉脩曰麟州天險不可廢廢之則河内郡縣民皆不安居矣不若分其兵駐並河諸堡緩急得以應援而平時可省轉輸扵䇿爲便由是州得存又言忻代岢嵐多禁地廢田願令民得耕之不然将爲虜有朝廷下其議乆乃行歳得粟數百萬斛使還會保州兵亂以爲龍圖閣直學士河北都轉運使陛辭帝曰勿爲乆留計有所欲言言之對曰臣在諫職得論事今越職而言罪也帝曰但言之母以中外爲間賊平大将李昭亮通判馮愽文私納婦女脩捕博文繫獄昭亮懼立出之兵之始亂也招以不死旣而皆殺之脅從二千人分隸諸郡富弼爲宣撫使恐後生變将使同日誅之與脩遇扵内黄夜半屏人告之故脩曰禍莫大扵殺巳降況脅從乎旣非朝命脫一郡不從爲變不細弼悟而止杜衍等相繼罷去脩上䟽曰此四人者天下皆知其有可用之賢而不聞其有可罷之罪小人欲廣䧟良善必指爲朋黨欲動摇大臣必誣以顓權蓋善人少過唯指以爲黨則可一時盡逐今四人一旦罷去臣爲朝廷惜之扵是邪黨益忌脩因其孤甥張氏獄傅致以罪左遷知制誥知滁州居二年徙揚州潁州復學士召判流内銓時在外十一年矣帝見其髪白問勞甚至又有詐爲脩奏乞汰内侍爲姦利者其羣皆怨怒譛之出知同州帝納吴充言而止遷翰林學士扵是冨弼韓琦復用慶暦故臣稍集士大夫知天子有致治之意相賀扵朝脩乞蔡州去帝復納劉敞趙抃之言而止奉使契丹其主命貴臣四人押燕曰此非常制以卿名重故爾知嘉祐二年貢舉時士子尚爲險怪竒澀之文號太學體脩痛排抑之凡如是者輙黜畢事向之囂薄者伺脩出聚譟扵馬首街邏不能制然場屋之習從是遂變加龍圖閣學士知開封府承包拯威嚴之後簡易循理不求赫赫名京師亦治旬月改羣牧使在翰林八年知無不言河決商胡北京留守賈昌朝欲𨳩横壠故道回河使東有李仲昌者欲導入六塔河議者莫知所從脩以爲河水重濁理無不淤下流旣淤上流必決以近事驗之決河非不能力塞故道非不能力復但勢不能乆耳横壠功大難成雖成将復決六塔狹小而以全河注之濵德博必𬒳其害不若因水所趨増隄峻防䟽其下流縱使入海此數十年之利也宰相陳執中主昌朝文彦博主仲昌竟爲河北患狄青爲樞宻使有威名帝不豫訛言籍籍脩請出之扵外以保其終嘉祐元年水災書嘉祐二年知舉扵前而記元年水災扵後當時史院進本差誤脩上䟽曰陛下臨御三紀而儲宫未建昔漢文帝𥘉即位以羣臣之言即立太子而享國長乆爲漢大宗唐明宗惡人言儲嗣事不肯早定致秦王之亂宗社遂覆陛下何疑而乆不定乎其後建立英宗蓋原扵此五年拜樞宻副使六年參知政事英宗未親政皇太后御簾大臣奏事間有未可脩必力抗是非臺諫官至政事堂所論或矯異它執政未及言已面折其短朝士建白利害及凡所求請必明告之曰某事可行某事不可行以是怨誹益衆帝将追崇濮王命有司訂議皆謂當稱皇伯改封大國脩引喪服記以爲為人後者為其父母報降三年爲期而不没其父母之名以見服可降而名不可没也若本生之親改稱皇伯歷考前世皆無典據進封大國則又禮無加爵之道故中書之議不與衆同太后出手書許帝稱親尊王爲皇三夫人爲后帝不敢當扵是御史吕誨等六人爭論不巳指脩爲主議皆𬒳逐惟蔣之竒之說合脩意脩薦為御史衆目爲姦邪之竒患之則思所以自解脩婦弟薛宗孺有憾扵脩造帷薄不根之謗摧辱之展轉逹扵中丞彭思永思永以告之竒之竒即上章劾脩神宗初即位欲深譴脩訪扵故宫臣孫思恭思恭爲辨釋脩杜門請推治帝使詰思永之竒問所從来辭窮皆坐黜脩亦罷爲觀文殿學士知亳州明年移青州改宣徽南院使判太原府辭不拜徙蔡州脩本以風節自持旣數困汙衊纔年六十即連乞謝事帝輙優詔弗許及守青又以擅止散青苗錢爲王安石所詆故求歸愈切熈寧四年以太子少師致仕五年薨年六十六贈太子太師謚曰文忠脩始在滁州號醉翁晚更號六一居士天資剛勁見義勇爲雖機穽在前觸發之不顧放逐流離至于再三志氣自若不悔也爲文天材自然豐約中度其學推韓愈孟軻以逹扵孔氏著禮樂仁義之實以合扵大道其言簡而明信而通引物連類折之扵至理以服人心超然獨騖衆莫能及故天下翕然師尊之奨引後進如恐不及賞識之下率為聞人曽鞏王安石蘇洵洵子軾轍布衣屏處未爲人知脩即㳺其聲譽謂必顯扵世篤扵朋友生則振掖之死則調護其家好古耆學凡周漢以降金石遺文㫁篇殘簡一切掇拾研稽異同立說扵左的的可表證謂之集古録奉詔脩唐書紀志表自撰五代史記法嚴詞約多取春秋遺旨殆與史漢相上下蘇軾叙其文曰論大道似韓愈論事似陸贄記事似司馬遷詩賦似李白識者以爲名言中子棐棐字叔弼廣覽彊記能文詞年十三時見脩著鳴蟬賦侍扵側不去脩撫之曰兒異時必能為此因書以遺之用䕃爲祕書省正字登進士乙科念父老不肯仕強之乃調陳州判官終不行脩所為文湏人代者多出其手脩薨代草遺表神宗讀而愛之意脩自作也免喪始為審官主簿官制局檢詳官太常博士主客考功員外郎議者患選人貟多請令二十五歳而試扵銓又守選三年而後仕進士特奏名者予之官而不使調選棐曰是非朝廷所以立議本意也且所爲議冗官者欲利士人耳今加年而使守選是反害之也所謂特奏名者非它儒人老扵埸屋者也閔其無成而老故予之微官使霑禄而後歸今乃授之虚名是終窮之也遂得不變元祐初以集賢校理爲著作郎判登聞鼓院復徙職方禮部員外郎知襄州曽布執政其婦兄魏泰恃聲勢来居襄規占公私田園強市買與民爭利郡縣莫敢誰何至是指州門東偏官邸廢址爲天荒而請之吏具成牘至棐曰孰謂州門之東偏而有天荒乎卻之衆共白曰泰横扵漢南乆今求地而緩與之且不可而又可卻邪棐竟持不與泰怒譛扵布徙之潞州旋又罷去奪校理元符末還朝歴吏部右司二郎中以直祕閣知蔡州蔡地薄賦重轉運使又爲覆折之令多取扵民民不堪命㑹有詔禁止而佐吏憚使者不敢以詔旨從事棐曰州郡之扵民詔令茍有未便猶将建請今天子徳意深厚知覆折之病民手詔止之若有憚而不行何以爲長吏命即日行之未幾坐黨籍廢十餘年卒年六十七史臣曰由三代以降薄乎秦漢文章雖與時盛衰而藹如其言曄如其光皦如其音蓋均有先王之遺烈渉晉魏而弊至唐韓愈氏乃復起唐之文渉五季而弊至脩復起閼百川之頽波導之東注斯文正傳追歩前古匹夫而為百世師一言而為天下法此兩人足以當之愈不極扵用脩用矣而不極其至然國朝文風彬彬至今脩之功學士大夫相與尸而祝之可也附録卷第四集古録跋尾卷第四歐陽文忠公集一百三十七魏受禪碑歲月見本文右魏受禪碑世傳爲梁鵠書而顔真卿又以爲鍾繇書莫知孰是按漢獻帝紀延康元年十月乙夘皇帝遜位魏王稱天子又集本無此字按魏志是歲十一月葬士卒死亡者猶稱集本有王字令是月丙午集本作寅漢帝使張愔奉璽綬庚午王升壇受禪又是月癸酉奉漢帝爲山陽公而此碑云十月辛未受禪于漢三家之說皆不同今據裴松之注魏志備列漢魏禪代詔冊書令羣臣奏議甚詳蓋漢實以十月乙夘䇿詔魏王使張愔奉璽綬而魏王辭讓往返三四而後受也又據侍中劉廙奏問太史令許芝今月十七日已未可治壇場又據尚書令桓階等奏云輙下太史令擇元辰今月二十九日可登壇受命蓋自十七日已未至二十九日正得辛未以此推之漢魏二紀皆繆而獨此碑爲是也漢紀乙夘遜位者書其初命而略其辭讓往返遂失其實爾魏志十一月癸卯猶稱令者當是十月衍一字爾丙午張愔奉璽綬者辭讓往反容集本作殆有之也惟庚午升壇最爲繆爾癸卯去癸酉三十一日不得同爲十一月此尤繆也禪代大事也而二紀所書如此則史官之失以惑後世者可勝道哉嘉祐八年九月十七日書右真蹟魏公卿上尊號表黄初元年右魏公卿上尊號表唐賢多傳爲梁鵠書今人或謂非鵠也乃鍾繇書爾未知孰是也嗚呼漢魏之事讀其書者可爲之流涕也其鉅碑偉字其意惟恐傳之不逺也豈以後世爲可欺歟不然不知耻者無所不爲乎右真蹟魏鍾繇表歲月見本文右鍾繇法帖二字集本作表者曹公破關羽賀捷表也其後書云建安二十四年閏月九日南蕃東武亭侯鍾繇上集賢校理孫思恭精於曆學余問孫君建安二十四年閏在何月思恭爲余以漢家所用四分乾象曆推之是歲巳亥二曆皆閏十月而陳壽三國志所書時月雖爲簡略然以思恭言考之則合按魏志是歲冬十月軍還洛陽其下遂書孫權請討關羽自効於呉志則書閏月權討羽以魏呉二志參較是閏十月矣呉志又書十二月權獲羽及其子平魏志明年正月乃書權傳羽首至洛陽蓋二志相符乃權以閏十月方征羽至十二月獲之明年正月始傳首至洛集本有陽字理可不疑然則鍾繇安得於閏十月先賀捷也由是此表可疑爲非真而今世盛行復有兩本字大小不同小字差類繇書然不知其果是否姑並存之以俟識者治平元年七月廿六日書右真蹟又集本右魏鍾繇書其辭云戎路兼行履險冒寒因述曹仁徐晃破關羽事其後題云建安二十四年閏月九日南蕃東武亭侯臣繇上按建安二十四年冬曹公軍于摩陂而仁等破羽後未甞出征履險冒寒之役又古人牋啓不書年此二事可疑又云羽巳𬒳手刃據三國志羽圍曹仁於樊爲仁所敗而走後爲孫權兵斬於沮與此帖不同魏劉熹學生冡碑歲月未詳右魏劉熹學生冡碑在襄州榖城縣界中余爲乾徳令時嘗以公事過榖城見數荒冡在草間傍有古碑傾側半埋土中問其村人爲何人冡皆不能道而碑文磨滅不暇讀而去後數年在河北始集録古文思嚮所見榖城碑疑爲漢碑求之又數年乃獲按襄州圖經云學生冡在縣東北水經注云魏濟南劉熹字徳怡博學好古立碑載生徒百餘人其不終業而卒者葬于集本作於此號學生冡今碑雖殘缺而熹與生徒名字往往尚可見蓋余昔所見乃學生冡而碑魏時碑也熹榖城令也治平元年正月十日書右真蹟魏賈逵碑歲月未詳右魏賈逵碑魏志逵傳云逵爲絳邑長爲賊郭援所攻絳人與援約不害逵乃降而援欲以逵爲將怒逵不肯叩頭欲殺之絳人乗城呼曰負集本作若要殺我賢君寧俱死援義之遂不殺又按裴松之注引魏略云援捕得逵怒不肯拜促斬之諸將覆護囚於壷關土窖中守者祝公道釋其械而逸之集本有已字與魏志不同而此碑但云爲援所執臨以白刃不屈而已不載絳人約援事如傳所載不獨逵有徳於絳人而絳人臨危能與逵生死亦可謂賢矣自古碑碣稱述功徳常患過實如逵與絳人徳義集本有俱隆字碑不應略而不著頗疑陳壽作傳集本無此二字好竒而所得非實也松之又注魏書逵年五十五而碑云五十有四亦當以碑爲正嘉祐八年十一月十四日書右真蹟魏鄧艾碑歲月未詳右鄧乂碑考其事蹟終始即魏集本無此字鄧艾碑也艾甞爲兖州刺史據碑云晉初甞發兖州兵討叛羌艾降巫者傳言授以用兵之法因以破羌兖人神之遂爲艾立廟建碑紀其事艾於三國時爲名將甞有大功其姓名聞於世甚顯史與兖人皆不應誤而艾乂二名不同如此此君子所以慎於傳疑也余謂古人艾乂常通用漢書曰黎民艾安與懲艾創艾注皆讀爲乂豈非鄧侯名艾音乂而書碑者從省歟後人讀史無音注乃直以爲蒿艾之艾而流俗轉失乆而訛繆遂不復正此理或然覽者詳之熈寧壬子正月晦日六一堂書右真蹟吴九真太守谷府君碑鳳皇元年四月右谷朗者事吴爲九真太守碑無書撰人名氏其序云府君諱朗字義先桂陽耒陽人豫章府君之曽孫公府君之孫郎中君之子也其先出自顓頊益爲舜虞賜姓嬴氏至于扉子封於秦谷因而氏焉谷氏在吴不顯史傳無所見所謂豫章府君而下三世皆莫知其名字按秦本紀非子邑於秦而此與朗子永寧侯相碑皆爲扉子莫詳其義也治平元年四月廿六日書右真蹟吴國山碑歲月見本文右吴國山碑者孫皓天冊元年禪于國山改元天璽因紀其所獲瑞物刋石于山隂是歲晉咸寧元年後五年晉遂滅吴以皓昬虐其國將亡而衆瑞並出不可勝數後世之言祥瑞者可以鑒矣熈寧元年中元後一日書右真蹟晉南郷太守頌㤗始中右南郷太守司馬整集本作晉南郷太守頌南郷太守者司馬整也按晉書宣帝弟曰安平獻王孚孚次子曰義陽成王望望第三子曰隨穆王整整先望卒後武帝分義陽之隨縣封整爲王謚曰穆整以魏咸熈二年爲南郷太守是歳晉武受禪改元泰始泰始三年徙整南陽而南郷人爲整建此碑晉書地理志當魏末荆州分屬三國而南郷南陽皆屬魏後晉武改南郷爲順陽此碑今在光化軍軍即襄州榖城縣之隂城鎮隂城當魏晉時爲南郷屬縣也余貶乾徳縣令時得此碑今二紀矣嘉祐八年九月二十六日書真蹟晉南郷太守碑㤗始四年右南郷太守碑不著書撰人名氏題曰宣威將軍南郷太守司馬府君紀徳頌碑云君諱整字孔修太宰安平王之孫太尉義陽王之子按晉書宣帝弟曰安平獻王孚孚次子曰義陽成王望望第三子隨穆王整整先望卒後武帝分義陽之隨縣封整爲王謚曰穆整以太始三年自南郷太守徙南陽而南郷人共立此碑今在光化軍軍即襄州榖城縣之隂城鎮按晉志不列南郷郡據此碑所載縣令名氏有武陵築陽丹水隂城順陽析六縣此蓋南郷郡所治也晉志但云南郷魏時屬荆州武帝平吴改爲順陽郡而不著順陽治所興廢屬縣之名而獨此碑可見也又整傳但云整歷南中郎將封清泉侯薨贈冠軍將軍亦不言其爲宣威將軍南郷南陽二郡守皆其所漏略也右集本南郷太守碑隂集本右南郷太守將吏三百五十人分爲二卷其磨滅者猶有二十餘人人皆有色姓名字而無次序其名號有令有長有南閤祭酒門下督主簿部督郵監汀督郵部勸農五官掾文學掾營軍掾軍謀掾府門亭長主記史待事掾待事史部曲將部曲督又有賊曹功曹議曹户曹金曹水曹科曹倉曹鎧曹左右兵曹曹皆有掾又有祭酒有史有書佐有脩行有從掾位有從史位有史有小史等魏晉之際太守官屬之制蓋如此他書或時見一二不能如此之備也晉陸喈碑歲月見本文右晉陸喈碑喈爲宣威内史建武元年卒碑以咸和七年立而碑後題云咸和七年歲在庚辰咸和成帝年號也成帝以泰寧三年八月即位是歲乙酉明年改元咸和據曆七年當爲壬辰而此爲集本作云庚辰者繆也陸氏有二碑余家集録皆有之據陸禕碑後題云泰寧三年歲在乙酉與今曆合則當時曆官不應至咸和而頓爾差失然則庚辰特書碑者誤爾治平元年六月二十九日書右真蹟晉蘭亭修禊序永和九年集本右蘭亭修禊序世所傳本尤多而皆不同蓋唐數家所臨也其轉相傳模失真彌逺然時時猶有可喜處豈其筆法或得其一二邪想其真蹟冝如何也哉世言真本葬在昭陵唐末之亂昭陵爲温韜所發其所藏書畫皆剔取其裝軸金玉而棄之於是魏晉以来諸賢墨蹟遂復流落於人間太宗皇帝時購募所得集以爲十卷俾模傳之數以分賜近臣今公卿家所有法帖是也然獨蘭亭真本亡矣故不得列於法帖以傳今予所得皆人家舊所藏者雖筆畫不同聊並列之以見其各有所得至於真僞優劣覽者當自擇焉其前本流俗所傳不記其所得其二得於殿中丞王廣淵其三得於故相王沂公家又有别本在定州民家二家各自有石較其本纎毫不異故不復録其四得於三司蔡給事君謨世所傳本不出乎此其或尚有所未傳更俟博采范文度模本蘭亭序附余甞集録前世遺文數千篇因得悉覽諸賢筆蹟比不識書遂稍通其學然則人之於學其可不勉哉今老矣目昬手顫雖不能揮翰而開卷臨几便别精麤若范君所書在余集録實爲難得也竊幸覽之一作焉爲之忘倦嘉祐七年夏五月二十八日廬陵歐陽脩書右真蹟書雖列於六藝非如百工之藝也蔡君謨以書名當世其稱范君者如此不爲誤矣滁山醉翁題右真蹟又自唐末干戈之亂儒學文章掃地而盡宋興百年之間雄文碩儒比肩而出獨字學乆而不振未能比蹤唐之一無此字人余每以爲恨今乃獲見范君筆法信乎時不乏人而患知之不博不然有於中必形於外若范君者筆迹不傳於世而獨傳其家蓋其潜光晦徳非止其書閟不傳也右真蹟又與前跋相類疑是稾本今兩存之自唐末兵戈之亂儒學文章掃地而盡聖宋興百餘年間雄文碩學之士相繼不絶文章之盛遂追三代之隆獨字書之法寂寞不振未能比蹤唐室余每以爲恨今廼獲見范君之書信乎時不乏人而患聞見之不博也然若君之筆法冝傳於世乆閟于家蓋其潜光晦伏非獨其書之閟也右集本晉樂毅論永和四年右晉樂毅論石在故髙紳學士家紳死家人初不知惜好事者往往就閱或模傳其本其家遂袐藏之漸爲難得後其子弟以其石質錢於冨人而冨人家失火遂焚其石今無復有本矣益爲可惜也後有集本有此二字甚妙二字吾亡友聖俞書也論與文選所載時時不同考其文理此本爲是惜其不完也右真蹟晉王獻之法帖歲月未詳真蹟右王獻之法帖余甞喜覽魏晉以来筆墨遺蹟而想前人之髙致也所謂法帖者其事率皆弔哀候病敘睽離通訊問施於家人朋友之間不過數行而巳蓋其初非用意而逸筆餘興淋漓揮灑或妍或醜百態横生披卷發函爛然在目使人驟見驚絶徐而視之其意態集本無此三字愈無窮盡故使後世得之以爲竒翫而想見其人也至於髙文大冊何甞用此而今人不然至或棄百事弊精疲力以學書爲事業用此终老而窮年者是真可咲也治平甲辰秋社日書又獻之帖蓋唐人所臨其筆法類顔魯公更俟識者辨之右真蹟晉賢法帖真蹟右晉賢法帖太宗皇帝萬機之餘留精翰墨甞詔天下購募鍾王真蹟集爲法帖十卷模刻以賜羣臣往時故相劉公沆在長沙以官法帖鏤版遂布於人間後有尚書郎潘師旦者又擇其尤妙者别爲卷第與劉氏本並行至余集録古文不敢輒以官本參入私集遂於師旦所傳又取其尤者散入録中俾夫啓帙披卷者時一得之把翫欣然所以忘勌也治平元年五月十日書晉七賢帖右晉七賢帖得之李丕緒少卿真蹟無此二字家丕緒多藏古書然不知此爲真否七子書蹟世罕傳故録之右集本宋文帝神道碑歲月未詳右宋文帝神道碑云太祖文皇帝之神道凡八大字而别無文辭惟以此爲表識爾古人刻碑一作碑刻正當如此而後世鐫刻功徳爵里世繫惟恐不詳然自後漢以来門生故吏多相與立碑頌徳矣余家集古所録三代以来鍾鼎彞盤銘刻備有至後漢以後始有碑文欲求前漢時碑碣卒不可得是則冡墓碑自後漢以来始有也此碑無文疑非宋世立蓋自漢以来碑文務載世徳宋氏子孫未必能超然獨見復古簡質又南朝士人氣尚卑弱字書工者率以纎勁清媚爲佳未有偉然巨筆如此者益疑後世所書按宋書文帝爲元兇劭所弑初謚曰景廟號中宗孝武立改謚曰文號太祖其墓曰長寧陵也右真蹟宋宗慤母夫人墓誌歲月見本文右宗慤母夫人墓誌不著書撰人名氏有誌無銘其後云謹牒子孫男女次第名位㛰嫁如左蓋一時之制也按慤本傳與此誌歷官終始不同本傳云宋孝武即位以慤爲左衛將軍累遷豫州刺史監五州諸軍使討竟陵王誕入爲左衛將軍廢帝即位爲寧蠻校尉雍州刺史卒此誌乃大明六年作誌云爲右衛將軍監交廣二州湘州之始興冠軍將軍平越中郎將廣州刺史始遷豫州監五州軍事又爲散騎常侍左衛將軍領太子中庶子荆州大中正而傳皆略之也慤南陽涅陽人而此誌云涅陽縣都郷安衆里人又云窆於秣陵縣都郷石泉里都郷之制前史不載右集本齊鎮國大銘像碑天統三年集本右齊鎮國大銘像碑銘像文辭固無足取所以録之者欲知愚民當夷狄亂華之際事佛尤篤爾其字畫頗異雖爲訛繆亦其傳習時有與今不同者其録之亦以此也南齊海陵王墓銘歲月未詳右南齊海陵王墓銘長兼中書侍郎謝眺撰海陵王昭文者文惠太子次子也初明帝鸞旣廢鬱林王昭業而立昭文又廢爲海陵王而殺之遂自立按謝眺傳眺當海陵王時爲驃騎諮議領記室又掌中書郎後遷尚書吏部郎此誌題云長兼中書侍郎而據傳眺未甞爲中書侍郎史之闕也按南齊書劉悛爲長兼侍中後魏臨淮王彧爲長兼御史中尉南北史多有此名蓋集本有長兼者三字當時兼官之稱如唐檢校官之類也嘉祐八年九月十七日書右真蹟梁智藏法師碑普通三年真蹟右梁智藏法師碑梁湘東王蕭繹撰銘新安太守蕭㡬作叙尚書殿中郎蕭挹書世號三蕭碑法師者姓顧氏㡬挹皆稱弟子衰世之弊遂至於斯余於集古録而不忍遽棄者以其字畫集本作書粗可佳捨其所短取其所長斯可矣嘉祐八年五月晦日書陳張慧湛墓誌銘貞觀二十三年立右陳張慧湛墓誌銘不著書撰人名氏陳隋之間字書之法極於精妙而文章頽壞至於鄙俚豈其時俗弊薄士遺其本而逐其末乎予家集録所見頗多自開皇仁壽而後至唐髙宗巳前碑碣所刻往徃不减歐虞而多不著名氏如鉗耳君清徳頌或有名而其人不顯如丁道護之類不可勝數也慧湛陳人至唐太宗時始改葬爾其銘刻字畫遒勁有法翫之忘勌惜乎不知爲何人書也治平元年四月晦日書右真蹟陳浮屠智永書千字文歲月未詳右千字文今流俗多傳此本爲浮屠智永書考其字畫時時有筆法不類者雜於其間疑其石有亡缺後人妄𥙷足之雖識者覽之可以自擇然終汩其真遂去其二百六十五字其文旣無所取而世復多有所佳者字爾故輒去其僞者不以文不足爲嫌也蔡君謨今世知書者猶云未䏻盡去也嘉祐八年十月十八日書右真蹟又梁書言武帝得王羲之所書千字命周興嗣以韻次之今官集本作觀法帖有漢章帝所書百餘字其言有海鹹河淡之類蓋前世學書者多爲此語不獨始於羲之也右真蹟大代修華嶽廟碑歲月見本文右大代修華嶽廟碑按魏書文成帝興光二年三月已亥改元爲太安故魏書興光無二年而此碑云集本有興光二字二年三月甲午立者蓋立碑後六日始改元也其曰闡皇風於五葉者自道武明元太武至於文成纔四世爾太武之弑南安王余立不踰年亦𬒳弑不得成君集本無此十九字而景穆太子文成父也追尊爲帝立廟稱宗故以爲世也魏自道武天興元年議定國號羣臣欲稱代而道武不許乃仍稱魏自是之後無改國稱代之事今魏碑數數有之碑石當時所刻不應妄但史失其事爾由是言之史家闕繆可勝道哉然予於史家非長故書之以待博學君子也嘉祐八年歲在癸卯七月三十日書昔在南譙自號醉翁晚又更號六一居士右真蹟又按魏書文成帝興光二年三月已亥改元太安而此碑書二年三月甲午立蓋立碑後六日乃改元故碑猶得稱二年也其曰闡皇風於五葉者自道武明元太武至於文成纔四世爾太武之弑南安王余立不踰年亦𬒳弑不得成君爲一世而景穆太子文成父也追尊爲帝立廟稱恭宗故以爲世也魏自道武天興元年議定國號羣臣欲稱代而道武不許乃稱魏自是之後無改國稱代之事今魏碑數數有之碑石當時所刻不應妄誤但史失其事爾由是言之史家闕繆多矣右真蹟後魏孝文北廵碑歲月見本文右魏孝文北廵碑云太和二十一年修省方之典北臨舊京又云渉西河出平陽斜順唐逵指遊咸櫟路邇龍門遂紆雕軒按後魏本紀是歲正月乙已北廵二月次太原至平城四月幸龍門以太牢祭夏禹遂幸長安汎渭浮河廼東歸與此碑所書皆合也碑無題首故依本紀爲北廵碑也治平元年三月廿二日書右真蹟後魏定鼎碑歲月見本文右魏定鼎碑景明三年建在今懷州流俗謂之定鼎碑也景明魏宣武年號也碑云定鼎遷中之十年按魏孝文以太和十七年遷都洛陽至此景明三年蓋十年矣右集本後魏石門銘歲月見本文右魏石門銘云此門蓋漢永平中所穿自晉氏南遷斯路廢矣皇魏正始元年漢中獻地襃斜遂開假節龍驤將軍梁秦二州刺史羊祠開創舊路詔遣左校令賈三徳共成其事起四年十月訖永平二年正月畢功其餘文字尚完而其大略如此石門在漢中所謂漢永平中所穿者乃明帝時司隷校尉楊厥所開也厥自有碑述其事甚詳正始永平皆後魏宣武年號也治平元年五月十日書右真蹟後魏神龜造碑像記歲月見本文右神龜造碑像記魏神龜三年立余所集録自隋以前碑誌皆未甞輒棄者以其時集本無此字有所取於其間也然患其文辭鄙淺又多言浮屠然獨其集本作以字畫徃往工妙惟後魏北齊差劣而又字法多異不知其何從而得之遂與諸家相戾亦意其夷狄昧於學問而所傳訛繆爾然録之以資廣覽也此碑字畫時時遒勁尤可隹也神龜孝明年號按魏書集本有神龜二字三年七月辛卯改元正光而此碑是月十五日立不知辛卯是其月何日也當俟治曆者推之嘉祐八年七月十一日書右集本東魏任城王造浮圖記歲月見本文右任城王造浮圖記不著其名云武定四年建武定東魏孝静年號也按後魏書景穆皇帝子雲雲子澄集本有子彝二字相襲爲任城王其後國絶不封其去孝靜時差逺不知武定四年王任城者爲誰也治平元年八月八日書右真蹟東魏造石像記歲月見本文右東魏造石像記其碑云大魏武定七年歲次已巳武定孝静年號也今世所行曆譜惟龔潁運曆圖與今亳州宋退相紀年通譜爲最詳而以潁所書推之武定七年歲當已巳與此碑合而武定止於八年是歲庚午東魏滅其事與東魏北齊書亦合而通譜以七年爲戊辰八年爲已巳又有九年爲庚午而東魏滅按孝静以後魏大統十六年滅是歲庚午則知宋公所記甲子不繆惟武定不當有九年而七年不得爲戊辰此其失爾蓋孝靜始即位改元天平盡四年而五年正月改爲元象今通譜天平止於三年以四年爲元象蓋自元象以後遞差一年故以武定七年爲戊辰也苟不見斯碑則運曆圖與通譜二家得失其何以決右集本魏九級塔像銘歲月見本文真蹟右魏九級塔像銘不見書撰人名氏蓋北齊時人所作也其年號見於文者三曰真君九年者後魏太武號也又曰武定四年者東魏孝靜號也又曰天保三年者北齊文宣號也按髙洋以後周大統十六年受東魏禪是歲庚午改元天保三年壬申此碑云歲在涒灘是矣碑文淺陋蓋鄙俚之人所爲惟其字畫多異往往竒怪故録之以備廣覽集本有云字治平元年三月廿三日書北齊常山義七級碑歲月見本文右不著書撰人名氏文爲聲偶頗竒怪而字畫亦佳徃徃有古法碑云常山太守六州大都督儀同三司綦連公以天保九年造浮圖天保齊文宣年號也北齊書有綦連猛而不爲常山太守都督儀同等官不知此所謂綦連公者何人也嘉祐八年九月二十日書右真蹟又右常山義七級碑不著書撰人名氏文辭聲偶而甚怪書字頗有古法其碑首題云慕容儀同麴常山石氏諸邑義七級之碑其文云常山太守六州大都督儀同三司綦連公以天保九年爲國敬造七級浮圖一區至天統中使持節都督瓜州諸軍事驃騎大將軍儀同三司瓜州刺史常山太守六州大都督頻陽縣開國子樂平縣開國男慕容樂及散騎常侍郎驃騎大將軍前給事黄門侍郎繕州大中正食新市縣幹新除常山太守麴顯貴與功曹石子和等増成之蓋北齊時碑也綦連公不見其名北齊有綦連猛不爲常山太守不知此何人而慕容樂官兼刺史太守並封兩縣不可詳也食縣幹入官銜蓋當時之制亦不可詳也義者衆成之名猶若今謂義井之類也右集本永樂十六角題附出右永樂十六角題名不著年月列名人甚多皆無顯者莫可考究不知爲何時碑其字畫頗怪而不精似是東魏北齊人所書十六角者庸俗所造佛塔其後又書云造十六角鎮國大浮圖則知爲塔矣其謂之十六角只見此碑而後魏時又有常山義七級碑蓋當時俚俗語類皆如此治平元年八月八日書右真蹟魯孔子廟碑附出興和三年右魯孔子廟碑後魏北齊時書多若此筆畫不甚佳然亦不俗而往往相類疑其一時所尚集本作傳當自有法又其點畫多異故録之以備廣覽右真蹟北齊石浮圖記歲月見本文右齊造石浮圖記云河清二年歲在癸未河清北齊髙湛年號也碑文鄙俚而鐫刻訛繆時時字有完者筆畫清婉可喜故録之又其前列題名甚多而名特竒怪如馮戬郎馮貴買之類皆莫曉其義若名野义伽耶者蓋出於浮圖爾自胡夷亂華以来中國人名如此者多矣最後有馮黑太者予謂太亦音撻意隋末有劉黒闥吴黒闥皆以此爲名者太闥轉冩不同爾然隋去北齊不逺不知黒闥爲何等語也右集本後周大像碑大象二年右周大像碑宇文氏之事迹無足采者惟其字畫不俗亦有取焉翫物以忘憂者惟怪竒變態真僞相雜使覽者自擇則可以忘倦焉故余於集古所録者博矣嘉祐八年六月二日書右真蹟集古録跋尾卷第四魏受禪碑元第七十二受禪此下一有壇字往返一作反下同魏公卿上尊號表元第七十三至七十四鉅一作巨碑隂官屬何其多邪盖通從史而盡列之當時猶於其間以取士人故吏亦清修其勢然耳右莆陽蔡君謨書今十年矣嘉祐八年九月二十七日一有此五十六字陸喈碑元第一百三十七蘭亭叙元第九百九十六數家一作諸家嘉祐八年六一作八月十日一有此八字范文度模本蘭亭叙蔡君謨題跋附右軍蘭亭㝡著今世尚有塌本袐閣一本蘇才翁一本周越一本猶有氣象存焉今觀橅倣蓋得之矣嘉祐壬寅五月廿六日莆陽蔡襄同前又唐末真蹟作室寂寞真蹟作寥唐室真蹟作賢於世真蹟此下有而字閟也真蹟此下有嘉祐七年五月旬休日廬陵歐陽某十四字樂毅論元第八十三論石此下一有本字王獻之法帖元第八百六十八又元第三百一十九晉賢法帖六第七百三十五沆真蹟無此字晉七賢帖元第七十六宋文帝神道碑元第四百四十九鐫刻一作銘刻墓碑此下一有銘字宋世此下一有所字士人一作人士治平元年三月十六日書一有此十字宗慤母墓誌元第一百五十三齊鎮國大銘像碑元第一百二十南齊海陵王墓銘元第八十五右海陵王墓銘南齊謝眺撰海陵王者齊文惠太子之次子也名昭文初明帝鸞旣廢鬱林王昭業而立昭文又廢爲海陵王而殺之鸞立是爲明帝按眺傳眺當海陵王時爲驃騎諮議領記室又掌中書郎後遷尚書吏部郎此誌題云長兼中書侍郎臣謝眺立而傳不書眺爲侍郎也按齊書劉悛爲長兼侍中魏臨淮王彧爲長兼御史中尉南北史多有盖長兼似當時兼官之稱如唐檢校官也此與前本不同故兩存之梁智藏法師碑元第六十一余於一無於字可佳一作取所短一無所字陳張慧湛墓誌銘元第六百一十三智永書千字文元第四十六大代修華嶽廟碑元第五百二十四興光無一作無興光元也一作年於史家一作學後魏孝文北廵碑元第八十九後魏定鼎碑元第一百九石門銘元第七百八至七百九神龜造碑像記元第四百九任城王造浮圖記元第八百三十五東魏造石像記元第八百三十九退相一作丞相後魏此下一有永熈三年立在位十七年十字大統二字上一有至字記甲子一作紀首尾以決此下一有然後知余之集録不爲無益也治平元年閏五月九日書二十二字九級塔像銘元第四百七十七常山義七級碑元第十四永樂十六角題元第九百八十五魯孔子廟碑元第二百九十北齋石浮圖記元第九百七十六後周太像碑元第二百九十八
