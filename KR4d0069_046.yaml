front:
  text: 居士集卷第四十六歐陽文忠公集四十六
  hash: sha256:570a956726799f2607bc57ab5aea07e0e47c880b25f2e1943c88cb71626e503b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_046-1a}
body:
  text: 上書一首準詔言事上一作上封事書月日臣修謹昧死再拜上書于皇帝陛下臣近準詔書許臣上書一作許以封章言事臣學識愚淺一作昧不能廣引深逺以明治亂之原謹採當今急務條為三弊五事以應詔書所求伏惟陛下裁擇臣聞自古王者之治天下雖有憂勤之心而不知致治之要則心愈勞而事愈乖雖有納諫之明而無力行之果斷則言愈多而聽愈惑故為人君者以細務而責人專大事而獨斷此致治之要術一無此字也納一言而可用雖衆説一作議不得以沮一作汨之此力行之果斷也知此二者天下無難治矣一本治作致理伏見國家自大兵一動中外一作天下騷然陛下思社稷之安危念兵民之疲一作困弊四五年來聖心憂勞一作勤可謂至矣然而兵日益老賊日益強併九州之力討一作平一西戎小者尚無一人敢前今又北戎大者違盟而動一作妄作其將何以禦之從來所患者夷狄今夷狄叛矣所惡者盜賊今盜賊起矣所憂者水旱今水旱作矣所賴一作仰者民力今民力困矣所須一作急者財用今財用乏矣陛下之心日憂於一日天下之勢歲危於一歲此臣所謂用心雖勞不知求致治之要者也近年朝廷開發一作雖廣言路獻計之士不下數千然而事緒轉多枝梧不暇從前所採衆議紛紜至於臨事誰䇿可用此臣所謂聽言雖多不如力行之果斷者也伏思聖心所甚憂而當今所尚一作最闕者不過曰無兵也無將也無財用也無禦戎之䇿也無可任之臣也此五者陛下憂其未有而臣謂今皆百之然陛下未得而用者未思其術也國家創業之𥘉四方割據中國地狹兵民不多然尚能南取荆楚收偽唐定閩嶺西平兩蜀東下并潞北窺幽燕當時所用兵財將吏其數幾何惟善用之故不覺其少何況一作豈如今日承百年祖宗之業盡有天下之冨強人衆物盛十倍國𥘉故臣敢言有兵有將有財用有禦戎之䇿有可任一有用字之臣然陛下皆不得而用者其故何哉由朝廷有三大弊故也何謂三一有大字弊一曰不愼號令二曰不明賞罰三曰不責功實此三弊因循於上則萬事弛慢廢壞於下臣聞號令者天子之威也賞罰者天子之權也若號令一有煩而二字不信賞罰一有行而二字不當則天下不服故又須責臣下以功實然後號令不虛出而賞罰不濫行是以愼號令明賞罰責功實此三者帝王之竒術也自古人君英雄如漢武帝聰明如唐太宗皆知用一作皆能知此三術而自執威權之柄故一有二帝二字所求無不得所欲皆如意漢武好用兵則誅滅四夷立功萬里以快其心欲求將則有衛霍之材以供其指使欲得賢士則有公孫董汲之徒以稱其意唐太宗好用兵則誅突厥服遼東威振夷狄以逞其志欲求將則有李靖李績之徒一作儔入其駕馭欲得賢士則有房杜之徒一作輩在其左右此二帝者一有凡有所為後丗莫及八字可謂所求無不得所欲皆如意無他術也惟能自執威權之柄耳伏惟陛下以聖明之姿超出一作越二帝又盡有漢唐之天下然而欲禦邊則常患無兵欲破賊則常患無將欲贍軍則常患無財用欲威服四夷則常患無䇿欲任使賢材則常患無人是所求皆不得所欲皆不如意其故無他由不用威權之術也自古帝王或為強臣所制或為小人所惑則威權不得出於已今朝無強臣之患旁無小人偏任之溺一作又無小人獨任之惑內外臣庶尊陛下如天愛陛下如父傾耳延首願一有聽字陛下之所為然何所憚而不為乎一作何憚而久不為哉若一日赫然執一作奮威權以臨之則一作可使萬事皆辦何患五者之無奈何為三弊之因循一事之不集臣請言三弊夫言多變則一有俗字不信令頻改則一有下字難從一作入今出令之𥘉不加詳審行之未久尋又更張以不信之言行難從之令故每有處置之事州縣一作天下知朝廷未是一定之命則官吏或一作咸相謂曰且未要一作可行不久必須更改或曰備禮行下略與應破指揮旦夕之間果然又變至於將一作官吏更易道路疲於送迎符一作文牒縱橫上下莫能遵守一作稟中外臣庶一作官吏軍民或聞而歎息或聞而竊笑歎息者有憂天下之心竊笑者有輕朝廷之意號令如此欲威天不貶而依舊軍中見有罪者不誅則諸將誰肯用命矣所謂賞不足勸威一作罰無所懼賞罰如此而欲用人其可得乎此不明賞罰之弊一有二字也自兵動以來處置之事不少然多有名而無實臣請略言其一二則其他可知數年以來點兵不絶諸路之民半為兵矣其間老弱病患短小怯懦者不可勝數一有兵額空多所用者少八字是有點兵之虛名而無得兵之實數一作效也新集之兵所在教習追呼上下民不安居主教者非將領之材所教者無旗鼓之節一作法往來州縣愁一作怨嘆嗷嗷既多是老病小怯一作弱小懦之人又無訓齊精練之法一作術此有教兵之虛名而無訓兵之實藝一作效也諸路州軍分造器械一作諸州所造器悈數不少矣工作之際已勞民力輦運般送又苦道塗一作路然而鐵刃不剛一作鋼筋膠不固長短大小多不中度造作之所但務充數而速了不計所用之不堪經歷官司又無檢責此有器械之虛名而無器械之實用也以草草一作無實之法教老一作小怯之兵執鈍折不堪之器械百戰百敗理在不疑臨事而悟何可及乎故事無大小悉皆鹵莽則不責功實之弊一有三字也臣故曰三弊因循於上則萬事弛慢廢壞於下萬事不可盡言臣請一直直字言一有其字大者五事其一曰兵臣聞攻人以謀不以力用兵鬭智不鬭多前代用兵之人多者常敗少者常勝漢王尋等以百萬之兵遇光武九千人而敗是多者敗而少者勝也苻堅以百萬之兵遇東晉二三萬人而敗是多者敗而少者勝也曹操以三十萬青州兵大敗於吕布退而歸許復以二萬人破袁紹十四五萬一作四十萬人是用兵多則敗少則勝之明驗也況於夷狄尤難以力爭只可以計取李靖破突厥於定襄只用三千人其後破頡利於隂山亦不過一萬一作萬人下有其他以三五千人立功塞外者不可悉數十六字蓋兵不在多能以計取一作能用計爾故善用兵者以少一有而字為多不善用者雖多而愈少也一無此字為今計者一作臣謂方今添兵則耗國減兵則破賊今沿邊之兵不下七八十萬可謂多矣然訓練不精又有老弱虛數則十人不當一人是七八十萬之兵不當七八萬人之用加又一作之軍無統制分散支離分多為寡兵法所忌此所謂不善用兵者雖多而愈少故常戰而常敗也臣願陛下赫然奮威勑勵諸將精加訓練去其老弱七八十萬中可得一有四字五十萬數古人用兵以一當百今既未能但得以一當十則五十萬精兵二字一作數可當五百萬兵之用此所謂善用兵者以少而為多古人所以少而常勝者以此也今不思實效但務添多耗國耗民積以年歲子作遷延日月賊雖不至天下巳困矣此一事也其二曰將臣又聞古語曰將相無種故或出於奴僕或出於軍卒一作或出於士或出於卒伍或出於奴僕或出於盜賊惟能不次而用之乃為名將耳國家求將之意雖勞一作切選將之路太狹今詔近臣舉將而限以資品則英豪之士在下位者不可得矣試將材者限以弓馬一夫之勇則智略萬人之敵皆遺之矣山林竒傑之士召而至者以其貧賤而薄之不過與一主簿借職使其一作之怏怏而去則古之屠釣飯牛之傑皆激怒而失之矣至於無人可用則寧用龍鍾跛躄庸懦暗劣之徒皆一有委之要地四字授之兵柄天下三尺童子皆為朝廷危之前日澶淵之卒幾為國家生事此可見也議者不知取將之無術但云當今之無將臣願陛下革去舊弊奮然精求有賢豪之士不須限以下位有智略之人不必試以弓馬有山林之傑不可薄其貧賤惟陛下能以非常之禮待人人臣亦將以非常之效報國一作為報又下有又何患於無將哉一句此二事也其三曰財用臣又聞善治病者必醫其受病之處善救弊者必尋一作塞其起弊之源今天下財用困乏其弊安在起於用兵一作兵興而費大故也漢武好窮兵用盡纍丗之財當時勒兵單于臺不過十八萬一作十萬人尚能困其一無其字國力況未若一無二字今日七八十萬連四五年而不罷一作解所以罄天地之所生竭萬民之膏血而用不足也今雖有智者物不能增而計無所出矣惟有減冗卒之虛費練精兵而速戰功成兵罷自然足矣今兵有可減之理一有而字無人敢當其事賊有速擊之便一有而字無將一作人敢奮其勇後時敗事徒耗國而耗民一有惟陛下以威權督責之乃有期耳二句此三事也其四曰禦戎之䇿臣又聞兵法曰上兵伐謀其次伐交北虜與朝廷通好僅四十年不敢妄動今一旦發其狂謀者其意何在蓋見中國頻為元昊所敗故敢啓其貪心伺隙而動爾今若勑勵諸將選兵秣馬疾入西界但能痛敗昊賊一陳則吾軍威大振而虜計沮矣此所謂上兵伐謀者也今詗一作論事者皆知北虜與西賊通謀欲併二國之力窺我河北陜西一有若使二虜並寇則難以力支十一字今若我能先擊敗其一國則虜勢減半不能獨舉此兵法所謂伐交者也元昊地狹賊兵不多向來攻我傳聞北虜常有助兵今若虜中自有點集之謀而元昊驟然𬒳擊必求助於北虜北虜分兵助昊則可牽其南寇之力若不助昊則二國有隙自相疑二此亦伐交之䇿也假令二國剋期分路來寇我能先期大舉則元昊蒼皇自救不暇豈能與北虜相為表裏是破其素定之約乖其剋日之期此兵法所謂親而離之者亦伐交之䇿也元昊叛逆以來幸而屢勝常有輕視諸將之心今又見朝廷北憂戎虜方經營於河朔必謂我師不能西出今乘其驕怠正是疾驅急擊之時此兵法所謂出其不意者此一無此字取勝之上䇿也前年西將有請出攻者當時賊氣力一無力字方盛我兵未練朝廷尚許其出師況今元昊有可攻之勢此不可失之時彼方幸吾憂河北而不虞我能西征出其不意此可攻之勢也自四路分帥今巳半年訓練恩信兵巳可用故近日屢奏小捷是我師漸振賊氣漸衄此可攻之勢也苟失此時而使二虜先來則吾無䇿矣臣願陛下一有不以臣言為狂密七字詔執事之臣熟一作詔四路之帥協議而行之此四事也其五曰可任之臣臣又聞仲尼曰十室之邑必有忠信況今文武列職一作文武常選之官盈於朝廷遍於天下其間豈無材智之臣而陛下總治萬機之大既不暇盡識其人故不能躬自進賢而退不肖執政大臣動拘舊例又不敢進賢而退不肖審官吏部三班之職但掌文簿差除而巳又不敢越次進賢而退不肖是上自天子下至有司無一人得進賢而退不肖者所以賢愚混雜僥幸相容三載一遷更無旌别平居無事惟患太多而差遣一作除不行一旦臨事要人常患乏人使用自古任官之法無如今日之繆也今議者或謂一有以字舉主轉官為進賢犯罪黜責為退不肖此不知其弊之深也大凡善惡之人各以類聚故守廉愼者各舉清幹之人一無上十字有贓汙者各舉貪濁之人好徇私者各舉請一作好財利者各舉誅求之人性庸暗者各舉不材之人一有守廉節者乃舉公幹之人十字朝廷不問是非但見舉主數足便與改官則清一作公幹者進矣貪濁者亦進矣請一作誅求者亦進矣不材者亦進矣混淆如此便可為進賢之法乎方今黜責官吏豈有澄清糾舉之術哉惟犯贓之人因民論訴者乃能黜之耳夫能舞弄文法而求財賂者亦強黠之吏政事必由已出故雖誅剝豪民尚或不及貧弱至於不材之人不能主事衆胥羣吏共為姦欺則民無貧冨一時受弊以此而言則贓吏與不材之人為害等耳今贓吏因自敗者乃加黜責十不去其一二至於不材之人上下共知而不問寬緩容姦其弊如此便可為退不肖之法乎賢不肖既無别則冝乎設官雖多而無人可用也臣願陛下明賞罰責功實則材一有不材二字皆列於陛下之前矣臣故曰五者皆有然陛下不得而用者為有弊也三弊五事臣既已詳言之矣惟陛下擇之天下之務不過此也方今天文變於上地理逆於下人心怨於內四夷攻於外事勢如此矣非是陛下遲疑寬緩之時惟願為社稷生民留意一作惟陛下留計狂直甘俟誅夷臣修昧死再拜居士集卷第四十六熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正準詔言事伏見一作臣伏見所採一作年來伏思一作臣伏思惟善一作蓋善其少此下一有也字敢言一作敢曰漢武好用兵一作漢武帝立功一作收功服遼一作破遼威振夷狄一作威加四海房杜一作王魏房杜欲贍軍則常患無財用一作欲贍軍冨國則常患無財今朝一作方今外一事之不集此上一有而字十年不問此下一有蓋字皆當斬罪一作法皆當斬所謂賞所一作是言其一二言一作舉造作二字上一有蓋字則不責功則一作此王尋等以百萬之兵兵一作師九千人九一作六苻堅以百萬之兵兵一作衆只用三千人用字下一有兵字愈少一作為少破賊一作破虜不當七八萬當一作得勑勵勑一作飭至於無人可用至於一作以至授之一作授以賢豪一作英豪漢武好一作昔漢武帝好勒兵一作耀兵勑勵勑一作督仲尼曰一作語曰豈無材智之臣一作非無材智之人動拘舊例拘一作循糾舉之術一作糾案之法寬緩容姦緩一作縱天文變一作天災見於外一作其外事勢一作事理右言事書凡一作者皆江鈿文海本疑是𥘉稿不若集本之善故難盡從姑擲其大槩如此後人亦可推公改定之意矣
