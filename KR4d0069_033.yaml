  text: 居士集卷第三十三歐陽文忠公集三十三
  hash: sha256:a1619db0c641df508d7891586304f043beafb4a009c9695e9a29a424d7b96bc3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_033-1a}
body:
  text: 墓志四首尚書工部郎中充天章閣待制許公墓志銘并序公諱元字子春姓許氏宣州宣城人也許氏世以孝謹稱鄉里其父亡一子當官兄弟相讓久之曰吾弟材後必庇吾宗乃以公輔郊社齋郎徙居海陵力耕以飬其母調明州定海劒州順昌縣尉泰州軍事推官戍兵千人自海上亡歸州守聞變不知所為公為詰其所以來二三人出前對公叱左右執之曰惑衆者此爾其餘何罪勞其徒而遣之遷鎮東軍節度推官知潤州丹陽縣縣有練湖決水一寸為漕渠一尺故法盜決湖者罪比殺人會歲大旱公請借湖水溉民田不待報決之州守遣吏按問公曰便民罪令可也竟不能詰由是溉民田萬餘項歲乃大豐再遷太子中舍監揚州博鹽和糴倉知泰州如臯縣所至民愛思之公為吏喜修廢壞其術長於治財自元昊叛河西兵出久無功而天下勞弊三司使言公材以主榷貨公言先時賈人入粟塞下京師錢不足以償故錢償愈不足則粟入愈少而價愈髙是謂內外俱困請髙塞粟之價下南鹽以償之使東南去滯積而西北之粟盈曰此輕重之術也行之果便是時京師粟少而江淮歲漕不給三司使懼大臣以為憂參知政事范仲淹謂公獨可辦乃以公為江淮兩浙荆湖發運判官公曰以六路七十二州之粟不能足京師者吾不信也至則治千艘浮江而上所過州縣留三月食其餘悉發而州縣之廩逺近以次相輔由是不數月京師足食既而嘆曰此可為於乏時然歲漕不給者有司之職廢也乃考故事明約信令發斂轉徙至於風波逺近遲速賞罰皆有法凡江湖數千里外談笑治之不擾不勞而用以足公𥘉以殿中丞為判官巳而為副為使每歲終會計來朝天子必加恩禮特賜進士出身官至工部郎中天章閣待制凡在職十有三年巳而曰臣憊矣願乞臣一州天子顧代公者難其人其請至八九久之察其實病且老矣乃以知揚州居歲餘徙知越州公益病又徙泰州至州未視事以嘉祐二年四月某日卒于家享年六十有九曾祖諱稠池州録事參軍祖諱規贈大理評事父諱逖尚書司封貟外郎贈工部侍郎公娶馮氏封崇德縣君先公卒子男二人長曰宗旦真州楊子縣主簿次曰宗孟守將作監主簿女一人適太常寺太祝滕希雅先是江淮歲漕京師者常六百萬石其後十餘歲歲益不充至公為之歲必六百萬而常餘百萬以備非常方其去職有勸公進為羡餘者公曰吾豈聚斂者哉敢用此以希寵公為人善談論與人交久而益篤於其家尤孝悌所得俸祿分給宗族無親踈之異其孤宗旦等以某年某月某日葬公於真州楊子縣甘露鄉之某原其所與遊廬陵歐陽修志於其墓曰嗚呼為天下者固常養材於無事之時蓋必有事然後材臣出自寶元慶曆以來兵動一方奔走從事於其間者皆號稱天下豪傑其智者出謀材者獻力訖不得少如其志而公遭此時用其所長且久於其官故得卒就其業而成此名此其可以書矣乃為之銘曰材難矣有藴而不得其時時逢矣有用而不盡其施功難成而易毀雖明哲或不能以自知公材之敏兮用適其冝志方甚壯兮力則先衰行著于家而勞施于國永幽其閟兮銘以哀之尚書刑部郎中充天章閣待制兼侍讀贈右諌議大夫孫公墓志銘公諱甫字之翰許州陽翟人也𥘉舉進士天聖五年得同學究出身為蔡州汝陽縣主簿八年再舉進士及第為一無此字華州觀察推官轉運使李紘薦其材遷大理寺丞知絳州翼城縣故丞相杜祁公與紘皆以清節自髙尤難於取士聞公紘所薦也數招致之一見大喜巳而祁公自御史中丞拜樞密直學士知永興軍辟公司録凡事之繁猥者一以委之公歎曰待我以此可以去矣祁公為謝顧事非他吏不能者不敢煩公公乃從容為陳當世之務所以緩急先後施設之冝又多薦士之賢而在下者於是祁公自以為得益友歲滿知彭州永昌縣監益州交子務再遷太常博士祁公為樞密副使薦于朝得祕閣校理是時諸將兵討靈夏久無功天下騷動盜賊數入州縣殺吏卒吏多失職而民弊矣天子方鋭意更用二三大臣乃極選一􆁏知名士增置諌貟使輔闕失公以右正言居諫院上好納諫諍未嘗罪言者而至言宫禁事他人猶須委曲開諷而公獨曰所謂后者正嫡也其餘皆猶婢爾貴賤有等用物不冝過僭自古寵女色𥘉不制而後不能制者其禍不可悔上曰用物在有司吾恨不知爾公曰世謂諫臣耳目官所以逹不知也若所謂前世女禍者載在書史陛下可自知也上深嘉納之保州兵變前有告者大臣不時發之公因力言樞密使副當得罪使乃杜祁公也邊將劉滬城水洛于渭州部署尹洙以滬違節度將誅之大臣稍主洙議公以謂水洛通秦渭於國家利滬不可罪由是罷洙而釋滬洙公平生所善者也公在諫院所言輔益尤多是三者其一人所難言其二人所難處者其後言宰相以某事當去者上亟為罷之因以陳執中為參知政事公又言執中不可用由是上難之公遂求解職於是小人不便大臣執政而朋黨之論起二三公相繼去位公亦在論中而辨諍愈切不自疑由是罷諫職以右司諫知鄧州徙知安州歷江南兩浙轉運使再遷兵部貟外郎改直史館知陜府又徙晉州河東轉運使公素羸性淡然寡所好欲恂恂似不能言而內徑果遇事精明議者謂公道德文學冝在朝廷備顧問而錢穀刀筆非其職然公處之益辦至臨疑獄滯訟常立得其情大賊張海郭貌山攻劫商鄧新破南陽順陽公安輯有方常曰教民知戰古法也乃親閲縣弓手教之擊射坐作皆為精兵盜賊為息陜當東西衝吏苦厨傳而前為守者顧毀譽不能有所損至公痛裁節之過客畏其清𥘉無所望而亦莫之毀也陜人賴以紓後遂以為法其為轉運使所至州縣視其職事修廢察其民樂否以此升黜官吏而不納毀譽遇下雖嚴而不害其在兩浙范文正公守杭州以大臣或便冝行事公曰范公貴臣也吾屈於此則不得伸於彼矣由是一切繩以法而常以監司自處范公遇公無倦色及退而不能無恨公遇范公不少下然退而未嘗不稱其賢也自河東召為度支副使勤其職不以為勞巳而得疾嘉祐元年遷刑部郎中天章閣待制河北都轉運使不行疾少間乃留侍讀公博學強記尤喜言唐事能詳其君臣行事本末以推見當時治亂每為人説如其身履其間而聽者曉然如目見故學者以謂終歲讀史不如一日聞公論也所著唐史記七十五卷論議宏贍書未及成以嘉祐二年正月戊戌卒于家享年六十公既卒詔取其書藏于祕府贈右諫議大夫又有文集七卷公喜接士務揚人善所得俸廩多所施與撫諸孤兒教育如已子曽祖諱恕博州堂邑主簿祖諱賁尚書庫部貟外郎考諱從革不仕以公貴纍贈都官郎中毋曰長安縣太君李氏娶程氏壽昌縣君子三人長曰冝滑州節度推官次曰實曰置皆將作監主簿女三人一適將作監主簿程著餘皆早亡以五年七月丁酉葬公于陽翟縣舊學鄉塢頭村之北原銘曰惟學而知方以行其義惟簡而無欲以遂其剛力雖弱兮志則強積之厚兮發也光冝壽兮奄以藏有深其泉兮有崇其岡永安其固兮百世無傷梅聖俞墓志銘并序嘉祐五年京師大疫四月乙亥聖俞得疾卧城東汴陽坊明日朝之賢士大夫往問疾者騶呼屬路不絶城東之人市者廢行者不得往來咸驚顧相語一作謂曰兹坊所居大人誰邪一作兹坊大人誰也何致客之多也居八日癸未聖俞卒於是賢士大夫又走弔二字一作共哭如前日益多而其尤親且舊者相與聚而謀其後事自丞相以下皆有以􅉠恤其家粵六月甲申其孤一作子增一無此字載其柩南歸以明年正月丁丑葬于某所一作宣州揚城鎮雙歸山聖俞字也其名堯臣姓梅氏宣州宣城人也一作姓梅氏名堯臣宣州人也自一無此字其家世頗一有皆字能詩而從一作叔父詢以仕顯至聖俞遂以詩聞自武夫貴戚童兒一作兒童野叟皆能道其名字雖妄愚人不能知詩義者直曰此世所貴也吾能得之用以自矜故求者日踵門而聖俞詩遂行天下其𥘉喜為清麗間肆平淡久則涵演深逺間亦琢刻以出怪巧然氣完力餘益老以徑其應於人者多故辭非一體至於他文章皆可喜非如唐諸子號詩人者僻固而狹陋也聖俞為人仁厚樂易未嘗忤於物至其窮愁感憤有所罵譏笑謔一發一有之字於詩然用以為歡而不怨懟可謂君子者也𥘉在河南一有時字王文康公見其文歎曰二百年無此作矣其後大臣屢薦冝在館閣嘗一召試賜進士出身餘輒不報嘉祐元年翰林學士趙槩等十餘人列言于朝曰梅某經行修明願得留與國子諸生講論道德為雅頌一作風雅以歌詠聖化乃得國子監直講三年冬祫干太廟御史中丞韓絳言天子且親祠當更制樂章以薦祖考惟梅某為冝亦不報聖俞𥘉以從父蔭補太廟齋郎歷桐城河南河陽三縣主簿以德興縣令知建德縣又知襄城縣監湖州鹽稅簽署忠武鎮安兩軍節度判官監永濟倉國子監直講纍官至尚書都官貟外郎嘗奏其所撰唐載二十六卷多輔正舊史闕繆乃命編修唐書書成未奏而卒享年五十有九曽祖諱逺祖諱邈皆不仕父諱讓太子中舍致仕贈職方郎中母曰仙遊縣太君束氏又曰清河縣太君張氏𥘉娶謝氏封南陽縣君再娶刀氏封某一作平恩縣君子男五人曰增曰墀曰坰曰龜兒一早卒女二人長適太廟齋郎薛通次尚幼聖俞學長於毛氏詩為小傳二十卷其文集四十卷注孫子十三篇余嘗論其詩曰世謂詩人少逹而多窮蓋非詩能窮人殆窮者而後工也聖俞以為知言銘曰不戚其窮不困其鳴不躓于艱不履于傾養其和平以發厥聲震越渾鍠衆聽以驚以揚其清以播其英以成其名以告諸冥江鄰幾墓志銘君諱休復字鄰幾其為人外若簡曠而內行修飭不妄動於利欲其強學博覽無所不通而一無此字不以矜人至有問輒應雖好辨者不能窮也巳則默若不能言者其為文章淳雅尤長於詩淡泊間逺往往造人之不至善隸書喜琴奕飲酒與人交久而益篤孝於宗族事孀姑如母天聖中與尹師魯蘇子美遊知名當時舉進士及第調藍山尉騎驢赴官每據鞍讀書至迷失道家人求得之乃覺歷信潞二州司法參軍又舉書判拔萃改大理寺丞知長葛縣事通判閬州以母喪去職服除知天長縣事遷殿中丞又以父憂終喪獻其所著書召試充集賢校理判尚書刑部當慶曆時小人不便大臣執政者欲纍以事去之君友蘇子美杜丞相壻也以祠神會飲得罪一時知名士皆𬒳逐君坐落職監蔡州商稅久之知奉符縣事改太常博士通判睦州徙廬州復得集賢校理判吏部南曹登聞檢一作鼓院為群牧判官出知同州提點陜西路刑獄入判三司鹽鐵句院修起居注纍遷刑部郎中君於治人則曰為政所以安民也無擾之而巳故所至民樂其簡易至辨疑折獄則或權以術舉無不得而不常用亦不自以為能也君所著書號唐冝鑒十五卷春秋世論三十卷文集二十卷又作神告一篇言皇嗣事以謂皇嗣國大事也臣子以為嫌而難言或言而不見納故假神告祖宗之意務為深切冀以感悟又嘗言昭憲太后杜氏子孫冝録用故翰林學士劉筠無後而官沒其資宜為立後還其資劉氏一有因字得不絶君之論議頗多凡與其遊者莫不稱其賢而在上位者久未之用也自其修起居注士大夫始相慶以為在上者知將用之矣而用君者亦方自以為得而君亡矣嗚呼豈非其命哉君以嘉祐五年四月乙亥以疾終于京師即以其年六月庚申葬于某所一作陽夏鄉之原君享年五十有六方其亡恙時為理一作治命數百言巳而疾且革其子問所欲言曰吾巳著之矣遂不復言曽祖諱濬殿中丞贈駕部貟外郎妣李氏始一作隆平縣太君祖諱日新駕部貟外郎贈太僕少卿妣孫氏冨陽縣太君考諱中古太常博士贈工部侍郎妣張氏仁壽縣太君夫人夏侯氏永安縣君金部郎中彧之女先君數月卒子男三人長曰懋簡并州司戶參軍次曰懋相太廟齋郎次曰懋迪女三人長適祕書丞錢衮餘尚幼君姓江氏開封陳留人也自漢轑陽侯德居於陳留之圉城其後子孫分散一作居而君世至今居圉城不去自髙祖而上七世葬圉南夏岡由大王父而下三世乃葬陽夏銘曰彼馳而我後彼取而我不豈用力者好先而知命者不苟嗟吾鄰幾兮卒以不偶舉世之隨兮君子之守衆人所亡兮君子之有其失一世兮其存不朽惟其自以為得兮吾將誰咎居士集卷第三十三熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正孫公墓銘未嘗罪言者五字上一有雖字冝壽兮冝字上脫仁字梅聖俞墓銘號詩人者一作號為詩人見其文文一作詩
