body:
  text: 墓志五首太子太師致仕杜祁公墓志銘故太子太師致仕祁國公贈司徒兼侍中杜公諱衍字世昌越州山隂人也其先本出於堯之後歷三代常為諸侯後徙其封于杜而子孫散適他國者以杜為氏自杜赫為秦將軍後三世御史大夫周及其子建平侯延年仍顯于漢又九世當陽侯預顯于晉又十有四世岐國公佑顯于唐又九世而至于祁公其為家有法其吉凶祭祀齋戒日時幣祝從事一用其家書自唐滅士喪其舊禮而一切苟簡獨杜氏守其家法不遷於世俗蓋自春秋諸侯之子孫歷秦漢千有餘歲得不絶其世譜而唐之盛時公卿家法存於今者惟杜氏公自曽髙以來以恭儉孝謹稱鄉里至公為人尤潔廉自剋一作刻其為大臣事其上以不欺為忠推於人以行己取信故其動靜纎悉謹而有法至考其大節偉如也一作至考其始終之大節雖古君子有不能及也其立於朝廷天下國家以為重退而老也久而天子益思之公享年八十官至尚書左丞方其六十有九歲且盡即上書告老明年以太子少師致仕纍遷太子太保太傅太師封祁國公於其家天子祀明堂遣使者召公陪祠將有所問以疾不至而歲時存問勞賜不絶公少舉進士髙第為揚州觀察推官知平遙縣通判晉州知乾州遷河東京西路提點刑獄知揚州河東陜西路轉運使入為三司戶部副使拜天章閣待制知荆南府未行以為河北路都轉運使遂知天雄軍召為御史中丞判流內銓知審官院拜樞密直學士知永興軍徙知并州遷龍圗閣學士復知永興軍權知開封府康定元年以刑部侍郎同知樞密院事即拜副使慶曆三年遷吏部侍郎樞密使明年以夲官同中書門下平章事公治吏事如其為人其聽獄訟雖明敏而審核愈精故屢決疑獄人以為神其簿書出納推析毫髮終日無倦色至為條目必使吏不得為姦而巳及其施於民者則簡而易行始居平遙嘗以吏事適他州而縣民爭訟者皆不肯決以待公歸知乾州未滿歲安撫使察其治行以公權知鳯翔府二邦之民爭於界上一曰此我公也汝奪之一曰今我公也汝何有焉夏人𥘉叛命天下苦於兵而自陜以西尤甚吏緣侵漁調發督迫至民破産不能足往往自經投水以死於是時公在永興語其人曰吾不能免汝然可使汝不勞爾乃為之區處計較量物有無貴賤道里逺近寬其期會使以次一作得次第輸送由是物不踴貴車牛芻秣宿食來往如平時而吏束手無所施民比他州費省十六七至於繕治城郭器械民皆不知開封治京師常撓於權要有干其法而能不為之屈者世皆以為難至公能使權要不敢有所干凡其為治以聽斷盜訟為能否爾獨公始有餘力省其民事如治他州而畿赤諸縣之民皆𬒳其惠開封比比出能吏而兼於民政者惟公一人吏部審官主天下吏貟而居職者類以不久遷去故吏得為姦公始視銓事一日選者三人爭某闕公以問吏吏受丙賕對曰當與甲乙不能爭遂一作乃授他闕居數日吏教丙訟甲負某事不當得公悟召乙問之乙謝曰業巳得他闕不願爭公不得巳與丙而笑曰此非吏罪乃吾未知銓法爾因命諸曹各具格式科條以白問曰盡乎曰盡矣明日勑諸吏無得升堂使坐曹聽行文書而巳由是吏不得與銓事與奪一出於公居月餘翕然聲動京師其在審官有以賄求官者吏謝不受曰我公有賢名不久見用去矣姑少待之慶曆之𥘉上猒西兵之久出而民弊亟用今丞相冨公樞密韓公及范文正公而三人者遂欲盡革衆事以修紀綱而小人權幸皆不恱獨公與相佐佑而公尤抑絶僥幸凡內降與恩澤者一切不與每積至十數則連封而靣還之或詰責其人至慙恨涕泣而去上嘗謂諫官歐陽修曰外人知杜某封還內降邪吾居禁中有求恩澤者每以杜某不可告之而止者多於所封還也其助我多矣此外人及杜某皆不知也然公與三人者卒皆以此罷去公多知本朝故實善決大事𥘉邉將議欲大舉以擊夏人雖韓公亦以為可舉公爭以為不可大臣至有欲以沮軍罪公者然兵後果不得出契丹與夏人爭銀甕族大戰黃河外而鴈門麟府皆警范文正公安撫河東欲以兵從公以為契丹必不來兵不可妄出范公怒至以語侵公公不為恨後契丹卒不來二公皆世俗指公與為朋黨者其論議之際蓋如此及三人者將罷去公獨以為不可遂一作故亦罷以尚書左丞知兖州歲餘乃致仕公自布衣至為相衣服飲食無所加雖妻子亦有常節家故饒財諸父分産公以所得悉與昆弟之貧者俸祿所入分給宗族賙人急難至其歸老無屋以居寓於南京驛舍者久之自少好學工書畫喜為詩讀書雖老不倦推獎後進今世知名士多出其門居家見賔客必問時事聞有善喜若已出至有所不可憂見於色或夜不能寐如任其責者凡公所以行之終身者有能履其一君子以為人之所難而公自謂不足以名後世遺戒子孫無得紀述嗚呼豈所謂任重道逺而為善惟日一無此字不足者歟曽祖太子少保一作師諱某贈太師祖鴻臚卿諱叔詹追封吳國公父尚書度支貟外郎諱遂良追封韓國公皆贈太師中書令兼尚書令娶相里氏封晉國夫人子男曰詵大理評事欣太常博士訥將作監主簿詒祕書省正字三子早卒女長適集賢校理蘇舜欽次適祕閣校理李綖次適單州團練推官張遵道公以嘉祐二年二月五日卒于家其子欣以其年十月十八日葬公于應天府宋城縣之仁孝原銘曰翼翼祁公率履自躬一其𥘉終惟德之恭公在干位士知貪廉退老于家四方之瞻豈惟士夫天子曰咨爾曲爾直繩之墨之正爾方圎有矩有規人莫之踰公無爾欺豫左豫右惟公是毗公雖告休受寵不巳宫臣國公即命于第奕奕明堂萬邦從祀豈無臣工為豫執法何以召之惟公舊德公不能來豫其往錫君子愷悌民之父母公雖百齡人以為少不俾黃耇喪豫元老寵祿之隆則有止期惟其不巳既去而思銘昭于逺萬世之詒太常博士尹君墓志銘并序君諱源字子漸姓尹氏與其弟洙師魯俱有名於當世其論議文章博學強記皆有以過人而師魯好辨果於有為子漸為人剛簡不矜飾能自晦藏與人居久而莫知至其一有所發則人必驚伏其視世事若不干其意巳而榷其情偽計其成敗後多如其言其性不能容常人而善與人交久而益篤自天聖明道之間豫與其兄弟交其得於子漸者如此其曾祖諱誼贈光祿少卿祖諱文化官至都官郎中贈刑部侍郎父諱仲宣官至虞部貟外郎贈工部郎中子漸𥘉以祖廕輔三班借職稍遷左班殿直天聖八年舉進士及第為奉禮郎纍遷太常博士歷知芮城河陽二縣簽署孟州判官事又知新鄭縣通判涇州慶州知懷州以慶曆五年三月十四日卒于官趙元昊冦邉圍定川堡大將葛懷敏發涇原兵救之君遺懷敏書曰賊舉其一無此字國而來其利不在城堡而兵法有不得而救者且吾軍畏法見敵必赴而不計利害此其所以數敗也冝駐兵瓦亭見利而後動懷敏不能用其言遂以敗死劉渙知滄州杖一卒不服渙命斬之以聞一作徇坐專殺降知密州君上書為渙論直得復知滄州范文正公常薦君材可以居館閣召試不用遂知懷州至期月大治是時天子用范文正公與今觀文殿學士冨公武康軍節度使韓公欲更置天下事而權幸小人不便三公皆罷去而師魯與時賢士多𬒳誣枉得罪君歎息憂悲發憤以一無此字謂生可厭而死可樂也往往𬒳酒哀歌泣下朋友皆竊怪之巳而以疾卒享年五十至和元年十有二月十三日其子材葬君于一作於河南府壽安縣甘泉鄉龍一作龕澗里其平生所為文章六十篇皆行於世子男四人曰材植機桴嗚呼師魯常勞其智於事物而卒蹈憂患以窮死若子漸者矌然不有纍其心而無所屈其志然其壽考亦以不長豈其所謂短長得失者皆非此之謂歟其所以然者不可得而知歟銘曰有韞于中不以施一憤樂死其如歸豈其志之將衰不然世果可嫉其如斯太子中舍梅君墓志銘故太子中舍致仕梅君諱讓字克讓世為宣城人常以文學仕進君獨不肯仕其弟詢勉之君曰士之仕也進而取榮祿易欲行其志而無愧於心者難吾豈不欲仕哉居其一無此字官不得行其志食其一無此字祿而有愧於其心者吾不為也今吾居父母之邦事長老以恭接朋友以信守吾墳墓安吾里閭以老死而無恨此吾志也其弟後貴顯必欲官之君堅不肯乃奏任君大理評事致仕于家有子六人曰堯臣曰正臣曰彥臣曰禹臣曰純臣其一早卒其三子皆仕宦而堯臣有名當世今為國子博士纍以郊祀恩進君為太子中舍君既老堯臣來歸朱服象笏侍君旁鄉人不榮其子而榮其父堯臣等皆以君年髙願留養君不許曰此非吾意也顧其二子曰勉爾朝夕以輔吾老顧其三子曰勉爾名譽以為吾榮居者養吾體仕者養吾志可也君享年九十有一一作二康強無恙以皇祐元年正月朔卒于家其子堯臣泣請於其友廬陵歐陽修曰堯臣不肖仕不顯而無聞不足以成吾先人之志退託文字以銘後世又不敢以自私豫乃為之一本上四字作子其為吾銘之銘曰志之充樂也一作乎中壽以隆福有終銘無窮耀幽宫湖州長史蘇君墓志銘并序故湖州長史蘇君有賢妻杜氏自君之喪布衣𬞞食居數歲提君之孤子斂其平生文章走南京號泣于其父曰吾夫屈於生猶可伸於死其父太子太師以告於豫豫為集次其文而序之以著君之大節與其所以屈伸得失以深誚世之君子當為國家樂育賢材者一有惜字且悲君之不幸其妻卜以嘉祐元年十月某日葬君于潤州丹徒縣義里鄉檀山里石門村又號泣于其父曰吾夫屈於人間猶可伸於地下於是杜公及君之子泌皆以書來乞銘以葬君諱舜欽字子美其上世居蜀後徙開封一有府字為開封人自君之祖諱易簡以文章有名太宗時承旨翰林為學士參知政事官至禮部侍郎父諱耆官至工部郎中直集賢院君少以父蔭輔太廟齋郎調滎陽尉非所好也巳而鎖其廳去舉進士中第改光祿寺主簿知蒙城縣丁父憂服除知長垣縣遷大理評事監在京樓店務君狀貌竒偉慷慨有大志少好古工為文章所至皆有善政官于京師位雖卑數上疏論朝廷大事敢道人之所難言范文正公薦君召試得集賢校理自元昊反兵出無功而天下殆一作怠於久安尤一作而困兵事天子奮然用三四大臣欲盡革衆弊以紓民於是時范文正公與今冨丞相多所設施而小人不便顧人主方信用思有以撼動未得其根以君文正公之所薦而宰相杜公壻也乃以事中君坐監進奏院祠神奏用市故𥿄錢會客為自盜除名君名重天下所會客皆一時賢俊悉坐貶逐然後中君者喜曰吾一舉網盡之矣其後三四大臣一有相字繼罷去天下事卒不復施為君携妻子居蘇州買水石作滄浪亭日益讀書大涵肆於六經而時發其憤悶於歌詩至其所激往往驚絶又喜行狎一作草書皆可愛故其雖短章醉墨落筆爭為人所傳天下之士聞其名而慕見其所傳而喜往揖其貌而竦聽其論而驚以服久與其居而不能捨以去也居數年復一作二年後得湖州長史慶曆八年十二月某日以疾卒于蘇州享年四十有一君先娶鄭氏後娶杜氏三子長曰泌將作監主簿次曰液曰激二女長適前進士陳紘次尚幼𥘉君得罪時以奏用錢為盜無敢辨其冤者自君卒後天子感悟凡所𬒳逐之臣復召用一有今字皆顯列于朝而至今無復為君言者冝其欲求伸於地下也冝豫述其得罪以死之詳而使後世知其有以也既又長言以為之辭庶幾并寫豫之所以哀君者其辭曰謂為無力兮孰擊而去之謂為有力兮胡不反子之歸豈彼能兮一作而此不為善百譽而不進兮一毀終世以顛擠荒孰問兮杳難知嗟子之中兮有韞而無施文章發耀兮星日光輝雖冥冥以掩恨兮不一作冝昭昭其永垂翰林侍讀侍講學士王公墓志銘并序公諱洙字原叔其生始能言巳知為詩指物一有輒字能賦既長學問自六經史記百氏之書至於圗緯隂陽五行律吕星官算法訓故字音一本上四字作方言訓詁篆隸八分無所不學學必通逹如其專家其語言𥘉如不出諸口已而辨别條理發其精微聽者忘倦決疑請益人人必得其所欲故自其少也一時名臣賢士皆稱慕之其名聲著天下𥘉舉進士為廬州舒城尉坐事免官歸居南京故相臨淄晏公為留守竒其文章待以客禮久之復調賀州冨川主簿未行臨淄公薦其才留居應天府學教諸生會一無此字詔舉經術士為學官京東轉運使舉公應詔召為國子監直講遷太理評事史館檢討知太常禮院天章閣侍講直龍圗閣同判太常寺慶曆中小人有不便大臣執政者欲排去之未知所發而杜丞相子壻蘇舜欽為集賢校理負時名所與交遊皆當世賢豪巳而舜欽坐監進奏院祠神會客為御史所彈公以一作預坐客貶知濠州徙知襄徐亳三州范文正公冨丞相皆言王某學問經術多識故事冝在朝廷復召為檢討同判太常寺侍講充史館修撰拜知制誥權判吏部流內銓至和元年九月為翰林學士三年以親嫌改侍讀學士兼侍講學士嘉祐二年九月甲戌朔以疾卒享年六十有一纍官至尚書吏部郎中階朝散大夫勳輕車都尉爵開國伯食邑五百戶公為人寬厚樂易孝於宗族信於朋友諸孤不能自立者皆為之嫁娶始舉進士時與郭稹同保人有告稹冒一有祖字母禫者法當連坐主司召公問果保稹否不然可易也公言保之不可易也於是與稹俱罷公以文儒進用能因其所學為上開陳其言緩而不迫天子常喜其説意有所欲必以問之無不能對嘗以塗金龍水箋為飛白詞林二字以褒之至於朝廷他有司前言故實皆就以考正既領太常吉凶禮典撰定尤多嘗修集韻校定史記前後漢書編國朝會要鄉兵制度祖宗故事三朝經武聖略皇祐中大享明堂翰林侍讀學士宋祁言明堂禮廢久必得通知古今之學者詔公共草其儀禮成撰大享明堂記又詔修雅樂晚喜隸書尤有古法著易傳十篇一無此五字其他一作所為文章千有餘篇其施於為政敏而有方襄州中廬戍兵驕前為守者患之不能制公至因事召之悉集于庭告曰某時為某事者非某人邪取其一二人一無此字置于法餘悉不問一有由是二字兵始知懼是時妖賊反貝州州縣無逺近皆警動佐吏勸公毋給州卒教習者真兵公笑曰是欲防亂乎此所以使人不安也在徐州遭歲大飢免民舟算緡使得糴旁郡而一有多字出公私米粟賑民所活尤多一作甚衆有司上其最一有為京東第一五字降詔書褒美一作奬諭其在朝廷多所論議遇人恂恂惟謹及既殁而考其言皆當世要一作大務公知制誥夏竦卒天子以東宫舊恩賜諡文獻公曰此僖祖皇帝諡也封還其目不為草辭因曰前有司諡王溥為文獻章得象為文憲字雖異而音同皆當改於是太常更諡竦文莊而溥得象皆易諡又嘗論宗戚近幸冒法干恩澤以亂刑賞又言天下民田稅不均而姦民逃亡有司失其常稅請用郭咨孫琳千步開方為均田法頒之州縣使因民訟稍稍均之可不擾而有司得復其常數近時選諌官御史有執政之臣嘗薦舉者皆以嫌不用公以謂士飭身勵行而大臣薦賢以報國以嫌廢一作置之是疑大臣而廢賢材不可及論河功邉食皆可施行方公病時八月開邇英閣侍臣並進講讀而公獨病一作不在天子思之遣使者問公疾少間否能起而為豫講邪既而公病篤以卒天子震悼賻恤加等贈給事中特賜諡曰文即以其年十月辛酉葬于應天府虞一作宋城縣之孟諸鄉土山原公應天宋城人也曽祖諱厚祖諱化贈太傅父諱礪贈太師中書令兼尚書令公𥘉娶董氏再娶胡氏皆先公卒又娶齊氏封髙陽郡君子男五人長曰叟臣早卒次曰力臣太常寺太祝次欽臣祕書省正字次陟臣將作監主簿次曽臣某官一無二字一女適太常博士陳安道銘曰惟王氏之先逺自三代下迄戰國商周齊魏其後之人皆以王為氏故其為姓尤多於後世而太原之王出周王子公世可考實太原人後家于宋遂以蕃延惟其皇考是生八子公實其季其德克嗣播其休聲以顯于仕八支之盛名譽材賢公考朝廷儒學之臣退食于家詵詵子孫豈其不樂胡奪之年朝無咨詢士失益友送車國門出涕引首于兹歸藏刻銘不朽居士集卷第三十一熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正杜祁公墓志銘衢閩蜀本皆作娶相里氏司馬公記聞亦然惟羅氏并吉本以為李氏近歲吉州教授林仲熊遂入纂誤非也王文公墓志銘諸本皆作階朝奉大夫惟羅氏本作朝散大夫蘇長史墓志天下殆於久安二十三卷余襄公神道碑作怠於久安朝佐考公集怠逮殆三字似通用徐氏墓志吾母不以愛殆我穀城縣夫子廟記見者殆焉此亦以怠為殆也劉侍讀墓志殆今三十年祭丁學士文殆榮華之銷歇此則以逮為殆也諸本間有改者覽者以意讀之杜祁公墓志銘而三人者遂欲盡革衆事遂一作乃工書畫蓋心畫之畫一本以其用俗書畫字遂削去後有李端懿蔡襄墓志皆云工書畫蘇君墓銘太子太師此下一有祁國公三字文章一作文華所好一作其好
