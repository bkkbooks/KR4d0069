body:
  text: 書一上范司諫書月日具官謹齋沐拜書司諫學士執事前月中得進奏吏報云自陳州召至闕拜司諫即欲為一書以賀多事匆一作卒卒未能也司諫七品官爾於執事得之不為喜而獨區區欲一賀者誠以諫官者天下之得失一時之公議繫焉今世之官自九卿百執事外至一郡縣吏非無貴官大職可以行其道也然縣越其封郡逾其境雖賢守長不得行以其有守也吏部之官不得理兵部鴻臚之卿不得理光祿以其有司也若天下之失得生民之利害社稷之大計惟所見聞而不繫職司者獨宰相可行之諫官可言之爾故一有謂字士學古懷道者仕於時不得為宰相必為諫官諫官雖卑與宰相等天子曰不可宰相曰可天子曰然宰相曰不然坐乎廟堂之上與天子相可否者宰相也天子曰是諫官曰非天子曰必行諫官曰必不可行立殿陛之前與天子爭是非者諫官也宰相尊行其道諫官卑行其言言行道亦行也九卿百司郡縣之吏守一職者任一職之責宰相諫官繫天下之事亦任天下之責然宰相九卿而下失職者受責於有司諫官之失職也取譏於君子有司之法行乎一時君子之譏著之簡册一作册書而昭明垂之百世而不泯甚可懼也夫七品之官任天下之責懼百世之譏豈不重邪一作歟非材且賢者不能為也近執事始被召於陳州洛之士大夫相與語曰我識范君知其材也其來不為御史必為諫官及命下果然則又相與語曰我識范君知其賢也他日聞有立天子陛下直辭正色靣爭庭論者非他人必范君也拜命以來翹首企足佇乎有聞而卒未也竊惑之豈洛之士大夫能料於前而不能料於後也將執事有待而為也昔韓退之作爭臣論以譏陽城不能極諫卒以諫顯人皆謂城之不諫蓋有待而然退之不識其意而妄譏修獨以謂不然當退之作論時城為諫議大夫巳五年後又二年始庭論陸贄及沮裴延齡作相欲裂其麻才兩事爾當德宗時可謂多事矣授受失宜叛將強臣羅列天下又多猜忌進任小人於此之時豈無一事可言而須七年耶當時之事豈無急於沮延齡論陸贄兩事也謂宜朝拜官而夕奏疏也幸而城為諫官七年適遇延齡陸贄事一諫而罷以塞其責向使止五年六年而遂遷司業是終無一言而去也何所取哉今之居官者率三歲而一遷或一二歲甚者半歲而遷也此又非一可以待乎七年也今天子躬親庶政化理清明雖為無事然自千里詔執事而拜是官者豈不欲聞正議而樂讜言乎然今未聞有所言説使天下知朝廷有正士而彰吾君有納諫之明也夫布衣韋帶之士窮居草茅坐誦書史常恨不見用及用也又曰彼非我職不敢言或曰我位猶卑不得言矣又曰我有待是終無一人言也可不惜哉伏惟執事思天子所以見用之意懼君子百世之譏一陳昌言以塞重望且解洛之士大夫之惑則幸甚幸甚與郭秀才書僕昨以吏事至漢東秀才見僕於叔父家以啓事二篇偕門刺先進自賔階拜起旋辟甚有儀坐而語諾甚謹讀其辭溫密華富甚可愛視秀才待僕之意甚勤而禮也古人之相見必有歡欣交接之誠而不能逹乃取羔羊雉鶩之類致其意為贄而先既致其意又恥其無文則以虎豹之皮繢畫之布以飾之然後意逹情接客既贄而主人必禮以答之為陳酒殽幣篚壺矢燕樂之具將其意又為賦詩以陳其情今秀才好學甚精博記書史務為文辭不以羔禽皮布為飾獨以言文其身而其贄既美其意既勤矣宜秀才責僕之答厚也僕既無主人之具以為禮獨為秀才賦詩女曰雞鳴之卒章曰知子之來之雜佩以贈之取其知客之來豫儲珩璜琚瑀之美以送客雖無此物猶言之以致其意厚也僕誠無此物可謂空言之爾秀才年且少貌厚色揚志鋭學敏因進其業修其辭暴練緝織之不已使其文采五色潤澤炳鬱若贄以見當世公卿大人非惟若僕空言以贈也必有分庭而禮加籩豆實幣篚延為上賔者惟勉之不巳與張秀才第一書棐修頓首致書秀才足下前日辱以詩賦雜文啓事為贄披讀三四不能輒休足下家籍河中為鄉進士精學勵行嘗巳選於里升於府而試於有司矣誠可謂彼邦之秀者歟然士之居也遊必有友學必有師其鄉必有先生長者府縣必有賢守長佐吏彼能為足下稱才而述美者宜不少矣今乃越數百里犯風霜千一作好大國望官府下首於閽謁者以道一作通姓名趨走拜伏於人之階廡間何其勤勞乎豈由心負其所有而思以一發之邪將顧視其鄉之狹陋不足自廣而謂夫大國多賢士君子可以奮揚而光逺之邪則足下之來也其志豈近而求豈小邪得非磨光濯色計之熟卜之吉而後勇決以來邪今市之門旦而啓商者趨焉賈者坐焉持寶而欲價者之焉賫金而求寶者亦之焉間民無資攘臂以遊者亦之焉洛陽天下之大市也來而欲價者有矣坐而為之輕重者有矣豫居其間其官位學行無動人也是非可否不足取信也其亦無資而攘臂以遊者也今足下之來試其價既就於可以輕重者矣而反以及豫夫以無資者當求價之責雖知貪於所得而不知有以為價也故辱賜以來且慙且喜既不能塞所求以報厚意姑道此以為謝與張秀才第二書修頓首白秀才足下前日去後復取前所貺古今雜文十數篇反復讀之若大節賦樂古太古曲一作典等篇言尤髙而志極大尋足下之意豈非閔世病俗究古明道欲拔今以復之古而翦剝齊整凡今之紛殽駮冗者歟然後益知足下之好學甚有志者也然而述三皇太古之道捨近取逺務髙言而鮮事實此少過也君子之於學也務為道為道必求知古知古明道而後履之以身施之於事而又見於文章而發之以信後世其道周公孔子孟軻之徒常履而行之者是也其文章則六經所載至今而取信者是也其道易知而可法其言易明而可行及誕者言之乃以混蒙虛無為道洪荒廣略為古其道難法其言難行孔子之言道曰道不逺人言中庸者曰率性之謂道又曰可離非道也春秋之為書也以成隱讓而不正之傳者曰春秋信道不信邪謂隱未能蹈道齊侯遷衛書城楚丘與其仁不與其專封傳者曰仁不勝道凡此所謂道者乃聖人之道也此履之於身施之於事而可得者也豈如誕者之言者耶堯禹之書皆曰若稽古傅説曰事不師古匪説攸聞仲尼曰吾好古敏以求之者凡此所謂古者其事乃君臣上下禮樂刑法之事又豈如誕者之言者邪此君子之所學也夫所謂捨近而取逺云者孔子曰疑生周之世去堯舜逺孰與今去堯舜逺也孔子刪書斷自堯典而弗道其前其所謂學則曰祖述堯舜如孔子之聖且勤而弗道其前者豈不能邪蓋以其漸逺而難彰不可以信後世也今生於孔子之絶後而反欲求堯舜之巳前世所謂務髙言而鮮事實者也二字一作云者唐虞之道為百王首仲尼之歎曰蕩蕩乎謂髙深閎大而不可名也及夫二典述之炳然一作如使後世尊崇仰望不可及其嚴若天然則書之言豈不髙邪然其事不過於親九族平百姓憂水患問臣下誰可任以女妻舜及祀山川見諸侯齊律度謹權衡一有斗斛飾字使臣下誅放四罪而巳孔子之後惟孟軻最知道然其言不過於教人樹桑麻畜雞豚以謂養生送死為王道之本夫二典之文豈不為文孟軻之言道豈不為道而其事乃世人之甚易知而近者蓋切於事實而已今學者不深本之乃樂誕者之言思混沌於古初以無形為至道者無有高下逺近使賢者能之愚者可勉而至無過不及而一本乎大中故能亘萬世可行而不變也今以謂不足為而務髙逺之為勝以廣誕者無用之説是非學者之所盡心也宜少下其高而近其逺以及乎中則庶乎至矣凡僕之所論者皆陳言淺語如足下之多聞博學不宜為足下道之也然某之所以云者本一作卒欲損足下髙逺而俯就之則安一作又敢務為竒言以自髙邪幸足下少思焉與石推官第一書修頓首再拜白公操足下前歲於洛陽得在鄆州時所寄書卒然不能即報遂以及今然其勤心未必若書之怠而獨不知公操察不察也修來京師已一歲也宋州臨汴水公操之譽日與南方之舟至京師修少與時人相接尤寡而譽者無日不聞若幸使盡識舟上人則公操之美可一作何勝道哉凡人之相親者居則握手共席道歡欣既别則問疾病起居以相為憂者常人之情爾若聞如足下之譽者何必問其他乎聞之欣然亦不減握手之樂也夫不以相見為歡樂不以疾病為憂問是豈無情者乎得非相期者在於道爾其或有過而不至于道者乃可為憂也近於君子之於學是而巳不聞為異也好學莫如揚雄亦曰如此然古之人或有稱獨行而髙世者考其行亦不過乎君子但與世之庸人不合爾行非異世蓋人不及而反棄之舉世斥以為異者歟及其過聖人猶欲就之於中庸況今書前不師乎古後不足以為來者法雖天下皆好之猶不可為況天下皆非之乃獨為之何也是果好異以取高歟然嚮謂公操能使人譽者豈其履中道秉常德而然歟抑亦昂然自異以驚世人而得之歟古之教童子者立必正聽不傾常視之母誑勤謹乎其始惟恐其見異而惑也今足下端然居乎學舍以教人為師而反率然以自異顧學者何所法哉不幸學者皆從而效之足下又果為獨異乎今不急止則懼他日有責後生之好怪者推其事罪以奉歸此修所以為憂而敢告也惟幸察之不宣同年弟歐陽某頓首第二書修頓首白公操足下前同年徐君行因得寓書論足下書之怪時僕有妹居襄城喪其夫匍匐將往視之故不能盡其所以云者而略陳焉足下雖不以僕為狂愚而絶之復之以書然果未能諭僕之意非足下之不諭由僕聽之不審而論之之略之過也僕見足下書久矣不即有云而今乃云者何邪始見之疑乎不能書又疑乎忽而不學夫書一藝爾人或不能與忽不學時不必論是以默默然及來京師見二像石本及聞説者云足下不欲同俗而力為之如前所陳者是誠可諍矣然後一進其説及得足下書自謂不能與前所聞者異然後知所聽之不審也然足下於僕之言亦似未審者足下謂世之善書者能鍾王虞柳不過一藝已之所學乃堯舜周孔之道不必善書又云因僕之言欲勉學之者此皆非也夫所謂鍾王虞柳之書者非獨足下薄之僕固亦薄之矣世之有好學其書而恱之者與嗜飲茗閲畫圖無異但其性之一僻爾豈君子之所務乎然至於書則不可無法古之始有文字也務乎記事而因物取類為其象故周禮六藝有六書之學其點畫曲直皆有其説揚子曰斷木為棊梡革為鞠亦皆有法焉而況書乎今雖隸字已變於古而變古為隸者非聖人不足師法然其點畫曲直猶有準則如毋母彳人之相近易之則亂而不可讀矣今足下以其直者為斜以其方者為圎而曰我第行堯舜周孔之道此甚不可也譬如設饌於案加帽於首正襟而坐然後食者此世人常爾若其納足於帽反衣而衣坐乎案上以飯實酒巵而食曰我行堯舜周孔之道者以此之於世可乎不可也則書雖末事而當從常法不可以為怪亦猶是矣然足下了不省僕之意凡僕之所陳者非論書之善不但患乎近怪自異以惑後生也若果不能又何必學僕豈區區勸足下以學書者乎足下又云我實有獨異於世者以疾釋老斥文章之雕刻者此又大不可也夫釋老惑者之所為雕刻文章薄者之所為足下安知世無明誠質厚君子之不為乎足下自以為異是待天下無君子之與已同也仲尼曰後上可畏安知來者之不如今也是則仲尼一言不敢遺天下之後生足下一言待天下以無君子此故所謂大不可也夫士之不為釋老與不雕刻文章者譬如為吏而不受貨一作祿財蓋道當爾不足恃以為賢也屬久苦小疾無意思不宣某頓首答西京王相公書月日某謹齋沐頓首復書于相公閣下所遣使二十一日至許州獲賜書一通伏讀周復且慚且悸修幸得僃下吏承寵光日趨走于前竊慕古人堂下一言之獻思有所陳而恨愚無識不足自效徒抱區區之心者有日矣昨以初去府輒因奏記陳己踈淺一作賤得蒙大君子休德之幸以為離去眷戀之辭既有次第臨治以來施政之善者顧寮吏宜有助而暗懦獨無能之過以為謝因又妄思一言之獻以畢曩時區區之心以為忠懇又輒贊德美願廣功業益休問以為禱其誠雖勤其言狂惑猶即蓍龜之神而再三黷宜其拒以不應伏蒙相公不即棄絶猶辱以書條陳曉諭以為寵若其為賜也厚矣然伏讀求繹似有未察其誠者敢一終其説以逃責焉某聞古之為政者必視年之豐凶年凶則節國用振民窮姦盜生爭訟多而其政繁年豐民樂然後休息而簡安之以復其常此善為政者之術而禮典之所載也凡某前所陳者亦不過如是而已其意謂夫乘凶年之後災沴消息風雨既時耕種既得常平之粟既出而民有食關西之運既重至而軍不乏不旱不蝗下民樂利天子不憂慮能如是然後務大體簡細事而已豈有直以鎮俗一作雅救民愁無為置軍食之説邪伏惟詳而察之昔者孔子嘗為委吏必曰稱其職而已蓋苟守其官不敢慢其事而思其他伏惟相公所賜之書有居官不出位之言有以見君子用心也然某之所陳非謂略一邦之小而不為須四海之廣而後施以棄職而越思也蓋願乎進德廣業思以致君而及天下不以一邦而止既禱且勸之辭也噫士之至賤敢以言干其上者有三焉不量輕重之勢不度貴賤之位必爭以理而後止者此直士也蒙德思報不計善否務罄其誠而言者此知義之士也其言乖謬不合道理問不及而自僣者此狂士三字一作狂者也然直士之言雖逆意宜思而擇報德之言雖善原其心之所來宜容而納狂者之言既狂矣宜不足與之辨某士之賤者敢有干而云者於斯三者有其二焉伏惟相公擇之納之不足與之辨而絶之惟所賜焉投時相書某不佞疲軟不能強筋骨與工人田夫坐市區服畎畝為力役之勞獨好取古書文字考尋前世以來聖賢君子之所為與古之車旗服器名色等數以求國家之治賢愚之任至其炳然而精者時亦穿蠧盜取飾為文辭以自欣喜然其為道閎深肆大非愚且迂能所究及用功益精力益不足其勞反甚於市區畎畝而其所得較之誠有不及焉豈勞力而役業者成功易勤心而為道者至之難歟欲悔其所難而反就其易則復慙聖人為山一簣止焉之言不敢叛棄故退失其小人之事進不及君子之文茫然其心罔識所嚮若棄車川遊漫於中流不克攸濟回視陸者顧瞻徨徨然復思之人之有材能抱道德懷智慮而可自肆於世者雖聖與賢未嘗不無不幸焉禹之偏枯卻克之跛丘明之盲有不幸其身者矣抱關擊柝恓惶奔走孟子之戰國揚雄之新室有不幸其時者矣少焉而材學焉而不回賈誼之毁仲舒之禁錮雖有其時有不幸其偶者矣今以六尺可用之軀生太平有道之世無進身毀罪之懼是其身時偶三者皆幸於古人之所有者獨不至焉豈天之所豫不兩足歟亦勉之未臻歟伏惟明公履道懷正以相天下上以承天子社稷之大計下以理公卿百職之宜賢者任之以能不賢者任之以力由士大夫下至於工商賤技皆適其分而收其長如修之愚既不足任之能亦不堪任以力徒以常有志於學也今幸以文字試於有司因自顧其身時偶三者之幸也不能默然以自羞謹以所業雜文五軸贄閽人以俟進退之命焉外集卷第十六奏議卷第十六歐陽文忠公集一百十二翰苑乞與尹􅌟一官狀嘉祐四年右臣等伏見故起居舍人直龍圖閣尹洙文學議論為當世所稱忠義剛正有古人之節𥘉蒙朝廷擢在館閣而能不畏權臣力排衆黨以論范仲淹事遂坐貶黜其後元昊僣叛用兵一方當國家有西顧之憂思得材謀之臣以濟多事而洙自初出師至於元昊納欵始終常在兵間比一時之人最為宣力而群邪醜正誣􅌟百端卒陷罪辜流竄以死嚮蒙陛下仁聖恩憐哀其冤枉特賜清雪俾復官資足以感勤群心勸勵忠義今洙孤幼並在西京家道屢空衣食不給洙止一男􅌟年方十餘歲􅑏然無依實可嗟惻伏見將來祫享大禮在近群臣皆得奏蔭子孫伏望聖慈録洙遺忠憫洙不幸特賜其子一官庶霑寸祿以免飢寒則天地之仁幽顯蒙德臣等忝列侍從愧無獻納苟有所見不敢不言謹具狀奏聞伏候勑旨舉丁寶臣狀同前右臣竊見太常丞湖州監酒務一作稅丁寶臣前任知端州日因遭儂智髙事停官敘理監當方智髙攻劫嶺南州縣例以素無備禦官吏各至奔逃如一作兼聞當時獨寶臣曽捉得智髙探事人便行斬決及曽鬪敵朝廷以其如此故他人皆奪兩官獨寶臣只奪一官以此見其比衆人情理之輕臣伏見寶臣履行清純頗有官業惟海賊遽至力屈致敗出於不幸今者伏遇祫享恩赦欲望聖慈特與不候監當滿任牽復官資就移一親民差遣如後犯入已贓臣甘當同罪謹具奏聞伏候勑旨乞免舉臺官劄子嘉祐四年臣近凖勑為見闕臺官下學士院令臣與孫抃等同共保舉兩人聞奏者伏以學士之職置自有唐初以文辭供奉人主其後漸見親信至於朝廷機密及大除拜每𬒳詢訪皆與參決當時居是職者選擇既精信任亦重下至五代莫不皆然國朝遵用唐制尤重其任自比年以來選用之際時容繆濫職以人廢官以人輕往時臺官闕人只命學士一貟獨舉今乃令三人共舉若以為俱可信則一貟足以公舉若以為俱不可信則雖衆舉亦豈為得人若以為有可信有不可信者則自宜捨不可信者專委可信者其不可信者既不稱職罷黜之可也以臣思之朝廷所以遽改舊制而學士不足取信皆由用非其人如臣是也今在院學士三貟孫抃胡宿各曽獨舉臺官朝廷嘗所取信惟臣未曽舉人伏念臣材識庸暗不能知人使臣隨衆署名則臣實為耻欲三人所見皆一則理必不能欲望聖慈免臣共舉却依舊制只命學士一貟專舉況孫抃胡宿嘗曽舉官可以不疑如以臣為不可獨任乞候將來續有臺官貟闕更不差臣專舉非敢避事直以任非其才不足取信致煩朝廷改更舊制以此不敢不言今取進止論許懷德狀嘉祐五年右臣今月初四日當直準內降許懷德讓恩命表一道撰批答臣勘會昨來許懷德祫享加恩自合兩表陳讓只曽投進一表批答後更不曽進第二表稽停至今四十餘日制書留在閣門既不受命又不陳讓直至今來移鎮方於讓表內因帶引敘前來祫享加恩乞併寢二命蓋懷德以祫享例加恩命為輕所以更無表讓却於今來表內因帶敘陳其前來恩制久巳稽留不讓不受顯是輕侮朝廷違慢君命閣門無所申舉臺司風憲亦無彈糾況懷德身是將臣職典禁衛敢此違廢國家典制罪大不恭其批答臣未敢撰辭乞下所司勘劾懷德正以典刑庶肅朝綱以戒不恪謹具狀奏聞伏候勑旨再論許懷德狀同前臣竊以謂治天下在明號令正朝廷在修紀綱號令所行紀綱所振由人主有賞罰之柄也若號令出而不從紀綱弛而不整又不以賞罰臨之而欲正朝廷治天下臣不知其可也今者陛下親祀宗廟不敢獨受其福推恩群臣遍及中外此聖德之至深厚也而臣下輒敢有所輕重以謂例恩泛及視以為輕而慢之原其情理其可恕乎方祫享始畢恩典推行命出之日宰相押班百官在列宣揚制誥布告天下而將臣偃蹇不肯受命稽停制書四十餘日有司無所申舉恬然不以為怪是陛下號令不能行於朝廷而紀綱弛壞於武士凡士之知治體者皆為陛下惜也臣謂方今國家全盛天下無虞非有強臣悍將難制之患而握兵之帥輒敢如此不畏朝廷者蓋由從前不惜事體因循寬弛有以馴致也今若又不正其罪罰而公為縱弛則恐朝廷失刑自此而始武臣驕慢亦自此而始號令不行於下紀綱遂壞於上亦自此而始夫古人所謂見於未萌者智之明也若事有萌而能杜其漸者又其次也若見其漸而興之浸成後患者深可戒也臣前日為許懷德事曽有奏論略陳大槩蓋以方今賞罰之行只據簿書法令以從事而罕思治體況如懷德在法非輕於事體又重故臣復罄愚瞽伏乞聖慈裁擇而行之論茶法奏狀嘉祐五年右臣伏見朝廷近改茶法本欲救其弊失而為國誤計者不能深思逺慮究其本末惟知圖利而不圖其害方一二大臣鋭於改作之時樂其合意倉卒輕信遂決而行之令下之日猶恐天下有以為非者遂直詆好言之士指為立異之人峻設刑名禁其論議事既施行而人知其不便者十蓋八九然君子知時方厭言而意殆一無二字不肯言小人畏法懼罪而不敢言今行之踰年公私不便為害既多而一二大臣以前者行之太果令之太峻勢既難回不能遽改而士大夫能知其事者但騰口於道路而未敢顯言於朝廷幽逺之民日𬒳其患者徒怨嗟於閭里而無由得聞于天聽陛下聰明仁聖開廣言路從前容納輔益尤多今一旦下令改事先為峻法禁絶人言中外聞之莫不嗟駭語曰防民之口甚於防川川壅而潰傷人必多今壅民之口已踰年矣民之𬒳害一作患者亦已衆矣古不虛語於今見焉臣亦聞方一作𥘉改法之時商議已定猶選差官數人分出諸路訪求利害然則一二一作二三大臣不惟𥘉無害民之意實亦未有自信之心但所遣一作使之人既一無此字見朝廷必欲更改不敢沮議又志在希合以求功賞傳聞所至州縣不容一作用吏民有所陳述直云朝廷意在必行但來一無此字要一審狀爾果如所傳則誤事者在此數人而已一無二字蓋𥘉以輕信於人施行太果今若明見其害救失何遲患莫大於遂非過莫深乎不改臣於茶法本不詳知但外論既喧聞聽漸熟古之為國者庶人得謗於道商旅得議於市而士得傳言於朝正為此也臣竊聞議者謂茶之新法既行而民無私販之罪歲省刑人甚多此一利也然而為害者五焉江南荆湖兩浙數路之民舊納茶稅今變租錢使民破産亡家怨嗟愁苦不可堪忍或舉族而逃或自經而死此其為害一也自新法既用小商所販至少大商絶不通行前世為法以抑豪商不使過侵國利與為僣侈而已至於通流貨財雖三代至治猶分四民以相利養今乃斷絶商旅此其為害二也自新法之行稅茶路分猶有舊茶之稅而新茶之稅絶少年歲之間舊茶稅盡新稅不登則頓虧國用此其為害三也往時官茶容民入雜故茶多而賤遍行天下今民自買賣須要真茶真茶不多其價遂貴小商不能多販又不暇逺行故近茶之處頓食貴茶逺茶之方向去更無茶食此其為害四也近年河北軍糧用見錢之法民入米於州縣以鈔算茶於京師三司為於諸埸務中擇近上埸分特留八處專應副河北入米之人翻鈔算請今埸務盡廢然猶有舊茶可算所以河北和糴日下未妨竊聞自明年以後舊茶當盡無可算請則河北一和糴實要見錢不惟客旅得錢變轉不動兼亦自京師歲歲輦錢於河北和糴理必不能此其為害五也一利不足以輔五害今雖欲減放租錢以救其弊此得寬民之一端爾然未盡公私之利害也伏望聖慈特詔主議之臣不護前失深思今害黜其遂非之心無襲弭謗之迹除去前令許人獻説亟加詳定精求其當庶幾不失祖宗之舊制臣冒禁有言伏待罪責謹具狀奏聞伏候勑旨李燾長編説五害處止是節文仍改變轉不動一句為艱於移用論監牧劄子嘉祐五年臣所領羣牧司近準宣差吳中復王安石王陶等同共相度監牧利害事竊以國馬之制置自祖宗歲月既深官司失守積習成弊匪止一時前後因循重於改作今者幸蒙朝廷因言事之官有所陳述選差臣寮相度更改臣以謂監牧之設法制具存條目既繁弊病亦衆若秖坐案文籍就加增損恐不足以深革弊源如欲大為更張創立制度則凡於利害難以遙度必須目見心曉熟於其事然後可以審詳裁制果決不疑蓋謀於始也不精則行於後也難久況此是臣本職豈敢辭勞欲乞權暫差臣仍於吳中復等三人內更差一人與臣同詣左右廂監牧地頭躬親按視至於土地廣狹水草善惡歲時孳牧吏卒勤惰以至牝牡種類各隨所宜棚井溫涼亦有便否嚮何以致馬之耗減今何以得馬之蕃滋既詳究其根源兼旁采於衆議如此不三數月間可以周遍然後更將前後臣寮起請與衆官參詳審處與其坐而遙度倉卒改更其為得失不可同日而論也臣又竊思今之馬政一有者字皆因唐制而今馬多少與唐不同者其利病甚多不可悉一作槩舉至於唐世牧地皆與馬性相宜西起隴右金城平涼天水外暨河曲之野內則岐豳涇寧東接銀夏又東至於樓煩皆一作此唐養馬之地也以今考之或陷沒夷狄或巳為民田皆不可復得惟聞今一作惟今之河東一有路字嵐石之間山荒甚多及汾河之側草地亦廣其間草軟水甘最宜牧養往時河東軍馬常在此處牧放今馬數全少間地極多此乃唐樓煩監地也可以興置一監臣以謂推迹而求之則天池元池三監之地尚冀可得又臣往年因奉使河東嘗行威勝以東及遼州平定軍見其不耕之地甚多而河東一路山川深峻水草甚佳其地髙寒必宜馬性及京西唐汝之間久荒之地其數甚廣欲乞更下河東京西轉運司差官就近於轄下訪求草地有可以興置監牧處如稍見次第即乞朝廷差官與羣牧司官員同共往彼踏行擘畫若可以興置新監則河北諸監內有地不宜馬處却可議行廢罷惟估馬一司利害最為易見若國家廣捐金帛則劵馬利厚來者必多於其多中時得好馬若有司惜費則蕃部利薄馬來漸少兼亦好馬不來然而招誘之方事非一體亦須知其委曲欲乞特差羣牧司或禮賔院官一貟直至秦州以來體問蕃部劵馬利害凡此三者雖暫差官比及吳中復等檢閲本司文字講求商議未就之間巳各來復可以參酌相度庶不倉卒輕為改更如允臣所請乞賜施行今取進止一作國馬之制置自祖宗嵗月既深官失其守積習成弊匪止一時伏覩詔書命奎等商度利害將有更革臣以謂監牧之設法制具存條日既繁其弊亦衆若止坐案文籍就加增損恐不足以深革弊源如欲大為更張創立制度則凡於利害難以遙度蓋謀於始也不精則行於後也難久請詔相度官一人同臣躬按左右廂監牧凡土地廣狹水草善惡歲時孳牧吏卒勤墮以至牝牡種類各隨所宜棚井溫涼亦有便否嚮何以致馬之耗減今何以得馬之蕃滋詳究根源旁采衆議然後以比日臣寮奏請參詳審處與其坐而遙度倉卒改更其為得失不可同日而論也臣又竊思今之馬政皆因唐制而今馬多少與唐不同者其利病甚多不可槩舉至於唐世牧地皆與馬性相宜西起隴右金城平涼天水外暨河曲之野內則歧豳涇寧東接銀夏又東至於樓頌此唐養馬之地也以今考之或陷沒夷狄或已為民田皆不可復得惟聞今河東路嵐石之間山荒甚多及汾河之側草地亦廣其間草軟水甘最宜養牧此乃唐樓煩監地也可以興置一監臣以謂推迹而求之則樓煩元池天池三監之地尚冀可得又臣往年奉使河東嘗行威勝以東及遼州平定軍見其不耕之地甚多而河東一路山川深峻水草甚佳其地髙寒必宜馬性及京西路唐汝之間久荒之地其數甚廣請下河東京西轉運司遣官訪草地有可以興置監牧則河北諸監有地不宜馬可行廢罷至於估馬一司利害易見若國家廣捐金帛則劵馬利厚來者必多若有司惜費則蕃部利薄馬來寖少然而招誘之方事非一體請遣羣牧司或禮賔院官一人至邊訪蕃部劵馬利害以此三者參酌商議庶不倉卒輕為改更以上乃通鑑長編所載與集本頗異舉章望之曽鞏王回等充館職狀同前右臣猥以庸虛過蒙獎任竊惟古人報國之效無先薦賢雖知人之難愧於不廣而髙材實行亦莫多得苟有所見其敢默然臣竊見祕書省校書郎章望之學問通博文辭敏麗不急仕進行義自修東南士子以為師範太平州司法參軍曽鞏自為進士已有時名其所為文章流布逺邇志節髙爽自守不回前亳州衛真縣主簿王回學行純固論議精明尤通史傳姓氏之書可備顧問此三人者皆一時之秀宜𬒳朝廷樂育之仁而或廢處江湖或沉淪州縣不獲聞逹議者惜之其章望之曽鞏王回臣今保舉堪充館閣職任欲望聖慈特賜甄擢如後不如舉狀臣甘當同罪謹具狀奏聞伏候勑旨舉蘇軾應制科狀嘉祐五年右臣伏以國家開設科目以待俊賢又詔兩省之臣舉其所知各以聞逹所以廣得人之路副仄席之求臣雖庸暗其敢不勉臣伏見新授河南府福昌縣主簿蘇軾學問通博資識明敏一作姿識敏明文采爛然論議蜂出其行業修飭名聲甚逺臣今保舉堪應材識兼茂明於體用科欲望聖慈召付有司試其所對如有繆舉臣甘伏朝典謹具狀奏聞伏候勑旨免進五代史狀同前右臣準中書劄子為知制誥范鎮等奏乞取臣五代文草付唐書局繕寫上進事伏念臣本以孤拙初無他能少急養親遂學干祿勉作舉業以應所司自忝竊於科名不忍忘其素習時有妄作皆應用文字至於筆削舊史褒貶前世著為成法臣豈敢當往者曽任夷陵縣令及知滁州以負罪謫官間僻無事因將五代史試加輔緝而外方難得文字檢閲所以銓次未成昨自還朝便蒙差在唐書局因之無暇更及私書是致全然未成次第欲候得外任差遣庶因公事之暇漸次整緝成書仍復精加考定方敢投進冀於文治之朝不為多士所誚謹具狀奏聞伏候勑旨論刪去九經正義中讖緯劄子臣伏見國家近年以來更定貢舉之科以為取士之法建立學校而勤養士之方然士子文章未純節行未篤不稱朝廷勵賢興善之意所以化民成俗之風臣愚以謂士之所本在乎六經而自暴秦焚書聖道中絶漢興收拾亡逸所存無幾或殘編斷簡出於屋壁而餘齡昏眊得其口傳去聖既逺莫可考證偏學異説因自名家然而授受相傳尚有師法暨晉宋而下師道漸亡章句之篇家藏私畜其後各為箋傳附著經文其説存亡以時好惡學者茫昧莫知所歸至唐太宗時始詔名儒撰定九經之疏號為正義凡數百篇自爾以來著為定論凡不本正義者謂之異端則學者之宗師百世之取信也然其所載既博所擇不精多引讖緯之書以相雜亂怪竒詭僻所謂非聖之書異乎正義之名也臣欲乞特詔名儒學官悉取九經之疏刪去讖緯之文使學者不為怪異之言惑亂然後經義純一無所駮雜其用功至少其為益則多臣愚以謂欲使士子學古勵行而不本六經欲學六經而不去其詭異駮雜欲望功化之成不可得也伏望聖慈下臣之言付外詳議今取進止議一有新字學狀嘉祐元年右臣等伏見近日言事之臣為陛下言建學取士之法者衆矣或欲立三舍以養生徒或欲復五經而置博士或欲但舉舊制而修廢墜或欲特創新學而立科條其言雖殊其意則一陛下慎重其事下其議於群臣而議者遂欲創新學立三舍因以辨士之能否而命之以官其始也則教以經藝文辭其終也則取以材識德行聽其言則甚備考於事則難行夫建學校以養賢論材德而取士此皆有國之本務而帝王之極致也而臣等謂之難行者何哉蓋以右今之體不同而施設之方皆異也古之建學取士之制非如今之法也蓋古之所謂為政與設教者遲速異宜也夫立時日以趨事考其功過而督以賞罰者為政之法也故政可速成若夫設教則以勸善興化尚賢勵俗為事其𬒳於人者漸則入於人也深收其效者遲則推其功也逺故常緩而不迫古者家有孰黨有庠遂有序國有學自天子諸侯之子下至國之俊選莫不入學自成童而學至年四十而仕其習乎禮樂之容講乎仁義之訓敦乎孝悌之行以養父兄事長上信朋友而臨財廉處衆讓其修於身行於家逹于鄰里聞于鄉黨然後詢於衆庶又定於長老之可信者而薦之始謂之秀士久之又取其甚秀者為選士久之又取其甚秀者為俊士久之又取其甚秀者為進士然後辨其論隨其材而官之夫生七八十嵗而死者人之常壽也古乃以四十而仕蓋用其半生為學考行又廣察以鄰里鄉黨而後其人可知然則積德纍善如此勤而久求賢審官如此慎而有次第然後矯偽干利之士不容於其間而風俗不陷於偷薄也古之建學取士其施設之方如此也方今之制以貢舉取人往者四歲一詔貢舉而議者患於太遲更趣之為間歲而應舉之士來學於京師者類皆去其鄉里逺其父母妻子而為旦暮干祿之計非如古人自成童至于四十就學於其庠序而鄰里鄉黨得以衆察徐考其行實也蓋古之養士本於舒遲而今之取人患於急迫此施設不同之大槩也臣請詳言方今之弊既以文學取士又欲以德行官人且速取之歟則真偽之情未辨是朝廷本欲以學勸人修德行一有而字反以利誘人為矯偽此其不可一也若遲取之歟待其衆察徐考而漸進則文辭之士先已中於甲科而德行之人尚未登於內舍此其不可二也且今入學之人皆四方之遊士齎其一身而來烏合群處非如古人在家在學自少至長親戚朋友鄰里鄉黨衆察徐考其行實也不過取於同舍一時之毀譽而決於學官數人之品藻爾然則同學之人蹈利爭進愛憎之論必分朋黨昔東漢之俗尚名節而黨人之禍及天下其始起於處士之橫議而相訾也此其不可三也夫人之材行若不因臨事而見則守常循理無異衆人苟欲異衆則必為迂僻竒怪以取德行之名而髙談虛論以求材識之譽前日慶曆之學其弊是也此其不可四也今若外方專以文學貢士而京師獨以德行取人則實行素履著於鄉曲而守道丘園之士皆反見遺此其不可五也近者朝廷患四方之士寓一有籍字京師者多而不知其士行遂嚴其法使各歸於鄉里今又反使來聚於京師云欲考其德行若不用四方之士一作人止取京師之士則又示人以不廣此其不可六也夫儒者所謂能通古今者在知其意逹其理而酌時之宜爾大抵古者教學之意緩而不迫所以勸善興化養賢勵俗在於遲久而不求近效急功也臣謂宜於今而可行者立為三舍可也復五經博士可也特創新學雖不若即舊而修廢然未有甚害創之亦可也教學之意在乎敦本一作在於敦本教學之意而修其實事給以糇糧多陳經籍選士之良者以通經有道之士為之師而舉一作謹察其有過無行者黜去之則在學之人皆善士也然後取以貢舉之法待其居官為吏已接於人事可以考其賢善優劣而時取其尤出類者旌異之則士知修身力行一作士修其行非為一時之利而可伸於終身則矯偽之行不作而偷薄之風歸厚矣此所謂實事之可行於今者也臣等伏見論學者四人其説各異而朝廷又下臣等俾之詳定是欲盡衆人之見而採其長者爾故臣等敢陳其所有以助衆議之一非敢好為異論也伏望聖慈特賜裁擇奏議卷第十六議學狀賢善善字疑此卷薦蘇軾應制科云行業修飾案説文以修為飾以修為脯篇韻修兼訓長故公字永叔今文集多以修為修不敢輕改者蓋當時集古録千卷皆有公之名印視其篆文乃從攸從彡未嘗從月而漢武帝策董仲舒亦云何修何飾古字簡少殆可通用公亦嘗全用此句非如後人之拘也監牧考異仁宗實録嘉祐四年公以翰林學士兼群牧使明年七月言者謂馬政不舉當有更革壬子命吳奎吳中復王安石王陶同相度利害八月奎等乞以監牧市馬就委陜西漕臣薛向措置而不及公之姓名考公奏劄云臣所領群牧司準宣差中復安石陶等同共相度利害又明年公入樞府復奏云昨差中復等與臣共議並不及壬子命奎之旨公以兼職固當與三人同議無待降旨然何為獨不及奎今李燾長編載奎等請如公奏而實録有奎奏無公奏長編雖有公奏而比集中所載更改至四百餘字其間有云伏覩詔書命奎等商度利害而集本元無此語姑以長編所改附注其下當考居士集卷第十六歐陽文忠公集十六論三首或問一首附正統論三首序論臣修頓首死罪言伏見太宗皇帝時嘗命薛居正等撰梁唐一作後唐晉漢周事為五代史凡一百五十篇又命李昉等編次前丗年號為一篇一作卷藏之祕府而昉等以梁為偽梁為一無此字偽則史不冝為帝紀一本有而後唐之事當續劉昫唐史為一書或比二漢離為前後二十二字一前一作先而一作則亦無曰五代者於理不安今又一作又今司天所用崇天曆承後唐書天祐至十九年而盡黜梁所建號援之於古惟張軌不用東晉太興而虛稱建興非可以為後丗法蓋後唐務惡梁一有甚字而欲黜之歷家不識古義但用有司之傳遂不復改至於昉等𥘉非著書第採次前丗名號以備有司之求因舊之失不專是正乃與史官戾不相合皆非是臣愚因以謂正統王者所以一民而臨天下三代用正朔後丗有建元之名然自漢以來學者多言三代正朔一作改正朔之事而怪仲尼嘗修尚書春秋與其學徒論述堯舜三代間事甚詳而於正朔尤大事乃獨無明言頗疑三代無有其事及於春秋得十月隕霜殺菽二月無冰推其時氣乃知周以建子為正一有月字則三代固嘗改正朔而仲尼曰行夏之時又知聖人雖不明道正朔之事其意蓋非商周之為云其興也新民耳目不務純以德而更易虛名至使四時與天不合不若夏時之正也及秦又以十月為正漢始稍分後元中元至于建元遂名年以為號由是而後一無此四字而有太𥘉之元年復用夏正其後遂不復改十五字直以建元之號加於天下而已所以同萬國而一民也而後丗推次以為王者相繼之統若夫上不戻於天下可加於人則名年建元便於三代之改歲然而後丗僭亂假竊者多則名號紛雜不知所從於是正閏真偽之論作而是非多失其中焉然堯舜三代之一天下也不待論説而明自秦昭襄訖周顯德千有餘年治亂之迹不可不辨而前丗論者靡有定説伏惟大宋之興統一天下與堯舜三代無異臣故曰不待論説而明謹採秦以來訖于顯德終始興廢之迹作正統論臣愚不足以知願下學者考定其是非而折中焉正統論上傳曰君子大居正又曰王者大一統正者所以正天下之不正也統者所以合天下之不一也由不正與不一然後正統之論作堯舜之相傳三代之相代或以至公或以大義皆得天下之正合天下於一是以君子不論也其帝王之理得而始終之分明故也及後丗之亂僭偽興而盜竊作由是有居其正而不能合天下於一者周平王之有吳徐是也有合天下於一而不得居其正者前丗謂秦為閏是也由是正統之論興焉自漢而下至于西晉又推而下之為宋齊梁陳自唐而上至於後魏又推而上之則為夷狄其帝王之理舛而始終之際不明由是學者疑焉而是非又多不公自周之亡迄于顯德實千有二百一十六年之間或理或亂或取或傳或分或合其理不能一槩大抵其可疑之際有三周秦之際也東晉後魏之際也五代之際也秦親得周而一天下其迹無異禹湯而論者黜之其可疑者一也以東晉承西晉則無終以隋承後魏則無始其可疑者二也五代之所以得國者雖異然同歸於賊亂也而前丗議者獨以梁為偽其可疑者三也夫論者何為疑者設也堯舜三代之始終較然著乎萬丗而不疑固不待論而明也後丗之有天下者帝王之理或舛而始終之際不明則不可以不疑故曰由不正與不一然後正統之論作也然而論者衆矣其是非豫奪所持者各異使後丗莫知夫所從者何哉蓋於其一作其於可疑之際又挾自私之心而溺一作入於非聖之學也自西晉之滅而南為東晉宋齊梁陳北為後魏北齊後周隋私東晉者曰隋得陳然後天下一則推其統曰晉宋齊梁陳隋私後魏者曰統必有所受一作授下同則推其統曰唐受之隋隋受之後周後周受之後魏至其甚相戾也則為南史者詆北曰虜為北史者詆南曰夷此自私之偏説也自古王者之興必有盛德以受天命或其功澤被于生民或纍丗積漸而成王業豈偏名於一德哉至於湯武之起所以救弊拯民蓋有不得已者而曰五行之運有休王一以彼衰一以此勝此歷官術家之事而謂帝王之興必乘五運者繆妄之説也不知其出於何人蓋自孔子殁周益衰亂先王之道不明而人人異學肆其怪竒放蕩之説後之學者不能卓然奮力而誅絶之反從而附益其説以相結固故自秦推五勝以水德自名由漢以來有國者未始不由於此説此所謂溺於非聖之學也惟天下之至公大義可以祛人之疑而使人不得遂其私夫心無所私疑得其決則是非之異論息而正統明所謂非聖人之説者可置而勿論也正統論下凡為正統之論者皆欲相承而不絶至其斷而不屬則猥以假人而續之是以其論曲而不通也夫居天下之正合天下於一斯正統矣堯舜夏商周秦漢唐是也始雖不得其正卒能合天下於一夫一天下而居上則是天下之君矣斯謂之正統可矣晉隋是也天下大亂其上無君僭竊並興正統無屬當是之時奮然而起並爭乎天下有功者強有德者王威澤皆被于生民號令皆加乎當丗幸而以大并小以強兼弱遂合天下於一則大且強者謂之正統猶有説焉不幸而兩立不能相并一作兼考其迹則皆正較其義則均焉則正統者將安豫奪乎東晉後魏是也其或終始不得其正又不能合天下於一則可謂之正統乎魏及五代是也然則有不幸而丁其時則正統有時而絶也故正統之序上自堯舜歷夏商周秦漢而絶晉得之而又絶隋唐得之而又絶自堯舜以來三絶而復續惟有絶而有續然後是非公豫奪當而正統明然諸儒之論至於秦及東晉後魏五代之際其説多不同其惡秦而黜之以為閏者誰乎是漢人之私論溺於非聖曲學之説者也其説有三不過曰滅棄禮樂用法嚴苛與其興也不當五德之運而巳五德之説可置而勿論其二者特始皇帝之事爾然未原秦之本末也昔者堯傳於舜舜傳於禹夏之衰也湯代之王商之衰也周代之王周之衰也秦代之王共興也或以德或以功大抵皆乘其弊而代之𥘉夏丗衰而桀為昏暴湯救其亂而起稍治諸侯而誅之其書曰湯征自葛是也其後卒以攻桀而滅夏及商丗衰而紂為昏暴周之文武救其亂而起亦治諸侯而誅之其詩所謂崇密是也其後卒攻紂而滅商推秦之興其功德固有優劣而其迹豈有異乎秦之紀曰其先大業出於顓頊之苗裔至孫伯翳佐禹治水有功唐虞之間賜姓嬴氏及非子為周養馬有功秦仲始為命大夫而襄公與立平王遂受岐豐之賜當是之時周衰固巳久矣亂始於穆王而繼以厲幽之禍平王東遷遂同列國而齊晉大侯魯衛同姓擅相攻伐共起而弱周非獨秦之暴也秦於是時既平犬夷因取周所賜𡵨豐之地而繆公以來始東侵晉地至于河盡滅諸戎拓國千里其後關東諸侯強僭者日益多周之國地日益蹙至無復天子之制特其號在爾秦昭襄王五十二年周之君臣稽首自歸於秦至其後丗遂滅諸侯而一天下此其本末之迹也其德雖不足而其功力尚不優於魏晉乎始秦之興務以力勝至於始皇遂悖棄先王之典禮又自推水德益任法而少恩其制度文為一作云為一作文章皆非古而自是此其所以見黜也夫始皇之不德不過如桀紂桀紂不廢夏商之統則始皇未可廢秦也其私東晉之論者曰周遷而東天下遂不能一然仲尼作春秋區區於尊周而黜吳楚者豈非以其正統之所在乎晉遷而東與周無異而今黜之何哉曰是有説焉較其德與迹而然耳周之始興其來也遠當其盛也規方天下為大小之國衆建諸侯以維王室定其名分使傳子孫而守之以為萬丗之計及厲王之亂周室無君者十四年而天下諸侯不敢僥幸而窺周於此然後見周德之深而文武周公之作真聖人之業也况平王之遷國地雖蹙然周德之在人者未猒而法制之臨人者未移平王以子繼父自西而東不出王畿之內一本注西周之地八百里東周六百里以井田之法計之通為千里之方則正統之在周也推其德與迹可以不疑夫晉之為晉與乎周之為周也異矣其德法之維天下者非有萬丗之計聖人之業也直以其受魏之禪而合天下於一推較其迹可以曰正而統耳自惠帝之亂一有晉政巳亡四字至于愍懷之間晉如線爾惟嗣君繼丗推其迹曰正焉可也建興之亡晉於是而絶矣夫周之東也以周而東晉之南也豈復以晉而南乎自愍帝死賊庭琅邪起江表位非嗣君正非繼丗徒以晉之臣子有不忘晉之心發於忠義而功不就可為傷巳若因而遂竊正統之號其可得乎春秋之説君弒而賊不討則以為無臣子也使晉之臣子遭乎聖人適當春秋之誅况欲干天下之統哉若乃國巳滅矣以宗室子自立於一方卒不能復天下於一則晉之琅邪與夫後漢之劉備五代漢之劉崇何異備與崇未嘗為正統則東晉可知焉耳其私後魏之論者曰魏之興也其來甚遠自昭成建國改元承天下衰弊得奮其力並爭乎中國七丗至于孝文而去夷即華易姓建都遂定天下之亂然後修禮樂興制度而文之考其漸積之基其道德雖不及於三代而其為功何異王者之興今特以其不能并晉宋之一方以小不備而黜其大功不得承百王之統者何哉曰質諸聖人而不疑也今為魏説者不過曰一作於功多而國強耳此聖人有所不與也春秋之時齊桓晉文可謂有功矣吳楚之僭迭強於諸侯矣聖人於春秋所尊者周也然則功與強聖人有所不取也論者又曰秦起夷狄以能滅周而一天下遂進之魏亦夷狄以不能滅一作并晉宋而見黜是則因其成敗而毀譽之豈至公之篤論乎曰是不然也各於其黨而已周秦之所以興者其説固已詳之矣當魏之興也劉淵以胸奴慕容以鮮卑符生以氐弋仲以羌赫連秃髮石勒季龍之徒皆四夷之雄者也其力不足者弱有餘者強其最強者符堅當堅之時自晉而外天下莫不為秦休兵革興學校庶幾刑政之方不幸未幾而敗亂其又強者曰魏自冮而北天下皆為魏矣幸而傳數丗而後亂以是而言魏者才優於苻堅而已豈能干正統乎五代之得國者皆賊亂之君也而獨偽梁而黜之者因惡梁者之私論也唐自僖昭以來不能制命於四海而方鎮之兵作已而小者并於大弱者服於強其尤強者朱氏以梁李氏以晉共起而窺唐而梁先得之李氏因之借名討賊以與梁爭中國而卒得之其勢不得不以梁為偽也而繼其後者遂因之使梁獨被此名也夫梁固不得為正統而唐晉漢周何以得之今皆黜之而論者猶以漢為疑以謂契丹滅晉天下無君而漢起太原徐驅而入汴與梁唐晉周其迹異矣而今乃一槩可乎曰較其心迹小異而大同爾且劉知遠晉之大臣也方晉有契丹之亂也竭其力以救難力所不勝而不能存晉出於無可奈何則可以少異乎四國矣漢獨不然自契丹與晉戰者三年矣漢獨髙拱而視之如齊人之視越人也卒幸其敗亡而取之及契丹之北也以中國委之許王從益而去從益之勢雖不能存晉然使忠於晉者得而奉之可以冀於有為也漢乃殺之而後入以是而較其心迹其異於四國者幾何矧皆未嘗合天下於一也其於正統絶之何疑或問或問子於史記本紀則不偽梁而進之於論正統則黜梁而絶之君子之信乎後丗者固當如此乎曰孔子固嘗如此也平桓莊之王於春秋則尊之書曰天王於詩則抑之下同於列國孔子之於此三王者非固尊於彼而抑於此也其理當然也梁賊亂之君也欲干天下之正統其為不可雖不論而可知然謂之偽則甚矣彼有梁之土地臣梁之吏民立梁之宗廟社稷而能殺生賞罰以制命於梁人則是梁之君矣安得曰偽哉故於正統則冝絶於其國則不得為偽者理當然也豈獨梁哉魏及東晉後魏皆然也堯舜桀紂皆君也善惡不同而巳凡梁之惡余於史記不沒其實者論之詳矣或者又曰正統之説不見於六經不道於聖人而子論之何也曰孔孟之時未嘗有其説則冝其不道也後丗不勝其説矣其是非豫奪人人自異而使學者惑焉莫知夫所從又有偏王一德之説而益之五勝之術皆非聖之曲學也自秦漢以來習傳久矣使孔孟不復出則巳其出而見之其不為之一辨而止其紛紛乎此余之不得巳也嗚呼堯舜之德至矣夏商周之起皆以天下之至公大義自秦以後德不足矣故考其終始有是有非而參差不齊此論之所以作也德不足矣必據其迹而論之所以息爭也或者又曰論必據迹則東周之時吳徐楚皆王矣是正而不統也子獨不論何也曰東周正統以其不待較而易知是以不論也若東晉後魏則兩相敵而豫奪難故不可以不論吳徐楚非周之敵雖童子之學猶知豫周也何必論哉居士集卷第十六熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正朝佐考正統論初有原正統明正統秦魏東晉後魏梁論凡七篇又有正統後論二篇或問一篇魏梁解一篇正統辨二篇當編定居士集時刪原正統等論為上下篇而繼以或問魏梁解魏梁解在第十七卷中餘篇雖削去而傳於丗今附外集正統序論以謂正統慶曆文粹統字下有者字正統論下秦起夷狄夷作戎符生皆當作苻姓也或問益之此下有以字
