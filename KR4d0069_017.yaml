body:
  text: 書二與范希文書修頓首再拜知郡學士希文足下自去歲在洛陽聞以言事出睦州及來京師又知移常州尋復得蘇州遷延南方歲且終矣南方美江山水國富魚與稻世之仕宦者舉善地稱東南然竊惟希文登朝廷與國論每顧事是非不顧自身安危則雖有東南之樂豈能為有憂天下之心者樂哉若夫登髙以望逺飲旨而食嘉所以宣輔神明亦君子起居寢食之宜也為别久矣所懷如何自古言事而得罪解當復用逺方久處省思慮節動作此非希文自重亦以為天下士君子重也謝希深學士丁家艱將謀南歸有少私事須託營辦因通區區之誠以問左右代人上王樞密求先集序書某月日具位某謹齋沐獻書樞密相公閣下某聞傳曰言之無文行而不逺君子之所學也言以載事而文以飾言事信言文乃能表見於後世詩書易春秋皆善載事而尤文者故其傳尤逺荀卿孟軻之徒亦善為言然其道有至有不至故其書或傳或不傳猶繫於時之好惡而興廢之其次楚有大夫者善文其謳歌以傳漢之盛時有賈誼董仲舒司馬相如揚雄能文其文辭以傳由此以來去聖益逺世益薄或衰下迄周隋其間亦時時有善文其言以傳者然皆紛雜滅裂不純信故百不傳一幸而一傳傳亦不顯不能若前數家之焯然暴見而大行也甚矣言之難行也事信矣須文文至矣又繫其所恃之大小以見其行逺不逺也書載堯舜詩載商周易載九聖春秋載文武之法荀孟二家載詩書易春秋者楚之辭載風雅漢之徒各載其時主一作王聲名文物之盛以為辭後之學者蕩然無所載則其言之不純信其傳之不久逺勢使然也至唐之興若太宗之政開元之治憲宗之功其臣下又爭載之以文其詞或播樂歌或刻金石故其間巨人碩德一作士閎言髙論流鑠前後者恃其所載之在文也故其言之所載者大且文則其傳也章言之所載者不文而又小則其傳也不章某不佞守先人之緒餘先人在太宗時以文辭為名進士以對策為賢良方正既而守道純正為賢待制逢時太平奮身揚名宜其言之所載文之所行大而可恃以傳也然未能甚行於世者豈其嗣續不肖不能繼守而泯沒之抑有由也夫文之行雖繫其所載猶有待焉詩書易春秋待仲尼之刪正荀孟屈原無所待猶待其弟子而傳焉漢之徒亦得其史臣之書其始出也或待其時之有名者而後發其既殁也或待其後之紀次者而傳其為之紀次也非其門人故吏則其親戚朋友如夢得之序子厚李漢之序退之也伏惟閣下學老文巨為時雄人出入三朝其能望光輝接步武者惟先君為舊則亦先君之所待也豈小子之敢有請焉謹以家集若干卷數寫獻門下惟哀其誠而幸賜之代楊推官洎上吕相公求見書某聞古者堯舜禹之為君也有臯夔益稷之徒者五字一作稷契者之徒為其臣而湯之王也亦有仲虺伊尹者周之始興也有周公召公其復一作後興也有方叔邵虎申一作山甫之徒下而至漢其初也功臣尤多而稱善相者曰蕭曹其後曰丙魏唐之始則曰房杜既而曰姚宋者是皆能以功德佐其君而卓然特以名出衆而見於世者夫詩書之所美莫大乎堯舜三代其後世之盛者莫盛乎漢與唐而其興也必有賢哲之臣出其際而能使其君之功業名譽赫然光顯於萬世而不泯故每一讀其書考其事量其功而想乎其人疑其瓌傑竒怪若神人然非如今世之人可得而識也夫其人巳亡其事巳久去數千百歲之後徒得其書而一讀之猶灼然如在人耳目之際使人希慕稱述之不暇況得身出二字一作生於其時親見其所為而一識其人則雖奔走俯伏從妾圉執鞭撲猶為幸歟某嘗誦於此而私自為恨者有日矣國家之興一有也字七十有五年矣禮樂文章可謂太平而傑然稱王公大人於世者往往而出凡士之得身出於斯時者宜為幸矣又何必忽近以慕逺違目而信耳且安知後之望今不若今之望昔者邪然其實有若不幸者某生也少賤而愚賤則不接乎朝廷之聞愚故不能與於事則雖有王公大人者並出而欲一往識之乃無一事可因而進焉噫古之君子在上不幸而不得出其間今之君子在上幸而親見矣又以愚賤見隔而莫可望焉是真可閔歎也巳然嘗獨念昔有聞於先君大夫者似有可以藉而為説以干進於左右者試一陳之先君之生也好學勤力以孤直不自進於時其晚也始登朝廷享榮祿使終不困其志而少伸者蓋實出於大君子之門則相公一有閣下二字之於楊氏不為無恩矣某不肖其一作莫能繼一作光大先君之世而又苟欲藉之以有緒於閽人誠宜獲罪於下執事者矣然而不詢於長者不謀於蓍龜而決然用是以自進者蓋冀萬一得償其素所願焉雖及門而獲罪不猶愈於望古而自為恨者邪言狂計愚伏惟聰明幸賜察焉與黃校書論文章書修頓首啓蒙問及丘舍人所示雜文十篇竊嘗覽之驚歎不巳其毁譽等數短篇尤為篤論然觀其用意在於策論此古人之所難工是以不能無小闕其救弊之説甚詳而革弊未之能至見其弊而識其所以革之者才識兼通然後其文博辨而深切中於時病而不為空言蓋見其弊必見其所以弊之因若賈生論秦之失而推古養太子之禮此可謂知其本矣然近世應科目文辭求若此者蓋寡必欲其一作至於極致則宜少加意然後煥乎其不可禦矣文章繫乎治亂之説未易談況乎愚昧惡能當此愧畏愧畏修謹白與髙司諫書修頓首再拜白司諫足下某年十七時家隨州見天聖二年進士及第榜始識足下姓名是時豫年少未與人接又居逺方但聞今宋舍人兄弟與葉道卿鄭天休數人者以文學大有名號稱得人而足下厠其間獨無卓卓可道説者豫固疑足下不知何如人也其後更十一年豫再至京師足下已為御史裏行然猶未暇一識足下之面但時時於豫友尹師魯問足下之賢否而師魯説足下正直有學問君子人也豫猶疑之夫正直者不可屈曲有學問者必能辨是非以不可屈之節有能辨是非之明又為言事之官而俯仰默默無異衆人是果賢者耶此不得使豫之不疑三字一作不疑之也自足下為諫官來始得相識侃然正色論前世事歷歷可聽褒貶是非無一謬説噫持此辨以示人孰不愛之雖豫亦疑足下真君子也是豫自聞足下之名及相識凡十有四年而三疑之今者推其實迹而較之然後決知足下非君子也前日范希文貶官後與足下相見於安道家足下詆誚希文為人豫始聞之疑是戲言及見師魯亦説足下深非希文所為然後其疑遂決希文平生剛正好學通古今其立朝有本末天下所共知今又以言事觸宰相得罪足下既不能為辨其非辜又畏有識者之責巳遂隨而詆之以為當黜是可怪也夫人之性剛果懦軟稟之於天不可勉強雖聖人亦不以不能責人之必能今足下家有老母身惜官位懼飢寒而顧利祿一作祿利不敢一忤宰相以近刑禍此乃庸人之常情不過作一不才諫官爾雖朝廷君子亦將閔足下之不能而不責以必能也今乃不然反昂然自得了無愧畏便毀其賢以為當黜庶乎飾已不言之過夫力所不敢為乃愚者之不逮以智文其過此君子之賊也且希文果不賢邪自三四年來從大理寺丞至前行員外郎作待制日日僃顧問今班行中無與比者是天子驟用不賢之人夫使天子待不賢以為賢是聰明有所未盡足下身為司諫乃耳目之官當其驟用時何不一為天子辨其不賢反默默一作然無一語待其自敗然後隨而非之若果賢邪則今日天子與宰相以忤意逐賢人足下不得不言是則足下以希文為賢亦不免責以為不賢亦不免責大抵罪在默默爾昔漢殺蕭望之與王章計其當時之議必不肯明言殺賢者也必以石顯王鳯為忠臣望之與章為不賢而被罪也今足下視石顯王鳯果忠邪望之與章果不賢邪當時亦有諫臣必不肯自言畏禍而不諫亦必曰當誅而不足諫也今足下視之果當誅邪是直可欺當時之人而不可欺後世也今足下又欲欺今人而不懼後世之不可欺邪況今之人未可欺也伏以今皇帝即位巳來進用諫臣容納言論如曹修古劉越雖殁猶𬒳褒稱今希文與孔道輔皆自諫諍擢用足下幸生此時遇納諫之聖主如此猶不敢一言何也前日又聞御史臺榜朝堂戒百官不得越職言事是可言者惟諫臣爾若足下又遂不言是天下無得言者也足下在其位而不言便當去之無妨他人之堪其任者也昨日安道貶官師魯待罪足下猶能以面目見士大夫出入朝中稱諫官是足下不復知人間有羞恥事爾所可惜者聖朝有事諫官不言而使他人言之書在史册他日為朝廷羞者足下也春秋之法責賢者備今某區區猶望足下之能一言者不忍便絶足下而不以賢者責也若猶以謂希文不賢而當逐則豫今所言如此乃是朋邪之人爾願足下直携此書于朝使正豫罪而誅之使天下皆釋然知希文之當逐亦諫臣之一效也前日足下在安道家召豫往論希文之事時坐有他客不能盡所懷故輒布區區伏惟幸察不宣修再拜與尹師魯第一書某頓首師魯十二兄書記前在京師相别時約使人如河上既受命便遣白頭奴出城而還言不見舟矣其夕及一作又得師魯手簡乃知留船以待怪不如約方悟此奴懶去而見紿臨行臺吏催苛百端不比催師魯人長者有禮使人惶迫不知所為是以又不留下書在京師但深託君貺因書道修意以西始謀陸赴夷陵以大暑又無馬乃作此行沿汴絶淮泛大江凡五千里用一百一十程才至荆南在路無附書處不知君貺曽作書道修意否及來此問荆人云去郢止兩程方喜得作書以奉問又見家兄言有人見師魯過襄州計今在郢久矣師魯歡戚不問可知所渴欲問者别後安否及家人處之如何莫苦相尤否六郎舊疾平否修行雖久然江湖皆昔所遊往往有親舊留連又不遇惡風水老母用術者言果以此行為幸又聞夷陵有米麵魚如京洛又有梨栗橘柚大筍茶荈皆可飲食益相喜賀昨日因參轉運作庭趨始覺身是縣令矣其餘皆如昔時師魯簡中言疑修有自疑之意者非他蓋懼責人太深以取直爾今而思之自決不復疑也然師魯又云暗於朋友此似未知修心當與髙書時蓋巳知其非君子發於極憤而切責之非以朋友待之也其所為何足驚駭路中來頗有人以罪出不測見弔者此皆不知修心也師魯又云非忘親此又非也得罪雖死不為忘親此事須相見可盡其説也五六十年來天生此輩沈默畏慎布在世間相師成風忽見吾輩作此事下至竈門一作間老婢亦相驚怪交口議之不知此事古人日日有也但問所言當否而已又有深相賞歎者此亦是不慣見事人也可嗟世人不見如往時事久矣往時砧斧鼎鑊皆是烹斬人之物然士有死不失義則趨而就之與几席枕藉之無異有義君子在傍見有就死知其當然亦不甚歎賞也史册所以書之者蓋特欲警後世愚懦者使知事有當然而不得避爾非以為竒事而詫人也幸今世用刑至仁慈無此物使有而一人就之不知作何等怪駭也然吾輩亦自當絶口不可及前事也居間僻處日知進道而巳此事不須言然師魯以修有自疑之言要知修處之如何故略道也安道與豫在楚州談禍福事甚詳安道亦以為然俟到夷陵寫去然後得知修所以處之之心也又常與安道言每見前世有名人當論事時感激不避誅死真若知義者及到貶所則戚戚怨嗟有不堪之窮愁形於文字其心歡戚無異庸人雖韓文公不免此纍用此戒安道慎勿作戚戚之文師魯察修此語則處之之心又可知矣近世人因言事亦有被貶者然或傲逸狂醉自言我為大不為小故師魯相别自言益慎職無飲酒此事修今亦遵此語咽喉自出京愈矣至今不曾飲酒到縣後勤官以懲洛中時懶慢矣夷陵有一路秖數日可至郢白頭奴足以往來秋寒矣千萬保重不宣修頓首同前某頓首自荆州得吾兄書後尋便西上十月二十六日到縣倐茲新年已三月矣所幸者老幼無恙老母舊不飲酒到此來日能飲五七杯隨時甘脆足以盡歡修之舊疾漸以失去亦能飲酒矣不知師魯為況如何到此便欲遣任進去又為少事且遣伊入京師於今未回前者於朱駕部處見手書略知動靜夷陵雖小縣然諍訟甚多而田契不明僻逺之地縣吏朴鯁官書無簿籍吏曹不識文字凡百制度非如官府一一自新齊整無不躬親又朱公以故人日相勞慰時時頗有宴集加以乍到閨門內事亦須自營開正以來始似無事治舊史前歲所作十國志蓋是進本務要卷多今若便為正史盡宜刪削存其大要至如細小之事雖有可紀非干大體自可存之小説不足以纍正史數日檢舊本因盡刪去矣十亦去其三四師魯所撰在京師時不曾細看路中昨來細讀乃大好師魯素以史筆自負果然河東一傳大妙修本所取法此傳為此外亦有繁簡未中願師魯亦刪之則盡妙也正史更不分五史而通為紀傳今欲將梁紀并漢周修且試撰次唐晉師魯為之如前歲之議其他列傳約略且將逐代功臣隨紀各自撰傳待續次盡將五代列傳姓名寫出分而為二分手作傳不知如此於師魯意如何吾等棄於時聊欲因此粗伸其心少希後世之名如修者幸與師魯相依若成此書亦是榮事今特告朱公遣介馳此奉咨且希一報如可以便各下手只候任進歸便令齎國志草本去次春寒保重同前慶曆五年春某頓首啓兩路地壤相接幸時文字往還然闕附狀蓋書生責以錢榖強其所不能自然公私不濟況其素懶於作書也然時聞師魯動止蘇子美事深欲論敘但避猶豫聞有極言乃知自信為是甚善甚善子美雖未亟復其如排沮羣議為益不少晉潞師魯少所樂遊其況如何春寒千萬保愛列傳人名便請師魯録取一本分定寄來不必以人死年月斷於一代但著功一代多者隨代分之所貴作傳與紀相應千萬遞中却告一信要知尊意同前慶曆四年某頓首啓始聞師魯徙晉乃駭然本初與郭推官計師魯必離渭而受晉命中道無所淹留徑之晉則謂於晉得相見既聞待闕至九月又計當入洛則謂於洛得相見又聞方留邠州有所陳來期未可知則謂遂不相見而東也及陜乃知直趨絳州修在絳阻雨數日苟更少留猶得道中相遇奈何前後相失如此尚欲留陜走人至解期一為會而大暑懼煩往復亦須三四日又不欲久在陜使郡人有館待之勞顧此勢不得留慶晉不足屑屑於胸中但向聞師魯有失子之苦時方走河東界道逺多事不暇奉慰修嘗失一五歲小兒已七八年至今思之痛若初失時修素謂諸君自為寡情而善忽世事者尚如此況師魯素自謂有情而子長又賢哉語及此雖修忽自不堪又欲進何説以解師魯心邪自西事巳來師魯之髮無黑者其不如意事多矣人生白首矣外物之能攻人者其類甚多安能尚甘於自苦邪得失不足計然雖歡戚勢既極亦當自有否泰惟不動心於憂喜非勇者莫能焉咫尺不相見又無以奉慰惟自寬自愛乃佳同前慶曆五年夏某頓首今春子漸兄云亡修在鎮陽半月後方知時又臥病草率走介託趙秉致奠云已之洛中矣苦事苦事修一春在外四月中還家則母病妻皆臥在牀又值沈四替去本司獨力出治公事入營醫藥才得清卿來即往德博視河功比還馬墜傷足至今行履未得以故久不及拜書為慰一寫朋友號呼之痛子漸平生所為世謂吉人君子者然人生固不可以善惡較夀夭吾徒所為天下之人嫉之者半故人相知不比他人易得失一人如他人之失百人也修往時意鋭性本真率近年經人事多於世俗間漸似耐煩惟於故人書問尚有逭慢之僻在因子漸亡追思數年不以一字往還遂至幽明永隔因此欲勉強於書尺益知交遊之難得為可惜也子漸為人不待縷述修自知之然其所為文章及在官有可記事相别多年不知子細望録示一本修於子漸不可無文字墓志或師魯自作則巳若不自作則須修與君謨當作蓋他平生相知深者吾二人與李之才爾縱不作墓志則行狀或他文字須作一篇也愁人愁人師魯知為士廉所訟仇家報怨不意亦聽而行此更不須較曲直他不足道也夏君來日詢他潞州事得動靜甚詳差慰夏熱千萬保重回丁判官書景祐三年九月十四日宣德郎守峽州夷陵縣令歐陽修謹頓首復書于判官祕校足下修之得夷陵也天子以有罪而不忍即誅與之一邑而告以訓曰往字吾民而無重前悔故其受命也始懼而後喜自謂曰幸而謂夷陵之不幸也夫有罪而猶得邑又撫安之曰無重前悔是以自幸也昔春秋時鄭詹自齊逃來傳者曰甚佞人來佞人來矣此不欲佞人入其邦而惡其來甚之一作之甚之辭也修之是行也以謂夷陵之官相與語於府吏相與語於家民相與語於道皆曰罪人來矣凡夷陵之人莫不惡之而不欲入其邦若魯國之惡鄭詹來者故曰夷陵不幸也及舟次江陵之建寧縣人來自夷陵首蒙示書一通言文意勤不徒不惡之而又加以厚禮出其意料之外不勝甚喜而且有不自遂之心焉夫人有厚已而自如者恃其中有所以當之而不愧也如修之愚少無師傳而學出已見未一發其藴忽發焉果輒得罪是其學不本實而其中空虛無有而然也今猶未獲一見君子而先辱以書待之厚意以空虛之質當甚厚之意竊懼既見而不若所待徒重愧爾且為政者之懲有罪也若不鞭膚刑肉以痛切其身則必擇惡地而斥之使其奔走顛躓窘苦左山右壑前虺虎而後蒺䔧動不逢偶吉而輒竒凶其狀可為閔笑所以深困辱之者欲其知自悔而改為善也此亦為政者之仁也故修得罪也與之一邑使載其老母寡妹浮五千五百之江湖冒大熱而履深險一有風波之􅩖則叫號神明以乞須臾之命幸至其所則折身下首以事上官吏人連呼姓名喝出使拜起則趨而走設有大會則坐之壁下使與州校役人為等伍得一食未徹俎而先走出上官遇之喜怒訶詰常斂手栗股以伺顔色冀一語之溫和不可得所以困辱之如此者亦欲其能自悔咎而改為善也故修之來也惟困辱之是期今乃不然獨蒙加以厚禮而不以有罪困辱之使不窮厄而得其所為以無重悔如前訓可謂幸矣然懼其頑心而不知自改也夫士窮莫不欲人之閔己然非有深仁厚義君子之閔矣疑則又懼且慙焉謹因弓手還敢市所懷不勝區區伏惟幸察外集卷第十七代楊推官上吕相公書伊尹者一無者字私自一作私以嘗獨念昔有聞於先君大夫者一作獨念昔者有聞於先君大夫與髙司諌書於豫友尹師魯問足下一作問豫友尹師魯以足下不可屈之節屈字下一有曲字不以賢者一作以不賢者與尹師魯第一書見有就死有一作其第二書五七杯一作七五杯第四書及陕一作及至陜回丁判官書自如一作自恕今乃一作乃今奏議卷第十七歐陽文忠公集一百十三樞府論均稅劄子嘉祐五年臣為諫官時嘗首言均稅事乞差郭咨孫琳蒙朝廷依臣所言起自蔡州一縣以方田法均稅事方施行而議者多言不便尋即罷之近者伏見朝廷特置均稅一司差官分往河北陜西均稅始聞河北傳言人户虛驚斫伐桑棗尚不為信次見陜西州郡有上言歲儉民飢乞罷均稅者稍巳疑此一事果為難行而朝廷之意決在必行言者遂不能入近者又見河北人户凡千百人聚訴於三司然則道路傳言與州郡上言雖為不足信其如聚集千人於京師此事不可掩蔽則民情可知矣蓋均稅非以規利而本以便民如此民果便乎竊知朝廷本只一作則以見在稅數量輕重均之𥘉不令其别生額外之數也近聞衛州通利軍括出民冒佃田土不於見在管催數內均減重者攤與冒佃户却别一無此字生立稅數配之此非朝廷本一作之意而民所以喧訴也又聞澶州諸縣一有於字見今實額管催數外將帳頭自來樁坐有名無納及一有夫字開閣將行一無二字兩項逺年稅數並係祥符景德已前以至五代長興年樁管虛數並攤與見今人户又聞以地肥瘠定為四等其下等田有白鹻帶鹹地并鹹鹵沙薄可殖地死沙不可一無此字殖地並一例均攤與稅數謂此雖不可耕種尚可煎鹽且河北之民自祖宗以來蒙賜恩恤放行鹽不一無此字禁只令據鹽斤兩納稅今煎鹽者已納鹽稅又令更納田稅豈祖宗所以惠河北之民意又聞河南不殖之地係禁鹽地分者亦均攤與稅又不知使一無此字民何以納也澶衛去京師近偶可聞知者如此其餘逺方一作地謂所均稅悉便於民其可得乎以此見朝廷行事至難小人希意承旨者言利而不言害俗吏貪功希賞見小利忘大害為國斂怨於民朝廷不知則巳苟巳知之其可不為救其失哉欲望聖慈特賜指揮令均稅所只如朝廷本議將實催見在稅數量輕重均之其餘生立稅數及逺年虛數却與放免及未均地分並且罷均且均稅一事本是臣先建言聞今事有不便臣固不敢緘默今取進止乞差檢討官校國史劄子嘉祐六年臣前為學士日兼充史館修撰竊見本院國史自進本入內後官守空司因具奏陳乞降付院收藏以備檢討尋準朝旨於龍圖閣寫本關送本院令修撰官躬親對讀修改其國史尋已寫了竊緣本院元有修撰官三員後來孫抃及臣相次别蒙差任今止有胡宿一員其未經對讀一有國史二字卷數尚多竊慮寫下多日闕官校對久不了當漸至因循欲乞添差檢討官三兩員同共對讀早令了當況檢討官檢閲本朝故事亦是本職仍乞不令漏泄今取進止論牧馬草地劄子嘉祐六年臣為學士日兼充群牧使朝廷以馬政久弊差吳中復等與臣共議利害欲有改一有更字為未見得牧地善惡多少難為廢置欲乞差官先且打量牧馬草地次臣遽蒙恩擢在樞府所有牧馬利害商量未了事件臣有愚見方欲條陳今聞諸監所差官各將前去竊緣監牧帳舊管一作管舊地甚多自來界至不明官私作弊積久為民間侵占耕種年歲已深昨已曽差髙訪等根括打量人户多稱父祖世業失却契書無慿照驗但追呼搔擾而已今若更行根究必亦難明徒為追擾未見其利民先𬒳害臣今欲乞令差去官只據見在草地逐䟝先打量的實頃畒明立封標界至因便相度其地肥瘠宜與不宜牧馬其廢置改更候逐官回日令相度牧馬所據利害擘畫申奏其巳為民間侵耕地土更不根究蓋以本議欲以見在牧地給與民耕豈可却根究巳耕之地重為搔擾至於民間養馬等事利害甚多臣當續具奏聞其不根究侵耕地土一事伏乞先賜指揮今取進止論臺諫官唐介等宜早牽復劄子嘉祐六年臣材識庸暗碌碌於衆人中蒙陛下不次拔擢置在樞府其於報效自宜如何而自居職以來已逾半歲凡事關大體必須衆議之協同其餘日逐進呈皆是有司之常務至於謀猷啓沃蔑爾無聞上辜聖恩下君不欲自聞其過而樂聞臣下之過人主好察多疑於上大臣側足畏罪於下於此之時諫人主者難而言大臣者易若寬仁恭儉之主動遵禮法自聞其失則從諫如流聞臣下之過則務為優容以保全之而為大臣者外秉國權內有左右之助言事者未及見聽而怨仇已結於其身故於此一有之字時諫人主者易言大臣者難此不可不察也自古人主之聽言也亦有難有易在知其術而已夫忠邪並進於前而公論與私言交入于耳此所以聽之難也若知其人之忠邪辨其言之公私則聽之易也凡言拙而直逆耳違意𥘉聞若可惡者此忠臣之言也言婉而順希旨合意𥘉聞若可喜者邪臣之言也至於言事之官各舉其職或當朝正色顯言于廷或連章列署共論其事言一出則萬口爭傳衆目共視雖欲為私其勢不可故凡明言于外不畏人知者皆公言也若非其言職又不敢顯言或密奏乞留中或面言乞出自聖斷不欲人知言有主名者蓋其言涉傾邪懼遭彈劾故凡隂有奏一有陳字而畏人知者皆挾私之説也自古人主能以此術知臣下之情則聽言易也伏惟陛下仁聖寬慈躬履勤儉樂聞諫諍容納直言其於大臣尤所優禮常欲保全終始思與臣下愛惜名節尤慎重於進退故臣謂方今言事者規切人主則易欲言大臣則難臣自立朝耳目所記景祐中范仲淹言宰相吕夷簡貶知饒州皇祐中唐介言宰相文彥博貶春州别駕至和𥘉吳中復吕景𥘉馬遵言宰相梁適並罷職出外其後趙抃范師道言宰相劉沆亦罷職出外前年韓絳言冨弼貶知蔡州今又唐介等五人言陳旭得罪自范仲淹貶饒州後至今凡二十年間居臺諫者多矣未聞有規諫人主而得罪者臣故謂方今諫人主則易言大臣則難陛下若推此以察介等所言則可知其用心矣昨所罷黜臺諫五人惟是從二字一作吕誨一有新進二字入臺未久其他四人出處本末迹狀甚明可以歷數也唐介前因言文彥博逺竄廣西煙瘴之地賴陛下仁恕哀憐移置湖南得存性命范師道趙抃並因言忤劉沆罷臺職守外郡連延數年然後一有來字復今三人者又以言樞臣罷黜然則介不以前蹈必死之地為懼師道與抃不以中滯進用數年為戒遇事必言得罪不悔蓋所謂進退一節終始不變之士也至如王陶者本出孤寒只因韓絳薦舉始得臺官及絳為中丞陶不敢內顧私恩與之爭議絳終得罪夫牽顧私恩人之常情爾斷恩以義非知義之士不能也以此言之陶可謂徇公滅私之臣矣此四人者出處本末之迹如此可以知其為人也就使言雖不中亦其情必無他議者或謂言事之臣好相朋黨動搖大臣以作威勢臣竊以謂不然至於去歲一無十一字韓絳言冨弼之時介與師道不與絳為黨乃與諸臺諫共論絳為非然則非相朋黨非欲動搖大臣可明矣臣固謂未可以此疑言事之臣也況介等此者雖為謪官幸蒙陛下寬恩各得為郡未至失所其可惜者斥逐諫臣非朝廷美事阻塞言路不為國家之利而介等盡忠守節未蒙憐察也欲望聖慈特賜召還介等置之朝廷以勸守節敢言之士則天下幸甚今取進止政府舉劉攽吕惠卿充館職劄子嘉祐六年臣伏見前廬州觀察推官劉攽辭學優贍履行修一作清謹記問該博可以備朝廷詢訪前真州軍事推官吕惠卿材識明敏文藝優通好古飭躬可謂端雅之士並宜置之館閣以副聖朝養育賢材之選臣以庸繆參聞政論無能報國敢舉所知其劉攽吕惠卿欲望聖慈俾充館閣之職如後不如舉狀臣甘同罪取進止論祠祭行事劄子嘉祐八年臣近準勑差祭神州地祇於北郊竊見有司行事不合典禮據開寶通禮當先引行事官於東壝門外道南北向立次引入壝門就壇東南位西向行事蓋即事有漸自外而入於禮為宜今却先引行事官於壇下卯階之側北向立次引東行向外就行事位由內而外乖背禮文臣遂於本院檢詳蓋是往年撰祀儀之時誤此一節今據祀儀四時及三一作土王五帝上辛祈穀春分祀九宫朝日髙禖孟夏雩秋分夕月仲秋祀九宫貴神季秋大享明堂冬至祀昊天臘蠟夏至祀皇地祇及孟冬祭神州地祇凡一十七祭並係大祀一例錯誤並合改正依開寶通禮兼禮生贊唱生踈多不依禮文臣伏見朝廷近年新製祭祀器服修飭壇壝務極精嚴而有司失傳行事之際於禮繆誤伏乞下禮院詳定依開寶通禮改正祀儀及教習禮生使依典禮以上副聖朝精嚴祀事之意今取進止論逐路取人劄子治平元年臣伏見近有臣寮上言乞將南省考試舉人各以路分糊名於逐路每十人解一人等事雖巳奉聖旨送兩制詳定臣亦有愚見合具敷陳竊以國家取士之制比於前世最號至公蓋纍聖留心講求曲盡以謂王者無外天下一家故不問東西南北之人盡聚諸路貢士混合為一而惟材是擇又糊名謄録而考之使主司莫知為何方之人誰氏之子不得有所憎愛薄厚於其間故議者謂國家科埸之制雖未復古法而便於今世其無情如造化至公如權衡祖宗以來不可易之制也傳曰無作聰明亂舊章又曰利不百者不變法今言事之臣偶見一端即議更改此臣所區區欲為陛下守祖宗之法也臣所謂偶見一端者蓋言事之人但見每次科埸東南進士得多而西北進士得少故欲改法使多取西北進士爾殊不知天下至廣四方風俗異宜而人性各有利鈍東南之俗好文故進士多而經學少西北之人尚質故進士少而經學多所以科埸取士東南多取進士西北多取經學者各因其材性一無二字所長而各隨其多少取之今以進士經學合而較之則其數均若必論進士則多少不等此臣所謂偏見之一端其不可者一也國家方以官濫為患取士數必難增若欲多取西北之人則却須多減東南之數今東南州軍進士取解者二三千人處只解二三十人是百人取一人蓋巳痛裁抑之矣西北州軍取解至多處不過百人而所解至十餘人是十人取一人比之東南十倍假借之矣若至南省又減東南而增西北則一無此字是已裁抑者又裁抑之巳假借者又假借之此其不可者二也東南之士於千人中解十人其𥘉選已精矣故至南省所試合格者多西北之士學業不及東南當發解時又十倍優假之蓋其𥘉選已濫矣故至南省所試不合格者多今若一例以十人取一人則東南之人合格而落者多矣西北之人不合格而得者多矣至於他路理不可齊偶有一路合格人多亦限以十一落之偶有一路合格人少亦須充足十一之數使合落者得合得者落取捨顛倒能否混淆其不可者三也且朝廷專以較藝取人而使有藝者屈落無藝者濫得不問繆濫只要諸路數停此其不可者四也且言事者本欲多取諸路土著之人若此法一行則寄應者爭趨而往今開封府寄應之弊可驗矣此所謂法出而姦生其不可者五也今廣南東西路進士例各絶無舉業諸州但據數解發其人亦自知無藝只來一就省試而歸冀作攝官爾朝廷以嶺外煙瘴北人不便須藉攝官亦許其如此今若一例與諸路一無二字十人取一人此為繆濫又非西北之比此其不可者六也凡此六者乃大槩爾若舊法一壞新議必行則弊濫隨生何可勝數故臣以謂且遵舊制但務擇人推朝廷至公待四方如一惟能是選人自無言此乃當今可行之法爾若謂士習浮華當先考行就如新議亦須只考程試安能必取行實之人議者又謂西北近虜士要牢籠此甚不然之論也使不逞之人不能為患則巳苟可為患則何方無之前世賊亂之臣起於東南者甚衆其大者如項羽蕭銑之徒是巳至如黃巢王仙芝之輩又皆起亂中州者爾不逞之人豈專西北矧貢舉所設本待材賢一作能牢籠不逞當别有術不在科埸也惟事久不能無弊有當留意者然不須更改法制止在振舉綱條爾近年以來舉人盛行懷挾排門大譟免冠突入虧損士風傷敗善類此由舉人既多而君子小人雜聚所司力不能制雖朝廷素有禁約條制甚嚴而上下因循不復申舉惟此一事為科埸大患而言事者獨不及之願下有司議革其弊此當今科埸之患也臣忝二宰司預聞國論苟不能為陛下守祖宗之法而言又不足取信於人主則厚顔尸祿豈敢偷安而久處乎故猶此強言乞賜裁擇乞獎用孫沔劄子治平二年臣伏見諒祚猖狂漸違誓約僣叛之迹彰露巳多年歲之間必為邊患國家禦備之計先在擇人而自慶曆罷兵以來至今二十餘年當時經用舊人零落無幾惟尚書户部侍郎孫沔尚在西事時沔守環慶一路其人磊落有智勇但以未嘗出兵又不遇敵故未有臨陳破賊之功然其養練士卒招撫蕃夷恩信著於一方至今邊人思之雖世不乏材朝廷方務推擇若求曽經西事可用之人則臣謂無如沔者沔今年雖七十聞其心力不衰飛鷹走馬尚如平日況所用者取其智謀藉其威信前世老將強起成功者多沔雖中間曽以罪廢棄瑕使過正是用人之術臣今欲乞朝廷更加察訪如沔實未衰羸伏望聖慈特賜獎用庶於擇一作人材難得之時可備一方之寄取進止英宗實録所載乃節文但於孫沔姓名之上添致仕二字又國家禦備作朝廷禦備奏議卷第十七論均稅劄子河北之民意疑是民之意論遂路取人劄子臣所區區所字下脫以字此卷凡言一作者乃善本而正文反可疑如論臺諫宜牽復劄子正文云從誨入臺未久一作以為吕誨新進又正文先云前年韓絳言冨弼後却以為去歲故一作無後段十一字論祠祭行事劄子正文云四時及三王五帝一作以三王為土王去聲之類皆當以一作為正巳刻板難盡易書示後人使知所擇焉居士集卷第十七歐陽文忠公集十七論六首本論上佛法為中國患千餘歲世之卓然不惑而有力者莫不欲去之巳嘗去矣而復大集攻之暫破而愈堅撲之未滅而愈熾遂至於無可奈何是果不可去邪蓋亦未知其方也夫醫者之於疾也必推其病之所自來而治其受病之處病之中人乘乎氣虛而入焉則善醫者不攻其疾而務養其氣氣實則病去此自然之效也故救天下之患者亦必推其患之所自來而治其受患之處佛為夷狄去中國最遠而有佛固巳久矣堯舜三代之際王政修明禮義之教充於天下於此之時雖有佛無由而入及三代衰王政闕禮義廢後二百餘年而佛至乎中國由是言之佛所以為吾患者乘其闕廢之時而來此其受患之本也輔其闕修其廢使王政明而禮義充則雖有佛無所施於吾民矣此亦自然之藝也昔堯舜三代之為政設為井田之法籍天下之人計其口而皆授之田凡人之力能勝耕者莫不有田而耕之斂以什一差其征賦以督其不勤使天下之人力皆盡於南畒而不暇乎其他然又懼其勞且怠而入於邪僻也於是為制牲牢酒醴以養其體弦一作笙匏爼豆以恱其耳目於其不耕休力之時而教之以禮故因其田獵而為搜狩之禮因其嫁娶而為婚姻之禮因其死葬而為喪祭之禮因其飲食羣聚而為鄉射之禮非徒以防其亂又因而教之使知尊卑長幼凡人之大倫一有者字也故凡養生送死之道皆因其欲而為之制飾之物采而文焉所以恱之使其易趣也順其情性而節焉所以防之使其不過也然猶懼其未也又為立學以講明之故上自天子之郊下至鄉黨莫不有學擇民之聰明者而習焉使相告語而誘勸其愚墯嗚呼何其備也蓋一有堯舜二字三代之為政如此其慮民之意甚精治民之具甚備防民之術甚周誘民之道甚篤行之以勤而被於物者洽浸之以漸而入於人者深故民之生也不用力乎南畒則從事於禮樂之際不在其家則在乎庠序之間耳聞目見無非仁義一有禮字樂而趣之不知其倦終身不見異物又奚暇夫外慕哉故曰雖有佛無由而入者謂有此具也及周之衰秦并天下盡去三代之法而王道中絶後之有天下者不能勉強其為治之具不備防民之漸不周佛於此時乘間而出千有餘歲之間佛之來者日益衆吾之所為者日益壞井田最先廢而兼并遊惰之姦起其後所謂搜狩婚姻喪祭鄉射之禮凡所以教民之具相次而盡廢然後民之姦者有暇而為他其良者泯然不見禮義之及己夫姦民有餘力則思為邪僻良民不見禮義則莫知所趣佛於此時乘其隙一無此六字方鼓其雄誕之説而牽一作率之則民不得不從而歸矣又况王公大人往往倡而毆之曰佛是真可歸依者然則吾民何疑而不歸焉幸而有一不惑者方艴然而怒曰佛何為者吾將操戈而逐之又曰吾將有説以排之一有何其不思之甚也七字夫千歲之患遍於天下豈一人一日之可為民之沈酣入於骨髓非口舌之可勝然則將奈何曰莫若修其本以勝之昔戰國之時楊墨交亂孟子患之而專言仁義故仁義之説勝則楊墨之學廢漢之時百家並興董生患之而退修孔氏故孔氏之道明而百家一有自字息此所謂修其本以勝之之效也今八尺之夫被甲荷戟勇蓋三軍然而見佛則拜聞佛之説則有畏慕之誠者何也彼誠壯佼其中心茫然無所守而然也一介之士眇然柔懦進趨畏怯然而聞有道佛者一無此字則義形於色非徒不為之屈又欲驅而絶之者何也彼無他焉學問明而禮義熟中心有所守以勝之也然則禮義者勝佛之本也今一介之士知禮義者尚能不為之屈使天下皆知禮義則勝之矣此自然之勢也本論下昔荀卿子之説以為人性本惡著書一篇以持其論豫始愛之及見丗人之歸佛者然後知荀卿之説繆焉甚矣人之性善也彼為佛者棄其父子絶其夫婦於人之性甚戾又有蠶食蟲蠹之弊然而民皆相率而歸焉者以佛有為善之説故也嗚呼誠使吾民曉然知禮義之為善則安知不相率而從哉奈何教之諭之之不至也佛之説熟於人耳入乎其心久矣至於禮義之事則未嘗見聞今將號於衆曰禁汝之佛而為吾禮義則民將駭而走矣莫若為之以漸使其不知而趣焉可也蓋鯀之治水也鄣之故其害益暴及禹之治水也導之則其患息蓋患深勢盛則難與敵莫若馴致而去一有其害二字之易也今堯舜三代之政其説尚傳其具皆在誠能講而修之行之以勤而浸之以漸使民皆樂而趣焉則充行乎天下而佛無所施矣傳曰物莫能兩大自然之藝也奚必曰火其書而廬其居哉昔者戎狄蠻夷雜居九州之間所謂徐戎白狄荆蠻淮夷之類是也三代既衰若此之類並侵於中國故秦以西戎據宗周吳楚之國一作君皆僭稱王春秋書用鄫子傳記被髮於伊川而仲尼亦以不左衽為幸當是之時佛雖不來中國幾何其不夷狄也以是而言王道不明而仁義廢則夷狄之患至矣及孔子作春秋尊中國而賤夷狄然後王道復明方今九州之民莫不右衽而冠帶其為患者特佛爾其所以勝之之道非有甚髙難行之説也患乎忽而不為爾夫郊天祀地與乎宗廟社稷朝廷之儀皆天子之大禮也今皆舉而行之至於所謂搜狩婚姻喪祭鄉射之禮此郡縣有司之事也在乎講明而頒布之爾然非行之以勤浸之以漸則不能入於人而成化自古王者之政必丗而後仁今之議者將曰佛來千餘歲有力者尚無可奈何何用此迂緩之説為是則以一日之功不速就而棄必丗之功不為也可不惜哉昔孔子歎為俑者不仁蓋歎乎啓其漸而至於用殉也然則為佛者不猶甚於作俑乎當其始來未見其害引而內之今之為害著矣非待先覺之明而後見也然而恬然不以為怪者何哉夫物極則反數窮則變此理之常也今佛之盛久矣乘其窮極之時可以反而變之不難也昔三代之為政皆聖人之事業及其久也必有弊故三代之術皆變其質文而相救就使佛為聖人及其弊也猶將救之况其非聖者乎夫姦邪之士見信於人者彼雖小人必有所長以取信是以古之人君惑之至於亂亡而不悟今佛之法可謂姦且邪矣蓋其為説亦有可以惑人者使丗之君子雖見其弊而不思救豈又善惑者歟抑亦不得其救之之術也救之莫若修其本以勝之捨是而將有為雖賁育之勇孟軻之辨太公之隂謀吾見其力未及施言未及出訃未及行而先巳陷於禍敗矣何則患深藝盛難與敵非馴致而為之莫能也故曰修其本以勝之作本論朋黨論在諫院進一本以論為議臣聞朋黨之説自古有之惟幸人君辨其君子小人而巳大凡君子與君子以同道為朋小人與小人以同利為朋此自然之理也一無此六字然臣謂小人無朋惟君子則有之其故何哉小人所好者祿利也所貪者財貨也當其同利之時暫相黨引以為朋者偽也及其見利而爭先或利盡而交踈則反相賊害雖其兄弟一作弟兄親戚不能相保故臣謂小人無朋其暫為朋者偽也君子則不然所守者道義所行者忠信所惜者名節以之修身則同道而相益以之事國則同心而共濟終始如一此君子之朋也故為人君者但當退小人之偽朋用君子之真朋則天下治矣堯之時小人共工歡兜等四人為一朋君子八元八凱十六人為一朋舜佐堯退四凶小人之朋而進元凱君子之朋堯之天下大治及舜自為天子而臯夔稷契等二十二人並列于朝更相稱美更相推讓凡二十二人為一朋而舜皆用之天下亦大治書曰紂有臣億萬惟億萬心周有臣三千惟一心紂之時億萬人各異心可謂不為朋矣然紂以亡國周武王之臣三千人為一大朋而周用以興後漢獻帝時盡取天下名士囚禁之目為黨人及黃巾賊起漢室大亂後方悔悟盡解黨人而釋之然巳無救矣唐之晚年漸起朋黨之論及昭宗時盡殺朝之名士或一作咸投之黃河曰此輩淸流可投濁流而唐遂亡矣夫前世之主能使人人異心不為朋莫如紂能禁絶善人為朋莫如漢獻帝能誅戮淸流之朋莫如唐昭宗之世然皆一有以字亂亡其國更相稱美推讓而不自疑莫如舜之二十二臣舜亦不疑而皆用之然而後丗不誚舜為二十二人朋黨所欺而稱舜為聰明之聖者以辨君子與小人也周武之丗舉其國之臣三千人共為一朋自古為朋之多且大莫如周然周用此以興者善人雖多而不猒也夫興亡治亂之迹為人君者可以鑒矣一有作朋黨議四字魏梁解一作論豫論正統辨魏梁一作不黜魏而辨梁注曹魏朱梁不為偽議者或非豫一作其大失春秋之旨以謂魏梁皆負篡弒之惡當加誅絶而反進之是奬篡也非春秋之志也豫應之曰是春秋之志耳魯桓公弒隱公而自立者宣公弒子赤而自立者鄭厲公逐丗子忽而自立者衛公孫剽逐其君衎而自立者聖人於春秋皆不絶其為君此豫所以不黜魏梁者用春秋之法也魏梁之惡三尺童子皆知可惡豫不得聖人之法為據依其敢進而不疑乎然則春秋亦獎篡乎曰惟不絶四者之為君於此見春秋之意也聖人之於春秋用意深故能勸戒切為言信然後善惡明夫欲著其罪於後丗在乎不沒其實其實嘗為君矣書其為君其實篡也書其篡各傳其實而使後丗信之則四君之罪不可得而掩耳使為君者不得掩其惡則人之為惡者庶乎其息矣是謂用意深而勸戒切為言信而善惡明也凡惡之為名非徒君子嫉之雖為小人者亦知其可惡也而小人常至於為惡者蓋以人為可欺與夫幸人不知而可掩耳夫位莫貴乎國君而不能逃大惡之名所以示人不可欺而惡不可掩也就使四君因聖人誅絶而其惡彰焉則後丗之為惡者將曰彼不幸遭逢聖人黜絶而一作之不得為君遂彰其惡耳我無孔子丗莫我黜則冀人為可欺而惡可掩也如此則僥幸之心啓矣惟與其為君使不得掩其惡者春秋之深意也桀紂不待貶其為王而萬丗所共惡者也今匹夫之士比之顔閔則喜方之桀紂則怒是大惡之君不及一善之士也春秋之於大惡之君不誅絶之者不害其褒善貶惡之旨也惟不沒其實以著其罪而信乎後丗與其為君而不得掩其惡以息人之為惡能知春秋之此旨然後知豫不黜魏梁之是也為君難論上語曰為君難者孰難哉蓋莫難於用人夫用人之術任之必專信之必篤然後能盡其材而可共成事及其失也任之欲專則不復謀於人而拒絶羣議是欲盡一人之用而先失衆人之心也信之欲篤則一切不疑而果於必行是不審事之可否不計功之成敗也夫違衆舉事又不審計而輕發其百舉百失而及於禍敗此理之冝然也然亦有幸而成功者人情成是而敗非則又從而贊之以其違衆為獨見之明以其拒諫為不惑羣論以其偏信而輕發為決於能斷使後丗人君慕此三者以自期至其信用一失而及於禍敗則雖悔而不可及此甚可歎也前丗為人君者力拒羣議專信一人而不能早悟以及於禍敗者多矣不可以遍舉請試舉其一二昔秦苻堅地大兵強有衆九十六萬號稱百萬蔑視東晉指為一隅謂可直以氣吞之耳然而舉國之人皆言晉不可伐更進互説者不可勝數其所陳天時人事堅隨以強辨折之忠言讜論皆沮屈而去如王猛苻融老成之言也不聽太子宏少子詵至親之言也不聽沙門道安堅平生所信重者也數為之言不聽惟聽信一將軍慕容垂者垂之言曰陛下內斷神謀足矣不煩廣訪朝臣以亂聖慮堅大喜曰與吾共定天下者惟卿爾於是決意不疑遂大舉南伐兵至壽春晉以數千人擊之大敗而歸比至洛陽九十六萬兵亡其八十六萬堅自此兵威沮喪不復能振遂至於亂亡近五代時後唐淸泰帝患晉祖之鎮太原也地近契丹恃兵踐扈議欲徙之於鄆州舉朝之士皆諫以為未可帝意必欲徙之夜召常所與謀樞密直學士薛文遇問之以決可否文遇對曰臣聞作舍道邊三年不成此事斷在陛下何必更問羣臣帝大喜曰術者言我今年當得一賢佐助我中興卿其是乎即時命學士草制徙晉祖於鄆州明旦宣麻在廷之臣皆失色後六日而晉祖反書至淸泰帝憂懼不知所為謂李嵩曰我適見薛文遇為之肉顫欲自抽刀刺之嵩對曰事巳至此悔無及矣但君臣相顧涕泣而巳由是言之能力拒羣議專信一人莫如二君之果也由之以致禍敗亂亡亦莫如二君之酷也方苻堅欲與慕容垂共定天下淸泰帝以薛文遇為賢佐助我中興可謂臨亂之君各賢其臣者也或有詰豫曰然則用人者不可專信乎應之曰齊桓公之用管仲蜀先主之用諸葛亮可謂專而信矣不聞舉齊蜀之臣民非之也蓋其令出而舉國之臣民從事行而舉國之臣民便故桓公先主得以專任而不二也使令出而兩國之人不從事行而兩國之人不便則彼二君者其肯專任而信之以失衆心而斂國怨乎為君難論下嗚呼用人之難難矣未若聽言之難也夫人之言非一端也巧辨縱橫而可喜忠言質朴而多訥此非聽言之難在聽者之明暗也諛言順意而易恱直言逆耳而觸怒此非聽言之難在聽者之賢愚也是皆未足為難也若聽其言則可用然用之有輒敗人之事者聽其言若不可用然非如其言不能以成功者此然後為聽言之難也請試舉其一二戰國時趙將有趙括者善言兵自謂天下莫能當其父奢趙之名將老於用兵者也每與括言亦不能屈然奢終不以括為能也歎曰趙若以括為將必敗趙事其後奢死趙遂以括為將其母自見趙王亦言括不可用趙王不聽使括將而攻秦括為秦軍射死趙兵大敗降秦者四十萬人坑於長平蓋當時未有如括善言兵亦未有如括大敗者也此聽其言可用用之輒敗人事者趙括是也秦始皇欲伐荆問其將李信用兵幾何信方年少而勇對曰不過二十萬足矣始皇大喜又以問老將王翦翦曰非六十萬不可始皇不恱曰將軍老矣何其怯也因以信為可用即與兵二十萬使伐荆王翦遂謝病退老於頻陽已而信大為荆人所敗亡七都尉而還始皇大慙自駕如頻陽謝翦因強起之翦曰必欲用臣非六十萬不可於是卒與六十萬而往遂以滅荆夫𥘉聽其言若不可用然非如其言不能以成功者王翦是也且聽計於人者冝如何聽其言君可用用之冝矣輒敗事聽其言若不可用捨之冝矣然必如其説則成功此所以為難也豫又以謂秦趙二主非徒失於聽言亦由樂用新進忽棄老成此其所以敗也大抵新進之士喜勇鋭老成之人多持重此所以人主之好立功名者聽勇鋭之語則易合聞持重之言則難入也若趙括者則又有説焉豫略考史記所書是時趙方遣廉頗攻秦頗趙名將也秦人畏頗而知括虛言易與也因行反間於趙曰秦人所畏者趙括也若趙以為將則秦懼矣趙王不悟反間也遂用括為將以代頗藺相如力諫以為不可趙王不聽遂至於敗由是言之括虛談無實而不可用其父知之其母亦知之趙之諸臣藺相如等亦知之外至敵國亦知之獨其主不悟爾夫用人之失天下之人皆知其不可而獨其主不知者莫大之患也前丗之禍亂敗亡由此者不可勝數也居士集卷第十七熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益校正朝佐考本論初有上中下篇此卷所載即中下二篇其上篇編居士集時雖削去而傳於丗今附外集本論上王政闕闕一作缺下同者洽一作者廣耳聞目見無非仁義禮樂而趣之不知其倦一無此十七字其為一作而為莫知所趣趣一作趍操戈而逐之而一作以本論下蓋歎一作蓋傷亦有可以惑人者一作亦有所長而可以惑人者朋黨論而已二字一作其紂有臣紂一作受以辨君子以字下一有能字魏梁解不黜一作不絶
