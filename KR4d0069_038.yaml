front:
  text: 居士集卷第三十八歐陽文忠公集三十八
  hash: sha256:9f2fd30ea406fc66379872c6bce6f5c3f653035f7d5565119aad7b4823a36ef4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0069_SBCK_038-1a}
body:
  text: 行狀二首尚書戶部侍郎贈兵部尚書蔡公行狀公諱齊字子思其先洛陽人皇祖以下始著籍於膠東公幼依外舅劉氏能自力為學𥘉作詩已有動人語今相國李公見之大驚謂公之皇考曰兒有大志冝善視之州舉進士第一以書薦其里人史防而居其次祥符八年真宗皇帝采賈誼置器之説試禮部所奏士讀至公賦有安天下意歎曰此宰相器也凡貢士當賜第者考定必召其高第數人並見又參擇其材質可者然後賜第一及公召見衣冠偉然進對有法天子為無能過者亟以第一賜之𥘉拜將仕郎將作監丞通判兖州太守諸夲作原王臻治政嚴急喜以察盡一作盡察為明公務為裁損濟之以寬獄訟為之不冤逾年通判濰州民有告某氏刻偽稅印為姦利者巳逾十年蹤迹連蔓至數百人公歎曰盡利於民民無所逃此所謂法出而姦生者邪是為政者之過也為緩其獄得減死者十餘人餘皆釋而不問濰人皆曰公德於我使我自新為善人由是風化大行天禧二年還京師當召試時大臣有用事者意不恱公居數月不得召久而天子記其姓名趣使召試拜著作佐郎直集賢院階再加為宣德郎勳騎都尉主判三司開坼司賜緋衣銀魚遷右正言階朝奉郎勳上騎都尉今天子即位遷右司諌真宗新棄天下天子諒隂不言丁晉公用事專權欲邀致公許以知制誥公拒不往益堅已而冦萊公王文康公皆以不附已連黜公歸歎曰吾受先帝之知而至於此豈冝為權臣所脅得罪非吾懼也既而晉公敗士嘗為其用者皆恐懼獨公終無所屈未幾同修起居注又拜尚書禮部貟外郎兼侍御史知雜事判流內銓賜服金紫改三司户部度支二副使轉勳輕車都尉借給事中奉使契丹天聖八年拜起居舍人知制誥同知審官院會靈宫判官充翰林學士加侍讀學士賜爵汝南縣開國子食邑五百戶太后修景德寺成詔公為記而宦者羅崇勳主營寺事使人隂謂公曰善為記當得參知政事公故遲之頗久使者數趣終不以進崇勳怒讒之太后遷禮部郎中改龍圖閣直學士出為西京留守是時魯肅簡公方參知一無此字政事爭之太后前卒不能留以親便求改密州遭歲旱除其公田之租數千石諸本作碩疑頃字訛又請悉除京東民租弛其鹽禁使民得賈海易食以救其飢東人至今賴之皆曰使吾人百萬口活而不飢者蔡公也徙南京留守進爵侯增邑戶五百為一千階朝散大夫召還拜右諌議大夫權御史中丞判吏部流內銓遷給事中勳護軍增邑五百為千五百戶莊獻明肅皇太后崩議尊楊太妃為太后垂簾聽政議決召百官賀公曰天子明聖奉太后十餘年今始躬親萬事以慰天下之心豈冝女后相繼稱制且自古無有固止不追班太妃卒不預政止稱太后於宫中復為龍圖閣直學士權三司使京師有指荆王為飛語者內侍省得三司小吏鞫之連及數百人上聞之大怒詔公窮治迹其所來無端而上督責愈急有司不知所為京師為之恐動公以謂繆妄之説起於小人不足窮治且無以慰安荆王危疑之心奏疏論之一夕三上上大悟乃可其奏止笞數人而巳中外之情乃安拜樞密副使進爵公增邑戶五百為二千南海蠻酋虐其部人部人𣢾冝州自歸者八百餘人議者以為叛蠻不可納冝還其部公獨以為蠻去殘酷而歸有德且以求生冝內之荆湖賜以間田使自營今縱却之必不復還其一無此字部茍散入山谷當為後患爭之不能得其後數年蠻果為亂殺將吏十餘人冝桂以西皆警朝廷頗以為憂景祐元年遷禮部侍郎參知政事二年賜號推忠佐理功臣進階正奉大夫勳柱國郭皇后廢京師冨人陳氏女有色選入宫為后公爭之以為不可自辰至巳辨論不巳上意稍悟遂還其家河決橫壠改而北流議者以為當塞公曰水性下而河北地卑順其所趣以導之可無澶滑壅潰之患而貝博數州得在河南於國家便但理堤護魏州而巳從之澶滑果無患契丹祭天於幽州以兵屯界上界上驚搔議者欲發大軍以備邊公獨料其必不動後卒無事公在大位臨事不回無所牽畏而恭謹謙退未嘗自伐天下推之為正人搢紳之士倚以為朝廷重三年頻表一有求字解職不許明年遂罷以戶部侍郎歸班改賜推誠保德功臣勳上柱國久之出知潁州寶元二年四月四日以疾卒于官公在潁州聞西方用兵惻然有憂國心自以待罪外邦不得盡其所懷使其弟稟言西事甚詳公之卒故吏朱寀至潁潁之吏民見寀一有號字泣一有拜字於馬前指公嘗所更歷施為曰此公之迹也其為政有仁恩所至如此平生喜薦士一有所薦二字如楊偕郭勸劉隨龐籍假少連比比為當世名臣公為人神色明秀須眉如畫精學博聞寬大沈默一言之出終身可復其蒞官行已出處始終之大節可考不誣如此謹按贈兵部尚書於令為三品其法當諡敢告有司謹狀司封貟外郎許公行狀君諱逖字景山世家歙州少仕偽唐為監察御史李氏國除以族北遷獻其文若干篇得召試為汲縣尉冠氏主簿凡主簿二歲縣民七百人詣京師願得君為令遷祕書省校書郎知縣事數上書論北邊事是時趙普為相四方奏疏不可其意者悉投二甕中甕滿輒出而焚之未嘗有所肯可獨稱君為能曰其言與我多合又二歲徙江華令未行轉運使樊知古薦其材拜太僕寺丞磨勘錢帛糧草監永城和糴知海陵監三歲用鹽最遷大理寺丞賜緋衣銀魚監泗州排岸司遷贊善大夫監永興軍榷貨務遷太常丞知鼎州州雜蠻蛋喜以攻劫為生少年百餘人私自署為名號常伺夜出掠居人居人惡之莫敢指君至而歎曰夫政民之庇也威不先去其惡則惠亦不能及人君政既行盜皆亡入他境約君去乃還遷國子博士奉使兩浙江南言茶鹽利害省州縣之役皆稱旨出知興元府大修山河堰堰水舊溉民田四萬餘頃世傳漢蕭何所為君行壞堰顧其屬曰鄼侯方佐漢取天下乃暇為此以溉其農古之聖賢有以利人無不為也今吾豈冝憚一時之勞而廢古人萬世之利乃率工徒躬治木石石墜傷其左足君益不懈堰成歲穀大豐得嘉禾十二莖以獻遷尚書主客貟外郎京西轉運使徙荆湖南路荆湖南接溪洞諸蠻歲出為州縣患君曰鳥獸可馴況蠻亦人乎乃召其酋豪諭以禍福諸蠻皆以君言為可信訖三歲不以蠻事聞朝廷君罷來朝真宗面稱其能會有司言荆南久不治真宗拜君度支貟外郎知府事荆南鈐轄北路兵馬於荆湖為大府故常用重人至君特選以材用貟外郎自君而始明年遷司封貟外郎賜金紫徙知揚州州居南方之會世之仕宦於南與其死而無歸者皆寓其家于揚州故其子弟雜居民間往往倚權貴恃法得贖出入里巷為不法至或破亡其家君捕其甚者笞之曰此非吏法乃吾代汝父兄教也子弟羞愧自悔稍就學問為善人風俗大化歲滿在道得疾卒于髙郵君少孤事其母兄以孝謹聞常戒其妻事嫂如姑而未嘗敢先其兄食衣雖弊兄不易衣不敢易𥘉違命侯遣其弟朝京師君之故友全一作金一作潘惟嶽當從以其家屬託君惟嶽果留不返君善撫其家為嫁其女數人李氏國亡君載其家北歸京師以還惟嶽歷官四十年不問家事好學尤喜孫吳兵法𥘉在偽唐數上書言事得校書郎遂遷御史王師圍金陵李氏大將李雄擁兵數萬留上江隂持兩端李氏患之以謂非君不能召雄君走上江以語動雄雄即聽命巳而李氏以蠟書止雄於溧水君曰此非柵兵之地留之必敗乃戒雄曰兵來愼無動待我一夕吾當入白可與公兵俱入城君去王師挑之雄輒出戰果敗死君至收其餘卒千人而去君少慷慨卒能自立於時其孝謹聞於其族其信義著於其友其材能稱於其官是皆可書以傳謹狀居士集卷第三十八熙寧五年秋七月男發等編定紹熙二年三月郡人孫謙益挍正蔡公行狀詩巳有一作巳能有許公行狀全惟嶽全恕本作金
