  - {type: line-break, offset: 0, content: '', id: KR4d0069_SBCK_017-1a01}
  - {type: variant, offset: 0, length: 1139, content: 外集卷第十七歐陽文忠公集六十七書二與范希文書脩頓首再拜知郡學士希文足下自去歳在洛陽聞以言事出睦州及來京師又知移常州㝷復得蘇州遷延南方歳且終矣南方美江山水國富魚與稻世之仕宦者舉善地稱東南然竊惟希文登朝廷與國論每顧事是非不顧自身安危則雖有東南之樂豈能爲有憂天下之心者樂哉若夫登髙以望逺飲旨而食嘉所以宣輔神明亦君子起居寢食之宜也爲别久矣所懷如何自古言事而得罪解當復用逺方久處省思慮節動作此非希文自重亦以爲天下士君子重也謝希深學士丁家艱將謀南歸有少私事湏託營辦因通區區之誠以問左右代人上王樞宻求先集序書某月日具位某謹齋沐獻書樞密相公閤下某聞傳曰言之無文行而不逺君子之所學也言以載事而文以飾言事信言文乃能表見於後世詩書易春秋皆善載事而尤文者故其傳尤逺荀卿孟軻之徒亦善爲言然其道有至有不至故其書或傳或不傳猶繫於時之好惡而興廢之其次楚有大夫者善文其謳謌以傳漢之盛時有賈誼董仲舒司馬相如揚雄能文其文辭以傳由此以來去聖益逺世益薄或衰下迄周隋其間亦時時有善文其言以傳者然皆紛雜滅裂不純信故百不傳一幸而一傳傳亦不顯不能若前數家之焯然暴見而大行也甚矣言之難行也事信矣須文文至矣又繫其所恃之大小以見其行逺不逺也書載堯舜詩載商周易載九聖春秋載文武之法荀孟二家載詩書易春秋者楚之辭載風雅漢之徒各載其時主一作王聲名文物之盛以爲辭後之學者蕩然無所載則其言之不純信其傳之不久逺勢使然也至唐之興若太宗之政開元之治憲宗之功其臣下又爭載之以文其詞或播樂歌或刻金石故其間鉅人碩德一作士閎言髙論流鑠前後者恃其所載之在文也故其言之所載者大且文則其傳也章言之所載者不文而又小則其傳也不章某不佞守先人之緒餘先人在太宗時以文辭爲名進士以對筞爲賢良方正既而守道純正爲賢待制逢時太平奮身揚名宜其言之所載文之所行大而可恃以傳也然未能甚行於世者豈其嗣續不肖不能繼守而泯没之抑有由也夫文之行雖繫其所載猶有待焉詩書易春秋待仲尼之刪正荀孟屈原無所待猶待其弟子而傳焉漢之徒亦得其史臣之書其始出也或待其時之有名者而後發其既殁也或待其後之紀次者而傳其爲之紀次也非其門人故吏則其親戚朋友如夢得之序子厚李漢之序退之也伏惟閤下學老文鉅爲時雄人出入三朝其能望光輝接歩武者惟先君爲舊則亦先君之所待也豈小子之敢有請焉謹以家集若干卷數寫獻門下惟哀其誠而幸賜之代楊推官洎上吕相公求見書某聞古者堯舜禹之爲君也有臯夔益稷之徒者五字一作稷契者之徒爲其臣而湯之王也亦有仲虺伊尹者周之始興也有周公召公其復一作後興也有方叔邵虎申一作山甫之徒下而至漢其初也功臣尤多而稱善相者曰蕭曹其後曰丙魏唐之始則曰房杜既而曰姚宋者是皆能以功德佐其君而卓然特以名出衆而見於世者夫詩書之所美莫大乎堯舜三代其後世之盛者莫盛乎漢與唐而其興也必有賢哲之臣出其際而能使其君之功業名譽赫然光顯於萬世而不泯故每一, WYG: ''}
