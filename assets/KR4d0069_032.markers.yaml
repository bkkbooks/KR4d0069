  - {type: variant, offset: 0, length: 292, content: 居士集卷第三十二歐陽文忠公集三十二墓誌七首尚書戸部侍郎參知政事贈右僕射文安王公墓誌銘并序公姓王氏其先太原祁人其六世祖某爲唐輝州刺史遭世亂因留家碭山碭山近宋其後又徙宋州之虞城今爲應天虞城人也公諱堯臣字伯庸天聖五年舉進士第一爲將作監丞通判湖州召試以著作佐郎直集賢院知光州歲大饑群盗發民倉廪吏法當死公曰此飢民求食爾荒政之所恤也乃請以减死論其後遂以著令至今用之丁父憂服除爲三司度支判官再遷右司諫郭皇后廢居瑶華宫有疾上頗哀憐之方后廢時宦者閻文應有力及后疾文應又主監醫后且卒議者疑文應有姦謀公請付其事御史考按虚實以釋天下之疑事雖不行然自文應用事無敢指言者一有其字後文應卒以恣横斥死后猶在殯有司以歲, WYG: ''}
