  - {type: variant, offset: 0, length: 708, content: 外集卷第二十歐陽文忠公集七十䇿問問進士策題五道問古之人作詩亦因時之得失鬰其情於中而發之於詠歌而巳一人之爲詠歌歡樂悲瘁宜若所繫者未爲重矣然子夏序詩以謂動天地感鬼神莫近於詩者詩之言果足以動天地感鬼神乎問古之爲聖人者莫如舜賢而與聖人近者莫如顔回仲尼稱虞舜不可及而顔氏其殆庶㡬至其稱舜之所爲則曰好問而好察邇言而已稱顔氏之好學則曰不遷怒不貳過而巳然則如是者是爲不可及與庶㡬乎問漢宣中興丙魏爲相後之人言爲相之賢者必稽焉宜其有興樹之業顯於世也及觀其紀傳亦無他功徳相獨有明堂月令一章吉之事大槩而巳不識丙魏之所以得賢於後世者可得見乎問子丑寅三代之正也孔子何獨行夏之時說者曰夏時質也忠質文三代之政也孔子何獨曰從周之文使夏之時爲正則商周之時不正乎周之政尚文則夏商之政無文乎夫周以子則今之冬十一月乃春正也商以丑則今之冬十二月乃春正也夫以冬十有一月十有二月頒春正於天下而教民之事無乃與天時相戾歟夫君臣之相和父子之相愛兄弟夫婦之相爲悌順是文之本也仁以守之義以制之禮樂以和節之是文之成也使夏商而無文則夏商之世無君臣父子兄弟夫婦之制歟說者曰三代之正皆同也子丑寅出於後儒之妄也忠質文亦出於後儒之妄也使夫誠出於後儒之妄則孔子安有行時從文之說問周天子之田方千里號稱萬乘萬乘之馬皆具又有十二閑之馬而六卿三百六十官必皆各有車馬車馬豈不多乎哉千里之地爲田㡬何其牧養之地又㡬何而能容馬若是之多乎哉千里之地爲田㡬何馬之法又如何今天下廣矣常患無馬豈古之善養馬而今不善乎宜有說以對也謚議贈太尉夏守贇謚議議曰謹按謚法世篤勤勞曰忠小心恭慎曰僖今考公之行狀言其父以軍校殁戰陣遂獲賞延子以君命死道塗得謚莊一作壯恪公自束髮已能孝謹遭遇先帝給事左右材敏自力愈久益勤至於典掌師旅宿衛, WYG: ''}
