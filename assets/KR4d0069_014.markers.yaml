  - {type: variant, offset: 39, length: 16090, content: 二帝之言語也號令征伐丁寜約束而其辭彬彬篤厚純雅者三代之文章也堯舜夏商周之盛邈乎逺出千載之上而昭然著見百世之下者以其書存焉此典謨訓誥之文所以爲歷代之寳也惟我仁考神文聖武明孝皇帝之作二帝之言語而三代之文章也是冝刋之六經而不朽示之萬世而取法矧余小子獲承統業其所以繼大而顯揚之者方思勉焉其敢失墜乃詔尚書刑部郎中知制誥邵必右諌議大夫天章閣待制吕公著悉發寳文之舊藏而類次之以爲百卷而必公著勉朕以敘述之曰是不可闕也予惟聖考在位四十有二載承三聖之鴻菐享百年之盛隆而不敢暇逸慎重祭祀以事天而饗親齊莊潔精必以誠信故親郊而見上帝者九恭謝于天地大享于明堂者皆再耕于籍田祫于太廟者皆一而不爲勞若夫游娱射獵前世賢王明主之所不能免者則皆非所欲歲時臨幸燕飫臣下必問祖宗之故常􅞔然非時不聞輿馬之音後苑歲春一賞亦故事也中廢者二十餘年而時畋于近郊曲宴于便坐者廑纔一二而已故敘禋祀享升歌樂章藏于有司薦于郊廟者多矣而登臨游賞之適割鮮獻獲之樂前世之所誇者未始一及焉至於萬機之暇泊然凝神不見所好惟躬閱寳訓陳經邇英究鍾律之本元訓師兵之武略披圖以鑒古銘物以自戒其從事於清閑宴息之餘者不過此類嗚呼大禹之勤儉也夫惟一人勞扵上則天下安其逸約于已則天下享其豐此禹之所以聖勤儉之功也惟我聖考之在御也澤被生民恩加夷狄寛刑罰息兵革容納諌諍信任賢材措民逸於治安躋俗豐於冨庶使海内䝉徳受賜涵濡鼓舞而不知所以然者由勤與儉乆而馴致之也是以功成業茂立廟建號爲宋仁宗噫仁之爲言堯舜之盛徳而甚美之稱也固已巍乎與天地而亡極矣永惟聖作刻之玉版藏之金匱以耀後嗣而垂無窮庶俾知我聖考仁宗之所以爲仁者自勤儉始嗚呼亦惟予小子是訓送方希則序蒙莊以紳笏爲柴柵班伯以名聲爲韁鎻夫軒裳輝華人之所甚欲彼豈惡之邪蓋將有激云爾是以君子輕去就随卷舒冨貴不可誘故其氣浩然勇過乎賁育毀譽不以屑其量恬然不見於喜愠能及是者逹人之節而大方之家乎希則茂才入官三舉進士不利命乎數竒時不見用而一作冝且夷然拂衣師心自往推否泰以消息輕寄物之去来淵乎其大雅之君子而幾類於昔賢者乎余自来上都寓謁舍化衣亰塵穿履金門者再見春矣㑹天子方嚮儒學招徠俊良開賢科命郷舉而四方之傑齎貢函詣公車者十百千數余雖後進晚出而掎裳摩趺攘臂以遊其間交者固巳多矣晚方得君傾葢道塗一笑相樂形忘乎外心照乎内雖濠梁之遊不若是也未幾君召試中臺以枉於有司奪席見罷搢一作薦紳議者咸傷冤之君方澹乎沖襟竟於使人不能窺也後數日齎裝具舟泛然東下以余辱交者索言以爲贈夫恢識宇以見乎逺窮倚伏以至于命此非可爲淺見寡聞者道也希則逹人爾可一言之昔公孫常退歸郷人再推射䇿遂第一更生書數十上每聞報罷而終爲漢名臣以希則之資材識業而沈冥鬱堙者豈非天將張之而固翕之邪不然何邅迴而若此也夫良工晚成者器之大後發先至者驥之良異日垂光虹蜺濯髪雲漢使諸儒後生企仰而不暇此固希則禇嚢一作槖中所畜爾豈假予詳言之哉觴行酒半坐者皆欲去操觚率然辭不逮意同年景山欽之識之亦賦詩以爲别則祖離道舊之情僃之矣此不復云送陳經秀才序伊出陸渾略國南絶山而下東以㑹河山夾水東西北直國門當雙闕隋煬帝𥘉營宮洛陽登邙山南望曰此豈非龍門邪世因謂之龍門非禹貢所謂導河自積石而號龍門者也然山形中斷巖崖缺呀若斷若鑱當禹之治水九州披山斬木遍行天下凡水之破山而出之者皆禹鑿之豈必龍門然伊之流最清淺水濺濺鳴石間刺舟隨波可爲浮泛釣魴擉鼈可供膳羞山兩麓浸流中無巖嶄頽怪盤絶之險而可以豋髙顧望自長夏而往纔十八里可以朝遊而暮歸故人之遊此者欣然得山水之樂而未嘗有筋骸之勞雖數至不厭也然洛陽西都来此者多逹官尊重不可輒輕出幸時一往則騶奴從騎吏屬遮道唱呵後先前儐旁扶登覽一作覽登未周意已怠矣故非有激流上下與魚鳥相慠然徙倚之適也然能得此者惟卑且閑者冝之脩爲從事子聦參軍應之主縣簿秀才陳生旅遊皆卑且閑者因相與期於茲夜宿西峯歩月松林間登山上方路窮而返明日上香山石樓聽八節灘晚泛舟傍山足夷猶而下賦詩飲酒暮已歸後三日陳生告予且西予方得生喜與之遊也又遽去因書其所以遊以贈其行送楊子聦户曹序士之仕於州郡者必視其地大小髙下之望以爲輕重河南大府也參軍雖卑以望而髙下之固與他州郡異矣然地大望髙居者皆將相名臣逹官居又不乆率一二歲而甚者半歲而易故河南吏民間坐而偶語道某相某將某官者常名斥而一二歲數之至於郎官御史方鎮牧守使人貴客由河南出者入不候於疆去不餞于郊途逢而不避市坐者不起豈素慢㢤葢其見之習也彼視公卿大臣要官其易如此矧所謂參軍者邪其不群嘲而隨侮之幸也參軍每上府望門而超吏摩以肩過不揖反就焉持刺執版求通姓名雖心負其所有欲進自逹不可得其勢鬱鬱卑且賤反甚於它州郡故爲之者未嘗樂也然其間能自以頭角頎然而出者鮮矣其才能之美非有異乎衆莫能也户曹參軍楊子聦居府中常衣青衫騎破虎韉出入府門下入固輩一作背視而槩易之居一歲相國彭城公薦之集賢學士謝公又薦之士之有文而賢者盡交之其能出其頭角矣若云而之他州郡不特頎然而出矣遂特疑傑然以獨立也子聦南人樂其土風今秩滿調於吏部必吏於南也吾見南之州郡有傑然而獨出者必楊子聦也送廖倚歸衡山序元氣之融結爲山川山川之秀麗稱衡湘其蒸爲雲霓其生爲𣏌梓人居其間得之爲俊傑秀才生於衡山之陽而秀麗之精英者得之尤多故其文則雲霓其材則𣏌梓始以郷進士舉於有司不中遂遊公卿間所至無不虗館設席爭以禮下之今永興太原公雅識沈正器君尤深𥘉其鎮秦川也請君與俱行遂趨函關以覽秦都則西方士君子得以承望乎風采矣凡居秦幾歲而東將過亰師以歸予嘗以上計吏客都中識君於交逵辱之以友益當君之西也獲餞於國門及夫斯來又相見於洛道語故舊數日乃行夫山川固能産異物而不能畜之者誠有利其用者爾今君之行也予疑夫不能乆畜於衡山之阿也送梅聖俞歸河陽序至寳潜乎山川之幽而能先群物以貴於世者負其有異而已故珠潜于泥玉潜于璞不與夫蜃蛤珉石混而棄者其先膺美澤之氣輝然特見于一作於外也士固有潜乎卑位而與夫庸庸之流俯仰上下然卒不混者其文章才美之光氣亦有輝然而特見者矣然求珠者必之乎海求玉者必之乎藍田求賢士者必之乎通邑大都據其㑹就其名而擇其精焉爾洛陽天子之西都距亰師不數驛搢紳仕宦雜然而處其亦珠玉之淵海歟予方據是而擇之獨得扵梅君聖俞其所謂輝然特見而精者邪聖俞志髙而行潔氣秀而色和嶄然獨出於衆人中𥘉爲河南主簿以親嫌移佐河陽常喜與洛之士遊故因吏事而至於此余嘗與之徜徉於嵩洛之下每得絶崖倒壑深林古宇則必相與吟哦其間始而歡然以相得終則一作而暢然覺乎薫蒸浸漬之爲益也故乆而不厭旣而以吏事訖言歸余且惜其去又悲夫潜乎下邑混於庸庸然所謂能先群物而貴於世者特其異而已則光氣之輝然者豈能掩之㢤張應之字序傳曰名以制義謂乎名之必可言也世之士君子名而無所言言則不能稱述一作著以見乎逺余友河南主簿張君名谷字仲容谷之爲義窪而不盈動而能應湛然而深有似乎賢人君子之徳其所謂名而可言者也然嘗竊謂仲容之字不足以表其所以名之之義大凡物以至虗而為用者有三其體殊焉有虗其形而能受者器之圓方是也然受則有量故多盈溢敗覆之過有虗其中而能鳴乎外者鍾鼓是也然鳴必假物故須簨簴考擊之設有虗其體而能應物者空谷是也然應必有待故常自然以至靜接物而無窮士之以是爲其名則君之道從可知也冝易其字曰應之葢容以言其虗之狀不若應以體乎容之徳也君早以孝㢘文藝考行於郷里薦之於有司而又試其用於春官者之選深中隱厚學優道充其有以應乎物矣然今方爲小官主簿書其所應者近而小誠未能有以發乎其聲也余知夫虗以待之則物之来者益廣響之應者益逺可涯也㢤余與君同以進士登于科又同為吏于此群居肩隨宴閑相語得以字而相呼故於是不能讓而黙也敢為序以易之尹源字子漸序奉禮尹君之將西也稱古仁者送人之義責言於其交之所常厚者其友人渤海歐陽脩在餞中率然曰余無似雖不能竊仁者之號奈嘗辱君之道義切劘為最深是以一作旣不能無言然君之文行余旣友慕欽揖之不暇顧豈有遺忽乏少之可以進於言邪因姑請更君之字以塞其求云君之名源而字子淵夫源發於淵深且一作其止也於詁訓旣不類又無所表發其名之美甚非稱據禮家之說曰三王之祭川也先河而後海或源也或委也蓋謂其源發而漸進於廣大委其注積也楊子曰百川學海而至於海今君之學也皆古文字聖賢之事業至其尤深而鉅者又烏止淵之譬邪然亦欲君之漸進不已而至深逺博大之無際也請字之曰子漸古者男子之生舉以禮而名之年旣長見廟筮賔而加元服服加而後字示尊其名以隆成人也夫君子所以自厚重其名一作所字如此之甚也誠以其賢否醜美必常與名字相上下而始終邾婁一小國君片善可稱春秋褒之曰儀甫解者謂國不如名名不如字以爲極美之談是也子漸行矣勉之胡寅字序一作字說寅之爲言恭且畏之辭虞書寅賔出日寅餞納日云者堯命其臣羲和者修其官而史美之之文文曰夙夜惟寅云者舜勑其臣伯夷之辭也又曰同寅恊恭和衷㢤云者臯陶戒禹之言言堯舜禹之事載於書者爲萬世之法而其君臣之際相言語者如是是知恭恪畏慎以思其事雖聖人猶然尉氏胡君名寅以問於余且將字之余以謂名者古之人生而有别之稱爾若太甲盤庚仲壬者又一無此字直識其次第而已至於一無此字左丘明者載魯大夫之語始謂命名必有義而學者又以文王武王伯魚之類附其說者尤非也文王之世為商諸侯偶商不幸而紂爲淫虐然猶身一作生服事之豈其生也已有滅商自大之心而名昌其子始生又期使殺君而發其功業㢤孔子之生子適有饋鯉者遂名之若史魚孔鮒又有饋者乎則是直爲識别之稱未嘗有義也然考古人之命字者則似若有義葢將釋其名曰其字若此而巳胡君曰我所以問其字者將知其寅者何謂然因考于古取堯舜禹之書常所道告之而字曰子畏作字說三字一作云送陳子履赴絳州翼城序予昔過鄭遇子履於管城其後二歲子履西自馮翊㑹予於洛陽而去又明年復來遂與一作預郷進士自河南貢于亰師又明年予方解官洛陽以来則子履中甲科爲校書郎其冬得翼城於絳又明年春西拜其親於洛而後行自鄭之遇及茲行凡六歲而曰見之焉其始也純然氣和而貌野再見之則道所學問出其文辭煒一作卓然有出於衆人矣又見之則挾其藝以較於群士而以其能勝之今之行也又曰我將試其爲政於絳而且力廣其學當盡落其華而成其實直取古人之所以尚以一無二字距今之爲者其修巳力行之道屢見而屢進進且一有又字不巳而志又大焉孔子曰未見其止孟子曰孰能禦之者歟夫年少者心銳氣盛者好剛苟有志焉無不至也然君子之於臨政也欲果其行必審其思審而後果則不可易而後悔而學者亦在一朝疑其所趨而後博其聞其致思必精其發辭必易待其足於中而後見於外予友河南冨彦國常與予語於此今彦國在絳而子履往焉又從而辨之後之復見子履豈特若前之見者乎將有駭然者矣送孫屯田序字延仲良金美玉蔵乎礦石而追師冶工莫不孜孜攻且錬焉吾誠有以利其用也況材臣賢士世不衆出而物官者得不貪以為利乎故今茲屯田孫公始以尚書郎来貳洛政未踰歲則復乗兩馬之傳東上將冠惠文以肅臺憲居不皇暖席行不及具駕葢𬒳知者之用且祗君命之速也御史本為秦官出入殿中督察監視事無大小皆得以法繩之至按章舉劾發姦治獄以清風軌則朝廷之得失御史繫焉然過者爲之至有伺求以爲察剛訐以爲直驚愚激俗以速名譽至於紀綱大政則蔑乎無聞也故扵是選必要以文儒沉正閎逹大體然後謇謇王廷為天子司直之臣況乎白筆霜簡吾家舊物握蘭卧錦爲世名郎縁飾以儒雅濟之以文敏余知夫振頽綱舉舊典嗣先聲揚休聞在此行也而洛之士君子故相與翹足企聳東向而望俟聞凛然之餘風矣盍各賦棫樸以歌能官且賀舉者之得人也犯軷長道摻祛爲一作而别又烏足効兒女之悲㢤張令注周易序易之爲書無所不備故爲其說者亦無所不之蓋滯者執於象數以爲用通者流於變化而無窮語精微者務極於幽深喜誇誕者不勝其廣大苟非其正則失而皆入於賊若其推天地之理以明人事之始終而不失其正則王氏超然逺出於前人惜乎不幸短命而不得卒其業也張子之學其勤至矣而其說亦詳焉其爲自序尤所發明昔漢儒白首於一經雖孔子亦晚而學易今子年方壯所得已多而學且不止其有不至者乎廬陵歐陽脩序外集卷第十四送方希則序將有無將字不利二字作好世資禇囊囊作橐送陳經序而下下作北若斷斷作斲擉鼈擉作簎登覧作覽登相慠相下有群爲二字旅遊無遊字暮已己作以三日日作月送揚子聦序歲數之無數字其能出其頭角矣此下一有河南爲皇天下州郡無先者物之盛之衆而能出其頭角矣二十三字遂特特字本疑恕本作將送廖倚序幾歲一作載歲送梅聖俞歸河陽序蜃恕本作蠯先膺二字作光英而精而下有其字志髙志作文行潔㓗作能河陽諸本皆作洛陽按序云聖俞移佐河陽因吏事而至於此事訖言歸余惜其去則非歸洛明矣今正之終則則作而事訖訖下有役特其特作恃張應之字序言則無言宇稱述述作著而深作深靜爲用無爲字尹源字序古仁者一作古之人是以以作既而字子淵文藪作以淵且止同正文胡寅字序之辭辭下有也字美之之文文下有也字禹之言言下有也字言堯舜無言字又直又作此文王之世宋文粹無之字名昌名下有日字古人之命字一作古之人命字所道道下有者字作字說有此二字送陳子履序恕本作陸經子履乃陳經也後歸本姓爲陸故公之集或曰陳曰陸煒然煒作卓所以尚無以字後悔後作無一朝朝字本疑恕本無此字博其聞聞作文致思恕下有也字發辭辭下有也者奏議卷第十四歐陽文忠公集一百十翰苑論水災䟽至和三年七月六日翰林學士朝散大夫尚書吏部郎中知制誥充史館修撰判太常寺兼禮儀事輕車都尉賜紫金魚袋臣歐陽某謹昧死再拜上䟽于體天法道欽文聦武聖神孝徳皇帝陛下臣伏覩近降詔書以雨水爲災許中外臣寮上封言事有以見陛下畏天愛人恐懼脩省之意也竊以雨水爲患自古有之然未有水入國門大臣犇走渰浸社稷破壞都城者此蓋天地之變也至於王城京邑浩如陂湖衝溺犇逃號呼晝夜人畜死者不知其數其幸而免者屋宇摧塌無以容身縛栰露居上雨下水纍纍老㓜狼籍于天街之中又聞城外墳冡亦𬒳浸注棺槨浮出骸骨漂流此皆聞之可傷見之可憫生者旣不安其室死者又不得其藏此亦近世水災未有若斯之甚者此外四方奏報無日不來或云閉塞城門或云衝破市邑或云河口決千百歩闊或云水頭髙三四丈餘道路隔絶田苗蕩盡是則大川小水皆出爲災逺方近畿無不𬒳害此陛下所以警一作驚懼莫大之變隱惻至仁之心廣爲諮詢冀以消復竊以天人之際影響不差未有不召而自至之災亦未有巳出而無應之變其變旣大則其憂亦深臣愚謂非小小有爲可以塞此大異也必當思宗廟社稷之重察安危禍福之機追已徃之闕失防未萌之患害如此等事不過一二而已自古人君必有儲副作嗣下同所以承宗社之重而不可闕者也陛下臨御三十餘年而儲嗣未立此乆闕之典也近聞臣寮多以此事爲言大臣亦甞進議陛下聖意乆而未決而庸臣愚士知小忠而不知大體者因以爲異事遂生嫌疑之論此不思之甚也且自古帝王有子至三二十人者甚多材髙年長羅列於朝者亦衆然爲其君父者莫不皆享無窮之安豈有所嫌而斥其子耶若陛下鄂王豫王皆在至今則儲宫之建乆矣世之庸人偶見陛下乆無皇子忽聞此議遂以云云爾且禮曰一有元良萬國以正蓋謂定天下之根本上承宗廟之重亦所以絶臣下之邪謀自古儲嗣所以安人主也若果如庸人嫌疑之論則是常無儲嗣則人主安有儲嗣則人主危此臣所謂不思之甚也臣又見自古帝王建立儲嗣旣以承宗廟之重又以爲國家羙慶之事故毎立太子則不敢專享其羙必大赦天下凡爲人父後者皆𬒳恩澤所以與天下同其慶喜然則非惡事也漢文帝𥘉即位之明年羣臣再三請立太子文帝再三謙讓而後從之當時羣臣不自疑而敢請漢文帝亦不疑其臣有二心者臣主之情通故也五代之主或出武人或出夷狄如後唐明宗尤惡人言太子事羣臣莫敢正言有何澤者甞上書乞立太子明宗大怒謂其子從榮曰羣臣欲以汝爲太子我將歸老於河東由是臣下更不敢言然而一有漢字文帝立太子之後享國長乆爲漢太宗是則何害其爲明主也後唐明宗儲嗣不早定而秦王從榮後以舉兵窺覬䧟于大禍後唐遂亂此前世之事也況聞臣寮所請但欲擇宗室爲皇子爾未即以爲儲貳也伏惟陛下仁聖聦明洞鑒今古必謂此事國家大計當重慎而不可輕發所以遲之耳非惡人言而不欲爲也然朝廷大議中外已聞不冝乆而不決昨自春首以來陛下服藥于内一無二字大臣早夜不敢歸家飲食醫藥一無十字侍于左右如人子之侍父自古君臣未有若此之親者也下至羣臣士庻婦女嬰孩晝夜禱祈填咽道路發於至誠不可禁止以此見臣民盡忠蒙陛下之徳厚愛陛下之意深故爲陛下之慮逺也今之所請天下臣民所以爲愛君計也陛下何疑而不從乎中外之臣旣喜陛下聖躬康復又欲見皇子出入宫中朝夕問安侍膳于左右然後文武羣臣奉表章爲陛下賀辭人墨客稱述本支之盛爲陛下歌之頌之豈不羙哉伏願一作望陛下出於聖斷擇宗室之賢者依古禮文且以爲子未用立爲儲副也旣可以徐察其賢否亦可以俟皇子之生臣又見樞宻使狄青出自行伍遂掌樞宻始𥘉議者巳爲不可今三四年間外雖未見過失而不幸有得軍情之名且武臣掌國機宻而得軍情豈是國家之利臣前有封奏其說甚詳具述青未是竒材但於今世將率中稍可稱耳雖其心不爲惡不幸爲軍士所喜深恐因此䧟青以禍而爲國家生事欲乞且罷青樞務任以一州旣以保全青亦爲國家消未萌之患蓋縁軍中士卒及閭巷人民以至士大夫間未有不以此事爲言者惟陛下未知之爾臣之前奏乞留中而出自聖斷若陛下猶以臣言爲疑乞出臣前奏使執政大臣公議此二者當今之急務也凡所謂五行災異之學臣雖不深知然其大意可推而見也五行傳曰簡宗廟則水爲災陛下嚴奉祭祀可謂至矣惟未立儲貳易曰主器莫若長子殆此之警戒乎至於水者隂也兵亦隂也武臣亦隂也此推類而易見者天之譴告苟不虚發惟陛下深思而早決庻㡬可以消弭災患而轉爲福應也臣伏覩一作讀詔書曰悉心以陳無有所諱故臣敢及之若其他時政之失必有群臣應詔爲陛下言者臣言狂計愚惟陛下裁擇臣昧死再拜再論水災狀同前右臣伏覩近降手詔以水災爲變上軫聖憂旣一人形罪已之言冝百辟無遑安之意而應詔言事者猶少亦未聞有所施行豈言者不足採歟將遂無人言也豈有言不能用歟然則上有詔而下不言下有言而上不用皆空言也臣聞語曰應天以實不以文動民以行不以言臣近有實封應詔竊謂水入國門大臣犇走渰浸社稷破壞都城此天地之大變也恐非小有所爲可以消弭因爲陛下陳一二大計而言狂計愚不足以感動聽覽臣日夜思惟方今之弊紀綱之壞非一日政事之失非一端水災至大天譴至深亦非一事之所致災譴如此而禍患所應于後者又非一言而可測是則巳徃而當救之弊甚衆未來而可憂之患無涯亦非獨責二三大臣所能取濟況自古天下之治必與衆賢共之也詩曰濟濟多士文王以寧書載堯舜之朝一時同列者䕫龍稷契之徒二十餘人此特其大者爾其百工在位莫不皆賢也今欲救大弊弭大患如臣前所陳一二大計旣未果爲而又不思衆賢以濟庻務則天變何以塞人事何以修故臣復敢進用賢之說也臣材識愚暗不能知人然衆人所知者臣亦知之伏見龍圖閣直學士知池州包拯清節羙行著自貧賤讜言正論聞于朝廷自列侍從良多𥙷益方今天災人事非賢罔乂之時拯以小故棄之遐逺此議者之所惜也祠部員外郎直史館知襄州張瓌静黙端直外柔内剛學問通逹似不能言者至其見義必爲可謂仁者之勇此朝廷之臣非州郡之才也祠部員外郎崇文院檢討吕公著故相夷簡之子清静寡欲生長冨貴而淡於榮利識慮深逺文學優長皆可過人而喜自晦黙此左右顧問之臣也太常博士群牧判官王安石學問文章知名當世守道不苟自重其身論議通明兼有時才之用所謂無施不可者凡此四臣者難得之士也拯以小過棄之其三人者進退與衆人無異此皆爲世所知者猶如此臣故知天下之廣賢材淪没於無聞者不少也此四臣者名迹巳著伏乞更廣詢採亟加進櫂置之左右必有禆𥙷凡臣所言者乃願陛下聽其言用其才以濟時艱爾非爲其人私計也若量霑恩澤稍陞差遣之類適足以爲其人累耳亦非臣薦賢報國之本心也臣伏見近年變異非止水災譴告丁寜無所不有董仲舒曰國家將有失道之敗而天乃先出災害以譴告之不知自省又出恠異以警懼之尚不知變而傷敗乃至斯言極矣伏惟陛下切詔大臣深圗治亂廣引賢俊與共謀議未有衆賢並進而天下不治者此亦救災弭患一端之大者臣又竊見京東京西皆有大水並當存䘏而獨河北遣使安撫兩路遂不差人或云就委轉運使此則但虚爲行遣爾兩路運司只見河北遣使便認朝廷之意有所重輕以謂不遣使路分非朝廷憂恤之急者兼又放稅賑救皆耗運司錢一作用物於彼不便兼又運使未必皆得人其才未必能救災䘏患又其一司自有常行職事亦豈能專意撫綏故臣以爲虚作行遣爾伏乞各差一使於此兩路安撫雖未能大段有物賑濟至於興利除害臨時措置更易官吏詢求疾苦事旣專一必有所得與就委運司其利百倍也又聞兩浙大旱赤地千里國家運米仰在東南今年災傷若不賑濟則來年不惟民饑國家之物亦自闕供此不可不留心也竊聞三司今歳京師糧米巳有二年備準外猶有三百五十萬餘未漕之物今年東南旣旱則來年少納上供此未漕之米誠不可不惜然少輟以濟急時亦未有所闕欲下三司勘㑹若實如臣所聞則乞量輟五七十萬石物與兩浙一路令及時賑救一十三州只作借貸他時米熟不妨還官然所利甚博也此非弭災之術亦救災之一端也臣愚狂妄伏望聖慈特賜裁擇謹具狀奏聞伏候勑㫖論水入太社劄子同前臣所領太常寺累得郊社勾當人狀申爲雨水渰浸太社太稷壇四靣及屋宇墻壁摧塌乞行修整尋一無尋字曽具狀申奏及累牒三司至今未見有人興功整緝但聞行路之人咨嗟傳說言國家社稷之壇損壊如此臣遂躬親徃詰太社及齋宫裏外覷當見二壇浸在水中四神門及闕庭齋宫屋宇並各倒側摧圯并自來所植樹木亦有僵仆與瓦石土木縱横狼籍於水中四靣並無墻垣行路之人徃來皆見竊以宗廟社稷禮貴尊嚴今四靣並無遮映使巷陌人馬徃來䙝瀆如此而又積水圍浸瓦木土石狼籍具中臣𥘉到彼旁側居民見臣來覷當亦有對臣咨嗟者又見有數人兵士在彼戽水問得只有二十三人仍是今日纔方差到旣無家事戽水又無官貟監督社稷之重豈冝如此竊以水入社稷咎罰豈輕陛下仁聖寛慈未有過失天之譴告必有所因伏乞特諭執政之臣退省巳失之事各思警懼速務修完仍較量事體輕重後先以社稷爲國家大事不與軍營倉卒一例行遣乞專差大臣一員充修太社太稷使并差幹事諸司使及使臣一兩員監役及差兵匠併力先且決洩戽出積水築起四面垣墻不使路人車馬徃來䙝瀆然後整緝諸屋舎等以稱陛下尊嚴社稷上畏天戒之意臣以軄事不敢不言取進止差知禮院王起三司判官王繹監修提舉乞添上殿班劄子嘉祐元年十月臣伏見陛下自今春服藥已來羣臣無得進見今聖體康𥙿日御前後殿視朝決事中外臣庻無不感恱然侍從臺諌省府臣寮皆未曽一作能得上殿奏事今雖邊鄙寧静時歳豐稔民無疾癘盗賊不作天下庻務粗循常規皆不足上煩聖慮陛下可以游心清閑頥飬聖體然侍從臺諫省府臣寮皆是陛下朝夕左右論思獻納委任之臣豈可曠隔時月不得進見於前不惟亦有天下大務理當論述者至於臣子之於君父動經年一作半歳不得進對豈能自安一有臣字今欲望聖慈毎遇前後殿坐日中書樞宻院退後如審官三班銓司不引人則許臣察一班上殿假以頃刻進瞻天威不勝臣子區區之願也如允臣所請乞下閤門施行仍約束上殿臣寮不得將干求恩澤訴理功過及細碎閑慢等事上煩聖聦或乞約定上殿時刻所貴不煩乆坐伏候勑㫖其後上殿添一班論賈昌朝除樞宻使劄子一作論某人交結宦官狀嘉祐元年十一月臣伏見一作覩近降制書除賈昌朝爲樞宻使旬日以來中外人情莫不疑懼縉紳公議一作論漸以沸騰蓋縁一作由昌朝禀性回邪執心傾險頗知經術能文一作縁飾姦言好一作善爲隂謀以䧟害良士小人朋附者衆皆樂爲其用前在相位一作政事累害善人所以聞其再來望風恐畏一作畏恐陛下聦明仁聖勤儉憂勞毎於用人尤所審慎然而自古毀譽之言未甞不並進於前而聽察一作納之際人主之所難也臣以謂能知聽察之要則不失之矣何謂其要在先察毀譽之人一作臣若所譽者君子所毀者小人則不害其進用矣若君子非之小人譽之則可知其人不可用矣一作小人譽之君子非之則其人可知其不可用矣今有毅然立於朝危言讜一作正論不阿人主不附權臣其直節忠誠爲中外素所稱信者君子也如此等人一無四字皆以昌朝爲非矣宦官宫女左右使令之人徃徃小人也如此等人一無四字皆以昌朝爲是矣陛下察此則昌朝爲人可知矣今陛下之用昌朝與執政大臣謀而用之乎與立朝忠正之士一作臣謀而用之乎與左右近習之臣一作與宦官左右之人謀而用之乎或不謀於臣下斷自聖心而用之乎昨聞昌朝隂結宦竪􅌟造事端謀動大臣以圖進用若陛下與執政大臣謀之則大臣勢在一作自處嫌疑必難啓口若立朝忠正之士則無不以爲非矣其稱譽昌朝一作其所稱信以爲可用者不過宦官左右之人爾陛下用昌朝爲天下而用之乎爲左右之人而用之乎臣伏思一作料陛下必不爲左右之人而用之也然左右之人謂之近習朝夕出入進見無時其所讒䛕能使人主不覺其漸昌朝善結宦官人人喜爲稱譽朝一人進一言暮一人進一說無不稱昌朝之善者一有使字陛下視聽漸熟遂簡在于聖心及將用之時則不必與謀一有議字也蓋稱薦有漸乆巳熟于聖聦三字一作於聴矣是則陛下雖斷自聖心不謀臣下一作於人而用之亦左右之人積漸稱譽之力也陛下常患近歳以來一無二字大臣體輕連爲言事者彈擊蓋由用非其人不叶物議而然也今昌朝身爲大臣見事不能公論乃結交中貴因内降以起獄一有訟字以此規圗進用竊一作今聞臺諫方欲論列其過惡而忽有此命命字一作差除是以中外疑懼物論喧一作沸騰也今昌朝未來議論一作外議已如此則使其在位一作若使居其位必不免言事者上煩聖聽若不爾則昌朝得遂一作遂得其志傾害善人壞亂朝政一作事體必爲國家生事臣愚欲望聖慈一作臣願聖聰抑左右隂薦之言採縉紳公正一作議之論一作說早一作速罷昌朝還其舊鎮一作任則天下幸甚臣官爲學士職號論思見聖心求治甚勞而一旦用人偶失而外廷物議如此旣有見聞合思禆𥙷取進止舉留胡瑗管勾太學狀同前右臣伏見新除國子監直講胡瑗充天章閣侍講有以見聖恩奬崇儒學襃勸經術之臣也然臣等竊見國家自置太學十數年間生徒日盛常至三四百人自瑗管勾太學以來諸生服其徳行遵守規矩日聞講誦進徳修業昨來國學開封府并鏁㕔進士得解人中四字一作内三百餘人是瑗一作皆是胡瑗所教然則學業有成非止生徒之幸庠序之盛亦自一無自字是朝廷一有之字羙事今瑗旣升講筵遂去太學竊恐生徒無依漸以分散竊以學校之制自昔難興惟唐太宗時生員最多史冊書之以爲盛羙其後庠序廢壞至于今日始復興起若一旦分散誠爲可惜也一作誠可惜矣臣等欲望聖慈特令胡瑗同勾當國子監或專一作兼管勾太學所貴生徒不至分散伏候勑㫖薦布衣蘇洵狀嘉祐五年右臣猥以庸虚叨塵侍從無所禆𥙷常愧心顔竊慕古人薦賢推善之意以謂爲時得士亦報國之一端徃時自國家下詔書戒時文諷勵學者以近古蓋自天聖迄今二十餘年通經學古履忠守道之士所得不可勝數而四海之廣不能無山巖草野之遺其自重者旣伏而不出故朝廷亦莫得而聞此乃如臣等輩所宜求而上逹也伏見眉州布衣蘇洵履行淳一作純固性識明逹亦甞一舉有司不中遂退而力學其論議精於物理而善識變權文章不爲空言而期於有用其所撰權書衡論機䇿二十篇辭辯閎偉博於古而冝於今實有用之言非特能文之士也其人文行乆爲郷閭所稱而守道安貧不營仕進苟無薦引則遂棄於聖時其所撰書二十篇臣謹隨狀上進伏望聖慈下兩制看詳如有可採乞賜甄録謹具狀奏聞伏候勑㫖舉梅堯臣充直講狀嘉祐元年右臣等忝列通班無禆聖治知士不薦咎在蔽賢伏見太常博士梅堯臣性純一作淳行方樂道守節辭學優贍經術通明長於歌詩得風雅之正雖知名當時而不能自逹竊見國學直講見闕二員堯臣年資皆應選格欲望依孫復例以𥙷直講之員必能論述經言教導學者使與國子諸生歌詠聖化于庠序以副朝廷育材之羙如後不如舉狀臣等並甘同罪舉布衣陳烈充學官劄子嘉祐元年臣伏見國家崇建學校近年以來太學生徒常至三四百人此朝廷盛羙之事數百年來未甞有也然而教導之方必慎其選其進徳修業必有篤行君子可以不言而化者使居其間以爲學者師法庻㡬内修其實不止聚徒之多爲虚名之羙也伏見福州處士陳烈清節茂行著自少時晚而益勤乆而愈信非惟一方學者之所師蓋天下之士皆推尊其道徳謂冝以禮致之朝廷必有禆𥙷近聞命以官秋使教學於郷里其禮甚薄未足以稱勵賢旌徳之舉臣今乞以博士之職召致太學雖未能盡其材亦足以副天下學者之所欲而成一作爲朝廷崇賢勸學之實取進止再乞召陳烈劄子嘉祐二年臣甞奏舉福州處士陳烈有道徳可爲博士處之太學竊聞朝廷命以官秩俾之講說而烈辭讓不起臣亦甞知烈之爲人其學行髙古然非矯激之士一有也字其所藴蓄亦欲有所施爲況聖恩優異襃賁所及足以勸天下之爲善者在烈不冝辭避然其進退之際亦有所難蓋朝廷前命以本州教授彼方辭讓而遽有國學之召義不得不辭然自古國家樂賢好士未始不如此在下者逡廵而避讓在上者勤勤而不已以勵難進之節而天下靡然識上有好賢不倦之心上下相成以勸風俗臣謂朝廷冝再加優命致烈必來則於其一作其於進退之際巳足以勉勵媮薄臣今欲乞未命以官但且召至京師彼必無名辭避俟其旣至徐可推恩况今胡瑗疾病方乞致仕學校之職不可闕人能繼瑗者非烈不可欲乞早賜指揮取進止薦王安石吕公著劄子至和中臣伏見陛下仁聖聦明優容諫諍雖有狂直之士犯顔色而觸忌諱者未甞不終始保全徃徃亟加擢用此自古明君賢主一作聖王之所難也然而用言旣難獻言者亦不爲易論小事者旣可鄙而不足爲陳大計者又似迂而無速效欲㣲諷則未能感動將直陳則先忤貴權而旁有群言奪於衆力所陳多未施設其人遽巳改遷致陛下有聽言之勤而未見用言之效頗疑言事之職但爲速進之階蓋縁臺諌之官資望已峻少加進擢便履清華而臣下有厭人言者因此亦得進說直云此軰務要官職所以多言使後來者其言益輕而人主無由取信辜陛下納諫之意違陛下賞諌之心臣以謂欲救其失惟冝擇沉黙端正守節難進之臣置之諌署則旣無干進之疑庻或其言可信㐲見殿中丞王安石徳行文學爲衆所推守道安貧剛而不屈司封員外郎吕公著是夷簡之子器識深逺沉静寡言冨貴不染其心利害不移其守安石乆更吏事兼有時才曽召試館職固辭不就公著性樂閑退淡於世事然所謂夫人不言言必有中者也徃年陛下上遵先帝之制増置臺諫官四員巳而中廢復止兩員今諫官尚有虚位伏乞用此兩人𥙷足四員之數必能規正朝廷之得失禆益陛下之聦明臣叨𬒳恩榮未知報效苟有所見不敢不言取進止乞留中遂不出薦張立之狀臣伏見朝廷之議常患方今士人名節不立民俗禮義不修所以取士多濫而浮僞難明愚民無知而冒犯者衆蓋由設教不篤而奬善無方也伏見徐州進士同三禮出身見守選人張立之能事父母有至孝之行著聞郷里本州百姓僧道列狀稱薦前後長吏累次保明安撫臣寮亦曽論奏至今未蒙朝廷甄擢其人母年八十無禄以飬銓司近制於選人秖許入邉逺官立之家居則患禄不逮親欲就逺官則難於扶侍有至孝之行而進退失所有累薦之羙而襃勸不及於立之飬親之志所希至少於朝廷獎善之道所施至多伏望聖慈特下銓司採閱本人行止及前後論薦迹狀與一本州合入官所貴旌一士之行勸一郷之人伏以古今致理先於孝子勸賞最勤今孝悌之科乆廢不舉旌表之禮乆闕不行欲乞今後應有孝行著聞累𬒳薦舉者與一本州官令自化其郷里仍乞著爲永式其張立之如允臣所奏乞送銓司施行奏議卷第十四論水災䟽不幸不字上有而字舉陳希烈充學官劄子今乞以一作今乞命以居士集卷第十四歐陽文忠公集十四律詩六十五首馬上黙誦聖俞詩有感一作偶題興來筆力千鈞勁一作重酒醒一作醉後人間萬事空蘇梅二子今亡矣索寞滁山一醉一作惆悵滁陽一病翁定力院七葉木伊洛多佳木娑羅舊得名常於佛家見宜在月宫生釦砌隂鋪靜虚堂子落聲夜風疑雨過朝露炫霞明車馬王都盛樓臺梵宇閎惟應靜者樂時聽野禽鳴秋隂秋隂積不散夜氣凜初清雨冷侵燈暈風愁送葉聲國㤙慙未報歳晚念餘生却憶滁州睡村醪自解酲秋懷節物豈不好秋懷何黯然西風酒旗市細雨菊花天感事悲雙鬢包羞一作貪榮食萬錢鹿車終自駕歸去潁東田初寒多病淹殘歳初寒悄獨吟雲容乍濃淡秋色半晴隂籬菊催佳節山泉響夜琴自能知此樂何必戀腰金寄渭州王仲儀龍圖一作送王素之渭州羡君三作臨邊守慣聽胡笳不慘然弓勁秋風鳴白角帳寒春雪壓青氊威行四境烽煙斷響入千山號令傳翠幕紅燈照羅綺心情何似十年前崇政殿試賢良晚歸槐柳依依禁籞長初寒人意自凄凉鳯城斜日留殘照玉闕浮雲結夜霜老負漁竿貪國寵病須樽酒送年光歸來解帶西風冷衣袖猶霑玉案香聞潁州通判國博與知郡學士唱和頗多因以奉寄知郡陸經通判楊褒一自蘇梅閉九泉始聞東潁播新篇金樽留客史一作使君醉玉麈髙談别乗賢十里秋風紅菡蓞一溪春水碧漪漣政成事簡何爲樂終日吟哦雜管絃南郊慶成祀教民昭孝天惟德是親太宫嚴大饗吉土兆精禋禮樂三王盛梯航萬國賔㤙霑羣動洽慶與一陽新奉冊尊長樂均釐及衆臣不須雲物瑞和氣浹人神和昭文相公上己宴一雨初消九陌塵秉蘭修楔及芳辰㤙深始錫龍池宴節正須一作方知鳯曆新是歳始頒明天新曆三月三日丁已紅琥珀傳盃㶑灩碧琉璃瑩水􅔿淪上林未放花齊發留待鳴鞘出紫宸三日赴宴口占賜飲初逢褉節佳昆池新漲碧無涯九門寒食多遊騎三月春隂正養花共喜流觴修故事自憐雙鬢惜年華鳯城殘照歸鞍晚禁籞無風柳自斜讀楊蟠章安一本有詩字集蘇梅乆作黃泉客我亦今爲白髪翁卧讀楊蟠一千首乞渠秋月與春風蘇主簿挽歌洵布衣馳譽入京都丹旐俄驚一作聞反舊閭諸老誰能先賈誼君王猶未識相如三年弟子行喪禮千兩郷人㑹葬車我獨一作獨我空齋掛塵榻遺編時閱子雲書寄題沙溪寳錫碑本作積院爲愛江西物物佳作詩甞向北人誇青林霜日換一作染楓葉白水秋風吹稻花釀酒烹雞留醉客鳴機織墨蹟作緝苧徧山家野僧獨得無生樂終日焚香坐結跏宋司空一作元憲公挽辭文章天下無雙譽伯仲人間第一流出入兩朝推舊德周旋三事著嘉謀從容進退身名泰寵錫哀一作襃榮禮數優棠從來敦友愛九原相望接松楸感事治平丁未正月二十有六日故園三徑人成荒賢路胡爲此坐妨病骨痩便花蘂暖嘉祐八年于闐國王遣使來朝貢恩賜宰臣巳下于闐所獻花蘂布柔肕㓗白如凝脂而禦風甚温不減駞褐也煩心渴喜鳯團香先朝舊例兩府輔臣歳賜龍茶一斤而巳余在仁宗朝作學士兼史館修撰甞以史院無國史乞降一本以備檢討遂命天章閣録本付院仁宗因幸天章見書吏方録國央思余上言亟命賜黄封酒一瓶果子一合鳯團茶一斤押賜中使語余云上以學士校新寫國史不易遂有此賜然自後月一賜遂以爲常後余忝二府猶賜不絶號弓但灑孤臣血憂國空餘兩鬢霜何日君㤙憫衰朽許從初服返耕桑大行皇帝靈駕發引挽歌辭享國年雖近新民澤巳深儉勤成禹聖仁孝本虞心方慶逢千載俄驚遏八音天愁嵩嶺外雲慘洛川潯仗動千官衛神行萬象隂孤臣㤙未報清血但盈襟其一文景孜孜儉與恭慨然思就太平功興隆學校皇家盛放斥嬪嬙永巷空威懾一作攝黠羌方問罪丹成仙鼎忽遺弓霜清日薄簫笳咽萬國悲號慘澹中其二千齡應運叶天人四海方欣政日新忽見九門陳羽衛猶疑五載欲時廵􅒀稜月暗翔金鳯輦道霜清卧石麟白首舊臣瞻畫翣秋風淚灑屬車塵其三奉答子履學士見贈之作誰言潁水似潚湘一笑相逢樂未央歳晚君尤耐霜雪興闌吾欲返耕桑銅槽旋壓清樽美玉麈閑揮白日長豫約詩一作書筒屢來徃兩州雞犬接封疆送道州張職方桂籍青衫憶共遊憐君華髪始爲州身行南鴈不到處山與北人相對愁莫爲髙才輕遠俗當令遺老識賢侯三年解組來歸日吾已先耕潁水頭再至汝隂三絶黃栗留鳴桑葚美紫櫻桃熟麥風涼朱輪昔愧無遺愛白首重來似故郷十載榮華貪國寵一生憂患損天真潁人莫恠歸來晚新向君前乞得身水味甘於大明井魚肥恰似新開湖十四五年勞夢寐此時才得少踟蹰余時將赴亳社㤙許枉道過潁也郡齋書事寄子履使君居處似山中吏散焚香一室空雨過紫苔惟鳥迹夜涼蒼檜起天風白醪酒嫰迎秋熟紅棗林繁喜歳豐寄語瀛洲未歸客醉翁今巳作僊翁答子履學士見寄潁亳相望樂未央吾州仍得治仙郷夢回枕上黄粱熟身在壷中白日長毎恨老年才已盡怕逢詩敵力難當知君欲别西湖去乞我橋南菡蓞香寄棗人行書贈子履學士秋來紅棗壓枝繁堆向君家白玉盤甘辛楚國赤萍實磊落韓嫣黃金丸聊効詩人投木李敢期佳句報琅玕嗟予乆苦相如渇却憶冰梨熨齒寒贈隱者五岳嵩當天地中聞君仍在最髙峯山藏六月隂崖雪潭飬千年蛻骨龍物外自應多至樂人間何事忽相逢飲罷飄然不辭決孤雲飛去杳無蹤戲書示黎教授古郡誰云亳陋邦我來仍值歳豐穰烏衘棗實園林熟一本作密蜂採檜花村落香世治人方安壠畒興闌吾欲反耕桑若無潁水肥魚蟹終老仙郷作醉郷書懷一作思潁寄常處士齒牙零落鬢毛踈潁水多年已結廬解組便爲閑處士新花莫笑病尚書青衫仕至千鍾禄白首歸乘一鹿車況一作幸有西鄰隱君子輕蓑短一作披蓑帶笠伴春鋤常夷甫也渦河龍潭碧潭風定影涵虚神物中藏岸不枯一夜四郊春雨足却來閑卧養明珠遊太清宫出城馬上口占擁斾西城一據鞍耕夫初識勸農官鵶鳴日出林光動野闊風揺麥浪寒漸暖緑楊纔弄色得晴丹杏不勝繁牛羊雞犬田家樂終日思歸盍掛冠太清宫燒香清晨琳闕聳㠝岏弭節齋坊暫整冠玉案拜時香裊裊畫廊行處佩珊珊壇埸夜雨蒼苔古樓殿春風碧瓦寒我是蓬萊宫學士朝真便合列仙官謝提刑張郎中寄笻竹柱杖玉光瑩潤錦斕斑霜雪經多節愈堅珍重故人相贈意扶持衰病過殘年七言二首答黎教授撥甕浮醅新釀熟得霜寒菊始開齊養丹道士顔如玉愛酒山公醉似泥不惜蘂從蜂採去尚餘香有蝶來棲莫嫌學舍官閑冷猶得芳樽此共携共坐欄邊日欲斜更將金蘂泛流霞欲知却老延齡藥百草枯時始見花又寄許道人緑髪方一作青瞳瘦骨輕飄然乗鶴去吹笙郡齋獨坐風生竹疑是孫登長嘯聲扶溝知縣周職方録示白鶴宫蘇才翁子美贈黃道士詩并盛作三絶見索拙句輙爲四韻奉酬能棊好飲一道士醉墨狂吟二謫仙道士不聞乗白鶴謫仙今已揜黃泉古來豪傑皆如此誰拂塵埃爲惘然華髪郎官才調美更將新句續遺篇曉發齊州道中二首後一首五言東州㡬日倦征軒千騎驂驔白草原鴈入寒雲驚曉角雞鳴蒼一作滄海浴朝暾國恩未報身先老客思無憀一作聊歳巳昬誰得平時爲郡樂自憐痟渇馬文園歳晚勞征役一作晚歳倦征軒三齊舊冨閑人行桑下路日上一作出海邊山軒冕非吾志風霜犯客顔惟應思潁夢先過穆陵關表海亭望海亭亭古堞間獨憑危檻俯人寰苦寒冰合分一作雙流水南洋北洋河也一在州中一在城外欲雪雲垂四面山州城四面皆山東西二面山差逺唯此亭髙盡見之髀肉已消嗟病骨凍醪猶可慰愁顔潁田二頃春蕪没安得柴車自駕還歳晚書事一麾新命古三齊白首滄洲願已違軒冕從來爲外物山川信美獨思歸長天極目無飛鳥積雪生光射落暉臘候巳窮春欲動勸耕猶得覽郊圻謁廟馬上有感旌斾曉悠悠行驚歳巳遒霜雲依日薄野水帶冰流冨庶齊三服山川禹九州自憐思潁意無異旅人愁毬埸看山爲愛南山紫翠峯偶來仍值雪初融自嫌前引朱衣吏不稱閑行白髪翁向老光隂雙轉轂此身天地一飄蓬何時粗報君㤙了去逐㝠㝠物外鴻殘臘一作雪臘雪初銷一作融上古臺桑郊向日綵旗開山横南陌城中見春逐東風海上來老去毎驚新歳換病多能使壯心摧自嗟空有東陽瘦覽物慙無八詠才歳暮書事東州負海圻風物老依依歳熟鵶聲樂天寒鴈過稀跨鞍驚髀骨數帶減腰圍却羡常夫子終年獨掩扉聞沂州盧侍郎致仕有感少年相與探花開老病惟愁節物催蹉蛇歸計荒三徑牢落生涯泥一杯潁上先生招不起沂州太守亦歸來自媿國恩終莫報尚貪榮禄此徘徊春晴書事莫笑青州太守頑三齊人物舊安閑晴明風日家家柳髙下樓臺處處山嘉客但當傾美酒青春終不換頽顔惟慙未報君㤙了昨日盧公衣錦還遊石子澗冨相公創亭嶻嶭髙亭古澗隈偶携嘉客共一作此徘徊席間風起聞天籟雨後山光入酒杯一作朝廷元老今華衮巖壁遺文巳緑苔泉落斷崖舂壑響花藏深崦過春開一作新雨亂泉逢石響過春深谷尚花開麏䴥一作林間禽鳥莫驚顧太守不將車騎來讀易莫嫌白髪擁朱輪恩許東州養病臣飲酒橫琴銷永日焚香讀易過殘春昔賢軒冕如遺屣世路風波偶脫身寄語西家隱君子奈何名姓巳驚人水磨亭子多病山齋猒鬱蒸經時乆不到東城新荷出水雙飛鷺喬木成隂百囀鸎載酒未妨佳客醉憑髙仍見老農耕史君自有林泉趣不用絲篁亂水聲寄題相州榮歸堂一本此篇巳下係酬答安陽韓侍中五詠白首三朝社稷臣壷漿夾道擁如雲金貂爭看真丞相竹馬猶迎舊使君豈止軒裳誇故里已將鍾鼎勒元勲不須授簡樽前客好學平津自有文晝錦堂昔憇甘棠長舊圍重來城郭歎人非隨車仍是爲霖雨𬒳衮何如衣錦歸公前出自西樞以武康之節鎮相臺今罷鈞軸以司徒侍中再鎮觀魚軒當年下澤驅羸馬今見犀兵擁碧油位望愈隆心愈靜毎來臨水翫游儵狎鷗亭險夷一節如金石勲德俱髙映古今豈止忘機鷗鳥信陶鈞萬物本無心休逸臺清談終日對清樽不似崇髙冨貴身巳有山川資勝賞更將風月醉嘉賔青州書事年豐千里無夜警吏一作公退一室焚清香青春固非老者事白日自爲閑人長禄厚豈惟慙飽食俸餘仍足一作得買輕裝君㤙天地不違物歸去行歌潁水傍留題南樓二絶一本前一首題作偶書偷得青州一歳閑四時一作案頭終日面孱顔須知我是愛山者無一詩中不說山醉翁到處不曽醒問向青州作麽生公退留賔誇酒美睡餘欹枕看山橫答和王宣徽一作答王宣徽見贈相逢莫恠我皤然出處參差四紀間有道方令萬物遂無能擬乞一身閑花前獨酌罇前月淮上扁舟枕上山此樂想公應未暇且持金盞醉紅顔答和吕侍讀昔日題輿媿屈賢今來還見擁朱轓笑談二紀思如昨名望三朝老更尊野徑冷香黃菊秀平湖斜照白鷗翻此中自有忘言趣病客猶堪奉一罇奉答子履學士見寄之作憶昨𥘉爲亳守行暫休車騎汝隂城喜君再共罇爼樂憐我乆懷丘壑情累牘巳甞陳素志新春應許遂歸耕老年雖不堪東作猶得酣歌詠太平謝景平挽詞憶見竒童髧兩髦遽驚名譽衆推髙東山子弟家風在西漢文章筆力豪方看凌雲馳騄驥已嗟埋玉向蓬蒿追思陽夏曽遊處撫事傷心涕滿袍答資政邵諫議見寄二首豪橫當年氣吐虹蕭條晚節鬢如蓬欲知潁水新居士即是滁山舊醉翁所樂藩籬追尺一作斥鷃敢言寥廓逐冥鴻期公歸輔巖廊上顧我無忘畎畒中欲知歸計乆遷延三十篇詩二十年受寵不思身報効乞骸惟冀上哀憐相如舊苦中痟渇陶令猶能一醉眠材薄力殫難勉強豈同髙士愛林泉居士集卷第十四熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正寄題沙溪寳積院寳積去沙溪十五里詩刻猶在而諸本皆作寳錫今兩存之永厚陵挽歌辭前有引狀朝佐攷公家定本如謝賜飛白詩引狀皆載别卷今編入外集第五卷此不重出恕本惟亭亭作髙亭餘並同正文潁州唱和東潁一作西潁何爲樂一作還多暇靈駕發引挽歌辭黠羌一作戎羌郡齋書事秋熟一作秋色書懷春鋤一作舂鋤表海亭亭亭一作髙亭, WYG: ''}
