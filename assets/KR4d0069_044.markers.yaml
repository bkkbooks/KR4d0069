  - {type: variant, offset: 0, length: 825, content: 居士集卷第四十四歐陽文忠公集四十四序六首傳一首附思潁詩後序皇祐元年春予自廣陵得請來潁愛其民淳訟簡而物産美土厚水甘而風氣和於時慨然巳有終焉之意也爾來俯仰二十年間一無此字歷事三朝竊位二府寵榮巳至而憂患隨之心志索然而筋骸憊矣其思潁之念未甞一有一日二字少忘于心一無此二字而意一作心之所存亦時時見於文字也今者幸蒙寛恩獲解重任使得待罪于亳旣釋危機之慮而就間曠之優其進退岀處顧無所繫於事矣謂可以償夙志者此其時哉因假道于潁蓋將謀一有葺弊廬以四字決歸休之計也乃發舊藁得自南京以後詩十餘篇皆思潁之作以見予拳拳於潁者非一日也不類勌飛之鳥然後知還惟恐勒移之靈却回俗駕爾治平四年五月三日廬陵歐陽脩序歸田録序歸田録者朝廷之遺事史官之所不記與夫士大夫笑談之餘而可録者録之以備閑居之覽也有聞而誚余者曰何其迂哉子之所學者修仁義以爲業誦六經以爲言其自待者冝如何而幸蒙人主之知備位朝廷與聞國論者蓋八年于兹矣旣不能因時奮身遇事發憤有所建明以爲𥙷益又不能依阿取容以徇丗俗使怨嫉謗怒叢于一身以受侮于羣小當其驚風駭浪卒然起於不測之淵而蛟鰐黿鼉之怪方駢首而闖伺乃措身其間以蹈必死之禍頼天子仁聖惻然哀憐脫於垂涎之口而活之以賜其餘生之命曾不聞吐珠銜環效蛇雀之報蓋方其壯也猶無所爲今旣老且病矣是終負人主之恩而徒乆費大農之錢爲太倉之䑕也爲子計者謂冝乞身于朝逺引疾去以深戒前日之禍十一字一作退避榮寵而優游田畒盡其天年猶足竊知止之賢名而乃裴回俯仰乆之不決此而不思尚何歸田之録乎余起而謝曰凡子之責我者皆是也吾其歸哉子姑待治平四年九月乙未歐陽脩序仲氏文集序嗚呼語稱君子知命所謂命其果可知乎貴賤窮亨用捨進退得失成敗其有幸有不幸或當然而不然而皆不知其所以然者則推之於天曰有命夫君子所謂知命者知此而已蓋小人知在我故常無所不爲君子知有命故能無所屈凡士之有材而不用於丗有善而不知於人至於老死困窮而不悔者皆推之有命而不求苟合者也余讀仲君之文而想見其人也君諱訥字樸翁其氣剛其學古其材敏其爲文抑揚感激勁正豪邁似其爲人少舉進士官至尚, WYG: ''}
