  - {type: variant, offset: 0, length: 703, content: 外集卷第十一歐陽文忠公集六十一碑銘衛尉卿祁公神道碑銘惟太原祁氏其先出於黄帝之子二十五人一食於祁遂爲氏太原晉公盛於春秋之際祁氏亦盛於晉其後世逺而衰子孫散亡一作亡散之他國有居譙者即爲譙人後幾世生公諱某公由曽祖一有考字以来畜徳藴明世不大顯公生幾歲始有賢子革革咸平三年以郷貢進士中一作及第始以禄榮其親後幾歲公卒卒之歲實景祐四年正月二十七日享年六十有一革旣棄官服䘮于家日月二字一作旣訖如禮起復就仕仕又某年始爲尚書郎然後又以爵榮之一命贈大理評事累升衛尉卿夫人楚氏某人女其賢爲公之配後公以卒天聖八年始以公夫人之喪合葬譙縣湯隂郷將葬乃考其世徳刻石蔵墓中又圖刻於墓隧之外以暴露顯揚孝子之心也𥘉公間居常命革曰祁氏世有仕族一作官名聲可稱聞者比比出於時自國家建隆以来天子每一作歲歲下書四方舉賢能之士以官之而四方之人摩肩爭出獨祁氏無一人之迹至譙刺史廷下稱應書者豈吾門遂廢乎抑大廢而後興也或後遂興興由汝也於是盡出其家之有益市群書日釀酒爲具以待四方之賔使與之遊毎郷里大儒先生講說授學校一作徒子即隨酒具以往勤勤盡其歡歲時未嘗懈怠不一有敢字顧資産之有無者惟奉其家祭祀及以禮士君子爾由是浸漸以成人及享子禄不數歲乃終人謂力勞而報約何也旣而享名爵登九卿然後郷里榮之夫享子養人之常殁而榮不朽顧天之報予孰云無厚薄哉惟公以純篤敦實履其身行其家以大其門教其子卒成其志志成矣而身殁身殁而名益榮矣今又得顯書其行掲之金石以彰爲善之効而以其餘勸於後人得爲賢也噫今有人一作人有負材與能昂立人上與時爭髙下不肯分寸屈其心而卒困厄顛踣怏怏不得志欲一縣佐不可得以至窮且老殁無聞者幸而得志處富貴極崇髙即死而身名俱滅子孫至爲僕隷轉死溝壑者亦不可數用彼較此得失孰多乎豈負材與畜徳, WYG: ''}
