  - {type: variant, offset: 0, length: 314, content: 居士集卷第四十九歐陽文忠公集四十九祭文二十首求雨祭一作五龍祈雨文年月日乾德縣令歐陽脩謹以清酌庶羞之奠祭于五龍之神曰百里之地一時而不雨則民𬒳其災者數千家然則水旱一有之字重事也一無此字天之庇生斯民者豈欲輕爲之乎不幸而遭焉則歸其說於二者一曰吏之貪戾不能平民而使怨吁之氣干於隂陽之和而然也一曰凡山川能出雲爲雨者皆有神以主之以節豐凶而爲民之司命也故水旱之災不以責吏則以告神嗚呼民不幸而罹其災脩一作吏與神又不幸而當其事者以吏食其禄而神享其祀也今歳旱矣令一作吏雖愚尚知恐懼而奔走神至靈也得不動於心乎尚饗求雨祭漢景帝文維年月日具官脩告于漢孝景帝之神縣有州帖祈雨諸祠縣令至愚以謂雨澤頗時民不至於不足不敢以煩神之視聽癸丑岀于近郊見民稼之苗者荒在草間, WYG: ''}
