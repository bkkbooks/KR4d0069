  - {type: variant, offset: 298, length: 3698, content: 之曰待雨而后耘耔又行見老父曰此月無雨歳將不成然後乃知前所謂雨澤頗時者徒見於城郭之近而縣境數百里山陂田畒之間蓋夫及也脩以有罪爲令於此冝勤民事神以塞其責令旣治民獄訟之不明又不求民之所急至去縣十餘里外凡民之事皆不能知頑然慢於事神此脩爲罪又甚於所以來爲令之罪惟神爲漢明帝生能惠澤其民布義行剛威靈之名照臨後丗而尤信於此土之人神其降休以答此土之民之信尚饗祭桓侯文謹以彘肩巵酒之奠告于桓侯張將軍之靈農之爲事亦勞矣盡筋力勤歳時數年之耕不遇一歳之稔稔則租賦科歛之不暇有餘而食其得㡬何不幸則水旱相枕爲餓殍夫豐歳常少而凶歳常多今夏麥巳登粟與稻之早者民皆食之矣秋又大熟則庶㡬可以支一二歳之凶荒歳功將成曷忍敗之今晚田秋稼將實而少雨雨之降者頻在近郊山田僻逺欲雨一作髙阜之方皆未及也惟神降休冝均其惠而終成歳功神生以忠勇事人威名震於荆楚沒食其土民之所冝告也尚饗北嶽廟賽雨祭文古者諸侯之國水旱豐凶山川所禱各即其封祀薄秩卑止於一國而神所降休亦不過其國中豈如巨岳四方之鎭天下之雄天子命祀公王之崇而脩之職旣非一邦之守凡河北千里上給下足皆責于厥躬故脩之禱非鎭一州而止自河以北冀厥惠之咸蒙況神之主又非河北而巳利澤之廣冝及於無窮旣獲賜矣而又敢黷幸神聽之惟聦尚饗修城祈晴祭五龍文滁州雨澤於物博哉其利及其過差患亦不細民勞於農將熟而敗吏勤於職一作于城巳成而圯一作壞龍於吏民何怒何戾山湫有祠樂可潛戲冝安爾居一作藏靜以養智冬雪春雨其多巳太浸潤収畜足支一歳旱則來告一作救否當且待一作有待又祭城隍神文滁州雨之害物多矣而一作惟城者神之所職不敢及他請言城役用民之力六萬九千工食民之米一千三百石衆力方作雨則止之城功旣一作巳成雨又壞之敢問雨者於神誰尸吏能知人一作成城不能知一作爲字雨惟神有靈可與雨一作以與語吏竭其力神祐以靈各供其一作厥職無媿斯民祈晴祭城隍神文昨者王倫爲盗攻劫城市州民𬒳虐餘毒未瘳非待脩言乃神所見近蒙朝旨許理城隍所以戒往弊防未然惟神愛福此州必有隂助今興役有期而大雪不止沮民害事咎必有歸惟脩不能事神治民當有明罰而城之成否自繫神民惟神之靈敢以誠告數日之内豁然陽開尚不失時在神而巳尚饗又祭漢髙祖一作城隍廟文滁州民常患不勤於農農勤矣而雨敗其稼吏常患不修其職職修矣而雨害其功吏與民一作民怠慢則懼神罰妨民沮吏豈又神聦今麥雖巳失猶有望於糓城尚可𥙷敢不勞厥躬咎難追於巳往神幸惠於其終祈雨祭漢髙皇帝文滁州維年月日具官歐陽脩謹以清酌庶羞之奠致祭于漢髙皇帝之靈一作神而言曰吏有常職來官于滁一作此者不三四歳而易也神食于此無窮已也神與吏於滁人孰親且乆一有也字孰冝愛其一作滁人之深也滁人敢慢其吏而犯吏法者有矣未聞有敢慢神而犯威靈也其畏信勤事於吏孰若畏信勤事於神也吏於凡小事猶皆一無此字動有法令約束違則有罰孰若神之變化不測而能與民轉災爲福也吏朝夕拜禱彌旬越月而無所感動神之召呼風雲開闔隂陽而役使鬼物頃刻之間一有爾孰難而孰易六字也今民田待雨急矣吏知人力不能爲猶竭其力而不得巳況神之易爲也況滁人一作民畏信勤事之乆而親神冝愛之一作神冝愛之深也而又有可以轉災爲福變化不測之能也吏誰敢與神較而一無此二十三字脩輒一作敢以此爲黷者蓋哀民之急辭也其政一作某政之不善而召災旱又以爲黷神冝降殃於一作于脩而賜民以雨使賞罰並行而兩得也民之幸也脩之願一作幸也尚饗漢髙祖廟賽雨文謹以清酌庶羞之奠致祭于漢髙皇帝之神古之爲政者率人甚勤備災甚謹而自勉甚篤故勸農節用均豐補敗雖有水旱之歳而無饑殍之民一遇天災則厚自貶責務修人事之闕而復隂陽之和今乃不然當無事之時不能勤民於農而亡備災之具一月不雨使民惶惶又不自責以修其闕而動輒干神頼神聦明知厥過之在吏閔斯民之可哀賜之豐年徧及逺邇神之大惠如何可報吏之大過如何可逃惟與民永永事神無敢懈尚饗祈雨祭張龍公文潁州維年月日具官脩謹以清酌庶羞之奠致祭于張龍公之神曰刺史不能爲政而使民失所其咎安歸而又頑傲愚冥無誠慤忠信之心可以動於物者是皆無以進說於神雖其有請冝不一作無聽也然而明天子閔閔憂勞於上而生民嗷嗷困苦于下公私並乏道路流亡於此之時以一日之雨救一方之旱用力至少其功至多此非人力之所能爲而神之所甚易也苟以此說神其有不動於心者乎幸無以刺史不堪而止也刺史有職守不獲躬走祠下謹遣管界廵檢田甫布兹懇迫尚饗祭薛尚書一作簡肅公文維年月日具官歐陽脩謹以清酌庶羞之奠恭祭于故資政殿學士贈兵部尚書薛公之靈景祐之元公𥘉解政雖告于家而疾未病若脩之鄙敢辱公知公於此時欲以女歸公德方隆謂當再起齊大之婚敢辭以禮天不憗遺公薨忽然其後二一作三年卒追前言生死一作死生之間以成公志掛劒于墓古人之義公敏於材剛毅自勵不顧不隨以直而遂命也在天徃則難期惟其行巳敢言是一作自師有罪之身竄逐囚拘生不及門葬不送車致誠薄奠因道終初尚饗祭謝希深一作舎人文維年月日具官脩將以明日祗役于滑謹用清酌庶羞之奠致祭于故副閣舎人謝公之靈鳴呼謝公一作公乎性明於誠履蹈其方其於死生固巳自達而天下之士所以嘆息而不已者惜時之良況於吾徒師友之分情親義篤其何可忘景祐之初脩走于峽而公在江東寓書眞州哀其親老一作甚用而勉以自彊其後二年再遷漢上風波霧毒凡萬二千里而㑹公南陽初來謁公迎我而笑與我别乆憐其貌若故而氣揚清風之館覽秀之涼坐竹林之脩廕泛水芰之清香及告還一作歸邑得官靈昌走書來報喜詠于章罷縣無歸來客公邦歡言未㡬遽問于牀不見五日而入哭其堂嗚呼謝公年不得中壽而位止于郎惟其殁也哭者爲之哀不識者爲之相弔或賻其家或力其喪嗟夫爲善之効得此而已庸何傷富貴偶也壽夭數也奚一作何較其少多而短長若公之有言著于文行著于事材著于用旣乆而愈彰此吾徒可以無大恨而君子謂公爲不亡滑人來迎脩馬當北而不即去者以公而彷徨始脩將行期公餞我今其去也來奠公觴兹言悲矣公其聞乎抑不聞也徒有淚而浪浪尚饗祭薛質夫文大理寺丞薛直孺嗟吾質夫行豐而腴乃享其癯莖華雖敷不菂而枯善惡賢愚非有契符報或一差咎誰歸辜孔智通天曰命矣夫在聖猶疑況於吾徒嗟吾質夫母不勝縗慕無孺孤奠觴爲訣已矣嗚呼尚饗祭叔父文維年月日具官姪脩謹以清酌庶羞之奠致祭于十四叔都官之靈曰昔官夷陵有罪之罰今位於朝而參諌列榮辱雖異實皆羈紲使脩哭不及喪而葬不臨穴孩童孤艱哺養提挈昊天之報於義何闕惟其報者庶㡬大節尚饗祭尹子漸文太常博士知懷州尹㴡年月日具官歐陽脩謹遣人自鎭陽至懷州以清酌庶羞之奠致祭于亡友尹君子漸十一兄博士之靈嗚呼天於一作生萬物與吾人孰愛憎而薄厚其生未始以一齊其死冝其有夭壽苟百年者亦死則短長之何較惟善人之可喜謂冝在丗而常存曰仁者壽兮是亦愛之者之說謂善必福兮得非以已而推天禍福吉凶一作壽夭至其難通雖聖人亦曰命而罕言兮豈其至此而辭窮壽夭置之吾不能問嗟乎子漸吾獨有恨我不見子於今㡬時自子得懷始有見期子不能來我欲亟往子今安歸我往何一作誰訪昔我在朝諌官侍從職當薦賢知子不貢朋黨之誣苟避讒諷兩相知而以心謂尺書之不用遂聲音之永隔哭不聞而徒慟嗟此奠之一觴冀歡言之可共往莫及兮難追哀以辭而永送尚饗祭尹師魯文維年月日具官歐陽脩謹以清酌庶羞之奠祭于亡友師魯十二兄之靈曰嗟乎師魯辯足以窮萬物而不能當一獄吏志可以狹四海而無所措其一身窮山之崖野水之濱猿猱之窟麋鹿之羣猶不容於其間兮遂即萬鬼而爲鄰嗟乎師魯丗之惡子之多未必若愛子者之衆何其窮而至此兮得非命在乎天而不在乎人方其奔顚斥逐困厄艱屯舉丗皆冤而語言未甞以自及以窮至死而妻子不見其悲忻用捨進退屈伸一作出處語黙夫何能然乃學之力至其握手爲訣隠几待終顔色不變笑言從容死生之間旣巳能通於性命憂患之至冝其不累於心胷自子云逝善人冝哀子能自逹予又何悲惟其師友之益平生之舊情之難忘言不可究嗟乎師魯自古有死皆歸無物惟聖與賢雖埋不没尤於文章焯若星日子之所爲後丗師法雖嗣子尚㓜未足以付予而丗人藏之庶可無於墜失子於衆人最愛予文寓辭千里侑此一罇冀以慰子聞乎不聞尚饗祭蘇子美文維年月日具官歐陽脩謹以清酌庶羞之奠致祭于亡友湖州長史蘇君子美之靈曰哀哀子美命止斯邪小人之幸君子之嗟子之心胷蟠屈龍虵風雲變化雨雹交加忽然揮斧霹靂轟車人有遭之心驚膽落震仆如麻須臾霽止而回一作四顧百里山川草木開發萌芽子於文章雄豪放肆有如此者吁可怪邪嗟乎丗人知此而巳貪恱其外不窺其内欲知子心窮達之際金石雖堅尚可破壞一作碎子於窮達始終仁義惟人不知乃窮至此藴而不見遂一作遽以没地獨留文章照耀後丗嗟丗之愚掩抑毁傷譬如磨鑑不滅愈光一丗之短萬丗之長其間得失不待較量哀哀子美來舉予觴尚饗祭鄭宣徽文謹以清酌庶羞之奠致祭于宣徽太尉鄭公之靈曰脩曩在埸屋公爲先進旣登館閣遂獲並遊平生笑言俯仰今昔至於勤勞中外啓沃謀猷紀德揚功巳著朝廷之論臨風隕涕但伸朋舊之私永訣之情一觴而巳尚饗皇考焚黃祭文男脩謹以清酌庶羞之奠告于皇考郎中之靈脩不肖不能紹禀先訓尚頼餘德遺休不隕其丗得階仕進荷國寵靈欲報之恩不知其所幸天子以孝治天下凡列位于朝者皆有追榮之典俾其知所以有此爵䘵者皆有自來而退得伸其私志故自上三見于郊一開明堂以大享其所推恩自太子中允尚書工部兵部貟外郎兵部郎中告于第者四今謹以告惟是襃榮之意則具載于訓辭尚饗居士集卷第四十九熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正祈雨祭漢髙皇帝文不三四歳而易一作不過三四歳威靈也一作威靈者也無所感動一作雨不可得祭謝希深文景祐之初𥘉一作間祭尹子漸文年者一作年之常存一作長存莫及一作莫返, WYG: ''}
