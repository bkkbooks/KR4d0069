  - {type: variant, offset: 26, length: 4758, content: 奚仲工於爲車而不能御王良造父天下之善御者也此荀卿子所謂藝之至者不兩能信哉儒者學乎聖人聖人之道直以簡然至其曲而暢之以通天下之理以究隂陽天地人鬼事物之變化君臣父子吉凶生死凡人一作禍福之大倫則六經不能盡其說而七十子與孟軻荀楊之徒各極其辯而莫能殫焉夫以孔子之好學而其所道者自堯舜而後則詳之其前蓋略而弗道其亦有所不暇者歟儒之學者信哉逺且大而用功多則其有所不暇者冝也文字之爲學儒者之所用也其爲精也有聲形曲直毫釐之别音響清濁相生之類五方言語風俗之殊故儒者莫暇精之其有精者則徃徃不能乎其他是以學者莫肯捨其所事而盡心乎此所謂不兩能者也必待乎用心專者而或能之然後儒者有以取焉洛僧鑒聿爲韻緫五篇推子母輕重之法以定四聲考求前儒之失辯正五方之訛顧其用心之精可謂入於忽微若櫛一有者字之於髪績一有者字之於絲雖細且多而條理不亂儒之學者莫能難也鑒聿通於易能知大演之數又學乎隂陽地理黃帝𡵨伯之書其尤盡心者韻緫也世一作聿本儒家子少爲浮圖入武當山徃來江漢之旁十餘年不妄與人交有不可其意雖王公大人亦莫肯顧聞士有一藝雖千里必求之介然有古獨行之節所謂用心專者也冝其學必至焉耳浮圖之書行乎世者數百萬言其文字雜以夷夏讀者罕得其眞徃徃就一有聿字而正焉鑒一無此字聿之書作韻非獨有取於吾儒亦欲傳於其徒也送楊寘一作送楊二赴劒浦序予甞有幽憂之疾退而閒居不能治也旣而學琴於友人孫道滋受宫聲數引乆而樂之不知疾之在其體也一本有夫疾生乎憂者也藥之毒者能攻其疾之聚不若聲之至者能和其心之所不平心而平不和者和則疾之忘也冝哉四十五字夫琴之爲技小矣及其至也大者爲宫細者爲羽操絃驟作忽然變之急者悽然以促緩者舒然以和如崩崖裂石髙山出泉而風雨夜至也如怨夫寡婦之歎息雌雄雍雍之相鳴也其憂深思逺則舜與文王孔子之遺音也悲愁感憤則伯竒孤子屈原忠臣之所歎也喜怒哀樂動人心深而純古淡泊與夫堯舜三代之言語孔子之文章易之憂患一作思一作深詩之怨刺無以異其能聽之以耳應之以手取其和者道其堙鬱寫其憂思則感人之際亦有至者焉一有是不可以不學也七字予友楊君好學有文累以進士舉不得志反從廕調爲尉於劒浦區區在東南數千里外是其心固有不平者且少又多疾而南方少醫藥風俗飲食異冝以多疾之體有不平之心居異冝之俗其能鬱鬱以乆乎然欲平其心以養其疾於琴亦將有得焉故予作琴說以贈其行且邀道滋酌酒進琴以爲别一無比二字而有說以贈其行挈道滋之琴而行曰是眞可樂也行將學之二十二字送曾鞏秀才序廣文曾生來自南豐一作自南豐來入太學與其諸生羣進於有司有司斂羣材操尺度槩以一法考其不中者而弃之雖有魁壘抜出之材其一絫黍不中尺度則棄不敢取幸而得良有司不過反同衆人歎嗟一作咨嗟而愛惜若取捨非已事者諉曰有司有法奈不中何一作奈何其不中也有司固不自任其責而天下之人一作士亦不以責有司皆曰其不中法也一作其如不中法何不幸有司尺度一失手一作守則徃徃失多而得少一作失多於所得嗚呼二字一作噫有司所操果良法邪何其乆而不思革也況若曾生之業其大者固巳魁壘其於一無此字小者亦可以中一作就尺度而有司一有遽字弃之可怪也然曾生不非同進不罪有司告予以歸思廣其學而一有益字堅其守予初駭一作驚其文一有旣字又壯其志夫農不咎歳而菑播是勤其水旱則已使一有穫則豈不多邪曾生橐其文數十萬言來京師京師之人無求曾生者然曾生亦不以干也一作而生亦不一徃干之予豈敢一作若予者豈能求生而生辱以顧予是京師之人旣不四字一作士大夫旣莫能求之而有司又失之而獨余得也於其行也遂見於文使知一有曽字生者可以弔有司一有之失二字而賀余之獨得也送田畫秀才寧親萬州序五代之初天下分爲十三四及建隆之際或滅或微其在者猶七國而蜀與江南地最大以周世宗之雄三至淮上不能舉李氏而蜀亦恃險爲阻秦隴山南皆𬒳侵奪而荆人縮手歸峽不敢西窺以爭故地一本注云徃時忠萬夔施皆屬荆南五代之際爲蜀所侵及太祖受天命用兵不過一作及萬人舉兩國如一郡縣吏何其偉歟一作哉當此時文初之祖從諸將西平成都及南攻一作破金陵功最多於時一作最有功於時語名將者稱田氏田氏功書史官禄世于家至今而不絶及天下已定一作天下旣平乆矣將率無所用其武士君子爭以文儒進故文初將家子反衣白衣從郷進士舉於有司彼此一時亦各遭其埶而然也文初辭業通敏爲人敦潔可喜歳之仲春自荆南西一作自荆南而西將拜其親於萬州維一作繫舟夷陵予與之登髙以逺望一作望山川遂遊東山窺緑蘿溪坐磐石文𥘉愛之一有留字數日乃去一作行夷陵者其地志云北有夷山以爲一有之字名或曰巴峽之險至此地始平夷蓋今文𥘉所見尚未爲山川之勝者由此而上泝江湍入三峽險怪竒絶乃一作直可愛也當王師伐蜀時兵出兩道一自鳯州以入一自歸州以取忠萬以西今之所經皆王師嚮所用武處一作今文𥘉所歷皆嚮時王師用武處覽其山川可以慨然而賦矣謝氏詩序天聖七年予始遊京師得吾友謝景山景山少以進七中甲科以善歌詩知名一作以好古能文知名於時其後予於他所又得今舎人宋公所爲景山母夫人之墓銘言夫人好學通經自教其子乃知景山出於甌閩數千里之外負其藝於大衆之一無此字中一賈而售遂以名知一作知名於人者繄其母之賢也今年予自夷陵至一作之許昌景山岀其女弟希孟所爲詩百餘篇然後又知景山之母不獨成其子之名而又以其餘遺其女也景山甞學杜甫杜牧之文以雄健髙逸自喜希孟之言尤隱約深厚一作切守禮而不自放有古幽間淑女之風非特婦人之能言者也然景山甞從今世賢豪者遊故得聞於當時而希孟不幸爲女子莫自章顯於世昔衛莊姜許穆夫人録於仲尼而列之國風一有使字今有傑然巨人能輕重時人而取信後世者一爲希孟重之其不泯没矣予固力不足者復何爲哉復何爲哉希孟嫁進士陳安國卒時年二一作三十四景祐四年八月一日守峽州夷陵縣令歐陽脩序送張唐民歸青州序予讀周禮至於教民興學選賢命士之法未甞不輟而歎息以謂三代之際士豈皆素賢哉當其王道備而習俗成仁義禮樂逹於學孝慈友悌逹於家居有教養之漸進有爵福之勸苟一不勉則又有屏黜不齒一無二字戮辱之羞然則士生其間其勢不得不至於爲善也豈必生知之賢及後世道缺學廢苟僞之俗成而忘其教養之具一作漸至於爵禄黜辱之法又失其方而不足以勸懼然則土生其間能自爲善二字一作立卓然而不惑者非其生知之性天所賦予其孰能至哉則凡所謂賢者其可貴於三代之士逺矣故善人尤少幸而有則徃徃飢寒困踣之不暇其幸者或艱而後通夫賢者豈必困且艱歟蓋髙世則難合違俗則多窮一有困字亦其勢然也嗚呼人事修則天下之人皆可使爲善士一無此字廢則雖天所賦予其賢亦困於時夫天非不好善其不勝於人力者其勢之然歟此所謂天人之理在於周易一有爲字否泰消長之卦能通其說則自古賢聖窮逹而禍福皆可知而不足怪秀才張生居青州其母賢而知書三子喪其二獨生最賢行義聞於郷而好學力爲古文是謂卓然而不惑者也今年舉進士黜於有司母老而貧無以養可謂困且艱矣嗟乎予力旣不能一有以字周於生而生尤好一有學字易常以講於予若歸而卒其業則天命之理人事之勢窮逹禍福可以不動于其心雖然若生者豈必一作終窮也哉安知其不艱而後通也哉慶曆二年三月十九日序送王陶序一作剛說送王先輩之岳陽六經皆載聖人之道而易著著一作尤明聖人之用吉凶得失動靜進退易之事也其所以爲之用者剛與柔也乾健坤順剛柔之大用也至於八卦之變六爻之錯剛與柔迭居其位而吉亨利无咎凶厲悔吝之象生焉蓋剛爲陽爲德爲君子柔爲隂爲險爲小人自乾之初九爲姤而上至於剥其卦五皆隂剥陽之卦也小人之道長君子靜以退之時也自坤之初六爲復而上至於夬其卦五皆剛決柔之卦也小人之道消君子動以進而用事之時也夫剛之爲德君子之常用也庇民利物功莫大焉其爲卦一有也字過泰之三而四爲大壯一本晝卦五爲夬一本畫卦壯者壯也夬者決也四陽雖盛而猶有二隂然陽衆而隂寡則可用壯以一作以壯而攻之故其卦爲壯五陽而一隂隂不足爲直可決之而巳故其卦爲夬然則君子之用其剛也審其力視其時知隂險小人之必可去然後以壯而決之夫勇者可犯也彊者可詘也聖人於壯決之用必有戒焉故大壯之彖辭曰大壯利正其象辭曰君子非禮弗履夬之彖辭曰健而說決而和其象辭曰居德則忌以明夫剛之不可獨任也故復始而亨臨浸而長泰交而大壯以衆攻其寡夬乗其衰而決之夫君子之用其剛也有漸而不失其時一作冝又不獨任必以正以禮以說以和而濟之則功可成此君子動以進而用事之方也太原王陶字樂道好剛之士也常嫉世隂險三字一作夫君子少而小人多居京師不妄與人遊力學好古以一無此字自一作篤信自守今其初仕於易得君子動以進之象故予爲剛說以贈之大壯之初九曰壯于趾征凶夬之初九亦曰壯于趾徃不勝爲咎以此見三字一作此皆聖人之戒用剛也不獨於其一作著于彖象而又常深戒於其初嗚呼世之君子少而小人多君之力學好剛以蓄其志未始施之於事也今其徃尤冝愼乎其𥘉一有脩述孫子後序一作書孫子後世所傳孫武卜三篇多用曹公杜牧陳皥注號三家孫子余頃與撰四庫書目所見孫子注者尤多一有至二十餘家五字武之書本於兵兵之術非一而以不窮爲竒冝其說者之多也凡人之用智有短長其施設各異故或膠其說於偏見然無出所謂三家者三家之注皥最後其說時時攻牧之短牧亦慨然最喜論兵欲試而不得者其學能道春秋戰國時事甚博而詳然前世言善用兵稱曹公曹公甞與董吕諸袁角其力而勝之遂與呉蜀分漢而王傳言魏之諸將出兵千里一有公字每坐計勝敗授其成筭諸將用之十不失一一有違者兵輒敗北故魏世用兵悉以新書從事其精於兵也如此牧謂曹公於注孫子尤略蓋惜其所得自爲一書是曹公悉得武之術也然武甞以其書干呉王闔閭闔閭用之西破楚北服齊晉而霸諸侯夫使武自用其書止於彊伯及曹公用之然亦終不能滅呉蜀豈武之術盡於此乎抑用之不極其能也後之學者徒見其書又各牽於已見是以注者雖多而少當也獨吾友聖俞不然甞評武之書曰此戰國相傾之說也三代王者之師司馬九伐之法武不及也然亦愛其文略而意深其行師用兵料敵制勝亦皆有法其言甚有次序而注者汩之或失其意乃自爲注凡膠於偏見者皆抉一作排去傅以巳意而發之然後武之說不汩而明吾知此書當與三家並傳而後世取其說者徃徃於吾聖俞多焉聖俞爲人謹質温恭一有仁厚而明四字衣冠進趨眇然儒者也後世之視其書者與太史公疑張子房爲壯夫何異梅聖俞詩集序予聞世謂詩人少逹而多窮夫豈然哉蓋世所傳詩者多出於古窮人之辭也凡士之藴其所有而不得施於世者多喜自放於山巔水涯一有之字外見蟲魚草木風雲鳥獸之狀類徃徃探其竒怪内有憂思感憤之鬱積其興於怨刺以道羇臣寡婦之所歎而寫人情之難言蓋愈窮則愈工然則非詩之能窮人殆窮者而後工也予友梅聖俞少以䕃𥙷爲吏累舉進士輒抑於有司困於州縣几十餘年年今五十猶從辟書爲人之佐鬱其所畜不得奮見於事業其家宛陵㓜習於詩自爲童子出語巳驚其長老旣長學乎六經仁義之說其爲文章簡古純粹不求苟說於世世之人徒知其詩而巳然時無賢愚語詩者必求之聖俞聖俞亦自以其不得志者樂於詩而發之故其平生所作於詩尤一作最多世旣知之矣而未有薦于上者昔王文康公甞見而歎曰二百年無此作矣雖知之深亦不果薦也若使其幸得用於朝廷作爲雅頌以歌詠大宋之功德薦之清廟而追商周魯頌之作者豈不偉歟奈何使其老不得志而爲窮者之詩乃徒發於蟲魚物類羇愁感歎之言世徒喜其工不知其窮之乆而將老也可不惜哉聖俞詩旣多不自收拾其妻之兄子謝景初懼其多而易失也取其自洛陽至于呉興已來所作次爲十卷予甞嗜聖俞詩而患不能盡得之遽喜謝氏之能類次也輒序而藏之其後十五年聖俞以疾卒于京師余旣哭而銘之因索于其家得其遺藁千餘篇并舊所藏掇其尤者六百七十七篇爲一十五卷嗚呼吾於聖俞詩論之詳矣故不復云廬陵歐陽脩序居士集卷第四十二熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益挍正送曽鞏序與其一無其字京師之人四字一作士大夫送田畫序十三四一作十四五其在一作其存爲蜀所侵四字一作入於蜀如一郡縣吏一作若取一郡縣吏功最多於時語名將者稱田氏一作最有功故當時語名將者稱田氏于家一作其家反衣一作反以通敏一作精敏三峽此下一有其字以取一作而取謝氏詩序泯没此下一有必字送張唐民序爵福之勸福一作禄豈必一作豈皆必而忘一作而亡又失一作乆失三月一作五月送王陶序五陽而一隂一作一隂而五陽直可決之一作則可直決之泰交而大大一作泰用其剛一無其字以正以禮以說以和宋文粹作以禮以正以和以說隂險而小人多而一作之君之力學四字上一有若字施之於事一無之字, WYG: ''}
