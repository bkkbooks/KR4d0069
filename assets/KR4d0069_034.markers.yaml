  - {type: variant, offset: 55, length: 196, content: 贈太師諱化光之孫右班殿直贈左驍衛大將軍諱睦之子尚書户部侍郎贈司空簡肅公兄之子薛爲絳大族簡肅公爲時名臣君爲薛氏良子弟少用簡肅公䕃𥙷郊社齋郎將作監主簿太常寺太祝大理評事衛尉大理寺丞太子右一作左賛善大夫殿中丞國子博士尚書虞部比部駕部三貟外郎歴知趙州臨城縣通判漢湖滑三州知彭州坐斷獄降監陽武縣稅㑹簡肅公夫人薨葬于絳州即起君知州事以辦葬歲滿通判成都府未行遂以疾致仕居于許州之郾城嘉祐六年七月丙午以卒享年, WYG: 方其}
