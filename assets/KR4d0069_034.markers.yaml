  - {type: variant, offset: 3561, length: 779, content: 謂飬㢘耻厚風俗冝有漸而欲一切以吏議從事殆非所以優老勸功之意當少緩其事一作法使人得自言而全其美節朝廷嘉其言是至今行之皇祐新樂成議者多異論有詔新樂用於常祀朝㑹而郊廟仍用舊樂公言書稱同律而今舊樂髙新樂下相去一律難並一作遂用而新樂未施於郊廟先用之朝㑹非先王薦上帝配祖考之意皆不可一作遂不行近制禮部四歲一貢士議者患之請更爲間歲議巳定公獨以爲不然曰使士子廢業而奔走無寧歲不知復用三歲之制也衆皆以公言爲非行之數年士子果以爲不便而卒用三歲之制仁宗乆未有皇子群臣多以皇嗣爲言未省公以學士當作青辭禱嗣一作祠于山川即建言儲位乆虚非所以居安而慮危願擇宗室之賢者立之以慰安天下之心語甚切至公學問該博兼通隂陽五行天人一作文災異之說南京鴻慶宫災公以謂南京聖宋所以受命建號而大火主於商丘國家乗火德而王者也今不領於祠官而比年數災冝修火祀事下太常歲以長吏奉祠商丘自公始慶暦六年夏河北河東京東同時地震而登萊尤甚公以歲推之曰明年丁亥歲之刑徳皆在北宫隂生於子而極於亥然隂猶彊而未即伏陽猶㣲而未即勝此所以震也是謂龍戰之㑹而其位在乾今西北二虜中國之隂也冝爲之備不然必有内盗起於河朔明年王則以貝州叛公又以爲登萊視京師爲東北隅乃一作易艮少陽之位也今二州並置金坑多聚民以鑿山谷陽氣損泄故隂乗而動縣官入金歲幾何小利而大害可即禁止以寧地道皇祐五年正月㑹靈宫災是歲冬至祀天南郊以三聖並配明年大旱公曰五行火禮也去歲火而今又旱其應在禮此殆郊丘並配之失也即建言並配非古冝用迭配如𥘉詔其後并州議建軍爲節鎭公以星土考之曰昔髙辛氏之二子不相能也堯遷閼伯於商丘主火而商爲宋星遷實沉於臺駘主水而參爲晉星國家受命始於商丘王以火德又京師當宋之分野而并爲晉地參商仇讎之星今欲崇晉非國之利也自宋興平僣僞并最後服太宗削之不使列於方鎭八十年矣謂冝如舊制公在翰林十年多所𥙷益大扺不爲苟止而妄隨故其言或用或不用或後卒如其言然天子察公之忠欲大用者乆矣, WYG: ''}
