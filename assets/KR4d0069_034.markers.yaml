  - {type: variant, offset: 377, length: 2648, content: 教之爲政有恵愛絳人大恱君爲人謹黙淳質平居似不能言而其臨事如此先娶李氏早亡後娶董氏封范陽縣君子男二人長曰延永興軍醴泉縣主簿次曰通蔡州司戸叅軍孫男曰震孫女三人以治平三年二月乙酉葬于絳州正平縣清原一作源郷周村原將葬其女弟之夫歐陽脩爲之銘曰維聖有言兮仁勇而壽壽胡不多兮勇則信有爲政郷州兮稱于長老匶車來歸兮郷人奔走遺思在人兮刻銘不朽國子博士薛君墓誌銘并序君諱良孺字得之姓薛氏絳州正平人也少孤育於其叔父是爲簡肅公以公䕃爲將作監主簿太常寺奉禮郎大理評事將作監丞大理寺丞遷太子右賛善大夫殿中丞嘗知秦州清水縣縣雜蕃夷君爲簡其政令示之必信蕃夷畏愛歲滿罷去人甚思之其後簽書通利軍判官公事與其軍守爭事坐停官乆之復爲殿中丞遷國子博士監陳州清酒務嘉祐八年二月甲午以疾卒于官舎享年四十有六宋興百年薛姓五顯而簡肅公以清德直節聞故其家法嚴而子弟多賢材君爲人開爽明秀㓜爲簡肅公所愛若已一作過其子長工書作歌詩甞一舉進士不中以䕃𥙷例監庫務無所施其能一爲民政遂有聲平居喜飲酒談笑與其親戚朋友驩然未嘗有怨惡其在通利與其軍守所爭皆公事旣廢無懟色至卒窮以死豁如也嗚呼可哀也巳曾祖贈太傅諱温瑜祖贈太師諱化光父右班殿直贈左驍衛大將軍諱睦君娶張氏故樞宻直學士逸之女封仁壽縣君先君二歲而卒子男一人曰遜女三人長適大理評事王正甫次適太常寺太祝王端甫次尚㓜治平三年二月乙酉其孤遜舉其喪合葬于絳州正平縣清原一作源郷周村原將葬廬陵歐陽脩曰余薛氏壻也與君遊而賢其人冝有以哀之乃爲之銘曰維古才子兮出于名族嗟吾得之兮旣哲而淑有能不施兮不遐以趣卒困于艱兮泰乎自足絳水深長兮山岡起伏利我後人兮安于吉卜徂徠石先生墓誌銘并序徂徠先生姓石氏名介字守道兖州奉符人也徂徠魯東山而先生非隱者也其仕嘗位於朝矣魯之人不稱其官而稱其德以爲徂徠魯之望先生魯人之所尊故因其所居山以配其有德之稱曰徂徠先生者魯人之志也先生貌厚而氣完學篤而志大雖在畎畒不忘天下之憂以謂時無不可爲爲之無不至不在其位則行其言吾言用功利施於天下不必出乎已吾言不用雖獲禍咎至死而不悔其遇事發憤作爲文章極陳古今治亂成敗以指切當世賢愚善惡是是非非無所諱忌一作忌諱世俗頗駭其言由是謗議喧然而小人尤嫉惡之相與出力必一有欲字擠之死先生安然不惑不變曰吾道固如是吾勇過孟軻矣不幸遇疾以卒旣卒而姦人有欲以竒禍中傷大臣者猶指先王以起事謂其詐死而北走契丹矣請發棺以驗頼天子仁聖察其誣得不發棺而保全其妻子先生世爲農家父諱丙始以仕進官至太常博士先生年二十六舉進士甲科爲鄆州觀察推官南京留守推官御史臺辟主簿未至以上書論赦罷不召秩滿遷某軍節度掌書記代其父官于蜀爲嘉州軍事判官丁内外艱去官垢靣跣足躬耕徂徠之下葬其五世未葬者七十喪服除召入國子監直講是時兵討元昊乆無功海内重困天子奮然思欲振起威徳而進退二三大臣増置諫官御史所以求治之意甚銳先生躍然喜曰此盛事也雅頌吾職其可巳乎乃作慶暦聖德詩以襃貶大臣分别邪正累數百言詩出太山孫明復曰子禍始於此矣明復先生之師友也其後所謂姦人作竒禍者乃詩之所斥也先生自閑居徂徠後官于南京常以經術教授及在太學益以師道自居門人弟子從之者甚衆太學之興自先生始其所爲文章曰某集者若干卷曰某集者若干卷其斥佛老時文則有怪說中國論曰去此三者然後可以有爲其戒姦臣宦女則有唐鑑曰吾非爲一世監也其餘喜怒哀樂必見於文其辭博辯雄偉而憂思深逺其爲言曰學者學爲仁義也一有仁急於利物義果於有爲十字惟忠能忘其身信篤於自信者乃可以力行也以是行於巳亦以是教於人所謂堯舜禹湯文武周公孔子孟軻楊雄韓愈氏者未嘗一日不誦於口思與天下之士皆爲周孔之徒以致其君爲堯舜之君民爲堯舜之民亦未嘗一日少忘于心至其違世驚衆人或笑之則曰吾非狂癡者也是以君子察其行而信其言推其用心而哀其志先生直講歲餘杜祁公薦之天子拜太子中允今丞相韓公又薦之乃直集賢院又歲餘始去太學通判濮州方待次于徂徠以慶暦五年七月某日卒于家享年四十有一友人廬陵歐陽脩哭之以詩以謂待彼謗熖熄然後先生之道明矣先生旣没妻子凍一作寒餒不自勝今丞相韓公與河陽冨公分俸買田以活之後二十一一無此字年其家始克葬先生于某所將葬其子師訥與其門人姜潜杜黙徐遁等來告曰謗熖熄矣可以發先生之光矣敢請銘某曰吾詩不云乎子道自能乆也何必吾銘遁等曰雖然魯人之欲也乃爲之銘曰徂徠之巖巖與子之德兮魯人之所瞻汶水之湯湯與子之道兮逾一作愈逺而彌長道之難行兮孔孟一有亦云二字遑遑一世之屯兮萬世之光曰吾不有命兮安在夫桓魋與臧倉自古聖賢皆然兮噫子雖毀其何傷故霸州文安縣主簿蘇君一作趙郡蘇明允墓誌銘并序有蜀君子曰蘇君諱洵字明允眉州眉山人也君之行義修於家信於郷里聞於蜀之人一無此二字乆矣當至和嘉祐之間與其二子軾轍偕至京師翰林學士歐陽脩得其所著書二十二篇獻諸朝書旣出而公卿士大夫爭傳之其二子舉進士皆在髙等亦以文學稱於時眉山在西南數千里外一日父子隱然名動京師而蘇氏文章遂擅天下君之文博辯宏偉讀者悚然想見其人旣見而温温似不能言及即之與居愈乆而愈可愛間而出其所有愈叩而愈無窮嗚呼可謂純明篤實之君子也曽祖諱祐祖諱杲父諱序贈尚書職方貟外郎三世皆不顯職方君三子曰澹曰渙皆以文學舉進士而君少獨不喜學年巳壯猶不知書職方君縱而不問郷閭親族皆怪之或問其故職方君笑而不荅君亦自如也年二十七始大發憤謝其素所徃來少年閉戸讀書爲文辭歲餘舉進士再不中又舉茂材異等不中退而歎曰此不足爲吾學也悉取所爲文數百篇焚之益閉戸讀書絶筆不爲文辭者五六年乃大究六經百家之說以考質古今治亂成敗聖賢窮逹出處之際得其粹精一作精粹涵畜充溢抑而不發乆之慨然曰可矣由是下筆項刻數千言其縱横上下出入馳驟必造於深㣲而後止蓋其禀也厚故發之遲志也慤故得之精自來京師一時後生學者皆尊其賢學其文以爲師法以其父子俱知名故號老蘇以别之𥘉脩爲上其書召試紫㣲閣辭不至遂除試祕書省校書郎㑹太常修纂建隆以來禮書乃以爲霸州文安縣主簿使食其禄與陳州項城縣一無此字令姚闢同脩禮書爲太常因革禮一百卷書成方奏未報而君以疾卒實治平三年四月戊申也享年五十有八天子聞而哀之特贈光禄寺丞勑有司具舟載其喪歸于蜀君娶程氏大理寺丞文應之女生三子曰景先早卒軾今爲殿中丞直史館轍權大名府推官三女皆早卒孫曰邁曰遲有文集二十卷謚法三卷君善與人交急人患難死則䘏飬其孤郷人多德之蓋晚而好易曰易之道深矣汨而不明者諸儒以附㑹之說亂之也去之則聖人之㫖見矣作易傳未成而卒治平四年十月壬申葬于彭山之安鎭郷可龍里君生於逺方而學又晚成常歎曰知我者惟吾父與歐陽公也然則非余誰冝銘銘曰蘇顯唐世實欒城人以宦留眉蕃蕃子孫自其髙曾郷里稱仁偉歟明允大發於文亦旣有文而又有子其存不朽其嗣彌昌嗚呼明允可謂不亡贈太子太傅胡公墓誌, WYG: ''}
