  - {type: variant, offset: 3258, length: 301, content: 轉尚書祠部貟外郎判度支句院知蘇州兩浙路轉運使召還脩起居注以本官知制誥兼句當三班院巳而兼判吏部流内銓入内都知楊懷敏坐衛士夜盗入禁中驚乗輿斥出爲和州都監懷敏用事乆勢動中外未幾召復故職公封還辭頭不草制論曰衛士之變蹤跡連懷敏得不窮治誅死幸矣豈冝復在左右其命遂止乆之拜公翰林侍讀學士遷翰林學士兼史舘修撰判館事兼端明殿學士累遷尚書左司郎中兼知通進銀臺司審刑院群牧使提舉在京諸司庫務醴泉宫判尚書禮部遂判都省再知禮部貢舉奉使契丹館伴北朝人使亦皆再而虜人嚴憚之公爲人清儉謹黙内剛外和群居笑語讙譁獨正容色温温不動聲氣與人言必思而後對故其涖官臨事慎重不輒發發亦不可回止而其趣要歸於仁厚朝議在官年七十而不致仕者有司以時按籍舉行, WYG: 張遵道}
