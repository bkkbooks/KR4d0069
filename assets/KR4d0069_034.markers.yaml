  - {type: variant, offset: 3098, length: 0, content: '', WYG: 不能免汝然可使汝不勞爾乃為之區處計較量物有無貴賤道里逺近寛其期㑹使以次輸送由是物不踴貴車牛芻秣宿食來徃如平時而吏束手無所施民比他州費省十六七至於繕治城郭器械民皆不知開封治京師常撓於權要有干其法而能不為之屈者世皆以為難至公能使權要不敢有所干凡其為治以聴㫁盜訟為能否爾獨公始有餘力省其民事如治他州而畿赤諸縣之民皆被其惠開封比比出能吏而兼於民政者惟公一人吏部審官主天下吏員而居}
  - {type: page-break, offset: 3098, content: '', id: KR4d0069_WYG_019-3b, image: WYG1103/WYG1103-0794b.png}
  - {type: variant, offset: 3099, length: 0, content: '', WYG: 者類以不久遷去故吏得為姦公始視銓事一日選者三人争某闕公以問吏吏受丙賕對曰當與甲乙不能争遂授他闕居數日吏教丙訟甲負某事不當得公悟召乙問之乙謝曰業已得他闕不願争公不得已與丙而笑曰此非吏罪乃吾未知銓法爾因命諸曹各具格式科條以白問曰盡乎曰盡矣明日勑諸吏無得升堂使坐聴行文書而已由是吏不得與銓事與奪一出於公月餘翕然聲動京師其在審官有以賕求官者吏謝不受曰我公有賢名不久見用去矣姑少待之慶厯之初上厭西兵之久出而民弊亟用今丞相富公樞宻韓公及范文正公而三人者遂欲盡革衆事以修紀綱而小人權倖皆不悅獨公與相佐佑而公尤抑絶僥倖凡内降與恩澤者一切不與每積至十數則連封而面還之或詰責其人至慙恨涕泣而去上嘗謂諫官歐陽脩曰外人知杜某封還内降邪吾居禁中有求恩澤者每以杜某不可告之而止者多於所封還}
