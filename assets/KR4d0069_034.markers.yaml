  - {type: variant, offset: 0, length: 1, content: 居, WYG: 正獻公故太子太師致仕祁國公贈司徒兼侍中杜公諱衍字世昌越州山隂人也其先本出於堯之後厯三代常為諸侯後徙其封於杜而子孫散適他國者以杜為氏自杜赫為秦将軍後三世御史大夫周及其子建平侯延年仍顯於漢又九世當陽侯預顯於晉又十有四世岐國公佑顯於唐又九世而至於祁公其為家有法其吉凶祭祀齋戒日時幣祝從事一用其家書自唐滅}
  - {type: page-break, offset: 0, content: '', id: KR4d0069_WYG_019-1b, image: WYG1103/WYG1103-0793b.png}
  - {type: variant, offset: 2, length: 4, content: 集卷第三, WYG: 喪其舊禮而一切苟簡獨杜氏守其家法不遷於世俗盖自春秋諸侯之子孫厯秦漢千有餘歳得不絶其世譜而唐之盛時公卿家法存於今者惟杜氏公自曽髙以來以恭儉孝謹稱鄉里至公為人尤潔廉自克其為大臣事其上以不欺為忠推於人以行已取信故其動静纎悉謹而有法至考其大節偉如也公享年八}
  - {type: page-break, offset: 2, content: '', id: KR4d0069_WYG_019-2a, image: WYG1103/WYG1103-0793c.png}
