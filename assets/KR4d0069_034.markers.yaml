  - {type: variant, offset: 3114, length: 2, content: 合淝, WYG: 歳餘乃致仕公自布衣至為相衣服飲食無所加雖妻子亦有常節家故饒財諸父分産公以所得悉與兄弟之貧者俸禄所入分給宗族賙人急難至其歸老無屋以居寓於南京驛舍者久之自少好學工書喜為詩讀書雖老不倦推奨後進今世知名士多出其門居家見賔客必問時事聞有善喜若已出至有所不可憂見於色或夜不能寐如任其責者凡公所以行之終身者有能履其一君子以為人之所難而公自謂不足以名後世遺戒子孫無得紀述嗚呼豈所謂任重道逺而為善惟不足者歟曽祖太子少保諱某贈太師祖鴻臚卿諱某追封吳國公父尚書度支員外郎諱某追封韓國公皆贈太師尚書令兼中書令娶相里氏封晉國夫人子男曰詵大理評事訢太常博士訥将作監}
