  - {type: variant, offset: 4342, length: 1, content: 六, WYG: 二}
  - {type: variant, offset: 4344, length: 320, content: 八月拜公諫議大夫樞密副使公旣愼静而當大一作重任尤顧惜大體而群臣方建利害多更張庻事以革弊公獨猒之曰變法古人一作今之難不務守祖宗成法而徒紛紛無益於治也又以謂契丹與中國通好六十餘年自古未有也善待夷狄者謹爲備而巳今三邊武備多弛牧馬著虛名於籍可乗而戰者百無一二又謂滄州冝分爲一路以禦虜此今急務也若其界上交侵小故乃城寨主吏之職朝廷冝守祖宗之約不冝爭小利而隳大信深戒邊臣生事以爲功在位六年其論議類皆如此英宗即位拜一作遷給事中治平三年累上表􆂌致仕未一作不允乆之拜尚書吏部侍郎觀文殿學士知杭州爲政不略細故或謂大臣不冝自勞公曰此民事也吾不敢忽以是民尤愛之明年今上即位遷左丞五月公以疾告遂除太子少師致仕命未至而公以六月十一日薨于正寢享年七十有三一作二即以其年十一, WYG: 某}
