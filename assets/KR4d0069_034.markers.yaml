  - {type: variant, offset: 3069, length: 0, content: '', WYG: 高第為揚州觀察推官知平遙縣通判晉州知乾州遷河東京西路提㸃刑獄知揚州河東陜西路轉運使入為三司户部副使拜天章閣待制知荆南府未行以為河北路都轉運使遂知天雄軍召為御史}
  - {type: page-break, offset: 3069, content: '', id: KR4d0069_WYG_019-2b, image: WYG1103/WYG1103-0793d.png}
  - {type: variant, offset: 3070, length: 0, content: '', WYG: 丞判流内銓知審官院拜樞宻直學士知永興軍徙知并州遷龍圖閣學士復知永興軍權知開封府康定元年以刑部侍郎同知樞宻院事即拜副使慶厯三年遷吏部侍郎樞宻使明年以本官同中書門下平章事公治吏事如其為人其聴獄訟雖明敏而審覈愈精故屢決疑獄人以為神其簿書出納推析毫髪終日無倦色至為條目必使吏不得為姦而已及其施於民者則簡而易行始居平遙嘗以吏事適他州而縣民争訟者皆不肯決以待公歸知乾州未滿嵗安撫使察其治行以公權知鳯翔府二邦之民争於界上一曰此我公也汝奪之一曰今我公也汝何有焉夏人初叛命}
