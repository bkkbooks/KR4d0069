是也吾其歸㢤子姑待治平四年九月乙未廬陵歐陽脩序濮議序觀文殿學士行刑部尚書知亳州軍州事臣歐陽脩撰進臣某頓首死罪言臣聞事固有難明於一時而有待於後世者伯夷叔齊是巳夫君臣之義父子之道至矣臣不得伐其君子不得絶其父此甚易知之事也方武王之作也人皆以爲君可伐濮議之興也人皆以爲父可絶是大可怪駭者也盟津之㑹諸侯不召而至者蓋八百國是舉世之人皆以爲君可伐矣彼夷齊者眇然孤竹之二羇臣也以其至寡之力欲抗舉世之人而力不能勝言不見察二子以謂吾言廢則君臣之義廢而後世之亂無時而止也乃相與務爲髙絶之行以警世於是不食周粟而餓死首陽之下然世亦未之知也後五百餘年得孔子而稱其仁然後二子之道顯使孱王弱主得立於後世而臣不敢伐其君者二子之力也夫以甚易知之事二子爲之至艱如此猶湏五百年得聖人而後明然則濮園之議其可與庸人以口舌一日爭耶此臣不得不𫐠其事以示後世也方濮議之興也儒學奮筆而論臺諫廷立而爭閭巷族談而議是舉國之人皆以爲父可絶矣世又無夷齊以抗之雖然賴天子聖明仁孝不惑羣議據經約禮置園立廟不絶父子之恩以爲萬世法是先帝之明也今士大夫逹於禮義者渙然釋其疑蓋十八九一本作三四矣固不待夷齊餓死孔子復生而後明也然有不可不記者小人之誣罔也蓋自漢以來議事者何甞不立同異而濮園之議皆當世儒臣學士之賢者特以爲人後之禮世俗廢乆卒然不暇深究其精微而一議之失出於無情未足害其賢惟三數任言職之臣挾以他事發於憤恨厚誣朝廷而歸惡人主借爲竒貨以買一作賣名而世之人不原其心迹不辨其誣罔翕然稱以爲忠使先帝之志鬱鬱不明於後世此臣子之罪也臣得與其事而知其詳者故不得已而述焉臣某謹序集古録目序物常聚於所好而常得於有力之彊有力而不好好之而無力雖近且易有不能致之象犀虎豹蠻夷山海殺人之獸然其齒角皮革可聚而有也玉出崑崙流沙萬里之外經十餘譯乃至乎中國珠出南海常生深淵採者腰絙而入水形色非人往往不出則下飽蛟魚金礦于山鑿深而穴逺篝火餱粮而後進其崖崩窟塞則遂葬於其中者率常數十百人其逺且難而又多死禍常如此然而金玉珠璣世常兼聚而有也凡物好之而有力則無不至也湯盤孔鼎岐陽之鼓岱山鄒嶧㑹稽之刻石與夫漢魏已來聖君賢士桓碑彞器銘詩序記下至古文籕篆分隷諸家之字書皆三代以来至寳怪竒偉麗工妙可喜之物其去人不逺其取之無禍然而風霜兵火湮淪磨滅散棄於山崖墟莽之間未甞収拾者由世之好者少也幸而有好之者又其力或不足故僅得其一二而不能使其聚也夫力莫如好好莫如一予性顓而嗜古凡世人之所貪者皆無欲於其間故得一其所好於斯好之巳篤則力雖未足猶能致之故上自周穆王以来下更秦漢隋唐五代外至四海九州名山大澤窮崖絶谷荒林破塜神仙鬼物詭怪所傳莫不皆有以爲集古録以謂轉一作傳寫失真故因其石本軸而藏之有卷帙次第而無時世之先後蓋其取多而未已故隨其所得而録之又以謂聚多而終必散乃撮其大要别爲録目因并載夫可與史傳正其闕繆者以傳後學庶益於多聞或譏予曰物多則其勢難聚聚乆而無不散何必區區於是哉予對曰足吾所好玩而老焉可也象犀金玉之聚其能果不散乎予固未能以此而易彼也廬陵歐陽脩序昔在洛陽與余遊者皆一時豪儁之士也而陳郡謝希深善評文章河南尹師魯辨論精博余毎有所作二人者必伸紙疾讀便得余深意以示他人亦或時有所稱皆非余所自得者也宛陵梅聖俞善人君子也與余共處窮約毎見余小有可喜事懽然若在諸已自三君之亡余亦老且病矣此叙之作旣無謝尹之知音而集録成書恨聖俞之不見也悲夫嘉祐八年歲在癸卯七月二十四日書録目記公子棐集古録旣成之八年家君命棐曰吾集録前世埋沒缺落之文獨取世人無用之物而藏之者豈徒出於嗜好之僻而以爲耳目之玩哉其爲所得亦巳多矣故甞序其說而刻之又跋於諸卷之尾者二百九十六篇序所謂可與史傳正其闕繆者巳粗備矣若撮其大要别爲目録則吾未暇然不可以闕而不備也棐退而悉發千卷之藏而考之曰嗚呼可謂詳矣蓋自文武以来迄于五代盛衰得失賢臣義士姦雄賊亂之事可以動人耳目者至於釋氏道家之言莫不皆有然分散零落數千百年而後聚於此則亦可謂難矣其聚之旣難則其乆也又將遂散而無傳冝公之惜乎此也於是各取其書撰之人事迹之始終所立之時世而著之爲一十卷以附於跋尾之後夫事必簡而不煩然後能傳于乆逺今此千卷之書者刻之金石託之山崖未甞不爲無窮之計也然必待集録而後著者豈非以其繁一作多而難於盡傳哉故著其大略而不道其詳者公之志也熈寧二年二月記右集古録序成於嘉祐末年其云有卷帙次第無時世先後蓋取多而未巳故隨其所得而録之此公述千卷不以世代爲序之意也又云撮其大要别爲録目因載夫可與史傳正其闕謬者以傳後學此公述録目跋尾之意也至熈寧二年公之子叔弼記其後云公命棐曰吾跋諸卷之尾者二百九十六篇若撮其大要别爲録目則吾未暇棐乃盡發千卷著其大略自今觀之公序明言别爲録目而棐乃記公未暇之語世傳集古跋十卷四百餘篇而棐乃謂二百九十六篇雖是時公尚無恙後三年方薨然續跋纔十餘耳不應多踰百篇得非冩本誤以三百爲二百或棐記在熈寧之前耶棐又云爲十卷附跋尾之後今録目自為一書乃二十卷不過列碑石所在及其名氏歲月初無難者何未暇之有是皆可疑姑以棐所記附公本序之後而自周秦至于五季皆隨年代爲之序庶㡬時世先後秩然不紊間有書撰出於一手其歲月相邇則類而次之又於毎卷之末備存當時卷帙之次第旣以便今亦不失其初云集古録序經十一作重十葬於一作葬于所貪一作所好予固一作吾固, WYG: ''}
