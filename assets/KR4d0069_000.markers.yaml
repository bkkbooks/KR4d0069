  - {type: variant, offset: 2432, length: 16030, content: 後魏東魏北齊後周卷第五文集一百三十八隋唐卷第六文集一百三十九唐卷第七文集一百四十唐卷第八文集一百四十一唐卷第九文集一百四十二唐卷第十文集一百四十三唐五代書簡一十卷卷第一文集一百四十四五十一首卷第二文集一百四十五五十六首卷第三文集一百四十六四十八首卷第四文集一百四十七四十一首卷第五文集一百四十八六十二首卷第六文集一百四十九四十五首卷第七文集一百五十四十四首卷第八文集一百五十一三十三首卷第九文集一百五十二四十九首卷第十文集一百五十三二十三首附錄五卷卷第一祭文行狀諡誥卷第二墓誌銘神道碑卷第三傳卷第四傳卷第五事迹像讃賢哉文忠直道大節知進知退既朙旦哲陸䞇議論韓愈文章李杜歌詩公無不長當丗大儒邦家之光霜空無雲秌􅔹澄霚昭然政通何勞鍾簴儼然望之􅛽丗一遇萬折方旾逢坡益注宋李端叔惟我昭陵公乃得升􅔹下無朋國有魏公公乃得容不朋以忠風波旣散高山􅍦見小人是嘆㫺賢在是寍論厥似聞其百丗宋晁悦之内制集序昔錢思公嘗以謂朝廷之官雖宰相之重皆可雜以它才處之惟翰林學士非文章不可思公自言為此語頗取怒於逹官然亦自負以為至論今學士所作文書多矣至於青詞齋文必用老子浮圖之說祈禳祕祝往往近於家人里巷之事而制詔取便於宣讀常拘以世俗所謂四六之文其類多如此然則果可謂之文章者歟余在翰林六年中間進拜二三大臣皆適不當直而天下無事四夷和好兵革不用凡朝廷之文所以指麾號令訓戒約束自非因事無以發明矧余中年早衰意思零落以非工之作又無所遇以發焉其屑屑應用拘牽常格卑弱不振冝可羞也然今文士尤以翰林爲榮選余旣罷職院吏取余直草以日次之得四百餘篇因不忍弃況其上自朝廷内及宫禁下曁蠻夷海外事無不載而時政記日曆與起居郎舍人有所略而不記未必不有取於斯焉嗚呼余且老矣方買田淮潁之間若夫涼竹簟之暑風曝茅簷之冬日睡餘支枕念昔平生仕宦出處顧瞻玉堂如在天上因覽遺藁見其所載職官名氏以較其人盛衰先後孰在孰亡足以知榮寵爲虚名而外制集序慶暦三年春丞相吕夷簡病不能朝上旣更用大臣銳意天下事始用諌官御史䟽追還夏竦制書旣而召韓琦范仲淹於陜西又除冨弼樞宻副使弼仲淹琦皆皇恐頓首辭讓至五六不巳手詔趣琦等就道甚急而弼方且入求對以辭不得見遣中貴人趣送閤門使即受命嗚呼觀琦等之所以讓上之所以用琦等者可謂聖賢相遭萬世一遇而君臣之際何其盛也於是時天下之士孰不碩為材邪顧予何人亦與其選夏四月召自滑䑓入諌院冬十二月拜右正言知制誥是時夏人雖數請命而西師尚未解嚴京東累歲盗賊最後王倫暴起沂州轉劫江淮之間而張海郭貌山等亦起商鄧以驚京西州縣之吏多不稱職而民弊矣天子方慨然勸農桑興學校破去前例以不次用人哀民之困而欲除其蠧吏知磨勘法久之弊而思别材不肖以進賢能患百職之不修而申行賞罰之信盖欲修法度矣予時雖掌誥命猶在諌職常得奏事殿中從容盡聞天子所以更張庻事憂憫元元而勞心求治之意退得載于制書以諷曉訓敕在位者然予方與修祖宗故事又修起居注又一修編敕日與同舍論議治文書所省不一而除目所下率不一二時已迫丞相出故不得專一思慮工文字以盡道天子難諭之意而復誥命於三代之文嗟夫學者文章見用于世鮮矣況得施於朝廷而又遭人主致治之盛若修之鄙使竭其材猶恐不稱而況不能專一其職此予所以常遺恨於斯文也明年秋予出為河北轉運使又明年春權知成德軍事事少間發嚮所作制草而閱之雖不能盡載明天子之意於其所述而一作百得一二足以章示後世盖王者之訓在焉豈以予文之鄙而廢也於是録之爲三卷予自直閣下儤直八十始滿不數日奉使河東還即以来河北故其所作纔一百五十餘篇云三月二十一日序外集目録卷第一西京作起天聖九年盡明道二年樂府擬玉臺體七首明道元年欲眠携手曲雨中歸别後夜夜曲落日䆫中坐領邊繡古詩七交七首天聖九年張推官尹書記揚户曹梅主簿張判官王秀才自叙荅楊子靜祈雨長句嵩山十二首明道元年公路澗拜馬澗二室道登太室中峯玉女䆫玉女擣衣石天門天門泉天池三醉石峻極寺中峯𥘉秋普明寺竹林小飲餞梅聖俞分韻得亭皐木葉下明道元年和謝學士泛伊川浩然無歸意因詠劉長卿佳句作欲留篇之什同前戯書呈學士三丈和楊子聦答聖俞月夜見寄謝人寄雙桂樹子明道二年雨中獨酌二首庭前兩好樹緑竹堂獨飲明道二年暇日雨後緑竹堂獨居簡府中諸寮江上彈琴送白秀才西歸鞏縣𥘉見黄河明道二年代書寄尹十一兄楊十六王三别聖俞送劉秀才歸河内卷第二自西京至夷陵作起明道年盡景祐四年古詩數詩答錢寺丞憶伊川書懐感事寄梅聖俞景祐元年雜言荅聖俞見寄兼簡東京諸友聞梅二授徳興令戲書戯㬝寄左軍廵劉判官罷官後𥘉還㐮城弊居𫐠懷十韻回寄洛中舊僚和聖俞聚蚊送劉學士知衡州送張屯田歸洛歌景祐二年述懷送張揔之送子野送劉十三南遊與李獻臣宋子京春集東園得節字晚泊岳陽新開棊軒呈元珍表臣代贈田文𥘉景祐四年惠泉亭過張至祕挍莊行次葉縣將至淮安馬上早行學謝靈運體六韻自枝江山行至平陸驛春日西湖寄荅謝法曹歌答謝景山遺古瓦硯歌古瓦研新營小齋鑿地爐卷第三自乾德至滁州作起寳元元年盡慶暦八