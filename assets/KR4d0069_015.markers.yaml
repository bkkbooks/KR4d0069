  - {type: variant, offset: 8192, length: 7105, content: 學士院制詔劄子嘉祐三年臣伏見國家承五代之餘建萬世之業誅滅僣亂懷來四夷封祀天地制作禮樂至於大臣進退政令改更學士所作文書皆繫朝廷大事示於後世則爲王者之訓謨藏之有司乃是本朝之故實自明道以前文書草槀尚有編録景祐以後漸成散失臣曽試令類聚収拾𥙷綴十巳失其五六使聖宋之盛文章詔令廢失湮淪緩急事有質疑有司無所檢證蓋由從前雖有編録亦無類例卷第只是本院書吏私自抄寫所以易爲廢失臣今欲乞將國朝以來學士所撰文書各以門類依其年次編成卷秩號爲學士院草録有不足者更加求訪𥙷足之仍乞差本院學士從下兩員專切管勾自今巳後接續編聮如本行人吏不畫時編録致有漏落許令本院舉察理爲過犯此臣本院常事也所以上煩聖聽者蓋以近歳以來百司綱紀相承廢壞事有曽經奏聞及有聖㫖指揮者僅能遵守若只是本司臨時處置其主判之官纔罷去則其事尋亦廢停所以臣欲乞朝廷特降指揮所貴乆逺遵行不敢廢失今取進止請今後乞内降人加本罪二等劄子嘉祐三年臣伏見諌官陳旭起請僥求内降之人委二府劾奏于請者之罪蒙朝廷依奏施行尋聞李璋因内降責罰自後罕聞敢求内降以希恩賞者以此見至公之朝必信之法可以令行而禁止也然旭所請只爲恩賞之一端而小人僥求無所不至臣自權知開封府未及兩月之間十次承準内降或爲府司後行或爲宫院姨㜮或爲内官及干繫人吏等本府毎具執奏至于再三而干求者一無三字内降不巳至於婢妾賤人犯姦濫等事亦敢上煩聖聦以求私庇宦竪小臣自圖免過反彰聖君曲法之私雖有司執奏終許公行然小人干求未有約束止絶臣今一無此字欲乞今後應有因事敢干求内降者依舊許本府執奏外更乞根䆒因縁干求之人奏攝下府勘劾重行責罰如本人自行干請者亦乞一就勘鞫加元犯本罪二等斷遣其情理稍深及干求不已者亦許本府一靣牒報御史臺彈紏勘劾施行所貴止絶小人干亂公朝敗紊綱紀今取進止論梁舉直事封回内降劄子嘉祐二年臣勘㑹本府見勘内臣梁舉直公事兩曽執奏三準内降特與放罪臣伏見近年權倖之臣多是公然作過不畏憲法恃干求内降紊亂紀綱所以前後臣寮累具論述陛下特降明詔許承受官司執奏不得施行布告天下著爲信令今梁舉直累煩睿聽干求不巳本府遵依前後詔勑再具執奏未許公行伏以曲庇小臣撓屈國法自前世帝王苟有如此等事史冊書之以著人君之過失今梁舉直不欲受過於其身寧彰陛下之過於中外舉直此罪重於元犯之罪今縱未能法外重行以戒小人干求内降者其元犯本罪豈可曲恕舉直苟爲愛身之計不思愛君之心乃是小人全無知識爾如臣忝𬒳恩寵列於侍御職在獻納合思禆𥙷豈可阿意順㫖爲陛下曲法庇縱小臣以彰聖君之失其内降臣更不敢下司謹具狀繳連進納今取進止論郭皇后影殿劄子嘉祐三年臣所領太常禮院得御藥院公文稱奉聖㫖送畫到景靈宫廣孝殿後修盖郭皇后影殿圖子一本赴太常禮院詳定者其圖子已别具狀繳奏訖臣伏見近年京師土木之功糜耗國用其弊特深原其本因只爲差内臣監修利於偷竊官物及訖功之後僥求恩賞以故多起事端務廣興作其甚則託以祖宗神御張皇事勢近年以來如此興造略無虚歳伏以景靈宫建自先朝以尊奉聖祖陛丁又建真宗皇帝章懿太后神御殿於其間天下之人皆知陛下奉先廣孝之意然則此宫乃陛下奉天奉親之所今乃欲以後宫巳廢未一作追復之后建殿與先帝太后並列瀆神違禮莫此之甚臣竊謂此事必不出於聖意皆小人私於興作有所僥求爾蓋自前世帝王於宗廟之外别爲廟享以追奉祖宗者則有之未聞有自追奉其妃后者也蓋小人不識事體但苟一時之利不思虧損聖徳伏乞特賜寢罷以全典禮今取進止論孟陽河開掘墳墓劄子嘉祐四年春臣勘㑹府界剏開孟陽新河相次據祥符縣人户經府披訴稱𬒳人夫開掘墳墓斫伐桑棗拆拽舎屋等事尋差兵曹叅軍張稚圭徃彼檢視得已開河道六里有餘計三料開掘却村民墳墓八十二所大墓園三所草瓦屋七十七間其未開三料猶有墳墓二十五所舎屋四十七間桑五百餘株田土八十段臣因體問得村民所掘墳墓屍首骨殖布在新河兩岸子孫骨肉環坐守之仰天號慟屍骨暴露並無所歸其甚貧一作貧甚者用火燒焚向空撒棄其㽵宅屋宇累世安居旦夕毀拆全家露坐冤痛之聲聞於逺近方此春月朝廷務行仁政之時横屍暴骨殃及幽明可爲憫傷可爲驚駭兼體問得所開新河有害無利其萬勝斗門及陽武橋斗門兩處減水盡入白溝河所以年年決溢今又剏開新河亦入白溝是則三道減水盡聚一河將來決溢可知兼今所開新河深六尺至七尺白溝河只深四尺至五尺下源髙仰水勢難行臣今欲乞權住夫役三兩日差朝臣一貟計㑹都水監開封府各差官一貟同行相度苟如臣所說不虚未開三料乞更不開掘却移夫役修整舊河其元獻利見開河之人本爲自圖功賞及從𥘉檢計壕寨官吏蒙昧朝廷不言有墳墓宅舎桑棗在所開地内情理難恕欲乞下開封府取勘一作㑹其獻利之人與壕寨等並行決配官員悉與停廢所貴少謝枯骨兼慰生人今取進止乞罷上元放燈劄子嘉祐四年臣伏以三元放燈不岀典禮蓋囙前世習俗所傳陛下二字一作皆以俯徇衆心欲同民樂勉出臨幸非爲嬉㳺若乃時歳豐和一作時豐歳和人物康冨以爲樂事亦是人情今自立春以來隂寒雨雪小民失業坊市寂寥寒凍之人死損不少薪炭食物其價増倍民憂凍餓何睱遨遊臣本府日閱公事内有投井投河不死之人皆稱因爲貧寒自求死所今日有一婦人凍死其夫尋亦自縊竊惟里巷之中失所之人何可勝數昨日聖恩差官俵錢正爲如此目下隂雪未解假使便得晴明坊市不免泥淖聖駕所歴衝冒風寒況方以日蝕之災一無二字避殿減膳聖心憂畏中外所知欲乞特罷放燈所有常年酌獻之禮若至日未得晴明一作和亦乞差大臣攝事所是見今供擬遊幸及修道路寒凍兵士並乞放罷庻㡬上副陛下畏天憂民之心今取進止論包拯除三司使上書嘉祐四年三月臣聞治天下者在知用人之一作在用人知先後而巳用人之法各有所冝軍旅之士先材能朝廷之士先名節軍旅主成功惟恐其不趨賞而爭利其先材能而後名節者亦勢使之然也朝廷主教化風俗之薄厚治道之汙隆在乎用人而教化之於下也不能家至而諄諄諭之故常務尊名節之士以風動天下而聳勵其媮薄夫所謂名節之士者知廉耻脩禮讓不利於苟得不牽於苟隨而惟義之所處白刃之威有所不避折枝之易有所不爲而惟義之所守其立於朝廷進退舉止皆可以爲天下法也其人至難得也至可重也故其一無二字爲士者常一作當下同貴名節以自一無此字重其身而君人者亦常全名節以飬成善士伏見陛下近除前御史中丞包拯爲三司使命下之日中外一作外議喧然以謂朝廷貪拯之材而不爲拯惜名節然猶冀拯能執節守義堅讓以避嫌疑而爲朝廷惜事體數日之間遽聞拯巳受命是可惜也亦可嗟也拯性好剛天姿峭直然素少學問朝廷事體或有不思至如逐其人而代其位雖𥘉無是心然見得不能思義此皆不足恠若乃嫌疑之迹常人皆知可避而拯豈獨不思哉昨聞拯在臺日常自至中書詬責宰相指陳前三司使張方平過失怒宰相不早罷之旣而臺中寮屬相繼論列方平由此罷去而以宋祁代之又聞拯亦曽彈奏宋祁過失自其命出臺中寮屬又交章力言而祁亦因此而罷而拯遂代其任此所謂蹊田奪牛豈得無過而整冠納履當避可疑者也如拯材能資望雖别加進用人豈爲嫌一作間言其不可爲者惟三司使爾非惟自渉嫌疑其於朝廷所損不細臣請原其本末而言之國家自數十年來士君子務以恭謹静慎爲賢及其弊也循黙苟且頽一作媮惰寛弛習成風俗不以爲非至於百職不修紀綱廢壊時方無事固未覺其害也一旦黠虜犯邊兵出無功而財用空虚公私困弊盗賊並起天下騷然陛下奮然四字一作天子感悟思革其弊進用三數大臣銳意於更張矣於此之時始増置諌官之員以寵用言事之臣俾之舉職由是修紀綱而繩廢壊遂欲分别賢不肖進退材不材而乆弊之俗驟見而駭因共指言事者而非之或以謂好訐隂私或以爲公相傾䧟或謂沽激名譽或謂自圖進取羣言百端㡬惑上聽上頼陛下至聖一無一字至明察見諸臣本以一無此字忘身徇國非爲己利讒間不入遂荷保全而中外之人乆而亦漸爲信自是以來二十年間臺諫之選屢得讜言之士中間斥去姦邪屏絶權倖拾遺救失不可勝數是則納諌之善一作臣從古所難自陛下臨御以來實爲盛徳於朝廷𥙷助之效不爲無功今中外習安上下巳信纎邪之人凡所舉動毎畏言事之臣時政無巨細亦惟言事官是聽原其自始開發言路至於今日之成效豈易致哉可不惜㢤夫言人之過似於一無此字下同激訐逐人之位似於傾䧟而言事之臣得以自明者惟無所利於其間爾而天下之人所以爲信者亦以其無所利焉今拯併逐二臣自居其位使將來姦佞者者字一作之人得以爲說而惑亂主聽今後言事者不爲人信而無以自明是則聖明一作朝用諌之功一旦由拯而壊夫有所不取之謂㢘有所不爲之謂耻近臣舉動人所儀法使拯於此時有所不取而不爲可以風天下以廉耻之節而拯取其所不冝取爲其所不冝爲豈惟自薄其身亦所以開誘他時言事之臣傾人以覬得相習而成風此之爲患豈謂小哉然拯所恃者惟以本無一作無本心耳夫心者藏於中而人所不見迹者示於外而天下所瞻今拯欲自信其不見之心而外掩天下之迹是猶手探其物口云不欲雖欲自信人誰信之此臣所謂嫌疑之不可不避也況如拯者少有孝行聞於郷里晚有直節著在朝廷但其學問不深思慮不熟而處之乖當其人亦可惜也伏望陛下别選材臣爲三司使而處拯他職置之京師使拯得避嫌疑之迹以解天下之惑而全拯之名節不勝幸甚臣叨塵侍從職號論思昔甞親見朝廷致諌之初甚難今又復見陛下用諌之效已著實不欲因拯而壊之者爲朝廷惜也臣言狂計愚伏俟誅戮奏議卷第十五居士集卷第十五歐陽文忠公集十五賦五首雜文五首附黃楊樹子賦并序夷陵山谷間多黃楊樹子江行過絶險處時時從舟中望見之鬱鬱山際有可愛之色獨念此樹生窮僻不得依君子封殖備愛賞而樵夫野老又一無又字不知甚惜作小賦以歌之若夫漢武之宫叢生五柞景陽之井對植雙桐髙秋羽獵之騎半夜嚴粧之鍾鳯蓋朝拂銀牀暮空固巳葳蕤近日的皪一作灼爍含風婆娑萬戸之側生長深宫嘉祐元年夏大雨水奉詔祈晴于醴泉宫聞鳴蟬有感而賦云肅祠庭以祗事兮瞻玉宇之崢嶸收視聽以淸慮兮齋予心以薦誠因一作黙以靜而求一作觀動兮見乎萬物之情於時朝雨驟止微風不興四無雲以靑天雷曵曵一作隱隱其餘聲乃席芳葯臨華軒古木數株空一作荒庭草間爰有一物鳴于樹顚引淸風以長嘯抱纎柯而永歎嘒嘒非管泠泠若絃裂方號而復咽凄欲斷而還連吐孤韻以難律含五音之自然吾不知其何物其名曰蟬豈非因物造形能變化者邪出自糞壤慕淸虚者邪凌風髙飛知所止者邪嘉木茂樹喜淸隂者邪呼吸風露能尸解者邪綽約雙鬢修嬋姢者邪其爲聲也不樂不哀非宫非徴胡然而鳴亦胡然而止吾甞悲夫萬物莫不好鳴若乃四時代謝百鳥嚶兮一氣候至百蟲驚兮嬌兒姹女語鸝庚兮鳴機絡緯響蟋蟀兮轉喉哢舌誠可愛兮引腹動股豈勉彊而爲之兮至於汚池濁水得雨而聒兮飲泉食土長一無長字夜而歌兮彼蝦蟇固若有欲而蚯蚓又何求兮其餘大小萬狀不可悉名各有氣類隨其物形一有而字不知自止有若爭能忽時變以物改咸漠然而無聲嗚呼逹士所齊萬物一類人於其間所以爲貴蓋巳巧其語言又能傳於文字是以窮彼思慮耗其血氣或吟哦其窮愁或發揚其志意雖共盡於萬物乃長鳴於百丗予亦安知其然哉聊爲樂以自喜方將一作吾方考得失較同異俄而隂雲復興雷電俱擊大雨旣作蟬聲遂息一本賦後有䟦云予因學書起作賦草他兒一視而過獨小子棐守之不去此兒他日必能爲吾此賦也因以予之秋聲賦歐陽子方一無方字墨蹟止作余無上四字夜讀書聞有聲自西南來者悚然而聽之曰異哉𥘉淅瀝以蕭颯忽奔騰而砰湃如波濤夜驚風雨驟一作風驟雨而至其觸於一無於字物也鏦鏦錚錚金鐵皆鳴又如赴敵之兵銜枚疾走不聞號令但聞人馬之行聲墨蹟無聲字余謂童子此何聲也汝出視之童子曰星月一作月星皎潔明河在天四無人聲聲在樹間余曰噫嘻悲哉一作夫此秋聲也胡爲而來哉蓋夫秋之爲狀也其色慘淡煙霏雲歛其容淸明天髙日晶其氣慄冽砭人肌骨其意蕭條山川寂寥故其爲聲也凄凄切切呼號憤發豐草緑縟而爭茂佳木葱籠而可恱草拂之而色變木遭之而葉脫其所以摧敗零落者墨蹟無者字乃其一一無一字氣之餘烈夫秋刑官也於時爲隂又兵象也於行用金是謂天地之義氣常以肅殺而爲心墨蹟有大哉字天之於物春生秋實故其在樂也商聲主西方之音夷則爲七月之律商傷也物旣老而悲傷夷戮也物過盛而當殺嗟乎草木一有之字無情有時一有而字飄零人爲動物惟物之靈一作人惟動物爲物之靈百憂感其心萬事勞其形有動于中必揺其精而况思其力之所不一有能字及憂其智之所不能一有行字冝其渥然丹者爲槁木􅉳一本作黟墨蹟同然黒者爲星星奈何以一無以字非金石之質一有而字欲與草木而爭榮念誰爲之戕賊亦何恨乎秋聲童子莫對垂頭而睡但聞四壁蟲聲唧唧如一作似助余之歎息病暑賦和劉原父作吾將東走乎泰山兮履崔嵬之髙峯䕃白雲之揺曵兮聽石溜之玲瓏松林一作竹仰不見白日隂壑慘慘多悲風邈哉不可以坐致兮安得仙人之術解化如飛蓬吾將西登乎崑崙兮出於九州之外覽星辰之浮没視日月之隱蔽披閶闔之淸風飲黃流一作河之巨派羽翰不可以揷余之兩腋兮畏舉身而下墜旣欲泛乎南溟兮瘴毒流膏而鑠骨何異避喧之一作而趨市兮又如惡影之就日又欲臨乎北荒兮飛雪層冰之所聚鬼方窮髮一作徼無人迹兮乃龍虵之雜處四方上下皆不得以徃兮顧此大熱吾不知夫所逃萬物並生於天地豈余身之獨遭任寒暑之自然兮成嵗功而不勞惟衰病之不堪兮譬燎枯而灼焦矧空廬之湫卑兮甚龜蝸之跼縮飛蚊幸余之露坐兮壁蝎伺余之入屋一作蠅蚊幸余之虚坐兮蝨蝎伺余於壁屋頼有客之哀余兮贈端石與蘄竹得飽食以安一作與晝寢兮瑩枕冰而簟玉知其無可奈何而安之兮乃聖賢之髙躅惟冥心以息慮兮庶可忘於煩酷憎蒼蠅賦蒼蠅蒼蠅吾嗟爾之爲生旣無蜂蠆之毒尾又無蚊䖟之利觜幸不爲人之畏胡不爲人之喜爾形至眇爾欲易盈杯盂殘瀝砧几餘腥所希杪忽過則難勝苦何求而不足乃終日而營營逐氣尋香無處不到頃刻而集誰相告報其在物也雖微其爲害也至要若乃華榱廣厦珍簟方牀炎風之燠夏日之長神昬氣蹙流汗成漿委四支而莫舉眊兩目其茫洋惟髙枕之一覺冀煩歊之暫忘念於爾而何負乃於吾而見殃尋頭撲面入袖穿裳或集眉端或㳂眼眶目欲瞑而復警臂巳痺而猶攘於此之時孔子何由見周公於髣髴莊生安得與蝴蝶而飛揚徒使蒼頭丫髻巨扇揮颺咸頭垂而腕脫毎立寐而顚僵此其爲害者一也又如峻宇髙堂嘉賔上客沽酒市脯鋪筵設席聊娱一日之餘閑奈爾衆多之莫敵或集器皿或屯几格或醉醇酎因之没溺或投熱羮遂喪其魄諒雖死而不悔亦可戒夫貪得尤忌赤頭號爲景迹一有霑汙人皆不食奈何引類呼朋揺頭鼓翼聚散倐忽往來絡繹方其賔主獻酬衣冠儼飾使吾揮手頓足改容失色於此之時王衍何暇於淸談賈誼堪爲之太息此其爲害者二也又如醯醢之品醬臡之制及時月而收藏謹缾罌之固濟乃衆力以攻鑚極百端而窺覬至於大胾肥牲嘉肴美味蓋藏稍露於罅隙守者或時而假寐纔稍怠於防嚴已輒遺其種類莫不養息蕃滋淋漓敗壞使親朋卒至索爾以無歡臧獲懷憂因之而得罪此其爲害者三也是皆大者餘悉難名嗚呼止棘之詩垂之六經於此見詩人之博物比興之爲精冝乎以爾刺䜛人之亂國誠可嫉而可憎雜文五首醉翁吟并序一作醉翁述余作醉翁亭于滁州一作余於滁作醉翁亭有太常博士沈遵一有者字好竒之士也聞而一止作甞往遊焉愛其山水歸而以琴寫之作醉翁吟三疊去年秋一無秋字余奉使契丹沈君一作子㑹余一作于一有於字恩冀之間夜䦨酒半一無此四字援琴而作之有其聲而無其辭乃爲之辭以贈一作遺之其辭曰始翁之來二作翁之來兮獸見而深伏鳥見而髙飛翁醒而往兮醉而歸朝醒暮醉兮無有四時鳥鳴樂其林獸出遊其蹊咿嚶啁􅑜於翁前兮醉一有而字不知有心不能以無情兮有合必有離水潺潺兮翁忽去而不顧山岑岑兮翁復來而幾時風嫋嫋兮山木落春年年兮山草菲嗟我無德於其人兮有情於山禽與野麋賢哉沈子兮能寫我心而慰彼相思山中之樂并序一本題下云三章送慧勤上人佛者慧勤餘杭人也少去父母長無妻子以衣食于佛之徒往來京師二十年其人聰明材智亦甞學問于賢士大夫今其南歸遂將窮極呉越甌閩江湖海上之諸山以肆其所適予嘉其甞有聞於吾人也於其行也一本無四字爲作山中之樂三章一本有以送之旣極道山林間事以動蕩其心意而卒反之於正其辭曰江上山兮海上峯藹靑蒼兮杳㠝叢霞飛霧散兮邈乎靑空天鑱鬼削兮壁立於鴻蒙崖懸磴絶兮險且窮穿雲渡水兮一無兮字忽得路而不知其深之幾重中有平田廣谷兮與丗隔絶猶有太古之遺風泉甘土肥兮鳥獸雝雝其人麋鹿兮旣壽而豐不知人間之幾時兮但見草木華落爲春冬嗟丗之人兮曷不歸來乎山中山中之樂不可見今子其往兮誰逢其一丹莖翠蔓兮巖壑玲瓏水聲聒聒兮花氣濛濛石巉巉兮橫一作當路風颯颯兮吹松雲冥冥兮雨霏霏白猿夜嘯兮靑楓朝日出兮林間澗谷紛以靑紅千林靜兮秋月百草香兮春風嗟丗之人兮曷不歸來乎山中山中之樂不可得今子其往兮誰從其二梯崖􅌟險兮佛廟仙宫耀空山兮鬱穹隆彼之人兮固一無固字亦目明而耳聰寵辱不干其慮兮仁義不被其躬䕃長一作喬松之蓊蔚兮藉纎草之丰茸茍其中以自足兮忘其服胡而顚童自古智能魁傑之士兮固亦絶丗而逃蹤惜天材之甚良兮而一無而字自棄於無庸嗟彼之人兮胡爲老乎山中山中之樂不可乆遲子之返兮誰同其三雜說三首一有并序二字夏六月暑雨旣止歐陽子坐於樹間仰視天與月星一作日月星辰行度見星有殞者夜旣乆露下聞草間蚯蚓之聲益急其感干耳目者有動乎其中作雜說蚓食土而飲泉其爲生也簡而易足然仰其穴而鳴若號若呼若嘯若歌一作若歌若嘯其亦有所求邪抑其求易足而自鳴其樂邪苦一作抑歎其生之陋而自悲其不幸邪將自喜其聲而鳴其類邪豈其時至氣作不自知其所以然而不能自止者邪何其聒然而不止也吾於是乎有感一本此屬次篇星殞于地腥礦頑醜化爲惡石其昭然在上而萬物仰之者精氣之聚爾及其斃也瓦礫之不若也人之死骨肉臭腐螻蟻之食爾其貴乎萬物者亦精氣也其精氣不奪于物則藴而爲思慮發而爲事業著而爲文章昭乎百丗之上而仰乎百丗之下非如星之精氣隨其斃而滅也可不貴哉而生也利慾以昬耗之死也臭腐而棄之而一無而字惑者方曰足乎利慾所一無所字以厚吾身吾於是乎有感天西行日月五星皆東行日一歲而一周月疾於日一本無三字一月而一周天又疾於月一日而一周星有遲有速有逆有順是四者各自行而若不相爲謀其動而不勞運而不巳自古以來未甞一刻息也是何爲哉夫四者所以相須而成晝夜四時寒暑者也一刻而息則四時不得其平萬物不得其生蓋其所任者重矣人之有君子也其任亦重矣萬丗之所治萬物之所利故曰自彊不息又曰死而後巳者其知所任矣然則君子之學也其可一日而息乎吾於是乎有感一本此屬首篇居士集卷第十五熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正黃楊樹子賦多黃楊樹子一無子字濆激濆當作噴鳴蟬賦崢嶸石本嶸作􅗆病暑賦又如一作又同空廬一作室廬憎蒼蠅賦丫髻一作丫髮醉翁吟序作醉翁吟作一作爲雜說第三任矣此下一有乎字學也此上一有於字, WYG: ''}
