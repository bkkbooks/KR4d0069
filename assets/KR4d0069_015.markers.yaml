  - {type: variant, offset: 0, length: 8206, content: 外集卷第十五歐陽文忠公集六十五序二刪正黃庭經序無僊子者不知爲何人也無姓名無爵里世莫得而名之其自號爲無僊子者以警世人之學僊者也其爲言曰自古有道無僊而後世之人知有道而不得其道不知無僊而妄學一作求僊此我之所哀也道者自然之道也生而必死亦自然之理也以自然之道養自然之生不自戕賊夭閼而盡其天年此自古聖智之所同也禹走天下乘四載治百川可謂勞其形矣而壽百年顔子蕭然卧於陋巷簞食瓢飲外不誘於物内不動於心可謂至樂矣而年不及三十斯二人者皆古之仁人也勞其形者長年安其樂者短命盖命有一作之長短禀之於天非人力之所能爲也惟不自戕賊而各盡其天年則二人之所同也此所謂以自然之道養自然之生後世貪生之徒爲養生之術者無所不至至茹草木服金石吸日月之精光又有以謂此外物不足恃而反求諸内者於是息慮絶欲鍊精氣勤吐納專於内守以養其神其術雖本於貪生及其至也尚或可以全形而却疾猶愈於肆欲稱情以害其生者是謂養内之術故上智任之自然其次養内以却疾最下妄意而貪生世傳黄庭經者魏晉間道士養生之書也其說專於養内多竒恠故其傳之久則易爲訛舛今家家異本莫可考正無僊子既甚好古家多集錄古書文字以爲翫好之娯有黃庭經石本者廼永和十三年晉人所書其文頗簡以較今世俗所傳者獨爲有理疑得其眞於是喟然嘆曰吾欲曉世以無僊而止人之學者吾力顧未能也吾視世人執竒恠訛舛之書欲求生而反害其生者可不哀哉矧以我翫好之餘拯世人之謬惑何惜而不爲乃爲刪正諸家之異一以永和石本爲定其難曉之言略爲注解庶㡬不爲訛謬之說惑世以害生是亦不爲無益若大雅君子則豈取於此送王聖紀赴扶風主簿序前年五月大霖雨殺麥河溢東畿浸下田巳而不雨至于一作於八月菽粟死髙田三司有言前時溢博州民冒河爲言得免租者盖萬計今歳秋當租懼民幸水旱因縁得妄免以虧兵食慎勑有司謹之朝廷因舉田令約束州縣吏吏無逺近皆望風惡民言水旱一以農田勑限甚者笞而絶之畿之民訴其縣不聽則訴於開封又不聽則相與聚立一作於宣德門外訴於宰相於是遣吏四出視諸縣視者還而或言災或言否然言否者十七八最後視者還言民實災而吏徒畏約束以苟自免爾天子聞之惻然盡蠲畿民之租余嘗竊歎曰民生幸而爲畿民有一作且緩急近而易知也雨降于天河溢于地與赤日之出是三者物之易見也前二三歳旱蝗相連朝廷歳歳隨其災之厚薄蠲其賦之多少至兵食不足則歳糴或入粟以爵而充之是在上者之愛人而仁人之心易惻也以易知之近言易見之事告易惻之仁然吏一壅之㡬不得逹况四海之大㡬萬里而逺事之難知不若霖潦赤日之易見者何數使上有惻之之心不得逹于下下有思告之苦不得通於上者吏居其間而壅之爾可勝歎哉扶風爲縣限關之西距京師在千里外民之不幸而事有隱微者何限其能生死曲直之者今與主簿尉三人而民之志得不壅而聞于州州不壅而聞于上縣不壅而民志通者令與主簿尉逹之而巳王君聖紀主簿於其縣聖紀好學有文佐是縣也始試其爲政焉故以夫素所歎者告之景祐三年二月二十四日廬陵歐陽脩序送太原秀才序仲尼之徒子思伋記中庸事列于曲臺學欲服圎冠習矩歩者皆造次必於中庸聞太原生得之矣生之履行無改是也月旅析木地居軫斿霜風動天萬竅號怒揺鞭長跋一作𡵨強飯自重時寳元二年十月初七日乾德令尹歐陽脩序傳易圖序孟子曰盡信書不如無書夫孟子好學者豈獨忽於書哉盖其自傷不得親見聖人之作而傳者失其真莫可考正而云也然豈獨無書之如此余讀經解至其引易曰差若毫釐謬以千里之說又讀今周易有何謂子曰者至其繫辭則又曰聖人設卦繫辭焉欲考其真而莫可得然後知孟子之嘆盖有激云爾說者言當秦焚書時易以卜筮得獨不焚其後漢興他書雖出皆多殘缺而易經以故獨完然如經解所引考於今易亡之豈今易亦有亡者耶是亦不得爲完書也昔孔子門人追記其言作論語書其首必以子曰者所以别夫子與弟子之言又其言非一事其事非一時文聮屬而言難次第故每更一事必以子曰以起之若文言者夫子自作不應自稱子曰又其作於一時文有次第何假子曰以發之乃知今周易所載非孔子文言之全篇也蓋漢之易師擇取其文以解卦體至其有所不取則文斷而不屬故以子曰起之也其先言何謂而後言子曰者乃講師自爲答問之言爾取卦體以爲答也亦如公羊榖梁傳春秋先言何曷而後道一作導其師之所傳以爲傳也今上繫凡有子曰者亦皆講師之說也然則今易皆出乎講師臨時之說矣幸而講師所引者得載於篇不幸其不及引者其亡豈不多邪嗚呼歷弟子之相傳經講師之去取不徒存者不完而其僞謬之失其可究邪夫繫者有所繫之謂也故曰繫辭焉以斷其吉凶是故謂之爻言其爲辭各聮屬其一爻者也是則孔子專指爻辭爲繫辭而今乃以孔子賛易之文爲上下繫辭者何其謬也卦爻之辭或以爲文王作或以爲周公作孔子言聖人設卦繫辭焉是斥文王周公之作爲繫辭不必復自名其所作又爲繫辭也況其文乃槩言易之大體雜論易之諸卦其辭非有所繫不得謂之繫辭也必然自漢諸儒已有此名不知從何而失之也漢去周最近不應有失然漢之所爲繫辭者得非不爲今之繫辭乎易需之辭曰需于血出自穴艮之辭曰艮其限列其夤睽之辭曰見豕負塗載鬼一車是皆險怪竒絶非世常言無爲有訓故一作詁考證而學者出其臆見隨事爲解果得聖人之㫖邪文言繫辭有可攷者其證如此而其非世常言無可攷者又可知矣今徒從夫臆出之說果可盡信之邪此孟子所歎其不如亡者也易之傳注比他經爲尤多然止於王弼其後雖有述者不必皆其授受但其傳之而已大抵易至漢分爲三有田何之易焦贛之易費直之易田何之易傳自孔子有上下二篇又有彖象繫辭文言說卦等自爲十篇而有章句凡學有章句者皆祖之田氏焦贛之易無所傳授自得乎一作之隱者之學專於隂陽占察之術凡學隂陽占察者皆祖之焦氏費直之易亦無所授又無章句惟以彖象文言等十篇解上下經凡以彖象文言等參入卦中者皆祖之費氏田焦之學廢於漢末費氏獨興遞傳至鄭康成而王弼所注或用康成之說比卦六四之類是弼即鄭本而爲注今行世者惟有王弼易其源出於費氏也孔子之古經亡矣月石硯屏歌序張景山在􅉑州時命治石橋小版一石中有月形石色紫而月白月中有樹森森然其文黒而枝葉老勁雖世之工畫者不能爲盖竒物也景山南謫留以遺予予念此石古所未有欲但書事則懼不爲信因令善畫工來松一作模寫以爲圖子美見之當愛歎也其月滿西旁微有不滿處正如十三四時其樹横生一枝外出皆其實如此不敢增損貴可信也七賢畫序某不幸少孤先人爲綿州軍事推官時某始生生四歳而先人捐館某爲兒童時先妣嘗謂某曰吾歸汝家時極貧汝父爲吏至亷又於物無所嗜惟喜賔客不計其家有無以具酒食在綿州三年他人皆多買蜀物以歸汝父不營二物而俸禄待賔客亦無餘已罷官有絹一匹畫爲七賢圖六幅此七君子吾所愛也此外無蜀物後先人調泰州軍事判官卒于任比某十許一作餘歳時家益貧每歳時設席祭祀則張此圗于壁先妣必指某曰吾家故物也後三十餘年圖亦故闇某忝立朝懼其久而益朽損遂取七賢命工装軸之更可傳百餘年以爲歐陽氏舊物且使子孫不忘先世之清風而示吾先君所好尚又以見吾母少寡而子㓜能克成其家不失舊物盖自先君有事後二十年某始及第今又二十三年矣事迹如此始爲作賛并序龍茶録後序茶爲物之至精而小團又其精者録敘所謂上品龍茶者是也蓋自君謨始造而歳貢焉一無此字仁宗尤所珍惜雖輔相之臣未嘗輙賜惟南郊大禮致齋之夕中書樞密院各四人共賜一餅宮人翦金爲龍鳯花草貼其上兩府八家分割以歸不敢碾試相一作但家藏以爲寳時有佳客出而傳翫爾至嘉祐七年親享明堂一有致字齋夕始人賜一餅余亦忝預至今藏之余自以諫官供奉仗内至登二府二十餘年纔一獲賜而丹成龍駕舐鼎莫及每一捧翫清血交零而巳因君謨著録輙附于後庶知小團自君謨始而可貴如此九字一作可貴而剏自君謨也治平甲辰七月丁丑廬陵歐陽脩書還公期書室傳桑懌傳桑懌開封雍丘人其兄慥本舉進士有名懌亦舉進士再不中去遊汝潁間得龍城廢田數頃退而力耕歳凶汝旁諸縣多盜懌白令願三字一作曰願令爲耆長徃來里中察姦民因召里中少年戒曰盜不可爲也吾在此不汝容也少年皆諾里老父子死未歛盜夜脫其衣里老父怯無他子不敢告縣臝其屍不能葬懌聞而悲之然疑少年王生者夜入其家探其篋不使之知覺明日遇之問曰爾諾我不爲盜矣今又盜里父子屍者非爾邪少年色動即推仆地縛之詰共盜者王生指某少年懌呼壯丁守王生又自馳取少年者送縣皆伏法又嘗之郟城遇尉方出捕盜招懌飲酒遂與俱行至賊所藏尉怯陽爲不知以過懌曰賊在此何之乎下馬獨格殺數人因盡縛之又聞襄城有盜十許人獨提一劒以徃殺數人縛其餘汝旁縣爲之無盜京西轉運使奏其事授郟城尉天聖中河南諸縣多盜轉運奏移澠池尉崤古險地多涂山而青灰山尤阻險爲盜所恃惡盜王伯者藏此山時出爲近縣害當此時王伯名聞朝廷爲廵檢者皆授名以捕之旣懌至廵檢者僞爲宣頭以示懌將謀招出之懌信之不疑其偽也因諜知伯所在挺身入賊中招之與伯同卧起十餘日信之乃出廵檢者反以兵邀於山口懌㡬不自免懌曰廵檢授名懼無功爾即以伯與廵檢使目爲功不復自言廵檢俘獻京師朝廷知其實罪黜廵檢懌爲尉歳餘改授右班殿直永安縣廵檢明道景祐之交天下旱蝗盗賊稍稍起其間有惡賊二十三人不能捕樞密院以傳召懌至京授二十三人名使徃捕懌謀曰盜畏吾名必已一作以潰潰則難得矣宜先示之以怯至則閉柵戒軍吏無一人得輒出居數日軍吏不知所爲數請出自效輒不許既而夜與數卒變爲盗服以出迹盗所嘗行處入民家民皆走獨有一媪留爲作飲食饋之如盗乃歸復閉柵三日又徃則携其具就媪饌而以其餘遺媪媪待以爲真盗矣乃稍就媪與語及群盗輩媪曰彼聞桑懌來始畏之皆遁矣又聞懌閉營不出知其不足畏今皆還也某在某處某在某所矣懌盡鉤得之復三日又徃厚遺之遂以實告曰我桑懌也煩媪爲察其實而慎勿泄後三日我復來矣後又三日徃媪察其實審矣明旦部分軍士用甲若干人於某所取某盗卒若干人於某處取某盗其尤彊者在某所則自馳馬以徃士卒不及從惟四騎追之遂與賊遇手殺三人凡二十三人者一日皆獲二十八日復命京師樞密吏謂曰與我銀爲君致閤職懌曰用賂得官非我欲況貧無銀有固不可也吏怒匿其閥以免短使送三班三班用例與兵馬監押未行㑹交趾獠叛殺海上廵檢昭化諸州皆警徃者數輩不能㝎因命懌徃盡手殺之還乃授閤門祗候懌曰是行也非獨吾功位有居吾上者吾乃其佐也今彼留而我還我賞厚而彼䡖得不疑我蓋其功而自伐乎受之徒慚吾心將讓其賞歸巳上者以奏藁示予予謂曰讓之必不聽徒以好名與詐取譏也懌歎曰亦思之然士顧其心何如爾當自信其心以行譏何累也若欲避名則善皆不可爲也已余慙其言卒讓之不聽懌雖舉進士而不甚知書然其所爲皆合道理多此類始居雍丘遭大水有粟二廪將以舟載之見民走避溺者遂棄其粟以舟載之見民荒歳聚其里人飼之粟盡乃止懌善劒及鐵簡力過數人而有謀略遇人常畏若不自足其爲人不甚長大亦自修爲威儀言語如不出其口卒然遇人不知其健且勇也廬陵歐陽脩曰勇力人所有而能知用其勇者少矣若懌可謂義勇之士其學問不深而能者蓋天性也余固喜傳人事尤愛司馬遷善傳而其所書皆偉烈竒節士喜讀之欲學其作而怪今人如遷所書者何少也乃疑遷特雄文善壮其說而古人未必然也及得桑懌事乃知古之人有然焉遷書不誣也知今人固有而但不盡知也懌所爲壯矣而不知予文能如遷書使人讀而喜否姑次第之外集卷第十五黃庭經序其生者者下有也字送王聖紀序前年前作二吏無無吏字言水旱旱下有事字訴於宰相四字作呌宰相以訴四出四作分畿民之三字作其㡬不得逹㡬一作畿霖潦二字作水旱易見見下又有也易一字通於於作于吏居居作隔生死曲直作曲直生死而民之志而下有巳凡二字聞于州聞于作逹乎于上作乎天子者縣不壅而民志通者巳上八字恕本作令與主簿尉先之而巳天子仁恩下而降于州州不壅而逹於縣縣不壅而得及於民亦凡三十三字接下文令與主簿尉云云主簿作爲尉佐是縣作其爲尉以夫二字作子因其行而以予二十四日作十日無二四及下六字送太原秀才序寳元二年十月乾徳令尹歐陽某序按是年六月公改武成判官明年二月當上此猶繫舊階疑未受命時作傳易圖序至其無其字有激云爾作有激而云也昔孔子子下有殁字其事無其字必以以作書夫子自作于下有所字取卦體體作辭其下有以爲問引文言六字僞謬僞作譌聮屬屬作繋孔子言孔上有故字不必作必不也必作必也其證證作謬知矣矣作也雖有述者者下有不得列于學官故上自孔子至于王弼迹其所自來以作斯圖自漢學者漸不師授而各自名家今圖之所傳者凡四十五字焦贛費直二字上各有有字自得作自言得之之學無之字漢末費氏末下有而字七賢畫序文纂作銘七賢畫事示焦生汪逵云此篇文體似非序但文纂作銘字可疑王深甫長樂集有信都公請作七賢圖詩其序云伏蒙出示先大夫所作七賢圖事又云咨求學文之士爲之頌賛將以刻石永告來裔而囘也不肖亦辱於此數則公所請作詩者不一也恕本作求七賢畫賛與焦伯強書無蜀物文纂作無一蜀物始爲賛文纂作試爲賛龍茶錄後序熈寧時文作題龍茶錄後汪逵云此篇似非序恕本作茶錄跋尾又一首贈薛少卿佳客時文作嘉客齋夕作致齋治平甲辰七月丁丑時文作治平元年七月十四日桑懌傳本舉無本字徃來文藪作得徃來徃來里中四字作得字爲也也作矣夜入作夜潜入其篋篋字下有中衣馳問里父是否里父言是即復馳還王生篋中凡二十字推仆文藪作椎仆轉運使文藪無使字崤古險崤下有澠字涂山涂作深捕之無之字宣頭無頭字授名名下有捕賊二字罪黜廵檢檢下有者字其間二字見作冀召懌至京此下脫一師字輒出出下有者字數日作十餘日民皆走民字作居字獨有無有字三日三上有後字則携文藪作則自携携其具作自携具不畏畏字上刋本缺一字恕本作不足畏某處處作所察其實作察得其實卒若干作乙若干按乙字乃對上甲字刋本作卒疑誤復命復上而有字非我我作吾送三班送下有名字與兵馬與下有嶺下二字手殺二字作平而自伐而作以與詐取譏也無與詐也三字亦思之然無此四字以行無二字二廪二廩作囤見民見上又嘗二字善劒善下有用字常畏作常謙畏遇人文藪作遇之而能者者作然偉烈偉作義古之人有然焉文藪焉字作而不誣誣作過知今人知上有又字懌所爲懌上有然字次第之之下有焉字皇祐五年序蜀畫七賢圖云爲作賛并序今此卷有其序而賛不傳閩本桑懌傳後又載錢鏐王景仁朱瑾等傳即五代史文也間有小異今不取奏議卷第十五歐陽文忠公集一百十一翰苑條約舉人懷挾文字劄子嘉祐二年正月知貢舉臣伏見國家自興建學校以來天下學者日盛務通經術多作古文其辭藝可稱履行修飭者不可勝數然累次科埸人數倍多於徃歳事旣太盛弊亦隨生竊聞近年舉人公然懷挾文字皆是小𥿄細書抄節甚備毎寫一本筆工獲錢三二十千亦有十數人共歛錢一一作三二百千雇倩一人虚作舉人名目依例下家狀入科埸只令懷挾文字入至試院其程試則他人代作事不敗則頼其懷挾共一作互相傳授事敗則不過扶出一人旣本非應舉之人雖敗别無刑責而坐獲厚利竊以國家取士務得實材今若浮僞之人容其濫進則使負辛勤藴實學者無以自别且自來科塲務存事體所以優加禮遇用待賢能今浮薄之徒不知朝廷崇獎之意自爲姦僞以至於此甚可歎也謂一作惟冝峻立科條明加約束使浮薄姦僞之徒不容於其間則實有學行之人得𬒳選進然後士子無濫舉朝廷得實才臣今欲乞増定貢院新制寛監門之責重廵鋪之賞蓋以入門之時一一搜檢則慮成擁滯故臣乞自舉人入院後嚴加廵察多差内臣及清幹京朝官廵鋪毎獲懐挾者許與理爲勞績或免逺官或指射差遣其監門官與免透漏之責若搜檢覺察得人數多者令知舉官聞奏取㫖重加酬奬其廵鋪官除只得廵察懐挾及傳授文義外不得非理侮慢舉人庻存事體且朝廷待士甚厚而小人自爲浮薄不可不行禁止以革弊源一作厚弊如允臣所奏乞立定廵鋪官賞格及懐挾人責罰刑名添入貢院新定條制仍牓南省門及下進奏院頒告天下所貴先明條約然後必行取進止論保明一無明字舉人行實一作止劄子同前臣伏覩近降勑命更定科埸條制内一節令本縣令佐知州通判保明舉人行實委無玷缺若因事彰露只罪令佐知州通判所斷刑名並用舊制雖去官經恩不得原減者伏縁舊制刑名甚重今來去官經恩不得原減則官吏所責不輕而玷缺之累中人所不能免小過微累皆爲玷缺難以必用深刑責官吏保其所不能盡知者若謂止坐大事則又無明文竊慮後有犯者難用必行之法臣今欲乞指定舉人玷缺事狀如事親不孝行止踰濫冒哀匿服曽犯刑責及雖有䕃贖而情理重者以上事節苟犯其一並不得収試如違必一作並用舊制刑名所貴事簡而易遵法嚴而必用如允臣所請乞下禮部貢院施行今取進止論契丹求御容劄子嘉祐二年臣伏見契丹所遣汎使專爲御容而來中外之議皆謂前歳旣巳許之於理不可中止失於不早踐言至彼非時遣使及朝夕以來傳聞頗異或云大臣共議欲遂拒而不與若然則臣恐釁隙之端自此而始禍患之起未昜遽言大凡爲國謀事者必先明信義重曲直酌人情量事勢四者皆得然後可以不疑苟一有未然尚恐敗事況四者俱失豈可不思契丹與中國通盟乆矣而嚮來宗真特於信好自表慇懃别有家書繼以畫像聖朝納其來意許以報之而乃遷延至今遂欲食言而中輟是則彼以推誠結我我以不信待之失信傷義甚非中國待夷狄之術而又其曲在我使彼易以爲辭自南北通和以來信問徃復之際毎於報答常從優厚假借旣乆其心巳驕況此畫像之來特表慇懃之意是則於平常之禮厚報以驕之慇懃之來則不報以沮一作阻下同之沮之彼必怒不報彼必恥懷恥畜怒何所不爲此人之常情也許其父不許其子厚薄之際此亦人情之難處也臣竊見契丹來書𥘉無寒温候問之言直以踐言孤約爲說其意在於必得若此時𬒳沮勢必更來事旣再三豈能堅執若待其失於遜順已成釁隙然後與之則重爲中國之辱又使夷狄謂中國難以恩意交惟可以勢力脅因之引惹别有它求則爲後患何可涯哉今虜主雖弱而中國邊備未完廟謀未勝未可生事而欲執我曲彼直之議以起戎而結禍夫察彼事勢必不能中止量我事勢又未能必沮之臣故曰四者俱失也臣又聞虜使入境之日地震星殞變異非常先事深防猶恐不及失計招禍豈可自爲臣願聖慈出於獨斷勿沮其善意無失我信言臣今欲乞回諭虜中告以如約直候今冬因遣常使時與之則於事體稍便伏乞速下兩府商議上繫國家利害臣不敢不言今取進止論選皇子䟽一作書嘉祐二年八月日翰林學士朝散大夫右諌議大夫知制誥充史館修撰刋修唐書判太常寺兼禮儀事上輕車都尉賜紫金魚袋臣歐陽某謹昧死再拜上書于體天法道欽文聦武聖神孝徳皇帝陛下臣聞言天下之難言者不敢冀必然之聽知未必聽而不可不言者所以盡爲忠之心況臣遭遇聖明容納諫諍言之未必不聽其可黙而不言臣伏見自去歳以來羣臣多言皇嗣之事臣亦甞因災異竊有奏陳雖聖度包容不加誅戮而愚誠懇至天聽未回臣實不勝愛君之心日夜區區未甞忘此思欲再陳狂瞽而未知所以爲言今者伏見兖國公主近巳出降臣因竊思人之常道莫親於父子之親人之常情亦莫樂於父子之樂雖在聖哲異於凡倫其爲天性於理則一陛下嚮雖未有皇嗣而尚有公主之愛上慰聖顔今旣出降漸踈左右則陛下萬機之暇處深宫之中誰可與語言誰可承顔色臣愚以謂冝因此時出自聖意於宗室之中選材賢可喜者録以爲皇子使其出入左右問安侍膳亦足以慰恱聖情臣考於書史竊見自古帝王雖曰至尊未甞獨處也其出而居外也不止百司公見奏事而巳必有儒臣學士講論於閑宴又有左右侍從顧問語言其入而居内也不止宦官宫妾在於左右而巳其平居燕寢也則有太子問安侍膳於朝夕其優游宴樂也多與宗室子弟懽然相接如家人計其一日之中未嘗一時獨處也今陛下日御前後殿百司奏事者徃徃仰瞻天顔而退其甚幸者得承一二言之徳音君臣之情不通上下之意不接其餘在廷之臣儒學侍從之列未聞一人從容親近於左右入而居内則至於問安侍膳亦闕於朝夕是則陛下冨有四海之廣躬享萬乗之尊居外則無一人可親居内則無一人得親此臣所以區區而欲言也伏況陛下荷祖宗之業承宗廟社稷之重皇子未降儲位乆虚羣臣屢言大議未決臣前所奏陳以謂未必立爲儲貳而且飬爲子旣可以徐察其賢否亦可以待皇子之降生於今爲之亦其時也臣言狂計愚伏俟斧鉞臣昧死再拜乞冩祕閣書令館職校讎劄子嘉祐二年九月兼判祕閣祕書省臣近準勑兼判祕閣檢㑹先準皇祐元年七月十一日中書劄子節文奉聖㫖祕閣有闕者書名件用崇文總目逐旋𥙷寫依例酬校了以黄絹裝褫正副二本収附準備御覽内中取索一作借本閣尋且畫一合行事件聞奏蒙依所奏施行當時雖有此行遣尋值抄寫觀文殿書權住至今㐲見館閣校讎之官貟數甚多除係省府南曹外其餘主判閑局及别無主判者並各無書校對旣無職事因此多不入館伏以館閣國家優飬賢材之地自祖宗以來號爲清職今館宇閴然塵埃滿席有同廢局甚可嘆嗟臣今欲乞檢㑹先準皇祐元年七月十一日所降指揮及一宗行遣次第許從本閣選請在院館職官員先將祕閣書目與崇文總目點對内有見闕書籍即於三館取索先校定然後抄寫成書仍差𥘉校覆校官刋正裝禠其合行事件已有畫一起請依奏指揮亦乞檢㑹施行惟元乞公用錢乞更不支破其抄寫楷書候見得闕書數目將見在楷書人數酌量多少如一作照闕人即别具擘畫聞奏今取進止乞定兩制員數劄子嘉祐三年臣竊以學士待制號爲侍從之臣所以承宴間備顧問以論思獻納爲職自祖宗以來尤精其擇一作尤所精擇苟非清徳羙行藹然衆譽髙文博學獨出一時則不得與其選是以選用至艱員數至少官以難得爲貴人以得職爲榮搢紳之望旣隆則朝廷之體増重其後用人頗易員數漸多徃時學士待制至六七十員近年以來稍慎除拜即今猶及四十餘員臣以謂愛惜名器不輕授人朝廷旣巳知之矣而為國家一無矣而家三字計者宜於此時一作亦宜及今創立經制今惟翰林學士中書舍人知制誥各有定員其餘學士待制未有定一作員數臣今欲乞檢詳前史及國朝故事自觀文殿大學士至待制並各立定員數遇有員闕則精擇賢材以充其選苟無其人尚可虚位以待如允臣所請乞賜詳議施行取進止論, WYG: ''}
