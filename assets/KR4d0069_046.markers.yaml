  - {type: variant, offset: 0, length: 2356, content: 居士集卷第四十六歐陽文忠公集四十六上書一首準詔言事上一作上封事書月日臣脩謹昧死再拜上書于皇帝陛下臣近準詔書許臣上書一作許以封章言事臣學識愚淺一作昧不能廣引深逺以明治亂之原謹採當今急務條爲三弊五事以應詔書所求伏惟陛下裁擇臣聞自古王者之治天下雖有憂勤之心而不知致治之要則心愈勞而事愈乖雖有納諫之明而無力行之果斷則言愈多而聽愈惑故爲人君者以細務而責人專大事而獨斷此致治之要術一無此字也納一言而可用雖衆說一作議不得以沮一作汨之此力行之果斷也知此二者天下無難治矣一本治作致理伏見國家自大兵一動中外一作天下騷然陛下思社稷之安危念兵民之疲一作困弊四五年來聖心憂勞一作勤可謂至矣然而兵日益老賊日益彊併九州之力討一作平一西戎小者尚無一人敢前今又北戎大者違盟而動一作妄作其將何以禦之從來所患者夷狄今夷狄叛矣所惡者盜賊今盜賊起矣所憂者水旱今水旱作矣所頼一作仰者民力今民力困矣所須一作急者財用今財用乏矣陛下之心日憂於一日天下之勢歳危於一歳此臣所謂用心雖勞不知求致治之要者也近年朝廷開發一作雖廣言路獻計之士不下數千然而事緒轉多枝梧不暇從前所採衆議紛紜至於臨事誰䇿可用此臣所謂聽言雖多不如力行之果斷者也伏思聖心所甚憂而當今所尚一作最闕者不過曰無兵也無將也無財用也無禦戎之䇿也無可任之臣也此五者陛下憂其未有而臣謂今皆百之然陛下未得而用者未思其術也國家創業之𥘉四方割據中國地狹兵民不多然尚能南取荆楚收僞唐定閩嶺西平兩蜀東下并潞北窺幽燕當時所用兵財將吏其數㡬何惟善用之故不覺其少何況一作豈如今日承百年祖宗之業盡有天下之冨彊人衆物盛十倍國𥘉故臣敢言有兵有將有財用有禦戎之䇿有可任一有用字之臣然陛下皆不得而用者其故何哉由朝廷有三大弊故也何謂三一有大字弊一曰不愼號令二曰不明賞罰三曰不責功實此三弊因循於上則萬事弛慢廢壞於下臣聞號令者天子之威也賞罰者天子之權也若號令一有煩而二字不信賞罰一有行而二字不當則天下不服故又須責臣下以功實然後號令不虚岀而賞罰不濫行是以愼號令明賞罰責功實此三者帝王之竒術也自古人君英雄如漢武帝聦明如唐太宗皆知用一作皆能知此三術而自執威權之柄故一有二帝二字所求無不得所欲皆如意漢武好用兵則誅滅四夷立功萬里以快其心欲求將則有衛霍之材以供其指使欲得賢士則有公孫董汲之徒以稱其意唐太宗好用兵則誅突厥服遼東威振夷狄以逞其志欲求將則有李靖李勣之徒一作儔入其駕馭欲得賢士則有房杜之徒一作輩在其左右此二帝者一有凡有所爲後丗莫及八字可謂所求無不得所欲皆如意無他術也惟能自執威權之柄耳伏惟陛下以聖明之姿超出一作越二帝又盡有漢唐之天下然而欲禦邊則常患無兵欲破賊則常患無將欲贍軍則常患無財用欲威服四夷則常患無䇿欲任使賢材則常患無人是所求皆不得所欲皆不如意其故無他由不用威權之術也自古帝王或爲強臣所制或爲小人所惑則威權不得出於已今朝無強臣之患旁無小人偏任之溺一作又無小人獨任之惑内外臣庶尊陛下如天愛陛下如父傾耳延首願一有聽字陛下之所爲然何所憚而不爲乎一作何憚而乆不爲哉若一日赫然執一作奮威權以臨之則一作可使萬事皆辦何患五者之無柰何爲三弊之因循一事之不集臣請言三弊夫言多變則一有俗字不信令頻改則一有下字難從一作入今岀令之𥘉不加詳審行之未乆尋又更張以不信之言行難從之令故每有處置之事州縣一作天下知朝廷未是一定之命則官吏或一作咸相謂曰且未要一作可行不乆必須更改或曰備禮行下略與應破指揮旦夕之間果然又變至於將一作官吏更易道路疲於送迎符一作文牒縱橫上下莫能遵守一作禀中外臣庶一作官吏軍民或聞而歎息或聞而竊笑歎息者有憂天下之心竊笑者有輕朝廷之意號令如此欲威天不貶而依舊軍中見有罪者不誅則諸將誰肯用命矣所謂賞不足勸威一作罰無所懼賞罰如此而欲用人其可得乎此不明賞罰之弊一有二字也自兵動以來處置之事不少然多有名而無實臣請略言其一二則其他可知數年以來點兵不絶諸路之民半爲兵矣其間老弱病患短小怯懦者不可勝數一有兵額空多所用者少八字是有點兵之虚名而無得兵之實數一作効也新集之兵所在教習追呼上下民不安居主教者非將領之材所教者無旗鼔之節一作法往來州縣愁一作怨嘆嗷嗷旣多是老病小怯一作弱小懦之人又無訓齊精練之法一作術此有教兵之虚名而無訓兵之實藝一作効也諸路州軍分造器械一作諸州所造器悈數不少矣工作之際已勞民力輦運般送又苦道塗一作路然而鐵刃不剛一作鋼筋膠不固長短大小多不中度造作之所但務充數而速了不計所用之不堪經歷官司又無檢責此有器械之虚名而無器械之實用也以草草一作無實之法教老一作小怯之兵執鈍折不堪之器械百戰百敗理在不疑臨事而悟何可及乎故事無大小悉皆鹵莽則不責功實之弊一有三字也臣故曰三弊因循於上則萬事弛慢廢壞於下萬事不可盡言臣請一直直字言一有其字大者五事其一曰兵臣聞攻人以謀不以力用兵鬭智不鬭多前代用兵之人多者常敗少者常勝漢王尋等以百萬之兵遇光武九千人而敗是多者敗而少者勝也苻堅以百萬之兵遇東晉二三萬人而敗是多者敗而少者勝也曹操以三十萬青州兵大敗於吕布退而歸許復以二萬人破袁紹十四五萬一作四十萬人是用兵多則敗少則勝之明驗也況於夷狄尤難以力爭只可以計取李靖破突厥於定襄只用三千人其後破頡利於隂山亦不過一萬一作萬人下有其佗以三五千人立功塞外者不可悉數十六字蓋兵不在多能以計取一作能用計爾故善用兵者以少一有而字爲多不善用者雖多而愈少也一無此字爲今計者一作臣謂方今添兵則耗國減兵則破賊今沿邊之兵不下七八十萬可謂多矣然訓練不精又有老弱虚數則十人不當一人是七八十萬之兵不當七八萬人之用加又一作之軍無統制分散支離分多為寡兵法所忌此所謂不善用兵者雖多而愈少故常戰而常敗也臣願陛下赫然奮威勑勵諸將精加訓練去其老弱七八十萬中可得一有四字五十萬數古人用兵以一當百今旣未能但得以一當十則五十萬精兵二字一作數可當五百萬兵之用此所謂善用兵者以少而爲多古人所以少而常勝者以此也今不思實効但務添多耗國耗民積以年歳子作, WYG: ''}
