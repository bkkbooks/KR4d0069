  - {type: variant, offset: 2340, length: 2264, content: 延日月賊雖不至天下巳困矣此一事也其二曰將臣又聞古語曰將相無種故或出於奴僕或岀於軍卒一作或岀於士或岀於卒伍或岀於奴僕或出於盜賊惟能不次而用之乃爲名將耳國家求將之意雖勞一作切選將之路太狹今詔近臣舉將而限以資品則英豪之士在下位者不可得矣試將材者限以弓馬一夫之勇則智略萬人之敵皆遺之矣山林竒傑之士召而至者以其貧賤而薄之不過與一主簿借職使其一作之怏怏而去則古之屠釣飯牛之傑皆激怒而失之矣至於無人可用則寧用龍鍾跛躄庸懦暗劣之徒皆一有委之要地四字授之兵柄天下三尺童子皆爲朝廷危之前日澶淵之卒㡬爲國家生事此可見也議者不知取將之無術但云當今之無將臣願陛下革去舊弊奮然精求有賢豪之士不須限以下位有智略之人不必試以弓馬有山林之傑不可薄其貧賤惟陛下能以非常之禮待人人臣亦將以非常之効報國一作爲報又下有又何患於無將哉一句此二事也其三曰財用臣又聞善治病者必醫其受病之處善救弊者必尋一作塞其起弊之源今天下財用困乏其弊安在起於用兵一作兵興而費大故也漢武好窮兵用盡累丗之財當時勒兵單于臺不過十八萬一作十萬人尚能困其一無其字國力況未若一無二字今日七八十萬連四五年而不罷一作解所以罄天地之所生竭萬民之膏血而用不足也今雖有智者物不能増而計無所岀矣惟有減冗卒之虚費練精兵而速戰功成兵罷自然足矣今兵有可減之理一有而字無人敢當其事賊有速擊之便一有而字無將一作人敢奮其勇後時敗事徒耗國而耗民一有惟陛下以威權督責之乃有期耳二句此三事也其四曰禦戎之䇿臣又聞兵法曰上兵伐謀其次伐交北虜與朝廷通好僅四十年不敢妄動今一旦發其狂謀者其意何在蓋見中國頻爲元昊所敗故敢啓其貪心伺隙而動尔今若勑勵諸將選兵秣馬疾入西界但能痛敗昊賊一陣則吾軍威大振而虜計沮矣此所謂上兵伐謀者也今詗一作論事者皆知北虜與西賊通謀欲併二國之力窺我河北陜西一有若使二虜並㓂則難以力支十一字今若我能先擊敗其一國則虜勢減半不能獨舉此兵法所謂伐交者也元昊地狹賊兵不多向來攻我傳聞北虜常有助兵今若虜中自有點集之謀而元昊驟然𬒳擊必求助於北虜北虜分兵助昊則可牽其南㓂之力若不助昊則二國有隙自相疑貳此亦伐交之䇿也假令二國剋期分路來㓂我能先期大舉則元昊蒼皇自救不暇豈能與北虜相爲表裏是破其素定之約乖其剋日之期此兵法所謂親而離之者亦伐交之䇿也元昊叛逆以來幸而屢勝常有輕視諸將之心今又見朝廷北憂戎虜方經營於河朔必謂我師不能西岀今乘其驕怠正是疾驅急擊之時此兵法所謂岀其不意者此一無此字取勝之上䇿也前年西將有請岀攻者當時賊氣力一無力字方盛我兵未練朝廷尚許其岀師況今元昊有可攻之勢此不可失之時彼方幸吾憂河北而不虞我能西征岀其不意此可攻之勢也自四路分帥今巳半年訓練恩信兵巳可用故近日屢奏小捷是我師漸振賊氣漸衂此可攻之勢也苟失此時而使二虜先來則吾無䇿矣臣願陛下一有不以臣言爲狂密七字詔執事之臣熟一作詔四路之帥協議而行之此四事也其五曰可任之臣臣又聞仲尼曰十室之邑必有忠信況今文武列職一作文武常選之官盈於朝廷徧於天下其間豈無材智之臣而陛下總治萬機之大旣不暇盡識其人故不能躬自進賢而退不肖執政大臣動拘舊例又不敢進賢而退不肖審官吏部三班之職但掌文簿差除而巳又不敢越次進賢而退不肖是上自天子下至有司無一人得進賢而退不肖者所以賢愚混雜僥倖相容三載一遷更無旌别平居無事惟患太多而差遣一作除不行一旦臨事要人常患乏人使用自古任官之法無如今日之繆也今議者或謂一有以字舉主轉官爲進賢犯罪黜責爲退不肖此不知其弊之深也大凡善惡之人各以類聚故守廉愼者各舉清幹之人一無上十字有贓汙者各舉貪濁之人好徇私者各舉請一作好財利者各舉誅求之人性庸暗者各舉不材之人一有守廉節者乃舉公幹之人十字朝廷不問是非但見舉主數足便與改官則清一作公幹者進矣貪濁者亦進矣請一作誅求者亦進矣不材者亦進矣混淆如此便可爲進賢之法乎方今黜責官吏豈有澄清糾舉之術哉惟犯贓之人因民論訴者乃能黜之耳夫能舞弄文法而求財賂者亦強黠之吏政事必由已岀故雖誅剥豪民尚或不及貧弱至於不材之人不能主事衆胥羣吏共爲姦欺則民無貧冨一時受弊以此而言則贓吏與不材之人爲害等耳今贓吏因自敗者乃加黜責十不去其一二至於不材之人上下共知而不問寛緩容姦其弊如此便可爲退不肖之法乎賢不肖旣無别則冝乎設官雖多而無人可用也臣願陛下明賞罰責功實則材一有不材二字皆列於陛下之前矣臣故曰五者皆有然陛下不得而用者爲有弊也三弊五事臣旣已詳言之矣惟陛下擇之天下之務不過此也方今天文變於上地理逆於下人心怨於内四夷攻於外事勢如此矣非是陛下遲疑寛緩之時惟願爲社稷生民留意一作惟陛下留計狂直甘俟誅夷臣脩昧死再拜居士集卷第四十六熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正準詔言事伏見一作臣伏見所採一作年來伏思一作臣伏思惟善一作蓋善其少此下一有也字敢言一作敢曰漢武好用兵一作漢武帝立功一作収功服遼一作破遼威振夷狄一作威加四海房杜一作王魏房杜欲贍軍則常患無財用一作欲贍軍冨國則常患無財今朝一作方今外一事之不集此上一有而字十年不問此下一有蓋字皆當斬罪一作法皆當斬所謂賞所一作是言其一二言一作舉造作二字上一有蓋字則不責功則一作此王尋等以百萬之兵兵一作師九千人九一作六苻堅以百萬之兵兵一作衆只用三千人用字下一有兵字愈少一作爲少破賊一作破虜不當七八萬當一作得勑勵勑一作飭至於無人可用至於一作以至授之一作授以賢豪一作英豪漢武好一作昔漢武帝好勒兵一作耀兵勑勵勑一作督仲尼曰一作語曰豈無材智之臣一作非無材智之人動拘舊例拘一作循糾舉之術一作糾案之法寛緩容姦緩一作縱天文變一作天災見於外一作其外事勢一作事理右言事書凡一作者皆江鈿文海本疑是𥘉槀不若集本之善故難盡從姑擿其大槩如此後人亦可推公改定之意矣, WYG: ''}
