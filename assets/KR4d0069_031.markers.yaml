  - {type: variant, offset: 0, length: 5005, content: 居士集卷第三十一歐陽文忠公䧶三十一墓誌五首太子太師致仕杜祁公墓誌銘故太子太師致仕祁國公贈司徒兼侍中杜公諱衍字世昌越州山隂人也其先本出於堯之後歷三代常爲諸侯後徙其封于杜而子孫散適他國者以杜爲氏自杜赫爲秦將軍後三世御史大夫周及其子建平侯延年仍顯于漢又九世當陽侯預顯于晉又十有四世岐國公佑顯于唐又九世而至于祁公其爲家有法其吉凶祭祀齋戒日時幣祝從事一用其家書自唐㓕士喪其舊禮而一切苟簡獨杜氏守其家法不遷於世俗蓋自春秋諸侯之子孫歴秦漢千有餘歲得不絶其世譜而唐之盛時公卿家法存於今者惟杜氏公自曽髙以來以恭儉孝謹稱鄕里至公爲人尤㓗㢘自剋一作刻其爲大臣事其上以不欺爲忠推於人以行己取信故其動静纎悉謹而有法至考其大節偉如也一作至考其始終之大節雖古君子有不能及也其立於朝廷天下國家以爲重退而老也乆而天子益思之公享年八十官至尚書左丞方其六十有九歲且盡即上書告老明年以太子少師致仕累遷太子太保太傅太師封祁國公於其家天子祀明堂遣使者召公陪祠將有所問以疾不至而歲時存問勞賜不絶公少舉進士髙第爲揚州觀察推官知平遥縣通判晉州知乾州遷河東京西路提點刑獄知揚州河東陜西路轉運使入爲三司戸部副使拜天章閣待制知荆南府未行以爲河北路都轉運使遂知天雄軍召爲御史中丞判流内銓知審官院拜樞宻直學士知永興軍徙知并州遷龍圗閣學士復知永興軍權知開封府康定元年以刑部侍郎同知樞宻院事即拜副使慶暦三年遷吏部侍郎樞宻使明年以夲官同中書門下平章事公治吏事如其爲人其聽獄訟雖明敏而審覈愈精故屢决疑獄人以爲神其簿書出納推析毫髮終日無倦色至爲條目必使吏不得爲姦而巳及其施於民者則簡而易行始居平遥嘗以吏事適他州而縣民爭訟者皆不肯决以待公歸知乾州未滿歲安撫使察其治行以公權知鳯翔府二邦之民爭於界上一曰此我公也汝奪之一曰今我公也汝何有焉夏人𥘉叛命天下苦於兵而自陜以西尤甚吏縁侵漁調發督迫至民破産不能足徃徃自經投水以死於是時公在永興語其人曰吾不能免汝然可使汝不勞爾乃爲之區處計較量物有無貴賤道里逺近寛其期㑹使以次一作得次第輸送由是物不踴貴車牛芻秣宿食來徃如平時而吏束手無所施民比他州費省十六七至於繕治城郭器械民皆不知開封治京師常撓於權要有干其法而能不爲之屈者世皆以爲難至公能使權要不敢有所干凡其爲治以聽斷盗訟爲能否爾獨公始有餘力省其民事如治他州而畿赤諸縣之民皆𬒳其恵開封比比出能吏而兼於民政者惟公一人吏部審官主天下吏貟而居職者類以不乆遷去故吏得爲姦公始視銓事一日選者三人爭某闕公以問吏吏受丙賕對曰當與甲乙不能爭遂一作乃授他闕居數日吏教丙訟甲負某事不當得公悟召乙問之乙謝曰業巳得他闕不願爭公不得巳與丙而笑曰此非吏罪乃吾未知銓法爾因命諸曹各具格式科條以白問曰盡乎曰盡矣明日勑諸吏無得升堂使坐曹聽行文書而巳由是吏不得與銓事與奪一出於公居月餘翕然聲動京師其在審官有以賄求官者吏謝不受曰我公有賢名不乆見用去矣姑少待之慶暦之𥘉上猒西兵之乆出而民弊亟用今丞相冨公樞宻韓公及范文正公而三人者遂欲盡革衆事以修紀綱而小人權倖皆不恱獨公與相佐佑而公尤抑絶僥倖凡内降與恩澤者一切不與毎積至十數則連封而靣還之或詰責其人至慙恨涕泣而去上嘗謂諫官歐陽脩曰外人知杜某封還内降邪吾居禁中有求恩澤者毎以杜某不可告之而止者多於所封還也其助我多矣此外人及杜某皆不知也然公與三人者卒皆以此罷去公多知本朝故實善决大事𥘉邉將議欲大舉以擊夏人雖韓公亦以爲可舉公爭以爲不可大臣至有欲以沮軍罪公者然兵後果不得出契丹與夏人爭銀甕族大戰黄河外而鴈門麟府皆警范文正公安撫河東欲以兵從公以爲契丹必不來兵不可妄出范公怒至以語侵公公不爲恨後契丹卒不來二公皆世俗指公與爲朋黨者其論議之際盖如此及三人者將罷去公獨以爲不可遂一作故亦罷以尚書左丞知兖州歲餘乃致仕公自布衣至爲相衣服飲食無所加雖妻子亦有常節家故饒財諸父分産公以所得悉與昆弟之貧者俸禄所入分給宗族賙人急難至其歸老無屋以居寓於南京驛舎者乆之自少好學工書畫喜爲詩讀書雖老不倦推獎後進今世知名士多出其門居家見賔客必問時事聞有善喜若已出至有所不可憂見於色或夜不能寐如任其責者凡公所以行之終身者有能履其一君子以爲人之所難而公自謂不足以名後世遺戒子孫無得紀述嗚呼豈所謂任重道逺而爲善惟日一無此字不足者歟曽祖太子少保一作師諱某贈太師祖鴻臚卿諱叔詹追封呉國公父尚書度支貟外郎諱遂良追封韓國公皆贈太師中書令兼尚書令娶相里氏封晉國夫人子男曰詵大理評事訢太常愽士訥將作監主簿詒祕書省正字三子早卒女長適集賢校理蘇舜欽次適祕閣校理李綖次適單州團練推官張遵道公以嘉祐二年二月五日卒于家其子訢以其年十月十八日葬公于應天府宋城縣之仁孝原銘曰翼翼祁公率履自躬一其𥘉終惟徳之恭公在干位士知貪㢘退老于家四方之瞻豈惟士夫天子曰咨爾曲爾直繩之墨之正爾方圎有矩有規人莫之踰公無爾欺予左予右惟公是毗公雖告休受寵不巳宫臣國公即命于第奕奕明堂萬邦從祀豈無臣工爲予執法何以召之惟公舊德公不能來予其徃錫君子愷悌民之父母公雖百齡人以爲少不俾黄耇喪予元老寵禄之隆則有止期惟其不巳旣去而思銘昭于逺萬世之詒太常博士尹君墓誌銘并序君諱源字子漸姓尹氏與其弟洙師魯俱有名於當世其論議文章博學彊記皆有以過人而師魯好辯果於有爲子漸爲人剛簡不矜飾能自晦蔵與人居乆而莫知至其一有所發則人必驚伏其視世事若不干其意巳而搉其情僞計其成敗後多如其言其性不能容常人而善與人交乆而益篤自天聖明道之間予與其兄弟交其得於子漸者如此其曾祖諱誼贈光禄少卿祖諱文化官至都官郎中贈刑部侍郎父諱仲宣官至虞部貟外郎贈工部郎中子漸𥘉以祖廕𥙷三班借職稍遷左班殿直天聖八年舉進士及第爲奉禮郎累遷太常博士歴知芮城河陽二縣簽署孟州判官事又知新鄭縣通判涇州慶州知懷州以慶暦五年三月十四日卒于官趙元昊冦邉圍定川堡大將葛懷敏發涇原兵救之君遺懷敏書曰賊舉其一無此字國而來其利不在城堡而兵法有不得而救者且吾軍畏法見敵必赴而不計利害此其所以數敗也冝駐兵瓦亭見利而後動懷敏不能用其言遂以敗死劉渙知滄州杖一卒不服渙命斬之以聞一作徇坐專殺降知密州君上書爲渙論直得復知滄州范文正公常薦君材可以居館閣召試不用遂知懷州至朞月大治是時天子用范文正公與今觀文殿學士冨公武康軍節度使韓公欲更置天下事而權倖小人不便三公皆罷去而師魯與時賢士多𬒳誣枉得罪君歎息憂悲發憤以一無此字謂生可厭而死可樂也徃徃𬒳酒哀歌泣下朋友皆竊怪之巳而以疾卒享年五十至和元年十有二月十三日其子材葬君于一作於河南府壽安縣甘泉鄕龍一作龕澗里其平生所爲文章六十篇皆行於世子男四人曰材植機桴嗚呼師魯常勞其智於事物而卒蹈憂患以窮死若子漸者矌然不有累其心而無所屈其志然其壽考亦以不長豈其所謂短長得失者皆非此之謂歟其所以然者不可得而知歟銘曰有韞于中不以施一憤樂死其如歸豈其志之將衰不然世果可嫉其如斯太子中舎梅君墓誌銘故太子中舎致仕梅君諱讓字克讓世爲宣城人常以文學仕進君獨不肯仕其弟詢勉之君曰士之仕也進而取榮禄易欲行其志而無媿於心者難吾豈不欲仕哉居其一無此字官不得行其志食其一無此字禄而有媿於其心者吾不爲也今吾居父母之邦事長老以恭接朋友以信守吾墳墓安吾里閭以老死而無恨此吾志也其弟後貴顯必欲官之君堅不肯乃奏任君大理評事致仕于家有子六人曰堯臣曰正臣曰彦臣曰禹臣曰純臣其一早卒其三子皆仕宦而堯臣有名當世今爲國子博士累以郊祀恩進君爲太子中舍君旣老堯臣來歸朱服象笏侍君旁郷人不榮其子而榮其父堯臣等皆以君年髙願留養君不許曰此非吾意也顧其二子曰勉爾朝夕以輔吾老顧其三子曰勉爾名譽以爲吾榮居者養吾體仕者養吾志可也君享年九十有一一作二康彊無恙以皇祐元年正月朔卒于家其子堯臣泣請於其友廬陵歐陽脩曰堯臣不肖仕不顯而無聞不足以成吾先人之志退託文字以銘後世又不敢以自私予乃爲之一本上四字作子其爲吾銘之銘曰志之充樂也一作乎中壽以隆福有終銘無窮耀幽宫湖州長史蘇君墓誌銘并序故湖州長史蘇君有賢妻杜氏自君之喪布衣𬞞食居數歲提君之孤子歛其平生文章走南京號泣于其父曰吾夫屈於生猶可伸於死其父太子太師以告於予予爲集次其文而序之以著君之大節與其所以屈伸得失以深誚世之君子當爲國家樂育賢材者一有惜字且悲君之不幸其妻卜以嘉祐元年十月某日葬君于潤州丹徒縣義里鄕檀山里石門村又號泣于其父曰吾夫屈於人間猶可伸於地下於是杜公及君之子泌皆以書來乞銘以葬君諱舜欽字子美其上世居蜀後徙開封一有府字爲開封人自君之祖諱易簡以文章有名太宗時承㫖翰林爲學士參知政事官至禮部侍郎父諱耆官至工部郎中直集賢院君少以父䕃𥙷太廟齋郎調滎陽尉非所好也巳而鎻其㕔去舉進士中第改光禄寺主簿知蒙城縣丁父憂服除知長垣縣遷大理評事監在京樓店務君狀貌竒偉慷慨有大志少好古工爲文章所至皆有善政官于京師位雖卑數上䟽論朝廷大事敢道人之所難言范文正公薦君召試得集賢校理自元昊反兵出無功而天下殆一作怠於乆安尤一作而困兵事天子奮然用三四大臣欲盡革衆弊以紓民於是時范文正公與今冨丞相多所設施而小人不便顧人主方信用思有以撼動未得其根以君文正公之所薦而宰相杜公壻也乃以事中君坐監進奏院祠神奏用市故𥿄錢㑹客爲自盗除名君名重天下所㑹客皆一時賢俊悉坐貶逐然後中君者喜曰吾一舉網盡之矣其後三四大臣一有相字繼罷去天下事卒不復施爲君携妻子居蘇州買水石作滄浪亭日益讀書大涵肆於六經而時發其憤悶於歌詩至其所激徃徃驚絶又喜行狎一作草書皆可愛故其雖短章醉墨落筆爭爲人所傳天下之士聞其名而慕見其所傳而喜徃揖其貌而竦聽其論而驚以服乆與其居而不能捨以去也居數年復一作二年後得湖州長史慶暦八年十二月某日以疾卒于蘇州享年四十有一君先娶鄭氏後娶杜氏三子長曰泌將作監主簿次曰液曰激二女長適前進士陳紘次尚幼𥘉君得罪時以奏用錢爲盗無敢辨其冤者自君卒後天子感悟凡所𬒳逐之臣復召用一有今字皆顯列于朝而至今無復爲君言者冝其欲求伸於地下也冝予述其得罪以死之詳而使後世知其有以也旣又長言以爲之辭庻幾并寫予之所以哀君者其辭曰謂爲無力兮孰擊而去之謂爲有力兮胡不反子之歸豈彼能兮一作而此不爲善百譽而不進兮一毀終世以顛擠荒孰問兮杳難知嗟子之中兮有韞而無施文章發耀兮星日光輝雖冥冥以掩恨兮不一作冝昭昭其永垂翰林侍讀侍講學士王公墓誌銘并序公諱洙字原叔其生始能言巳知爲詩指物一有輙字能賦旣長學問自六經史記百氏之書至於圗緯隂陽五行律吕星官筭法訓故字音一本上四字作方言訓詁篆隷八分無所不學學必通逹如其專家其語言𥘉如不出諸口已而辨别條理發其精㣲聽者忘倦决疑請益人人必得其所欲故自其少也一時名臣賢士皆稱慕之其名聲著天下𥘉舉進士爲廬州舒城尉坐事免官歸居南京故相臨淄晏公爲留守竒其文章待以客禮乆之復調賀州冨川主簿未行臨淄公薦其才留居應天府學教諸生㑹一無此字詔舉經術士爲學官京東轉運使舉公應詔召爲國子監直講遷太理評事史舘檢討知太常禮院天章閣侍講直龍圗閣同判太常寺慶暦中小人有不便大臣執政者欲排去之未知所發而杜丞相子壻蘇舜欽爲集賢校理負時名所與交遊皆當世賢豪巳而舜欽坐監進奏院祠神㑹客爲御史所彈公以一作預坐客貶知濠州徙知襄徐亳三州范文正公冨丞相皆言王某學問經術多識故事冝在朝廷復召爲檢討同判太常寺侍講充史館修撰拜知制誥權判吏部流内銓至和元年九月爲翰林學士三年以親嫌改侍讀學士兼侍講學士嘉祐二年九月甲戌朔以疾卒享年六十有一累官至尚書吏部郎中階朝散大夫勲輕車都尉爵開國伯食邑五百戸公爲人寛厚樂易孝於宗族信於朋友諸孤不能自立者皆爲之嫁娶始舉進士時與郭稹同保人有告稹冒一有祖字母禫者法當連坐主司召公問果保稹否不然可易也公言保之不可易也於是與稹俱罷公以文儒進用能因其所學爲上開陳其言緩而不迫天子常喜其說意有所欲必以問之無不能對嘗以塗金龍水牋爲飛白詞林二字以襃之至於朝廷他有司前言故實皆就以考正旣領太常吉凶禮典撰定尤多嘗修集韻校定史記前後漢書編國朝㑹要鄕兵制度祖宗故事三朝經武聖略皇祐中大享明堂翰林侍讀學士宋祁言明堂禮廢乆必得通知古今之學者詔公共草其儀禮成撰大享明堂記又詔修雅樂晚喜隷書尤有古法著易傳十篇一無此五字其他一作所爲文章千有餘篇其施於爲政敏而有方襄州中廬戍兵驕前爲守者患之不能制公至因事召之悉集于庭告曰某時爲某事者非某人邪取其一二人一無此字寘于法餘悉不問一有由是二字兵始知懼是時妖賊反貝州州縣無逺近皆警動佐吏勸公毋給州卒教習者真兵公笑曰是欲防亂乎此所以使人不安也在徐州遭歲大饑免民舟筭緡使得糴旁郡而一有多字出公私米粟賑民所活尤多一作甚衆有司上其最一有爲京東第一五字降詔書襃美一作奬諭其在朝廷多所論議遇人恂恂惟謹及旣殁而考其言皆當世要一作大務公知制誥夏竦卒天子以東宫舊恩賜謚文, WYG: ''}
