  - {type: variant, offset: 4989, length: 834, content: 公曰此僖祖皇帝謚也封還其目不爲草辭因曰前有司謚王溥爲文獻章得象爲文憲字雖異而音同皆當改於是太常更謚竦文莊而溥得象皆易謚又嘗論宗戚近幸冒法干恩澤以亂刑賞又言天下民田稅不均而姦民逃亡有司失其常稅請用郭諮孫琳千歩開方爲均田法頒之州縣使因民訟稍稍均之可不擾而有司得復其常數近時選諌官御史有執政之臣嘗薦舉者皆以嫌不用公以謂士飭身勵行而大臣薦賢以報國以嫌廢一作置之是疑大臣而廢賢材不可及論河功邉食皆可施行方公病時八月開邇英閤侍臣並進講讀而公獨病一作不在天子思之遣使者問公疾少間否能起而爲予講邪旣而公病篤以卒天子震悼賻䘏加等贈給事中特賜謚曰文即以其年十月辛酉葬于應天府虞一作宋城縣之孟諸鄕土山原公應天宋城人也曽祖諱厚祖諱化贈太傅父諱礪贈太師中書令兼尚書令公𥘉娶董氏再娶胡氏皆先公卒又娶齊氏封髙陽郡君子男五人長曰叟臣早卒次曰力臣太常寺太祝次欽臣祕書省正字次陟臣將作監主簿次曽臣某官一無二字一女適太常博士陳安道銘曰惟王氏之先逺自三代下迄戰國商周齊魏其後之人皆以王爲氏故其爲姓尤多於後世而太原之王出周王子公世可考實太原人後家于宋遂以蕃延惟其皇考是生八子公實其季其徳克嗣播其休聲以顯于仕八支之盛名譽材賢公考朝廷儒學之臣退食于家詵詵子孫豈其不樂胡奪之年朝無咨詢士失益友送車國門出涕引首于兹歸蔵刻銘不朽居士集卷第三十一熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正杜祁公墓誌銘衢閩蜀本皆作娶相里氏司馬公記聞亦然惟羅氏并吉本以爲李氏近歲吉州教授林仲熊遂入纂誤非也王文公墓誌銘諸本皆作階朝奉大夫惟羅氏本作朝散大夫蘇長史墓誌天下殆於乆安二十三卷余襄公神道碑作怠於乆安朝佐攷公集怠迨殆三字似通用徐氏墓誌吾母不以愛殆我糓城縣夫子廟記見者殆焉此亦以怠爲殆也劉侍讀墓誌殆今三十年祭丁學士文殆榮華之銷歇此則以迨爲殆也諸本間有改者覽者以意讀之杜祁公墓誌銘而三人者遂欲盡革衆事遂一作乃工書畫盖心畫之畫一本以其用俗書畫字遂削去後有李端懿蔡襄墓誌皆云工書畫蘇君墓銘太子太師此下一有祁國公三字文章一作文華所好一作其好, WYG: ''}
