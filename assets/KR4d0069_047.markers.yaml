  - {type: variant, offset: 0, length: 617, content: 居士集卷第四十七歐陽文忠公集四十七書八首荅陜西安撫使范龍圖辭辟命書脩頓首再拜啓急脚一作歩至得七月十九日華州所發書伏審即日尊體動止萬福一有卑情不任欣慰之至八字戎狄侵邊自古常事邊吏無狀至煩大賢伏惟執事忠義之節信於天下天下之士得一識面者退誇於人以爲榮耀至於游談布衣之賤往往竊託門下之名矧今以大謀小以順取逆濟以明哲之才有必成功之勢則士之好功名者於此爲時孰不願岀所長少助萬一得託附以成其名哉況聞狂虜猖蹶屢有斥指之詞加之輕侮購募之辱至於執戮將吏殺害邊民凡此數事在於脩軰尤爲憤恥毎一思之中夜三起不幸脩無所能徒以少喜文字過爲世俗見許此豈足以當大君子之舉哉若夫參決軍謀經畫財利料敵制勝在於幕府苟不乏人則軍書奏記一有之二拙三字一末事耳有不待脩而堪者矣由此始敢以親爲辭況今丗人所謂四六者非脩所好少爲進士時不免作之自及第遂棄不復作在西京佐三相幕府於職當作亦不爲作此師魯所見今廢巳乆懼無好辭以辱嘉命此一端也一本此下云某雖儒生不知兵事竊惟兵法有勇有怯必較彼我之利否事之如何要在成功不限遲速某近至京師屢於諸公間畧聞緒言攻守之計此實當時之冝非深思逺見者孰能至此願不爲浮議所移伏見自至關西辟士甚衆古人所與成事者必有國士共之非惟在上者以知人爲難士雖貧賤以身許人固亦未易欲其盡死必深相知知之不盡士不爲用今竒怪豪儁之士徃徃蒙見收擇顧用之如何尔一有此在明哲豈須獻言然尚一作但慮山林草莽有挺特知義慷慨自重之士未得岀於門下也冝少一作亦冝思焉若脩者恨無他才以當長者之用非敢効庸人苟且, WYG: ''}
