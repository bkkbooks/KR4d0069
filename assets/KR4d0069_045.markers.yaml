  - {type: variant, offset: 3861, length: 10, content: 脩昧死再拜居士集卷第, WYG: 近準詔書許臣上書言事臣學識愚淺不能廣引深逺以明治亂之原謹採當今急務條為三弊五事以應詔書所求伏惟陛下裁擇臣聞自古王者之治天下雖有憂勤之心而不知致治之要則心愈勞而事愈乖雖有納諫之明而無力行之果斷則言愈多而聽愈惑故為人君者以細務而責人專大事而獨斷此致治之要術也納一言而可用雖衆說不得以沮之此力行之果斷也知此二者天下無難治矣伏見國家自大兵一動中外騷然陛下思社稷之安危念兵民之疲弊}
