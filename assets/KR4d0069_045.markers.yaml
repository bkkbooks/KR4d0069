  - {type: variant, offset: 3918, length: 2, content: 大商, WYG: 上則萬事弛慢廢壊於下臣聞號令者天子之威也賞罰者天子之權也若號令不信賞罰不當則天下不服故又須責臣下以功實然後號令不虚出而賞罰不濫行是以慎號令明賞罰責功實此三者帝王之竒術也自古人君英雄如漢武帝聰明如唐太宗皆知用此三術而自執威權之柄故所求無不得所欲皆如意漢武好用兵則誅滅四夷立功萬里以快其心欲求將則有衛霍之材以供其指使欲得賢士則有公孫董汲之徒以稱其意唐太宗好用兵則誅突厥服遼東威振夷狄以逞其志欲求將則有李靖李勣之徒入其駕馭欲得賢士則有房杜之輩在其左右此二帝者可謂所求無不得所欲皆如意無他術也惟能自執威權之柄耳伏惟陛下以聖明之姿超出二帝又盡有漢唐之天下然而欲禦邊則常患無兵欲破賊則常患無將欲贍軍則常患無財用欲威服四夷則常患無䇿欲任使賢材則常患無人是所求皆不得所欲皆不如意其故無他由不用威權之術也自古帝王或為強臣所制或為小人所惑則威權不得出於巳今朝無強臣之患旁無小人偏任之溺内外臣庶尊陛下如天愛陛下如父傾耳延首顧陛下之所為然何所憚而不為乎若一日赫然執威權以臨之則萬事皆辦何患五者之無奈何為三弊之因循而一事}
