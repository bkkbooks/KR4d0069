  - {type: variant, offset: 3912, length: 2, content: 耕于, WYG: 也無禦戎之䇿也無可任之臣也此五者陛下憂其未有而臣謂今皆有之然陛下未得而用者未思其術也國家創業之初四方割據中國地狹兵民不多然尚能南取荆楚收偽唐定閩嶺西平兩蜀東下并潞北窺幽燕當時所用兵財將吏其數㡬何惟善用之故不覺其少何況今日承百年祖宗之業盡有天下之富強人衆物盛十倍國初故臣敢曰有兵有將有財用有禦戎之䇿有可任之臣然陛下皆不得而用者其故何哉由朝廷有三大弊故也何謂三弊}
