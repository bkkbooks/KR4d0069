  - {type: variant, offset: 3464, length: 247, content: 一有又今商賈之難以術制者以其積貨多而不急故也利厚則來利薄則止不可以號令召也故每有司變法下利旣薄小商以無利而不能行則大商方幸小商之不行適得獨賣其貨尚安肯勉趨薄利而來哉故變法而刻利者適足使小商不來而爲大商賈積貨也今必以術制商冝盡括其居積之物官為賣而還之使其貨盡而後變法夫大商以利為生一􅍲不營利則有惶惶之憂彼必不能守積錢而閑居得利雖薄猶將勉而來此變法制商之術也夫欲誘商而通貨莫若與之共利此術之上也欲制商使其不得不從則莫若痛裁之使無積貨此術之下也然此可制茶商耳若鹽者禁益密則冐法愈多而刑繁凡二百三十八字, WYG: ''}
