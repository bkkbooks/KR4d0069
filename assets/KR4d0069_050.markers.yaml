  - {type: variant, offset: 1127, length: 3, content: 豪滿前, WYG: 窮達出處之際得其精粹涵畜充溢抑而不發久之慨然曰可矣由是下筆頃刻數千言其縱横上下出入馳驟必造於深㣲而後止盖其稟也厚故發之遲志也慤故得之精自來京師一時後生學者皆尊其賢學其文以為師法以其父子俱知名故號老蘇以别之初脩為上其書召試紫微閣辭不至遂除試秘書省校書郎㑹太常修纂建隆以來禮書乃以為霸州文安縣主簿使食其禄與陳州項城縣令姚闢同修禮書為太常因革禮一百巻書成方奏未報而君以疾卒實治平三年四月戊申也享年五十有八天子聞而哀之特贈光禄寺丞勑有司具舟載其喪歸於蜀君娶程氏大理寺丞文應之女生三子曰景早卒軾今為某官轍某官三女皆早卒孫曰邁曰遟有文集二十巻諡法三巻君善與人交急人患難死則䘏養其孤鄉人多徳之盖晩而好易曰易之道深矣汨而不明者諸儒以附㑹之説亂之也去之則聖人之㫖見矣作易傳未成而卒某年某月某日𦵏於彭山之安鎮鄉可龍里君生於逺方而學又晚成常歎曰知我者惟吾父與歐陽公也然則非余誰宜銘銘曰蘇顯當世實欒城人以宦留眉蕃蕃子孫自其髙曽鄉里稱仁偉歟明允大發於文亦既有文而又有子其存不朽其嗣彌昌嗚呼明允可}
