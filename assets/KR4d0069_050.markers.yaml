  - {type: line-break, offset: 3623, content: '', id: KR4d0069_SBCK_050-11a02}
  - {type: variant, offset: 3623, length: 0, content: '', WYG: 獨以先王之法度未盡施於今以為大缺其策學者之辭殷勤切至問以古今繁簡淺深之宜與夫周禮之可行與不可行而一時習見百年之治若無所事乎此者使公之志弗克遂伸而荆國王文公得乘其間而執之神宗皇帝方鋭意於三代之治荆公以霸者功利之説飾以三代之文正百官定職業脩兵民制國用興學校以養天下之才是皆神宗皇帝聖慮之所及者嘗試行之尋察其有管晏之所不道改作之意盖見於末命而天下已紛然趨於功利而不可禁學者又習於當時之所謂經義者剥裂牽綴氣日以卑公之文雖在而天下不復道矣此子瞻之所為深悲而屢歎也元祐間始以末命從事學者復知誦公之文未及十年浸復荆公之舊迄於宣政之末而五季之文靡然遂行於世然其間可勝道哉二聖相承又四十餘年天下之治大略舉矣而科舉之文猶未還嘉祐之盛盖非獨學者不能上承聖意而科制已非祖宗之舊而況上論三代是以公之文學者雖私誦習之而未以為急也故予姑掇其通於時文者以與朋友共之由是而不止則不獨盡究公之文而三代兩漢之書盖將自求之而不可禦矣先王之法度猶將望之而況於文乎則其犯是不韙得罪於世之君子而不辭也雖然公之文雍容典雅紆餘寛平反復以達其意無復毫髪之遺}
