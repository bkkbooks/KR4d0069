  - {type: variant, offset: 35, length: 1, content: 祭, SBCK: 􅀕}
  - {type: variant, offset: 40, length: 1, content: 相, WYG: 尚書令兼中書令追封魏}
  - {type: variant, offset: 42, length: 1, content: 程, WYG: 公諡曰文正王公諱旦字子明大名莘人也皇曽祖諱言滑州黎陽令追封許國公皇祖諱徹左拾遺追封魯國公皇考諱祐尚書兵部侍郎追封晋國公皆累贈太師尚書公兼中書令曽祖妣姚氏贈魯國夫人祖妣田氏贈秦國夫人妣任氏贈徐國夫人邉氏贈秦國夫人公皇考以文章自顯漢周之際逮事太祖太宗為名臣嘗諭杜重威使無反漢拒盧多遜害趙普之謀以百口明符彦卿無罪故世多稱王氏有隂德}
  - {type: page-break, offset: 42, content: '', id: KR4d0069_WYG_017-2a, image: WYG1103/WYG1103-0780a.png}
  - {type: variant, offset: 45, length: 0, content: '', WYG: 皇考亦自植三槐於庭曰吾之後世必有為三公者此其所以志也公少好學有文太平興國五年進士及第為大理評事知臨江縣監潭州銀場再遷著作佐郎與編文苑英華遷殿中丞通判鄭濠二州王禹偁薦其才任轉運使驛召至京師辭不受獻其所為文章得試直史舘遷右正言知制誥知淳化三年禮部貢舉遷虞部員外郎同判吏部流内銓知考課院右諫議大夫趙昌言參知政事公以壻避嫌求解職太宗嘉之改禮部郎中集賢殿修撰昌言罷復知制誥仍兼修撰判院事召賜金紫久之遷兵部郎中居職真宗即位拜中書舍人數日召為翰林學士知審官院通進銀臺封駮事公為人嚴重能任大事避逺權勢不可干以私由是真宗益知其賢錢若水名能知人常稱公曰真宰相器也若水為樞宻副使罷召對苑中問誰可大用者若水言公可用真宗曰吾固已知之矣咸平三年又知禮部貢舉居數日拜給事中知樞宻院事明年以工部侍郎參知政事再遷刑部侍郎景徳元年契丹犯邉真宗幸澶州雍王元份留守東京得暴疾命公馳自行在代元份留守二年遷尚書左丞三年拜工部尚書同中書門下平章事集賢殿大學士監修國史是時契丹初請盟趙徳眀亦納誓約願守河西故地二邉兵罷不用真宗遂欲以無事治天下公以為宋興三世祖宗之法具在故其為相務行故事慎所改作進退能否賞罰必當真宗久而益信之所言無不聽雖他宰相大臣有所請必曰王某以為如何事無大小非公所言不决公在相位十餘年外無夷狄之虞兵革不用海内富實羣工百司各得其職故天下至今稱為賢宰相公於用人不以名譽必求其實苟賢且才矣必久其官衆以為宜某職然後遷其所薦引人未嘗知㓂準為樞宻使當罷使人私公求為使相公大驚曰将相之任豈可求耶且吾不受私請準深恨之已而制出除準武勝軍節度使同中書門下平章事準入見泣涕曰非陛下知臣何以至此真宗具道公所以薦準者準始媿歎以為不可及故參知政事李穆子行簡有賢行以将作監丞居於家真宗召見慰勞之遷太子中允初遣使者召之不知其所止真宗命至中書問王某然後人知行簡公所薦也公自知制誥至為相薦士尤多其後公薨史官修真宗實録得内出奏章乃知朝廷之士多公所薦者公與人寡言笑其語雖簡而能以理屈人黙然終日莫能窺其際及奏事上前羣臣異同公徐一言以定今上為皇太子太子諭徳見公稱太子學書有法公曰論徳之職止於是耶趙徳明言民飢求糧百萬斛大臣皆曰徳明新納誓而敢違請以詔書責之真宗以問公公請勑有司具粟百萬於京師詔徳明來取真宗大喜徳明得詔書慙且拜曰朝廷有人大中祥符中天下大蝗真宗使人於野得死蝗以示大臣明日他宰相有袖死蝗以進者曰蝗實死矣請示於朝率百官賀公獨以為不可後數日方奏事飛蝗蔽天真宗顧公曰使百官方賀而蝗如此豈不為天下笑邪宦者劉承規以忠謹得幸病且死求為節度使真宗以語公曰承規待此以瞑目公執以為不可曰他日将有求為樞宻使者奈何至今内臣官不過留後公任事久人有謗公於上者公輒引咎未嘗自辯至人有過失雖人主盛怒可辯者辯之必得而後已榮王宫火延前殿有言非天災請置獄劾火事當坐死者百餘人公獨請見曰始失火時陛下以罪已詔天下而臣等皆上章待罪今反歸咎於人何以示信且火雖有迹寧知非天譴耶由是當坐者皆免日者上書言宫禁事誅籍其家得朝士所與徃還召問吉凶之説真宗怒欲付御史問狀公曰此人之常情且語不及朝廷不足罪真宗怒欲付獄公因自取嘗所召問之書進曰臣少賤時不免為此必以為罪願并臣付獄真宗曰此事已發何可免公曰臣為宰相執國法豈可自為之幸於不發而以罪人真宗意解公至中書悉焚所得書既而真宗悔復馳取之公曰臣已焚之矣由是獲免者衆公累官至太保以病求罷入見滋福殿真宗曰朕方以大事託卿而卿疾如此因命皇太子拜公公言皇太子盛徳必任陛下事因薦可為大臣者十餘人其後不至宰相者李及凌策二人而已然亦皆為名臣公屢以疾請真宗不得已拜公太尉兼侍中五日一朝視事遇軍國大事不以時入叅决公益惶恐因卧不起以疾懇辭冊拜太尉玉清昭應宫使自公病使者存問日嘗三四真宗手自和藥賜之疾亟遽幸第賜以白金五千兩辭不受以天禧元年九月癸酉薨於家享年六十有一真宗臨哭輟視朝三日發哀於苑中其子弟門人故吏皆被恩澤即以其年十一月庚申𦵏公於開封府開封縣新里鄉大邉村公娶趙氏封榮國夫人後公若干年卒子男三人長曰司封郎中雍次曰賛善大夫沖次曰素女四人長適太子少傅韓億次適兵部員外郎直集賢院蘇耆次適右正言范令孫次適龍圖閣直學士兵部郎中吕公弼諸孫十四人公事寡嫂謹其弟旭友悌尤篤任以家事一無所問而務以儉約率勵子弟使在富貴不知為驕侈兄子睦欲舉進士公曰吾嘗以太盛為懼其可與寒士争進至其薨也子素猶未官遺表不求恩澤有文集二十巻乾興元年詔配享真宗廟庭臣脩曰景徳祥符之際盛矣觀公之所以相而先帝所以用公者可謂至哉是以君明臣賢徳顯名尊生而俱享其榮殁而長配於廟可謂有始有卒如明詔所襃昔者蒸民江漢推大臣下之事所以見任賢使能之功雖曰山甫穆公之詩實歌宣王之徳也臣謹考國史實録至於搢紳故老之傳得公終始之節而録其可紀者輒聲為銘詩昭示後世以彰先帝之明以稱聖恩襃顯王氏流澤子孫與宋無極之意銘曰烈烈魏公相我真宗真廟翼翼魏公配食公相真宗不言以躬時有大事事有大疑匪卜匪筮公為蓍龜公在相位終日如黙問其夷狄包裹兵革問其卿士百工以職問其庶民耕織衣食相有賞罰功當罪明相所黜升惟否惟能執其權衡萬物之平孰不事君胡能必信孰不為相其惟有終公薨於位太尉之崇天子孝思來薦清廟侑我聖考惟時元老天子念功報公之隆春秋從享萬祀無窮作為詩歌以諗廟工晏元獻公至和元年六月觀文殿大學士行兵部尚書西京留守臨淄公以疾歸於京師八月疾少間入見天子曰噫予舊學之臣也乃留侍講邇英閤詔五日一朝前殿明年正月疾作不能朝飭太醫朝夕徃視有司除道將幸其家公歎曰吾無状乃以疾病憂吾君即馳奏曰臣疾少間行愈矣乃止其月丁亥以公薨聞天子震悼亟臨其喪以不即視公為恨贈公司空兼侍中諡曰元獻有司請輟視朝一日詔特輟二日以其年三月癸酉𦵏公於許州陽翟縣麥秀鄉之北原既𦵏賜其墓隧之碑首曰舊學之碑既又勑史臣脩考次公事具書於碑下臣脩伏讀國史見真宗皇帝時天下無事天子方推讓功徳祠祀天地山川講禮樂以文頌聲而儒學文章雋賢偉異之人出公世家江西之臨川年始十四一日起田里進見天子時方親閲天下貢士㑹廷中者千餘人與夫宫臣衛官擁列圜視公不動聲氣操筆為文辭立成以獻天子嘉賞賜同進士出身遂登館閣掌書命以文章為天下所宗逮陛下養徳東宫先帝選用臣屬即以公遺陛下由王官宫臣卒登宰相凡所以輔道聖徳憂勤國家有舊有勞自始至卒五十餘年公既𦵏而先帝之名臣與陛下東宫之舊人皆無在者宜其襃寵優異比公甘盤臣脩幸得執筆史官奉明詔謹昧死上臨淄公事曰公諱殊字同叔姓晏氏其世次晦顯徙遷不常自其髙祖諱墉唐咸通中舉進士卒官江西始著籍於髙安其後三世不顯曽祖諱延昌又徙其籍於臨川祖諱郜追封英國公考諱固追封秦國公自曽祖已下皆用公貴累贈開府儀同三司太師中書令兼尚書令曽祖妣張氏陳國太夫人祖妣傳氏許國太夫人妣吳氏越國太夫人公生七歳知學問為文章鄉里號為神童故丞相張文節公安撫江西得公以聞真宗召見既賜出身後二日又召試詩賦論公徐啓曰臣嘗私習此賦不敢隠真宗益嗟異之因試以他題以為秘書省正字置之秘閣使得悉讀秘書命故僕射陳文僖公視其學明年獻其所為文召試中書遷太常寺奉禮郎封祀泰山推恩遷光禄寺丞數月充集賢校理明年遷著作佐郎丁父憂去官已而真宗思之即其家起復命淮南發運使具舟送之京師從祀太清宫賜緋衣銀魚同判太常禮院又丁母憂求去官服喪不許今天子始封昇王公以選為府記室參軍再遷左正言直史館今天子為皇太子以户部員外郎充太子舍人賜金紫知制誥判集賢院遷翰林學士充景}
