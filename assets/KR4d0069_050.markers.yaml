  - {type: variant, offset: 542, length: 2, content: 榮禄, WYG: 漢又九世當陽侯預顯於晉又十有四世岐國公佑顯於唐又九世而至於祁公其為家有法其吉凶祭祀齋戒日時幣祝從事一用其家書自唐滅士喪其舊禮而一切苟簡獨杜氏守其家法不遷於世俗盖自春秋諸侯之子孫厯秦漢千有餘歳得不絶其世譜而唐之盛時公卿家法存於今}
