  - {type: variant, offset: 1876, length: 0, content: '', WYG: 姓鄭氏考諱徳儀世為江南名族太夫人恭儉仁愛而有禮初封福昌縣太君進封樂安安康彭城三郡太君自其家少㣲時治其家以儉約其後常不使過}
  - {type: variant, offset: 1877, length: 1, content: 靈, WYG: ''}
  - {type: variant, offset: 1879, length: 0, content: '', WYG: 吾兒不能苟合於世儉薄所以居患難也其後}
  - {type: page-break, offset: 1879, content: '', id: KR4d0069_WYG_020-11a, image: WYG1103/WYG1103-0803c.png}
