  - {type: variant, offset: 627, length: 3, content: 責嗚呼, WYG: 至尚書左丞方其六十有九嵗且盡即上書告老明年以太子少師致仕累遷太子太保太傅太師封祁國公於其家天子祀明堂遣使者召公陪祠將有所問以疾不至而歳時存問勞賜不絶公少舉}
