  - {type: variant, offset: 59, length: 156, content: 進晚而相接一笑之樂淋漓酒巵十年再見公老予衰公遽如此予存㡬時人生冨貴朝露之光及其零落止一作秖益悲傷惟可喜者令名不忘士窮閭巷念不逢時公位將相韜能不施公居廟堂有言諤諤白首于外愉愉其樂酒酣氣振猶見鋒鍔惜也雖老神清志完手書未復訃巳在門昔者罇酒歌歡笑謔今而一觴涕淚霑落死生忽焉自古常然撫棺爲訣夫復何言尚享祭資政范公文月日廬陵, WYG: ''}
