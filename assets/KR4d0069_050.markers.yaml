  - {type: variant, offset: 1, length: 0, content: '', WYG: 民度土自一夫以上皆有法制則其於衆務何其繁也今自京師至於海隅徼障一尉卒之職必命於朝政之大小皆自朝出州縣之吏奉行而已是舉天下皆所自治其於大體則為繁矣其州縣大小邑閭田井訓農練卒一夫以上略無制度其於衆務何其忽而簡也夫禮以治民而樂以和之徳義仁恩長養涵澤此三代之所以深於民者也政以一民刑以防之此其淺者爾今自宰相至于州縣之有司莫不行文書治吏事其急在於督賦斂斷獄訟而已此特淺者耳禮樂仁義吏不知所以為而欲望民之被其敎其可得乎夫治大以簡則力有餘治小以繁則事不遺制民以淺則防其僻漸民以深則化可成此三代之所以治也今一切悖古簡其當繁而繁其可簡務其淺而忽其深故為國百年而仁政未成生民未厚者以此也然若欲使國體大小適繁簡之冝法政弛張盡淺深之術諸侯井田不可卒復施於今者何宜禮樂刑政不可卒成用於今者何便悖古之失其原何自脩復之方其術何始迹治亂通古今子大夫之職也其悉心以陳焉問周禮三王之治損益不同而制度文章惟周為大備周禮之制設六官以治萬民而百事理夫公卿之任重矣若乃祭祀天地日月宗廟社稷四郊明堂之類天子大臣所躬親者一嵗之間有㡬又有廵狩朝㑹師田射耕燕饗凡大事之舉一嵗之間又有㡬而為其民者亦有畋獵學校射鄉飲酒凡大聚㑹一嵗之間有㡬又有州黨族官嵗時月朔春秋酺禜詢事讀法一嵗之間又有㡬其齋戒供給期召奔走廢日㡬何由是而言疑其官不得安其府民不得安其居亦何暇修政事治生業乎何其煩之若是也然說者謂周用此以致太平豈朝廷禮樂文物萬民富庶愷弟必如是之勤且詳然後可以致之歟後世苟簡不能備舉故其未能及於三代之盛歟然為治者果若是之勞乎用之於今果安焉而不倦乎抑其設施有法而第弗深考之歟諸君子為言之問井田孟子以為井地不均則穀禄不平經界既正而分田制禄可坐而定也故曰仁政必自經界始蓋三代井田之法也自周衰迄今田制廢而不復者千有餘嵗凡為天下國家者其善治之迹雖不同而其文章制度禮樂刑政未嘗不法三代而於井田之制獨廢而不取豈其不可用乎豈憚其難而不為乎然亦不害其為治也仁政果始於經界乎不可用與難為者果萬世之通法乎王莽嘗依古制更名田矣而天下之人愁苦怨叛卒共起而亡之莽之惡加于人者雖非一而耕田之制當時民特為不便也嗚呼孟子之所先者後世皆不用而治用之而民特愁苦怨叛以為不便則孟子謂之仁政可乎記曰異世殊時不相㳂襲書又曰事不師古匪說攸聞書傳之言其戾如此而孰從乎孟子世之所師也豈其泥於古而不通於後世乎豈其所謂迂闊者乎不然將有說也自三代之後有天下莫盛漢唐漢唐之治視三代何如其民田之制稅賦之差又何如其可施於今者又何如皆願聞其詳也問為政為政者徇名乎襲迹乎三代之名正名也其迹治迹也所謂名者萬世之法也迹者萬世之制也正名立制言順事成然後因名迹以考實而其文章事物粲然無不備矣可謂盛哉董仲舒以為三代質文有改制之名而無變道之實者是也自秦肆其虐滅棄古典然後三代之名與迹皆變易而喪其實豈所謂變其道者邪然自秦迄今千有餘嵗或治或亂其廢興長短之勢各由其人為之而已其襲秦之名不可改也三代之迹不可復也豈其理之自然歟豈三代之制止於三代而不可施於後世歟王莽求其迹而復井田宇文求其名而復六官二者固昏亂敗亡之國也然則孔子言為政必也正名孟子言為政必始經界豈虚言哉然自秦以來治世之主㡬乎三代者唐太宗而已其名迹固未嘗復三代之一二而其治則㡬乎三王豈所謂名迹者非此之謂歟豈遺名與迹而直考其實歟豈孔孟之所謂者有㫖而學者弗深考之歟其酌古今之宜與其異同者以對問取}
