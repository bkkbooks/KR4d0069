  - {type: variant, offset: 12, length: 1, content: 和, WYG: 闔郡驚焉自爾府君徙為御史䑕囓被具君乃畫地為獄召鼠誅之視其腹中果有被具府君欲從學道頃無所進府君怒勅收公昉妻子公昉呼其師告以厄於是乃以藥塗屋柱飲牛馬六畜須臾有大風雲來迎公昉妻子屋宅六畜翛然與之俱去其説如此可以為怪妄矣嗚呼自聖人沒而異端起戰國秦漢之際竒辭怪説紛然争出不可勝數久而佛之徒來自西夷老之徒起於中國而二患交攻為吾儒者徃徃牽而從之其卓然不惑者僅能自守而已欲排其説而黜之常患乎力不足也如公昉之事以語愚人豎子皆知其妄矣不待有力而後能破其惑也然彼漢人乃刻之金石以傳後世其意惟恐後世之不信然後之人未必不從而惑也右漢太尉劉寛碑隂題名寛碑有二其故吏門生各立其一也此題名在故吏所立之碑隂其别列於後者在寛子松之碑隂也寛以漢中平二年卒至唐咸亨元年其裔孫胡城公爽以碑歳久皆仆於野為再立之并記其世序嗚呼前世士大夫世家著之譜牒故自中平至咸亨四百餘年而爽能知其世次如此之詳也盖自黄帝以來子孫分國受姓厯堯舜三代數千歳間詩書所紀皆有次序豈非譜繫源流傳之百世不絶歟此古人所以為重也不然則士生於世皆莫自知其所出而昧其世徳逺近其所以異於禽獸者僅能識其父祖爾其可忽哉唐世譜牒尤備士大夫務以世家相髙至其弊也或陷輕薄婚姻附託邀求貨賂君子患之然而士子修飭喜自樹立兢兢惟恐墜其世業亦以有譜牒而能知其世也今之譜學亡矣雖名臣巨族未嘗有家譜者然而俗習苟簡廢失者非一豈止家譜而已哉右王獻之法帖余嘗喜覽魏晉以來筆墨遺跡而想前人之髙致也所謂法帖者其事率皆弔哀候病叙睽離通訊問施於家人朋友之間不過數行而已盖其初非用意而逸筆餘興淋漓揮灑或妍或醜百態横生披巻發函爛然在目使人驟見驚絶徐而視之其意態愈無窮盡故使後世得之以為竒翫而想見其人也於髙文大策何嘗用此而今人不然至或棄百事敝精疲力以學書為事業用此終老而窮年者是真可笑也右昭仁寺碑在幽州唐太宗與薛舉戰處也唐自起義與羣雄戰處後皆建佛寺云為陣亡士薦福湯武之敗桀紂殺人固亦多矣而商周享國皆數百年其荷天之祐者以其心存大公為民除害也唐之建寺外雖託為戰亡之士其實自贖殺人之咎爾其撥亂開基有足壮者及區區於此不亦陋哉碑文朱子奢撰而不著書人名氏字畫甚工此余所録也右放生池碑不著書撰人名氏放生池唐世處處有之王者仁澤及於草木昆蟲使一物必遂其生而不為私惠也惟天地生萬物所以資於人也然代天而治物者常為之節使其足用而取之不過萬物得遂其生而不夭三代之政如斯而已易大傳曰庖犧氏之王也能通神明之徳以類萬物之情作結繩而為網罟以佃以漁盖言其始教民取物資生而為萬世之利此所以為聖人也浮圖氏之説乃謂殺物者有罪而放生者得福苟如其言則庖犧氏遂為人間之聖人地下之罪人矣右司刑寺大脚跡并碑銘二閻朝隠撰附詩曰匪手攜之言示之事盖諭昏愚者不可以理曉而决疑惑者難用空言雖示之已驗之事猶懼其不信也此自古聖賢以為難語曰中人以下不可以語上者聖人非棄之也以其語之難也佛為中國大患非止中人以下聰明之智一有惑焉有不能解者矣方武氏之時毒被天下而刑獄慘烈不可勝言而彼佛者遂見光蹟於其間果何為哉自古君臣事佛未有如武氏之時盛也視朝隠等碑銘可見矣然禍及生民毒流王室亦未有若斯之甚也碑銘文辭不足録録之者所以警也俾覽者知無佛之世詩書雅頌之聲斯民䝉福者如彼有佛之盛其金石文章與其人之被禍者如此可以少思焉右華陽頌唐𤣥宗詔附𤣥宗尊號曰聖文神武皇帝可謂盛矣而其自稱曰上清弟子者何其陋哉方其肆情奢淫以極富貴之樂盖窮天下之力不足以贍其欲使神仙道家之事為不無亦非其所可兾矧其實無可得哉甚矣佛老之為世惑也佛之徒曰無生者是畏死之論也老之徒曰不死者是貪生之説也彼其所以貪之意篤則棄萬事絶人理而為之然而終於無所得者何哉死生天理之常畏者不可以苟免貪者不可以苟得也惟積習之久者成其邪妄之心佛之徒有臨死而不懼者妄意乎無生之可樂而以其所樂勝其所可畏也老之徒有死者則相與諱之曰彼超去矣彼解化矣厚自誣而託之不可詰或曰彼術未至故死爾前者苟以遂其非後者從而惑之以為誠然也佛老二者同出於貪而所習則異然由必棄萬事絶人理而為之其貪於彼者厚則捨於此者果若𤣥宗者方溺於此而又慕於彼不勝其勞是真可笑也右令長新戒唐開元之治盛矣𤣥宗嘗自擇縣令一百六十三人賜以丁寜之戒其後天下為縣者皆以新戒刻石今猶有存者余之所得者六世人皆忽不以為貴也𤣥宗自除難遂至太平世徒以為英豪之主然不知其興治之勤用心如此可謂為政知本末矣然鮮克有終明智所不免惜哉新戒凡六其一河内其二虞城其三不知所得之處其四汜水其五穰其六舞陽右平泉草木記李徳裕撰余嘗讀鬼谷子書見其馳説諸侯之國必視其為人材性賢愚剛柔緩急而因其好惡喜懼憂樂而捭闔之陽開隂塞變化無窮顧天下諸侯無不在其術中者惟不見其所好者不可得而説也以此知君子宜慎其所好盖泊然無欲而禍福不能動亦利害不能誘此鬼谷之術所不能為者聖賢之髙致也其次簡其所欲不溺於所好斯可矣若徳裕者處富貴招權利而好竒貪得之心不已至或疲弊精神於草木斯其所以敗也其遺戒有云壞一草一木者非吾子孫此又近乎愚矣右華嶽題名自唐開元二十三年訖後唐清泰二年實二百一年題名者五百十一人再題者又三十一人録為十巻徃徃當時知名士也或兄弟同遊或子姪並侍或寮屬將佐之咸在或山人處士之相攜或奉使奔命有行役之勞或窮髙望逺極登臨之適其富貴貧賤歡樂憂悲非惟人事百端而亦世變多故開元二十}
