  - {type: variant, offset: 8, length: 0, content: '', WYG: 踰也仲尼有云必也正名乎言為政之大本不可歪也墨家者流其言貴儉兼愛尊賢右鬼非命尚同此墨家之所行也孟子之時墨與楊其道塞路孟子以墨子之術儉而難遵兼愛而不知親踈故辭而闢之然其强本嗇用之説有足取焉春秋之際王政不明諸侯交亂談説之士出於其間各挾其術以干時君其因時遇變當權事而制宜有足取焉雜家者流取儒墨名法合而兼之其言廣穿衆説無所不通然亦有補於治道不可廢焉農家者流衣食之大原也四民之業其次曰農稷播百穀勤勸天下功炳後世著見書史孟子聘列國陳王道未始不論耕桑之勤漢興劭農勉人為之著令今集其樹藝之説庶取法焉書曰狂夫之言聖人擇焉又曰詢于芻蕘是小説之不廢也古者懼下情之壅於上聞故每歳孟春以木鐸徇于路採其風謡而觀之至於俚言巷語亦足取也今特列而存之周禮夏官司馬掌軍戎以九伐之法正邦國書之洪範八曰師易之繫辭取諸睽此兵之所由始也湯武之時勝以仁義春秋戰國出竒狃變其術無窮自田齊始著司馬之法漢興張韓之徒序次其書武帝之世楊僕又捃摭之謂之紀奏孝成命任宏乃以權謀形勢隂陽技巧析為四種由是兵家之文既脩列矣然而司馬之法本之禮讓後世莫行焉惟孫武之書法術大詳考今之列非特四種又雜以卜筮刑政之説存諸篇章古者史官其書有法大事書之策小事載簡牘至於風俗之舊耆老所傳遺言逸迹史不及書則傳記之説或有取焉然自六經之文諸家異學説或不同况乎幽人處士聞見各異或詳一時之所得或發史官之所諱參求考質可以備多聞焉仲尼之業垂之六經其道宏博君人治物百王之用微是無以為法故自孟子揚雄荀卿之徒又駕其説扶而本之厯世諸子傳相祖述自名一家異端其言或破碎於大道然訂其作者之意要之孔氏不有殊焉道家者流本清虚去健羨泊然自守故我無為而民自化我好静而民自正雖聖人南面之治不可易至或不究其本棄去仁義而歸之自然以因循為用則儒者病之云集古録跋尾十右漢}
