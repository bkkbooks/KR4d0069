  - {type: variant, offset: 10, length: 0, content: '', WYG: 粹巻三欽定四庫全書歐陽文粹巻四宋陳亮編書通進司上書臣伏見國家自元昊叛逆關西用兵以來為國言事者衆矣臣初竊謂三䇿以料賊情然臣迂儒不識兵之大計始猶遲疑未敢自信今兵興既久賊形已露如臣素料頗不甚逺故竊自謂有可以助萬一而塵聽覽者謹條以聞惟陛下仁聖寛其狂妄之誅幸甚夫關西弛備而民不見兵者二三十年矣使賊萌亂之初藏形隱計卒然而來當是時吾之邊屯寡弱城堡未完民習久安而易驚将非素選而敗怯使其羊驅豕突可以奮然而深入然國威未挫民力未疲彼得城而居不能久守虜掠而去可邀擊其歸此下䇿也故賊知而不為之外國侵邊自古為患其攻城掠野敗則走勝則來蓋其常事此中䇿也故賊兼而用之若夫假僣名號以威其衆先擊吾之易取者一二以悅其心然後訓養精銳為長久之謀故其來也雖勝而不前不敗而自退所以誘吾兵而勞之也或擊吾東或擊吾西乍出乍入所以使吾兵分備多而不得減息也吾欲速攻賊方新銳坐而待戰彼則不來如此相持不三四嵗吾兵已老民力已疲不幸又遇水旱之災調歛不勝而盜賊羣起彼方奮其全銳擊吾困弊可也使吾不堪其困忿而出攻決於一戰彼以逸而待吾勞亦可也幸吾苦兵計未知出遂求通聘以邀嵗時之賂度吾困急不得不從亦可也是吾力一困則賊謀無施而不可此兵法所謂不戰而疲人兵者上䇿也而賊今方用之今三十萬之兵食於西者二嵗矣又有十四五萬之鄉兵不耕而自食其民自古未有四五十萬之兵連年仰食而國力不困者也臣聞元昊之為賊威能畏其下恩能死其人自初僣叛嫚書已上逾年而不出一出則鋒不可當執劫蕃官獲吾將帥多禮而不殺此其兇謀所畜皆非倉卒者也奈何彼能以上䇿而疲吾吾不自知其已困彼為久計以撓我我無長䇿而制之哉夫訓兵養士伺隙乘便用間出竒此將帥之職也所謂閫外之事而君不御者可也至於外料賊謀之心内察國家之勢知彼知此因謀制敵此朝廷之大計也所謂廟算而勝者也不可以不思今賊謀可知以久而疲我耳吾勢可察西人已困也誠能豐財積粟以紓西人而完國壯兵則賊謀沮而廟算得矣夫兵攻守而已然皆以財用為強弱也守非財用而不久此不待言請試言攻昔秦席六世之強資以事胡卒困天下而不得志漢因文景之富力三舉而纔得河南隋唐突厥吐蕃常與中國相勝敗擊而勝之有矣未有舉而滅者秦漢尤强者其所攻今元昊之地是也況自劉平陷没賊鋒熾銳未嘗挫衂攻守之計非臣所知天威所加雖終期於掃盡然臨邊之将尚未聞得賊釁隙挫其兇鋒是攻守皆未有休息之期而財用不為長久之計臣未見其可也四五十萬之人坐而仰食然關西之地物不加多關東所有莫能運致掊克細碎既以無益而罷之矣至於鬻官入粟下無應者改法㩁貨而商旅不行是四五十萬之人惟取足於西人而已西人何為而不困困而不起為盜者須水旱爾外為賊謀之所疲内遭水旱而多故天下之患可勝道哉夫關西之物不能加多則必通其漕運而致之漕運已通而關東之物不充則無得而西矣故臣以為通漕運盡地利權商賈三術並施則財用足而西人紓國力完而兵可以久以守以攻惟上所使夫小𤨏目前之利既不足為長久之謀非旦夕而可效故為長久而計者初若迂愚而可笑在必而行之則其利溥矣故臣區區不敢避迂愚之責請上便宜三事惟陛下裁擇其一曰通漕運臣聞今為西計者皆患漕運之不通臣以為但未求之耳今京師在汴漕運不西而人之習見者遂以為不能西不知秦漢隋唐其都在雍則天下之物皆可致之西也山川地形非有變易於古其路皆在昔人可行今人胡為而不可漢初嵗漕山東粟數十萬石是時運路未修其漕尚少其後武帝益修渭渠至漕百餘萬石隋文帝時㳂水為倉轉相運置而關東汾晉之粟皆至渭南運物最多其遺倉之迹徃往皆在然皆尚有三門之險自唐裴耀卿又尋隋迹於三門東西置倉開山十八里為陸運以避其險卒泝河而入渭當時嵗運不減二三百萬石其後劉晏遵耀卿之路悉漕江淮之米以實關西後世言能經財利而善漕運者耀卿與晏為首今江淮之米嵗入于汴者六百萬石誠能分給關西一二百萬石足矣今兵之食汴漕者出戍甚衆有司不惜百萬之粟分而及之其患者三門阻其中爾今宜浚治汴渠使嵗運不阻然後按求耀卿之迹不憚十許里陸運之勞則河漕通而物可致且紓關西之困使古無法今有可為尚當為之況昔人行之而未逺今人行之而豈難哉耀卿與晏初理漕時其得尚少至其末年所入十倍是可久行之法明矣此水運之利也臣聞漢髙祖之入秦不由東關而道南陽過酈析而入武關曹操等起兵誅董卓亦欲自南陽道丹析而入長安是時張濟又自長安出武關奔南陽則自古用兵往来之徑也臣嘗至南陽問其遺老云自鄧西北至永興六七百里今小商賈往往行之初漢髙入關其兵十萬夫能容十萬兵之路宜不甚狹而險也但自雒陽為都行者皆趨東關其路久而遂廢今能按求而通之則武昌漢陽郢復襄陽梁洋金商均房光化㳂漢之地十一二州之物皆可漕而頓之南陽自南陽為輕車人輦而遞之募置遞兵為十五六鋪則十餘州之物日日入關而不絶㳂漢之地山多美才近漢之民仰足而有餘以造舟車甚不難也前日陛下深恤有司之勤内賜禁錢數十萬以供西用而道路艱逺輦運逾年不能畢至至於軍装輸送多苦秋霖邊州已寒冬服尚滯於路其艱如此夫使州縣綱吏逺輸京師轉冒艱滯然後得西豈若較南陽之旁郡度其道里入于武關與至京師逺近等者與其尤近者皆使直輸于關西京師之用有不足則以禁帑出賜有司者代而充用其迂曲簡直利害較然矣此陸運之利也其二曰盡地利臣聞昔之畫財利者易為工今之言財利者難為術昔者之民賦稅而已故其不足則鑄山煑海㩁酒與茶征關市而筭舟車尚有可為之法以苟一時之用自漢魏迄今其法日増其取益細今取民之法盡矣昔者賦外之征以備有事之用今盡取民之法用於無事之時悉以冗費而糜之矣至卒然有事則無法可増然獨猶有可為者民作而輸官者已勞而游手之人方逸地之産物者耕不得代而不墾之土尚多是民有遺力地有遺利此可為也况歴視前世用兵者未嘗不先營田漢武帝時兵興用乏趙過為畎田人犂之法以足用趙充國攻西羌議者爭欲出擊而充國深思全勝之䇿能忍而待其弊至違詔罷兵而治屯田田於極邊以遊兵而防鈔寇則其理田不為易也猶勉為之後漢之時曹操屯兵許下強敵四面以今視之疑其旦夕戰爭而不暇然用棗祇韓浩之計建置田官募民而田近許之地嵗得榖百萬石其後郡國皆田積榖無數隋唐田制尤廣不可勝舉其勢艱而難田莫若充國迫急而不暇田莫如曹操然皆勉焉不以迂緩而不田者知地利之博而可以紓民勞也今天下之土不耕者多矣臣未能悉言謹舉其近者自京已西土之不闢者不知其數非土之瘠而棄也蓋人不勤農與夫役重而逃爾久廢之地其利數倍於營田今若督之使勤與免其役則願耕者衆矣臣聞鄉兵之不便於民議者方論之矣充兵之人遂棄農業託云教習聚而飲博取資其家不顧無有官吏不加禁父兄不敢詰家家自以為患也河東河北關西之鄉兵此猶有用若京東西者平居不足以備盜而水旱適足以為盜其尤可患者京西素貧之地非有山澤之饒民惟力農是仰而今三夫之家一人五夫之家三人為游手凡十八九州以少言之尚可四五萬人不耕而食是自相糜耗而重困也今誠能盡驅之使耕于棄地官貸其種嵗田之入與中分之如民之法募吏之習田者為田官優其課最而誘之則民願田者衆矣太宗皇帝時嘗貸陳蔡民錢使市牛而耕真宗皇帝時亦用耿望之言買牛湖南而治屯田今湖南之牛嵗賈于北者皆出京西若官為買之不難得也且鄉兵本農也籍而為兵遂棄其業今幸其去農未久尚可復驅還之田畝使不得羣逰而飲博以為父兄之患此民所願也一夫之力以逸而言任耕縵田一頃使四五萬人皆耕而久廢之田利又數倍則嵗穀不可勝數矣京西之分北有大河南至漢而西接關若又通其水陸之運所在積穀惟陛下詔有司而移用之耳其三曰權商賈臣聞秦廢王法啓兼并其上侵公利下刻細民為國之患久矣自漢以来嘗欲為法而抑奪之然不能也蓋為國者興利日繁兼并者趨利日巧至其甚也商賈坐而權國利其故非他由興利廣也夫興利廣則上難專必與下而共之然後通流而不滯然為今議者方欲奪商之利一歸於公上而專之故奪商之謀益深則為國之利益損前日有司屢變其法法每一變則一嵗之間所損數百萬議者不知利不可專欲專而反損但云變法之未當變而不巳其損愈多夫欲十分之利皆歸于公至其虧少十不得三不若與商共之常得其五也今為國之利多者茶與鹽耳茶自變法巳来商賈不復一嵗之失數年莫補所在積朽棄而焚之前日議者屢言三稅之法為便有司既已詳之矣今誠能復之使商賈有利而通行則上下濟矣解池之鹽積若山阜今宜暫下其價誘羣商而散之先為令曰三年將復舊價則貪利之商爭先而湊矣夫茶者生於山而無窮鹽者出於水而不竭賤而散之三年十未減其一二夫二物之所以貴者以能為國資錢幣爾今不散而積之是惜朽壤也夫何用哉夫大商之能蕃其貨者豈其銖銖躬自鬻於市哉必有販夫小賈就而分之販夫小賈無利則不為故大商不妬販夫之分其利者恃其貨博雖取利少貨行流速則積少而為多也今為大國者有無窮不竭之貨反妬大商之分其利寧使無用而積為朽壤何哉故大商之善為術者不惜其利而誘販夫大國之善為術者不惜其利而誘大商此與商賈共利取少而致多之術也若乃縣官自為鬻市之事此大商之不為臣謂行之難久者也誠能不較錙銖而思逺大則積朽之物散而錢幣通可不勞而用足矣臣愚不足以知時事若夫堅守以扞賊利則出而擾之凡小便宜願且委之邊將至於積穀與錢通其漕運不二三嵗而國力漸豐邊兵漸習賊銳漸挫而有隙可乘然後一舉而滅之此萬全之䇿也願陛下以其小者責將帥謀其大計而行之則天下幸甚歐陽文粹巻四欽定四庫全書歐陽文粹巻五宋陳亮編書準詔言事臣近準詔書許臣上書言事臣學識愚淺不能廣引深逺以明治亂之原謹採當今急務條為三弊五事以應詔書所求伏惟陛下裁擇臣聞自古王者之治天下雖有憂勤之心而不知致治之要則心愈勞而事愈乖雖有納諫之明而無力行之果斷則言愈多而聽愈惑故為人君者以細務而責人專大事而獨斷此致治之要術也納一言而可用雖衆說不得以沮之此力行之果斷也知此二者天下無難治矣伏見國家自大兵一動中外騷然陛下思社稷之安危念兵民之疲弊四五年來聖心憂勞可謂至矣然而兵日益老賊日益強併九州之力討一西戎小者尚無一人敢前今又北敵大者違盟而動其將何以禦之從來所患者四裔今四裔叛矣所惡者盜賊今盜賊起矣所憂者水旱今水旱作矣所賴者民力今民力困矣所須者財用今財用乏矣陛下之心日憂於一日天下之勢嵗危於一嵗此臣所謂用心雖勞不知求致治之要者也近年朝廷開發言路獻計之士不下數千然而事緒轉多枝梧不暇從前所採衆議紛紜至於臨事誰策可用此臣所謂聽言雖多不如力行之果斷者也伏思聖心所甚憂而當今所尚闕者不過曰無兵也無將也無財用也無禦戎之䇿也無可任之臣也此五者陛下憂其未有而臣謂今皆有之然陛下未得而用者未思其術也國家創業之初四方割據中國地狹兵民不多然尚能南取荆楚收偽唐定閩嶺西平兩蜀東下并潞北窺幽燕當時所用兵財將吏其數㡬何惟善用之故不覺其少何況今日承百年祖宗之業盡有天下之富強人衆物盛十倍國初故臣敢曰有兵有將有財用有禦戎之䇿有可任之臣然陛下皆不得而用者其故何哉由朝廷有三大弊故也何謂三弊一曰不慎號令二曰不明賞罰三曰不責功實此三弊因循於上則萬事弛慢廢壊於下臣聞號令者天子之威也賞罰者天子之權也若號令不信賞罰不當則天下不服故又須責臣下以功實然後號令不虚出而賞罰不濫行是以慎號令明賞罰責功實此三者帝王之竒術也自古人君英雄如漢武帝聰明如唐太宗皆知用此三術而自執威權之柄故所求無不得所欲皆如意漢武好用兵則誅滅四夷立功萬里以快其心欲求將則有衛霍之材以供其指使欲得賢士則有公孫董汲之徒以稱其意唐太宗好用兵則誅突厥服遼東威振夷狄以逞其志欲求將則有李靖李勣之徒入其駕馭欲得賢士則有房杜之輩在其左右此二帝者可謂所求無不得所欲皆如意無他術也惟能自執威權之柄耳伏惟陛下以聖明之姿超出二帝又盡有漢唐之天下然而欲禦邊則常患無兵欲破賊則常患無將欲贍軍則常患無財用欲威服四夷則常患無䇿欲任使賢材則常患無人是所求皆不得所欲皆不如意其故無他由不用威權之術也自古帝王或為強臣所制或為小人所惑則威權不得出於巳今朝無強臣之患旁無小人偏任之溺内外臣庶尊陛下如天愛陛下如父傾耳延首顧陛下之所為然何所憚而不為乎若一日赫然執威權以臨之則萬事皆辦何患五者之無奈何為三弊之因循而一事之不集臣請言三弊夫言多變則不信令頻改則難從今出令之初不加詳審行之未久尋又更張以不信之言行難從之令故每有處置之事州縣知朝廷未是一定之命則官吏或相謂曰且未要行不久必須更改或曰備禮行下略與應破指揮旦夕之間果然又變至於將吏更易道路疲於送迎符牒縱横上下莫能遵守中外臣庶或聞而歎息或聞而竊笑歎息者有憂天下之心竊笑者有輕朝廷之意號令如此欲威天下其可得乎此不慎號令之弊也用人之術不過賞罰然賞及無功則恩不足勸罰失有罪則威無所懼雖有人不可用矣太祖時王全斌破蜀而歸功不細矣犯法一貶十年不問是時方討江南故黜全斌與諸將立法太祖神武英斷所以能平定天下者其賞罰之法皆如此也昨關西用兵四五年矣大將以無功罷者依舊居官軍中見無功者不妨得好官則諸將誰肯立功矣禆將畏懦逗留者皆當斬罪或暫貶而尋遷或不貶而依舊軍中見有罪者不誅則諸將誰肯用命矣所謂賞不足勸威無所懼賞罰如此而欲用人其可得乎此不明賞罰之弊也自兵動以來處置之事不少然多有名而無實臣請略言其一二則其他可知數年以來㸃兵不絶諸路之民半為兵矣其間老弱病患短小怯懦者不可勝數是有㸃兵之虚名而無得兵之實數也新集之兵所在教習追呼上下民不安居主教者非將領之材所教者無旗鼓之節往来州縣愁嘆嗷嗷既多是老病小怯之人又無訓齊精練之法此有教兵之虚名而無訓兵之實藝也諸路州軍分造器械工作之際已勞民力輦運般送又苦道塗然而鐵刃不剛筋膠不固長短大小多不中度造作之所但務充數而速了不計所用之不堪經歴官司又無檢責此有器械之虚名而無器械之實用也以草草之法教老怯之兵執鈍折不堪之器械百戰百敗理在不疑臨事而悟何可及乎故事無大小悉皆鹵莽則不責功實之弊也臣故曰三弊因循於上則萬事弛慢廢壊於下萬事不可盡言臣請言大者五事其一曰兵臣聞攻人以謀不以力用兵鬭智不鬭多前代用兵之人多者常敗少者常勝漢王尋等以百萬之兵遇光武九千人而敗是多者敗而少者勝也苻堅以百萬之兵遇東晉二三萬人而敗是多者敗而少者勝也曹操以三十萬青州兵大敗於吕布退而歸許復以二萬人破袁紹十四五萬是用兵多則敗少則勝之明驗也况於四裔尤難以力爭只可以計取李靖破突厥於定襄只用三千人其後破頡利於隂山亦不過一萬蓋兵不在多能以計取爾故善用兵者以少為多不善用者雖多而愈少也為今計者添兵則耗國減兵則破賊今㳂邊之兵不下七八十萬可謂多矣然訓練不精又有老弱虚數則十人不當一人是七八十萬之兵不當七八萬人之用加以軍無統制分散支離分多為寡兵法所忌此所謂不善用兵者雖多而愈少故常戰而常敗也臣願陛下赫然奮威勑勵諸將精加訓練去其老弱七八十萬中可得五十萬數古人用兵以一當百今既未能但得以一當十則五十萬精兵可當五百萬兵之用此所謂善用兵者以少而為多古人所以少而常勝者以此也今不思實效但務添多耗國耗民積以年嵗賊雖不至天下巳困矣此一事也其二曰將臣又聞古語曰將相無種故或出於奴僕或出於軍卒或出於盜賊惟能不次而用之乃為名將耳國家求將之意雖勞選將之路太狹今詔近臣舉將而限以資品則英豪之士在下位者不可得矣試將材者限以弓馬一夫之勇則智略萬人之敵皆遺之矣山林竒傑之士召而至者以其貧賤而薄之不過與一主簿借職使其怏怏而去則古之屠釣飯牛之傑皆激怒而失之矣至於無人可用則寧用龍鍾跛躄庸懦暗劣之徒皆授之兵柄天下三尺童子皆為朝廷危之前日澶淵之卒㡬為國家生事此可見也議者不知取將之無術但云當今之無將臣願陛下革去舊弊奮然精求有賢豪之士不須限以下位有智略之人不必試以弓馬有山林之傑不可薄其貧賤惟陛下能以非常之禮待人人臣亦將以非常之效報國此二事也其三曰財用臣又聞善治病者必醫其受病之處善救弊者必尋其起弊之源今天下財用困乏其弊安在起於用兵而費大故也漢武好窮兵用盡累世之財當時勒兵單于臺不過十八萬尚能困國力况未若今日七八十萬連四五年而不罷所以罄天地之所生竭萬民之膏血而用不足也今雖有智者物不能増而計無所出矣惟有減冗卒之虚費練精兵而速戰功成兵罷自然足矣今兵有可減之理無人敢當其事賊有速擊之便無將敢奮其勇後時敗事徒耗國而耗民此三事也其四曰禦戎之䇿臣又聞兵法曰上兵伐謀其次伐交北敵與朝廷通好僅四十年不敢妄動今一旦發其狂謀者其意何在蓋見中國頻為元昊所敗故敢啓其貪心伺隙而動爾今若勑勵諸將選兵秣馬疾入西界但能痛敗昊賊一陣則吾軍威大振而敵計沮矣此所謂上兵伐謀者也今詗事者皆知北敵與西賊通謀欲倂二國之力窺我河北陜西今若我能先擊敗其一國則敵勢減半不能獨舉此兵法所謂伐交者也元昊地狹賊兵不多向來攻我傳聞北敵常有助兵今若敵中自有㸃集之謀而元昊驟然被擊必求助於北敵北敵分兵助昊則可牽其南寇之力若不助昊則二國有隙自相疑貳此亦伐交之䇿也假令二國剋期分路來寇我能先期大舉則元昊倉皇自救不暇豈能與北敵相為表裏是破其素定之約乖其剋日之期此兵法所謂親而離之者亦伐交之䇿也元昊叛逆以來幸而屢勝常有輕視諸將之心今又見朝廷北憂戎虜方經營於河朔必謂我師不能西出今乘其驕怠正是疾驅急擊之時此兵法所謂出其不意者此取勝之上䇿也前年西將有請出攻者當時賊氣方盛我兵未練朝廷尚計其出師况今元昊有可攻之勢此不可失之時彼方幸吾憂河北而不虞我能西征出其不意此可攻之勢也自四路分帥今巳半年訓練恩信兵已可用故近日屢奏小㨗是我師漸振賊氣漸衂此可攻之勢也苟失此時而使二敵先來則吾無䇿矣臣願陛下詔執事之臣熟議而行之此四事也其五曰可任之臣臣又聞仲尼曰十室之邑必有忠信况今文武列職徧於天下其間豈無材智之臣而陛下總治萬幾之大既不暇盡識其人故不能躬自進賢而退不肖執政大臣動拘舊例又不敢進賢而退不肖審官吏部三班之職但掌文簿差除而巳又不敢越次進賢而退不肖是上自天子下至有司無一人得進賢而退不肖者所以賢愚混雜僥倖相容三載一遷更無旌别平居無事惟患太多而差遣不行一旦臨事要人常患乏人使用自古任官之法無如今日之繆也今議者或謂舉主轉官為進賢犯罪黜責為退不肖此不知其弊之深也大凡善惡之人各以類聚故守亷慎者各舉清幹之人有贓汚者各舉貪濁之人好徇私者各舉請求之人性庸暗者各舉不材之人朝廷不問是非但見舉主數足便與改官則清幹者進矣貪濁者亦進矣請求者亦進矣不材者亦進矣混淆如此便可為進賢之法乎方今黜責官吏豈有澄清糾舉之術哉惟犯贓之人因民論訴者乃能黜之耳夫能舞弄文法而求財賄者亦强黠之吏政事必由已出故雖誅剥豪民尚或不及貧弱至於不材之人不能主事衆胥羣吏共為姦欺則民無貧富一時受弊以此而言則贓吏與不材之人為害等耳今贓吏因自敗者乃加黜責十不去其一二至於不材之人上下共知而不問寛緩容姦其弊如此便可為退不肖之法乎賢不肖既無别則宜乎設官雖多而無人可用也臣願陛下明賞罰責功實則材皆列於陛下之前矣臣故曰五者皆有然陛下不得而用者為有弊也三弊五事臣既已詳言之矣惟陛下擇之天下之務不過此也方今天文變於上地理逆於下人心怨於内四夷攻於外事勢如此矣非是陛下遲疑寛緩之時惟願為社稷生民留意歐陽文粹巻五欽定四庫全書歐陽文粹巻六宋陳亮編書辨杜韓范富臣聞士不忘身不為忠言不逆耳不為諫故臣不避羣邪切齒之禍敢冒一人難犯之顔惟賴聖慈幸加省察臣伏見杜衍韓琦范仲淹富弼等皆是陛下素所委任之臣一旦相繼而罷天下之士皆素知其可用之賢而不聞其可罷之罪臣職雖在外事不審知然臣竊見自古小人讒害忠賢其識不逺欲廣陷良善則不過指為朋黨欲摇動大臣則必須誣以専權其故何也夫去一善人而衆善人尚在則未為小人之利欲盡去之則善人少過難為一二求瑕惟指以為朋黨則可一時盡逐至如大臣已被知遇而䝉信任者則不可以他事動摇惟有專權是人主之所惡故須此說方可傾之臣料杜衍等四人各無大過而一時盡逐富弼與仲淹委任尤深而忽遭離間必有朋黨専權之說上惑聖聦臣請詳言之昔年仲淹初以忠言讜論聞於中外天下賢士爭相稱慕當時姦臣誣作朋黨猶難辨明自近日陛下擢此數人並在兩府察其臨事可以辨也盖杜衍為人清慎而謹守規矩仲淹則恢廓自信而不疑韓琦則純正而質直富弼則明敏而果銳四人為性既各不同雖皆歸於盡忠而其所見各異故於議事多不相從至如杜衍欲深罪滕宗諒仲淹力爭而寛之仲淹謂契丹必攻河東請急修邉備富弼料九事力言契丹必不來至如尹洙亦號仲淹之黨及爭水洛城事韓琦則是尹洙而非劉滬仲淹則是劉滬而非尹洙此數事尤彰著陛下素已知者此四人者可謂公正之賢也平日閒居則相稱美之不暇為國議事則公言廷爭而無私以此而言臣見杜衍等真得漢史所謂忠臣有不和之節而小人讒為朋黨可為誣矣臣聞有國之權誠非臣下之得專也臣切思仲淹等自入兩府已來不見其專權之迹而但見其善避權也夫權得名位則可行故行權之臣必貪名位自陛下召琦與仲淹於陜西琦等讓至五六陛下亦五六召之至如富弼三命學士兩命樞宻副使毎一命未甞不懇讓者愈切而陛下用之愈堅故天下之人所共知臣但見避讓太繁不見其專權貪位也及陛下堅不許辭方敢受命然猶未敢别有所為陛下見其作事乃開天章召而賜坐授以紙筆使其條事然衆人避讓不敢下筆弼等亦不敢獨有所述因此又煩聖慈出手詔指定姓名專責其條列大事而行之弼等遲回近及一月方敢略條數事仲淹老練世事必知凡百難猛更張故其所陳志在逺大而多若迂緩但欲漸而行之以久兾皆有效弼性雖銳然亦不敢自出意見但舉祖宗故事請陛下擇而行之自古君臣相得一言道合遇事而行更無推避弼等䝉陛下堅意委任督責丁寧而猶遲緩自疑作事不果然小人巧譛而曰專權者豈不誣哉至如兩路宣撫國朝累遣大臣况自中國之威近年不振故元昊叛逆一方而勞困及扵天下北敵乘釁違盟而動其書辭侮慢至有責祖宗之言陛下憤耻雖深但以邉防無備未可與争屈志買和莫大之辱弼等見中國累年侵陵之患感陛下不次進用之恩故各自請行力思雪耻㳂山傍海不憚勤勞欲使武備再修國威復振臣見弼等用心本欲尊陛下威權以禦四夷未見其侵權而作過也伏惟陛下睿哲聰明有知人之聖臣下能否洞達不遺故于千官百辟之中親選得此數人一旦罷去而使羣邪相賀于内四夷相賀于外此臣所以為陛下惜也伏惟陛下聖徳仁慈保全忠善退去之際恩禮各優今仲淹四路之任亦不輕矣願陛下拒絶羣謗委信不疑使盡其所為猶有禆補方今西北二虜交爭未已正是天與陛下經營之時而弼與琦豈可置之閒處伏望早辨讒巧特加圖任則不勝幸甚臣自前歲召入諌院十月之内七受聖恩而致身兩制常思榮寵至深未知報効之所羣邪爭進讒巧而正士繼去朝廷乃臣忘身報國之時豈可緘言而避罪敢竭愚瞽惟陛下擇之上政府脩不佞少以文章言語自任而頃忝備諌諍之臣得與朝廷論議中外多事天子急於聽納之時不以為愚妄加奬擢及得寵太過受恩太深則自視區區素所任者不足以稱萬一故方欲勉强以伸報効而䝉相公不以為不才而擇天下諸路中最重之地以授之而責其報効當此之時自宜如何可以塞責及臨職以來近將半歲齷齪自守未知所為非敢怠也誠有說焉至于山川險易城塞屯防邊陲守備等事皆河朔之大者朝廷已委樞宻富公經畫之矣而本司之事自不為少凡自河以北州府軍縣一百八十有七城主客之民七十萬五千七百户官吏在職者一千二百餘貟廂禁軍馬義勇民兵四十七萬七千人騎歲支糧錢帛二千四百四十五萬而非常之用不與焉其間事目之節利害之源非詳求而審察之不能得其要前張昷之等急於舉職公家之利知無不為其興利除害便於事者極多而時有失於不審更改過繁而失於苛碎者故自繼職以來遵其所長戒其所短凡所關利害者慎之重之未敢輕議今半歲矣官吏之能否公私之弊病粗以得其十七八而又先求其事渉苛碎紛繁而下切患之有司自可改復不煩朝廷處分者先已次第行之矣乃暇及於其他然事繫利害有司不敢自决而必上聞者其類甚多初則未敢以煩朝聽者不惟自疑於不審誠慮朝廷鑒昷之等前失不能信其說而從之今慎之久矣得之詳矣苟有所請實有望于見信而從之也凡河北之事其大者朝廷已委富公矣其外大要不過五六其不可為者一其可為者四五爾雖皆有司之事然朝廷主張之則能行不主張之則亦不能為也自古邦國財産之利必出山澤故傳曰山海天地之藏也自兩漢以來摘山煮海之利必歸公上今天下諸路山澤悉以㩁之無遺利矣獨河北一方兵民所聚最為重地而東負大海西有髙山此財利之産天地之藏而主計之利皆不得取焉祖宗時哀閔河北之民歲為敵國所困盡以海鹽之利乞與疲民此國家恩徳在民已深而不可奪者也西山之長數百里其産金銀銅鐡丹砂之類無所不有至寶久伏于下而光氣苖礦徃徃溢發而出地官禁之不許取捨此惟有平地爾河北之地四方不及而㳂邉廣信安肅順安雄霸之間盡為塘民不得耕者十八九澶衛徳博通利濵棣大名之界東與南嵗嵗河災民不得耕者十五六今年大豐秋稅尚放一百萬石滄瀛深兾邢洺大名之界西與北鹹鹵大小鹽池民不得耕者十三四又有泊淀不毛監馬棚牧與夫貧乏之逃而荒棄者不可勝數大山大海之利既不可取而平地堪出財賦者又有限而不取其助者不過酒稅之入爾其入有數而用度無常也故雖研桑羊之心計捨山澤與平地不能為之及其用有不足則不過上干朝廷乞銀絹而下殃疲民號為變轉爾此所謂不可為者也然若能擇官吏以辦職事裁僥倖以減浮費謹量材精器械以助武備因貴賤通漕轉而移有無如此之類苟能為之尚足以禆萬一而皆補弊病理須更改事目委曲非書可殫敢具其大綱列于别紙伏望特加省覽察其利害或其所說不至大乖戾望少信而從之以畢其所為若夫盡其為而卒無成焉則不待朝廷之責而自當劾去若幸而有以禆萬一則何幸如之伏惟聰明少賜裁擇上范司諫前月中得進奏吏報云自陳州召至闕拜司諌即欲為一書以賀多事怱卒未能也司諌七品官爾扵執事得之不為喜而獨區區欲一賀者誠以諫官者天下之得失一時之公議繫焉今世之官自九卿百執事外至一郡縣吏非無貴官大職可以行其道也然縣越其封郡逾其境雖賢守長不得行以其有守也吏部之官不得理兵部鴻臚之卿不得理光禄以其有司也若天下之失得生民之利害社稷之大計惟所見聞而不繫職司者獨宰相可行之諫官可言之爾故士學古懐道者仕於時不得為宰相必為諌官諌官雖卑與宰相等天子曰不可宰相曰可天子曰然宰相曰不然坐乎廟堂之上與天子相可否者宰相也天子曰是諌官曰非天子曰必行諌官曰必不可行立殿陛之前與天子争是非者諌官也宰相尊行其道諌官卑行其言言行道亦行也九卿百司郡縣之吏守一職者任一職之責宰相諌官繋天下之事亦任天下之責然宰相九卿而下失職者受責於有司諌官之失職也取譏于君子有司之法行乎一時君子之譏著之簡冊而昭明垂之百世而不泯甚可懼也夫七品之官任天下之責懼百世之譏豈不重耶非材且賢者不能為也近執事始被召于陳州洛之士大夫相與語曰我識范君知其材也其來不為御史必為諌官及命下果然則又相與語曰我識范君知其賢也他日聞有立天子陛下直辭正色面争廷論者非他人必范君也拜命以來翹首企足竚乎有聞而卒未也竊惑之豈洛之士大夫能料於前而不能料於後耶將執事有待而為也昔韓退之作争臣論以譏陽城不能極諌卒以諫顯人皆謂城之不諌盖有待而然退之不識其意而妄譏脩獨以為不然當退之作論時城為諫議大夫已五年後又二年始庭論陸贄及沮裴延齡作相欲裂其麻纔兩事爾當徳宗時可謂多事矣授受失宜叛將强臣羅列天下又多猜忌進任小人於此之時豈無一事可言而須七年耶當時之事豈無急於沮延齡論陸贄兩事也謂宜朝拜官而夕奏䟽也幸而城為諫官七年適遇延齡陸贄事一諌而罷以塞其責向使止五年六年而遂遷司業是終無一言而去也何所取哉今之居官者率三歲而一遷或一二歲甚者半歲而遷也此又非更可以待乎七年也今天子躬親庶政化理清明雖為無事然自千里詔執事而拜是官者豈不欲聞正議而樂讜言乎然今未聞有所言說使天下知朝廷有正士而彰吾君有納諌之明也夫布衣韋帯之士窮居草茅坐誦書史常恨不見用及用也又曰彼非我職不敢言或曰我位猶卑不得言矣又曰我有待是終無一人言也可不惜哉伏惟執事思天子所以見用之意懼君子百世之譏一陳昌言以塞重望且解洛之士大夫之惑則幸甚幸甚與髙司諌某年十七時家隨州見天聖二年進士及第牓始識足下姓名是時予年少未與人接又居逺方但聞今宋舍人兄弟與葉道卿鄭天休數人者以文學大有名號稱得人而足下厠其間獨無卓卓可道說者予固疑足下不知何如人也其後更十一年予再至京師足下已為御史裏行然猶未暇一識足下之面但時時於予友尹師魯問足下之賢否而師魯說足下正直有學問君子人也予猶疑之夫正直者不可屈曲有學問者必能辨是非以不可屈曲之節有能辨是非之明又為言事之官而俯仰黙黙無異衆人是果賢者耶此不得使予之不疑也自足下為諫官來始得相識侃然正色論前世事歴歴可聽褒貶是非無一謬說噫持此辨以示人孰不愛之雖予亦疑足下真君子也是予自聞足下之名及相識凡十有四年而三疑之今者推其實迹而較之然後決知足下非君子也前日范希文貶官後與足下相見於安道家足下詆誚希文為人予始聞之疑是戲言及見師魯亦說足下深非希文所為然後其疑遂决希文平生剛正好學通古今其立朝有本末天下所共知今又以觸宰相得罪足下既不能為辨其非辜又畏有識者之責已遂隨而詆之以為當黜是可怪也夫人之性剛果懦軟禀之於天不可勉强雖聖人亦不以不能責人之必能今足下家有老母身惜官位懼飢寒而顧利禄不敢一忤宰相以近刑禍此乃庸人之常情不過作一不才諌官爾雖朝廷君子亦將閔足下之不能而不責以必能也今乃不然反昂然自得了無媿畏便毁其賢以為當黜庶乎飾已不言之過夫力所不敢為乃愚者之不逮以智文其過此君子之賊也且希文果不賢耶自三四年來從大理寺丞至前行員外郎作待制日日備顧問今班行中無與比者是天子驟用不賢之人夫使天子待不賢以為賢是聰明有所未盡足下身為司諌乃耳目之官當其驟用時何不一為天子辨其不賢反黙黙無一語待其自敗然後隨而非之若果賢耶則今日天子與宰相以忤意逐賢人足下不得不言是則足下以希文為賢亦不免責以為不賢亦不免責大抵罪在黙黙爾昔漢殺蕭望之與王章計其當時之議必不肯明言殺賢者也必以石顯王鳳為忠臣望之與章為不賢而被罪也今足下視石顯王鳳果忠邪望之與章果不賢耶當時亦有諌臣必不肯自言畏禍而不諫亦必曰當誅而不足諫也今足下視之果當誅耶是直可欺當時之人而不可欺後世也今足下又欲欺今人而不懼後世之不可欺耶况今之人未可欺也伏以今皇帝即位已來進用賢臣容納言論如曹修古劉越雖沒猶被褒稱今希文與孔道輔皆自諌諍擢用足下幸生此時遇納諌之聖主如此猶不敢一言何也前日又聞御史臺牓朝堂戒百官不得越職言事是可言者惟諌臣爾若足下又遂不言是天下無得言者也足下在其位而不言便當去之無妨他人之堪其任者也昨日安道貶官師魯待罪足下猶能以面目見士大夫出入朝中稱諌官是足下不復知人間有羞耻事爾所可惜者聖朝有事諫官不言而使他人言之書在史冊他日為朝廷羞者足下也春秋之法責賢者備今某區區猶望足下之能一言者不忍便絶足下而以不賢者責也若猶以為希文不賢而當逐則予今所言如此乃是朋邪之人爾願足下直携此書于朝使正予罪而誅之使天下皆釋然知希文之當逐亦諫臣之一效也前日足下在安道家召予徃論希文之事時坐有他客不能盡所懐故輒布區區伏惟幸察歐陽文粹巻六欽定四庫全書歐陽文粹巻七宋陳亮編書上杜中丞脩前伏見舉南京留守推官石介為主簿近者聞介以上書論赦被罷而臺中因舉他吏代介者主簿於臺職最卑介一賤士也用不用當否未足害政然可惜者中丞之舉動也介為人剛果有氣節力學喜辯是非真好義之士也始執事舉其材議者咸曰知人之明今聞其罷皆謂赦乃天子已行之令非踈賤當有說以此罪介曰當罷修獨以為不然然不知介果指何事而言也傳者皆云介之所論謂朱梁劉漢不當求其後裔爾若止此一事則介不為過也然又不知執事以介為是為非也若隨以為非是大不可也且主簿於臺中非言事之官然大抵居臺中者必以正直剛明不畏避為稱職今介足未履臺門之閾而已因言事見罷真可謂正直剛明不畏避矣度介之才不止為主簿直可任御史也是執事有知人之明而介不負執事之知矣脩嘗聞長老說趙中令相太祖皇帝也嘗為某事擇官中令列二臣姓名以進太祖不肯用它日又問復以進又不用它日又問復以進太祖大怒裂其奏擲殿陛上中令色不動挿笏帶間徐拾碎紙袖歸中書它日又問則補綴之復以進太祖大悟終用二臣彼之敢爾者盖先審知其人之可用然後果而不可易也今執事之舉介也亦先審知其可舉邪是偶舉之邪若知而舉則不可遽止若偶舉之猶宜一請介之所言辯其是非而後已若介雖迕上而言是也當助以辯若其言非也猶宜曰所舉者為主簿爾非言事也待為主簿不任職則可罷請以此辭焉可也且中丞為天子司直之臣上雖好之其人不肖則當彈而去之上雖惡之其人賢則當舉而申之非謂隨時好惡而髙下者也今備位之臣百千邪者正者其糺舉一信於臺臣而執事始舉介曰能朝廷信而將用之及以為不能則亦曰不能是執事自信猶不果若遂言它事何敢望天子之取信於執事哉故曰主簿雖卑介雖賤士其可惜者中丞之舉動也况今斥介而他舉必亦擇賢而舉也夫賢者固好辯若舉而入臺又有言則又斥而它舉乎如此則必得愚闇懦黙者而後止也伏惟執事如欲舉愚者則豈敢復云若將舉賢也願無易介而它取也今世之官兼御史者例不與臺事故敢布狂言竊獻門下伏惟幸察焉荅王相公所遣使二十一日至許州獲賜書一通伏讀周復且慙且悸脩幸得備下吏承寵光日趨走于前切慕古人堂下一言之獻思有所陳而恨愚無識不足自效徒抱區區之心者有日矣昨以初去府輒因奏記陳已踈賤得䝉大君子休徳之幸以為離去眷戀之辭既有次第臨治以來施政之善者顧寮吏宜有助而闇懦獨無能之過以為謝因又妄思一言之獻以畢曩時區區之心以為忠懇又輒賛徳美願廣功業益休問以為禱其誠雖勤其言狂惑猶即蓍龜之神而再三黷宜其拒以不應伏䝉相公不即棄絶猶辱以書條陳曉諭以為寵荅其為賜也厚矣然伏讀求繹似有未察其誠者敢一終其說以逃責焉某聞古之為政者必視年之豐凶年凶則節國用振民窮姦盗生爭訟多而其政繁年豐民樂然後休息而簡安之以復其常此善為政者之術而禮典之所載也凡某前所陳者亦不過如是而巳其意謂乘凶年之後災沴消息風雨既時耕種既得常平之粟既出而民有食關西之運既重至而軍不乏不旱不蝗下民樂利天子不憂慮能如是然後務大體簡細事而巳豈有直以鎮俗救民愁無為置軍食之說邪伏惟詳而察之昔者孔子嘗為委吏必曰稱其職而已盖苟守其官不敢慢其事而思其他伏惟相公所賜之書有居官不出位之言有以見君子用心也然某之所陳非謂略一邦之小而不為須四海之廣而後施以棄職而越思也盖願乎進徳廣業思以致君而及天下不以一邦而止既禱且勸之辭也噫士之至賤敢以言干其上者有三焉不量輕重之勢不度貴賤之位必争以理而後止者此直士也䝉徳思報不計善否務罄其誠而言者此知義之士也其言乖繆不合道理問不及而自僣者此狂士也然直士之言雖逆意宜思而擇報徳之言雖未善原其心之所來宜容而納狂者之言既狂矣宜不足與之辯某士之賤者敢有干而云者於斯三者有其二焉伏惟相公擇之納之不足與之辨而絶之惟所賜焉回丁判官修之得夷陵也天子以有罪而不忍即誅與之一邑而告以訓曰徃字吾民而無重前悔故其受命也始懼而後喜自謂曰幸而謂夷陵之不幸也夫有罪而猶得邑又撫安之曰無重前悔是以自幸也昔春秋時鄭詹自齊逃來傳者曰佞人來矣佞人來矣此不欲佞人入其邦而惡其來甚之之辭也修之是行也意謂夷陵之官相與語於府吏相與語於家民相與語於道皆曰罪人來矣凡夷陵之人莫不惡之而不欲入其邦若魯國之惡鄭詹來者故曰夷陵不幸也及舟次江陵之建寧縣人來自夷陵首䝉示書一通言文意勤不徒不惡之而又加以厚禮出其意料之外不勝甚喜而且有不自遂之心焉夫人有厚已而自如者恃其中有所以當之而不愧也如修之愚少無師傳而學出已見未一發其藴忽發焉果輒得罪是其學不本實而其中空虚無有而然也今猶未獲一見君子而先辱以書待之厚意以空虛之質當甚厚之意竊懼既見而不若所待徒重媿爾且為政者之懲有罪也若不鞭膚刑肉以痛切其身則必擇惡地而斥之使其奔走顚躓窘苦左山右壑前虺虎而後蒺藜動不逢偶吉而輒竒凶其狀可為閔笑所以深困辱之者欲其知自悔而改為善也此亦為政者之仁也故修之得罪也與之一邑使載其老母寡妹浮五千五百里之江湖冒大熱而履深險一有風波之危則叫號神明以乞須臾之命幸至其所則折身下首以事上官吏人連呼姓名喝出使拜起則趨而走設有大㑹則坐之壁下使與州校役人為等伍得一食未徹爼而先走出上官遇之喜怒訶詰嘗斂手慄股以伺顔色兾一語之温和不可得所以困辱之如此者亦欲其能自悔咎而改為善也故修之來也惟困辱之是期今乃不然獨䝉加以厚禮而不以有罪困辱之使不窮厄而得其所為以無重悔如前訓可謂幸矣然懼其頑心而不知自改也夫士窮莫不欲人之閔巳然非有深仁厚義君子之閔矣則又懼且慙焉謹因弓手還敢布所懐不勝區區伏惟幸察與張秀才一前日辱以詩賦雜文啟事為贄披讀三四不能輒休足下家籍河中為郷進士精學勵行甞已選於里升於府而試於有司矣誠可謂彼邦之秀者歟然士之居也遊必有友學必有師其鄉必有先生長者府縣必有賢守長佐吏彼能為足下稱才而述美者宜不少矣今乃越數百里犯風霜干大國望官府下首於閽謁者以道姓名趨走拜伏於人之階廡間何其勤勞乎豈由心負其所有而思以發之邪將顧視其鄉之狹陋不足自廣而謂夫大國多賢士君子可以奮揚而光逺之耶則足下之來也其志豈近而求豈小耶得非磨光濯色計之熟卜之吉而後勇決以來耶今市之門旦而啟商者趨焉賈者坐焉持寶而欲價者之焉齎金而求寶者亦之焉閒民無資攘臂以逰者亦之焉洛陽天下之大市也來而欲價者有矣坐而為之輕重者有矣予居其間其官位學行無動人也是非可否不足取信也其亦無資而攘臂以遊者也今足下之來試其價既就於可以輕重者矣而反以及予夫以無資者當求價之責雖知貪於所得而不知有以為價也故辱賜以來且慙且喜既不能塞所求以報厚意姑道此以為謝與張秀才二前日去後復取前所貺古今雜文十數篇反復讀之若大節賦樂古太古曲等篇言尤髙而志極大尋足下之意豈非閔世病俗究古明道欲㧞今以復之古而剪剥齊整凡今之紛殽駮冗者歟然後益知足下之好學甚有志者也然而述三皇太古之道捨近取逺務髙言而鮮事實此少過也君子之於學也務為道為道必求知古知古明道而後履之以身施之於事而又見於文章而發之以信後世其道周公孔子孟子之徒常履而行之者是也其文章則六經所載至今而取信者是也其道易知而可法其言易明而可行及誕者言之乃以混䝉虚無為道洪荒廣略為古其道難法其言難行孔子之言道曰道不逺人中庸則曰率性之謂道又曰可離非道也春秋之為書也以成隠讓而不正之傳者曰春秋信道不信邪謂隠未能蹈道齊侯遷衛書城楚丘與其仁不與其專封傳者曰仁不勝道凡此所謂道者乃聖人之道也此履之於身施之于事而可得者也豈如誕者之言者耶堯禹之書皆曰若稽古傅說曰事不師古匪說攸聞仲尼曰吾好古敏以求之者凡此謂古者其事乃君臣上下禮樂刑法之事又豈如誕者之言者耶此君子之所學也夫所謂捨近而取逺云者孔子曰生周之世去堯舜逺孰與今去堯舜逺也孔子刪書斷自堯典而弗道其前其所謂學則曰祖述堯舜如孔子之聖且勤而弗道其前者豈不能耶蓋以其漸逺而難彰不可以信後世也今生於孔子之絶後而反欲求堯舜之已前世所謂務髙言而鮮事實者也唐虞之道為百王首仲尼之歎曰蕩蕩乎謂髙深閎大而不可名也及夫二典述之炳然使後世尊崇仰望不可及其嚴若天然則書之言豈不髙耶然其事不過於親九族平百姓憂水患問臣下誰可任以女妻舜及祀山川見諸侯齊律度謹權衡使臣下誅放四罪而已孔子之後惟孟子最知道然其言不過于教人樹桑麻畜雞豚以為養生送死為王道之本夫二典之文豈不為文孟子之言道豈不為道而其事乃世人之甚易知而近者盖切於事實而已今學者不探本之乃樂誕者之言思混沌於古初以無形為至道者無有髙下逺近使賢者能之愚者可勉而至無過不及而一本乎大中故能亘萬世可行而不變也今以為不足為而務髙逺之為勝以廣誕者無用之說是非學者之所盡心也宜少下其髙而近其逺以及乎中則庶乎至矣凡僕之所論者皆陳言淺語如足下之多聞博學不宜為足下道之也然某之所以云者本欲損足下髙逺而俯就之則安敢務為竒言以自髙邪幸足下少思焉荅李詡一人至辱書及性詮三篇曰以質其果是夫自信篤者無所待於人有質於人者自疑者也今吾子自謂夫子與孟荀揚韓復生不能奪吾言其可謂自信不疑者矣而返以質於脩使脩有過於夫子者乃可為吾子辯况脩未及孟荀揚韓之一二也脩非知道者好學而未至者也世無師久矣尚頼朋友切磋之益苟不自滿而中止庻幾終身而有成固常樂與學者論議徃來非敢以益於人蓋求益于人者也况如吾子之文章論議豈易得哉固樂為吾子辨也苟尚有所疑敢不盡其所學以告既吾子之自信如是雖夫子不能奪使脩何所說焉人還索書未知所荅慚惕慚惕荅李詡二前辱示書及性詮三篇見吾子好學善辯而文能盡其意之詳今世之言性者多矣有所不及也故思與吾子卒其說修患世之學者多言性故常為說曰夫性非學者之所急而聖人之所罕言也易六十四卦不言性其言者動静得失吉凶之常理也春秋二百四十二年不言性其言者善惡是非之實録也詩三百五篇不言性其言者政教興衰之美刺也書五十九篇不言性其言者堯舜三代之治亂也禮樂之書雖不完而雜出於諸儒之記然其大要治國修身之法也六經之所載皆人事之切於世者是以言之甚詳至於性也百不一二言之或因言而及焉非為性而言也故雖言而不究予之所謂不言者非謂絶而無言盖其言者鮮而又不主於性而言也論語所載七十二子之問於孔子者問孝問忠問仁義問禮樂問修身問為政問朋友問鬼神者有矣未嘗有問性者孔子之告其弟子者凡數千言其及於性者一言而已予故曰非學者之所急而聖人之罕言也書曰習與性成語曰性相近習相逺者戒人慎所習而言也中庸曰天命之謂性率性之謂道者明性無常必有以率之也樂記亦曰感物而動性之欲者明物之感人無不至也然終不言性果善果惡但戒人慎所習與所感而動與所以率之者爾予故曰因言以及之而不究也修少好學知學之難凡所謂六經之所載七十二子之所問者學之終身有不能逹者矣於其所逹行之終身有不能至者矣以予之汲汲於此而不暇乎其他因以知七十二子亦以是汲汲而不暇也又以知聖人所以教人垂世亦皇皇而不暇也今之學者於古聖賢所皇皇汲汲者學之行之或未至其一二而好為性說以窮聖賢之所罕言而不究者執後儒之偏說事無用之空言此予之所不暇也或有問曰性果不足學乎予曰性者與身俱生而人之所皆有也為君子者修身治人而已性之善惡不必究也使性果善耶身不可以不修人不可以不治使性果惡耶身不可以不修人不可以不治不修其身雖君子而為小人書曰惟聖罔念作狂是也能脩其身雖小人而為君子書曰惟狂克念作聖是也治道備人斯為善矣書曰黎民於變時雍是也治道失人斯為惡矣書曰殷頑民又曰舊染汙俗是也故為君子者以修身治人為急而不窮性以為言夫七十二子之不問六經之不主言或雖言而不究豈略之哉盖有意也或又問曰然則三子言性過歟曰不過也其不同何也曰始異而終同也使孟子曰人性善矣遂怠而不教則是過也使荀子曰人性惡矣遂棄而不教則是過也使揚子曰人性混矣遂肆而不教則是過也然三子者或身奔走諸侯以行其道或著書累千萬言以告于後世未甞不區區以仁義禮樂為急蓋其意以為善者一日不教則失而入于惡惡者勤而教之則可使至於善混者驅而率之則可使去惡而就善也其說與書之習與性成語之性近習逺中庸之有以率之樂記之慎物所感皆合夫三子者推其言則殊察其用心則一故予以為推其言不過始異而終同也凡論三子者以予言而一之則譊譊者可以息矣予之所說如此吾子其擇焉答吳充秀才前辱示書及文三篇發而讀之浩浩乎若千萬言之多及少定而視焉纔數百言爾非夫辭豐意雄霈然有不可禦之勢何以至此然猶自患倀倀莫有開之使前者此好學之謙言也修材不足用於時仕不足榮於世其毁譽不足輕重氣力不足動人世之欲假譽以為重借力而後進者奚取於修焉先軰學精文雄其施於時又非待修譽而為重力而後進者也然而惠然見臨若有所責得非急於謀道不擇其人而問焉者歟夫學者未始不為道而至者鮮焉非道之於人逺也學者有所溺焉爾盖文之為言難工而可喜易悅而自足世之學者徃徃溺之一有工焉則曰吾學足矣甚者至棄百事不關于心曰吾文士也職于文而已此其所以至之鮮也昔孔子老而歸魯六經之作數年之頃爾然讀易者如無春秋讀書者如無詩何其用功少而至於至也聖人之文雖不可及然大抵道勝者文不難而自至也故孟子皇皇不暇著書荀卿蓋亦晚而有作若子雲仲淹方勉焉以模言語此道未足而强言者也後之惑者徒見前世之文傳以為學者文而已故愈力愈勤而愈不至此足下所謂終日不出於軒序不能縱横髙下皆如意者道未足也若道之充焉雖行乎天地入于淵泉無不之也先軰之文浩乎霈然可謂善矣而又志于為道猶自以為未廣若不止焉孟荀可至而不難也修學道而不至者然幸不甘於所悅而溺於所止因吾子之能不自止又以勵修之少進焉歐陽文粹巻七欽定四庫全書歐陽文粹巻八宋陳亮編書荅祖擇之人至䝉示書一通并詩賦雜文兩䇿諭之曰一覽以為如何某既陋不足以辱好學者之問又其少賤而長窮其素所為未有足稱以取信於人亦未嘗有人問者以不足問之愚而未嘗荅人之問足下卒然及之是以愧懼不知所言雖然不逺數百里走使者以及門意厚禮勤何敢不報某聞古之學者必嚴其師師嚴然後道尊道尊然後䔍敬篤敬然後能自守能自守然後果于用果於用然後不畏而不遷三代之衰學校廢至兩漢師道尚存故其學者各守其經以自用是以漢之政理文章與其當時之事後世莫及者其所從來深矣後世師法漸壊而今世無師則學者不尊嚴故自輕其道輕之則不能至不至則不能篤信信不篤則不知所守守不固則有所畏而物可移故學者惟俯仰狥時以希禄利為急至於忘本趨末流而不返夫以不信不固之心守不至之學雖欲果於自用莫知其所以用之之道又况有禄利之誘刑禍之懼以遷之哉此足下所謂志古知道之士世所鮮而未有合者由此也足下所為文用意甚髙卓然有不顧世俗之心直欲自到於古人今世之人用心如足下者有幾士則鄉曲之中能為足下之師者為誰交逰之間能發足下之議論者為誰學不師則守不一議論不博則無所發明而究其深足下之言髙趣逺甚善然所守未一而議論未精此其病也竊惟足下之交遊能為足下稱才譽美者不少今皆捨之逺而見及乃知足下是欲求其不至此古君子之用心也是以言之不敢隠夫世無師矣學者當師經師經必先求其意意得則心定心定則道純道純則充于中者實中充實則發為文者輝光施於世者果毅三代兩漢之學不過此也足下患世未有合者而不棄其愚將以某為合故敢道此未知於足下之意合否荅宋咸州人至䝉惠書及補注周易甚善世無孔子久矣六經之㫖失其傳其有不可得而正者自非孔子復出無以得其真也儒者之於學博矣而又苦心勞神於殘編朽簡之中以求千歲失傳之繆茫乎前望已逺之聖人而不可見杳乎後顧無窮之來者欲為未悟法難觧之惑是真所謂勞而少功者哉然而經非一世之書也其傳之繆非一日之失也其所以刋正補緝亦非一人之能也使學者各極其所見而明者擇焉十取其一百取其十雖未能復六經於無失而卓如日月之明然聚衆人之善以補緝之庶幾不至於大繆可以俟聖人之復生也然則學者之於經其可巳乎足下于經勤矣凡其所失無所不欲正之其刋正補緝者衆則其所得亦以多矣修學不敏明而又無彊力以自濟恐終不能少出所見以補六經之萬一得足下所為故尤區區而不能忘也屬奉使出疆怱怱不具惟自愛荅徐無黨人還惠書及始隠書論等并前所記獲麟論文辭馳騁之際豈常人筆力可到至於辨論經㫖則不敢以為是蓋吾子自信甚銳又甞取信於某苟以為然誰能奉奪凡今治經者莫不患聖人之意不明而為諸儒以自出之說汨之也今于經外又自為說則是患沙渾水而投土益之也不若沙土盡去則水清而明矣魯隐公南面治其國臣其吏民者十餘年死而入廟立諡稱公則當時魯人孰謂息姑不為君也孔子修春秋凡與諸侯盟㑹行師命將一以公書之於其卒也書曰公薨則聖人何甞異隠於他公也據經隠公立十一年而薨則左氏何從而知其攝公羊榖梁何從而見其有讓桓之迹吾子亦何從而云云也仲尼曰吾其為東周乎與吾子起於平王之說何相反之甚邪故某常告學者慎于述作誠以是也秋初許相訪此不子細略開其端吾子必能自思而得之與石公操一前歲於洛陽得在鄆州時所寄書卒然不能即報遂以及今然其勤心未必若書之怠而獨不知公操察不察也修來京師已一歲矣宋州臨汴水公操之譽日與南方之舟至京師修少與時人相接尤寡而譽者無日不聞若幸使盡識舟上人則公操之美可勝道哉凡人之相親者居則握手共席道歡欣既别則問疾病起居以相為憂者常人之情爾若聞如足下之譽者何必問其他乎聞之欣然亦不減握手之樂也夫不以相見為歡樂不以疾病為憂問是豈無情者乎得非相期者在於道爾其或有過而不至于道者乃可為憂也近於京師頻得足下所為文讀之甚善其好古閔世之意皆公操自得於古人不待修之賛也然有自許太髙詆時太過其論若未深究其源者此事有本末不可卒然語須相見乃能盡然有一事今詳而說此計公操可朝聞而暮改者試先陳之君貺家有足下手作書一通及有二像記石本始見之駭然不可識徐而視定辨其㸃畫乃可漸通吁何怪之甚也既以持以問人曰是不能乎書者邪曰非不能也書之法當爾邪曰非也古有之乎曰無今有之乎亦曰無也然則何為而若是曰特欲與世異而已修聞君子之於學是而已不聞為異也好學莫如揚雄亦曰如此然古之人或有稱獨行而髙世者考其行亦不過乎君子但與世之庸人不合爾行非異世盖人不及而反棄之舉世斥以為異者歟及其過聖人猶欲就之於中庸况今書前不師乎古後不足以為來者法雖天下皆好之猶不可為况天下皆非之乃獨為之何也是果好異以取髙歟然嚮謂公操能使人譽者豈其履中道秉常徳而然歟抑亦昂然自異以驚世人而得之歟古之教童子者立必正聽不傾常視之母誑勤謹乎其始惟恐其見異而惑也今足下端然居乎學舍以教人為師而反率然以自異顧學者何所法哉不幸學者皆從而效之足下又果為獨異乎今不急止則懼他日有責後生之好怪者推其事罪以奉歸此修所以為憂而敢告也惟幸察之與石公操二前同年徐君行因得寓書論足下書之怪時僕有妹居襄城䘮其夫匍匐將徃視之故不能盡其所以云者而略陳焉足下雖不以僕為狂愚而絶之復之以書然果未能諭僕之意非足下之不諭由僕聽之不審而論之之略之過也僕見足下書久矣不即有云而今乃云者何邪始見之疑乎不能書又疑乎忽而不學夫書一藝爾人或不能與忽不學特不必論是以黙黙然及來京師見二像石本及聞說者云足下不欲同俗而力為之如前所陳者是誠可諍矣然後一進其說及得足下書自謂不能與前所聞者異然後知所聽之不審也然足下於僕之言亦似未審者足下謂世之善書者能鍾王虞栁不過一藝已之所學乃堯舜周公之道不必善書又云因僕之言欲勉學之者此皆非也夫所謂鍾王虞栁之書者非獨足下薄之僕固亦薄之矣世之有好學其書而恱之者與嗜飲茗閲畵圖無異但其性之一僻爾豈君子之所務乎然至於書則不可無法古之始有文字也務乎記事而因物取類為其象故周禮六藝有六書之學其㸃畫曲直皆有其說揚子曰斷木為棊捖革為鞠亦皆有法焉而况書乎今雖𨽻字已變於古而變古為𨽻者非聖人不足師法然其㸃畫曲直猶有凖則如母毋彳亻之相近易之則亂不可讀矣今足下以其直者為斜以其方者為圓而曰我第行堯舜周孔之道此甚不可也譬如設饌於案加帽於首正襟而坐然後食者此世人常爾若其納足於帽反衣而衣坐乎案上以飯實酒巵而食曰我行堯舜周孔之道者以此之於世可乎不可也則書雖末事而當從常法不可以為怪亦猶是矣足下了不省僕之意凡僕之所陳者非論書之善否但患乎近怪自異以惑後生也若果不能又何必學僕豈區區勸足下以學書者乎足下又云我實有獨異於世者以疾釋老斥文章之雕刻者此又大不可也夫釋老惑者之所為雕刻文章薄者之所為足下安知世無明誠質厚君子之不為乎足下自以為異是待天下無君子之與已同也仲尼曰後生可畏安知來者之不如今也是則仲尼一言不敢遺天下之後生足下一言待天下以無君子此故所謂大不可也夫士之不為釋老與不雕刻文章者譬如為吏而不受貨財盖道當爾不足恃以為賢也屬久苦小疾無意思與樂秀才前者舟行徃來屢辱見過又辱以所業一編先之啟事及門而贄田秀才西來辱書其後予家奴自府還縣比又辱書僕有罪之人人所共棄而足下見禮如此何以當之當之未暇答宜遂絶而再辱書再而未荅益宜絶而又辱之何其勤之甚也如修者天下窮賤之人爾安能使足下之切切如是耶盖足下力學好問急于自為謀而然也然䝉索僕所為文字者此似有所過聽也僕少從進士舉於有司學為詩賦以備程試凡三舉而得第與士君子相識者多故徃徃能道僕名字而又以逰從相愛之私或過稱其文字故使足下聞僕虚名而欲見其所為者由此也僕少孤貧貪禄仕以養親不暇就師窮經以學聖人之遺業而渉獵書史姑隨世俗作所謂時文者皆穿蠧經傳移此儷彼以為浮薄惟恐不悅于時人非有卓然自立之言如古人者然有司過採屢以先多士及得第已來自以前所為不足以稱有司之舉而當長者之知始大改其為庶幾有立然言出而罪至學成而身辱為彼則獲譽為此則受禍此明效也夫時文雖曰浮巧然其為功亦不易也僕天資不好而强為之故比時人之為者尤不工然已足以取禄仕而竊名譽者順時故也先輩少年志盛方欲取榮譽于世則莫若順時天聖中天子下詔書勑學者去浮華其後風俗大變今時之士大夫所為彬彬有兩漢之風矣先輩徃學之非徒足以順時取譽而已如其至之是直齊肩於兩漢之士也若僕者其前所為既不足學其後所為慎不可學是以徘徊不敢出其所為者為此也若易之困曰有言不信謂夫人方困時其言不為人所信也今可謂困矣安足為足下所取信哉辱書既多且切不敢不荅幸察與郭秀才僕昨以吏事至漢東秀才見僕於叔父家以啟事二篇偕門刺先進自賔階拜起旋辟甚有儀坐而語諾甚謹讀其辭温宻華富甚可愛視秀才待僕之意甚勤而禮也古人之相見必有歡欣交接之誠而不能達乃取羔羊雉鶩之類致其意為贄而先既致其意又耻其無文則以虎豹之皮繢畫之布以飾之然後意達情接客既贄而主人必禮以荅之為陳酒殽幣篚壺矢燕樂之具將其意又為賦詩以陳其情今秀才好學甚精博記書史務為文辭不以羔禽皮布為飾獨以言文其身而其贄既美其意既勤矣宜秀才責僕之荅厚也僕既無主人之具以為禮獨為秀才賦詩女曰鷄鳴之卒章曰知子之來之雜珮以贈之取其知客之來豫儲珩璜琚瑀之美以送客雖無此物猶言之以致其意厚也僕誠無此物可謂空言之爾秀才年且少貌厚色揚志銳學敏因進其業修其辭暴練緝織之不已使其文采五色潤澤炳鬱若贄以見當世公卿大夫非惟若僕空言以贈也必有分庭而禮加籩豆實幣篚延為上賔者惟勉之不已與陳貟外陳君足下無恙近縣幹上府得書一角屬有少吏事不皇作報既而私有惑者修本愚無似固不足以希執友之遊然而羣居平日幸得肩從齒序跪拜起居竊兄弟行寓書存勞謂宜有所款曲以親之之意奈何一幅之紙前名後書且狀且牒如上公府退以尋度非謙即䟽此乃世之浮道之交外陽相尊者之為非宜足下之所以賜修也古之書具惟有鈆刀竹木而削札為刺止於逹名姓寓書於簡止於舒心意為問好惟官府吏曹凡公之事上而下者則曰符曰檄問訊列對下而上者則曰狀位等相以徃來曰移曰牒非公之事長吏或自以意曉其下以戒以飭者則曰教下吏以私自達于其屬長而有所候問請謝者則曰牋記書啟故非有狀牒之儀施於非公之事相參如今所行者其原盖出唐世大臣或貴且尊或有權于時縉紳湊其門以傳嚮者謂舊禮不足為重務稍増之然始於刺謁有參候起居因為之狀及五代始復以問候請謝加狀牒之儀如公之事然止施於官之尊貴及吏之長者其偽謬所從來既逺世不根古以為當然居今之世無不如此而莫以易者盖常俗所為積習以牢而不得以更之也然士或同師友締交遊以道義相期者尚有手書勤勤之意猶為近古噫候問請謝非公之事有狀牒之儀以施于尊貴長吏猶曰非古之宜用况又用之於肩從齒序跪拜起居如兄弟者乎豈足下不以道義交逰期我而惜手書之勤耶將待以牽俗積習者而姑用世禮以遇我之勤邪不然是為浮道以陽相尊也是以不勝拳拳之心謹布左右屬以公檄赴滑臺行視驛傳廹於促裝楊秀才旦詣縣府中事可悉數與蔡君謨脩啟嚮在河朔不能自閒甞集録前世金石之遺文自三代以來古文竒字莫不皆有中間雖罪戾擯斥水陸奔走顛危困踣兼之人事吉凶憂患悲愁無聊倉卒未甞一日忘也盖自慶厯乙酉逮嘉祐壬寅十有八年而得千巻顧其勤至矣然亦可謂富哉竊復自念好嗜與俗異馳乃獨區區收拾世人之所棄者惟恐不及是又可笑也因輙自叙其事庶以見其志焉然顧其文鄙意陋不足以示人既則自視前所集録雖浮屠老子詭妄之說常見貶絶於吾儒者徃徃取之而不忍遽廢者何哉豈非特以其字畫之工邪然則字畫之法雖為學者之餘事亦有助於金石之傳也若浮屠老子之說當棄而獲存者乃直以字畫而傳是其幸而得所託爾豈待有助而已哉僕之文陋矣顧不能以自傳其或幸而得所託則未必不傳也由是言之為僕不朽之託者在君謨一揮毫之頃爾竊惟君子樂善欲成人之美者或聞斯說謂宜有不能却也故輙持其說以進而不疑伏惟幸察歐陽文粹巻八欽定四庫全書歐陽文粹巻九宋陳亮編劄子乞補館職臣竊以治天下者用人非止一端故取士不以一路若夫知錢榖曉刑獄熟民事精吏幹勤勞夙夜以辦集為功者謂之材能之士明於仁義禮樂通于古今治亂其文章論議與之謀慮天下之事可以决疑定䇿論道經邦者謂之儒學之臣善用人者必使有材者竭其力有識者竭其謀故以材能之士布列中外分治百職使各辦其事以儒學之臣置之左右與之日夕謀議講求其要而行之而又於儒學之中擇其尤者置之廊廟而付以大政使緫治羣材衆職進退而賞罰之此用人之大略也由是言之儒學之士可謂貴矣豈在材臣之後也是以前世英主明君未有不以崇儒嚮學為先而名臣賢輔出於儒學者十常八九也臣竊見方今取士之失患在前材能而後儒學貴吏事而賤文章自近年以來朝廷患百職不修務奬材臣故錢榖刑獄之吏稍有寸長片善為人所稱者皆已擢用之矣夫材能之士固當擢用然專以材能為急而遂忽儒學為不足用使下有遺賢之嗟上有乏材之患此甚不可也臣謂方今材能之士不患有遺固不足上煩聖慮惟儒學之臣難進而多棄滯此不可不思也臣以庸繆過䝉任使俾陪宰輔之後然平日論議不能無異同雖日奉天威又不得從容曲盡拙訥今臣有館閣取士愚見具陳如列奏欲望聖慈因宴閒之餘一迂睿覽或有可采乞常賜留意今取進止論館閣取士臣竊以館閣之職號為育材之地今兩府闕人則必取於兩制兩制闕人則必取於館閣然則館閣輔相養材之地也材既難得而又難知故當博採廣求而多畜之時冀一得於其間則傑然而出為名臣矣其餘中人以上優㳺養育以奬成之亦不失為佳士也自祖宗以來所用兩府大臣多矣其間名臣賢相出於館閣者十常八九也祖宗用人初若不精然所采既廣故所得亦多也是以有文章有學問有材有行或精於一藝或長於一事者莫不畜之館閣而奬養之其傑然而出者皆為賢輔相矣其餘不至輔相而為一時之名臣者亦不可勝數也先朝循用祖宗舊制收拾養育得人尤多自陛下即位以來所用兩府之臣一十三人而八人出於館閣此其驗也只自近年議者患館職之濫遂行釐革而改更之初矯失太過立法既峻取人遂艱使下多遺賢之嗟國有乏材之患今先朝收拾養育之人或已被遷擢或老病死亡見在館者無幾而新法艱阻近年全無選進臣今略具館閣取人舊制并新格則可見取人之法如何所得之人多少也一舊制館閣取人以三路進士髙科一路也大臣薦舉一路也嵗月醻勞一路也進士第三人以上及第者并制科及第者不問等第並只一任替回便試館職進士第四第五人經兩任亦得試此一路也兩府臣寮初拜命各舉三兩人即時召試此一路也其餘歴任繁難久滯或寄任重處者特令帶職此一路也今三路塞其二矣自科塲改為間歲後第一人及第者須兩任回方得試自第二人至第五人更永不試制科入第三者亦須兩任回方得試其餘等第並永不試則進士髙科一路巳塞矣兩府大臣所薦之人並只上簿候館職有闕則於簿内㸃名召試其如館閣本無員數無有闕時故自置簿來至今九年不曾㸃試一人則大臣薦舉一路又塞矣惟有醻勞帶職一路尚在爾一新制館閣共置編校八員本為館中書籍久不齊整而館職多别有差遣不能專一校正乃别置此八員故選新進資淺人令久任而專一校讀所以先令作編校然後升為校勘為校勘四年後升為校理為校理又一年方罷編校别任差遣然自置編校後適值館閣取人之路漸廢今議者遂只以編校為取士新格徃時直館直院直閣校理皆無定員惟材是用不限人數今編校限以八員為定以此待天下之多士宜其遺材於下矣八員之内仍每七年方遇一貟之闕而補一人以此知天下滯材者衆矣右以臣愚見編校八員自可仍舊每有貟闕令中書擇人擬進陛下必欲牢籠天下英俊之士則宜脫去常格而奬㧞之今負文學懐器識磊落竒偉之士知名於世而未為時用者不少惟陛下博訪審察悉召而且置之館職養育三數年間徐察其實擇其尤者而擢用之知人自古聖王所難然不以其難而遂廢但拔十而得一二亦不為無益矣况中人上下養育奬成之不止十得一二也論編學士院制詔臣伏見國家承五代之餘建萬世之業誅滅僣亂懐來四夷封祀天地制作禮樂至於大臣進退政令改更學士所作文書皆繫朝廷大事示於後世則為王者之訓謨藏之有司乃是本朝之故實自明道已前文書草藁尚有編錄景祐以後漸成散失臣曽試令類聚收拾補綴十已失其五六使聖宋之盛文章詔令廢失湮淪緩急事有質疑有司無所檢證盖由從前雖有編録亦無類例巻第秪是本院書吏私自抄寫所以易為廢失臣今欲乞將國朝以來學士所撰文書各以門類依其年次編成巻帙號為學士院草録有不足者更加求訪補足之仍乞差本院學士從下兩員專切管勾自今巳後接續編聨如本行人吏不畫時編録致有漏落許令本院舉察理為過犯此臣本院常事也所以上煩聖聽者盖以近歲以來百司綱紀相承廢壞事有曽經奏聞及有聖㫖指揮者僅能遵守若秪是本司臨時處置其主判之官纔罷去則其事尋亦廢停所以止欲乞朝廷特降指揮所貴久逺遵行不敢廢失今取進止論刪去九經正義中䜟緯臣伏見國家近年以來更定貢舉之科以為取士之法建立學校而勤養士之方然士子文章未純節行未篤不稱朝廷勵賢興善之意而所以化民成俗之風臣愚以為士之所本在乎六經而自暴秦焚書聖道中絶漢興收拾亡逸所存無幾或殘編斷簡出於屋壁而餘齡昏眊得其口傳去聖既逺莫可考證偏學異說因自名家然而授受相傳尚有師法暨晉宋而下師道漸亡章句之篇家藏私畜其後各為箋傳附著經文其說存亡以時好惡學者茫昧莫知所歸至唐太宗時始詔名儒撰定九經之䟽號為正義凡數百篇自爾以來著為定論凡不本正義者謂之異端則學者之宗師百世之取信也然其所載既博所擇不精多引䜟緯之書以相雜亂怪竒詭僻所謂非聖之書異乎正義之名也臣欲乞特詔名儒學官悉取九經之䟽刪去䜟緯之文使學者不為怪異之言惑亂然後經義純一無所駮雜其用功至少其為益則多臣愚以為欲使士子學古勵行而不本六經欲學六經而不去其詭異駮雜欲望功化之成不可得也伏望聖慈下臣之言付外詳議今取進止乞定兩制貟數臣竊以學士待制號為侍從之臣所以承晏閒備顧問以論思獻納為職自祖宗以來尤精其擇苟非清徳美行藹然衆譽髙文博學獨出一時則不得與其選是以選用至艱貟數至少官以難得為貴人以得職為榮縉紳之望既隆則朝廷之體増重其後用人頗易貟數漸多徃時學士待制至六七十員近年以來稍愼除拜即今猶及四十餘員臣以為愛惜名器不輕授人朝廷既已知之矣而為國計者宜於此時創立經制今惟翰林學士中書舍人知制誥各有定貟其餘學士待制未有員數臣今欲乞檢詳前史及國朝故事自觀文殿大學士至待制並各立定員數遇有員闕則精擇賢材以充其選苟無其人尚可虚位以待如允臣所請乞賜詳議施行今取進止論均稅臣為諌官時嘗首言均稅事乞差郭諮孫琳䝉朝廷依臣所言起自蔡州一縣以方田法均稅事方施行而議者多言不便尋即罷之近者伏見朝廷特置均稅一司差官分徃河北陜西均稅始聞河北傳言人戸虚驚斫伐桑棗尚不為信次見陜西州郡有上言歲儉民饑乞罷均稅者稍巳疑此一事果為難行而朝廷之意決在必行言者遂不能入近者又見河北人戸凡千百人聚訴於三司然則道路傳言與州郡上言雖為不足信其如聚集千人於京師此事不可掩蔽則民情可知矣盖均稅非以規利而本以便民如此民果便乎竊知朝廷本秪以見在稅數量輕重均之初不令其别生額外之數也近聞衛州通利軍括出民冒佃田土不於見在管㩁數内均減重者攤與冒佃戸却生立稅數配之此非朝廷本意而民所以諠訴也又聞澶州諸縣於見今實額管㩁數外將帳頭自來樁坐有名無納及夫開閣將行兩項逺年稅數並繫祥符景徳已前以至五代長興年樁管虛數並攤與見今人戸又聞以地肥瘠定為四等其下等田有白鹻帶鹹地并鹹鹵沙薄可殖地死沙不殖地並一例均攤與稅數謂此雖不可耕種尚可煎鹽且河北之民自祖宗以來䝉賜恩䘏放行鹽不禁秪今據鹽斤兩納稅今煎鹽者已納鹽稅又令更納田稅豈祖宗所以惠河北之民意又聞河南不殖之地繫禁鹽地分者亦均攤與稅又不知民何以納也澶衛去京師近偶可聞知者如此其餘逺地謂所均悉便於民其可得乎以此見朝廷行事至難小人希意承㫖者言利而不言害俗吏貪功希賞見小利忘大害為國歛怨於民朝廷不知則已苟巳知之其可不為救其失哉欲望聖慈特賜指揮令均稅所秪如朝廷本議將實㩁見在稅數量輕重均之其餘生立稅數及逺年虛數却與放免及未均地分並且罷均且均稅一事本是臣先建言聞今事有不便臣固不敢緘黙今取進止論牧馬草地臣為學士日兼充羣牧使朝廷以馬政久弊差吳中復等與臣共議利害欲有改更為未見得牧地善惡多少難為廢置欲乞差官先且打量牧馬草地次臣遽䝉恩擢在樞府所有牧馬利害商量未了事件臣有愚見方欲條陳今聞諸監所差官各將前去竊縁監牧帳管舊地甚多自來界至不明官私作弊積久為民間侵占耕種年歲已深昨已曾差髙訪等根括打量人戸多稱父祖世業失却契書無憑照驗但追呼騷擾而已今若更行根究必亦難明徒為追擾未見其利民先被害臣今欲乞令差去官秪據見在草地逐叚叚打量的實頃畝明立封標界至因便相度其地肥􅇤宜與不宜牧馬其廢置改更候逐官回日令相度牧馬所據利害擘劃申奏其巳為民間侵耕地土更不根究盖以本議欲以見在牧地給與民耕豈可却根究巳耕之地重為騷擾至於民間養馬等事利害甚多臣當續具奏聞其不根究侵耕地土一事伏乞先賜指揮今取進止論監牧臣所領羣牧司近准宣差吳中復王安石王陶等同共相度監牧利害事竊以國馬之制置自祖宗嵗月既深官司失守積習成弊匪止一時前後因循重于改作今者幸䝉朝廷因言事之官有所陳述選差臣寮相度更改臣以為監牧之設法制具存條目既繁弊病亦衆若秪坐按文籍就加増損恐不足以深革弊源如欲大為更張創立制度則凡於利害難以遥度必湏目見心曉熟於其事然後可以審詳裁制果决不疑盖謀於始也不精則行於後也難久况此是臣本職豈敢辭勞欲乞權暫差臣仍於吳中復等三人内更差一人與臣同詣左右廂監牧地頭躬親按視至於土地廣狹水草善惡歲時孳牧吏卒勤惰以至牝牡種類各隨所宜棚井温涼亦有便否嚮何以致馬之耗減今何以得馬之蕃滋既詳究其根源兼旁採於衆議如此不三數月間可以周遍然後更將前後臣寮啓請與衆官參詳審處與其坐而遥度倉卒改更其為得失不可同日而論也臣又竊思今之馬政者皆因唐制而今馬多少與唐不同者其利病甚多不可悉舉至于唐世牧地皆與馬性相宜西起隴右金城平涼天水外暨河曲之野内則岐豳涇寧東接銀夏又東至於樓煩皆唐養馬之地也以今考之或䧟沒夷狄或已為民田皆不可復得惟今之河東嵐右之間山荒甚多及汾河之側草地亦廣其間草軟水甘最宜牧養徃時河東馬軍常在此處牧放今馬數全少閒地極多此乃唐樓煩監地也可以興置一監臣以為推迹而求之則樓煩天池元池三監之地尚兾可得又臣徃年因奉使河東甞行威勝東以及遼州平定軍見其不耕之地甚多而河東一路山川深峻水草甚佳其地髙寒必宜馬性及京西唐汝之間久荒之地其數甚廣欲乞更下河東京西轉運司差官就近於轄下訪求草地有可以興置監牧處如稍見次第即乞朝廷差官與羣牧司官員同共徃彼踏行擘劃若可以興置新監則河北諸監内有地不宜馬處却可議行廢罷惟估馬一司利害最為易見若國家廣捐金帛則劵馬利厚來者必多於其多中時得好馬若有司惜費則蕃部利薄馬來漸少兼亦好馬不來然而招誘之方事非一體亦須知其委曲欲乞特差羣牧司或禮賔院一員直至秦州已來體問蕃部劵馬利害凡此三者雖暫差官比及吳中復等檢閲本司文字講求商議未就之間已各來復可以叅酌相度庶不倉卒輕為改更如允臣所請乞賜施行今取進止薦司馬光臣伏見龍圖閣直學士司馬光徳性淳正學術通明自列侍從久司諌諍讜言嘉話著在兩朝自仁宗至和服藥之後羣臣便以皇嗣為言五六年間言者雖多而未有定議最後光以諌官極論其事敷陳激切感動主聽仁宗豁然開悟遂決不疑由是先帝選自宗藩入為皇子曽未踰年仁宗奄棄萬國先帝入承大統盖以人心先定故得天下帖然今以聖繼聖遂傳陛下由是言之光於國有功為不淺矣可謂社稷之臣也而其識慮深逺性尤慎宻光既不自言故人亦無知者臣以忝在政府因得備聞其事臣而不言是謂蔽賢掩善詩云無言不酬無徳不報光今雖在侍從日承眷侍而其忠國大節隐而未彰臣既詳知不敢不奏薦王安石吕公著臣伏見陛下仁聖聰明優容諫諍雖有狂直之士犯顔色而觸忌諱者未甞不終始保全徃徃亟加擢用此自古明君聖主之所難也然而用言既難獻言者亦不為易論小事者既可鄙而不足為陳大計者又似迂而無速效欲㣲諷則未能動將直陳則忤貴權而旁有羣言奪於衆力所陳多未施設其人遽已改遷致陛下有聽言之勤而未見用言之效頗疑言事之職但為速進之階盖縁臺諌之官資望已峻少加進擢便履清華而臣下有厭人言者因此亦得進說直云此輩務要官職所以多言使後來者其言益輕而人主無由取信辜陛下納諌之意違陛下賞諌之心臣以為欲救其失惟宜擇沈黙端正守節難進之臣置以諌署則既無干進之疑庶或其言可信伏見殿中丞王安石徳行文學為衆所推守道安貧剛而不屈司封貟外郎吕公著是夷簡之子器識深逺沈静寡言富貴不染其心利害不移其守安石久更吏事兼有時材曾召試館職固辭不就公著性樂閒退淡於世事然所謂夫人不言言必有中者也徃年陛下上遵先帝之制增置諌官四員已而中廢復止兩員今諌官尚有虛位伏乞用此兩人補足四貟之數必能規正朝廷之得失禆益陛下之聰明臣叨被榮恩未知報效苟有所見不敢不言今取進止歐陽文粹巻九欽定四庫全書歐陽文粹巻十宋陳亮編奏狀議新學右臣等伏見近日言事之臣謂陛下言建學取士之法者衆矣或欲立三舍以養生徒或欲復五經而置博士或欲但舉舊制而修廢墜或欲特創新學而立科條其言雖殊其意則一陛下愼重其事下其議於羣臣而議者遂欲創新學立三舍因以辨士之能否而命之以官其始也則教以經藝文辭其終也則取以材識徳行聽其言則甚備考于事則難行夫建學校以養賢論材徳而取士此皆有國之本務而帝王之極致也而臣等謂之難行者何哉盖以古今之體不同而施設之方皆異也古之建學取士之制非如今之法也盖古之所謂為政與設教者遲速異宜也夫立時日以趨事考其功過而督以賞罰者為政之法也故政可速成若夫設教則以勸善興化尚賢勵俗為事其被於人者漸則入於人也深收其效者遲則推其功也逺故常緩而不廹古者家有塾黨有庠術有序國有學自天子諸侯之子下至國之俊選莫不入學自成童而學至年四十而仕其習乎禮樂之容講乎仁義之訓敦乎孝悌之行以養父兄事長上信朋友而臨財亷處衆讓其修於身行于家達于鄰里聞于郷黨然後詢于衆庶又定扵長老之可信者而薦之始謂之秀士久之又取其甚秀者為選士久之又取其甚秀者為俊士久之又取其甚秀者為進士然後辨其論隨其材而官之夫生七八十歲而死者人之常夀也古乃以四十而仕盖用其半生為學考行又廣察以鄰里鄉黨而後其人可知然則積徳累善如此勤而久求賢審官如此慎而有次第然後矯偽干利之士不容於其間而風俗不䧟于媮薄也古之建學取士其施設之方如此也方今之制以貢舉取人徃者四歲一詔貢舉而議者患於太遲更趣之為間嵗而應舉之士來學於京師者類皆去其鄉里逺其父母妻子而為旦暮干禄之計非如古人自成童至于四十就學於其庠序而鄰里鄉黨得以衆察徐考其行實也盖古之養士本於舒遲而今之取人患于急廹此施設不同之大槩也臣請詳言方今之弊既以文學取士又欲以徳行官人且速取之歟則真偽之情未辨是朝廷本欲以學勸人修徳行而反以利誘人為矯偽此其不可一也若遲取之歟待其衆察徐考而漸進則文辭之士先以中於甲科而徳行之人尚未登於内舍此其不可二也且今入學之人皆四方之逰士齎其一身而來烏合羣處非如古人在家在學自少至長親戚朋友鄉黨衆察徐考其行實也不過取于同舍一時之毁譽而决於學官數人之品藻爾然則同學之人蹈利爭進愛憎之論必分朋黨若東漢之俗尚名節而黨人之禍及天下其始起于處士之横議而相訾也此其不可三也夫人之材行若不因臨事而見則守常循理無異衆人苟欲異衆則必為迂僻竒怪以取徳行之名而髙談虚論以求材識之譽前日慶歴之學其弊是也此其不可四也今若外方專以文學貢士而京師獨以徳行取人則實行素履著於鄉曲而守道丘園之士皆反見遺此其不可者五也近者朝廷患四方之士寓籍京師者多而不知其士行遂嚴其法使各歸於鄉里今又反使來聚於京師云欲考其徳行若不用四方之人止取京師之士則又示人以不廣此其不可六也夫儒者所謂能通古今者在知其意達其理而酌時之宜爾大扺古者教學之意緩而不廹所以勸善興化養賢勵俗在扵遲久而不求近效急功也臣謂宜於今而可行者立為三舍可也復五經博士可也特創新學雖不若即舊而修廢然未有甚害創之亦可也在乎深本教學之意而修其實事給以糇糧多陳經籍選士之良者以通經有道之士為之師而謹察其有過無行者黜去之則在學之人皆善士也然後取以貢舉之法待其居官為吏已接於人事可以考其賢善優劣而時取其尤出類者旌異之則士修其行非為一時之利而可伸於終身則矯偽之行不作而媮薄之風歸厚矣此所謂實事之可行於今者也臣等伏見論學者四人其說各異而朝廷又下臣等俾之詳定是欲盡衆人之見而採其長者爾故臣等敢陳其所有以助衆議之一非敢好為異論也伏望聖慈特賜裁擇論舉人懐挾臣伏見國家自興建學校以來天下學者日盛務通經術多作古文其辭藝可稱履行修飭不可勝數然累次科場人數倍多於徃歲事既太盛弊亦隨生竊聞近年舉人公然懐挾文字皆是小紙細書抄節甚備毎寫一本筆工獲錢三二十千亦有十數人共斂錢三二百千顧倩一人虗依舉人名目依例下家狀入科場秪令懐挾文字入至試院其程試則他人代作事不敗則頼其懐挾互相傳授事敗則不過扶出一人既本非應舉之人雖敗别無刑責而坐獲厚利竊以國家取士務得實才今若浮偽之人容其濫進則使負辛勤藴實學者無以自别且自來科場務全事體所以優加禮遇用待賢能今浮薄之徒不知朝廷崇奬之意自為姦偽以至於此甚可歎也惟宜峻立科條明加約束使浮薄姦偽之徒不容於其間則實有學行之人得被進選然後士子無濫舉朝廷得實才臣今欲乞増定貢院新制寛監門之責重廵捕之賞蓋以入門之時一一搜撿則慮成壅滯故臣乞自舉人入院後嚴加廵察多差内臣及精幹京朝官廵捕毎獲懷挾者許與理為勞績或免逺官或指射差遣若搜檢覺察得人數多者令知舉官聞奏取㫖重加酬奬其廵捕官除秪得廵察懐挾及傳授文義外不得非理侮慢舉人庻有事體且朝廷待士甚厚而小人自為浮薄不可不行禁止以革厚弊如允所奏乞立定廵捕官賞格及懐挾人責罰刑名添入貢院新定條制仍牓南省門及下進奏院頒告天下所貴先明條約然後必行取進止議科場臣某等近凖勑差詳定貢舉條制者伏以取士之方必求其實用人之術當盡其材今教不本於學校士不察於鄉里則不能覈名實有司束以聲病學者専於記誦則不足盡人材此獻議者所共為言也臣等參考衆說擇其便於今者莫若使人皆土著而教之學校然後州縣察其履行則學者修飭矣故為學制合保薦送之法夫上之設法下之所趨也今先舉䇿論則文詞者留心於治亂矣簡其程試則閎博者得以馳騁矣問以大義則執經者不専於記誦矣其詩賦之未能自律者雜用今體經術之未能亟通者尚依舊科則中常之人皆可勉及矣此所謂盡人之材也故為先䇿論過落簡詩賦考式問諸科大義之法此數者皆大要也其他通禮一有司之所習及州郡封彌謄録進士諸科填帖之類皆細碎而無益者一切罷之凡其為法者皆申之以賞罰而勸焉如此則養士有業取材不遺苟可施行望賜裁擇論史館日厯臣伏以史者國家之典法也自君臣善惡功過與其百事之廢置可以垂勸戒示後世者皆得書而不隠故自前世有國者莫不以史職為重伏見國朝之史以宰相監修學士修撰又以兩府之臣撰時政記選三館之士當陞擢者乃命修起居注如此不為不重矣然近年以來貟具而職廢其所撰述簡略遺漏百不存一至于事關大體者皆没而不書此實史官之罪而臣之責也然其弊在於修撰之官惟據諸司供報而不敢書所見聞故也今時政記雖是兩府臣寮修纂然聖君言動有所宣諭臣下奏議事關得失者皆不紀録惟書除目辭見之類至於起居注亦然與諸司供報文字無異修撰官秪據此銓次排以日月謂之曰厯而巳是以朝廷之事史官雖欲書而不得書也自古人君皆不自閲史今撰述既成必録本進呈則事有諱避史官雖欲書而又不敢書也加以日厯時政記起居注例皆承前積滯相因故纂録者常務追修積滯不暇及之若欲革其弊則前後相因史官永無舉職之時使聖朝典法遂成廢墜臣竊見趙元昊自初叛至復稱臣始終一宗事節皆不曾書亦聞修撰官甚欲紀述以修纂後時追求莫得故也其於他事又可知焉臣今欲乞特詔修時政記起居注之臣並以徳音宣諭臣下奏對之語書之其修撰官不得依前秪據諸司供報編次除目辭見並須考驗事實其除某官者以某功如狄青等破儂智髙文彦博等破王則之類其貶職者坐某罪如昨來麟州守將及并州縁白草平事近日大臣所坐之類事有文據及迹狀分明皆備書之所以使聖朝賞罰之典可以勸善懲惡昭示後世若大臣用情朝廷賞罰不當者亦得書以為警戒此國家置史之本意也至於他大事並許史院據所聞見書之如聞見未詳者直牒諸處會問及臣寮奏議異同朝廷裁置處分並書之已上事節並令修撰官逐時旋據所得録為草巻標題月分於史院躬親入櫃封鏁候諸司供報齊足修為日厯仍乞每至嵗終命監修宰相親至史院㸃檢修撰官紀録事迹内有不勤其事墮官失職者奏行責罰其時政記起居注日厯等並令次月供報並乞更不進本所貴少修史職上存聖朝典法此乃臣之職事不敢不言謹具奏聞論脩河利害第一右臣伏見學士院集兩省臺諌議修河事未有一定之論盖由賈昌朝欲復故道李仲昌請開六塔互執一說莫知孰是以臣愚見皆謂不然言故道者未詳利害之原述六塔者近乎欺罔之謬何以言之今謂故道可復者但見河北水患而欲還之京東不思天禧以來河水屢決之因所以深知故道有不可復之勢此臣故謂未詳利害之原也若言六塔之利者不攻而自破矣且開六塔既云減得大河水勢然今恩兾之患何縁尚告危急此則減水之利虚妄可知開六塔者又云可以全廻大河使復横壠故道見今六塔秪是分減之水下流無歸已為濵棣徳博之患若全廻大河以入六塔則其害如何此臣故謂近乎欺罔之謬也臣聞河之泥沙無不淤之理淤澱之勢常先下流下流淤髙水行不快乃自上流低下處決此其常勢也然避髙就下水之本性故河流已棄之道自是難復臣不敢逺引書史廣述河源秪以今所欲復之故道言天禧以來屢決之因初天禧中河出京東水行于今所謂故道者水流淤澁乃於滑州天臺埽決尋而修塞水復故道未幾又滑州南鐵狗廟決今所謂龍門埽者也其後數年又議修塞水令復故道已而又於王楚埽決所決差小與故道分流然而故道之水終以壅淤故又於横壠大決是則決河非不能力塞故道非不能力復不久終必決於上流者由故道淤髙水不行故也及横壠既決水流就下所以十餘年間河未為患至慶厯三四年横壠之水又自下流先淤是時臣為河北轉運使海口已淤百四十餘里其後遊金赤三河相次又淤下流既梗乃又淤上流商胡復決然則京東横壠兩河皆是下流淤塞河水已棄之髙地京東故道屢復屢決理不可復其驗甚明則六塔所開故道之不可復不待言而易知臣聞議者計度京東故道工料上云銅城已上地髙不知大抵東去皆髙而銅城已上乃特髙爾其東北銅城已上則似低比商胡已上則實髙也若云銅城已東地勢斗下則當日水決宜決銅城已上何縁而頓淤横壠之口亦何縁而決也然則兩河故道既皆不可為則河北水患何為而可去臣聞智者於事有所不能則必較其利害之輕重擇其害少者而為之猶勝害多而利少何况有害而無利此三者可較而擇也臣見徃年商胡初決之時議欲修塞計用一千八百萬梢芟科配六路一百有餘州軍今欲塞者乃徃年之商胡必須用徃年之物數至于開鑿故道張奎元計功料極大後來李參等減得全少猶用三十萬人然而欲以五十歩之狹容大河之水此可笑也又欲増一夫所開三尺之方倍為六尺且闊厚三尺而長六尺已是一倍之功在於人力已為勞苦若云六尺之方以開方法筭之乃八倍之功此豈人力之所勝是則前功浩大而難興後功雖小而不實大抵塞商胡開故道凡二大役皆困國而勞人所舉如此而欲開難復屢決巳驗之故道使其虛費而商胡不可塞故道不可復此所謂有害而無利者也就使幸而暫塞暫復以紓目前之患而終於上流必決如龍門横壠之比重以困國勞人此所謂利少而害多者也若六塔者於大河有減水之名無減水之實今下流所散為巳多若全廻大河以注之則濵棣徳博河北所仰之州不勝其患而又故道淤澁上流必有他決之虞此直有害而無利爾是則智者之不為也今若因水所注増治隄防䟽其下流浚以入海則可無決溢散漫之虞今河所厯數州之地誠為患矣隄防歲用之夫誠為勞矣與其虛費天下之財虛舉大衆之役而不能成乃終不免為數州之患勞歲用之夫此則所謂害少者乃智者之所擇也大抵今河之勢負三決之虞復故道上流必決開六塔上流亦決今河下流若不浚使入海則上流亦決臣請選知水利之臣就其下流求其入海之路而浚之不然下流梗澁終虞上決為患無涯臣非知水者但以今事目可驗者而較之爾言狂計愚不足以備聖君博訪之求此大事也伏乞下臣之議廣謀於衆而裁擇之論修河利害第二右臣竊見朝廷近因臣寮建議欲塞商胡横壠廻大河於故道已下三司候今秋興役見令東京計度物料次臣伏以國家興大役動大衆必先順天時量人力謀於其始而審然後必行計其所利者多乃能無悔伏見比年以來興役動衆勞民費財不精謀慮於厥初輕信利害之偏說舉事之初既已倉皇羣議一摇尋復悔罷臣不敢逺引他事上煩聖聰秪如徃年河決商胡是時執政之臣不愼計慮遽謀修塞科配一千八百萬梢芟騷動六路一百有餘州軍官吏催驅急若星火民庶愁苦盈於道途或物已輸官或人方在路未及興役遽已罷修虛費民財為國歛怨舉事輕脫為害若斯雖既徃之失難追而可鑒之蹤未逺今者又聞復有修河之役聚三十萬人之衆開一千里之長河計其所用物力數倍徃年當此天災歲旱之時民困國貧之際不量人力不順天時臣知其有大不可者五盖自去秋以及今春半天下苦旱而京東尤甚河北次之國家常務安静賑䘏之猶恐饑民起而為盗何况於此兩路聚大衆興大役此其必不可者一也河北自恩州用兵之後繼以凶年人戸流亡十失八九數年以來稍稍歸復然死亡之餘所存無幾瘡痍未歛物力未充今遭此旱歲京東自去冬無雨雪麥不生苖已及暮春粟未布種不惟目下乏食兼亦向去無望而欲於此兩路興三十萬人之役若别路差夫則逺處難為赴役就河便近則此兩路力所不任此其必不可者二也臣伏見徃年河決滑州曽議修塞當時公私事力未如今日貧虛然猶多聚物料誘率民財數年之間方能興役况今國用吿匱民力方疲且合商胡大決之洪流此自是一大役也鑿開横壠久廢之故道此又一大役也自横壠至海一千餘里埽岸久已廢壊頓須修緝此又一大役也徃年公私有力之時興大役尚須數年今倂三大役倉卒興於旱歲貧虛之際此其必不可者三也就令商胡可塞故道可廻猶宜審察天時人力之難為何况商胡未必可塞故道未必可廻哉臣聞鯀陻洪水九年無功禹得洪範五行之書知水潤下之性乃因水之流䟽決就下而水患乃息然則以大禹之神功不能障塞其流但能因而䟽決爾今欲逆水之性障而塞之奪洪河之正流斡以人力而廻注此大禹之所不能此其必不可者四也横壠陻塞已二十年商胡流決又亦數歲故道已平而難鑿安流巳久而難廻昨聞朝廷曽遣故樞宻直學士張奎計度功料極大近者再行檢計得功料全少功料少則所開淺狹淺狹則水勢難廻此其必不可者五也臣伏見國家累嵗災譴甚多其于京東變異尤大地貴安静動而有聲鉅嵎山摧海水摇蕩如此不止僅乎十年天地儆戒必不虛發臣謂變異所起之方尤宜加意防懼今乃欲於凶旱之年聚三十萬之大衆於變異最大之方臣恐地動山摇災禍自兹而始方今京東赤地千里饑饉之民正苦天災又聞河役將動徃徃伐桑拆屋無復生計流亡盜賊之患不可不虞欲望聖慈特降徳音速罷其事當荒歲務安人心徐詔有司詳審利害縱令河道可復乞俟豐年餘力漸次興為臣實庸愚本無逺見得於外論不敢不言謹具狀奏聞論修六塔河右臣伏見朝廷定議開修六塔河口囬水入横壠故道此大事也中外之臣皆知不便而未有肯為國家極言其利害者何哉盖其說有三一曰畏大臣二曰畏小人三曰無䇿今執政之臣用心於河事亦勞矣初欲試十萬人之役以開故道既又捨故道而修六塔未及興役遽又罷之已而終為言利者所勝今又復修然則其勢難於復止也夫以執政大臣銳意主其事而又有不可復止之勢固非一人口舌可回此所以雖知不便而罕肯言也李仲昌小人利口偽言衆所共惡今執政之臣既用其議必主其人且自古未有無患之河今河浸恩兾目下之患雖小然其患已形回入六塔將來之害雖大而其害未至夫以利口小人為大臣所主欲與之爭未形之害勢必難奪就使能奪其議則言者猶須獨任恩兾為患之責使仲昌得以為辭大臣得以歸罪此所以雖知不便而罕敢言也今執政之臣用心太過不思自古無無患之河直欲使河不為患若得河不為患雖竭人力猶當為之况聞仲昌利口詭辨謂費物少而用功不多不得不信為竒䇿於是決意用之今言者謂故道既不可復六塔又不可修詰其如何則又無䇿以取勝此所以雖知不便而罕肯言也衆人所不敢言而臣今獨敢言者臣謂大臣非有私仲昌之心也直欲興利除害爾若果知其為患愈大則豈有不回者哉至於顧小人之後患則非臣之所慮也且事欲知利害權重輕有不得已則擇其害少而患輕者為之此非明智之士不能也况治水本無竒䇿相地勢謹隄防順水性之所趨爾雖大禹不過此也夫所謂竒䇿者不大利則大害若循常之計雖無大利亦不至大害此明智之士善擇利者之所為也今言修六塔者竒䇿也然終不可成而為害愈大言順水治隄者常談也然無大害為國計者欲何所擇哉若謂利害不可必但聚大衆興大役勞民困國以試竒䇿而僥倖於有成臣謂雖執政之臣亦未必肯為也臣前已具言河利害甚詳而未䝉採聽今復略陳其大要惟陛下詔計議之臣擇之臣謂河水未始不為患今順已決之流治隄防於恩兾者其患一而遲塞商胡復故道者其患二而速開六塔以回今河者其患三而為害無涯自河決横壠以來大名金隄埽歲嵗増治及商胡再決而金隄益又加功獨恩兾之間自商胡決後議者貪建塞河之䇿未嘗留意於隄防是以今河水浸溢今若専意併力於恩兾之間謹治隄防則河患可禦不至為大害所謂其患一者十數年間今河下流淤塞則上流必有決處此一患而遲者也今欲塞商胡口使水歸故道治隄修埽功料浩大勞人費物困弊公私此一患也幸而商胡可塞故道復歸髙淤難行不過一二年間上流必決此二患而速者也今六塔河口雖云已有上下約然全塞大河正流為功不小又開六塔河道治二千餘里隄防移一縣兩鎮計其功費又大於塞商胡數倍其為困弊公私不可勝計此一患也幸而可塞水入六塔而東横流散溢濵棣徳博與齊州之界咸被其害此五州者素號富饒河北一路用財所仰令引水注之不惟五州之民破壞田産河北一路坐見貧虛此二患也三五年間五州凋弊河流注溢久又淤髙流行艱澀則上流必決此三患也所謂為害而無涯也今為國誤計者本欲除一患而反就三患此臣所不諭也至如六塔不能容大河横壠故道本以髙淤難行而商胡決今復驅而注之必横流而散溢自澶至海二千餘里隄埽不可卒修修之雖成又不能捍水如此等事甚多士無愚智皆所共知不待臣言而後悉也臣前未奉使契丹時已嘗具言故道六塔皆不可為惟治隄順水為得計及奉使徃來河北詢於知水者其說皆然雖恩兾之人今被水患者亦知六塔不便皆願且治恩兾隄防為是下情如此誰為上通臣既知其詳豈敢自黙伏乞聖慈特諭宰臣使更審利害速罷六塔之役差替李仲昌等不用選一二精幹之臣與河北轉運使副及恩兾州官吏相度隄防併力修治則今河之水必不至為大患且河水天災非人力可回惟當順導防捍之而已不必求竒䇿立難必之功以為小人僥兾恩賞之資也况功必不成後悔無及者乎臣言狂計愚惟陛下裁擇薦布衣蘇洵臣猥以庸虚叨塵侍從無所禆補常愧心顔竊慕古人薦賢推善之意以為為時得士亦報國之一端徃時自國家下詔書戒時文諷勵學者以近古盖自天聖迄今二十餘年通經學古履忠守道之士所得不可勝數而四海之廣不能無山巖草野之遺其自重者既伏而不出故朝廷亦莫得而聞此乃如臣等輩所宜求而上達也伏見眉州布衣蘇洵履行純固性識明達亦嘗一舉有司不中遂退而力學其論議精於物理而善識變權文章不為空言而期於有用其所撰權書衡論機䇿二十篇辭辨閎偉博於古而宜於今實有用之言非特能文之士也其人文行久為鄉閭所稱而守道安貧不營仕進苟無薦引則遂棄於聖時其所撰書二十篇臣謹隨狀上進伏望聖慈下兩制看詳如有可採乞賜甄録謹具狀奏聞伏候勑㫖舉蘇軾應制科右臣伏以國家開設科目以待雋賢又詔兩省之臣舉其所知各以聞達所以廣得人之路副仄席之求臣雖庸暗其敢不勉臣伏見新授河南府福昌縣主簿蘇軾學問通博姿識敏明文采爛然論議蠭出其行業修飭名聲甚逺臣今保舉堪應材識兼茂明於體用科欲望聖慈召付有司試其所對如有謬舉甘伏朝典舉章望之曾鞏王回充館職右臣猥以庸虛過䝉奬任竊惟古人報國之效無先薦賢雖知人之難愧於不廣而髙材實行亦莫多得苟有所見其敢黙然臣竊見秘書省校書郎章望之學問通博文辭敏麗不急仕進行義自修東南士子以為師範太平州司法叅軍曾鞏自為進士已有時名其所為文章流布逺邇志節髙爽自守不回前亳州衛真縣主簿王回學行純固論議精明尤通史傳姓氏之書可備顧問此三人者皆一時之秀宜被朝廷樂育之仁而或廢處江湖或沈淪州縣不獲聞達議者惜之其章望之曽鞏王回臣今保舉堪充館閣職任欲望聖慈特賜甄擢如後不如舉狀臣甘當同罪歐陽文粹巻十欽定四庫全書歐陽文粹巻十一宋陳亮編序送徐無黨草木鳥獸之為物衆人之為人其為生雖異而為死則同一歸於腐壞澌盡泯滅而已而衆人之中有聖賢者固亦生且死於其間而獨異于草木鳥獸衆人者雖死而不朽愈逺而彌存也其所以為聖賢者修之於身施之於事見之於言是三者所以能不朽而存也修於身者無所不獲施於事者有得有不得焉其見於言者則又有能有不能也施於事矣不見於言可也自詩書史記所傳其人豈必皆能言之士哉修於身矣而不施於事不見於言亦可也孔子弟子有能政事者矣有能言語者矣若顔回者在陋巷曲肱饑卧而已其羣居則黙然終日如愚人然自當時羣弟子皆推尊之以為不敢望而及乎後世更百千歲亦未有能及之者其不朽而存者固不待施於事况於言乎予讀班固藝文志唐四庫書目見其所列自三代秦漢以来著書之士多者至百餘篇少者猶三四十篇其人不可勝數而散亡磨滅百不一二存焉予竊悲其人文章麗矣言語工矣無異草木榮華之飄風鳥獸好音之過耳也方其用心與力之勞亦何異衆人之汲汲營營而忽焉以死者雖有遲有速而卒與三者同歸於泯滅夫言之不可恃也盖如此今之學者莫不慕古聖賢之不朽而勤一世以盡心於文字間者皆可悲也東陽徐生少從予學為文章稍稍見稱於人既去而與羣士試於禮部得髙第由是知名其文辭日進如水涌而山出予欲摧其盛氣而勉其思也故於其歸告以是言然予固亦喜為文辭者亦因以自警焉送曽鞏廣文曽生來自南豐入太學與其諸生羣進於有司有司歛羣材操尺度槩以一法考其不中者而棄之雖有魁壘拔出之材其一累黍不中尺度則棄不敢取幸而得良有司不過反同衆人之歎嗟愛惜若取捨非已事者諉曰有司有法奈不中何有司固不自任其責而天下之士亦不以責有司皆曰其不中法也不幸有司尺度一失守則徃徃失多而得少嗚呼有司所操果良法邪何其久而不思革也况若曾生之業其大者固已魁壘其於小者亦可以中尺度而有司棄之可怪也然曾生不非同進不罪有司告予以歸思廣其學而堅其守予初駭其文又壯其志夫農不咎歲而菑播是勤其水旱則已使一有穫則豈不多耶曾生橐其文數十萬言來京師京師之人無求曽生者然曾生亦不以干也予豈敢求生而生辱以顧予是京師之人既不求之而有司又失之而獨余得也於其行也遂見於文使知生者可以弔有司而賀余之獨得也送楊子聰士之仕於州郡者必視其地大小髙下之望以為輕重河南大府也叅軍雖卑以望而髙下之固與他州郡異矣然地大望髙居者皆將相名臣吏民閒坐而偶語道某相某將某官者常名斥而一二歲數之至於郎官御史方鎮牧守使人貴客由河南出者入不候於疆去不餞于郊途逢而不避市坐者不起豈素慢哉盖其見之習也彼視公卿大臣要官其易如此矧所謂參軍者耶其不羣嘲而隨侮之幸也參軍毎上府望門而趨吏摩以肩過不揖反就焉持刺執板求通姓名雖心負其所有欲進自達不可得其勢鬱鬱卑且賤反甚於他州郡故為之者未嘗樂也然其間能自以頭角頎然而出者鮮矣其才能之美非有異乎衆莫能也戸曹參軍楊子聰居府中常衣青衫騎破虎韉出入府門下人固輩視而槩易之居一歲相國彭城公薦之集賢學士謝公又薦之士之有文而賢者盡交之其能出其頭角矣若去而之他州郡不特頎然而出矣遂將傑然以獨立也子聰南人樂其土風今秩滿調於吏部必吏於南也吾見南之州郡有傑然而獨出者必楊子聦也送張唐民予讀周禮至於教民興學選賢命士之法未甞不輟書歎息以為三代之際士豈皆素賢哉當其王道備而習俗成仁義禮樂達於學孝慈友悌達於家居有教養之漸進有爵禄之勸苟一不勉則又有屏黜不齒戮辱之羞然則士生其間其勢不得不至於為善也豈必生知之賢及後世道缺學廢苟偽之俗成而忘其教養之具至於爵禄黜辱之法又失其方而不足以勸懼然則士生其間能自為善卓然而不惑者非其生知之性天所賦予其孰能至哉則凡所謂賢者其可貴于三代之士逺矣故善人尤少幸而有則徃徃飢寒困踣之不暇其幸者或艱而後通夫賢者豈必困且艱歟盖髙世則難合違俗則多窮亦其勢然也嗚呼人事修則天下之人皆可使為善士廢則雖天所賦予其賢亦困於時夫天非不好善其不勝於人力者其勢之然歟此所謂天人之理在於周易否泰消長之卦能通其說則自古賢聖窮達而禍福皆可知而不足怪秀才張生居青州其母賢而知書三子䘮其二獨生最賢行義聞於鄉而好學力為古文是謂卓然而不惑者也今年舉進士黜於有司母老而貧無以養可謂困且艱矣嗟乎予力既不能周於生而生尤好易常以講於予若歸而卒其業則天命之理人事之勢窮達禍福可以不動于其心雖然若生者豈終窮也哉安知其不艱而後通也哉送王陶六經皆載聖人之道而易著聖人之用吉凶得失動静進退易之事也其所以為之用者剛與柔也乾健坤順剛柔之大用也至於八卦之變六爻之錯剛與柔迭居其位而吉亨利旡咎凶厲悔吝之象生焉盖剛為陽為徳為君子柔為隂為險為小人自乾之初九為姤而上至於剥其卦五皆隂剥陽之卦也小人之道長君子静以退之時也自坤之初六為復而上至於夬其卦五皆剛決柔之卦也小人之道消君子動以進而用事之時也夫剛之為徳君子之常用也庇民利物功莫大焉其為卦過泰之三而四為大壯五為夬壯者壯也夬者決也四陽雖盛而猶有二隂然陽衆而隂寡則可用壯以攻之故其卦為壯五陽而一隂隂不足為直可決之而已故其卦為夬然則君子之用其剛也審其力視其時知隂險小人之必可去然後以壯而决之夫勇者可犯也强者可詘也聖人於壯決之用必有戒焉故大壯之彖辭曰大壯利貞其象辭曰君子非禮弗履夬之彖辭曰健而說決而和其彖辭曰居徳則忌以明夫剛之不可獨任也故復始而亨臨浸而長泰交而大壯以衆攻其寡夬乗其衰而决之夫君子之用其剛也有漸而不失其時又不獨任必以正以禮以說以和而濟之則功可成此君子動以進而用事之方也太原王陶字樂道好剛之士也常嫉世隂險之小人多居京師不妄與人遊力學好古以自信自守今其初仕於易得君子動以進之象故予為剛說以贈之大壯之初九曰壯于趾征凶夬之初九亦曰壯于趾徃不勝為咎以此見聖人之戒用剛也不獨於其彖象而又常深戒於其初嗚呼世之君子少而小人多君之力學好剛以蓄其志未始施之於事也今其徃尤宜慎乎其初送王聖紀前年五月大霖雨殺麥河溢東畿浸下田已而不雨至於八月菽粟死髙田三司有言前時溢博州民冒河為言得免租者萬計今歲秋當租懼民幸水旱因縁得妄免以虧兵食慎勑有司謹之朝廷因舉田令約束州縣吏無逺近皆望風惡民言水旱一以農田勑限甚者笞而絶之畿之民訴其縣不聽則訴於開封又不聽則相與聚於宣徳門外訴於宰相於是遣吏四出視諸縣視者還而或言災或言否然言否者十七八最後視者還言民實災而吏徒畏約束以苟自免爾天子聞之惻然盡蠲畿民之租余甞竊歎曰民生幸而為畿民且緩急近而易知也雨降于天河溢于地與赤日之出是三者之易見也前二三歲旱蝗相連朝廷歲隨其災之厚薄蠲其賦之多少至兵食不足則歲糴或入粟以爵而充之是在上者之愛人而仁人之心易惻也以易知之近言易見之事告易惻之仁然吏壅之幾不得達况四海之大幾萬里而逺事之難知不若霖潦赤日之易見者何數使上有易惻之心不得達于下下有思告之苦不得通於上者吏居其間而壅之爾可勝歎哉扶風為縣限關之西距京師在千里外民之不幸而事有隠㣲者何限其能生死曲直之者令與主簿尉三人而民之志得不壅而聞于州州不壅而聞及上縣不壅而民志通者令與主簿尉達之而已王君聖紀主簿於其縣聖紀好學有文佐是縣也始試為政焉故以其夫所素歎者告之章望之字校書郎章君甞以其名望之來請字曰願有所教使得以勉焉而自朂者予為之字曰表民而告之曰古之君子所以異乎衆人者言出而為民信事行而為世法其動作容貌皆可以表於民也故紘綖冕弁以為首容佩玉玦環以為行容衣裳黼黻以為身容手有手容足有足容揖讓登降獻酬俯仰莫不有容又見其寛柔温厚剛嚴果毅之色以為仁義之容服其服載其車立乎朝廷而正君臣出入宗廟而臨大事儼然人皆望而畏之曰此吾民之所尊也非民之知尊君子而君子者能自修而尊者也然而行不充于内徳不備於人雖盛其服文其容民不尊也名山大川一方之望也山川之嶽瀆天下之望也故君子之賢於一鄉者一鄉之望也賢於一國者一國之望也名烈著于天下者天下之望也功徳被于後世者萬世之望也孝慈友悌達于一鄉古所謂鄉先生者一鄉之望也春秋之賢大夫若隨之季良鄭之子産者一國之望也位于中而姦臣賊子不敢竊發于外如漢之大將軍出入將相朝廷以為輕重天下繫其安危如唐之裴丞相者天下之望也其人已没其事已久聞其名想其人若不可及者䕫龍稷契是也其功可以及百世其道可以師百王雖有聖賢莫敢過之者周孔是也此萬世之望而皆所以為民之表也傳曰其在賢者識其大者逺者章君儒其衣冠氣剛色仁好學而有志其絜然修乎其外而煇然充乎其内以發乎文辭則又辨博放肆而無涯是數者皆可以自擇而勉焉者也是固能識夫逺大者矣雖予何以朂焉弟因其志廣其說以塞請胡寅字寅之為言恭且畏之辭虞書寅賔出日寅餞納日云者堯命其臣羲和者修其官而史美之之文又曰夙夜惟寅云者舜勑其臣伯夷之辭也又曰同寅協恭和𠂻哉云者臯陶戒禹之言夫堯舜禹之事載於書者為萬世之法而其君臣之際相言語者如是是知恭恪畏慎以思其事雖聖人猶然尉氏胡君名寅以問於余將字之余以為名者古之人生而有别之稱爾若太甲盤庚仲壬者直識其次第而已至于左丘明者載魯大夫之語始謂命名有義而學者又以文王武王伯魚之類附其說者尤非也文王之世為商諸侯偶商不幸而紂為滛虐然猶生服事之豈其生也已有滅商自大之心而名昌其子始生又期以弑君而發其功業哉孔子生子適有饋鯉者遂名之若史魚孔鮒又有義者乎則是直為識别之稱未嘗有義也然考古人之命字者則似若有義葢將釋其名曰其字若此而已胡君曰我所以問其字者將知其寅者何謂然因考于古取堯舜之書常所道告之而字曰子畏云鄭荀改名三代之衰學廢而道不明然後諸子出自老子厭周之亂用其小見以為聖人之術止於此始非仁義而詆聖智諸子因之益得肆其異說至於戰國蕩而不反然後山淵齊秦堅白異同之論興聖人之學幾乎其息最後荀卿子獨用詩書之言貶異扶正著書以非諸子尤以勸學為急荀卿楚人甞以學干諸侯不用退老蘭陵楚人尊之及戰國平三代詩書未盡出漢諸大儒賈生司馬遷之徒莫不盡用荀卿子盖其為說最近於聖人而然也滎陽鄭昊少為詩賦舉進士已中第遂棄之曰此不足學也始從先生長者學問慨然有好古不及之意鄭君年尚少而性淳明輔以强力之志得其是者而師焉無不至也將更其名數以請予使之自擇遂改曰荀於是又見其志之果也夫荀卿者未甞親見聖人徒讀其書而得之然自子思孟子已下意皆輕之使其與游夏並進於孔子之門吾不知其先後也世之學者苟如荀卿可謂學矣而又進焉則孰能禦哉余既嘉君善自擇而慕焉因為之字曰叔希且以朂其成焉歐陽文粹巻十一欽定四庫全書歐陽文粹巻十二宋陳亮編序廖氏文集自孔子殁而周衰接乎戰國秦遂焚書六經於是中絶漢興盖久而後出其散亂磨滅既失其傳然後諸儒因得措其異說於其間如河圖洛書怪妄之尤甚者余甞哀夫學者知守經以篤信而不知偽說之亂經也屢為說以黜之而學者溺其久習之傳反駭然非余以一人之見決千歲不可考之是非欲奪衆人之所信徒自守而世莫之從也余以為自孔子没至今二千歲之間有一歐陽修者為是說矣又二千歲焉知無一人焉與脩同其說也又二千嵗將復有一人焉然則同者至于三則後之人不待千嵗而有也同予說者既衆則衆人之所溺者可勝而奪也夫六經非一世之書其將與天地無終極而存也以無終極視數千歲於其間頃刻爾是則余之有待於後者逺矣非汲汲有求於今世也衡山廖倚與余遊三十年已而出其兄偁之遺文百餘篇號朱陵編者其論洪範以為九疇聖人之法爾非有龜書出洛之事也余乃知不待千歲而有與余同於今世者始余之待于後世也兾有因余言而同者爾若偁者未甞聞余言盖其意有所合焉然則舉今之世固有不相求而同者矣亦何待於數千歳乎廖氏家衡山世以能詩知名於湖南而偁尤好古能文章其徳行聞于鄉里一時賢士皆與之遊以其不達而早死故不顯于世嗚呼知所待者必有時而獲知所畜者必有時而施苟有志焉不必有求而後合余嘉與偁不相求而兩得也於是乎書薛簡肅公文集君子之學或施之事業或見於文章而常患於難兼也盖遭時之士功烈顯于朝廷名譽光於竹帛故其常視文章為末事而又有不暇與不能者焉至於失志之人窮居隐約苦心危慮而極於精思與其有所感激發憤惟無所施於世者皆一寓於文辭故曰窮者之言易工也如唐之劉栁無稱於事業而姚宋不見於文章彼四人者猶不能於兩得况其下者乎惟簡肅公在真宗時以材能為名臣仁宗母后時以剛毅正直為賢輔其決大事定大議嘉謀讜論著在國史而遺風餘烈至今稱於士大夫公綘州正平人也自少以文行推於鄉里既舉進士獻其文百軸於有司由是名動京師其平生所為文至八百餘篇何其盛哉可謂兼於兩得也公之事業顯矣其於文章氣質深純而勁正盖發於其志故如其為人公有子直孺早卒無後以其弟之子仲孺公期為後公之文既多而徃徃流散於人間公期能力收拾盖自公薨後三十年始克類次而集之為四十巻公期可謂能世其家者也嗚呼公為有後矣梅聖俞注孫子後世所傳孫武十三篇多用曹公杜牧陳皡注號三家孫子余頃與撰四庫書目所見孫子注者尤多武之書本於兵兵之術非一而以不窮為竒宜其說者之多也凡人之用智有短長其施設各異故或膠其說於偏見然無出所謂三家者三家之注皡最後其說時時攻牧之短牧亦慨然最喜論兵欲試而不得者其學能道春秋戰國時事甚博而詳然前世言善用兵稱曹公曹公甞與董吕諸袁角其力而勝之遂與吳蜀分漢而王傳言魏之諸將出兵千里毎坐計勝敗授其成筭諸將用之十不失一一有違者兵輒敗北故魏世用兵悉以新書從事其精於兵也如此牧謂曹公於注孫子尤略盖惜其所得自為一書是曹公悉得武之術也然武甞以其書干吳王闔閭闔閭用之西破楚北服齊晉而霸諸侯夫使武自用其書止于强伯及曹公用之然亦終不能滅吳蜀豈武之術盡於此乎抑用之不極其能也後之學者徒見其書又各牽於已見是以注者雖多而少當也獨吾友聖俞不然甞評武之書曰此戰國相傾之說也三代王者之師司馬九伐之法武不及也然亦愛其文略而意深其行師用兵料敵制勝亦皆有法其言甚有次序而注者汨之或失其意乃自為注凡膠於偏見者皆抉去傅以已意而發之然後武之說不汨而明吾知此書當與三家並傳而後世取其說者徃徃於吾聖俞多焉聖俞為人謹質温恭衣冠進趨眇然儒者也後世之視其書者與太史公疑張子房為壯夫何異韻緫倕工於為弓而不能射羿與逄䝉天下之善射者也奚仲工於為車而不能御王良造父天下之善御者也此荀卿子所謂藝之至者不兩能信哉儒者學乎聖人聖人之道直以簡然至其曲而暢之以通天下之理以究隂陽天地人鬼事物之變化君臣父子吉凶生死凡人之大倫則六經不能盡其說而七十子與孟子荀揚之徒各極其辨而莫能殫焉夫以孔子之好學而其所道者自堯舜而後則詳之其前盖略而弗道其亦有所不暇者歟儒之學者信哉逺且大而用功多則其有所不暇者宜也文字之為學儒者之所用也其為精也有聲形曲直毫釐之别音響清濁相生之類五方言語風俗之殊故儒者莫暇精之其有精者則徃徃不能乎其它是以學者莫肯捨其所事而盡心乎此所謂不兩能者也必待乎用心専者而或能之然後儒者有以取焉洛僧鑒聿為韻緫五篇推子母輕重之法以定四聲考求前儒之失辨正五方之訛顧其用心之精可謂入於忽㣲若櫛之於髪績之於絲雖細且多而條理不亂儒之學者莫能難也鑒聿通於易能知大演之數又學乎隂陽地理黄帝歧伯之書其尤盡心者韻緫也世本儒家子少為浮圖入武當山徃來江漢之旁十餘年不妄與人交有不可其意雖王公大人亦莫肯顧聞士有一藝雖千里必求之介然有古獨行之節所謂用心専者也宜其學必至焉耳浮圖之書行乎世者數百萬言其文字雜以夷夏讀者罕得其真徃徃就而正焉鑒聿之書非獨有取於吾儒亦欲傳於其徒也集古録目物甞聚於所好而常得于有力之强有力而不好好之而無力雖近且易有不能致之象犀虎豹蠻夷山海殺人之獸然其齒角皮革可聚而有也玉出崑崙流沙萬里之外經十餘譯乃至乎中國珠出南海常生深淵採者腰絙而入水形色非人徃徃不出則下飽蛟魚金礦於山鑿深而穴逺篝火餱糧而後進其崖崩窟塞則遂葬於其中者率常數十百人其逺且難而又多死禍常如此然而金玉珠璣世常兼聚而有也凡物好之而有力則無不至也湯盤孔鼎岐陽之鼓岱山鄒嶧㑹稽之刻石與夫漢魏已來聖君賢士桓碑彛器銘詩序記下至古文籀篆分𨽻諸家之字書皆三代以來至寶怪竒偉麗工妙可喜之物其去人不逺其取之無禍然而風霜兵火湮淪磨滅散棄於山崖墟莽之間未甞收拾者由世之好者少也幸而有好之者又其力或不足故僅得其一二而不能使其聚也夫力莫如好好莫如一予性顓而嗜古凡世人之所貪者皆無欲於其間故得一其所好於斯好之已篤則力雖未足猶能致之故上自周穆王以來下更秦漢隋唐五代外至四海九州名山大澤窮崖絶谷荒林破塜神仙鬼物詭怪所傳莫不皆有以為集古録以為轉冩失真故因其石本軸而藏之有巻秩次第而無時世之先後盖其取多而未已故隨其所得而録之又以為聚多而終必散乃撮其大要别為録目因并載夫可與史傳正其闕謬者以傳後學庶益於多聞或譏予曰物多則其勢難聚聚久而無不散何必區區於是哉予對曰足吾所好玩而老焉可也象犀金玉之聚其能果不散乎予固未能以此而易彼也外制集慶厯三年春丞相吕夷簡病不能朝上既更用大臣銳意天下事始用諌官御史䟽追還夏竦制書既而召韓琦范仲淹於陜西又除富弼樞宻副使弼仲淹琦皆惶恐頓首辭讓至五六不已手詔趣琦等就道甚急而弼方且入求對以辭不得見遣中貴人趣送閤門使即受命嗚呼觀琦等之所以讓上之所以用琦等者可謂聖賢相遭萬世一遇而君臣之際何其盛也於是時天下之士孰不願為材邪顧予何人亦與其選夏四月召自滑臺入諫院冬十二月拜右正言知制誥是時夏人雖數請命而西師尚未解嚴京東累歲盜賊最後王倫暴起沂州轉劫江淮之間而張海郭貌山等亦起商鄧以驚京西州縣之吏多不稱職而民弊矣天子方慨然勸農桑興學校破去前例以不次用人哀民之困而欲除其蠧吏知磨勘法久之弊而思别材不肖以進賢能患百職之不修而申行賞罰之信盖欲修法度矣予時雖掌誥命猶在諫職常得奏事殿中從容盡聞天子所以更張庶事憂閔元元而勞心求治之意退得載于制書以諷曉訓勑在位者然予方與修祖宗故事又修起居注又修編勑日與同舍論議治文書所省不一而除目所下率不一二時已廹丞相出故不得專一思慮工文字以盡導天子難諭之意而復誥命於三代之文嗟夫學者文章見用于世鮮矣況得施於朝廷而又遭人主致治之盛若脩之鄙使竭其材猶恐不稱而况不能專一其職此予所以常遺恨於斯文也明年秋予出為河北轉運使又明年春權知成徳軍事事少間發嚮所作制草而閱之雖不能盡載明天子之意於其所述百得一二足以章示後世盖王者之訓在焉豈以予文之鄙而廢也於是録之為三巻予自直閣下儤直八十始滿不數日奉使河東還即以來河北故其所作纔一百五十餘篇云内制集昔錢思公甞以謂朝廷之官雖宰相之重皆可雜以他才處之惟翰林學士非文章不可思公自言為此語頗取怒於達官然亦自負以為至論今學士所作文書多矣至於青辭齋文必用老子浮圖之說祈禳秘祝徃徃近於家人里巷之事則制詔取便於宣讀常拘以世俗所謂四六之文其類多如此然則果可謂之文章者歟予在翰林六年中間進拜二三大臣皆適不當直而天下無事四夷和好兵革不用凡朝廷之文所以指麾號令訓戒約束自非因事無以發明矧予中年早衰意思零落以非工之作又無所遇以發焉其屑屑應用拘牽常格卑弱不振宜可羞也然今文士尤以翰林為榮選予既罷職院吏取予直草以日次之得四百餘篇因不忍棄况其上自朝廷内及宫禁下暨蠻夷海外事無不載而時政記日厯與起居郎舍人有所略而不記未必不有取於斯焉嗚呼予且老矣方買田淮潁之間若夫涼竹簟之暑風曝茅簷之冬日睡餘支枕念昔平生仕宦出處顧瞻玉堂如在天上因覽遺藁見其所載職官名氏以較其人盛衰先後孰在孰亡足以知榮寵為虛名而資笑談之一噱也亦因以誇於田夫野老而已歐陽文粹巻十二欽定四庫全書歐陽文粹巻十三宋陳亮編序帝王世次圖堯舜禹湯文武此六君子者可謂顯人矣而後世猶失其傳者豈非以其逺也哉是故君子之學不窮逺以為能而闕其不知慎所傳以惑世也方孔子時周衰學廢先王之道不明而異端之說並起孔子患之乃修正詩書史記以止紛亂之說而欲其傳之信也故略其逺而詳其近於書斷自唐虞以來著其大事可以為世法者而已至於三皇五帝君臣世次皆未嘗道者以其世逺而慎所不知也孔子既沒異端之說復興周室亦益衰亂接乎戰國秦遂焚書先王之道中絶漢興久之詩書稍出而不完當王道中絶之際竒書異說方充斥而盛行其言徃徃反自託於孔子之徒以取信於時學者既不備見詩書之詳而習傳盛行之異說以世無聖人以為質而不自知其取捨真偽至有博學好竒之士務多聞以為勝者於是盡集諸說而論次初無所擇而惟恐遺之也如司馬遷之史記是矣以孔子之學上述前世止於堯舜著其大略而不道其前遷逺出孔子之後而乃上述黄帝以來又詳悉其世次其不量力而務勝宜其失之多也遷所作本紀出於大戴禮世本諸書今依其說圖而考之堯舜夏商周皆同出於黄帝堯之崩也下傳其四世孫舜舜之崩也復上傳其四世祖禹而舜禹皆夀百歳稷契於髙辛為子乃同父異母之兄弟今以其世次而下之湯與王季同世湯下傳十六世而為紂王季下傳一世而為文王二世而為武王是文王以十五世祖臣事十五世孫紂而武王以十四世祖伐十四世孫而代之王何其繆哉嗚呼堯舜禹湯文武之道百王之取法也其盛徳大業見於行事而後世所欲知者孔子皆已論著之矣其久逺難明之事後世不必知不知不害為君子者孔子皆不道也夫孔子所以為聖人者其智知所取捨皆如此傳易圖孟子曰盡信書不如無書夫孟子好學者豈獨忽於書哉盖其自傷不得親見聖人之作而傳者失其真莫可考正而云也然豈獨無書之如此余讀經解至其别易曰差若毫釐謬以千里之説又讀今周易有何謂子曰者至其繫辭則又曰聖人設卦繫辭焉欲考其真而莫可得然後知孟子之歎盖有激云爾說者言當秦焚書時易以卜筮得獨不焚其後漢興他書雖出皆多殘缺而易經以故獨完然如經解所引考於今易亡之豈今易亦有亡者耶是亦不得為完書也昔孔子門人追記其言作論語書其首必以子曰者所以别夫子與弟子之言又其言非一事其事非一時文聮屬而言難次第故每更一事必以子曰以起之若文言者夫子自作不應自稱子曰又其作於一時文有次第何假子曰以發之乃知今周易所載非孔子文言之全篇也盖漢之易師擇取其文以解卦體至其有所不敢則文斷而不屬故以子曰起之也其先言何謂而後言子曰者乃講師自為荅問之言爾取卦體以為荅也亦如公羊穀梁傳春秋先言何曷而後導其師之所傳以為傳曰今上繫凡有子曰者亦皆講師之説也然則今易皆出乎講師臨時之說矣幸而講師所引者得載於篇不幸其不及引者其亡豈不多邪嗚呼厯弟子之相傳經講師之去取不徒存者不完而其偽謬之失其可究耶夫繫者有所繫之謂也故曰繫辭焉以斷其吉凶是故謂之爻言其為辭各聮屬其一爻者也是則孔子専指爻辭為繫辭而今乃以孔子賛易之文為上下繫辭者何其謬也卦爻之辭或以為文王作或以為周公作孔子言聖人設卦繫辭焉是斥文王周公之作為繫辭不必復自名其所作又為繫辭也况其文乃概言易之大體雜論易之諸卦其辭非有所繫不得謂之繫辭也必然自漢諸儒已有此名不知從何而失之也漢去周最近不應有失然漢所為繫辭者得非不為今之繫辭乎易需之辭曰需于血出自穴艮之辭曰艮其限列其夤睽之辭曰見豕負塗載鬼一車是皆險怪竒絶非世常言無為有訓故考證而學者出其臆見隨事為解果得聖人之㫖邪文言繫辭有可考者其證如此而其非世常言無可考者又可知矣今徒從夫臆出之說果可盡信之邪此孟子所歎其不如亡者也易之傳注比他經為尤多然止於王弼其後雖有述者不必皆其授受但其傳之而已大抵易至漢分為三有田何之易焦贛之易費直之易田何之易傳自孔子有上下二篇又有彖象繫辭文言說卦等自為十篇而有章句凡學有章句者皆祖之田氏焦贛之易無所傳授自得乎隠者之學専於隂陽占察之術凡學隂陽占察者皆祖之焦氏費直之易亦無所授又無章句惟以彖象文言等十篇解上下經凡以彖象文言等參入卦中者皆祖之費氏田焦之學廢於漢末費氏獨興遞傳至鄭康成而王弼所注或用康成之說是弼即鄭本而為注今行於世者惟有王弼易其源出於費氏也孔子之古經亡矣詩圖周之詩自文王始成王之際頌聲興焉周之盛徳之極文王之詩三十七篇其二十三篇繫之周公召公為周南召南其八篇為小雅六篇為大雅武王之詩六篇四篇為小雅二篇在召南之風成王之詩五十三篇其十篇為小雅十二篇為大雅三十一篇為頌是為詩之正經其後二世昭王立而周道微闕又六世厲王政益衰變雅始作厲王死於彘天下無君周公召公行政謂之共和凡十四年而厲王之下太子宜臼遷於洛邑號東周周之室益微而平王之詩貶為風下同列國至於桓莊而詩止矣初成王立周公攝政管蔡作亂周公及其大夫作詩七篇周之太史以為周公詩主道豳國公劉太王之事故繫之豳謂國變風而諸侯之詩無正風其變風自懿王始作懿王時齊風始變夷王時衛風始變次厲王時陳風始變厲王崩周召共和唐風始變次宣王時秦風始變至平王時鄭風始變惠王時曹風始變陳最後至頃王時猶有靈公之詩於是止矣盖自文至頃凡二十世王澤竭而詩不作今鄭之詩次比考於舊史先後不同周召王豳皆出於周邶􅅠合於衛檜魏世家絶其可考者七國而已陳齊衛晉曹鄭魏此變風之先後也周召邶􅅠衛王鄭齊豳秦魏唐陳檜曹此孔子未刪詩之前季札所聴周樂次第也周召邶􅅠衛王鄭齊魏唐秦陳檜曹􅃎此今詩之次第也考其得封之先後為國之大小與其詩作之時皆失其次說者莫能究焉其外魯之頌四篇商頌五篇鄭康成以為魯得用天子之禮樂故有頌而商頌至孔子之時存者五篇而夏頌已亡故録魯詩以備三頌著為後王之法監三代之成功法莫大於夏矣康成所作詩譜圖自共和而後始得春秋次序今其圖亡今略準鄭遺說而依其次第推之以見前儒之得失今既依鄭為圖故風雅變王與其序所不言而說者推定世次皆且從鄭之意其所失者可指而見焉司馬遷謂古詩三千餘篇孔子刪之存者三百鄭學之徒皆以遷說之謬言古詩雖多不容十分去九以予考之遷說然也何以知之今書傳所載逸詩何可數焉以圖推之首更十君而取其一篇者又有二十餘君而取其一君由是言之何啻乎三千詩三百一十一篇亡者六篇存者三百五篇云詩譜補亡歐陽子曰昔者聖人已沒六經之道幾熄於戰國而焚棄於秦自漢已來收拾亡逸發明遺義而正其訛繆得以粗備傳於今者豈一人之力哉後之學者因迹前世之所傳而較其得失或有之矣若使徒抱焚餘殘脫之經倀倀於去聖千百年後不見先儒中間之說而欲特立一家之學者果有能哉吾未之信也然則先儒之論苟非詳其終始而牴牾質於聖人而悖理害經之甚有不得已而後改易者何必徒為異論以相訾也毛鄭於詩其學亦已博矣予嘗依其箋傳考之於經而證以序譜惜其不合者頗多盖詩述商周自生民𤣥鳥上陳稷契下迄陳靈公千五六百歳之間旁及列國君臣世次國地山川封域圖牒鳥獸草木魚蟲之名與其風俗善惡方言訓故盛衰治亂美刺之由無所不載然則孰能無失於其間哉予疑毛鄭之失既多然不敢輕為改易者意其為說不止於箋傳而恨已不得盡見二家之書未能徧通其㫖夫不盡見其書而欲折其是非猶不盡人之辭而欲斷其訟之曲直其能果於自決乎其能使之必服乎世言鄭氏詩譜最詳求之久矣不可得雖崇文總目秘書所藏亦無之慶厯四年奉使河東至於絳州偶得焉其文有注而不見名氏然首尾殘缺自周公致太平已上皆亡之其國譜旁行尤易為訛舛悉皆顛倒錯亂不可復考凡詩雅頌兼列商魯其正變之風十有四國而其次比莫詳其義惟封國變風之先後不可以不知周召王􅃎同出於周邶􅅠并於衛檜魏無世家其可考者陳齊衛晉曹鄭秦此封國之先後也􅃎齊衛檜陳唐秦鄭魏曹此變風之先後也周南召南邶􅅠衛王鄭齊􅃎秦魏唐陳曹此孔子未刪詩之前周太師樂歌之次第也周召邶􅅠衛王檜鄭齊魏唐秦陳曹􅃎此鄭氏詩譜次第也黜檜後陳此今詩次比也初予未見鄭譜嘗略考春秋史記本紀世家年表而合以毛鄭之說為詩圖十四篇今因取以補鄭譜之亡者足以見二家所說世次先後甚備因據而求其得失較然矣而仍存其圖庶幾以見予於鄭氏之學盡心焉耳夫盡其說而有所不通然後得以論正予豈好為異論者哉凡補其譜十有五補其文字二百七增損塗乙改正者三百八十三而鄭氏之譜復完矣譜序自周公致太平已上皆亡其文予取孔頴達正義所載之文補足因為之注自周公已下即用舊注云歐陽文粹巻十三欽定四庫全書歐陽文粹巻十四宋陳亮編記吉州學慶厯三年秋天子開天章閣召政事之臣八人問治天下其要有幾施於今者宜何先使坐而書以對八人者皆震恐失位俯伏頓首言此非愚臣所能及唯陛下所欲為則天下幸甚於是詔書屢下勸農桑責吏課舉賢才其明年三月遂詔天下皆立學置學官之員然後海隅徼塞四方萬里之外莫不皆有學嗚呼盛矣學校王政之本也古者致治之盛衰視其學之興廢記曰國有學術有序黨有庠家有塾此三代極盛之時大備之制也宋興盖八十有四年而天下之學始克大立豈非盛美之事須其久而後至於大備歟是以詔下之日臣民喜幸而奔走執事者以後為羞其年十月吉州之學成州舊有夫子廟在城之西北今知州事李侯寛之至也謀與州人遷而大之以為學舎事方上請而詔已下學遂以成李侯治吉敏而有方其作學也吉之士率其私錢一百五十萬以助用人之力積二萬二千工而人不以為勞其良材堅甓之用凡二十二萬三千五百而人不以為多學有堂筵齋講有藏書之閣有賔客之位有游息之亭嚴嚴翼翼壯偉閎耀而人不以為侈既成而來學者常三百餘人予世家於吉而濫官於朝進不能賛揚天子之盛美退不得與諸生揖讓乎其中然予聞教學之法本於人性磨揉遷革使趨於善其勉於人者勤其入於人者漸善教者以不倦之意須遲久之功至於禮讓興行而風俗純美然後為學之成今州縣之吏不得久其職而躬親於教化也故李侯之績及於學之立而不及待其成惟後之人毋廢慢天子之詔而怠以中止幸予他日因得歸榮故鄉而謁於學門将見吉之士皆道徳明秀而可為公卿問於其俗而婚喪飲食皆中禮節入於其里而長幼相孝慈於其家行於其郊而少者扶其羸老壯者代其負荷於道路然後樂學之道成而得時從先生耆老席于衆賔之後聽鄉樂之歌飲獻酬之酒以詩頌天子太平之功而周覽學舎思詠李侯之遺愛不亦美哉故於其始成也刻辭於石而立諸其廡以俟穀城夫子廟釋奠釋菜祭之略者也古者士之見師以菜為摯故始入學者必釋菜以禮其先師其學官四時之祭乃皆釋奠釋奠有樂無尸而釋菜無樂則其又略也故其禮亡焉而今釋奠幸存然亦無樂又不徧舉於四時獨春秋行事而已記曰釋奠必有合樂國有故則否謂凡有國各自祭其先聖先師若唐虞之蘷伯夷周之周公魯之孔子其國之無焉者則必合於鄰國而祭之然自孔子沒後之學者莫不宗焉故天下皆尊以為先聖而後世無以易學校廢乆矣學者莫知所師又取孔子門人之髙弟曰顔回者而配焉以為先師隋唐之際天下州縣皆立學置學官生員而釋奠之禮遂以著令其後州縣學廢而釋奠之禮吏以其著令故得不廢學廢矣無所從祭則皆廟而祭之荀卿子曰仲尼聖人之不得勢者也然使其得勢則為堯舜矣不幸無時而沒特以學者之故享弟子春秋之禮而後之人不推所謂釋奠者徒見官為立祠而州縣莫不祭之則以為夫子之尊由此為盛甚者乃謂生雖不得位而沒有所享以為夫子榮謂有徳之報雖堯舜莫若何其謬論者歟祭之禮以迎尸酌鬯為盛釋奠薦饌直奠而已故曰祭之略者其事有樂舞授器之禮今又廢則於其略者又不備焉然古之所謂吉凶鄉射賔燕之禮民得而見焉者今皆廢失而州縣幸有社稷釋奠風雨雷師之祭民猶得以識先王之禮器焉其牲酒器幣之數升降俯仰之節吏又多不能習至其臨事舉多不中而色不莊使民無所瞻仰見者怠焉因以為古禮不足復用非師古好學者莫肯盡心焉穀城令狄君栗為其邑未逾時脩文宣王廟易於縣之左大其正位為學舎於其旁藏九經書率其邑之子弟興於學然後考制度為俎豆籩篚罇爵簠簋凡若干以與其邑人行事宋興於今八十年天下無事方脩禮樂尊儒術以文太平之功以為王爵未足以尊夫子又加至聖之號以褒崇之講正其禮下於州縣而吏或不能喻上之意凡有司簿書之所不責者謂之不急穀城縣政久廢狄君居之朞月稱治又能遵國典脩禮興學急其有司所不責者諰諰然惟恐不及可為有志之士矣仁宗御飛白治平四年夏五月余将赴亳假道于汝隂因得閲書於子履之室而雲章爛然輝映日月為之正冠肅容再拜而後敢仰視盖仁宗皇帝之御飛白也曰此寳文閣之所藏也胡為於子之室乎子履曰曩者天子宴從臣於羣玉而賜以飛白余幸得與賜焉予窮於世久矣少不悦於時人流離竄斥十有餘年而得不老死江湖之上者盖以遭時清明天子嚮學樂育天下之材而不遺一介之賤使得與羣賢並遊於儒學之館而天下無事歳時豐登民物安樂天子優㳺清閒不邇聲色方與羣臣從容於翰墨之娱而余於斯時竊獲此賜非惟一介之臣之榮遇亦朝廷一時之盛事也子其為我志之余曰仁宗之徳澤涵濡於萬物者四十餘年雖田夫野老之無知猶能悲歌思慕於隴畆之間而况儒臣學士得望清光䝉恩寵登金門而上玉堂者乎於是相與泫然流涕而書之夫玉韞石而珠藏淵其光氣常見於外也故山輝如白虹水變而五色者至寳之所在也今賜書之藏於子室也吾知将有望氣者言榮光起而屬天者必賜書之所在也御書閣醴陵縣東二十里有宫曰登真其前有山世傳仙人王喬鍊藥於此唐開元間神仙道家之説興天子為書六大字賜而揭焉太宗皇帝時詔求天下前世名山異迹而尤好書法聞登真有開元時所賜字甚竒乃取至京師閲焉已而還之又賜御書飛白字使藏焉其後登真大火獨飛白書存康定元年道士彭知一探其私箧以市工材悉復官之舊建樓若干尺以藏賜書予之故人處士任君為予言其事來乞文以志凡十餘請而不懈予所領職方悉掌天下圖書考圖驗之醴陵老佛之居凡八十而所謂登真者其説皆然乃為之記夫老與佛之學皆行於世久矣為其徒者常相訾病若不相容於世二家之説皆見斥於吾儒宜其合勢并力以為拒守而乃反自相攻惟恐不能相弱者何哉豈其死生性命所持之説相盭而然邪故其代為興衰各繫於時之好惡雖善辯者不能合二説而一之至其好大宫室以矜世人則其為事同焉而佛能箝人情而鼓以禍福人之趣者常衆而熾老氏獨好言清浄逺去靈仙飛化之術其事㝠深不可質究則其為當以淡泊無為為務故凡佛氏之動搖興作為力甚易而道家非遭人主之好尚不能獨興其間能自力而不廢者豈不賢於其徒者哉知一是已晝錦堂仕宦而至将相富貴而歸故鄉此人情之所榮而今昔之所同也盖士方窮時困阨閭里庸人孺子皆得易而侮之若季子不禮於其嫂買臣見棄於其妻一旦髙車駟馬旗旄導前而騎卒擁後夾道之人相與駢肩累迹瞻望咨嗟而所謂庸夫愚婦者奔走駭汗羞愧俯伏以自悔罪於車塵馬足之間此一介之士得志當時而意氣之盛昔人比之衣錦之榮者也惟大丞相衛國公則不然公相人也世有令徳為時名卿自公少時已擢髙科登顯仕海内之士聞下風而望餘光者盖亦有年矣所謂将相而富貴皆公所宜素有非如窮阨之人僥倖得志於一時出於庸夫愚婦之不意以驚駭而夸耀之也然則髙牙大纛不足為公榮桓圭衮冕不足為公貴惟徳被生民而功施社稷勒之金石播之聲詩以耀後世而垂無窮此公之志而士亦以此望於公也豈止夸一時而榮一鄉哉公在至和中嘗以武康之節來治於相乃作晝錦之堂於後圃既又刻詩於石以遺相人其言以快恩讎矜名譽為可薄盖不以昔人所夸者為榮而以為戒於此見公之視富貴為何如而其志豈易量哉故能出入将相勤勞王家而夷險一節至於臨大事決大議垂紳正笏不動聲色而措天下於泰山之安可謂社稷之臣矣其豐功盛烈所以銘彛鼎而被弦歌者乃邦家之光非閭里之榮也余雖不獲登公之堂幸嘗竊誦公之詩樂公之志有成而喜為天下道也於是乎書有美堂嘉祐二年龍圖閣直學士尚書吏部郎中梅公出守於杭於其行也天子寵之以詩於是始作有美之堂盖取賜詩之首章而名之以為杭人之榮然公之甚愛斯堂也雖去而不忘今年自金陵遣人走京師命予誌之其請至六七而不倦予乃為之言曰夫舉天下之至美與其樂有不得而兼焉者多矣故窮山水登臨之美者必之乎寛閒之野寂寞之鄉而後得焉覽人物之盛麗夸都邑之雄富者必據乎四達之衝舟車之㑹而後足焉盖彼放心於物外而此娛意於繁華二者各有適焉然其為樂不得而兼也今夫所謂羅浮天台衡嶽廬阜洞庭之廣三峽之險號為東南竒偉秀絶者乃皆在乎下州小邑僻陋之邦此幽潜之士窮愁放逐之臣之所樂也若乃四方之所聚百貨之所交物盛人衆為一都㑹而又能兼有山水之美以資富貴之娱者惟金陵錢塘然二邦皆僣竊於亂世及聖宋受命海内為一金陵以後服見誅今其江山雖在而頽垣廢址荒煙野草過而覽者莫不為之躊躇而悽愴獨錢塘自五代時知尊中國效臣順及其亡也頓首請命不煩干戈今其民幸富完安樂又其習俗工巧邑屋華麗盖十餘萬家環以湖山左右映帶而閩商海賈風帆浪舶出入於江濤浩渺煙雲杳靄之間可謂盛矣而臨是邦者必皆朝廷公卿大臣若天子之侍從又有四方逰士為之賔客故喜占形勝治亭榭相與極逰覽之娱然其於所取有得於此者必有遺於彼獨所謂有美堂者山水登臨之美人物邑居之繁一寓目而盡得之盖錢塘兼有天下之美而斯堂者又盡得錢塘之美焉宜乎公之甚愛而難忘也梅公清慎好學君子也視其所好可以知其人焉至喜堂峽州治夷陵地濵大江雖有椒漆紙以通商賈而民俗儉陋常自足無所仰於四方販夫所售不過鱐魚腐鮑民所嗜而已富商大賈皆無為而至地僻而貧故夷陵為下縣而峽為小州州居無郭郛通衢不能容車馬市無百貨之列而鮑魚之肆不可入雖邦君之過市必常下乘掩鼻以疾趨而民之列處竈廩匽井無異位一室之間上父子而下畜豕其覆皆用茅竹故歳常火災而俗信鬼神其相傳曰作瓦屋者不利夷陵者楚之西境昔春秋書荆以狄之而詩人亦曰蠻荆豈其陋俗自古然歟景祐二年尚書駕部貟外郎朱公治是州始樹木增城柵甓南北之街作市門市區又教民為瓦屋别竈廩異人畜以變其俗既又命夷陵令劉光裔治其縣起勑書樓飾㕔事新吏舍三年夏縣功畢某有罪來是邦朱公於某有舊且哀其以罪而來為至縣舍擇其㕔事之東以作斯堂度為䟽絜髙明而日居之以休其心堂成又與賔客偕至而落之夫罪戾之人宜棄惡地處窮險使其憔悴憂思而知自悔咎今乃賴朱公而得善地以偷宴安頑然使忘其有罪之憂是皆異其所以來之意然夷陵之僻陸走荆門襄陽至京師二十有八驛水道大江絶淮抵汴東水門五千五百有九十里故為吏者多不欲逺來而居者徃徃不得代至歳滿或自罷去然不知夷陵風俗朴野少盜爭而令之日食有稻與魚又有橘柚茶筍四時之味江山美秀而邑居繕完無不可愛是非惟有罪者之可以忘其憂而凡為吏者莫不始來而不樂既至而後喜也作至喜堂記藏其壁夫令雖卑而有土與民宜志其風俗變化之善惡使後來者有考焉爾歐陽文粹巻十四欽定四庫全書歐陽文粹巻十五宋陳亮編記峴山亭峴山臨漢上望之隠然盖諸山之小者而其名特著於荆州者豈非以其人哉其人謂誰羊祜叔子杜預元凱是已方晉與吴以兵爭常倚荆州以為重而二子相繼於此遂以平吳而成晉業其功烈已盖於當世矣至於風流餘韻藹然被於江漢之間者至今人猶思之而於思叔子也尤深盖元凱以其功而叔子以其仁二子所為雖不同然皆足以垂於不朽余頗疑其反自汲汲於後世之名者何哉傳言叔子嘗登兹山慨然語其屬以為此山常在而前世之士皆已湮滅於無聞因自顧而悲傷然獨不知兹山待已而名著也元凱銘功於二石一置兹山之上一投漢水之淵是知陵谷有變而不知石有時而磨滅也豈皆自喜其名之甚而過為無窮之慮歟将自待者厚而所思者逺歟山故有亭世傳以為叔子之所遊止也故其屢廢而復興者由後世慕其名而思其人者多也熈寧元年余友人史君中煇以光禄卿來守襄陽明年因亭之舊廣而新之周以回廊之壮又大其後軒使與亭相稱君知名當世所至有聲襄人安其政而樂從其遊也因以君之官名其後軒為光禄堂又欲紀其事於石以與叔子元凱之名並傳於久逺君皆不能止也乃來以記屬於余余謂君知慕叔子之風而襲其遺迹則其為人與其志之所存者可知矣襄人愛君而安樂之如此則君之為政於襄者又可知矣此襄人之所欲書也若其左右山川之勝勢與夫草木雲煙之杳靄出沒於空曠有無之間而可以備詩人之登髙寫離騷之極目者宜其覽者自得之至於亭屢廢興或自有記或不必究其詳者皆不復道先春亭景祐二年秋清河張侯以殿中丞來守泗上既至問民之所素病而治其尤暴者曰暴莫大於淮越明年春作城之外堤因其舊而廣之度為萬有九千二百尺用人之力八萬五千泗之民曰此吾利也而大役焉然人力出於州兵而石出乎南山作大役而民不知是為政者之私我也不出一力而享大利不可相與出米一千三百石以食役者堤成髙三十三尺土實石堅捍暴備災可久而不壊既曰泗四達之州也賔客之至者有禮於是因前蒋侯堂之亭新之為勞餞之所曰思邵亭且推其美於前人而志邦人之思也又曰泗天下之水㑹也歳漕必廩於此於是治常豐倉西門二夾室一以視出納曰某亭一以為舟者之寓舍曰通漕亭然後曰吾亦有所休乎乃築州署之東城上為先春亭以臨淮水而望西山是歳秋予貶夷陵過泗上於是知張侯之善為政也昔周單子聘楚而過陳見其道穢而川澤不陂梁客至不授館覊旅無所寓遂知其必亡盖城郭道路旅舍寄寓皆三代為政之法而周官尤謹著之以為禦備今張侯之作也先民之備災而及於賔客徃來然後思自休焉故曰知為政也先是歳大水州幾溺前司封員外郎張侯夏守是州築堤以禦之今所謂因其舊者是也是役也堤為大故予記其大者詳焉偃虹隄有自岳陽至者以滕侯之書洞庭之圖來告曰願有所記予發書按圖自岳陽門西距金雞之右其外隠然隆髙以長者曰偃虹隄問其作而名者曰滕侯之所為也問其所以作之利害曰洞庭天下之至險而岳陽荆潭黔蜀四㑹之衝也昔舟之徃來湖中者至無所寓則皆泊南津其有事於州者逺且勞而又常有風波之恐覆溺之虞今舟之至者皆泊隄下有事於州者近而且無患問其大小之制用人之力曰長一千尺髙三十尺厚加二尺而殺其上得厚三分之二用民力萬有五千五百工而不踰時以成問其始作之謀曰州以事上轉運使轉運使擇其吏之能者行視可否凡三反復而又上於朝廷決之三司然後曰可而皆不能易吾侯之議也曰此君子之作也可以書矣盖於民也深則謀其始也精故能用力少而為功多夫以百步之隄禦天下至險不測之虞惠其民而及於荆潭黔蜀凡徃來湖中無逺邇之人皆䝉其利焉且岳陽四㑹之衝舟之來而止者日凡有幾使隄土石幸久不朽則滕侯之惠利於人物可以數計哉夫事不患於不成而患於易壊盖作者未始不欲其久存而繼者常至於殆廢自古賢智之士為其民捍患興利其遺跡徃徃而在使其繼者皆如始作之心則民到於今受其賜天下豈有遺利乎此滕侯之所以慮而欲有紀於後也滕侯志大材髙名聞當世方朝廷用兵急人之時常顯用之而功未及就退守一州無所用心略施其餘以利及物夫慮熟謀審力不勞而功倍作事可以為後法一宜書不苟一時之譽思為利於無窮而告來者不以廢二宜書岳之民又與湖中之徃來者皆欲為滕侯紀三宜書以三宜書不可以不書乃為之書許氏南園髙陽許君子春治其海陵郊居之南為小園作某亭某堂於其間許君為江浙荆淮制置發運使其所領六路七十六州之廣凡賦斂之多少山川之逺近舟楫之徃來均節轉徙視江湖數千里之外如運諸其掌能使人樂為而事集當國家用兵之後脩前人久廢之職補京師匱乏之供為之六年厥績大著自國子博士遷主客員外郎由判官為副使夫理繁而得其要則簡簡則易行而不違惟簡與易然後其力不勞而有餘夫以制置七十六州之有餘治數畆之地為園誠不足施其智而於君之事亦不足書君之美衆矣予特書其一節可以示海陵之人者君本歙人世有孝徳其先君司封喪其父母事其兄如父戒其妻事其嫂如姑衣雖弊兄未易衣不敢易食雖具兄未食不敢先食司封之亡一子當得官其兄弟相讓久之諸兄卒以讓君君今遂顯於朝以大其門君撫兄弟諸子猶已子歳當上計京師而弟之子病君留不忍去其子亦不忍捨君而留遂以俱行君素清貧罄其家貲走四方以求醫而藥必親調食飲必親視至其矢溲亦親候其時節顔色所下如可理則喜或變動逆節則憂戚之色不自勝其子卒君哭泣悲哀行路之人皆嗟歎嗚呼予見許氏孝悌著於三世矣凡海陵之人過其園者望其竹樹登其臺榭思其宗族少長相從愉愉而樂於此也愛其人化其善自一家而刑一鄉由一鄉而推之無逺邇使許氏之子孫世久而愈篤則不獨化及其人将見其園間之草木有駢枝而連理也禽鳥之翔集於其間者不争巢而棲不擇子而哺也嗚呼事患不為與夫怠而止爾惟力行而不怠以止然後知予言之可信也李秀才東園亭脩友李公佐有亭在其居之東園今年春以書抵洛命脩誌之李氏世家隨隨春秋時稱漢東大國魯桓之後楚始盛隨近之常與為鬭國相勝敗然怪其山川土地既無髙深壮厚之勢封域之廣與鄖蓼相介纔一二百里非有古彊諸侯制度而為大國何也其春秋世未嘗通中國盟㑹朝聘僖二年方見於經以伐見書哀之元年始約列諸侯一㑹而罷其後乃希見僻居荆夷盖於蒲騷鄖蓼小國之間特大而已故於今雖名藩鎮而實下州山澤之産無美材土地之貢無上物朝廷達官大人自閩陬嶺徼出而顯者徃徃皆是而隨近在天子千里内幾一百年間未出一士豈其庳貧薄陋自古然也予少以江南就食居之能道其風土地既瘠枯民給生不舒愉雖豐年大族厚聚之家未嘗有樹林池沼之樂以為歳時休暇之嬉獨城南李氏為著姓家多藏書訓子孫以學予為童子與李氏諸兒戲其家見李氏方治東園徃求美草一一手植周視封樹日日去來園間甚勤李氏夀終公佐嗣家又構亭其間益脩先人之所為予亦壯不復至其家已而去客漢沔逰京師久而乃歸復行城南公佐引予登亭上周尋童子時所見則樹之孽者抱昔之抱者枿草之茁者叢荄之甲者今果矣問其逰兒則有子如予童子之歳矣相與逆數昔時則於今七閏矣然忽忽如前日事因歎嗟徘徊不能去噫予方仕宦奔走不知再至城南登此亭復幾閏幸而再至則東園之物又幾變也計亭之梁木其蠧瓦甓其溜石物其泐乎隨雖陋非予鄉然予之長也豈能忘情於隨哉公佐好學有行鄉里推之與予友藥師院佛殿湘潭縣藥師院新修佛殿者縣民李遷之所為也遷之賈江湖歳一賈其入數千萬遷之謀曰夫民力役以生者也用力勞者其得厚用力媮者其得薄以其得之豐約必視其用力之多少而必當然後各食其力而無慙焉士非我匹若工農則吾等也夫琢磨煎鍊調筋柔革此工之盡力也斤斸鉏夷畎畆樹藝此農之盡力也然後所食皆不過其勞今我則不然徒幸物之廢興而上下其價權時輕重而操其竒贏㳺嬉以浮於江湖用力至逸以安而得則過之我有慙於彼焉凡誠我契而不我欺平我斗斛權衡而不我踰出入關市而不我虞我何能焉是皆在上而為政者以庇我也何以報焉聞浮屠之為善其法曰有能捨已之有以崇飾尊嚴我則能隂相之凡有所欲皆如志乃曰盍用我之有所得於此施以報焉且為善也於是得此寺廢殿而新之又如其法作釋迦佛十六羅漢塑像皆備凡用錢二十萬自景祐二年十二月癸酉訖三年二月甲寅以成其秋㑹予赴夷陵自真州假其舟行次潯陽見買一石礱而載於舟問其所欲用之因具言其所為且曰欲歸而記其始造歳月也視其色若欲得予記而不敢言也因善其以賈為生而能知夫力少而得厚以為幸又知在上者庇已而思有以報顧其所為之心又趨為善皆可喜也乃為之作記問其寺始造之由及其歳月皆不能道也明因大師塔記明因大師道詮姓衛氏并州文水縣民家子生於太平興國辛巳之歳終於明道癸酉之正月夀五十有三年始為童子辭家人入洛陽妙覺禪院依真行大師惠璿學浮圖法咸平五年始去氏削髮入僧籍後二十四年賜紫衣遂主其衆又四年賜號明因兼領右街教門事凡為僧三十有一年卒之明年其徒以骨𦵏城南龍門山下始道詮未死時予過其廬問其年幾何曰五十有二矣問其何許人也曰本太原農家也因與語曰詩唐風言晉本唐之俗其民被堯之徳化且詩多以儉刺然其勤生以儉嗇朴厚而純固最得古之遺風今能言其土風乎其民俗何若信若詩之所謂乎詩去今餘千歳矣猶若詩之時乎其亦隨世而遷變也曰樹麻而衣陶瓦而食築土而室甘辛苦薄滋味歳耕日積有餘則窖而藏之率千百年不輙發其勤且儉誠有古之遺風至今而不變也又言為兒時聞長老語晉自春秋為盛國至唐基并以興世為北京及朱氏有中土後唐倚并為雄亦卒以王既而晉祖又以王漢又以王遭時之故相次出三天子劉崇父子又自為國故民熟兵鬭饟軍死戰勞苦幾百年不得息既而聖人出四方次第平一日兵臨城門係繼元以歸并民然後被政教棄兵専農休息勞苦為太平之幸人并平後二載我始生幼又依浮圖生不見干戈長不執耒耜衣不麻食不瓦室不土力不嗇而休乃并人之又幸者也今老矣且病即死無恨予愛其語樸而詳他日復過其廬莫見也訪之曰死矣為之惻然及其𦵏其徒有求予誌其始終者因并書其嘗語予者志歳月云爾王彦章畫像太師王公諱彦章字子明鄆州夀張人也事梁為宣義軍節度使以身死國𦵏於鄭州之管城晉天福二年始贈太師公在梁以智勇聞梁晉之争數百戰其為勇将多矣而晉人獨畏彦章自乾化後常與晉戰屢困荘宗於河上及梁末年小人趙巖等用事梁之大臣老將多以䜛不見信皆怒而有怠心而梁亦盡失河北事勢已去諸将多懐顧望獨公奮然自必不少屈懈志雖不就卒死以}
