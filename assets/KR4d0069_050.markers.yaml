  - {type: variant, offset: 245, length: 0, content: '', WYG: 薨徐州以其年十有二月壬申𦵏於河南尹樊里}
  - {type: variant, offset: 246, length: 0, content: '', WYG: 萬安山下公諱仲淹字希文五代之際世家蘇州事吳越太宗皇帝時吳越獻其地公之皇考從錢俶朝京師後為武寧軍掌書記以卒公生二歳而孤母夫人貧無依再適長山朱氏既長知其世家感泣去之南都入學舍掃一室晝夜講誦其起居飲食人所不堪而公自刻益苦居五年大通六經之㫖為文章論説必本於仁義祥符八年舉進士禮部選第一遂中乙科為廣徳司理叅軍始歸迎其母以養及公既貴天子乃贈公曾祖蘇州粮料院判官諱某為太保祖秘書監諱賛時為太傅考諱墉為太師妣謝氏為吳國夫人公少有大節其於富貴貧賤毁譽懽戚不一動其心而慨然有志於天下常自誦曰士當先天下之憂而憂後天下之樂而樂也其事上遇人一以自信不擇利害為趨捨其所有為必盡其方曰為之自我者當如是其成與否有不在我者雖聖賢不能必吾豈苟哉天聖中晏丞相薦公文學以大理寺丞為秘閣校理以言事忤章獻太后㫖通判河中府久之上記其忠召拜右司諫當太后臨朝聽政時以至日大㑹前殿上將率百官為夀有司以具公上疏為言天子無北面且開後世弱人主以彊母后之漸其事遂已又上書請還政天子不報及太后崩言事者希㫖多求太后時事欲深治之公獨以為太后受託先帝保佑聖躬始終十年未見過失宜掩其小故以全大徳初太后有遺命立楊太妃代為太后公諫曰太后母號也自古無代立者繇是罷其􅁽命是歳大旱蝗奉使安撫東南使還㑹郭皇后廢率諫官御史伏閤争不能得貶知睦州又徙蘇州歳餘即拜禮部員外郎天章閣待制益論時政闕失而大臣權倖多忌惡之居數月以公知開封府開封素號難治公治有聲事日益簡暇則益取古今治亂安危為上開説又為百官圖以獻曰任人各以其材而百職修堯舜之治不過此也因指其遷進遲速次序曰如此而可以為公可以為私亦不可以不察由是吕丞相怒至交論上前公求對辯語切坐落職知饒州明年吕公亦罷公徙潤州又徙越州而趙元昊反河西上復召相吕公乃以公為陕西經畧安撫副使遷龍圖閣直學士是時新失大將延州危公請自守鄜延捍賊乃知延州元昊遣人遺書以求和公以為無事請和難信且書有僣號不可以聞乃自為書告以逆順成敗之説甚辯坐擅復書奪一官知耀州未逾月徙知慶州既而四路置帥以公為環慶路經略安撫招討使兵馬都部署累遷諫議大夫樞宻直學士公為將務持重不急近功小利於延州築清澗城墾營田復承平永平廢寨孰羌歸業者數萬户於慶州城大順以據要害奪賊地而耕之又城細腰胡盧於是明珠滅臧等大族皆去賊為中國用自邉制久隳至兵與將常不相識公始分延州兵為六將訓練齊整諸路皆用以為法公之所在賊不敢犯人或疑公見敵應變為如何至其城大順也一旦引兵出諸將不知所向軍至柔逺始號令告其地處使徃築城至於版築之用大小畢具而軍中初不知賊以騎三萬來争公戒諸將戰而賊走追勿過河已而賊果走追者不渡而河外果有伏賊既失計乃引去於是諸將皆服公為不可及公待將吏必使畏法而愛已所得賜賚皆以上意分賜諸將使自為謝諸蕃質子縱其出入無一人逃者蕃酋來見召之卧内屏人徹衛與語不疑公居二歳士勇邉實恩信大洽乃決策謀取横山復}
