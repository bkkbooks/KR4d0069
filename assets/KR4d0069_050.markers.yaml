  - {type: variant, offset: 311, length: 5, content: 斥羣譏衆排, WYG: 契丹卒自攻元昊明年使來告捷又以公徃報坐習敵語出知吉州怨家因之中以事左遷將作少監分司南京公怡然還鄉里闔門謝賔客絶人事凡六年天子每思之欲用者數矣大臣}
  - {type: variant, offset: 317, length: 8, content: 事而思雖仇謂材毀, WYG: ''}
  - {type: variant, offset: 326, length: 3, content: 吾傷譽, WYG: 喜者第遷光禄少卿於家又以為武衛将軍夀州兵馬鈐轄辭}
  - {type: variant, offset: 330, length: 163, content: 吾喜進退有儀一作度夷行險止嗚呼公乎舉丗之善誰非公徒讒人豈多公志不舒善不勝惡豈其然乎成難毀易理又然歟嗚呼公乎欲壞其棟先摧桷榱傾巢破鷇披折傍枝害一損百人誰不罹誰爲黨論是不仁哉嗚呼公乎易名謚行君子之榮生也何毁没也何稱好死惡生殆非人情豈其生有所嫉而死無所爭自公云亡謗不待辨愈乆愈明由今可見始屈終伸公其無恨寫懷平生寓此薄奠祭杜祁公文維嘉, WYG: 拜皇}
