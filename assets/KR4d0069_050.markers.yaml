  - {type: variant, offset: 497, length: 3, content: 月日具, WYG: 史刋誤四十巻娶林氏封魯郡夫人子男三人伯莊殿中丞早卒仲荀今為屯田員外郎叔英太常寺太祝女六人皆適士族孫四人孫女五人銘曰余遷曲江仍世不顯奮自襄公有聲甚逺始興開國襲美於前兩賢相望三百年間偉歟襄公惟邦之直始登於朝}
  - {type: page-break, offset: 497, content: '', id: KR4d0069_WYG_018-12a, image: WYG1103/WYG1103-0792c.png}
  - {type: variant, offset: 501, length: 0, content: '', WYG: 有言責左右獻納姦䛕屏息慶厯之治實多補益逢時有事奔走南北功書史官名在夷狄出入艱勤險夷一徳小人之䜛公廢千里一方有警公起於家威行信結嶺海幽遐公之在焉帝不南顧胡召其還殞於中路返柩來歸韶人負土伐石刻辭立於墓門以貽來世匪止韶人}
