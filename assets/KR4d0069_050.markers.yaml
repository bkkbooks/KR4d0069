  - {type: variant, offset: 1055, length: 1, content: 庚, WYG: 余與師魯兄弟交嘗銘其父之墓矣故不復次其世家焉銘曰藏之深固之宻石可朽銘不滅誌言天下之人識與不識皆知師魯文學議論材能則文學之長議論之髙材能之美不言可知又恐太略故條析其事再述於後述其文則曰簡而有法此一句在孔}
  - {type: variant, offset: 1057, length: 8, content: 七月丁亥朔九日乙, WYG: 六經惟春秋可當之其他經非孔子自作文章故雖有法而不簡也脩於師魯之文不薄矣而世之無識者不考文之輕重但責言之多少云師魯文章不合秪著一句道了既述其文則又述其學曰通知古今此語若必求其可當者惟孔孟也既述其學則又述其論議云是是非非務盡其道理不苟止而妄隨亦非孟子不可當此語既述其議論則又述其材能備言師魯厯貶自兵興使在陜西尤深知西事}
  - {type: page-break, offset: 1057, content: '', id: KR4d0069_WYG_020-4a, image: WYG1103/WYG1103-0800a.png}
  - {type: variant, offset: 1066, length: 0, content: '', WYG: 及施為而元昊臣師魯得罪使天下之人盡知師魯材能此三者皆君子之極美然在師魯猶為末事其大節乃篤於仁義窮達禍福不媿古人其事不可徧舉故舉其要者一兩事以取信如上書論范公而自請同貶臨死而語不及私則平生忠義可知也其臨窮達禍福不媿古人又可知也既已}
  - {type: page-break, offset: 1066, content: '', id: KR4d0069_WYG_020-4b, image: WYG1103/WYG1103-0800b.png}
  - {type: variant, offset: 1067, length: 1, content: 官, WYG: 言其文學其論議其材能其忠義遂又言其為仇人挾情論告以貶死又言其死後妻子困窮之狀欲使後世知有如此人以如此事廢死至於妻子如此困窮所以深痛死者而切責當世君子致斯人之及此也春秋之義痛之益至則其辭益深子般卒是也詩人之意責之愈切則其言愈緩君子偕老是也不必號天叫屈然後為師魯稱怨也故於其銘文但云藏之深固之宻石可朽名不滅意謂舉世無可告語但深藏牢埋此銘使其不朽則後世必有知師魯者其語愈緩其意愈切詩人之義也而世之無識者乃云銘文不合不講徳不辨師魯以非罪盖為前言其窮達禍福無媿古人則必不犯法況是仇人所告故不必區區曲辨也今止直言所坐自然知非罪矣添之無害故勉徇議者添之若作古文自師魯始則前有穆脩鄭條輩及有大宋先達甚多不敢㫁自師魯始也偶麗之文苟合於理未必為非故不是此而非彼也若謂近年古文自師魯始則范公祭文已言之矣可以互見不必重出也皇甫湜韓文公墓誌李翺行狀不必同亦互見之也誌云師魯喜論兵論兵儒者末事言喜無害喜非嬉戯之戲喜者好也君子固有所好矣孔子言回也好學豈是薄顔回乎後生小子未經師友苟恣所見豈足聴哉脩見韓退之與孟郊聮句便似孟郊詩與樊宗師作誌便似樊文慕其如此故師魯之誌用意特深而語簡盖為師魯文簡而意深又思平生作文惟師魯一見展巻疾讀五行俱下便曉人深處因謂死者有知必受此文所以慰吾亡友爾豈恤小子輩哉蘇明允有蜀君子曰蘇君諱洵字明允眉州眉山人也君之行義修於家信於鄉里聞於蜀之人久矣當至和嘉祐之間與其二子軾轍偕至京師翰林學士}
