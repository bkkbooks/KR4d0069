  - {type: variant, offset: 640, length: 1, content: 忘, WYG: 敢有所干凡其為治以聴㫁盜訟為能否爾獨公始有餘力省其民事如治他州而畿赤諸縣之民皆被其惠開封比比出能吏而兼於民政者惟公一人吏部審官主}
