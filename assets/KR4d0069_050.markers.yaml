  - {type: variant, offset: 247, length: 0, content: '', WYG: 武而元昊數遣使稱臣請和上亦召公歸矣初西人籍為鄉兵者數萬既而黥以為軍唯公所部但刺其手公去兵罷獨得復為民其於兩路既得孰羌為用使以守邉因徙屯兵就食内地而紓西人饋輓之勞其所設施去而人徳之與守其法不敢變者至今尤多自公坐吕公貶羣士大夫各持二公曲直吕公患之凡直公者皆指為黨或坐竄逐及吕公復相公亦再起被用於是二公驩然相約勠力平賊天下之士皆以此多二公然朋黨之論遂起而不能止上既賢公可大用故卒置羣議而用之慶厯三年春召為樞宻副使五讓不許乃就道既至數月以為參知政事每進見必以太平責之公歎}
  - {type: page-break, offset: 247, content: '', id: KR4d0069_WYG_018-5a, image: WYG1103/WYG1103-0789a.png}
  - {type: variant, offset: 248, length: 2, content: 嗚呼, WYG: 上之用我者至矣然事有先後而革弊政於乆安非朝夕可也既而上再賜手詔趣使條天下事又開天章閣召見賜坐授以紙筆使䟽於前}
  - {type: page-break, offset: 248, content: '', id: KR4d0069_WYG_018-5b, image: WYG1103/WYG1103-0789b.png}
