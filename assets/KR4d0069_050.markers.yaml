  - {type: variant, offset: 3719, length: 230, content: 在殯而公已卧病於苫􅒘之間而愛子長而賢者遽又卒於其前遂以奄然而瞑目一孤藐然以爲二喪之主嗚呼又何其不幸也此行路之人聞之皆爲之出涕況於親戚朋友乎況如脩者與公之遊最乆而相知之最深者乎夫丗之舉逺以爲言者不過曰四海而閩負南海齊臨東海使脩不得躬一觴之奠寫長慟之哀此其爲恨又可涯哉尚饗青州求晴祭文求晴一作祈晴維年月日具官脩謹以清酌之奠致告于東嶽天齊仁聖帝而言曰夫麥之爲物歷四時而後實凡所以生育長養成就之功可謂至矣以四時之功而成之以數日之雨而壞之此殆非天之意也非神之欲也農服耒􅪢, WYG: ''}
