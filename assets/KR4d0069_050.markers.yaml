  - {type: line-break, offset: 271, content: '', id: KR4d0069_SBCK_050-1b08}
  - {type: variant, offset: 273, length: 19, content: 爲好訐公曰彼善公爲樹朋公所勇爲公則躁進, WYG: 繼之以大曲江僻在嶺表自始興張文獻}
  - {type: substitution, offset: 273, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
