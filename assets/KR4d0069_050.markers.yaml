  - {type: variant, offset: 3625, length: 6, content: 親享壽考康寧, WYG: 味常深長於言意之外使人讀之藹然足以得祖宗致治之盛其關世教豈不大哉初吕文靖公范文正公以議論不合黨與遂分而公實與焉其後西師既興吕公首薦范富韓三公以靖天下之難文正以書自咎歡然與吕公勠力而富公獨念之不置夫左右相仇非國家}
