  - {type: variant, offset: 1098, length: 1, content: 昔, WYG: 澹曰渙皆以文學舉進士而君少獨不喜學年已壮猶不知書職方君縱而不問鄉閭親族皆怪之或問其故職方君笑而不荅君亦自如也年二十七}
  - {type: variant, offset: 1100, length: 11, content: 見子伊川之上余仕方𥘉子, WYG: 大發憤謝其素所徃來少}
