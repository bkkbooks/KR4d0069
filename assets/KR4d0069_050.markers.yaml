  - {type: variant, offset: 2825, length: 689, content: 謹遣通引官行首龐簡以清酌庶羞之奠致祭于亡友留臺給事原甫之靈曰嗚呼金百錬以爲鑑而萬物不能遁其形及爲物蝕而蔽其光頑然無異乎瓦甓然而一遇良工之藥磨而瑩之則可以見肝膽而數毛髪蓋其可昏者光不可昏者性其或廢而或用由有幸與不幸若吾原甫者敏學通於今古精識造乎幽微乃百錬之英而萬事之鑑也一爲末疾昏之至使良醫不能措其術百藥無所施其功遂埋至寶銜恨無窮此所以士夫驚呼莫不爲朝廷而痛惜至於不知命者皆有疑於造物之工況相知於道義而乆接於遊從念以身而莫贖徒有淚而沾胷尚饗祭丁學士文嗚呼元珍善惡之殊如火與水不能相容其勢然爾是故郷人皆好孔子不然惡於不善然後爲賢子之美才懿行純德誰稱諸朝當丗有識子之憔悴遂以湮淪問孰惡子可知其人毀善之言譬若蠅矢點彼白玉濯之而巳小人得志蹔快一時要其得失後丗方知受侮被謗無如仲尼巍然衮冕不祀桓魋孟軻之道愈乆彌光名尊四子不數臧倉是以君子脩身而俟擾擾姦愚經營一丗迨榮華之銷歇嗟泯沒其誰記是皆生則狐䑕死爲狗彘惟一賢之不幸歷千載而猶傷自古孰不有死至今獨弔乎沅湘彼靈均之事業𥘉未見於南邦使不遭罹於放斥未必功顯而名彰然則彼讒人之致力乃借譽而揄揚嗚呼元珍道之通塞有命在天其如予何孔孟亦然何以慰子聊爲此言寄哀一奠有涕漣漣尚饗祭呉大資一作長文文維年月日具官脩謹遣某人以清酌庶羞之奠致祭于資政侍郎呉公之靈曰惟公以孔孟之學晁董之文佐佑三朝始終一節顧惟庸繆敢企光塵而金門玉堂早接儁遊之末紫樞黃閤晚陪國論之餘雖出處之略同在進退而則異余實衰病乆思返於田疇一作廬公方盛年宜復還於廊廟豈期白首來哭素帷飲釂百分尚想平生之意氣寫哀一奠不知涕淚之縱橫尚饗祭蔡端明文維年月日具官脩謹遣三班奉職指使李敡以清酌庶羞之奠致祭于故端明殿, WYG: 為龍圖閣直}
