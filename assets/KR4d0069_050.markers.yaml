  - {type: variant, offset: 46, length: 0, content: '', WYG: 宫判官太子左庶子兼判太常寺知禮儀院公既以道徳文章佐佑東宫真宗每所諮訪多以方寸小紙細書問之由是參與機宻凡所對必以其藁進示不洩其後悉閲真宗閣中遺書得公所進藁類為八十巻藏之禁中人莫之見也初真宗遺詔章獻明肅太后權聴軍國事宰相丁謂樞宻使曹利用各欲獨見奏事無敢決其議者公建言羣臣奏事太后者垂簾聴之皆毋得見議遂定乾興元年拜右諫議大夫兼侍讀學士遷給事中景靈宫副使判吏部流内銓以易侍講崇政殿遷禮部侍郎知審官院為樞宻副使遷刑部侍郎上䟽論張耆不可為樞宻使由是忤太后㫖坐以笏擊其僕悞折其齒罷留守南京大興學校以教諸生自五代以來天下學廢興自公始召拜御史中丞改兵部侍郎兼秘書監資政殿學士翰林侍讀學士知天聖八年禮部貢舉明年為三司使復為樞宻副使未拜改叅知政事遷尚書左丞太后謁太廟有請服衮冕者太后以問公公以周官后服對太后崩大臣執政者皆罷公為禮部尚書知亳州徙知陳州遷刑部尚書復召為御史中丞又為三司使知樞宻院事拜樞宻使再加檢校太尉同中書門下平章事慶厯三年三月遂以刑部尚書居相位充集賢殿大學士兼樞宻使自公復召用而趙元昊反師出陕西天下弊於兵公數建利害請罷監軍無以陣圖授諸將使得應敵為攻守及制財用為出入之要皆有法天子悉為施行自宫禁先以率天下而財賦之職悉歸有司卒能以謀臣元昊使聽約束乃還其王號公為人剛簡遇人必以誠雖處富貴如寒士罇酒相對歡如也得一善稱之如已出當世知名之士如范仲淹孔道輔等皆出其門及為相益務進賢材當公居相府時范仲淹韓琦富弼皆進用至於臺閣多一時之賢天子既厭西兵閔天下困弊奮然有意遂欲因羣材以更治數詔大臣條天下事方施行而小人權倖皆不便明年秋㑹公以事罷而仲淹等相次亦皆去事遂已公既罷以工部尚書知頴州徙知陳州又徙許州三遷户部尚書拜觀文殿大學士永興軍充一路都部署安撫使徙知河南府兼西京留守累進階至開府儀同三司勲上柱國爵臨淄公食邑萬二千户實封三千七百户公享年六十有五自少篤學至其病亟猶手不釋巻有文集二百四十巻嘗奉勑脩土訓及真宗實録又集類古今文章為集選二百巻其為政敏而務以簡便其民其於家嚴子弟之見有時事寡姊孝謹未嘗為子弟求恩澤其在陳州上問宰相曰晏某居外未嘗有所請其亦有所欲邪宰相以告公公自為表問起居而已故其薨也天子尤哀悼之賜予加等以其子承裕為崇文院檢討孫及甥之未官者九人皆命以官公初娶李氏工部侍郎虛巳之女次孟氏屯田員外郎虚舟之女封鉅鹿郡夫人次王氏太師尚書令超之女封榮國夫人子八人長曰居厚大理評事早卒次承裕尚書屯田員外郎宣禮賛善大夫崇讓著作佐郎明逺祗徳皆大理評事幾道傅正皆太常寺太祝女六人長適戸部侍郎同中書門下平章事富弼次適禮部侍郎三司使楊察其四尚幼孫十有三人公既樂善而稱為知人士之顯於朝者多公所薦達至擇其女之所從又得二人者如此}
