  - {type: variant, offset: 10, length: 1, content: 維, WYG: 字僅存可讀所謂公昉者初不載其姓名但云君字公昉爾又云耆老相傳以為王莽居攝二年君為郡吏啖𤓰旁有真人居左右莫察君獨進美𤓰又從而敬禮之真人者遂與期谷口山上乃與君神藥曰服藥以後當移意萬里知鳥獸言語是時府君去家七百餘里休謁徃來轉景即}
