  - {type: variant, offset: 1116, length: 10, content: 飲酒握手相歡談辯鋒岀, WYG: 為文辭歳餘舉進士再不中又舉茂材異等不中退而歎曰此不足為吾學也悉取所為文數百篇焚之益閉户讀書絶筆不為文辭者五六年迺大究六經百家之説以考質古今治亂成敗聖}
