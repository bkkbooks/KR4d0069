  - {type: variant, offset: 12, length: 1, content: 集, WYG: 既死而梁亦亡矣悲夫五代終始纔}
  - {type: variant, offset: 15, length: 1, content: 祭, SBCK: 􅀕}
  - {type: variant, offset: 15, length: 1, content: 祭, WYG: 年而更十有三君五易國而入姓士之不幸而出乎其時能不汙其身得全其節者鮮矣公本武人不知書其語質平生嘗謂人曰豹死留皮人死留名盖其義勇忠信出於天性而然予於五代書竊有善善惡惡之志至於公傳未嘗不感憤歎息惜乎舊史殘略不能備公之事康定元年予以節度判官來此求於滑人得公之孫睿所録家傳頗多於舊史其記徳勝之戰尤詳又言敬翔怒末帝不肯用公欲自經於帝前公因用笏畫山川為御史彈而見廢又言公五子其二同公死節此皆舊史無之又云公在滑以䜛自歸於京師而史云召之是時梁兵盡屬叚凝京師羸兵不滿數千公得保鑾五百人之鄆州以力寡敗於中都而史云将五千以徃者亦皆非也公之攻徳勝也初受命於帝前期以三日破敵梁之將相聞者皆竊笑及破南城果三日是時荘宗在魏聞公復用料公必速攻自魏馳馬來救已不及矣莊宗之善料公之善出竒何其神哉今國家罷兵四十年一旦元昊反敗軍殺将連四五年而攻守之計至今未決余嘗獨持用竒取勝之議而歎邉将屢失其機時人聞余説者或笑以為狂或忽若不聞雖予亦惑不能自信及讀公家傳至於徳勝之捷乃知古之名将必出於竒然後能勝然非審於為計者不能出竒竒在速速在果此天下偉男子之所為非拘牽常算之士可到也每讀其傳未嘗不想見其人後二年予復來通判州事歳之正月過俗所謂鐡槍寺者又得公畫像而拜焉歳久磨滅隠隠可見亟命工完理之而不敢有加焉懼失其真也公善用槍當時號王鐡槍公死已百年至今俗猶以名其寺兒童牧豎皆知王鐡槍之為良将也一槍之勇同時豈無而公獨不朽者豈其忠義之節使然歟畫已百年餘矣完之復可百年然公之不泯者不係乎畫之存不存也而予尤區區如此者盖其希慕之至焉爾讀其書尚想乎其人况得拜其像識其面目不忍見其壞也畫既完因書予所得者於後而歸其人使藏之歐陽}
