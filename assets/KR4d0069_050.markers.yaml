  - {type: variant, offset: 294, length: 2, content: 退讓, WYG: 聲於唐為賢相至}
  - {type: variant, offset: 297, length: 2, content: 爲近, WYG: 復出為宋}
  - {type: substitution, offset: 297, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: variant, offset: 300, length: 1, content: 讒, WYG: 臣盖余氏徙韶厯四世始有顯仕而曲江寂寥三百年然後再有聞}
  - {type: variant, offset: 302, length: 0, content: '', WYG: 惟公位登天臺正秩三品遂有爵土開國鄉州以繼美前哲而為韶人榮至於褒䘏贈諡始終}
  - {type: variant, offset: 303, length: 0, content: '', WYG: 寵盛矣盖褒有詔䘏有物贈有告而諡行考功有議有状合而誌之以閟諸幽有銘可謂備矣惟是螭首龜趺揭於墓隧以表見於後世而昭示其子孫者宜有辭而闕焉敢以為請謹按余氏韶州曲江人曽祖諱某祖諱某皆不仕父諱某太常博士累贈太常少卿公諱靖字安道官至朝散大夫守工部尚書集賢院學士知廣州軍州事兼廣南東路兵馬鈐轄經畧安撫使柱國始興郡開國公食邑二千六百户食實封二百户治平元年自廣朝京師六月癸亥以疾薨於金陵天子惻然輟視朝一日賻以粟帛贈刑部尚書諡曰襄明年七月某甲子返𦵏於曲江之龍歸鄉成山之原公為人質重剛勁而}
  - {type: page-break, offset: 303, content: '', id: KR4d0069_WYG_018-8a, image: WYG1103/WYG1103-0790c.png}
  - {type: page-break, offset: 303, content: '', id: KR4d0069_WYG_018-8b, image: WYG1103/WYG1103-0790d.png}
  - {type: variant, offset: 304, length: 0, content: '', WYG: 語恂恂不見喜怒自少博學强記至於厯代史記雜家小説隂陽律厯外暨浮屠老子之書無所不通天聖二年舉進士為贛縣尉書判拔萃改將作監丞知新建縣再遷秘書丞刋校三史充集賢校理天章閣待制范公仲淹以言事觸宰相得罪諫官御史不敢言公䟽論之坐貶監筠州酒稅稍徙泰州已而天子感悟亟復用范公而因之以被斥者皆召還惟公以便親乞知英州遷太常博士丁母憂服除遂還為集賢校理同判太常禮院景祐慶厯之間天下怠於久安吏習因循多失職及趙元昊以夏叛師出久無功縣官財屈而民重困天子赫然思振頽弊以修百度既已更用二三大臣又増置諫官四員使言天下事公}
  - {type: page-break, offset: 304, content: '', id: KR4d0069_WYG_018-9a, image: WYG1103/WYG1103-0791a.png}
  - {type: variant, offset: 305, length: 1, content: 何, WYG: 一人也即改右正言供職公感激奮勵遇事輒言無所回避姦䛕權倖屏息畏之其補益多矣然亦不勝其怨嫉也慶厯四年元昊納誓請和将加封􅁽而契丹以兵臨境上遣使言為中國討賊且告師期請止毋與和朝廷患之欲聽重絶夏人而兵不得息不聴生事北邉議未決公獨以為中國厭兵久矣此契丹之所幸一日使吾息兵養勇非其利也故用此以撓我爾是不}
  - {type: page-break, offset: 305, content: '', id: KR4d0069_WYG_018-9b, image: WYG1103/WYG1103-0791b.png}
  - {type: variant, offset: 308, length: 1, content: 先, WYG: 朝廷雖是公言猶留夏􅁽不遣而假公諫議大夫以報公從十餘騎馳出居庸關見敵於九十九泉從容坐帳中辯折徃復數十卒屈其議取其要領而還朝廷遂發夏冊臣元昊西師既解嚴而北邉亦無}
  - {type: variant, offset: 310, length: 0, content: '', WYG: 是歳以本官知制誥史館修撰}
  - {type: page-break, offset: 310, content: '', id: KR4d0069_WYG_018-10a, image: WYG1103/WYG1103-0791c.png}
