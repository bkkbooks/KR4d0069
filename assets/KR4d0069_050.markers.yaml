  - {type: variant, offset: 27, length: 1, content: 以, WYG: 按故推誠保順同德守正翊戴功臣開府儀同三司守太尉充玉}
  - {type: variant, offset: 29, length: 9, content: 酌庶羞之奠致祭于故, WYG: 昭應宫使上柱國太原郡開國公贈}
