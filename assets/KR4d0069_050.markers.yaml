  - {type: variant, offset: 2001, length: 772, content: 以永負至慈罔極不報之恩不勝悲慕哀愴之情謹遣兄之子嗣立以告尚饗祭宋侍中文惟靈明誠敏識清方粹直由𥘉考終不變一德忽然云亡天子之惻冨於文章玉質天葩施之朝廟炳耀光華自兹而絕學者之嗟旣文一作智且賢周逹善問惟此不朽有司之信輤車其行禮備哀榮奠觴爲訣脩等之誠尚饗英宗皇帝靈駕發引祭文維治平四年歳次丁未八月丁未朔八日甲寅具官臣歐陽脩伏覩大行皇帝靈駕發引臣以官守有職不得攀號於道左謹擇順天門外恭陳薄奠瞻望靈輿臣脩西望泣血頓首死罪言曰伏惟大行皇帝至仁至孝本堯舜之心克儉克寛躬禹湯之聖德澤𬒳物威靈在天今者因山爲陵卜萬世而叶吉同軌畢至無一人之後期而臣受恩最深報國無狀不能秉翣持紼以供賤事而古人可慕有媿三良之殉身罔極衘哀但同百姓之喪考尚知豺獺之薦冀伸犬馬之誠臣無任號天摧絶哀慕感切之至臣脩西望泣血頓首死罪謹言祭石曼卿文祭一作弔維治平四年七月日具官歐陽脩謹遣尚書都省令史李敡至于太清以清酌庶羞之奠致祭于亡友曼卿之墓下而弔之以文曰嗚呼曼卿生而爲英死而爲靈其同乎萬物生死而復歸於無物者暫聚之形不與萬物共盡而卓然其不朽者後丗之名此自古聖賢莫不皆然而著在簡冊者昭如日星嗚呼曼卿吾不見子乆矣猶能髣髴子之平生其軒昂磊落突兀崢嶸而埋藏於地下者一有吾字意其不化爲朽壤而爲金玉之精不然生長松之千尺産靈芝而一作之九莖柰何荒煙野蔓荆棘縱横風凄露下走燐飛螢但見牧童樵叟歌唫而上下與夫驚禽駭獸悲鳴躑躅而咿嚶今固如此更千秋而萬歳兮安知其不穴藏狐貉與鼯鼪此自古聖賢亦皆然兮獨不見夫纍纍乎曠野與荒城嗚呼曼卿盛衰之理吾固知其如此而感念疇昔悲涼悽愴不覺臨風而隕涕者有媿乎太上之忘情尚饗祭胡太傅文維治平四年歳次丁未十一月乙亥朔某日具官脩謹以清酌庶羞之奠致祭于故太子太傅致仕胡公之靈自昔並遊儒館當丗英豪譬如花卉先後零凋惟公松栢凛凛寒標他人磨礲爭岀圭角公獨渾然不見其璞廊廟之器誰能測度晚登大用蔚有嘉言予文之鄙懼不能傳三, WYG: ''}
