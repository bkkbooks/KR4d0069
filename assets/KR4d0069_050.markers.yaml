  - {type: variant, offset: 3579, length: 1, content: 奮, WYG: 文而不知其㫖敢於犯是不韙而不疑也初天聖明道之間太祖太宗真宗以深仁厚澤涵養天下盖七十年百姓能自衣食以樂生送死而戴白之老安坐以嬉童兒幼穉什伯為羣相與鼓舞於里巷之間仁宗恭已無為於其上太母制政房闥而執政大臣實得以叅可否晏然無以異於漢文景之平時民生及識五代之亂離者盖於是與世相忘久矣而學士大夫其文猶襲五代之卑陋中經一二大儒}
