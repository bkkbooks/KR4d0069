  - {type: variant, offset: 1094, length: 1, content: 靈, WYG: 與居愈久}
  - {type: variant, offset: 1096, length: 1, content: 言, WYG: 愈可愛間而出其所有愈叩而愈無窮嗚呼可謂純明篤實之君子也曽祖諱祐祖諱杲父諱序贈尚書職方員外郎三世皆不顯職方君三子}
