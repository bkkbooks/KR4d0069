  - {type: variant, offset: 1015, length: 2, content: 交朋, WYG: 上得益與大臣圖議明年屢下詔書勸農桑興學校革弊修廢而天下竦然知上之求治矣於此之時言事之臣無日不進見而公之補益為尤多四年以右正言直史館出知福州以便親遂為福建路轉運使復古五塘以溉田民以為利為公立生祠於塘側又奏減閩人五代時丁口稅之半丁父憂服除判三司鹽鐡勾院復修起居注今參知政事唐公介時為御史以直言忤㫖貶春州别駕廷臣無敢言者公獨論其忠人皆危之而上悟意解唐公得改英州遂復召用皇祐四年遷起居舍人知制誥兼判流内銓御史吕景初吳中復馬遵坐論梁丞相適罷臺職除他官公封還辭頭不草制其後屢有除授非當者必皆封還之而上遇公益厚曰有子如此其母之賢可知命特賜冠帔以寵之至和元年遷龍圖閣直學士知開封府三年以樞宻直學士知泉州徙知福州未幾復知泉州公為政精明而於閩人尤知其風俗至則禮其士之賢者以勸學興善而變民之}
