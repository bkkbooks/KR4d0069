  - {type: variant, offset: 535, length: 5, content: 靈曰士之進, WYG: 後厯三代常為諸侯後徙其封於杜而子孫散適他國者以杜為氏自杜赫為秦将軍後三世御史大夫周及其子建平侯延年仍}
