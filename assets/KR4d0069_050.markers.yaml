  - {type: indent, offset: 0, content: 　　, id: KR4d0069_krp_050-bkkind1}
  - {type: variant, offset: 2, length: 0, content: '', WYG: 粹巻十五欽定四庫全書歐陽文粹巻十六宋陳亮編雜著書梅聖俞詩藁後凡樂達天地之和而與人之氣相接故其疾徐奮動可以感於體歡愉惻愴可以察於聲五聲單出於金石不能自和也而工者和之然抱其器知其聲節其廉肉而調其律吕如此者工之善也今指其器以問於工曰彼簨者􅙇者堵而編執而列者何也彼必曰鼗鼓鐘磬絲管干戚也又語其聲以問之曰彼清者濁者剛而奮柔而曼衍者或在郊或在廟堂之下而羅者何也彼必曰八音五聲六代之曲上者歌而下者舞也其聲器名物皆可以數而對也然至乎動盪血脉流通精神使人可以喜可以悲或歌或泣不知手足鼓舞之所以然問其何以感之者則雖有善工猶不知其所以然焉盖不可得而言也樂之道深矣故工之善者必得於心應於手而不可述之言也聽之善亦必得於心而㑹以意不可得而言也堯舜之時䕫得之以和人神舞百獸三代春秋之際師襄師曠州鳩之徒得之為樂官理國家知興亡周衰官失樂器淪亡散之河海逾千百歳間未聞有得之者其天地人之和氣相接者既不得泄於金石疑其遂獨鍾於人故其人之得者雖不可和於樂尚能歌之為詩古者登歌清廟太師掌之而諸侯之國亦各有詩以道其風土性情至於投壺饗射必使工歌以達其意而為賔樂盖詩者樂之苗裔與漢之蘇李魏之曹劉得其正始宋齊而下得其浮淫流佚唐之時子昻李杜沈宋王維之徒或得其淳古淡泊之聲或得其舒和髙暢之節而孟郊賈島之徒又得其悲愁鬱堙之氣由是而下得者時有而不純焉今聖俞亦得之然其體長於本人情狀風物英華雅正變態百出哆兮其似春凄兮其似秋使人讀之可以喜可以悲陶暢酣適不知手足之将鼓舞也斯固得深者耶其感人之至所謂與樂同其苖裔者耶余嘗問詩於聖俞其聲律之髙下文語之疵病可以指而告余也至其心之得者不可以言而告也余亦将以心得意㑹而未能至之者也聖俞久在洛中其詩亦徃徃人皆有之今将告歸余因求其藁而寫之然夫前所謂心之所得者如伯牙鼓琴子期聽之不相語而意相知也余今得聖俞之藁猶伯牙之琴絃乎書春秋繁露後漢書董仲舒傳載仲舒所著百篇第云清明竹林玉杯繁露之書盖略舉其篇名今其書纔四十篇又摠名春秋繁露者失其真也予在館中校勘羣書見有八十餘篇然多錯亂重複又有民間應募獻三十餘篇其間數篇在八十篇外乃董生之書流散而不全方俟校勘而予得罪夷陵秀才田文初以此示予不暇讀明年春得假之許州以舟下南郡獨卧閲此遂誌之董生儒者其論深極春秋之㫖然或於改正朔而云王者大一元者牽於其師之說不能髙其論以明聖人之道惜哉惜哉記舊本韓文後予少家漢東漢東僻陋無學者吾家又貧無藏書州南有大姓李氏者其子彦輔頗好學予為兒童時多逰其家見有敝筐貯故書在壁間發而視之得唐昌黎先生文集六巻脫落顛倒無次第因乞李氏以歸讀之見其言深厚而䧺博然予猶少未能悉究其義徒見其浩然無涯若可愛是時天下學者楊劉之作號為時文能者取科第擅名聲以誇榮當世未嘗有道韓文者予亦方舉進士以禮部詩賦為事年十有七試於州為有司所黜因取所藏韓氏之文復閲之則喟然嘆曰學者當至於是而止爾因怪時人之不道而顧已亦未暇學徒時時獨念於予心以為方從進士干禄以養親苟得禄矣當盡力於斯文以償其素志後七年舉進士及第官於洛陽而尹師魯之徒皆在遂相與作為古文因出所藏昌黎集而補綴之求人家所有舊本而校定之其後天下學者亦漸趨於古而韓文遂行於世至於今盖三十餘年矣學者非韓不學也可謂盛矣嗚呼道固有行於逺而止於近有忽於徃而貴於今者非惟世俗好惡之使然亦其理有當然者而孔孟皇皇於一時而師法於千萬世韓氏之文没而不見者二百年而後大施於今此又非特好惡之所上下盖其久而愈明不可磨滅雖蔽於暫而終耀於無窮者其道當然也予之始得於韓也當其沈沒棄廢之時予固知其不足以追時好而取勢利於是就而學之則予之所為者豈所以急名譽而干勢利之用哉亦志乎久而已矣故予之仕於進不為喜退不為懼者盖其志先定而所學者宜然也集本出於蜀文字刻畫頗精於今世俗本而脫謬尤多凡三十年間聞人有善本者必求而改正之其最後巻帙不足今不復補者重增其故也予家藏書萬巻獨昌黎先生集為舊物也嗚呼韓氏之文之道萬世所共尊天下所共傳而有也予於此本特以其舊物而尤惜之讀李翺文予始讀翺復性書三篇曰此中庸之義疏爾智者識其性當復中庸愚者雖讀此不曉也不作可焉又讀與韓侍郎薦賢書以為翶特窮時憤世無薦已者故丁寧如此使其得志亦未必然以翺為秦漢間好事行義之一豪雋亦善諭人者也最後讀幽懐賦然後置書而歎不已復讀不自休恨翺不生於今不得與之交又恨予不得生翺時與翺上下其論也况廼翺一時有道而能文者莫若韓愈愈嘗有賦矣不過羨二鳥之光榮歎一飽之無時爾推是心使光榮而飽則不復云矣若翺獨不然其賦曰衆囂囂而雜處兮咸歎老而嗟卑視予心之不然兮慮行道之猶非又怪神堯以一旅取天下後世子孫不能以天下取河北以為憂嗚呼使當時君子皆易其歎老嗟卑之心為翺所憂之心則唐之天下豈有亂與亡哉然翺幸不生今時見今之事則憂又甚矣奈何今之人不憂也余行天下見人多矣脫有一人能如翺憂者又皆疏逺與翺無異其餘光榮而飽者一聞憂世之言不以為狂人則以為病子不怒則笑之矣嗚呼在位而不肯自憂又禁他人使皆不得憂可歎也夫崇文總目叙釋前史謂秦焚三代之書易以卜筮而得不焚及漢募羣書類多散逸而易以故最完及學者傳之遂分為三一曰田何之易始自子夏傳之孔子卦象爻彖與文言說卦等離為十二篇而說者自為章句易之本經也二曰焦贛之易無所師授自言得之隠者第述隂陽災異之言不類聖人之經三曰費直之易亦無師授専以彖象文言等參解卦文凡以彖象文言雜入卦中者自費氏始田何之學施孟梁丘之徒最盛費氏初微止傳民間至後漢時陳元鄭衆康成之徒皆學費氏費氏興而田學遂息古十二篇之易遂亡其本王弼為注亦用彖象相雜之經自晉已後弼學獨行遂傳至今然易比五經其來最逺自伏羲畫卦下更三代别為三易其變卦五十有六命名甚殊至於七八九六筮占之法亦異周之末世夏商之易已亡漢初雖有歸藏已非古經今書三篇莫可究矣獨周易時更三聖世厯三古雖說者各自名家而聖人之法天地之緼則具存焉書原於號令而本之史官孔子刪為百篇㫁堯迄秦序其作意遭秦之故孔子末孫惠與濟南伏勝各藏其本於家楚漢之際失其所藏但口以傳授勝既耄昏乃謬合三十四篇為二十九歐陽夏侯之徒皆學之寫以漢世文字號今文尚書至武帝時孔惠之書始出屋壁百篇皆在而半已磨滅又皆科斗文字惠孫安國以𨽻古定之得五十八篇為之作傳號古文尚書至陳隋之間伏生之學廢絶而孔傳獨行先是孔傳亡其舜典東晉梅頥乃以王肅所注伏生舜典足其篇至唐孝明不喜𨽻古更以今文行於世昔孔子刪古詩三千餘篇取其三百一十篇著於經秦楚之際亡其六漢興詩分為四一曰魯人申公作訓詁號魯詩二曰齊人轅固生作傳號齊詩三曰燕人韓嬰作内外傳號韓詩四曰河間人毛公作訓傳號毛詩三家並立學官而毛以後出至平帝時始列於學其後馬融賈逵鄭衆康成之徒皆發明毛公其學遂盛魏晉之間齊魯之詩廢絶韓詩雖在而益微故毛氏獨行至今韓嬰之書至唐猶在今其存者十篇而已漢志嬰書五十篇今但存其外傳非嬰傳詩之詳者而其遺説時見於他書與毛之義絶異而人亦不信去聖既逺誦習各殊至於考風雅之變正知王政之興衰其善惡美刺不可不察焉禮樂之制盛於三代而大備於周三代之興皆數百年而周最久始武王周公修太平之業畫天下以為九服上自天子至於庶人皆有法度方其郊祀天地開明堂以㑹諸侯其車旗服器文章爛然何其盛哉及幽厲之亂周室衰其後諸侯漸大然齊桓賜胙而拜晉文不敢必請隧以禮維持又二百餘年禮之功亦大矣下更戰國禮樂殆絶漢興禮出淹中后戴諸儒共為補綴得百餘篇三鄭王肅之徒皆精其學而說或不同夫禮極天地朝廷宗廟凡人之大倫可謂廣矣雖百家殊説豈不博哉自漢巳來㳂革之制有司之傳著於書者可以覽焉三代禮樂自周之末其亡失已多又經秦世滅學之暴然書及論語孝經得藏孔子之家易以卜筮不禁而詩本諷誦不専在於竹帛人得口以傳之故獨禮之於六經其亡最甚而樂又有聲器尤易為壊失及漢興考求典籍而樂最闕學者不能自立遂并其說於禮家書為五經流别為六藝夫樂所以達天地之和而飾化萬物要之感格人神象見功德記曰五帝殊時不相㳂樂所以王者有因時制作之盛何必區區求古遺闕至於律吕鐘石聖人之法雖更萬世可以考也自漢已來樂之㳂革惟見史官之法其書不備隋唐所録今著其存者云昔周法壊而諸侯亂平王已後不復雅而下同列國吳楚徐夷並僣稱王天下之人不稟周命久矣孔子生末世欲推明王道以救周乃聘諸侯極陳君臣之理諸侯無能用者退而歸魯即其舊史考諸行事加以王法正其是非凡其所書一用周禮為春秋十二篇以示後世後世學者傳習既久其説遂殊公羊髙穀梁赤左丘明鄒氏夾氏分為五家鄒夾最㣲自漢世已廢而三家盛行當漢之時易與論語分為三詩分為四禮分為二及學者散亡僅存其一而餘家皆廢獨春秋三傳並行至今孔子大修六經之文獨於春秋欲以禮法繩諸侯故其辭尤謹約而義微隠學者不能極其説故三家之傳於聖人之㫖各有得焉太史公曰為人君者不可不知春秋豈非王者之法具在乎論語者盖孔子相與弟子時人講問應荅之言也孔子卒羣弟子論次其言而撰之漢興傳者三家魯人傳之謂之魯論齊人傳之謂之齊論而齊論増問王知道二篇今無之出於孔子壁者則曰古論有兩子張是三家者篇第先後皆所不同考今之次即所謂魯論者也古者教學之法八歳而入小學以習六甲四方書數之藝至於成童而後授經儒者究天地人神事物之理無所不通故其學有次第而後大成焉爾雅出於漢世正名物講説者資之於是有訓詁之學文字之興隨世轉易務趨便省久後乃或亡其本三倉之説始志字法而許慎作説文於是有偏傍之學五聲異律清濁相生而孫炎始作字音於是有音韻之學篆𨽻古文為體各異秦漢已來學者務極其能於是有字書之學先儒之立學其初為法未始不詳而明後世猶或訛失故小學不可闕焉昔孔子刪書上斷堯典下訖秦誓盖為百篇觀其堯舜之際君臣相與吁俞和諧於朝而天下治三代已下約束賞罰而民莫敢違考其典誥誓命之文純深簡質丁寧委曲為體不同周衰史廢春秋所書尤謹宻矣非惟史有詳畧抑由時君功徳薄厚異世而殊文哉自司馬氏上採黄帝迄於漢武始成史記之一家由漢已來千有餘歳其君臣善惡之迹史氏詳焉雖文質不同要其治亂興廢之本可以考焉昔春秋之後繼以戰國諸侯交亂而史官廢失冊書所載紀次不完司馬遷始為紀傳表志之體網羅千載馳騁其文其後史官悉用其法春秋之義書元月取謹一時無事猶空書其首月以為四時不具則不足成年所以上尊天時紀正人事自晉荀悦為漢紀始復編年之體學徒稱之後世作者皆與正史並行云右皇朝王溥等修實録起於唐世自髙祖至於武宗其後兵盜相交史不暇録而賈緯作補録十或得其一二五代之際尤多故矣天下乖隔號令並出傳記之士訛謬尤多幸而中國之君實録粗備其盛衰善惡之迹較然而著不可冺矣周禮天子諸侯皆有史官晉之乘楚之檮杌考其紀事為法不同至於周衰七國交侵各尊其主是非多異尋亦磨滅其存無幾若乃史官失職畏怯回隠則㳺談處士亦各記其説以伸所懐然自司馬遷之多聞當其作史記必上採帝繫世本旁及戰國荀卿所録以成書則諸家之説可不備存乎周室之季吳楚可謂彊矣而仲尼修春秋書荆以狄之雖其屢進不過子爵所以抑黜侵亂而使後世知懼三代之弊也亂極於七雄並王漢之弊也亂極於三國魏晉之弊也亂極於永嘉以來隋唐之弊也亂極於五代之際天下分為十三四而私竊名號者七國及乎大宋受命王師四征其繫纍負質請死不暇九服遂歸於有徳厯考以前僣竊邦國雖因時苟偷自彊一方然卒於禍敗故録於篇以為賊亂之戒云右不著撰人名氏載兩省而下諸司吏人次補選格堯舜三代建官名數不同周之六官備矣漢唐之興皆因秦隋官號而損益之足以致治興化由此而言存乎舉職事代天工而已至於車服印綬爵秩俸廩因時為制著於有司書曰無曠庶官又曰允釐百工夫百官象物奉職恭位此虞舜之所以端拱無為而化成天下可不重哉右詔襃荅藏之秘府昔漢諸儒得古禮}
