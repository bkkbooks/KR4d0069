  - {type: variant, offset: 1054, length: 0, content: '', WYG: 以母老求知杭州即拜端明殿學士以徃三年徙南京留守未行丁母夫人憂明年八月某日以疾卒於家享年五十有六嵗蔡氏之譜自晉從事中郎克以來世有顯聞其後中衰隠徳不仕公年十八以農家子舉進士為開封第一名動京師後官於閩典方州領使一路二親尚皆無恙閩人瞻望咨嗟不榮公之貴而榮其父母母夫人尤有夀年九十餘飲食起居康强如少者嵗時為夀母子鬚鬢皆皤然而命服金紫煌煌如也至今閩人之為子者必以夫人祝其親為父母者必以公教其子也公於朋友重信義聞其喪則不御酒肉為位以哭盡哀乃止嘗㑹飲靈東園坐客有射矢誤中傷人者客遽指為公矢京師喧然事既聞上以問公公即再拜愧謝終不自辯退亦未嘗以語人公為文章清遒粹美有文集若干巻工於書畫頗自惜不妄為人書故其殘章斷藁人悉珍藏而仁宗尤愛稱之御製元舅隴西王碑文詔公書之其後命學士撰温成皇后碑文又勑公書則辭不肯書曰此待詔職也公累官至禮部侍郎既卒翰林學士王珪等十餘人列言公賢其亡可惜天子新即位未及識公而聞其名久也為之惻然特贈吏部侍郎官其子旻為秘書省正字孫傳及弟之子均皆守將作監主簿而優以賻䘏以旻尚幼命守吏助給其喪事曽祖諱顯皇不仕祖諱恭贈工部員外郎父諱琇贈刑部侍郎母夫人盧氏長安郡太君夫人葛氏永嘉郡君子男三人曰勺將作監主簿曰旬大理評事皆先公卒幼子旻也女三人一適著作佐郎謝仲規二尚幼以某年某月某日𦵏公於莆田縣某鄉將軍山銘曰誰謂閩逺而多竒産産非物寳惟士之賢嶷嶷蔡公其人傑然奮躬當朝讜言正色出入左右彌縫補闕間歸於閩有政在人食不畏蠱喪不憂貧疾者有醫學者有師問誰使然孰不公思有髙其墳有拱其木凡閩之人過者必肅歐陽文粹巻十九欽定四庫全書歐陽文粹巻二十宋陳亮編墓銘尹師魯師魯河南人姓尹氏諱洙然天下之士識與不識皆稱之曰師魯盖其名重當世而世之知師魯者或推其文學或髙其議論或多其材能至其忠義之節處窮達臨禍福無愧於古君子則天下之稱師魯者未必盡知之師魯為文章簡而有法博學强記通知今古長於春秋其與人言是是非非務窮盡道理乃已不為苟止而妄隨而人亦罕能過也遇事無難易而勇於敢為其所以見稱於世者亦所以取嫉於人故其卒窮以死師魯少舉進士及第為絳州正平縣主簿河南府户曹叅軍邵武軍判官舉書判拔萃遷山南東道掌書記知伊陽縣王文康公薦其才召試充館閣校勘遷太子中允天章閣待制范公貶饒州諫官御史不肯言師魯上書言仲淹臣之師友願得俱貶貶監郢州酒稅又徙唐州遭父喪服除復得太子中允知河南縣趙元昊反陜西用兵大將葛懐敏奏起為經略判官師魯雖用懐敏辟而尤為經畧使韓公所深知其後諸將敗於好水韓公降知秦州師魯亦徙通判濠州久之韓公奏得通判秦州遷知涇州又知渭州兼涇原路經畧部署坐城水落與邉臣異議徙知晉州又知潞州為政有惠愛潞州人至今思之累遷官至起居舍人直龍圖閣師魯當天下無事時獨喜論兵為叙燕息戍二篇行於世自西兵起凡五六嵗未嘗不在其間故其論議亦精宻而於西事尤習其詳其為兵制之說述戰守勝敗之要盡當今之利害又欲訓土兵代戌卒以減邉用為禦戎長久之䇿皆未及施為而元昊臣西兵解嚴師魯亦去而得罪矣然則天下之稱師魯者於其材能亦未必盡知之也初師魯在渭州將吏有違其節度者欲按軍法斬之而不果其後吏至京師上書訟師魯以公使錢貸部將貶崇信軍節度副使徙監均州酒稅得疾無醫藥舁至南陽求醫疾革隠几而坐顧稚子在前無甚憐之色與賔客言終不及其私享年四十有六以卒師魯娶張氏某縣君有兄源字子漸亦以文學知名前一嵗卒師魯凡十年間三貶官喪其父又喪其兄有子四人連喪其三女一適人亦卒而其身終以貶死一子三歳四女未嫁家無餘貲客其喪於南陽不能歸平生故人無逺邇皆徃賻之然後妻子得以其柩歸河南以某年某月某日𦵏於先塋之}
