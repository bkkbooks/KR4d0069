  - {type: variant, offset: 1866, length: 0, content: '', WYG: 之曰汝父為吏㢘而好施與喜賔客其俸禄雖薄常不使有餘曰毋以是為我累故其亡也無一瓦之覆一壠之植以庇而為生吾何恃而能自守邪吾於汝父知其一二以有待於汝也自吾為汝家婦不及事吾姑然知汝父之能養也汝孤而幼吾不能知汝之必有立然知汝父之必將有後也吾之始歸也汝父免於母喪方逾年嵗時祭祀則必涕泣曰祭而豐不如養之薄也間御酒食則又涕泣曰昔常不足而今有餘其何及也始吾一二見之以為新免於喪適然耳既而其後常然至其終}
  - {type: page-break, offset: 1866, content: '', id: KR4d0069_WYG_020-9b, image: WYG1103/WYG1103-0802d.png}
  - {type: variant, offset: 1867, length: 2, content: 四通, WYG: 未嘗不然吾雖不及事姑而以此知汝父之能養也汝父為吏嘗夜燭治官書屢廢而歎吾問之則曰此死獄也我求其生不得爾吾曰生可求乎曰求其生而不得則死者與我皆無恨也矧求而有得邪以其求而得則知不求而死者恨也夫常求其生猶失之死而世常求其死也回顧乳者劒汝而立於旁因指而歎曰術者謂我歳行在戌將死使其言然吾不及見兒之立也後當以我語}
  - {type: page-break, offset: 1867, content: '', id: KR4d0069_WYG_020-10a, image: WYG1103/WYG1103-0803a.png}
  - {type: variant, offset: 1870, length: 3, content: 于皇妣, WYG: 之其平居教他子弟常用此語吾耳熟焉故能詳也其施於外事吾不能知其居於家無所矜飾而所為如此是真發於中者邪嗚呼其心厚於仁者邪此吾知汝父之必將有後也汝其勉之夫養不必豐要於孝利雖不得博於物要其心之厚於仁吾不能教汝此汝父之志也脩泣而志之不敢忘先公少孤力學咸平三年進士及第為道州判官泗綿二州推官又為泰州判官享年五十有九𦵏沙溪之瀧岡}
  - {type: page-break, offset: 1870, content: '', id: KR4d0069_WYG_020-10b, image: WYG1103/WYG1103-0803b.png}
