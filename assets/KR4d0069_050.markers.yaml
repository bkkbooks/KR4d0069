  - {type: variant, offset: 0, length: 0, content: '', WYG: 禮樂禮樂治民之具也王者之愛養斯民其於教導之方甚勤而備故禮防民之欲也周樂成民之俗也厚苟不由焉則賞不足勸善刑不足禁非而政不成大宋之興八十餘嵗明天子仁聖思致民於太平久矣而天下之廣元元之衆州縣之吏奉法守職不暇其他使愚民目不識俎豆耳不聞弦匏民俗頑鄙刑獄不衰而吏無任責夫先王之遺文具在凡嵗時吉凶聚㑹考古禮樂可施民間者其别有㡬順民便事可行於今者有㡬行之固有次第其所當先者又有㡬禮樂興而後臻於富庶歟將既富而後教之歟夫政緩而迂鮮近事實教不以漸則或戾民欲其不迂而政易成有漸而民不戻者其術何云儒者之於禮樂不徒誦其文必能通其用不獨學於古必可施於今願悉陳之無讓問六經六經者先王之治具而後世之取法也書載上古春秋紀事詩以微言感刺易道隱而深矣其切於世者禮與樂也自秦之焚書六經盡矣至漢而出者皆其殘脫顛倒或傳之老師昏耄之說或取之冢墓屋壁之間是以學者不明異說紛起況乎周禮其出最後然其為書備矣其天地萬物之統制禮作樂建國君民養生事死禁非道善所以為治之法皆有條理三代之政美矣而周之治迹所以比二代而尤詳見於後世者周禮著之故也然漢武以為瀆亂不驗之書何休亦云六國隂謀之說何也然今考之實有可疑者夫内設公卿大夫下至府史胥徒以相副貳外分九服建五等差尊卑以相統理此周禮之大略也而六官之屬略見於經者五萬餘人而里閭縣鄙之長軍師卒伍之徒不與焉王畿千里之地為田㡬井容民㡬家王官王族之國邑㡬數民之貢賦㡬何而又容五萬人者於其間其人耕而賦乎如其不耕而賦則何以給之夫為治者故若是之煩乎此其一可疑者也秦既誹古盡去古制自漢以後帝王稱號官府制度皆襲秦故以至於今雖有因有革然大抵皆秦制也未嘗有意於周禮者豈其體大而難行乎其果不可行乎夫立法垂制將以遺後也使難行而萬世莫能行與不可行等爾然則反秦制之不若也脫有行者亦莫能興或因以取亂王莽後周是也則其不可用決矣此又可疑也然其祭祀衣服車旗似有可采者豈所謂郁郁之文乎三代之治其要如何周禮之經其失安在宜於今者其理安從其悉陳無隱問為治古者為治有繁簡其施於民也有淺深各適其宜而已三代之盛時地方萬里而王所自治者千里而已其餘以建諸侯至於禮樂刑政頒其大法而使守之則其大體蓋簡如此諸侯大小國蓋數千必各立都邑建宗廟卿士大夫朝聘祭祀訓農練卒}
