  - {type: variant, offset: 3520, length: 1, content: 侍, WYG: ''}
  - {type: variant, offset: 3522, length: 1, content: 蔡, WYG: 中留守南京太夫人以疾終於官舍享年七十有二又八年脩以非才入副樞宻遂參政事又七年而罷自登二府天子推恩褒其三世故自嘉祐以來逢國大慶必加寵錫皇曾祖府君累贈金紫光禄大夫太師中書令曽祖妣累封楚國太夫人皇祖府君累贈金紫光禄大夫太師中書令兼尚書令祖妣累封吳國太夫人皇考崇}
  - {type: page-break, offset: 3522, content: '', id: KR4d0069_WYG_020-11b, image: WYG1103/WYG1103-0803d.png}
  - {type: 'kr:newline', offset: 3523, content: '

      ', id: KR4d0069_krp_050-bkkkrnewl215}
  - {type: line-break, offset: 3523, content: '', id: KR4d0069_SBCK_050-10b07}
  - {type: variant, offset: 3524, length: 4, content: 君謨之靈, WYG: 累贈金紫光禄大夫太師中書令兼尚書令皇妣累封越國太夫人今上初郊皇考賜爵為崇國公太夫人進號魏國於是小子脩泣而言}
  - {type: variant, offset: 3531, length: 2, content: 盛必, WYG: 為善無不報而遲速}
  - {type: variant, offset: 3534, length: 7, content: 衰而生必有死物, WYG: 時此理}
  - {type: 'kr:newline', offset: 3543, content: '

      ', id: KR4d0069_krp_050-bkkkrnewl216}
  - {type: line-break, offset: 3543, content: '', id: KR4d0069_SBCK_050-10b08}
  - {type: variant, offset: 3543, length: 1, content: 理, WYG: ''}
  - {type: variant, offset: 3545, length: 0, content: '', WYG: 惟我祖考積善成徳宜享其隆雖不克有於其躬而錫爵受封顯榮褒大實有三朝之錫命是足以表見於後世而庇賴其子孫矣乃列其世譜具刻於碑既又載我皇考崇公之遺訓太夫人之所以教而有待於脩者並揭於阡俾知夫小子脩之徳薄能鮮遭時竊位而幸全大節不辱其先者其來有自周堯卿有篤行君子曰周君者孝於其親友於其兄弟居父母喪與其兄某弟某居於倚廬不飲酒食肉者三年其言必戚其哭必哀除喪而癯然不能勝人事者盖久而後復自孔子在魯而魯人不能行三年之喪其弟子疑以為問則非魯而他國可知也孔子沒而其後世又可知也今世之人知事其親者多矣或居喪而不哀者有矣}
  - {type: page-break, offset: 3545, content: '', id: KR4d0069_WYG_020-12a, image: WYG1103/WYG1103-0804a.png}
  - {type: page-break, offset: 3545, content: '', id: KR4d0069_WYG_020-12b, image: WYG1103/WYG1103-0804b.png}
  - {type: variant, offset: 3546, length: 3, content: 爲可樂, WYG: 能事}
  - {type: substitution, offset: 3546, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: variant, offset: 3551, length: 1, content: 爲, WYG: 能哀或不知喪禮者有矣或知禮而以為喪主於哀而已不必合於禮者有矣如周君者事生盡孝居喪盡哀而以禮者也禮之失久矣喪禮尤廢也今之居喪者惟仕宦婚嫁聴樂不為此特法令之所禁爾其衰麻之數哭泣之節居處之别飲食之變皆莫知夫有禮也在上位者不以身率其下在下者無所望於其上其遂廢矣乎故吾於周君有所取也君諱堯卿字子俞道州永明人也天聖二年舉進士累官至太常博士厯連衡二州司理叅軍桂州司録知髙安寧化二縣通判饒州未行以慶厯五年六月朔日卒於朝集之舍享年五十有一皇祐五年某月日葬於道州永明縣之紫微岡曽祖諱某祖諱某父諱某贈某官母唐氏封某縣太君娶某氏封某縣君君學長於毛鄭詩左氏春秋家貧不事生産喜聚書居官禄雖薄常分俸以賙宗族朋友人有慢已者必厚為禮以愧之其為吏所居皆有能政有文集二十巻君有子七人曰諭鼎州司理叅軍曰詵湖州歸安主簿曰諮曰諷曰諲曰説曰誼皆未仕嗚呼孝非一家之行也所以移於事君而忠仁於宗族而睦交於朋友而信始於一鄉推之四海表於金石示之後世而勸考君之所施者無不}
