  - {type: line-break, offset: 251, content: '', id: KR4d0069_SBCK_050-1b07}
  - {type: variant, offset: 251, length: 1, content: 乎, WYG: 惶恐避席始退而條列時所宜先者十數事上之其詔天下興}
  - {type: variant, offset: 253, length: 4, content: 古居今持, WYG: 取士先徳行不専文辭革磨勘例遷以别能否減任子之數而除濫官用農桑考課守宰等事}
  - {type: variant, offset: 258, length: 4, content: 入圓丘軻, WYG: 施行而磨勘任子}
  - {type: variant, offset: 263, length: 0, content: '', WYG: 法僥倖之人皆不便因相與騰口而嫉公者亦幸外有言喜為之佐佑㑹邉奏有警公即請行乃以公為河東陕西宣撫使至則上書願復守邉即拜資政殿學士知邠州兼陕西四路安撫使其知政事纔一歳而罷有司悉奏罷公前所施行而復其故言者遂以危事中之賴上察其忠不聽是時夏人已稱臣公因以疾請鄧州守鄧三歳求知杭州又徙青州公益病又求知穎州肩舁至徐遂不起享年六十有四方公之病上賜藥存問既薨輟朝一日以其遺表無所請使就問其家所欲為贈以兵部尚書所以哀䘏之甚厚公為人外和内剛樂善汎愛喪其母時尚貧終身非賔客食不重肉臨財好施意豁如也及退而視其私妻子僅給衣食其為政所至民多立祠畫像其行已臨事自山林處士里閭田野之人外至四裔莫不知其名字而樂道其事者甚衆及其世次官爵誌於墓譜於家藏於有司者皆不論著著其繫天下國家之大者亦公之志也歟銘曰范於吳越世實陪臣俶納山川及其士民范始來北中間幾息公奮自躬與時偕逢事有罪功言有違從豈公必能天子用公其}
  - {type: page-break, offset: 263, content: '', id: KR4d0069_WYG_018-6a, image: WYG1103/WYG1103-0789c.png}
  - {type: page-break, offset: 263, content: '', id: KR4d0069_WYG_018-6b, image: WYG1103/WYG1103-0789d.png}
  - {type: variant, offset: 265, length: 3, content: 道則然, WYG: 勞一其初終夏童跳邉乗吏怠安帝命}
  - {type: page-break, offset: 265, content: '', id: KR4d0069_WYG_018-7a, image: WYG1103/WYG1103-0790a.png}
  - {type: variant, offset: 269, length: 0, content: '', WYG: 徃問彼驕頑有不聽順鋤其穴根公居三年怯勇隳完兒憐獸擾卒俾徕臣夏人在庭其事方議帝趣公來以就於治公拜稽首茲為艱哉初匪其難在其終之羣言營營卒壊於成匪惡其成惟公是傾不傾不危天子之明存有顯榮沒有贈諡藏其子孫寵及後世惟百有位可勸無怠余襄公始興襄公既𦵏於曲江之明年其子仲荀走於亳以來告}
  - {type: page-break, offset: 269, content: '', id: KR4d0069_WYG_018-7b, image: WYG1103/WYG1103-0790b.png}
  - {type: variant, offset: 270, length: 2, content: 彼惡, WYG: 余氏世為閩人五代之際逃亂於韶自曽髙以來晦迹嘉遁至於博士府君始有禄仕而襄}
  - {type: 'kr:newline', offset: 271, content: '

