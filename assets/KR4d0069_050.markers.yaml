  - {type: variant, offset: 496, length: 0, content: '', WYG: 祀明堂覃恩遷衛尉卿明年知䖍州丁父憂去官而蠻賊儂智髙陷邕州連破嶺南州縣圍廣州乃即廬中起公為秘書監知潭州即日疾馳在道改知桂州廣南西路經略安撫使公奏曰賊在東而徙臣西非臣志也天子嘉之即詔公經制廣東西賊盜乃趨廣州而智髙復西走邕州自智髙初起交趾請出兵助討賊詔不許公以為智髙交趾叛者宜聴出兵毋沮其善意累疏論之不報至是公曰邕州與交趾接境今不納必忿而反助智高乃以便宜趣交趾㑹兵又募儂黄諸姓酋豪皆縻以職與之誓約使聴節制或疑其不可用公曰使不與智髙合足矣及智髙入邕州遂無外援既而宣撫使狄青㑹公兵敗賊於歸仁智髙走入海邕州平公請復終喪不許諸将班師以智髙尚在請留公廣西委以後事遷給事中諫官御史列䟽言公功多而賞薄再遷尚書工部侍郎公留廣西逾年撫緝完復嶺海肅然又遣人入特磨襲取智髙母及其弟一人俘於京師斬之拜集賢院學士久之徙知潭州又徙青州再遷吏部侍郎嘉祐五年交趾㓂邕州殺五巡檢天子以為恩信著於嶺外而為交趾所畏者公也驛召以為廣西體量安撫使悉發荆湖兵以從公至則移檄交趾召其臣費嘉祐詰責之嘉祐皇恐對曰種落犯邉罪當死願留取首惡以獻即械五人送欽州斬於界上公還邕人遮道留之不得明年以尚書左丞知廣州英宗即位拜工部尚書代還道病卒享年六十有五公經制五管前後十年凡治六州所至有惠愛雖在兵間手不釋巻有文集二十巻奏議五巻}
