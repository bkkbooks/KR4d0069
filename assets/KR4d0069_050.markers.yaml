  - {type: variant, offset: 644, length: 2, content: 爲心, WYG: 不久遷去}
  - {type: substitution, offset: 644, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19875}}
  - {type: variant, offset: 647, length: 0, content: '', WYG: 吏得為姦公始視銓事一日選者三人争某闕公以問吏吏受丙賕對曰當與甲乙不能争遂授他闕居數日吏教丙訟甲負某事不當得公悟召乙問之乙謝曰業已得他闕不願争公不得已與丙而笑曰此非吏罪乃吾未知銓法爾因命諸曹各具格式科條以白問曰盡乎曰盡矣明日勑諸吏無得升堂使坐聴}
