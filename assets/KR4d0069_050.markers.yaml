  - {type: variant, offset: 2, length: 5, content: 集卷第五十, WYG: 古之取士者上下交相待以成其美今之取士者上下交相害欲濟於事可乎古之士教養有素而進取有漸上之禮其下者厚故下之自守者重上非厚禮不能以得士士非自重不能以見禮於上故有國者設爵禄車服禮樂于朝以待其下為士者修仁義忠信孝悌於家以待其上設于朝者知下之能副其待則愈厚居下者知上之不薄于已故愈重此豈不交相成其美歟後世之士則反是上之待其下也以為干利而進爾雖有爵禄之設而日為之防以革進之濫者下之視其上也以為雖自重上孰我知不自進則不能以達由是上之待其下也益薄下之自守者益不重而輕嗚呼居上者欲得其人在下者欲行其道其可得邪原夫三代取士之制如何漢魏迨今其變制又如何宜厯道其詳也制失其本致其反本復自何時欲就今制稍復於古當自何始今之士皆學古通經稍知自重矣而上之所以禮之者未加厚也噫由上之厚然後致下之自重歟必下之自重然後上禮之厚歟二者兩不為之先其勢亦奚由而合也宜具陳其本末與其可施於今者以對}
