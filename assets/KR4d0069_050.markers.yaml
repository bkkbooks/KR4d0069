  - {type: variant, offset: 4, length: 3, content: 首祭程, WYG: 篇以為儀禮而大射之篇獨曰儀盖射主於容升降揖讓不可失記曰禮之末節有司掌之凡為天下國家者莫不講乎三代之制采章文物邦國之典存乎禮官秦漢以來世有損益至於車旗服器有司所記遺文故事凡可録者皆附於史官云刑者聖人所以愛民之具也其禁暴止殺之意一本乎至仁然而執挺刃刑人而不疑者審得其當也故法家之説務原人情極其真偽必使有司不得銖寸輕重出入其為書不得不備厯世之治因時制法縁民之情損益不常故凡法令之要皆著於篇昔禹去水害定民居而别九州之名記之禹貢及周之興畫為九畿而宅其中内建五等之封外撫四方之表職方之述備矣及其衰也諸侯兼并争吞削奪秦漢已來邦國郡縣廢興治亂割裂分屬變易不常至於日月所照要荒附叛山川風俗五方不同行師用兵順民施政考於圖牒可以覽焉昔黄帝之子二十五人得姓命氏由其徳薄厚堯舜夏商周之先皆同出於黄帝而姓氏不同其後世封為諸侯者或以國為姓至於公子公孫官邑諡族遂因而命氏其源流次序帝系世本言之甚詳秦漢以來官邑諡族不自别而為姓又無賜族之禮至於近世遷徙不常則其得姓之因與夫祖宗世次人倫之記尤不可以不考焉傳曰民生在勤勤則不匱故堯舜南面而治考星之中以授人時秋成春作教民無失周禮六官亦因天地四時分其典職然則天時者聖人之所重也自夏有小正周公始作時訓日星氣節十二候凡國家之政生民之業皆取則焉孔子曰吾不如老圃至於山翁野夫耕桑樹藝四時之説其可遺哉法家者流以法繩天下使一本於其術商君申韓之徒乃推而大之挾其説以干世主收取功名至其尊君抑臣辨職分輔禮制於王治不為無益然或狃細苛持深刻不可不察也名家者流所以辨覈名實源流等威使上下之人不}
