  - {type: variant, offset: 1071, length: 8, content: 謹率具官吕某劉某, WYG: 得其所著書二十二篇獻諸朝書既出而公卿士大夫争傳之其二子舉進士皆在髙等亦}
  - {type: variant, offset: 1080, length: 4, content: 清酌庶羞, WYG: 文學稱於時眉山在西南數千里外一日父子隠然名動京師而蘇氏文章遂擅天下君}
  - {type: variant, offset: 1085, length: 8, content: 奠致祭于亡友聖俞, WYG: 文博辯宏偉讀者悚然想見其人既見而温温似不能言及即}
