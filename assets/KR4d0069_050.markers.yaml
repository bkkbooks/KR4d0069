  - {type: variant, offset: 740, length: 6, content: 謹遣驅使官田, WYG: 曰外人知杜某封還内降邪吾居禁中有求恩澤者每以杜某不可告之而止者多於所封還也其助我多矣此外人及杜某皆不知也然公與三人者卒皆以此罷去公多知本朝故實善決大事初邉將議欲大舉以擊夏人雖韓公亦以為可舉公争以為不可大臣至有欲以沮軍罪公者然兵後果不得出契丹與夏人争銀瓮族大戰黄河外而鴈門麟府皆警范文正公}
