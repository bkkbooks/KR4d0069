  - {type: variant, offset: 18, length: 1, content: 申, WYG: 子是歳天子躬耕耤田肆大赦羣臣方頌太平請封禪盖有唐極盛之時也清泰二年歳在乙未廢帝簒立之明年也是歳石敬瑭以太原反召契丹入自鴈門廢帝自焚於洛陽而晉髙祖入自太原五代極亂之時也始終二百年間或治或亂或盛或衰而徃者來者先者後者雖窮達夀夭參差不齊而斯五百人者卒歸於共盡也其姓名歳}
  - {type: page-break, offset: 18, content: '', id: KR4d0069_WYG_016-27a, image: WYG1103/WYG1103-0778a.png}
  - {type: variant, offset: 20, length: 3, content: 日具官, WYG: 風霜剥裂亦或在或亡其存者獨有千仞之山石爾故特録其題刻每撫巻慨然何異臨長川而歎逝者也}
  - {type: page-break, offset: 23, content: '', id: KR4d0069_WYG_016-27b, image: WYG1103/WYG1103-0778b.png}
  - {type: variant, offset: 25, length: 1, content: 脩, WYG: 文粹巻十六欽定四庫全書歐陽文粹巻十七宋陳亮編碑銘王文正公至和二年七月乙未樞宻直學士右諌議大夫王素奏事殿中巳而泣且言曰臣之先臣旦相真宗皇帝十有八年今臣素又得待罪侍從之臣惟是先臣之訓其遺業餘烈臣實無似不能顯大而墓碑至今無辭以刻惟陛下哀憐不忘先帝之臣以假寵於王氏而朂其子孫天子曰嗚呼惟汝父旦事我文考真宗叶德一心克終厥位有始有卒其可謂全德元老矣汝素以是刻於碑素拜稽首泣而出明日有詔史舘修撰歐陽修曰王旦墓碑未立汝可以銘臣修}
  - {type: page-break, offset: 25, content: '', id: KR4d0069_WYG_017-1a, image: WYG1103/WYG1103-0779a.png}
  - {type: page-break, offset: 25, content: '', id: KR4d0069_WYG_017-1b, image: WYG1103/WYG1103-0779b.png}
