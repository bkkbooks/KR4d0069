  - {type: line-break, offset: 0, content: '', id: KR4d0069_SBCK_038-1a01}
  - {type: variant, offset: 0, length: 1005, content: 居士集卷第三十八歐陽文忠公集三十八行狀二首尚書戸部侍郎贈兵部尚書蔡公行狀公諱齊字子思其先洛陽人皇祖以下始著籍於膠東公㓜依外舅劉氏能自力爲學𥘉作詩已有動人語今相國李公見之大驚謂公之皇考曰兒有大志冝善視之州舉進士第一以書薦其里人史防而居其次祥符八年眞宗皇帝采賈誼置器之說試禮部所奏士讀至公賦有安天下意歎曰此宰相器也凡貢士當賜第者考定必召其高第數人並見又叅擇其材質可者然後賜第一及公召見衣冠偉然進對有法天子爲無能過者亟以第一賜之𥘉拜將仕郎將作監丞通判兖州太守諸夲作原王臻治政嚴急喜以察盡一作盡察爲明公務爲裁損濟之以寛獄訟爲之不冤逾年通判濰州民有告某氏刻僞稅印爲姦利者巳逾十年蹤跡連蔓至數百人公歎曰盡利於民民無所逃此所謂法出而姦生者邪是爲政者之過也爲緩其獄得減死者十餘人餘皆釋而不問濰人皆曰公德於我使我自新爲善人由是風化大行天禧二年還京師當召試時大臣有用事者意不恱公居數月不得召乆而天子記其姓名趣使召試拜著作佐郎直集賢院階再加爲宣德郎勲騎都尉主判三司開坼司賜緋衣銀魚遷右正言階朝奉郎勲上騎都尉今天子即位遷右司諌眞宗新弃天下天子諒隂不言丁晉公用事專權欲邀致公許以知制誥公拒不徃益堅已而冦萊公王文康公皆以不附已連黜公歸歎曰吾受先帝之知而至於此豈冝爲權臣所脅得罪非吾懼也旣而晉公敗士甞爲其用者皆恐懼獨公終無所屈未幾同修起居注又拜尚書禮部貟外郎兼侍御史知雜事判流内銓賜服金紫改三司户部度支二副使轉勲輕車都尉借給事中奉使契丹天聖八年拜起居舎人知制誥同知審官院㑹靈宫判官充翰林學士加侍讀學士賜爵汝南縣開國子食邑五百戸太后修景德寺成詔公爲記而宦者羅崇勲主營寺事使人隂謂公曰善爲記當得叅知政事公故遲之頗乆使者數趣終不以進崇勲怒讒之太后遷禮部郎中改龍圖閣直學士出爲西京留守是時魯肅簡公方叅知一無此字政事爭之太后前卒不能留以親便求改密州遭歲旱除其公田之租數千石諸本作碩疑頃字訛又請悉除京東民租弛其鹽禁使民得賈海易食以救其飢東人至今頼之皆曰使吾人百萬口活而不飢者蔡公也徙南京留守進爵侯増邑戸五百爲一千階朝散大夫召還拜右諌議大夫權御史中丞判吏部流内銓遷給事中勲護軍増邑五百爲千五百戸莊獻明肅皇太后崩議尊楊太妃爲太后垂簾聽政議決召百官賀公曰天子明聖奉太后十餘年今始躬親萬事以慰天下之心豈冝女后相繼稱制且自古無有固止不追班太妃卒不預政止稱太后於宫中復爲龍圖閣直學士權三司使京師有指荆王爲飛語者内侍省得三司小吏鞫之連及數百人上聞之大怒詔公窮治迹其所, WYG: ''}
