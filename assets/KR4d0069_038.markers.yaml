  - {type: variant, offset: 989, length: 1678, content: 無端而上督責愈急有司不知所爲京師爲之恐動公以謂繆妄之說起於小人不足窮治且無以慰安荆王危疑之心奏䟽論之一夕三上上大悟乃可其奏止笞數人而巳中外之情乃安拜樞密副使進爵公増邑戸五百爲二千南海蠻酋虐其部人部人𣢾冝州自歸者八百餘人議者以爲叛蠻不可納冝還其部公獨以爲蠻去殘酷而歸有德且以求生冝内之荆湖賜以間田使自營今縱却之必不復還其一無此字部茍散入山谷當爲後患爭之不能得其後數年蠻果爲亂殺將吏十餘人冝桂以西皆警朝廷頗以爲憂景祐元年遷禮部侍郎叅知政事二年賜號推忠佐理功臣進階正奉大夫勲柱國郭皇后廢京師冨人陳氏女有色選入宫爲后公爭之以爲不可自辰至巳辨論不巳上意稍悟遂還其家河決横壠改而北流議者以爲當塞公曰水性下而河北地卑順其所趣以導之可無澶滑壅潰之患而貝博數州得在河南於國家便但理堤護魏州而巳從之澶滑果無患契丹祭天於幽州以兵屯界上界上驚搔議者欲發大軍以備邊公獨料其必不動後卒無事公在大位臨事不回無所牽畏而恭謹謙退未甞自伐天下推之爲正人搢紳之士倚以爲朝廷重三年頻表一有求字解職不許明年遂罷以戸部侍郎歸班改賜推誠保德功臣勲上柱國乆之出知潁州寳元二年四月四日以疾卒于官公在潁州聞西方用兵惻然有憂國心自以待罪外邦不得盡其所懷使其弟禀言西事甚詳公之卒故吏朱寀至潁潁之吏民見寀一有號字泣一有拜字於馬前指公甞所更歷施爲曰此公之迹也其爲政有仁恩所至如此平生喜薦士一有所薦二字如楊偕郭勸劉隨龐籍叚少連比比爲當世名臣公爲人神色明秀須眉如畫精學博聞寛大沈黙一言之出終身可復其莅官行已出處始終之大節可考不誣如此謹按贈兵部尚書於令爲三品其法當謚敢告有司謹狀司封貟外郎許公行狀君諱逖字景山世家歙州少仕僞唐爲監察御史李氏國除以族北遷獻其文若干篇得召試爲汲縣尉冠氏主簿凡主簿二歲縣民七百人詣京師願得君爲令遷秘書省校書郎知縣事數上書論北邊事是時趙普爲相四方奏䟽不可其意者悉投二甕中甕滿輒出而焚之未甞有所肯可獨稱君爲能曰其言與我多合又二歳徙江華令未行轉運使樊知古薦其材拜太僕寺丞磨勘錢帛粮草監永城和糴知海陵監三歳用鹽最遷大理寺丞賜緋衣銀魚監泗州排岸司遷賛善大夫監永興軍榷貨務遷太常丞知鼎州州雜蠻蜑喜以攻劫爲生少年百餘人私自署爲名號常伺夜出掠居人居人惡之莫敢指君至而歎曰夫政民之庇也威不先去其惡則惠亦不能及人君政旣行盗皆亡入他境約君去乃還遷國子愽士奉使兩浙江南言茶鹽利害省州縣之役皆稱旨出知興元府大修山河堰堰水舊漑民田四萬餘頃世傳漢蕭何所爲君行壞堰顧其屬曰鄼侯方佐漢取天下乃暇爲此以漑其農古之聖賢有以利人無不爲也今吾豈冝憚一時之勞而廢古人萬世之利乃率工徒躬治木石石墜傷其左足君益不懈堰成歳穀大豐得嘉禾十二莖以獻遷尚書主客貟外郎京西轉運使徙荆湖南路荆湖南接谿洞諸蠻歳出爲州縣患君曰鳥獸可馴況蠻亦人乎乃召其酋豪諭以禍福諸蠻皆以君言爲可信訖三歲不以蠻事聞朝廷君罷來朝眞宗面稱其能㑹有司言荆南乆不治眞宗拜君度支貟外郎知府事荆南鈐轄北路兵馬於荆湖爲大府故常用重人至君特選以材用貟外郎自君而始明年遷司封貟外郎賜金紫徙知揚州州居南方之㑹世之仕宦於南與其死而無歸者皆寓其家于揚州故其子弟雜居民間徃徃倚權貴恃法得贖出入里巷爲不法至或破亡其家君捕其甚者笞之曰此非吏法乃吾代汝父兄教也子弟羞媿自悔稍就學問爲善人風俗大化歳滿在道得疾卒于髙郵君少孤事其母兄以孝謹聞常戒其妻事嫂如姑而未甞敢先其兄食衣雖弊兄不易衣不敢易𥘉違命侯遣其弟朝京師君之故友全一作金一作潘惟岳當從以其家屬託君惟岳果留不返君善撫其家爲嫁其女數人李氏國亡君載其家北歸京師以還惟岳歷官四十年不問家事好學尤喜孫吴兵法𥘉在僞唐數上書言事得校書郎遂遷御史王師圍金陵李氏大將李雄擁兵數萬留上江隂持兩端李氏患之以謂非君不能召雄君走上江以語動雄雄即聽命巳而李氏以蠟書止雄於溧水君曰此非柵兵之地留之必敗乃戒雄曰兵來愼無動待我一夕吾當入白可與公兵俱入城君去王師挑之雄輒出戰果敗死君至收其餘卒千人而去君少慷慨卒能自立於時其孝謹聞於其族其信義著於其友其材能稱於其官是皆可書以傳謹狀居士集卷第三十八熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益挍正蔡公行狀詩巳有一作巳能有許公行狀全惟岳全恕本作金, WYG: ''}
