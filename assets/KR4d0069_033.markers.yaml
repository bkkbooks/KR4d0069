  - {type: variant, offset: 0, length: 1193, content: 居士集卷第三十三歐陽文忠公集三十三墓誌四首尚書工部郎中充天章閣待制許公墓誌銘并序公諱元字子春姓許氏宣州宣城人也許氏世以孝謹稱郷里其父亡一子當官兄弟相讓乆之曰吾弟材後必庇吾宗乃以公𥙷郊社齋郎徙居海陵力耕以飬其母調明州定海劒州順昌縣尉㤗州軍事推官戍兵千人自海上亡歸州守聞變不知所爲公爲詰其所以來二三人出前對公叱左右執之曰惑衆者此爾其餘何罪勞其徒而遣之遷鎭東軍節度推官知潤州丹陽縣縣有練湖决水一寸爲漕渠一尺故法盗决湖者罪比殺人㑹歲大旱公請借湖水漑民田不待報决之州守遣吏按問公曰便民罪令可也竟不能詰由是漑民田萬餘項歲乃大豐再遷太子中舍監揚州博鹽和糴倉知㤗州如臯縣所至民愛思之公爲吏喜修廢壞其術長於治財自元昊叛河西兵出乆無功而天下勞弊三司使言公材以主榷貨公言先時賈人入粟塞下京師錢不足以償故錢償愈不足則粟入愈少而價愈髙是謂内外俱困請髙塞粟之價下南鹽以償之使東南去滯積而西北之粟盈曰此輕重之術也行之果便是時京師粟少而江淮歲漕不給三司使懼大臣以爲憂叅知政事范仲淹謂公獨可辦乃以公爲江淮兩浙荆湖發運判官公曰以六路七十二州之粟不能足京師者吾不信也至則治千艘浮江而上所過州縣留三月食其餘悉發而州縣之廩逺近以次相𥙷由是不數月京師足食旣而嘆曰此可爲於乏時然歲漕不給者有司之職廢也乃考故事明約信令發歛轉徙至於風波逺近遲速賞罰皆有法凡江湖數千里外談笑治之不擾不勞而用以足公𥘉以殿中丞爲判官巳而爲副爲使毎歲終㑹計來朝天子必加恩禮特賜進士出身官至工部郎中天章閣待制凡在職十有三年巳而曰臣憊矣願乞臣一州天子顧代公者難其人其請至八九乆之察其實病且老矣乃以知揚州居歲餘徙知越州公益病又徙㤗州至州未視事以嘉祐二年四月某日卒于家享年六十有九曾祖諱稠池州録事叅軍祖諱規贈大理評事父諱逖尚書司封貟外郎贈工部侍郎公娶馮氏封崇德縣君先公卒子男二人長曰宗旦眞州楊子縣主簿次曰宗孟守將作監主簿女一人適太常寺太祝滕希雅先是江淮歲漕京師者常六百萬石其後十餘歲歲益不充至公爲之歲必六百萬而常餘百萬以備非常方其去職有勸公進爲羡餘者公曰吾豈聚歛者哉敢用此以希寵公爲人善談論與人交乆而益篤於其家尤孝悌所得俸禄分給宗族無親踈之異其孤宗旦等以某年某月某日葬公於真州楊子縣甘露郷之某原其所與遊廬陵歐陽脩誌於其墓曰嗚呼爲天下者固常養材於無事之時蓋必有事然後材臣出自寳元慶暦以來兵動一方奔走從事於其間者皆號稱天下豪傑其智者出謀材者獻力訖不得少如其志而公遭此時用其所長且乆於其官故得卒就其業而成此名此其可以書矣乃爲之銘曰材難矣有藴而不得其時時逢矣有用而不盡其施功難成而易毀雖明哲或不能以自知公材之敏兮用適其冝志方甚壯兮力則先衰行著于家而勞施于國永幽其閟兮銘以哀之尚書刑部郎中充天章閣待制兼侍讀贈右諌議大夫孫公墓誌銘公諱甫字之翰許州陽翟人也𥘉舉進士天聖五年得同學究出身爲蔡州汝陽縣主簿八年再舉進士及第爲一無此字華州觀察推官轉運使李紘薦其材遷大理寺丞知絳州翼城縣故丞相, WYG: ''}
