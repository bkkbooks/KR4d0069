  - {type: variant, offset: 0, length: 289, content: 外集卷第十六歐陽文忠公集六十六書一上范司諫書月日具官謹齋沐拜書司諫學士執事前月中得進奏吏報云自陳州召至闕拜司諫即欲爲一書以賀多事怱一作卒卒未能也司諫七品官爾於執事得之不爲喜而獨區區欲一賀者誠以諫官者天下之得失一時之公議繫焉今世之官自九卿百執事外至一郡縣吏非無貴官大職可以行其道也然縣越其封郡逾其境雖賢守長不得行以其有守也吏部之官不得理兵部鴻臚之卿不得理光禄以其有司也若天下之失得生民之利害社稷之大計惟所見聞而不繫職司者獨宰相可行之諫官可言之爾故一有謂字士學古懷道者仕於時不得爲宰相必爲諫官諫官雖卑與宰相等天子曰不可宰相曰可天子曰然宰相曰不然坐乎廟堂之上與天子相可否者宰相也天子曰, WYG: ''}
