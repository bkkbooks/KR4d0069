  - {type: variant, offset: 228, length: 4162, content: 樂治民之具也王者之愛養斯民其於教導之方甚勤而備故禮防民之欲也周樂成民之俗也厚苟不由焉則賞不足勸善刑不足禁非而政不成大宋之興八十餘歳明天子仁聖思致民於太平乆矣而天下之廣元元之衆州縣之吏奉法守職不暇其他使愚民目不識爼豆耳不聞弦匏民俗頑鄙刑獄不衰而吏無任責夫先王之遺文具在凡歳時吉凶聚㑹考古禮樂可施民間者其别有㡬順民便事可行於今者有㡬行之固有次第其所當先者又有㡬禮樂興而後臻於冨庶歟將旣冨而後教之歟夫政緩而迂鮮近事實教不以漸則或戾民欲其不迂而政易成有漸而民不戾者其術何云儒者之於禮樂不徒誦其文必能通其用不獨學於古必可施於今願悉陳之無讓問進士䇿三首問六經者先王之治具而後丗之取法也書載上古春秋紀事詩以微言感刺易道隱而深矣其切於丗者禮與樂也自秦之焚書六經盡矣至漢而岀者皆其殘脫顚倒或傳之老師昏耄之說或取之冡墓屋壁之間是以學者不明異說紛起況乎周禮其出最後然其爲書備矣其天地萬物之統制禮作樂建國君民養生事死禁非道善所以爲治之法皆有條理三代之政美矣而周之治迹所以比二代而尤詳見於後丗者周禮著之故也然漢武以爲瀆亂不驗之書何休亦云六國隂謀之說何也然今考之實有可疑者夫内設公卿大夫士下至府史胥徒以相副貳外分九服建五等差尊卑以相統理此周禮之大略也而六官之屬略見於經者五萬餘人而里閭縣鄙之長軍師卒伍之徒不與焉王㡬千里之地爲田㡬井容民㡬家王官王族之國邑㡬數民之貢賦㡬何而又容五萬人者於其間其人耕而賦乎如其不耕而賦則何以給之夫爲治者故若是之煩乎此其一可疑者也秦旣誹古盡去古制自漢以後帝王稱號官府制度皆襲秦故以至於今雖有因有革然大抵皆秦制也未甞有意於周禮者豈其體大而難行乎其果不可行乎夫立法垂制將以遺後也使難行而萬丗莫能行與不可行等爾然則反秦制之不若也脫有行者亦莫能興或因以取亂王莽後周是也則其不可用決矣此又可疑也然其祭祀衣服車旗似有可采者豈所謂郁郁之文乎三代之治其要如何周禮之經其失安在冝於今者其理安從其悉陳無隠問古者爲治有繁簡其施於民也有淺深各適其冝而已三代之盛時地方萬里而王所自治者千里而巳其餘以建諸侯至於禮樂刑政頒其大法而使守之則其大體蓋簡如此諸侯大小國蓋數千必各立都邑建宗廟卿士大夫朝聘祭祀訓農練卒一作訓練武士居民度土自一夫以上皆有法制則其於衆務何其繁也今自京師至於海隅徼障一尉卒之職必命於朝政之大小皆自朝岀州縣一作郡之吏奉行而巳是舉天下皆所自治其於大體則爲繁一有且勞二字矣其州縣大小邑閭田井訓農練卒一夫以上略無制度其於衆務何其忽而簡也夫禮以治民而樂以和之德義仁恩長養涵澤此三代之所以深於民者也政以一一作均民刑以防之一作姦此其淺者爾一有蓋不可專用也六字今自宰相至于州縣一有之字一作至内外凡百有司莫不行文書治吏事其急在於督賦斂斷獄訟而巳此特淺者爾禮樂仁義吏不知所以爲而欲望民之被其教其可得乎一有況民之泯泯乎此專務其淺而忘其所以教民之深之弊也乆矣二十五字夫治大以簡則力有餘治小以繁則事不遺制民以淺則防其僻漸民以深則化可成此三代之所以治也今一切悖古簡其當繁而繁其可簡一作大者煩而勞細者簡而忽務其淺而忽其深故爲國百年而仁政未成生民未厚者以此也然若欲使國體大小適繁簡之冝法政弛張盡淺深之術諸侯井田不可卒復施於今者何宜禮樂刑政一作仁義不可卒成用於今者何便悖古之失其原何自修復之方其術何始迹治亂通古今子大夫之職也其悉心以陳焉問禮樂之書散亡而雜出於諸儒之記獨中庸出於子思子思聖人之後也其所傳冝得其眞而其說有異一作戾乎聖人者何也論語云吾十有五而志于學三十而立四十而不惑五十而知天命蓋孔子自年十五而學學十五年而後有立其道又須十年而一進孔子之聖必學而後至乆而後成而中庸曰自誠明謂之性自明誠謂之教自誠明生而知之也自明誠學而知之也若孔子者可謂學而知之者孔子必須學則中庸所謂自誠而明不學而知之者誰可以當之歟堯用四凶其𥘉非不思也蓋思之不能無失耳故曰惟帝其難之舜之於事必問於人而擇焉故曰舜好問禹之於事已所不決人有告之言則拜而從之故曰禹拜昌言湯之有過後知而三字一作人告必改故曰改過不恡孔子亦甞有過故曰幸苟有過人必知之而中庸曰誠者不勉而中不思而得夫堯之思慮常有失舜禹常待人之助湯與孔子常有過此五君子者皆上古聖人之明者其勉而思之猶有不及則中庸之所謂不勉而中不思而得者誰可以當之歟此五君子者不足當之則自有天地巳來無其人矣豈所謂虚言髙論而無益者歟夫孔子必學而後至堯之思慮或失舜禹必資於人湯孔不能無過此皆勉人力行不怠有益之言也若中庸之誠明不可及則怠人而中止無用之空言也故予疑其傳之謬也吾子以爲如何南省試進士䇿問三首問昔者禹治洪水奠山川而堯稱之曰萬丗之功也蓋遭大水莫如堯致力以捍四字一作能弭大患莫如禹别四海九州山川地形盡水之性知其利害而治之有法莫一作未有如禹貢之爲書一作詳也故後丗之言知水者必本於禹求所以治之之法與其跡者必於禹貢然則學者所冝盡心也國家天下廣矣其爲水害者特一河耳非有堯之大患也自横壠商胡再決三十餘年天下無一人能興水利者豈有其人而弗求歟求而弗至歟抑不知水性而乖其導洩之方由禹貢之學乆廢而然歟此當今之務學者之所留意也且堯之九州孰髙孰下禹所治水孰後孰先考其治之之跡導其大水所從來而順其歸其小水則或附而行或止而有所畜然後百川皆得其冝夫致力於其大而小者從之此豈非其法歟然所導大水其名有㡬夫欲治水而不知地形髙下所治後先致力之多少及其名與數則何以知水之利害故願有所聞焉夫禹所以通治水之法如此者必又得其要願悉陳之無隱問三王之治損益不同而制度文章惟周爲大備周禮之制設六官以治萬民而百事理夫公卿之任重矣若乃祭祀天地日月宗廟社稷四郊明堂之類天子大臣所躬親者一歳之間有㡬又有廵狩朝㑹師田射耕燕饗凡大事之舉一歳之間又有㡬而爲其民者亦有畋獵學校射郷飲酒凡大聚聚字一作事期㑹一歳之間有㡬又有州黨族官歳時月朔春秋酺禜一作蜡祭詢事讀法一歳之間又有㡬其齋戒供給期召奔走廢日㡬何由是而言疑其官不得安其府民不得安其居亦何暇修政事治生業乎何其煩之若是也然說者謂周用此以致太平豈朝廷禮樂文物萬民冨庶豈弟必如是之勤且詳然後可以致之歟後丗苟簡不能備舉故其未能及於三代之盛歟然爲治者果若是之勞乎用之於今果安焉而不倦乎抑其設施有法而弟弗深考之歟諸君子爲言之問六十四卦所謂易者聖人之書也今謂之繫辭昔謂之大傳者亦皆曰聖人之作也其言曰兩儀生四象四象生八卦又曰河出圖聖人則之又曰庖犧氏之王天下也仰觀于天俯察于地觀鳥獸之文近取一有諸字下同身逺取物始作八卦又曰昔者聖人之作易也幽􅐌於神明而生蓍參天兩地而倚數觀變於隂陽而立卦一書而四說則八卦者果何從而有乎若曰河圖之說信然乎則是天生神馬負八卦岀于水中乃天地自然之文爾何假庖犧始自作之也如幽贊生蓍之說又似八卦直因蓍數而生爾至於兩儀四象相生而成則又無待於三說而有卦也故一說苟勝則三說可以廢也然孰從而爲是乎卜筮自堯舜二代以來用之蓋古聖人之法也不必窮其始於古逺茫昧之前然繫辭聖人之作也必有深旨幸決其疑問進士䇿四首問孟子以謂井田不均則糓禄不平經界旣正而分田制禄可坐而定也故曰仁政必自經界始蓋三代井田之法也自周衰迄今田制廢而不復者千有餘歳凡爲天下國家者其善治之迹雖不同而其文章制度禮樂刑政未甞不法三代而於井田之制獨廢而不取豈其不可用乎豈憚其難而不爲乎然亦不害其爲治也仁政果始於經界乎不可用與難爲者果萬世之通法乎王莽甞依古制更名一有民字田矣而天下之人愁苦怨叛卒共起而亡之莽之惡加于人者雖非一而更田之制當時民特爲不便也嗚呼孟子之所先者後世皆不用而治用之而民特愁苦怨叛以爲不便則孟子謂之仁政可乎記曰異世殊時不相沿襲書又曰事不師古匪說攸聞書傳之言其戾如此而一作於孰從乎孟子世之所師也豈其泥於古而不通於後世乎豈其所謂迂闊者乎不然將有說也自三代之後有天下莫盛漢唐漢唐之治視三代何如其民田之制稅賦之一有法穀禄之四字差又何如其可施於今者又何如皆願聞其詳也問子不語怪著之前說以其無益於事而有惑於人也然書載鳯凰之來舜詩録乙鳥之生商易稱河洛出圖書禮著龜龍游宫沼春秋明是非而正王道六鷁鸜鵒於人事而何干二南本功德於后妃麟曁騶虞豈婦人而來應昔孔子見作俑者歎其不仁以謂開端於用殉也況六經萬世之法而容異說自啓其源自秦漢巳來諸儒所述荒虛怪誕無所不有推其所自抑有漸乎夫無焉而書之聖人不爲也雖實有焉書之無益而有害不書可也然書之亦有意乎抑非聖人之所書乎予皆不能諭也惟博辯明識者詳之問爲政者徇名乎襲迹乎三代之名正名也其迹治迹也所謂名者萬世之法也迹者萬世之制也正名立制言順事成然後因名迹以考實而其文章事物粲然無不備矣可謂盛哉董仲舒以謂三代質文有改制之名而無變通之實者是也自秦肆其虐滅棄古典然後三代之名與迹皆變易而喪其實豈所謂變其道者邪然自秦迄今千有餘歳或治或亂其廢興長短之埶各由其人爲之而巳其襲秦之名不可改也三代之迹不可復也豈其理之自然歟豈三代之制止於三代而不可施於後世歟王莽求其迹而復井田宇文求其名而復六官二者固昏亂敗亡之國也然則孔子言爲政必也正名孟子言爲政必始經界豈虚言哉然自秦以來治丗之主㡬乎三代者唐太宗而巳其名迹固未甞復三代之一二而其治則㡬乎三王豈所謂名迹者非此之謂歟豈遺名與迹而直考其實歟豈孔孟之所謂者有旨而學者弗深考之歟其酌古今之冝與其異同者以對問古之取士者上下交相待以成其美今之取士者上下交相害欲濟於事可乎古之士教養有素而進取有漸上之禮其下者厚故下之自守者重上非厚禮不能以得士士非自重不能以見禮於上故有國者設爵禄車服禮樂于朝以待其下爲士者修仁義忠信孝悌於家以待其上設于朝者知下之能副其待則愈厚居下者知上之不薄于已故愈重此豈不交相成其美歟後丗之士則反是上之待其下也以謂干利而進爾雖有爵禄之設而日爲之防以革進之濫者下之視其上也以謂雖自重上孰我知不自進則不能以達由是上之待其下也益薄下之自守者益不重而輕嗚呼居上者欲得其人在下者欲行其道其可得邪原夫三代取士之制如何漢魏迨今其變制又如何冝歷道其詳也制失其本致其反古一有復自何時欲就今制稍復於古十二字當自何始今之士皆學古通經稍知自重矣而上之所以禮之者未加厚也噫由上之厚然後致下之自重歟必下之自重然後上禮之厚歟二者兩不爲之先其執亦奚由而合也冝具陳其本末與其可施於今者以對居士集卷第四十八熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正問進士䇿第二首諸侯大小國蓋數千必各立都邑建宗廟一作諸侯之國小大數十皆建邑立宗廟問進士䇿第一首書傳之言言一作說井田一作井地聞其詳也一作聞其說第四首上熟我知一作上或不我知, WYG: ''}
