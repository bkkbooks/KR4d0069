  - {type: variant, offset: 0, length: 244, content: 居士集卷第四十八歐陽文忠公集四十八䇿問十二道武成王廟問進士䇿二首問學者言三統之義備矣然自孔子刪脩六經與其弟子論辯堯舜三代之際甚詳而於正朔獨無明文見於經者三正王者所以正一統蓋大法也豈冝略而不言歟抑隱其義以寓見諸書歟或者經籍散缺而失之歟自漢以來學者多増三統之說以附六經之文今所見者特因漢儒之說爾當漢承秦焚書聖經未備而百家異說不合于理者衆則其言果可信歟夫衆辭淆亂質諸聖今考於六經孔子所筆何說可以驗其信然歟不然商周未甞有改歟豈其不足爲法聖人非之而不言歟請稽三王之舊典考六經之明文以祛厥疑敢俟來對問, WYG: ''}
