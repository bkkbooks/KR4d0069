  - {type: variant, offset: 238, length: 18538, content: 舊居列司存整桉牒以圖經乆之制夏某月工徒告成制作雖壯不踰矩官司雖冗執其方君子謂是舉也得爲政之本焉鳥有端其本而末不正者哉冝乎書厥㫖以示方来且誌歲月也河南府重修淨垢院記河南自古天子之都王公戚里冨商大姓處其地喜於事佛者徃徃割脂田沐邑貨布之贏奉祠宇爲莊嚴故浮圖氏之居與侯家主第之樓臺屋瓦髙下相望於洛水之南北若奕棊然及汴建廟社稱京師河南空而不都貴人大賈廢散浮圖之奉養亦衰歲壞月隳其居多不克完與夫遊臺釣池並爲榛蕪者十有八九淨垢院在洛北廢最甚無刻識一作石不知誰氏之爲獨牓其梁曰長興四年建丞相彭城錢公來鎮洛之明年禱雨九龍祠下過之歎其空且呼主藏者給緡錢二十萬洛陽知縣李宋卿幹而輯焉於是規其廣而小之即其舊而新之即舊焉所以速於集工損小焉所以易於完修一作守易壞𥙷闕三十六間工既畢宋卿碩刻於石以紀夫修舊起廢由彭城公賜也且誌其復興之之一無此字歲月云從事歐陽脩遂爲一無二字記陳氏榮郷亭記什邡漢其縣户若千可征役者家若干任里胥給吏一事又若干其豪又若干縣大以饒吏與民尤驁惡猾驕善貨法爲蠧孽中州之人凡仕宦之蜀者皆逺客孤寓思歸以苟滿歲脫過失得去爲幸居官既不久又不究知其俗常不暇刔剔已輒易去而縣之大吏皆宿老其事根堅穴深爲其長者非甚明銳難卒攻破故一縣之政吏常把持而上下之然其特不喜秀才儒者以能接見官府知已短長以讒之爲已病也每儒服持謁嚮縣門者吏輒坐門下嘲咻踞罵辱之俾慙以去甚則隂用里人無頼苦之羅中以法期必破壞之而後已民旣素饒樂郷里不急禄仕又苦吏之所爲故未嘗有儒其業與服以游者甚好學者不過專一經工歌詩優游自養爲郷丈人而已比年蜀之士人以進士舉試有司者稍稍増多而什邡獨絶少陳君什邡之郷丈人有賢子曰巖夫巖夫㓜喜讀書爲進士力學甚有志然亦未嘗敢儒其衣冠以謁縣門出入閭閈必郷其服郷人莫知其所爲也巳而州下天子詔書索郷舉秀才巖夫始改衣詣門應詔一作書吏方相驚然莫能爲也旣州試之送禮部將行陳君戒且約曰嘻吾知惡進士之病已而不知可以爲榮君行逹得選於有司吾將有以旌志之使榮吾郷以勸也於是呼工理材若將構築者明年巖夫中丙科以歸陳君成是亭與郷人宴其下縣之吏悔且歎曰陳氏有善子而吾郷有才進士豈不榮邪巖夫𥘉爲伊闕縣主簿時予爲西京留守推官嘗語予如此欲予之志之也巖夫爲縣吏材而有内行不求聞知於上官而上官薦用下吏之能者歲無員數然卒亦不及噫巖夫爲郷進士而郷人始不知之卒能榮之爲下吏有可進之勢而不肯一鬻所長以干其上其守道自修可知矣陳君有子如此亦賢丈人也予旣友巖夫恨不一豋是亭往拜陳君之下且以識彼邦之長者也又嘉巖夫之果能榮是郷也因以命名其亭且志之也某年月歐陽脩記明因大師塔記明因大師道詮姓衛氏并州文水縣民家子生於太平興國辛已之歲終於明道癸酉之正月壽五十有三年始爲童子辤家人入洛陽妙覺禪院依真行大師恵璿學浮圖法咸平五年始去氏削髪入憎籍後二十四年賜紫衣遂主其衆又四年賜號明因兼領右街教門事凡爲憎三十有一年卒之明年其徒以骨葬城南龍門山下始道詮未死時予過其廬問其年幾何曰五十有二矣問其何許人也曰本太原農家也因與語曰詩唐風言晉本唐之俗其民被堯之徳化且詩多以儉刺然其勤生以儉嗇朴厚而純固最得古之遺風今能言其土風乎其民俗何若信若詩之所謂乎詩去今餘千歲矣猶若詩之時乎其亦随世而遷變也曰樹麻而衣陶瓦而食築土而室甘辛苦薄滋味歲耕日積有餘則窖而藏之率千百年不輒發其勤且儉誠有古之遺風至今而不變也又言爲兒時聞長老語晉自春秋爲盛國至唐基并以興世爲北亰及朱氏有中土後唐倚并爲雄亦卒以王旣而晉祖又以王漢又以王遭時之故相次出三天子劉崇父子又自爲國故民熟兵鬬饟軍死戰勞苦幾百年不得息旣而聖人出四方次第平一日兵臨城門係繼元以歸并民然後被政教棄兵專農休息勞苦爲太平之幸人并平後二歲我始生㓜又依浮圖生不見干戈長不執耒耜衣不麻食不瓦室不土力不穡而休乃并人之又幸者也今老矣且病即死無恨予愛其語朴而詳他日復過其廬莫見也訪之曰死矣爲之惻然及其葬其徒有求予誌其始終者因并書其常語予者志歲月云爾叢翠亭記九州皆有名山以爲鎮而洛陽天下中周營一作宮漢都自古常一作皆以王者制度臨四方冝其山川之勢雄深偉麗以壯萬邦之所瞻由都城而南以東山之近者闕塞萬安轘轅緱氏以連嵩室一作少首尾盤屈踰百里從城中因髙以望之衆山靡迤或見或否惟嵩最逺最一作而獨出其嶄巖聳秀抜立諸峯上而不可掩蔽蓋其名在祀典與四嶽俱僃天子廵狩望祭其秩甚尊則其髙大殊傑當然城中可以望而見者若廵檢署之居洛北者爲尤髙廵檢使内殿崇班李君始入其署即相其西南隅而増築之治一作爲亭於上敞其南北嚮以望焉見山之連者峯者岫者駱驛二字或從系聮亘卑相附髙相摩亭然起崪然止來而向去而背頺崖怪壑若奔若蹲若鬬若倚世所傳嵩陽三十六峯者皆可以坐而數之因取其蒼翠叢列之状遂以叢翠名其亭亭成李君與賔客以酒食登而落之其古所謂居髙明而逺眺望者歟旣而欲紀其始造之歲月因求脩辭而刻之云非非堂記權衡之平物動則輕重差其扵靜也錙銖不失水之鑒物動則不能有睹其於靜也毫髪可辨在乎人耳司聽目司視動則亂於聦明其於静也聞見必審處身者不爲外物眩晃而動則其心靜心靜則智識明是是非非無所施而不中夫是是近乎謟非非近乎訕不幸而過寜訕無謟是者君子之常是之何加一以觀之未若非非之爲正也予居洛之明年旣新㕔事有文紀于壁末營其西偏作堂户北嚮植叢竹闢户於其南納日月之光設一几一榻架書數百卷朝夕居其中以其靜也閉目澄心覽今照古思慮無所不至焉故其堂以非非爲名云遊大字院記六月之庚金伏火見往往暑虹晝明驚雷破柱鬱雲蒸雨斜風酷熱非有清勝不可以消煩炎故與諸君子有普明後園之遊春笋解籜夏潦漲渠引流穿林命席當水紅薇始開影照波上折花弄流銜觴對弈非有清吟嘯歌不足以開歡情故與諸君子有避暑之詠太素最少飲詩獨先成坐者欣然繼之日斜酒歡不能徧以詩冩獨留名於壁而去他日語且道之拂塵視壁某人題也同共索舊句掲之于版以致一時之勝而爲後㑹之尋云李秀才東園亭記脩友李公佐有亭在其居之東園今年春以書抵洛命脩志之李氏世家隨隨春秋時稱漢東大國魯桓之後楚始盛隨近之常與爲鬬國相勝敗然怪其山川土地旣無髙深壯厚之勢封域之廣與鄖蓼相介纔一二百里非有古彊諸侯制度而爲大國何也其春秋世未嘗通中國盟㑹朝聘僖二年方見於經以伐見書哀之元年始約列諸侯一㑹而罷其後乃希見僻居荆夷蓋於蒲騷鄖蓼小國之間特大而巳故於今雖名藩鎮而實下州山澤之産無美材土地之貢無上物朝廷逹官大人自閩陬嶺徼出而顯者往往皆是而隨近在天子千里内幾一一無此字百年間未出一士豈其􅋻貧薄陋自古然也予少以江南就食居之能道其風土地旣瘠枯民給一作急生不舒愉雖豐年大族厚聚之家未嘗有樹林池沼之樂以爲歲時休暇之嬉獨城南李氏爲著姓家多藏書訓子孫以學予爲童子與李氏諸兒戲其家見李氏方治東園往求美草一一手植周視封樹日日去來園間甚勤李氏壽終公佐嗣家又構亭其間益脩先人之所爲予亦壯不復其家已而去客漢沔遊亰師乆而乃歸復行成南公佐引予登亭上周尋童子時所見則樹之孼者抱昔之抱者枿草之茁者叢荄之甲者今果矣問其遊兒則有子如予童子之歲矣相與逆數昔時則於今七閏矣然忽忽如前日事因歎嗟俳徊不能去噫予方仕宦奔走不知再至城南登此亭復幾閏幸而再至則東園之物又幾變也計亭之梁木其蠧瓦甓其一作之溜石物其泐乎隨雖陋非予郷然予之長也豈能忘情於隨哉公佐好學有行郷里推之與予友葢明道二年十月十二日也樊侯廟災記鄭之盗有入樊侯廟刳神象之腹者旣而大風雨雹近鄭之田麥苗皆死人咸駭曰侯怒而爲之也余謂樊侯本以屠狗立軍功佐沛公至成皇帝位爲列侯邑食舞陽剖符傳封與漢長乆禮所謂有功徳於民則祀之者歟舞陽距鄭旣不逺又漢楚常苦戰滎陽京索間亦侯平生提戈斬級所立功處故廟而食之冝矣方侯之參乗沛公事危鴻門振目一顧使羽失氣其勇力足有過人者故後世言雄武稱樊將軍冝其聦明正直有遺靈矣然當盜之倳刃腹中獨不能保其心腹腎腸哉而反貽怒扵無罪之民以騁其恣睢何哉豈生能萬人敵而死不能庇一躬邪豈其靈不神於禦盗而反神於平民以駭其耳目邪風霆雨雹天之所以震耀威罰有司者而侯又得以濫用之邪蓋聞隂陽之氣怒則薄而爲風霆其不和之甚者凝結而爲雹方今歲且乆旱伏隂不興壯陽剛燥疑有不和而凝結者豈其適㑹民之自災也邪不然則喑嗚叱吒使風馳霆擊則侯之威靈暴矣哉東齋記官署之東有閣以燕休或曰齋謂夫閑居平心以養思慮若於此而齋戒也故曰齋河南主簿張應之居縣署亦理一作治小齋河南雖赤縣然征賦之民一作名户纔七八千田利之入率無一鍾之畆人稀土不膏腴則少爭訟幸而歲不大凶亦無逋租凡主簿之所職者甚簡少故未嘗憂吏責而得優游以嬉應之又素病羸冝其有以間居而平心者也應之雖病然力自爲學常曰我之疾氣留而不行血滯而流逆故其病咳血然每體之不康則或取六經百氏若一作與古人述作之文章誦之愛其深博閎逹雄一作竒冨偉麗之說則必茫乎以思暢乎以平釋然不知一作覺疾之在體因多取古書文字貯齋中少休則探以覽焉夫世之善醫者必多畜金石百草之物以善其疾須其瞑眩而後瘳應之獨能安居是齋以養思慮又以聖人之道和平其心而忘厥疾真古之三字一作可謂樂善者歟傍有小池竹樹環之應之時時引客坐其間飲酒言笑終日一作終日言笑不倦而某嘗從應之於此因書於其壁三字一作于壁而記云伐樹記署之東園乆茀不治脩至始闢之糞瘠漑枯爲𬞞圃十數畦又植花果桐竹凡百本春陽旣浮萌者將動園之守啓曰園有樗焉其根壯而葉大根壯則梗地脉耗陽氣而新植者不得滋葉大則隂翳蒙礙而新植者不得暢以茂又其材拳曲臃腫踈輕而不堅不足養是冝伐因盡薪之明日圃之守又曰圃之南有杏焉凡其根庇之廣可六七尺其下之地最壤腴以杏故特不得𬞞是亦冝薪脩曰噫今杏方春且華將待其實若獨不能損數畦之廣爲杏地邪因勿伐旣而悟且歎曰吁莊周之說曰樗櫟以不材終其天年桂􅃮以有用而見傷天今樗誠不材矣然一旦悉翦棄杏之最堅宻美澤可用反見存豈才不才各遭其時之可否邪他日客有過脩者僕夫曵薪過堂下因指而語客以所疑客曰是何恠邪夫以無用處無用莊周之貴也以無用而賊有用烏能免哉彼杏之有華實也以有生之具而庇其根幸矣若桂􅃮之不能逃乎斤斧者葢有利之者在死勢不得以生也與乎杏實異矣今樗之臃腫不材而以壯大害物其見伐誠冝爾與夫才者死不才者生之說又異矣凡物幸之與不幸視其處之而已客旣去脩然其言而記之戕竹記洛最多竹樊圃棊錯包籜榯筍之贏歲尚十數萬緡坐安侯一作厚利寧肯爲渭川下然其治水庸任土物簡歷芟養率湏謹嚴家必有小齋閑館在虧蔽間賔欲賞輒腰輿以入不問辟彊恬無怪譲也以是名其俗爲好事壬申之秋人吏率持鎌斧亡公私誰何且戕且桴不竭不止守都出令有敢隠一毫爲私不與公上急病服王官爲慢齒王民爲悖如是累日地榛園秃下亡有嗇色少見於顔間者由是知其民之急上噫古者伐山林納材葦惟是地物之美必登王府以經于用不供謂之畔廢不時謂之暴殄今土字廣斥賦入委疊上益篤儉非有廣居盛囿之侈縣官材用顧不衍溢朽蠧而一有非常歛取無藝意者營飾像廟過差乎書不云不作無益害有益又曰君子節用而愛人天子有司所當朝夕謀慮守官與道不可以忽也推類而廣之則竹事猶末養魚記折簷之前有隙地方四五丈直對非非堂脩竹環繞䕃映未嘗植物因洿以爲池不方不圓任其地形不甃不築全其自然縱鍤以濬之汲井以盈之湛乎汪洋晶乎清明微風而波無波而平若星若月精彩下入予偃息其上潜形於毫芒循漪沿岸渺然有江湖千里之想斯足以舒憂隘而娱窮獨也乃求漁者之罟市數十魚童子養之乎其中童子以爲斗斛之水不能廣其容葢活其小者而棄其大者怪而問之且以是對嗟乎其童子無乃嚚昬而無識矣乎予觀巨魚枯涸在旁不得其所而群小魚游戲乎淺狹之間有若自足焉感之而作養魚記游鯈亭記禹之所治大水七岷山導江其一也江出荆州合沅湘合漢沔以輸之海其爲汪洋誕漫蛟龍水物之所慿風濤晦冥之變怪壯哉是爲四字一作是爲壯㦲勇者之觀也吾兄晦叔爲人慷慨喜義勇而有大志能讀前史識其盛衰之迹聽其言豁如也因於位卑無所用以老然其胷中亦已壯矣夫壯者之樂非豋崇髙之丘臨萬里之流不足以爲適今吾兄家荆州臨大江捨汪洋誕漫壯㢤勇者之所觀而方䂓地爲池方不數丈治亭其上反以爲樂何哉葢其擊壷而歌解衣而飲陶乎不以汪洋爲大不以方丈爲局則其心豈不浩然㦲夫視冨貴而不動處卑困而浩然其心者一無此字真勇者也然則水波之漣漪游魚之上下其爲適也與夫莊周所謂恵施游於濠梁之樂何以異烏用蛟魚變恠之爲壯㢤故名其亭曰游鯈亭景祐五年四月二日舟中記浙川縣興化寺廊記興化寺新修行廊四行惣六十四間匠者某人用工之力凡若干土木圬墁陶瓦鐵石之費匠工傭食之資凡若干營而主其事者憎延遇延遇自言餘杭人少棄父母稱出家子之鄆州拜浮圖人師其說年十九尚書祠部給牒稱僧遂行四方淳化三年止此寺得維摩院廢基築室自爲師教弟子以居居二十有三年授弟子恵聦而老焉又十八年年七十有一矣乃歛其衣盂之具所一作之餘示惠聦而歎曰吾生乾徳之癸亥明年而甲子一復而又將甲焉棄杭即浙四十有三歲去墳墓不哭其郊聞吴歈不懷其土吾豈無郷閭親戚之仁與愛而樂此土耶吾惟浮圖之說畏且信以忘其生不知乆乎此也今老矣凡吾之有衣食之餘生無郷閭宗族之賙没不待歲時烝甞之具盍􅈬吾之素信者而用焉畢吾無恨也於是庀工度材營此廊廊成明道二年之某月也寺始建於隋仁壽四年號法相寺太平興國中改曰興化屋垣甚壯廣由仁壽至明道實四百四十有四年之間凡幾壞幾易未嘗有志刻雖其始造之因亦莫詳焉至延遇爲此役始求志之予因嘉廷遇之能果其學也惠聦自少師之雖老益堅不壞又竭其所有期與俱就所信而盡焉夫世之學者知患不至不知患不能果此果於自信者也年月日記湘潭縣修藥師院佛殿記湘潭縣藥師院新修佛殿者縣民李遷之所爲也遷之賈江湖歲一賈其入數千萬遷之謀曰夫民力役以生者也用力勞者其得厚用力媮者其得薄以其得之豐約必視其用力之多少而必當然後各食其力而無慙焉士非我匹若工農則吾等也夫琢磨一作磨琢煎鍊調筋柔革此工之盡力也斤斸鉏夷畎畒樹藝此農之盡力也然後所食皆不過其勞今我則不然徒幸物之廢興而上下其價權時輕重而操其竒贏游嬉以浮於江湖用力至逸以安而得則過之我有慙於彼焉凡誠我契而不我欺平我斗斛權衡而不我踰出入關市而不我虞我何能焉是皆在上而爲政者以庇我也何以報焉聞浮屠之爲善其法曰有能捨已之有以崇飾尊嚴我則能隂相之凡有所欲皆如志乃曰盍用我之有所得於此施以報焉且爲善也於是得此寺廢殿而新之又如其法作釋迦佛十六羅漢塑像皆備凡用錢二十萬自景祐二年十二月癸酉訖三年二月甲寅以成其秋㑹予赴夷陵自真州假其舟行次潯陽見買一石礱而載于舟問其所欲用之因具言其所爲且曰欲歸而記其始造歲月也視其色若欲得予記而不敢言也因善其以賈爲生而能知夫力少而得厚以爲幸又知在上者庇巳而思有以報顧其所爲之心又趨爲善皆可喜也乃爲之作記問其寺始造之由及其歲月皆不能道也九月十六日記偃虹隄記有自岳陽至者以滕侯之書洞庭之圖來告曰願有所記予發書按圖自岳陽門西距金雞之右其外隠然隆髙以長者曰偃虹隄問其作而名者曰吾滕侯之所爲也問其所以作之利害曰洞庭天下之至險而岳陽荆潭黔蜀四㑹之衝也昔舟之往来湖中者至無所寓則皆泊南津其有事于州者逺且勞而又常有風波之恐覆溺之虞今舟之至者皆泊隄下有事于州者近而且無患問其大小之制用人之力曰長一千尺髙三十尺厚加二尺而殺其上得厚三分之二用民力萬有五千五百工而不踰時以成問其始作之謀曰州以事上轉運使轉運使擇其吏之能者行視可否凡三反復而又上于朝廷决之三司然後曰可而皆不能易吾侯之議也曰此君子之作也可以書矣蓋慮於民也深則謀其始也精故能用力少而爲功多夫以百歩之隄禦天下至險不測之虞恵其民而及于荆潭黔蜀凡徃来湖中無逺邇之人皆蒙其利焉且岳陽四㑹之衝舟之来而止者日凡有幾使隄土石幸乆不朽則滕侯之恵利於人物可以數計哉夫事不患於不成而患於易壞葢作者未始不欲其乆存而繼者常至於殆廢自古賢智之士爲其民捍患興利其遺跡往往而在使其繼者皆如始作之心則民到于今受其賜天下豈有遺利乎此滕侯之所以慮而欲有紀於後也滕侯志大材髙名聞當世方朝廷用兵急人之時常顯用之而功未及就退守一州無所用心略施其餘以利及物夫慮熟謀審力不勞而功倍作事可以爲後法一冝書不苟一時之譽思爲利於無窮而告来者不以廢二冝書岳之民人與湖中之往来者皆欲爲滕侯紀三冝書以三冝書不可以不書乃爲之書慶曆六年月日記大明水記世傳陸羽茶經其論水云山水上江水次井水下又云山水乳泉石池漫流者上瀑湧湍漱勿食食乆令人有頸疾江水取去人逺者井取汲多者其說止於此而未嘗品第天下之水味也至張又新爲煎茶水記始云劉伯芻謂水之冝茶者有七等又載羽爲李秀卿論水次第有二十種今考二說與羽茶經皆不合謂山水上乳泉石池又上江水次而井水下伯芻以揚子江爲第一惠山石泉爲第二虎丘石井第三丹陽寺井第四揚州大明寺井第五而松江第六淮水第七與羽說皆相反秀卿所說二十水廬山康王谷水第一無錫恵山石泉第二蘄州蘭谿石下水第三扇子峽蝦蟆口水第四虎丘寺井水第五廬山招疑賢寺下方橋潭水第六揚子江南零水第七洪州西山瀑布第八桐栢淮源第九廬山龍池山頂水第十丹陽寺井第十一揚州大明寺井第十二漢江中零水第十三玉虗洞香谿水第十四武關西水第十五松江水第十六天台千丈瀑布水第十七郴州圓泉第十八嚴陵灘水第十九雪水第二十如蝦蟆口水西山瀑布天台千丈瀑布皆戒人勿食食之生疾其餘江水居山水上井水居江水上皆與羽經相反疑羽不當二說以自異使誠羽說何足信也得非又新妄附益之邪其述羽辨南零岸時恠誕甚妄也水味有美惡而已欲求天下之水一二而次第之者妄說也故其爲說前後不同如此然此井爲水之美者也羽之論水惡渟浸而喜泉源故井取汲者江雖長然衆水雜聚故次山水惟此說近物理云孫氏碑隂記皇祐三年夏元規以龍圗閣直學士尚書吏部郎中爲陜西都轉運使道出南京遇疾留河上予時往問之元規疾少間出其皇祖少師之銘而謂予曰此太子太傅杜公所書也吾家世徳杜公之父榮公實銘之惟吾二家皆爲當世盛族五代之亂播于呉越而不顯然其同禄仕通㛰姻子孫之好至今而不絶也自吴越國除衣冠之族皆北予以不幸少孤旣壯而從禄養其爲御史諌官以言事謫守處州始得過故郷識其耆老而求杜氏之銘不可得也今十有五年而始獲于斯自榮公之銘孫氏三世百年至于小子幸成祖考忠義之訓今得進𬒳榮顯于朝廷而列于侍從杜公以道徳名望相明天子荷天之福眉壽于家惟吾二家之盛衰與時治亂而上下故屈于彼而伸于此其世徳遺文由後有人克保不墜故晦於昔而顯於今將刻銘於碑表之墓隧以昭示來世子孫其以爲如何子曰嗚呼爲善之効無不報然其遲速不必問一作同也故不在身者則在其子孫或晦於當時者必顯于後世其孫氏杜氏之謂乎刻之金石以遺家之子孫而勸天下之爲善者不亦冝哉三琴記吾家三琴其一傳爲張越琴其一傳爲樓則琴其一傳爲雷氏琴其製作皆精而有法然皆不知是否要在其聲如何不問其古今何人作也琴靣皆有横文如虵腹世之識琴者以此爲古琴蓋其􅃮過百年始有斷文用以爲驗爾其一金暉其一石暉其一玉暉金暉者張越琴也石暉者樓則琴也玉暉者雷氏琴也金暉其聲暢而逺石暉其聲清實而緩玉暉其聲和而有餘今人有其一已足爲寳而余兼有之然惟石暉者老人之所冝也世人多用金玉􅑕瑟暉此數物者夜置之燭下炫燿有光老人目昬視暉難凖惟石無光置之燭下黒白分明故爲老者之所冝也余自少不喜鄭衛獨愛琴聲尤愛小流水曲平生患難南北奔馳琴曲率皆廢忘獨流水一曲夣寢不忘今老矣猶時時能作之其他不過數小調弄足以自娯琴曲不必多學要於自適琴亦不必多藏然業已有之亦不必以患多而棄也嘉祐七年上已後一日以疾在告學書信筆作歐陽氏三琴記吉州學記續添慶曆三年天子開天章閣召政事之臣八人賜之坐問治天下其要有㡬施於今者冝何先使書于紙以對八人者皆震恐失措俯伏頓首言此事大非愚臣所能及惟陛下幸詔臣等於是退而具述為條列明年正月始詔州郡吏以賞罰勸桑農三月又詔天下皆立學惟三代仁政之本始於井田而成於學校記曰國有學遂有序黨有庠家有塾其極盛之時大僃之制也凡學本扵人性磨揉遷革使趍扵善至扵風俗成而頌聲興葢其功法施之各有次第其教於人者勤而入於人者漸勤則不倦漸則遲乆而深夫以不倦之意待遲乆而成功者三王之用心也故其爲法必乆而後至太平而爲國皆至六七百年而未已此其効也三代學制甚詳而後世罕克以舉舉或不知而本末不僃又欲扵速不待其成而怠故學之道常廢而僅存惟天子明聖深原三代致治之本要在冨而教之故先之農桑而繼以學校將以衣食飢寒之民而皆知孝慈禮譲是以詔書再下吏民感恱奔走執事者以後爲羞其年十月吉州之學成州即先夫子廟為學舍於城西而未備今知州事殿中丞李侯寛之至也謀與州人遷而大之事方上請而詔下學遂以成李侯治吉敏而有方其作學也吉之士率其私錢一百五十萬以助用人之力積二萬一千工而人不以為勞其良材堅甓之用凡二十二萬三千五百而人不以為多學有堂筵齋講有蔵書之閣有賔客之位有游息之亭嚴嚴翼翼壮偉閎耀而人不以為侈旣成而來學者常三百餘人予世家於吉濫官于朝廷進不能賛明天子之盛美退不能與諸生揖譲乎其中惟幸吉之學教者知學本扵勤漸遲乆而不倦以治毋廢慢天子之詔使予他日因得歸榮故郷而謁於學門將見吉之士皆道徳明秀可為公卿過其市而賈者不鬻其淫適其野而耕者不爭壠畒入其里閭而長㓜和孝慈扵其家行其道塗而少者扶羸老壯者代其負荷於路然後樂學之道成而得從郷先生席于衆賔之後聽郷樂之歌飲射壷之酒以詩頌天子太平之功而周覽學舍思詠李侯之遺愛不亦美㢤故扵其始成也刻辭于石以立諸其廡右吉州學記乃承平時印本與石本異其說在居士集第三十九卷後外集卷第十三淨垢院記處其處上有聚字十有八無有字空且空下元缺一字恕本作空且茀洛陽洛上有命字損小無損字三十六三上有凡字旣畢畢作訖遂爲無二字恕本此記彭城公並作長城公榮郷亭記什邡縣隷漢州諸本皆以邡爲方非以茍滿歲一作月字未嘗此下一有敢字君行逹君疑作若恕本作若行幸可知矣矣作巳之下一作其下明因塔記千百年千作十明道二年七月十四日記恕本有此叢翠亭記周營恕本同注作宫常以同注作皆嵩室同注作少室最獨無最字治亭同注作爲亭連者一作節者而刻之此下一有云字大字院記某人題某人作乃東園亭記脩友脩作予爲大爲作云僖二二下有十字始約約作得乃希乃作出㡬一無一字未出作未聞出少以以作從風土一作土風給生給作急豐年年作居往求作佳木益脩脩作修不復復下元缺一字恕本作不復㳺㡬閏閏下有也字其溜其作之石物無物字友盖善字友作善二年文藪作三年也也作記樊侯廟記廟而食廟上有亦字腎腸哉無㢤字貽怒一作移怒以騁其恣睢無此五字有司有上有冝字不興不作始壯陽剛燥四字作以干陽氣使風使上有能字東齋記之東東字作視字以燕以作其誦之誦上有以字雄冨雄作竒在體宋文粹此下有也字傍有小池宋文粹傍字上有齋字而某二字作予於其壁同正文伐樹記其根其作三庇之庇上有奇字七尺尺作弓杏之之下本缺一字恕本作木死勢死上有其字戕竹記恕本記作誌侯利同正文作侯游鯈亭記是爲同正文作是爲心者無者字浙川記浙作淅之資資作要所餘所作之甲子子下再有今甲子三字恵聦自無此三字雖老無雖字藥師院佛殿記之賈之作丗以生以下有爲字以其無以字琢磨作磨琢然後所食後作其以庇我以上有有字浮屠之之下有人能教人四字我之有無有字所欲用之之作遷因具言因下有得字問其所欲用之因具言其所為文藪作問其所欲用遷之具言之所爲汪逹云脩佛殿者乃李遷之始造歲月文藪作始造之歲月可喜文藪作可嘉十六日無十字有夷陵令歐陽某七字偃虹隄記恕本作卧虹按文忠公祖諱偃今家集以偃作卧疑避諱也所記記作紀金雞之右右作石長一千尺髙三十尺恕本作長三百尺高十有三尺萬有五千五百工作四千有五百工百歩之隄百作五十皆蒙其利無此四字不以廢作以不廢大明水記取汲者一作取汲多者秀卿秀作季謂山水謂上有羽字謂山水上乳泉石池又上江水次而井水下文纂乳泉字上有而字汪逹云比有而字乃與下句相類虎丘石井井作泉招賢招字本疑恕本同玉虗二字作壷天台千丈瀑布水第十七文纂無水字汪逹云此篇瀑布下無水字皆戒人皆下有羽字食之之作而岸時時有本疑恕本同此井爲水爲作於孫氏碑來世子孫無孫字不必問問作同遺家作遺二家復有廬陵歐陽某記五字三琴記皆不知皆作要奏議卷第十三歐陽文忠公集一百九翰苑論使臣差遣劄子至和二年兼判三班院臣勘㑹本班見管使臣八千一百一十二員自古濫官未有如此之多也臣遂將簿籍根磨増添數目只自皇祐二年終至今實四年半之内自借職以上増添二千八十五員於中近日増添併多只自皇祐五年終至今年六月一年半之内増四百九員殿侍猶不在數蓋由曲㤙濫賞臨時無節以日計月所積遂多率計一歳常増四百五十員若不塞其濫源則更三五年後不勝其弊矣於今裁損已爲太晚若更増添則四海之廣不能容濫官天下物力不能給俸禄矣臣今略舉入仕僥倖者二事乞先賜指揮釐革其餘見在者旣不可減損惟其入仕之源欲乞令當政大臣早賜擘畫所貴不爲將來之患所有臣擘畫二事今具畫一如後一自來諸皇親宅前勾當人除郡王宫殿侍年深有例送三班院差使外其餘宫院殿侍及客司書表宅案等别無恩例只自慶暦八年剏立年限上自郡王下至觀察使以下應縁皇親宅前殿侍客司書表宅案等並只勾當五年便送三班差使等第年限轉充借奉職此入仕之源最爲僥倖者臣今欲乞應郡王巳下宅前殿侍客司書表宅案勾當及五年者更不送三班只令在宅依舊勾當所有合轉殿侍至借職年限並依慶暦八年宻院劄子指揮如此則皇親勾當人不妨恩澤只是免得諸宫院送納三班後續𥙷人數兼諸宫院若得依舊勾當並是諳熟委使之人又三班減得人數甚爲利便一百司人吏舊來出職皆有職名年限近年多候轉及職名及年限未滿多乞情願就近下恩澤或僥求因人奏帶及抽差勾當叙勞酬獎及合作選人者情願就班行之類臣今乞一切止絶右臣所起請只是因述濫官略陳此二事如允臣所請乞下三班院與勾當臣寮同共鋪陳條貫立定新制奏乞朝廷降下施行取進止論罷修奉先寺等狀至和二年右臣近曽上言爲京師土木興作處多乞行減罷尋準勑差臣與三司同共相度減定續具奏聞次今又聞聖㫖下三司重修慶基殿及奉先寺屋宇臣伏見近年政令乖錯紀綱隳頽上下因循未能整緝惟務崇修祠廟廣興工木百役俱作無一日暫停方今民力困貧國用窘急小人不識大計不思愛君但欲廣耗國財務爲已利恣侵欺於官物圖酬獎之功勞託名祖宗張大事體況諸處神御殿當蓋造之𥘉務極崇奉棟宇堅壯莫不精嚴雖數百年未必損動近年以來不住修換昨開先殿只因兩柱損遂換一十三柱前後差官檢計朝廷並不取信只慿最後之言遂至廣張物一作功料蓋縁廣張得物料即多圖酬獎恩澤一作廣得功料大即圖酬奬恩澤多竊以崇奉祖宗禮貴清淨今乃頻有遷徙輕黷威靈要其所歸止爲小人圖利臣見自古人君好興土木者自春秋史記歴代以來並皆書爲過失以示萬世今小人圖一旦之利黷祖宗之威靈置一作致人主於有過之地誰忍爲之臣實痛惜臣因準勑減定於三司略見大㮣開先殿𥘉因兩條柱損今所用材植物料共一萬七千五百有零睦親宅神御殿所用物料又八十四萬七千又有醴泉福勝等處物料不可悉數此外軍營庫務合行修造者又有百餘處使厚地不生他物惟産木材亦不能供此廣費自古王者尊祖事神各有典禮不必廣興土木然後爲能臣竊見累年火災自王清昭應洞真上清鴻慶壽寧祥源㑹靈七宫開寳興國兩寺塔殿並皆焚燒蕩盡足以見天意厭土木之華侈爲陛下惜國力民財譴戒丁寧前後非一陛下與其廣興土木以事神不若畏懼天戒而脩省其巳興作者旣不可及及字一作止外其未修者冝速寢停況睦親神御殿於禮不冝作其事甚明别無禮典講求乞更不下太常便行寢罷其慶基殿如的有損漏只令三司差官整𥙷不得理爲勞績其奉先寺乞勒寺家自修今垂拱殿是陛下常坐之處近聞爲無一作未有梁木且止未修諸皇親自火燒居宅後至今寄寓它所陛下尊爲天子無梁木修一殿冨有四海而皇族無屋可居蓋爲將良材羙木俯徇小人並於不急處枉費遂致合行修造處却至乏材伏願陛下追思累次大火常發於土木最盛處凡國家極力興修者火必盡焚一作必盡焚除且天厭土木而焚之又欲興崇土木以奉之此所以福應未臻而災譴屢降也伏乞上思天戒下察人言人言雖狂而實忠天戒甚明而不逺伏惟陛下聖徳恭儉不樂遊畋凡所興修皆非嗜好但以難違小人一時之請自取青史萬世之譏實爲陛下惜之伏望聖慈一作聦廣賜裁擇謹具狀奏聞伏候勑㫖論修河第二狀至和二年臣伏見學士院集兩省臺諫官議修河事未有一定之論蓋由賈昌朝欲復故道李仲昌請開六塔互執一說莫知孰是以臣愚見皆謂不然言故道者未詳利害之原一作源述六塔者近乎欺罔之繆何以言之今謂故道可復者但見河北水患而欲還之京東然不思天禧以來河水屢決之因所以未知故道有不可復之勢此臣故謂未詳利害之原也若言六塔之利者則不攻而自破矣且開六塔旣云減得大河水勢然今恩冀之患何縁尚告危急此則減水之利虚妄可知開六塔者又云可以全回大河使復横壠故道見今六塔只是分減之水下流無歸已爲濵徳博之患若全回大河以入六塔則其害如何此臣故謂近乎欺罔之繆也臣聞河本一作之泥沙無不淤之理淤澱之勢常先下流下流淤髙水行不快乃自上流低下處決此其常勢也然避髙就下水之本性故河流已棄之道自是難復臣不敢逺引書史廣述河源只以今所欲復之故道言天禧以來屢決之因𥘉天禧中河出京東水行於今所謂故道者水旣一作流乎淤澁乃於滑州天臺埽決尋而修塞水復故道未㡬又於滑州南鐡狗廟決今所謂龍門埽者也其後數年又議修塞水令復故道巳而又於王楚埽決所決差小與故道分流然而故道之水終以壅淤故又於横壠大決是則決河非不能力塞故道非不能力復不乆終必決於上流者由故道淤髙水不能行故也及横壠旣決水流就下所以十餘年間河未爲患至慶暦三四年横隴之水又自下流先淤是時臣爲河北轉運使海口巳淤一百四十餘里其後遊金赤三河相次又淤下流旣梗乃又於上流商胡口一作復決然則京東横壠兩河故道一無二字皆是下流淤塞河水已棄之髙地京東故道屢復屢决理不可復其驗甚明則六塔所開故道之不可復不待言而易知臣聞議者計度京東故道功料止云銅城已上地髙不知大抵東去皆髙而銅城巳上乃特髙耳其東比銅城巳上則似低比商胡已上則實髙也若云銅城已東地勢斗下則當日水流一作決冝決銅城巳上何縁而頓淤横壠之口亦何縁而大決也然則兩河故道旣皆不可爲則河北水患何爲而可去臣聞智者之於事有一有所字不能必則一作則必較其利害之輕重擇其害少者而爲之猶勝害多而利少何況有害而無利此三者可較而擇也臣見徃年商胡𥘉決之時議欲修塞計用一千八百萬稍芟科配六路一百有餘州軍今欲塞者乃徃年之商胡必湏用徃年之物數至於開鑿故道張奎元計功料極大後來李參等減得全少猶用三十萬人然一有而字欲以五十歩之狹容大河之水此可笑也又欲増一夫所開三赤之方倍爲六尺且闊厚三尺而長六尺巳是一倍之功在於人力已爲勞若若云六尺之方以開方法筭之乃八倍之功此豈人力之所勝是則前功浩大而難興後功雖小而不實大抵塞商胡開故道凡二大役皆困國而勞人所舉如此而欲開難復屢決已驗之故道使其虚費而商胡不可塞故道不可復此所謂有害而無利者也就使幸而暫塞暫復以紓目前之患而終於上流必決如龍門横壠之比重以困國勞人此所謂利少而害多一有者字也若六塔者於大河有減水之名而無減水之實今下流所散爲患已多若全回大河以注之則濵徳博河北所仰之州不勝其患而又故道淤澁上流必有他決之虞此直有害而無利耳是一有則字智者之不爲也今若因水所在一作注増治堤防䟽其下流浚以入海則可無決溢散漫之虞今河所一作北歷數州之地誠爲患矣堤防歳用之夫誠爲勞矣與其虚費天下之財虚舉大衆之役而不能成功終不免爲數州之患勞歳用之夫則此所謂害少者乃智者之所擇也大抵今河之勢負三決之虞復故道上流必決開六塔上流亦決今河下流若不浚使入海則上流亦決臣請選知水利之臣就其下流求其入海之路而浚之不然下流梗澁則終虞上決爲患無涯臣非知水者但以今事目可驗者而較之耳言狂計愚不足以備聖君博訪之求此大事也伏乞下臣之議廣謀於衆而裁擇之謹具狀奏聞伏候勑㫖論修河第三狀一作論修六塔河至和三年右臣伏見朝廷定議開修六塔河口囬水入横壠故道此大事也中外之臣皆知不便而未有肯爲國家極言其利害者何哉蓋其說有三一曰畏大臣二曰畏小人三曰無竒䇿今執政之臣用心於河事亦勞矣𥘉欲試十萬人之役以開故道旣又捨故道而修六塔未及興役遽又罷之已而終爲言利者所勝今又復修然則其勢難於復止也夫以執政大臣銳意主其事而又有不可復止之勢固非一人口舌可回此所以雖知不便而罕肯言也李仲昌小人利口僞言衆所共惡今執政之臣既用其議必主其人且自古未有無患之河今河浸恩冀目下之患雖小然其患巳形囬入六塔將來之害必一作雖大而其害未至一作止夫以利口小人爲大臣所主欲與之爭未形之害勢必難奪就使能奪其議則言者猶湏獨任恩冀爲患之責使仲昌得以爲辭大臣得以歸罪此所以雖知不便而罕敢言也今執政之臣用心太過不思自古無不一作無患之河直欲使河不爲患若得河不爲患雖竭人力猶當爲之況聞仲昌利口詭辯謂費物少而用功不多不得不信爲竒䇿於是決意用之今言者謂故道旣不可復六塔又不可修詰其如何則又無竒䇿以取勝此所以雖知不便而罕肯言也衆人所不敢言而臣今獨敢言者臣謂大臣非有私仲昌之心也直欲興利除害爾若果知其爲患一作害愈大則豈有不囬者哉至於顧小人之後患則非臣之所慮也且事欲一作貴知利害權重輕有不得已則擇其害少而患輕者爲之此非明智之士不能也況治水本無竒䇿相地勢謹隄防順水性之所趨爾雖大禹不過此也夫所謂竒䇿者不大利則大害若循常之計雖無大利亦不至大害此明智之士善擇利者之所爲也今言修六塔者竒䇿也然終不可成而爲害愈大言順水治堤者常談也然無大利亦無大害不知爲國計者欲何所擇哉若謂利害不可必但聚大衆興大役勞民困國以試竒䇿而僥倖於有成者臣謂雖執政之臣亦未必肯爲也臣前已具言河利害甚詳而未蒙採聴今復畧陳其大要惟陛下詔計議之臣擇之臣謂河水未始不爲患今順巳決之流治堤防於恩冀者其患一而遲塞商胡復故道者其患一而速開六塔以囬今河者其患三而爲害無涯自河決横瓏以來大名金堤埽嵗歲増治及商胡再決而金堤益大加功獨恩冀之間自商胡決後議者貪建塞河之䇿未甞留意於堤防是以今河水勢一無勢字浸溢今若專意併力於恩冀之間謹治隄防則河患可禦不至於一作爲大害所謂其患一者十數年間今河下流淤塞則上流必有決處此一患而遲者也今欲塞商胡口使水歸故道治堤修埽功料浩大勞人費物困弊公私此一患也幸而商胡可塞故道復歸髙淤難行不過一二年間上流必決此二患而速者也今六塔河口雖云已有上下約然全塞大河正流爲功不小又開六塔河道治二千餘里堤防移一縣兩鎮計其功費又大於塞商胡數倍其爲困弊公私不可勝計此一患也幸而可塞水入六塔而東横流散溢濵徳博與齊州之界咸𬒳其害此五州者素號冨饒河北一路財用所仰今引水注之不惟五州之民破壞田産河北一路坐見貧虚此二患也三五年間五州凋弊河流注溢乆又淤髙流行梗一作艱澁則上流必決此三患也所謂爲害而無涯者也今爲國誤計者本欲除一患而反就三患此臣所不諭也至如六塔不能容大河横壠故道本以髙淤難行而商胡決今復驅而注之必横流而散溢自澶至海二千餘里堤埽不可卒修修之雖成又一作必不能捍水如此等事甚多士無愚智皆所共知不待臣言而後悉也臣前未奉使契丹時巳嘗具言故道六塔皆不可爲惟治堤順水爲得計及奉使徃來河北詢於知水者其說皆然雖恩冀之人今𬒳水患者亦知六塔不便皆願且治恩冀隄防爲是下情如此誰爲上通臣旣知其詳豈敢自黙伏乞聖慈特諭宰臣使更審利害速罷六塔之役差替李仲昌等不用選一二精幹之臣與河北轉運使副及恩冀州官吏相度隄防併力修治則今河之水必不至爲大患且河水天災非人力可回惟當順導防捍之而已不必求竒䇿立難必之功以爲小人僥冀恩賞之資也況功必不成後悔無及者乎臣言狂計愚惟陛下裁擇論狄青劄子至和三年臣聞人臣之能盡忠者不敢避難言之事人主之善馭下者常欲聞難言之言然后下無隱情上無一作不壅聽姦宄不作禍亂不生自古固有伏藏之禍未發之機天下之人皆未知而有一人能獨一作獨能言之人主又能聽而用之則銷患於未萌轉禍而爲福者有矣若夫天下之人共知而獨一作獨其人主之不知者此莫大之患也今臣之所言者乃天下之人皆知而惟陛下未知也今士大夫無貴賤相與語于親戚朋友下至庻民無愚智相與語于閭巷道路而獨不以告陛下也其故何㢤蓋其事伏而未發言者難於指陳也臣竊一作伏見樞宻使狄青出自行伍號爲武勇自用兵陜右巳著名聲及捕賊廣西又薄立勞效自其𥘉掌機宻進列大臣當時言事者已爲不便今三四年間雖未見其顯過然而不幸有得軍情之名推其所因蓋由軍士本是小人靣有黥文樂其同類見其進用自言我輩之内出得此人旣以爲榮遂相恱慕加又青之事藝實過於人比其軰流又粗有見識是以軍士心共服其材能國家從前難得將帥經略招討常用文臣或不知軍情或不閑訓練自青爲將領旣能自以勇力服人又知訓練之方頗以恩信撫士以臣愚見如青所爲尚未得古之名將一二但今之士卒不慣見如此等事便謂湏是我同類中人乃能知我軍情而以恩信撫我青之恩信亦豈能徧及於人但小人易爲扇誘所謂一犬吠形百犬吠聲遂皆翕然喜共稱說且武臣掌機宻而得軍情不唯於國家不便亦於其身未必不爲害然則青之流言軍士所喜亦其不得已而勢使之然也臣謂青不得巳而爲人所喜亦將不得已而爲人所禍者矣爲青計者冝自一作自冝退避事權以止浮議而青本武人不知進退近日以來訛言益甚或言其身應圖䜟或言其宅有火光道路傳說以爲常談矣而惟陛下猶未聞也且唐之朱泚本非反者倉卒之際爲軍士所迫爾大抵小人不能成事而能爲患者多矣泚雖自取族滅然爲徳宗之患亦豈小哉夫小人䧟於大惡未必皆其本心所爲直由漸積以至蹉跌而時君不能制患於未萌爾故臣敢昧死而言人之所難言者惟願陛下早聞而省察之耳如臣愚見則青一常才未有顯過但爲浮議所喧勢不能容爾若如外人衆論則謂青之用心有不可知者此臣之所不能決也但武臣掌機宻而爲軍士所喜自於事體不便不計青之用心如何也伏望聖慈深思逺慮戒前世一作後禍亂之迹制於未萌宻訪大臣早決宸斷罷青機務與一外藩以此觀青去就之際心迹如何徐察流言可以臨事制變且二府均勞逸而出入亦是常事若青之忠孝出處如一事權旣去流議漸消一作息則其誠節可明可以永保終始夫言未萌之患者常難於必信若俟患之巳萌則又言無及矣臣官爲學士職號論思聞外議喧沸而事繫安危臣言狂計愚不敢自黙取進止月餘青罷摳宻知陳州奏議卷第十三論罷修奉先寺狀堅壯一作堅固論修河第二狀未知此下一有始字不攻不字下一有待字一不快一作漸壅此其常勢一作此勢之常自是一作古力復此下一有所復二字水不能行水字上一有而字又自下流先淤下流一作海口又淤下流一再有下流二字計用一千八百萬梢芟一作計用梢芟一千八百萬減得一作損巳是一作自是浩大一作旣大則此所謂一作此則所謂大抵一作約今河今字下一有日字論修河第三狀畏小人畏一作任口舌一作之說之臣一作大臣目下一作即日若得一作若能使非有私仲昌之心一作本非私仲昌功料一作功費費物一作匱物之界一作竟論狄青劄子流議漸消此上一有而字居士集卷第十三歐陽文忠公集十二詩五十五首送鄭革先軰賜第南歸一本注革以累舉年老㤙賜出身少年郷譽歎才淹六十猶隨貢士函握手親朋驚白髪還家閭里看青衫閣涵空翠連衡阜門枕寒江落楚帆試問塵埃勤斗禄何如琴酒老雲巖和原父揚州六題六一作五時㑹堂二首造貢茶所也積雪猶封蒙頂樹驚雷未發建溪春中州地暖萌芽早入貢冝先百物新憶昔甞修守臣職余甞守揚州歳貢新茶先春自探兩旗開誰知白首來辭禁得與金鑾賜一杯自東門泛舟至竹西亭登崑丘入蒙谷戲題春貢亭崑丘蒙谷接新亭畫舸悠悠春水生欲覓揚州使君處但隨風際管絃聲竹西亭十里樓臺歌吹繁揚州無復似當年古來興廢皆如此徒使登臨一慨然崑丘臺訪古髙臺半巳傾春郊誰一作隨從綵旗行喜聞車馬人同樂慣聽笙歌鳥不驚蒙谷一徑﨑嶇入谷中翠條紅刺罥春叢花深時有人相應竹密𥘉疑路不通内直奉寄聖俞博士千門鑰一作鎻入斷人聲樓閣一本作闕沉沉夜氣生獨直偏知宫漏永稍寒尤一作猶覺玉堂清霜雲映月鱗鱗色風葉飛空摵摵鳴犬馬力疲㤙未報坐驚時節巳崢嶸送梅龍圖公儀知杭州萬室東南冨且一作號冨繁羡君風力有餘閑漁樵人樂江湖外一作上談笑詩成罇爼間日暖梨花催美酒天寒桂子落空山郵筒不絶如飛翼一作雖然不得陪佳賞莫惜新篇屢徃還一作應有新篇慰病顔送沈學士知常州康舊館芸香鎻寂寥齋舲東下入秋濤江晴風暖旌旗颺木落霜清鼓角髙吟就綵牋賔巳醉舞飜紅䄂飲方豪平生粗得爲州樂因羡君行首重搔聖俞在南省監印進士試卷有兀然獨坐之歎因思去歳同在禮闈慨然有感兼簡子華景仁南宫官舍苦蕭條常憶羣居接儁寮古屋醉吟燈豔豔畫廊愁聽雨蕭蕭殘春共約無虚擲一歳那知忽復銷顧我心情又非昨秖思相伴老漁樵奉答聖俞歳日書事積雪照清晨東風冷著人年光向一作隨老速物意逐時新貰酒閑邀客披裘共一作自探春猶能自一作略勉彊顧我莫辭頻夜聞春風有感奉寄同院子華紫微長文景仁閏後春深雪始銷東風凌鑠勢方豪陽生草木黃泉動氷破江湖白浪髙未報國㤙嗟病骨可怜身事一漁舠少年自與芳菲競莫笑衰翁擁弊袍病告中懷子華原父狂來有意與春爭老去心情漸不能丗味惟存詩淡泊生涯半爲病侵陵花明曉日繁如錦酒撥浮醅緑似澠自是少年豪橫過而今癡鈍若寒蠅奉酬長文舍人出城見示之句春分臘雪未全銷凜冽春寒氣尚驕攝事𥘉欣迎社鷰尋芳因得過溪橋清浮酒蟻醅𥘉撥暖入鸎篁舌漸調興味愛君年尚少莫嫌齋禁一作齋館暫無憀唐崇徽公主手痕和韓内翰故郷飛鳥尚啁啾何況悲笳出塞愁青塚埋魂知不返翠崖遺迹爲誰留玉顔自古爲身累肉食何人與國謀行路至今空歎息巖花澗草自春秋答和閣老劉舍人雨中見寄花間鳥語愁泥滑屋上鳩鳴厭雨多坐見殘一作芳春一如此可憐吾意巳蹉蛇蕭條兩鬢霜後草㶑灧十分金卷荷此物猶能慰衰老一作病稍晴相約屢相過寄閣老劉舍人夢寐江西未得歸誰憐蕭颯鬢毛衰莓苔生壁圖書室風雨閉門桃李時得酒雖能陪笑語老年其實厭追隨明朝雨止花應在又踏春泥向鳯池詳定幕次呈同舍嘉祐四年御試進士時詳定卷子幕次在崇政殿後來時宫柳緑初匀坐見紅芳㡬畨新蜂蜜滿房花結子還家何處覓殘春禁中見鞓紅牡丹洛中花之竒者也盛遊西洛方年少晚落南譙號醉翁白首歸來玉堂署一作上君王殿後見鞓紅和江鄰㡬學士桃花用其韻時在崇政殿後詳定幕次草上紅多枝上稀芳條一作苞緑蕚憶來時見桃著子始歸後誰道仙花開落遲送襄陵令李君緑髪襄陵新長官面顔雖老渥如丹君服何首烏鬚髪皆黒顔容如少時折腰聊爲五斗屈把酒猶能一笑歡紅棗林繁欣歳熟紫檀皮軟禦春寒民淳政簡居多樂無苦思歸欲掛冠景靈宫致齋攝事衰年力不彊誰憐岑寂卧齋坊一作房青苔點點無人迹緑葉隂隂覆砌涼玉宇清風來處逺仙家白日靜中長却視九衢車馬客自然顔鬢易蒼蒼夏享太廟攝事齋宫聞鸎寄原甫四月田家麥穗稠桑枝生椹鳥啁啾鳯城緑樹知多少何處飛來黃栗留田家謂麥熟時鳴者爲黃栗留出詩義送王平甫下第安國歸袂揺揺心浩然曉船鳴鼓轉風灘朝廷失士有司恥貧賤不憂君子難執手聊須爲醉一作酒别還家何以慰親懽自慙知子不一作未能薦白首胡爲侍從官對雪十韻對雪無佳句端居正杜門人閑見初一作初見落風定不勝繁可喜輕明質都無剪刻痕鋪平失池沼飄急響䆫軒惜不揺嘉樹衝宜走畫轅寒欺白酒嫰暖一作老愛紫貂温遠靄銷如洗愁雲晚更屯兒吟鶵鳯語翁坐凍鴟蹲病思驚殘歳朋歡頼酒一作一罇稍晴春意動誰與探名園和武平學士歳晚禁直書懷五言二十韻用其韻多病淹殘歳初寒卧直廬朝廷務清靜鈴索少文書嚮學今爲盛優賢古莫如靚深嚴禁署一作闥閑宴樂羣居賜馬聮金絡清塵侍玉輿討論三代盛獻納萬機餘號令存寛大文章復古初笑談揮翰墨俄頃列瓊琚夜漏銷宫燭春暉上玉除謌詩唐李杜言語漢嚴徐自顧追時彦多慙不鄙予無鹽煩刻畫寒谷借吹嘘朋友飛雝鷺君臣在藻魚貪榮同衛鶴取笑類黔驢皎皎心雖在蕭蕭髪巳踈未知論報効安得遂椎漁雲破西山出江橫畫閣虚餘生歎勞止搔首念歸歟引綬誇民吏椎牛㑹里閭一麾終得請此計豈躊躇答西京王尚書寄牡丹新花來遠喜開封呼酒看花興未窮年少曽爲洛陽客眼明重見魏家紅却思初赴青油幕自笑今爲白髪翁西望無由陪勝賞但吟佳句想芳叢應制賞花釣魚絳闕晨霞一作光照霧開輕塵不動翠華來魚遊碧沼涵靈徳花馥清香薦壽杯夢聽鈞天聲杳黙日長化國景徘徊自慙擊壤音多野帝所賡歌亦許陪清明賜新火魚鑰侵晨放九門天街一騎走紅塵桐華應候催佳節榆火推㤙忝侍臣多病正愁餳粥冷清香但愛蠟煙新自憐慣識金蓮燭翰苑曽經七見春明堂慶成辰火天文次皐門路寢閎奉親昭孝德惟帝饗精誠禮以三年講時因萬物成九筵嚴太室六變導和聲象魏中天起風雷大號行歡呼響山岳流澤浹根莖寳墨飛雲動金文耀日晶從臣才力薄無以頌休明羣玉殿賜宴一本作謝上賜飛白書至治臻無事豐年樂有成圖書開秘府宴飫一作飲集羣英論道皇墳奥貽謀一作謨寳訓明九重多暇豫八體極研精筆力千鈞勁豪端萬象生飛牋金灑落拜賜玉鏘鳴盛際崇儒學愚臣濫寵榮惟能同舞獸聞樂識和聲永昭陵挽詞三首仁宗與子雖天意知人昔帝難一言謀早定九鼎勢先安大舜仁由性成湯治以寛孤臣㤙未報清血但汍瀾干戈不用臻無事朝野多歡樂有年便坐看揮飛白筆侍臣新和栢梁篇衣冠忽見藏原廟簫一作笳鼓愁聞向洛川寂寞秋風羣玉殿還同恍惚夢鈞天行殿沉沉畫翣重淒涼挽鐸出深宫攀號不悟龍胡逺侍從猶穿豹尾中日薄山川長起霧天寒松栢自生風斯民四十年涵煦耕鑿安知荷帝功續作永昭陵挽詞五首王者居尊本無外由來天下以爲家六龍白日乘雲去何用金錢買道車苦霧霏霏著彩旗猶排吉仗雜凶儀常時鳯輦行遊䖏今日龍輴慟哭隨都人擾擾塞康莊西送靈車過苑墻金鼎藥成龍巳去人間惟有䑕拖腸素幕悠悠逗曉風行隨哀挽出深宫妃嬪莫向蒼梧望雲覆昭陵洛水東叨陪法從最多年慣聽梨園奏管絃從此無因瞻黼坐惟應䰟夢到鈞天赴集禧宫祈雪追憶從先皇駕幸泫然有感琳闕岧岧倚瑞煙憶陪遊豫入新年雲深曉日開宫殿水闊春風颺管絃千騎清塵回輦路萬家明月放燈天一朝人事淒涼改惟有靈光獨巋然夜宿中書東閤翰林平日接羣公文酒相歡慰病翁白首歸田徒墨蹟作空有約黃扉論道愧無功攀髯路斷三山遠憂國心危百箭攻今夜靜聽丹禁漏尚疑身在玉堂中送王學士赴兩浙轉運京本作送王勝之兩浙運使漢家財利析秋毫暫屈清才豈足勞邑屋連雲盈萬井舳艫衘尾列千艘春寒欲盡黃梅雨海浪髙飜白鷺濤平昔壯心今在否江山猶得助詩豪早朝閶闔初開瑞霧中丹霞曉日上蒼龍鳴鞭響徹廊千歩佩玉聲趨㦸百重雪後朝寒猶凜冽柳梢春意已丰茸少年自結芳菲侣老病惟添睡思濃下直宫柳街槐緑未齊春隂不解宿雲低輕寒漠漠侵駞褐小雨班班作鷰泥報國無功嗟巳老歸田有約一作計一何稽終當自駕柴車去獨結茅廬潁水西齋宫尚有殘雪思作學士時攝事于此甞有聞鸎詩寄原父因而有感四首雪壓枯條脉未抽春寒憀慄作春愁却思緑葉清隂下來此曽聞黃栗留老來何與青春事閑處方知白日長自恨乞身今未得齒牙浮動鬢蒼浪兩京平日接英髦不獨詩豪酒亦豪休把青銅照雙鬢君謨今巳白刁騷詩篇自覺隨年老酒力猶能助氣豪興味不衰惟此爾其餘萬事一牛毛攝事齋宫偶書一作齋夕感事齋宫岑寂偶偷閑猶覺閑中興未䦨美酒清香銷晝景冷風殘雪作春寒丹心未死惟憂國白髪盈簪盍掛冠誰爲寄聲清潁客此生終不負漁竿早朝感事踈星牢落曉光微殘月蒼龍闕角西玉勒爭門隨仗入牙牌當殿報班齊羽儀雖接鴛兼鷺野性終存鹿與麛笑殺汝隂常處士墨蹟作雲林髙卧客十年騎馬聽朝音潮鷄集禧謝雨十里長街五鼓催泥深雨急馬行遲卧聽竹屋蕭蕭響却憶滁州睡足時下直呈同行三公午漏聲初轉歸鞍路偶同天清黃道日街闊緑槐風萬國舟車㑹中天象魏雄戢戈清四海論道屬三公自愧陪羣彦從來但樸忠時平容竊禄歳晚歎衰翁買地淮山北垂竿潁水東稻粱雖可戀吾志在㝠鴻東閤雨中直閤時偷暇幽懷坐獨哦緑苔人迹少黃葉雨聲多雲結愁隂重風傳禁漏過瑶圖新嗣聖玉塞乆包戈相府文書簡豐年氣候和還將鳯池句聊雜野人歌四月十七日景靈宫奉迎仁宗皇帝御容有感行殿峩峩出緑槐琳房芝闕聳一作竦崔嵬管絃飄落人間去幢節疑從天上來基業百年傳聖子黔黎四紀樂春臺孤臣不得同鍼虎未死心先冷若灰居士集卷第十三熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正兼簡子華景仁相伴一作相逐奉酬長文出城鸎篁篁一作簧莫嫌一作莫懷無憀憀一作寥寄劉舍人笑語一作語笑和江鄰㡬桃花歸後一作去景靈宫致齋石本序云某啓景靈致齋書事奉懷審官紏察太學史院五君子伏惟采覽某上和武平禁直書懷躊躇一作踟蹰早朝感事麛石本作麋, WYG: ''}
