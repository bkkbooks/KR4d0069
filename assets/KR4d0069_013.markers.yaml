  - {type: variant, offset: 0, length: 252, content: 外集卷第十三歐陽文忠公集六十三記河南府重脩使院記郡府統理民務調發賦稅稽功㑹事事無不舉代君理物政教繫之漢承秦餘精意牧民之官置部刺史以督察出御史以監掌之太守二千石莫不盡誠率下奉上李唐酌用舊典使天下以大權小故有州有府刺史專守理所大鎮觀察旁郡後増置胥吏史以緫治諸州繩寛刺善理務詳焉府之有使院也厥惟尚矣皇朝政教清明制度適中雖鎮守自占緫領委于均輸惟使幕置吏用而不革洛都天下之儀表提封萬井隷縣十九王事浩穰百倍他邑而典史之局甚陋不稱彭城相居守之明年若曰政教之廢興出于是官吏之緩猛繫于是義不可忽始謀新之乃度地於府之西偏斥大, WYG: ''}
