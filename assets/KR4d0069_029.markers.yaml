  - {type: variant, offset: 0, length: 5414, content: 居士集卷第二十九歐陽文忠公集二十九墓誌六首尚書主客郎中劉君墓誌銘并序君諱立之字斯立姓劉氏吉州臨江人也曽祖諱逵祖諱琠當五代時避亂皆不仕父諱式官至尚書工部貟外郎掌三司磨勘十餘年能其職世以其官名其家君少孤能自立舉進士為福州連江尉睦州青溪主簿宣州南陵令改大理寺丞知婺州金華縣太子中舍知梓州中江縣通判瀘州瀘州接西南夷常用武人為守而夷數怨叛議者以謂武人不習夷情以生患冝得能吏通判州事君始以材選至則為明約束止侵欺曰必使信自我始夷人安之凡君之所更立至今用一作因以為法而夷亦至今不叛通判常州知髙郵軍累遷殿中丞國子博士尚書虞部比部貟外郎知潤州皆有能政以能選為提點福建路刑獄察獄之冤死者奏黜知泉州蘇壽與其通判張太沖福建七州皆震悚一作慄御史考其課為天下第一遷司勲貟外郎開封府判官荆湖北路轉運使坐舉官免杜衍李若谷范仲淹等皆言方天下多事時一作方今天下多事如劉某者不宜乆居于家一作外乃復起為比部貟外郎知漣水軍言事者以謂自元昊反一方用兵而天下之民弊財絀於上而盜起於下然州縣吏猶習故態苟簡弛壞一作曼如無事時於是大選轉運使以按察諸路君以選為荆湖北路轉運使他路繩吏或過急而𬒳按劾者多不服君所舉察簡而一作其賢否無不當是時廣西湖南䕫峽諸蠻皆叛亂君所部下溪辰州彭氏蠻亦折誓柱招集亡命移書州縣州縣使人徃者一無者字輙囚辱侮慢一作侮慢辱囚辰鼎澧一作鼎澧辰三州守吏皆言蠻叛有迹請加兵詔書問君君曰蠻道辰溪落鶴水悍激可下不可上其必不敢輙出而辰州土丁勝兵者三萬人冝積粟利兵為備而已因言蠻類雖人冝鳥獸畜其小嘲秋抵觸驅而逺之耳若必擾伏制從至戾其性則噪呼跑虣駭起而奔突乃欲力追而捕之則散漫山林我弊而彼逸凡湖廣之患皆如此也天子以其言然下三州毋得妄動一聽君所為而蠻亦卒無事復為司勲貟外郎判三司度支句院改鹽鐵判官假太常少卿接伴契丹使者遂送之明年遂使于契丹還言澶魏築河堤非其時必難成雖成必決不如因其所趣而導之利後河果決商胡君仕宦四十年不營産業自復為司勲貟外郎遂不復求磨勘凡三遷皆為知者所薦為人沉敏少言笑與人寡合而喜薦士士由君薦者多為聞人天章閣待制杜𣏌田瑜是也轉運鹽鐵皆掌財賦而君常以民為先其調率有可免免之其不得已一有費字必為處畫使吏不能因縁而民不重費一作困其守官不為勢牽一作奪不為利奪一作牽為青溪主簿時知州事李階通判朱正辭者皆一有世字號強吏喜負其能以折辱下士士皆承望奔走不暇獨君數以事爭而二人者常輙屈其始皆怒後卒歎服共薦之其通判瀘州州有鹽井蜀大姓王蒙正請歲倍輸以自占蒙正與莊獻明肅一有皇字太后連姻轉運使等皆不敢與奪君曰倍輸於國家猶秋毫耳柰何使貧民失業遂執不與鄂州官歲市茶五百一作十萬斤君為轉運使時三司請益一無益字市一百萬君上言曰鄂人利茶以為生今官市之多反以茶為病縱不能減柰何增之天子為君許寛一年君曰事苟可行何必一年如其不可雖寛十年不可也爭之不已後卒為君罷之君在鹽鐵次當舉官掌某事一作某人爲三司使欲用其私人以空名狀請君署君不肯署而求舉者姓名三司使不恱卒命他判官舉之其後三司使竟坐所舉罷慶曆八年五月遷主客郎中益州路轉運使其年十一月七日卒于官享年六十有四夫人臨沂縣君王氏贈尚書右僕射礪之女先君若干年卒五子元卿眞卿亦早亡敞今為大理評事攽鳯翔府推官皆賢而有文章放太廟齋郎尚㓜四女三適人一尚㓜以某年某月某日葬于某縣某鄕某原銘曰劉氏顯晦以時亂治有聲王朝自君再世惟徳之貽是將又大曷知其然君實有子翰林侍讀學士右諌議大夫楊公墓誌銘慶曆八年春翰林侍讀學士右諌議大夫楊公年六十有九告老即以工部侍郎致仕歸于常州其行也天子召見宴勞賜以不拜公卿大夫咸出餞于東門贍望咨嗟相與言曰楊公歸哉於公計為可榮於國家計為可惜其明年九月十三日公疾革出其兵論一篇示其子忱慥而授以言曰一有臣聞二字臣子雖死不敢忘其君父者天下之至恩大義也今臣偕不幸猶以垂閉之口言天下莫大之憂為陛下無窮之慮者其事有五以畢臣志死無所恨惟陛下用臣言不必哀臣死也言訖而卒不及其私忱慥以其語并其兵論以聞天子震悼顧有司問可以寵公者有司舉故事以對天子曰此何足以慰吾思乃詔特贈公兵部侍郎公少師事种放學問爲文章長於議論好讀兵書知古兵法以謂士不兼文武不足任大事當四方無事時數上書言邊事後二十餘年元昊叛河西契丹舉衆違約三邊皆警天下弊於兵公於此時耗精疲神日夜思慮創作兵車陣圖刀楯之屬皆有法天子以歩卒五百如公之法試于庭以爲可用而世多非其刀楯脩甞奉使河東得邊將王吉言元昊出兎毛川爲吉所敗者用楊公一有刀楯也蓋世未甞用其術爾然公素剛一作剛直少合而議者不一故不得盡用其言夏竦經略陜西請益置土兵公言竦據内地無破賊之謀而坐請益兵蓋虞敗事則欲以兵少為解竦復論公不忠沮計公不能忍以語詆之其後三路農民壯者咸墨為兵公又言兵在精不在衆衆而不練則不整而易敗困國而難供時自將相大臣議者皆務多兵獨公之論能如此劉平兵敗元昊圍延州甚急而救兵不至公在河中乃僞爲書馳告延州救兵十萬至矣因命旁郡縣具芻粮什器如其數以俟已而元昊亦解去後公守并州即詔公為并代麟府路經略安撫招討等使兼兵馬都部署公執勑告其羣吏曰天子用我矣然任其事必圖其効欲責其効必盡其方乃列六事以請曰能用臣言則受命不然則已朝廷難之公論不已坐是徙知邢州公志之不就皆此類也公甞為御史章獻太后兄子劉從徳為團練使以卒其門人親戚厮養用從徳拜官爵者數十人馬季良以劉氏壻為龍圖閣直學士公上書言漢吕太后王禄産欲彊其族而反以覆宗唐武三思楊國忠之禍不獨其身幾亡其國太后大怒貶監舒州酒稅居二歲復召為御史言事愈切公祥符元年進士及第以上書言事眞宗竒之召試不赴拜著作佐郎累官至工部侍郎為天章閣待制龍圖閣樞密直學士遂侍講于翰林甞為審刑院詳議官知淮陽江隂軍三司度支判官知御史雜事判吏部流内銓三司度支副使河北河東都轉運使知河中府陜并邢滄杭五州所至皆有能績一作稱爲人廉潔一作平剛直少屈而難犯其仁心愛物至其有所能容人多所不及也公一有諱皆二字字次公曽祖諱偉祖諱某父諱守慶初娶張氏又娶李氏又娶李氏一無此八字又娶王氏太原郡君一有六孫景略景亮景謨景道景直景彦十四字直一作宣公卒之明年秋其子忱以其喪歸于河南又明年二月十七日葬于洛陽縣宣武管平洛郷之先塋公有文集十卷兵書十五卷讀其書可以見公之志考其始終之節可以知公之心嗚呼可謂忠矣脩為諌官時甞與公爭議一作言于朝者而且未甞識公也及其葬也其子不以銘屬於他人而以屬脩者豈以脩言為可信也歟然則銘之其可不信銘曰逺矣楊氏有來其一作其未有始赤泉侯功與漢俱起震官太尉四世以公於陵正直僕射于唐師復理卿振左拾遺文蔚獲嘉其後益衰避亂中州曽祖始一作遷南祖屈僞邦令于烏江又適南粤皇考是生晦顯一作顯晦有時發于皇明在考司馬始仕坊州遂家中一作内部道徳之優司馬四子唯公克大非徒大之將又長之世有官族孰無繫譜或絶於㣲或亡其序不絶不亡由屢有人誰如楊世愈乆而蕃次第一作後嗣弗迷昭穆緜聮公其歸此一作乎安千萬年供備庫副使楊君墓誌銘君諱琪字寶臣姓楊氏麟州新秦人也新秦近胡以戰射為俗而楊氏世以武力雄其一方其曽祖諱弘信為州刺史祖諱重勲又爲防禦使太祖時為置建寧軍於麟州以重勲為留後後召以為宿州刺史保靜軍節度使卒贈侍中父諱光扆以西頭供奉官監麟州兵馬卒于官君其長子也君之伯祖繼業太宗時為雲州觀察使與契丹戰殁贈太師中書令繼業有子延昭眞宗時為莫州防禦使父子皆為名將其智勇號稱無敵至今天下之士至於里兒野竪皆能道之君生於將家世以武顯而獨好儒學讀書史為人材敏謙謹沈厚意恬如也初以父卒于邊補殿侍後用其從父延昭任為三班奉職累官至供備庫副使階銀青光禄大夫爵原武伯李溥為發運使以峻法繩下吏凡溥所按行吏皆先戒以備而溥至多不免其黜廢者數百人其聞溥來輙惶懼自失至有投水死者君時年最少為奉職監大通堰去溥治所尤近溥甞夜拏輕舟猝至按其文簿視其職事如素戒以備者溥稱其才君所歷官無不稱職其後同提點河東京西淮南三路刑獄公事君歎曰吾本武人豈足以知士大夫哉然其職得以薦士亦吾志也其所舉者二百餘人徃徃為世聞人甞坐所舉一人罰金君喜曰古人拔士十或得五而吾所薦者多矣其失者一而已君少喪父事其母韓夫人以孝聞後以恩贈其一無此字父左驍衛將軍母夫人南陽縣太君初娶慕容氏又娶李氏有子曰畋賢而有文武材今為尚書屯田貟外郎直史館君以皇祐二年六月壬戌卒于淮南年七十有一皇祐三年十月甲申畋以其喪合慕容氏之喪葬于河南洛陽杜澤原銘曰楊世初微自河西彎弓馳馬耀一作躍邊陲桓桓侍中國屏毗太師防禦傑然竒名聲累世在羌夷時平文勝武力衰温温供備樂有儀好賢舉善利豈私愷悌君子神所宜康寧壽考順全歸有畋為子後可知太子中舍王君墓誌銘王君之皇考曰贈衛尉少卿諱某皇妣曰南充縣太君胥氏皇祖諱某皇曽祖諱某君諱汲字師黯娶胡氏一有曰字安定縣君子男三人女五人男曰尚恭尚喆尚辭初天聖明道之間予為西京留守推官時王君寓家河南其二子始習業國子學日從諸生請學於予較其藝常為諸生先而尚恭尤謹飭儼然有儒者法度予固竒王君之有是子也以故與君游而君性簡質重然諾臨事而敏與之游者必愛其為人其後二子者果皆以進士中第予亦罷去不復遇王君且七年矣而尚恭來請曰不幸吾先人之亡將以今年某月甲子葬于河南某縣某郷之某原宜得銘于石以誌諸後世一有予甞嘉尚恭而從王君遊十字乃為次其世而作銘以遺之云惟王氏之先長安萬年四代之祖刺史壁州遭巢猾唐得果而留卒葬西充為郷壁公王孟有蜀或家或禄三世不遷自君東還始家河南廣文之生舉三不中任仕以兄主簿之卑試原武密晉城是令政專自出令政有稱遷理之丞藍田夏雒三邑皆聞壽五十九終中舍人在雒逢饑餔粟不殍襃功勸吏天子有詔雒人染癘躬之不避以死勤民在法宜祀刻詩同藏惟世之揚尚書工部郎中歐陽公墓誌銘歐陽氏世為廬陵人廬陵於五代時屬僞呉故歐陽氏在五代無聞者淳化三年脩仲父府君始以進士中乙科一作太宗時脩仲父府君始以進士中淳化三年乙科其後為御史有能名眞宗甞自擇御史府君以秘書丞一有召字見見者數人皆進自稱薦惟恐不用府君獨立墀下無所說一作無言明一作翌日拜監察御史中丞王嗣宗指曰是獨立墀下者眞御史也一有㑹字絳州守齊化基犯法制劾其事化基嗣宗素所惡者諷之欲使蔓其獄府君一有遽拒二字曰如詔一作如制所劾而已嗣宗怒及獄上奏用他吏覆之一有他吏二字索其家得一有金塗二字銅器十數府君坐鞠獄不盡免官明年復得御史監蘄州稅又明年遷殿中侍御史左廵使居二歲奏事殿中眞宗識之勞曰御史乆矣亦勞乎問何所欲府君謝不任一作稱職而巳後數日眞宗語宰相與轉運使宰相疑其有求而不先白已對以貟無闕復使與一大郡宰相召至中書問御史家何在欲郡孰為便對曰無不便宰相怒與海州又移睦州天禧元年入遷侍御史二年出知泗州先是京師歲旱有浮圖人斷一作有僧某者用浮屠術斷一臂禱雨官為起寺於一有淮上二字龜山自京師王公大臣皆禮下之其勢傾動一無動字四方又誘民男女投淮水死曰佛之法用此得大利而愚民歲死淮水者幾百一作常數十人至其臨溺時用其徒倡呼前後擁之以入至有自悔欲走者一無者字叫號不得免一作而一號不得免者府君聞之驚一作大駭曰害有大一作甚於此邪盡捕其徒詰其姦民誅數一作十餘人遣還郷里者數百人遂一作而毀其寺入轉尚書司封貟外郎三司户部判官六年為廣南東路轉運使前為使者以市舶物代俸錢其利三倍府君歎曰一作嶺南舊以市舶司物代轉運使俸錢其利三倍前為使者相襲乆而不變府君至則歎曰利豈吾欲邪使直以錢為俸今上即位就轉工部郎中秩滿以一弊舟還無一海上物歸朝賜金紫為兩浙路轉運使以足疾求知江州天聖四年又求分司未得命以其年二月某日卒於江州之廨享年六十有八以某年某月某日葬某所曽祖諱某祖諱某僞唐吉州軍事判官父諱某僞唐屯田貟外郎娶米氏封金壇縣君先府君以卒嗣子鑒一有今字為右侍禁武昌廵檢女二人長適某次未嫁府君諱載字則之性方直嚴謹一有美儀容治身儉薄簡言語為政務清淨平居歛色而一作常正依獨坐如對大賔終日不少懈一作色不少弛人用憚之薦舉下吏人未甞一作不之知後有知者來謝皆拒不納所至官舍未甞窺園圃至果爛墮地家人無敢取者其清如此銘曰唐隳盜猖土裂四一作食有一方鍾氏於洪入一作八州自王傳死子時敗臣于楊自梁迄周廬陵僞邦歐陽是家世以不章一作彰違命之侯廬陵王土歐陽有聞始我仲父以貢中科來者繼武仲父之材御史其能廉清儉恭直躬以行銘以藏之子孫之承少府監分司西京裴公墓誌銘君諱徳𥙿一作谷字某姓裴氏河中萬泉人也其九世祖耀卿為唐名臣曽祖諱某祖諱某贈左千牛衛大將軍父諱濟以智勇事太宗皇帝從李繼隆擊契丹於唐河屢立戰功守鎭定十餘年威惠著于北邊咸平中李繼遷叛河西以内客省使順州防禦使守靈州繼遷連歲攻之城守堅不能下繼遷擊破清逺軍而粮道絶救兵不至城乃䧟遂殁于賊贈鎭江軍節度使累贈尚書令兼中書令追封呉國公方其殁也詔録其子孫君以長子自四門助教拜太子右賛善大夫累官至少府監階朝奉大夫勲上柱國爵開國侯以老分司西京許居于京師某年某月某日以疾卒于家享年七十有六君為人質重寛易居父喪盡哀宗族稱其孝得父金帛悉分諸弟不有其一錢其爲吏廉清不擾歷監藥蜜庫店宅務泗一作明州粮料院宿州酒稅知明州奉化興元南鄭二縣同判吏部南曹通判南京留守司知蓬絳解􅉑澤沂六州皆有能政喜自晦黙如不能言予甞問其解之鹽池君解析纎密自前世功利㳂革損益條布如在目前寶元中甞上書論茶鹽利害多所施行其聽獄訟敏決數得疑獄皆強吏所不能辨者及平居議法必以仁恕為本君初名徳昌前娶康氏後娶趙氏封平原郡君有賢行子男三人士倫士林大理寺丞士傑衛尉寺丞女八人長適右侍禁張用之次適大理寺丞薛寅集賢校理孫錫大理寺丞丁某殿中丞孫祖慶庫部貟外郎張承懿集賢校理王益柔以某年某月某日葬君于河南登封縣之某原其孤士傑來請銘以葬銘曰裴始絳人於唐顯聞偉歟文獻八世有孫守節蹈義厥聲以振忍生而耻亦終以死死義之榮令名不巳豈惟令名報徳之隆延延裴氏其頼無窮少府之賢寛恭信厚保身承家多其禄壽壽豐于躬禄及其嗣爰告後人俾知所自居士集卷第二十九熈寧五年秋七月男發等, WYG: ''}
