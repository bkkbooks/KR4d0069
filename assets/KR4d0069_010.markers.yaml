  - {type: variant, offset: 0, length: 26646, content: 外集卷第十歐陽文忠公集六十經旨石鷁論夫據天道仍人事筆則筆而削則削此春秋之所作也援他說攻異端是所是而非所非此三傳之所殊也若乃上揆之天意下質諸人情推至隱以探萬事之元垂將来以立一王之法者莫近扵春秋矣故杜預以謂經者不刋之書范寗亦云義以必當爲理然至一經之指三傳殊說是彼非此學者疑焉魯僖之十六年隕石于宋五六鷁退飛過宋都左氏傳之曰石隕于宋星也六鷁退飛風也公羊又曰聞其磌然視之則石察之則五故先言石而後言五視之則鷁徐而視之則退飛故先言六而後言鷁榖梁之意又謂先後之數者聚散之辭也石鷁猶盡其辭而況扵人乎左氏則辨其物公榖則鑒其意噫豈聖人之旨不一邪將後之學者偏見邪何紛紛而若是也且春秋載二百年之行事隂陽之所變見災異之所著聞究其所終各有條理且左氏以石爲星者莊公七年星隕如雨若以所隕者是星則當星隕而為石何得不言星而直曰隕石乎夫大水大雪為異必書若以小風而鷁自退非由風之力也若大風而退之則衆鳥皆退豈獨退鷁乎成王之風有拔木之力亦未聞退飛鳥也若風能退鷁則是過成王之風矣而獨經不書曰大風退鷁乎以公羊之意謂數石視鷁而次其言且孔子生定哀之間去僖公五世矣當石隕鷁飛之際是宋人次扵舊史則又非仲尼之善志也且仲尼隔數世修經又焉及親數石而視鷁乎糓梁以謂石後言五鷁先言六者石鷁微物聖人尚不差先後以謹記其數則扵人之褒貶可知矣若乃西狩獲麟不書幾麟鸜鵒来巢不書㡬鸜鵒豈獨謹記扵石鷁而忽扵麟鸜鵒乎如此則仲尼之志荒矣殊不知聖人紀災異著勸戒而已矣又何區區扵謹數乎必曰謹物察數人皆能之非獨仲尼而後可也噫三者之說一無是矣而周内史叔興又以謂隂陽之事非吉凶所生且天裂陽地動隂有隂陵陽則日蝕陽勝隂則歲旱隂陽之變出為災祥國之興亡由是而作旣曰隂陽之事孰謂非吉㐫所生哉其不亦又甚乎辨左氏左丘明作春秋外傳以記諸國之語其記柯陵之㑹曰單襄公見晉厲公視逺而歩髙且告魯成公以晉必有禍亂成公問之曰天道乎人事也單子曰吾非瞽瞍焉知天道吾見晉侯之容矣又曰觀其容知其心後卒如單子之言甚矣丘明之好竒而欲不信其書以傳後世也若單子之言然則夫單子者未得為篤論君子也幸其言與事㑹而已不然丘明從後書之就其言以合其事者乎何以論之觀其容雖聖人不能知人之心知其必禍福也夫禮之為物也聖人之所以飾人之情而閑其邪僻之具也其文為制度皆因民以為節而為之大防而巳人目好五色爲制文物采章以昭之耳樂和聲為制金石絲竹以道之體安尊嚴爲制冕弁衣裳以服之又懼其佚而過制也因為之節其登車也有和鑾之節其行歩也有佩玉之節其環拜也有鍾鼓之節其升降周旋莫不有節是故有其服必有其容故曰正其衣冠尊其瞻視儼然人望而畏之則外閑其邪而使非僻之心不入而已衣冠之不正瞻視之不尊升降周旋之不節不過不中禮而已天之禍福於人也豈由是哉人之心又䏻以是而知之乎夫喜怒哀樂之動乎中必見乎外推是而言猶近之單子則不然乃以絶義棄徳因其視瞻行歩以觀之又以謂不必天道止扵是而禍福扵是皆可以必此故所謂非篤論君子而其言幸與事㑹者也書曰象恭滔天又曰巧言令色孔壬夫容之與心其異如此故曰觀其容雖聖人不能知其心堯舜之無後顔回之短命雖聖人不可必夫君子之修身也内正其心外正其容而巳若曰因容以知心遂又知其禍敗則其可乎三年無改問或問傳曰三年無改扵父之道可謂孝矣信乎曰是有孝子之志焉蹈道則未也凡子之事其親莫不盡其心焉爾君子之心正正則公盡正心而事其親大舜之孝是也蓋嘗不吿而娶矣豈曰不孝乎至公之道也惟至公不敢私其所私私則不正以不正之心事其親者孝乎非孝也故事親有三年無改者有終身而不可改者有不俟三年而改者不敢私其所私也衰麻之服祭祀之禮哭泣之節哀思之心所謂三年而無改也世其世奉其遺體守其宗廟遵其教詔雖終身不可改也國家之利社稷之大計有不俟三年而改者矣禹承堯舜之業啓嗣之無改焉可也武王繼文之業成王嗣之無改焉可也使舜行瞽之不善禹行鯀之惡曰俟三年而後改可乎不可也凡爲人子者幸而伯禹武王爲其父無改也雖過三年忍改之乎不幸而瞽鯀爲其父者雖生焉猶將正之死可以遂而不改乎文王生而事紂其死也武王不待畢䘮而伐之敢曰不孝乎至公之道也魯隠譲桓欲成父志身終以弑春秋譏之可曰孝乎私其私者也故曰凡子之事其親者盡其心焉爾心貴正正則不敢私其所私者大孝之道也曰然則言者非乎曰夫子死門弟子記其言門弟子死而書寫出乎人家之壁中者果盡夫子之云乎㢤易或問或問曰王弼所用卦爻彖象其說善乎曰善矣而未盡也夫卦者時也時有治亂卦有善惡然以彖象而求卦義則雖惡卦聖人君子無不可為之時至其爻辭則艱厲悔吝凶咎雖善卦亦嘗不免是一卦之體而異用也卦彖象辭常易而明爻辭嘗恠而隱是一卦之言而異體也知此然後知易矣夫卦者時也爻者各居其一位者也聖人君子道大而智周故時無不可爲凡卦及彖象統言一卦之義爲中人以上而設也爻之爲位有得失而居之者逆順六位君子小人之雜居也君子之失位小人之得位皆凶也居其位而順其理者吉逆其理者亦凶也六爻所以言得失逆順而告人以吉凶也爻辭兼以疑中人以下而設也是以論卦多言吉考爻多凶者由此也卦彖象辭大義也大義簡而要故其辭易而明爻辭占辭也占有剛柔進退之理逆順失得吉凶之象而變動之不可常者也必究人物之狀以爲言所以告人之詳也是故窮極萬物以取象至于臀腓䑕豕皆不遺其及于恠者窮物而取象者也其多隱者究物之深情也所以盡萬物之理而爲之萬事之占也或曰易曰君子順天休命又曰自天祐之吉無不利其繫辭曰天垂象見吉凶聖人象之易之爲說一本扵天乎其兼扵人事乎曰止扵人事而己矣天不與也在諸否泰然則天地鬼神之理可以無乎曰有而不異也在諸謙知此然後知易矣泰之彖曰君子道長小人道消否之彖曰小人道長君子道消夫君子進小人不得不退小人進君子不得不退其勢然也君子盛而小人衰天下治扵泰矣小人盛而君子衰天下亂扵否矣否泰君子小人進退之間爾天何與焉問者曰君子小人所以進退者其不本扵天乎曰不也上下交而其志同故君子進以道上下不交而其志不通則小人進以巧此人事也天何與焉又曰泰之彖不云乎天地交而萬物通否之彖不云乎天地不交而萬物不通乎曰所以云者言天地也其曰上下之交不交者言人事也嗚呼聖人之扵易也其意深其言謹謙之彖曰天道虧盈而益謙地道變盈而流謙鬼神害盈而福謙人道惡盈而好謙聖人之扵事知之為知之不知為不知所以言出而萬世信也夫日中則呉之月缺則盈之天吾不知其心吾見其虧盈扵物者矣物之盛者變而衰落之下者順而流行之地吾不知其心吾見其變流扵物者矣貪滿者多損謙卑者多福鬼神吾不知其心吾見其禍福之被人者矣若人則可知其情者也故天地鬼神不可知其心而見其迹之在物者則据其迹曰虧盈曰變流曰害福若人則可知者故直言其情曰好惡故曰其意深而言謹也然㑹而通之天地神人無以異也使其不與扵人乎修吾人事而巳使其有與扵人乎與人之情無以異也亦脩吾人事而已夫專人事則天地鬼神之道廢叅焉則人事惑使人事脩則不廢天地鬼神之道者謙之彖詳矣治亂在人而天不與者否泰之彖詳矣推是而之焉易之道盡矣或問曰今之所謂繫辭者果非聖人之書乎曰是講師之傳謂之大傳其源葢出扵孔子而相傳扵易師也其来也逺其傳也多其間轉失而増加者不足恠也故有聖人之言焉有非聖人之言焉其曰易之興也其扵中古乎作易者其有憂患乎其文王與紂之事歟殷之末世周之盛徳歟若此者聖人之言也由之可以見易者也河出圖洛出書聖人幽賛神明而生蓍兩儀生四象若此者非聖人之言凡學之不通者惑此者也知此然後知易矣詩解統序蜀中詩本義有此九篇他本無之故附扵此五經之書世人號爲難通者易與春秋夫豈然乎經皆聖人之言固無難易繫人之所得有深淺今考于詩其難亦不讓二經然世人反不難而易之用是通者亦罕使其存心一則人人皆明而經無不通矣大抵謂詩為不足通者有三曰章句之書也曰淫繁之辭也曰猥細之記也若然孔子為泛儒矣非唯今人易而不習之考于先儒亦無幾人是果不足通歟唐韓文公最為知道之篤者然亦不過議其序之是否豈足明聖人本意乎易書禮樂春秋道所存也詩關此五者而明聖人之用焉習其道不知其用之與奪猶不辨其物之曲直而欲制其方圓是果扵其成乎故二南牽於聖賢國風惑扵先後豳居變風之末惑者溺扵私見而謂之兼上下二雅混扵小大而不明三頌昧扵商魯而無辨此一經大槩之體皆所未正者先儒旣無所取捨後人因不得其詳由是難易之說興焉毛鄭二學其說熾辭辯固巳廣博然不合于經者亦不爲少或失扵踈略或失扵謬妄葢詩載關雎上兼商世下及武成平桓之間君臣得失風一作土俗善惡之事闊廣邃邈有不失者鮮矣是亦可疑也予欲志鄭學之妄益毛氏踈略而不至者合之扵經故先明其統要十篇庻不爲之蕪泥云爾二南爲正風解天子諸侯當大治之世不得有風風之生天下無王矣故曰諸侯無正風然則周召可為正乎曰可與不可非聖人不能斷其疑當文王與紂之時可疑也二南之詩正變之間可疑也可疑之際天下雖惡紂而主文王然文王不得全有天下爾亦曰服事扵紂焉則二南之詩作扵事紂之時號令征伐不止扵受命之後爾豈所謂周室衰而關雎始作乎史氏之失也推而别之二十五篇之詩在商不得爲正在周不得爲變焉上無明天子號令由已出其可謂之正乎二南起王業文王正天下其可謂之變乎此不得不疑而輕其與奪也學詩者多推扵周而不辨扵商故正變不分焉以治亂本之二南之詩一有而字在商爲變而在周爲正乎或曰未諭曰推治亂而迹之當不誣矣周召分聖賢解聖人之治無異也一也統天下而言之有異焉者非聖人之治然矣由其民之所得有淺深焉文王之化出乎其心施乎其民豈異乎然孔子以周召為别者蓋上下不得兼而民之所化有淺深爾文王之心則一也無異也而說者以為由周召聖賢之異而分之何㢤大抵周南之民得之者深故因周公之治而繫之豈謂周公䏻行聖人之化乎召南之民得之者淺故因召公之治而繫之豈謂召公能行聖人之化乎殆不然矣或曰不繫扵雅頌何也曰謂其本諸侯之詩也又曰不統扵變風何也曰謂其周迹之始也列扵雅頌則終始之道混矣雜扵變風則文王之迹殆一作始矣雅頌焉不可混周迹之始其將略而不具乎聖人所以慮之也由是假周召而分焉非因周召聖賢之異而别其稱號爾葢民之得者深故其心厚心之感者厚故其詩切感之薄者亦猶其深故其心淺心之淺者故其詩略是以有異焉非聖人私扵天下而淺深厚薄殊矣二南之作當紂之中世而文王之𥘉是文王受命之前也世人多謂受命之前則太姒不得有后妃之號夬后妃之號非詩人之言先儒序之云爾考扵其詩惑扵其序是以異同之論争起而聖人之意不明矣王國風解六經之法所以法不法正不正由不法與不正然後聖人者出而六經之書作焉周之衰也始之以夷懿終之以平桓平桓而後不復支矣故書止文侯之命而不復録春秋起周平之年而治其事詩自黍離之什而降扵風絶扵文侯之命謂教令不足行也起扵周平之年謂正朔不足加也降扵黍離之什謂雅頌不足興也教令不行天下無王矣正朔不加禮樂徧出矣雅頌不興王者之迹息矣詩書貶其失春秋憫其微無異焉爾然則詩處扵衛後而不次扵二南惡其近扵正而不明也其體不加周姓而存王號嫌其混扵諸侯而無王也近正則貶之不著矣無王則絶之太遽矣不著云者周召二南至正之詩也次扵至正之詩是不得貶其微弱而無異二南之詩爾若然豈降之乎太遽云者春秋之法書王以加正月言王人雖微必尊扵上周室雖弱不絶其王苟絶而不與豈尊周乎故曰王號之存黜諸侯也次衛之下别正變也桓王而後雖欲其正風不可得也詩不降扵厲幽之年亦猶春秋之作不在恵公之世爾春秋之作傷典誥之絶也黍離之降憫雅頌之不復也幽平而後有如宣王者出則禮樂征伐不自一作在諸侯而雅頌未可知矣柰何推波助瀾縱風止燎乎十五國次解國風之號起周終豳皆有所次聖人豈徒云㢤而明詩者多泥扵䟽說而不通或者又以爲聖人之意不在扵先後之次是皆不足爲訓法者大抵國風之次以兩而合之分其次以爲比則賢善者著而醜惡者明矣或曰何如其謂之比乎曰周召以淺深比也衛王以世爵比也鄭齊以族氏比也魏唐以土地比也陳秦以祖裔比也鄶曹以美惡比也豳能終之以正故居末焉淺深云者周得之深故先扵召世爵云者衛爲紂都而紂不能有之周幽東遷無異是也加衛扵先明幽紂之惡同而不得近扵正焉姓族云者周法尊其同姓而異姓者爲後鄭先扵齊其理然也土地云者魏本舜地唐爲堯封以舜先堯明晉之亂非魏褊儉之等也祖裔云者陳不能興舜而襄公能大扵秦子孫之功陳不如矣一有聖字穆姜卜而遇艮之随乃引文言之辭以爲卦說夫穆姜始筮時去孔子之生尚十四年爾是文言先扵孔子而有乎不然左氏不爲誕妄也推此以迹其怪則季札觀樂之次明白可驗而不足爲疑矣夫黍離已下皆平王東遷桓王失信之詩是以列於國風言其不足正也借使周天子至甚無道則周之樂工敢以周王之詩降同諸侯乎是皆不近人情不可爲法者昔孔子大聖人其作春秋也旣微其辭然猶不公傳於人苐口受而已況一樂工而敢明白彰顯其君之惡㢤此又可驗孔子分定爲信也本其事而推之以著其妄庻不爲無據云定風雅頌解詩之息乆矣天子諸侯莫得而自正也古詩之作有天下焉有一國焉有神明焉觀天下而成者人不得而私也體一國而成者衆不得而違也㑹神明而成者物不得而欺也不私焉雅著矣不違焉風一矣不欺焉頌明矣然則風生扵文王而雅頌雜扵武王之間風之變自夷懿始雅之變自厲幽始覇者興變風息焉王道廢詩不作焉秦漢而後何其滅然也王通謂諸侯不貢詩天子不採風樂官不逹雅頌國史不明變非民之不作也詩出扵民之情性情性其䏻無㢤職詩者之罪也通之言其幾扵聖人之心矣或問成王周公之際風有變乎曰豳是矣幸而成王悟也不然則變而不能復乎豳之去雅一息焉葢周公之心也故能終之以正魯頌解或問諸侯無正風而魯有頌何也曰非頌也不得巳而名之也四篇之體不免變風之例爾何頌乎頌惟一章而魯頌章句不等頌無頌字之號而今四篇皆有其序曰季孫行父請命于周而史克作之亦未離乎強也頌之本一人是之未可作焉訪扵衆人衆人可之猶曰天下有非之者又訪扵天下天下之人亦曰可然後作之無疑矣僖公之政國人猶未全其恵而春秋之貶尚不能逃未知其頌何從而興乎頌之美者不過文武文武之頌非當其存而作者也皆追述也僖公之徳孰與文武而曰有頌乎先儒謂名生於不足冝矣然聖人所以列爲頌者其說有二貶魯之強一也勸諸侯之不及二也請扵天子其非強乎特取扵魯其非勸乎或曰何謂勸曰僖公之善不過復土宇修宫室大牧養之法爾聖人猶不敢遺之使當時諸侯有過扵僖公之善者聖人忍絶去而不存之乎故曰勸爾而鄭氏謂之僃三頌何㢤大抵不列扵風而與其爲者所謂憫周之失貶魯之強是矣豈鄭氏之云乎商頌解古詩三百始終於周而仲尼兼以商頌豈多記而廣録者㢤聖人之意存一頌而有三益大商祖之徳其益一也予紂之不憾其益二也明武王周公之心其益三也曷謂大商祖之徳曰頌具矣曷謂予紂之不憾曰憫廢矣曷謂明武王周公之心曰存商矣按周本紀稱武王伐紂下車而封武庚扵宋以爲商後及武庚叛周公又以微子繼之是聖人之意雖惡紂之暴而不忘湯之徳故始終不絶其爲後焉或曰商頌之存豈異是乎曰其然也而人莫之知矣三字一作知之非仲尼武王周公之心殆而成湯之徳微毒紂之惡有不得其著矣向所謂存一頌而有三益焉者豈妄云㢤十月之交解小雅無厲王之詩著其惡之甚也而鄭氏自十月之交已下分其篇以爲當刺厲王又妄指毛公爲詁訓時移其篇第因引前後之詩以爲據其說有三一曰節刺師尹不平此不當譏皇父擅恣予謂非大亂之世者必不容二人之專不然李斯趙髙不同生扵秦也其二曰正月惡褒姒滅周此不當疾艷妻之說出於鄭氏非史傳所聞況褒姒之惡天下萬世皆同疾而共醜者二篇譏之殆豈過㢤其三曰幽王時司徒乃鄭桓公友此不當云番惟司徒予謂史記所載鄭桓公在幽王八年方爲司徒爾豈止桓公哉是三說皆不合於經不可按法爲鄭氏者獨一作又不能自信而欲指他人之非斯亦惑矣今考雨無正巳下三篇之詩又其亂說歸向皆無刺厲王之文不知鄭氏之說何從而爲據也孟子曰說詩者不以文害辭不以辭害意非如是其能通詩乎外集卷第十按公墓誌等皆云詩本義十四卷江浙閩本亦然仍以詩圖總序詩譜𥙷亡附卷末惟蜀本増詩解統序幷詩解凡九篇共為一卷又移詩圖總序詩譜𥙷亡自爲一卷總十六卷故綿州扵集本収此九篇它本則無之今附此卷中石鷁論獨經一作經獨辨左氏人事也一作乎瞽瞍一作史易或問文海作荅問卦爻彖象於泰於否文海作而泰而否二南爲正風解可與不可與一作亦定風雅頌解滅然滅字疑十月之交解亂說歸向疑奏議卷第十歐陽文忠公集一百六諌院論大臣不可親小事劄子慶暦三年臣伏見兵興累年天下多故樞宻之職事任非輕雖典兵戎體均一作同宰輔至於大小機務其繁文倍於中書所以國家舊制都副承㫖皆用士人位比屬僚事參謀議祖宗之制一作世尤慎擇材或取其歷職詳練者以為副使自承平以来綱紀墮廢惟用人吏備貟而已當四方無事之時兩府檢例行事上下尸曠恬然不恠自兵戎既動中外事繁猶務因循致多敗誤今承㫖不親職事惟署文書凡百行遣皆委諸房小吏使副大臣不免親臨細事既不得精心思慮專意廟謀至於碎務繁多又不能躬自檢察遂使邊防急奏多苦滯留軍國宻謀動成漏洩凡關事體不便處多皆由樞臣難自躬親而承㫖不能舉職也臣今欲乞依祖宗舊制承㫖特用士人如武臣中難得其人即請於文官中精選材能換與合入官資責其舉職仍令樞宻使副條列常行事目有可以分職責成者悉以委之使大臣專意廟謀屬吏分行職事時叅國論一作論議庶有禆𥙷一作助既復朝廷之舊制又於事體而合冝伏望聖慈特賜裁擇取進止論中書増官屬主文書劄子同前臣伏見近来朝廷號令煩數更改又頻降出四方多不遵禀而朝廷之臣無專主者亦不勾校稽違考責實効以不銳之意行不信之言冝乎空文雖多而下不畏聽今百職廢壊弊實由斯臣竊見漢丞相官屬甚多欲乞精選材臣采漢名號増置兩府官屬官一二員使專掌政令之出者置簿拘管俟天下施行報應校其稽違舉行朝典即不得以承受回申便為報應湏是施行實迹具以條聞旋行勾銷以見能否臣謂苟設此官則天下知朝廷有責實之意今後可使令出必行官無曠職如允臣所請一作奏乞下兩府重議施行取進止論班行未有舉薦之法劄子同前臣伏見朝廷選任百官文武叅用文官在選者各以舉主遷京朝官其間雖容時有濫冐然孤寒有才行之人亦往往獲進惟有武官中近下班行並無賢愚分别一例以年歳遞遷自借職得至供奉官湏是三十餘年使賢愚同滯而國家緩急要人使用無由知其能否或要人使則臨時只看脚色點差多是不副所選臣謂班行入仕之人雖多端然其中亦極有才能可任用者但國家舉選之法全未精博臣欲乞將近下班行比類選人别立舉官之法凡無人舉者官有所止更不例遷有舉主者一作舉主足者方與遷轉或且令無舉主者依舊年限遷轉將有舉主者别作任使仍􆂌嚴為約束重其連坐之法使舉者不容冐濫則才與不才漸可分别而用人不濫況今四方多事天下都監廵檢監當之類盡要得人方能一作可集事不必邊任并閤職方用舉薦其他要切使喚處多如允臣所請乞付樞宻院商量立定法制頒行取進止論乞放還蕃官胡繼諤劄子同前臣竊見朝廷前歳以延州蕃官胡繼諤因為邊臣所疑移入内地見任亳州都監以子守清悉領父之諸部風聞近為不服一作安亳州水土死一無死字亡却家族身又疾病曽有奏陳乞移一京西地涼之處臣謂方今西鄙用兵之際朝廷冝廣推恩信撫御蕃夷既欲守清盡死於邊疆當厚遇繼諤保全其家族豈有既任其子又疑其父繼諤求一作來遷内地其實異郷雖曰居官乃是囚繫致其失所身病家亡況彼初心又無顯過在繼諤之身巳有幽囚冤枉之嘆於守清之分又失駕馭豪傑之方萬一繼諤疾病死而不歸守清父子之心豈得無恨反視中國乃為世讎必與邊陲别生患害其餘部族亦必離心國家自用兵以来几有計謀未聞勝筭尤於招撫蕃夷之術常失㤙威致使離叛者多皆願附賊在於繼諤處置特乖臣欲乞因其有請召至京師與雪前疑厚加禮遇放還本族示以推誠守清得父子復完必思盡節繼諤感國家之遇必有所施若朝廷猶以為疑即乞先以此意詔問守清計其必無弃父之理若彼自不欲其歸則他日可無後患取進止繳進王伯起上書狀同前右臣今月二十五日出外至夜歸家有相州進士王伯起看臣不見後留下長書一封中言為檢匣抑塞言事者責臣不能規諌人主開益聦明及自言有䇿可以弱北虜使十年不為害又言有上皇帝書為有司所抑不得上逹仍於長書後卷却奏狀一封意欲令臣繳奏臣竊詳王伯起所與臣書詞理極有可採但未知奏狀内所言何事縁臣本不識其人又無處尋訪只據所與臣書内言有䇿可使北虜十年不為害此一事是朝廷當今急務其奏狀臣不敢滯留謹并元與臣書繳連上進伏望聖慈特賜省覽或有可採乞下開封府尋訪本人更加詢問謹具狀奏聞論大理寺斷冤獄不當劄子同前臣風聞大理寺近奏斷徳州公案一道為一班行王守度謀殺妻事止斷杖六十私罪其守度所犯情理極惡本因踰濫欲誘一求食婦人為妻自持刄杖恐逼正妻阿馬令其誣以姦事髠截頭髪又自以一作將繩索付與阿馬守度持刀在旁逼令自縊其命垂盡只為未有棺器却且解下其後又與繩索令自縊阿馬偶得生逃臣略聞此大㮣其他守度兇惡之狀備於案牘人不忍聞阿馬幽苦冤枉一作之冤如此而法吏止斷誣姦降以杖罪竊以刑在禁惡法本原情今阿馬之冤於情可憫守度所犯其惡難容若以法家斷罪舉重而論則守度誣姦不實之罪輕迫人以死之情重原其用意合從謀殺凡謀殺之罪其類甚多或有兩相爭恨理直之人因發忿心殺害理曲之人者死與未死湏𬒳謀殺之刑豈比守度曲在自身阿馬本無所爭備極陵辱迫以自裁一作殘虐害之情深於謀殺逺矣臣甞伏讀真宗皇帝賜諌臣之詔曰冤枉未申賞刑踰度者皆許論列今之冤婦臣職當言者也豈有聖主在上國法方行而令強暴之男而敢逼人以死臣恐守度不誅則自今強者陵弱踈者害親國法遂隳人倫敗矣其王守度一宗公案伏望聖慈特令中書細詳情理果如臣之所聞即乞行刑法以止姦凶取進止論内臣馮承用與外任事劄子同前臣伏見内官馮承用近因過失為臣寮論奏二作奏劾陛下親發睿斷不私小人聽納群言逐去左右中外之士莫不相慶然𥘉聞朝議將與外任至今多日木見指揮近日外靣虚傳云却得教㘦勾當留在京師竊以方今内外臣寮若有罪犯便湏勘劾依法行遣今承用本因有過超轉官資只與外任尚爲優幸若更遲留不遣則使今後伏事陛下左右者恣爲過惡無以戒勸承用從来過犯甚衆人皆畏懼不敢明言自其罷却入内已来舊跡漸一作甚多彰露内廷之事臣不細知外邊作過頗有實狀今若未行逺黜則言事臣寮不免再有論奏勾連獄訟生事轉多其馮承用伏乞早與一外任閑慢差遣便令出京可以戒勵後人外弭物論取進止奏議卷第十奏議卷第十一歐陽文忠公集一百七河北轉運論臺官上言按察使狀慶曆四年八月新除河北轉運按察使未行右臣伏覩近降朝㫖約束諸路按察使備載臺官所上之言意謂按察使等所奏之人多不實或因迎送文移之間有所闕失挾其私怒枉奏平人朝廷都不深思輕信其說臣自聞降此約束日夕憂嗟竊思國家方此多事難了之時正是責人展効之際獎之猶恐不竭力疑之誰肯盡其心昨大選諸路按察之際兩府聚㕔數日盡破常例不次用人中外翕然皆謂一時之極選凡一有彼字𬒳選之者皆亦各負才業乆無人知常患無所施爲一旦忽蒙擢用各思宣力爭奮所長不惟欲報朝廷豈一作寧不更希進用豈可頓爲欺罔便徇私情料其心必未至此苟或如臺官所說則是兩府聚㕔數日選得不公之人其或不至如斯何必更加約束竊以任人之術自古所難常能力主張猶或有沮者何况更一作過生疑異使其各自心䦨如此用人安能集事况按察之任人所難能或大臣薦引之人或權勢僥倖之子彼按察使者下當怨怒上忤權勢而不敢避者只頼朝廷主張而已今按察者所奏則未能施一作與行沮毀者一言則便加輕信皆由朝廷未知官吏爲州縣大患而按察可以利民委任之意不堅故毀謗之言易入也所可惜者自差諸路按察今雖未有大効而老病昬昧之人望風知懼近日致仕者漸一作甚多州縣方欲澄清而朝廷自沮其事臣欲乞聖慈令兩府召臺官上言者至中書問其何路按察之一作何人因挾私怒苟有迹狀乞下所司辨明若實無人乃是妄說其近降劄子乞賜抽還不使四方見朝廷自沮按察之權而爲貪贓老繆之吏所快謹具狀奏聞伏候勑旨論兩制以上罷舉轉運使副省府推判官等狀慶曆五年誤寘于此右臣近準御史臺牒爲臣寮上言待制以上舉省府推判官轉運使副等事奉聖㫖去年勑命更不行用令臣知委者臣竊詳臣寮上言悉渉虚妄蓋因近日陛下進退大臣改更庻事小人希合欺罔天聦臣試請辨之據上言者云若令兩制以上保舉則下長犇競之路方今上自朝廷下至州縣保舉之法多矣只如臺官亦是兩制以上舉以至大理詳斷審刑詳議刑部詳覆等官三路知州知縣通判選人改京官學官入國學班行遷閤職武臣充將領選人入縣令下至天下茶鹽埸務榷埸及課利多處酒務凡要切差遣無大小盡用保舉之法皆不聞以犇競而廢之豈可獨於省府等官獨一作偏長犇競而可廢此其欺妄可知也上言者又云遂令端士並起馳騖且馳騖盡係一作自是小人豈名端士至如自來舉官之法多矣豈能盡絶小人干求況自頒新勑以来何人舊是端士頓然改節馳騖於何門而得舉乞賜推究姓名若果無之則見其欺妄可知也上言者又云不因請託人莫肯言此又厚誣之甚也今内外臣寮無大小曽受人舉者十八九豈可盡因請託而得自兩府大臣而下至外處通判以上人人各曽舉官豈可盡因請託而舉若云其它舉官不請託只此勑舉官湏請託即非臣所知也今兩制之中好人不少繁難一作重要害之地皆巳委信任用二字一作而任之豈可不如外郡通判等不堪委任舉官況兩制之臣除此勑外亦更别許舉官豈可舉他官則盡公惟此勑則頓一作徒徇私請此其欺妄可知也又云毎歳舉一百五十人致人多而争差遣臣筭一人有三人舉主方敢望差遣一百五十人湏一歳内有四百五十員兩制爲舉主今兩制不及五十人使人人歳舉三人即纔各是一人舉主豈敢便争差遣況有不曽舉人者或舉不及三人者乞賜檢㑹去年終兩制以上舉到人數便可知其恣情欺妄也近日改更政令甚多惟此一事尤易辨明故臣不避煩言而辨者伏冀陛下因此深悟小人希合而欺妄也縁自去年陛下用范仲淹冨弼在兩府值累年盗賊頻起天下官吏多不得力因此屢建舉官之議然亦不是自出意見皆先檢祖宗故事請陛下擇而行之所以元降勑文首引國書爲言是也當時臣寮並不論議近因仲淹等出外與朝廷經畫邊事讒嫉之人幸其不在左右百端攻擊只此事朝廷不暇審察便與施行臣昨見冨弼自至河北縁山傍海經畫勤勞河北人皆云自來未有大臣如此其經畫所得事亦不少歸至國門臨入而黜使河北官吏軍民見其盡忠而不知其罪狀小人貪務希合又不爲朝廷惜事體凡事攻擊至今未巳況朝廷用人屢有進退豈有一人纔出便不問是非盡改所行之事若大臣一度進退政令一度改更如此紛紜豈有定制伏望陛下重一作審察愛憎之私辨其虚實之說凡於政令更慎改張臣檢詳元降舉官勑意亦一作本是於國書檢用祖宗所行之法今上言者却云因諌官論列致差遣不定而有更張事渉臣身不敢自辨然臣在諌署日言事無狀致今來臣寮指以爲辭豈可尚冐寵榮不能自劾請從黜罰以弭人言臣伏見陛下聖徳仁慈保全忠正之士進退之際各有恩意此所以能使忠臣義士忘身報國至死而不已也其今後臣寮希附上言攻擊前兩府所行之事乞賜辨明擇其實有不便者方與改更庻全大體則天下幸甚也臣伏覩去年八月二日元降勑命節文云比於國書擇一作撮諸治要見其官人之際尤慎外臺之選又云然其進任必屬近臣又命告示賞罰之命皆三朝之攸行此是元議舉官因依乞賜詳酌臣無任激切祈天待罪之至論劉三嘏事狀慶暦四年臣伏見契丹宣徽使劉三嘏挈其愛妾兒女等七口向化南歸見在廣信軍聽候朝㫖竊慮朝廷只依常式投來人等依例約囬不納國家大患無如契丹自四五十年來智士謀臣晝思夜筭未能爲朝廷出一竒䇿坐而制之今天與吾時使其上下乖離而親貴臣忽來歸我此乃陛下威徳所加祖宗社稷之福竊慮憂國之臣過有思慮以謂納之别恐引惹臣請略陳納之却之二端利害伏望聖慈裁擇其可徃年山遇捨元昊而歸朝邊臣爲國家存信拒而遣之元昊甘心山遇盡誅其族由是河西之人皆怒朝廷不納而痛山遇以忠而赤族吾旣自絶西人歸化之路堅其事賊之心然本欲存信以懷元昊而終至叛逆㡬困天下是拒而不納未足存信而反與賊堅人心此已驗之効也其後朝廷悟其失計歸罪郭勸悔巳難追矣此事不逺可爲鑒戒伏望陛下思之此不可拒而可納一也三嘏是契丹貴臣秉節鉞兼宣徽可謂至親且貴矣一旦君臣離心走而歸我是彼國中大醜之事必湏掩諱不欲人聞必不敢明言求之於我此其可納二也況彼來投又無追者相繼旣絶蹤跡别無明驗雖欲索之於我難以爲辭此其可納三也三嘏旣彼之貴臣彼國之事無不與知今旣南來則彼之動静虚實我盡知之可使契丹日夕懼我攻取之不暇安敢求索於我自起兵端若使契丹疑三嘏果在中國則三四十年之間卒無南向之患此又納之大利其可納四也彼旣窮來歸我若拒而遣之使其受山遇之禍則幽燕之間四五十年來心欲南向之人盡絶其歸路而堅其事狄之心思爲三嘏報仇於中國又終不能固契丹之信此爲誤計其失尤多且三嘏在中國則契丹必盡疑幽燕之人是其半國離心常恐向背凡契丹南冠常藉幽燕使其盡疑幽燕之人則可無南寇之患此又可納大利五也古語曰天與不取反受其咎此不可失之㡬也其劉三嘏伏望速降宻㫖與冨弼令就近安存津遣赴闕惟乞決於睿斷不惑群言取進止論杜衍范仲淹等罷政事狀一作上皇帝辨杜韓范冨書慶暦五年臣聞士不忘身不爲忠言不逆耳不爲諌故臣不避群邪切齒之禍敢干一作冐一人難犯之顔惟頼聖明一作慈幸加省察臣伏見杜衍韓琦范仲淹冨弼等皆是陛下素所委任之臣一旦相繼罷黜一作而罷天下之士皆素知其可用之賢而不聞其可罷之罪臣雖供職一作臣職雖在外事不盡一作審知然臣竊見自古小人讒害忠賢其說一作識不逺欲廣䧟良善則不過指爲朋黨欲動揺大臣則必湏誣以專權其故何也夫去一善人而衆善人尚在則未爲小人之利欲盡去之則善人少過難爲一二求瑕惟有指以爲朋一作惟指以爲朋黨則可一時盡逐至如大臣巳𬒳知遇而蒙信任一有者字則難難字一作不可以他事動揺惟有專權是上一作人主之所惡故湏此說方可傾之臣料衍等四人各無大過而一時盡逐弼與仲淹委任尤深而忽遭離間必有以朋黨專權之說上惑聖聦一有者字臣請試辨辨字一作詳言之昔年仲淹𥘉以忠言讜論聞於中外天下賢士争相稱慕當時姦臣誣作朋黨猶難辨明自近日陛下櫂此數人並在兩府察其臨事可以辨而明也蓋衍爲人清愼而謹守規矩仲淹則恢廓自信而不疑琦則純正而質直弼則明敏而果銳四人爲性旣各不同雖皆歸於盡忠而其所見各異故於議事多不相從至如杜衍欲深罪滕宗諒仲淹則力爭而寛之仲淹謂契丹必攻河東請急脩邊備冨弼料以九事力言契丹必不來至如尹洙亦號仲淹之黨及爭水洛城事韓琦則是尹洙而非劉滬仲淹則是劉滬而非尹洙此數事尤彰著陛下素已知者此四人者可謂天下至公四字一作公正之賢也平日閑居則相稱羙之不暇爲國議事則公言廷諍而不一作無私以此而言臣見衍等真得漢史所謂忠臣有不和之節而小人讒爲朋黨可謂誣矣臣聞有國之權誠非臣下之得專也然一無此字臣竊思仲淹等自入兩府巳一作以來不見其專權之迹而但見其善避權也權者二字一作夫權得名位則可行故好一作行權之臣必貪一有名字位自陛下召琦與仲淹於陜西琦等讓至五六陛下亦五六召之三有至如二字冨弼三命學士兩命樞宻副使毎一命皆再三懇讓讓者愈切陛下用之愈堅皆再至愈堅十五字一作未甞不懇讓懇讓之者愈切而陛下用之愈堅此天下之人所共知臣一有但字見其避讓大繁不見其好一作專權貪位也及陛下堅不許辭方敢受命然猶未敢别有所爲陛下見其皆未作一作行事六字一作飲其作事乃特一無此字開天章召而賜坐受一作授以紙筆使其條事一作列然衆人避讓不敢下筆弼等亦不敢獨有所述因此又煩聖慈特出手詔指定姓名專責弼等一字一作其條列大事而施行二字一作行之弼等遲囬又近二字一作近反一月方敢略條數事然一無此字仲淹深一作老練世事必知凢百難猛一作凢事難遽更張故其所陳志在逺大而多若迂緩但欲漸而行之以乆冀皆有効弼性雖銳然亦一無此字不敢自出意見但多一無此字舉祖宗故事請陛下擇而行之自古君臣相得一言道合遇事便行臣方恠弼等蒙陛下如此堅意委任遇事至委任十八字一作遇事而近更無推避弼等蒙陛下堅意委任督責丁寧而猶遅緩自疑作事不果然小人巧譛巳一作而曰專權者豈不誣哉至如兩路宣撫聖一作國朝常一作累遣大臣况自中國之威近年不振故元昊叛逆一方而勞困及於天下北虜乗釁違盟而動其書辭侮慢至有貴國二字一作責祖宗之言陛下憤恥雖深但以邊防無備未可與爭屈志一作意買和莫大之辱弼等見中國累年侵凌之患感陛下不次進用之恩故各自請行力思雪國家之前耻八字一作力思雪耻沿一作縁山傍海不憚勤勞欲使武備再脩國威復振臣見弼等用心本欲尊陛下威權以禦四夷未見其侵權而作過也伏惟陛下睿哲聦明有知人之聖臣下能否洞見不遺故於千官百辟之中特一作親選得此數人驟加擢用夫正士在朝羣邪所忌謀臣不用敵國之福也今此數人一旦罷去而使羣邪相賀於一作于内四夷相賀於一作于外此臣所一有以字爲陛下惜之一無此字也伏惟陛下聖徳仁慈保全忠善退去之際恩禮各優今仲淹四路之任亦不輕矣惟一無此字願陛下拒絶羣謗委任一作信不疑使盡其所爲猶有禆補方今西北二虜交爭未巳正是天與陛下經營之時如弼與琦豈可置之閑處伏望陛下一無此二字早辨讒巧特加圖任則不勝幸甚臣自前歲召入諌院十月之内七受聖恩而致身兩制方一作常思君一作榮寵至深未知報効之所今群邪爭進讒巧一有而字正士繼去朝廷乃臣忘身報國之秋一作時豈可緘言而避罪敢竭愚瞽惟陛下擇之臣無任祈天待罪懇激屏營之至臣脩昧死再拜右正文乃今盰台守施宿所藏當時真本也一作疑是後來公所改定如以水落為洛之類及其餘文意皆不若一作爲長至如貴國二字注一作責盖用綿本及李燾長編今真蹟元用貴國按慶曆二年契丹求關南書云貴國祖先肇創基業尋與敝境繼為善鄰暨乎太宗紹登寳位於有征之地才定并汾以無名之師直抵燕薊仁宗命王拱辰草答書云太宗皇帝親駕并郊匪圖燕壤當時貴國亟發援兵既交石嶺之鋒遂舉薊門之役則是貴國二字彼此用之公此奏後改為責耳居士集卷第十歐陽文忠公集十律詩六十首送王汲宰藍田喧喧動車馬共出古都門落日催行客東風吹酒罇樹揺秦甸緑花入輞川繁若遇西來旅時應問一作望故園徽安門曉望都門收宿霧佳氣鬱葱葱曉日寒川上青山白霧一作露中樓臺萬瓦合車馬九衢通恨乏登髙賦徒知京邑雄送孟都官知蜀州名郎出粉闈佳郡古關西㡬驛秦亭盡千山蜀鳥啼朱輪照耕野緑芋覆秋畦向闕應東望雲深隴樹迷南征回京至界上驛先呈城中諸友朝雲來少室日暮向箕山本以無心出寧隨倦客還春歸伊水緑花晚洛橋閑誰有餘罇酒相期一解顔逸老亭一本注彭城公白蓮庄上相此忘榮怡然物外情池光開小幌山翠入重城野鳥窺華衮春壷勞耦耕枕前雙鴈没雨外一川晴解組金龜重調琴赤鯉驚雖懷安石趣豈不爲一作念蒼生廣愛寺都人布金地紺宇巋然存山氣蒸經閣鍾聲出國門老杉春自緑古壁雨先昬應有幽人屐來留石蘚痕弔黃學士三首名鑑麗正讎書乆蘭臺約史成迎親就江水厭直出承明世德無雙譽詩豪第一評風流今頓盡響像憶平生沈約多清瘦文園仍病痟共疑天上召更欲水邊招金馬人相弔長沙物易妖秋風吹越樹歸旐自飄飄自古蘭衰早因令蕙歎深書遺茂陵藁病作越郷吟蒿里無春色閩山蔽夕隂空嗟埋玉樹齎志永沉沉雨後獨行洛北北闕望南山明嵐雜紫煙歸雲向嵩嶺殘雨過伊川樹繞芳隄外橋橫落照前依依半荒苑行處獨聞蟬陪府中諸官遊城南一本注西京作一雨郊圻迥新秋榆棗繁田荒溪溜入禾熟雀聲喧燒出空槎腹人耕廢廟垣閑追向城客落日隱髙原智蟾上人遊南岳終日念雲壑南歸心浩然青山入楚路白水望湖田野渡惟浮鉢山家少施錢到時春尚早收茗緑巖前送左殿丞一作直入蜀傳聞蜀道難行客若登天紫竹深無路黃花忽見川聞禽嗟異域問俗訪耆年欲識京都遠惟應望日邊秋郊曉行一作望寒郊桑柘稀秋色曉依依野燒侵河斷山鴉向日飛行歌採樵去荷鍤刈一作治田歸􅐕一作村酒家家熟相邀白竹扉𬒳牒行縣因書所見呈寮友周禮恤凶荒軺車出四方土龍朝祀雨田火夜驅蝗木落孤村迥原髙百草黃亂鵶鳴古堞寒雀聚空倉桑野人行饁魚陂鳥下梁晚煙茅店月𥘉日棗林霜墐戸催寒候叢祠禱歳穰不妨行覽物山水正蒼茫緱氏縣作亭候徹郊畿人家嶺坂西青山臨古縣緑竹繞寒溪道上行收穗桑間晚漑畦東臯有深趣便擬卜幽棲又行次作秋色滿郊原人行禾黍間雉飛橫斷澗燒響入空山野水蒼煙起平林夕鳥還嵩嵐乆不見寒碧更孱顔送梅秀才歸宣城從學方年少還家罄橐金乆爲江北客能作洛生吟罷亞霜前稻鉤輈竹上禽歸帆何處落應拂野梅林鞏縣陪祭獻懿二后回孝義橋道中作落日漢陵道𥘉寒慘暮飊遥看山口火暗渡洛川橋不見新園樹空聞引葬簫林鵶棲已定猶一作獨此倦征鑣送謝學士歸闕供帳拂朝煙征鞍去莫攀人醒風外酒馬度雪中關舊府誰同在新年獨未還遥應行路者偏識綵衣斑河南王尉西齋寒齋日蕭索天外敞簷楹竹雪晴猶覆山䆫夜自明禽歸窺野客雲去入重城欲就陶濳飲應須載酒行張主簿東齋官舍掩寒扉聊同隱者棲溪流穿竹過一作逈山鳥入城啼賔主髙談勝心㝠外物齊惟應朝枕夢長猒隔隣一作林雞留守相公禱雨九龍祠應時獲澍呈府中同寮古木鬱沉沉祠亭相衮臨雷驅山外響雲結日邊隂霡霂來𥘉合依微勢稍深土膏濳動脉野氣欲成霖隴上連雲色田間擊壤音明光應奏瑞黃屋正焦心帝邑三川美離宫萬瓦森廢溝鳴故苑紅蘤發青林南畒猶須勸餘春尚可尋應容後車一作車後客時作洛生吟春日獨遊上林院後亭見櫻桃花奉寄希深聖俞仍酬遞中見寄之什昔日尋春地今來感歳華人行巳荒徑花發半枯槎髙榭林端出殘陽水外斜聊持一罇酒徙倚憶天涯獨至香山憶謝學士一作希深伊水弄春沙山臨水上斜曽爲謝公客徧一作偏入梵王家隂澗𥘉生草春嵓自落花却尋題石處歳月巳堪嗟春晚同應之偶至普明寺小飲作偶來林下逕共酌竹間亭積雨添方一作芳沼殘花點緑萍野隂侵席潤芳氣襲人醒禽鳥休驚顧都忘兀爾形黃河八韻寄呈聖俞河水激箭險誰言航葦遊堅冰馳馬渡伏浪卷沙流樹落新摧岸湍驚忽改洲鑿龍時退鯉漲潦不分牛萬里通槎漢千帆下漕舟怨歌今罷築故道失難求灘急風逾響川寒霧不收詎能窮禹迹空欲問張侯和應之同年兄秋日雨中登廣愛寺閣寄梅聖俞經年都洛與君交共許詩中思最豪舊社更誰能擁鼻新秋有客獨登髙徑蘭欲謝悲零露籬菊空開乏凍醪縱使河陽花滿縣亦應留滯感潘毛晚過水北寒川消積雪凍浦漸通流日暮人歸盡沙禽上釣舟罷官西京回寄河南張主簿歸客下三川孤郵暫解鞍鳥聲催暮急山氣欲晴寒已作愁霖詠猶懷祖帳歡更聞溪溜響疑是石樓灘寄西京張法曹幕府三年客羣居㡬日親𥘉分闕一作關口路猶見洛陽人壠麥晴將秀田花晚自春向家行漸近豈復倦征輪離彭婆值雨投臨汝驛回寄張九屯田司録投館野花邊羸驂晚不前山橋斷行路溪雨漲春田樹冷無棲鳥村深起暮煙洛陽山巳盡休更望伊川朱家曲一本有并引字朱家曲自許縣北門上赤坂岡分道西行入小路三十里有村市臨古河商賈之販京師者舟車皆㑹此居民繁雜宛然如江郷予以事偶至此宿旅邸明日遂赴京師行人傍衰柳路向古河窮桑柘田疇美漁商市井通薪歌晚入浦舟子夜乘風旅舍孤煙外天京王氣中山川許國近風俗楚郷同宿客雞鳴起驅車猶更東行至椹澗作霜後葉𥘉鳴羸驂遶澗行川原人遠近禾黍日晴明病質驚殘歳歸塗猒一作壓暮程空林聚寒雀疑巳作春聲送謝希深學士北使漢使入幽燕風煙兩國間山河持節遠亭障出疆閑征馬聞笳躍雕弓向月彎禦寒低便面贈客解刀環鼓角雲中壘牛羊雪外山穹廬鳴朔吹凍酒發一作啓朱顔塞草生侵磧春榆緑滿關應須鴈北嚮方值使南還送賈推官赴絳州白雲汾水上人北鴈南飛行李山川遠風霜草木腓郡齋賔榻掛幕府羽書稀最有題輿客偏思玉麈揮送張如京知安肅軍相逢舊從事新命忽臨戎界上山河壯軍中鼓角雄朔風馳駿馬塞雪射驚鴻試取封侯印何如筆硯功送威勝軍張判官北地不知春惟看榆葉新岑牟多武士玉麈重嘉賔野燐一作燒驚行客烽煙入遠一作暮塵繫書沙上鴈時寄日邊人送同年史襃之武功尉乆作遊邊客常悲入塞笳今茲一尉遠猶困折腰嗟白馬關中道青天一作煙棧外家過秦應弔古惟有故山斜送祝熈載之東陽主簿呉江通海浦畫舸候潮歸疊鼓山間響髙帆鳥外飛孤城秋枕水千室夜鳴機試問還家客遼東今是非鄭十一先輩赴四明幕一本注初授洋川辭不行梁漢襃斜險夫君畏遠遊家臨越山下帆入海潮頭岸柳行稍盡江蓴歸漸秋故郷看衣錦寧羡李膺舟送丁元珍峽州判官一作送未處仁爲客乆南方西游更異郷江通蜀國遠山閉楚祠荒油幕無軍事清猿斷客腸惟應陪主諾不費日飛觴送楚建中潁州法曹冠蓋盛西京當年相府榮曽陪鹿鳴宴徧一作偏識洛陽生共歎長沙讁空存許劭評堪嗟桃李樹何日見隂成送王尚恭隰州幕去國𥘉游宦從軍苦寂寥愁雲帶一作傍城起畫角向山飄秋勁方馳馬春寒正襲貂遥知爲客恨應頼酒盃消送王尚喆三原尉初仕便西轅驪駒兩佩環山河識天府風雨度函關桑柘千疇富人煙萬井閑欲爲京洛詠應苦簿書間送餘姚陳寺丞最銅墨佩腰間中流望若一作似仙鳴蟬汴河柳畫鷁越郷船下瀬逢江鴈瞻氛落海鳶山川仍客思盡入隱侯篇送廖八下第歸衡山曽作關中客甞窺百二疆自言秦隴一作嶺水能斷楚人腸失意倦京國羇愁成鬢霜何如伴征鴈日日向衡陽夏侯彦濟武陟尉風煙地接懷井邑冨田垓河近聞氷坼山髙見雨來官閑同小隱酒美足衘盃好去東籬菊迎霜正欲開遠山山色無遠近看山終日行峯巒隨處改行客不知名宋宣獻公挽詞三首望繫朝廷重文推天下工清名畏楊綰故事問胡公物議垂爲相風流頓已窮仁言博哉利獻替有遺忠識度推明哲風猷藹縉紳何言止中壽遂不秉洪鈞翰墨時爭寳詞章晚愈新哭哀文伯母悲感路傍人結髪一作綬逢明主馳聲著兩朝奠楹先有夢升屋豈能招贈服三公衮兼榮七葉貂春風笳鼓咽松栢助蕭蕭𥘉出真州泛大江作孤舟日日去無窮行色蒼茫杳靄中山浦轉帆迷向背夜江看斗辨西東滮田漸下雲間鴈霜日𥘉丹水上楓蓴菜鱸魚方有味遠來猶喜及秋風江行贈鴈雲間征鴈水間棲矰繳方多羽翼微歳晚江湖同是客莫辭伴我更南飛松門巳下五首一本屬夷陵九詠島嶼松門數里長懸崖對起碧峯雙可憐勝境一作景當窮塞飜使留一作流人戀此邦亂石驚灘喧醉枕淺沙明月入船䆫因遊始覺南來遠行盡荆江見蜀江下牢津依依下牢口古戍鬱嵯峨入峽江漸曲轉灘山更多白沙飛白鳥青障一而嶂合青蘿遷客𥘉一作甞一作多經此愁詞作楚歌龍溪潺潺出亂峯演漾緑蘿風淺瀬寒難渉危槎路不通朝雲起潭側飛雨徧江中更欲尋源去一作上山深不可窮勞停驛孤舟轉山曲豁爾見平川樹杪帆𥘉落峯頭月正圓荒煙㡬家聚瘦野一刀田行客愁明發驚灘鳥道前黃溪夜泊楚人自古登臨恨暫到愁腸已九回萬樹蒼煙三峡暗滿川明月一猿哀非郷況復驚殘歳慰客偏冝把酒盃行見江山一作山河且吟詠不因遷謫豈能來望州坡聞說夷陵人爲愁共言遷客不堪遊﨑嶇㡬日山行倦却喜坡頭見峽州居士集卷第十熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正逸老亭雨外一作後弔黃學士越郷一作山𬒳牒行縣呈寮友一作呈諸寮友行次作寒碧一作凝碧東齋賔主一作至黃河馳馬一作無馬和應之登廣愛寺閣經年一作終年江行贈鴈征鴈一作秋鴈書簡卷第十歐陽文忠公集一百五十三與十四弟煥字大明皇祐二年某啓仕宦多故乆不附書冬寒計與諸眷安和某爲太君年老多病未能一歸郷里親拜墳墓祖墳更望與照管餘託鄭齋郎致意此外保愛不宣某書上十四弟秀才閏月六日又皇祐五年某罪逆深重不自死滅禍罰上延太君以去年三月十七日有事攀號冤呌五内分崩不孝深蒼天罪逆深蒼天見在潁州持服咋者鄭齋郎自郷中來得十四弟書知與骨肉奉親各安某爲於潁州卜葬所以未及歸得只候服闋南歸相見書言回陂樹倒但勿令人斫伐爲幸諸大小墳域且望更與掛意照管年歳間某歸相見餘不多言今因嗣立人回奉此不具兄押書寄十四弟秀才四月七日兖墨宣筆表逺信又同前十四弟秀才前者嗣立人力回魯附書及筆墨等想得逹邇來暑熱上下各安某今者扶護太居靈柩歸葬先遣嗣立歸凡有可幹事爲嗣立少心力吾弟且與同共勾當相見不逺秋熱好將息不次某書白十四弟七月十五日又同前十四弟昨自扶護南歸得相見庶事頗相牽率自别計安諸姪亦計無恙某初十日巳至家一行如常但憂墳塋惟託勤爲照管諸巳靣諭更不言也此外教諸姪爲學各令謹慎爲佳時寒好將攝因人頻附書來言墳頭子細是切不具兄某書送十四弟又皇祐六年是歳三月改至和元年十四弟别後計與諸眷各安自離吉水後未曾得來書中間景歸曽有書必逹八郎近寄信來回陂門垣及水道並已改了不知是否因書言及今因寒食遣人力去上墳望與至少卿墳頭一轉爲地逺只附錢去與買香紙酒等澆奠小叔西街小大郎諸骨肉並與伸意前曽附書更不冩書也更附錢五伯文與回陂墳頭張旺取伊一領狀封來仍指揮伊修蓋墻垣看鎻門户千萬千萬如有事書中細與言來春暄各好將息不次兄押書送十四弟又至和二年書寄十四弟秀才乆别計安樂吴榮來得書回陂墳所必與照管今因寒食令人力蕭及去上墳將錢伍伯省請與買酒食去澆奠回陂墳并與覷當垣墻門户錢一索與看墳張旺仍指揮伊覷當樹木及取領狀一紙來春暖好將息不具兄押書白十四弟秀才二月四日外封題云書附吉州小市三院巷兄翰林學土知制誥史館修撰兼修唐書勾當三班院某今其玄孫名釣龜甞請鄉舉尚居此巷仍藏公之真蹟又嘉祐元年人力來得書知骨肉並安深慰深慰爲今春使契丹寒食不曽遣得人徃墳所吾弟並與到諸墳深感深感脩見乞洪州亦只爲先墳也未得間恐吾弟因出入且爲照管兄押書送十四弟四月十五日與十二姪通理皇祐四年任象州司理自南方多事以來日夕憂汝得昨日遞中書知與新婦諸孫等各安守官無事頓解逺想吾此哀苦如常歐陽氏自江南歸明累世蒙朝廷官禄吾今又𬒳榮顯致汝等並列官裳當思報効偶此多事如有差使盡心向前不得避事至於臨難死節亦是汝榮事但存心盡公神明亦自祐汝慎不可思避事也昨書中言欲買朱砂來吾不闕此物汝於官下冝守㢘何得買官下物吾在官所除飲食物外不曽買一物汝可安此爲戒也巳寒好將息不具吾書送通理十二郎又承示近文秖如此作得也但古詩中時復要一聮對屬尤見工夫并門當因書言去昔選人有陳竒者舉主十六人仁宗見其未甞歷選調特旨不改官以戒馳騖者初官冝少安之與十三姪奉職皇祐五年奉職自赴任不曽得書到官下想安樂汝孤寒曽受辛苦知道官職難得每事當思愛惜守㢘守貧慎行刑保此寸禄而已十四郎今却令回此子自縣中來見其衣裝單薄汝只親兄弟兩人今食禄庻事冝均給更且戒約勿令出入無事令學書識取些字從來失教訓是事不㑹男子如此何以養身今遣人去知府舎人處求太君墓誌若此人將得來即更不言若未得來即汝因事至府中靣告言吾令汝請文字且與請取求的便附來春寒好将息不具吾押送十三奉職正月十四日十四郎此中與綿襖子兩領并褁纒錢三索省只十七八程可到恐伊别亂破錢也與大寺丞發治平四年王澤與書未行間孫宗古來得汝書知與㓜小各安甚寛憂想惟真所傳神改了甚善梅都官者必巳畫了所是韓孟惟真旣言自有本便可畫也湏是四㡠頭靣髣髴一般大小方好看且傳語催伊早畫了才到亳便去取也押付發宅圖且勿與看梅須亦帶接籬不然帶楮冠子但取好畫隐士帽亦好又同前吾二十五日離潁二十八日一行平安至亳初二日上事臨離潁時累有書去約汝於遞中發書令先至亳及至此兩日杳不得一字何故何故以此不無憂想不知爾來汝與諸㓜各安樂否迎孫婆孫入夏來長進否婆孫瘡痍較未不瘦否此吾日夕所念也今專遣急脚子去勾當將來山陵發引排祭一事汝冝用心速與問當早令回報蓋慮後時難辦也其餘事更三兩日黄清去别有書也此外夏熱汝與諸㓜各好將息遞中頻發一書來不必湏候專人也五月二十九日至亳後第一書押付發今令急脚子計㑹王昌及杜延禧問當進奏官及轉問北京定州進奏官前次仁宗山陵發引時北京定州排祭用何儀式其祭前排列明器人物等用多少數目祭食味數贈作錢馬數目並令一一問取今體例來今别具畫一劄子汝速召王昌杜延禧令體問早令此急足回來要作準備如杜延禧短使即令王昌用心勾當不管悮事此急脚子回時買明黄羅一疋附來又同前初三日遣急脚子發到亳後第一書爲問山陵致祭事書必巳到此中兩日内却併得遞中來者兩書知汝與諸㓜各安只是聞得婆孫患臟府後甚煩惱蓋孩兒三好兩惡巳多時且湏用心調理及知道妳子亂喫物道不得但向道候到亳州你不得迎子何不與青黛丸喫此是汝小時服之得効者前時王澤附去者豆䓻丸亦是汝軰患臟府時得効者可與婆孫喫醫人藥中用黄連甘草者與兒喫此中日夕惟是憂煩二孫過夏不易且喜汝今夏一成安樂然更湏慎食生冷吾自蔡河舟中大熱食生冷不節所以到潁渇淋復作潁肉誠不及京師乍從京師來誠不好及食之日乆亦不覺酒則絶佳於舊日巨魚鮮羙鰕蟹極多皆他郡所無以至水泉𬞞菓皆絶好諸物皆賤閑居之樂莫此若也吾此只爲一歳計不候宅成只候買得材料便決去躬親蓋造必更精潔也此郡閑僻未去間足以頥養孃瘦及食少心頭氣滿與其餘並如在京時汝可勿憂黄清李徳今並遣回餘事當續附書此外夏熱汝曹各好將息稍無人便即於遞中附書千萬六月七日第二書付發押王昌令買明黄羅一疋白生羅二疋巳指揮與也要知要知七郎得書知在京安樂且與頻照管山陵致祭紙錢贈作駞馬等此中可造惟是祭前排立人物此中做不得須令王昌及早商量定令人家依數做下準備使用不可悮事也箔埸近日如何般墮并出買如何也向後可㬠折欠此事常冝用心王昌處米麥絹錢索足未今並在何處收附所云趙祐請米又是何米後信子細說來出京時舊曆上未請物數令王昌録一本來仍開說後來巳請見今未請惟真處畫四本㹅了便與附來黎直講并彭州劉比部書並早與附逹見吴省副再三伸意續有書也近日群議如何謝上表到後莫有云云否因的書中略說來不妨曽學士書汝去相看自送與又同前十八日王昌等到得汝書并寄來生日信物依數並領知汝與諸㓜各安此中上下並如常汝可勿憂只是聞得迎孫患痢甚憂得王昌來時書中只言稍减次日送黄清急脚回書中並不言増減以此不能無憂才得婆孫稍安又却大姐患痢料得煎迫可知醫人須着照管且頻與錢但於房錢内取及他事少錢使但於房錢内隨多少取使不湏先來問也只是分明上曆記數與隨手印押夏陸二人或請一月米各與五石昨送香合來依常年例各與酒一瓶侯威亦與一瓶汝昨寄文字比舊甚進可惜中止已得塗轍可以力進也吾此公事絶少渇巳減但瘦少力及耳聽漸重然未甚妨事皆可勿憂此後恐人便漸少但過十日無人便發書即於遞中附一信來此外夏熱各好将息六月二十三日押付發潁酒二瓶且可喫亳酒更不及團茶新舊三餅紙請取一月九舅作捉箔場亦湏照管排祭事已指揮王昌也只是祭文不知用不用速與問如用時覔一箇本子寄來蓋全不知體面也更是靈駕起時百官皆服𥘉喪恐代拜要孝衣更早擘畫韓維龍圖昨因何出辭潁求襄何故不得而得汝問沖卿便知書中報來待發書徃汝略要知爾謝上表到多時因何不傳若傳人言謂何及今諸事有何議論亦問沖卿便知子細報來此中如井底焦祕挍所論如何且頻與見彼新自南來必載柴米来如無時速報來曽學士處國史送來足也未或未足早取令足報來又熈寧四年昨晚令此防送兵士將書去今早果是送汝兵士回得汝書知到潁安樂頓解千萬憂想自此三五日因人或縣遞頻附一信來也他事若漸有次緒亦言來謝大伯花園與漕口莊帳曽問當未花園目見如果可買亦緩爲之莊難看勿憑說者切在子細也吾今日已在假餘事續書言去二月二十三日押所云州官來則復謁思之未便如倅幕縣宰須一先謁常禮不可闕也冩書了又思得此助役事方欲議行人戸驚搔見說潁亦如此旦夕得安撫文移陜西軍賊撲㓕巳多其餘些小潰散更俟續報若一成定揲則過聖節可陳乞爾恐知恐知二哥一向不得書憂損憂損吾却且視事蓋不請假亦自可下表在亳時如此也此中吴寺丞乆不安似虚勞恐知恐知又同前近送配軍人行有書去必到㝷而急足回得汝書知在潁安樂甚慰甚慰數日無書去爲等姚都官行然家中上下安樂别無事可勿憂吾在告巳十餘日二哥自京有書來言自家求休退都下别無議論西事亦不如傳聞别無警急但一二相愛者恐時方惡人求退懼有不如意事爾若止如此苦無可䘏三五日欲遂入削爾恐知恐知候入削了去報也常保屋必巳下手也如前所說甚好只是郭天錫不可專委須自掛心韋保屋了汝且謀歸要去時却去此中近故也州官盡曽看否且與周旋續思潁詩何爲却不刻石問得言來更數事别有畫一向熱好將息頻附書歸三月五日押付大哥襄州酒二瓶不甚好但少勝潁爾少喫發風物酒亦少飲千萬千萬科埸尚逺勿甚勞也又同前初六日姚都官行令急足隨去附書并酒計昨日已到也前日揚嬰入州得汝書并信物等並足知汝在彼安樂甚慰此中内外並如常吾在假巳十七八日表并劄子冩下數日遷延未發今日待發凌晨忽聞邊事警急又却未敢發然素計蹉跌身心躁撓無地自容蓋悔恨者去就之計不能自決若去秋在潁便陳乞安有今日之悔到蔡又直遲疑至今是自家做得今欲歸咎何人然昨爲黎教授云云遂陷惑至此初八日決巳發表封遞角次又得黎書切怪在假仍戒勿輕發遂又遲疑信知是一冤家冤家邊事未有涯自家退計杳未有也汝書言待蓋草堂并庵此不急之務不是汝去時議定且只修房錢緊急因何又却及此吾此書到切更勿議蓋也那取人工物料錢物等候韋保屋修了更修取此房錢賢急處千萬千萬今此書只爲言此一事切聽切聽此外好將息頻附書歸三月十一日押付發謝家園子前書巳言去莊帳子不要今却附去致莊之說且巳候汝歸細議也有說有說又同前劉宗去後防送人回得汝書知汝在彼安樂甚慰只是知二十三日方卓立韋家屋子約湏一月方了不知汝甚時歸得本望聖節前到家爾兼漸向熱冝且歸也此中上下並安可勿憂吾已出㕔五六日本爲西賊驚傳今得諸處關報皆云招捉潰散無多也吾之進退自此以後自決於心如事從容希恩禮悠悠之談相悮至此也劉宗去時書中事甚詳此更不多言文論并詩頻作甚好惟愈熟則工矣青州兩料職租不乆來當盡送去修房錢也恐知云遣郭天錫日望其來此外好將息三月廿五日押送大哥二哥此中亦乆不得書可恠可恠又同前前日兩歩闕兵士防送行有書并掩子必到今日蔡州大風㣲雨斗寒思汝數日前盡將綿衣寄歸不知彼中隂晴與此同否憂汝驟寒都無綿衣吾與孃憂心不能安今立走急足送綿衣去急足到立便令回或汝歸時帶來亦得未歸先遣回亦得餘事前書已說也好將息四月九日押送大哥又同前近兩歩闕押賣藥人去有書續又專遣急足送綿衣去有書計皆巳到今日郭順來得汝書知在彼安樂甚解憂想此中老㓜各安可勿過憂蔡人今歳絶不疾疫但寒暑不常昨初九日大風寒所以專令送綿衣去及問郭順乃云九日潁州大熱方解憂心郭順云修造有次第汝欲二十頭可歸然不知何故更令郭天錫先歸也累書去問汝歸日皆不言孃甚恠然韋業了其餘小者可委劉宗大者必下手未得也此中亦自有事要汝歸靣議此書到千萬且歸它事前書巳詳餘好將息四月十二日晚押送大哥二哥十頭出京三五日到家恐知恐知又同前前日吴廷平來得汝書知安樂近郭天錫來後便遣兵士作子等去望人到汝便離潁至今巳八九日並無息秏不免憂疑蓋潁蔡深夏不免人多不安故也此中内外甚安吾十九日已入却致仕文字若近例一削便允則旦暮間便有命尤要汝歸故更遣急足去如人到尚未起來即速且歸韋業巳了只是屋下生活可委劉宗其餘前書已言候汝歸商量也所是準備吾歸潁之計今更未暇汝但且歸此中旦夕專望路中好將息四月廿六日午時押付發與二寺丞奕熈寧三年自聞汝失意便遣郭順去接汝次日又遞中附書去方憂悶次今日劉玉自京來得汝八日書稍知動静若至潁見了大哥便先歸則今應巳在路得失常事命有遲速汝必㑹得應不甚勞心却是旅中不如意漸熱難行故未免憂想若此書到尚在潁則且先歸爲孃切要見汝蓋憂汝煩惱也汝切寛心求安如過亳州只約黎曹二君南臺相見勿入城千萬千萬此外路中好將息此急脚子如路中逢見便帶取回一路使喚二月二十六日押付二哥奕書簡卷第十與大寺丞第七帖杳未有也有字下疑脫字修取此房錢此疑是此字右書簡十卷命題以各人所至之官故於稱謂不必相應雖並注嵗月而先後間有差互既巳誤刋重於改易姑附注其下又不可知則闕之吉綿本書簡有論文史問古事之類巳移入外集第十六十七十八十九卷中集古録跋尾卷第十歐陽文忠公集一百四十三瘞鶴銘歲月未詳瘞鶴銘黄庭遺教經雖傳自晉而公疑唐人所書故附此右瘞鶴銘題云華陽眞逸撰刻於焦山之足常爲江水所没好事者伺水落時模而傳之徃徃秖得其數字云鶴壽不知其㡬而已世以其難得尤以爲竒惟余所得六百餘字獨爲多也按潤州圖經以爲王羲之書字亦竒特然不類羲之筆法而類顔魯公不知何人書也華陽眞逸是顧况道號今不敢遂以爲况者碑無年月不知何時疑前後有人同斯號者也右集本又右在焦山之足常爲江水所没好事者伺水落時模而傳之徃徃秖得其數字云鶴壽不知其㡬而止世以其難得尤以爲竒惟余所得獨若此之多也潤州圖經以爲王羲之書字亦竒放然不類羲之筆法而類顔魯公不知何人書也或云華陽眞逸是顧况道號銘其所作也右眞蹟黄庭經永和十二年右黄庭經一篇晉永和中刻石世傳王羲之書書雖可喜而筆法非羲之所爲黄庭經者魏晉時道士養生之書也今道藏别有三十六章者名曰内景而謂此一篇爲外景又分爲上中下三部者皆非也蓋内景者乃此一篇之義䟽尓流俗又有一篇名曰中景者尤爲䌓雜鄙俚之所傳也余嘗患世人不識其真多以内景三十六章爲本經因取永和刻石一篇爲之注解余非學異說者哀世人之惑於繆妄尓右真蹟又今道藏别有三十六章曰黄庭内景而謂此一篇者爲外景又有分爲上中下三部者流俗所行又别有中景者皆非也所謂内景者乃此經之義䟽尓中景一篇尤爲繁雜蓋妄人之所作也此本晉永和中刻石文字時亦脫繆然比今世俗所傳頗爲精也右見綿本拾遺又右黄庭别本一作刻續得之京師書肆不知此石刻在何處其字畫頗類顔魯公甚可愛而不完更俟求訪以足治平丁未閏月三日書右見綿本拾遺又右黄庭經二篇皆不著書人姓名余𥘉得後本巳愛其字不俗遂録之旣而又得前本於殿中丞裴造造好古君子也自言家藏此本數世矣與其藏于家不若附見余之集録可以傳之不朽也余因以舊本較其優劣而並存之使覽者得以自擇焉世傳王羲之嘗冩黄庭經此豈其遺法歟右集本遺教經右遺教經相傳云羲之書僞也蓋唐世冩經手所書集本有尓字唐時佛書今在者大抵書體皆類此第其精麤不同尓近有得唐人所書經題其一云薛稷一云僧行敦書者皆與二人他所書不類而與此頗同即知冩經手所書也然其字亦可愛故録之蓋今士大夫筆畫能髣髴乎此者鮮矣右眞蹟小字道徳經開元二十七年右小字八分道徳經不著書人名氏亦不知其所自來或云在明州其石今亡矣問今藏書之家皆云未嘗見也其字畫精妙見者多疑爲明皇書而知非者以其集本有首字但題御注而不云御書也右眞蹟唐人臨帖右唐人所臨諸家法帖一卷其前數帖類真卿所書蓋其筆畫精勁他人未易臻此按唐書言禇無量嘗請以當時所藏竒書名畫命宰相以下跋尾而玄宗不許此乃有宋璟等列名于後又頗多訛繆豈後人妄増加之也然要爲可翫何必窮較其眞僞今流俗所傳鍾王遺迹多不同然時時各有所得故雖小小轉冩失眞不害爲佳物由是悉取前後所得諸家法帖分入集録蓋以資博覽云右集本小字法帖此下皆跋法帖蓋模本也故類於唐人臨帖之後右小字法帖者近時有尚書郎潘師旦者以官法帖私自模刻于家爲别本以行於世余因分以爲類散入集録諸祑而程邈衛夫人鍾繇王廙宋儋皆以小字為一類於此余嘗辨鍾繇賀捷表爲非真而此帖字畫筆法皆不同傳模不能不失本體以此真僞尤爲難辨也治平元年七月三十日書右眞蹟又近時有尚書郎潘師旦者竊取官法帖中數十帖别自刻石以遺人而傳冩字多轉失然亦時有可佳者因又擇其可録者分爲十餘卷以入集目聊爲一時之翫尓其小字尤精故録於此右集本十八家法帖右世傳十八帖者實二十五帖蓋書者十八家爾而流俗又自集本無此字有羲之十八帖然皆岀於官法帖也太宗皇帝時嘗遣使者天下購募前賢真蹟集以爲法帖十卷鏤板而藏之毎有大臣進登二府者則賜以一本其後不賜或傳板本在御書院徃時禁中火災板𬒳焚遂不復賜或云板今在但不賜爾故人間尤以官法帖爲難得此十八家者蓋官法帖之尤精者也余得自薛公期云是家藏舊本頗真今世人所有皆轉相傳模者也右真蹟雜法帖六嚮於薛十三䖏得法帖一部闕其第一乆而始獲南朝諸帝筆法雖不同大率意思不逺眇然都不復有豪氣但清婉若可佳耳二學書不必憊精疲神於筆硯多閱古人遺蹟求其用意所得冝多三羲獻世以書自名而筆法相去逺甚父子之間不同如此然皆有足喜也四吾有集古録千卷晚又得此法帖歸老之計足矣寓心於此其樂可涯嘉祐壬寅大雩攝事致齋閑題五古今事異一時人語亦多不同傳模之際又多轉失時有難識處惟當以意求之爾嘉祐七年大饗明堂致齋于中書東閤偶題六老年病目不能讀書又艱於執筆惟此與集古録可以把玩而不欲屢閱者留爲歸潁銷日之樂也蓋物維不足然後其樂無窮使其力至於勞則有時而猒尓然内樂猶有待於外物則退之所謂着山林與着城郭何異冝爲有道者所笑也熈寜辛亥清心堂書右見綿本别集二十三卷懷州孔子廟記後魏太和中誤寘于此右宣尼廟記文辭事實皆不足采其書亦非佳獨其字畫多異故特録之以備博覽右見綿本拾遺景福遺文余在夷陵時得之民家見當時縣有驅使官衙直典然云米一作來不者莫詳其語嘉祐七年五月二十六日右見綿本别集二十三卷浮槎寺八紀詩右浮槎寺八紀詩者自云鴈門釋僧皎字廣明作集本無此字詩雖非工而所載事蹟皆圖經所無可以資博覽浮槎山在今廬州慎縣其上有泉其味與無錫惠山水相上下而鴻漸茶經及張又新等水記皆不載嘉祐中李留後端愿守廬州以其水遺余因爲之記其事余甚愛山泉而浮槎水特佳頗怪前世遺而不録及得僧皎紀浮槎八事亦無之乃知物之晦顯有時也治平元年七月三十日書右眞蹟福州永泰縣無名篆右在福州永泰縣觀音院後山上世俗多傳以爲僊篆太常博士黄孝立閩人也嘗爲余言其山無名上多頑石無復鐫刻之蹟如人以手指畫泥而成文文随圎石之形環布之如車輪循環莫知其首尾又言孝立嘗至廣州見南蕃人以夷法事天日夕焚香拜金書字號爲天篆者正類此然不能曉也今人亦有以道家之言譯之者曰勤道守三一中有不死術亦莫知其是非也右眞蹟又右在福州永泰縣觀音院後山上太常博士黄孝立閩人也爲余說曰山無名而甚髙峻石皆頑無復鐫刻之迹如人以手指畫泥而成文文随圎石之形環布之又曰孝立嘗至廣州見南蕃人以夷法事天日夕拜金書字圖號天篆者視其與此篆正同然不能考也今世人亦有以道家之言譯之者曰勤道守三一中有不死術亦莫得而詳焉右集本謝仙火右謝仙火字在今岳州華容縣廢玉眞宫柱上倒書而刻之不知何人書也傳云大中祥符中玉眞宫爲天火所焚惟留一柱有此字好事者遂模于石慶曆中衡山女子號何僊姑者絶粒輕身人皆以爲僊也有以此字問之者輒曰謝僊者靁部中鬼也夫婦皆長三尺其色如玉掌行火於世間後有聞其說者於道藏中檢之云實有謝僊名字主行火而餘說則無之由是益以僊姑爲真僊矣近見衡州奏云僊姑死矣都無神異客有自衡來者云僊姑晚年羸瘦面皮皺黒第一衰媪也嚮時蘇州有一丏者卧道中相傳云是得僊者也自天聖中余已聞之後二十餘年尚在其人姓沈舉世皆傳爲沈卧僊云卧而飲食不漏州縣吏屢使人監守或潜伺察之皆實卧而不起亦不漏遂相傳以爲神旣而亦以病死雖素信惑其事喜爲之稱說者亦不云死時有異也斯二人者皆今世人以爲僊者如此故并載之右集本張龍公碑乾寜元年右張龍公碑趙耕撰云君諱路斯潁上百社人也隋𥘉明經登第景龍中爲宣城令夫人關州石氏生九子公罷令歸毎夕岀自戌至丑歸常體冷且濕石氏異而詢之公曰吾龍也蓼人鄭祥逺亦龍也騎白牛據吾池自謂鄭公池吾屢與戰未勝明日取決可令吾子挾弓矢射之繫鬛以青綃者鄭也絳綃者吾也子遂射中青綃鄭怒東北去投合肥西山死今龍穴山是也由是公與九子俱復爲龍亦可謂怪矣余嘗以事至百社村過其祠下見其林樹隂蔚池水窈然誠異物之所託歲時禱雨屢獲其應汝隂人尤以爲神也右集本又龍公之事怪㢤余嘗以事至百社村過其祠下見其林樹隂蔚池水窈然誠異物之所託歲時禱雨屢獲其應汝隂人尤以爲神也右眞蹟周伯著碑右周伯著碑者在今宿州岀於近歲蓋官部春夫開汴渠於泥沙中掘得之其文字古怪而磨滅無首尾了不可讀伯著不知爲何人其僅可見者云渤海君玄孫季景長子也其事蹟不可考文辭莫曉而字書不工徒以其古怪而録之此誠好古之弊也治平元年七月三十日書右真蹟衛秀書梁思楚碑上元元年秀筆工之善模者也其自謂集書信矣無足多取也書譬君子皆學乎聖人而其所施爲未必同也右集本裴夫人誌天實四年右裴夫人誌辭翰瀟洒固多清思惜乎不見其名氏石在長安之萬年矮槐文亦佳在亳州法相寺二者皆後得故續附于此熈寜二年六月二十有八日青州山齋書右見綿本拾遺五代時人署字右五代時帝王將相等署字合一卷前人遺蹟徃徃因人家告身莊宅劵契故後世傳之猶在此署字乃北京人家好事者類而模傳之爾右集本楊凝式題名李西臺詩附右楊凝式題名并李西臺詩附自唐亡道喪四海困於兵戈及聖宋興天下復歸于治蓋百有五十餘年而五代之際有楊少師建隆以集本作巳後稱李西臺二人者筆法不同而書名皆爲一時之絶故並録于此右眞蹟徐鉉雙溪院記右雙溪院記徐鉉書鉉與其弟鍇皆能八分小篆而筆法頗少力其在江南皆以文翰知名號二徐爲學者所宗蓋五代干戈之亂儒學道喪而二君能自奮然爲當時名臣而中國旣苦於兵四方僣僞割裂皆𥚹迫擾攘不暇獨江南粗有文物而二君者優遊其間及宋興違命侯來朝二徐得爲王臣中朝人士皆傾慕其風采蓋亦有以過人者故特録其書爾若小篆則與鉉同時有王文秉者其筆甚精勁然其人無足稱二字集本作所聞也治平元年上元日書右眞蹟王文秉小篆千字文紫陽石磬銘附右小篆千字文者江南人王文秉書其後題云大唐唐申歲者建隆元年也僞庚李煜自周師取淮南畫江爲界以稱臣遂削去年號奉周正朔然世宗特許其稱帝故文秉猶稱唐而不書年號直云庚申歲也文秉在江南篆書逺過徐鉉而鉉以文學名重當時文秉人罕知者學者皆云鉉筆雖未工而有字學一點一畫皆有法也文秉所書獨余集録屢得之此本得於太學楊南仲紫陽石磬銘者張獻撰亦文秉書也右集本王文秉紫陽石磬銘右紫陽石磬銘余獨録於此而不附他書者文秉之書罕見於今也小篆自李陽冰後未見工者文秉江南人其字畫之精逺過徐鉉而中朝之士不知文秉但稱徐常侍者鉉以文章有重名於當時故也歲在辛酉晉天福六年李昪之昇元五年也五代干戈之際士之藝有至於斯者太平之世學者可不勉㢤右見綿本拾遺郭忠恕小字說文字源右小字說文字源郭忠恕書忠恕者集本有五代漢周之除爲湘隂公從事十二字及事皇朝其事見實録頗竒怪世人但知小篆而不知其楷法尤精然其楷字亦不見刻石者蓋惟有此耳故尤可惜也五代干戈之際學校廢是謂集本作爲君子道消之時然猶有如忠恕者國家爲國百年天下無事儒學盛矣獨於字書忽廢㡬於中絶今求如忠恕小楷不可得也故余毎與君謨歎息於此也石在徐州集本無此四字嘉祐八年十二月廿日書右眞蹟郭忠恕書隂符經右隂符經郭忠恕書篆法自唐李陽冰後未有臻於斯者近時頗有學者曽未得其髣髴也實録言忠恕死時甚怪豈亦異人乎其楷書尤精也嘉祐六年九月十五曰宴後歇泊假閑覽因題右真蹟太清石集本作西闕題名余自至亳始得悉閱太清之碑其佳者皆集本作悉巳入余集古録矣乃知余之集録所得多矣惟兩石闕題名集本無二字未有今集本無此字續録于此熈寜元年二月十九日書右眞蹟太清東闕題名熈寜元年二月十八日余率僚属謁太清諸殿裴囬兩闕之下周視八檜之異窺九井禹歩之奇酌其水以烹茶而歸十九日書右見綿本拾遺賽陽山文太和九年誤寘于此右䟦尾者六人皆知名士也時余在翰林以孟饗致齋唐書局中六人者相與飲弈歡然終日而去蓋一時之盛集也明年夏鄰㡬聖俞卒又九年而原甫長文卒自嘉祐己亥至今熈寜辛亥一紀之間亡者四存者三而擇之遭酷吏以罪廢景仁亦以言事得罪獨余頑然蒙上保全貪冒寵榮不知休止然筋骸憊矣尚此勉強而交遊零落無復情悰其盛衰之際可以悲夫是時同修書者七人今亡者五宋子京王景彛吕縉叔劉仲更與聖俞也存者二余與次道尓次道去年爲知制誥亦以封還李定詞頭奪軄因感夫存亡今昔之可歎者遂并書之熈寜四年三月十五日病告中書右見綿本拾遺集古録跋尾卷第十瘞鶴銘元第八十八竒特一作放黄庭經元第百四又元題作續跋又三日一作三十日又姓名一作名氏巳愛其字一作愛其字畫此本一無此二字余因一無余字較其一無其字擇焉一作之庭經一無經字治平元年十月十三日致齋東閤書一有此十四字遺教經元第二百六十三可愛二字上一有自字小字道徳經元第九百二十二至九百二十五唐人臨帖元第七百八十八真卿二字上一有顔字乃有一作安得然時時三字一作然時博覽云此下一有此本得於李丕緒少卿治平元年夏至日書十七字小字法帖元第七百二十九官法帖此下一有本字又元第七百七十三於此一作于此十八家法帖元第四百二十集以一無以字進登一作登進雜法帖六元無卷第五時有二字上一有以字六則有時而厭五字一作時則有厭懷州孔子廟記元第二百八十五記一作碑景福遺文元無卷第米不一作采不浮槎寺八紀詩元第七百五十三紀浮槎八事一作記浮槎八紀事無名篆元第一百八十七環布之三字一作旋布又此篆一無篆字謝仙火元第二百六十六傳云一作傳者云絶粒二字上一有能字世間一作人間而餘一作而其餘死矣二字上一有巳字客有至衰媪一無此二十一字縣吏一作官實卧二字上一有云字并載一無并字治平元年上元日書一有此八字張龍公碑元第二百五周伯著碑元第七百六十九渤碑作勃而録一無而字梁思楚碑元第一百七十五裴夫人誌元附一百八亦佳一作亦可佳五代時人署字元第七百三十楊凝式題名元第八百一十四雙溪院記元第二百六十九皆能一無皆字及宋一無及字其筆一無其字小篆千字文元第五百二十六紫陽至書也一無此十三字治平元年四月九日書一有此九字紫陽石磬銘元附五百二十六小字說文字源元第一百八十四但知此下一有其字郭忠恕書隂符經元第五百八十八太清西闕題名元第五百二十三太清東闕題名元第五百二十二賽陽山文元第五百四十三得罪此下一有致仕二字翰林學士呉奎知制誥劉敞祠部郎中集賢校理江休復工部貟外郎直集賢院祖無擇屯田貟外郎編修唐書梅堯臣嘉祐四年四月六日於編修院同觀范鎮景仁後至後見眞蹟題此六人官軄姓名集古碑千卷毎卷碑在前跋在後銜幅用公名印其外褾以緗紙束以縹帶題其㡨曰某碑卷第㡬皆公親蹟至今猶有存者按公嘗自云四百餘篇有跋今世所傳本是也其間如唐鄭權碑乃熈寜辛亥歲跋又至明年正月方跋鄧艾碑李徳𥙿山居詩四月題前漢鴈足鐙銘後數月而公薨殆集録之絶筆也方崧卿裒聚真蹟刻板廬陵得二百四十餘篇以校集本頗有異同疑真蹟一時所書集本後或改定今於逐篇各注何本若異同不多則以眞蹟爲主而以集本所改注其下或繁簡遼絶則兩存之謂如後漢樊常侍碑真蹟作永壽四年四月而集本改作二月訪得古碑二月爲是至於以始元爲漢宣帝年號又稱後周大統十六年唐大足二年之類乃公一時筆誤不敢有所更改集古跋既刻成方得公子叔弼目録二十卷具列, WYG: 趨}
