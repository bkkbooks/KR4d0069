  - {type: variant, offset: 0, length: 12492, content: 外集卷第二十五歐陽文忠公集七十五論殿試儒者可與守成論闕三皇設言民不違論論曰夫至治之極也塗耳目以愚民之識暢希夷以合道之極化𬒳而物不知功成而迹無眹古有臻於是者其大道之行乎聖人之興也捐仁義以為徳之細放約束以取民之信徳及而物自化言行而人必從古有盛於此者其三皇之世歟故孔子有三皇設言而民不違之說敢試論之若乃暢上古之至道張億世之逺御結繩所以為信也而懼信之未孚我則有書契之易於是乎畫八卦以由數起茹毛所以飬生也而憚生之未具我則有烹飪之利於是乎甞百糓以粒烝民網罟利人以為用使以畋而以漁牛馬異性而必馴使可乗而可服壯棟宇以易古者之居垂衣裳以興天下之治凡所以使民不倦者皆伏犧神農黄帝之為世疑然而治既行矣民既賴矣守之以至靜化之以無為上有淡泊清淨之風下無薄惡叛離之俗故言為教詔非誥誓而自聽言為號令不鞭扑而自隨且夫㰱血以涖盟約要之於信者由不信而然也為刑以殘肌骨威之使從者由不從而設也不若御至質之民行大道之化恱不以愛故不待賞而勸畏不以威故不待罰而責政不罔民故不待約而信事不申令故不待誥而從一言以行萬民禀命賴其徳者百年而利服其化者百年而移非三皇之徳其孰能與於此乎噫商人作誓欲民之從也而人始疑周人㑹盟欲信之固也而諸侯叛由是而言則詛民於神明狃民於賞罰而違之者末世之為也服民以道徳漸民以教化而人自從之者三皇之盛也夫設言而不違者其在兹乎賈誼不至公卿論論曰漢興本恭儉革弊末移風俗之厚者以孝文為稱首議禮樂興制度切當世之務者惟賈生為美談天子方忻然說之倚以為用而卒遭周勃東陽之毁以謂儒學之生紛亂諸事由是斥去竟以憂死班史賛之以誼天年早終雖不至公卿未為不遇予切惑之甞試論之曰孝文之興漢三世矣孤秦之弊未救諸吕之危繼作南北興兩軍之誅京師新蹀血之變而文帝由代邸嗣漢位天下初定人心未集方且破觚斲雕衣綈履革務率敦朴推行恭儉故改作之議謙於未遑制度之風闕然不講者二十餘年矣而誼因痛哭以憫世太息而著論況是時方隅未寧表裏未輯匈奴桀黠朝那上郡蕭然苦兵侯王僣儗淮南濟北繼以見戮誼指陳當世之冝規畫億載之策願試属國以系單于之頸請分諸子以弱侯王之勢上徒善其言而不克用又若鑒秦俗之薄惡指漢風之奢侈嗼屋壁之𬒳帝服憤優倡之為后飾請設庠序述宗周之長乆深戒刑罰明孤秦之速亡譬人主之如堂所以優臣子之禮置天下於大器所以見安危之㡬諸所以日疑不可勝而文帝卒能拱黙化理推行恭儉緩除刑罰善飬臣下者誼之所言略施行矣故天下以謂可任公卿而劉向亦稱逺過伊管然卒以不用者得非孝文之初立日淺而宿将老臣方握其事或艾旗斬級矢石之勇或鼔刀販繒賈竪之人朴而少文昧於大體相與非斥至于謫去則誼之不遇可勝歎哉且以誼之所陳孝文略施其術猶能比徳於成康況用於朝廷之間坐於廊廟之上則舉大漢之風登三皇之首猶決壅禆墜耳奈何俯抑佐王之略逺致諸侯之間故誼過長沙作賦以弔汨羅而太史公傳於屈原之後明其若屈原之忠而遭棄逐也而班固不譏文帝之逺賢痛賈生之不用但謂其天年早終且誼以失志憂傷而横夭豈曰天年乎則固之善志逮疑作殆與春秋襃貶萬一矣謹論夫子罕言利命仁論論曰昔明王不興而宗周衰斯文未喪而仲尼出修敗起廢而變于道扶衰救弊而反於正至如探造化之本賾㡬深之慮以窮乎天下之至精立道徳之防張禮樂之致以逹乎人情之大竇故易言天地之變吾得以辭而繫詩厚風化之本吾得以擇而刪禮樂備三代之英吾得以定而正春秋立一王之法吾得以約而修其爲教也所以該明帝王之大猷推見天人之至隱道有機而不得祕神有密而不得蔵暁乎人倫明乎耳目如此而詳備也然獨以利命仁而罕言其旨何哉請試言之夫利命仁之爲道也淵深而難明廣博而難詳若乃誘生民以至教周萬物而不遺草木賁殖而無知所以遂其生跋喙行息而不知所以逹其樂物性莫不欲茂則薫之以太和人情莫不欲壽則濟之以不夭滯者導之使逹蒙者開之使明衣𬒳羣生贍足萬類此上之利下及於物聖人逹之以和於義也則利之爲道豈不大哉凾五行之秀氣兼二儀之肖貌禀爾至命得之自天厥生而靜謂之性觸物而動感其欲派而為賢愚誘而為善惡賢愚所以異貴賤善惡所以定吉凶貧冨窮逹死生天壽賦分而有定循環而無端聖人逹之内照乎神明小人逆之外滅於天理則命之為義豈不逹哉又若兼百行以全美居五常而稱首愛人而及物力行而能近守而行之一日由乎復禮推而引之天下稱乎逹道則仁之為理豈不盛哉噫三者之說誠皆聖人之深逹非難言之也易曰乾以羙利利乎天下又曰利者義之和中庸曰天命之謂性又曰君子居易以俟命繫辭曰樂天知命故不憂禮記曰仁者天下之表又曰仁者右也道者左也酌是而論之則非不言也然罕言及者得非以利命仁之為道微而奥博而逺賢者誠而明之不假言之道也愚者鮮能及之雖言之弗可曉也故曰中人已上可以語上中人已下不可以語上又曰仁則吾不知者舉一可知也子貢以謂夫子之言性與天道不可得而聞者誠在是乎然則利命仁之罕言由此而見矣謹論策南省試策五道并問目問管夷吾之書曰聖人之治天下也四民勿使雜處則其言哤其事易士就間燕工就官府商就市井農就田野羣萃而州處少而習焉其志安焉不見異物而遷焉且曰士農之子常為士農工商之子常為工商若乃士講學以居位農力穡以阜生安而不遷斯則嘉矣其或百工居肆萬商成淵竒技淫巧之蕩心鬻良雜苦之牟利安於所習未足敦風見善而遷兹亦何害又如端木之貨殖膠鬲之魚鹽倪寛之帶經王猛之賣畚乗時萬變安可限其定居黄憲之牛醫胡廣之田畒桑羊之賈竪叔敖之負薪肯構百端安可責其承世今兹貢士之制亦有異類之防雖條禁之乆行諒甄明之不暇衆君子優於博古長於辨冝以爲如何無惜辭費對講天人之精祲責􅋄茅之愚言古之求治者莫急於此興愚民之休利傳經術而條對士之射䇿者以盡其才自漢而還於唐爲盛然以公孫之對置第本下天子自擢於第一劉蕡之言指時甚直有司不敢以入第盖言至切者顧後害論至甚者爲難行故事欲述者枉於有司而議不得申言欲顯者牽於文辭而談不得騁爲弊之甚由古而然夫能革之誠在今日皇上垂衣御圖側席延士詔郡國以充賦命公卿而署奏而末學庸妄亦預試言開陳其端周爰而問上所以講求至治之本下所以展盡思慮之秋也䇿以謂古之四民罔敢雜處之義而今取士故有異類之防端木膠鬲倪寛王猛之徒謂不可限以定居黄憲胡廣桑羊叔敖之賢謂不可責其世職以古之鑒求今之冝此誠當世之所急也且夫至治之世四民異居士處間燕談仁義禮樂於是乎興農服力穡限井田衣食於是乎足工述巧以備器用商逹貨以遷有無少而習之各有常分故命射以觀其徳命御以論其行如是則可以官賢材而不肖者有所勸不耕則祭無盛不𧖟則衣無帛如是則可以禁㳺手而趨末者著於本器竒者殺以杜工之僞關譏弗征以檢商之猾此聖王所以治天下之本罪疑不得以異物遷也及周之晚漢繼而興救時之冝猶有可取士雖不選於里而有孝㢘之舉農欲勸之使勤故有力田之秩有市籍則不得仕禁乗車之抑其豪行之當時猶為進士疑降及弊末適於權冝有入貲以為郎有入粟而拜爵農商雜進黒白混然今國家監太清以為治求王道之大端務思真賢以登庶位故於貢士之制亦有異類之防此誠法古為政之要也然自井田一墮四民失業士不本郷里舉不明真僞後世之取賢者冝條禁之故有行限年之制有復郷舉之請有立秀才之科有立中正以品功伐之髙下有從土斷以禁人士之流移科條益嚴變更非一賢否之辨未覩其真豈非制其末而失其要歟方今詔郡國歲貢謹土著以占數先郷議而覈實然患條禁乆行甄明不暇者誠由制之未得其術爾必若取人以才考行以實舉賢者上賞以旌功不肖者黜地以明罰自然無冐舉之過有得人之盛又何患工商雜以並進士類混而無别乎彼作竒巧以蕩心雜良苦而射利謂其媮俗未足敦風在乎禁之以絶其僞而巳若乃端木殖財膠鬲擅利倪寛為御史而稱職王猛與諸葛而並功黄憲有三公之量胡廣明萬事之理桑羊之心計叔敖之善相如此數賢者皆遭遇其時以立勲業故不限以定居責其世職烏得同條而語哉謹對第二道問古者糾邦禁以敘六典因天討而作五刑所以申嚴國章明慎時憲恊大中之法助教化之治定三尺以著令明一成而不變又赦過宥罪議獄緩死法天地之茂育象雷雨之作解式顯好生之化茂宣去殺之仁且肆眚之恩尚廢而不用則時無滌穢之澤若數以為利則人有委轡之歎折衷之理願聞嘉言對夫民弊於末心作乎爭徳不可以獨輔也輔之者其刑法乎猛而則殘虐以為暴刑不可以獨任也濟之者其仁恩乎先王由是扶衰世以捄溢即民心而有作謂天有震耀殺戮我則嚴之以威虐刑罰謂天有生殖長養我則申之以温慈恵和大為之防曲為之制以商周之盛徳有九刑之典亦知獄與刑之不可去也如此然而議獄緩死羲易之明文眚災肆赦帝典之奥訓周官有三宥新國用輕典皆所以寛民之謂也故肆眚苟廢則時無滌穢之澤是傷乎無恩也數以爲利則人有委轡之歎是因而起弊也折衷之理何以辨之盖周家之政至忠厚也須成康而刑乃錯漢世之徳至寛仁也至文景而獄乃平夫所以致刑之錯獄之平其要非他在削苛刻之深文執議論之平讞無罹民之不逺無縱誅以快怒使愚民知所避姦吏無所弄則獄雖不赦刑将自平且投簞者不能救饑持鞿者不能御騎又何必申小恵推私恩啓民心之姦弛古刑之典者哉故謂不赦者良醫之針石赦者奔馬之委轡質斯言也不其然乎謹對第三道問天駟先牧列於祭經圉人圉師實有官局然則國馬之政其來尚矣皇朝累盛函夏大同華陽之歸偃息既乆坰野之頌孳生益蕃而又河隴朔方歲行互市頗積縻於金帛亦罕辨於良駑誠由騎兵不可以闕供夷落仰資於善價寖為經制著在有司議者或云承平日深冗費冝革思欲減邊關之條禁遂氓庶之貿遷儻緩急於戎容可借資於民畜恭惟聖治務廣蒭言靡倦極談以光俊域對養馬有夏庌之制掌於周官春秋紀日中之候著於左傳逺郊任乎牧事祭祖標於月令作延廐禁原𧖟著為國經並載方策則國馬之政其可廢乎國家接千歲之大統承五代之末流畫牡荆以指麾包虎皮而載戢聞一作間有日矣而猶弗敢忘戰備於不虞内有七校禁衛之屯外有三邊防秋之戍而兵騎之衆畜牧且蕃資河朔以仰足用金帛而交易為日滋乆其費日深然欲減邊防之條禁遂氓庶之貿遷施之于今未見其得何則探寳貨以懷利者此夷落之民所甚欲也商功利以惜費則主計之臣所徧明也若乃捐有餘之寳獲爲兵之備以其所有易其所無斯誠利害可明而經乆弗變之制也非互市不能以足用歸氓庶則懼乎起姦顓蒙所見故在於此謹對第四道問粤若姬氏肇自邰封佐堯而爲農師居豳成於王業綿綿之瓞本仁積功膴膴之原聿來胥宇逮文武之景化𬒳𡵨鎬之故區繼聖嗣興定命攸厚相兹河洛之宅求乎天地之中澗瀍之間風雨所㑹在禮也載土圭之法於書也兆龜墨之祥逖觀獻卜之文顯著徙都之事何乃丘明作傳康王有酆宫之朝杜預垂言平王為東周之始豈先後之殊致将方策之失傳矧又奉春始謀極談秦地之固孟堅能賦頗㭊西賔之問建邦之利折理奚長諒兹俊髦精于經傳敷言條對勿尚猥并對肇祖乎后稷以至乎赧王流徳而深厚者莫大乎西周始封乎邰土卒終於洛都因世而相宅者逮歷乎七百方策之所並載詩頌之所歌舞可略而談也若乃武王在鎬繼文而有聲周公踐祚相成而負扆即神臯以開壤據澗瀍之上㳺是為洛都以徙周邑然而丘明作傳康王有酆宫之朝杜預垂言平王為東周之始此策所以疑而問者得非洛之初營周都既定但遷九鼎以居其中及周徳之下衰始平王之東徙迹先後之可見非方策之失傳也夫守金城之府據繞霤之固扼關中之形勢者彊秦之興也此奉春以是建策而為髙皇說也因土圭之影迹宗周之舊當天下而宅中者東漢之盛也此孟堅之所以因賦而陳光武之業也夫圯耿徙亳成湯非一邦而理在𡵨居鎬姬氏不共邑而興世之盛衰顧徳薄厚而巳又烏稱建邦之利哉故東西二都皆兩漢由之而興廢也謹對第五道問聽徳惟聦前王之至訓嘉言罔伏舉善之令猷國家守承平之基御中區之廣地利無極齒籍益蕃各有爭心必虞彊詐之患或非良吏慮興枉濫之尤故立肺石以逹窮民設匭函以開言路而又俾之轉對復彼制科思廣所聞遂延多士屬兹舉首将列仕塗以何道致民之暴者興仁智者無訟以何術使吏之酷者存恕貪者守㢘試舉所長用觀精識對帝堯之徳非不聖也必乗九功而興虞舜之明非不智也必開四聦之聽大禹之勤求賢士乃至乎王漢家之並建豪英以翼乎治誠以一人之聖據羣元之尊王道之寖微寖昌生民之或仁或鄙理有未燭思求其端是以垂精留神廣覽兼聽居以側遲賢之席行則馳裹輪之車施及於方外而弗遺退託於不明而求輔其勤若此猶懼乎弗及也故今國家所以覽照前古講求舊規下明詔以開不諱之門設匭函以廣言者之路復轉對以採搢紳之議立制策以待儁良之言者意在兹乎猥惟檮昧之微舉皆管淺之說夫欲民之暴者興仁智者無訟在乎庠序以明教化欲吏之酷者存恕貪者守㢘在乎嚴督責而明科條為治之方不過乎是而已謹對國學試策三道并問目問詩刪風雅有一國四方之殊書載典謨實二帝三王之道君臣之制有别小大之政不侔然而關雎王者之風反繫於周公之化秦誓諸侯之事乃附於訓誥之餘究其閎綱必有微旨且巧言者丘明為耻傳春秋蒙誣艷之譏恵人者子産用心作丘賦𬒳蠆尾之謗謂之誣艷非巧言乎目之蠆尾豈恵人也夫子又何謂之同耻歎其遺愛者哉子大夫博識洽聞彊學待問請談大義用釋深疑對舉賢而問炎漢之得人射策程材有唐之明詔晁錯明國家之大體仲舒究春秋之一元皆條對于篇章備天子之親覽劉蕡述兵農之大略微之以才識而中科然品覈其言詞由有司而考第皇上思講勛華之閎道欲舉漢唐之茂規已詔公卿之流博選賢良之士而又申周官辨論之法以考於賢能較成均上㳺之徒並升於歲貢退媿拘儒亦當奥問夫近世取士之弊䇿試爲先談無用之空文角不急之常論知井田之不能復妄設沿革之辭知榷酤之不可除虚開利害之說或䇿之者鉤探微細殆皆㳺談而對之者骫骳曲辭僅能塞問棄本求末捨實得華若乃詩書之可疑聖賢之異行樂所以導和而率俗官所以共治而建中此皆聖師之所談明問之至要敢陳臆見用備詢求䇿曰詩刪風雅有一國四方之殊書載典謨是二帝三王之道關雎王者之風反繫於周公之化秦誓諸侯之事乃附於訓誥之餘考其本因可爲梗槩夫述四始之要明五際之變始之以風終之以頌以厚風俗以察盛衰此詩之所以作也而變風變雅有六義之殊焉關雎王化之基三百五篇推其首而周南之作一作化亦繫其列者盖姬旦分陜而居天子與之共治故其政化之美得繫于王者之風也述百篇為歷代之寳斷之自唐迄之以周以陳典謨以為約束此書之所以設也作誥作誓皆三王之事焉成湯有罪已之言五十九篇載其義而秦侯之誓亦參其末者盖穆公伐晉之辭夫子善之於改過故其誡令之說亦附訓誥之餘不然夫仲尼述堯舜刪詩書著為不刋以示來葉豈容其失乎且巧言者丘明所耻恵人者子産用心著于前經此可明矣先儒稱仲尼立一王之法始修春秋而親授丘明使之作傳及范寗欲專糓梁一家故蒙以誣艷之譏前志稱子産猶衆人之母善其養民而臨治鄭國能行其恵及國人怨其丘賦之重歛故𬒳以蠆尾之謗夫傳一經之義非曲而暢之盖不能詳也救一時之弊盖推一作權而行之非為毒也學者偏見妄云誣艷豈丘明之失歟國人無知謗以蠆尾非子産之過矣況以仲尼之聖作經親授豈有繆舉乎國僑既死國人皆罷不曰恵乎冝其同巧言之為耻以遺愛而見稱也荒孱之說敢以此聞謹對第二道問樂由中出音以心生自金石畢陳咸韶間作莫不恊和律吕感暢神靈雖嗜欲之變萬殊思慮之端百致敦和飾喜何莫由斯是以哀樂和睽則噍殺嘽緩之音應其外禮信殊衍則一作雖大雅小雅之歌異其冝鍾期改聽於流水伯喈囬車於欲殺戚憂未弭子夏不能成聲感㮣形言孟甞所以抆泣斯則樂由志革音以情遷盖心術定其慘舒鏗鏘發之影響是以亡陳遺曲唐人不以爲悲文皇劇談杜生於斯結舌謂致樂可以導志将此音不足移人先王立樂之方君子審音之旨請論一作為詳悉傾竚洽聞對人肖天地之貌故有血氣仁智之靈生禀隂陽之和故形喜怒哀樂之變物所以感乎目情所以動乎心合之為大中發之為至和誘以非物則邪僻之将入感以非理則流蕩而忘歸盖七情不能自節待樂而節之至性不能自和待樂而和之聖人由是照天命以窮根哀生民之多欲順導其性大為之防為播金石之音以暢其律為制羽毛之采以飾其容發焉爲徳華聽焉逹天理此六樂之所以作三王之所由用人物以是感暢心術於焉慘舒也故樂記之文噍殺嘽緩之音以隨哀樂而應乎外師乙之說以小雅大雅之異禮信而各安於冝夫姦聲正聲應感而至好禮好信由性則然此則禮信之常也若夫流水一奏而子期賞音殺聲外形則伯喈興歎子夏戚憂而不能成聲孟甞聽曲而爲之墮睫亡陳之曲唐人不悲文皇劇談杜生靡對斯瑣瑣之濫音曽非聖人之至樂語其悲適足以蹙匹夫之意謂其和而不能暢天下之樂且黄鍾六律之音尚賤於末節大武三王之事猶譏於未善況鼔琴之末技亡國之遺音又烏足道哉必欲明教之導志音之移人粗舉一端請陳其說夫順天地調隂陽感人以和適物之性則樂之導志将由是乎本治亂形哀樂歌政之本動民之心則音之移人其在兹矣帝堯之大章成湯之大濩乃是先王立樂之方延陵之聘魯夫子之聞韶則見君子審音之旨謹對第三道問建官惟百帝堯之閎規涖事惟能武成之令典然則簡易之理斯得爵禄之馭有經自卜洛伻圖述天定位别九服廣輪之數辨一圻國邑之冝乃六卿在郊五家為比咸用蒙士尸於厥官教以和親禁其愛惡惟列爵之既衆豈取士之盡賢匪徒百里比肩尚艱於充選抑亦一命授職咸仰於代耕以夫至寡治衆之言清心省事之論㑹其歸趣不乃異乎是以秦漢已還抑而不舉得非折衷難用相治乎象魏舊章人倫彞訓遟聞清論用折深疑對天生民而樹之牧執政以馭邦王建國以辨其方設官而分理列職乎庶位立民之大中以登至平皆由此道帝堯以巍巍之功臻乎靜治故建官惟百緝熈於大猷姬周以郁郁之風縟乎至化故涖事惟能否揚於景鑠逮夫卜洛開基述天定位别九服而有等建六官而分職至于六卿在郊五家為比並列官敘教於民人嬴政并諸侯之彊姍古以自是其制不經搢紳者罕道炎漢承孤秦之弊日給不暇相沿末流貴因循而不比崇疑民𬒳乎無為之化故官雖至簡亦可以治平姬周承二代之弊意在救時之失故官必衆建乃能為共治此世之異時之然也雖曰六卿五家為職甚細然由計以㑹要行之誅賞賢者旌之以勸善不賢者罰之以去惡則列職雖云至衆取人安不盡賢禄何由而濫尸官誠難於充選此宗周所以治安而長乆後世所冝法則而未行也自秦歷漢積弊相沿權冝適時放去古法居位者莫分善惡之真考課者未見誅賞之當故列職彌衆涖事益煩故政立而治不能進官衆而人不必賢夫清心省事之論所以爲此弊而設非爲宗周而談也今欲捨姬周之往軌談秦漢之末規濁源清流未見其可夫惟簡易之深旨賢哲之異能求禮樂之深源述官師之大義此誠逺大之閎體非陋儒之能具也管窺之微既難於殫見蒭蕘之鄙聊備於周詢謹對外集卷第二十五南省試策第三道徧明一作偏明第四道策問頗㭊疑是頗折折理疑是㭊理土圭之影影合作景國學試策第一道是二帝策題作實二帝居士集卷第二十五歐陽文忠公集二十五墓表六首尚書屯田貟外郎贈兵部貟外郎錢君墓表君諱冶字良範姓錢氏世為彭城人後徙呉興自君之七世祖寶又徙常州之武進曾祖諱某祖諱某父諱某當唐末五代錢氏起餘杭據浙東西為呉越王於是時常州或屬江南或屬呉越而武進錢氏獨不顯一以儒學廉讓行于郷里連三世不仕宋興取江南常州歸于有司君始以州進士舉中景徳二年甲科試祕書省校書郎為楊州廣陵潮州海陽縣令遷寧國軍節度推官監黃州麻城茶埸遂知縣事遷著作佐郎知蘄州蘄水懐安軍金堂縣又遷祕書丞知泰州如臯縣再遷屯田貟外郎通判宣州未行明道二年六月十一日以疾卒于家享年五十有二君少好學能為文辭家貧其母賢甞躬織絍以資其學問每夜讀書一有不止字母為滅燭止之君陽卧母且睡輒復起讀一有年二十三字州舉進士第一試禮部髙第遂中甲科為吏長於決獄歷六縣皆有能政潮州自五代時劉氏暴殘其民君為海陽經年民歸業者千餘户由是海陽升為大縣潮之大姓某氏火迹其來自某家吏捕訊之某家號冤不服太守刁湛曰獄非錢君不可君問大姓得火所發牀足驗之疑里仇家物因率吏入仇家取牀折足合之皆是仇人即服曰火自我出然故遺其迹某家者欲自免也某家誠冤君即日出某家獄致仇人以法舉州稱為一無此字神明其佐宣州數決大獄及旁近郡獄有疑者皆歸決於君工部侍郎凌䇿知宣州尤稱君文學曰吏事不足汚子當以文章居臺閣欲薦其文未及而䇿卒初宣州官歲市茶于涇縣命君主之䇿子不肖以惡茶數千斤入于官君立焚之以白䇿䇿益以此知君䇿卒君歎曰世無知我者矣在麻城以茶課歲増五倍遂遷著作金堂故多盜君以伍保籍民察其出入凡為盜者許其徒告以贖罪盜遂止㑹甘露降其縣明年麥禾大稔麥一莖五𡵨禾一莖五穗者縣人以爲君政所致謂之錢公三瑞君歎曰吾知治民爾瑞豈吾致哉縣人為君立生祠如臯民不農桑以鹽為生君曰使民足以衣食鹽猶農也乃悉求鹽利害為條目民便其利而鹽最増積以石數者至四十五萬君在如臯時年五十或歎其仕不逹君曰使吾政行於民是逹也蔡文忠公為御史中丞數欲引君為御史㑹君卒君平生所為文章三百餘篇號曰晦書君之皇考贈殿中丞母諸葛氏封萬年縣太君徙封福昌娶蔣氏初封樂安縣君又封福清子男五人曰公餗公瑾公輔公儀公佐蔣氏有賢行自君之卒日以君所為朂其五子以學蔣氏後君二十年以卒卒時公瑾公輔皆以進士及第公瑾為新鄭尉公輔以文章知名當世為太常丞集賢校理錢氏自其相寶徙武進其居與葬皆在其縣之遵教郷敦行里慶曆三一作二年九月庚申公餗等葬君于其居之東北原皇里水之北至和二年三月壬午一無上八字以蔣夫人從歐陽脩曰錢姓出陸終蓋顓頊之苗裔始以士為周官乆而以為姓自三代以來無甚顯者至唐末錢氏多居東南及鏐乘亂世起餘杭有地十三州號兼呉越而王者幾百年而武進錢氏獨以隱徳累世不顯豈以力者如彼而以徳者如此哉豈其盛衰遲速之理固有不同哉武進之錢自寶七世至君有聞又有賢子不墜益彰其埶孰止蓋恃力者雖盛而必衰以徳者愈遲而終顯立石刻辭其示彌逺太常博士周君墓表有篤行君子曰周君者孝於其親友於其兄弟居父母喪與其兄某弟某居于倚廬不飲酒食肉者三年其言必戚其哭必哀除喪而癯然不能勝人事者蓋乆而後復自孔子在魯而魯人不能行三年之喪其弟子疑以為問則非魯而他國可知也孔子殁而其後世又可知也今世之人知事其親者多矣或居喪而不哀者有矣生能事而死能哀或不知喪禮者有矣或知禮而以謂喪主於哀而巳不必合於禮者有矣如周君者事生盡孝居喪盡哀而以禮者也禮之失乆矣喪禮尤廢也今之居喪者惟仕宦婚嫁聽樂不為此特法令之所禁爾其衰麻之數哭泣之節居處之别飲食之變皆莫知夫有禮也在上位者不以身率其下在下者無所望於其上其遂廢矣乎故吾於周君有所取也君諱堯卿字子俞道州永明縣人也天聖二年舉進士累官至太常博士歷連一作道衡二州司理參軍桂州司録知髙安寧化二縣通判饒州未行以慶曆五年六月朔日卒于朝集之舍享年五十有一皇祐五年某月日葬于道州永明縣之紫微岡曽祖諱某祖諱某父諱某贈某官母唐氏封某縣太君娶某氏封某縣君君學長於毛鄭詩左氏春秋家貧不事生産喜聚書居官禄雖薄常分俸以賙宗族朋友人有慢已者必厚為禮以愧之其為吏所居皆有能政有文集二十卷君有子七人曰諭鼎州司理叅軍曰詵湖州歸安主簿曰謐曰諷曰諲曰說曰誼皆未仕嗚呼孝非一家之行也所以移於事君而忠仁於宗族而睦交於朋友而信始於一郷推之四海表于金石示之後世而勸考君之所施者無不可以書也豈獨俾其子孫之不隕也㢤右班殿直贈右羽林軍將軍唐君墓表嘉祐四年冬天子旣受祫享之福推恩羣臣並進爵秩旣又以及其親若在若亡無有中外逺邇於是天章閣待制尚書户部貟外郎唐君得贈其皇考驍衞府君爲右羽林軍一無軍字將軍府君諱拱字某一無某字其先晉原人後徙爲錢塘人曽祖諱休復唐天復中舉明經爲建威一作武軍節度推官祖諱仁恭仕呉越王爲唐山縣令累贈諌議大夫父諱謂官至尚書職方郎中累贈禮部尚書府君以父廕補太廟齋郎改三班借職再遷一作轉右班殿直監舒州孔城鎭澧州酒稅廵檢泰州鹽埸漳州兵馬監押乾興元年七月某日以疾卒于官享年四十有六府君孝悌於其家信義於其朋友廉讓於其郷里其居於官名公鉅人皆以為材而未及用也享年不永君子哀之有子曰介字子方舉進士皇祐中甞為御史以言事切直貶春州别駕當是時子方之風悚動天下巳而天子感悟貶未至而復用之今列侍從居諌官自子方為祕書丞始贈府君為太子右清道率府率其為尚書主客貟外郎殿十侍御史裏行又贈府君為右監門衞將軍其為尚書工部貟外郎直集賢院權開封府判官又贈府君為右屯衞將軍其遷户部貟外郎河東轉運使又贈府君為驍衞將軍蓋自登于朝以至榮顯遇天子有事于天地宗廟推恩必及焉府君初娶博陵崔氏贈仙游縣太君後娶崔氏贈清河縣太君皆衞尉卿仁冀之女生一男介也五女長適太子中舍盧圭次適歐陽昊早卒次適橫州推官髙定次適進士陸平仲次適著作佐郎陳起慶曆三年八月某日以府君及二夫人之喪合葬于江陵龍山之東原後十有七年廬陵歐陽脩乃表於其墓曰嗚呼余於此見朝廷所以襃寵勸勵臣子之意豈不厚哉又以見士之為善者雖堙没幽鬱其潜徳隱行必有時而發而遲速顯晦在其子孫然則為人之子者其可不自勉哉蓋古之為子者禄不逮養則無以及其親矣今之為子者有克自立則尚有榮名之寵焉其所以教人之孝者篤於古也深矣子方進用於時其所以榮其親者未知其止也姑立表以待焉胡先生墓表先生諱瑗字翼之姓胡氏其上世為陵州一作京兆人後為泰州如臯一作海陵人先生為人師言行而身化之使誠明者逹昏愚者勵而頑傲者革故其為法嚴而信為道乆而尊師道廢乆矣自景祐明道以來學者有師惟先生曁泰山孫明復石守道三人而先生之徒最盛其在湖州之學弟子去來常數百人各以其經轉相傳授其教學之法最備行之數年東南之士莫不以仁義禮樂為學慶曆四年天子開天章閣與大臣講天下事始慨然詔州縣皆立學於是建太學於京師而有司請下湖州取先生之法以為太學法至今為著令後十餘年先生始來居太學學者自逺而至太學不能容取旁官署一作字以為學舍禮部貢舉歲所得士先生弟子十常居四五其髙第者知名當時或取一作中甲科居顯仕其餘散在四方隨其人賢愚皆循循雅飭其言談舉止遇之一無二字不問可知為先生弟子其學者相語稱先生不問可知為胡公也先生初以白衣見天子論樂拜一有試字祕書省校書郎辟丹州軍事推官改密州觀察推官丁父憂去職服除為保寧軍節度推官遂居湖學召為諸王宫教授以疾免已而以太子中舍致仕遷殿中丞於家皇祐中驛召至京師議樂復以為大理評事兼太常寺主簿又以疾辭歲餘為光禄寺丞國子監直講廼居太學遷大理寺丞賜緋衣銀魚嘉祐元年遷太子中允充天章閣侍講仍居太學已而病不能朝天子數遣使者存問又以太常博士致仕東歸之日太學之諸生與朝廷賢士大夫送之東門執弟子禮路人嗟歎以為榮以四年六月六日卒于杭州享年六十有七以明年十月五日葬于烏程何山之原其世次官邑與其行事莆陽蔡君謨具一作旦誌于幽堂嗚呼先生之徳在乎人不待表而見於後世然非此無以慰學者之思乃掲于其墓之原六年八月三日廬陵歐陽脩述瀧岡阡表嗚呼惟我皇考崇公卜吉于瀧岡之六十年其子脩始克表於其阡非敢緩也蓋有待也脩不幸生四歲而孤太夫人守節自誓居窮一作貧自力於衣食以長以教俾至于成人太夫人告之曰汝父為吏廉而好施與喜賔客其俸禄雖薄常不使有餘曰母以是為我累故其亡也無一瓦之覆一壠之植碑本作殖以庇而為生吾何恃而能自守邪吾於汝父知其一二以有待於汝也自吾為汝家婦不及事吾姑然知汝父之能養也汝孤而㓜吾不能知汝之必有立然知汝父之必將有後也吾之始歸也汝父免於母喪方逾年歲時祭祀則必涕泣曰祭而豐不如養之薄也間御酒食則又涕泣曰昔常一作吾不足而今有餘其何及也吾始一二見之以為新免於喪適然耳旣而其後常然至其終身未甞不然吾雖不及事姑而以此知汝父之能養也汝父為吏甞夜燭治官書屢廢而歎吾問之則曰此死獄也我求其生不得爾吾曰生可求乎曰求其生而不得則死者與我皆無恨也一無也字矧求而有得邪以其有一本有字作求而得則知不求而死者有恨也夫常求其生猶失之死而世一作况常求其死也回顧乳者劒一作抱汝而立于旁因指而歎曰術者謂我歲行在戍將死使其言然吾不及見兒之立也後當以我語告之其平居教他子弟常用此語吾耳熟焉故能詳也其施於外事吾不能知其居于家無所矜飾而所為如此是眞發於中者邪嗚呼其心厚於仁者邪此吾知汝父之必將有後也汝其勉之夫養不必豐要於孝利雖不得博於物要其心之厚於仁吾不能教汝此汝父之志也脩泣而志之不敢忘先公少孤力學咸平三年進士及第為道州判官泗綿二州推官又為泰州判官享年五十有九葬沙溪之瀧岡太夫人姓鄭氏考諱徳儀世為江南名族太夫人恭儉仁愛而有禮初封福昌縣太君進封樂安安康彭城三郡太君自其家少微一作賤時治其家以儉約其後常不使過之曰吾兒不能苟合於世儉薄所以居患難也其後脩貶夷陵太夫人言笑自若曰汝家故貧賤也碑本無六字吾處之有素矣汝能安之吾亦安矣自先公之亡二十年脩始得禄而養又十有二年列官于朝始得贈封其親又十年脩為龍圗閣直學士尚書一無尚書字吏部郎中留守南京太夫人以疾終一作卒于官舍享年七十有二又八年脩以非才入副樞宻遂參政事又七年而罷自登二府天子推恩襃其三世故一作蓋自嘉祐以來逢國大慶必加寵錫皇曽祖府君累贈金紫光禄大夫太師中書令曽祖妣累封楚國太夫人皇祖府君累贈金紫光禄大夫太師中書令兼尚書令祖妣累封呉國太夫人皇考崇公累贈金紫光禄大夫太師中書令兼尚書令皇妣累封越國太夫人今上初郊皇考賜爵為崇國公太夫人進號魏一作韓國於是小子脩泣而言曰嗚呼為善無不報而遲速有時此理之常也惟我祖考積善成徳冝享其隆雖不克有於其躬而賜爵受封顯榮襃大實有三朝之錫命是足以表見於後世而庇頼其子孫矣乃列其世譜具刻于碑旣又載我皇考崇公之遺訓太夫人之所以教而有待於脩者並掲于阡俾知夫小子脩之徳薄能鮮遭時竊位而幸全大節不辱其先者兵來有自熈寜三年歲次庚戍四月辛酉朔十有五日乙亥男推誠保徳崇仁翊戴功臣觀文殿學士特進行兵部尚書知青州軍州事兼管内勸農使充京東東路安撫使上柱國樂安郡開國公食邑四千三百户食實封一千二百户脩表集賢校理丁君墓表君諱寶臣字元珍姓丁氏常州晉陵人也景祐元年舉進士及第為峽州軍事判官淮南節度掌書記杭州觀察判官改太子中允知剡縣徙知端州遷太常丞愽士坐海賊儂智髙䧟城失守奪一官徙置黃州乆之復得太常丞監湖州酒稅又復博士知諸曁縣編校祕閣書籍遂為校理同知太常禮院君為人外和怡而内謹立望其容貌進趨知其君子人也居郷里以文行稱少孤與其兄篤於友悌兄亡服喪三年曰吾不幸㓜失其親兄吾父也慶曆中詔天下大興學校東南多學者而湖杭尤盛君居杭學為教授以其素所學問而自修於郷里者教其徒乆而學者多所成就其後天子患館閣職廢特置編校八貟其選甚精乃自諸曁召居祕閣君治州縣聽決精明賦役有法民畏信而便安之其始治剡也如此後治諸曁剡鄰邑也其民聞其來讙曰此剡人愛而思之謂不可復得者也今吾民乃幸而得之而君亦以治剡者治之由是所至有聲及居閣下淡然不以勢利動其心未甞走謁公卿與諸學士羣居恂恂人皆愛親之蓋其召自諸曁也以材行選及在館閣乆而朝廷益知其賢英宗毎論人物屢稱之國家自削除僣偽東南遂無事偃兵弛備者六十餘年矣而嶺外尤甚其山海荒闊列郡數十皆爲下州朝廷命吏常以一縣視之故其守無城其戍無兵一日智髙乘不備䧟邕州殺將吏有衆萬餘人順流而下潯梧封康諸小州所過如破竹吏民皆望而散走獨君猶率羸卒百餘拒戰殺六七人旣敗亦走初賊未至君語其下曰幸得兵數千人伏小湘峽扼至險以擊驕兵可必勝也乃請兵於廣州凡九請不報又甞得賊覘者一人斬之賊旣平議者謂君文學冝居臺閣備侍從以承顧問而眇然以一儒者守空城提百十飢羸之卒當萬人卒至之賊可謂不幸而天子亦以謂縣官不素設備而責守吏不以空手捍賊冝原其情故一切輕其法而君以甞請兵不得又能拒戰殺賊則又輕之故他失守者皆奪兩官而君奪一官巳而知其賢復召用後十餘年御史知雜蘇寀受命之明日建言請復治君前事奪其職而黜之天子知君賢不可以一眚廢而先帝巳察其罪而輕之矣又數更大赦且罪無再坐然猶以御史新用故屈君使少避而不傷之也乃用其校理歲滿所當得者即以君通判永州方待闕於晉陵以治平四年四月某甲子暴中風眩一夕卒享年五十有八累官至尚書司封貟外郎階朝奉郎勲上輕車都尉曾祖諱某祖諱某皆不仕父諱某贈尚書工部侍郎母張氏仙游縣太君君娶饒氏封晉陵縣君先卒子男四人曰隅曰除曰隮皆舉進士曰恩兒才一歲女一人適著作佐郎集賢校理胡宗愈君旣卒天子憫然推恩録其子隅為太廟齋郎君之平生履憂患而遭困阨處之安焉未甞見戚戚之色其於窮逹壽夭知有命固無憾於其心然知君之賢哀其志而惜其命止於斯者不能無恨也於是相與論著君之大節伐石紀辭以表見於後世庶幾以慰其思焉熈寧元年六月十四日廬陵歐陽脩述居士集卷第二十五熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正周君墓表諸本皆作君諱某字某某州某縣人朝佐竊謂篤行君子正頼公文以傳逺豈可逸其名字郷里乃為考舂陵志悉書之錢君墓表悉求一作多求賢行一作節行唐君墓表父諱謂一作渭胡先生墓表景祐明道一作明道景祐為是於京師於一作于瀧岡阡表吾始石本作始吾丁君墓表召自諸曁也以材行選也一作巳曾祖諱輝祖諱諒父諱柬之一本如此, WYG: 銘}
