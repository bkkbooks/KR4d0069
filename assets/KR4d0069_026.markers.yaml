  - {type: variant, offset: 0, length: 4608, content: 居士集卷第二十六歐陽文忠公集二十六墓誌四首尚書虞部貟外郎尹公墓誌銘公諱仲宣姓尹氏尹氏世居太原無顯者由公之父贈刑部侍郎諱文化始舉毛詩登某一無此字科一有能字以材敏稱於當時仕至尚書都官郎中於今人士語尹氏者徃徃能稱其名字由是始有聞人刑部葬其父於河南今爲河南人公舉周易咸平三年中第歷梓州銅山鳯翔麟游二主簿京兆府司理叅軍潞州襄垣主簿遷汝州梁一有縣字懷州武陟二令又遷蜀州軍事判官薦其能者數十一作十數人拜大理寺丞太子中舍殿中丞國子博士尚書虞部貟外郎歷知汝州之葉鄭州之滎陽一有縣字又知大寜監通判華州又知資州皆有政一作能績最後知郢州至州之三日晨起衣冠得疾一有及寢而三字卒實景祐四年三月七日也年七十一以五年十一月二十八日葬壽安母鄭氏徳興縣太君妻張氏壽安縣君子七人源洙湘沖淑沂泳諸孫十餘人公旣卒許州進士朱生遊資州資人一作州家家能道公之遺事及聞公喪皆巷哭其吏與民各以其類之浮屠發哀受弔朱生旣得公善十餘事爲作遺愛録以遺資人朱生未甞識公者而言若兹信矣嗚呼善人之爲善也生不赫赫於當時則其遺風餘思在乎人者必有時而著公生而爲善殁也見思一作殁也見稱斯可知也已銘者所以名其善功以昭後世也一有夫字銘曰物塞而通必艱其初至于大亨乃燁而敷尹氏之先乆窒不耀自公再世始發其奥公不墜徳有善在人孰當其興在子與孫一作在于子孫尚書兵部貟外郎知制誥謝公墓誌銘朝散大夫行尚書兵部貟外郎知制誥知鄧州軍州事兼管内勸農使上輕車都尉陽夏縣開國男食邑三百户賜紫金魚袋謝公諱絳字希深其先出於黃帝之後任姓之别爲十族謝其一也其國在南陽宛三代之際以微不見至詩嵩髙始言周宣王使召公營謝邑以賜申伯蓋謝先以失國其子孫散亡以國爲姓歷秦漢魏益不顯至晉宋間謝氏出陳郡者始爲盛族公之皇考曰太子賔客諱濤其爵陳留伯至公開國又爲陽夏男皆在陳郡故用其封復因爲陳郡人然其官邑卒葬隨世而遷其譜自八世而下可見曰八代祖汾為河南緱氏人至五代祖希圖始遷而南或葬嘉興或葬麗水自皇考巳上三代皆葬杭州之冨陽公以寶元二年四月丁卯來治鄧其年十一月已酉以疾卒于官以逺不克歸于南即以明年八月得州之西南某山之陽遂以葬公享年四十有五初娶夏侯氏先卒今舉以祔後娶髙氏文安縣君三男六女男某皆將作監主簿女一早亡五尚㓜公之卒其客歐陽脩弔而哭于位退則歎曰初賔客之薨脩獲銘其徳納諸冨陽之原今又哭公之喪哭者在位莫如脩舊蓋甞銘其世矣乃論次其終始曰公年十五起家試秘書省校書郎復舉進士中甲科以奉禮郎知潁州汝隂縣遷光禄寺丞上書論四民失業楊文公薦其材召試充秘閣校理再遷太常丞通判常州丁母晉陵郡君許氏憂服除遷太常博士用鄭氏經唐故事議昭武皇帝非受命祖不冝配享感生帝天聖中天下水旱而蝗河決壞滑州又上書用洪範五行京房傳推災異所以爲天譴告之意極陳時所闕失無所諱與修眞宗國史遷祠部貟外郎直集賢院通判河南府移書丞相言歲凶嵩山宫冝罷勿治又上書論妖人方術士不冝出入禁中請追所賜先生處士號歲滿權開封府判官再遷兵部貟外郎爲三司度支判官上書論法一作詔禁密花透背詔書云自内始今内人賜衣復下有司取之是爲法而自戾無以信天下又言後苑作官市龜筒亦禁物民間非所有有之爲犯法因請罷内作諸器皆以其職言又言有司多一無此字求上旨一有多字從中出而數更且謂號令數變則虧國體利害偏聽則惑聦明請者務欲各行而守者患於不一請凡詔令皆由中書樞密院然後行郭皇后廢上書用詩白華引申后襃姒以爲戒景祐元年丁父憂服除一本賔客薨于京師以喪南歸三年召試知制誥判流内銓諌者言李照新定樂不可用下其議議者乆不决公爲兩議曰宋樂用三世矣照之法不合古吾從舊乃署其一議曰從新樂者異署議者皆從公署公爲人肅然自脩平居温温不妄喜怒及其臨事敢言何其壯也雖或聽或否或論髙而不能行或後果如其言皆傅經據古切中時病三代巳來文章盛者稱西漢公於制誥尤得其體世所謂常楊元白不足多也公旣以文知名至於爲政無所不逹自汝隂巳有能名佐常州至今常人思之錢思公守河南悉以事屬之是時莊獻明肅太后莊懿太后起二陵於永安至於鐵石畚鍤不取一物於民而足修國子學教諸生自逺而至者百餘人舉而中第者十八九河南人聞公喪皆出涕諸生畫像於學而祠之初吏部擬官以圭田有無為均公取州縣田覆其實者凖其方之物賈一作價差為多少掲之省中它有名而無實者皆不用人以為便天下之吏有定職而無定貟故選者常患其多而乆積吏縁以姦至公為之選而集者有不逾旬而去天下皆稱其平其遇事尤劇一有處字尤若簡而有餘及求知鄧州其治益以寛靜為本州遂無事先時有妖僧者以偽言誘民男女數百人徃徃晝夜為㑹凡六七年不廢公則取其首惡二人寘之法餘一不問民始知公法可畏而安於不苛南陽堰引湍水漑公田水之來逺而少能及民而堰勑列反墩破公議復召信臣故渠以罷鄧人歲役而以水與民大興學舍皆未就而卒始公來鄧食其廩者四十餘人或疑其多及其喪為之制服其治衣􅌨纔二婢至三從孤弟妹皆聚而食之卒之日廩無餘粟家無餘貲入哭其堂椸無新衣然平生一有好施宗族喜賔客談宴怡怡如也自少而仕凡三十年間自守不回而外亦不為甚異此其始終大節也一無也字下有昔太史公世稱其文善以多為少今予不能乃不暇具書公之事而特著其大者略書之噫公之事何多歟繁予文而不克究使公而壽且用極其材則凡今所書又有不暇書而又著其尤大者爾將葬其嗣子某來乞銘銘曰壽吾不知命繫其偶不俾其隆安歸其咎惟徳之明惟仁之茂惟力之爲而公之有資政殿學士尚書戸部侍郎簡肅薛公墓誌銘明道二年尚書禮部侍郎叅知政事河東公以疾告歸其政天子曰吾不可以數煩公乃詔優公不朝而使視事如故居歲中數以告乃得還第又數以告然後拜公爲資政殿學士戸部侍郎判尚書都省罷其政事景祐元年八月庚申公薨于家年六十有八贈兵部尚書公諱奎字宿蓺姓薛氏薛氏之先出於黄帝之後任姓任姓之别為十族薛者奚仲之始封也其後奚仲去遷邳而仲虺留居薛春秋之際以國見經而其子孫後以為氏此其譜也隋唐之間薛姓居河東者為最盛公絳州正平人也曽王父贈太保諱某大王父贈太傅諱某王父殿中丞贈太師諱某三世皆不顯而以公貴初太宗皇帝伐并州太師以䇿干行在不見用罷公生十餘歲已能屬文辭太師顧曰是必大吾門吾復何為乃不復事生業務施貸以賙鄕閭曰吾有子矣後何患後五十年公始佐今天子叅政事為世名臣如其言公為人敦篤忠烈果敢明逹初舉進士為州第一讓其里人王嚴而居其次於是鄕里皆稱之淳化三年再舉乃中授秘書省校書郎隰州軍事推官始至取州獄巳成書活冤者四人徙儀州推官士爭薦其能丁太夫人憂服除用薦者拜大理寺丞知興化軍莆田縣悉除故時王氏無名租莆田人至今以為徳遷殿中丞知河南長水縣徙知興州州舊鑄鐵錢用功多人以為苦公乃募民有力者弛其山使自為利而收其鐵租以鑄悉罷役者人用不勞遷太常博士御史中丞向敏中薦公材中御史就拜監察御史召爲殿中侍御史判三司都磨勘司賜緋衣銀魚出為陜西轉運副使坐舉人免官居數月通判陜府歲餘召還臺安撫河北稱旨改尚書户部貟外郎淮南轉運使江淮制置發運使開揚州河廢其三堰以便漕船歲以八百萬石食京師其後罕及其多轉吏部貟外郎丁太師憂去職不許居二歲入爲三司戸部副使與三司使李士衡爭事省中士衡扳時權貴人為助公拜户部郎中直昭文館出知延州遷吏部郎中入為龍圖閣待制知開封府遷右諌議大夫御史中丞契丹使蕭從順來朝是時莊獻明肅太后垂簾聽政從順舉止多不遜以謂南使至契丹者皆見太后遂請見之朝議患之未有以决公獨以理折之從順乃止而嫉公者讒其漏禁中語由是拜集賢院學士出知并州改知秦州秦州宿重兵兵甞慊食公為勤儉積畜教民水種歲中遷樞密直學士知益州而秦之餘粟積者三百萬征筭之衍者三十萬覈民舊隱田數百頃所得芻粟又十餘萬秦州之民與其蕃一作夷落數千人詣轉運使請留不果公在開封以嚴為治肅清京師京師之民至私以俚語目公且相戒曰是不可犯也囹圄為之數空而至今之人猶或目之及居蜀尤有善政民有得偽蜀時中書印者夜以錦囊掛之西門門一作閽者以白蜀人隨之者萬計皆恟恟一作詾詾出異語且觀公所為公顧主吏藏之略不取視民乃止老媪告其子不孝者子訴貧不能養公取俸錢與之曰用此為生以養母子遂相慈孝里冨人三女皆孤民或妄爭其産公析其貲為三為嫁其女於是人皆以公為仁恩蜀人喜亂而易揺公旣鎭以無事又能順其風俗從容宴樂及其臨事破姦發伏逆見隨決如逄蒙之射而方朔之占無一不中蜀人一作其後愛且畏之以比張尚書詠而不苛開封天子之畿益州蜀一都㑹皆世號尤難理者而公尤有名其猛寛之政前後異施可謂知其方矣入拜龍圖閣直學士權三司使遂拜叅知政事公入謝上曰先帝甞言卿可用吾今用卿矣公益感激自勵而素剛毅守節不苟合旣與政尤挺立無所牽隨然遂欲繩天下無細大一入於規矩徃徃不可其意則歸卧于家歎息憂愧輙不食家人笑其何必若此公曰吾慚不及古人而懼後世譏我也公甞使契丹與其君臣語而以論議服其坐中其後契丹使來必問公所在及聞已用乃皆喜曰是得人矣邊吏得諜者言契丹欲弃約舉兵上亟召大臣議或欲選將増兵公曰契丹畏誓而貪利且無隙以開其端其必不動不宜失持重之勢而使其可窺已而卒無事他日上顧公曰果如公言於是益重之明道二年莊獻明肅太后欲以天子衮冕見太廟臣下依違不決公獨爭之曰太后必若王服見祖宗若何而拜乎太后不能奪爲改他服太后崩上見羣臣泣曰太后疾不能言而猶數引其衣若有所屬何也公遽曰其在衮冕也然服之豈可見先帝乎上大悟卒以后服葬於是益以公為果可用也一無也字下有而不至乎大用終焉公先娶潘氏早卒後娶趙氏今封金城郡夫人子男一人直孺大理寺丞女五人長適故職方貟外郎張竒其次適故開封府士曹叅軍喬易從早亡次適太原王拱辰早亡次適廬陵歐陽脩次又適王氏公旣貴贈其曽祖而下三室曰太保太傳太師追封曽祖妣某氏某夫人祖妣某氏某夫人妣某氏某夫人公性孝慈雖在大位家人勤儉不知爲驕奢諸子㓜孤撫養不異平生所為文章四一作二十卷直而有氣如其為人五年某月某甲子其孤直孺奉其柩自京師葬于絳州以某年某月某甲子即事先期狀公之功行上之太常太常議曰謚法一徳不懈曰簡執心決斷曰肅今其狀應法乃謚曰簡肅銘曰薛夏之封以國為姓其後河東隋唐最盛公世載徳實河東人必大其門太師之云公之從事以難為易叅于大政不撓不牽屢決大議有言炳然公不為相告病還家賵賻之榮尚書是加公有敏徳焯其行事公有令名有司之謚事告之史謚傳子孫又刻銘章納于墓門贈尚書度支貟外郎張君墓誌銘君諱思字希聖青州人也曽祖諱庭實不仕祖諱昻贈尚書職方郎中父諱從化尚書駕部貟外郎贈秘書少監母河南縣太君朱氏君天禧四年舉進士及第爲濰州司理叅軍青州益都縣主簿開封府倉曹叅軍改秘書省著作佐郎知益都縣再遷秘書丞太常博士通判閬州權知興元府景祐四年九月十七日以疾卒于官享年六十有四君世以明經仕宦至君始爲辭章舉進士官雖卑事親能盡其養不知其禄之薄也退與妻子惡衣𬞞食無難色居親喪盡哀葬其家三十餘喪郷里稱其孝爲吏所至有能名京柬歲大飢所在盗賊起獨君所治益都無盗而賑䘏飢人比他縣尤多安撫使以為言詔書襃美在閬州治嘉陵江石隄民至今頼之君為博士時其弟愈猶為布衣君甞歎曰吾年四十有七始以進士及第今且老吾志其衰矣顧其三子曰是必大吾門因獨念其弟愈先君之所愛也乃欲致其仕以冀一子恩得以命其弟顧貧未能去禄仕毎以為恨巳而其子唐卿舉進士第一君聞之喜且泣曰吾志其就矣乃上書求致仕且欲官其弟愈未及而卒君娶王氏馮翊縣君後君二十二年以卒子男三人唐卿將作監丞通判陜府唐輔孟州濟源縣尉皆早卒唐民今爲秘書丞女二人長適屯田貟外郎任沆次早卒孫男二人曰危行果行孫女二人皆尚㓜君以子恩贈尚書度支貟外郎夫人王氏亦以子恩封長壽縣太君以嘉祐四年十月十二日葬君夫人于青州益都縣仁徳郷之南原銘曰張有世序是爲青人君治益都有政于民仕也四方昌其子孫終必返本斯之謂仁郷人之思封樹長存居士集卷第二十六熈寧三年秋七月男發等編定紹熈二年三月郡人孫謙益校正尹公墓銘滎陽此下一有二縣兩字及寢一作反寢朱生一作朱公佐公善此下一有政字謝公墓銘終始一作始終薛簡肅公墓銘後世譏我譏一作議, WYG: 碑}
