  - {type: variant, offset: 0, length: 250, content: 外集卷第十二歐陽文忠公集六十二碑銘漳一作鄣南縣君張氏墓誌銘右諫議大夫集賢院學士楊公諱大雅之夫人曰漳南縣君張氏父諱保衡官至太僕寺丞其先荆門大族劉守光亂幽州曽祖敏徙其家濟南之歷城而益盛夫人生二十有二歲歸楊氏十有五年生二男三女景徳三年十月十四日終于袁州之廨其子洎濬尚㓜能記其母及長聞其家與其外内宗姻之稱夫人者曰夫人生于冨族而柔明孝謹楊氏嘗世家公少孤貧始爲開封縣尉夫人入其門若素小家子事其姑視日時早暮氣節之寒暑飲食起居之當進與否者不少懈如此十五年如始歸凡楊氏之内宗與其外姻賔客之至者如豐家退視其禇空如惟恐人之, WYG: ''}
