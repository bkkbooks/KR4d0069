  - {type: variant, offset: 0, length: 4562, content: 居士集卷第三十七歐陽文忠公集三十七墓誌一十七首宗室皇從姪衛州防禦使遂國公墓誌銘惟遂昭𥙿公宗顔字希聖太宗皇帝之曽孫潞恭憲王元佐之孫鎭江軍節度使兼侍中郇國公允成之長子𥘉除西頭供奉官歷内殿崇班禮賔崇儀副使六宅使改左屯衛大將軍封州刺史遷左金吾衛大將軍領復州團練使左衛大將軍領郢州防禦使拜衛州防禦使公好學通王氏易喜爲詩藏書數萬卷性聦敏多能至於琴奕之藝佛老之說所學必通履行修謹未甞有過失每燕見侍上讀易賦詩數賜器幣詔書襃美甞召宴太清樓賦祼玉詩爲諸皇子第一上尤嘉賞賜繒綵二百叚有詩集十卷至和二年九月壬戌以疾薨享年四十有八𥘉其疾也上遣中貴人押國醫治之旣薨輟視朝一日勑有司具駕將視其喪以雨不克遣中貴人厚加賻䘏乃贈昭信軍節度使太常考行謚曰昭𥙿權厝于東法濟寺夫人太原郡君郭氏燕王從義之裔孫子男三人長曰仲連右千牛衛將軍次曰仲丹仲筠皆太子右内率府副率早卒女四人長適左侍禁潘若旦今亡次適内殿承制閤門祗候郭士選次一作其二一有亦字亡以嘉祐五年十月乙酉葬于河南永安縣銘曰學而通行益修中充實外譽優見於言帝所襃雖不克施於事斯可以銘諸幽皇從姪筠州團練使安陸侯墓誌銘安陸侯宗訥字行敏太宗皇帝之曽孫潞恭憲王元佐之孫鎭江軍節度使兼侍中郇國公允成之第二子𥘉除西頭供奉官歷内殿崇班承制改右千牛衛將軍領茂州刺史天子祀明堂推恩遷領筠州團練使至和元年八月癸卯以疾卒享年四十有六天子哀䘏贈安州觀察使追封安陸侯權厝於薦嚴佛寺嘉祐五年十月乙酉葬於河南永安縣夫人長樂郡君賈氏子男五人其二早卒次仲緘右千牛衛將軍二人尚㓜未名女八人長適右侍禁蔚世庸再適右侍禁郭昭簡今亡次適左班殿直劉起次適陳敦今亡次適王整次適董昭遜次適張經今亡次適程翼皆右班殿直最㓜入太和宫爲道士惟侯學知爲詩好義喜施性端謹能修容止進退有法未甞少懈銘曰思無邪容則莊蔚然有儀人所望學而不止乆愈彰銘昭厥美示不忘皇從姪右領軍衛大將軍博平侯墓誌銘惟太祖皇帝之長子曰吴懿王之曽孫右屯衛大將軍昌州團練使贈彰化軍節度使舒國公惟忠之孫萊州防禦使東萊侯從恪之第二子金紫光禄大夫檢校國子祭酒右領軍衛大將軍兼御史大夫輕車都尉天水郡開國侯世融字仲源㓜好學不驕冨貴以清節白勵尊重師友執經問道無倦色甞自銘其器物起居寢食視之喜爲詩工書亦通浮屠說平居一室蕭然終日無所營欲世咸知其賢𥘉爲殿直歷左右侍禁改太子右衛率府率遷右領軍衛將軍天子祀明堂推恩爲本衛大將軍當寳元康定間趙元昊叛西邊用兵侯率宗室七人詣闕自言願效用上深嘉獎至和二年七月癸未得疾神色怡然與諸昆弟談論不輟是日卒享年四十贈博州防禦使追封博平侯天子悲思不巳爲飛白字六曰世融好學忠孝以襃之夫人金城縣君王氏子男七人五早亡在者二人曰令晏右千牛衛將軍令箴太子右監門率府率女二人長適右班殿直王戡次早卒以嘉祐五年十月乙酉葬于某所銘曰冨貴不動其心生死不渝其色惟性之安惟學之力孰云不壽永昭厥德皇從姪康州刺史髙密侯墓誌銘惟髙密侯宗師字靖之太宗皇帝之曽孫潤恭靖王元份之孫濮王允讓之第七子明道元年爲右侍禁遷左侍禁改太子左清道率府副率累遷金紫光禄大夫檢校國子祭酒行太子左清道率府率兼侍御史騎都尉封天水縣開國男食邑三百户居三歳遷右監門衛將軍兼御史大夫轉勲上騎都尉進爵子加食邑三百户天子祀明堂推恩遷右領軍衛大將軍轉勲輕車都尉進爵伯加食邑三百户天子有事于南郊推恩轉勲上輕車都尉進爵侯加戸四百至和元年五月領康州刺史嘉祐元年十月甲子暴疾薨于家享年二十有九贈密州觀察使追封髙密侯惟侯沈靜寡言寛仁好學未甞有過失夫人濮陽郡君吴氏生男一人仲廪太子右内率府副率女三人尚㓜以嘉祐五年十月乙酉葬于河南永安縣銘曰好仁而静敏學而明雖不永年而垂令名卜安于此其固其寧皇從姪右監門衛將軍廣平侯墓誌銘廣平侯宗沔字上善太宗皇帝之曽孫潤恭靖王元份之孫濮王允讓之第二十子𥘉授銀青光禄大夫檢校國子祭酒行太子左監門率府率兼監察御史武騎尉遷太子左清道率府率兼侍御史轉勲上騎都尉天子祀明堂推恩遷左監門衛將軍轉勲輕車都尉天子有事于南郊推恩轉上輕車一有都尉二字天水縣開國男食邑三百戸明年二月甲辰以疾卒享年二十贈洺州防禦使追封廣平侯權厝于承天佛寺惟侯爲人明敏好學能爲文辭娶髙氏封仁壽縣君子男二人仲足仲霄皆太子右内率府副率早卒以嘉祐五年十月乙酉葬于河南永安縣銘曰性之明學有方壽不隆永以藏皇從姪右監門衛將軍墓誌銘太祖皇帝之長子曰吴懿王德昭之曽孫彰化軍節度使舒國公惟忠之孫萊州防禦使東萊侯從恪之子曰右監門衛將軍贈右武衛大將軍世衡字夏卿母曰平原郡夫人米氏世衡生早狐而平原夫人教之以學性沈敏自爲童兒不好弄旣長好學問通周易孟子喜爲詩暇則學射法而已在諸昆弟爲最㓜而尤以孝悌見稱𥘉補殿直改太子右衛副率天子祀明堂推恩拜右監門衛將軍累遷至金紫光禄大夫檢校國子祭酒兼御史大夫柱國天水縣開國伯食邑九百戸嘉祐四年六月丙寅以疾卒享年三十有一娶王氏太原縣君子男二人令展令持皆率府副率早卒女一人尚㓜嘉祐五年十月乙酉葬于河南永安縣銘曰學問以爲文孝悌以爲夲其華巳榮而實斯殞銘以藏之以昭其韞皇從孫右屯衛大將軍武當侯墓誌銘惟武當侯世宣吴懿王德昭之曽孫彰國軍節度使舒國公惟忠之孫武勝軍節度觀察留後韓國公從藹之子母曰太寧郡君慕容氏惟侯生於冨貴而不習爲驕侈少好學喜購古書竒字遇人卑恭事親孝悌累官至左題目作右屯衛大將軍嘉祐三年五月己卯以疾卒享年三十有六𥘉娶天水縣君王氏再娶金城縣君張氏子男六人長曰令鐸左千牛衛將軍次曰令進令禱令愔皆太子右内率府副率其二㓜未名以嘉祐五年十月乙酉葬于河南永安縣以天水縣君祔焉銘曰孝行之夲謙德之恭壽胡不隆閟此幽宫安陸侯夫人長樂郡君賈氏墓誌銘夫人姓賈氏曽祖廷瓌累贈左神武大將軍祖官至四方館使昭州團練使父德滋前左班殿直夫人以選歸于安陸侯宗訥至和元年五月乙卯以疾卒享年三十有六權厝于薦嚴佛寺以嘉祐五年十月乙酉祔安陸侯以葬銘曰配德惟諧卜藏斯吉其固其安于此室雍國太夫人馮氏墓誌銘雍國太夫人馮氏者皇兄右千牛衛大將軍贈永清軍節度觀察留後臨汝侯惟和之夫人襄州觀察使襄陽侯從誨寧國軍節度觀察留後宣城公從審之母曽祖暉靜難軍節度使衛王祖繼業定國軍節度使贈中書令父訥西上閤門使馮氏自衛王仍世守西邊有功載國史夫人生將家孝謹柔明動不踰禮以世族選爲臨汝侯詺夲有公字之配居十有二年而臨汝侯卒夫人居喪哀毀眞宗嘉其行特封譚國夫人以襃寵之夫人益自勵衣服飲食務爲儉薄居處嚴潔未甞下堂雖家人亦罕得見喜誦浮屠書皇祐五年正月癸亥以疾卒享年六十有七追封雍國太夫人子男二人從誨從審也女五人長適東頭供奉官宋宗顔次早亡次以疾廢爲比丘尼次適供備庫使姚宗望次適西頭供奉官宋從政孫男十一人世逺世儀皆大將軍世英世堅世及世開世卿世肱皆衛將軍世禕世緫世仍皆太子率府率重孫九人令駔令晃一作冕皆率府率令戈令甲令績一作纉令課令浮令收令僉皆副率以嘉祐五年十月乙酉合葬于臨汝侯之墓銘曰世髙勲選賢配進國爵襃行懿加大名由子貴壽考隆銘不墜東萊侯夫人平原郡夫人米氏墓誌銘皇從姪故萊州防禦使東萊侯從恪之夫人曰平原郡夫人米氏贈太子太師承德之曽孫横海軍節度使信之孫内殿崇班閤門祗候繼豐之女夫人年十七選配東萊侯累封平陽郡君子男六人長曰世安贈左一作右驍衛大將軍次曰世融贈博州防禦使追封博平侯次曰世昌右屯衛大將軍次曰世規右監門衛將軍次曰世猷太子右監門率府率早亡次曰世衡贈左武衛大將軍女三人長適左侍禁劉希立次適内殿承制王說次適右侍禁陳宗誨孫男十二人皆諸衛將軍夫人將家子有賢行東萊之亡諸孤尚㓜夫人治家訓子皆有法皇祐元年二月癸酉以疾卒享年五十有一追封平原郡夫人權厝于奉先佛寺以嘉祐五年十月乙酉合葬于東萊侯之墓銘曰門以勲髙配以賢求撫孤教善内德以優永揚其懿以閟諸幽韓國公夫人太寧郡君慕容氏墓誌銘夫人姓慕容氏贈太保章之曽孫贈中書令河南郡王延釗之孫太子率府率德正之女河南王有功於國爲時名臣夫人以賢女選爲韓國公從藹之配韓公彰化軍節度使舒公之子事其親以孝而夫人承其夫以順事其舅姑以禮下其妾媵以仁撫其子無嫡庶以均故其内外宗姻莫不稱其能封太寧郡君至和元年正月戊寅以疾卒享年五十有六子男十人長曰世豐贈右驍衛大將軍次曰世宣贈均州防禦使次曰世凖世雄世本世綱皆諸衛將軍次曰世岳世瓞世庸一作膺皆太子率府副率女三人長適髙允懷次適張承訓次適鄭偃皆右侍禁餘皆㓜以嘉祐五年十月乙酉舉夫人之喪合葬于韓公之墓銘曰承夫以順爲婦以勤逮下以恩愛子以均以成厥家以播其芬右監門衛將軍夫人李氏墓誌銘惟右監門衛將軍世堅之配曰李氏天雄軍節度使同中書門下平章事兼侍中贈中書令隴西郡王繼勲之曽孫崇儀副使守微之孫東頭供奉官舜舉之女惟李氏世爲將家功在國史餘烈遺德是生賢女夫人年十有五以選配世堅惟孝與順以事其親以佐其夫惟禮與義以正其躬以全其節歸于世堅也凡若干年而世堅卒無子夫人自誓不嫁宗族敦迫其守益堅凡七年當皇祐五年六月庚辰以疾卒于寢享年二十有三以嘉祐五年十月乙酉合葬于世堅之墓銘曰婦德之休惟先順柔及其大節有不可奪刻銘幽隂以永芳烈右監門衛將軍夫人金堂縣君錢氏墓誌銘夫人姓錢氏餘杭人也曽祖吴越忠懿王俶祖衛州防禦使惟渲父文思副使象輿錢氏自五代以來尊中國效臣順世稱其忠子孫蕃昌至今不衰夫人生於盛族孝謹勤儉性巧慧喜字書年十有四以選爲右監門衛將軍世準之配封金堂縣君嘉祐二年九月庚子以疾卒享年二十有八子男二人令令烜皆太子右内率府副率早亡女三人皆尚㓜以嘉祐五年十月乙酉葬于永安之原銘曰生冝其室殁安其藏銘昭其昧以永不忘右監門衛將軍夫人武昌縣君郭氏墓誌銘并序夫人姓郭氏曽祖恕右千牛衛將軍祖遵式洛苑使父昭晦一作誨左侍禁夫人聦明孝謹能讀書史善書畫喜浮圖之說以選歸于皇從孫右監門衛將軍世覃封武昌縣君子男四人長曰令辟太子右内率府副率餘皆㓜未賜名夫人以嘉祐二年十一月丁亥以疾卒享年三十有三權厝于奉先佛寺以嘉祐五年十月乙酉葬于永安之原銘曰行之修學以明德施於内銘告諸㝠右監門衛將軍夫人東陽縣君鄭氏墓誌銘夫人姓鄭氏曽祖誠贈定國軍節度使祖崇勲贈左屯衛將軍父從範内殿崇班夫人以選歸于皇從孫右監門衛將軍世智封東陽縣君生子男三人長曰令唐太子右内率府副率早卒次未名卒次令祈太子右内率府副率夫人爲人孝謹節儉喜誦浮圖書至和元年八月戊戌以疾卒享年十有九以嘉祐五年十月乙酉葬于永安之原銘曰儉以行其躬孝以事其親以是貽其子孫右屯衛將軍夫人永安縣君慕容氏墓誌銘永安縣君慕容氏者皇從孫贈右屯衛大將軍仲謇之配也曽祖隠贈左千牛衛大將軍祖興􅉑州團練使父守恩左班殿直年十七選爲屯衛之配有子二人長曰士潔太子右監門衛率府率早卒次士彠太子右内率府副率女一人尚㓜夫人以嘉祐三年三月丙戌以疾卒享年二十有五嘉祐五年十月乙酉合葬于仲謇之墓銘曰選以賢配封以夫貴殁而從之安此位右監門衛將軍夫人周氏墓誌銘并序皇從孫右監門衛將軍世哲之夫人曰永安縣君周氏曽祖景左領軍衛上將軍累贈尚書令祖瑩天平軍節度使宣徽南院使父普西染院使夫人以慶曆五年選爲監門之配勤孝柔仁克有婦道生一男曰太子右内率府率令儇女三人皆㓜夫人以嘉祐二年二月庚午以疾卒享年二十有九五年十月乙酉葬于河南永安之原銘曰山川旣佳日月惟吉惟永其安其藏其密居士集卷第三十七熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益挍正皇從姪遂國公墓銘諸皇子疑賈氏墓銘祖官至闕其名慕容氏墓銘子男十人今山書九人世庸注一作世膺恐在十人之數國朝故事宗室宗婦𥘉亡皆權櫕京城之僧寺遇葬尊屬乃啓殯從行嘉祐五年十月三十日葬皇兄濮安懿王以向傳式爲護葬使於是分命近屬宗懿隨護三祖下宗室宗婦同時祔于西京及汝州路例差翰林學士分撰誌銘此卷合附内制集今從其舊不敢易, WYG: 予}
