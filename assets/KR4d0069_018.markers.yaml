  - {type: variant, offset: 0, length: 766, content: 外集卷第十八歐陽文忠公集六十八書三與謝景山書脩頓首再拜景山十二兄法曹昨送馬人還得所示書并古瓦硯歌一軸近著詩文又三軸不勝欣喜景山留滯州縣行年四十獨能異其少時儁逸之氣就於法度根蔕一作柢前古作爲文章一下其筆遂髙於人乃知駔駿之馬奔星覆駕及節之鑾和以駕五輅而行於大道則非常馬之所及也古人久困不得其志則多躁憤佯狂失其常節接輿屈原之輩是也景山愈困愈刻意又能恬一作安然習於聖人之道賢於古人逺矣某嘗自負平生不妄許人之交而所交必得天下之賢才今景山若此於吾之交有光所以某益得自負也幸甚幸甚與君謨徃還書不如此何以發明然何必懼人之多見也若欲衒長而恥短則是有爭心於其中有爭心則意不在於謀道也荀卿曰有爭氣者不可與辯此之謂也然君謨既規景山之短不當以示人彼以示人景山不當責之而欲自蔽也願試思之此縣常有人入京頻得書信徃還今者兹人入京作書多未能子細夏熱千萬自愛答李淑内翰書脩啓脩違去門館今三年矣罪棄之迹不敢自齒於人是以雖有誠心饑渇之勤而奏記通問彌時曠闕惟恃憐憫寬而置之今月六日郵中蒙賜手書加以存恤憔悴之意感恱何勝幸甚幸甚問及五代紀傳脩曩在京師不能自閑輒欲妄作幸因餘論發於教誘假以文字力欲奨成不幸中閒自罹咎責爾来三年陸走三千水行萬里勤職𥙷過營私養親偷其暇時不敢自廢收拾綴緝粗若有成然其銓次去取湏有義例論議褒貶此豈易當故雖編摭甫就而首尾顛倒未有卷第當更資指授終而成之庶㡬可就也蕞爾之質列一作限於囚拘瞻望門墻豈任私恨答孫正之侔第一書脩白孫生足下丁元珍書至辱所示書及雜文二篇辭博義髙而不違於道甚喜甚喜元珍言足下好古自守不妄接人雖居郷閭罕識其面其特立如此而乃越千里以書見及若某者何以當之豈足下好忽近而慕逺邪得非以道見謀不爲逺近親疎然者也僕愚學不足以自立而氣力不足以動人而言不見信於世不知足下何爲而見及今又豈足下所取信者丁元珍愛我而過譽邪學者不謀道久矣然道固不茀廢而聖人之書如日月卓, WYG: ''}
  - {type: indent, offset: 6, content: 　, id: KR4d0069_krp_018-bkkind1}
