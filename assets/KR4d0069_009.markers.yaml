  - {type: variant, offset: 53, length: 35324, content: 後世之治天下未嘗不取法扵三代者以其推本末而知所先後也三王之為治也以理數均天下以爵地等邦國以井田域民以職事任官天下有定數邦國有定制民有定業官有定職使下之共上勤而不困上之治下簡而不勞財足扵用而可以備天災也兵足以禦患而不至扵為患也凡此具矣然後飾禮樂興仁義以教道之是以其政易行其民易使風俗淳厚而王道成矣雖有荒子孱孫繼之猶七八百歲而後巳夫三王之爲治豈有異扵人㢤財必取扵民官必養扵禄禁暴必以兵防民必以刑與後世之治者大抵同也然後世常多亂敗而三王獨能安全者何也三王善推本末知所先後而爲之有條理後之有天下者孰不欲安且治乎用心益勞而政益不就諰諰然常恐亂敗及之而輙以至焉者何也以其不推本末不知先後而扵今之務衆矣所當先者五也其二者有司之所知其三者則未之思也足天下之用莫先乎財繫天下之安危莫先乎兵此有司之所知也然財豐矣取之無限而用之無度則下益屈而上益勞兵強矣而不知所以用之則兵驕而生禍所以節財用兵者莫先乎立制制巳具備兵已可使財已足用所以共守之者莫先乎任人是故均財而節兵立法以制之任賢以守法尊名以厲賢此五者相為用有天下者之常務當今之世所先而執事者之所忽也今四海之内非有亂也上之政令非有暴也天時水旱非有大故也君臣上下非不和也以晏然至廣之天下無一間隙之端而南夷敢殺天子之命吏西夷敢有崛彊之王北夷敢有抗禮之帝者何也生齒之數日益衆土地之産日益廣公家之用日益急四夷不服中國不尊天下不實者何也以五者之不備故也請試言其一二方今農之趣耕可謂勞矣工商取利乎山澤可謂勤矣上之征賦榷易商利之臣可謂纎悉而無遺矣然一遇水旱如明道景祐之間則天下公私乏絶是無事之世民無一歲之備而國無數年之儲也以此知財之不足也古之善用兵者可使之赴水火今廂禁之軍有司不敢役必不得已而暫用之則謂之借倩彼兵相謂曰官倩我而官之文符亦曰倩夫賞者所以酬勞也今以大禮之故不勞之賞三年而一徧所費八九百萬有司不敢緩月日之期兵之得賞不以無功知媿乃稱多量少比好嫌惡小不如意則羣聚而呼持梃欲擊天子之大吏無事之時其猶若此以此知兵驕也夫財用悉出而猶不足者以無定數也以疑兵之敢驕者以用之未得其術以此知制之不立也夫財匱兵驕法制未一而莫有奮然忘身許國者以此知不任人也不任人者非無人也彼或挾材藴知特以時方惡人之好名各蔵畜收歛不敢奮露惟恐近扵名以犯時人所惡是以人人變賢為愚愚者無所責賢者𬒳譏疾遂使天下之事将弛廢而莫敢出力以為之此不尚名之弊者天下之最大患也故曰五者之皆廢也前日五代之亂可謂極矣五十三年之間易五姓十三君而亡國𬒳弑者八長者不過十餘歲甚者三四歳而亡夫五代之主豈皆愚者邪其心豈樂禍亂而不欲為久安之計乎顧其力有不䏻為者時也當是時也東有汾晉西有岐蜀北有強胡南有江淮閩廣呉越荆潭天下分為十三四四靣環之以至狹之中國又有叛将强臣割而據之其君天下者類皆為國日淺威徳未洽強君武主力而為之僅以自守不幸孱子懦孫不過一再傳而復亂敗是以養兵如兒子之啖虎狼猶恐不為用尚何敢制以殘弊之民人贍無貲之征賦頭㑹箕歛猶恐不足尚何曰節財以冨民天下之勢方若弊廬𥙷其奥則隅壞整其桷則棟傾枝撐扶持苟存而巳尚何暇法象規圜矩方而為制度乎是以兵無制用無節國家無法度一切苟且而巳今宋之為宋八十年矣外平僣亂無抗敵之國内削方鎮無强叛之臣天下為一海内晏然為國不為不久天下不為不廣也語曰長䄂善舞多錢善賈言有資者其為易也方今承三聖之基業据萬乗之尊名以有四海一家之天下盡大禹貢賦之地莫不内輸惟上之所取不可謂乏財六尺之卒荷戈勝甲力彀五石之弩彎二石之弓者數百萬惟上制而令之不可謂乏兵中外之官居職者數千員官三班吏部常積者又數百三歲一詔布衣而應詔者萬餘人試禮部者七八千惟上之擇不可謂乏賢民不見兵革者㡬四十年矣外振兵武攘夷狄内修法度興徳化惟上之所為不可謂無暇以天子之慈聖仁儉得一二明智之臣相與而謀之天下積聚可如文景之富制禮作樂可如成周之盛奮發威烈以耀名譽可如漢武帝唐太宗之顯赫論道徳可興堯舜之治然而財不足用於上而下已弊兵不足威於外而敢驕扵内制度不可爲萬世法而日益叢雜一切苟且不異五代之時此甚可嘆也是所謂居得致之位當可致之時又有能致之資然誰憚而久不爲乎正統論七首此七論公後刪爲三篇巳載居士集第十六卷今所載蓋𥘉本也原正綂論傳曰君子大居正又曰王者大一統正者所以正天下之不正也統者所以合天下之不一也由不正與不一然後正統之論作堯舜之相傳三代之相代或以至公或以大義皆得天下之正合天下扵一是以君子不論也其帝王之理得而始終之分明故也及後世之亂僣偽興而盗竊作由是有居其正而不能合天下扵一者周平王之有呉徐是也有合天下扵一而不得居其正者前世謂秦爲閏是也由是正統之論興焉自漢而下至于西晉又推而下之爲宋齊梁陳自唐而上至扵後魏又推而上之則爲夷狄其帝王之理舛而始終之際不明由是學者疑焉而是非不公非其不公盖其是非之難也自周之亡迄于顯徳實千有一百一十二年之間或理或亂或取或傳或分或合其理不能一槩是以論者扵此而難也大抵其可疑之際有四其不同之說有三此論者之所病也何謂可疑之際周秦之際也漢魏之際也東晉後魏之際也朱梁後唐之際也秦親得周而一天下其迹無異禹湯而論者黜之其可疑一也王莽得漢而天下一莽不自終其身而漢復興論者曰偽冝也魏得漢而天下三分論者曰正綂其可疑二也以東晉承西晉則無終以周隋承元魏則無始其可疑三也梁之取唐無異魏晉而梁為偽劉備漢之後裔以不䏻一天下而自别稱蜀不得正綂可也後唐非李氏未嘗一天下而正綂得之其可疑四也何謂不同之說三有昧者之論有自私之論有因人之論正綂之說肇扵誰乎始扵春秋之作也當東周之遷王室微弱呉徐並僣天下三王而天子號令不䏻加扵諸侯其詩下同扵列國天下之人莫知正綂仲尼以為周平雖始衰之王而正綂在周也乃作春秋自平王以下常以推尊周室明正綂之所在故書王以加正月而繩諸侯王人雖微必加扵上諸侯雖大不與專封以天加王而别吴楚刺譏襃貶一以周法凡其用意無不在扵尊周而後之學者不曉其旨遂曰黜周而王魯或曰起魯隱之不正或曰起讓國之賢君泥其說扵私魯殊不知聖人之意在扵尊周以周之正而綂諸侯也至秦之帝既非至公大義因悖棄先王之道而自為五勝之說漢興諸儒旣不明春秋正綂之旨又習秦世不經之說乃欲尊漢而黜秦無所據依遂為三統五運之論詆秦為閏而黜之夫漢所以有天下者以至公大義而起也而說者直曰以火徳當天綂而已甚者至引虵龍之妖以為左驗至扵王莽魏晉直用五行相勝而已故曰昧者之論也自西晉之滅而南為東晉宋齊梁陳北為後魏後周隋私東晉者曰隋得陳然後天下一則推其綂曰晉宋齊梁陳隋私後魏者曰綂必有所授則正其綂曰唐授之隋隋授之後周後周授之後魏至其甚相戾也則為南史者詆北曰虜為北史者詆南曰夷故曰自私之論也夫梁之取唐無異魏晉之取也魏晉得為正則梁亦正矣而獨曰偽何㢤以有後唐故也彼後唐者初與梁為世仇及唐之滅欲借唐為名託大義以窺天下則不得不指梁為偽而為唐討賊也而晉漢承之遂因而不改故曰因人之論也以不同之論扵可疑之際是以是非相攻而罕得其當也易曰天下之動正夫一夫帝王之綂不容有二而論者如此然搢紳先生未嘗有是正之者豈其興廢之際治亂之本難言歟自春秋之後述者多焉其通古今明綂類者希矣司馬子長列序帝王而項羽亦爲本紀此豈可法邪文中子作元經欲斷南北之疑也絶宋扵元徽五年進魏扵大和元年是絶宋不得其終進魏不得其始夫以子長之博通王氏之好學而有不至之論是果難言歟若夫推天下之至公據天下之大義究其興廢迹其本未辨其可疑之際則不同之論息而正綂明矣明正綂論凡為正綂之論者皆欲相承而不絶至其斷而不接則猥以假人而續之是以其論曲而不通也夫居天下之正合天下扵一斯正綂矣堯舜三代秦漢晉唐天下雖不一而居得其正猶曰天下當正扵吾而一斯謂之正綂可矣東周魏五代始雖不得其正卒能合天下扵一夫一天下而居其上則是天下之君矣斯謂之正綂可矣如隋是也天下大亂其上無君僣竊並興正綂無屬當是之時奮然而起並争乎天下東晉後魏有功者強有徳者王威一作盛澤皆𬒳于生民號令皆加乎當世幸而以大并小以強兼弱遂合天下扵一則大且強者謂之正綂猶有說焉不幸而兩立不䏻相兼考其迹則皆正較其義則均焉則正綂者将安與乎其或終始不得其正又不䏻合天下扵一則可謂之正綂乎不可也然則有不幸而丁其時則正綂有時而絶也夫所謂正綂者萬世大公之器也有得之者有不得之者而論者欲其不絶而猥以假人故曰曲而不通也或曰可絶則王者之史何以繫其年乎曰欲其不絶而猥以假人者由史之過也夫居今而知古書今世以信乎後世者史也天下有綂則為有綂書之天下無綂則為無綂書之然後史可法也昔周厲王之亂天下無君周公邵公共行其政十四年而後宣王立是周之綂嘗絶十四年而復續然為周史者記周邵之年謂之共和而太史公亦列之扵年表漢之中衰王莽篡位十有五年而敗是漢之綂嘗絶十五年而復續然為漢史者載其行事作王莽傳是則統之絶何害扵記事乎正綂萬世大公之器也史者一有司之職也以萬世大公之器假人而就一有司之記事惑亦甚矣夫正與綂之為名甚尊而重也堯舜三代之得此名者或以至公或以大義而得之也自秦漢而下䘮亂相尋其興廢之迹治亂之本或不由至公大義而起或由焉而功不克就是以正統屢絶而得之者少也正綂之說曰堯舜夏商周秦漢魏晉而絶由此而後天下大亂自東晉太建之元年止陳正明之三年凡二百餘年其始也有力者並起而爭因時者苟偷而假冒奮攘敗亂不可勝紀其畧可紀次者十六七家旣而以大并小以强兼弱久而稍相并合天下猶分為四東晉宋齊梁陳又自分為後梁而為二後魏後周隋又自分為東魏北齊而為二是四者皆不得其綂其後後周并北齊而授之隋隋始并後梁又并陳然後天下合為一而復得其綂故自隋開皇九年復正其綂曰隋唐梁後唐晉漢周夫秦自漢而下皆以為閏也今乃進而正之作秦論魏與呉蜀為三國陳壽不以魏綂二方而並為三志今乃黜二國進魏而綂之作魏論東晉後魏議者各以為正也今皆黜之作東晉論後魏論朱梁四代之所黜也今進而正之作梁論此所謂辨其可疑之際則不同之論息而正綂明者也秦論謂秦為閏者誰乎是不原本末之論也此漢儒之私說也其說有三不過曰滅棄禮樂用法嚴苛與其興也不當五徳之運而已五徳之說非聖人之言曰昧者之論詳之矣其二者特始皇帝之事爾然未原秦之本末也昔者堯舜夏商周秦皆出扵黄帝之苗裔其子孫相代而王堯傳扵舜舜傳扵禹夏之衰也湯代之王商之衰也周代之王周之衰也秦代之王其興也或以徳或以功大抵皆乗其弊而代之初夏世衰而桀為昬暴湯救其亂而起稍治諸侯而誅之其書曰湯征自葛是也其後卒以放桀而滅夏及商世衰而紂為昬暴周之文武救其亂而起亦治諸侯而誅之其詩所謂昆崇共宻是也其後卒攻紂而㓕商推秦之興其徳固有優劣而其迹豈有異乎秦之紀曰其先大業出扵顓頊之苗裔至孫伯翳佐禹治水有功唐虞之間賜姓嬴氏及非子為周養馬有功秦仲始為命大夫而襄公與立平王遂受𡵨豐之賜當是之時周衰固已久矣亂始扵穆王而繼以厲幽之禍平王東遷遂同列國而齊晉大侯魯衛同姓擅相攻伐共起而弱周非獨秦之暴也秦扵是時旣平犬夷因取周所賜𡵨豐之地而繆公以来始東侵晉地至于河盡滅諸戎拓國千里其後關東諸侯強僣者日益多周之國地日益蹙至無復天子之制特其號在爾秦昭㐮五十三年周之君臣稽首自歸扵秦至其後世遂滅諸侯而一一作有天下此本末之迹也其徳雖不足而其功力尚不優扵魏晉乎始秦之興務以力勝至扵始皇遂悖棄先王之典禮又自推水徳益任法而少恩其制度文為皆非古而自是此其所以見黜也夫始皇之不徳不過如桀紂桀紂不䏻廢夏商之綂則始皇未可廢秦也魏論新與魏皆取漢者新輙敗亡魏遂傳數世而為晉不幸東漢無賢子孫而魏為不討之讎今方黜新而進魏疑者以謂與姦而進惡此不可以不論也昔三代之興也皆以功徳或積數世而後王其亡也衰亂之迹亦積數世而至扵大壞不可復攴然後有起而代之者其興也皆以至公大義為心然成湯尚有慚徳伯夷叔齊至耻食周粟而餓死況其後世乎自秦以来興者以力故直較其迹之逆順功之成敗而已彼漢之徳自安和而始衰至桓靈而大壞其衰亂之迹積之數世無異三代之亡也故豪傑並起而爭而強者得之此直較其迹爾故魏之取漢無異漢之取秦而秦之取周也夫得正綂者漢也得漢者魏也得魏者晉也晉嘗綂天下矣推其本末而言之則魏進而正之不疑東晉論周遷而東天下遂不能一然仲尼作春秋區區扵尊周而明正綂之所在晉遷而東與周無異而今黜之何㢤是有說焉較其徳與迹而然爾周之始興其来也逺當其盛也瓜分一作規方天下為大小之國衆建諸侯以維王室定其名分使傳子孫而守之以為萬世之計及厲王之亂周室無君者十四年而天下諸侯不敢僥倖而窺周扵此然後見周徳之深而文武周公之作真聖人之業故雖天下無君而正綂猶在不得而改況一有乎字平王之遷國地雖蹙然周徳之在人者未厭而法制之臨人者未移平王以子繼父自西而東不出王畿之内西周之地八百里東周六百里以井田之法計之通為千里之方則正綂之在周也推其徳與迹可以不疑夫晉之為晉與夫一作乎周之為周也異矣其徳法之維天下者非有萬世之計聖人之業也直以其受魏之禪而合天下扵一推較其迹可以曰正而綂爾自惠帝之亂晉政巳亡愍懷之間晉如綫爾惟嗣君繼世推其迹曰正焉可也建興之亡晉扵是而絶矣夫周之東也以周而東晉之南也豈復以晉而南乎自愍帝死賊庭琅邪起江表位非嗣君正非繼世徒以晉之臣子有不忘晉之心發扵忠義而功不就可為傷巳若因而遂竊萬世大公之名其可得乎春秋之法君弑而賊不討則以為無臣子也使晉之臣子遭乎聖人適當春秋之責況欲以失國共立之君干天下之綂㢤夫道徳不足語矣直推其迹之如何爾若乃國巳滅矣以宗室子自立扵一方卒不能復天下扵一則晉之琅邪與夫後漢之劉備五代漢之劉崇何異備與崇未嘗爲正綂則東晉可知焉爾後魏論魏之興也自成帝毛至于聖武凡十二世而可紀扵文字又十一世至于昭成而建國改元畧具君臣之法幸遭衰亂之極得奮其力並爭乎中國又七世至于孝文而去夷即華易姓建都遂定天下之亂然後脩禮樂興制度而文之考其漸積之基其道徳雖不及扵三代而其爲功何異王者之興今特以其不能并晉末之一方以小不備而黜其大功不得承百王之綂而不疑焉者質諸聖人而可也今爲魏說者不過曰功多而國強爾此聖人有所不與也何以知之以春秋而知也春秋之時齊桓晉文可謂有功矣呉楚之僣迭強扵諸侯聖人扵書齊晉實與而文不與之以為功雖可襃而道不可以與也至書楚與吴或屢進之然不得過乎子爵則功與強聖人有所不取也或者以謂秦起夷狄以能滅周而一天下遂進之魏亦夷狄以不䏻滅晉宋而見黜是則因其成敗而毀譽之豈至公之篤論乎曰是不然也各扵其黨而已周之興也與秦之興其說固已詳之矣當魏之興也劉淵以匈奴慕容以鮮卑苻生以氐弋仲以羌赫連秃髪石勒季龍之徒皆四夷之雄其力不足者弱有餘者强其最強者苻堅之時自晉而外天下莫不為秦休兵革興學校庻㡬刑政之方不幸未㡬而敗亂其後一作又强者曰魏自江而北天下皆為魏矣幸而傳數世而後亂以是而言魏者纔優扵苻堅而已就使魏興世逺不可猶格之夷狄則不過為東晉比也是皆有志乎天下而功不就者前所謂不幸兩立而不䏻相并者故皆不得而進之者不得已也梁論黜梁為偽者其說有三一曰後唐之為唐猶後漢之為漢梁蓋新比也一曰梁雖改元即位而唐之正朔在李氏而不絶是梁扵唐未能絶而李氏復興一曰因後唐而不改因後唐者是謂因人之論固已辨矣其二者宜有說也夫後唐之自為唐也縁其賜姓而已唐之時賜姓李者多矣或同臣子之異心或懷四夷而縻之忠臣茂正思忠克用是也當唐之衰克用與梁並起而爭之梁以强而先得克用耻爭之不勝難忍臣敵一作服之慚不得不借唐以自託也後之議者胡謂而從之㢤其所以得為正綂者以其得梁而然也使梁且不滅同光之號不過扵河南則其為唐與昪璟等耳夫正朔者何王者所以加天下而同之扵一之號也昔周之東其政雖弱而周猶在也故仲尼以王加正而繩諸侯者幸周在也當唐之亡天祐虚名與唐俱絶尚安所寓扵天下㢤使幸而有忠唐之臣不忍去唐而自守雖不中扵事理或可善其誠心若李氏者果忠唐而不忍弃乎況扵唐亡託虚名者不獨李氏也王建稱之扵蜀楊行宻稱之扵呉李茂正亦稱之扵𡵨大抵不為梁屈者皆自託扵虚名也初梁祖奪昭宗扵岐遂劫而東改天復四年為天祐而克用與王建怒曰唐為朱氏奪矣天祐非唐號也遂不奉之但稱天復至八年自以為非復稱天祐此尤可笑者安得曰正朔在李氏乎夫論者何為疑者設也堯舜三代之終始較然著乎萬世而不疑固不待論而明也後世之有天下者帝王之理或舛而始終之際不明則不可以不疑故曰由不正與不一然後正綂之論興者也其徳不足以道矣推其迹而論之庻㡬不為無據云正綂辨上正綂曰綂天下而得其正故繫正焉統而不得其正者猶弗綂乎爾繼周而後帝王自髙其功徳自代綂而得其正者難乎其人㢤必不得已而加諸人漢唐之主乎曰甚㢤吾子之說其隘也以漢唐之盛烈由曰不得已而加之焉為魏晉之主則將柰何乎曰不然是烏得苟加諸人一簟食一瓢飲其義弗直而取諸人君子且從而惡之以天下之廣而𬒳乎太公之實苟非其人則闕之可巳必若曰應天而順人則繼周之後桀紂之惡常多而湯武之仁義未嘗等也若是其苟加諸人何㢤予以謂正綂之不常在人率與言神聖者相類必待擇人而後加焉是仁王義主不足貴而姦雄篡弑之臣得以濟也正綂辨下秦之裔罪暴扵桀莽煬方扵紂漢唐之主仗義而誅變以取天下其可謂之正綂歟猶未離乎憾也徳不及湯武秦之得天下也以力不以徳秦之亡仁義驅其人民以爭敵其任賢得人孰若漢唐之始也晉之承魏也以篡繼篡隋亦若是而徒禪云爾晉隋盗也或者以為正綂兹非誤歟魏以吴存至于晉而吴始滅或者又以魏為正統愈誤矣自後魏東晉至于周陳五代或以義或以不義皆不能并天下聖人不生而暴偽代興名與實自重久矣必待後世之明者斷焉斷而不以其勢捨漢唐我宋非正綂也時論原弊孟子曰養生送死王道之本管子曰倉廪實而知禮節故農者天下之本也而王政所由起也古之為國者未嘗敢忽而今之為吏者不然簿書聽㫁而已矣聞有道農之事則相與笑之曰鄙夫知賦歛移一作財用之為急不知務農為先者是未原為政之本末也知務農而不知節用以愛農是未盡務農之方也古之為政者上下相移用以濟下之用力者甚勤上之用物者有節民無遺力國不過費上愛其下下給其上使不相困三代之法皆如此而最備扵周周之法曰井牧其田十而一之一夫之力督之必盡其所任一日之用節之必量其所入一歳之耕供公與民食皆出其間而常有餘故三年而餘一年之備今乃不然耕者不復督其力用者不復計其出入一歳之耕供公僅足而民食不過數月甚者埸功甫畢簸糠麩而食秕稗或採橡實畜菜根以延冬春夫糠覈橡實孟子所謂狗彘之食也而卒歲之民不免食之不幸一水旱則相枕爲餓殍此甚可歎也夫三代之爲國公卿士庻之禄廪兵甲車牛之材用山川宗廟鬼神之供給未嘗闕也是皆出扵農而民之所耕不過今九州之地也歲之凶荒亦時時而有與今無以異今固盡有嚮時之地而制度無過扵三代者昔者用常有餘而今常不足何也其為術相反而然也昔者知務農又知節用今以不勤之農贍無節之用故也非徒不勤農又為衆弊以秏之非徒不量民力以為節一作己又直不量天力之所任也何謂衆弊有誘民之弊有兼并之弊有力役之弊請詳言之今坐華屋享美食而無事者曰浮圖之民仰衣食而養妻子者曰兵戎之民此在三代時南畝之民也今之議者以浮圖並周孔之事曰三教不可以去兵戎曰國備不可以去浮圖不可並周孔不言而易知請試言之國家自景徳罷兵三十三歲矣兵嘗經用者老死今盡而後来者未嘗聞金鼔識戰陣也生扵無事而飽扵衣食也其勢不得不驕惰今衛兵入宿不自持𬒳而使人持之禁兵給糧不自荷而雇人荷之其驕如此況肯冒辛苦以戰鬪乎前日西邊之吏如髙化軍齊宗舉兩用兵而一有兩字輙敗此其効也夫就使兵耐辛苦而䏻鬪戰惟秏農民為之可也柰何有為兵之虚名而其實驕惰無用之人也古之凡民長大壯徤者皆在南畝農隙則教之以戰今乃大異一遇凶歲則州郡吏以尺度量民之長大而試其壯徤者招之去為禁兵其次不及尺度而稍怯弱者籍之以為廂兵一作軍吏招人多者有賞而民方窮時爭投之故一經凶荒則所留在南畝者惟老弱也而吏方曰不收為兵則恐為盗噫苟知一時之不為盗而不知其終身驕惰而竊食也古之長大壯徤者任耕而老弱者㳺惰今之長大壯徤者㳺惰而老弱者留耕也何相反之甚邪然民盡力乎南畝者或不免乎狗彘之食而一去為僧兵則終身安佚而享豐腴則南畝之民不得不日減也故曰有誘民之弊者謂此也其耗之一端也古者計口而受田家給而人足井田旣壞而兼并乃興今大率一户之田及百頃者養客數十家其間用主牛而出已力者用已牛而事主田以分利者不過十餘户其餘皆出産租而僑居者曰浮客而有畬田夫此數十家者素非冨而畜積之家也其春秋神社㛰姻死葬之具又不幸遇凶荒與公家之事當其乏時嘗舉責一作債扵主人而後償一作責之息不兩倍則三倍及其成也出種與稅而後分之償三倍之息盡其所得或不䏻足其埸功朝畢而暮乏食則又舉之故冬春舉食則指麥扵夏而償麥償盡矣一無四字夏秋則指禾扵冬而償也似此數十家者常食三倍之物而一户常盡取百頃之利也夫主百頃而出稅賦者一户盡力而輸一户者數十家也就使國家有寛征薄賦之恩是徒益一家之幸而數十家者困苦常自如一作乏也故曰有兼并之弊者謂此也此亦耗之一端也民有幸而不役扵人能有田而自耕者下自二頃至一頃皆以等書扵籍而公役之多者為大役少者為小役至不勝則賤賣其田或逃而去故曰有力役之弊者謂此也此亦秏之一端也夫此三弊是其大端又有竒衺之民去為浮巧之工與夫兼并商賈之人為僣侈之費又有貪吏之誅求賦歛之無名其弊不可以盡舉也旣不勸之使勤又為衆弊以耗之大抵天下中民之士一作事富且一作與貴者化麤糲為精善是一人常食五人之食也為兵者養父母妻子而一作為計其饋運之費是一兵常食五農之食也為僧者養子弟而自豐食是一僧常食五農之食也貧民舉倍息而食者是一人常食二人三人之食也天下㡬何其不乏也何謂不量民力以為節方今量國用而取之民未嘗量民力而制國用也古者冡宰制國用量入以為出一歳之物三分之一以給公上一以給民食一以備凶荒今不先制乎國用而一切臨民而取之故有支移之賦有和糴之粟有入中之粟有和買之絹有雜料之物茶鹽山澤之利有榷有征制而不足則有司屢變其法以爭毫末之利用心益勞而益不足者何也制不先定而取之無量也何謂不量天力之所任此不知水旱之謂也夫隂陽在天地間騰降而相推不䏻無愆伏如人身之有血氣不能無疾病也故善醫者不能使人無疾病療之而已善為政者不能使歲無凶荒備之而巳堯湯大聖不能使無水旱而能備之者也古者豐年𥙷救之術三年耕必留一年之蓄是凡三歲期一歲以必災也此古之善知天者也今有司之調度用一作歲足一歲而已是期天歲歲不水旱也故曰不量天力之所任是以前二三歲連遭旱蝗而公私乏食是期天之無水旱卒而遇之無備故也夫井田什一之法不可復用扵今為計者莫若就民而為之制要在下者盡力而無耗弊上者量民而用有節則民與國庶㡬乎俱冨矣今士大夫方共修太平之基頗推務本以興農故輒原其弊而列之以俟興利除害者採扵有司也兵儲疑惟王建官各司其局雖有細大俾專董其權責其成功斯古制也𬒳堅執銳乃禆校之事若屯田積榖在委辦吏爾而漢末有田禾将軍屯田北邊魏興建典農中郎将唐建營田使副判官雖晉魏南北職未嘗闕國家弭獯戎之患包漢唐之境然而塞垣儲偫罔遵古憲俾仰給他州饋餉一作餫此外固無築室反耕典農營田之利儻遇凶荒未免艱食雖有轉運未免營田何嘗建明利害稍致倉廪羡餘但守空名曾無實効當今之議要在乎河北河東陜西戍兵之地各特置營田使副判官仍在不兼職若遇水潦行流之處廣植秔稻雖荒隙原田亦當墾闢播以五榖今河北保塞河東并汾關中涇陽悉有水地基址惟有鄴中西門豹漑田之迹未見興起得非後人務扵因循而無昔賢識邪不然何歷朝而下涇陂如是或曰亦嘗有人建議良以漑導之時瀕水之地恐害及民田由是而止斯乃腐儒之見爾非經逺之士也夫利害相隨古猶未免若利害相半憚扵改作猶可苟利七害三當湏擇地而行豈可以小害而妨大利㢤夫如是鄴中漑田之法若行關疑畎水衝民田秪百户妨閡而能漑灌千萬頃瘠土所收獲利益大豈止利七而害三亦嘗訪扵彼州人士僉曰漑田之迹湮廢兹久土斷力田者不諳其事殊不知官中他日就功但扵涇陽鄭白渠和雇水工及彼中負罪百姓悉可分配此地俾之開導民旣見之必倣傚矣又豈成功之難然後特置營田使副判官專董其役西北二邊不間水陸並放此分職何假飛芻輓粟率鍾致石坐困民力以供軍實㢤塞垣先王肇分九州制定五服必内諸侯而外夷狄姑務息民弗勤遠略其来也調戍兵以禦之其去也備戰具以守之修利隄防申嚴斥堠或来獻貢得以覊縻蓋聖人制禦戎之常道嚴尤所謂得其中䇿古今大槩在乎謹邊防守要害而已古之制塞垣也與今尤異漢唐之世東自遼海碣石榆關漁陽盧龍飛狐鴈門雲中馬邑定襄西抵五原朔方諸郡毎歲匈奴髙秋膠折塞上草衰控弦南牧陵犯漢境扵是守邊之臣防秋之士据險而出竒兵持重而待外冦近世晉髙祖建義并門得戎王為援旣已乃以幽薊山後諸郡為邪律之壽故今劃塞垣也自滄海乾寧雄霸順安廣信由中山拒并代自兹關東無復關險故契丹奄有幽陵遂絶古一作虎北之隘往来全師入冦徑度常山陵獵全魏澶淵之役以至飲馬扵河烝民不聊生矣非北一作索虜雄盛如此失扵險固然也今旣無山阜設險所可恃者惟夾峙壘道引河流固其復水為險濬之勢就其要害屯以銳兵兹亦護塞垣之一策也今廣信之西有鮑河中山之北有唐河盡可開決水勢修利陂塘或導自長河之下金山之北派于廣信安肅逹于保塞或包舉蒲隂入于陽城然後積水瀰漫横絶紫塞亦可謂險矣蒲隂陽城度其地勢今塞上之要衝先是胡馬将入冦于兹城駐牙帳數日伺漢兵之輕重或我師禦扞乃長驅南下我師旣出即戎人為全師歸重之地此所謂藉城險而資冦兵非中國之利今若修復雉堞完聚兵糓與諸城柵刁斗相聞鮑唐二水交流其下虜騎縱至無復投足之地又焉有擾擾之患今之議者方南北修好恐邊庭生事然而戎狄之心桀驁難信貪我珍幣蓄養銳兵伺吾人之顦顇乗邉境之間隙出乎不意因肆猖獗兹乃不圖豫備疆埸而偷取安逸弟弟相付貽後世深患復如何㢤代曾參答弟子書參白諸足下聞吾黨之士思夫子而莫得見也以有子之貌似夫子欲假設其位以夫子師之諸足下必其然乎否耶吾試為諸足下陳夫子之道以爲斷諸足下知天之有四時乎春䏻生物而不䏻長也夏䏻長之而不䏻成也秋能有成而不䏻斂也斂之者其在冬矣自生民以来有大聖徳居大聖位而作法以濟世者類不過八九三皇經始之五帝纉明之禹湯文武該洽之周公祖述之經始之者春也纉明之該洽之者夏也祖述之者秋也天恐斯文之中未有以折衷乃生吾夫子扵衰亂之世前聖之所未立者俾夫子立之前聖之所未作者俾夫子作之上規聖明下救淪壞垂之百王而不變稽之千古而不疑雖百周公百堯舜復出扵世亦無以過夫子也是夫子扵列聖有成歲之功也是列聖不䏻斂而夫子斂之也吾以謂夫子之道江漢以濯之秋陽以暴之皜皜乎不可尚已吾與諸足下奚所識知幸而生扵時得以登其門望其堂而傳其道以光榮其身吾與諸足下猶衆無名之星也夫子猶日月之明也以無名之星代日月之明雖積累萬數吾未見其可況一焉而巳乎諸足下柰何乃不察扵是也天則有一冬而諸足下有二冬乎苟有子升夫子之席而吾與諸足下趨進扵左右斂衣而立負牆而請當是時有子能勿愧乎吾有以知彼之必愧也吾儕有所問而不能答有所辨而不能㫁譁然而往黙然而来鏗然而叩寂然而應當是時有子能勿慚乎吾又知彼之必慙也昔者吾友子淵寔有聖人之徳不幸短命前夫子而死使子淵尚在而設之扵夫子之席吾猶恐天下之不吾信也足下以有子之道義孰與子淵徳明而仁備孰與子淵夫子稱而嘆之孰與子淵羣弟子服其爲人孰與子淵逹夫子之道而隣夫子之性孰與子淵是數者皆無一可而獨以其容貌之似而欲升師之席竊師之位不亦難乎夫容貌之似者非獨有子也陽虎亦似矣如欲其大似則當以陽虎為先奚先扵有子㢤諸足下果欲何耶復欲睹夫子之容乎復欲聞夫子之道乎如止欲睹夫子之容則圖之可也木之可也何必取弟子之似者以僣其稱而悖其位如必欲聞夫子之道不可以苟而已也且吾聞之師其道不必師其人師其人不必師其形如欲師其道則有夫子之六經在詩可以見夫子之心書可以知夫子之㫁禮可以明夫子之法樂可以逹夫子之徳易可以察夫子之性春秋可以存夫子之志是之弗務而假設以為尚此吾所以悼痛而不敢知也且昔夫子果何師㢤師堯舜者也師文王者也師周公者也惟曰師其道而巳未聞其假設而師之則似堯舜者似文王者似周公者終身而不得見矣苟不見其人則亦弗師其道乎夫麟之扵獸也鳯之扵鳥也出乎其類而䖏乎長者也不幸而麟以死鳯以亡則亦假設而為之乎諸足下盍姑止不然吾恐萬世之後完口者寡矣死而無知則已如其有知則子淵子路軰将瞋目流涕而有責扵足下也諸足下其思之不宣參白江鈿文海多以它人文為公所作其章章者筠州學記曾鞏文也綿本亦誤收察言論唐庚文也甚至元豐以後曁徽宗朝所下制詔亦有託公名者自當刪去惟京本英辭類槀似少偽妄而代曾參答弟子書不知何人之文與此卷兵儲塞垣兩論皆可疑削之恐無以解後来之惑姑留而著其說外集卷第九本論以教道道一作導而於一作而已立法以制之之一作財今四海三字上一有方字敢驕一作又驕原正綂論正綂之論作一作正統之論興焉其不一無其字其詩下同扵列國一作周之太師亦自其詩同列國仲尼以為至以加正月四十五字一作仲尼以周平雖始衰之王而正統在周也乃作春秋自平王始去推尊周室明正綂之所在内借魯史以託文又因隠公失正之君遂起元而明法故書王以加正月魯隱此下一有公字左驗一作其驗唐授之隋授一作受下司至其至字下一有扵字明正綂論其上一作其正則是天下之君矣斯謂之正綂可矣矣一作也相兼一作相并将安與乎此下注文一有東魏後魏是也六字可謂之正綂乎此下注文一有魏及五代是也六字篡位一作篡立正綂萬世大公之器也正統字下一有者字得之者少也一無也字正綂之說四字之上一有以其得之者少所以其為名甚尊而重也至乎不得巳則推其迹而進之二十八字復正一作後正秦論其徳一作其功徳夫始皇至廢秦也二十八字一作然自漢而下為正統者多矣其用徳之薄厚施政之寛猛雖有不同而其大體往往不能改秦也故自天子百官之稱號下至郡縣阡陌之制皆因秦舊而用之然則秦之改作若以徳而附之何害扵正綂也夫始皇之不徳不過如桀紂耳桀紂不能廢夏商之綂則始皇未可廢秦也三代之相傳而王也飾之禮樂文章而稱道其功徳使後世炳然悅慕其所為秦獨不然然又特惡儒生學士是以漢興學者尤醜詆之此豈大公之論耶漢之興也起扵亡徒而至皇帝非有三代漸積之徳非甚醜秦則不能見其興起之功昔周人道紂之罪多孔子尚疑其不至扵是矧漢儒之私說手然後遂惑其說而雷同者也後魏論迭强扵諸侯此下一有矣字有所不取也此下一有天地之生爲物也人以聦明而爲貴人之分四夷也中國以有禮義而爲貴故以其貴者治賤者爲順以賤者干貴者爲逆聖人之推與善之誠夷狄而慕中國則進之夫進夷狄扵中國幸矣遂以干帝王之綂其可乎八十八字苻堅此下脫當堅二字梁論胡謂而從之五字一作胡以從之慶曆四年京師刋宋文粹十五卷皆一時名公之古文正綂論七篇在焉盖公初本也外集此卷則公所自改者至居士集十七卷方爲定本今並存之使學者有考焉原弊贍無節贍一作賙今坐華屋今字下脫一夫字請試言之一作請試言兵戎之事髙化軍疑惟秅惟一作雖有支移之賦一作有賦有征塞垣斥堠一作斥候牙帳一作可汗帳我師禦扞此句疑有脫誤藉城險城一作賊奏議卷第九歐陽文忠公集一百五諌院論討蠻賊任人不一劄子慶曆四年臣甞患朝廷慮事不早及其臨事草草便行應急倉皇常多失誤昨湖南蠻賊𥘉起一作動自昇州差劉沆知潭州授龍圖閣學士令專了蠻事沆未到湖南又差楊畋作提刑又令專了蠻事畋未到續後又差周陵為轉運使令專了蠻事周陵差勑未到又自朝廷遣王絲安撫令專了蠻事王絲方在路又自淮南遣徐的往彼令專了蠻事不惟任人不一難責成功兼此數人一時到彼不相綂制几於事體見各不同使彼一方從誰則可若所遣皆是才者則用才不在一作必人多若遣不才雖多適足為害此臣所謂臨事倉皇應急草草之失也今劉沆自守方面不可動楊畋周陵自是本路不可動徐的於數人中最才又是朝廷最後差去可以專委責成其間惟有王絲一人在彼無用可先抽回近聞一作觀絲有奏請欲盡驅荆南土丁往彼捉殺臣曽謫官荆楚備知土丁子細若果如此則必與國家生患朝廷已不從之然絲處事可見矣若絲到彼黙然端坐並無所為一任徐的等擘畫則絲在彼何用自可召還若以其身是臺官出禀朝命耻以不才黙坐於中強有施為竊慮的等不能制絲又州縣畏絲是朝廷差去從其所見誤事必多一有臣字尚恐大臣有主張絲者遂非偏執曲庇於絲不欲中道召囬彰已知人之失護其不才之耻未肯抽囬即乞諭徐的專了賊事只令絲至一路州軍遍行安慰訖即速還庶不敗事取進止論湖南蠻賊可招不可殺劄子同前臣風聞楊畋近與蠻賊鬪敵殺得七八十人首級仍聞入彼巢穴奪其糧儲挫賊之鋒増我士氣畋之勇略固亦可嘉然朝廷謀慮事機冝思乆逺竊恐上下之心急於平賊聞此小捷便形虚喜不能鎭静外示輕脫其間二事尤合深思一曰不待成功便行厚賞二曰謂其可殺更不肯招苟或如此則計之大失而事之深害也今湖南捕賊者殺一人頭賞錢十千官軍利賞見平人盡殺平人驚懼盡起為盗除鄧和尚李花脚等數十一作大頭項外其餘隨大小成火者不可勝數今畋所擊只一洞所聚已二千餘人於二千人中殺七八十人是二十分之一其餘時暫鳥散必湏復集臣見自古蠻蜑為害者不聞盡殺湏是招降昨縁邵飾等失信於黄捉鬼遂恐更難招誘今若因畋小勝示以恩威正是天與招服之一有時字機不可失也若令畋自作意度招取大頭項者因此小勝傳布捷聲其餘諸處結集者分行招誘藉此聲勢必可盡降旬日之間湖南定矣若失此時漸向夏熱以我所病一作病暑之兵當彼慣習水土之賊小有敗衂則彼勢復堅不惟為害湖南必慮自此貽朝廷憂患今於未了之間便行厚賞則諸處廵檢捕賊官等見畋獲賞爭殺平人而畋等自恃因戰得功堅執不招之議朝廷亦恃畋小勝更無招輯之心上下失謀必成大患其楊畋等伏乞且降勑書獎諭授與事冝俟彼招安便行厚賞今湖南賊數雖多然首惡與本賊絶少其餘盡是枉遭殺戮逼脅爲盗之徒在於人情豈忍盡殺惟能全活人命多者則其功更大仍乞明說此意諭與楊畋其賞典乞少遲留庻合事體取進止再論湖南蠻賊冝早招降劄子同前臣風聞湖南蠻賊近日漸熾殺戮官吏鋒不可當新差揚畋銳於討擊與郭輔之異議不肯招降又王絲去時朝廷亦别無處分慮絲到彼與畋同謀盖蠻賊止可招携卒難剪撲而畋等急於展効恐失事機今深入而攻則山林險惡巢穴深逺議者皆知其不可若以兵外守待其出而擊之則又未見其利也盖以蠻所依山在衡州永州道州桂陽監之間四面皆可出冦若官兵守於東則彼出於西官兵守於南則彼出於北四面盡守則用兵太多分兵而邀之則兵寡易敗此進退未有可擊之便也今盤氏正蠻已爲鄧和尚黄捉鬼兄弟所誘其餘山民莫傜之類亦皆自起而爲盗竊聞常寜一縣殆無平民大小之盗一二百火推其致此之因云莫傜之俗衣服言語一類正蠻黄鄧𥘉起之時捕盗官吏急於討擊逢蠻便殺屢殺平人遂致莫傜驚惶至此以此而言則本無為盗之心固有可招之理然欲諸盗肯降必湏先得黄鄧昨邵飾等𥘉招黄捉鬼之時失於恩信致彼驚逃尋捕獲之斷其脚筋因而致死今鄧和尚等若指前事為戒計其必未輕降如云且招終恐難得必湏示以可信之事推以感動之恩若得黄鄧先降其餘指麾可定今深入而攻既不可待其出而擊之又不可且殺且招又不可以臣思之莫若罷兵曲赦示信推恩庶㡬招之可使聽命臣亦廣詢南方来者云我若推信彼不難招鄧和尚等大則希一班行其次不過殿侍足矣正蠻叛者得一團主之名亦足矣莫傜之類使安耕織而歲輸皮粟得為平民乃彼大幸不徒足志而已今若擊之不已則其為害愈深況漸近夏暑南方燀濕士卒不習水土湏慮死傷仍恐迫之太急則潭郴全邵諸寨向化之蠻皆誘脅而起則湖南一路可為國家之憂臣欲乞速令兩府大臣深究招殺之利害共思長䇿決定廟謀若遷延後時致彼猖熾不幸官吏頻遭殺害則朝廷之體難為屈法而招彼以其罪既多必恐不能自信則兵乆不解害未有涯伏望聖明斷之在早取進止論水洛城事宜乞保全劉滬等劄子慶暦四年臣近風聞狄青與劉滬争水洛城事枷禁滬等奏来竊以邊將不和用兵大患況狄青劉滬皆是可惜之人事體湏要兩全利害最難處置臣聞水洛城自曹瑋以来心知其利患於難得未暇經營今滬能得之則於滬之功不小於秦州之利極多昨韓琦等自西来聞有論奏非以水洛為不便但慮難得而難成今滬能得之又有成之之志正冝專委此事責其必成而狄青所見不同遂成舋隙其間利害臣請詳言國家近年邊兵屢敗常患大將無權今若更沮狄青釋放劉滬則不惟於狄青之意不足兼沿邊諸將皆挫其威此其不便一也臣聞劉滬經營水洛城之𥘉奮身展効不少先以力戰取勝然後誘而服從乃是党留諸族畏滬之威信今忽見滬先得罪帶枷入獄則新降生户豈不驚疑若使飜然復叛則今後邊臣以威信招誘諸族誰肯聽從不惟一作特水洛城更無可成之期兼沿邊生户永無可招之理此其不便二也自用兵以来諸將爲國立事者少此水洛城不惟自曹瑋以来未能得之亦聞韓琦近在秦州嘗欲經營而未暇今滬奮然力耳其功垂就而中道獲罪遂無所成則今後邊將誰肯為國家立事此其不便三也臣又聞水洛之戍雖能救援秦州而湏藉渭州應副今劉滬既與狄青異議縱使水洛築就他時萬一緩急狄青怒滬異巳又欲遂其偏見稍不應副則水洛必湏復失其不便四也縁此之故遂移青於别路則是因一小將移一部署此其不便五也此臣所謂利害甚多最難處置者也臣謂今冝遣一中使處分魚周詢等速令和解務要兩全必先宻諭狄青曰滬城水洛本有所禀非是擅為役衆築城不比行師之際滬見利堅執意在成功不可以違節制加罪滬冝釋放朝廷不欲直放恐挫卿之威卿自釋之使感卿惠若他時出師臨陣有違進退之命者任卿自行軍法然後宻諭滬曰汝違大將指揮自合有罪朝廷以汝於水洛展効望汝成功故諭青使赦汝責爾卒一作辦事以自贖俟水洛功就則又戒青不可因前曽異議堅執不修惟幸失之遂已偏見今後水洛緩急尤湏極力應副萬一小有踈失則是汝挾情故䧟之必有重責如此則水洛之利可成蕃户之恩信不失邊將立事者不懈大將之威不挫苟不如此未見其可盖罪滬既不可罷水洛城又不可沮狄青又不可事關利害伏望聖慮深思取進止再論水洛城事乞保全劉滬劄子同前臣伏見朝廷近為修水洛城事雖巳差魚周詢等就彼相度風聞周詢近有奏来為水洛蕃族見狄青枷取劉滬等因致驚搔周詢却乞將帶滬等往彼以此足驗劉滬能以恩信服彼一方朝廷必知水洛為利而不欲廢之非滬守之不可然滬與狄青尹洙已立同異難使共了此事臣謂必不得已寜移尹洙不可移滬尚慮議者必謂不可因小將而動大將今若但移洙而不動狄青即不是特移大將矣若却移路分更升差遣或召拜他官苟不類前後因事移替之人即不是因滬𬒳移矣如此則於洙無損於滬獲全其功於邊防利便三者皆獲其利若曲為尹洙狄青却将立功将校輕沮則其害有三大凡文武官常以類分武官常疑朝廷偏厚文臣假有二人相争實是武人理曲然武人亦不肯服但謂執政盡是文臣遞相黨護䡖沮武士况今滬與洙爭而滬實有功効其理不曲若曲罪劉滬則沿邊武臣盡皷怨怒其害一也自有西事以来朝廷擢用邊将極多能立功効者絶少惟范仲淹築大順城种世衡築青澗城滬築水洛耳臣亦聞三者惟滬尤爲艱辛是功不在二人之下今若曲加輕沮則今後武臣不肯爲朝廷作事其害二也滬若不在水洛則蕃族一作部恐他人不能綏撫一有蕃部二字别致生事則今後邊防永不能招緝蕃部一無此二字其害三也今三利三害其理甚明但得大臣公心不於尹洙曲有黨庇則不與邊防生患此繫國家利害甚大伏望聖意斷而行之取進止論陳留橋事乞黜御史王礪劄子同前臣伏覩朝廷近爲王堯臣吴育等争陳留橋事互說是非陛下欲盡至公特差臺官定奪而王礪小人不能上副聖意挾公徇私一作内挾私徇妄將小事張皇稱王堯臣與豪民有情弊誣奏慎鉞令兇吏潜行殺害及妄稱真宗皇帝朝移橋不便致民切齒等事及勘出事狀王堯臣元不曽受豪民請囑慎鉞亦不曽令小吏潜行殺害及據先朝日暦内真宗皇帝親諭王旦爲陳留橋損害舟船特令修換證驗得王礪所言悉是虚妄上惑聖聽頼陛下聖明慎於聽斷不便輕信其言别令吕覺根勘今既勘出事狀方明王礪不公伏以臺憲之職本要糺正紀綱而礪但務挾私欺罔天聽合行黜責其罪有四一曰謗黷先朝聖政謹按日暦書真宗皇帝親諭王旦移橋一事乃是先帝知民間利病移得此橋為便故史官書之以彰聖政為後世法今王礪却稱是真宗朝權臣受豪民獻賂移得此橋不便民間至今切齒若如王礪所說即是真宗誤信權臣移橋致民怨怒乃是當時闕政今國史書橋便利彰先帝一作朝聖政王礪言移橋不便是先朝闕政臣不知國朝舊史可信為復王礪之言可慿其虚妄謗黷之罪可誅一也二曰中傷平人使今後勞臣不勸臣見向前三司使不能擘畫錢糓至有強借豪民錢二十萬貫買天下官私物貨至稅果菜之類細碎刻剥自堯臣在三司不聞過外誅求而即今財用不至大闕亦聞南郊漸近諸事亦稍有備當此窘迫乏用一作人之時而能使民不加賦而國用粗足亦可謂勞能之臣方當責其辦事今因移一橋小事而王礪誣其與豪民有情致興大獄及至勘出並無情弊是王礪不䘏朝廷事體當此乏用一作人之際將能幹事之臣因小事妄加傷害其罪二也三曰誣奏平人爲殺人賊凡臺官言事許風聞者謂耳目不及之事即許風聞今王礪目見慎鉞所遣小吏别無武勇又無器仗而稱其有殺害之心及至勘出並無迹狀其罪三也四曰挾私希旨𥘉朝廷本爲省府互争别選不干礙官定奪王礪既吴育是舉主即合自陳乞别差官豈可謗黷先朝希合舉主且礪言慎鉞是堯臣所舉感惠必深今礪是吴育舉豈不懐感且吴育與王堯臣本無怨恨各爲論列本司公事所見異同乃是常事但王礪小人妄思迎合張皇欺誑其罪四也且王礪謗黷先朝聖政之罪若不重責則無以彰陛下孝治之明中傷堯臣若不重責則使勞能之臣不能安心展効其誣奏慎鉞遣吏殺害及挾私迎合舉主之罪若不重責則今後小人一作臣恣情妄作獄訟必多事繫朝廷之體臣忝諌諍不可不言其王礪伏乞重行貶黜取進止論王礪中傷善人乞行黜責劄子同前臣近有劄子并曽面奏為臺官王礪特被差委輙敢徇私妄言王堯臣因移橋别有情弊等事欺誑朝廷上頼陛下聖明再令推究勘得堯臣並無私曲已蒙聖恩釋放自王礪妄形彈奏羅織無事之人欲借國威以報私忿立朝之列人各自危及聞堯臣不䧟枉刑更蒙陛下恩釋中外之士稍復安心然小人在朝非國之利如礪善惡未辨尚可含容今既試之以事見其傾險之迹則豈可更令濫處臺憲中傷善人伏望聖慈早行黜責以戒在位傾邪之軰一作者兼亦使今後選用之人不敢尚辜委任別造過愆若礪不黜竊慮今後被差委者動皆作過則陛下無由使人此事所繫不細取進止四月庚戌王礪罷御史授太常博士通判鄧州論任人之體不可疑劄子同前臣近見淮南按察使邵飾奏為體量知潤州席平為政不治及不教閱兵士等朝廷以飾為未足信又下提刑司再行體量臣竊以轉運提刑俱領按察然朝廷寄任重者為轉運其次乃提刑爾今寄任重者言事反不信又質於其次者而決疑臣不知邵飾果是才與不才可信與不可信三字一作否如不才不可信則一路數十州事豈冝委之若果才而可信又何疑焉又不知為提刑者其才與飾優劣如何若才過於飾尚可取信萬一不才於飾見事相背却言席平為才邵飾合有罔上之罪矣若反以罪飾臣料朝廷必不肯行若捨飾與席平俱不問則善惡不辨是非不分況席平曽作臺官立朝無狀只令制勘亦不能了尋為御史中丞以不才奏罷朝廷兩府而下誰不識平其才與不才人人盡知何必更令一作待提刑體量然後為定今外議皆言執政大臣託以審慎為名其實不肯主事而當怨湏待言事者再三陳述使𬒳黜者知大臣迫於言者不得已而行只圖怨不歸已苟誠如此豈有念民疾苦澄清官吏之意哉若無此意一有只字是好疑不決則尤是朝廷任人之失自去年以為轉運使不察官吏特出詔書加以使名責其按察今按察使依禀詔書舉其本職又却疑而不聽今後朝廷命令誰肯信之凡任人之道要在不疑寜可艱於擇人不可輕任而不信若無賢不肖一例疑之則人各心䦨誰肯辦事今邵飾言一不才顯者所貴朝廷肯行然後部下振竦官吏畏服今反為朝廷不信却委别人則飾之使威誰肯信服飾亦慙見其下今後見事不若不為不獨邵飾一人臣竊聞諸處多有按察官吏皆為朝廷不行人各嗟慙以謂任以事權反加沮惑朝廷之意不可諭也伏望聖慈特勑其三字一作取邵飾所奏特與施行又令今後按察使奏人如不才老病灼然不疑者不必更委别官示以不信所貴不失任人之道而令臣下盡心取進正論與西賊大斤茶劄子同前臣伏覩昨者西賊来議通和朝廷許物數目不少内茶一色元計五萬斤縁中國茶法大斤小斤不同當𥘉擬議之時朝廷謀慮不審不曽明有指定斤數竊慮西賊通和之後湏要大斤若五萬斤大斤是三十萬小斤之數如此則金帛二十萬茶三十萬乃是五十萬物真宗時契丹大舉至澶州只用三十萬物三十年後乗國家用兵之際兩國交爭方添及五十萬今元昊一隅之敵一口便與五十萬物臣請略言為國家大患一兩事不知為國計者何以處之三十萬斤之茶自南方水陸二三千里方至西界當今民力困乏陛下不耻屈志就和本為休民息力若歳般輦不絶只此一物可使中國公私俱困此大患一也計元昊境土人民歳得三十萬茶其用已足然則兩榷埸捨茶之外湏至别將好物博易賊中無用之物其大患二也契丹常與中國為敵國指元昊為小邦若見元昊得物之數與彼同則湏更要増添何以應副不過云茶不比銀絹本是麤物則彼必湏亦要十數萬大斤中國大貨利止於茶鹽而已今西賊一歳二十萬斤北虜更一作又要三二十萬中國豈得不困此其大患三也昨與西賊議和之𥘉大臣急欲事就不顧國家利害唯恐許物不多及和議將成契丹語洩兩府方有悔和之色然許物已多不可追改今天幸有此一事尚可罷和臣乞陛下特召兩府大臣共議保得乆逺供給四夷中國不困則雖大斤不惜若其為患如臣所說不至妄言即乞早議定計取進止論西賊占延州侵地劄子慶暦四年臣竊聞元昊近於延州界上修築城壘強占侵地欲先得地然後議和故楊守素未來而占地之謀先發又聞邊將不肯力爭此事所繫利害甚大臣料賊意見朝廷累年用兵有敗無勝一旦計無所出厚以金帛買和知我將相無人便欲輕視中國一面邀求賂遺一靣侵占邊疆不惟驕賊之心難從實亦為國之害不細今若縱賊於侵地立起堡寨則延州四面更無捍蔽便為孤壘其一作而賊盡據要害之地他時有事延州不可保守若失延州則關中遂為賊有以此而言則所侵之地不可不爭伏況西賊議和事連北虜今人無愚智皆知和為不便但患國家許物巳多難為中悔若得别因他事猶可絶和何況此侵地是中國合爭之事豈可不争臣謂今欲急和而不顧利害者不過邊臣外憚於禦賊而内欲邀議和之功以希進用耳故不肯擊逐羌人力爭侵地盖小人無識只苟目前榮進之利不思國家乆逺之害是國家屈就通和只與邊臣爲一時進身之利而使社稷受無涯之患陛下爲社稷計豈不深思大臣爲社稷謀豈不極慮伏望聖慈遣一使往延州令龐籍力爭取昊賊先侵之地不令築城堡寨若縁此一事得絶和議則社稷之福也臣仍慮西賊来人尚有青鹽之說此事人人皆知不可許亦慮小人無識急於就和者尚陳鹽利以惑聖聦伏望聖慈不納浮議取進止奏議卷第九論麟州事冝劄子已見河東奏草全書中一乞罷鐡錢劄子同前論耕禁地劄子同前論礬務利害狀同前相度銅利狀同前右五篇此卷更不重出存其目以告来者論討蠻賊劄子若以其一作若其自以論湖南蠻賊劄子便形虚喜一作便謂兵勝因此一作因取廵檢捕賊官等一無檢字乞少一作冝少論水洛城事宜劄子枷禁滬等奏来一作枷送滬等徳頓軍釋放一作而釋党留諸族一作諸蕃族畏滬之威信一作畏滬之威信滬之信驚疑一作生疑邊臣一作將自用兵以来一作自陜西用兵應副一作芻糧之助其不便四也其字上脫一此字築城築字上一有且字可成一作圖其可一有也字再論水洛城劄子小將二字一作滬若却移此上一有洙字邊防利便一作邊防之體無不便黨護一作助武士一作人滬實有功效其理不曲一作滬實有功又有理不曲極多一作固多絶少一作殊少築水洛耳洛字下一有賊字艱辛一作勤是功一作而功不肯一作無復蕃族一作生聚别致别字上一有尚字黨庇一作顧慮論陳留橋事劄子爭陳留橋事橋字上一有移字亦聞一作又聞論任人之體劄子又令今後一無又令二字論大斤茶劄子大斤小斤一作大小斤所說一作所料居士集卷第九歐陽文忠公集九古詩三十首寄題劉著作羲叟家園效聖俞體嘉子治新園乃在太行谷山髙地苦寒當樹所冝木羣花媚春陽開落一何速凜凜心節竒惟應松與竹毋栽當暑槿寧種深秋菊菊死抱枯枝槿豔隨昬旭黃楊雖可愛南土氣常燠未知經雪霜果自保其緑顔色苟不衰始知根性足此外衆草花徒能恱凡目千金買姚黃慎勿同流俗西齋小飲贈别陜州沖卿學士分得黃字爲韻今日胡不樂衆賔㑹髙堂坐中瀛洲客新佩太守章豈無芳罇酒笑語共一觴亦有嘉一作佳菊叢新苞弄微黃所嗟時易晚節物巳凄涼羣鷺方盛集離鴻獨髙翔山川正揺落行李怯風霜君子樂爲政朝廷須儁良歸來紫微閣遺愛在甘棠奉答原甫九月八日見過㑹飲之作老大惜時節少年輕别離我歌君當和我酌君勿辭豔豔庭下菊與君吟繞之擷其黃金蘂泛此白玉巵君勿愛此花問君此何時秋風日益髙霜露漸離披芳歳忽已晚朱顔從此衰念君將捨我車馬去有期君行一何樂我意獨不怡飛兎不戀羣奔風誰能追老驥但伏櫪壯心良可悲予作歸鴈亭於滑州後十有五年梅公儀來守是邦因取余詩刻于石又以長韻見寄因以答之一作和滑州公儀龍圖歸鴈亭長句風吹城頭秋草黃仰見鳴鴈𥘉南翔秋草風吹春復緑南鴈北飛聲肅肅城下臺邊桃李蹊憶𥘉披荒手植之雪消冰解草木動因記鴻一作欲記南鴈將歸時爾來十載空遺迹飛鴈年年自南北臺傾餘址草荒涼樹老無花春寂歷東州太守詩尤美組織文章爛如綺長篇大句琢方石一日都城傳百紙我思古人無不然慷慨一作感槩功名垂百年沉碑身後念陵谷把酒泣下悲山川一時留賞雖邂逅後世傳之因不朽寄題洛陽致政張少卿靜居堂洛人皆種花花發有時闌君家獨種玉種玉産琅玕子弟守家法名聲聳朝端歳時歸拜慶閭里亦相歡西臺有道氣自少服靈丸春酒養眉壽童顔如渥丹清談不倦客妙思喜揮翰壯也巳吏隱興餘方掛冠臨風想髙誼懷禄愧盤桓鬼車嘉祐六年秋九月二十有八日天愁無光月不出浮雲蔽天衆星没舉手嚮空如抹漆天昬地黒有一物不見其形但聞其聲其𥘉切切凄凄或髙或低乍似玉女調玉笙衆管參差而不齊旣而咿咿􅊯􅊯若軋若抽又如百兩江州車回輪轉軸聲啞嘔鳴機夜織錦江上羣鴈驚起蘆花洲吾謂此何聲初莫窮端由老婢撲燈呼兒曹云此怪鳥無疋儔其名爲鬼車夜載百鬼凌空遊其聲雖小身甚大翅如車輪排十頭凡鳥有一口其鳴巳啾啾此鳥十頭有十口口揷一舌連一一作十喉一口出一聲千聲百響更相酬昔時周公居東周猒聞此鳥憎若讎夜呼庭氏率其屬彎弧俾逐出九州射之三發不能中天遣天狗從空投自從狗嚙一頭落斷頸至今青血流爾來相距三千秋晝藏夜出如鵂鶹毎逢隂黒天外過乍見火光驚輙墮有時餘血下點汚烏卧反所遭之家家必破我聞此語驚且疑反祝疾飛無我禍我思天地何茫茫百物巨細理莫詳吉凶在人不在物一蛇兩頭反爲祥却呼老婢炷燈火捲簾開戸清華堂須臾雲散衆星出夜靜皎月流清光感二子黃河一千年一清岐山鳴鳯不再一作載鳴自從蘇梅二子死天地寂黙收雷聲百蟲坏戸不啓蟄萬木逢春不發萌豈無百鳥解言語喧啾終日無人聽二子精思極搜抉天地鬼神無遁情及其放筆騁豪俊筆下萬物生光榮古人謂此覰天巧命短疑爲天公憎昔時李杜爭橫行麒麟鳯凰世所驚二物非能致太平須時太平然後生開元天寳物盛極自此中原疲戰爭英雄白骨化黃土冨貴何止浮雲輕唯有文章爛日星氣凌山岳常崢嶸賢愚自古皆共盡突兀空留後世名讀書吾生本寒儒老尚把書卷眼力雖已疲心意殊未倦正經首唐虞僞說起秦漢篇章異句讀解詁及箋傳是非自相攻去取在勇斷初如兩軍一作兵交乘勝方一作多酣戰當其旗鼓催不覺人馬汗至哉天下樂終日在几一作書案念昔始從師力學希仕宦豈敢取聲名惟期脫貧賤忘食日巳晡燃薪夜侵旦謂言得志一作意後便可焚筆硯少償辛苦時惟事寢與飯歳月不我留一生今過半中間甞沗竊内外職文翰官榮日清近廩給亦豐羡人情慎所習酖毒比安宴漸追時俗流稍稍學營辦盃盤窮水陸賔客羅俊彦自從中年來人事攻百箭非惟職有憂亦自老可歎形骸苦衰病心志亦退懦前時可喜事閉眼不欲見惟尋舊讀書簡編一作編簡多朽斷古人重温故官事幸有間乃知讀書勤其樂固無限少而干禄利老用忘憂患又知物貴乆至寳見百錬紛華暫時好俯仰浮雲散淡泊味愈長始終殊不變何時乞殘骸萬一免罪譴買書載舟歸築室一作屋潁水岸平生頗論述銓次加點竄庻㡬垂後世不黙死芻豢信哉蠹書魚韓子語非訕鵯鵊詞効王建作龍樓鳯闕一作閣鬱崢嶸深宫不聞更漏聲紅紗蠟燭愁夜短緑䆫鵯鵊催天明一聲兩聲人漸起金井轆轤聞汲水三聲四聲促嚴粧紅靴玉帶奉君王萬年枝軟風露濕上下枝間聲轉急南衙促仗三衛列九門放鑰千官入重城禁籞鎻池臺此鳥飛從何處來君不見潁河東岸村一作春陂闊山禽野鳥常一作時嘲􅑜田家惟聽夏鷄聲鵯鵊京西村人謂之夏鷄夜夜壠頭耕曉月可憐此樂獨吾知眷戀君恩今白髪初食鷄頭有感一本無有感字六月京師暑雨多夜夜南風吹芡觜凝祥池鎻㑹靈園僕射荒陂安可擬京師賣五岳宫及鄭州鷄頭最爲佳爭先園客採新苞剖蚌得珠從海底都城百物貴新鮮厥價難酬與珠比金盤磊落何所薦滑臺撥醅如玉醴自慙竊食萬錢厨滿口飄浮嗟病齒却思年少在江湖野艇髙歌菱荇裏香新味全手自摘玉㓗沙磨軟還美一瓢固不羡五鼎萬事適情爲可喜何時遂一作益買潁東田歸去結茅臨野水雙井茶西江水清江石老石上生茶如鳯爪窮臘不寒春氣早雙井芽生先百草白毛囊以紅碧紗十斤茶養一兩芽長安富貴五侯家一啜猶須三日誇寳雲日注非不精爭新棄舊世人情豈知君子有常徳至寳不隨時變易君不見建溪龍鳯團不改舊時香味色贈李士寧蜀狂士寧者不邪亦不正混世使人疑詭譎非一行平生不把筆對酒時髙詠𥘉如不著意語出多竒勁傾財解人難去不道名姓一無上六句金一作千錢買酒醉髙樓明月空床一作清風眠不醒一身四海即爲家獨行萬里聊乘興旣不採藥賣都市又不點石化黃金進不干公卿退不隱山林與之游者一本四字作丗之人但愛其人而莫一作不見其術安知其心吾聞有道之士游心太虚逍遥出入一本二句止作逍遥太虚常一作動與道俱故能入火不熱一作爇入水不濡甞聞其語一作吾雖聞其語矣而未見其人也豈斯人之徒與不然言不純師行不純徳一作表而一本無而字滑稽玩一作傲世其東方朔之流乎明妃小引漢宫諸女嚴粧罷共送明妃溝水頭溝上水聲來不斷花隨水去不回流上馬即知無返日不須出塞始堪愁感事四首老者覺時速閑人知日長日月本無情人心有閑忙努力取功名斷碑埋路傍逍遥林下士丘壠亦相望長生旣無藥濁酒且盈觴空山一道士辛苦學延齡一旦隨物化反言仙已成開墳見空棺謂已超青冥尸一作或解如蛇蟬換骨蛻其形旣云須變化何不任死生仙境不可到誰知仙有無或乘九斑虬或駕五雲車朝倚扶桑枝暮遊崑崙墟徃來㡬萬里誰復遇諸涂冨貴不還郷安事冨貴歟神仙人不見魑魅與爲徒人生不免死䰟魄入幽都仙者得長生又云超太虚等爲不在世與鬼亦何殊得仙猶若此何況不得乎寄謝山中人辛勤一何愚莫笑學仙人山中苦岑寂試看青松鶴何似朱門客朱門炙手熱來者無時息何甞問寒暑豈暇謀寢食彊顔恱憎怨擇語防仇敵衆欲苦無猒有求期必獲敢辭一身勞豈塞天下責風波卒然起禍患藏不測神仙雖杳茫冨貴竟何得新春有感寄常夷甫余生本羇孤自少巳非壯今而老且病何用苦惆悵誤蒙三聖知貪得過其量恩私未知報心志巳凋䘮軒裳德不稱徒自取譏謗豈若常夫子一瓢安陋巷身雖草莽間名在朝廷上惟余服德義乆巳慕恬曠矧亦有吾廬東西正相望不須駕柴車自可䇿蔾杖坐驚顔鬢日摧頽及取新春歸去來共載一舟浮野水焦陂四面百花開昇天檜青牛西出關老聃始著五千言白鹿去昇天爾來忽已三千年當時遺迹至今在隱起蒼檜猶依然惟能乗變化所以爲神仙驅鸞駕鶴須臾間飄忽不見如雲煙奈何此鹿起平地更假草木相攀縁乃知神仙事茫昧真僞莫究徒自傳雪霜不改終古色風雨有聲當夏寒境清物老自可愛何必詭怪窮根源憶焦陂一本無憶字注汝隂作焦陂荷花照水光未到十里聞花香焦陂八月新酒熟秋水魚肥鱠如玉清河兩岸柳鳴蟬直到焦陂不下船笑向漁翁酒家保金龜可解不須錢明日君恩許歸去白頭酣詠太平年贈許道人洛城三月亂鸎飛潁陽山中花發時徃來車馬遊山客貪看山花踏山石紫雲仙洞鎻雲深洞中有人人不識飄飄許子旌陽後道骨仙風本仙胄多年洗耳避世喧獨卧寒巖聽山溜至人無心不筭心無心自得無窮壽忽來顧我何慇懃笑我白髪老紅塵子歸爲築巖前室待我明年乞得身送龍茶與許道人潁陽道士青霞客來似浮雲去無蹟夜朝北斗太清一作虚壇不道姓名人不識我有龍團古蒼璧九龍泉深一百尺憑君汲井試烹之不是人間香味色馴鹿朝渇飲清池暮飽眠深柵慙媿主人恩自非殺身難報德主人施恩不待報哀爾胡爲網羅獲南山藹藹動春陽吾欲縱爾山之傍巖崖雪盡飛泉溜澗谷風吹百草香飲泉齧草當遠去山後山前射生戸留題齊州舜泉岸有時而爲谷海有時而爲田虞舜已殁三千年耕田浚井雖鄙事至今遺迹存依然歷山之下有寒泉向此號泣于旻天無情草木亦改色山川慘淡生雲煙一朝垂衣正南面臯夔稷契來聮翩功髙德大𬒳萬世今人過此猶留連齊州太守政之暇鑿渠開沼䟽清漣遊車擊轂惟恐後衆卉亂發如爭先豈徒邦人知樂此行客亦爲留征軒山齋戲書絶句二首蜜脾未滿蜂採花麥壠已深鳩喚一作呌雨正是山齋睡足時不覺花間日亭午經春老病不出門坐見羣芳爛如雪正當年少惜花時日日春風吹石裂嘲少年惜花紛紛紅蘂落泥沙少年何用苦咨嗟春風自是無情物肯爲汝惜無情花今年花落明年好但見花開人自老人老不復少花開還更一作復新使花如解語應笑惜花人出郊見田家𧖟麥已成慨然有感誰謂田家苦田家樂有時車昌遮切鳴繅白繭麥熟囀黃鸝田家此樂㡬人知幸獨知之未許歸逢時得寵已逾分報國無能徒爾爲收取玉堂揮翰手却尋南畒把鋤犁射生戸予𥘉至州獵戸有獻狼豹者射生戸前日獻一豹今日獻一狼豹因傷我牛狼因食我羊狼豹誠爲害人物縣官賞之縑五疋射生戸持縑歸爲人除害固可賞貪功趨利爾勿爲弦弓毒矢無妄發恐爾不識麒麟兒戲石唐山隱者石唐仙室紫雲深潁陽真人此筭心真人巳去升寥廓歳歳巖花自開落我昔曽爲洛陽客偶向巖前坐盤石四字丹書萬仞崖神清之洞鎻樓臺雲深路絶無人到鸞鶴今應待我來居士集卷第九熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正西齊小飲衆賔一作賢歸鴈亭仰見一作看食鷄頭都城一作都人感事苦無猒若一作貪昇天檜自傳一作相傳朝少年惜花紅蘂一作紅紫出郊有感鳴一作鵯鵊詞促仗碑本促作捉似重磨再刻案唐書儀衛志三衛番上分爲五仗又云帶刀捉仗列坐于東西廊號曰内仗又云内外諸門以排道人帶刀捉仗而立號曰立門仗成都眉州綿州衢州大抗本並作作吉州本及時賢文纂並作捉鎻池臺鎻碑作瑣書簡卷第九歐陽文忠公集一百五十二與薛少卿公期景祐三年某頓首再啓東園一别自夏渉秋今倐冬矣泝汴絶淮泛大江凡五千里一百一十程纔至荆南見家兄言出京時有公期書渇得一見要知别後事然數日㝷之不見遂巳某自南行所幸老㓜皆無病恙風波不甚惡凡舟行人所懼處皆坦然而過今至此嚮夷陵江水極善亦不越三四日可到又聞好水土出粳米大魚梨栗甘橘茶筍而縣民一二千户絶無事罪人得此爲至幸矣秖是沿路多故舊相識所至牽率又少便人作書入京公期始約今冬赴絳州必非乆行矣毎憶君謨家㑹頗如夢中未知相見何時惟自愛而巳因人便附書在君貺處乃可逹今因遣白頭奴入京謹附狀不宣又景祐四年某頓首自公期東門之别忽巳踰年南北之殊相去萬里音信踈絶於理固然昨至許州蒙訊問備審官下爲況甚佳邇來諒惟自公之餘與閫内貴屬各保清休某居此爲況皆如常親老幸甚安室中驟過僻陋便能同休戚甘淡薄此吾徒之所難亦鄙夫之幸也多荷多荷公期遊宦故郷其樂可量思昔月中琴奕樽酒之㑹何可得邪某乆處窮僻習成枯淡頓無曩時情悰惟覺病態漸侵爾弊性懶於作書區區思慕之心非有怠也惟仁者察之讒謗未解相見何由惟慎疾加愛因人至京頻示三兩字爲禱其如方寸莫能盡也不宣又康定元年某頓首再拜公期九哥足下比者伏審五丈人丈母相繼傾亡聞訃交至不勝悼怛苦事伏惟罹比酷毒摧痛哀慕奈何奈何孝子之志在於不滅更望節哀就禮以全大孝是於親友爲大願也自去秋質夫有事顒俟公期替歸不意遭此凶變知扶護且歸絳州未審何時可至京邑一别數歳某走萬餘里艱險備甞公期又有此患人生若此可嗟可嗟八哥在京尚未有差遣亦欲求一住京所貴照管君貺與某亦時時到宅内外如常不慮中前君貺行曽有書他爲有起請不肯附去今同封呈前後累冩下書皆因循不附去得悚息悚息秋寒哭泣扶護千萬寛節以副區區謹奉此致慰又慶暦三年某頓首啓自公期到京便欲拜見初期見訪㝷以某欲入都遷延至此近以定日必行一夕小兒輙病遂阻行計然猶幸僅存其生至今尚未安所頼有可醫理行旣無涯虚滯軒車乆阻歸計慚惕料某不徃公期便行也企渇企渇他具夫人書記累辱問小兒病無憀中未及奉書市藥甚煩挂意春暖各希保愛瞻祝瞻祝不宣又皇祐二年某啓到此已將百日牽率如初以此乆不奉問遞中并人至兩辱書承寒來寢味多福霈恩進秩不敢爲賀彼此然也某此區區幸事漸少稍息肩奉告作鞍蓋爲郡人哂其太陋爾相次專人附銀去式様一依官品可也冗事乃煩長者惶恐惶恐餘具後信冬冷保重又嘉祐年某啓累日不相見承在軍器庫中必甚勞神暄和體氣喜佳𥙿玉册官便當遣去有暇因出見過看漢碑今日私忌家居恐知又嘉祐年某啓昨日見妳子自宅中歸云公期猶患腰疼不審旦夕來尊候如何今日欲於軍器庫中奉問又恐不入爲前日所見偷竊者驚家人欲於宅西添一鋪廵警不知有例否夫人言公期宅前曽剏添一鋪不知申報何處施行略希批示因出閑過少話某再拜公期郎中二日又嘉祐年某啓昨夕承過顧經宿熱未解甚可苦也體中安和數日有人將一馬來行亦快不見驚蹶不知毛骨如何云要百千爲定價直否試令牽呈昨夕忘却閑說及幸告批示草薢丸方專令咨請不罪不罪又嘉祐治平間某啓昨日作書未及發忽得來介所恵書頓釋月餘憂想之懷家人尤以爲慰也所喜渉暑到官尊㓜各安寧仍知頗以郡事爲意如此日月亦易銷遣某嚮在夷陵乾徳每以民事便爲銷日之樂苟能如此殊無謫官之意也某偶因用街市淋洗藥拔動風氣左脚疼痛數日在告不意傳報特煩軫念感愧感愧盛暑公外加愛家人亦自有書此不多述不宣又嘉祐治平間某啓近併捧三書具審至汝以來動静甚慰企渇爾比日竊惟公外體履清福貴眷各安和今夏京師大熱疾疫尚未衰息頗聞許洛特盛幸喜汝獨無之雖然郡事乆不治下車之始不無勞心今必稍簡則漸可樂矣崔庠桉巳㫁邸報必見罪狀不若𥘉聞之可駭然刑名亦重舉主多不免兹亦奈何淄州近不得書應是煩惱某今歳病暑飲氷水多目生黒花多在告舉家㓜小幸安最後將書來人戒渠來取書輙私去故於遞中致此暑伏方盛慎愛不宣又嘉祐治平間某啓多事忽忽等閑不奉狀遂復逾月兹者楊氏子來辱書承秋來公外動履清康貴眷各安粗以爲慰郡事以太守養疾甚煩裁處然臨以餘刃莫不爲勞苦加之歳事豐成盗訟當漸稀簡也某以私門過夏嚮秋幸且安帖秖是孤危之迹勢漸難安群口籍籍外亦應聞病目愈甚承恵藥方便當精意服之也連日從駕歸遂卧病兼亦筋力去不得也餘俟家人自有書殘暑更冀以時自愛以副瞻企又治平二年某啓近以雨水爲患舉家驚奔所幸人物苦無傷損寓居定力公私擾擾乆不附問急足忽來恵書承秋來公外體履清福貴眷上下康安稍以爲慰報國無状致此天災皆由時政多闕上貽聖憂方共引咎遽承見教丁寧切至蒙愛之厚愧感銘藏而巳知汝極豐郡政修舉盜訟遂稀應多閑暇之樂也某忽忽無悰病目如在昬霧中作書甚艱餘不遑及嚮寒保重因風時枉問又同前某啓新陽納慶伏承動履多福人至辱書感慰無量京師水後繼以隂雪甫近郊禮次開晴青城宿齋雲日澄和人情舒暢遂成大禮衰朽之質執事忘勞前此公私事叢乆闕致問自是而後應且休息一晴鎮遏無限浮議天幸天幸餘非筆墨可罄人還僅布一二深寒多愛又治平三年某啓自承受勑後日與家人望軒騎來歸何乆而絶不聞問春夏之交氣候不常不審體況何似想與貴眷各安某此内外如常但自春來病渇淋不止在告多日乞一近郡養疾巳三削竊料旦夕當至都門故專走兵迎候其他湏靣叙病中不悉又熈寧元年某啓近法曹㕔人回特恵書經節竊惟公外氣體安和某到官忽已兩月幸與諸㓜如常但老病益衰民間興利趨公事目百端昬然並不能省若常時公事則絶簡過客亦稀苟禄偷安負愧而已公期臨郡已多時莫湏别有差遣某以病苦難乆尸居歸心有素何日遂如所願相見未涯窮冬盛寒惟加攝爲祝又熈寧三年此帖又載第八卷却云與王學士某啓急足至辱書喜承尊候萬福貴眷各安甚慰企想近入京衙校過潁捧手教㝷於遞中奉狀必逹視聽某到此以弊止未完固少留以葺然欲遂爲挂冠之請逺近相知皆相督以蔡是自乞湏且勉赴到任徐請歸休未遲今遂治行二十一二間上道三四日至蔡别拜狀恐乆滯急足忙中作書不悉又熈寧四年某啓專人辱書承秋暑體候康適貴眷安寧甚慰甚慰某兹者告老得請恩典殊優出於萬幸潁蔡至近雖冒大熱信宿便至遂爲閑人庻事皆如素計惟當營舎乆而僅了族大費廣生事未成倫理頗亦勞心然措置稍定不復更令入耳則是人間無事人爾知幸知幸承冬中當替歸可遂相見豈勝欣願但恐未間别有羙命也某此老㓜幸如冝聞相去秖四程必時得書問徃還殘暑公外多愛又同前某啓迓吏過州辱書承經寒體況清𥙿貴眷各安甚慰勤企某與諸㓜幸各如冝自還田舎巳百餘日庻可稍成倫理粗免勞心始覺漸有閑中趣味然目足之疾初未少損蓋累年舊苦勢難頓減又迫於年齒愈老而益衰其如坐享厚俸飲食無爲徼倖之愧感激而巳承美替有期冬末行舟淮潁當得一㑹靣但恐未間别有羙命就移不然豈勝欣望也深寒未相見間多愛多愛又熈寜五年某啓自使舟過郡閑門庻事乏力又值雪寒難於舉動加之病齒妨飲遂不成主禮退居屏迹惟交親難相㑹毎以爲恨幸一相見又事多艱滯如此信乎人事如意難得也然尚得静話數日爾人至辱手教承宿來尊候萬福知詰旦遂行嚮和惟多愛又同前某啓近辱書喜獲平安到京甚慰傾企乍至都下人事必多仍審巳謁告歸絳州何其速也不亦少勞乎即日春暄竊惟氣體清適某自相别後令醫工脫去病齒遂免痛苦然至今尚未敢放口喫酒情悰索然但覺一歳衰如一歳爾集序已了秖候更了鐫刻一併納呈閑居難得人便附書比此書至京計已西去故令人齋轉附至絳故未反其他惟嚮暖保愛早還以副瞻思與陳比部力嘉祐治平間承有家訃賢姉有事竊惟悲痛老年親戚間不免時有煩惱人生常理只如此時暑千萬節哀寛中無由奉慰來日令兒子至寺中也五妹且省煩惱時熱圖安也某再拜作坊殿丞良親廿七日又嘉祐治平間某啓承昨日寺中舉掛時熱惟希寛中又知喫食所傷更須慎護辱恵茶具甚精竒多荷多荷藏之他時爲閑居之用爾今則少暇也五妹喜安極熱未敢相邀歸家好将息某再拜作坊國博之右旬休日又同前某辱恵答簡承臟腑已安和甚慰恵茶籠所作極精至石屏大是竒物可珎可珎但不得中間一片則不成器千萬爲早取之此物他處未甞見石屏世故多有未有若此簡易而工妙也稍涼見過閑話某再拜作坊虞部六娘兩日患臟腑今却安也果子自此更不令喫幸荷幸荷又同前人至承恵簡喜酷暑中與貴眷各安數日大熱恰值謝官人事紛紛疲朽遂不克支若非昨夕一雨少解煩毒其將奈何頻勞問念多感多感某再拜住娘近日頗肯忌口亦漸向安謝念及也又嘉祐治平間多日不相見天氣斗暖喜與五妹各安和恵簡問及牙疼多感多感兩日稍可雖浮動醫者云取未得須候根脫取之省力恐知恐知驢肉多荷多荷某再拜作坊虞部良親廿二日兩日却較喫得些物又同前某啓承恵蘇家藥多荷多荷亦甞用之此但治咽喉爾某所苦者齒牙熱痛兩日來漸較蓋稍節滋味等物遂可爾過承憂念五妹歸家安否後日祠事畢便歸當得相見人還專此為謝某再拜只前時兩般藥自好方待乆使也又熈寧元年某啓乆不得信方深企想送劉司理兵士至辱書承公外體候安和四郎以下諸㓜各安甚慰但以亡妹忽已周祥舉家見書信至重増悲惱爾某此老㓜幸亦如常乆欲作書只爲累表乞致政未允候見去住後發書奉報爾今又忽有青州之命已兩次辭免欲且乞守亳蓋去潁近便於歸計也未知如何也知吾親每毎多不安逺宦中有此煩惱誠難爲情更冝寛心求安爲善也亡妹靈柩今冬先送歸晉最爲上䇿嚮寒千萬保愛不宣某再拜知郡比部良親九月八日與馬著作嘉祐中牡丹記荔支譜乆欲附呈以候刻跋尾數十字以是稽遲不恠不恠病目固不能書然君謨不肯爲他人書而獨爲某書此朋友間自是一事不可不記故勉自書取笑取笑又治平四年某啓近縣人還奉狀新歳布和善人君子自冝亨福惟餘齡晚暮益以病衰相見未涯徒積傾嚮鄙抱區區前書粗布政餘加愛某手啓知縣著作足下十二月十九日寄恵花燭白蕈多荷多荷蕈豈非自種耶甚佳甚佳泉水未爲爾必以冰凍賫致未得也又熈寧元年某啓專人辱書并以泉水爲貺豈勝珎荷兼審新春履味清安河夫之役尚煩神用然處置得冝公私俱濟則所利博矣亮不以爲勞也某再乞壽旦夕必見可否未間難爲期約也當續咨報尚寒慎愛不宣某手啓知縣著作足下十九日李集巳領泉味皆佳然大抵東州水甘直湏於鹹水地飲之然后爲貴爾又某啓病悴之餘人事踈廢忽辱恵教方承臨莅齊城經暑公餘清適誨諭稠重開發蒙鄙感愧感愧咫尺未期㑹話欽渇欽渇某再拜病目多書字不得不罪不罪又熈寧三年准西支郡蕭條何敢奉屈然吾儕以道爲樂亦應不以閑要爲計某至潁且少盤桓俟如蔡卽當發削若遂所乞衰拙之幸多矣塗次餘未及詳又同前最後一削甚懇意謂可以免并遂蔡何幸如之其餘區區未可卒布但不一㑹見尤爲恨爾保愛保愛又某啓官守相望咫尺未親言話恵書勤眷兼以嘉篇冨麗之作老病無悰得以拭目頓増鄙思也欣感欣感髙材尚滯一邑秋冷多愛某奉白著作足下與顔直講長道某啓嚮傳例罷學職初聞可疑及辱書始駭果然又承有淮陽之命君子出處不違道而無媿則所居皆樂況淮陽近家之便乎亮不動浩然之氣也交年積雪極寒體況想佳計行李不乆當東相去逾逺㑹見何時千萬加愛又治平四年某啓嚮在京師㑹吾子來人事怱怱不能以從容接髙論及至亳聞還直學館出處相失誠可悵仰近惟經寒體況清適某退守僻州甚爲優幸而衰病侵凌心志昬秏諒難乆竊榮寵也目疾爲苦臨紙艱於執筆鄙懷莫罄新歳惟冀加愛又熈寧元年某啓董君來辱恵音竊承履況佳適感慰曷巳學館誠岑寂然塵事不到足以專志經籍則其所得與其所樂豈不多哉某今春目疾愈甚東州民物可樂處多但自以衰病少悰爾董君到必爲言也又同前某啓衰病人事多廢乆不奉書遞中辱問承經寒體況清適學舎乆淹然以道爲樂必無倦也某兩目益昬難乆勉強乞壽巳再旦夕冀得請西歸近潁爲便爾相見未涯鄙誠莫道又熈寧二年某以病昬廢學情禮亦多闕東州一任寄委勉強常憂曠敗請籌冀未退休間苟安於藏縮爾乆不聞道義之益與諸賢者迹日漸踈但欽渴而巳又熈寧三年某啓近辱書承春寒爲道外無恙甚慰企仰竊憶去秋將離青社曾一奉書未審得逹否某衰病如昨幸得閑暇偷安但苦病目不能看書無以度日詩義未能精究第據所得聊且成書正恐眼目有妨不能卒業蓋前人如此者多也今果目視昬花若不草草了之幾成後悔所以未敢多示人者更欲與二三君講評其可否爾但未知相見何時也報筆特艱莫布萬一漸暖加嗇又熈寧四年某啓近辱書承渉暑講道外康和甚慰兼蒙以鳬繹先一有生字集爲示某自少時甞得傳誦數篇毎恨不見全編不意兹時頓飫飢渇藏家著録以傳後世榮感榮感某以經春老病在告近巳復㝷在亳之請方治裝以俟命區區未遑悉布惟毒熱加愛又同前某兹者得請歸老恩出萬幸惟所苦渇淋自春發作經此暑毒尤甚蓋以累年之疾勢不易平然自此安閑冀漸調養爾兩目昬甚艱於執卷顧難銷晷景又親朋之㑹邈不可期恐遂不聞道義黙黙寖爲庸人爾殘暑加愛又同前某啓近小史一作吏許充行奉書方在道人自都來又辱恵問豈勝感媿兼承秋暑爲況多佳某自蒙恩許其告老榮幸感激之懇前書巳粗布惟乍還里閈人事少勞而舊苦目足之疾得秋増甚舊書編槀未經一二君商榷今遂復田畒㑹見無期此爲恨爾餘粗如冝幸不多恤嚮冷惟加愛與梁直講某啓衰病退藏自冝屏迹忽辱恵問雅眷不忘其爲感著未易遽陳兼喜春和氣體清𥙿董直講來自學舎具道群居之詳今其還也亦備見郡齋之況燕譚之際諒可及之病目愈眊然艱於執筆惟以時加愛與直講都官熈寧元年某啓自離亳更闕奉問春氣尚寒體履清勝某昨辭青不獲勉䇿病軀束來而東州土俗深厚歳豐盜訟亦稀甚爲養拙之幸而獨苦衰朽老疾日増爾歸計遷延更湏年歳也學舎乆淹匪朝必有羙命未間珎愛某再拜直講都官足下正月九日與曽學士熈寧三年某啓近因人還得附拙記荐枉書尺其爲愧荷可勝道也兼審秋寒提按之暇動履清福某去蔡咫尺以病足為梗少留于此忽復踰月匪晚向官所壽蔡相望時得拜問旅寓中草率為謝與王𥙷之熈寧三年某啓近者行舟過界上特辱恵書喜承秋冷氣體安和以至郡道里差遥不敢曲邀車騎又失於上問全乏迎候豈勝愧恨某蒙恩得請郡僻事簡衰年疲病茍禄偷安甚爲幸也欵見未涯以時自愛與謝景𥘉皇祐元年某拜啓乆不作書蓋由無便即日爲政外奉親萬福某幸且安郡僻少事然漸老懶於為學惟喜睡爾足下爲道方銳著述必多此急足回無惜為寄春寒保重論徐嶠稱弟子帖春首餘寒惟闍黎動止安隐弟子虚乏繆承榮寄蒙恩奨擢授以洺州一歳三遷自南徂北旣近都邑忝竊弥深便即祗命未由頂謁瞻望山門但増悽㫁戰懼之情慙惶失據願珎重不宣弟子徐嶠和南某啓承恵佳篇豈勝欽服昨日見頋遂當祗詣曽不爲言其如清宴佳賔難復多得若曰春秋爲義當得徐嶠筆法何用於闍黎稱弟子自南朝起此弊事遂成風俗其如近日士人佞佛者少冝於此時力與革此弊事惟在賢者爲之禮曰君子動而爲世法然則舉措其可不慎哉金氏世以財雄南方今乃出佳子弟甚可愛也雄漠瀛覇保州粉紙誰謂不可書請試察試察之下尚隐隐有字漫滅不可讀不知與何人帖也與修史學士嘉祐年某啓辱教開發蒙滯實寡陋者之幸也早來寧王憲只爲更名與郯王嗣直數人同須再出封國其它更有易名者偶不徙封爾就中此卷錯處多然捨此更無也某白又某啓前日承恵服屬圖寡陋蒙益何勝感愧欲見當年修真宗實録人官職姓名差官及書成年月告與撿示不罪相煩八日某拜白晉叔學士又多日不奉見春暖康和中間承見恵臘雪散者或有更乞少許某再拜外題簡呈修史學士右三篇見秀峯隱居法帖或云與吕夏卿吕字縉叔甞同修唐史晉字疑省文與人辱留郡兩日偶客多不及𣢾話惟望慎疾自愛俗子多是非難防勉強接納小疾不足過疑却恐過當服藥致生疾耳二者愚慮恃眷舊敢然悚惕悚惕公議難遏亨復匪遥他不足道也區區某又拜右不知與何人書簡卷第九與薛少卿第十一帖莫不爲勞苦苦一作否第十七帖萬幸一作至幸與曾學士荐枉書尺一作急足荐至又枉以書向官所此上一有勉字集古録䟦尾卷第九歐陽文忠公集一百四十二唐樊宗師絳守居園池記長慶三年右絳守居園池記唐樊宗師撰或云此石宗師自書嗚呼元和之際文章之盛極矣其怪竒至於如此右集本唐張九齡碑長慶三年右張九齡碑按唐書列傳所載大節多同而時時小異傳云壽六十八而碑云六十三傳自左𥙷闕改司勲貟外郎而碑云遷禮部傳言集本作云張說卒召爲祕書少監集賢院學士知院事碑云副知至後作相遷中書令始云知院事其載張守珪請誅安禄山事集本無此字傳云九齡判守珪狀碑云守珪所請留中不行而公以狀諌然其爲語則略同碑長慶中立而公薨在開元二十八年至長慶三年實八十四年所傳或有同異而至於年壽官爵其子孫冝不繆當以碑爲是也治平元年二月十日書右眞蹟唐田布碑長慶四年右田布碑庾承宣撰布之事壯矣承宣不能發於文也蓋其力不足爾布之風烈非得左丘明司馬遷筆不能書也故士有不顧其死以成後世之名者集本有猶字有幸不幸集本有焉字各視其所遭如何爾今有道史漢時事者其人偉然甚著而市兒俚嫗猶能道之自魏晉以下不爲無人而其顯赫不及於前者無左丘明司馬遷之筆以起其文也治平甲辰秋社日書右眞蹟唐沈傳師游道林嶽麓寺詩長慶中右嶽麓寺詩沈傳師撰并書題云酬唐侍御姚貟外而二人之詩不見不知爲何人也獨此詩以字畫傳于世而詩亦自佳傳師書非一體此尤放逸可愛也右集本唐崔能神道碑長慶三年右崔能神道碑李宗閔撰能弟從書碑云拜御史中丞持節觀察黔中仍賜紫衣金印按唐世無賜金印者官制古今集本作古今官制沿革不同而其名號尚或相襲自漢以來有銀青金紫之號當時所謂青紫者綬也金銀者乃其所佩印章尓綬所以繫印者也後世官不佩印此名虚設矣隋唐以來有隨身魚而青紫爲服色所謂金紫者乃服紫衣而佩金魚爾宗閔謂賜金印者繆也今世自以賜緋銀魚袋賜紫金魚袋結入官銜集本有矣字而集本作今有階至金紫光禄大夫者遂於結銜去賜紫金魚袋皆流俗相承不復討集本作訂正久矣故因宗閔之失并記之治平元年七月二十日書右眞蹟唐李徳𥙿茅山三像記寳暦二年右茅山三像記李徳𥙿撰徳𥙿自號上清玄都大洞三景弟子上爲九廟聖主次爲七代先靈下爲一切含識敬造老君孔子尹眞人像三軀此固俚巷庸鄙人之所常爲徳𥙿爲之有不足恠然以孔子與老君爲伍而又居其下此豈止徳𥙿之獨可罪耶今史記載孔子問禮於老􅡭集本作聃下同􅡭戒孔子去其集本作驕氣多慾而孔子歎其道集本無此字猶龍之語著于集本作於耳目自漢以來學者未有以爲非者豈止徳𥙿之罪㢤治平元年八月八日書右眞蹟唐李徳𥙿平泉草木記開成五年已下三篇同是李衛公撰故不與别碑歳月爲叙右平泉草木記李徳𥙿撰余嘗讀鬼谷子書見其馳說諸侯之國必視其爲人材性賢愚剛柔緩急而因其好惡喜懼憂樂而捭闔之陽開隂塞變化無窮顧天下諸侯無不在其術中者惟不見其所好者不可得而說也以此知君子冝慎其所好蓋泊然無欲而禍福不能動其利害不能誘此鬼谷之術所不能爲者聖賢之髙致也其次簡其所欲不溺於所好斯可矣若徳𥙿者處冨貴招權利而好竒貪得之心不已至或疲弊精神於草木斯其所以敗也其遺戒有云壞一草一木者非吾子孫此又近乎愚矣右集本唐李文饒平泉山居詩開成五年讀山居詩見文饒夣寐不忘於平泉而終不得少償其志者人事固多如此也余聞釋子有云岀家是大丈夫事蓋勇決者人之所難也而文饒詩亦云自是功髙臨盡處禍來名滅不由人者誠㢤是言也熈寜壬子正月二十九日書右眞蹟唐李徳𥙿大孤山賦㑹昌五年賛皇文辭甚可愛也其所及禍或責其不能自免然古今聦明賢智之士不能免者多矣豈獨斯人也㢤右集本唐大孤山賦歲月未詳右字畫頗佳而傷於柔媚世傳墀工小篆此豈其筆耶一作也右見綿本拾遺唐辨石鐘山記大和元年右辨石鐘山記并善權寺詩遊靈巖記附覽三子之文皆有幽人之思蹟其風尚想見其人至於書畫亦皆可喜蓋自唐以前賢傑之士莫不工於字書其殘篇斷稾爲世所寳傳於今者何可勝數彼其事業超然髙爽不當留精於此小藝豈其習俗承流家爲常事抑學者猶有師法而後世媮薄漸趨苟簡久而遂至於廢絶歟今士大夫務以逺自髙忽書爲不足學徃徃僅能執筆而間有以書自名者世亦不甚知爲貴也至於荒林敗塜時得埋没之餘皆前世碌碌無名子然其筆畫有法徃徃今人不及兹甚可歎也石鍾山記字畫在二者間頗爲劣而亦不爲俗態皆忘憂之佳玩也右眞蹟唐法華寺詩大和八年右法華寺詩唐越州刺史李紳撰其後自序題云大和甲寅歲遊寺刻詩于壁詳自序所言似紳自書然以端州題名較之字體殊不類甲寅大和八年也右集本唐薛苹唱和詩大和中右薛苹唱和詩其間馮宿馮定李紳皆唐顯人靈澈以詩名後世皆人所想見者集本有而宿尤有詩名六字然詩皆不及苹豈唱者得於自然和者牽於強作邪右眞蹟唐僧靈澈詩元和四年右靈澈詩云相逢盡道休官去林下何曽見一人世俗相傳以爲俚諺慶曆中天章閣待制許元爲江淮發運使因修江岸得斯石於池陽江水中始知爲靈澈詩也澈以詩稱於唐故其與相唱和者皆當時知名之士包侍郎者佶也徐廣州者浩也代宗時爲嶺南節度使右集本唐李藏用碑大和四年右李藏用碑王源中撰唐玄度書玄度以書自名于一時其筆法柔弱非復前人之體而流俗妄稱借之爾故存之以俟識者右眞蹟唐玄度十體書歲月未詳右售玄度十體書前本得於蘇氏後本得於李丕緒少卿丕緒長安人名家子喜收碑文二家之本大體則同而文有得失故並存之覽者得以自擇焉右集本唐鄭澣隂符經序開成二年右隂符經序鄭澣撰柳公權書唐世碑碣顔柳二家書最多而筆法徃徃不同雖其意趣或岀於臨時而模勒鐫刻亦有工拙集本無此十八字公權書髙重碑余特愛模者不失其真而鋒鋩皆在至集本有於字隂符經序則蔡君謨以爲柳書之最精者云善藏筆鋒與余之說正相反然君謨書擅當世其論必精故爲誌之治平元年二月六日書右眞蹟又已下七篇同是柳誠懸書或撰故不與别碑歳月爲叙余自皇祐中得公權所書隂符經序遂求其經云石已亡矣常意必有藏于人間者求之十餘年莫可得治平三年有鐫工張景儒忽以此遺余家小吏遽録之信乎余所謂物常聚於所好也右眞蹟唐山南西道驛路記開成四年公權書徃徃以模刻失其真雖然其體骨終在也右見綿本拾遺唐何進滔徳政碑開成五年右何進滔徳政碑唐翰林學士承旨兼侍書柳公權撰并書進滔唐書有傳開成五年立其髙數丈制度甚閎偉在今河北都轉運使公廨園中右集本唐李聽神道碑開成五年柳公權書右李聽神道碑李石撰聽父子爲唐名將其勲業昭彰故以碑考傳少所差異而史家當著其大節其微時所歷官多不書於體冝然惟其自安州刺史遷神武將軍史不冝略而不書者蓋闕也右集本唐李石神道碑㑹昌三年右李石碑栁公權書余家集録顔栁書尤多惟碑石不完者則其字尤佳非字之然也譬夫金玉埋没於泥滓時時發見其一二則粲然在目特爲可喜尓熈寜三年季夏旣望書右眞蹟唐髙重碑㑹昌四年右髙重碑元𥙿撰栁公權書唐世碑刻顔栁二公書尤多而字體筆畫往往不同雖其意趣或岀於臨時而亦繫於模勒之工拙然其大法則常在也此碑字畫鋒力俱完故特爲佳矧其墨蹟想冝如何也治平元年正月廿五日書右眞蹟唐康約言碑大中七年右康約言碑栁公權撰幷書約言宦者爲河東監軍唐自開元以後軄官益濫始有置使之名歷五代迄今多因而不廢世徒知今之使額非古官襲唐舊號而不知皆唐宦者之軄集本有也字約言在大和開成間嘗爲鴻臚禮賔使又爲内外客省使以此見今之使名自樞宻宣徽而下皆唐宦官軄也又以見鴻臚卿寺亦以宦者爲使於其間約言又爲宣徽北院副使又見當時南北院宣徽皆有副使也治平甲辰秋社前一日書右眞蹟唐復東林寺碑大中十一年右唐湖州觀察使崔黯撰栁公權書東林寺㑹昌中廢之大中𥘉黯爲江州刺史而復之黯之文辭甚遒麗可愛而世罕有之右集本唐王質神道碑開成四年右王質神道碑唐太子賔客劉禹錫撰并書質字華卿王通之後也開成中爲宣歙池等州觀察使右集本唐㑹昌投龍文㑹昌五年右㑹昌投龍文余修唐本紀至武宗以謂奮然除去浮圖銳矣而躬受道家之籙服藥以求長年以此知其非明智之不惑者特其好惡有所不同尓及得㑹昌投龍文見其自稱承道繼玄昭明三光弟子南嶽炎上眞人則又益以前言爲不繆矣蓋其所自稱號者與夫所謂菩薩戒弟子者亦何以異余嘗謂佛言無生老言不死二者同出於貪信矣㑹昌之政臨事明果有足過人者至其心有所貪則其所爲與庸夫何異治平元年五月五日書右真蹟唐俞珣書陳果仁告身并捨宅造寺䟽大中八年右陳果仁告身并妻軫静縁捨宅造寺䟽附䟽後題云明政二年按隋書煬帝本紀大業十一年十月東海賊帥李子通擁衆渡淮僣稱楚王建元明政則明政二年乃大業十二年也唐髙祖實録武徳二年四月隋禦衛將軍陳稜以江都降即以稜爲緫管九月李子通敗稜䧟江都國號呉建元明政則明政二年是武徳三年矣二說不同如此吕夏卿爲余言若以大業十二年爲子通僣號之二年則江都方亂煬帝安得南幸而唐實録陳稜事可據則明政二年當爲武徳三年也隋書繆矣果仁終始事迹不顯略見於隋書云唐𥘉爲隋太僕丞元祐將煬帝巳遇弑沈法興果仁共殺祐起兵據江表法興自稱緫管大司馬録尚書事承制置百官以果仁爲司徒其事止見此爾開元中僧徳宣爲果仁記捨宅造寺載其世家頗詳而其功閥官爵歲月多繆徳宣言中毒以死而宅䟽言見屠戮當以宅䟽爲是徳宣文辭不足録獨採其世次事蹟終始著之俾覽者覈其真僞而少益於廣聞煬帝本紀髙祖實録皆唐𥘉人所撰而不同如此何㢤右集本售圭峯禪師碑大中九年右圭峯禪師碑唐相裴休撰并書其文辭事迹無足採而其字法世所重也故録之云右集本唐濠州勸民栽桑勑碑大中十年余得劉莒修兖州文宣王廟碑見大中時中書門下牒又得此碑見大中時勑乃知平章事非署勑之官今世止見中書門下牒便呼爲勑惟告身之制僅存焉右集本唐閩遷新社記歲月見本文右閩遷新社記唐濮陽宁撰其辭云大中十年夏六月關西公命遷社于州坤或作城凡築四壇壇社稷其廣倍丈有五尺其髙倍尺有五寸主以石壇風師廣丈有五尺髙尺有五寸壇雨師廣丈而髙尺云文字古雅甚可愛嗚呼唐之禮樂盛矣其遺文有足采焉州縣社稷有主見于此記蓋大中時其禮猶在也按唐書楊發自蘇州刺史爲福建觀察使至大中十二年遷嶺南節度以歲月推之關西公者楊發也右集本又唐時州縣社稷有主獨此碑見之開元定禮至大中時猶僅存也禮樂廢壞乆矣故録此記以著之右眞蹟唐令狐楚登白樓賦咸通二年右登白樓賦令狐楚撰白樓在河中至楚子綯爲河中節度使乃刻於石綯父子爲唐顯人仍世宰相而楚尤以文章見稱世傳綯爲文喜以語簡爲工常飯僧僧判齋綯於佛前跪爐諦聽而僧倡言曰令狐綯設齋佛知蓋以此譏其好簡楚之此賦文無他意而至千有六百餘言何其繁也其父子之性相反如此信乎堯朱之善惡異也右集本唐百巖大師懷暉碑歲月未詳右百巖大師懷暉碑權徳輿撰文鄭餘慶書歸登篆額又有别碑令狐楚撰文鄭絪書懷暉者吾不知爲何人而彼五君者皆唐世名臣其喜爲之傳道如此欲使愚庸之人不信不惑其可得乎民之無知惟上所好惡是從是以君子之所愼者在乎所學楚之文曰大師泥洹茶毗之六年余以門下侍郎平章事攝太尉泥洹茶毗是何等語宰相坐廟堂之上而口爲斯言集本有邪字臯夔稷契居堯舜之朝其語言尚書載之矣異乎此也治平元年七月十三日雨中書右真蹟唐孔府君神道碑咸通十二年右孔岑父碑鄭絪撰栁知微書其碑云有子五人載戣戡戢戵按新唐書宰相世系表岑父六子戵之下又有威表據孔氏譜譜其家所藏碑文鄭絪撰絪自言與孔氏有世舊作碑文時戣等尚在然則譜與碑文皆不應有失而不同者何也余所集録與史傳不同者多其功過難以碑碣爲正者銘誌所稱有襃有諱疑其不實至於世繫子孫官封名字無情増損故毎據碑以正史惟岑父碑文及其家譜二者皆爲可據故並存之以俟來者治平元年三月廿二日侍上御崇政踈決繫囚退遂家居謝客因書右眞蹟唐白敏中碑咸通三年右白敏中碑畢諴撰其事與唐書列傳多同而傳載敏中由李徳𥙿薦進以獲用及徳𥙿貶抵之甚力以此爲甚惡而碑云㑹昌中徳𥙿起刑獄䧟五宰相竄之嶺外公承是之後一年冤者皆復其位以此爲能其爲毀譽難信蓋如此故余於碑誌惟取其世次官壽郷里爲正至於功過善惡未嘗爲據者以此也碑又言桑道茂事云桑道慕不知孰是治平元年七月二十日右眞蹟唐于僧翰尊勝經咸通五年右尊勝經于僧翰書僧翰筆畫雖遒勁然失分隷之法逺矣所以録者亦自成一家而爲流俗所貴故聊著集本作述之庶知博采之不遺爾右真蹟唐張將軍新廟記龍紀元年右張將軍新廟記李巨川撰唐彦謙書張魯事史傳詳矣巨川文辭匪工所録者彦謙書爾彦謙書頗知名於世故畧存其筆蹟也右集本唐王重榮徳政碑中和四年同是唐彦謙書附此右王重榮徳政碑歸仁澤撰唐彦謙書重榮當唐之末再逐其帥遂據河中雖破黄巢平朱玫之叛有功於一時而阻兵召亂爲唐患者多矣碑文辭非工而事實無可采所以録者俾世知求名莫如自修善譽不䏻掩惡也考重榮之碑豈不欲垂羙名於千載而其惡終暴於集本作于後世者毀譽善惡不可誣故也彦謙以詩知名而詩鄙俚字畫不甚工皆非余所取也治平元年清明前一日書右眞蹟唐磻集本作盤溪廟記咸通二年右磻溪廟記張翔撰髙駢書駢爲將嘗立戰功威恵著於蠻蜀筆研固非其所事然書雖非工字亦不俗蓋其明爽豪儁終異庸人至其惑妖人吕用之諸葛殷等信其左道以冀長年乃騎木鶴而習凌虚僊去之勢此至愚一品皆知爲可笑而駢爲之惟恐不至者何㢤蓋其貪心已動集本作薫於内故邪說可誘於外内貪外誘則其何所集本増有而二字不爲㢤右眞蹟唐梁公儒碑天祐中右梁公儒碑于廣撰王說書公儒者世爲成徳軍將公儒當王鎔時爲冀州刺史以卒其碑首題云唐故成徳軍内中門樞宻使特進檢校太保使持節冀州諸軍事冀州刺史團練守捉等使軍噐作坊使其餘所領事軄甚多皆當時方鎮常事不足書惟樞宻使唐之末年内官之軄其後方鎮遂亦僣置於此見之軍噐作坊五代之際號内諸司使皆朝廷官然不見其始置集本有之字時而今見於此豈方鎮之軄朝廷因而用之耶將方鎮之盛亦僣置也公儒事迹無所取特以此録之治平元年五月十八日書右眞蹟唐花林宴别記歲月未詳右花林宴别記唐竇常撰花林寺在滁州全椒縣余在滁陽遣推官陳詵以事至縣見寺旁石澗岸土崩岀石崖隱隱有字亟命模得之右集本唐陽武復縣記貞元十九年唐衢文世罕傳者余家集録千卷唐賢之文十居七八而衢文秪獲此尓然其氣格不俗亦足佳也右真蹟唐崔敬嗣碑景龍二年右唐崔敬嗣碑胡皓撰郭謙光書崔氏爲唐名族而敬嗣不顯皓爲昭文館學士然亦無聞三字集本作觀其事實文辭皆不足多采而余録之者以謙光書也其字畫筆法不減韓蔡李史四家而名獨不著此余屢以爲歎也治平元年七月三十日右真蹟唐潤州陁羅尼經幢歲月未詳右陁羅尼經幢今在潤州寳墨亭中唐雲陽野夫王奐之書字畫頗爲世俗所重故録之以備廣採右集本唐夔州都督府記㑹昌五年余嘗謂唐世人人工書故其名堙没者不可勝數毎與君謨嘆息于斯也如貝靈該繆師愈今人尚不知其姓名况其書乎余以集録之博僅各得其一爾右見綿本拾遺唐鄭權碑寳曆二年右姚向書筆力精勁雖唐人工於書者多而及此者亦少惜其不傳於世而今人莫有知者惟余以集録之博得此而已熈寜辛亥孟夏清心堂書右見綿本拾遺唐王蘂詩沈傳師李德𥙿唱和歲月未詳見綿本拾遺惠泉在今荆門軍余貶夷陵道荆門裴回泉上得二子之詩佳其詞翰遂録之逮今蓋三十年矣嘉祐八年十一月二十日書唐人書楊公史傳記歳月未詳右楊公史傳記文字訛缺原作者之意所以刻之金石者欲爲公不朽計也碑無年月不知何時然其字畫之法廼唐人所書爾今纔㡬時而磨滅若此然則金石果能傳不朽邪楊公之所以不朽者八字集本作楊公者震也其所不朽者果待金石之傳邪凡物有形必有終弊自古聖賢之傳也非皆託於物固能無窮也廼知爲善之堅堅於金石也集本無也字嘉祐八年十一月廿日書右眞蹟唐放生池碑天寳十年右放生池碑不著書撰人名氏放生池唐世處處有之王者仁澤及於草木昆蟲使一物必遂其生而不爲私恵也惟天地生萬物所以資於人集本有也字然代天而治物者常爲之節使其足用而取之不過故集本作萬物得遂其生而不夭三代之政如斯而巳易大傳曰庖犧氏之王也能通神明之徳以類萬物之情作結繩而爲網罟以佃以漁蓋言其始教民取物資生而爲萬世之利此所以爲聖人也浮圖氏之說乃謂殺物者有罪而放生者得福苟如其言則庖犧氏遂爲集本有人間之聖人五字地下之罪人矣治平元年八月十日書右眞蹟集古録跋尾卷第九絳守居園池記元第八十張九齡碑元分作上下卷卷上第三百六徐浩結銜云廣州刺史持節充嶺南節度當云廣州刺史豫章石本卷末有此二十二字卷下第三百七同異一作異同唐田布碑元第八百四十二道林嶽麓詩元第一百一十六崔能神道碑元第八百八十三官不一無官字茅山三像記元第九百九十老君一作子平泉草木記元第五百三十九無窮此下一有故字其利一無其字其次一作然則可矣二字上一有亦字有云一無有字非吾一作其治平元年七月二十四日中書東㕔後閣書一有此十七字又别本右平泉山居草木記李徳𥙿撰余嘗讀鬼谷子書見其馳說諸侯之國常視其人賢愚材性剛柔緩急而因其好惡喜懼憂樂而捭闔之陽開隂閉變化無窮顧天下諸侯無不在其術中者惟不見其所好者不可得而說也以此知君子冝愼其所好泊然無欲而禍福不䏻動利害不能誘此鬼谷之術所不能爲者也是聖賢之所難也平泉山居詩元附五百三十九大孤山賦元第二百一十九辨石鍾山記元第三百二見其此下一有爲字以逺此下一有業字前世一作當世治平元年二月六日書一有此九字法華寺詩元第一百七薛苹唱和詩元第三百一十四其間一無此二字名後世一無後字和者二字上一有而字靈澈詩元第一百八相唱和者四字一作遊郎者一無者字州者一無者字代宗二字上一有浩字李藏用碑元第三百七十唐玄度十體書元第四百八十四文有一作互有嘉祐癸卯七月二十五書一有此十一字元第二百九十九驛路記元第一百二十七政碑元第二十二至二十七李神道碑元第七百一十七治平元年七月三十日書一有此十字李石神道碑元第四百一十三髙重碑元第二百八十九康約言碑元第八百二十五復東林寺碑元第三十八王質神道碑元無卷第㑹昌投龍文元第六百五十七陳果仁告身并捨宅造寺䟽元第五百八十七子通爲一作乃終始一無此二字沈法興此下一有與字嘉祐八年歲在癸卯八月十一日書一有此十四字圭峯禪師碑元第六十九濠州勸民栽桑敕碑元第一百七十二又别本一作勸農碑皇祐元年春余自揚移潁舟過濠梁得此碑於今樞宻使張公昪唐之制敕之文今不復見盖官失其軄乆矣此大中時敕也尚可見其遺制焉閩遷新社記五第五十五登白樓賦元第九百四十五好簡此下一有也字治平元年八月八日祈晴于太社晨歸遂書一有此十七字百巖大師碑元第九百二十八孔府君神道碑元第四百六十三世繫一作系白敏中碑元第六百六十六廌進一作薦進十日此下一有書字于僧翰尊勝經元第三百十三張將軍新廟記元第一百五十四書頗知名書一作詩王重榮碑元第四百十六磻溪廟記元第九百三十五凌虚一作雲治平元年中秋日書一有此八字梁公儒碑元第七百三十七花林宴别記元無卷第陽武復縣記元第九百四十九崔敬嗣碑元第七百四十二陁羅尼經幢元無卷第今在一作在今夔州都督府記元第七百二十四堙没一作埋没于斯一作於斯鄭權碑元第六百六十八玉蘂詩元第一百六十九恵泉詩附一作沈傳師字文鼎蒙泉詩附楊史傳記元第一百七十年月此下一有日字非皆一作皆不二十此下一有八字放生池碑元第九百五能通一作以通, WYG: ''}
