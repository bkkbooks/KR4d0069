  - {type: variant, offset: 1, length: 29799, content: 元節謝内中露香表嘉祐五年五月二十六日伏以清穹眷佑皇緒丕隆方陽月之正時屬誕辰而著節仰瞻霄極薦此芬馨冀膺敷錫之祥永保延鴻之慶乾元節謝内中真宗皇帝表同日伏以佳名著節載誕紀辰永惟涼眇之躬獲荷顯休之業動遵聖訓期保慶基怵惕之懷孝思罔極乾元節謝内中章獻明肅皇太后章懿皇太后章恵皇太后表同日伏以天陽正候壽節紀時深惟載育之恩緬慕至慈之德敢忘翼勵期保延鴻賜樞宻副使右諫議大夫張昪乞解罷第一表不允批答正月二十九日省表具之朕惟一二左右之臣出納樞機之命必有同德為時老成卿質厚器閎材優識敏風力甚勁晚而不衰議論有稽言而必中朕所體貌民之具瞻豈宜退徇謙沖自厭繁務盡瘁事國矧惟素懷推心仰成當體予意所乞宜不允除文彦博易鎮判大名府制二月十五日門下朕惟将相之崇資是爲文武之極選隆其名器所以重朝廷列于蕃宣所以屏王室矧乃居留之任必屬老成之人爰擇剛辰敷告有位具官文彦博器閎而厚識粹而明學得其方通古今而知要才周扵物適大小以惟宜自奮發於聲猷早更揚扵中外居則參禆乎國論出則宣暢乎皇威兩踐台司首當柄用賢愚式序舉百職以咸修綱紀甚明賛萬機而至悉自一無此字懇避鈞衡之任出司管鑰之嚴逮此逾時蔚然休問眷言邦哲實簡予衷是用更其擁節之榮委以引京之重勁兵所宿實資總制之權雅俗惟淳兼頼撫綏之政扵戲與國同體是謂股肱之良惟民具瞻方隆師尹之望顧我舊德豈煩訓辭徃其欽哉祗服休命可特授依前檢校太師同中書門下平章事潞國公行陜州大都督府長史充保平軍節度使判大名府兼北京留守司事充大名府路安撫使加食邑七百戸食實封五百戸功臣散官勲封如故仍放謝辭發赴本任主者施行除李昭亮檢校太保判定州制二月十五日門下嚴師律以宣威是爲将率之事謀王體而坐論必屬廊廟之臣惟二柄之是兼蓋一時之首選顧於寄任宜副倚毗爰告外庭式揚休命具官李昭亮資質純厚器識通明世有勲庸蔚爲舊德家傳韜畧濟以美材爰自壯齡早膺奨擢訓齊士伍號令信扵恩威宿衞朝廷勤勞著扵夙夜屢𬒳蕃宣之寄實資鎭撫之才惟留鑰之别都乃宿兵之重地歲時滋乆譽望益嘉眷言中山還爾舊治是用易以将旄之寵増其帝傅之崇於戲宣國威靈用綏寧扵邊鄙求民疾苦以班布扵敎條俾無北顧之憂惟我老成之倚徃踐厥位時惟欽哉可特授檢校太傅依前同中書門下平章事行兖州大都督府長史充泰寧軍節度使充定州路都部署兼安撫使判定州加食邑七百户食實封三百戸功臣散官勲封如故仍放謝辭發赴本任主者施行除李端懿寜逺軍節度使知澶州制同日門下至治之時常不忘扵武備用兵之要在先擇扵将臣禮樂詩書必資於學智信嚴勇又兼以仁是惟難才豈不慎選用諏一作擇剛日敷告外庭具官李端懿器質宏深資識敏茂地聮近戚無富貴之驕世濟美材躬儒素之行粤從壯歲綽有令名學問足以與謀忠信可以事上而能克勵名節靡皇宴安每思報國以有爲嘗請治民而自効北州之政稱最東土之人甚思惟留務之是居顧歷時而頗乆俾加襃進爰考僉同是用寵以節旄委之蕃翰於戲爲政而先無擾所以靖民除戎以戒不虞是宜有素繄乃通明之畧副予柬任之懷徃惟欽哉膺此休渥可特授依前檢校刑部尚書充寧逺軍節度使知澶州加食邑七百户食實封二百户散官勲封如故主者施行賜禮部侍郎參知政事曽公亮乞罷不允詔二月十八日卿以敏識精學參賛萬務儁德茂行表儀百僚而思慮之勞偶嬰疾恙藥石之効聞比康平嘉謀話言日以虚佇封章屢上引避甚堅豈未體於眷懷而每煩扵𨳩諭宜專輔飬以副倚毗所乞冝不允賜新除寧逺軍節度使李端懿讓恩命第二表不允㫁来章批答口宣同日卿聮國懿戚惟時美材乆居留使之權俾委将旄之任載嘉沖挹思避寵榮冝體眷懷無煩牢讓閤門賜新除寜逺軍節度使知澶州李端懿吿敕口宣同日卿地胄聮華資材甚茂早膺器使頗著聲猷俾進總扵中權式増榮於戚里所冝祗服以體眷懷賜新除工部尚書知秦州張方平陳讓不允詔三月十六日卿識茂器閎智優學博施扵有用謂靡不宜乃眷西陲最爲重地惟撫綏備禦之任必通明敏給之才予難其人扵爾爲得委遇之意則惟其勤避讓之誠夫何于再勉祗其徃當體朕懷賜樞宻副使尚書禮部侍郎程戡乞退休第三表不允批答三月十六日省表具之朕惟朝廷之體廣大材賢一作賢材之士衆多必有耆哲之臣以爲時望之重卿早𬒳奨擢藹然聲猷叅聮鈞輔之崇恊賛樞機之要履躬之懿乆見扵純誠事上之忠志期扵盡瘁顧方深於毗頼而懇避扵寵榮封章繼来敦諭亦至引年以禮雖嘉止足之賢優老虚懷未忘眷遇之意徃安厥位宜體予衷所乞宜不允大相國寺大殿上𨳩啓爲民祈福道埸齋文五月三日伏以南薫𬒳物方兹長育之明西覺稱雄允頼慈仁之濟俾延淨侶䖍啓法筵冀迎百善之祥普洽萬生之衆賜宰臣富弼第二表乞退不允批答五月十五日省表具之卿事君一心憂國百慮簡拔寒俊而多得遺才慎重賞刑而惟恐過舉蔚然德業方厚倚毗而綱憲之司異同興論或事非大體或言渉難明因其捃摭扵至微益見始終之無過雖𨳩廣言路務在兼容而進退大臣豈當縁此所宜篤卿自信之志成朕不惑之明渙然無疑来復厥位所乞宜不允賜宰臣富弼乞退第四表不允㫁来章手詔五月二十四日省四上表已解機務事具悉朕力排讒構之言兼採搢紳之望委卿以重任待之以不疑惟致治之至難方同心而共濟勉以無怠庶幾有成而執法之臣以言爲職議旣不一理難必從遂其好勝之私因扵積忿而發事縁藹一作曖昧語渉中傷遽罷憲司以釋群惑雖朕之不明不敏旣能爲卿而辨之而卿亦何嫌何疑遂将去朕而不顧避辭巳確敦諭亦勤其體予懷復安爾位使天下曉然知朕任賢而勿貳也所乞宜不允仍㫁来章付富弼賜樞宻副使張昪生日詔一作口宣五月十九日卿以業履之清優任樞機之宻勿余所礼遇時之具瞻爰屇誕辰俾加慶賜賜荆湖北路救濟飢民知州奨諭敕書五月二十七日夫修人事所以禦天災安吾民豈不在良吏爾學優從政職任治人因凶歲之疫飢體詔書之隱惻旣免罹扵殍饉仍不夭扵札瘥再惟敏事之材深得䘏荒之禮第課来上予心所嘉宜有襃章以旌善績賜河陽三城節度使同中書門下平章事文彦將進奉謝祫享加恩詔六月十七日詩云君子邦之基記曰大臣民之表予所寵異禮宜優隆乃因祭福之均恩首效駿良而来獻載惟誠恪深用歎嘉賜定國軍節度使知并州梁適進奉謝恩馬詔六月十七日大鹵之雄中權爲重時有舊老柬于予衷寵之旄鉞之榮委以蕃宣之寄效駿良而来獻将誠慤之甚勤省覽已還歎嘉曷已賜觀文殿大學士知定州龐籍進奉謝恩馬詔六月十七日書殿之職號爲清優舊德之臣所宜寵異乃求駿足以副勤誠曽非貴物之心實體事君之節省閱于再歎奨不忘賜䖍州觀察使定州路副都部署劉渙進奉謝恩馬詔同日國家慎選材武委之事權優其寵榮所以責効厚其頒予所以飬㢘乃因物以逹誠見事上之惟恪省閱于再歎嘉不忘賜定國軍節度使梁適進奉謝恩馬詔卿惟時舊德爲國将臣推恩典以旣優俾家庭之増寵乃輸良貢以効誠勤省閱以還歎嘉彌切賜外任臣寮進奉賀祫享禮畢敕書六月十七日朕以孟冬卜吉大祭伸䖍惟熈事之旣成實庶邦之共慶載披来貢深見輸忠省閱以還歎嘉良切賜翰林學士尚書兵部貟外郎知制誥吴奎乞知青州不允詔七月二十一日卿強學博覽足以通古今嘉謀讜言足以承顧問朝夕獻納余有望焉矧方委之劇煩嬰以事任懋乃賢業宜有施扵朝廷奮乎壯猷豈暇便扵郷里其安爾職深體眷懷賜新除宣徽南院使檢校太保鄜延路馬歩軍都部署經畧安撫使判延州程戡讓恩命苐一表不允㫁来章批答八月八日省表具之廼者卿數上封章懇辭樞要兼引年而爲請思還政以自頥眷惟耆舊之英誠乆劇繁之任俾増書殿之職仍參講席之聮是曰清優豈忘顧遇而進見之際聦明未衰廼遷使領之華徃重邊陲之寄予意所屬僉言允諧雖沖尚之可嘉惟成命之難止所讓冝不允仍㫁来章賜知建昌軍楊儀進奉銀珠稻米敕書八月十六日勸力農而務本惟汝之官登嘉榖以告豐乃時之瑞粲然良實来効貢囊載惟修職之勤式緩憂民之意省閱于再歎尚不忘賜右諫議大夫知梓州吕居簡進奉乾元節無量夀佛一㡠敕書同日壽觴紀節罄率土以均歡妙像有儀獻無疆之善祝嘉乃愛君之意見扵事上之恭省閱以還歎嘉良切賜新除翰林學士依前禮部郎中知制誥權知𨳩封府蔡襄上表乞依舊知泉州不允詔八月十五日卿學通古今足以備獻納政適寛猛足以臨劇煩而得材之難顧常勞扵選任矧居外兹乆寧自逸扵便安是宜勉旃来服新命綽有餘力夫何微疾之辭居然寵名固爲榮飬之樂其毋必讓當體至懷賜屯田貟外郎王公衮奨諭敕書嚮者長人之官備盗不謹害我命吏驚兹逺民汝扵斯時能奮厥効督捕甚急饋餉有方致兹兇徒卒就擒戮第功来上覆實不虚載嘉勤勞深用襃歎東太一宫立冬祝文九月二十四日四時適序萬物堅藏嘉歲事之有成繄神休之是頼承兹靈貺報以吉蠲惟冀享誠益敷多祐延福宫性智殿𨳩啓皇后生辰道埸齋文同日伏以坤德流徽式臨扵誕日貝文宣妙恭仰扵巨慈載嚴袐邃之庭駢集清修之侶冀資壽福時啓靈埸伏願毫相分光法雲假䕃憑兹勝利永保遐齡延福宫性智殿𨳩啓皇后生辰道埸宻詞九月二十六日伏以寒律正時適臨扵良月曽沙誕慶爰紀扵嘉辰夙清袐殿之嚴並集祇園之侶冀因勝利延錫禧一作休祥永輔坤儀益隆壽祝故贈濮王允讓十月九日坼櫕祭文同日日月惟吉山川旣佳啓兹櫕塗徃即襄事顧歆薄奠冝體哀悰故贈濮王允讓十月十八日起靈祭文同日儀物旣備川塗甚夷徃即佳城卜兹吉日靈其顧享副此哀懷故贈濮王允讓十月三十日下事祭文同日惟靈禀德甚茂享年不遐余心所哀䘏典斯備徃即安宅享兹克誠撫問護葬使向傳式詔同日葬之爲禮古所重焉方将事以在塗顧勞心扵祗役眷頼之意不忘于懷撫問西京并汝州路祔葬隨護宗懿巳下敕書同日日月惟吉川塗匪遐顧襄事之有期嘉送終之盡禮勞勤備至眷矚良深撫問尚宫沈氏敕書同日輀旌就道霜露戒時載惟将護之勞無怠祗勤之意撫問西京并汝州路管勾修墳并沿路廵檢道路及管勾一行靈轝程頓排辦等朝臣使臣内臣等敕書卜吉趨時送終備物顧風霜之方厲念事役之爲勞賜宰臣富弼上第一表乞解罷機務不允批答省表具之夫宰相之事非可以歳月考而一二數也其在朝廷選賢任能而各得其職下俾民俗遷善逺罪而不知其然至扵法度修紀綱正然後相與慎守而安行之以臻于治此朕所以虚心一意日有望扵卿者也今事有緒而卿辭焉豈朕德之不明将顧時之不可中道而止夫何謂哉俾予獲用材不盡之譏而卿渉苟安自便之計予所不取卿其勉焉所乞宜不允賜宰臣富弼上第三表乞解罷機務不允㫁来章批答省表具之卿博通古今之學深逵治亂之原德業之隆名稱甚盛朕方虚已而任不愧知人之明而自秉鈞衡宣勞夙夜惟是小大之政損益施設惟卿之爲罰罪賞功進退能否惟卿之聽時有異論豈無多言一切屏之惟卿之信若乃恭已南面庶幾輔予享其成功登于至治亦惟卿之圖其三者人君之所難予罔敢忽其一者在卿之不止庶克有成而無名屢辭實所難諭卿其體兹至意究乃素懷所乞宜不允仍㫁来章内制集卷第八除文彦博判大名府制自懇避一作而自懇避賜李端懿讓恩命不允口宣俾委一作俾建大相國寺爲民祈福道埸齋文之明一作之時賜富弼乞退㫁来章手詔議旣不一一作議旣不當賜湖北救濟飢民知州奨諭敕書以禦一作以銷外集卷第八歐陽文忠公集五十八古賦雜文五首附紅鸚鵡賦并序聖俞作紅鸚鵡賦以謂禽鳥之性宜適於山林今兹鸚徒事言語文章以招累見囚樊中曾烏鳶雞雛之不若也謝公學士復多鸚之才故能去昆夷之賤有金閨玉堂之安飲泉啄實自足爲樂作賦以反之夫適物理窮天真則聖俞之說勝負才賢一作賢才以取貴於世而能自将所適皆安不知籠檻之於山林則謝公之說勝某始得二賦讀之釋然知世之賢愚出處各有理也然猶疑夫兹禽之腹一作賦中或有未盡者因拾二賦之餘棄也以代鸚畢其說后皇之載兮殊方異類肖翹蠢息兮厥生咸遂鎔埏賦予兮有物司之泊然後化兮黙運其機陶形播氣兮小大取足紛不可狀兮千名萬族異物珍恠兮託産遐陬来海裔兮貴中州邈丹山於荒極越鳯皇之所宅禀南方之正氣孕赤精於火徳盖以氣而召類兮故感生而同域播為我形特殊其質不緑以文而丹其色物旣賤多而貴少兮世亦安常而駭異豈負羙以有求兮適遭時之我貴客方黜我以文采弔我於籠樊謂夫飛鳴而飲啄不若雞鶩與烏鳶噫不知物有貴賤殊乎所得工一作天初造我甚難而嗇千毛億羽曾無其一忽然成形可異而珍慧言羙質俾貴於人籠軒寳翫翔集安馴彼衆禽之擾擾兮盖迹殊而趣乖旣心昬而質陋兮乃自穢而安卑樂以鍾鼔宜其眩悲盖貴我之異禀何槩我於羣飛若夫生以才天養以性違客之所悼我亦悼之我視乎世猶有甚兮郊犧牢豕龜文象齒蚌蛤之胎犛牛之尾旣殘厥形又奪其生是猶天為非以自營人又不然謂為最靈淳和質静本湛而寧不守爾初自為巧智鑿竅泄和漓淳雜僞衣羔染夏強華其體鞭扑走趨自相械繫天不汝文而自文之天不汝勞而自勞之役聦與明反為物使用精旣多速老招累侵生盭性豈毛之罪又聞古初人禽雜䖏機萌乃心物則遁去深兮則網髙兮則弋為之職誰而反予是責述夢賦夫君去我而何之乎時節逝兮如波昔共䖏兮堂上忽獨棄兮山阿嗚呼人羡久生生不可久死其柰何死不可復惟可以哭病予喉使不得哭兮況欲施乎其他憤旣不得與聲而俱發兮獨飲恨而悲歌歌不成兮㫁絶淚疾下兮滂沱行求兮不可過疑是遇字坐思兮不知䖏可見惟夢兮奈寐少而寤多或十寐而一見兮又若有而若無乍若去而若来忽若親而若踈杳兮倐兮猶勝於不見兮願此夢之湏臾尺蠖憐予兮為之不動飛蠅閔予兮為之無聲冀駐君兮可久怳予夢之先驚夢一㫁兮魂立㫁空堂耿耿兮華燈世之言曰死者凘也今之来兮是也非也又曰覺之所得者為實夢之所得者為想苟一慰乎予心又何一作可較乎真妄緑髮兮思君而白豐肌兮以君而瘠君之意兮不可忘何憔悴而云惜願日之疾兮願月之遲夜長扵晝兮無有四時雖音容之遠矣扵怳惚以求之荷花賦步蘭塘以清暑兮颯蘋風以中人擷杜若之春榮兮搴芙蓉扵水濵嘉丹葩之耀質出渌水而含新䕃曲池之清泚漾波紋之􅔿淪披紅衣而耀彩寄清流以一作而託根挺無華之淺艶靡競麗乎先春抱生意以自得兮及薫時之嘉辰若夫夏一作下畹蘭衰夢池草宻慘群芳之已銷獨斯蓮之一作而迥出可以嗅清香以析酲可以玩芳華而自逸況其晚浦煙霞水亭風日投文竿而餌垂泳萍莖而波溢絲縈藕以全折杯卷荷而半側墜紫菂以欹煙歛紅芳而向夕可憐影兮相顧列金葩而返植清風遏以似起碧露合而乍失或兩兩以相扶漸亭亭而獨出發燕脂扵此土生異香扵西域匪江妃之小腰即廣陵之清一作青骨爾乃曲沼微陽横塘細雨逐橋上之歸鞍笑堤邊之㳺女墮虹梁而窺影倚風臺而欲舞覆翠𬒳以薫香然犀燈而照浦雙心並根千株泣露湛月白而風清杳池平而樹古送艇子扵西州聞棹謳扵北渚迎桃根而待檝逢宓妃而未渡迫而視之靚若星妃臨水而脉脉盈盈逺而望之杳如峽女行雲而朝朝暮暮其妖麗也其閑麗也香荃橈兮木蘭舟澹容與兮悵夷猶東西隨葉隱上下逐波浮巳見雙魚能比目應笑鴛鴦㑹白頭昔聞妃子貴東鄰池上金花不染塵空留此日田田葉不見當時步步人螟􅘾賦并序詩曰螟􅘾有子蜾臝負之言非其類也及楊子法言又稱焉嗟夫螟􅘾一蟲爾非有心扵孝義也能以非類繼之爲子羽毛形性不相異也今夫爲人父母生之養育劬勞非爲異類也乃有不能繼其父之業者儒家之子卒為商世家之子卒為皁隷嗚呼所謂螟􅘾之不若也作螟􅘾賦詞曰爰有桑蟲實曰螟􅘾與夫蜾臝異類殊形負以為子祝之以聲其子感之朝夕而成嗟夫人子父母所生父祝之言子莫之聽父傳之業子莫克承父没母死身覆位傾嗚呼為人孰與蟲靈人不如蟲曷以人稱辭啄木辭木皇司春兮物熈以春芽者斯勾兮甲者斯萌物賴皇兮榮以欣翳有蟲兮甚不仁穴皇木兮群以聚穴不已兮又加咀皇木病兮􅑆将深皇心惻兮傷爾蝎彼鴷鳥兮善啄吾利汝喙兮飢汝腹飛以鳴兮啄且食蟲不盡兮啄莫息山之麓兮水之濱皮堅節癭兮龍甲蛇鱗節流膏兮吻流血百不一兮徒飢渇蠧日滋兮鴷日苦京謁皇兮披雲路雲之深兮不可見託歸風兮仰訴古初之皇兮甚仁惠憐民愛物使兩遂穴民䖏兮鮮民食穴不棟梁兮鮮不薪米其求甚少兮給之孔易野鬱鬱兮山蒼蒼土有毛髪兮山有衣裳金不鞴冶兮器不刅鋩木至老朽兮不見菑殃聖萌機兮五財利贍有足兮生不匱蔽風避濕兮脩容暮入門兮迎我笑朝出門兮牽我衣戯我懷兮走而馳旦不覺夜兮不知四時忽然不見兮一日千思日難度兮何長夜不寐兮何遟暮入門兮何望朝出門兮何之怳疑在兮杳難追髧兩毛兮秀雙眉不可見兮如酒醒睡覺追惟夢醉之時八年㡬日兮百歲難期扵汝有頃刻之愛兮使我有終身之悲頌㑹聖宮頌并序西京留守推官将仕郎試祕書省校書郎臣歐陽脩謹齋心滌慮頓首再拜言臣伏見國家采漢書原廟之制作宫于永安以備園寢欲以盛陵邑之充奉昭祖宗之光靈以耀示于千萬世甚盛徳也脩永惟古先王者将有受命之符必先興業造功以警動覺悟扵元元然後有其位而繼體守文之君又從而顯明丕大以纂修乎舊物故其兢兢勤勤不忘前人是以根深而葉茂徳厚而流光子子孫孫承之無疆伏惟皇帝陛下以神聖徳傳有大器乾徤而正離繼而明即位以来于兹十年勤邦儉家以修太平日朝東宫示天下孝親執籩豆三見於郊日星軌道光明清潤河不怒溢東南而流四夷承命歡和以賔奔走萬里顧非有干戈告讓之命文移發召之期而犀珠象牙文馬㲄玉旅于闕庭納于廐府如司馬令無一後先至徳之及上格于天下極于地中浹扵人而外冒扵四表昆蟲有命之物無不仰戴神威聖功効見如此太祖創造基始克成厥家當天受命之功太宗征服綏来遂一海内睿武英文之業真宗禮樂文物以隆天聲升平告功之典陛下夙夜䖍共嗣固鴻業纂服守成之勤基􅌟累積顯顯昌昌益大而光稱于三后之意可謂至孝況春秋歲時以禘以祫則有廟祧之嚴配天昭孝以享以吿則有郊廟明堂之位篆金刻石則有史氏之官歌功之詩一作歌詩之詠流于樂府象徳之舞見乎羽毛惟是邦家之光祖宗之為有以示民而垂無窮者罔不宣著陛下承先烈昭孝思所以奉之以嚴罔不勤備聖人之徳謂無以加而猶以為未也乃復因陵園起宫室以望神㳺土木之功嚴而不華地爽而㓗宇敞而邃神靈杳冥如来如宅合扵禮經孝子謦咳思親之義愚以謂宫且成非天子自臨享則不能以来三后之靈然郡國不見治道太僕不先整駕恬然未聞有司之詔豈難扵動民而遟其咎疑耶特疑以龜筮所考湏吉而後行耶不然何獨留意扵屋牆􅌟築而至扵薦見孝享未之思耶況是宫之制夷山為平外取客土鍜石伐木發兵胥靡調旁近郡如此數年而道路之民徒見興為之功恐愚無以識上意是宜不惜屬車之費無諱數日之勞沛然幸臨因展陵墓退而諭民以孝思之誠遂見守土之臣采風俗以問髙年亦堯舜之事也古者天子之出必有采詩之官而道路童兒之言皆得以聞臣是以不勝惓惓之心謹采西人望幸意作為頌詩以獻闕下詞曰巍峩穹崇奠京之東有山而崧􅔿淪道源匯流而淵有洛之川川靈山秀回環左右有髙而阜其阜何名太祖太宗真宗之陵惟陵之制因山而起隱隱隆隆惟陵之氣常王而喜鬱鬱葱葱帝懷穹旻受命我宋造初于屯帝念先烈用顧余家宣力以勤赫赫三后重基累􅌟旣豐而茂燕翼貽謀是惟永圖其傳在予曰祖曰宗有徳有功予實嗣之克勤克紹以孝以報予敢不思惟此園陵先后之宅旣宅且安后来㳺止弗宫弗室神何以驩廼相川原乃得善地地髙惟丘廼以荆灼廼訊寳龜龜告曰猷帝命家臣而職我事而往惟寅一毫一絲給以縣官無取扵民伐洛之薪有宋右諌議大夫贈開府儀同三司太師中書令兼尚書令魏國韓公國華真賛氣剛而毅望之可畏色粹而仁近之可親有韞于中必見于外庶㡬髣髴寫之圖繪惟其盛徳不可形容公徳之豐後世之隆誰為公子丞相衛公章州名急就章并序敘曰古者史掌文書以識天地四方古今事物名言字訓而教學之法始扵童子謂之小學君子重焉急就章者漢世有之其源盖出扵小學之流昔顔籕爲史㳺序之詳矣余為學士兼職史官官不坐曹居多暇日毎自娯扵文字筆墨之間因戯集州名作急就章一篇以示兒女曹庶㡬賢扵博塞爾章曰别州自禹郡扵秦廢置經革難具陳皇家垂統天下定疆理萬方承政令近征逺貢各有宜或卑吏治或覊縻九域披圖指可知分音比類慎訛疑文差字析極精微若夫錦居遐裔孤音無比隰集梓泗劔陜涪幽駢聲相附可如類求則有夔綏隨果賀播滑逹越和河羅連三前叶其四謂何乃有瓜沙嘉巴鳯隴雍宋歙峽合疊淄資思師化雅華夏宻吉蔚悉永郢鼎潁不宜吃訥又如保邵道趙耀鄆信潤晉慎凡五聲而一韻栁壽茂竇宥湊憲兖漢簡萬演海岱解蔡泰愛欽潯金深郴黔蜀濮福睦復陸乃六律而同音七言惟一白澤虢石益徳壁八音相望廣象相閬句絳獎黨宕句開萊台懐句階崖雷梅句澧冀利句濟薊費智句鄭鄧定孟句慶應靜勝句㢘潭儋南句嵐鹽甘嵓句至於許汝婺處句楚普潞敘古句魏恵桂貴句遂貝瑞嶲㑹句言過乎九難宣扵口扵是有岳鄂亳薄洛句莫涿朔廓拓句眉黎齊池蘄句施伊西夷溪句濠曹饒昭韶句潮遼交洮牢句右皆十卭通龍洪蓬蒙句邕同戎忠松籠句右十二連綿澶安延丹端句宣檀驩蘭潘田巒句湖蘇舒滁廬渝瀘句梧蒲徐鄜扶儒禺句右皆十四秦邠麟汾句均陳温春句筠辰文循句銀雲勤岷句杭揚江黄句常漳康襄句房坊商滄句洋昌瀼長句右皆十六并青瀛登成明句衡彭英瓊邢洺句涇寧昇榮橫藤句汀興營平庭澄句右二十四聮章㫁句不䏻遽數真定河源以諱不舉若乃物有疑似同音異字則有陵靈原袁府撫乾䖍濵賔融容渭衛全泉繡秀易翼渠衢歸嬀龔恭汴辨涼梁祁𡵨鄯單宿肅磁慈濰維峯封曁豐沂冝及儀乃一號而三之音或不同相近者亦借以足之劒環恩順鎮覇真雄又音文之兩同至扵太平鬱林萬安平琴武安洮陽新定建康二名雖羙逺小不彰若監若軍四十有六保定信安廣信安肅鎮戎保安岢嵐火山順安寧化實控三邊其餘瑣瑣皆不足言其後因檢九域圖有髙冨瀧當四州偶遺不録以文句難移不復增入也外集卷第八荷花賦此土疑是北土而脉脉而朝朝一無此二而字啄木辭五財一作五材哭女師兩毛毛字疑㑹聖宫頌于兹一作扵兹奏議卷第八歐陽文忠公集一百四諌院論張子奭恩賞太頻劄子慶曆四年臣風聞知汝州范祥為相度陜西青白鹽勑差張子奭權知汝州子奭自選人二年内遷至貟外郎朝廷之意雖曰賞勞而天下物議皆云僥倖盖以子奭宣勞絶少止兩次而遷官恩賜已數重自古賞功不過一次一作賞賞之不已故難弭人言𥘉自選人改京官曰賞勞未及二歲改秘書丞又曰賞勞賜以章服又曰賞勞祕書丞不乆又轉官又曰賞勞合得太常博士超遷貟外郎又曰賞勞後行祠部為名曹又曰賞勞作京官合作知縣而作簽判又曰賞勞一任未滿合更有一任知縣又超通判差遣又曰賞勞此所以外人之議不允也況范祥暫出勾當只合交割以次官貟或轉運司自差人權今朝廷差人已是失體又於子奭為此僥倖今朝臣待闕在京者甚衆豈無一人堪權知州者朝廷毎用一人必當使天下人服今毎一差遣則物議沸騰累日不息昔五代桑維翰為晉相一夕除節度使十五人為將而人皆服其精今中書差一權知州而不能免人譏議者盖事無大小當與不當而已其張子奭伏乞追寢權差之命仍乞今後外處差出知州只委本路轉運使差官權至於賞罰之柄貴在至公今莫大之罪不過一刑而止豈有勞者終身行賞而不已亦乞今後有勞効之人量其大小一賞而止若其别著能効則拔擢自可不次人亦自然無言伏以朝廷用人惟患守例而不能不次選任但不渉於僥倖實有材藝之人誰敢有言子奭作使西鄙不謂無勞但恩典已優於賞已足可惜令天下指為僥倖之人而掩其前効况又上虧朝政不可不思取進止論救賑江淮飢民劄子同前臣伏見近出内庫金帛賜陜西以救飢民風聞江淮以南今春大旱至有井泉枯竭牛畜瘴死雞犬不存之處九一作春農失業民庶敖敖然未聞朝廷有所存䘏陛下至仁至聖憂民愛物之心無所不至但患逺方疾苦未逹天聦苟有所聞必湏留意下民疾苦臣職當言昨江淮之間去年王倫蹂踐之後人户不安生業倫賊纔滅瘡痍未復而繼以飛蝗自秋至春三時亢旱今東作已動而雨澤未霑此月不雨則終年無望加又近年已来省司屢於南方歛率錢貨而轉運使等多方刻剥以貢羡餘江淮之民上𬒳天災下苦賊盗内應省司之重歛外遭運使之誅求比於他方𬒳苦尤甚今若不加存䘏將来繼以㐫荒則飢民之與疲怨者相呼而起其患一有害字不比王倫等偶然狂叛之賊也臣以為一作謂民怨已乆民疲可哀因其甚困一作困時冝速賜一作施惠不惟消弭盗賊之患兼可以恱其疲怨之心伏望聖慈特遣一二使臣分詣江淮名山祈禱雨澤仍下轉運并州縣各令具逐處亢旱次第奏聞及一面多方擘畫賑濟窮民無至失時以生後患取進止論内出手詔六條劄子同前臣伏聞近出手詔條六事以賜兩府大臣有以見陛下憂勤責任之意然而天下紀綱隳壞皆由上下因循一旦陛下奮然雖有責成之心而大臣尚習因循之弊不能力行改作以副聖懷自去年范仲淹韓琦等特𬒳選擢陛下尋開天章閣召見而大臣遞互相推並不建明一事以救天下之弊洎至内出手詔范仲淹冨弼等方始各條數事至今半年有餘或寢而不行或行而不盡或雖行而未有明効今陛下又以六事責之臣恐兩府大臣依前無以上副憂勤之意下救當今之急臣願陛下不因常例奏事之時特御便殿召兩府大臣賜坐先戒以不得推避緘黙後以當今大務問之湏令有所陳述所問之急不過三四大事而已二虜交侵一也三路禦備之術何者可以易行而速効二也百姓困匱國用不足何以使公私俱濟三也若兩府大臣於此三事能其一者便委其專管示以責成可也若其不然臣恐手詔屢出聖意雖勞而大臣相推終未濟事陛下必欲速救時弊非專任而切責之不可也取進止論葬荆王劄子同前臣伏覩朝旨雖差宋祁監護故荆王葬事然未見降下葬日及一行事件或聞以歲月不利未可葬或聞有司以財用不足乞且未葬夫隂陽拘忌之說陛下聦明睿聖必不信此巫卜之言而違禮典但慮議者堅執方今財用不足不可辦葬陛下聞有勞民枉費之說則不得不慮因以遲疑臣謂前後勑葬大臣浮費枉用之物至多豈是朝廷本意皆為主司措置之失致人因縁以為姦爾今若盡節一作減仍有其字浮費及絶其侵蠧而使用物不廣一作多則將復以何辭而云不葬臣不知所一作有司曽將一行用度計定大數否内若干是浮費若干是實用若實用之物數猶至多而力不可辦則緩之可也若實用之物少只是舊例浮費多則可削去浮費而巳今都不一作未計度而但云無物可葬則不可也未見實用之數多少不量力能及否而曰必湏遵禮而曰必湏葬亦未可也如臣愚見酌此兩端葬則為便然湏先乞令王堯臣宋祁等將一行合用之物列其名件内浮費不急者一一減去之若只留實用之物數必不多假如稍多更加節減雖至儉薄理亦無害如此則葬得及時物亦不費夫儉葬古人之美節侈葬古人之惡名今避儉葬不肯節費留䘮而待有物之年以就侈葬則非臣所知也若曰儉葬亦未能辦則乃過言之甚也然外之輿議為國家論事體者皆云葬則為便今朝廷議者分而為二顧物力者則不顧典禮國體論典禮國體者則不思財用辦否各執偏見議乆不決以惑陛下之聦明今便葬之害一不葬之害五便葬之害不過費物然力有可為不葬之害所失則大不肯薄葬而留之以待侈葬成王之惡名一也信巫卜之說而違典禮二也目下減節力所易為他時豐足理或難待使皇叔之柩五七年間不得安宅而神靈無歸三也使四夷聞天子皇叔薨而無錢出葬遂輕中國而動心四也今天下物力雖乏然凢百用度不能節費處多獨於皇叔之身有所裁損傷陛下孝治之美五也此臣所謂葬則為便者也荆王於國屬最尊名位最重伏乞早令定議無使後時取進止論葬荆王後贈燕王一行事劄子同前臣風聞巳有聖㫖荆王葬事令三司與太常禮院及監葬官等同議減節浮費此足見陛下厚於皇叔之恩念民惜費之意一舉而兩得也然臣毎見朝廷作事欲愛民節用而常枉費勞人盖為議事之𥘉不得其要或失於不精審者有四民間不科配一也州縣供應物有定數二也送葬之人在路禁其呼索三也州縣官吏不得過外供湏以邀名譽四也苟絶此四者則無大患矣昨京西一路遭張海驚劫之後不可更有誅求臣今欲乞指揮三司應是合要之物並湏官給不得民間科買仍乞先將一行儀仗人馬并送葬人等一人以上先定人數然後劄與京西令依數供頓則可無廣費自荆王以下諸䘮非至親者不必令其盡往仍乞限定人數及毎人將帶隨行人數亦乞限定凡皇親及一行官吏除宿頓合供飲食外不得數外呼索州縣官吏亦不得於官供飲食外别以諸物獻送權要其受獻送并呼索並以入已贓論仍乞一有選字御史裏行一人隨行糺察其數外帶人及州縣隨順呼索獻送物等官吏物出於已亦從違制若託以供應爲名於民間賤買及率掠者皆以枉法贓論如此防禦方可杜絶浮費以稱陛下厚親節用之心論燕王子允良乞未加恩劄子同前臣伏見昨燕王𥘉薨其子允良於苫塊中便答書題仍不稱孤子不落官銜今閭巷民家猶能檢按書儀粗知䘮禮而允良為國宗屬全然不曉人事京師士流間傳說為笑有玷聖朝又聞燕王諸子皆失教訓自其父病多不躬侍湯藥纔至父死便乞家財管勾居丧之禮亦無哀戚臣伏見近降詔勑約束𥙷䕃子弟湏是一作令習一無習字試經業盖謂訓誘臣寮子弟欲為臣下立家至於宗室之親號為藩屏全不訓誨使其不知禮義不及民間之子而不孝之聲流聞中外其允良等過失伏慮陛下仁慈以睦宗族未欲别行責罰只乞不縁燕王薨謝别加恩典且與裁抑令其知過俟其向後改悔遷善方與加恩仍乞明以此意戒諭近一作所貴其餘宗室聞之各思嚮善不使外人非笑玷辱皇風取進止論乞與元昊約不攻唃厮囉劄子同前臣風聞魚周詢余靖孫抃等奉使北虜皆有事冝為一無為字北虜中詰問元昊通和之意將来必湏因此别與朝廷生患又聞虜人已欲議移界至漸示相侵禍亂之萌其端可見臣自去年春始蒙聖恩擢在諌列便值朝廷與西賊𥘉議和好臣當時首建不可通和之議前後具奏狀劄子十餘次論列皆言不和則害少和則害多利害甚詳懇切亦至然天下之士無一人助臣言朝廷之臣無一人採臣說今和議垂就禍胎已一作以成而韓琦自西来方言和有不便之狀余靖自北至始知虜利急和之謀見事何遲雖悔無及當臣建議之際衆人方欲急和以臣一人誠難力奪衆議今韓琦余靖親見二虜事冝中外之人亦漸知通和為患臣之前說稍似可採但願大臣不執前議早肯回心則於後悔之中尚有可為之理昨来許賊之物數一作誠已太多然尚有禁青鹽還侵地等事非賊所利幸其因此自絶不遣人来朝廷深戒前非愼自持重因而罷議不落賊計則轉禍為福後䇿可為若賊志愈驕貪心未滿復遣一作馳人使更有湏求則假此爲名亦可拒絶今通和之事爲中國之患大爲二虜之利深萬一西賊貪深利而不惜侵地更無他求急来就和則此時取舎便繫安危陛下冝詔執一作報議之臣定果決之計認賊肯和之意知我害彼利之謀尤湏多方以事拒絶臣計西賊無故而請和者不止與北虜通謀共困中國兼欲詐謀𣢾我併力以吞唃厮囉摩旃瞎旃之類諸族地大力盛然後東向以攻中國耳今若未有他計拒其来和則當賜以詔書言唃厮囉等皆受朝廷官爵父子爲國蕃臣今若講和則不得攻此數族且攻此數族是賊本心所貪聞我此言必難聽約用此為說亦可解和臣所以區區惟願未和者盖臣愚慮知不和患輕易為處置和後患大不可枝梧臣前後奏章論列巳備此乃天下安危大計聖心日夜所憂臣為言事之官見利害甚明若不極言罪當誅戮伏望聖慈特賜省覽取進止論更改貢舉事件劄子同前臣竊聞近有臣寮上言請改更貢舉進士所試詩賦䇿論先後事巳下兩制詳議伏以貢舉之法用之巳乆則弊一有理字當變更然臣謂必先知致弊之因方可言變法之利今貢舉之失者患在有司取人先詩賦而後䇿論使學者不根經術不本道理但能誦詩賦節抄六帖𥘉學記之類者便可剽盗偶儷以應試格而童年新學全不曉事之人往往幸而中選此舉子之弊也今為考官者非不欲精較能否務得賢材而常恨不能如意太半容於繆濫者患在詩賦䇿論通同雜考人數既衆而文卷又多使考者心識勞而愈昬是非紛而益惑故於取捨往往失之者此有司之弊也故臣謂先冝知此二弊之源方可言變法之利今之可變者知先詩賦為舉子之弊則當重䇿論知通考紛多為有司之弊則當隨埸去留而後可使學者不能濫選一作進考者不至疲勞一作濫選今若不改通考之法而但更其試日之先後則於革弊未盡其方凡臣所請者若漫然泛言之恐不能盡其利害請借二千人為率以明變法之便謹條如左凡貢舉舊法若二千人就試常額不過選五百人毎年到省就試及取人之數大約不過此是於詩賦䇿論六千卷中每一人三卷選五百人而日限又迫使考試之官殆廢寢食疲心竭慮因勞致昬故雖有公心而所選多濫此舊法之弊也今臣所請者寛其日限而先試以䇿而考之擇其文辭鄙惡者文意顚倒重雜者不識題者不知故實略而不對所問者限以事件若干以上誤引事迹者亦限件數雖能成文而理識乖誕者雜犯舊格不考式者凡此七等之人先去之計於二千人可去五六百以其留者次試以論又如前法而考之又可去其二三百其留而試詩賦者不過千人矣於千人而選五百則少而易考不至勞昬考而精當則盡善矣縱使考之不精亦選者不至大濫盖其節抄剽盗之人皆以先經䇿論去之矣䇿論逐埸旋考則卷子不多考官不至勞昬去留必不誤比及詩賦皆是已經䇿論粗有學問理識不至乖誕之人縱使詩賦不工亦足以中選矣如此可使童年新學全不曉事之人無由而進此臣所謂變法必湏隨埸去留然後能革舊弊者也其外州解送到且當博採秪可盡令試策要在南省精選若省牓奏人至精則殿試易為考矣故臣但言南省之法此其大槩也其髙下之等仍乞細加詳定大率當以䇿論為先右臣所陳伏乞特加詳覽苟有可採即乞降付有司與前所上言參同詳議著于今式謹具狀奏聞論臣寮不和劄子同前臣伏覩方今夷狄外彊公私内困盗賊並起蝗旱相仍陛下軫念生民深思禍患憂勤之意夙夜焦勞而中外臣寮未能為國家慮逺謀建長䇿少濟時事以寛聖懷近日以来風俗尤薄搢紳之列不務和同或徇私意以相傾或因小事而肆忿紛然毀訾傳布道塗飾已短以遂非各期必勝進偏辭而互說上惑聖聦當陛下思念逺圖之時致陛下日厭紛紜之議至於朝廷得失邦國安危熟視恬然各思緘黙陛下仁慈睿聖務存大體未欲明行責罰以戒澆浮伏望聖慈特降詔書戒勵中外革兹時弊各使同心憂國捨小謀大然後陛下不為小事紛紜煩於聽覽則可以坐運宸筭以康時難取進止論三司判官擇人之利劄子慶曆四年臣伏見近差薛紳為轉運使紳是三司判官資例合作轉運使然外人議論未允者若以一作以昔日差人更有不如紳者亦不足恠盖見朝廷近更新制不次用人凡舊轉運使稍不材者悉令換易忽見却用薛紳所以人言未允昨来京東用沈邈替却一無却字晁宗簡今用薛紳又更不及宗簡此臣之所未喻也平時無事公私上下從容吏無大小奉法守常而巳所以齪一作齷齪㢘謹不為大過雖庸暗繆懦者皆可苟禄偷安而朝廷可以不擇賢愚一例差撥官雖漸濫猶未敗誤今天下事勢豈比嚮時盗賊縱横而州郡無備公私困乏而用度轉多賦役繁興而人户凋耗雖有出人之才尚恐不能了事豈可尚循舊例依次用人一作撥入然臣竊思方今中外差除未肯脫去舊例如紳之軰謂其巳作省判湏且依例除轉運以此思之若省判湏令一作合作轉運則弊在差省判之時不早愼擇也夫前已濫者不能驟去後来者又不擇之永無澄清之時矣臣今欲乞詳定差省判之法毎遇闕人或令本省使副自舉或朝廷先擇舉主令舉主擇人但重其保任同罪之法而不必限其資序如此則省判得人省判得人則將来有好轉運使有好轉運使則逐路澄清民紓用足以此而言擇得一省判為數十州民之福其利甚大夫得人為利甚大則失人為害亦大矣伏望聖慈留意裁擇取進止詳定貢舉條狀一作議科埸奏狀慶曆四年𥘉范仲淹等欲復古勸學詔近臣議於是翰林學士宋祁御史中丞王拱辰知制誥張方平歐陽脩殿中侍御史梅摯天章閣侍講曽公亮王洙右正言孫甫監察御史劉湜九人同上此奏其文則出公手元在外制集今移入此卷臣等準勑差詳定貢舉條制者伏以取士之方必求一作責其實用人之術當盡其材今教不本於學校士不察於郷里則不能覈名實有司束一作求以聲病學者專於記誦則不足盡人材此獻議者所共以為言也臣等叅考衆說擇其便於今者莫若使士一作人皆土著而教之於學校然後州縣察其履行則學者修飭矣故為學制一作立學合保薦送之法夫上之所好一作設法下之所趨也今光一有舉字䇿論則文辭者留心於治亂矣簡其一無此字程式一作試則閎博者得以馳騁矣問以大義則執經者不􅌹於記誦矣一本其詩賦之未能自肆者至此所謂盡人之材者也在此下故為先䇿論過落簡詩賦考式問諸科大義之法此數者一有皆字其大要也其詩賦之未能自肆一作新者雜用今體經術之未能亟通者尚依舊科則中常之人皆可勉及矣此所謂一作為盡人之材者一無此字也其一有它字通禮一有司之所習及一無此九字州郡封彌謄録進士諸科帖經一作塡帖之類皆細碎而無益者一切罷之凡其所為二字一作為法者皆申之以賞罰而勸焉如此則飬士有素一作業取材不遺一有為治之本也五字苟可施行望賜裁擇奏議卷第八論張子奭恩賞劄子材藝之人之一作出論救賑江淮飢民劄子敖敖一從口外遭運使一作外遭轉運論乞不攻唃􅣳囉劄子具奏狀劄子五字一作凡論更改貢舉事件劄子而後可使而一作然居士集卷第八歐陽文忠公集八古詩二十一首有贈余以端谿緑石枕與蘄州竹簟皆佳物也余旣喜睡而得此二者不勝其樂奉呈原父舍人聖俞直講端谿琢出缺月様蘄州織成雙水一作錦紋呼兒置枕展方簟赤日正午天無雲黃琉璃光緑玉潤瑩淨冷滑無埃一作纎塵憶昨開封暫陳力屢乞殘骸避煩劇聖君哀憐大臣閔察見衰病非虚飾猶蒙不使如一作加罪去特許遷官還舊職選材臨事不堪用見利無慙惟苟得一從僦舍一作屋居城南官不坐曹門一作閑少客自然唯與睡相冝以懶遭一作投閑何愜適從來羸􅒒苦疲困況此煩歊正炎赫少壯喘息人莫聽中年鼻鼾尤惡聲癡兒掩耳謂雷作竈婦驚窺疑釡鳴蒼蠅蠛蠓任縁撲蠹一作詩書懶架拋縱橫神昬氣濁一如此言語思慮何由清甞聞李白好飲酒欲與鐺杓同生死一作死生我今好睡又過之身與二物爲三爾江西得請在旦暮收拾歸裝從此始終當卷簟攜枕去築室買田清潁尾夜聞風聲有感奉呈原父舍人聖俞直講夜半羣動息有風生樹端颯然飄我衣起坐爲長歎苦暑君勿猒𥘉涼君勿歡暑在物猶盛涼歸歳將寒清霜忽以飛零露亦漙漙霜露一作四時本無情豈肯私蕙蘭不獨草木爾君形安得完櫛髪變新白鑑容銷一作無故丹風埃共侵迫心志亦摧殘萬古一飛隼兩曜雙跳丸擾擾賢與愚流沙逐驚湍其來固如此獨乆知誠難服食爲藥悞此言真不刋但當飲美酒何必被輕紈答梅聖俞大雨見寄夕雲若頽山夜雨如決渠俄然見青天𦦨𦦨升蟾蜍倐忽隂氣生四面如吹嘘狂雷走昬黒驚電照䕫魖搜尋起龍蟄下擊墓與墟雷聲毎軒轟雨勢隨疾徐𥘉若浩莫止俄收閴無餘但掛千丈虹紫翠橫空虚頃刻百變態晦明誰卷舒豈知下土人水潦没襟𥚑擾擾泥淖中無異鴨與豬嗟我來京師庇身無弊廬閑坊僦古屋卑陋雜里閭鄰注湧溝竇街流溢庭除出門愁浩渺閉戸恐爲瀦牆壁豁四逹幸家無貯儲蝦蟇鳴竈下老婦但欷歔九門絶來薪朝爨欲毀車壓溺委性命焉能顧圖書乃知生堯時未免憂爲魚梅子猶念我寄聲憂我居慰我以新篇琅琅比瓊琚官閑行能薄𥙷益愧空踈歳月行晚矣江湖盍歸歟吾居傳郵爾此計豈躊躇答聖俞白鸚鵡雜言憶昨滁山之人贈我玉兎子粤明年春玉兎一有子字死日陽晝出月夜明世言兎子望月生謂此瑩然而白者譬夫水之爲雪而爲冰皆得一隂凝結之純精常恨處非大荒窮北極寒之曠野養違其性夭厥齡豈知火維地荒絶漲海連天沸天一作火一作炎熱黃冠黒距人語言有鳥玉衣尤皎㓗乃知物生天地中萬殊難以一理通海中洲一作州島窮人迹來市廣州纔八國其間注輦來最稀一作逺此鳥何年隨海舶誰能徧歷海上峯萬怪千竒安可極兎生明月月在天玉兎不能乆人間況爾來從炎瘴地豈識中州霜雪寒渇雖有飲飢有啄羈紲終知非爾樂天髙海闊路一作終茫茫嗟爾身微羽毛弱爾能識路知所歸吾欲開籠縱爾飛俾爾歸詫宛陵詩此老詩名聞四夷清明前一日韓子華以靖節斜川詩見招遊李園旣歸遂苦風雨三日不能出窮坐一室家人輩倒殘壷得酒數杯泥深道路無人行去市又遠索於筐筥一作篋得枯魚乾鰕數種彊飲疾醉昬然便寐旣覺索然因書所見奉呈聖俞少年喜追隨老大厭諠譁慙愧二三子邀我行看花花開豈不好時節亦云嘉因病旣不飲衆歡獨成一作我嗟管絃暫過耳風雨愁還家三日不出門堆豗類寒鴉妻兒強我飲飣餖果與瓜濁酒傾殘壷枯魚雜乾鰕小婢立我前赤脚兩髻丫軋軋鳴雙絃正如艣嘔啞坐令江湖心浩蕩思無涯寵禄不知報鬢毛今巳華有田清潁間尚可事桑麻安得一黃犢幅巾駕柴車奉答原甫見過寵示之作不作流水聲行將二十年吾生少賤足憂患憶昔有罪𥘉南遷飛帆洞庭入白浪墮淚三峽聽流泉援琴寫得入此曲聊以自慰窮山間中間永陽亦如此醉卧幽谷聽潺湲自從還朝戀榮一作寵禄不覺鬢髪俱凋殘耳衰聽重手漸顫自惜指法將誰傳偶欣日色曝書畫試拂塵埃張斷絃嬌兒癡女遶翁膝爭欲彊翁聊一彈紫微閣老適我過愛我指下聲泠然戲一作語君此是伯牙曲自古常歎知音難君雖不能琴能得琴一作其意斯爲賢自非樂道甘寂寞誰肯顧我相留連興䦨束帶索馬去却鎻塵匣包青氊㑹飲聖俞家有作兼呈原父景仁聖從憶昨九日訪君時正見堦前兩叢菊愛之欲繞行百匝庭下不能容我足折花却坐時嗅之已醉還家手猶馥今朝我復到君家兩菊堦前猶對束枯莖槁葉苦風霜無復滿叢金間緑京師誰家不種花碧砌朱欄敞華屋奈何來對兩枯株共坐窮簷何局促詩翁文字發天葩豈比青紅凡草木凡草開花數日間天葩無根長在目遂令我每飲君家不覺長缾卧牆曲坐中年少皆賢豪莫怪我今雙鬢秃須知朱顔不可恃有酒當歡一作飲且相屬依韻奉酬聖俞二十五兄見贈之作與君結交遊我最先衆人我少旣多難君家常苦貧今爲兩衰翁髪白面亦皴念君懷中玉不及市上珉珉賤易爲價玉棄乆埋塵惟能吐文章白虹射星辰幸同居京城遠不隔重闉朝罷二三公隨我如魚鱗君聞我來喜置酒留逡廵不待主人請自脫頭上巾歡情雖漸鮮老意益相親窮逹何足道古來茲理均小飲坐中贈别祖擇之赴陜府無擇明日君當千里行今朝始共一罇酒豈惟明日難重持試思此㑹何甞有京師九衢十二門車馬煌煌事奔走花開誰得屢相過盞到莫辭頻舉手驩情落寞酒量減置我不須論老朽奈何公等氣方豪雲夢正當吞八九擇之名聲重當世少也多竒晚方偶西州政事藹風謡右掖文章煥星斗待君歸日我何爲手把鋤犂汝隂叟奉答聖俞逹頭魚之作吾聞海之大物類無窮極蟲鰕淺水間蠃蜆如山積毛魚與鹿角一龠一作拾數千百收藏各有時嗜好無南北其微一作小旣若斯其大有一作其大固一作大者固莫測波濤浩渺中島嶼生頃刻俄而没不見始悟一作乆始出背脊有時隨潮來暴死疑遭謫海人相呼集刀鋸爭剖一作斫析骨節駭專車鬚芒一作牙侔劒㦸腥聞數十里餘臭乆乃息始知百川歸固有含容德濳竒與祕寳萬狀一作物不一識嗟彼逹頭微誰傳到一作偶傳到一作偶傳入京國乾枯少滋味治平聲洗費炮炙聊兹知異物豈足薦佳客一旦辱一作得君詩虚名從此得京師人不識此魚滄州向防禦見寄以分聖俞辱以詩答送刁紡推官一本無二字歸潤州翹翹名家子自少能慷慨甞從幕府辟躍馬臨窮塞是時西邊兵屢戰輙一作無功屢奔潰歸來買良田俛首學秉耒家爲白酒醇門掩青山對優游可以老世利何足愛奈何從所知又欲向并代主人忽南遷此計亦作乃中悔彼在吾徃一作乃從彼去吾亦退與人交若此可以言節槩夜坐彈琴有感二首呈聖俞吾愛陶靖節有琴常自隨無絃人莫聽此樂有誰知君子篤自信衆人喜隨時其中苟有得外物竟何爲寄謝伯牙子何須鍾子期鍾子怱已死伯牙其已乎絶絃謝世人知音從此無瓠巴魚自躍此事見於書師曠甞一鼓羣鶴舞空虚吾恐二三說其言皆過歟不然古今人愚智邈巳殊奈何人有耳不及鳥與魚二月雪寧傷桃李花無損杞與菊杞菊吾所嗜惟恐食不足花開少年事不入老夫目老夫無遠慮所急在口腹風晴日暖雪𥘉銷踏泥自採籬邊緑歸田四時樂春夏二首秋冬二首命聖俞分作春風二月三月時農夫在田居者稀新陽晴暖動膏脉野水泛灩生光輝鳴鳩聒聒屋上啄布糓翩翩桑下飛碧山逺映丹杏發青草暖眠黃犢肥田家此樂知者誰吾獨知之胡不歸吾已買田清潁上更欲臨流作釣磯南風原頭吹百草草木叢深茅舍小麥穗𥘉齊稚子嬌桑葉正肥蠶食飽老翁但喜歳年熟餉婦安知時節好野棠棃密啼晚鶯海石榴紅囀山鳥田家此樂知者誰我獨知之歸不早乞身當及彊健時顧我蹉跎已衰老明妃曲和王介甫作胡人以鞍馬爲家射獵爲俗泉甘草美無常處鳥驚獸駭爭馳逐誰將漢女嫁胡兒風沙無情貌如玉身行不遇中國人馬上自作思歸曲推手爲琵却手琶胡人共聽亦咨嗟玉顔流落死天涯琵琶一作此曲却傳來漢家漢宫爭按新聲譜遺恨已深聲更苦纎纎女手生洞房學得琵琶不下堂不識黃雲出塞路豈知此聲能斷腸盆池西江之水何悠哉經歷灨石險且回餘波拗怒猶一作獨涵去澹奔濤擊浪常喧豗有時夜上滕王閣月照凈練一作緑無纎埃楊䦨左里在其北無風浪起傳古來老蛟深處猒窟穴蛇身微行見者猜呼龍瀝酒未及祝五色粲一作照爛髙崔嵬忽然遠引千丈去百里水面中分開收蹤滅跡莫知處但有雨雹隨風雷千竒萬變聊一戲豈一作肯顧溺死爲可哀輕人之命若螻螘不止山嶽將傾頽此外魚鰕何足道猒飫但覺腥盤杯壯哉豈不快耳目胡爲守此空牆隈陶盆斗水仍下漏四岸乆雨生莓苔遊魚撥撥不盈寸泥濳日炙愁暴鰓魚誠不幸此跼促我能決去反徘徊再和明妃曲漢宫有佳一作美人天子𥘉未識一朝隨漢使遠嫁單于國絶色天下無一失難再得雖能殺畫工於事竟何益耳目所及尚如此萬里安能制夷狄漢計誠已拙女一作美色難自誇明妃去時淚灑向枝上花狂風日暮起飄泊落誰家紅顔勝人多薄命莫怨春風當自嗟奉送原甫侍讀出守永興一作奉送永興安撫劉侍讀酌君以荆州魚枕之蕉贈君以宣城䑕須之管酒如長虹飲滄海筆若駿馬馳平坂愛君尚一作年少力方豪嗟我乆衰歡漸鮮文章驚世知一作聞名早意氣論交相得晚魚枕蕉一舉十分當覆盞䑕須管爲物雖微情不淺新詩醉墨時一揮别後寄我無辭遠哭聖俞昔逢詩老伊水頭青衫白馬渡伊流灘聲八節響石樓坐中辭氣凌清一作髙秋一飲百盞不言休酒酣思逸語更遒河南丞相稱賢侯後車日載枚與鄒我年最少力方優明珠白璧相報投詩成希深擁鼻謳師魯卷舌藏戈矛三十年間如轉眸屈指十九歸山丘凋零所餘身百憂晚登玉墀侍珠旒詩老虀鹽太學愁乖離㑹合謂無由此㑹天幸非人謀頷鬚已白齒根浮子年加我貌則不歡猶可彊閑屢偷不覺歳月成淹留文章落筆動九州釡甑過午無饙餾良時易失不早收篋櫝一作櫃瓦礫遺琳璆薦賢轉石古所尤此事有職非吾羞命也難知理莫求名聲赫赫掩諸幽翩然素旐歸一舟送子有淚流如溝居士集卷第八熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正石枕蘄簟哀憐一作矜憐臨事一作任事甞聞一作昔時好飲一作愛飲夜聞風聲以飛一作巳飛共侵迫共一作苦清明前一日奉呈聖俞得酒一作得濁酒贈别祖擇之煌煌一作皇皇落寞寞一作莫逹頭魚剖析一作斫析夜坐彈琴見於書一作載諸書二月雪寧傷一作損歸田四時樂晚鶯一作曉鶯明妃曲無常處石本作隨山川漢宫一作漢家盆池楊闌左里一作揚瀾左蠡輕人之命石本作奈何人命魚誠石本作魚生幸此石本作幸遭能決去反石本作可決去猶書簡卷第八歐陽文忠公集一百五十一與丁學士寳臣字元珍皇祐四年某啓自聞南方㓂梗思欲附問凶禍閑居難求的便雖在哀殞翹想之心不可道也元珍學行優深才當逺用遘一作罹此不幸古人多然在處之有道爾古之君子所以異於常人者能安常人之所不能安也所恨某居此際不能奔走耳某衰病無復生理今秋欲扶護歸郷恐趂葬期不及則且權厝郷寺俟它年耳忽偶黄莘先輩過云賢兄在舒州因得附此草草不能盡鄙懷當續馳訊也秋熱寛中自愛某再拜又嘉祐四年元珍淹屈于外交游所冝出力旣黙無所爲而至於書問亦不能時致其勤其爲慚罪不待言矣某自蒙思歸院雖稍清閑而忽忽度日公私無所益此處京師者汨汨之常態也幸非甚愚頗知脫此而逺去然事有不得遂去者古人所謂不如意十常八九者殆此類也今歳廷試得人之盛中外共慶況在佳婿此豈非乆滯中一可喜事哉今因胡推官行謹奉狀相㳄陸君行當别布懇又嘉祐四年某向在府中困於煩冗乆不奉狀徒用瞻思專人遽來特辱嘉問承渉夏巳來體氣清福深所欣慰元珍才行並髙而困蹇如此吾徒之責也某昨𬒳煩使初不敢辭然几案之才素非所長加以早衰多病筋力不支屢自陳乞蒙恩得解去實出天幸然請外之志尚未獲素心又以殘史終篇有期夏秋之交可決南去相見未涯千萬鄙懷臨𥿄不能悉布惟慎重自愛以順休復答郭刑部輔某啓方欲因兒子行奉狀遞中忽辱書可量欣慰兼審春寒動履清勝承諭以嵩少之游豈勝跂羡此樂常爲山人處士得之衣冠仕宦比其汲汲得如其志不老則病矣雖有登臨之興勉彊而爲之巳不勝其勞也若神完氣銳惟意所適如公之樂者百無一二人也如某者目固不能逺望足亦不任登髙矣可歎可歎相見未涯嚮暖加愛與朱職方處約嘉祐五年某啓乆不奉状夏熱公外竊惟體履休勝陳詵寺丞佳士也曽在滁州同官今其南歸願拜識幸希留念也屬唐史終篇忙迫作書不謹備恕之方暑慎愛與蔡省副某頓首公私忽忽乆闕致誠辱教字承巳登舟遂不復一得叙别可勝瞻戀短景日暮還家客巳盈室寢食殆廢習以爲常以此乆不奉問慙罪慙罪汝隂君子乆處疾少間當來歸未見惟寛中自愛審用藥餌不盡區區與王發運鼎字寳臣嘉祐二年某啓中春甞辱恵問不審渉夏暑毒體氣如何某自出貢院爲羣士諠詬㝷而入夏京師旱疫家人類染時氣區區中復有病患憂煎以此乆不附狀寳臣治漕南方雖乆淹于外然振綱革弊公私所頼者不細比於碌碌于此無所云𥙷者所得多矣某再請洪井未得屢罄所懷期於必得也未相見間惟爲時自重謹於遞中奉此不宣某再拜又嘉祐二年某啓衰病無悰難乆於此加以私計日思南去未可得者無他近時内外制請便例不得從爾柰何柰何自之翰有事故人零落所存者幾更復何心追後生於紛華某將入貢院時之翰疾已甚比出遂不見遽失斯人爲恨何勝與同年相知尤甚遂及之愁人愁人中間承惠金櫻煎近方開而服之其製一作煎得尤精多荷中年衰病太甚世情已去但猶藉藥力且扶旦夕爾遽中不子細與馬運判遵皇祐二年某啓乆别欣此瞻候隂寒道中尊候休勝河役動衆疲民利害繄公處置之耳他俟握手不能具述因人走此不宣某再拜運判裏行執事十二月七日答韓欽聖宗彦嘉祐二年某啓昨使舟行日不及攀别深以爲恨人至辱書伏承署事以來當此祁寒體況清福實以爲慰也外𥙷之樂得之有素伏讀佳作益以起予無用之質衰病颯然造物者畏浮議以見縻柰何柰何歳晚以時自重人還謹奉此爲謝不宣某再拜欽聖提刑學士十一月二日辱寵恵佳篇欽誦不巳旦夕和得遞中附上新甘竒味珍荷也珍荷也部頭事藝稍進得賢者齒問更増勉勵也呵呵劉守到必還使司當復清淡也甞說襄陽山水一經真賞果如鄙言否答李學士嘉祐八年某啓自遭罹國䘏哀摧殆無以生伏惟感慕攀號何以堪處伏承逺賜存慰豈勝感咽孤拙遭遇昔與安道皆奉清光今兹衰晚才薄責重未知死所何以論報嚮秋更冀以時加愛與王學士某頓首京師區區自朝及夕無益於公私而思接賢者之論亦不時得近兩辱見顧皆不獲迎候豈勝爲恨寒隂不審氣體何似旦夕當卜至門未間先此爲謝冀有以亮之而巳又熈寧三年此帖又載第九卷却云與薛少卿某啓急足至辱書喜承尊候萬福貴眷各安甚慰企想近入京衙校過潁捧手教㝷於遞中奉狀必逹視聽某到此以弊止未完固少留以葺然欲遂爲掛冠之請逺近相知皆相督以蔡是自乞湏且勉赴到任徐請歸休未遲今遂治行二十一二間上道三四日至蔡别拜状恐乆滯急足忙中作書不悉答張學士嘉祐年某啓中間辱恵書未遑脩答又辱恵書意愛勤勤重増感愧某以甞患兩手中指攣搐爲醫者俾服四生丸手指雖不搐而藥毒爲孽攻注頥頷間結核咽喉腫塞盛暑中殆不聊生近方銷釋衰朽百病交攻難堪乆處兹地漸欲謀爲退縮得免罪戾以疾爲名而去猶是幸人使騎廵歷何時一過都下少遂握手未間以時自愛仲儀䘮子應滯行期許事猶煩餘暇沖卿恐猶未歸未及作書爲懇又嘉祐年某啓區區乆不馳問豈勝瞻勤暑毒竊惟體履清福兼承權留務都邑孔道諒少勞神中間甞辱恵問不時修報亦可知其冗率也慚感慚感某唐史終篇遂當復㝷江西之請衰病無堪爲歸老之謀爾未由握手莫罄鄙懐惟冀爲時自愛以副企詠又某啓前日專詣舟次值不在略見賢郎比欲旦夕再祗候而大雨連綿無由出門兼恐已行忽辱手教乃知即今方行不獲面别惟以時自愛瞻企何已東南應亦有所欲但倉卒不暇續當有信咨煩也蔣同年千萬爲伸意近得書亦當作書也南郡近有書去矣人立待草草又某啓衰病無堪叨竊過分方深愧懼遽辱誨存兼承恵寄佳篇豈勝珍誦湖園野趣近郡所無夢寐在焉何甞忘也若得偶逃罪責歸老其間遂養慵拙何勝幸也歳晚寒凛𣢾言未期惟冀以時自重答陸學士經字子履至和二年某啓使北徃返六千里早衰多病不勝其勞使者輩徃凡七八獨疲劣者尤覺其苦也還家人事日益區區浮生何處得少休息承子履在洛甚安又知來鄭書碑咫尺莫得奉見獨見勝之備知動止辱書益用爲慰漸暄珍愛人還謹此又熈寧四年某啓乆闕奉問忽枉以書奚勝感慰兼審經寒履況沖𥙿某衰病餘生得請歸老而遷官兼職皆出特恩榮幸之愧無以爲諭第乆疾累年頓難減損然得此閑適足以安養又其幸也遂復田畒無期㑹見企仰而巳千萬加愛又冶平四年某啓早來辱枉使車重増媿感過午遂熱承動履清和方苦昬乏忽𬒳手教兼恵以藥并方尤荷意愛之厚第藥性差熱當漸漸服之也竊承代歸有期依依之意愚當與潁民同也餘留靣布人還少奉此與刁學士約某啓前日承寵訪秋暑計尊候康和以居處狹陋欲卜定力約數君奉同閑話一日旣稍寛涼又佳水烹一兩盃茶幸告月初約一日恐爲㑹處多故先次一作此咨啓答連職方庶字君錫天聖巾某惶悚頓首上黨三哥良執少一作乆别伏想體中佳好近者兄長行獲奉短札懇悃之素具之如昨洎任進來得三兄信伏知軒車猶未歸仙墅某自返黨閭邈然塊處日以賤事相逼魚鱗左右至於筆硯之具視同長物而巳前承寵示佳句乆欲爲答柰六情底滯不能叩課加之對雷門之前非布皷之能過也但効曹生游揚季布之名日得傳播於漢東士流之間諷誦傳冩者迨疑使中山兎悲而洛陽紙貴也今勉成一首以報來賜小生學非師授性且冥憃仰頼良交時賜教誘若不爲索其病疵而姑効司馬生言好字則三哥顧我之厚薄可由斯而見矣崢歳且晏平居寡徒想望故人能不愴恨時因北風幸無忘徳音之恵某頓首又嘉祐五年某啓近甞辱恵問不審寒來體履如何京師區區幸時與元禮相見然衰病鮮悰無復壯年游從之樂也殘史巳終篇南歸之思如欲飛爾君錫決然遂獲閑居之適應知此趣真老者之所便也況竊禄甚厚於國無𥙷豈堪碌碌乆此乎握手未期聊爲君錫道此盛寒多愛又熈寧年某啓令姪過郡辱書粗尉積年思企之勤兼得一詗起居康福外絶世欲内養天真冝其極方外之樂享眉夀於無涯某寵禄盈溢心志衰零尚此盤桓未償夙願然亦不出新春歸計可決第思埸屋之游四十年之舊零落之餘所存者幾而吾二人者邈焉各在一方未知握手之期用此不勝區區爾歳律遒盡寒色嚮深惟以時加愛又熈寧四年二月某啓守蔡忽巳半歳老年百病交攻賴此閑僻偷安然猶經春在告人事曠廢咫尺相去闕於馳問使至辱書旣慚且感喜承尊候康𥙿某以衰殘未遂一丘之願勉彊憂畏惟思髙賢逺識早能超出塵累冝享福壽於無涯也企慕企慕相見未期初暄保愛又熈寜四年四月某啓相去不逺恵然之顧出於乗興古賢佳事有望於故人但不敢坐邀爾某入新年陡更衰殘昨三月中欲遂伸前請決計歸休封遞角次得闕報陜兵爲孽逺近驚懼朝廷方有西顧之憂遂且少止今已寧息非晚必期得請也若遂還潁則相去益逺至時或一就蔡枉顧可否千里命駕近世未聞亦是一時竒事有望有望亂道思潁詩一卷粗以見志閑中可資一噱答連郎中庠字元禮某啓才薄力劣任非其稱初無報効徒自爲勞人事都廢恃親舊見哀而不責小故湖外風土如何嚮承體中亦小不佳今喜清康君錫兄亦乆不承問多事怱怱不曽作得一書慙悚慙悚恵柑甚佳逺地難致尤爲珍感鳯團數餅聊表信而已歳律遽窮新春多愛又某啓永賢郎小娘子見過故人有佳兒女朋友所當共慶也兼辱簡字恵以熊白并蹯鮓等皆飲酒具獨患累日苦目昬未能近盃杓也朝暮乗閑道話答丘寺丞某頓首今日食後就寢方覺擁𬒳卧讀太白集忽辱恵佳篇豈勝感愧當亦牽強爲報恐滯使人且此爲謝答韓宗彦嘉祐四年本卷前有答韓欽聖二幅即宗彦也誤寘此某啓專人辱書承此初暑體履清勝實慰瞻勤前在府中甞辱恵問牽以俗冗不時布𣢾昨以衰病屢自乞蒙恩俾解煩劇雖江西前請未獲素心而疲憊計不能乆粗得休息亦不勝其幸方得復從諸公之遊而子華遽遷執憲然命出中外稱愜某旣得閑適遂且盤桓過夏秋冬當遂前請相見未涯但聞風采行𬒳嚴召未間暑熱以時自愛因人還謹此爲謝答黎宗孟醇熈寧二年某啓近遣家兵至萬夀奉迎有書計逹專人恵教乃承路中得疾問來人不能詳言即日必惟巳獲痊安旅中有疾亮難乆也辱諭㝷醫細思皆小小外事不足動懷豈冝輕爲去就許昌避疑介至亳又陳曹爲梗今又復然足驗世人常態處處如此然則㝷醫所至未必見容但當寛度包之爾冨丞相奉知必不淺已教他舉留再任莫且隠忍終之否某性自少容老年磨難多漸能忍事前後蒙見教者豈非欲某寛中以忍事耶却敢以此意奉規不恠不恠未敢奉邀必且徑還家也嚮暖加愛不宣某再拜與裴如晦煜嘉祐五年某啓酷暑阻奉見竊惟體氣佳和新事頗動人耳目惟静處聽閙益覺其喧也聖俞􅉠助遂獲幾何苟有所得幸且勿送其家也望略批示或約相見爲佳謹此咨啓某再拜如晦學士廿四日答杜植嘉祐五年某啓公私多故乆闕馳誠然亦乆不承問忽於遞中辱書喜慰無量兼審經寒動履清勝不相見數年間親舊零落所有無幾在者衰殘老病於理冝然其間不能量力決然早去而留連禄仕任過其分勉強碌碌迄無可稱以取責於一時而貽譏於後世則鄙人於數老叟中又獨負此若寵利紛華不惟非素心所溺就令心有所好大抵晚年實能享者於身所得幾何由是言之得失不較可知自去夏迨今病恙交攻尤苦齒牙飲食艱難則嚮所謂於身所得者無復有爾可嘆可嘆不相見乆因書及此聊當一笑爾聖俞家賴諸故人力得不失所漳州兒子軰更在教育他事應在雅懷有以處之不待言也新歳千萬加愛因風不惜恵問以慰瞻仰不宣某再拜答陸伸某啓人至辱示長書及古今雜文十軸其研窮六經之旨究切當世之務與其辨論文辭之際如決壅塞闢通衢以瀉浩渺之無窮御駔駿而馳騁然則吾子之所能與其所用心者不待相見而可知矣某衰病廢學多難於時常幸得空閑之處苟樂於自棄而吾子獨不棄之惠然見及何以當之欣慕感媿聊兹爲謝幸察其區區與丁學士見英辭類稾巳下續添元珍屈處冗務士夫所歎清議尚存自當奮滯惟通塞有時少須之耳某碌碌于此為庸人出處之計前以屢陳矣又冗務誠非賢者所處然屈伸之際又非賢者不能安也凡在交舊莫不以此爲慮而未知所以為之奈何自古賢逹之士固甞有所屈伸其所以處之者乃其平生所學者耳足下所存逺大故知必能及此敢道之與蔡省副嘉祐年見名賢簡啓某啓昨日無以為禮深用慙靦宿來動履想佳然中席遽起遂不可留變此新例他時東齋之㑹敢不遵用故事也適得沖卿簡言原父巳送詩云某殊未有一句欲借一拭目以發衰鈍三日欲去出城送沖卿能徃否此不敢強閑及之又嘉祐年某啓昨日知與沖卿賞月必有餘樂某亦邀同軰二三人淡坐不飲殊亦鮮歡但飲冷過多又病真不能追逐少年矣前時烏絲欄輒留欲書其後尚未有暇適因尋書别得少佳者且納上聊資揮灑章望之長言試爲一闋疑後日方得奉見謹此咨布與裴學士名煜字如晦嘉祐八年以祕閣校理知潤州前有嘉祐五年一帖某啓公私冗瑣人事多廢不獲奉問忽巳逾時專人辱書承經寒氣體清安稍慰瞻想也某年齒日増心志日耗材薄任重憂責無涯故人在逺誰與教告誠未知稅駕之所也如晦代歸有期竊承私門多所憂撓顧知紛紛此世少無事人也恵甘誠爲佳物然不飲巳朞年矣茶湏甞方敢致謝嚮春和更希慎愛專人還謹奉此不宣某頓首如晦學士足下二月三日與趙學士名彦若字元考熈寜年脩啓頃蒙軒騎少留忽忽殆踈𣢾奉然每親餘論獲益已多少别方爾傾馳辱書感愧旦夕亮且就道霜月嚮寒千萬愛攝不宣歐陽脩奉啓太常學士執事八月晦日承示集古跋尾數事頓發蒙滯恨不早拜呈也書簡卷第八與丁學士第一帖不可道一作不可一二道不能安一作難安歸郷此下一有以風波道逺五字第二帖況在佳壻此豈非乆滯中一可喜事哉十五字一作況在佳壻髙與良增喜慰第三帖深所一作乃心與王發運中春一作春中答李學士以時一作爲時答韓宗彦疲憊計不能乆一作疲憊交攻不能自支集古録跋尾卷第八歐陽文忠公集一百四十一唐徐方回西墉記寳應年右西墉記唐徐方回撰方回云寳應中為南陽令得崔子玉所作平子銘末二十一字陷于㕔之西墉按今西鄂石本末句見在方回所得乃南陽半石之末也今又亡矣惜哉右集本唐禹廟碑大曆三年叚季展書崔巨文傳於今者絶少皆不及此碑季展他所書亦不偉於此治平二年上元日書右眞蹟唐崇徽公主手㾗詩大曆四年右崇徽公主手㾗詩李山甫撰崇徽公主者僕固懷恩女也懷恩在肅宗時先以二女嫁回紇其一嫁毗伽可汗少子後號登里可汗者是也其一不知所嫁何人唐書懷恩傳及回紇傳皆不載惟懷恩所上書自陳六罪有云二女逺嫁為國和親以此知其又甞嫁一女爾此所謂崇徽公主者懷恩㓜女也懷恩既反引羌渾奴刺為邊患永泰中病死於靈武其從子名臣以千騎降唐大曆四年始以懷恩㓜女為集本有崇徽二字公主又嫁回紇即此集本有公主二字也治平元年三月八日書右眞蹟唐僧懷素法帖大曆十二年右懷素唐僧字藏真特以草書擅名當時而尤見珍於今世予甞謂法帖者乃魏晉時人施於家人朋友其逸筆餘興初非用意而自然可喜後人乃棄百事而以學書為事業至終老而集本無此字窮年疲弊精神而不以為苦者是真可笑也懷素之徒是已治平元年八月八日書右眞蹟唐重摹呉季子墓銘大曆十四年右呉季子墓銘自前世相傳以為孔子所書據張從紳疑記云舊石堙滅開元中玄宗命殷仲容模搭其書以傳然則開元之前已有本矣至大曆中蕭定又刋于石則轉相傳模失其真逺矣按孔子平生未甞至呉以史記世家考之其歷聘諸侯南不踰楚推其歳月蹤跡未甞過呉不得親銘季子之墓又其字特大非古簡牘所容第以其名傳之乆不可遽廢故録之以俟博識君子右集本又右古篆文曰嗚呼有呉延陵季子之墓自前世相傳以為孔子所書據張從紳疑記云舊石堙滅開元中玄宗命殷仲容榻本遂傳於世然則開元以前已有刻石矣其後正元中鄭播又為記盧國遷建堂樹碑則今本又非仲容所模者字亦竒偉莫知何人所書按孔子未甞至呉以史記世家考之其歷聘諸侯南不逾楚推其歳月蹤跡無過呉之理不得親銘季子之墓又其字特大非簡牘所容惟博物君子必能辨之右真蹟唐竇叔蒙海濤誌大曆中右海濤誌竇叔蒙撰其書六篇一曰海濤誌二曰濤曆三曰濤日時四曰濤期五曰朔望體象六曰春秋仲月漲濤解余嚮在揚州得此誌甚愛之張于座右之壁冀於朝夕見也巳而夜為風雨所壞其後求之凡十五年而復得斯本以示京師好事者皆云未甞見也右集本唐鹽宗神祠記大曆中右鹽宗神祠記錢義方撰近時有尚書郎張席自言家寓解州為余言安邑解縣兩池鹽事云夏月鹽南風來池面紫色湏臾凝結如雪土人謂之漫生鹽而兩池歳役畦夫數百種鹽公私秏弊而州縣吏縁以為姦利棄漫生鹽不取誣其苦不可食席博學能言漢唐事尤詳為余復言前世鹽皆自生開元中姜師度為河中尹而鹽池涸始置鹽屯故唐格自開元後遂有畦夫營種之課席因上書論鹽漫生之利官遂罷畦夫而公私皆以為然而議者或害其事乃云漫生鹽味苦不可食或云暫結復銷不可畜聽者方惑其事余因讀義方所記乃云若隂陽調和鬼神驅造不勞人而擅其利與夫鑿泉煑海不相為謀由是知唐世鹽非營種為決可信義方大曆時為榷鹽使余家集録古文不獨為傳記正訛繆亦可為朝廷决疑議也右集本唐鴈門王田氏神道碑代宗時右唐魏博節度使鴈門郡王田承嗣碑營田副使裴抗撰子緒碑節度判官丘絳撰按唐書列傳承嗣十一子維朝華繹綸綰緒繪純紳縉而緒次當第七此二碑皆以緒為第六子而無綰自緒而下有繪純紛縉與史不同二碑當時故吏所作必不誤蓋史之繆也其文與字皆不嘉故余特録其世次而巳右眞蹟唐李憕碑大曆四年右李憕碑李紓撰新唐書列傳云憕十餘子江涵渢瀛等同𬒳害惟源彭免據李紓載憕子見於碑者實十二人曰右𥙷闕彭汝州刺史深華隂丞渢左驍衞兵曹瀛硤石丞沆洪州别駕澥洛陽尉渭司農主簿汶又云公之薨也彭從玄宗南狩次公而殁深授任他郡其在洛陽者長子江第三子涵與華隂驍衞而又少子合六人皆從公殱千虜刃硤石而下與衆孫之在者僅以孩提免如紓所記憕子盡於是矣未甞有源也紓但言衆孫孩亦不云有未名子也然則源者史家何從而得之據史言源為司農主簿以碑考之源當為汶也又據碑方憕殁于賊也彭深沆澥渭汶六子獲免而史惟云源彭此當以碑為正紓當代宗時為憕作碑自云與憕有通家之好㓜奉升堂之慶冝知憕事不繆也右集本唐甘棠館題名歳月見本文右甘棠館題名自唐徳宗貞元以來止於㑹昌文字多已磨滅惟高元𥙿韋夏卿所書尚可讀甚矣人之好名也其功徳之盛固巳書竹帛刻金石以垂不朽矣至於登高逺望行旅徃來慨然寓興於一時亦必勒其姓名留于山石非徒徘徊俯仰以自悲其身世亦欲來者想見其風流夏卿所記留連感愴意不淺也如髙韋二子皆當時知名士也史傳載之詳矣昔杜預沈碑漢水謂萬世之後谷或為陵庻幾復出以見于世其為慮深矣然預之功業不待碑而自傳其區區於此者好名之弊也故士或勤一生以自苦或餓死空山之中甚者蹈水火赴刀鋸以就後世之名為莊生所笑者有矣故余於集古毎得前世題名未甞不録者閔夫人之甚好名也右集本唐汾陽王廟碑貞元二年右郭子儀廟碑高參文其敘子儀功業不甚詳而載破墨姓處木討沙陁處蜜事則唐書列傳無之蓋子儀微時所歷集本作立其後遂立大勲冝乎史略不書也然唐書有處宻處月朱耶孤注等皆是西突厥薛延陁别部名號余於五代史為李克用求沙陁種類卒不見其本末而參謂處蜜為沙陁不知其何所據也按陳翃子儀家傳亦云討沙陁處墨十二姓與參所書頗同售書轉蜜為宻當以碑為正右眞蹟唐郭忠武公將佐略貞元十二年右忠武公將佐略陳翃撰忠武公者郭子儀也翃之所書亦為盛矣猶言得其六七蓋其官至宰相者七人為節度使者二十八人尚書丞郎京尹者十人㢘察使者五人據翃所得而書者實六十人而顯名於世者蓋五十人雖喬琳周智光李懷光僕固懷恩等䧟於禍敗然杜鴻漸黄裳李光弼光進之徒偉然名見於當時而垂稱於後世者亦不為少豈惟得失相當而已哉雖汾陽功業士多喜附以成名然其亦自有以得之也其忠信之厚固出其天性至於處冨貴保功名古人之所難者謀謨之際冝亦得其助也治平甲辰秋社前一日書右眞蹟唐濟瀆廟祭器銘貞元十三年右濟瀆廟祭器銘張洗撰碑云置齋郎六人唐自髙宗以後官不勝其濫矣洗之所記乃開元時事州縣祠廟置齋郎六人可知其濫官之弊然史家不能詳載惟於碑刻偶見其一二爾治平甲辰秋分後一日中書東閤雨中書右眞蹟唐神女廟詩貞元十四年右神女廟詩李吉甫丘玄素李貽孫敬騫等作余貶夷陵令時甞泛舟黄牛峽至其祠下又飲蝦蟇碚水覽其江山巉絶窮僻獨恨不得見巫山之竒秀毎讀數子之詩愛其辭翰遂録之一有遂為隹玩字右集本唐馬寔墓誌銘貞元十四年右馬寔墓誌銘售歐陽詹撰并書其文辭不工而字法不俗故録之寔之事迹亦無足紀也右集本又詹之文為韓退之所稱遂傳于世然其不幸早死故其傳者不多刻石之文秪有此與福州佛記耳尤可惜也右眞蹟唐石洪鍾山林下集序貞元二十年右鍾山林下集序者石洪為浮圖緫悟作也石洪為處士而名重當集本作一時者以常為韓退之稱道也唐世號處士者為不少矣洪終始無佗可稱於人者而至今其名獨在人耳目由韓文盛行於世也而洪之所為與韓道不同而勢不相容也然韓常歎籍湜輩叛已而不絶之也豈諸子駮雜不能入於聖賢之域而韓子集本有獨字區區誨誘思援而出於所溺歟此孔孟之用心也治平元年八月八日書是日上以霖雨不止分命羣臣祈禱余祈于太社既歸而雨遂止某謹記右眞蹟唐房太尉遺愛碑隂記元和六年同是石洪撰附此石洪文字罕見於後世故特録之右見綿本拾遺唐賀蘭夫人墓誌貞元七年右賀蘭夫人墓誌唐陸䞇撰或云䞇書也題曰祕書監陸公夫人墓誌銘而䞇自稱姪曾孫此石在常州一有陸監名齊望五字右集本唐陸文學傳咸通十五年右陸文學傳鴻漸自撰茶之見前史蓋自魏晉以來有之而後世言茶者必本陸鴻漸蓋爲茶著書自其始也至今俚俗賣茶肆中甞置一甆偶人於竈側云此號陸鴻漸鴻漸以茶自名於世乆矣考其傳著書頗多曰君臣契三卷源解三十卷江表四姓譜十卷南北人物志十卷呉興歷官記三卷潮州刺史記一卷茶經三卷占夢三卷其多如此豈止茶經而已哉然其他書皆不傳右集本唐辨正禪師塔院記貞元中右辨正禪師塔院記徐峴書誠能行筆而少意思也徃時石曼卿屢稱峴書曼卿多得顔栁筆其書與峴不類而逺過之不知何故喜峴書也余當曼卿在時猶未見峴書但聞其所稱曼卿殁已乆始得此書遂録之爾右眞蹟唐韓愈盤谷詩序貞元中右送李愿歸盤谷序韓愈撰盤谷在孟州濟源縣正元中縣令刻石于其側令姓崔其名浹今已磨滅其後書云昌黎韓愈知名士也當時退之官尚未顯其道未為當世所宗師故但云知名士也然當時送愿者為不少而獨刻此序蓋其文章已重於時也以余家集本挍之或小不同疑刻石誤集本世已大行刻石乃當時物存之以為佳翫爾其小失不足較也右眞蹟唐韓退之題名元和四年已下七篇皆韓文公撰故不與别碑歳月為叙右韓退之題名二皆在洛陽其一在嵩山天封宫石柱上刻之集本有記龍潭遇雷事六字天聖中余為西京留守推官與梅聖俞遊嵩山入天封宫裴回柱下而去遂登山頂至武后封禪處有石記戒人遊龍潭者毋妄語笑以黷神龍龍怒則有雷恐因念退之記遇雷意其有所試也其一在福先寺塔下當時所見墨蹟不知其後何人模刻于石也治平元年三月廿二日書右眞蹟唐田弘正家廟碑元和八年右田弘正家廟碑昌黎先生撰余家所藏書萬卷惟昌黎集是余為進士時所有最為舊物自天聖以來古學漸盛學者多讀韓文而患集本訛舛惟余家本屢更挍正時人共傳號為善本及後集録古文得韓文之刻石者如羅池神黄陵廟碑之類以挍集本有余家二字集本舛繆猶多若田弘正碑則又尤甚蓋由諸本不同徃徃妄加改易集本有今字以碑挍集印本與刻石多同當以爲正九字集本作𥘉未必誤多爲挍讎者妄改之乃知文字之傳乆而轉失其真者多矣則挍讎之際決於取捨不可不慎也印本云銜訓事嗣朝夕不怠徃時用他本改云銜訓嗣事今碑文云銜訓事嗣與印本同知其妄改也印本云以降命書用他本改爲降以命書今碑文云以降命書與印本同知爲妄改也印本云奉我天明用他本改云奉我王明今碑文云奉我天明與印本同知爲妄改也此類甚多略舉三事要知改字當慎也治平元年三月八日書右眞蹟唐韓愈南海神廟碑元和十五年右南海神廟碑韓愈撰陳諫書以余家舊藏集本挍之皆同惟集本云蜿蜿蜒蜒而碑為集本作云蜿蜿虵虵小異當以碑為正今世所行昌黎集類多訛舛惟南海碑不舛者以此刻石人家多有故也其妄意集本無此字改易者頗多亦賴刻石為正也治平元年七月二十日書右眞蹟唐韓愈羅池廟碑長慶中右羅池廟碑唐尚書吏部侍郎韓愈撰中書舎人史館修撰沈傳師書碑後題云長慶元年正月建按穆宗實録長慶二年二月傳師自尚書兵部郎中翰林學士罷為中書舎人史館修撰其九月愈自兵部侍郎遷吏部集本有然則據建碑時愈未為吏部沈亦未為舎人字碑言栁侯死後三年廟成明年愈為栁人書羅池事子厚以元和十四年卒至集本有後三年字愈作碑時當是長慶三年考二君官與此碑亦同但不應在元年正月蓋後人傳模者二十三字集本作則二君官當與此碑同其書元年正月蓋傳模者誤刻之爾今世傳昌黎先生集載此碑文多同惟集本以歩有新船為渉荔子丹兮蕉黄蕉下加子二十五字集本作此文與碑多同惟集本云渉有新船而碑以渉為歩荔子丹兮蕉子黄碑蕉下無子字當以碑為是而碑云春與猿吟而集本作兮秋鶴與飛則疑碑之誤也嘉祐八年六月二日書右眞蹟唐韓愈黄陵廟碑長慶元年右黄陵廟碑韓愈撰沈傳師書昌黎二字集本作韓集今大行於世而患本不真余家所藏最號善本世多取以為正然時時得刻石挍之猶不勝其舛繆是知刻石之文可貴也不獨為翫好而巳黄陵碑以家本挍之不同者二十餘事如家本言降小君為夫人而碑云降小水之類皆當以碑為正也嘉祐八年十月十八日書右眞蹟唐胡良公碑長慶三年右唐胡良公碑韓愈撰良公者名珦韓之門人張籍妻父也今以碑挍余家所藏昌黎集本號為最精者文字猶多不同皆當以碑為正茲不復紀碑云珦子逞廼巡遇述遷造而集本無巡他流俗所傳本集本有又字有云遇或為巡者皆非集本有也字當以碑為正治平元年七月晦日書右眞蹟唐韓文公與顚師書歳月未詳右韓文公與顚師書世所罕傳余以集録古文其求之既勤且博七字集本只作其求之博蓋乆而後獲其以易集本無此字繫辭爲大傳謂著山林與著城郭無異等語冝爲退之之言其後書吏部侍郎潮州刺史則非也蓋退之自刑部侍郎貶潮州後移袁州召爲國子祭酒遷兵部侍郎乆之始遷吏部而流俗相傳但知爲韓吏部爾顛師遺記雖云長慶中立蓋并韓書皆國𥘉重刻故繆爲附益爾治平元年三月十三日書右眞蹟唐髙閑草書歳月未詳高閑草書審如此則韓子之言爲實録矣永豐歐陽脩右見綿本别集二十三卷唐武侯碑隂記開成二年右武侯碑隂記崔備撰唐劒南西川節度使武元衡及其將佐題名者二十九人楊嗣復再題及其僚屬又六人并嗣復汝士詩兩首合爲一卷唐諸方鎮以辟士相高故當時布衣韋帶之士或行著郷閭或名聞埸屋者莫不爲方鎮所取至登朝廷位將相爲時偉人者亦皆出諸侯之幕如元衡所記裴度栁公綽楊嗣復皆相繼去爲本朝名將相亦可謂盛矣哉治平元年初伏休假雨中書右眞蹟唐盧頊禱聦明山記元和三年右禱聦明山記盧頊撰乃盧從史禱山神之記也閱從史官屬題名見孔戡與烏重胤俱列于後而感集本作覽韓退之記戡事云戡屢諫從史不聽卒為重㣧所縛掩卷歎息者乆之嗚呼禍福成敗之理甚明而先事而言則罕見從事至而言則不及矣自古敗亂之國未始不如此也右眞蹟唐侯喜復黃陂記歳月見本文右復黃陂記唐侯喜撰黄陂在汝州汝州有三十六陂黄陂最大溉田千頃始作于隋記云至貞元辛未刺史盧䖍始復之辛未貞元七年也碑元和三年建喜之文辭甞爲韓退之所稱而世罕傳者余之所得此碑而已右集本又昌黎先生甚稱侯喜其文罕傳於今余之所見止此一篇爾右眞蹟售栁宗元般舟和尚碑元和三年右般舟和尚碑栁宗元撰并書子厚所書碑世頗多有書旣非工而字畫多不同疑喜子厚者竊借其名以爲重子厚與退之皆以文章知名一時而後世稱爲韓栁者蓋流俗之相傳也其爲道不同猶夷夏也然退之於文章毎極稱子厚者豈以其名並顯於世不欲有所貶毀以避爭名之嫌而其爲道不同雖不言顧後世當自知歟不然退之以力排釋老爲已任於子厚不得無言也治平元年三月廿二日書右眞蹟唐南嶽彌陁和尚碑元和五年右南嶽彌陁和尚碑栁宗元撰并書自唐以來言文章者惟韓栁栁豈韓之徒哉真韓門之罪人也蓋世俗不知其所學之非第以當時輩流言之爾今余又多録其文懼益後人之惑也故書以見余意右集本唐元稹修桐柏宮碑大和四年右售元稹撰文并書其題云修桐柏宮碑又其文以四言為韻語旣牽聲韻有述事不能詳者則自為注以解之為文自注非作者之法且碑者石柱爾古者刻石為碑謂之碑銘碑文之類可也後世伐石刻文既非因柱石不冝謂之碑文然習俗相傳理猶可考今特題云修桐柏宫碑者甚無謂也此在文章誠為小瑕病前人時有忽略然而後之學者不可不知自漢以來墓碑多題云某人之碑者此乃無害蓋目此石為某人之墓柱非謂自題其文目也今稹云修桐柏宫碑則於理何稽也右集本唐虞城李令去思頌元和四年右虞城李令去思頌李白撰文王遹篆唐世以書自名者多而小篆之學不集本作十數家自陽冰獨擅後無繼者其前惟有碧落碑而不見名氏遹開元天寳時人在陽冰前而相去不逺集本有亦工八分四字然當時不甚知名雖字畫不為工而一時未有及者所書篆字惟有此爾世亦罕傳余以集本無此字集録求集本無此字之勤且博廑得此爾今世以小篆名家如邵不疑楊南仲章友直問之皆云未嘗見也治平元年二月七日書右真蹟唐陽公舊隱碣元和中右陽公舊隱碣胡証撰黎煟書李靈省篆額唐世篆法自李陽冰後寂然未有顯於當世而能自名家者靈省所書陽公碣筆畫甚可佳旣不顯聞於時亦不見於他處以余家所藏之博而見於録者惟此雖未為絶筆亦可惜哉嗚呼士有負其能而不為人所知者可勝道哉右眞蹟唐于夐神道碑元和中右于夐神道碑盧景亮撰其文辭雖不甚雅而書事能不没其實夐之為人如其所書蓋篤於信道者也碑云司馬遷儒之外五家班固儒之外八流其語雖拙蓋言其集本作夐學不駮雜也然則非徒貶去釋老而巳自儒術之外餘皆不學爾碑又云其弟可封好釋氏夐毎非之夐于頔父也然可封之後不大顯而夐之後甚盛以此見釋氏之教信嚮者未必獲福毀貶者未必有禍也碑言夐篤於孝悌守節安貧不可動以勢利其所履如此足以興其後世矣治平元年八月十一日書右真蹟唐昭懿公主碑元和中右昭懿公主碑孟簡撰皇甫鏄書公主代宗女也號昇平公主嫁郭氏公主之號自漢以來始有謂天子之女禮不自主㛰集本作壻以公主之因以為名爾後世號某國公主者雖實不以國公為主而名猶不失其義唐世始别擇佳名以加之如昇平之類是也巳失其本義矣今此碑乃云諱昇平公主字昇平公主集本無此五字斯莫可曉也巳治平元年八月八日書右真蹟唐李光進碑元和中右李光進碑楊炎撰韓秀實書唐有兩李光進其一光顔之兄其一光弼之兄弟也此碑乃光弼弟也唐史書此兩人事多誤新書各為傳以附顔弼遂得其正右集本集古録跋尾卷第八西墉記元附三十一禹廟碑元第九十七崇徽公主手痕詩元第三百六十八懷素法帖元第九百一十六重摹呉季子墓銘元第二百五十一巳有本一作自有真本未甞過呉一作無過呉之理其名傳之乆一作其傳也乆嘉祐八年五月晦日書一有此九字海濤誌元第九百誌一作志篇内同治平元年七月二十日書一有此十字鹽宗神祠記元第九百六十九故唐一無故字官遂一無官字為然一作利不獨為傳記正訛繆亦可為朝廷决疑議也一作為傳記正訛繆多矣為朝廷決有司疑議獨斯記尓治平元年八月十一日書一有此十字鴈門王田氏神道碑元無卷第李憕碑元第四百六十九而又一作又兩六人一作子孩提一作提孩衆孫此下一有提字升堂之慶一作昇堂之愛治平元年三月二十三日書一有此十一字甘棠館題名元第四百二治平元年清明前一日書一有此十字汾陽王廟碑元第九百二十九治平甲辰七月十三日以服藥家居書一有此十五字郭忠武公將佐畧元第八百五至八百六謀謨一作謨謀濟瀆廟祭器銘元第八百所記一作聞神女廟詩元第一百四十三嘉祐八年十一月十四日一有此十字馬寔墓誌銘元第九十同前鍾山林下集序元第九百八十九而洪一無而字房太尉遺愛碑隂記元第四百三賀蘭夫人墓誌元第三十二陸文學傳元第五百四十七茶之此下一有載字號陸鴻漸此下一有至飲茶客稀則烹茶沃之云可祝利市十五字鴻漸以茶四字上一有盖字考其此下一有自字潮州一作湖州其多如此一無此四字不傳此下一有獨茶經著於世冝其自傳於此名也治平元年七月二十日書二十四字又别本右陸文學傳題云自傳而曰名羽字鴻漸或云名鴻漸字羽未知孰是然則豈其自傳也茶載前史自魏晉以來有之而後世言茶者必本鴻漸盖為茶著書自羽始也至今俚俗賣茶肆中多置一甆偶人云是陸鴻漸至飲茶客稀則以茶沃此偶人祝其利市其以茶自名乆矣而此傳載羽所著書頗多云君臣契三卷源解三十卷江表四姓譜十卷南北人物志十卷呉興歷官記三卷湖州刺史記一卷茶經三卷占夢三卷豈止茶經而已也然他書皆不傳獨茶經著於世爾辨正禪師塔院記元第二百六十二徐峴此下一有所字柳筆此下一有法字盤谷詩序元第三百八十九當時一作盖時世己一作既巳治平元年中元日書一有此八字韓退之題名元第四百七十記遇一無記字試也試一作誡田弘正家廟碑元第三百七十六尤甚此下一有焉字知其一作為改為一作云南海神廟碑元第八百九十二羅池廟碑元第五十七碑言一作云荔子一作枝加子一作葉黄陵廟碑元第四十五餘事二字一作字本言一作云胡良公碑元第七百二十韓文公與顚師書元第三百一十五髙閑草書元無卷第草書一無草字武侯碑隂記元第八百七十五禱聴明山記元第五百八十六復黄陂記元無卷第又一作祭樊仲文復黄陂記附元第八百九十五般舟和尚碑元第四百六十二彌陁和尚碑元第一百二十三惟韓一作稱韓今余一無余字其文一作書修桐栢宫碑元第一百一十為碑一作於碑虞城李令去思頌元第三百八陽公舊隱碣元第三百七十三當世一作時于夐神道碑元第九百六十八昭􅖴公主碑元第九百八義矣一無矣字李光進碑元第七百六十三兄弟一無兄字治平元年夏至日書一有此八字, WYG: ''}
