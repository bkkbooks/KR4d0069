  - {type: variant, offset: 0, length: 9030, content: 外集卷第二十二歐陽文忠公集七十二譜牡丹記附硯譜端石出端溪色理瑩潤本以子石爲上子石者在大石中生蓋精石也而流俗傳訛遂以紫石爲上又以貯水不秏爲佳有鸜鵒眼爲貴眼石病也然惟此巖石則有之端石非徒重於流俗官司嵗以爲貢亦在他硯上然十無一二發墨者但充翫好而巳歙石出於龍尾溪其石堅勁大抵多發墨故前世多用之以金星爲貴其石理微麤以手摩之索索有鋒鋩者尤佳余少時又得金坑礦石尤堅而發墨然世亦罕有端溪以北嵓爲上龍尾以深溪爲上較其優劣龍尾逺出端溪上而端溪以後出見貴爾絳州角石者其色如白牛角其文有花浪與牛角無異然頑滑不發墨世人但以研丹爾歸州大沱石其色青黒斑斑其文理微麤亦頗發墨歸峽人謂江水爲沱蓋江水中石也硯止用於川峽人世未甞有余爲夷陵縣令時甞得一枚聊記以廣聞爾青州紫金石文理麤亦不發墨惟京東人用之又有鐡硯製作頗精然患其不發墨往往函端石於其中人亦罕用惟研筒便於提携官曹往往持之以自從爾紅絲石硯者君謨贈余云此青州石也得之唐彦猷云須飲以水使足乃可用不然渇燥彦猷甚竒此硯以為發墨不減端石君謨又言端石瑩潤惟有鋩者尤發墨歙石多鋩惟膩理者特佳盖物之竒者必異其類也此言與余特異故并記之青州濰州石末研皆瓦硯也其善發墨非石硯之比然稍麤者損筆鋒石末本用維水石前世巳記之故唐人惟稱濰州今二州所作皆佳而青州尤擅名於世矣相州古瓦誠佳然少真者盖真瓦朽腐不可用世俗尚其名爾今人乃以澄泥如古瓦狀作瓦埋土中乆而斵以為硯然不必真古瓦自是凡瓦皆發墨優於石爾今見官府典吏以破盆甕片研墨作文書尤快也􅉑州澄泥唐人品硯以為第一而今人罕用矣文房四譜有造瓦硯法人罕知其妙嚮時有著作佐郎劉羲叟者甞如其法造之絶佳硯作未多士大夫家未甚有而羲叟物故獨余甞得其二一以贈劉原父一余置中書閤中尤以為寳也今士大夫不學書故罕事筆硯硯之見於時者惟此爾記洛陽牡丹記花品序第一牡丹出丹州延州東出青州南亦出越州而出洛陽者今為天下第一洛陽所謂丹州花延州紅青州紅者皆彼土之尤傑者然來洛陽纔得備衆花之一種列第不出三已下七字一作終列第三不能獨立與洛花敵而越之花以逺罕識不見齒然雖越人亦不敢自譽以旁薄之間未必中也又況天地之和氣冝遍𬒳四方上下不冝限其中以自私夫中與和者有常之氣其推於物也亦冝為有常之形物之常者不甚羙亦不甚惡及元氣之病也美惡鬲一作隔并而不相和入故物有極美與一作有極惡者皆得於氣之偏也花之鍾其美與夫癭木擁腫之鍾其惡醜好雖異而得分氣之偏病則均洛陽城圎一作圍數十里而諸縣之花莫及城中者出其境則不可植焉豈又偏氣之美者獨聚此數十里之地乎此又天地之大不可考也已凡物不常有而為害乎人者曰災不常有而徒可怪駭不為害者曰妖語曰天反時為災地反物為妖此亦草木之妖而萬物之一怪也然比夫癭木擁腫者竊獨鍾其美而見幸於人焉余在洛陽四見春天聖九年三月始至洛其至也晚見其晚者明年㑹與友人梅聖俞游嵩山少室緱氏嶺石唐山紫雲洞既還不及見又明年有悼亡之戚不暇見又明年以留守推官歲滿解去只一作止見其蚤者是未甞見其極盛時然目之所矚巳不勝其麗焉余居府中時甞謁錢思公於雙桂樓下見一小屏立坐後細書字滿其上思公指之曰欲作花品此是牡丹名凡九十餘種余時不暇讀之然余所經見而今人多稱者纔三十許種不知思公何從而得之多也計其餘雖有名而不著未必佳也故今所録但取其特著者而次第之姚黄魏花細葉壽安鞓紅亦曰青州紅牛家黄濳溪緋左花獻來紅葉底紫鶴翎紅添色紅倒暈檀心朱砂紅九蘂真珠延州紅多葉紫麤葉壽安丹州紅蓮花萼一百五鹿胎花甘草黄一㩎紅玉板白花釋名第二牡丹之名或以氏或以州或以地或以色或旌其所異者而志之姚黄牛黄左花魏花以姓著青州丹州延州紅以州著細葉麤葉壽安潜溪緋以地著一㩎紅鶴翎紅朱砂紅玉板白多葉紫甘草黄以色著獻來紅添色紅九蘂真珠鹿胎花倒暈檀心蓮花萼一百五葉底紫皆志其異者姚黄者千葉黄花出於民姚氏家此花之出於今未十年姚氏居白司馬坡其地屬河陽然花不傳河陽傳洛陽洛陽亦不甚多一歲不過數朶牛黄亦千葉出於民牛氏家比姚黄差小真宗祀汾隂還過洛陽留宴淑景亭牛氏獻此花名遂著甘草黄單葉色如甘草洛人善别花見其樹知為某花云獨姚黄易識其葉嚼之不腥魏家花者千葉肉紅花出於魏相仁溥家始樵者於壽安山中見之斲以賣魏氏魏氏池館甚大傳者云此花初出時人有欲閱者人稅十數錢乃得登舟渡池至花所魏氏日收十數緡其後破亡鬻其園今普明寺後林池乃其地寺僧耕之以植桑麥一作棗花傳民家甚多人有數其葉者云至七百葉錢思公甞曰人謂牡丹花王今姚黄真可為王而魏花乃后也鞓紅者單葉深紅花出青州亦曰青州紅故張僕射齊賢有第西京賢相坊自青州以馲駝䭾其種遂傳洛中其色類腰帶鞓故謂之鞓紅獻來紅者大多葉淺紅花張僕射罷相居洛陽人有獻此花者因曰獻來紅添色紅者多葉花始開而白經日漸紅至其落乃類深紅此造化之尤巧者鶴翎紅者多葉花其末白而一作其本肉紅如鴻鵠羽色細葉麤葉壽安者皆千葉肉紅花出壽安縣錦屏山中細葉者尤佳倒暈檀心者多葉紅花几花近萼色深至其末漸淺此花自外深色近萼反淺白而深檀點其心此尤可愛一㩎紅者多葉淺紅花葉杪深紅一點如人以手指㩎之九蘂真珠紅者千葉紅花葉上有一白點如珠而葉宻蹙其蘂為九叢一百五者多葉白花洛花以糓雨為開候而此花常至一百五日開最先丹州延州花皆千葉紅花不知其至洛之因蓮花萼者多葉紅花青趺三重如蓮花萼左花者千葉紫花一有出民左氏家字葉宻而齊如截亦謂之平頭紫朱砂紅者多葉紅花不知其所出有民門氏子者善接花以為生買地於崇徳寺前治花圃有此花洛陽豪家尚未有故其名未甚著花葉甚鮮向日視之如猩血葉底紫者千葉紫花其色如墨亦謂之墨紫花在叢中旁必生一大枝引葉覆其上其開也比它花可延十日之乆噫造物者亦惜之耶此花之出比它花最逺傳云唐末有中官為觀軍容使者花出其家亦謂之軍容紫歲乆失其姓氏矣玉板白者單葉白花葉細長如拍板其色如玉而深檀心洛陽人家亦少有余甞從思公至福嚴院見之問寺僧而得其名其後未甞見也濳溪緋者千葉緋花出於濳溪寺寺在龍門山後本唐相李藩别墅今寺中巳無此花而人家或有之大是紫花忽於叢中特出緋者不過一二朶明年移在他枝洛人謂之轉音篆枝花故其接頭尤難得鹿胎花者多葉紫花有白點如鹿胎之紋故蘇相禹珪宅今有之多葉紫不知其所出初姚黄未出時牛黄爲第一牛黄未出時魏花爲第一魏花未出時左花爲第一左花之前唯有蘇家紅賀家紅林家紅之類皆單葉花當時爲第一自多葉千葉花出後此花黜矣今人不復種也牡丹初不載文字唯以藥載本草然於花中不為髙第大抵丹延已西及襃斜道中尤多與荆棘無異土人皆取以為薪自唐則天巳後洛陽牡丹始盛然未聞有以名著者如沈宋元白之流皆善詠花草計有若今五字一作當時有一花之異者彼必形於篇詠一作什而寂無傳焉唯劉夢得有詠魚朝恩宅牡丹詩但云一叢千萬朶而已亦不云其美且異也謝靈運言永嘉竹間水際多牡丹今越花不及洛陽甚逺是洛花自古未有若今之盛也風俗記第三洛陽之俗大抵好花春時城中無貴賤皆揷花雖負擔者亦然花開時士庶競為逰遨往往於古寺廢宅有池臺處為市井張幄帟笙歌之聲相聞最盛於月陂堤張家園棠坊長壽寺東街與郭令宅至花落乃罷洛陽至東京六驛舊不進花自今徐州李相迪為留守時始進御歲遣衙校一貟乗驛馬一日一夕至京師所進不過姚黄魏花三數朶以菜葉實竹籠子藉覆之使馬上不動揺以蠟封花蔕乃數日不落大抵洛人家家有花而少大樹者盖其不接則不佳春𥘉時洛人於壽安山中斵小栽子賣城中謂之山箆子人家治地爲畦塍種之至秋乃接接花工尤著者謂之門園子盖本姓東門氏或是西門俗但云門園子亦由今俗呼皇甫氏多只云皇家也豪家無不邀之姚黄一接頭直錢五千秋時立契買之至春見花乃歸其直洛人甚惜此花不欲傳有權貴求其接頭者或以湯中蘸殺與之魏花𥘉出時接頭亦直錢五千今尚直一千接時須用社後重陽前過此不堪矣花之木去地五七寸許截之乃接以泥封裹用軟土擁之以蒻葉作庵子罩之不令見風日惟南向留一小户以逹氣至春乃去其覆此接花之法也用瓦亦可種花必擇善地盡去舊土以細土用白歛末一斤和之盖牡丹根甜多引蟲食白歛能殺蟲此種花之法也澆花亦自有時或用日未出或日西時九月旬日一澆十月十一月三日二日一澆正月隔日一澆二月一日一澆此澆花之法也一本發數朶者擇其小者去之只留一二朶謂之打剥懼分其脉也花纔落便剪其枝勿令結子懼其易老也春𥘉既去蒻庵便以棘數枝置花叢上棘氣暖可以辟霜不損花芽他大樹亦然此養花之法也花開漸小於舊者盖有蠧蟲損之必㝷其穴以硫黄簮之其旁又有小穴如鍼孔乃蟲所蔵處花工謂之氣䆫以大鍼點硫黄末鍼之蟲乃死蟲死花復盛此毉花之法也烏賊魚骨以鍼花樹入其膚花輒死此花之忌也牡丹記跋尾右蔡君謨之書八分散隷正楷行狎大小草衆體皆精其平生手書小簡殘篇斷槀時人得者甚多惟不肯與人書石而獨喜書余文也若陳文惠公神道碑銘薛将軍碣真州東園記杭州有美堂記相州晝錦堂記余家集古録目序皆公之所書最後又書此記刻而自蔵子其家方走人於亳以模本遺予使者未復於閩而凶訃已至于亳矣盖其絶筆於斯文也於戯君謨之筆既不可復得而予亦老病不能文者乆矣於是可不惜哉故書以傳兩家子孫外集卷第二十二硯譜惟此嵓石此一作比歸峽此下一有間字牡丹記花品序以自私此下一有也字偏氣之羙一作偏病之氣萬物之一怪也㦯無一字花釋名或以氏以字下一有姓字九蘂真珠此下一有紅字下同司馬坡一作坂鬻其園此下一有宅字因曰一作因名曰有一白點如珠而葉宻一作點白如珠其葉宻㦯作宻其葉丹州延州花此下脫一者字崇徳寺一作崇真寺如拍板此下一有之狀二字不過一二朶二一作兩此花黜矣此一作其丹延巳西己一作巴風俗記以菜葉以一作用尤著者此下或有一人兩字或用日未出或日西時九月旬日一澆十月十一月三日二日一澆正月隔日一澆二月一日一澆一作㦯用日西或用日未出秋時旬日乃澆十月十一月二三日一澆正月隔日一澆以鍼花三字上一有用字入其膚花輙死膚一作皮輒一作必士大夫家有公牡丹譜一卷乃承平時印本始列花品序及名品與此卷前兩篇頗同其後則曰叙事宫禁貴家寺觀府署元白詩譏鄙吴蜀詩集記異雜記本朝雙頭花進花丁晉公續花譜凡十六門萬餘言前題吏部侍郎參知政事歐陽某撰後有梅堯臣跋盖假託也姑以三事明之公之花釋名大㮣謂自唐則天巳後洛陽牡丹雖盛然沈宋元白未甞形容其羙且異劉夢得亦止云一叢千萬朶而巳盖言今之名品當時未有而此乃以元白常花唱酬為一門一也花譜蔡君謨所書至今流傳熈寧元年公跋云君謨絶筆於斯文安得此萬餘言者二也梅之後序云公𥘉筮西洛作花品及參大政亦有謝西京王尚書牡丹詩案梅以嘉祐五年四月卒是冬公方入西府明年遷參政其妄尤甚三也此𥘉無足辨特以印本流傳恐後人㦯信耳居士集卷第二十二歐陽文忠公集二十二碑銘二首太尉文正王公神道碑銘并序至和二年七月乙未樞密直學士右諫議大夫王素奏事殿中巳而泣且言曰臣之先臣旦相眞宗皇帝十有八年今臣素又得待罪侍從之臣惟是先臣之訓其遺業餘烈臣實無似不能顯大而墓碑至今無辭以刻惟陛下哀憐不忘先帝之臣以假寵於王氏而朂其子孫天子曰嗚呼惟汝父旦事我文考眞宗叶徳一心克終厥位有始有卒其可謂全徳元老矣汝素以是刻于碑素拜稽首一有泣而出明日有詔史館修撰歐陽脩曰王旦墓碑未立汝可以銘臣脩謹按故推誠保順同徳守正翊戴功臣開府儀同三司守太尉充玉清昭應宫使上柱國太原郡開國公贈太師尚書令兼中書令追封魏國公一作上柱國魏國公食邑一萬三千戸食實封六千五百户贈太師尚書令謚曰文正王公諱旦字子明大名莘人也皇曽祖諱言滑州黎陽令追封許國公皇祖諱徹左拾遺追封魯國公皇考諱祜尚書兵部侍郎追封晉國公皆累贈太師尚書令兼中書令曽祖妣姚氏魯國夫人祖妣田氏秦國夫人妣任氏徐國夫人邊氏秦國夫人公之皇考以文章自顯漢周之際逮事太祖太宗為名臣甞諭杜重威使無反漢拒盧多遜害趙普之謀以百口明符彦卿無罪故世多稱王氏有隂徳公之皇考亦自植三槐于庭曰吾之後世必有為三公者此其所以志也公少好學有文太平興國五年進士及第為大理評事知臨一作平江縣監潭州銀埸再遷著作佐郎與編文苑英華遷殿中丞通判鄭濠二州王禹稱薦其材任轉運使驛召至京師辭不受獻其所為文章得試直史館遷右正言知制誥知淳化三年禮部貢舉遷虞部貟外郎同判吏部流内銓知考課院右諫議大夫趙昌言叅知政事公以壻避嫌求解職太宗嘉之改禮部郎中集賢殿修撰昌言罷復知制誥仍兼修撰判院事召賜金紫乆之遷兵部郎中居職眞宗即位拜中書舍人數日召為翰林學士知審官院通進銀臺封駮事公為人嚴重能任大事避逺權勢不可干以私由是眞宗益知其賢錢若水名能知人常稱公曰眞宰相器也若水為樞密副使罷召對苑中問誰可大用者若水言公可一有用字一有大用二字眞宗曰吾固已知之矣咸平三年又知禮部貢舉居數日拜給事中知樞密院事明年以工部侍郎叅知政事再遷刑部侍郎景徳元年契丹犯邊眞宗幸澶州雍王元份留守東京得暴疾命公馳自行在代元份留守二年遷尚書左丞三年拜工部尚書同中書門下平章事集賢殿大學士監修國史是時契丹初請盟趙徳明亦納誓約願守河西故地二邊兵罷不用眞宗遂欲以無事治天下公以謂宋興三世祖宗之法具在故其為相務行故事愼所改作進退能否賞罰必當眞宗乆而益信之所言無不聽雖他宰相大臣有所請必曰王某以謂如何事無大小非公所言不決公在相位十餘年外無夷狄之虞兵革不用海内富實羣工百司各得其職故天下至今稱為賢宰相公於用人不以名譽必求其實苟賢且材一作能矣必乆其官而一無而字衆以為冝某職然後遷其所薦引人未甞知冦準為樞密使當罷使人私一作告公求為使相公大驚曰將相之任豈可求邪且吾不受私請準深恨之巳而制出除準武勝軍節度使同中書門下平章事準入見泣涕曰非陛下知臣何以至此眞宗具道公所以薦準者準始媿歎以為不可及故叅知政事李穆子行簡有賢行以將作監丞居于家眞宗召見慰勞之遷太子中允初遣使者召之一無之字不知其所止眞宗命至中書問王某然後人知行簡公所薦也公自知制誥至為相薦士尤多其後公薨史官修眞宗實録得内出奏章乃知朝廷之士多公所薦者公與人寡言笑其語雖簡而能以理屈人黙然終日莫能窺其際及奏事上前羣臣異同公徐一言以定今上為皇太子太子諭徳見公稱太子學書有法公曰諭徳之職止於是邪趙徳明言民飢求糧百萬斛大臣皆曰徳明新納誓而敢違請以詔書責之眞宗以問公公請勑有司具粟百萬於京師詔徳明來取眞宗大喜徳明得詔書慚且拜曰朝廷有人大中祥符中天下大蝗眞宗使人於野得死蝗以示大臣明日佗宰相有䄂死蝗以進者曰蝗實死矣請示于一作於朝率百官賀公獨以為不可後數日方奏事飛蝗蔽天眞宗顧公曰使百官方賀而蝗如此豈不為天下笑邪宦者劉承規一作珪以忠謹得幸病且死求為節度使眞宗以語公曰承規一作珪待此以瞑目公執以為不可曰他日將有求為樞密使者柰何至今内臣官不過留後公任事乆人有謗公於上者公輙引咎未甞自辨至人有過失雖人主盛怒可辨者辨之必得而後巳榮王宫火延前殿有言非天災請置獄劾火事當坐死者百餘人公獨請見曰始失火時陛下以罪已詔天下而臣等皆上章待罪今反歸咎於人何以示信且火雖有迹寧知非天譴邪由是當坐者皆免日者上書言宫禁事坐誅籍其家得朝士所與徃還占一作書問吉㓙之說眞宗怒欲付御史問狀公曰此人之常情且語不及朝廷不足罪眞宗怒不解公因自取甞所占問之書進曰臣少賤時不免爲此必以爲罪願并臣付獄眞宗曰此事巳發何可免公曰臣爲宰相執國法豈可自爲之幸於不發而以罪人眞宗意解公至中書悉焚所得書旣而眞宗悔復馳取之公曰臣巳焚之矣由是獲免者衆公累官至太保以病求罷入見滋福殿眞宗曰朕方以大事託卿而卿病一作疾如北因命皇太子拜公公言皇太子盛徳必任陛下事因薦可爲大臣者十餘人其後不至宰相者李及凌䇿二人而巳然亦皆爲名臣公屢以疾請眞宗不得已拜公太尉兼侍中五日一朝視事遇軍國大事不以時入參決公益惶恐因卧不起以疾懇辭冊拜太尉玉清昭應宫使自公病使者存問日常三四眞宗手自和藥賜之疾亟遽幸其第賜以白金五千兩辭不受以天禧元年九月癸酉薨于家享年六十有一眞宗臨哭輟視朝三日發哀于苑中其子弟門人故吏皆被恩澤即以其年十一月庚申葬公於開封府開封縣新里郷大邊村公娶趙氏封榮國夫人後公五年卒子男三人長曰司封郎中雍次曰賛善大夫沖次曰素女四人長適太子太一作少傳韓億次適兵部貟外郎直集賢院蘇耆次適右正言范令孫次適龍圖閣直學士兵部郎中吕公弼一本有諸孫十四人公事寡嫂謹與其弟旭相一無相字友悌尤篤任以家事一無所問而務以儉約率勵子弟使在冨貴不知為驕侈一作後兄子睦欲舉進士公曰吾常以大一作太盛為懼其可與寒士爭進至其薨也子素猶未官遺表不求恩澤有文集二十卷乾興元年詔配享眞宗廟庭臣脩曰景徳祥符之際盛矣觀公之所以相而先帝之所以用公者可謂至哉是以君明臣賢徳顯名尊生而俱享其榮殁而長配於廟可謂有始有卒如明詔所襃昔者烝民江漢推大臣下之事所以見任賢使能之功雖曰山甫穆公之詩實歌宣王之徳也臣謹考國史實録至於搢紳故老之傳得公終始之節而録其可紀者輙聲一無聲字為銘詩昭示後世一無上四字以彰先帝之明以稱聖恩襃顯王氏流澤子孫與宋無極之意銘曰烈烈魏公相我眞宗眞廟翼翼魏公配食公相眞宗不言以躬時有大事事有大疑匪卜匪筮公為蓍龜公在相位終日如黙問其夷狄包裹兵革問其卿士百工以職問其庶民耕織衣食相有一作所賞罰功當罪明相所一作有黜升惟否惟能執其權衡萬物之平孰不事君胡能必信孰不為相其誰有終公薨于位太尉之崇天子孝思來薦清廟侑我聖考惟時元老天子念功報公之隆春秋從享萬祀無窮作為詩歌以諗廟工觀文殿大學士行兵部尚書西京留守贈司空兼侍中晏公神道碑銘并序至和元年六月觀文殿大學士行兵部尚書西京留守臨淄公以疾歸于京師八月疾少間入見天子曰噫予舊學之臣也乃留侍講邇英閤詔五日一朝前殿明年正月疾作不能朝敕一作飭太醫朝夕徃視有司除道將幸其家公歎曰吾無狀乃以疾病憂吾君即馳奏曰臣疾少間行愈矣乃止其月丁亥以公薨聞天子震悼亟臨其喪以不即視公為恨贈公司空兼侍中謚曰元獻有司請輟視朝一日詔特輟二日以其年三月癸酉葬公于許州陽翟縣麥秀郷之北原旣葬賜其墓隧之碑首曰舊學之碑旣又勑史臣脩考次公事具書于碑下臣脩伏讀國史見眞宗皇帝時天下無事天子方推讓功徳祠祀天地山川講禮樂以文頌聲而儒學文章儁賢偉異之人出公世家江西之臨川年始十四一日起田里進見天子時方親閱天下貢士㑹廷中者千餘人與夫宫臣衛官擁列圜視公不動聲氣操筆爲文辭立成以獻天子嘉賞賜同進士出身遂登館閣掌書命以文章爲天下所宗逮陛下養徳東宫先帝選用臣屬即以公遺陛下由王官宫臣卒登宰相凡所以輔道聖徳憂勤國家有舊有勞自始至卒五十餘年公旣薨而先帝之名臣與陛下東宫之舊人皆無在者冝其襃寵優異比公甘盤臣脩幸得執筆史官奉明詔謹昧死上臨淄公事曰公諱殊字同叔姓晏氏其世次晦顯徙遷不常自其髙祖諱墉唐咸通中舉進士卒官江西始著籍于髙安其後三世不顯曽祖諱延昌又徙其籍于臨川祖諱郜追封英國公考諱固追封秦國公自曽祖巳下皆用公貴累贈開府儀同三司太師中書令兼尚書令曽祖妣張氏陳國太夫人祖妣傅氏許國太夫人妣呉氏唐一作越國太夫人公生七歲知學問一作始學知為文章郷里號為神童故丞相張文節公安撫江西一作南得公以聞眞宗召見旣賜出身後二日又召試詩賦論公徐啓曰臣甞私習此賦不敢隱眞宗益嗟異之因試以佗題以為秘書省正字置之秘閣使得悉讀秘書命故僕射陳文僖公視其學明年獻其所為文召試中書遷太常寺奉禮郎封祀太山推恩遷光禄寺丞數月充集賢校理明年遷著作佐郎丁父憂去官已而眞宗思之即其家起復命淮南發運使具舟送之一作至京師從祀太清宫賜緋衣銀魚同判太常禮院又丁母憂求去官服喪不許今天子始封昇王公以選為府記室叅軍再遷左正言直史館今天子為皇太子以户部貟外郎充太子舍人賜金紫知制誥判集賢院遷翰林學士充景靈宫判官太子左庻子兼判太常寺知禮儀院公旣以道徳文章佐佑東宫眞宗毎所諮訪多以方寸小紙細書問之由是參與機密凡所對必以其藁進示不洩其後悉閱眞宗閤中遺書得公所進藁類為八十卷藏之禁中人莫之見也初眞宗遺詔章獻明肅太后權聽軍國事宰相丁謂樞密使曹利用各欲獨見奏事無敢決其議者公建言羣臣奏事太后者垂簾聽之皆母得見議遂定乾興元年拜右諫議大夫兼侍讀學士遷給事中景靈宫副使判吏部流内銓以易侍講崇政殿遷禮部侍郎知審官院為樞密副使遷刑部侍郎上䟽論張耆不可為樞密使由是忤太后旨坐以笏擊其僕悞折其齒罷留守南京大興學校以教諸生自五代以來天下學廢興自公始召拜御史中丞改兵部侍郎兼秘書監資政殿學士翰林侍讀學士知天聖八年禮部貢舉明年為三司使復為樞密副使未拜改叅知政事遷尚書左丞太后謁太廟有請服衮冕者太后以問公公以周官后服對太后崩大臣執政者皆罷一有以字公為禮部尚書知亳州徙知陳州遷刑部尚書復召為御史中丞又為三司使知樞密院事拜樞密使再加檢校太尉同中書門下平章事慶曆三年三月遂以刑部尚書居相位充集賢殿大學士兼樞密使自公復召用而趙元昊反師出陜西天下弊於兵公數建利害請罷監軍無以陣圖授諸將使得應敵為攻守及制財用為一無為字出入之要皆有法天子悉為施行自宫禁先以率天下而財賦之職悉歸有司卒能以謀臣元昊使聽約束乃還其王號公為人剛簡遇人必以誠雖處冨貴如寒士罇酒相對歡如也得一善稱之如已出當世知名之士如范仲淹孔道輔等皆出其門及為相益務進賢材當公居相府時范仲淹韓琦冨弼皆進用至於臺閣多一時之賢天子旣厭西兵閔天下困弊奮然有意遂欲因羣材以更治數詔大臣條天下事方施行而小人權倖皆不便明年秋㑹公以事罷而仲淹等相次亦皆去事遂巳公旣罷以工部尚書知潁州徙知陳州又徙許州三遷户部尚書拜觀文殿大學士知永興軍充一路都部署安撫使徙知河南府兼西京留守累進階至開府儀同三司勲上柱國爵臨淄公食邑萬二千户實封三千七百户公享年六十有五自少篤學至其病亟猶手不釋卷有文集二百四十卷甞奉勑修上訓及眞宗實録又集類古今文章為集選二百卷其一作公為政敏而務以簡便其民其於家嚴子弟之見有時事寡姊孝謹未甞為子弟求恩澤其在陳州上問宰相曰晏某居外未甞有所請其亦有所欲邪宰相以告公公自為表問起居而已故其薨也天子尤哀悼之賜予加等以其子承一作成下同𥙿為崇文院檢討孫及甥之未官者九人皆命以官公初娶李氏工部侍郎虚巳之女次孟氏屯田貟外郎虚舟之女封鉅鹿郡夫人次王氏太師尚書令超之女封榮國夫人子八人長曰居厚大理評事早卒次承𥙿尚書屯田貟外郎宣禮賛善大夫崇讓著作佐郎明逺祗德皆大理評事幾道傳正皆太常寺太祝女六人長適户部侍郎同中書門下平章事冨弼次適禮部侍郎三司使楊察其四尚㓜孫十有二一作三人公旣樂善而稱為知人士之顯于朝者多公所薦逹至擇其女之所從又得二人者如此一有嗚呼字可謂賢也巳銘曰有姜之裔齊為晏氏齊在春秋晏顯諸侯傳載桓子嬰稱干丘其後無聞不亡僅存有煒自公厥聲以振公之顯聲實相天子天子曰噫予考眞宗唯多名臣以臻盛隆汝初事我王官東宫以曁相予始卒一躬輔我以徳有勞于邦公疾在外來歸自洛天子曰留汝予舊學凡今在庭莫如汝舊孰以卑予唯予聖考今旣亡矣孰為予老何以贈之司空侍中禮則有加予思何窮有篆其文在其碑首天子之襃史臣有詔銘以述之永昭厥後居士集卷第二十二熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正廣韻注誤字云謬誤又注悞字云上同禮部韻始以誤為謬以悞為欺居士集第二卷鎮陽讀書詩云悞蒙天子知其它詩文大率用此悞字蓋以誤悞古人通用也今晏公碑乃王洙奉勑書洙於字學最精其書悞以笏擊僕齒字亦從心後人多改從言過矣碑云道徳文學而印本作文章次子名成𥙿印本作承𥙿題銜加推忠保徳功臣六字皆當以碑為正, WYG: ''}
