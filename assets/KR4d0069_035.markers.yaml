  - {type: line-break, offset: 0, content: '', id: KR4d0069_SBCK_035-1a01}
  - {type: variant, offset: 0, length: 1057, content: 居士集卷䇿三十五歐陽文忠公集三十五墓誌三首碣一首附永州軍事判官鄭君墓誌銘鄭君諱平字某衡州衡陽人也少倜儻有大志舉進士中天禧三年甲科爲郴州軍事推官監潭州茶場坐茶惡免官乆之試祕書省校書郎知連州陽山縣爲道州軍事推官丁母憂服除調永州軍事判官監衡州茭源銀冶以疾去官慶暦三年七月某日卒于家享年五十有一以某年某月某日葬于某所曾祖諱某永州祁陽令祖諱某江陵府建寧縣令父諱某道州軍事判官君娶孫氏贈尚書工部侍郎冕之女子男六人綯緫紀經維綬綯早卒緫舉進士出身亦早卒孫七人皆㓜君世仕不顯少孤而貧毋夫人某氏賢母也教其三子以學皆有立君與其兄本弟革皆舉進士及第君𥘉監茶埸茶實不惡上官挾他事以罪中之君不自辯竭其貲以償解官而去無愠色及爲陽山有善政民甚愛之其旣以疾廢慨然歎曰吾少力學而不幸廢以疾吾終不用於時矣安事空言哉即取其平生所爲文藁悉焚之嗚呼君之志可哀也巳自三代詩書巳來立言之士多矣其始無不欲其言之傳也而散亡磨㓕泯然不復見於後世者何可勝數或暫見而終没或其言雖傳而其人不爲世所貴者有矣惟君子有諸躬而不可揜者不待自言而傳也君之不欲見於空言其可謂善慮於無窮者矣其志豈不逺哉雖然君之志旣不自見於言而冝有爲之著者銘所以彰善而著無窮也乃爲之銘曰夫惟自信有不疑知命者不惑故能得失不累其心喜愠不見其色嗚呼鄭君學幾於此斯可謂之君子端明殿學士蔡公墓誌銘公諱襄字君謨興化軍仙遊人也天聖八年舉進士甲科爲漳州軍事判官西京留守推官改著作佐郎館閣挍勘慶暦三年以祕書丞集賢挍理知諫院兼修起居注是時天下無事士大夫弛於乆安一日元昊叛師乆無功天子慨然猒兵思正百度以修太平旣已排群議進退一作用二三大臣又詔增置諫官四貟使拾遺𥙷闕所以遇之甚寵公以材名在選中遇事感激無所回避一有於是二字權倖畏歛不敢撓法干政而上得益與大臣圗議明年屢下詔書勸農桑興學校革弊修廢而天下悚然知上之求治矣於此之時言事之臣無日不進見而公之𥙷益爲尤多四年以右正言直史館出知福州以便親遂爲福建路轉運使復古五塘以漑田民以爲利爲公立生祠于塘側又奏减閩人五代時丁口稅之半丁父憂服除判三司鹽鐵勾院復修起居注今叅知政事唐公介時爲御史以直言忤㫖貶春州别駕廷臣無敢言者公獨論其忠人皆危之而上悟意解唐公得改英州遂復召用皇祐四年遷起居舍人知制誥兼判流内銓御史吕景𥘉呉中復馬遵坐論梁丞相適罷臺職除他官公封還辭頭不草制其後屢有除授非當者必皆封還之而上遇公益厚曰有子如此其母之賢可知命特賜冠帔以寵之至和元年遷龍圗閣直學士知開封府三年以樞密直學士知泉州徙知福州未幾復知泉州公爲政精明而世一作於閩人一有尤字知其風俗至則禮其士之賢者以勸學興善而變民之故除其甚害, WYG: ''}
