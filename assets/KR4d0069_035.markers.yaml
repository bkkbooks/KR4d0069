  - {type: variant, offset: 1041, length: 3556, content: 時閩人一作士多好學而專用賦以應科舉公得先生周希孟以經術傳授學者常至數百人公爲親至學舍執經講問爲諸生率延見處士陳烈尊以師禮而陳襄鄭穆方以德行著稱郷里公皆折節下之閩俗重凶事其奉浮圗㑹賔客以盡力豐侈爲孝否則深自愧恨爲郷里羞而姦民游手無頼子幸而貪飲食利錢財來者無限極徃徃至數百千人至有親亡祕不舉哭必破産辦具而後敢發喪者有力者乗其急時賤買其田宅而貧者立劵舉責終身困不能償公曰弊有大於此邪即下令禁止至於巫覡主病蠱毒殺人之類皆痛斷絶之然後擇民之聦明者教以醫藥使治疾病其子弟有不率教令者條其事作五戒以教諭之乆之閩人大便公旣去閩人相率詣州請爲公立德政碑吏以法不許謝即退而以公善政私刻于石曰俾我民不忘公之德嘉祐五年召拜翰林學士權三司使三司開封世稱省府爲難治而易以毁譽居者不由以遷則由以敗而敗者十常四五公居之皆有能名其治京師談笑無留事尤喜破姦一有發字隱吏不能欺至商財利則較天下盈虚出入量力以制用必使下完而上給下曁百司因習蠹弊切磨剗剔乆之簿書纎悉紀綱條目皆可法七年季秋大享明堂後數月仁宗崩英宗即位數大賞賚及作永昭陵皆猝辦於縣官經費外公應煩愈間暇若有餘而人不知勞遂拜三司使居二歲以母老求知杭州即拜端明殿學士以徃三年徙南京留守未行丁母夫人憂明年八月某日以疾卒于家享年五十有六蔡氏之譜自晉從事中郎克以來世有顯聞其後中衰隱德不仕公年十八以農家子舉進士爲開封第一名動京師後官于閩典方州領使一路二一作而親尚皆無恙閩人瞻望咨嗟不榮公之貴而榮其父母母夫人尤有壽年九十餘飲食起居康彊如少者歲時爲壽母子鬢髪皆皤然而命服金紫煌煌如也至今閩人之爲子者必以夫人祝其親爲父母者必以公教其子也公於朋友重信義聞其喪則不御酒肉爲位以哭盡哀乃止嘗㑹飲㑹靈東園坐客有射矢誤一有中傷人者客遽指爲公矢京師喧然事旣聞上一又有上字以問公公即再拜媿謝終不自辯退亦未嘗以語人公爲文章清遒粹美有文集若干卷工於書畫頗自惜不妄爲人書故其殘章斷藁人悉珍藏而仁宗尤愛稱之御製元舅隴西王碑文詔公書之其後命學士撰温成皇后碑文又勑公書則辭不肯書曰此待詔職也公累官至禮部侍郎旣卒翰林學士王珪等十餘人列言公賢其亡可惜天子新即位未及識公而聞其名乆也爲之惻然特贈吏部侍郎官其子旻爲秘書省正字孫傳一作傅及弟之子均皆守將作監主簿而優以􅉠䘏以旻尚㓜命守吏助給其喪事曾祖諱顯皇不仕祖諱恭贈工部貟外郎父諱琇贈刑部侍郎毋夫人盧氏長安郡太君夫人葛氏永嘉郡君子男三人曰匀將作監主簿曰旬大理評事皆先公卒㓜子旻也女三人一適著作佐郎謝仲規二尚㓜以某年某月某日葬公於莆田縣某郷將軍山銘曰誰謂閩逺而多竒産産非物寳惟士之賢嶷嶷蔡公其人傑然奮躬當朝讜言正色出入左右彌縫𥙷益一作闕間歸于閩有政在人食不畏蠱喪不憂貧疾者有醫學者有師問誰使然孰不公思有髙其墳有拱其木凡閩之人過者必肅集賢院學士劉公墓誌銘公諱敞字仲原父姓劉氏世爲吉州臨江人自其皇祖以尚書郎有聲太宗時遂爲名家其後多聞人至公而益顯公舉慶暦六年進士中甲科以大理評事通判蔡州丁外艱服除召試學士院遷太子中允直集賢院判登聞鼓院吏部南曹尚書考功於是夏英公旣薨天子賜謚曰文正公曰此吾職也即上䟽言謚者有司之事也且竦行不應法今百司各得守其職而陛下侵臣官䟽凡三上天子嘉其守爲更其謚曰文莊公曰姑可以止矣權判三司開坼司又權度支判官同修起居注至和元年九月召試遷右正言知制語宦者石全彬以勞遷宫苑使領觀察使意不滿退而愠有言居三日正除觀察使公封還辭頭不草制其命遂止二年八月奉使契丹公素知虜山川道里虜人道自古北口回曲千餘里至桞河公問曰自一有古字松亭趨桞河甚直而近不數日可至中京何不道彼而道此蓋虜人常故迂其路欲以國地險逺誇使者且謂莫習其山川不虞公之問也相與驚顧羞媿即吐其實曰誠如公言時順州山中有異獸如馬而食虎豹虜人不識以一有爲字問公曰此所謂駮也爲言其形狀聲音皆是虜人益歎服三年使還以親嫌求知揚州歲餘遷起居舎人徙知鄆州兼京東西路安撫使居數月召還糺察在京刑獄修玉牒知嘉祐四年貢舉稱爲得人是歲天子卜以孟冬祫旣廷告丞相用故事率文武官加上天子尊號公上書言尊號非古也陛下自寳元之郊止群臣毋得以請迨今二十年無所加天下皆知甚盛德奈何一旦受虚名而愪實美上曰我意亦謂當如此遂不允群臣請而禮官前祫請祔郭皇后於廟自孝章以下四后在别廟者請母合食事下議議者紛然公之議曰春秋之義不薨于寢不稱夫人而郭氏以廢薨按景祐之詔許復其號而不許其謚與祔謂冝如詔書又曰禮於祫未毀廟之主皆合食而無帝后之限且祖宗以來用之傳曰祭從先祖冝如故於是皆如公言公旣驟屈廷臣之議議者已多仄目旣而又論吕溱過輕而責重與臺諌異由是言事者亟攻之公知不容于時矣㑹永興闕守因自請行即拜翰林侍讀學士充永興軍路安撫使兼知永興軍府事長安多冨人右族豪猾難治猶習故都時一無此字態公方發大姓范偉事獄未具而公召由是獄屢變連年吏不能决至其事聞制取以付御史臺乃决而卒如公所發也公爲三州皆有善政在揚州奪發運使冐占雷塘田數百項予民民至今以爲德其治鄆永興皆承旱歉所至必雨雪蝗輒飛去歲用豐稔流亡來歸令行民信盗賊禁止至路不拾遺公於學博自六經百氏古今傳記下至天文地理卜醫數術浮圗老莊之說無所不通其爲文章尤敏贍嘗直紫㣲閣一日追封皇子公主几人公方將下直爲之立馬却坐一揮九制數千言文辭典雅各得其體公知制誥七年當以次遷翰林學士者數矣乆而不遷及居永興歲餘遂以疾聞八年八月召還判三班院太常寺公在朝廷遇事多所建明如古渭州可棄孟陽河不可開樞宻使狄青冝罷以保全之之類皆其語在士大夫間者若其規切人主直言逆耳至於從容進見開導聦明賢否人物其事不聞于外廷者其𥙷益尤多故雖不合於世而特𬒳人主之知方嘉祐中嫉者衆而攻之急其雖危而得無害者仁宗深察其忠也及侍英宗講讀不專章句解詁而指事據經因以諷諌毎見聽納故尤竒其材巳而復得驚眩疾告滿百日求便郡上曰如劉某者豈易得也復賜以告上毎宴見諸學士時時問公少間否賜以新橙五十勞其良苦疾一有乆字少間復求外𥙷上悵然許之出知衛州未行徙汝州治平三年召還以疾不能朝改集賢院學士判南京留司御史臺熈寧元年四月八日卒于官舍享年五十嗚呼以先帝之知公使其不病其所以甲之者豈一翰林學士而止哉方公以論事忤於時也又有􅌟爲謗語以怒時相者及歸自雍丞相韓公方欲還公學士未及而公病遂止於此豈非其命也夫公累官至給事中階朝散大夫勲上輕車都尉開國彭城爵公邑戸二千一百實食者三百曾祖諱琠贈大理評事祖諱式尚書工部貟外郎贈戸部尚書考諱立之尚書主客郎中贈工一作禮部尚書公再娶論氏皆侍御史程之女前夫人先公早卒後夫人以公貴累封河南郡君子男四人長定國郊社掌座早卒次奉世大理寺丞次當時大理評事次安上太常寺太祝女三人長適大理評事韓宗直二尚㓜公旣卒天子推恩録其兩孫望旦一族子安世皆試將作監主簿公爲人磊落明白推誠自信不爲防慮至其屢見侵害皆置而不較亦不介于胷中居家不問有無喜賙宗族旣卒家無餘財與其弟攽友愛尤篤有文集六十卷其爲春秋之說曰傳曰權衡曰說例曰文權一無三字曰意林合四十一一無此字卷又有七經小傳五卷弟子記五卷而七經小傳今盛行於學者二年十月辛酉其弟攽與其子奉世等葬公於某所一作葬公祥符縣魏陵郷祔于先墓以來請銘乃爲之銘曰嗚呼維仲原父學彊而博識敏而明坦其無疑一以誠見利如畏義必爭觸機履險危不傾畜大不施奪其齡惟其文章粲日星雖欲有毀知莫能維古聖賢皆後亨有如不信考斯銘零陵縣令贈尚書都官貟外郎呉君墓謁銘并序君諱舉字太冲姓呉氏興國軍永興人也曾祖諱瑗祖諱章父諱思逈五代之際自江以南爲南唐呉氏亦㣲不顯君當李煜時以明經爲彭澤主簿太祖皇帝召煜來朝煜不奉詔遣曹彬討之前鋒兵破池陽遣使招降郡縣使者至彭澤其令欲以城降君以大義責之且曰吾能爲李氏死爾乃共殺使者爲煜守煜巳降君爲游兵執送軍中主將責以殺使者君曰固當如是爾主將義而釋之當是時嘗仕煜者皆隨煜至京師得復𥙷吏君獨棄去不顧太平興國二年詔求李氏時故吏所在敦遣君始至京師以爲鄆州平隂主簿歴益州成都令陜州録事叅軍襄州之冝城洋州之眞符福州之連江楚州之鹽城耀州之同官最後爲零陵令以祥符九年八月二十六日道卒于揚州享年七十有六夫人伏氏能讀書史有賢行後君十有四年以卒享年八十有二子男二人長曰晛早卒次曰中復今爲起居舍人以景祐三年十有一月甲子合葬君夫人于南康軍都昌縣之長城君學春秋通三傳其臨大節知所守當五代時僭竊分裂喪君亡國不勝數士之不得守其節與不能守者世皆習而不怪君於此時獨區區志不忘李氏其義有足動人然而亦無爲君道者考君之出處自重不妄冝其世莫之知而潜德晦善顯於後世克有賢子爲時名臣君以子恩累贈尚書都官貟外郎考於令品文得碣于其墓以昭令德而示子孫於是史官廬陵歐陽脩曰此余職也乃爲之辭曰世逢屯兮㢘耻道缺中國五䄠兮九州分裂朝存夕亡兮士莫守節昧者習安兮懦夫志奪偉哉呉君兮凛矣其烈世莫我知兮不妄自伐有韞必昭兮後世而發嗚呼呉君兮寓銘斯碣居士集卷第三十五熈寧五年秋七月男發等編定紹熈二年三月郡人孫謙益校正鄭君墓銘天禧三一作二年劉公墓銘得也也一作耶定國一作充國呉君墓碣不勝數一作不可勝數然而此下一有人字, WYG: ''}
