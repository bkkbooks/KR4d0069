  - {type: variant, offset: 22, length: 9, content: 墓誌銘并序翰林侍讀, WYG: 皆累贈太師尚書公兼中書令曽祖妣姚氏贈魯國夫人祖妣田氏贈秦國夫人妣任氏贈徐國夫人邉氏贈秦國夫人公皇考以文章自顯漢周之際逮事太祖太宗為名臣嘗諭杜重威使無反漢拒盧多遜害趙普之謀以百口明符彦卿無罪故世多稱王氏有隂德公之皇考亦自植三槐於庭曰吾之後世必有為三公者此其所以志也公少好}
