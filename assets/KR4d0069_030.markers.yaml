  - {type: punctuation, offset: 5226, content: /, id: KR4d0069_krp_030-bkkpn64}
  - {type: variant, offset: 5226, length: 0, content: '', WYG: 人也即改右正言供職公感激奮勵遇事輒言無所回避姦䛕權倖屏息畏之其補益多矣然亦不勝其怨嫉也慶厯四年元昊納誓請和将加封􅁽而契丹以兵臨境上遣使言為中國討賊且告師期請止毋與和朝廷患之欲聽重絶夏人而兵不得息不聴生事北邉議未決公獨以為中國厭兵久矣此契丹之所幸一日使吾息兵養勇非其利也故用此以撓我爾是不可聽朝廷雖是公言猶留夏􅁽不遣而假公諫議大夫以報公從十餘騎馳出居庸關見敵於九十九泉從容坐帳中辯折徃復數十卒屈其議取其要領而還朝廷遂發夏冊臣元昊西師既解嚴而北邉亦無事是歳以本官知制誥史館修撰而契丹卒自攻元昊明年使來告捷又以公徃報坐習敵語出知吉州怨家因之中以事左遷將}
