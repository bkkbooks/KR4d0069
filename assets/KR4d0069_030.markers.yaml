  - {type: variant, offset: 5225, length: 0, content: '', WYG: 書丞刋校三史充集賢校理天章閣待制范公仲淹以言事觸宰相得罪諫官御史不敢言公䟽論之坐貶監筠州酒稅稍徙泰州已而天子感悟亟復用范公而因之以被斥者皆召還惟公以便親乞知英州遷太常博士丁母憂服除遂還為集賢校理同判太常禮院景祐慶厯之間天下怠於久安吏習因循多失職及趙元昊以夏叛師出久無功縣官財屈而民重困天子赫然思振頽弊以修百度既已更用二三大臣又増置諫官四員使言天下事公其}
  - {type: page-break, offset: 5225, content: '', id: KR4d0069_WYG_018-9a, image: WYG1103/WYG1103-0791a.png}
