  - {type: variant, offset: 2906, length: 345, content: 君募少年選手力夜徃捕獲之明日召尉歸以賊與之曰得是可以論賞賞未及下而尉卒尉河南儒者魏景山也老而且貧君爲主其喪事買田宅于汝州以活其妻子通判嘉州治田訟三十年不决者一日决之秩滿嘉人詣轉運使乞留不得時文丞相守成都薦其材而薦者十有五人通判河中府府有妖獄二百餘人君方以公事之他州提點刑獄司疑獄有冤召君還視之獨留其一人餘皆釋之累遷尚書虞部貟外郎天子享明堂推恩遂遷比部通判寧州决疑獄活一家五人君好學重氣節嘗有負其錢數千萬輒毀其劵棄之與人交乆而益篤喜爲歌詩至於射藝書法醫藥皆精妙尤好古書竒畫毎傾貲購之嘗自爲録蔵于家其材能好尚皆可嘉也母曰仁壽縣太君王氏𥘉娶王氏生一子安期也後娶又曰王氏銘曰在蜀僞時處昏不迷惟陳最㣲蜀亡而東髙明顯融莫如陳宗惟陳有聲自其髙曽君世不興惟興與伏有俟而畜其周必復實始自君昌其子孫考銘有文鎭安, WYG: 除準武勝}
