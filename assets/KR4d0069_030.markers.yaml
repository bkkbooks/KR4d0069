  - {type: variant, offset: 3264, length: 0, content: '', WYG: 公司空兼侍中諡曰元獻有司請輟視朝一日詔特輟二日以其年三月癸酉𦵏公於許州陽翟縣麥秀鄉之北原既𦵏賜其墓隧之碑首曰舊學之碑既又勑史臣脩考次公事具書於碑下臣脩伏讀國史見真宗皇帝時天下無事天子方推讓功徳祠祀天地山川講禮樂以文頌聲而儒學文章雋賢偉異之人出公世家江西之臨川年始十四一日起田里進見天子時方親閲天下貢士㑹廷中者千餘人與夫宫臣衛官擁列圜視公不動聲氣操筆為文辭立成以獻天子嘉賞賜同進士出身遂登館閣掌書命以文章為天下所宗逮陛下養徳東宫先帝選用臣屬即以公遺陛下由王官宫臣卒登宰相凡所以輔道聖徳憂勤國家有舊有勞自始至卒五十餘年公既𦵏而先帝之名臣與陛下東宫之舊人皆無在者宜其襃寵優異比公甘盤臣脩幸得執筆史官奉明詔謹昧死上臨淄公事曰公諱殊字同叔姓晏氏其世次晦顯徙遷不常自其髙祖諱墉唐咸通中舉進士卒官江西始著籍於髙安其後三世不顯曽祖諱延昌又徙其籍於臨川祖諱郜追封英國公考諱固追封秦國公自曽祖已下皆用公貴累贈開府儀同三司太師}
