  - {type: variant, offset: 3320, length: 204, content: 聞詔輟視朝二日贈公中書令於是其孤嗣隆以狀上考功移于太常而博士起曰法冝謚乃謚曰文簡明年十月十八日葬公于河南伊闕之某鄕某原一作神陰郷張留里其孤又以請于太史而史臣脩曰禮冝銘乃考次公之世族官封爵號卒葬時日與其始終之大節合而誌於其墓且銘之曰惟程氏逺有世序自重黎以來其後居中山者出於魏安鄕侯昱之後公諱琳字天球中山博野人也曽祖贈太師諱新曽祖妣呉國夫人齊氏祖贈太師中書令諱賛明祖妣秦國夫人呉氏考袁州冝春令贈太師中書令一有兼字, WYG: 刑部}
