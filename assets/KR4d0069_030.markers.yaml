  - {type: variant, offset: 2533, length: 372, content: 所爲未有大見于時也然詡節義可信之士以詡能報君而君能知詡則君之爲人可知也巳君諱漢卿字師黯世居閬中其先博州人因事僞蜀爲縣令遂留家焉其曽叔祖省華官至諫議大夫生堯叟堯佐堯咨先後爲將相而君自曽祖而下三世不顯曽祖諱省恭不仕祖諱堯封舉進士爲􅉑縣主簿王均亂蜀詣闕上書獻破賊䇿不報遂退老于嵩山父諱淵亦舉進士官至大理寺丞與其兄漸所謂金龜子者皆以文學知名君生一歲而孤年十三與其母入蜀過鳯翔謁其府尹而吏少君不爲之通君直入伏庭下曰陳某請見因責尹慢士戒吏不謹尹慙笞吏以謝君君用叔祖堯咨䕃𥙷將作監主簿累遷大理寺丞監沙苑監權知渭南縣民有兄弟爭田者吏常直其兄而弟訟不巳君爲徃視其田辨其劵書而以田與弟其兄謝曰我悔欲歸弟以田者數矣直懼笞而不敢耳弟曰我田故多然耻以不直訟兄今我直矣願以田與兄兄弟相持慟哭拜而去由是縣民有事多相持詣君得一言以决曲直又知登封縣縣有惡盗十人巳謀未發而尉方以事, WYG: 制}
