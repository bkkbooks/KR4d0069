  - {type: variant, offset: 5230, length: 0, content: '', WYG: 公留廣西逾年撫緝完復嶺海肅然又遣人入特磨襲取智髙母及其弟一人俘於京師斬之拜集賢院學士久之徙知潭州又徙青州再遷吏部侍郎嘉祐五年交趾㓂邕州殺五巡檢天子以為恩信著於嶺外而為交趾所畏者公也驛召以為廣西體量安撫使悉發荆湖兵以從公至則移檄交趾召其臣費嘉祐詰責之嘉祐皇恐對曰種落犯邉罪當死願留取首惡以獻即械五人送欽州斬於界上公還邕人遮道留之不得明年以尚書左丞知廣州英宗即位拜工部尚書代還道病卒享年六十有五公經制五管前後十年凡治六州所至有惠愛雖在兵間手不釋巻}
