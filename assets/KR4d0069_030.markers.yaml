  - {type: variant, offset: 3957, length: 387, content: 大宴五門城中火吏救止卒宴民皆不知蓋其他設施多類此軍士見監軍告其軍有變監軍入白公笑遣之惶恐不敢去公曰軍中動静吾自知之苟有謀者不待告也可使告者來監軍去而告者卒不敢來公亦不問遂止蜀州妖人有自號李冰神子者署官屬吏卒聚徒百餘人公命捕寘之法而讒之朝者言公妄殺人蜀人恐且亂矣上遣中貴人馳視之使者入其境居人行旅爭道公善使者問殺妖人事其父老皆曰殺一人可使蜀數十年無事使者問其故對曰前亂蜀者非有智謀豪傑之才乃里閭無頼小人爾惟不制其始遂至於亂也使者視蜀旣無事又得父老語還白於是上益以公爲能遷給事中知開封府禁中大火延兩宫宦者治獄得縫人火斗巳誣伏而下府命公具獄公立辨其非禁中不得入乃命工圗火所經而後宫人多所居隘其烓竈近版壁歲乆燥而焚曰此豈一日火哉乃建言此殆天災也不冝以罪人上爲緩其獄故卒得無死者公在府决事神速一歲中獄常空者四五遷工部侍郎龍圗閣直學士守御史中丞是歲以翰林侍讀學士復知開封府明年爲三司使治, WYG: ''}
