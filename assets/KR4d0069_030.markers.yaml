  - {type: variant, offset: 3269, length: 2, content: 簡程, WYG: 章鄉里號為神童故丞相張文節}
  - {type: variant, offset: 3272, length: 5, content: 墓誌銘嘉祐, WYG: 安撫江西得公以聞真宗召見既賜出身後二日又召試詩賦論公徐啓曰臣嘗私習此賦不敢隠真宗益嗟異之因試以他題以為秘書省正字置之秘閣使得悉讀秘書命故僕射陳文僖公視其學明年獻其所為文召試中書遷太常寺奉禮郎封祀泰山推恩遷光禄寺丞數月充集賢校理明年遷著作佐郎丁父憂去官已而真宗思之即其家起復命淮南發運使具舟送之京師從祀太清宫賜緋衣銀魚同判太常禮院又丁母憂求去官服喪不許今天子始封昇王公以選為府記室參軍再遷左正言直史館今天子為皇太子以户部員外郎充太子舍人賜金紫知制誥判集賢院遷翰林學士充景靈宫判官太子左庶子兼判太常寺知禮儀院公既以道徳文章佐佑東宫真宗每所諮訪多以方寸小紙細書問之由是參與機宻凡所對必以其藁進示不洩其後悉閲真宗閣中遺書得公所進藁類為八十巻藏之禁中人莫之見也初真宗遺詔章獻明肅太后權聴軍國事宰相丁謂樞宻使曹利用各欲獨見奏事無敢決其議者公建言羣臣奏事太后者垂簾聴之皆毋得見議遂定乾興}
