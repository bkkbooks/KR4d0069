  - {type: variant, offset: 3290, length: 0, content: '', WYG: 復為樞宻副使未拜改叅知政事遷尚書左丞太后謁太廟有請服衮冕者太后以問公公以周官后服對太后崩大臣執政者皆罷公為禮部尚書知亳州徙知陳州遷刑部尚書復召為御史中丞又為三司使知樞宻院事拜樞宻使再加}
