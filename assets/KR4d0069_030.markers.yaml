  - {type: variant, offset: 5223, length: 0, content: '', WYG: 寵及後世惟百有位可勸無怠余襄公始興襄公既𦵏於曲江之明年其子仲荀走於亳以來告曰余氏世為閩人五代之際逃亂於韶自曽髙以來晦迹嘉遁至於博士府君始有禄仕而襄公繼之以大曲江僻在嶺表自始興張文獻公有聲於唐為賢相至公復出為宋名臣盖余氏徙韶厯四世始有顯仕而曲江寂寥三百年然後再有聞人惟公位登天臺正秩三品遂有爵土開國鄉州以繼美前哲而為韶人榮至於褒䘏贈諡始終之寵盛矣盖褒有詔䘏有物贈有告而諡行考功有議有状合而誌之以閟諸幽有銘可謂備矣惟是螭首龜趺揭於墓隧以表見於後世而昭示其子孫者宜有辭而闕焉敢以為請謹按余氏韶州曲江人曽祖諱某祖諱某皆不仕父諱某太常博士累贈太常少卿公諱靖字安道官至朝散大夫}
  - {type: page-break, offset: 5223, content: '', id: KR4d0069_WYG_018-7b, image: WYG1103/WYG1103-0790b.png}
  - {type: page-break, offset: 5223, content: '', id: KR4d0069_WYG_018-8a, image: WYG1103/WYG1103-0790c.png}
  - {type: variant, offset: 5224, length: 0, content: '', WYG: 工部尚書集賢院學士知廣州軍州事兼廣南東路兵馬鈐轄經畧安撫使柱國始興郡開國公食邑二千六百户食實封二百户治平元年自廣朝京師六月癸亥以疾薨於金陵天子惻然輟視朝一日賻以粟帛贈刑部尚書諡曰襄明年七月某甲子返𦵏於曲江之龍歸鄉成山之原公為人質重剛勁而言語恂恂不見喜怒自少博學强記至於厯代史記雜家小説隂陽律厯外暨浮屠老子之書無所不通天聖二年舉進士為贛縣尉書判拔萃改將作監丞知新建縣再遷}
  - {type: page-break, offset: 5224, content: '', id: KR4d0069_WYG_018-8b, image: WYG1103/WYG1103-0790d.png}
