  - {type: variant, offset: 5221, length: 1, content: 昌, WYG: 有姜之裔齊為晏氏齊在春秋晏顯諸侯傳載桓子嬰稱於丘其後無聞不亡僅存有煒自公厥聲以振公之顯聲實相天子天子曰噫予考真宗惟多名臣以臻盛隆汝初事我王宫東宫以暨相予始卒一躬輔我以徳有勞於邦公疾在外來歸自洛天子曰留汝予舊學凡今在庭莫如汝舊孰以畀予惟予聖考今既亡矣孰為予老何以贈之司空侍中禮則有加予思何窮有篆其文在其碑首天子之褒史臣有詔銘以述之永昭厥後歐陽文粹巻十七欽定四庫全書歐陽文粹巻十八宋陳亮編碑銘范文正公皇祐四年五月甲子資政殿學士尚書户部侍郎汝南文正公薨徐州以其年十有二月壬申𦵏於河南尹樊里之萬安山下公諱仲淹字希文五代之際世家蘇州事吳越太宗皇帝時吳越獻其地公之皇考從錢俶朝京師後為武寧軍掌書記以卒公生二歳而孤母夫人貧無依再適長山朱氏既長知其世家感泣去之南都入學舍掃一室晝夜講誦其起居飲食人所不堪而公自刻益苦居五年大通六經之㫖為文章論説必本於仁義祥符八年舉進士禮部選第一遂中乙科為廣徳司理叅軍始歸迎其母以養及公既貴天子乃贈公曾祖蘇州粮料院判官諱某為太保祖秘書監諱賛時為太傅考諱墉為太師妣謝氏為吳國夫人公少有大節其於富貴貧賤毁譽懽戚不一動其心而慨然有志於天下常自誦曰士當先天下之憂而憂後天下之樂而樂也其事上遇人一以自信不擇利害為趨捨其所有為必盡其方曰為之自我者當如是其成與否有不在我者雖聖賢不能必吾豈苟哉天聖中晏丞相薦公文學以大理寺丞為秘閣校理以言事忤章獻太后㫖通判河中府久之上記其忠召拜右司諫當太后臨朝聽政時以至日大㑹前殿上將率百官為夀有司以具公上疏為言天子無北面且開後世弱人主以彊母后之漸其事遂已又上書請還政天子不報及太后崩言事者希㫖多求太后時事欲深治之公獨以為太后受託先帝保佑聖躬始終十年未見過失宜掩其小故以全大徳初太后有遺命立楊太妃代為太后公諫曰太后母號也自古無代立者繇是罷其􅁽命是歳大旱蝗奉使安撫東南使還㑹郭皇后廢率諫官御史伏閤争不能得貶知睦州又徙蘇州歳餘即拜禮部員外郎天章閣待制益論時政闕失而大臣權倖多忌惡之居數月以公知開封府開封素號難治公治有聲事日益簡暇則益取古今治亂安危為上開説又為百官圖以獻曰任人各以其材而百職修堯舜之治不過此也因指其遷進遲速次序曰如此而可以為公可以為私亦不可以不察由是吕丞相怒至交論上前公求對辯語切坐落職知饒州明年吕公亦罷公徙潤州又徙越州而趙元昊反河西上復召相吕公乃以公為陕西經畧安撫副使遷龍圖閣直學士是時新失大將延州危公請自守鄜延捍賊乃知延州元昊遣人遺書以求和公以為無事請和難信且書有僣號不可以聞乃自為書告以逆順成敗之説甚辯坐擅復書奪一官知耀州未逾月徙知慶州既而四路置帥以公為環慶路經略安撫招討使兵馬都部署累遷諫議大夫樞宻直學士公為將務持重不急近功小利於延州築清澗城墾營田復承平永平廢寨孰羌歸業者數萬户於慶州城大順以據要害奪賊地而耕之又城細腰胡盧於是明珠滅臧等大族皆去賊為中國用自邉制久隳至兵與將常不相識公始分延州兵為六將訓練齊整諸路皆用以為法公之所在賊不敢犯人或疑公見敵應變為如何至其城大順也一旦引兵出諸將不知所向軍至柔逺始號令告其地處使徃築城至於版築之用大小畢具而軍中初不知賊以騎三萬來争公戒諸將戰而賊走追勿過河已而賊果走追者不渡而河外果有伏賊既失計乃引去於是諸將皆服公為不可及公待將吏必使畏法而愛已所得賜賚皆以上意分賜諸將使自為謝諸蕃質子縱其出入無一人逃者蕃酋來見召之卧内屏人徹衛與語不疑公居二歳士勇邉實恩信大洽乃決策謀取横山復靈武而元昊數遣使稱臣請和上亦召公歸矣初西人籍為鄉兵者數萬既而黥以為軍唯公所部但刺其手公去兵罷獨得復為民其於兩路既得孰羌為用使以守邉因徙屯兵就食内地而紓西人饋輓之勞其所設施去而人徳之與守其法不敢變者至今尤多自公坐吕公貶羣士大夫各持二公曲直吕公患之凡直公者皆指為黨或坐竄逐及吕公復相公亦再起被用於是二公驩然相約勠力平賊天下之士皆以此多二公然朋黨之論遂起而不能止上既賢公可大用故卒置羣議而用之慶厯三年春召為樞宻副使五讓不許乃就道既至數月以為參知政事每進見必以太平責之公歎曰上之用我者至矣然事有先後而革弊政於乆安非朝夕可也既而上再賜手詔趣使條天下事又開天章閣召見賜坐授以紙筆使䟽於前公惶恐避席始退而條列時所宜先者十數事上之其詔天下興學取士先徳行不専文辭革磨勘例遷以别能否減任子之數而除濫官用農桑考課守宰等事方施行而磨勘任子之法僥倖之人皆不便因相與騰口而嫉公者亦幸外有言喜為之佐佑㑹邉奏有警公即請行乃以公為河東陕西宣撫使至則上書願復守邉即拜資政殿學士知邠州兼陕西四路安撫使其知政事纔一歳而罷有司悉奏罷公前所施行而復其故言者遂以危事中之賴上察其忠不聽是時夏人已稱臣公因以疾請鄧州守鄧三歳求知杭州又徙青州公益病又求知穎州肩舁至徐遂不起享年六十有四方公之病上賜藥存問既薨輟朝一日以其遺表無所請使就問其家所欲為贈以兵部尚書所以哀䘏之甚厚公為人外和内剛樂善汎愛喪其母時尚貧終身非賔客食不重肉臨財好施意豁如也及退而視其私妻子僅給衣食其為政所至民多立祠畫像其行已臨事自山林處士里閭田野之人外至四裔莫不知其名字而樂道其事者甚衆及其世次官爵誌於墓譜於家藏於有司者皆不論著著其繫天下國家之大者亦公之志也歟銘曰范於吳越世實陪臣俶納山川及其士民范始來北中間幾息公奮自躬與時偕逢事有罪功言有違從豈公必能天子用公其艱其勞一其初終夏童跳邉乗吏怠安帝命公徃問彼驕頑有不聽順鋤其穴根公居三年怯勇隳完兒憐獸擾卒俾徕臣夏人在庭其事方議帝趣公來以就於治公拜稽首茲為艱哉初匪其難在其終之羣言營營卒壊於成匪惡其成惟公是傾不傾不危天子之明存有顯榮沒有贈諡藏其子}
