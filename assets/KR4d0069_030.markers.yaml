  - {type: variant, offset: 5227, length: 1, content: 挍, WYG: 少監分司南京公怡然還鄉里闔門謝賔客絶人事凡六年天子每思之欲用者數矣大臣有不喜者第遷光禄少卿於家又以為武衛将軍夀州兵馬鈐轄辭不拜皇祐二年祀明堂覃恩遷衛尉卿明年知䖍州丁父憂去官而蠻賊儂智髙陷邕州連破嶺南州縣圍廣州乃即廬中起公為秘}
  - {type: punctuation, offset: 5228, content: ), id: KR4d0069_krp_030-bkkpn67}
  - {type: variant, offset: 5229, length: 0, content: '', WYG: 監知潭州即日疾馳在道改知桂州廣南西路經略安撫使公奏曰賊在東而徙臣西非臣志也天子嘉之即詔公經制廣東西賊盜乃趨廣州而智髙復西走邕州自智髙初起交趾請出兵助討賊詔不許公以為智髙交趾叛者宜聴出兵毋沮其善意累疏論之不報至是公曰邕州與交趾接境今不納必忿而反助智高乃以便宜趣交趾㑹兵又募儂黄諸姓酋豪皆縻以職與之誓約使聴節制或疑其不可用公曰使不與智髙合足矣及智髙入邕州遂無外援既而宣撫使狄青㑹公兵敗賊於歸仁智髙走入海邕州平公請復終喪不許諸将班師以智髙尚在請留公廣西委以後事遷給事中諫官御史列䟽言公功多而賞薄再遷尚書工部侍}
  - {type: page-break, offset: 5229, content: '', id: KR4d0069_WYG_018-10b, image: WYG1103/WYG1103-0791d.png}
