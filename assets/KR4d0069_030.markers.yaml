  - {type: line-break, offset: 488, content: '', id: KR4d0069_SBCK_030-2a08}
  - {type: variant, offset: 488, length: 1990, content: 大臣竄逐本與天下棄之今復内還是違天下意由是止徙道州玉清昭應宫災坐火事劾當死者百餘人公䟽言天災可畏不可反以罪人而重天怒願益脩德以塞譴人乃獲免公於御史自監察歴殿中侍御史侍御史知雜事於尚書爲貟外郎郎中累官至諌議大夫於外爲荆湖北路京東河北轉運使江淮一有南字兩浙荆湖發運制置使利夔路安撫使知河中府滑州於三司爲鹽鐵判官判句院歴鹽鐵度支戸部副使又嘗權知諫院判三班審官院太常寺國子監於侍從爲天章閣待制龍圗閣直學士翰林侍讀學士雖其一作其雖自晦其所居人皆以爲冝其在京東籍淄青齊濮濟鄆六州之人冒耕河壖地收租緍絹歲二十八萬而六州之民爭訟遂息其後言利者請稅天下橋渡以佐軍公建言津梁利人而反稅之以爲害卒爭罷之平居退讓未嘗肯爲人先妖賊王則反貝州兵圍乆不克而自河以北軍餉調發益急轉運使受命者以疾留不行公自滑州權河北轉運使命至即日馳城下軍須皆如其期其於取舎緩急常如此公居家有常法雖貴顯衣服飲食如少賤時事母至孝與族兄甚相友愛人以爲同産一有平生所爲文章有集十卷公以皇祐元年七月十日遇疾卒于京師享年六十有八上聞震悼以白金三百兩賜其家特贈工部侍郎曽祖諱惟序不仕祖諱文翼復州録事參軍贈太子中舎父諱龜從贈右諫議大夫母南陽郡太君鄧氏自皇祖中舎君家于漢陽遂葬之至公始葬汝州之襄城某郷某原一作彰孝郷保豐原實五年閏七月十七日也公𥘉娶程氏再娶孫氏封樂安郡君先公五十日而卒公子五人曰子駿子充子雲一作子瑾下同子諒子眞子眞子充皆早卒於公之葬一作終也子駿子雲皆爲大理評事子諒大理寺丞有孫十人女三人長適虞部貟外郎杜樞次早卒㓜適大理寺丞王縡銘曰自足乎其中不求乎其外斯惟公之善晦仁能勇於必爲善有應而無逺故公晦其終顯難於自進以晚見嗟而壽胡不俾其遐嗚呼其奈何兵部貟外郎天章閣待制杜公墓誌銘慶暦三年盗起京西掠商鄧均房叛兵燒光化軍逐守吏吏不能捕天子患之問宰相誰可任者宰相言度支判官尚書虞部貟外郎杜某名家子一有好字學通知古今冝可用乃以君爲京西轉運按察使居數月賊平叛兵誅死明年廣西歐希範誘白崖山蠻蒙趕襲破環州䧟鎮寧帶溪普義有衆數千以攻桂管宰相又言前時杜某守横州言蠻事可聽冝知蠻利害天子驛召君見便殿所對合意即除君刑部貟外郎直集賢院廣南西路轉運按察安撫等使君至冝州得州人呉香及獄囚歐世宏脫其械使入賊峒說其酋豪君乗其怠急擊之破其五峒斬首數百級復取環州因盡焚其山林積聚希範窮迫走荔波洞蒙趕率僞將相數十人以其衆降君與將佐謀曰夫蠻習險恃阻如捕猩猱而吾兵以苦暑難乆是進退遲速皆不可爲故常務捐厚利以招之蓋威不足以制則恩不能以懷此其所以數叛也今吾兵雖幸勝然蠻特敗而來耳豈眞降者邪啖之以利後必復動乃慨然歎曰蠻知利而不知威乆矣吾將先威而後信庻幾信可立也一無比字乃擊牛爲酒大㑹環州戮其一作之坐中者六百餘人而釋其尫病脅從與其非因敗而降者百餘人後三日兵破荔波擒希範至并戮而醢之以醢賜諸溪峒於是叛蠻無噍類而君威震南海言事者論君殺降爲國失信於蠻貃天子置之不問詔書諭君賜以金帛君即上書引咎六年徙爲兩浙轉運使築錢塘堤自官浦至沙陘以除海患明年又徙河北轉運使召見奏事移刻天子益知其材賜金紫服以遣之是歲夏拜天章閣待制充環慶路兵馬都部署經略安撫使知慶州君言殺降臣也冝得罪將吏惟臣所使其勞未録不敢先受命天子爲君悉録將吏賞之乃受命自元昊稱臣聽誓而數犯約抄一作撓邉邉吏避生事縱不敢爭君始至其酋孟香率千餘人内附事聞詔君如約君言如約當還而孟香得罪夏人勢無還理遣之必反爲邉患議未决夏人以兵入界求孟香孟香散走自匿夏兵驅殺邉戸掠奪羊一作牛馬而求孟香益急朝議責君亟索而還之君言夏人違誓舉兵孟香不可與因移檄夏人不償所掠則孟香不可得夏人不肯償所掠君亦不與孟香夏人後亦不復敢動君治邉二歲有威愛皇祐一年五月甲子疾卒于官享年四十有六天子震悼賻䘏其家以其子炤爲一有守字秘書省校書郎君以䕃𥙷將作監主簿累官至尚書兵部貟外郎階朝奉郎勲護軍嘗以太子中舎知建陽縣除民無名租歲以萬計閩俗貪嗇有老而生子者父兄多不舉曰是將分吾貲君上書請立伍保俾民相察寘之法由是生子得免閩人乆之以君爲徳多以君姓字名其子曰生汝者杜君也君諱祀字偉長世爲金陵人其曽伯祖昌業仕江南李氏爲江州節度使江南國㓕杜氏北遷今爲開封府開封人也曽祖諱某贈給事中祖諱鎬官至龍圗閣學士尚書禮部侍郎父諱某贈尚書工部侍郎君𥘉娶蔣氏封某縣君後娶徐氏封東海縣君女六人其二適人四尚㓜子男一人炤也杜氏自君皇祖侍郎以博學爲世儒宗故其子孫皆守儒學而多聞人君尤博覽強記其爲文章多論當世利害甚辯有文集十卷奏議集十二卷其居官以精敏明幹所至有聲君學問之餘兼喜隂陽數術之說常自推其數曰吾年四十六死矣其親戚朋友莫不聞其說至其歲果然嗚呼可謂異矣所謂命者果有數邪其果可以自知邪皇祐六年某月日其兄駕部貟外郎植與其孤葬君于某縣某郷某原銘曰其敏以逹其果以决其守不奪其摧不折其終一節兹謂不没尚書比部貟外郎陳君墓誌銘故尚書比部貟外郎陳君卜以至和二年正月某日葬于京兆府萬年縣洪固鄕神禾原其素所知秘書丞李詡與其孤安期謀將乞銘於廬陵歐陽脩安期曰, WYG: ''}
