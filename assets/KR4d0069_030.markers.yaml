  - {type: variant, offset: 428, length: 2, content: 李及, WYG: 參知政事再遷刑部侍郎景徳元年契丹犯邉真宗幸澶州雍王元份留守東京得暴疾命公馳自行在代元份留守二年遷尚書左丞三年拜工部尚書同中書門下平章事集賢殿大學士監修國史是時契丹初請盟趙徳眀亦納誓約願守河西故地二邉兵罷不用真宗遂欲以無事治天下公以為宋興三世祖宗之法具在故其為相務行故事慎所改作進退能否賞罰必當真宗久而益信之所言無不聽雖他宰相大臣有所請必曰王某以為如何事無大小非公所言不决公在相位十餘年外無夷狄之虞兵革不用海内富實羣工百司各得其職故天下至今稱為賢宰相公於用人不以名譽必求其實苟賢且才矣必久其官衆以為宜某職然後遷其所}
