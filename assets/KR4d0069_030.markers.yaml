  - {type: variant, offset: 3263, length: 0, content: '', WYG: 準入見泣涕曰非陛下知臣何以至此真宗具道公所以薦準者準始媿歎以為不可及故參知政事李穆子行簡有賢行以将作監丞居於家真宗召見慰勞之遷太子中允初遣使者召之不知其所止真宗命至中書問王某然後人知行簡公所薦也公自知制誥至為相薦士尤多其後公薨史官修真宗實録得内出奏章乃知朝廷之士多公所薦者公與人寡言笑其語雖簡而能以理屈人黙然終日莫能窺其際及奏事上前羣臣異同公徐一言以定今上為皇太子太子諭徳見公稱太子學書有法公曰論徳之職止於是耶趙徳明言民飢求糧百萬斛大臣皆曰徳明新納誓而敢違請以詔書責之真宗以問公公請勑有司具粟百萬於京師詔徳明來取真宗大喜徳明得詔書慙且拜曰朝廷有人大中祥符中天下大蝗真宗使人於野得死蝗以示大臣明日他宰相有袖死蝗以進者曰蝗實死矣請示於朝率百官賀公獨以為不可後數日方奏事飛蝗蔽天真宗顧公曰使百官方賀而蝗如此豈不為天下笑邪宦者劉承規以忠謹得幸病且死求為節度使真宗以語公曰承規待此以瞑目公執以為不可曰他日将有求為樞宻使者奈何至今内臣官不過留後公任事久人有謗公於上者公輒引咎未嘗自辯至人有過失雖人主盛怒可辯者辯之必得而後已榮王宫火延前殿有言非天災請置獄劾火事當坐死者百餘人公獨請見曰始失火時陛下以罪已詔天下而臣等皆上章待罪今反歸咎於人何以示信且火雖有迹寧知非天譴耶由是當坐者皆免日者上書言宫禁事誅籍其家得朝士所與徃還召問吉凶之説真宗怒欲付御史問狀公曰此人之常情且語不及朝廷不足罪真宗怒欲付獄公因自取嘗所召問之書進曰臣少賤時不免為此必以為罪願并臣付獄真宗曰此事已發何可免公曰臣為宰相執國法豈可自為之幸於不發而以罪人真宗意解公至中書悉焚所得書既而真宗悔復馳取之公曰臣已焚之矣由是獲免者衆公累官至太保以病求罷入見滋福殿真宗曰朕方以大事託卿而卿疾如此因命皇太子拜公公言皇太子盛徳必任陛下事因薦可為大臣者十餘人其後不至宰相者李及凌策二人而已然亦皆為名臣公屢以疾請真宗不得已拜公太尉兼侍中五日一朝視事遇軍國大事不以時入叅决公益惶恐因卧不起以疾懇辭冊拜太尉玉清昭應宫使自公病使者存問日嘗三四真宗手自和藥賜之疾亟遽幸第賜以白金五千兩辭不受以天禧元年九月癸酉薨於家享年六十有一真宗臨哭輟視朝三日發哀於苑中其子弟門人故吏皆被恩澤即以其年十一月庚申𦵏公於開封府開封縣新里鄉大邉村公娶趙氏封榮國夫人後公若干年卒子男三人長曰司封郎中雍次曰賛善大夫沖次曰素女四人長適太子少傅韓億次適兵部員外郎直集賢院蘇耆次適右正言范令孫次適龍圖閣直學士兵部郎中吕公弼諸孫十四人公事寡嫂謹其弟旭友悌尤篤任以家事一無所問而務以儉約率勵子弟使在富貴不知為驕侈兄子睦欲舉進士公曰吾嘗以太盛為懼其可與寒士争進至其薨也子素猶未官遺表不求恩澤有文集二十巻乾興元年詔配享真宗廟庭臣脩曰景徳祥符之際盛矣觀公之所以相而先帝所以用公者可謂至哉是以君明臣賢徳顯名尊生而俱享其榮殁而長配於廟可謂有始有卒如明詔所襃昔者蒸民江漢推大臣下之事所以見任賢使能之功雖曰山甫穆公之詩實歌宣王之徳也臣謹考國史實録至於搢紳故老之傳得公終始之節而録其可紀者輒聲為銘詩昭示後世以彰先帝之明以稱聖恩襃顯王氏流澤子孫與宋無極之意銘曰烈烈魏公相我真宗真廟翼翼魏公配食公相真宗不言以躬時有大事事有大疑匪卜匪筮公為蓍龜公在相位終日如黙問其夷狄包裹兵革問其卿士百工以職問其庶民耕織衣食相有賞罰功當罪明相所黜升惟否惟能執其權衡萬物之平孰不事君胡能必信孰不為相其惟有終公薨於位太尉之崇天子孝思來薦清廟侑我聖考惟時元老天子念功報公之隆春秋從享萬祀無窮作為詩歌以諗廟工晏元獻公至和元年六月觀文殿大學士行兵部尚書西京留守臨淄公以疾歸於京師八月疾少間入見天子曰噫予舊學之臣也乃留侍講邇英閤詔五日一朝前殿明年正月疾作不能朝飭太醫朝夕徃視有司除道將幸其家公歎曰吾無状乃以疾病憂吾君即馳奏曰臣疾少間行愈矣乃止其月丁亥以公薨聞天子震悼亟臨其喪以不即視公為恨}
