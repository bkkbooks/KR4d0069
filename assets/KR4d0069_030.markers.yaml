  - {type: variant, offset: 3672, length: 261, content: 禮折之乃巳史官修眞宗實録而起居注闕命公修大中祥符八年以後起居注遂修起居注遷祠部貟外郎提舉在京諸司庫務以本官知制誥同判吏部流内銓天聖五年館伴契丹賀乾元節使使者言中國使至契丹坐殿上位次髙而契丹使來坐次下當陛語甚切不巳而上與大臣皆以爲小故不足爭將許之公以謂許其小必啓其大力爭以爲不可遂止河决滑州𥘉議者言可塞役旣作而後議者以爲不可乃命公徃視之公言可塞遂塞之歲中遷右諫議大夫權御史中丞明年拜樞宻直學士知益州蜀人輕而喜亂公常先制於無事至其臨時如不用意而略其細治其大且甚者不過一二而蜀人安之自寮吏皆不能窺其所爲正月俗放燈吏民夜㑹聚遨嬉盛, WYG: 率}
