  - {type: variant, offset: 3279, length: 1, content: 閏, WYG: 拜右諫議大夫兼侍讀學士遷給事中景靈宫副使判吏部流内銓以易侍講崇政殿遷禮部侍郎知審官院為樞宻副使遷刑部侍郎上䟽論張耆不可為樞宻使由是忤太后㫖坐以笏擊其僕悞折其齒罷留守南京大興學校以教諸生自五代以來天下學廢興自公始召拜御史中丞改兵部侍郎兼秘書監資政殿學士翰林侍讀學士知天聖八年禮部貢舉明年為}
