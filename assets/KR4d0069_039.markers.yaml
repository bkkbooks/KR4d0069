  - {type: variant, offset: 0, length: 558, content: 居士集卷第三十九歐陽文忠公集三十九記十首泗州先春亭記景祐二年秋清河張侯以殿中丞來守泗上旣至問民之所素病而治其尤暴者曰暴莫大於淮越明年春作城之外堤因其舊而廣之度爲萬有九千二百尺用人之力八萬五千泗之民曰此吾利也而大役焉然人力出於州兵而石出乎南山作大役而民不知是爲政者之私我也不出一力而享六利不可相與出米一千三百石以食役者堤成髙三十三尺土實石堅捍暴備災可乆而不壞旣曰泗四逹之州也賔客之至者有禮於是因前蔣侯堂之亭新之爲勞餞之所曰思邵亭且推其美於前人而志邦人之思也又曰泗天下之水㑹也歳漕必廪於此於是治常豐倉西門二夾室一以視出納曰某亭一以爲舟者之寓舎曰通漕亭然後曰吾亦有所休一有暇其勞三字乎乃築州署之東城上爲先春亭以臨淮水而望西山是歳秋予貶夷陵過泗上於是知張侯之善爲政也昔周單子聘楚而過陳見其道穢而川澤不陂梁客至不授館羇旅無所寓遂知其必亡蓋城郭道路旅舎寄寓皆三代爲政之法而周官尤謹著之以爲禦備今張侯之作也先民之備災而及于賔客徃來然後思自休焉故曰知爲政也先時歳大水州㡬溺前司封貟外郎張侯夏守是州築堤以禦之今所謂因其舊者是也是役也堤爲大故予記其大者詳焉夷陵縣至喜堂記峽州治夷陵地濵大江雖一無此字有椒􅃮紙以通商賈而民俗儉陋常自足無所仰於四方販夫所售不過鱐魚腐鮑民所嗜而巳冨商大賈皆無爲而至地僻而貧故夷陵爲下縣而峽爲小州州居無郭郛通衢不, WYG: ''}
  - {type: indent, offset: 8, content: 　, id: KR4d0069_krp_039-bkkind1}
