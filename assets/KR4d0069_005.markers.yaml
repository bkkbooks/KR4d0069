  - {type: variant, offset: 0, length: 1463, content: 内制集卷第五歐陽文忠公集八十六賜樞宻使山南東道節度使同中書門下平章事賈昌朝生日禮物口宣九月五日卿位峻樞庭望崇舊老屬誕期之斯及顧寵數以冝優體乃眷懷膺茲蕃錫皇帝賀契丹皇帝正旦書正月一日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下玉曆正時布王春而茲始寳隣敦契講信聘以交修方履新陽益綏多福其於祝詠罔罄敷言今差朝散大夫守太常少卿上騎都尉渤海縣開國男食邑三百戸賜紫金魚袋呉中復供僃庫使銀青崇禄大夫檢校太子賔客兼御史大夫騎都尉廣平縣開國男食邑三百戸宋孟孫充正旦國信使副有少禮物具諸别幅專奉書陳賀不宣白皇帝賀契丹太皇太后正旦書正月一日姪大宋皇帝謹致書于嬸大契丹仁慈聖善欽孝廣徳安靜正淳懿和寛厚崇覺儀天太皇太后闕下歳律更新春陽鬯逹因履端之叶吉敦永好以申歡載惟慈懿之和方集壽康之祉更希善攝用副遐悰今差朝散大夫守太常少卿直昭文館護軍廣陵縣開國子食邑五百戸賜紫金魚袋吕景𥘉洛苑使兼閤門通事舍人銀青崇禄大夫檢校太子賔客兼御史大夫騎都尉清河郡開國侯食邑一千七百户張利一充正旦國信使副有少禮物具諸别幅專奉書陳賀不宣謹白賜知潁州徐宗況進奉賀兖國公主出降銀絹馬等勑書勑徐宗況省所進奉賀兖國公主出降絹五百疋事具悉詩稱王姬之下嫁國著嘉禮而有儀惟臣職之聿脩僃物容而叙慶誠勤所至歎尚良深故茲示諭想冝知悉冬寒汝比好否遣書指不多及賜知建昌軍沈造勑書勑沈造省所進奉銀珠稻米一十石計一百黄絹袋事具悉汝職守軍符政兼民穡樂此有秋之實擇其嘉榖之英式陳常貢之儀彌體恪官之意故茲示諭想冝知悉冬寒汝比好否遣書指不多及集禧觀凝祥池崇禧殿開啓祝聖壽年交金籙道埸宻詞十二月十日伏以琁霄黙運推四序以循行玉曆更新集萬靈而交會俾清琳宇延格髙真薦兹精一之誠祈乃純厖之祉冀緜福祚均及含生班荆館賜契丹賀正旦人使到闕酒果口宣十二月十日卿等歳律更端隣歡交聘載馳使傳方及國郊冝推寵錫之恩式示眷懷之厚瓊林苑開啓保祐聖躬祈福道埸青詞十二月十二日伏以四時成歳嘉庻彚之咸新百福自天荷衆真之冥貺俾開靈囿恭講仙科恢寳祚之延長錫壽康之遐永是惟降鑒享乃克誠瓊林苑開啓保祐聖躬祈福道埸黙表伏以荷天地之鴻休席祖宗之丕業載惟勵翼敢怠憂勤屬歳律之更端冀時禧之茂集俾嚴禁籞柢率舊章庻通芬潔之誠仰格清真之馭伏冀錫齡斯永降福孔多保邦祚於無窮均物生而咸𬒳啓聖院齋殿内權奉明徳元徳章穆皇后今告遷赴普安院重徽隆福兩殿奉安祝文嚮以雨水為災殿塗増緝亦旣新於叢構庻來復於真遊爰揆靈辰冀茲安妥𬗟惟慈佑丕鑒乃誠皇帝親詣啓聖禪院告遷明徳元徳章穆皇后赴普安院奉安祝文嚮者因霖災之為沴飭殿構以増新㳙榖旦之惟良奉神遊而還止載深感慕躬薦芬馨式慰孝思冀茲臨格正月三日就驛賜契丹賀正旦人使内中酒果口宣卿等奉將隣好來會歳元載推一作惟寵賚之私冝極珎豐之品俾頒嘉味式侑宴歡瓊林苑交年禱祭太歳諸神祝文天行有度運三綂以環周歳徳所臨從百神而拱列載㳙榖旦薦此令芳惟隂鑒之享誠委時祥而昭佑班荆館賜契丹賀正旦人使到闕御筵口宣十二月十四日卿等曆紀歳元聘交隣好載馳使傳方及國門冝頒宴犒一作推寵錫之恩式示眷懷之厚賜夏國主進奉賀正馬駞詔詔夏國主省所差人進奉賀正馬駞共一百頭疋事具悉履端紀歳萬邦咸禀於王正効貢以時奕世克修於藩職載閱充庭之實深惟守土之勤遐體傾輸不忘歎獎今回賜銀絹茶等具如别録至可領也其差來人所賜物色亦具賜目故茲詔示想冝知悉春寒比平安好否書指不多及賜夏國主贖大藏經詔十二月日詔夏國主省所奏伏爲新建精藍載請贖大藏經帙籖牌等其常例馬七十疋充印造工直俟來年冬賀嘉祐四年正旦使次附進至時乞給賜藏經事具悉封奏聿來祕文爲請惟覺雄之演說推善利於無窮嘉乃純誠果於篤信所冝開允當體眷懷所載請贖大藏經帙籖牌等, WYG: ''}
