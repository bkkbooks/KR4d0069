  - {type: variant, offset: 1449, length: 46825, content: 令印造候嘉祐四年正旦進奉人到闕至時給付故茲詔示想冝知悉春寒比平安好否書指不多及賜新除觀文殿學士禮部侍郎孫沔詔嘉祐三年正月十七日勑孫沔省所上表伏蒙聖慈差使臣賫到誥勑各一道授臣觀文殿學士禮部侍郎并賜對衣金帶鞍轡馬錢五百貫文不敢恭受伏乞特改差臣知一小郡或依例除一官致仕陳乞事具悉卿蔚有敏材膺予簡任外分邊寄嘗著於恩威入贊國機早參於帷幄風猷甚美寵遇旣優適當擇帥之𥘉方鑒用謀之失是惟慎舉實允僉諧豈冝圖自便之私而罔體眷懷之意顧茲重地難久曠官往祗成命之行當略好謙之節所讓冝不允依前降指揮疾速發赴本任故茲詔示想冝知悉集禧觀奉神殿開啓謝雪道埸青詞近以温陽干時雨雪愆候載惟寡薄敢罄精純明靈孔昭嘉應斯獲兆豐年而有望消癘氣於未形惟物蒙休以時申報冀清真之來格期福貺之永依自京至雄州巳來撫問契丹告哀人使口宣正月十九日卿祗戒軺軒載馳隣訃顧道塗之甚邈惟渉履之斯勤俾宣恩言式慰良苦賜契丹國告哀人使茶藥口宣正月十九日卿式將隣聘來告國哀屬春候之尚寒顧驛塗之攸邈俾頒品劑用示眷懷沿路賜契丹國告哀人使赴闕茶藥口宣正月十九日勑蕭福延卿夙駕使輶遽傳國䘏屬餘寒之在候想馳驛之為勞俾頒飲劑之良用示眷懷之厚景靈宫雅飾元天大聖后聖容并侍從等開啓預告道埸青詞正月二十日伏以珍宇邃嚴奉真靈而有素玉容清穆謹修祓以惟時爰按仙科俾伸䖍告載瞻道䕃冝鑒沖試皇帝回契丹皇帝告哀書二月日伯大宋皇帝致書于姪大契丹聖文神武睿孝皇帝闕下承遣使車特貽緘翰不意凶變太皇太后上僊載惟契好久睦仁鄰聞此訃音但増感愴姪皇帝負荷至重追慕所深冀節哀情用遵禮制已差人使專持慰禮今林牙懷徳軍節度使蕭福延回奉書陳謝不宣白雄州撫問契丹賀乾元節人使口宣二月二十四日卿等夙持信聘來講隣歡及疆候以惟𥘉屬暄和之方盛冝加撫慰式示眷懷賜給事中叅知政事曽公亮生日詔二月二十五日卿蔚有時望叅于柄臣惟倚注之所深在眷顧之尤異屬茲誕日冝爾壽期膺此寵頒體予至意賜翰林學士兼侍讀學士尚書戸部郎中知制誥知審刑院胡宿詔三月三日勑胡宿省所奏據大理寺日奏司申二月二十一日巳前下寺公案並巳斷奏了畢無見在事具悉朕欲斯民足衣食知禮讓而竊攘爭鬭之獄猶滋欲吾吏慎刑罰盡情偽而傅予輕重之文不一卿以儒學之職總評讞之繁克勤其官曽不留事實副予意惟時可嘉若乃使天下囹圄空虚而風流篤厚是亦論思獻納者之志其勉助我以共臻焉仍依奏宣付史館故茲獎諭想冝知悉賜判大理寺陳太素并權少卿楊開及審刑院詳議官大理寺詳斷官等勑書三月三日勑陳太素省知審刑院胡宿奏據大理寺日奏司申二月二十一日巳前下寺公案並已斷奏了畢無見在事刑獄之重一成而不遷比類之微可疑者甚衆汝好學而敏涖官以勤夫俾天下之無冤幾刑錯而不用此朕翼翼希慕之所未及而爾孜孜厥職之所不忘者也故茲獎諭想冝知悉恩州賜契丹遺留使副茶藥口宣三月二十八日卿等夙馳使傳來逹信函載惟渉履之勤當此暄和之候冝加頒賚式示眷懷瀛州賜契丹賀乾元節人使却回御筵口宣四月七日卿等旣成聘好方即歸塗再惟將命之勞冝有犒勤之錫俾伸宴飫用示眷私班荆館賜契丹賀乾元節人使却回酒果口宣四月七日卿等使軺復命郊館餞行惟茲良潔之英薦以甘馨之實用伸恩錫當體眷懷十六日就驛賜契丹賀乾元節人使内中酒果口宣四月十七日卿等夙奉信函方休賔館惟此醇甘之品用推寵賚之恩聊侑宴歡以伸優遇賜知舒州齊廓進新茶并知廣徳軍浦延熈進先春茶勑書勑齊廓省所進奉新茶一銀合合重五十兩緋羅夾複全事具悉百物茂生取新為貴羣方修職効貢以時汝守土有方事上惟恪閱茲來獻用體勤誠故茲示諭想冝知悉賜外任臣寮進奉乾元節銀絹馬勑書勑髙易簡省所進奉乾元節絹五百疋事具悉汝夙以敏材膺于柬寄及此奉觴之節載陳任土之儀能因物以逹誠見事君之甚恪省閱于再歎嘉不忘故茲示諭想冝知悉班荆館賜契丹告哀人使内中酒果口宣卿夙將隣訃方屇國門載惟衝渉之勤冝有宴休之錫俾伸頒賚用示眷優一作懷開寳寺福勝院開啓道埸於乾元節日支散袈裟并設大㑹齋一中齋文伏以正陽旅月方及於嘉時萬壽齊天式標於令節啓真乘之祕藏集淨侣於法筵仰惟慈妙之仁茂委純厖之祉永隆丕筭均福羣倫東太一宫開啓保夏祝聖壽金籙道埸宻詞四月二十四日伏以寂然妙道推善應以無方瞻彼髙靈薦精誠而必逹屇此長嬴之候是惟茂育之時爰稽玉笈之真文載潔雲壇之淨醮冀敷昭鑒來集純禧固壽曆之延昌溥蒼黔而均祐賜彰信軍節度使檢校太保同中書門下平章事判大名府李昭亮乞知西京不允詔勑昭亮省所上表乞移判河南府事具悉朕惟魏洛之重皆為别都將率所居難於屢易卿以中外勤勞之績有撫綏扞禦之材自膺寄任之雄方厚倚毗之意遽茲列奏嘉乃好謙冝體眷懷靖安爾位所乞冝不允故茲詔示想冝知悉夏熱卿比平安好遣書指不多及賜宣徽南院使淮康軍節度使張堯佐乞知西京不允詔五月二日勑堯佐省所奏臣皇祐三年内授宣徽南院使判河陽軍州事未滿任蒙詔赴闕供職至今六載自量尸素深不遑寧近知西京闕人未有除授伏望特賜差委事具悉宣導徽猷任親而事簡居留京邑地要而務繁惟予眷遇之臣方處清閑之職載披來牘深識乃誠雖奮其聦明尚足以臨涖而待我耆艾冝有以優游實嘉盡瘁之心難徇撝謙之意所乞冝不允故茲詔示想冝知悉賜宰臣文彦博上第一表乞解重任不允批答五月十八日省表具之夫知其人之為賢任則勿貳事其君而有道去不可輕此古之臣主之明舉措必慎所以收功於一時而垂法於後世也卿夙有時望為予柄臣自復秉於國鈞僅三周於歳序若乃進退賢否誅賞罪功毎於聽納之間敢忘虚已顧彼搢紳之論曽靡異辭方期有成以副予意而乃過形謙損思避台衡豈寡徳弗明於用才而不盡將多言害正致厥位之難安苟異於斯夫何引讓矧卿忠信之節足以叶予之一心材謀之優可以斷予之大事茲所柬注寧煩諭言所請冝不允就驛賜契丹遺留使副銀䤬鑼唾盂盂子錦𬒳褥口宣五月十八日卿等馳軺來止將命有儀顧茲館憩之𥘉冝具燕私之用俾伸優錫式示眷懷通商茶法詔嘉祐四年二月四日勑古者山澤之利與民共之故民足於下而君𥙿於上國家無事刑罰以清自唐末流始有茶禁上下規利垂二百年如聞比來為患益甚民𬒳誅求之困日惟咨嗟官受濫惡之入歳以陳積私藏盗販犯者實一作寔繁嚴刑重誅情所不忍使田閭不安其業商賈不通于行嗚呼若茲是於江湖之間幅貟數千里為䧟穽以害吾民也朕心惻然念此久矣間遣使者往就問之而皆歡然願弛搉法歳入之課以時上官一二近臣件㭊其狀朕嘉覽于再猶若慊然又於歳輸裁减其數使得饒阜以相為生剗去禁條俾通商賈歷世之弊一旦以除著為經常弗復更制損上益下以休吾民尚慮喜於立異之人縁而為姦之黨妄陳奏議以惑官司必寘明刑用戒狂謬布告遐邇體朕意焉内制集卷第五賜夏國贖藏經詔大藏經帙帙字上一有及經二字通商茶法詔重誅一作峻誅外集卷第五歐陽文忠公集五十五律詩一漢宫桂館神君去甘泉輦道平翠華飛蓋下豹尾属車迎曉露寒浮掌光風細轉旌廊回偏費步珮遠尚聞聲玉樹人間老珊瑚海底生金波夜夜意偏照影娥清送劉半千平陽簿假道歸故里嶺梅歸驛路迢迢越鳥巢傾木半喬松徑就荒聊應召挂叢留隱定相招家庭噪鵲爭喧樹夜帳驚猿自擁條何䖏秋風催客鬢青絲恐逐物華凋一作銷樓頭百尺樓頭萬疊山楚江南望隔晴煙雲蔵白道天垂幕簾捲黄昏月上弦桑落蒲城催熟酒栁衰章陌感凋年髮光如葆寧禁恨不待為郎已䬃然夕照夕照留歌扇餘輝上桂叢霞光晴散錦雨氣晚成虹燕下飜池草烏驚傍井桐無憀照湘水丹色映秋風送張學士知郢州漢郎清曉赤墀趨楚老西来望隼旟侍史護衣薫蕙草轆轤要劒從驪駒陽春繞雪歌低扇油幕連雲水泛渠千里脩門對涔浦好尋遺玦弔三閭曉詠簾外星辰逐斗移紫河聲轉下雲西九雛烏起城将曙百尺樓髙月易低露裛蘭苕惟有淚秋荒桃李不成蹊西堂吟思無人助草滿池塘夢自迷禁火火禁開何晚春芳半已凋栁風兼絮墜榆雨帶錢飄涙翦蘭膏盡弦虧桂魄消祓蘭流水曲㳺禊一相招送趙山人歸舊山屈賈江山思不休霜飛翠葆忽驚秋吟拋楚畹蘭苕老歸有淮山桂樹留聒耳春池蛙兩部比封秋塢橘千頭嗔條怒穎真堪愧莫染衣塵更逺逰閑居即事巷有容車陋門無載酒過池喧蛙怒雨客去雀驚羅握臂如枝骨哀絃繫一作擊筯歌無憀漳浦卧還似詠中阿傷春蕙蘭蹊徑失芳期風雨春深怯減衣卷箔髙樓驚燕入揮絃逺目送鴻歸蜂催釀蜜愁花盡絮撲暄條妬雪飛欲識傷春多少恨試量衣帶忖要圍公子黄山開苑獵𥘉回絳樹分行舞逓来下馬春埸雞鬪距鳴弦初日雉驚媒犀投博齒呼成白橋隔車音聽似雷不問春蠶眠未起更尋桑陌到秦臺夜意蕙炷爐薫㫁蘭膏燭艶煎夜風多起籟曉月漸虧弦鵲去星低漢烏啼樹暝煙惟應墻外栁三起復三眠寄張至祕校關山一里一重愁念逺傷離兩未休南陌望窮雲似帳西樓吟㫁月如鈎栁綿飛後一作處春應減蘭徑荒時客倦㳺擬寄東流問溝水亦應溝水更東流寄徐巽秀才瑶花飛雪蕩離愁鷤鴂驚風下緑疇睢苑樹荒誰共客楚江楓老獨悲秋千重錦浪飜如箭萬疊春山翠入樓章陌栁條今在否定臨溝水拂東流寄劉昉秀才絲路縈回細入雲離懷南陌草初薫茂林脩竹誰同禊明月春蘿定勒文燕憶銅鞮来不定鴻歸碣石信難分東風鸎友應相望懊惱孤飛不及羣送客回馬上作南浦空波緑西陂夕照寒瑶華傷逺道芳草送歸鞍翠歛遥山疊氛收古澤寛衰容畏秋色不及楚楓丹西征道中送陳舅秀才北歸棊墅風流謝舅賢髪光如葆惜窮年人隨黄鵠飛千里酒滿樓烏送一絃望驛早梅迎逺使拂鞍衰栁拗歸鞭越禽胡馬相逢地南北思歸各黯然送目送目衡一作蘅臯望不休江蘋髙下遍汀洲長堤栁曲妨回首小苑花深礙倚樓楚徑蕙風消病渇洛城花雪蕩春愁流杯三日佳期過擲度蘭波負勝逰春曉小閤回殘夢開簾轉曉暉露寒風不定花落鳥驚飛病渇偏思柘一作蔗楚詞漢志作柘晉書杜詩作蔗朝寒怯減衣沈錢将謝雪持底送春歸劉秀才宅對弈昉烏巷招邀謝墅中紫囊香珮更臨風塵驚野一作烽火遥知獵目送雲羅但聽鴻六着比犀鳴博勝百嬌柘矢捧壷空解衣對子歡何極玉井移隂下翠桐送李寔㡬幅歸㠶不暫停呉天遥望斗牛横香薫翠𬒳乗青翰波暖屏風詠紫莖江水自隨潮上下月輪閑與蚌虧盈河橋折柳傷離後更作南雲萬里行早夏鄭工部園池夜雨殘芳盡朝暉宿霧收蘭香纔馥徑栁暗欲翻溝夏木繁堪結春蹊一作畦翠巳稠披襟楚風快伏檻更臨流舟中寄劉昉秀才東南天闊漾歸流西北雲髙㫁寸眸明月隨人来遠浦青山荅鼓送行舟歸心逐夢成魚鳥夜漢看星識斗牛釅一作騃酒開樽誰共醉清江聊且玩㳺鯈一作鯈㳺月夕月氣初升海屏光半隱扉寒消覺春盡漏永送籌稀蘭燭風