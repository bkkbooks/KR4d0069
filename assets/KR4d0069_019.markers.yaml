  - {type: variant, offset: 0, length: 197, content: 外集卷第十九歐陽文忠公集六十九書四答宋咸書至和三年某啓去年冬承惠問時以奉使契丹不皇爲答兹者人至辱書豈勝感愧某區區于比無𥙷當時徒於京師大衆中汩汩人事舊學都廢耳不聞仁義之言久矣惟君子不以甘榮祿走聲利之徒見待時有所教幸甚幸甚天日之髙以其下臨於人者不逺而自古至今積千萬人之智測驗之得其如此故時亦有差者由不得其真也聖人之言在人情不逺然自戰國及今述者多矣所以吾儕猶不能黙者以前人未得其真也然亦當積千萬人之見, WYG: ''}
