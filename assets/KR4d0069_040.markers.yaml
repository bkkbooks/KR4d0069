  - {type: variant, offset: 80, length: 4368, content: 載唐㑹昌中刺史李濆爲荇谿記云水出永陽嶺西經皇一作黄道山下以地求之今無所謂荇谿者詢於滁州人曰此谿是也楊行密有一作據淮南淮人爲諱其嫌名以荇爲菱理或然也谿傍若有遺址云故將劉金之宅石即劉氏之物也金僞一作爲呉時貴將與行密俱起合淝號三十六英雄金其一也金本武夫悍一作驍卒而乃能知愛賞竒異爲兒女子之一作所好豈非遭逢亂世功成志得驕於冨貴之佚欲而然邪想其陂池臺榭竒木異草與此石稱亦一時之盛哉今劉氏之後散爲編民一作氓尚有居谿旁者予感夫人物之廢興一無此字惜其可愛而一有反字棄也乃以三牛曵置幽谷又索其小者得於白塔民朱氏遂立于亭之南北亭負城而近以爲滁人歳時嬉遊之好夫物之竒者弃没於幽逺則可惜置之耳目則愛者不免取之而去嗟夫劉金者雖不足道然亦可謂雄勇一作勇悍之士其平生志意豈不偉哉及其後世荒堙零落至於子孫泯没而無聞況欲長有此石乎用此一無此二字可爲冨貴者之戒而好竒之士聞此石者一作聞石而來可以一賞而足何必取而去也哉海陵許氏南園一作園亭記髙陽許君子春治其海陵郊居之南爲小園作某亭某堂于其間許君爲江浙荆淮制置發運使其所領六路七十六州之廣凡賦斂之多少山川之逺近舟楫之徃來均節轉徙視江湖數千里之外如運諸其一無此字掌能使人樂爲而事集當國家用兵之後修前人乆廢之職𥙷京師匱乏之供爲之六年厥績大著自國子博士遷主客貟外郎由判官爲副使夫理繁而得其要則簡簡則易行而不違惟簡與易然後其力不勞而有餘夫以制置七十六州之有餘治數畝之地爲園誠不足施其智而於君之事亦不足書君之羙衆矣予特書其一節可以示海陵之人者君本歙人世自孝德其先君司封喪其父母事其兄如父戒其妻事其嫂如姑衣雖弊兄未易衣不敢易食雖具兄未食不敢先食司封之亡一子當得官其兄弟相讓乆之諸兄卒以讓君君今遂顯于朝以大其門君撫兄弟諸子猶已子歳當上計京師而弟之子病君留不忍去其子亦不忍捨君而留遂以俱行君素清貧罄其家貲走四方以求醫而藥必親調食飲必親視至其矢溲亦親候其時節顔色所下一作疾如可理則喜或變動逆節則憂戚之色不自勝其子卒君哭泣悲哀行路之人皆嗟歎嗚呼予見許氏孝悌一有耆字著于三一作四世矣凡海陵之人過其園者望其竹樹登一作覩其臺榭思其宗族少長相從愉愉而樂於此也愛其人化其善自一家而形一郷由一郷而推之無逺邇一作近使許氏之子孫世乆而一無此字愈篤則一作焉不獨化及其人將見其園間之草木有駢枝而連理也禽鳴之翔集于其間者不爭巢而棲不擇子而哺也嗚呼事患不爲與夫怠而止爾惟力行而不怠以止然後知予言之可信也慶曆八年十二月二十七日廬陵歐陽脩記眞州東園記眞爲州當東南之水㑹故爲江淮兩浙荆湖發運使之治所龍圖閣直學士施君正臣侍御史許君子春之爲使也得監察御史裏行馬君仲塗爲其判官三人者樂其相得之懽而因其暇日得州之監軍廢營以作東園而日徃遊焉歳秋八月子春以其職事走京師圖其所謂東園者來以示予曰園之廣百畝而流水横其前清池浸其右髙臺起其一作超而北臺吾望以拂雲之亭池吾俯以澄虚之閣水吾泛以畫舫之舟敞其中以爲清讌之堂闢其後以爲射賔之圃芙渠芰荷之的歷幽蘭白芷之芬芳與夫佳花美木列植而交隂此前日之蒼煙白露而荆棘也髙甍巨桷水光日景動揺而下上一作上下其寛閑深靚可以答逺響而生清風此前日之頽垣斷塹而荒墟一作塸也嘉時令節州人士女嘯歌而管絃此前日之晦㝠風雨鼪鼯鳥獸之嘷音也吾於是信有力焉凡圖之所載蓋其一二之略也若廼升于髙以望江山之逺近嬉于水而逐魚鳥之浮沈其物象意趣登臨之樂覽者各自得焉凡工之所不能畫者吾亦不能言也其爲我書其大槩焉又曰眞天下之衝也四方之賔客徃來者吾與之共樂于此豈獨私吾三人者哉然而一作其池臺日益以新草樹日益以茂四方之士無日而不來而吾三人者有時而皆去也豈不眷眷於是哉不爲之記則後孰知其自吾三人者始也予以謂三君子之材賢足以相濟而又恊于其職知所後先使上下給足而東南六路之人無辛苦愁怨之聲然後休其餘閑又與四方之賢士大夫共樂于此是皆可嘉也乃爲之書廬陵歐陽脩記浮槎山水記浮槎山在慎縣南三十五里或曰浮闍山一無此五字或曰浮巢二一無此字山其事出於浮圖老子之徒荒怪誕幻之說其上有泉自前世論水者皆弗道余甞讀茶經愛陸羽善言水後得張又新水記載劉伯芻李季卿所列水次第以爲得之於羽然以茶經考之皆不合又新妄狂險譎之士其言難信頗疑非羽之說及得浮槎山水然後益以羽爲知水者浮槎與龍池山皆在廬州界中較其水味不及浮槎逺甚而又新所記以龍池爲第十浮槎之水弃而不録以此知其所失多矣羽則不然其論曰山水上江次之井爲下山水乳泉石池漫流者上其言雖簡而於論水盡矣浮槎之水發自李侯嘉祐二年李侯以鎭東軍一無此字留後出守廬州因遊金陵登蔣山飲其水旣又登浮槎至其山上有石池㳙㳙可愛蓋羽所謂乳泉漫流者也飲之而甘乃考圖記問於故老得其事迹因以其水遺余於京師予報之曰李侯可謂賢矣夫窮天下之物無不得其欲者冨貴者之樂也至於䕃長松藉豐草聽山溜之潺湲飲石泉之滴瀝此山林者之樂也而山林之士視天下之樂不一動其心或有欲於心顧力不可得而止者乃能退而獲樂於斯彼富貴者之能致物矣而其不可兼者惟山林之樂爾惟冨貴者而不得兼然後貧賤之士有以自足而髙世其不能兩得亦其理與勢之然歟今李侯生長冨貴猒於耳目又知山林之爲樂至於攀縁上下幽隱窮絶人所不及者皆能得之其兼取於物者可謂多矣李侯折節好學喜交賢士敏於爲政所至有能名凡物不能自見而待人以彰者有矣其物未必可貴而因人以重者亦有矣故予爲志其事俾世知斯一作竒泉發自李侯始也三年二月二十有四日廬陵歐陽脩記有美堂記嘉祐二年龍圖閣直學士尚書吏部郎中梅公出守于杭於其行也天子寵之以詩於是始作有美之堂蓋取賜詩之首章而名之以爲杭人之榮然公之甚愛斯堂也雖去而不忘今年自金陵遣人走京師命予誌之其請至六七而不倦予乃爲之言曰夫舉天下之至美與其樂有不得而兼焉者多矣故窮山水登臨之美者必之乎寛閑之野寂寞之郷而後得焉覽人物之盛麗夸都邑之雄冨者必據乎四逹之衝舟車之㑹而後足焉蓋後放心於物外而此娱意於繁華二者各有適焉然其爲樂不得而兼也今夫所謂羅浮天台衡嶽廬阜洞庭之廣三峽之險號爲東南竒偉秀絶者乃皆在乎丁州小邑僻陋之邦此幽潛之士窮愁放逐之臣之所樂也若乃四方之所聚百貨之所交物盛人衆爲一都㑹而又能兼有山水之美以資冨貴之娱者惟金陵錢塘然二邦皆僭竊於亂世及聖宋受命海内爲一金陵以後服見誅今其江山雖在而頽垣廢址荒煙野草過而覽者莫不爲之躊躇而悽愴獨錢塘自五代時知尊中國効臣順及其亡也頓首請命不煩干戈今其民幸冨完安樂又其俗習一作習俗工巧邑屋華麗蓋十餘萬家環以湖山左右映帶而閩商海賈風㠶浪舶出入於江濤浩渺煙雲杳靄之間可謂盛矣而臨是邦者必皆朝廷公卿大臣若天子之侍從又有四方遊士爲之賔客故喜占形勝治亭一作臺榭相與極遊覽之娱然其於所取有得於此者必有遺於彼獨所謂有美堂者山水登臨之美人物邑居之繁一寓目而盡得之蓋錢塘兼有天下之美而斯堂者又盡得錢塘之美焉冝乎公之甚愛而難忘也梅公清愼好學君子也視其所好可以知其人焉四年八月丁亥廬陵歐陽脩記相州晝錦堂記仕宦而至將相冨貴而歸故郷此人情之所榮而今昔之所同也蓋士方窮時困阨閭里庸人孺子皆得易而侮之若季子不禮於其嫂買臣見棄於其妻一旦髙車駟馬旗旄導前而騎卒擁後夾道之人相與駢肩累迹瞻望咨嗟而所謂庸夫愚婦者奔走駭汗羞愧俯伏以自悔罪於車塵馬足之間一有而莫敢仰視五字此一介之士得志一有於字當時而意氣之盛昔人比之衣錦之榮者也惟大丞相衛國公則不然公相人也世有令德爲時名卿自公少時已擢髙科登顯仕海内之士聞下風而望餘光者蓋亦有年矣所謂將相而富貴皆公所冝素有非如窮阨之人僥倖得志於一時出於庸夫愚婦之不意以驚駭而夸耀之也然則髙牙大纛一作斾不足爲公榮桓圭衮冕不足爲公貴惟德被生民而功施社禝勒之金石播之聲詩以耀後世而垂無窮此公之志而士亦以此望於公也豈止夸一時而榮一郷哉公在至和中甞以武康之節來治於相乃作晝錦之堂于後圃旣又刻詩於石以遺相人其言以快恩讎矜名譽爲可薄蓋不以昔人所夸者爲榮而以爲戒於此見公之視冨貴爲如何而其志豈易量哉故能出入將相勤勞王家而夷險一節至於臨大事決大議垂紳正笏不動聲氣一作色而措天下於泰山之安可謂社稷之臣矣其豐功盛烈所以銘彞鼎而被弦歌者乃邦家之光非閭里之榮也余雖不獲登公之堂幸甞竊誦公之詩樂公之志有成而喜爲天下道也於是乎書尚書吏部侍郎叅知政事歐陽脩記仁宗御飛白記治平四年夏五月余將赴亳假道于汝隂因得閱書於子履之室而雲章爛然輝眏日月爲之正冠肅容再拜而後敢仰視蓋仁宗皇帝之御飛白一作帛也曰此寳文閣之所藏也胡爲於子之室乎子履曰曩者天子宴從臣於羣玉而賜以飛白余幸得與賜焉予窮於世乆矣少不恱於時人流離竄斥十有餘年而得不老死江湖之上者蓋以遭時清明天子嚮學樂育天下之材而不遺一介之賤一作善使得與羣賢並遊於儒學之館而天下無事歳時豐登民物安樂天子優游清閑不邇聲色方與羣臣從容於翰墨之娱而余於斯時竊獲此賜非惟一介之臣之榮遇亦朝廷一時之盛事也子其爲我志之余曰仁宗之德澤涵濡於萬物者四十餘年雖田夫野老之無知猶能悲歌思慕於壠畝之間而況儒臣學士得望清光䝉恩寵登金門而上玉堂者乎於是相與泫然流涕而書之夫玉韞石而珠藏淵其光氣常見於外也故山輝如白虹水變而五色者至寳之所在也今賜書之藏于子室也吾知將有望氣者言榮光起而屬天者必賜書之所在也一有觀文殿學士刑部尚書歐陽脩謹記峴山亭記一本題上有史光禄修峴山臨漢上望之隱然蓋諸山之小者而其名特著於荆州者豈非以其人哉其人謂誰羊祜叔子杜預元凱是已方晉與呉以兵爭常倚荆州以爲重而二子相繼於此遂以平呉而成晉業其功烈巳蓋於當世矣至於風流餘韻藹然𬒳於江漢之間者至今人猶思之而於思叔子也一作而於叔子思之尤深蓋元凱以其功一作力而叔子以其仁二子所爲雖不同然一作謂皆足以垂於不朽余一作而頗疑其反自汲汲於後世之名者何哉傳言叔子甞登兹山慨然語其屬以謂此山常在而前世之士皆巳湮滅於無聞因自顧而悲傷然獨不知兹山待已而名著也元凱銘功於一石一置兹山之上一投漢水之淵是知陵谷有變而不知石有時而磨㓕也豈皆自喜其名之甚而過爲無窮之慮歟將自待者厚而所思者逺歟山故有亭世傳以爲叔子之所遊止也故其屢廢而復興者由後世慕其名而思其人者多也熈寜元年余友人史君中煇以光禄卿來守襄陽明年因亭之舊廣而新之旣一無此字周以回廊之壯又大其後軒使與亭相稱君知名當世所至有聲襄人安其政而樂從其遊也因以君之官名其後軒爲一作曰光禄堂又欲紀其事于石以與叔子元凱之名並傳于乆逺君皆不能止也乃來以記屬於余余謂君知慕叔子之風而襲其遺迹則其爲人與其志之所存者可知矣襄人愛君而安樂之如此則君之爲政於襄者又可知矣此襄人之所欲書也若其左右山川之勝勢與夫草木雲煙之杳靄出没於空曠有無之間而可以備詩人之登髙寫離騷之極目者冝其覽者自得之至於亭屢廢興或自有記或不必究其詳者一有則字皆不復道一有也字熈寜三年十月二十有二日六一居士歐陽脩記居士集卷第四十熈寜五年秋七月男發等編定紹熈二年三月郡人孫謙益校正菱谿石記滁州人一無州字即劉一作乃劉東園記監軍石夲作鹽軍芙渠一作芙蕖塹石本作壍浮槎山水記浮闍山石本無山字問於石本無於字而不得兼而一作之有美堂記又有一作必有御飛白記江湖之上四字上一有於字, WYG: ''}
