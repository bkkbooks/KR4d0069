  - {type: variant, offset: 0, length: 94, content: 居士集卷第四十歐陽文忠公集四十記八首菱谿石記菱谿之石有六其四爲人取去其一差小而尤竒亦藏民家其最大者偃然僵卧於谿側以其難徙故得獨存每歳寒霜落水涸而石出谿傍人見其可怪徃徃祀以爲神菱谿按圖與經皆, WYG: ''}
